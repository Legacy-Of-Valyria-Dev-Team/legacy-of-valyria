l_english:
  lv_begin_expedition_cost:0 "This will cost #V @gold_icon![target.MakeScope.ScriptValue('lv_expedition_cost')|0]#! just to initially establish the settlement. Expect significantly higher costs the further away this is from our current holdings and colonies."

  lv_begin_expedition_desc_lands_of_the_long_summer_wilderness:0 "#BOL Lands of the Long Summer#!\n\nThese lands are part of the Lands of the Long Summer directly north of Valyria. Though they did not face the full cataclysmic wrath that befell Valyria, the Doom did not spare these lands either. Just as cursed a place as the heart of Valyria itself, those who once crossed these lands have long since perished or suffered fates worse than death.\n\nStill, we have the resources and manpower to begin planning an expedition to settle it should we dare to try."
  lv_begin_expedition_desc_valyria_ruin:0 "#BOL Ruins of Valyria#!\n\nWithin these ruins once lived the dragonlords of Valyria, along with their great treasures and sorcerous arts. Some say that the Doom of Valyria was the doing of the gods due to the Valyrians' sins in the dark arts, while some speculate that the Valyrians their control over the Fourteen Flames. Regardless, the Doom shattered the land, and these once great cities now lie in ruins — cursed and haunted forevermore.\n\nTo this day it remains ashen and smoldering, its topless towers broken and sundered. Those who once crossed these lands have long since perished or suffered fates worse than death.\n\nStill, we have the resources and manpower to begin planning an expedition to restore it should we dare to try."
  lv_begin_expedition_desc_valyria_wilderness:0 "#BOL Valyria#!\n\nThese lands are part of the ruins of Valyria itself, where the Doom struck with full force. Once the heartland of the most powerful empire in recent history, it now remains nothing more than a cursed land harboring the horrors of the Doom.\n\nTo this day it remains ashen and smoldering, its very ground still scarred by the cataclysmic events that destroyed the Freehold. Those who once crossed these lands have long since perished or suffered fates worse than death.\n\nStill, we have the resources and manpower to begin planning an expedition to settle it should we dare to try."
  lv_begin_expedition_desc_sothoryos_yeen:0 "#BOL Yeen#!\n\n#F "A city so evil that even the jungle will not enter"\n—alleged words of Princess Nymeria upon laying eyes on Yeen#!\n\nThis is the ruined city of Yeen, one of the greatest mysteries of Sothoryos. Situated along the Zamoyos river deep in the jungles of Sothoryos, it is built entirely of oily black stone and has remained a desolate ruin for thousands of years. Despite this, even the jungle surrounding it has scarce touched it.\n\nIt is said that every attempt to rebuild or resettle it has ended in horror. Still, we have the resources and manpower to begin planning an expedition to restore it."
  lv_begin_expedition_desc_sothoryos_zamettar:0 "#BOL Zamettar#!\n\nAt the mouth of the Zamoyos river lies the ruined settlement of Zamettar. Once a walled city raised by the Old Empire of Ghis, it had since been captured by the dragonlords of the Valyrian Freehold before being abandoned to the jungle.\n\nA thousand years after during the flight of the Rhoynar, Princess Nymeria and her people were said to have settled Zamettar until eventually abandoning it once more after they found the ancient city of Yeen upstream suddenly vacant.\n\nOnly ruined walls and the creeping jungle remain now, but we have the resources and manpower to begin planning an expedition to restore it."
  lv_begin_expedition_desc_sothoryos_gorosh:0 "#BOL Gorosh#!\n\nThe ruined outpost of Gorosh was a penal colony of the Old Empire of Ghis, located along the eastern coast of Sothoryos on Wyvern Point. It was said that the colonies planted in Sothoryos were doomed to fail, and Gorosh was no exception. The ruined outpost has long since been reclaimed by the jungle not even a generation after its founding, having spent more time abandoned than inhabited.\n\nStill, we have the resources and manpower to begin planning an expedition to restore it."
  lv_begin_expedition_desc_sothoryos_wilderness:0 "#BOL Sothoryos#!\n\nThis area is part of the wilds of Sothoryos itself, one of the three known continents of the known world. The jungles of Sothoryos are among the most dangerous places in the known world, harboring diseases and creatures found nowhere else.\n\nStill, we have the resources and manpower to begin planning an expedition to settle it should we dare to try."
  lv_begin_expedition_desc_ruin:0 "This settlement lies in ruins, but we have the resources and manpower to begin planning an expedition to restore it."
  lv_begin_expedition_desc_wilderness:0 "This area is wild and untamed, but we have the resources and manpower to begin planning an expedition to settle it."
  lv_begin_expedition_desc_fallback:0 "We have the resources and manpower to begin planning an expedition to reclaim this settlement."

  HAS_SETTLEMENT_BLOCKERS:0 "There must be settlement blockers present in the colony."
  HAS_NO_SETTLEMENT_BLOCKERS:0 "There must be no settlement blockers present in the colony."
  
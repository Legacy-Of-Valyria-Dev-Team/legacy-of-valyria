l_english:
  # Decision group
  decision_group_type_valyria:0 "Valyrian Decisions"

  lv_restore_valyrian_freehold_decision:0 "Restore the Valyrian Freehold"
  lv_restore_valyrian_freehold_decision_desc:0 "At its peak, the Valyrian Freehold stood unopposed as the greatest and dominant civilization of its time, best known for its ability to command countless dragons in its name during times of war. So great was this military and cultural power that only the cataclysm of the Doom was enough to end its five-thousand-year rule over Essos. All that remained of this great civilization were the smoldering spires of the great dragonlords and haunted, ash-covered lands partially devoured by the Smoking Sea.\n\nIf the heartland of Valyria could be reclaimed, along with a good amount of its former territories, no one can dispute my claim and authority as being the true and rightful ruler of the Valyrian Freehold."
  lv_restore_valyrian_freehold_decision_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] will be restored."
  lv_restore_valyrian_freehold_decision_confirm:0 "Our time is now"
  lv_restore_valyrian_freehold_decision_effect_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] will be restored and acquire the [de_jure|E] of all currently held [empires|E] in Essos."

  lv_restore_valyrian_freehold_valyria_requirement_tooltip:0 "You must [completely_control|E] the Valyrian peninsula."
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip:0 "You must control at least three [empire|E]-tier territories that were former colonies of the Valyrian Freehold. Specifically:\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_daoryrdembos$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_narrow_sea$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_volantis$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_mantarys$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_ghiscar$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_rhoyne$"
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_daoryrdembos:0 "[GetTitleByKey('e_daoryrdembos').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('k_pentos').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('k_andalos').GetName] if it exists"
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_narrow_sea:0 "[GetTitleByKey('e_narrow_sea').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('k_tyrosh').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('k_lys').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('k_myr').GetName]"
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_volantis:0 "[GetTitleByKey('e_volantis').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('d_volantis').GetName]\n$EFFECT_LIST_BULLET$ If any of the Rhoynar ruins in Volantis are settled, you must control them as well"
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_mantarys:0 "[GetTitleByKey('e_old_valyria').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('k_mantarys').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('d_tolos').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('d_elyria').GetName]\n$EFFECT_LIST_BULLET$ If any of the ruins in [GetTitleByKey('k_draconys').GetNameNoTier] or [GetTitleByKey('d_velos').GetNameNoTier] are settled, you must control them as well"
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_ghiscar:0 "[GetTitleByKey('e_ghiscar').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('k_meereen').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('k_yunkai').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('k_astapor').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('d_new_ghis').GetName]\n$EFFECT_LIST_BULLET$ If the ruins of [GetTitleByKey('c_old_ghis').GetNameNoTier] are settled, you must control it as well"
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_rhoyne:0 "[GetTitleByKey('e_rhoyne').GetNameNoTier]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('d_ny_sar').GetName]\n$EFFECT_LIST_BULLET$ You must [completely_control|E] [GetTitleByKey('d_the_sorrows').GetName]\n$EFFECT_LIST_BULLET$ All remaining regions of the Rhoyne that are not ruined or uninhabited must be controlled by you"


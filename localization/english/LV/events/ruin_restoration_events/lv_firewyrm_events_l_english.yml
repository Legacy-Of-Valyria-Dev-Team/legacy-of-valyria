l_english:
  # Firewyrm Events
  lv_firewyrm_event.0001.t:0 "The Thing That Burns"
  lv_firewyrm_event.0001.desc:0 "The ruins groan under the weight of ages, yet it is not time nor tremor that shakes the ground beneath your feet. A shriek — no, a howl — cuts through the ash-choked air like a blade. And then it comes. Crawling out from a chasm of cracked stone and molten breath, the firewyrm descends upon the ruin like a demon from the old Valyrian scrolls.\n\nIt is no dragon. Its scales are jagged, blistered, and half-melted. Smoke hisses from vents along its serpentine spine, its breath a caustic blaze that blackens the very stones it treads. Its eyes — gods, its eyes — are molten, like open wounds, and it moves with a hunger that has nothing of instinct and everything of malice.\n\nEven the dragons feared firewyrms, they say. And what faces you now is no tame relic. It is a twisted remnant of Valyria's folly, a creature born not just of fire, but of madness.\n\nYou have only moments to choose — fight the beast, and perhaps become legend... or run, and hope the ruins are kind."
  lv_firewyrm_event.0001.dragon:0 "[dragon.GetName]! Aderī!"
  lv_firewyrm_event.0001.dragon.tt:0 "You quickly call your dragon and prepare to face the beast."
  lv_firewyrm_event.0001.a:0 "Steel and fire, then. May the gods bear witness."
  lv_firewyrm_event.0001.a.tt:0 "You stand your ground and attempt to slay the firewyrm."
  lv_firewyrm_event.0001.b:0 "This is not a foe meant for the living. We flee."

  # Firewyrm Duel Events
  lv_firewyrm_duel.0001.t:0 "Ash Meets Flame"
  lv_firewyrm_duel.0001.desc:0 "#medium The ground crackles beneath your mount's talons as your dragon lands, wings folding like thunderclouds across the shattered sky. Before you lies the firewyrm — not cowed, not curious, but hungry.\n\nIt writhes from the ruined shaft like a thing born of smoke and torment, its molten hide steaming with every movement. No wings. No grace. Just jagged fury and blistered scales, leaking smoke from vents and fissures along its spine. Where a dragon is fire made flesh, this creature is fire made wrong.\n\nYour dragon growls low, a sound that trembles the blackened stone. The wyrm answers — not with a roar, but with a screech that curdles the blood, defiant and mad. Here, in the smoking heart of Valyria, two monsters meet.\n\nYour hands tighten on the reins. One breath, one word, and the sky burns.#!"
  lv_firewyrm_duel.0001.a:0 "[dragon.GetName], dracarys!"
  lv_firewyrm_duel.0001.b:0 "Sōvēs, [dragon.GetName]!"

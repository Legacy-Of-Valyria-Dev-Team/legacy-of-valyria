l_english:
 # Mines Pulse
 lv_mines_pulse.0001.t:0 "Whispers Beneath [mines_province.GetNameNoTooltip]"
 lv_mines_pulse.0001.desc:0 "At night, the winds carry strange sounds from the old Valyrian mines: low rumbles, like stone grinding against stone, followed by a hiss that burns the ear. The locals claim it is just the air shifting through broken tunnels, but your scouts speak of worse.\n\nOne swore he saw molten claw-marks etched along a collapsed shaft. Another, pale with fear, swore he heard something breathing down in the dark. The miners refuse to return. Even beasts won’t stray near the mouth of the pit.\n\nSomething stirs beneath [mines_province.GetName]. And whatever it is, it remembers the taste of fire and flesh."
 lv_mines_pulse.0001.a:0 "We will remain vigilant... and pray the wyrms stay buried."
 lv_mines_pulse.0001.a.tt:0 "The sounds are hushed eventually, and the mines are left undisturbed for now."
 lv_mines_pulse.0001.a.tt.firewyrm:0 "Something emerges from the mines."

 # Noxious Gases Pulse
 lv_noxious_gases_pulse.0001.t:0 "When the Air Turns Heavy"
 lv_noxious_gases_pulse.0001.desc:0 "The winds have shifted. The drifting haze in [noxious_gases_province.GetName] has thickened into a pallid, choking fog that clings to every stone and leaf. Across the scarred lowlands, the air grows heavy with the acrid bite of sulfur and the slow-burning reek of ruin.\n\nAnimals flee the valleys. Men cough blood before collapsing to their knees. Even fire burns pale in the mist, as though afraid to breathe. Those who dwell near the volcanic veins say this always happens when the earth groans low: a foul season, when the land exhales poison instead of breath.\n\nSome whisper of illness spreading. Others speak of omens. But most simply wrap cloth around their mouths and hope to see another dawn."
 lv_noxious_gases_pulse.0001.a:0 "We can only endure and pray it passes swiftly."
 lv_noxious_gases_pulse.0001.a.tt.dispersal:0 "Dispersal"
 lv_noxious_gases_pulse.0001.a.tt.dispersal.outcome:0 "The fumes in [noxious_gases_province.GetName] disperse eventually."
 lv_noxious_gases_pulse.0001.a.tt.plague_outbreak:0 "Outbreak"
 lv_noxious_gases_pulse.0001.a.tt.plague_outbreak.outcome:0 "A disease outbreak occurs in [noxious_gases_province.GetName]."

 lv_noxious_gases_pulse.0002.t:0 "A Chance to Breathe"
 lv_noxious_gases_pulse.0002.desc:0 "For the first time in weeks, the wind shifts clean from the sea. The acrid fog thins, retreating from the lowlands like a sullen tide. Birds return to the trees. A child laughs without coughing. Fires burn true and bright once more.\n\nThe poison hasn’t vanished, only receded, like a beast slinking back into its den. Yet in this moment, there is clarity. The mountains still fume in the distance, but the skies above are clear enough to see stars.\n\nIs it healing? Far from it. Neither is it salvation. Still, it is a breath, however brief."
 lv_noxious_gases_pulse.0002.a:0 "We’ll take what mercy the land allows."
 lv_noxious_gases_pulse.0002.a.tt:0 "The toxic fumes in [noxious_gases_province.GetName] disperse, and the land breathes again."

 lv_noxious_gases_pulse.0002.t.normal_1:0 "The Winds Turn Kindly"
 lv_noxious_gases_pulse.0002.desc.normal_1:0 "A rare shift in the wind carries the choking fumes out to sea. Though the air still smells faintly of brimstone, and ash continues to fall like dust from a forgotten brazier, the suffocating haze has lifted.\n\nIn the skeletal remains of stone streets, voices carry further. Campfires burn without coughing fits. For the first time in weeks, the air does not feel like it’s trying to kill you."
 lv_noxious_gases_pulse.0002.a.normal_1:0 "We will take what mercy we can, even here."
 lv_noxious_gases_pulse.0002.a.tt.normal_1:0 "The air in [noxious_gases_province.GetName] turns a little more tolerable."

 lv_noxious_gases_pulse.0002.t.normal_2:0 "Clear Skies, For Now"
 lv_noxious_gases_pulse.0002.desc.normal_2:0 "The skies over [noxious_gases_province.GetName] remain grey. Not with cloud, but with ash suspended eternally in the air. Yet today, the low fumes have thinned, and one can walk the cracked avenues of the ruins without burning lungs or watering eyes.\n\nIt is not clean, not truly. However, it is survivable. And that alone is enough to stir some degree of optimism."
 lv_noxious_gases_pulse.0002.a.normal_2:0 "A bitter breath is better than none."
 lv_noxious_gases_pulse.0002.a.tt.normal_2:0 "Work continues as the settlers in [noxious_gases_province.GetName] can breathe a little better again."

 lv_noxious_gases_pulse.0002.t.normal_3:0 "A Moment to Breathe"
 lv_noxious_gases_pulse.0002.desc.normal_3:0 "The mists that once curled tight around every broken column and obsidian ridge have drawn back. Pale sunlight struggles through a ceiling of volcanic soot, casting wan light across blackened stone.\n\nPaths lost to fume and shadow now briefly stand revealed. The air is still warm, still acrid, but one can walk now without gagging, and that is enough to matter."
 lv_noxious_gases_pulse.0002.a.normal_3:0 "Even in ash, a path may be cleared."
 lv_noxious_gases_pulse.0002.a.tt.normal_3:0 "[noxious_gases_province.GetName] breathes a sigh of relief long missed."

 lv_noxious_gases_pulse.0002.t.normal_4:0 "Scoured by Rain"
 lv_noxious_gases_pulse.0002.desc.normal_4:0 "[noxious_gases_province.GetName]’s ash-heavy sky wept for days. Thick, gritty rain that turned roads into black slurry and soaked even the most weathered cloaks fell ceaselessly. But when the storm passed, it took with it the worst of the poison hanging low in the air.\n\nThe fumes have thinned, though the scent of sulfur and smoke remains, woven into every stone. Still, for once, breath does not burn."
 lv_noxious_gases_pulse.0002.a.normal_4:0 "The rain cleans nothing, but it grants a reprieve."
 lv_noxious_gases_pulse.0002.a.tt.normal_4:0 "The fumes in [noxious_gases_province.GetName] have been washed away, for a time."

 lv_noxious_gases_pulse.0002.t.normal_5:0 "The Ash Settles"
 lv_noxious_gases_pulse.0002.desc.normal_5:0 "For a time, the fume-choked winds grow still. The air remains heavy and laced with the bitter tang of old fire, but the rolling clouds of smoke have ebbed. Across the ruined hills and broken towers, ash lies undisturbed, thick as snow and silent as a crypt.\n\nThis is but a pause. Still, under [noxious_gases_province.GetName]’s bruised sky, that is as close as one can hope for."
 lv_noxious_gases_pulse.0002.a.normal_5:0 "The land exhales, but it does not sleep."
 lv_noxious_gases_pulse.0002.a.tt.normal_5:0 "With the fumes thinning, the settlement of [noxious_gases_province.GetName] had been spared."

 lv_noxious_gases_pulse.0002.t.spooky_1:0 "Something in the Mist"
 lv_noxious_gases_pulse.0002.desc.spooky_1:0 "The fumes did not merely grow thicker, they changed. Not in color or smell, but in presence. The fog clings longer than it should, curling in strange, deliberate ways. A scout swears he saw shadows moving inside it. Shadows that did not look like men, nor beasts, but something... else watching.\n\nAt dusk, the mist brings with it a sound like faint whispers. Fires gutter when placed near it. Old runes, long thought meaningless, begin to glow faintly on sunken stones.\n\nSome say the gases stir old magics buried deep beneath Valyria. Powers bound in smoke and bone. Others say it is simply the land remembering what it once was: a realm of sorcery and dark magics.\n\nFew sleep easily. Fewer dare speak of what they saw."
 lv_noxious_gases_pulse.0002.a.spooky_1:0 "Best not to dwell on what cannot be explained."
 lv_noxious_gases_pulse.0002.a.tt.spooky_1:0 "The toxic fumes in [noxious_gases_province.GetName] disperse regardless."

 lv_noxious_gases_pulse.0002.t.spooky_2:0 "Echoes on the Wind"
 lv_noxious_gases_pulse.0002.desc.spooky_2:0 "The fog rolls in thicker than before, and with it come sounds no living throat should make: low moans, distant howls, and... the clatter of unseen hooves across stone.\n\nSome claim it’s the wind twisting through ruined halls, but others swear they heard voices speaking in a tongue long dead.\n\nEach night, the sounds grow bolder. Not closer, just louder. As though whatever makes them wants to be heard."
 lv_noxious_gases_pulse.0002.a.spooky_2:0 "The land remembers things we were not meant to know."
 lv_noxious_gases_pulse.0002.a.tt.spooky_2:0 "[noxious_gases_province.GetName] remained restless for a time, but the fumes eventually dispersed."

 lv_noxious_gases_pulse.0002.t.spooky_3:0 "Dead Men Breathing"
 lv_noxious_gases_pulse.0002.desc.spooky_3:0 "A band of travelers passes through the mist and emerges pale, trembling... and strangely silent. Their skin bears no wounds, yet their eyes are glassy and unfocused, and their mouths twitch with words they cannot speak.\n\nThey do not respond when spoken to. They simply breathe slow, rasping inhalations, over and over. You order them watched, but some guards refuse to go near them.\n\nWhatever happened in that fog, part of it stayed with them."
 lv_noxious_gases_pulse.0002.a.spooky_3:0 "Keep them comfortable... and contained."
 lv_noxious_gases_pulse.0002.a.tt.spooky_3:0 "Whatever happened to these men remains a mystery, but eventually the fog over [noxious_gases_province.GetName] thinned to what it was before."

 lv_noxious_gases_pulse.0002.t.spooky_4:0 "The Color Beneath"
 lv_noxious_gases_pulse.0002.desc.spooky_4:0 "For a single hour, the fog glows faintly green. Not a vibrant green, but enough to cast ghostly light across the shattered ground. Beneath its glow, patterns that seem almost like old glyphs emerge on ancient stonework, ones unseen for centuries.\n\nSome claim it is a natural reaction. Whatever that means. Others won’t speak of it at all. The glow fades before dawn, leaving only silence and smoke."
 lv_noxious_gases_pulse.0002.a.spooky_4:0 "Perhaps it was never meant to be seen by sunlight."
 lv_noxious_gases_pulse.0002.a.tt.spooky_4:0 "Soon enough, the air in [noxious_gases_province.GetName] returned to how it used to be."

 lv_noxious_gases_pulse.0002.t.spooky_5:0 "Ash in the Blood"
 lv_noxious_gases_pulse.0002.desc.spooky_5:0 "Several laborers working near the fumes develop strange afflictions: skin that grays and flakes like scorched parchment, and veins that pulse faintly as though glowing beneath. None show signs of illness or pain, but none look quite human anymore.\n\nA healer insists it’s merely chemical exposure. Another claims it’s a curse. And one old woman, half-mad, swears she saw such marks on the old dragonlords, just before the Doom."
 lv_noxious_gases_pulse.0002.a.spooky_5:0 "Burn the bodies. Burn the tools. Speak of this to no one."
 lv_noxious_gases_pulse.0002.a.tt.spooky_5:0 "Eventually, the fumes leave [noxious_gases_province.GetName]."

 lv_noxious_gases_pulse.0003.t:0 "Sickening Air"
 lv_noxious_gases_pulse.0003.desc:0 "The foul air hanging over [noxious_gases_province.GetName] has finally claimed its due. At first, people were merely coughed and had watery eyes. Soon, this becomes fever, then weakness, then death. Entire households take ill within days, and those who tend to the afflicted seldom remain healthy for long.\n\nWhether the poison itself breeds this sickness or merely weakens those forced to breathe it, no healer can say."
 lv_noxious_gases_pulse.0003.a:0 "May [ROOT.Char.GetFaith.HighGodName] have mercy upon us."

 lv_noxious_gases_pulse.0003.t.normal_1:0 "Bitter Breaths"
 lv_noxious_gases_pulse.0003.desc.normal_1:0 "The fumes lingered longer than usual over [noxious_gases_province.GetName], settling over the valleys until every breath carried the taste of sulfur. Before long, laborers began collapsing where they stood, followed by their families, then their neighbors.\n\nSuffocation was the easiest explanation. Once the symptoms started showing, that was when most realized that this was far worse."
 lv_noxious_gases_pulse.0003.a.normal_1:0 "The air brings with it illness and death."

 lv_noxious_gases_pulse.0003.t.normal_2:0 "A Silent Contagion"
 lv_noxious_gases_pulse.0003.desc.normal_2:0 "It begins quietly. A cough here. A fever there. Few think much of it until the healers find themselves with more patients than they can tend.\n\nBy then, the sickness has already spread throughout [noxious_gases_province.GetName]."
 lv_noxious_gases_pulse.0003.a.normal_2:0 "Seal the doors and tend the sick."

 lv_noxious_gases_pulse.0003.t.normal_3:0 "Poison Takes Root"
 lv_noxious_gases_pulse.0003.desc.normal_3:0 "The choking haze refuses to lift. Men who have endured the fumes for weeks now find themselves too weak to work, while children and the elderly perish first.\n\nThe poison hanging over [noxious_gases_province.GetName] has given way to something deadlier still."
 lv_noxious_gases_pulse.0003.a.normal_3:0 "Damn it!"

 lv_noxious_gases_pulse.0003.t.normal_4:0 "Ill Winds"
 lv_noxious_gases_pulse.0003.desc.normal_4:0 "A warm wind carries the fumes within [noxious_gases_province.GetName] across fields and settlements alike. Within days, sickness follows in its wake. Markets empty, roads fall silent, and every passing stranger is met with wary eyes.\n\nThe settlement closes its gates, but disease pays little heed to walls."
 lv_noxious_gases_pulse.0003.a.normal_4:0 "Do not let this sickness spread."

 lv_noxious_gases_pulse.0003.t.normal_5:0 "The Cost of Breathing"
 lv_noxious_gases_pulse.0003.desc.normal_5:0 "For months the people of [noxious_gases_province.GetName] endured the poisoned air, believing that surviving each day was victory enough. Now that burden has come due.\n\nFever spreads from home to home, and each passing day leaves fewer hands to bury the dead."
 lv_noxious_gases_pulse.0003.a.normal_5:0 "The living must carry on."

 lv_noxious_gases_pulse.0003.t.spooky_1:0 "The Breath Below"
 lv_noxious_gases_pulse.0003.desc.spooky_1:0 "The first victims in [noxious_gases_province.GetName] insist they heard breathing within the fog.\n\nSlow. Heavy. Patient.\n\nBy the next morning they are feverish, and before another sunrise many are dead. Those who survive refuse to speak of what they heard, save to swear that the breathing continued long after they fled the mist."
 lv_noxious_gases_pulse.0003.a.spooky_1:0 "Do not wander where the fog gathers."

 lv_noxious_gases_pulse.0003.t.spooky_2:0 "The Pale Fever"
 lv_noxious_gases_pulse.0003.desc.spooky_2:0 "The sickness spreads swiftly across [noxious_gases_province.GetName], yet its victims bear an unsettling look about them. Their skin grows pale as ash, while their lips darken until they seem dusted with soot.\n\nThe healers know no illness quite like it. The oldest settlers whisper that Valyria has diseases the world has long forgotten."
 lv_noxious_gases_pulse.0003.a.spooky_2:0 "Some things should have remained buried."

 lv_noxious_gases_pulse.0003.t.spooky_3:0 "Whispers Through the Smoke"
 lv_noxious_gases_pulse.0003.desc.spooky_3:0 "Those struck by the illness begin speaking in their sleep. Few understand the words, though more than one scholar insists the tongue resembles ancient Valyrian.\n\nThe fever claims many in [noxious_gases_province.GetName] before the voices finally fall silent."
 lv_noxious_gases_pulse.0003.a.spooky_3:0 "Whatever speaks through them, listen not."

 lv_noxious_gases_pulse.0003.t.spooky_4:0 "Those Who Walk the Ash"
 lv_noxious_gases_pulse.0003.desc.spooky_4:0 "The sick of [noxious_gases_province.GetName] wander from their beds at night with no memory of where they have been. Come morning, footprints circle ruined towers and forgotten temples before disappearing into the ash.\n\nThe disease spreads regardless, leaving behind only frightened rumors and abandoned homes."
 lv_noxious_gases_pulse.0003.a.spooky_4:0 "Bar the doors before nightfall."

 lv_noxious_gases_pulse.0003.t.spooky_5:0 "The Doom's Breath"
 lv_noxious_gases_pulse.0003.desc.spooky_5:0 "Some claim the plague is no plague at all. They say the earth has opened old wounds, releasing the same poisoned breath that swept across Valyria on the day the Freehold fell.\n\nWhether tale or truth, the dead continue to mount, and few now venture willingly into the mist."
 lv_noxious_gases_pulse.0003.a.spooky_5:0 "This accursed land..."

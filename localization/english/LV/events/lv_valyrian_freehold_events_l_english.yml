l_english:
  lv_valyrian_freehold.0001.t:0 "The Dragon Wakes: The Freehold Reborn"
  lv_valyrian_freehold.0001.desc:0 "The nightmare of the Doom is shattered. Valyria—the cradle of magic, the seat of dragons, the heart of the world—is whole again.\n\nToday, the shattered land of Valyria stands as one, and the great cities, violently silenced the Fourteen Flames, echo once more with the roar of life. The fires that destroyed this empire have been quelled, and the true, brilliant light of the Valyrian Freehold shines once more across the Smoking Sea.\n\You stand at the nexus of history. The people look to you not as their ruler, but as the architect of the impossible—the one who defied the Doom and won. Every corner of the reborn Freehold pulses with a renewed vigor that no other kingdom can hope to rival.\n\nLet the other powers of the world tremble. The shadow of the Doom is lifted, and in its place the fire of Valyria burns brighter than it ever has. The might of Old Valyria is yours to command. The Age of the Freehold begins now."
  lv_valyrian_freehold.0001.a:0 "[Glossary( 'Valar dohaeris!', 'VALAR_DOHAERIS_GLOSS' )]"
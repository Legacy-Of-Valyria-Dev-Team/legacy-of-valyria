 #You gain Torment
  blockers.0002.t:0 "The Blade in the Dark"
  blockers.0002.desc:0 "As the final stones are set and the banners once again fly, the Red Wyrm’s Wrath stands reborn. The fortress looms over the land as it once did in the days of Lord Taurion, its dragonstone walls unmarred by time, its halls echoing with the whispers of the past.\n\nWithin the restored great hall, a hidden chamber is uncovered, sealed since the fall of [GetTitleByKey('k_lokiria').GetNameNoTier]. Inside, amidst dust and forgotten relics, lies a blade made of steel as black as a moonless night, its edge gleaming with an unnatural sharpness.\n\n[newly_created_artifact.GetName], the sword of King Taurin himself, lost to history after The Doom. Even now, its presence is suffused with an eerie weight, as if the blade remembers every battle it has tasted.\n\nThe question remains, will it serve as a symbol of dominion once more? Will it lead to another era of bloodshed?"
  blockers.0002.a:0 "A king's blade for a worthy ruler."


l_english:
 lv_valyria_random_event.01.t:0 "The Red-Robed Figures"
 lv_valyria_random_event.01.desc:0 "Through the haze, you see them - pale, with long, white hair. Their faces stark against the ash. Dark red robes hang from their shoulders. They do not move. They only stare. When you blink, they are gone."
 lv_valyria_random_event.01.a:0 "They were watching me."
 lv_valyria_random_event.01.b:0 "I am the true successor! Am I?"
 lv_valyria_random_event.01.c:0 "They are real - more real than the living."

 lv_valyria_random_event.02.t:0 "They are here again."
 lv_valyria_random_event.02.desc:0 "Once more you see them, amid the ruins. Closer now, their white hair gleaming in the firelight. Their eyes meet yours, unblinking. When you approach, they vanish, leaving only footprints in the ash that fade before your eyes."
 lv_valyria_random_event.02.a:0 "I cannot endure their gaze."
 lv_valyria_random_event.02.b:0 "They test me - I will show them that I am worthy."
 lv_valyria_random_event.02.c:0 "Yes... yes, I walk beside them..."

 lv_valyria_random_event.03.t:0 "The Dead Among You"
 lv_valyria_random_event.03.desc:0 "This time they do not vanish. The pale figures stand among your companions, silent, their red robes brushing the ash. No one else reacts. Their faces are turned only toward you. You blink - and the world tilts. They are gone... yet you are not certain you remain yourself."
 lv_valyria_random_event.03.a:0 "I guess it is over."
 
 lv_valyria_random_event.031.t:0 "Claimed"
 lv_valyria_random_event.031.desc:0 "The figures draw close. Their pale hands reach for you, and in an instant the world fades to black. When your companions look, you are simply gone."
 lv_valyria_random_event.031.a:0 "They take me into the ash."
 
 lv_valyria_random_event.032.t:0 "They live in me now..."
 lv_valyria_random_event.032.desc:0 "The figures dissolve into ash — yet you feel them within you, their voices whispering in a tongue older than men. Their eyes look out through yours."
 lv_valyria_random_event.032.a:0 "I am not alone in my own mind."

 lv_valyria_random_event.033.t:0 "A Cursed Gift"
 lv_valyria_random_event.033.desc:0 "When the figures vanish, something remains in the ash - a fragment of Valyria, glimmering faintly with an inner light. You take it in trembling hands, though the memory of their eyes burns still."
 lv_valyria_random_event.033.a:0 "It is mine now... whatever the cost."
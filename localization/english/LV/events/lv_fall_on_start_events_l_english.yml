l_english:
  lv_on_start_events.001.t:0 "The Half-Century Mark"
  lv_on_start_events.001.desc:0 "Fifty years have passed since the sky burned and the Freehold of Valyria was swallowed by the sea. The world has moved on, yet the shadow of the Doom still hangs over everything, a constant reminder of what was lost.\nAtop the towers of Dragonstone, the last beacon of Valyrian power, Lord Daemion Targaryen stands with his family. The air is thick with the smell of salt and old stone. His wife, Aerea of House Celtigar, holds their young son, Aerion, in her arms.\nFrom across the Narrow Sea, whispers of chaos are carried on the wind. The [bear_man.GetDynasty.GetName] dynasty in Gogossos, a city that clings to the edge of the old world, struggles to maintain order and keep the peace in the wake of the Doom. But their rule is being challenged. Reports speak of a new and zealous cult, the Green Wyrm, rising in power. Their followers are gathering, their faith a twisted mockery of our own, and their goal is clear: to see the Uruzarys overthrown and the last fragments of Valyrian civilization brought to ruin.\nYou are Daemion Targaryen. Your family is the last of your kind. Will you remain a silent observer as the fires of rebellion spread, or will you ride the storm and secure your legacy?"
  lv_on_start_events.001.a:0 "Ivestragī īlva jorepagon se gods hen valyrio lend zirȳ pōja aid" 
  #EN - Let us pray the gods of Valyria lend them their aid.
  
l_english:
  lv_wild_dragons_view.0001.t:0 "The Beasts of [province.GetName]"
  lv_wild_dragons_view.0001.desc:0 "Reports have come in of the various dragons and other draconic beasts roaming the wilds of [province.GetName]. These creatures, untamed and often dangerous, pose a significant threat to any settlements or travelers in the area. It is imperative that we understand the nature and extent of these beasts to ensure the safety of our people and lands.\n\nWhatever you do, be cautious. These creatures are not to be trifled with."
  lv_wild_dragons_view.0001.a:0 "That will be all."

lv_activity_blackstone:0 "Blackstone Research Expedition"
lv_activity_blackstone_desc:0 "You will travel to remote and important Blackstone sites around the world. There, You'll excavate ancient ruins, uncover hidden artifacts, and dig deep into the origins of this mysterious material. Each location holds secrets waiting to be discovered — pieces of a forgotten history that only you can uncover. Through exploration, research, and determination, You'll begin to unravel the true story of Blackstone and How to Make it once more."

lv_activity_blackstone_host_an_a:0 "A"

innovation_blackstone_knowledge_desc:0 "The ancient Valyrians once shaped Blackstone into unyielding roads, towering walls, and mighty castles. For centuries, the secrets of their craftsmanship were lost to time — but now, that knowledge has been rediscovered. Once more, we can forge structures worthy of legend."

lv_activity_blackstone_host_desc:0 "Participants Might Unlock The Truth and Knowlegde of Ancient Valyrian Blackstone and how to Replicate it"

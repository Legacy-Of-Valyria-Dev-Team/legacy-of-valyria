blackstone.25_t:0 "The City of Gogossos"
rocks.02:0 "The mighty city of Gogossos, once whispered of only in fear, revealed itself not as a cursed ruin but as a place of forgotten grandeur bustling with life, commerce, and ambition. Its streets, though uneven and ancient, carried the weight of a thousand untold stories. The city thrived in defiance of its dark legends, with gold gleaming in its markets and laughter echoing beneath its strange, shadowed towers. Amid its beauty and bustle, we followed our purpose with quiet determination, turning our attention to the relics that had drawn us across half a world the sites of Blackstone, ancient and untouched by time. \n \nOur focus fell on two in particular the Crimson Gate,an imposing fortress guarding the city, and the towering relic known as the Last Dragontower, its silhouette casting long shadows over the lower city. We examined both thoroughly, taking minor samples with the utmost care scrapings no deeper than a fingernail ensuring the original structures remained undisturbed. Every detail was recorded grain, texture, alignment, the strange way the surface seemed to resist heat and light. The Maester sketched obsessively, noting measurements while muttering old Valyrian references under his breath. Whatever secrets these stones held, they were ancient, patient, and waiting. And now, at last, we were listening."

rocks.03:0 "The ruined city of Gogossos, once whispered of only in fear, now lay before us its glory long since buried beneath vines, rot, and silence. Once a mighty jewel of the Basilisk Isles, its outer districts were crumbling husks, swallowed by the jungle, its streets cracked and choked with creeping roots. Stone facades leaned precariously, statues worn faceless by wind and time. And yet, even in ruin, Gogossos held a strange, haunting majesty. Something ancient clung to it a memory that refused to die. Amid the decay, two structures stood tall, proud, and eerily untouched by the rot that consumed the rest the Crimson Gate and the Last Dragontower, their black walls wrapped only in scattered overgrowth, as if the jungle dared not claim them fully. \n \nThe Crimson Gate, an immense fortress of dark stone, still loomed over the city's edge like a silent guardian. Its doors stood sealed, its battlements intact, casting long shadows as the sun passed overhead. The Last Dragontower, jagged and spire-like, pierced the sky beyond the lower city its surface smooth, obsidian-dark, resisting even the dirt and moss that clung to every other wall. We examined both thoroughly, collecting only minor samples carefully scraped without scarring the surface recording every grain, every alignment, every unnatural chill that radiated from the Blackstone. The Maester sketched and muttered, awestruck by how the towers had endured untouched, as though time itself had been forbidden to enter. Whatever secrets lay within these monuments, they remained ancient, defiant, and watching."

rocks.04:0 "Let's do this Quick!"

blackstone.26_t:0 "The City of Valyria"

rocks.05:0 "The mighty city of Valyria, reborn from ash and myth, rose before us with all the glory of its ancient legend rebuilt from the ground, proud and towering, its skyline a crown of obsidian spires and smoke-veiled domes. The air still carried the heat of old fire, but life had returned markets buzzed beneath high arches, dragons circled above, and the people walked with the confidence of those who had inherited the bones of empire. We moved through the city in awe, our eyes tracing every curve of the architecture, every symbol carved into the black stone walls. This was no shadow of Valyria it was Valyria itself, risen, and breathing again. \n \nBut we had come with purpose. Through boulevards lined with Blackstone statues, along fortress walls that shimmered faintly in the sun, and into towers where the very air seemed charged with power, we searched. Every surface was tested stone sampled in tiny flecks, its resistance to heat, pressure, even sound recorded in precise detail. We found Blackstone not just in monuments, but woven into the city itself, as if the material had once been sacred... and perhaps still was. The Maester worked feverishly, whispering that this was no simple masonry it was chosen, forged, placed. And as we mapped every inch, we began to understand Valyria did not just build with Blackstone. It was Blackstone. And whatever truth it holds, it has not yet finished speaking."

rocks.06:0 "The burned remains of Valyria stretched before us like a graveyard built by gods. The land was shattered, broken by ancient fury volcanic ridges twisted the horizon, and rivers of cooled lava carved through what had once been avenues of glory. The sky above hung thick with smoke, and the air stank of sulfur, ash, and long-dead fire. No life stirred. No birds. No insects. Only our boots disturbing the dust of an empire that had died screaming. We moved through blackened ruins some barely standing, others melted and fused into the earth itself. This was not a city. This was the scar left by something that tried to unmake the world. \n \nAnd yet... in the heart of it, the Blackstone remained. We found it in collapsed domes, shattered bridges, and strange, monolithic shapes that had resisted even the Doom's fury. Where once towers stood, their bones of Blackstone jutted from the ruin, smooth and unburned, as if fire had refused to touch them. We took our samples carefully only dust, small fragments, the barest scrape from the stone's edge. The Maester said little as he worked, awestruck and uneasy. His hands shook, but his notes were precise. Whatever force had annihilated Valyria, it had not touched the Blackstone. It stood alone, unyielding in a sea of death cold, unnatural, and waiting for someone foolish enough to listen."

blackstone.27_:0 "The City of Lokiria"
rocks.07:0 "The imposing city of Lokiria rose like a bastion of stone and pride, carved into the unforgiving peaks of the Gelios Mountains. Its walls, dark and sheer, seemed to grow from the rock itself less built than forged by the mountain. Towers loomed above narrow passes, their banners snapping in the high, thin air, and iron gates wide enough for giants stood open to caravans and columns of marching men. Lokiria was no idle ruin or ancient relic it was alive, thrumming with the energy of a city that had never fallen. Within its granite heart, traders, mercenaries, smiths, and scouts mingled in the markets and barracks, their voices echoing off cold stone. \n \nEverywhere we turned, there was motion horses being shoed, goods weighed and stamped, armor tested with the clang of hammers. Soldiers trained in the yards while robed officials oversaw the flow of wares through the trade halls. And above it all, carved high into the cliffs, stood the keep a fortress within a fortress, said to guard secrets older than even Valyria's rise. The people here spoke of Blackstone with reverence, not superstition. Whispers told of veins running deep beneath the foundations, or hidden chambers sealed in a stone that no tool could pierce. We had come to investigate such claims. In Lokiria, legend had a weight and we had come to see if it could be measured."

rocks.08:0 "The ruins of Lokiria clung to the cliffs of the Gelios Mountains like the bones of some great beast long dead. Once a proud fortress-city, it had been carved into the stone with defiance and precision but now its towers lay shattered, its gates twisted and rusting in the wind. The mountain had begun to reclaim it, slowly and without mercy. Cracked battlements leaned over chasms, their stones blackened by fire or time. What walls remained stood scarred, but not fallen still daring the world to come and try again. And yet, for all its ruin, Lokiria felt watchful. Silent, but not forgotten. Its halls echoed only with the wind, but its bones whispered of a power that had once ruled from its heights. \n \nWe picked our way through collapsed tunnels and vine-choked courtyards, careful not to disturb what still held together. Traders and soldiers were long gone, but remnants of their passing remained coins, rusted blades, worn sigils half-buried in dust. At the heart of the old keep, half-consumed by the mountain, we found it Blackstone, set into foundations and archways that had outlasted the rest. Smooth, cold, untouched by fire or weather. We took our samples with reverence, testing what we could. The Maester noted how the stone defied the mountain's collapse as though Lokiria had not fallen completely, only slept, waiting for the world to remember it again."

blackstone.28_t:0 "The City of Maritavia"
rock.09:0 "The vast city of Maritavia sprawled like a jeweled cloak across the slopes of a towering mountain, its winding streets and stacked districts circling ever upward. From its outer walls to its sun-warmed plazas, the city pulsed with life merchants calling out from terraced bazaars, pilgrims climbing the thousand stairs, and guards marching along parapets carved straight from the stone. The mountain itself was the city's spine, and every layer of Maritavia clung to it with pride and purpose. But far above the smoke and color, above the bells and banners, stood the true heart of the realm the Fortress at the Crest, perched so high it seemed to rest upon the clouds themselves. \n \nWe saw it first from miles away a silhouette against the sky, a crown of black stone set atop a peak of white. No road reached it easily. The climb was brutal, carved into cliffs with switchbacks and crumbling steps, as if the gods themselves demanded effort before granting entry. The locals spoke of it in hushed tones not out of fear, but reverence. They said it watched the world, unmoved, untouched by time or war. As we ascended, the air thinned and the world fell away below us, until only sky, wind, and the fortress remained. If Blackstone had a throne, it might well be here, resting on the bones of the mountain, gazing down on everything that came before or dared come after."

rocks.10:0 "The ruins of Maritavia stretched like faded scars across the flanks of the mountain it once ruled. Once a city of splendor and might, it had wrapped itself around stone like ivy, tier upon tier of markets, towers, and temples climbing ever higher. Now, only broken walls and crumbled stairways remained, swallowed by earth and time. The lower districts were half-buried in rockslides, their streets drowned in silence, the old plazas cracked and lifeless. Yet even in decay, the scale of it was undeniable a ghost of greatness. And far above, still clinging to the sky, the Fortress at the Crest loomed, broken but unbowed, its spires still piercing the mist like the ribs of a fallen god. \n \nReaching the summit was no easy feat the ancient path had collapsed in places, and the wind howled with every step, as though warning us away. But we pressed on, drawn by what still remained. The fortress, though shattered, stood defiant at the mountain's peak, its Blackstone walls chipped but not broken. Moss clung to cracks, birds nested in the hollows, but the stone itself cold, smooth, and dark as night had endured. We took our samples in reverent silence, noting how even the Doom that had scarred the world below seemed to have faltered here. Whatever had built this place had done so not just for strength but for permanence. And though the city had fallen, the mountain still bore its crown."

blackstone.29_t:0 "The City of Elyria"
rocks.11:0 "The City of Valyria, once the shattered jewel of a fallen empire, now rose anew a mighty power in Slaver's Bay, gleaming with ambition and draped in the banners of wealth and war. Its streets thrummed with life traders bartering exotic wares, slavers leading chained columns, and soldiers in gleaming armor, their boots striking stone with purpose. Smoke curled from forges, gold changed hands in shadowed corners, and whispers of old bloodlines echoed through the halls of power. This was not the Valyria of the Freehold, but something reborn in its image harsher, bolder, and no less proud. \n \nAt the city's heart stood the Mighty Dragon Palace, a towering monolith of Blackstone, smooth as glass and dark as the void. It rose above the city like a god's fist, its high windows glinting with firelight, its gates guarded day and night by spear-wielding loyalists. The locals spoke of it with awe it was said no tool could scratch its walls, no heat could scar it. Within its halls, the rulers of this new Valyria conducted their affairs beneath vaulted ceilings etched with forgotten runes. The Maester could hardly tear his eyes away, fingers tracing every edge of stonework that had outlived the world that made it. Whatever authority this city claimed, it was not built on gold or steel alone. It was built on Blackstone and that, more than anything, commanded fear."

rocks.12:0 "The city of Valyria, once reborn as a rising power in Slaver's Bay, now lay in ruin once more not by cataclysm, but by dragonfire. Its markets were silent, its barracks collapsed, the bones of traders, slavers, and soldiers charred and scattered in the dust. The grand avenues where gold once changed hands were now blackened paths of ash. What flame had not taken, fear had driven out. The air still smelled of smoke and blood, the skies overhead empty where dragons once soared in triumph. Whatever dream had tried to rise from the ashes of the old Freehold had been burned back into silence. \n \nAnd yet, in the heart of the wreckage, the Dragon Palace still stood scarred, scorched, but unbroken. The Blackstone that formed its walls did not melt, did not crack. The fire slid off it like rain off steel, leaving behind only soot. Its towers loomed over the hollow city like silent judges, untouched while all else had crumbled. We climbed through its scorched halls, our footsteps echoing against the cold stone. The Maester ran his fingers across its surface, whispering that even dragonflame had failed to leave a mark. Whatever power once ruled from within those walls had been cast down but the Blackstone endured, just as it always had. Silent. Waiting. Watching."

blackstone.30_t:0 "The City of Volatnis"

rocks.13:0 "The city of Volantis is a wonder of the old world, vibrant and immense, where the Rhoyne meets the sea and the past still walks alongside the present. As the First Daughter of the Freehold, it carries the weight of Valyria not as myth, but as memory its customs, nobility, and ambition all soaked in the blood of empire. The Long Bridge, crowded with life and stone dwellings, stretches across the river like a monument to defiance and decadence, joining the two halves of the city in both trade and rivalry. Above it all, markets bustle, slaves toil, and the Black Walls of the old nobility cast long shadows of quiet authority. Volantis has not tried to forget what it was. It has tried, with iron pride, to remain. \n \nBut only the Old Quarter, the original heart of the city, bears the mark of the Freehold's darkest stone. The Blackstone walls, vast and seamless, still encircle it like a ring of ancient judgment untouched by time, war, or weather. Within them live the descendants of Old Valyria's noblest blood, and none but they may dwell inside. The Maester was quick to point out the impossibility of the stone's craft how no mortar lines could be found, how the stone refused to yield to fire or blade. We took samples where we could, small traces near the foundation. The rest of the city may rise and fall, burn and rebuild but the Old Quarter endures, encased in Blackstone, a reminder that the true heart of Volantis was not merely built. It was ordained."

rocks.14:0 "The ruins of Volantis smoldered on the banks of the Rhoyne, the air still thick with smoke and the bitter stench of charred flesh. The mighty Long Bridge, once the lifeline of the city, now lay fractured its arches collapsed into the river, its temples and homes shattered, blackened shells clinging to stone. Towers that had stood for centuries were gutted or gone entirely, reduced in hours by the fury of dragonfire. Ash drifted through the streets like snow. What was once a jewel of Valyrian legacy, the First Daughter of the Freehold, now sat gutted and broken, pride turned to ruin under wings and flame. \n \nAnd yet, the Blackstone walls of the Old Quarter remained. Fire licked them. Buildings within had burned. But the walls smooth, seamless, inhumanly dark held firm, unbroken, as they always had. We approached them in silence, our boots crunching over rubble and bone. The Maester ran his hand along the stone, whispering how not even dragonflame could scar it. Within that circle of shadow and power, the blood of Old Valyria had once ruled. Now only echoes lingered. The rest of Volantis may have burned, but here, in the heart of the ashes, the Blackstone still stood defiant, eternal, and untouched by even the wrath of dragons."

blackstone.31_t:0 "The City of Lyria"
rocks.15:0 "The city of Lyria rises from the coast like a vision half-remembered from a dream beautiful, grand, and quietly ominous. Its great port is alive with motion sleek vessels and merchant ships glide in and out, their sails catching sea-winds thick with salt and incense. Cranes creak, dockworkers shout, and coin clinks in every corner. Goods from across Essos change hands here perfumed silks, sharpened steel, and stranger things that draw whispers, not questions. But above the din and wealth of the harbor, one thing commands the eye of all who enter the Tower of Lyria. It looms high above the city, black-stoned and narrow, twisting upward like a dagger stabbed into the sky. \n \nNo matter how bright the sun, the tower casts a shadow darker than it should. Locals do not speak of it lightly. Some call it a beacon of ancient power, others a relic best left undisturbed. Its walls bear no banners, its doors rarely open, yet its presence is felt in every part of the city. Magic lingers in the air subtle, not overt, but undeniable. Strange symbols are etched into corners, and odd lights flicker in alley windows after dusk. The Tower of Lyria does not declare its purpose, but it knows you are here, watching with stillness too deliberate to be stone. Whatever Lyria once was trading post, seat of power, arcane refuge it has become something far more curious. And far more dangerous."

rocks.16:0 "The ruins of Lyria lie broken along the blackened coast, where once proud ships docked and bustling markets rang with trade. Now, the port is little more than scorched stone and shattered timbers, its piers collapsed into the sea, its warehouses hollowed out by fire and time. The wind howls through empty alleys, carrying with it the faint scent of sulfur and rot. Ash still clings to broken tiles. The city was not merely abandoned it was silenced, crushed beneath the force of the Doom that swept Valyria into flame. And yet, amid the ruin, one thing remains the Tower of Lyria, cracked, scorched, and yet impossibly still standing. \n \nThe tower rises like a burnt spine above the dead city, its Blackstone surface dull but unchipped, streaked with soot yet eerily intact. Its windows are dark. Its gates sealed. But something still stirs within. The air around it hums faintly, not with life, but with residue a static, lingering whisper of the magic that once pulsed through its halls. The Maester would not approach it, choosing instead to sketch from afar, hands trembling. We took only dust from its base, nothing more. Whatever had been bound within the tower's walls had not died with the city it had merely gone quiet. The port is gone. The people, scattered. But the Tower of Lyria endures, and the feeling in our bones was clear it is not done."

blackstone.32_t:0 "The City of Tyrosh"

rocks.17:0 "The city of Tyrosh stands bold and defiant upon the coast, its walls bright with colored stone and banners that flutter in the salt-heavy breeze. Though its dominion may not stretch far beyond its borders, within those walls it is every bit a mighty Free City, proud of its heritage and confident in its strength. Founded long ago as a Valyrian military outpost, its bones are still stone and steel fortresses repurposed into palaces, barracks transformed into trade halls. The people are sharp-tongued, richly dressed, and fiercely independent. Tyroshi mercenaries sharpen their blades in its squares, while dyes, perfumes, and fine silks flood the markets with color and coin. \n \nYet beneath the extravagance lies discipline. Tyrosh has not forgotten its roots. Its streets may wind through fragrant gardens and marble columns, but the foundations are still Valyrian stone, and the pride of old conquest lives on in its commanders and council halls. Though it no longer answers to dragons, its tone carries echoes of the Freehold's order hard, martial, unyielding. It is not a city of sprawling influence or subtle games like Lys or Braavos. Tyrosh is strength contained, legacy weaponized, and it waits still, steady, and armed for the world to come knocking."

rocks.18:0 "The city of Tyrosh, once radiant with color and defiant pride, now lies charred and broken, its streets choked with ash and silence. Where vibrant banners once flew and perfumed markets bustled with trade, only smoldering stone and shattered domes remain. The great walls, once considered unbreachable, now gape with craters where dragonflame had torn through stone and soul alike. The famed dyes for which Tyrosh was known have run like blood through the gutters, staining the ground with a mockery of the city's former brilliance. What was once a Free City born of Valyrian steel and discipline is now a burned-out husk, its towers sagging, its gates warped and half-melted by fire that no wall could withstand. \n \nAnd yet, in the ruins, traces of that old strength still linger. Deep in the city's foundation, fragments of Valyrian stone, laid long ago when it was just a military outpost of the Freehold, remain intact scorched, but not broken. The bones of Tyrosh are stubborn, as were its people. The Maester noted how certain walls seemed untouched, the oldest ones, carved by Freehold masons centuries ago. But they are cold now, quiet. The fire did not discriminate between old and new it came to erase, and nearly succeeded. Tyrosh may yet rise again. But for now, it lies in ruin, its pride buried beneath the ash, and its silence louder than all its former boasts."

blackstone.33_t:0 "The City of Dragonstone"

rocks.19:0 "The mighty fortress of Dragonstone stands grim and regal upon the edge of Blackwater Bay, its towers carved like talons and its gates shaped like gaping maws of wyrms. Built long before the Doom as a Valyrian outpost, it was the first foothold of the Freehold in Westeros and the only one to endure. From this brooding stronghold, House Targaryen would rise to conquer and rule a continent, their dragons soaring from its high battlements like living fire. The island is harsh and jagged, its shores black with volcanic rock, its winds sharp with salt and sulfur but the castle itself is something else entirely. It is not built. It is shaped. Forged. Commanded into being. \n \nThe Blackstone of Dragonstone is unlike anything else in Westeros. Smooth, seamless, impossibly strong, it resists the tools of masons and the wear of centuries. The very walls pulse with an ancient stillness cool to the touch, yet never cold. Dragons seem drawn to it. Men speak in hushed tones when within its halls, their footsteps echoing strangely off its vast, dark corridors. The Maester who travels with us claims it may be the most complete and untouched example of Blackstone construction in the world. No one knows how it was made. Only that it endures and watches. Dragonstone is no mere fortress. It is a statement, a throne carved from shadow and legacy, and it does not ask to be remembered. It ensures it."

rocks.20:0 "The ruins of Dragonstone smolder upon the jagged rocks of Blackwater Bay, a broken silhouette against a storm-dark sky. Once the ancestral seat of House Targaryen, once a fortress of fire and legacy, it now lies gutted by flame not from enemies abroad, but by the fury of dragons themselves. The towers shaped like talons are snapped and crumbling, their sculpted forms twisted and blackened. The great stone dragons that once lined the parapets now lie shattered on the cliffs below, their wings cracked, their jaws broken in mute agony. The wind carries ash through the empty halls, and the sea crashes louder now, as if mourning the fall of the first Valyrian stronghold in Westeros. \n \nAnd yet, the Blackstone still stands. The fire scorched everything else wooden beams, doors, tapestries, even melted iron gates but the ancient stone that forms the foundation and core of Dragonstone remains untouched. Smooth, seamless, and dark as ever, it refuses to yield, even to the very fire that once gave it meaning. The Maester knelt beside a fractured hall, brushing away soot from a still-pristine wall, whispering, “It does not burn.” Whatever secrets were once locked in the Blackstone of Dragonstone are buried now beneath rubble and ruin but the stone endures, watching the fall of the house it once served, silent and unchanged, as if it had known this ending from the start."

blackstone.13_t:0 "I know have all I need"
blackstone.13_desc:0 "At long last, the pieces have fallen into place. I have gathered every scrap of knowledge, every relic, every whispered tale and fragment from across the known world. From the City of Valyria to the shadowed halls of Dragonstone, from the towers of Lyria to the sealed vaults of Volantis I have seen it, touched it, and questioned all who still dare speak its name. The samples are secured, the scrolls translated, and the funding in place. Scholars, maesters, occultists, and those best left unnamed now stand ready at my side. The time for theory has ended. The time for truth begins. \n \nWith this, we embark on a mighty expedition one unlike any the world has seen since the days of the Freehold. No longer will Blackstone remain a riddle half-remembered in ash and ruin. We will uncover its origin, its purpose, and the force that binds it to fire, blood, and time itself. The road ahead is perilous of that I have no doubt but I feel it in my bones this is the path I was always meant to walk. The Blackstone calls, and at last, I am ready to answer."

Experiment.01:0 "And Now it Begins"

blackstone.35_t:0 "Settling in Camp"
blackstone.35_Desc:0 "As we arrived at the chosen site remote, windswept, and untouched we wasted no time. The team moved with practiced urgency, unpacking crates, driving stakes into the ground, and pitching tents against the rising wind. Tools were laid out in careful order chisels, brushes, arcane measuring devices, and battered tomes stacked beside sample jars and ink-stained journals. Fire pits were lit, banners raised for marking sectors, and canvas shelters stretched into place with quiet discipline. The camp came alive, transforming a barren clearing into the beating heart of an expedition that had waited lifetimes to begin. \n \nWorkstations were erected with purpose tables for analysis, shaded spaces for scrollwork, racks for drying samples, and a sealed tent for anything… dangerous. The Maester claimed a corner by the ridge, already muttering over his notes, while my occult advisor set down wards of protection with salt and quiet chants. By sundown, everything was in place. The site was ready, the team prepared, and the shadows of dusk fell over a camp brimming with tools, tension, and expectation. Tomorrow, the real work would begin and with it, the long-awaited unraveling of the mystery that had brought us all here Blackstone. "

blackstone.41_t:0 "I have It All"
blackstone.41_desc:0 "After years of relentless work, of scouring ruins, surviving flame and frost, bargaining with madmen and gods, I now stand at the edge of the impossible. I believe I have it all of it. The formulas. The conditions. The materials no one dared name aloud. Everything needed to recreate Blackstone, the famed Valyrian stone whose name is whispered in reverence and fear across the world. No longer will it remain a mystery etched into cursed towers or buried beneath ash. I will pull it from shadow into shape. This stone, this impossible substance, will be mine to forge. \n \nThe workstation is ready, sealed and shielded. Every variable checked. Every symbol drawn. The Maester watches in silence, pale and grim. The others dare not speak. There is a heat in the air now an unnatural stillness, like the world itself is holding its breath. I begin the experiment slowly, carefully. A mixture here. A spark there. Then the binding. The light dims. The air bends. This is not alchemy. This is not science. This is resurrection. If I succeed, I will have brought back something lost since the Doom. If I fail… well, failure is no longer something I allow."

Experiment.5:0 "I've Gathered all My Knowledge, Time to Witness Greatness"
Experiment.6:0 "Put in Oven at 220C for 2 hours? ok"

blackstone.43_t:0 "The Blackstone Cake"
blackstone.43_desc:0 "YES. Yes! This is it this is the answer! All the years in the ash, the ruined cities, the whispers in the dark, the sleepless nights pouring over scrolls that bled ink and screamed in forgotten tongues and at last, the formula speaks to me! The secret, the great secret of the Valyrians, laid bare in its beautiful, blasphemous simplicity! \n \nMarble dust! Of course! Crushed bone of the earth, bleached and broken! And black food dye the shadow of the void, captured in liquid! That's it. That's all it ever was. Not sorcery, not blood magic, not sacrifice. The lie was the complexity! THEY HID IT IN PLAIN SIGHT! I will mix it. I will shape it. A perfect block clean, flawless, like the spires of Valyria before they wept fire. Into the oven it goes two hours at 220 degrees Celsius. Not a forge. Not dragonfire. A humble oven! A domestic resurrection! They'll mock me, they'll call me mad, but when it emerges... smooth, dark, and whole... they'll kneel. Oh yes. They'll all kneel on Blackstone."

Experiment.7:0 "I AM A GENIUS"

blackstone.42_t:0 "The Experiment"
blackstone.42_desc:0 "I will begin by preparing the stone for this experiment, ensuring that each material is properly aligned and the conditions are set to match those I've gathered from ruins, texts, and surviving records. The tools are laid out calipers, chisels for shaping, and containment vessels for the process itself. Every element has been chosen carefully, either sourced from ancient sites or forged to the closest standard I could reproduce. There can be no uncertainty now. \n \nAll my documents are arranged in front of me the compiled research, field notes, translated fragments, and surviving diagrams from across the known world. I've reviewed them a hundred times, but once more won't hurt. This is not a careless attempt. It is the result of years of study and sacrifice. Whatever Blackstone truly is, however it was once made, I now believe I stand at the threshold of understanding it not just in theory, but in practice. And so I begin."

Experiment.8:0 "Ensure Documents are Accurate I'll only do this once"
Experiemtn.9:0 "Let's Hope this works...."

blackstone.45_t:0 "A Gift from the Gods"
blackstone.45_desc:0 "As the dust settles and the heat fades from the chamber, I see it sitting there, untouched, unmoving. Black. Smooth. Cold. Just like the others I've studied in ruins and shattered palaces, but this one… this one is mine. Forged not in the fires of Valyria, but by my hand. After years of searching, testing, failing I have done it. I have recreated Blackstone. Not a copy. Not a fake. The true substance, impossible and unyielding, born again from forgotten knowledge and tireless resolve. \n \nThis moment is more than success. It is vindication. Proof that the past is not lost, that the legacy of the Freehold was not buried with its dragons. We have done what no one has dared since the Doom we've brought something ancient and mighty back into the world. We are no longer just scholars or seekers. We are heirs to Valyria now. And this stone, this perfect, silent monument, is only the beginning."

Experiment.10:0 "Finally Years of work is now finished"

blackstone.46_t:0 "A Gift from....the gods..."
blackstone.46_desc:0 "Just as the experiment began, I believed—truly believed—that it was working. Everything aligned the temperature, the pressure, the form. There, in the center of my workshop, it began to take shape—Blackstone, smooth and dark as night, forming exactly as the records described. My breath caught in my throat. I had done it. After all the years, I had recreated it. The first Blackstone forged since the Doom itself. This was the moment I had lived for. \n \nI stepped closer, hands trembling, reaching out to feel the surface—to confirm that it was real. But before I could touch it... BOOM. The world became fire. The chamber lit up in an instant, and the sound was more than sound—it was obliteration. The blast tore through me before I even knew it had come. No final thoughts, no escape. Just light, heat, and then nothing. The experiment succeeded. But I would never see what came after."

Experiment.11:0 "......."

blackstone.47_t:0 "A Feast fit for the Gods"
blackstone.47_desc:0 "We gathered in the banquet hall, the air thick with candle smoke and strange incense, the walls whispering with shadows. I had come prepared, expecting the rites to begin in blood—to give something, or someone, in exchange for deeper knowledge. That was what I'd been told, what I believed. But as the witches took their places around the long, carved table, they turned to me with curious smiles. “Choose the feast,” one said. An odd name for a sacrifice. I asked what she meant, but they only motioned for me to return to the table, assuring me the ritual would begin after dinner. I sat, cautious, suspicious… but curious. \n \nAnd then, an hour later, the feast arrived. Trays of roasted meat, spiced roots, black fruit soaked in wine, and steaming loaves filled the table from end to end. The smell was overwhelming—rich, heavy, irresistible. Hunger overtook doubt, and I devoured it greedily, tearing through the spread like a starving man at his final meal. There was laughter, though it didn’t feel warm. The witches watched, quiet and smiling, eating little, saying less. But I knew enough not to ask questions—not yet. A full belly is best for rituals, they had said. And so I ate until I could eat no more… knowing deep down, this was no ordinary feast. The real sacrifice, whatever it would be, was yet to come."

occult.13:0 "I can't do it"
occult.14:0 "[sacrifice_1.GetName] shall Suffice"
occult.15:0 "[sacrifice_2.GetName] shall Suffice"
occult.16:0 "[sacrifice_3.GetName] shall Suffice"
occult.17:0 "All of them Of course"

blackstone.48_t:0 "A Feast fit for the Gods 2"
blackstone.48_desc:0 "After our greedy feast, I sat back in my chair, stomach full, mind hazy with wine and roasted spice. That’s when they told me the ritual is complete. I blinked, confused. There had been no chanting, no blood spilled, no invocation—only food, laughter, and that strange, almost reverent silence that followed. I asked them, hesitant but firm, what they meant. One of the witches leaned in, eyes glittering in the candlelight, and said plainly “You have eaten the sacrifice.” The others nodded. My heart turned cold. \n \nDisgust washed over me like cold water. My hands, still sticky from the meat, trembled. I tried to speak—tried to reject what they said—but the memory of the flavor returned, rich, tender, unearthly. I felt it even as my stomach churned. Whatever it was, it had worked. The answers I’d been searching for now sat heavy in my mind, as if poured there—knowledge I hadn’t earned, but devoured. I should have turned away. I should have fled. But instead… I found myself wondering what cut I’d tasted. What part. And whether there was more."

occult.18:0 "I must have more......"

blackstone.49_t:0 "The monster's Feast"
blackstone.49_desc:0 "After the gluttonous feast, I leaned back in my chair, my belly full and my thoughts drifting in a haze of wine, salt, and smoke. The witches sat across from me in silence, their plates barely touched. Then, without ceremony, they spoke “It is done. The ritual is complete.” I frowned, confused. There had been no chanting, no bloodletting, no circle of ash—only food, laughter, and that strange, uneasy calm. I asked what they meant, my voice thick and unsteady. One smiled—just slightly—and said, “You have consumed all three sacrifices.” \n \nThe words struck me like ice water down my spine. Three? I looked down at my empty plate, suddenly aware of how greedily I had eaten. The meat—rich, unfamiliar, perfect—lingered on my tongue even as my stomach turned. I tried to stand, but the room felt distant, unreal. I demanded answers. Another witch leaned in, her voice almost kind “To know what no man should, something must be taken into you. Willingly. And you did.” Disgust twisted in my chest—but behind it, something else bloomed. That taste… unholy, exquisite. The knowledge now pressing into my skull pulsed with heat, power, and clarity. I should have recoiled. I should have wept. But all I could think was....I want more."

occult.19:0 "I MUST HAVE MORE"






########### Bla Events for Activity ##############

bla.01_t:0 "Peasant Unrest"
bla.01_desc:0 "The expedition's efforts to excavate the ancient Valyrian ruins have not gone unnoticed. At first, it was wary glances and muttered prayers from the peasants in the nearby hamlets. Now, the discontent has grown bolder. A delegation of smallfolk   dirt-smudged, sun-weathered, and angry   approaches your camp, led by a grim-faced hedge septon who speaks for them. \n \nThey claim your digging has awakened things best left buried. Livestock have gone missing. Children fall sick with fevers and speak in tongues in their sleep. The stones, they say, whisper at night. \nSome mutter that your torches and tools have stirred curses laid down in dragonfire long ago, and old wives claim the earth here was salted with blood in the time before the Doom. \nThe peasants demand you cease your work, fill in the trenches, and beg the gods for forgiveness. They do not threaten violence   not yet   but the threat lingers like smoke on the wind. If their concerns are not addressed, you may face sabotage, desertion, or worse the rise of folk superstition turned into mob justice. \n \nWill you press on with your work in defiance of local fears, or seek some means to appease the village before the past consumes the present?"

black.01:0 "Ignore them , Keep digging"
black.02:0 "Come and Fight me then!!!!"

bla.02_t:0 "They Did not like that...."
bla.02_desc:0 "The warnings went unheeded. The digging continued. \nNow the villagers have returned   not with pleas or priests, but with crude weapons, burning torches, and wild eyes sunken deep from starvation and dread. Hunger has hollowed them, and something else   something deeper   has filled the void fear twisted into fury. \nThey cry out that your meddling has cursed the land, that the earth has turned against them, that you have brought this doom upon them. One man carries a child wrapped in linens, lifeless and cold. Another clutches a rusted sickle as if it were a holy relic. And among them, there is talk   dark and hungry talk   of sacrifices, of flesh-for-flesh, of dragon's blood and fire-fed crops.\n \nThey are beyond reason… unless you are one trained to wield words like weapons."

black.03:0 "Friends dont be afraid we assure you it is safe"
black.04:0 "Ugh they look hungry......"

bla.03_t:0 "Peace Bought in Words"
bla.03_desc:0 "The shouting has faded. The torches have gone out. The villagers have withdrawn   sullen but no longer hostile. A handful remain at the edge of your camp, uncertain, muttering amongst themselves. The old hedge septon, now quieter, studies you with cautious respect. Perhaps they no longer see you as a curse   perhaps even as something more. \nThe fires of superstition still smolder, but the worst has passed. In this rare moment of uneasy calm, you see an opportunity. \nThey owe you nothing. But desperation makes for pliable allies   and now, you might ask for what your expedition truly needs. Do you lighten your burden with coin and supplies, or call on their hands and backs to quicken the pace of your work?"

black.05:0 "A Donation of funds would be Appriciated"
black.06:0 "I think a few Strong backs would Suffice"

bla.04_t:0 "The Earth Remembers"
bla.04_desc:0 "It began with a scream in the night. \nA worker was found at the base of the excavation trench, neck twisted, limbs bent in ways no fall should leave them. The others claimed he was alone, that no one heard him climb out of his tent. They buried him before sunrise   without prayers, without coin, as if afraid the dead man might hear. \n \nThen a second body. This one half-buried beneath a collapsed scaffold, though the ropes were cut clean   not frayed. A third was found in the tunnels beneath the fused stone arch, burned black and stiff as char. No torch was nearby. No fire reported. \nNow the camp whispers the ruins are cursed. That you're cursed. That the stones remember the hands that touch them. \nYou can feel something watching. Not from the treeline   from below."

black.07:0 "I wont stop this Dig like a Craven fool"
black.08:0 "Maybe i should hire some Mercenaries...."

bla.05_t:0 "Gnawed Offerings"
bla.05_desc:0 "The rats came in the night. \nThey chewed through sacks of grain, spoiled what little dried meat you had, and left trails of filth across your stores. A few workers chased them off with torches and stones, but not before half the food was ruined   gnawed and fouled beyond use. \nSome swear the rats were unnaturally bold, unafraid of fire or men, moving with purpose. One even claims he saw a rat standing on its hind legs, staring at him as if it knew. \n \nRats bring more than hunger   they bring plague. Your expedition is now vulnerable. You can replace what was lost, but only if you act swiftly… and wisely."

black.09:0 "Just Buy more Supplies and burn whats spoiled"
black.10:0 "Replace everything and buy some poison or a Cat"
black.11:0 "We can't Afford to waste more time on this"

bla.06_t:0 "Beneath te Gravel...."
bla.06_desc:0 "The dig was slow   inch by inch through black gravel and fused stone, long cooled from some ancient fire. But today, your pickaxes struck something different not bone, not ruin… but wealth. \n \nA hidden vault, collapsed under centuries of silt and time. Within it, wrapped in crumbling silk and scorched leather, lie bars of gold   stamped with a mark none of your team recognize. Not Westerosi. Not even Ghiscari. \nThe workers cheer. Some weep. Others simply stare, as if the sight of so much treasure in this cursed place feels more omen than fortune. \nYou could stop here. This find alone could fund a dozen more expeditions. But as the others revel, you notice something strange   a pattern in the collapsed stone, a shift in the way the gravel flows. \nThere might be more. If only you can read the ruin's language."

black.12:0 "This is Remarkable!!"
black.99:0 "Hidden in Plain sight , True Value lies!!"

bla.07_t:0 "The Stones give in..."
bla.07_desc:0 "It happened without warning. \n \nA low groan beneath the earth, a cracking like ice splitting apart   then silence, followed by screaming. A section of the dig collapsed into itself, swallowing scaffolds, tools, and men. Dust blotted out the sky for a moment. When it cleared, all that remained was a ragged pit and broken bodies. \nThe survivors clawed free with bloodied hands, coughing and wide-eyed, calling out names that would go unanswered. \nThe excavation has halted. Supplies are scattered. Morale teeters on the edge. The peasants   both workers and locals   watch you now, not as a leader or scholar, but as a judge. What you do next will shape their trust… or deepen their hatred."

black.13:0 "Rope, Timber and Fresh hands Quickly!!!"
black.14:0 "Tragic yes but we cannot stop our work."
black.15:0 "Pay their Families and get me more Timber!!"

bla.08_t:0 "Growls in the Fog"
bla.08_desc:0 "The woods were too quiet. \nThen came the crash of branches   heavy footfalls, snorting breath, and the stink of wet fur. A great bear, gaunt but still massive, lumbers into view near the edge of camp. Its eyes are sunken, its ribs like twisted iron beneath its matted coat. Hunger drives it. Desperation guides it. \nThe workers scatter in panic. One grabs a torch. Another draws a rusted blade. But you know panic will only make it worse. \nThis creature didn't stumble here by chance   it followed the scent of food, of men. It's testing the camp now. What you do next may determine whether it leaves with scraps… or blood."

black.16:0 "Quick use the BEAR SPRAY!!!"
black.17:0 "If its Blood he wants, ITS BLOOD HE'LL GET!!"
black.18:0 "Get the Meat and Toss it over there....."

bla.09_t:0 "Chains and Cinders"
bla.09_desc:0 "He arrives under a banner of neutrality, but his eyes burn with judgment. \n \n[rival_1.GetName] a scholar of Valyrian metallurgy and famed lecturer of the Citadel's Alchemical Annex   rides into your camp with two guards and a scroll-laden mule. He wastes no time on pleasantries. \n"This land is dangerous," he declares, gesturing to the dark stone rising from the earth. "And your methods… reckless. You meddle in arts older and darker than your chain can claim to understand." \nHe demands you halt the excavation, claiming he has been sent to ensure safety and proper scholarly oversight. But his motives are clear jealousy, pride, perhaps even fear. He wants the glory for himself. \nYou must decide how to handle him   carefully, forcefully, or with coin."

black.19:0 "Why don't we just work together"
black.20:0 "DIE SCUM THIS IS MY SITE!!"
black.21:0 "How about you take this bag of money and go away"

bla.10_t:0 "The Broken Chain"
bla.10_desc:0 "Word spreads quickly   even out here, among dust, ruin, and silence. \n[rival_1.GetName] is gone. Whether by wit or blade, you bested him. His challenge is ended, his authority cast aside, and your claim over the dig site stands unchallenged. The workers speak your name with a touch more reverence. The smallfolk, with less suspicion. Even the ruins themselves seem quieter, as if they too recognize who now holds dominion here. \nThe path forward remains treacherous, but for now, your name carries weight   and your work, legitimacy."

black.22:0 "Take all his papers and bury them deep..."

bla.11_t:0 "Something in the soil"
bla.11_Desc:0 "After months of toil and sweat, the earth finally yields its secret. \nBuried deep beneath layers of fused Valyrian stone and ash, you uncover a chamber unlike any seen in living memory. Its walls shimmer faintly with traces of ancient magic, and within lies an artifact   a fragment of the old dragonlords' craft, a key to the lost knowledge you have chased for so long. \nThe workers gather in awe, the camp's mood lifting as hope ignites once more. This find promises not just wealth, but a leap forward in your understanding   the kind that legends are made of."

black.23:0 "This will help Tremendously"

bla.12_t:0 "Whispers of Burnt Parchment"
bla.12_desc:0 "Beneath the rubble of fused dragonstone and ash, you uncover a sealed alcove. Within lies a collection of manuscripts   scrolls and bound pages etched in the elegant, flowing script of Old Valyria. The parchment is surprisingly well-preserved, the ink still vibrant as if the words themselves resist time's decay. \nThese texts could hold the keys to lost lore arcane smithing, dragon-binding rituals, or the secrets behind the magic that forged the dragonstone itself. Scholars would give their lives for such a find. \n \nThe camp falls silent as you carefully unroll the first scroll   a whisper from an age when dragons ruled the skies, and men wielded fire like a weapon."

black.24:0 "This is truly Precious...."

bla.13_t:0 "Echoes of the Past"
bla.13_desc:0 "In the stillness of the ancient ruins, when the sun slips low and shadows stretch long, something stirs   a whisper in the stones, a flicker of forgotten power. For a brief moment, the veil between past and present thins. \nYou feel it keenly a presence not bound by time, a glimpse of the men and dragons who once shaped these lands. Their hopes, their fears, their fires echo in your soul. It is as if the old gods themselves have acknowledged your quest. \nThis revelation renews your spirit, a holy spark in the darkness."

black.25:0 "May the Gods Grant me Strength"

bla.14_t:0 "Revoked...."
bla.14_desc:0 "By decree of the city's ruling council, your current work permit has been officially revoked, effective immediately. This decision has been made due to reasons deemed sufficient by the authorities, though no further justification is required under the current statutes. \nYou are hereby instructed to cease all ongoing work without delay. \nShould you wish to continue operations within city jurisdiction, you must submit a new application for a permit and pay the associated fees. Until such time as a new permit is approved, any continuation of labor, construction, or trade will be considered unlawful and subject to penalties under municipal law."

black.26:0 "I believe that we can come to better terms"
black.98:0 "I do Believe Everyone loves gold"
black.27:0 "Guess we Do paperwork and wait i guess...."

bla.15_t:0 "Voices raised in Dust"
bla.15_desc:0 "The murmurs grew into shouts, then cries   and now, a crowd of peasants has gathered at the edge of your camp, their faces hardened by years of toil and hunger. They demand that you cease your digging, fearing that your meddling in their land invites curses and calamity. znTheir anger is raw and unpredictable, a powder keg waiting for a spark. Your reaction could mean the difference between control and chaos."

black.28:0 "Crush them iron and Might"
black.29:0 "Throw money at them"
black.30:0 "Talk them down with Honeyed Words"

bla.16_t:0 "Knives in the Dark"
bla.16_desc:0 "Disaster strikes in the dead of night. \nRopes cut. Tunnels collapsed. Instruments stolen or smashed. Vital notes soaked and burned. It's no accident   this was deliberate. And not just the work of a common thief. \nOne of your rivals has struck from the shadows, hoping to cripple your expedition and claim the discoveries as their own. Tracks lead away from the camp, but they didn't cover them well. You know who it was. \nThe question now is how you'll respond   with caution… or steel."

black.31:0 "Try and Salvage what's left"
black.32:0 "Kill them, kill them all!"

bla.17_t:0 "The Aftermath"
bla.17_desc:0 "The duel was swift, brutal, and final. \nThe saboteur now lies dead, their blood soaking into the black gravel they tried to ruin. Some in the camp whisper that they got what they deserved. Others avert their eyes. But all know now betrayal is not without price. \nAmong [rival_2.GetName] belongings, you uncover a hidden stash   payment, no doubt, from whoever hired them. Coin meant to buy your downfall now lines your pockets."

black.33:0 "Take it all, it'll replenish what we lost"

bla.18_t:0 "What the hides in the Earth..."
bla.18_desc:0 "The shovels struck bone. \n \nAt first, you thought it might be animal remains   until a worker unearthed a skull, jaw cracked, still bearing a rusted earring. Soon there were more five bodies, perhaps six, stacked together beneath a collapsed section of the ruins. No grave markers. No shrouds. All long-dead, yet disturbed. \nThe workers are shaken. Some whisper of curses. Others look at you for guidance   or silence. The bodies are evidence, yes… but of what? A forgotten massacre? A warning? Or something you were never meant to see? Whatever the truth, the decision is now yours."

black.34:0 "I think the Soup kitchens could use some meat"
black.35:0 "Water shall carry away the Evidence"
black.36:0 "summon the Guard they must see this"
black.37:0 "Summon the Guard they can deal with these"

bla.19_t:0 "The Earth takes what it wants!"
bla.19_desc:0 "Without warning, the ground groaned like a dying beast   then gave way. \nA massive sinkhole split the dig site, swallowing part of the scaffolding and several workers. Moments later, a slow, sucking mudslide dragged half the southern trench into a mire of clay and black gravel. Screams were heard… and then silence. \nThe damage is extensive, and the site is dangerously unstable. If you don't act quickly, more could collapse   maybe the entire camp. But saving the site won't be cheap… or easy. \nYou have choices. Few of them good."

bla.19a:0 "A sudden, deafening roar erupts through the valley, reverberating off the cliffs like the cry of some ancient beast. Moments later, a torrent of mud, stone, and broken timber tears down the mountainside, engulfing the excavation site in chaos. \nWorkers shout in alarm, scrambling for higher ground as tents, tools, and unearthed relics vanish beneath the surge. The air fills with the sharp scent of wet earth and panic. Crucial sections of the camp lie mangled or submerged, and the ground itself groans under the weight of the shifting hillside."

black.38:0 "Get some braces and supports , we must secure the site!!"
black.39:0 "It's just Peasants , KEEP DIGGING!!!"
black.40:0 "I know a Guy who can help"

bla.20_t:0 "Hand's where they shouldn't be"
bla.20_desc:0 "It was bound to happen. \n \nOne of the older workers   a wiry man with a bad leg and a sharper eye   was spotted sneaking from the artifact tent at dusk. When pressed, he bolted. A quick search of his bedroll revealed what he tried to hide a small but unmistakable piece of fused dragonstone, freshly unearthed. \nYou've dealt with whispers of theft before   small trinkets, coin. But this? This is sacred to the expedition. Priceless. And if left unchecked, it sets a dangerous precedent. \nYou find the thief by the fire, arms crossed, defiant. Now, justice is yours to deliver."

black.41:0 "Give it Me Back!!"
black.41A:0 "The Thief Feels bad and Returns the Items stolen"
black.41B:0 "You Brutally Murder this Kid to gt your items back"

bla.21_t:0 "Justice by the Firelight"
bla.21_desc:0 "The duel was swift, and the thief fell hard into the dust, blood darkening the camp floor. \nThere were no cheers   only silence and the crackle of the fire nearby. The artifact, still wrapped in cloth, was recovered from his corpse. Whatever his reasons, he paid the price. You've sent a message the work here is sacred… and theft will not be tolerated. \n \nThe men return to their duties with heavier eyes   and tighter grips on their tools."

black.42:0 "He won't Be Stealing anything anymore..."

bla.22:0 "Something That Should Not Exist"
bla.22_desc:0 "It wasn't on any chart. Not in any diagram. Not mentioned in the records from Oldtown or the notes you acquired from the ruined tower archives. \nYet it was there, embedded deep in a collapsed chamber wall   smooth, seamless, pulsing faintly with a warmth that doesn't fade, even when left in the cold morning air. Its surface shimmers oddly in torchlight, as if the light bends slightly around it. \nNo one knows what it is. No one dares to touch it more than once. \nThere's no immediate danger. No explosion. No screaming. But the workers won't go near it now. They say it hums   though only when no one is listening. A trick of the air, maybe. Or something older. \nYou order it logged and sealed. Carefully."

black.43:0 "Document this , Contain it and Speak nothing of it"

bla.23_t:0 "A Purse With No Name"
bla.23_desc:0 "A courier arrives under cover of night, bearing a sealed letter and a chest of coin. \nNo sigil. No name. Only a short note, written in elegant, precise script #weak Your work is valuable. Consider this a sign of faith. More may follow, if you continue to uncover what others could not.#! \nThe chest contains a generous sum   enough to ease your burdens and accelerate the expedition. But the anonymity of it all hangs like smoke. Someone is watching. And they want you to dig deeper."

black.45:0 "I think a Letter saying we need more would be better"
black.46:0 "Send a Letter of thanks"

bla.24_t:0 "The Weight of Legacy"
bla.24_desc:0 "Your findings now number in the dozens   shards of fused stone etched with strange sigils, ornamental blades warped by heat no forge could produce, half-melted statues bearing the unmistakable mark of Valyrian craftsmanship. \nYou've uncovered a trove unlike any in living memory. The question now is what to do with it. \nYou could host a limited exhibition, invite lords, maesters, and merchants alike   a rare glimpse into a forgotten age, carefully curated. Prestige would follow, perhaps more than gold. \nOr… you could sell to select buyers behind closed doors. Wealth has its uses too."

black.47:0 "Come Gather round i have Much to tell"
black.48:0 "Come See what i have to Sell"

bla.25_t:0 "The Choice between Glory and Gold"
bla.25_desc:0 "Among the rubble and ruin, your team unearths a singular object   a Valyrian artifact unlike the others. Untarnished by time, it glints like obsidian in the sun, its craftsmanship delicate and inhumanly precise. Even your most skeptical maesters fall silent at the sight of it. \nIt is a relic of true historical weight   one that could make your name echo in halls of learning across the realm. But such notoriety does not fill supply wagons, nor does it bribe guards or silence rivals. \nThe artifact's fate now rests in your hands."

black.49:0 "I think this belongs in a Museum"
black.50:0 "I shall find a Buyer for this"

bla.26_t:0 "Maps from a Forgotten Hand"
bla.26_desc:0 "A local family, known for their quiet presence in the region, approaches your camp with a delicate offer. \nIn their possession are old maps worn and faded parchments sketched by hands long passed detailing terrain, hidden paths, and places lost to most memory. Such knowledge could prove invaluable to your expedition, guiding you toward hidden ruins and safe passages. \nThey ask for a modest fee in exchange for these secrets."

black.51:0 "Thank you for Aiding us in this Endeavour"
black.52:0 "Cross Refernce the maps with yours"

bla.27_t:0 "An Envoy's Quiet Gift"
bla.27_desc:0 "Wordless and discreet, an envoy arrives bearing coin from an anonymous donor. The gold is generous   enough to ease the expedition's burdens and push deeper into the ancient ruins. \n \nYet when you speak with the envoy, there is an unspoken offer wealth, or influence. Material support, or political backing. Which will serve you better?"

black.53:0 "Gold will offer the most Help"
black.54:0 "Political Friends and Allies will offer the most Support"

bla.28_t:0 "Whispers from the Stones"
bla.28_desc:0 "After weeks of painstaking effort, the ancient tablets have finally been deciphered. The cryptic inscriptions reveal secrets lost to time insights into the art of fused dragonstone and the rituals once performed by the ancients. \nThis breakthrough pushes your expedition forward in leaps and bounds."

black.55:0 "This Transcript will us Greatly"

l_english:

blackstone.1:0 "The Blackstone Remnants"
blackstone.1_t:0 "The Blackstone Remnants"
blackstone.1a:0 "The great city of Gogossos was once a proud and formidable Free City, renowned for its wealth, influence, and arcane legacy. At its heart stood a towering marvel the last known Valyrian Blackstone Dragon Tower, a relic of a bygone age when dragonlords shaped the world with fire and sorcery.\nLong abandoned and cloaked in mystery, the tower now looms like a monument to forgotten power. Driven by curiosity and the hope of uncovering lost truths I ascended its timeworn steps, each one echoing with the weight of history. I came upon a cache of ancient Valyrian documents, fragile and dust-covered, yet still legible. Many of these writings spoke of the blackstone an ominous and otherworldly material, often whispered about in tales but rarely understood. \nThese cryptic references hint at a deeper purpose, perhaps even a forbidden origin. If Gogossos holds only part of the truth, then the key may lie scattered across other sites where blackstone is known to exist. I must seek them out. For only by piecing together the fragments of this dark legacy can the full story be revealed."

blackstone.1b:0 "Valyria. Even the name burns like ash and thunder on the tongue. Once the heart of the greatest empire the world has ever known, it now lies smothered beneath smoke, ruin, and silence. And yet I came not in search of gold, nor for tales of dragons but for knowledge. For within the bones of this fallen giant may lie the truth of blackstone. \nThe old stories claim it cannot be cut or shaped, that no chisel can mark its surface, no forge can bend it to a craftsman's will. And yet the Valyrians worked it formed it into towers, bridges, and monuments that defy both time and reason. I wandered the shattered remains of what might once have been a temple or forum, and there I found blackstone not merely shaped, but joined smooth and seamless, as if poured from molten night. \nThis was no feat of mason's hand. There is sorcery in the stone, perhaps something more ancient than Valyria itself.I've taken samples from the broken ruins fragments pried from collapsed walls, dust scraped from fractured joints. I intend to study them closely. Perhaps they bear some link to the blackstone found elsewhere in the world. If there is a pattern, a common thread, it may yet reveal the means by which this impossible material was shaped. Or at the very least, How did the Valyrian's Learn to make this stone..."

blackstone.1c:0 "Once a seat of power and grandeur, the capital of the Province of Gelios loomed with an intimidating presence an awe-inspiring city forged in the proud traditions of High Valyrian nobility. Revered by the Freehold as the "Right Arm" of their dominion, its rulers were chosen not for bloodline alone, but for their unmatched prowess in war and command. From behind its towering battlements, they waged conquest with cold steel and searing dragonfire, crushing all who dared oppose them. \nThis bastion of might, once crowned with banners of victory, now lies in ruin. Yet even in its desolation, it refuses to be forgotten. The ancient walls, hewn from an eerie black stone known only to have existed in Dragonstone, still rise defiantly against the sky scarred by time, but unbroken by it. \nDespite centuries of decay and the catastrophic Doom that shattered the Freehold, the structure's core remains shockingly intact. Such resilience is more than mere chance it may hint at secrets buried in the very stone itself. If we can extract a sample from the wall, we might uncover properties or knowledge long thought lost to ash and legend. Further analysis could reveal whether this material was imbued with magic, forged through lost alchemical processes, or something else entirely."

blackstone.1d:0 "Maritavia, the fabled Mountain City, rises like a titan from the heart of the earth its soul crowned by the colossal Fortress of Procrazion, an immense monument dedicated to the old gods. This fortress, carved directly into the mountain's spine, looms so high that its peak remains forever hidden from the eyes of those dwelling below, veiled by cloud and shadow. \nOnly the legendary Five Forts of the distant East rival its sheer scale. Yet even among such wonders, Procrazion stands unique. Its vast halls and battlements, some buried deep within the mountain's core, were crafted from fused Dragonstone still as smooth, cold, and unyielding as the day they were forged. Despite the passage of ages, the material remains unchanged, a silent testament to the lost mastery of the ancients. \nThough much of the city has been looted and its grandeur stripped away by time and greed, remnants endure. Scattered fragments of scrolls and brittle pages, preserved in forgotten vaults, have yielded small pieces of knowledge just enough to be of use to me. These walls, like those found in other great ruins, hum with the same silent energy smooth beneath the hand, cold as the grave, and utterly impervious to the ravages of time."

blackstone.1e:0 "Eylria the Jewel of the Sea a small yet stunning Valyrian isle renowned for its beauty, wealth, and strategic importance. Founded not long after the rise of the Valyrian Freehold, it quickly blossomed into a thriving center of trade and commerce. Over the centuries, it has become one of the most prosperous cities in North Valyria, a key player in the mercantile routes of the region and once, a formidable contender in the brutal slave markets of Slaver's Bay. \nAt the heart of Eylria stands its most magnificent landmark, the Dragon Palace. This grand structure, forged like so many others from fused Dragonstone, once served as a regional seat of governance during the golden age of Valyria. Now, it is the residence of Eylria's Duke a noble who presides over the isle with the authority passed down through generations since the Freehold's fall. \nThe palace, with its sleek black towers and impossibly smooth walls, reflects the same ancient craftsmanship found across Valyria's ruined provinces. Though its purpose has changed, its majesty endures, untouched by time or decay.If fortune favors us, we may one day return and request an audience with the Duke. With their permission, we might delve into the isle's records and oral histories perhaps unearthing more about Eylria's past, its role in the Freehold, and the legacy of those who once ruled from its obsidian halls."

blackstone.1f:0 "Volantis the First Daughter of Valyria. stands proud and ancient along the banks of the Rhoyne, its great Black Walls still casting long shadows over the city. Once, in the chaos of the Century of Blood, Volantis declared itself the rightful heir to the fallen Freehold, styling its ambitions as the Second Coming of Valyria. Though those dreams of empire eventually withered, the echoes of that bold claim still linger in every stone and street. \nThis Free City capital is a place steeped in deep and complex history. Its avenues are paved with the ambitions of conquerors and the blood of slaves. Within the Black Walls the inner sanctum where only those of pure Valyrian descent may dwell stands the ancient architecture of the old world towers, bridges, and halls shaped from fused Dragonstone, as cold and smooth as the ruins scattered across Valyria itself. \nHere, the past refuses to fade. Every inch of Dragonstone whispers of a time when dragons flew above and sorcery ruled the earth. Volantis may no longer aspire to rule the world, but it remains a living monument to the legacy of the Freehold its pride unbroken, its traditions carefully guarded, and its ancient stones unyielding to the touch of time... "

blackstone.1g "Ergoria—known to some as Kastaryia—is the westernmost isle of the Valyrian Peninsula, a windswept land where sea mist clings to jagged cliffs and ancient legends whisper through the stones. Remote and shrouded in secrecy, the isle is home to the famed Tower of Lyria, a solitary spire crowned by an ever-burning flame said to have burned without end since the days before the Doom. \nTo the outside world, Ergoria is a place of mystery—a beacon for scholars, mystics, and seekers of arcane truth. While many see it as a place steeped in magic, others regard it as a sanctum of higher learning, where the esoteric arts and occult sciences are studied away from the politics and chaos of the mainland. \nMuch remains unknown about this enigmatic isle. Its history is fragmented, its lore guarded closely by those few who dwell within the tower's shadow. Yet one thing is certain like all places touched by the hand of Valyria, Ergoria bears the signature of fused Dragonstone. The walls of the Tower of Lyria, impossibly smooth and bitterly cold to the touch, remain unscarred by time—another silent testament to a lost age of power and wonder. What lies beneath those stones, or within the minds of those who walk its halls, is a mystery perhaps better left undisturbed… at least for now."

blackstone.1h :0 "Tyrosh, once a humble outpost on the edge of the Valyrian Freehold, has long since grown into one of the great Free Cities of the world—a bustling metropolis of trade, color, and conflict. Yet beneath its vibrant surface lies the quiet weight of its origins, carved quite literally into the very foundations of the city. \nThe ancient walls of Tyrosh, constructed during the early expansion of the Freehold, still stand—tall, dark, and strangely silent. Forged from fused Dragonstone, their texture and hue are nearly identical to those found in the heart of Old Valyria and its surrounding provinces. Smooth, cold, and untouched by centuries of weathering, the stone feels less like the work of mortal hands and more like something poured and shaped by the will of fire and sorcery.\n \nAnd yet, something about Tyrosh feels… different. It is as though the city is a reflection—a near-perfect replica of greater sites left behind by the Freehold, yet somehow lacking their soul. The Dragonstone here, while identical in composition, seems disconnected from the grand legacy it imitates. One might call it a strange echo, or even a counterfeit—proof of the Freehold’s reach, but not necessarily of its full glory. Still, Tyrosh remains a living city, while much of Valyria lies in ash. These ancient walls may yet yield clues about how and why the Valyrians shaped their empire the way they did—and whether all their works were truly equal beneath the surface."

blackstone.1i:0 "Dragonstone—once a modest outpost at the far reaches of the Valyrian Freehold—grew to become one of its most revered and enigmatic holdings. Perched upon a jagged volcanic isle at the edge of the Narrow Sea, it was seen by many as a holy place, particularly by those who served and followed the lineage of House Targaryen. \nAfter the Doom, Dragonstone became far more than a distant stronghold—it became a sanctuary, a seat of power, and the cradle of the last dragonlords. For the Targaryens, it was not just a fortress, but a symbol of divine right and destiny. From its ominous silhouette to its fire-warmed halls, the island pulses with ancient power. \nBeneath the shadow of the Dragonmont—the great volcano that looms over the island—lie the legendary dragonpits, where mighty beasts once roared and slept, waiting for the call of their riders. These cavernous vaults, like the fortress above them, are carved from fused black stone, the signature material of Valyrian sorcery and mastery.The architecture of Dragonstone is striking—eerie and magnificent. The towers are shaped like dragons; the halls are adorned with carvings so intricate, so vividly lifelike, that one might believe the stone itself breathes. It is whispered by some that with only the slightest whisper of a spell, these monuments might stir and awaken, as if the magic that forged them still lingers in their cold veins. \n \nDragonstone endures as more than a fortress—it is a monument to a forgotten empire, a shrine to fire and blood, and perhaps the last place in the world where the old Valyrian legacy remains not in ruin, but in waiting."

########### Bla Events for Activity ##############

bla.01_t:0 "Peasant Unrest"
bla.01_desc:0 "The expedition’s efforts to excavate the ancient Valyrian ruins have not gone unnoticed. At first, it was wary glances and muttered prayers from the peasants in the nearby hamlets. Now, the discontent has grown bolder. A delegation of smallfolk — dirt-smudged, sun-weathered, and angry — approaches your camp, led by a grim-faced hedge septon who speaks for them. \n \nThey claim your digging has awakened things best left buried. Livestock have gone missing. Children fall sick with fevers and speak in tongues in their sleep. The stones, they say, whisper at night. \nSome mutter that your torches and tools have stirred curses laid down in dragonfire long ago, and old wives claim the earth here was salted with blood in the time before the Doom. \nThe peasants demand you cease your work, fill in the trenches, and beg the gods for forgiveness. They do not threaten violence — not yet — but the threat lingers like smoke on the wind. If their concerns are not addressed, you may face sabotage, desertion, or worse the rise of folk superstition turned into mob justice. \n \nWill you press on with your work in defiance of local fears, or seek some means to appease the village before the past consumes the present?"

black.01:0 "Ignore them , Keep digging"
black.02:0 "Come and Fight me then!!!!"

bla.02_t:0 "They Did not like that...."
bla.02_desc:0 "The warnings went unheeded. The digging continued. \nNow the villagers have returned — not with pleas or priests, but with crude weapons, burning torches, and wild eyes sunken deep from starvation and dread. Hunger has hollowed them, and something else — something deeper — has filled the void fear twisted into fury. \nThey cry out that your meddling has cursed the land, that the earth has turned against them, that you have brought this doom upon them. One man carries a child wrapped in linens, lifeless and cold. Another clutches a rusted sickle as if it were a holy relic. And among them, there is talk — dark and hungry talk — of sacrifices, of flesh-for-flesh, of dragon's blood and fire-fed crops.\n \nThey are beyond reason… unless you are one trained to wield words like weapons."

black.03:0 "Friends dont be afraid we assure you it is safe"
black.04:0 "Ugh they look hungry......"

bla.03_t:0 "Peace Bought in Words"
bla.03_desc:0 "The shouting has faded. The torches have gone out. The villagers have withdrawn — sullen but no longer hostile. A handful remain at the edge of your camp, uncertain, muttering amongst themselves. The old hedge septon, now quieter, studies you with cautious respect. Perhaps they no longer see you as a curse — perhaps even as something more. \nThe fires of superstition still smolder, but the worst has passed. In this rare moment of uneasy calm, you see an opportunity. \nThey owe you nothing. But desperation makes for pliable allies — and now, you might ask for what your expedition truly needs. Do you lighten your burden with coin and supplies, or call on their hands and backs to quicken the pace of your work?"

black.05:0 "A Donation of funds would be Appriciated"
black.06:0 "I think a few Strong backs would Suffice"

bla.04_t:0 "The Earth Remembers"
bla.04_desc:0 "It began with a scream in the night. \nA worker was found at the base of the excavation trench, neck twisted, limbs bent in ways no fall should leave them. The others claimed he was alone, that no one heard him climb out of his tent. They buried him before sunrise — without prayers, without coin, as if afraid the dead man might hear. \n \nThen a second body. This one half-buried beneath a collapsed scaffold, though the ropes were cut clean — not frayed. A third was found in the tunnels beneath the fused stone arch, burned black and stiff as char. No torch was nearby. No fire reported. \nNow the camp whispers the ruins are cursed. That you're cursed. That the stones remember the hands that touch them. \nYou can feel something watching. Not from the treeline — from below."

black.07:0 "I wont stop this Dig like a Craven fool"
black.08:0 "Maybe i should hire some Mercenaries...."

bla.05_t:0 "Gnawed Offerings"
bla.05_desc:0 "The rats came in the night. \nThey chewed through sacks of grain, spoiled what little dried meat you had, and left trails of filth across your stores. A few workers chased them off with torches and stones, but not before half the food was ruined — gnawed and fouled beyond use. \nSome swear the rats were unnaturally bold, unafraid of fire or men, moving with purpose. One even claims he saw a rat standing on its hind legs, staring at him as if it knew. \n \nRats bring more than hunger — they bring plague. Your expedition is now vulnerable. You can replace what was lost, but only if you act swiftly… and wisely."

black.09:0 "Just Buy more Supplies and burn whats spoiled"
black.10:0 "Replace everything and buy some poison or a Cat"
black.11:0 "We can't Afford to waste more time on this"

bla.06_t:0 "Beneath te Gravel...."
bla.06_desc:0 "The dig was slow — inch by inch through black gravel and fused stone, long cooled from some ancient fire. But today, your pickaxes struck something different not bone, not ruin… but wealth. \n \nA hidden vault, collapsed under centuries of silt and time. Within it, wrapped in crumbling silk and scorched leather, lie bars of gold — stamped with a mark none of your team recognize. Not Westerosi. Not even Ghiscari. \nThe workers cheer. Some weep. Others simply stare, as if the sight of so much treasure in this cursed place feels more omen than fortune. \nYou could stop here. This find alone could fund a dozen more expeditions. But as the others revel, you notice something strange — a pattern in the collapsed stone, a shift in the way the gravel flows. \nThere might be more. If only you can read the ruin's language."

black.12:0 "This is Remarkable!!"
black.99:0 "Hidden in Plain sight , True Value lies!!"

bla.07_t:0 "The Stones give in..."
bla.07_desc:0 "It happened without warning. \n \nA low groan beneath the earth, a cracking like ice splitting apart — then silence, followed by screaming. A section of the dig collapsed into itself, swallowing scaffolds, tools, and men. Dust blotted out the sky for a moment. When it cleared, all that remained was a ragged pit and broken bodies. \nThe survivors clawed free with bloodied hands, coughing and wide-eyed, calling out names that would go unanswered. \nThe excavation has halted. Supplies are scattered. Morale teeters on the edge. The peasants — both workers and locals — watch you now, not as a leader or scholar, but as a judge. What you do next will shape their trust… or deepen their hatred."

black.13:0 "Rope, Timber and Fresh hands Quickly!!!"
black.14:0 "Tragic yes but we cannot stop our work."
black.15:0 "Pay their Families and get me more Timber!!"

bla.08_t:0 "Growls in the Fog"
bla.08_desc:0 "The woods were too quiet. \nThen came the crash of branches — heavy footfalls, snorting breath, and the stink of wet fur. A great bear, gaunt but still massive, lumbers into view near the edge of camp. Its eyes are sunken, its ribs like twisted iron beneath its matted coat. Hunger drives it. Desperation guides it. \nThe workers scatter in panic. One grabs a torch. Another draws a rusted blade. But you know panic will only make it worse. \nThis creature didn't stumble here by chance — it followed the scent of food, of men. It's testing the camp now. What you do next may determine whether it leaves with scraps… or blood."

black.16:0 "Quick use the BEAR SPRAY!!!"
black.17:0 "If its Blood he wants, ITS BLOOD HE'LL GET!!"
black.18:0 "Get the Meat and Toss it over there....."

bla.09_t:0 "Chains and Cinders"
bla.09_desc:0 "He arrives under a banner of neutrality, but his eyes burn with judgment. \n \n[rival_1.GetName] a scholar of Valyrian metallurgy and famed lecturer of the Citadel's Alchemical Annex — rides into your camp with two guards and a scroll-laden mule. He wastes no time on pleasantries. \n"This land is dangerous," he declares, gesturing to the dark stone rising from the earth. "And your methods… reckless. You meddle in arts older and darker than your chain can claim to understand." \nHe demands you halt the excavation, claiming he has been sent to ensure safety and proper scholarly oversight. But his motives are clear jealousy, pride, perhaps even fear. He wants the glory for himself. \nYou must decide how to handle him — carefully, forcefully, or with coin."

black.19:0 "Why don't we just work together"
black.20:0 "DIE SCUM THIS IS MY SITE!!"
black.21:0 "How about you take this bag of money and go away"

bla.10_t:0 "The Broken Chain"
bla.10_desc:0 "Word spreads quickly — even out here, among dust, ruin, and silence. \n[rival_1.GetName] is gone. Whether by wit or blade, you bested him. His challenge is ended, his authority cast aside, and your claim over the dig site stands unchallenged. The workers speak your name with a touch more reverence. The smallfolk, with less suspicion. Even the ruins themselves seem quieter, as if they too recognize who now holds dominion here. \nThe path forward remains treacherous, but for now, your name carries weight — and your work, legitimacy."

black.22:0 "Take all his papers and bury them deep..."

bla.11_t:0 "Something in the soil"
bla.11_Desc:0 "After months of toil and sweat, the earth finally yields its secret. \nBuried deep beneath layers of fused Valyrian stone and ash, you uncover a chamber unlike any seen in living memory. Its walls shimmer faintly with traces of ancient magic, and within lies an artifact — a fragment of the old dragonlords' craft, a key to the lost knowledge you have chased for so long. \nThe workers gather in awe, the camp's mood lifting as hope ignites once more. This find promises not just wealth, but a leap forward in your understanding — the kind that legends are made of."

black.23:0 "This will help Tremendously"

bla.12_t:0 "Whispers of Burnt Parchment"
bla.12_desc:0 "Beneath the rubble of fused dragonstone and ash, you uncover a sealed alcove. Within lies a collection of manuscripts — scrolls and bound pages etched in the elegant, flowing script of Old Valyria. The parchment is surprisingly well-preserved, the ink still vibrant as if the words themselves resist time's decay. \nThese texts could hold the keys to lost lore arcane smithing, dragon-binding rituals, or the secrets behind the magic that forged the dragonstone itself. Scholars would give their lives for such a find. \n \nThe camp falls silent as you carefully unroll the first scroll — a whisper from an age when dragons ruled the skies, and men wielded fire like a weapon."

black.24:0 "This is truly Precious...."

bla.13_t:0 "Echoes of the Past"
bla.13_desc:0 "In the stillness of the ancient ruins, when the sun slips low and shadows stretch long, something stirs — a whisper in the stones, a flicker of forgotten power. For a brief moment, the veil between past and present thins. \nYou feel it keenly a presence not bound by time, a glimpse of the men and dragons who once shaped these lands. Their hopes, their fears, their fires echo in your soul. It is as if the old gods themselves have acknowledged your quest. \nThis revelation renews your spirit, a holy spark in the darkness."

black.25:0 "May the Gods Grant me Strength"

bla.14_t:0 "Revoked...."
bla.14_desc:0 "By decree of the city's ruling council, your current work permit has been officially revoked, effective immediately. This decision has been made due to reasons deemed sufficient by the authorities, though no further justification is required under the current statutes. \nYou are hereby instructed to cease all ongoing work without delay. \nShould you wish to continue operations within city jurisdiction, you must submit a new application for a permit and pay the associated fees. Until such time as a new permit is approved, any continuation of labor, construction, or trade will be considered unlawful and subject to penalties under municipal law."

black.26:0 "I believe that we can come to better terms"
black.98:0 "I do Believe Everyone loves gold"
black.27:0 "Guess we Do paperwork and wait i guess...."

bla.15_t:0 "Voices raised in Dust"
bla.15_desc:0 "The murmurs grew into shouts, then cries — and now, a crowd of peasants has gathered at the edge of your camp, their faces hardened by years of toil and hunger. They demand that you cease your digging, fearing that your meddling in their land invites curses and calamity. znTheir anger is raw and unpredictable, a powder keg waiting for a spark. Your reaction could mean the difference between control and chaos."

black.28:0 "Crush them iron and Might"
black.29:0 "Throw money at them"
black.30:0 "Talk them down with Honeyed Words"

bla.16_t:0 "Knives in the Dark"
bla.16_desc:0 "Disaster strikes in the dead of night. \nRopes cut. Tunnels collapsed. Instruments stolen or smashed. Vital notes soaked and burned. It's no accident — this was deliberate. And not just the work of a common thief. \nOne of your rivals has struck from the shadows, hoping to cripple your expedition and claim the discoveries as their own. Tracks lead away from the camp, but they didn't cover them well. You know who it was. \nThe question now is how you'll respond — with caution… or steel."

black.31:0 "Try and Salvage what's left"
black.32:0 "Kill them, kill them all!"

bla.17_t:0 "The Aftermath"
bla.17_desc:0 "The duel was swift, brutal, and final. \nThe saboteur now lies dead, their blood soaking into the black gravel they tried to ruin. Some in the camp whisper that they got what they deserved. Others avert their eyes. But all know now betrayal is not without price. \nAmong [rival_2.GetName] belongings, you uncover a hidden stash — payment, no doubt, from whoever hired them. Coin meant to buy your downfall now lines your pockets."

black.33:0 "Take it all, it'll replenish what we lost"

bla.18_t:0 "What the hides in the Earth..."
bla.18_desc:0 "The shovels struck bone. \n \nAt first, you thought it might be animal remains — until a worker unearthed a skull, jaw cracked, still bearing a rusted earring. Soon there were more five bodies, perhaps six, stacked together beneath a collapsed section of the ruins. No grave markers. No shrouds. All long-dead, yet disturbed. \nThe workers are shaken. Some whisper of curses. Others look at you for guidance — or silence. The bodies are evidence, yes… but of what? A forgotten massacre? A warning? Or something you were never meant to see? Whatever the truth, the decision is now yours."

black.34:0 "I think the Soup kitchens could use some meat"
black.35:0 "Water shall carry away the Evidence"
black.36:0 "summon the Guard they must see this"
black.37:0 "Summon the Guard they can deal with these"

bla.19_t:0 "The Earth takes what it wants!"
bla.19_desc:0 "Without warning, the ground groaned like a dying beast — then gave way. \nA massive sinkhole split the dig site, swallowing part of the scaffolding and several workers. Moments later, a slow, sucking mudslide dragged half the southern trench into a mire of clay and black gravel. Screams were heard… and then silence. \nThe damage is extensive, and the site is dangerously unstable. If you don't act quickly, more could collapse — maybe the entire camp. But saving the site won't be cheap… or easy. \nYou have choices. Few of them good."

bla.19a:0 "A sudden, deafening roar erupts through the valley, reverberating off the cliffs like the cry of some ancient beast. Moments later, a torrent of mud, stone, and broken timber tears down the mountainside, engulfing the excavation site in chaos. \nWorkers shout in alarm, scrambling for higher ground as tents, tools, and unearthed relics vanish beneath the surge. The air fills with the sharp scent of wet earth and panic. Crucial sections of the camp lie mangled or submerged, and the ground itself groans under the weight of the shifting hillside."

black.38:0 "Get some braces and supports , we must secure the site!!"
black.39:0 "It's just Peasants , KEEP DIGGING!!!"
black.40:0 "I know a Guy who can help"

bla.20_t:0 "Hand's where they shouldn't be"
bla.20_desc:0 "It was bound to happen. \n \nOne of the older workers — a wiry man with a bad leg and a sharper eye — was spotted sneaking from the artifact tent at dusk. When pressed, he bolted. A quick search of his bedroll revealed what he tried to hide a small but unmistakable piece of fused dragonstone, freshly unearthed. \nYou've dealt with whispers of theft before — small trinkets, coin. But this? This is sacred to the expedition. Priceless. And if left unchecked, it sets a dangerous precedent. \nYou find the thief by the fire, arms crossed, defiant. Now, justice is yours to deliver."

black.41:0 "Give it Me Back!!"
black.41A:0 "The Thief Feels bad and Returns the Items stolen"
black.41B:0 "You Brutally Murder this Kid to gt your items back"

bla.21_t:0 "Justice by the Firelight"
bla.21_desc:0 "The duel was swift, and the thief fell hard into the dust, blood darkening the camp floor. \nThere were no cheers — only silence and the crackle of the fire nearby. The artifact, still wrapped in cloth, was recovered from his corpse. Whatever his reasons, he paid the price. You've sent a message the work here is sacred… and theft will not be tolerated. \n \nThe men return to their duties with heavier eyes — and tighter grips on their tools."

black.42:0 "He won't Be Stealing anything anymore..."

bla.22:0 "Something That Should Not Exist"
bla.22_desc:0 "It wasn't on any chart. Not in any diagram. Not mentioned in the records from Oldtown or the notes you acquired from the ruined tower archives. \nYet it was there, embedded deep in a collapsed chamber wall — smooth, seamless, pulsing faintly with a warmth that doesn't fade, even when left in the cold morning air. Its surface shimmers oddly in torchlight, as if the light bends slightly around it. \nNo one knows what it is. No one dares to touch it more than once. \nThere's no immediate danger. No explosion. No screaming. But the workers won't go near it now. They say it hums — though only when no one is listening. A trick of the air, maybe. Or something older. \nYou order it logged and sealed. Carefully."

black.43:0 "Document this , Contain it and Speak nothing of it"

bla.23_t:0 "A Purse With No Name"
bla.23_desc:0 "A courier arrives under cover of night, bearing a sealed letter and a chest of coin. \nNo sigil. No name. Only a short note, written in elegant, precise script #weak Your work is valuable. Consider this a sign of faith. More may follow, if you continue to uncover what others could not.#! \nThe chest contains a generous sum — enough to ease your burdens and accelerate the expedition. But the anonymity of it all hangs like smoke. Someone is watching. And they want you to dig deeper."

black.45:0 "I think a Letter saying we need more would be better"
black.46:0 "Send a Letter of thanks"

bla.24_t:0 "The Weight of Legacy"
bla.24_desc:0 "Your findings now number in the dozens — shards of fused stone etched with strange sigils, ornamental blades warped by heat no forge could produce, half-melted statues bearing the unmistakable mark of Valyrian craftsmanship. \nYou've uncovered a trove unlike any in living memory. The question now is what to do with it. \nYou could host a limited exhibition, invite lords, maesters, and merchants alike — a rare glimpse into a forgotten age, carefully curated. Prestige would follow, perhaps more than gold. \nOr… you could sell to select buyers behind closed doors. Wealth has its uses too."

black.47:0 "Come Gather round i have Much to tell"
black.48:0 "Come See what i have to Sell"

bla.25_t:0 "The Choice between Glory and Gold"
bla.25_desc:0 "Among the rubble and ruin, your team unearths a singular object — a Valyrian artifact unlike the others. Untarnished by time, it glints like obsidian in the sun, its craftsmanship delicate and inhumanly precise. Even your most skeptical maesters fall silent at the sight of it. \nIt is a relic of true historical weight — one that could make your name echo in halls of learning across the realm. But such notoriety does not fill supply wagons, nor does it bribe guards or silence rivals. \nThe artifact's fate now rests in your hands."

black.49:0 "I think this belongs in a Museum"
black.50:0 "I shall find a Buyer for this"

bla.26_t:0 "Maps from a Forgotten Hand"
bla.26_desc:0 "A local family, known for their quiet presence in the region, approaches your camp with a delicate offer. \nIn their possession are old maps—worn and faded parchments sketched by hands long passed—detailing terrain, hidden paths, and places lost to most memory. Such knowledge could prove invaluable to your expedition, guiding you toward hidden ruins and safe passages. \nThey ask for a modest fee in exchange for these secrets."

black.51:0 "Thank you for Aiding us in this Endeavour"
black.52:0 "Cross Refernce the maps with yours"

bla.27_t:0 "An Envoy's Quiet Gift"
bla.27_desc:0 "Wordless and discreet, an envoy arrives bearing coin from an anonymous donor. The gold is generous — enough to ease the expedition's burdens and push deeper into the ancient ruins. \n \nYet when you speak with the envoy, there is an unspoken offer wealth, or influence. Material support, or political backing. Which will serve you better?"

black.53:0 "Gold will offer the most Help"
black.54:0 "Political Friends and Allies will offer the most Support"

bla.28_t:0 "Whispers from the Stones"
bla.28_desc:0 "After weeks of painstaking effort, the ancient tablets have finally been deciphered. The cryptic inscriptions reveal secrets lost to time—insights into the art of fused dragonstone and the rituals once performed by the ancients. \nThis breakthrough pushes your expedition forward in leaps and bounds."

black.55:0 "This Transcript will us Greatly"

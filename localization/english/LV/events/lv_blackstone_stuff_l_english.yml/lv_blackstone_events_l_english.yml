l_english:

blackstone.1:0 "The Blackstone Remnants"
blackstone.1_t:0 "The Blackstone Remnants"
blackstone.1a:0 "The great city of Gogossos was once a proud and formidable Free City, renowned for its wealth, influence, and arcane legacy. At its heart stood a towering marvel the last known Valyrian Blackstone Dragon Tower, a relic of a bygone age when dragonlords shaped the world with fire and sorcery.\nLong abandoned and cloaked in mystery, the tower now looms like a monument to forgotten power. Driven by curiosity and the hope of uncovering lost truths I ascended its timeworn steps, each one echoing with the weight of history. I came upon a cache of ancient Valyrian documents, fragile and dust-covered, yet still legible. Many of these writings spoke of the blackstone an ominous and otherworldly material, often whispered about in tales but rarely understood. \nThese cryptic references hint at a deeper purpose, perhaps even a forbidden origin. If Gogossos holds only part of the truth, then the key may lie scattered across other sites where blackstone is known to exist. I must seek them out. For only by piecing together the fragments of this dark legacy can the full story be revealed."

blackstone.1b:0 "Valyria. Even the name burns like ash and thunder on the tongue. Once the heart of the greatest empire the world has ever known, it now lies smothered beneath smoke, ruin, and silence. And yet I came not in search of gold, nor for tales of dragons but for knowledge. For within the bones of this fallen giant may lie the truth of blackstone. \nThe old stories claim it cannot be cut or shaped, that no chisel can mark its surface, no forge can bend it to a craftsman's will. And yet the Valyrians worked it formed it into towers, bridges, and monuments that defy both time and reason. I wandered the shattered remains of what might once have been a temple or forum, and there I found blackstone not merely shaped, but joined smooth and seamless, as if poured from molten night. \nThis was no feat of mason's hand. There is sorcery in the stone, perhaps something more ancient than Valyria itself.I've taken samples from the broken ruins fragments pried from collapsed walls, dust scraped from fractured joints. I intend to study them closely. Perhaps they bear some link to the blackstone found elsewhere in the world. If there is a pattern, a common thread, it may yet reveal the means by which this impossible material was shaped. Or at the very least, How did the Valyrian's Learn to make this stone..."

blackstone.1c:0 "Once a seat of power and grandeur, the capital of the Province of Gelios loomed with an intimidating presence an awe-inspiring city forged in the proud traditions of High Valyrian nobility. Revered by the Freehold as the "Right Arm" of their dominion, its rulers were chosen not for bloodline alone, but for their unmatched prowess in war and command. From behind its towering battlements, they waged conquest with cold steel and searing dragonfire, crushing all who dared oppose them. \nThis bastion of might, once crowned with banners of victory, now lies in ruin. Yet even in its desolation, it refuses to be forgotten. The ancient walls, hewn from an eerie black stone known only to have existed in Dragonstone, still rise defiantly against the sky scarred by time, but unbroken by it. \nDespite centuries of decay and the catastrophic Doom that shattered the Freehold, the structure's core remains shockingly intact. Such resilience is more than mere chance it may hint at secrets buried in the very stone itself. If we can extract a sample from the wall, we might uncover properties or knowledge long thought lost to ash and legend. Further analysis could reveal whether this material was imbued with magic, forged through lost alchemical processes, or something else entirely."

blackstone.1d:0 "Maritavia, the fabled Mountain City, rises like a titan from the heart of the earth its soul crowned by the colossal Fortress of Procrazion, an immense monument dedicated to the old gods. This fortress, carved directly into the mountain's spine, looms so high that its peak remains forever hidden from the eyes of those dwelling below, veiled by cloud and shadow. \nOnly the legendary Five Forts of the distant East rival its sheer scale. Yet even among such wonders, Procrazion stands unique. Its vast halls and battlements, some buried deep within the mountain's core, were crafted from fused Dragonstone still as smooth, cold, and unyielding as the day they were forged. Despite the passage of ages, the material remains unchanged, a silent testament to the lost mastery of the ancients. \nThough much of the city has been looted and its grandeur stripped away by time and greed, remnants endure. Scattered fragments of scrolls and brittle pages, preserved in forgotten vaults, have yielded small pieces of knowledge just enough to be of use to me. These walls, like those found in other great ruins, hum with the same silent energy smooth beneath the hand, cold as the grave, and utterly impervious to the ravages of time."

blackstone.1e:0 "Eylria the Jewel of the Sea a small yet stunning Valyrian isle renowned for its beauty, wealth, and strategic importance. Founded not long after the rise of the Valyrian Freehold, it quickly blossomed into a thriving center of trade and commerce. Over the centuries, it has become one of the most prosperous cities in North Valyria, a key player in the mercantile routes of the region and once, a formidable contender in the brutal slave markets of Slaver's Bay. \nAt the heart of Eylria stands its most magnificent landmark, the Dragon Palace. This grand structure, forged like so many others from fused Dragonstone, once served as a regional seat of governance during the golden age of Valyria. Now, it is the residence of Eylria's Duke a noble who presides over the isle with the authority passed down through generations since the Freehold's fall. \nThe palace, with its sleek black towers and impossibly smooth walls, reflects the same ancient craftsmanship found across Valyria's ruined provinces. Though its purpose has changed, its majesty endures, untouched by time or decay.If fortune favors us, we may one day return and request an audience with the Duke. With their permission, we might delve into the isle's records and oral histories perhaps unearthing more about Eylria's past, its role in the Freehold, and the legacy of those who once ruled from its obsidian halls."

blackstone.1f:0 "Volantis the First Daughter of Valyria. stands proud and ancient along the banks of the Rhoyne, its great Black Walls still casting long shadows over the city. Once, in the chaos of the Century of Blood, Volantis declared itself the rightful heir to the fallen Freehold, styling its ambitions as the Second Coming of Valyria. Though those dreams of empire eventually withered, the echoes of that bold claim still linger in every stone and street. \nThis Free City capital is a place steeped in deep and complex history. Its avenues are paved with the ambitions of conquerors and the blood of slaves. Within the Black Walls the inner sanctum where only those of pure Valyrian descent may dwell stands the ancient architecture of the old world towers, bridges, and halls shaped from fused Dragonstone, as cold and smooth as the ruins scattered across Valyria itself. \nHere, the past refuses to fade. Every inch of Dragonstone whispers of a time when dragons flew above and sorcery ruled the earth. Volantis may no longer aspire to rule the world, but it remains a living monument to the legacy of the Freehold its pride unbroken, its traditions carefully guarded, and its ancient stones unyielding to the touch of time... "

blackstone.1g:0 "Ergoria known to some as Kastaryia is the westernmost isle of the Valyrian Peninsula, a windswept land where sea mist clings to jagged cliffs and ancient legends whisper through the stones. Remote and shrouded in secrecy, the isle is home to the famed Tower of Lyria, a solitary spire crowned by an ever-burning flame said to have burned without end since the days before the Doom. \nTo the outside world, Ergoria is a place of mystery a beacon for scholars, mystics, and seekers of arcane truth. While many see it as a place steeped in magic, others regard it as a sanctum of higher learning, where the esoteric arts and occult sciences are studied away from the politics and chaos of the mainland. \nMuch remains unknown about this enigmatic isle. Its history is fragmented, its lore guarded closely by those few who dwell within the tower's shadow. Yet one thing is certain like all places touched by the hand of Valyria, Ergoria bears the signature of fused Dragonstone. The walls of the Tower of Lyria, impossibly smooth and bitterly cold to the touch, remain unscarred by time another silent testament to a lost age of power and wonder. What lies beneath those stones, or within the minds of those who walk its halls, is a mystery perhaps better left undisturbed… at least for now."

blackstone.1h:0 "Tyrosh, once a humble outpost on the edge of the Valyrian Freehold, has long since grown into one of the great Free Cities of the world a bustling metropolis of trade, color, and conflict. Yet beneath its vibrant surface lies the quiet weight of its origins, carved quite literally into the very foundations of the city. \nThe ancient walls of Tyrosh, constructed during the early expansion of the Freehold, still stand tall, dark, and strangely silent. Forged from fused Dragonstone, their texture and hue are nearly identical to those found in the heart of Old Valyria and its surrounding provinces. Smooth, cold, and untouched by centuries of weathering, the stone feels less like the work of mortal hands and more like something poured and shaped by the will of fire and sorcery.\n \nAnd yet, something about Tyrosh feels… different. It is as though the city is a reflection a near-perfect replica of greater sites left behind by the Freehold, yet somehow lacking their soul. The Dragonstone here, while identical in composition, seems disconnected from the grand legacy it imitates. One might call it a strange echo, or even a counterfeit proof of the Freehold's reach, but not necessarily of its full glory. Still, Tyrosh remains a living city, while much of Valyria lies in ash. These ancient walls may yet yield clues about how and why the Valyrians shaped their empire the way they did and whether all their works were truly equal beneath the surface."

blackstone.1i:0 "Dragonstone once a modest outpost at the far reaches of the Valyrian Freehold grew to become one of its most revered and enigmatic holdings. Perched upon a jagged volcanic isle at the edge of the Narrow Sea, it was seen by many as a holy place, particularly by those who served and followed the lineage of House Targaryen. \nAfter the Doom, Dragonstone became far more than a distant stronghold it became a sanctuary, a seat of power, and the cradle of the last dragonlords. For the Targaryens, it was not just a fortress, but a symbol of divine right and destiny. From its ominous silhouette to its fire-warmed halls, the island pulses with ancient power. \nBeneath the shadow of the Dragonmont the great volcano that looms over the island lie the legendary dragonpits, where mighty beasts once roared and slept, waiting for the call of their riders. These cavernous vaults, like the fortress above them, are carved from fused black stone, the signature material of Valyrian sorcery and mastery.The architecture of Dragonstone is striking eerie and magnificent. The towers are shaped like dragons; the halls are adorned with carvings so intricate, so vividly lifelike, that one might believe the stone itself breathes. It is whispered by some that with only the slightest whisper of a spell, these monuments might stir and awaken, as if the magic that forged them still lingers in their cold veins. \n \nDragonstone endures as more than a fortress it is a monument to a forgotten empire, a shrine to fire and blood, and perhaps the last place in the world where the old Valyrian legacy remains not in ruin, but in waiting."

stone.1:0 "I have Collected my evidence now for analysis"

blackstone.2_t:0 "Blackstone Studies"
blackstone.2_desc:0 "I have taken note of every known site where Blackstone has been mentioned ruins, vaults, shattered keeps, and forgotten altars. Each one whispers fragments of a larger truth, scattered across time and terrain. \n \nNow comes the harder path I must investigate each location in turn. The cost will be great coin, time, and perhaps blood but the potential reward is greater still. If the secrets of Blackstone's creation can be uncovered, they could reshape not just this expedition, but the world itself. \n \nWhat was forged once can be forged again... if only I can learn how."

blackstone.2a:0 "I have all i need"
blackstone.3_t:0 "Choice of What I am to Do"
blackstone.3_desc:0 "I've gathered everything I can notes, scraps, stories whispered in half-truths. I've chased every lead, no matter how obscure or expensive. And now, I think I'm finally ready to begin. \nFrom what I can tell, I've got four paths ahead of me. \nThe Citadel the scholars, with their endless books and their locked doors. znFaith the idea that this stone is sacred, touched by something higher. \nOccultism the darker stuff… symbols, blood, whispers in the dark. \nAnd… Geology? \nI'm not even sure what that one is. Something to do with rocks, maybe. Dirt? Doesn't sound like much, but it keeps coming up. \nFour choices. No clear answer. But if I want to learn how Blackstone is made, I'll have to start somewhere."

active.01:0 "The Citadel"
active.2:0 "The Occult"
active.3:0 "The Faith"
active.4:0 "Geology?? The heck is Geology??"

blackstone.5_t:0 "The Grand Citadel"
blackstone.5_desc:0 "The mighty Citadel home to all the Maesters of Westeros, and the vast store of knowledge they've gathered over centuries. \nIf there's anywhere in the realm that might hold answers about Blackstone, it's there. Perhaps I could approach the Archmaester himself present my findings, make a case for the importance of this discovery. \nWith luck, he might agree to fund the mission and provide whatever records or insight they have on the subject. It's a risk, but one worth taking. The Citadel doesn't give freely… but when it does, its support can move mountains."

citadel.01:0 "Excuse me Guard i have a Meeting with the Archmaester"

blackstone.6_t:0 "The Archmaester"
blackstone.6_desc:0 "After hours of waiting in the cold, echoing hall of the Citadel surrounded by stone walls lined with books I wasn't allowed to touch a robed Maester finally appeared. Wordless, efficient, he gestured for me to follow. \nWe climbed a narrow spiral staircase, winding ever upward into the heart of the Citadel itself, until we reached the Archmaester's tower. The chamber was quiet, filled with the scent of parchment and old ink. \nThe Archmaester greeted me with a measured nod, eyes sharp and curious beneath heavy brows. He wasted no time. \nHe said the Citadel might be willing to fund my expedition might. But first, he wants everything I have every scrap of information I've gathered, every theory I hold, and exactly how I plan to carry out this mission,It seems if I want their support, I'll have to prove this mystery is worth their gold and their trust."

citadel.2:0 "This is the plan so far..."
citadel.3:0 "If you see this you're a Dirty Cheater shame on you"

blackstone.8_t:0 "Support Secured Now we Start"
blackstone.8_desc:0 "Now that we've secured funding and the backing of the Archmaester himself there's no time to waste. With the Citadel's support behind us, doors will open, supplies will flow, and questions once dismissed will finally be taken seriously. znWe should make all haste to begin this journey. The sooner we set out, the sooner we may uncover what has long been buried in shadow and silence. \n \nThe path ahead is uncertain but we no longer walk it alone."

citadel.4:0 "Gold is Most useful to our journey"
citadel.5:0 "I would request a few maesters instead"
ciatdel.6:0 "I think it's time we moved on"

blackstone.9_t:0 "I am Denied?!!"
blackstone.9_desc:0 "After laying out everything my findings, the scattered clues, the locations, the theories I looked to the Archmaester, hoping for curiosity… maybe even approval. \nInstead, he frowned. Deeply. \nHe leaned back in his chair, eyes cold and heavy with judgment. Then, with a sigh that carried more dismissal than disappointment, he spoke. \n"This is nonsense," he said. "A frivolous fairy tale dressed up as scholarship. You've wasted my time." \n \nBefore I could respond, he raised a hand. "Leave. Now. Or I'll have the guards escort you out." \nJust like that, the hope of Citadel support vanished crushed beneath the weight of tradition and skepticism. And yet, even as I turned to go, I knew I wasn't wrong, Let them laugh. Let them shut their doors. I will find the truth with or without them."

citadel.8:0 "I'll go but not Empty Handed"
citadel.9:0 "Well guess I wasted both our times...."

blackstone.7_t:0 "Turned away at the Gates"
blackstone.7_desc:0 "I asked the guard for entry to the Citadel once more, but he barely glanced my way. \n“Get lost,” he said gruffly. “No one wants you here. Move along.” \nI was stunned. After all I had done, all I had hoped for, I was shut out without a second thought. \nBut if they won't give me answers at the front door... maybe I can find another way in,The walls are high, but not impossible to scale. I've seen others slip past unseen. If I'm careful and quiet, maybe I can get inside and finally get the answers I came for. \nIt's dangerous. It's reckless. But if the Citadel won't talk, I'll make it talk one way or another."

citadel.6:0 "Maybe I should just move along then"
citadel.7:0 "If I'm Quick i can climb the wall and scurry inside before anyone notices"

blackstone.10_t:0 "Rejected but Carrying on"
blackstone.10_desc:0 "I was rejected but I won't let it break me. Their dismissal stings, but it only steels my resolve. \nIf the Citadel won't support my quest, I'll carry on without them. Their doors may be closed to me, but the path still lies ahead, and I intend to see it through, no matter the cost. \nThe answers I seek won't come from idle waiting or polite requests they demand action, courage, and persistence. With or without their help, I will uncover what I came for. This journey is mine to make, and I will not be turned aside."

citadel.10:0 "I shall carry on Alone but firm"

blackstone.11_t:0 "Breaking and Entering"
blackstone.11_desc:0 "Having scaled the outer wall under the cover of night and slipped past the guards unnoticed, I found myself within the stone heart of the Citadel. Shadows clung to every corner, and silence pressed in like a weight but I moved quickly, carefully. \nIn a quiet storage room, I discovered an old Maester's robe draped over a chair. It fit well enough. With the hood drawn low, I passed through the corridors unnoticed, just another grey-robed figure among many. \nI ascended the winding stairs toward the Archmaester's tower my heart pounding louder with every step. I wasn't here for revenge or recognition. I was here for what I needed to continue the notes, the scrolls, and if fortune favored me the gold required to fund the expedition they so foolishly refused to support. \n \nIf the Citadel would not offer its help willingly… then I would take only what I must."

citadel.11:0 "No this is Wrong I should leave"
citadel.12:0 "Grab it all as quick as I can"

blackstone.12_t:0 "Stolen Aspirations"
blackstone.12_desc:0 "I did it \nI grabbed everything I could scrolls, notes, sealed documents, even a small chest of gold all in a rush before the Archmaester returned. Every second felt like an hour, every creaking floorboard a warning. But I didn't stop \nWith my satchel full and heart racing, I slipped to the window where I'd tied a rope earlier, just in case \nNo time to think. No turning back, I lowered myself down the tower wall, the rope biting into my palms as I descended into the dark. The wind howled around me, and for a moment, it felt like the very stones of the Citadel were watching me go. \nOnce I hit the ground, I didn't look back ,I have what I came for. The knowledge. The coin. Everything I need to begin the expedition. The Citadel may never welcome me again but so be it. \nMy journey starts now."

citadel.13:0 "So it Begins"

blackstone.14_t:0 "The Occult"
blackstone.14_desc:0 "I have chosen to seek my answers from darker powers, those that dwell beyond the sight of reason and light. In secret, I summoned my witches and demanded they show me the way forward. Their voices, low and trembling, gave me four paths. The Black Obelisk, ancient and buried, said to hum with energy not of this world. A sacrifice of the body, pain given willingly to draw out what lies hidden. The Great Dark One, a nameless force that answers only to those desperate or foolish enough to call. And finally, if I hold one, the Valyrian Glass Candle, a relic of old fire and deeper shadow, capable of revealing that which should not be seen. These are the choices set before me, each steeped in risk, each promising a glimpse of the truth I seek."

occult.1:0 "I Shall Consult the Obelisk"
occult.2:0 "I Shall Consult the Offer of Blood and Body"
occult.3:0 "I Shall Consult the Great Dark One"
occult.4:0 "The Glass Candle shall show the way"

blackstone.15_t:0 "The Great Obelisk"
blackstone.15_desc:0 "As we gathered in the old courtyard its location known only to me, my witches, and a handful of trusted friends the night pressed in thick and silent. The stones beneath our feet were cold with age, untouched by the sun for years, and the air was heavy with the scent of old ash and damp earth. The ritual was ready. The circle was drawn. The sigils marked. \nThe chanting began, low and rhythmic, building like a tide. The flames of our torches danced wildly though there was no wind. Shadows shifted unnaturally, bending and twisting as if pulled by unseen hands. I felt it then a presence, slow at first, creeping along the edges of my thoughts. A darkness began to grip my mind, cold and slow and absolute. \nMy breath caught in my chest as my vision blurred, then narrowed... then faded. Not into silence, but into something worse an oily blackness, thick and endless, without sound or shape. It swallowed me whole. \n \nUntil..."

occult.5:0 "CALL IT OFF!!!!"
occult.6:0 "I feel it's POWER!!!!"

blackstone.16_t:0 "The vision of Lament"
blackstone.16_desc:0 "As my vision turned to black, I felt it something vast and ancient brushing against the edges of my mind. Then came the colors, swirling through the darkness like smoke through water violet, green, gold, shifting and pulsing with meaning. Shapes formed, symbols I had never seen yet somehow understood. And then clarity. The answers I had long sought were there, not spoken, but revealed, etched into the fabric of that endless void. It had worked. Whatever force we had called upon, it had listened. I awoke gasping, drenched in sweat and shadows, but my thoughts burned bright with purpose. We cleared the courtyard in silence, no words spoken among us each of us knowing something had changed. We returned home before dawn, our path now illuminated. It was time to chart our next move."

occult.7:0 "It is Done!"

blackstone.17_t:0 "The Dark One..."
blackstone.17_desc:0 "We gathered at the waterside of a still, hidden pond, tucked deep within the woods where no road reached and no bird dared sing. The trees leaned close, as if listening. We lit our candles, their flames trembling in the still air, and laid our offering upon the weathered stone altar. The carving was precise, deliberate every mark a vow. As the blade did its work, blood spilled in slow ribbons, trailing down the stone and into the waiting water below. At first, all was silent. Then came the rumble a low, distant growl that seemed to rise from the earth itself. The pond began to ripple, darkening, thickening, as the sense of foreboding deepened. And then it emerged. The Great Dark One. Its form was vast and shifting, a mass of writhing tentacles rising from the water like a nightmare made flesh. I felt my mind quake beneath the weight of its presence, as if my thoughts might shatter just by knowing it was real. My knees buckled. The very air trembled with its breath. I could barely stand beneath that crushing, alien gaze... but then...."

occult.8:0 "RUN BEFORE WE ALL DIE!!!"
occult.9:0 "Master we Ask for a Gift of Knowledge"

blackstone.18_t:0 "A Master's Blessing"
blackstone.18_desc:0 "I felt him speak not in words, but as a presence that poured directly into my mind like molten iron through the cracks of my soul. His voice was a scream forged from splitting anvils, a sound that should have broken me but instead, I wept. Not from fear, but from reverence. The longer I listened, the more the screeching became something else harmonies layered beneath the chaos, a voice not monstrous, but angelic. In his essence, I felt the veil lift. I was not told how to make the Blackstone no formula, no tool, no fire but I understood it. What it is. What it wants. Why it endures when all else crumbles. The knowledge is not mine to forge yet, but it lives inside me now, shifting like flame, waiting. I know its weight. I know its will. I know what it's meant for. Praise his name for I have seen the shape of truth, and I am forever changed."

occult.10:0 "Praise the Master!"

blackstone.19_t:0 "The Reaping"
blackstone.19_desc:0 "I felt him speak not in words, but as a vast and formless presence that poured into my mind like molten iron forced through fractured bone. His voice was agony itself, a scream born from splitting anvils and collapsing stars, tearing through my thoughts with a sound that defied reason. Then I felt it truly felt it his presence, not distant but within, pressing down like an ocean of shadow. My thoughts buckled, my memories cracked. My mind was no longer my own just pulp beneath the weight of something ancient, endless, and utterly indifferent. I could feel myself unraveling, soul first. My body followed. Bones snapped like dry twigs, flesh peeled away, devoured not by teeth, but by something colder, deeper hungrier. I was nothing but offering now. And in that final moment, as darkness swallowed me whole, I understood to be seen by the Great Dark One is to be claimed. There is no communion. Only consumption."

occult.11:0 "What have I done....."

blackstone.20_t:0 "Visons from the Candle"
blackstone.20_desc:0 "As we gathered at the summit of the tower within my castle, the wind howled like a warning around us, pulling at our cloaks and whispering omens through the stone. We formed a circle around the Glass Candle an artifact of Valyria, pulsing faintly with an inner light that flickered like a heartbeat. Its obsidian surface shimmered with the promise of hidden truths, but it would not reveal them freely. The candle could show us what we seek visions, secrets, perhaps even the missing pieces we so desperately need but only if we succeed in the ritual. The air was thick with tension, the scent of ash and old magic hanging heavy as we began. One misstep, and it might all be for nothing... or worse. "

occult.12:0 "The Light of the Glass shall shine the way"

blackstone.21_t:0 "The Faith shall guide me"
blackstone.21_desc:0 "I gathered myself in the quiet solitude of the garden, seeking stillness amid the storm of my thoughts. It was there, beneath the open sky, that a sudden thought entered my mind The Gods. They must be able to help. My faith remains unbroken, unshaken through all trials, and now, more than ever, I feel its strength burning steady within me. I walked to the base of the great ash tree, its ancient roots twisting deep into the earth, its branches like outstretched arms to the heavens. There, I knelt in silence, the weight of my purpose heavy on my shoulders. I looked up, heart open, and spoke not with doubt, but with certainty. I called out to [ROOT.Char.GetFaith.HighGodName], the highest of the divine, and asked my question with reverence and hope. They must hear me. They will hear me. My faith has never faltered and I know, in this moment, I am not alone."

relig.1:0 "I call out to Thee hear my prayer!"

blackstone.22_t:0 "Answers in the Dark"

relig.0a:0 "I said my prayers beneath the boughs of the great ash tree, my voice steady, my heart laid bare to the heavens. I asked for guidance nothing more. A sign, a whisper, a single breath of divine will to show me the path ahead. I waited, eyes closed, trusting that the Seven would answer me, as they always had in my time of need. \nThen I felt it. \nA calm unlike any I had ever known washed over me, silencing the noise of doubt and fear. My mind cleared, as if a veil had been lifted, and in that stillness, I saw it not with my eyes, but with certainty. I knew. Without question. Without hesitation. The Seven had answered. My next steps revealed themselves to me with perfect clarity, as though they had been waiting all along. The path is before me now, and I will walk it, faithful and unafraid."

relig.0b:0 "I gathered in the courtyard as the sun dipped low over the horizon, its golden light casting long shadows across the worn stones. This was not a place of old darkness, but of warmth, rhythm, and reverence. I had prepared offerings of fruit, incense, and carved wood tokens of beauty and balance, as the Summer Islanders would give. I knelt before the small altar I had built in their image, the gods of the isles those who sing and those who listen and bowed my head in respect. The air was thick with the scent of burning spices, and the soft beat of drums echoed in my memory. I called upon the gods of the Summer Isles not for conquest, but for clarity. For guidance. For harmony between spirit and purpose. Theirs is not a faith of fire or fury, but of wisdom through understanding, through music, through love and light. I offered my words with humility, and waited for the calm to take me. If they would answer, they would do so in peace, not thunder. And so I listened."

relig.0c:0 "I gathered in the courtyard beneath the pale, watching moon, the stones cold beneath my feet and the air thick with silence. Around me, the shadows stretched long, as if leaning in to witness what was to come. I stood at the center, prepared ready to offer my sacrifice to the Old Dark Ones. Tonight, I would call upon the Great Master, the one who stirs beneath the veil of night, the one who listens when all others turn away. With the blade in hand and the offering laid bare, I raised my voice into the stillness, letting it echo into the forgotten corners of the world. I called out to them beyond name, beyond time offering blood and devotion, in exchange for answers no mortal was ever meant to hold. The ritual had begun, and now, all I could do was wait... and hope the Great Master would answer."

relig.0d:0 "I stood beneath the open sky, the Sea of stars above me, bare to the wind and the eyes of the gods. There are no walls between a man and the Great Stallion no stone temples, no burning incense, only sky, blood, and strength. In the center of the courtyard I had cleared the ground, scattered horsehair and bone, and set my blade in the earth. The Great Stallion watches all riders, and if he deems one worthy, he shows the path with fire and fury. I spoke no prayers, for the Dothraki do not beg their gods they prove themselves. I raised my voice to the night, calling out not in supplication, but in challenge. I offered my sacrifice blood spilt clean into the dust and asked for vision, for guidance, for the strength to ride the path ahead. The wind shifted. The stars pulsed. In the stillness that followed, I waited, knowing the gods of the Great Grass Sea do not whisper... they answer in omens, in storms, in hoofbeats from beyond the world."

relig.0e:0 "I gathered in the courtyard beneath the watchful gaze of painted idols, each one a mask of divinity smiling, frowning, weeping, devouring. The Court of the Hundred Gods is vast, unknowable, and eternal. Their temples rise like mountains in Yi Ti, their names sung by priest-kings and whispered by peasants alike. Here, far from the Jade Sea, I lit a hundred candles one for each god I knew, and many I did not. Incense curled through the air in sacred spirals, thick and perfumed with ancient oils. I stood before the largest idol the Lion of Night, whose cold gaze has never blinked my sacrifice placed at its feet silver, silk, and blood, for balance. I spoke the invocation not in prayer, but in ritual, each word weighed carefully, each syllable a step deeper into mystery. The gods of Yi Ti are not easily stirred. They do not offer blessings without price. But if even one hears me one voice among the court then I may be shown the path I seek, veiled though it may be in shadow and prophecy. I closed my eyes and waited, knowing that within the courts of divinity, silence is not always refusal… it is judgment."

relig.0f:0 "In the quiet of the courtyard, I offered tribute to the countless gods worshipped across the Free Cities. To the Drunken God, I poured wine in reverence for chaos and revelation. To Semosh and Selloso, I gave blood, honoring their lesson of rebirth through sacrifice. I knelt in silence before the Pattern, the faceless truth behind all things, and left sweetness and scent for the Pearl of the Divine. A darkened coin followed for the Many-Faced God, death's ever-changing mask. Each god, each cult, speaks its own truth some through pleasure, others through pain, and some through nothing at all. They do not agree, and yet, they coexist in the crowded temples and alley-shrines of the Free Cities, woven into the lives of all who dwell there. \n \nI did not come seeking one truth, nor pledging myself to a single deity. I came to listen to witness. And in their contradictions, I found something deeper than doctrine a shape, a thread, a meaning that spans between them. No one god will guide me, but through all of them, I feel the path begin to take form. Not clear, not easy but real. In honoring them all, I may find the wisdom I need to move forward."

relig.0g:0 "In the clearing beneath the ancient weirwood, its red leaves whispering secrets only the wind could understand, I knelt in silence. No idols stood here. No temples, no priests only the gods of stone and stream, root and sky. These are the gods of my ancestors, the ones the First Men knew before the Pact, before the faces were carved and the Children gave them names. I pressed my hand to the earth and felt the pulse of life beneath it cold, slow, endless. I offered no chant, no coin, no blood just presence. Just breath. The Old Gods do not speak in words, but in the rustle of leaves, the silence of snow, the call of wolves in the distance. They are watching. They have always watched. \n \nI did not ask for favor. I did not bargain. I simply listened, as my forebears once did when their blades were bronze and their laws were carved in bark. These gods are not kind or cruel. They are truth raw, unmoving, eternal. They remember every drop of blood spilled on the soil, every oath sworn beneath their boughs. And as I rose, the wind shifted, and for a moment I felt something ancient stir not approval, but recognition. I walk the path alone, but not unseen. The Old Gods have no names, but they do not forget."

relig.0h:0 "Beneath a sky choked with smoke and stars, I lit the brazier with dragonflame and knelt before the altar of cracked obsidian. These were no gods of mercy or comfort. These were the gods of Old Valyria twisted by fire, crowned in blood, their names lost in the Doom. No temple remains to honor them, no priest chants their rites. But I felt them in the heat, in the way the flame bent unnaturally, in the taste of copper on my tongue. These were gods forged in conquest and bound by sorcery gods who did not forgive, only remember. I offered my blood to the fire, and it hissed like a living thing. The air grew heavy. Something unseen stirred. \n \nI did not call them by name I could not. Their true names are gone, burned with their empire, whispered only by dragons in dreams. But I offered reverence in the oldest way pain, heat, silence. And in return, I felt a presence not divine, but watching. These were not gods who answered with words, but with visions carved into firelight and bone. They demand strength, blood, and fire, not faith. And as the smoke curled into the night sky, I knew they are not dead. Just waiting in the ruins, in the bloodlines, in the fire. Always in the fire."

relig.0i:0 "I knelt by the quiet river, where reeds swayed gently in the wind and the water flowed clear and slow, like a whispered lullaby. There was no altar here, no flame or stone only the earth beneath me and the sky above. That was enough. I spoke softly to the Great Shepherd, voice low so as not to disturb the stillness. His is not a god of thunder or judgment, but of patience, of kindness, of quiet strength. I laid my offering upon the grass a handful of grain, a woven cloth, and the promise of mercy where I might otherwise give wrath. The Shepherd watches over his flock, even when they stray. Especially when they stray. \n \nI asked not for power, but for guidance. For the strength to protect, not destroy. To endure, not dominate. In this harsh world where so many gods demand blood, the Great Shepherd asks only that we tend to life, to peace, to one another. I felt no fire or vision, only warmth, like the sun filtering through clouds. A peace settled over me, deep and still. And I knew he had heard. He always does. For every soul, lost or wandering, is still part of his flock."

relig.0j:0 "I stood at the foot of the old war-altar, where red stone drank in the light like drying blood. No songs were sung. No prayers whispered. The Lady of Spears does not listen to words only action. She is the blade that drinks deep, the scream on the battlefield, the silent moment before a killing blow. I drove the spearpoint into the offering laid before me a beast slaughtered not for food, but for honor. Its blood pooled at my feet, and I offered it freely. Not out of mercy, but because she demands it. In Ghis, they carved her name into the bones of the conquered. Her glory is not peace, but dominance. \n \nI raised my eyes to the sky, fists bloodied, heart steady. I did not ask for victory. I promised it. In return, I asked only that she see me not as a supplicant, but as a soldier in her name. I felt it then, as the wind kicked dust from the stones a presence, sharp and silent, like a blade at my throat. The Lady of Spears had no need to speak. Her favor is not given in blessings. It is earned in conquest, and kept in blood. I left the altar without fear. She walks with me now. I will not falter."

relig.0k:0 "In Qarth, the gods wear masks of silk and speak through the tongues of great houses. I stood at the center of that jewel of illusions, surrounded not by temples but by powers the Undying, the Pureborn, the Thirteen, each a house unto itself, each guarding its secrets like holy flame. They call Qarth the greatest city that ever was or will be, and perhaps they're right there is a strange divinity here, not born of heaven, but of wealth, vision, and shadow. I sought audience with them all the Warlocks in their dark tower, who speak in riddles and visions; the Pureborn, who rule from marble halls older than memory; the Spicers, who whisper futures in perfumes and poisons. No priests just power cloaked in ritual. \n \nEach house offered something. A promise. A warning. A lie dressed as truth. The House of the Undying showed me visions I could not name, images burned behind my eyes even now. The Thirteen offered gold and ships, but demanded something deeper allegiance. The Pureborn turned their painted faces toward me, unmoved, as if to remind me Qarth remembers everything. This is not a city of gods, but of living myths each house a shrine, each lord a prophet of his own making. I came for answers, but in Qarth, answers are currency, and the cost is never what you expect."

relig.0l:0 "I stood at the edge of a quiet river, its waters silvered by moonlight, and let my hands fall into the current. I whispered no names for the names are gone, scattered with the winds that once stirred the grasses of the Silver Sea. But I remembered the rhythm. The Liturgies those ancient songs sung by priest-kings and Fisher Queens still live in the bones of the earth and the breath between stars. They worshipped the Hundred Gods, each a reflection of some forgotten truth a reed in the wind, the glint of light on water, the sound of oars in perfect time. There were no temples then. The rivers were their sanctuaries, the sky their dome. And so I offered only silence, letting the water carry my reverence downstream. \n \nI thought of the Fisher Queens, who ruled not with blades, but with prophecy and peace. It is said they could speak to the gods, or perhaps they were the gods daughters of the river, mothers of time. I felt their memory stir in the water, soft and cold. No fire. No voice. Only understanding like a dream you forget the moment you wake, but somehow still carry. These gods do not demand. They remember. They drift beneath the surface of time, waiting for someone to sing to them again. And tonight, if only for a moment, I did."

relig.0m:0 "I stood at the river's edge as the sun sank low, painting the wide waters in gold and grief. The current moved slow and steady, wide as a kingdom, old as the stars. This is her face, her breath Mother Rhoyne. The great river who sees all, who remembers every city that once lined her banks, every child that bathed in her warmth, every cry for mercy drowned beneath her waters. I knelt and dipped my hands into the stream, not to drink, but to feel. She does not demand blood. She asks only for memory for reverence. I spoke her name softly, as the Rhoynar once did, and offered a flower, a tear, a secret. She is not a god of thunder or flame. She does not conquer. She endures. \n \nThey say her voice comes in dreams, or in the ripple of water across stone. I heard nothing but I felt known. As if the river saw through me, and did not flinch. As if my sorrow, my doubt, my longing, all flowed into her and vanished without judgment. In the days of glory, they say she crowned queens, healed wounds, and sent visions through river-priests. Now, only silence remains. But I know she is still here. Beneath the reeds, beneath the ruin, beneath the skin of the world. Watching. Remembering. Waiting for her children to return not with armies, but with song."

relig.0n:0 "I journeyed south, past the last charts and beyond the reach of known winds, until the stars themselves changed and the air grew thick with incense and song. In the Southern Isles of the Jade Sea, faith is not whispered it is worn, danced, bled, and sung. The Orders there are many, each more ancient than the last. In the temples of the Isle of Elephants, stone priests chant to gods shaped like beasts with seven trunks, their words winding like vines through the minds of the faithful. On the Isle of Whips, truth is found through pain suffering seen as a sacred offering, every lash a question, every scar a step toward understanding. These are not religions of mercy or fear. They are paths ritualized, winding, and absolute. \n \nI stood beneath their carved towers, veiled in silks and sigils I did not know, and offered what I could breath, patience, silence. The gods here are not named in any tongue I understand, but I felt them watching through masks, through firelight, through the rhythmic pulse of drums that echoed like heartbeats across the water. One Order taught that life is illusion, another that it is a blade to be sharpened with every choice. I did not seek to belong I came to witness. And what I witnessed was a truth untouched by the Seven, by R'hllor, by even the gods of Valyria. These gods did not offer comfort. They offered awakening slow, strange, and irreversible."

relig.0o:0 "I walked beneath the boughs of the weirwood grove, where no axe had ever fallen, and the ground itself felt older than stone. This was not a battlefield, though once it had been. This was where they came together the First Men and the Children of the Forest to end their war and forge something older than any crown the Pact. There were no scrolls. No signatures. Just the whisper of leaves, the stillness of water, and the watching eyes of the old white trees. Here, blood met root, and something changed forever. The First Men bent the knee not in submission, but in reverence. In return, the Children offered peace, and the trees opened their eyes to new prayers. The Old Gods, who had once spoken only to the greenseers, now listened to men. \n \nI knelt in that same grove, so many lifetimes later, and placed my hand on the earth. No one spoke. But I felt it that ancient silence, full of memory. The Pact was not just a truce. It was a transformation. A binding not of law, but of spirit. It was the first true act of faith between two peoples who had known only blood. The weirwoods still bear witness. Their faces still weep for those who forget. And as I rose, I knew what was once sworn in root and bone is not forgotten. The land remembers. And the gods still watch."

relig.0p:0 "In the stink of low tide, I sat by a fire of driftwood and bone, surrounded by men who no longer spoke their names. Here, in the Basilisk Isles, the gods do not wear crowns or robes they crawl, they whisper, they hunger. Their prayers are sung in broken tongues and wine-wet voices, strung together by sailors and slavers who've forgotten what true gods ever were. The locals call them shanties, but they're more than songs. They're warnings, wrapped in rhyme. There's one for the Salt-Blood King, who drowns the wicked and the willing alike. Another for Mother Rot, whose kiss turns flesh to sores and whispers to madness. They chant of the Drowned Wyrm beneath the reefs, who sleeps in silence until fed a tongue. There's even one about the stone men men who dream beneath the ruins of Gogossos, waiting to rise again when the last sane breath is drawn. \nI listened, and the songs began to seep into me half myth, half memory. These are not beliefs that ask for worship. They ask for fear, and respect, and sometimes flesh. There are no temples here, no sermons. Only rhymes, cuts, and strange tattoos. I did not dare mock them. In a place where the jungle swallows cities and ghosts walk the shore, even a song can be sacred. And as I left that fire, I found myself humming one of those shanties, low and quiet, as if something in the dark might be listening... and pleased."

relig.0q:0 "I stepped into the temple at dusk, where sunlight melted through silken veils and every breath carried the scent of myrrh, rosewater, and desire. This was no place of blood or terror, but of warmth of skin, of song, of whispered prayer wrapped in laughter and longing. The Temples of Summer and Love ask for no pain, only presence. Here, the divine is found in the curve of a shoulder, in the joining of voices, in hands offered without shame. I lit a candle at the foot of the altar, where fresh blossoms bloomed daily, and gave thanks not for war or wisdom, but for beauty, touch, and the sweet ache of being alive. These gods are not jealous. They do not command. They invite. And to worship is to accept. \nI spoke no name. In places like Lys, the gods of love wear many faces the Pearl of the Divine, yes, but also the unnamed spirits of moonlit waters and morning skin. I laid my offering gently a carved comb of fine bone, a song hummed low, and a kiss pressed to the temple floor. Around me, dancers moved like flame, and the music rose like prayer. There was holiness here, no less true than any fire god or weeping tree. A holiness born not of fear, but of giving. And as I left, I felt lighter, as if the gods had smiled not because I was devout, but because I had felt."

relig.0r:0 "The sea was dark and silent when I stood upon the cold stone of Ib. Around me, whale-bone idols loomed in the mist, their features worn and ancient. The Ibbenese gods are not prayed to with joy or light they are old things, fed with blood, salt, and bone. I watched the locals perform their rites slow, grim, and wordless. Their gods are not meant to be understood, only endured. \n \nI brought no offering. These gods ask for nothing but silence and survival. They dwell in the cold deep, in whale bones and winter winds. The Ibbenese do not beg they endure. As I left, I felt the weight of the sea behind me, as if something vast had noticed me… and decided, for now, to let me go."

relig.0s:0 "The sea crashed against the rocks as I stood barefoot on the shore, salt and wind in my lungs. Here, faith is not soft it is the Way. The Drowned God waits below, cold and merciless, but loyal to those who give him what he asks salt, storm, and steel. His priests say he gave the sea to the Ironborn and takes back the worthy when their time is done. I offered seawater to the waves and listened. There was no answer, only the roar. \n \nBut there is another the Storm God, his eternal enemy, who lashes ships with wind and tears drowned men from their graves. He is the wave that drowns, the gale that breaks sails. Some curse his name, others whisper it when thunder rolls. Between them lies the truth of the sea beauty and terror, wrath and reward. I came not to choose between them, but to accept the sea in all its faces and in doing so, perhaps, survive it."

relig.0t:0 "Oh. So that's your choice. The Others. Out of every god, spirit, and ancient power across this wide, bleeding world you've decided to take your precious questions about Blackstone to the white-faced, baby-stealing, death-walking nightmares from the edge of time. Brilliant. Absolutely inspired, Did the fire gods not answer fast enough for you? Did the deep sea monsters feel too chatty? No better to go ask the ice wraiths whose entire vocabulary consists of cracking bones and freezing screams. What do you think they'll do? Draw you a map in frost? Whisper the secrets of obsidian between their gnashing teeth? \nThey don't talk. They don't care. They don't teach. They unmake. You're not standing in front of some forgotten oracle you're knocking on the door of the end of all things, clutching a notebook like it matters. Honestly, it's impressive. Not wise, not brave just impressive in the way a man jumping into a frozen lake with stones in his pockets is impressive. \n \nBut sure. Go on. Ask them. I'm sure the cold will answer."

relig.2:0 "Praise be, The Answer is Clear!!!"

blackstone.23_t:0 "The Lord of Light"
blackstone.23_desc:0 "We have gathered tonight beneath open sky and rising smoke, drawn by fear, by faith, and by the promise of fire. Before us, the pyre waits dry wood soaked in oil, bound tight with rope, crowned with the offering we give to the Lord of Light. The air hums with tension, and the torches flicker, as if eager to feed the blaze. We chant as the fire takes, our voices rising with the flames, for the night is dark and full of terrors, and only his light can drive them back. This is not just ritual. This is devotion, raw and scorching. The screams are not a cruelty. They are prayer. \n \nWhen the fire is high enough to kiss the stars, we look into it truly look. The flames twist, dance, reveal. The uninitiated see only smoke. But those touched by R'hllor feel the shift, the pull, the truth hidden in the heat. Visions flicker behind the eyes a road, a battle, a crown, a death. They come fast, and not all are kind but they are guidance all the same. The Lord of Light does not coddle. He chooses. And tonight, in the crackling heart of the blaze, we see the next step on the path he lays before us. Whether it leads to glory or ruin is not ours to ask. Ours is only to obey."


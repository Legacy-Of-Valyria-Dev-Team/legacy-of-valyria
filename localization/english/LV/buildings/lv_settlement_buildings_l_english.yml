 #Colony Buildings
  building_type_local_markets_01:0 "Local Markets"
  building_type_local_markets_01_desc:0 "A network of bustling marketplaces where merchants peddle their wares, farmers trade their harvests, and artisans sell their crafts. These markets form the economic heart of the settlement, ensuring a steady flow of goods, coin, and prosperity."
  building_local_markets_01:0 "Local Markets"
  building_local_markets_01_desc:0 "A network of bustling marketplaces where merchants peddle their wares, farmers trade their harvests, and artisans sell their crafts. These markets form the economic heart of the settlement, ensuring a steady flow of goods, coin, and prosperity."

  building_type_local_militia_01:0 "Local Militia"
  building_type_local_militia_01_desc:0 "A loosely trained force of able-bodied townsfolk, armed with whatever weapons can be mustered. Though no match for professional soldiers, these militia serve as the first line of defense against raiders, bandits, and other threats to the settlement."
  building_local_militia_01:0 "Local Militia"
  building_local_militia_01_desc:0 "A loosely trained force of able-bodied townsfolk, armed with whatever weapons can be mustered. Though no match for professional soldiers, these militia serve as the first line of defense against raiders, bandits, and other threats to the settlement."

  building_type_stockades_01:0 "Stockades"
  building_type_stockades_01_desc:0 "A simple but effective fortification, consisting of wooden palisades. While not impervious to a determined assault, stockades provide much needed security against sudden attacks and help maintain order within the settlement."
  building_stockades_01:0 "Stockades"
  building_stockades_01_desc:0 "A simple but effective fortification, consisting of wooden palisades. While not impervious to a determined assault, stockades provide much needed security against sudden attacks and help maintain order within the settlement."

  building_type_construction_guilds_01:0 "Construction Guilds"
  building_type_construction_guilds_01_desc:0 "A coalition of skilled masons, carpenters, and engineers dedicated to improving the settlement’s infrastructure. With their expertise, buildings rise faster, stronger, and more efficiently, shaping the foundation of future growth."
  building_construction_guilds_01:0 "Construction Guilds"
  building_construction_guilds_01_desc:0 "A coalition of skilled masons, carpenters, and engineers dedicated to improving the settlement’s infrastructure. With their expertise, buildings rise faster, stronger, and more efficiently, shaping the foundation of future growth."

  building_type_colony_quarries_01:0 "Quarries"
  building_type_colony_quarries_01_desc:0 "Easily-accessible quarried stone provides building materials for nearby constructions."
  building_colony_quarries_01:0 "Simple Stone Quarries "
  building_colony_quarries_01_desc:0 "Easily-accessible quarried stone provides building materials for nearby constructions."

  building_type_colony_forestry_01:0 "Forestries"
  building_type_colony_forestry_01_desc:0 "Large amounts of lumber, resin, charcoal, and other resources are harvested from these forests, providing an excellent, nearby source of building material for the surrounding towns"
  building_colony_forestry_01:0 "Logging Camps"
  building_colony_forestry_01_desc:0 "Woodcutters have set up camp along the outskirts of the forest, ensuring a steady production of logs."

  #Blockers
	lv_wilderness_blocker_effect:0 "@warning_icon! #X This building is a blocker that must be cleared by fully upgrading it before the settlement can be turned into a proper holding#!"

  #Caves
  building_type_unexplored_caves_01:0 "Unexplored Caves"
  building_unexplored_caves_01:0 "Uncharted Depths"
  building_unexplored_caves_01_desc:0 "Dark, winding tunnels stretch beneath the surface, untouched by light or map. Whispers echo through the stone, and every step risks waking what lies hidden. The unknown reigns here, and danger is a certainty."
  building_unexplored_caves_02:0 "Marked Tunnels"
  building_unexplored_caves_02_desc:0 "Explorers have begun carving paths through the gloom. Crude markings and makeshift camps trace the edges of understanding, yet much remains cloaked in shadow. The threat is lessened—but not gone."
  building_unexplored_caves_03:0 "Surveyed Caverns"
  building_unexplored_caves_03_desc:0 "The caves have yielded their secrets. Paths are mapped, hazards catalogued, and stability achieved. Though caution still has its place, the subterranean wilds have been brought to heel."


l_english:
  # Braavos
  building_agot_EE_titan_of_braavos:0 "The Titan of Braavos"
  building_type_agot_EE_titan_of_braavos:0 "The Titan of Braavos"
  building_agot_EE_titan_of_braavos_desc:0 "Included by famed Westerosi scribe Lomas Longstrider as one of the Wonders Made by Man, the Titan of Braavos stands as the primary line of defense of the Free City of Braavos, guarding the narrow entrance into the lagoon in which the city resides. It is a massive statue of granite and bronze in the shape of a warrior, acting as both a fortress and a lighthouse. Murder holes beneath the statue's armored skirt and arrow slits all over its breastplate provide a near-impenetrable defense against enemy ships entering the lagoon."

  building_agot_EE_sealords_palace:0 "The Sealord's Palace"
  building_type_agot_EE_sealords_palace:0 "The Sealord's Palace"
  building_agot_EE_sealords_palace_desc:0 "The Sealord’s Palace is the home of the Sealord of Braavos. Below the domes and towers of the large palace, an exotic menagerie of birds and beasts from all over the world can be found."

  # Volantis
  building_agot_EE_black_walls_of_old_volantis:0 "The Black Walls"
  building_type_agot_EE_black_walls_of_old_volantis:0 "The Black Walls"
  building_agot_EE_black_walls_of_old_volantis_desc:0 "The heart of Volantis. Built by the ancient Valyrian Freehold, this giant wall of fused black stone protects a series of palaces, courtyards, towers, and temples. Only those of whom their blood traces back to Valyrian ancestry, the Old Blood, are allowed to dwell within it."
  
  building_agot_EE_volantis_harbor:0 "Volantis Harbor"
  building_type_agot_EE_volantis_harbor:0 "Volantis Harbor"
  building_agot_EE_volantis_harbor_desc:0 "Volantis’ might originates partly from its large harbour, especially due to its favourable geographical location. This vast crescent-shaped location is built right on the mouth of the Rhoyne and is said to be able to contain the entirety of Braavos within it."

  building_agot_EE_the_long_bridge:0 "The Long Bridge"
  building_type_agot_EE_the_long_bridge:0 "The Long Bridge"
  building_agot_EE_the_long_bridge_desc:0 "The Long Bridge joins the two halves of Volantis together and is the longest bridge in the known world. Built by Old Valyria in its prime out of fused stone, it is said to be able to support the weight of a thousand elephants."

  building_agot_EE_temple_of_the_lord_of_light:0 "The Temple of the Lord of Light"
  building_type_agot_EE_temple_of_the_lord_of_light:0 "The Temple of the Lord of Light"
  building_agot_EE_temple_of_the_lord_of_light_desc:0 "This enormous temple rises far above any other building in the city. Its dazzling golden, red, and orange colours make it a true sight to behold. Protected by the Fiery Hand, this temple serves R’hllor, the Lord of Light and it might be one of the biggest testaments to his might in existence."

  building_agot_EE_volantis_walls:0 "The Walls of Volantis"
  building_type_agot_EE_volantis_walls:0 "The Walls of Volantis"
  building_agot_EE_volantis_walls_desc:0 "Although not as impressive as those of Old Volantis, the walls of Volantis will make any attacker think twice about storming the city."

  # Rhoyne
  building_agot_EE_nymeria_palace_01:0 "Nymeria's Palace"
  building_type_agot_EE_nymeria_palace_01:0 "Nymeria's Palace"
  building_agot_EE_nymeria_palace_01_desc:0 "At the heart of Ny Sar lie the ruins of Nymeria’s Palace, abandoned since the Valyrian Freehold defeated Prince Garin in the Second Spice War. Its pink and green marble walls, towering domes, and grand spires now stand as a haunting shell of its former self. All life left this place when Nymeria fled to Dorne, leaving these once-proud halls to decay."

  building_agot_EE_nymeria_palace_02:0 "Nymeria's Palace"
  building_type_agot_EE_nymeria_palace_02:0 "Nymeria's Palace"
  building_agot_EE_nymeria_palace_02_desc:0 "Standing proudly once more in the heart of Ny Sar, Nymeria’s Palace has been meticulously restored, a testament to Rhoynish resilience and heritage. The vibrant green and pink marble gleams under the sun, while grande domes and soaring spires now dominate the skyline, almost erasing the memories of its tragic past."

  building_agot_EE_palace_of_love_01:0 "Palace of Sorrow"
  building_type_agot_EE_palace_of_love_01:0 "Palace of Sorrow"
  building_agot_EE_palace_of_love_01_desc:0 "The Palace of Sorrows stands as a sombre reminder of the fate that befell Chroyane, the Festival City. Its crumbling towers, covered in moss and dark vines, reveal none of the beauty the Palace of Love once embodied. Sunken statues and the stone men now haunt its foggy, ruined halls."

  building_agot_EE_palace_of_love_02:0 "Palace of Love"
  building_type_agot_EE_palace_of_love_02:0 "Palace of Love"
  building_agot_EE_palace_of_love_02_desc:0 "The Palace of Love graces the banks of the Rhoyne once more, a breathtaking revival of Chroyane's former glory. Its towers soar high, adorned with vibrant mosaics and delicate carvings that celebrate life, beauty, and love. Sunlight gleams off sparkling fountains that feed into the lush gardens, spilling flowers over every terrace. Under its grand domes, marriages are once again blessed; filling Chroyane with the promise of new beginnings."

  building_agot_EE_bridge_of_dream_01:0 "Bridge of Dream"
  building_type_agot_EE_bridge_of_dream_01:0 "Bridge of Dream"
  building_agot_EE_bridge_of_dream_01_desc:0 "Once rivalling the Long Bridge of Volantis, the Bridge of Dream now looms over the Rhoyne in thick fog. Its stone arches used to rise forty feet above the river, but have crumbled under dense moss and black vines. Now a place for the stone men, it stands as a silent, rotting monument to the Rhoynar’s lost pride."

  building_agot_EE_bridge_of_dream_02:0 "Bridge of Dream"
  building_type_agot_EE_bridge_of_dream_02:0 "Bridge of Dream"
  building_agot_EE_bridge_of_dream_02_desc:0 "The Bridge of Dream once again spans the Rhoyne in its full glory. Rising forty feet above the river, its pale stone arches stand strong and defiant. Lush gardens line the bridge’s wooden span, blooming with flowers of all colours. This grand bridge, once lost to time and ruin; has been reborn. A symbol of Rhoynish pride and resilience over the flowing waters of the Rhoyne once more!"

  # Meereen
  building_agot_EE_great_pyramid_of_meereen:0 "The Great Pyramid of Meereen"
  building_type_agot_EE_great_pyramid_of_meereen:0 "The Great Pyramid of Meereen"
  building_agot_EE_great_pyramid_of_meereen_desc:0 "By far the largest building in the city, the Great Pyramid of Meereen was built by a small army of slaves, a thousand of which died during its construction. The pyramid serves as the administrative centre of Meereen and the city’s rulers have used the great Hall to receive their subjects for centuries."

  # Asshai
  building_stygai_01:0 "Haunted City of Stygai"
  building_type_stygai_01:0 "Stygai"
  building_stygai_01_desc:0 "Stygai, the enigmatic and ancient city shrouded in the dark heart of the Shadow Lands, remains one of the most fear inducing mysteries of the world. Unfathomably old and cloaked in eternal darkness, the city stands as a monument to a forgotten era. Not even the most daring shadowbinders dare to venture into its forsaken streets. The towering spires and labyrinthine alleys are said to be traveled by demons and creatures alike. Veiled in secrecy, its true origins and the extent of its dark powers remain unknown."

  # Gogossos
  building_the_red_citadel_1:0 "The Red Tower"
  building_type_the_red_citadel_1:0 "The Red Tower"
  building_the_red_citadel_1_desc:0 "A large coastal tower, believed to be the last remnant of a once-mighty fortress, now serves as the city's primary stronghold. Though much of the original structure has been lost to time, this lone bastion endures—small yet incredibly sturdy and highly defensible. Thick walls of weathered stone stand firm against both the elements and potential sieges, making it a reliable seat of authority within Gogossos. While not yet a grand citadel, it remains a formidable keep, a foundation upon which greater fortifications may one day rise"
  building_type_the_red_citadel_1_desc:0 "A large coastal tower, believed to be the last remnant of a once-mighty fortress, now serves as the city's primary stronghold. Though much of the original structure has been lost to time, this lone bastion endures—small yet incredibly sturdy and highly defensible. Thick walls of weathered stone stand firm against both the elements and potential sieges, making it a reliable seat of authority within Gogossos. While not yet a grand citadel, it remains a formidable keep, a foundation upon which greater fortifications may one day rise"

  building_the_red_citadel_2:0 "The Red Redoubt"
  building_type_the_red_citadel_2:0 "The Red Redoubt"
  building_the_red_citadel_2_desc:0 "Now reinforced with a sturdy wooden palisade and watchtowers on top the old Crimson Remains, this redoubt has grown into a more formidable stronghold, capable of withstanding prolonged threats. No longer just a lone coastal tower, the expanded defenses now allow it to hold a decent garrison, providing a strong foothold within Gogossos. With ample supplies and reinforced positions, it could even sustain an army for months if necessary, marking its transformation from a mere relic of the past into a true bastion of power within the city."
  building_type_the_red_citadel_2_desc:0 "Now reinforced with a sturdy wooden palisade and watchtowers, this redoubt has grown into a more formidable stronghold, capable of withstanding prolonged threats. No longer just a lone coastal tower, the expanded defenses now allow it to hold a decent garrison, providing a strong foothold within Gogossos. With ample supplies and reinforced positions, it could even sustain an army for months if necessary, marking its transformation from a mere relic of the past into a true bastion of power within the city."

  building_the_red_citadel_3:0 "The Red Citadel"
  building_type_the_red_citadel_3:0 "The Red Citadel"
  building_the_red_citadel_3_desc:0 "Once a mere remnant of the past, the Red Citadel has been rebuilt into a vast and unyielding fortress, towering over Gogossos as the city's ultimate seat of power. No longer just a lone tower, it now stands as a fully restored keep and stronghold, its colossal Valyrian Blackstone walls stretching high and thick, a monument to dominance and dread. \n Like the Crimson Gate, the walls of the Red Citadel were once infused with blood magic rituals performed by the Ancient Valyrians, their sorcery forever staining the stone a deep, unnatural crimson. Though the rituals have long since faded into history, their dark legacy endures, making the citadel not only a near-impenetrable stronghold, but also a haunting symbol of absolute power. \n At its heart, The Red Tower pierces the sky, its presence casting a long shadow over the city, a constant reminder of the Archon's authority. The lower walls and courtyard remain slick with blood, not only from the rituals of the past but from the countless executions, betrayals, and brutal conflicts that have played out upon its stones. The blood of rebels, conspirators, and enemies of the state has seeped into its foundations, ensuring that fear is woven into the very fabric of the fortress. \n It is whispered that within these walls, the Red Plague first took root, a curse that once ravaged Gogossos, leaving entire districts drowning in blood and suffering. Though the disease has long faded into history, some say the citadel still remembers, that the ghosts of the dying linger in its deepest chambers, whispering to those who listen. \n A place of iron rule and legend, the Red Citadel is more than just a fortress—it is the unyielding core of Gogossos, a place where power is absolute, mercy is scarce, and rebellion is crushed before it can begin."

  building_type_the_red_citadel_3_desc:0 "Once a mere remnant of the past, the Red Citadel has been rebuilt into a vast and unyielding fortress, towering over Gogossos as the city's ultimate seat of power. No longer just a lone tower, it now stands as a fully restored keep and stronghold, its colossal Valyrian Blackstone walls stretching high and thick, a monument to dominance and dread. \n Like the Crimson Gate, the walls of the Red Citadel were once infused with blood magic rituals performed by the Ancient Valyrians, their sorcery forever staining the stone a deep, unnatural crimson. Though the rituals have long since faded into history, their dark legacy endures, making the citadel not only a near-impenetrable stronghold, but also a haunting symbol of absolute power. \n At its heart, The Red Tower pierces the sky, its presence casting a long shadow over the city, a constant reminder of the Archon's authority. The lower walls and courtyard remain slick with blood, not only from the rituals of the past but from the countless executions, betrayals, and brutal conflicts that have played out upon its stones. The blood of rebels, conspirators, and enemies of the state has seeped into its foundations, ensuring that fear is woven into the very fabric of the fortress. \n It is whispered that within these walls, the Red Plague first took root, a curse that once ravaged Gogossos, leaving entire districts drowning in blood and suffering. Though the disease has long faded into history, some say the citadel still remembers, that the ghosts of the dying linger in its deepest chambers, whispering to those who listen. \n A place of iron rule and legend, the Red Citadel is more than just a fortress—it is the unyielding core of Gogossos, a place where power is absolute, mercy is scarce, and rebellion is crushed before it can begin."

  building_the_pit_of_sorrows_1:0 "Overgrown Keep and ruins"
  building_type_the_pit_of_sorrows_1:0 "Overgrown Keep and ruins"
  building_the_pit_of_sorrows_1_desc:0 "A ruined keep, its once-mighty walls now draped in creeping vines and swallowed by the relentless embrace of nature, stands in eerie silence. Trees have taken root within its courtyards, their twisted branches clawing at the sky, as if bearing witness to forgotten horrors. Despite the decay, the keep remains oddly defensible—its towers, though weathered, still loom with an imposing presence, and its gate, half-buried in moss and rubble, suggests a fortress that refuses to yield entirely to time. Yet something feels profoundly wrong about this place. The air is thick with an unnatural stillness, the kind that makes the skin prickle and the mind uneasy. Shadows linger where they should not, and whispers—too faint to be the wind—seem to drift through the ruins, hinting at secrets better left undisturbed."

  building_type_the_pit_of_sorrows_1_desc:0 "A ruined keep, its once-mighty walls now draped in creeping vines and swallowed by the relentless embrace of nature, stands in eerie silence. Trees have taken root within its courtyards, their twisted branches clawing at the sky, as if bearing witness to forgotten horrors. Despite the decay, the keep remains oddly defensible—its towers, though weathered, still loom with an imposing presence, and its gate, half-buried in moss and rubble, suggests a fortress that refuses to yield entirely to time. Yet something feels profoundly wrong about this place. The air is thick with an unnatural stillness, the kind that makes the skin prickle and the mind uneasy. Shadows linger where they should not, and whispers—too faint to be the wind—seem to drift through the ruins, hinting at secrets better left undisturbed."

  building_the_Pit_of_sorrows_2:0 "Keep and Pit excavations"
  building_type_the_Pit_of_sorrows_2:0 "Keep and Pit excavations"
  building_the_Pit_of_sorrows_2_desc:0 "As we expanded our efforts and cleared away the thick tangle of vegetation, we made a startling discovery—the ground beneath us seemed to descend endlessly, no matter how much mud and debris we removed. What at first appeared to be mere overgrowth concealing the ruins soon revealed itself as a vast and layered descent, each lower level exposing remnants of the past. Among the crumbling stonework and damp earth, we unearthed countless bones, their origins unknown, their stories long lost to time. With every step downward, a growing certainty took hold—this may indeed be the fabled Pit of Sorrows, a place whispered of in fearful legend, its depths untouched and its mysteries still waiting to be unraveled."

  building_type_the_Pit_of_sorrows_2_desc:0 "As we expanded our efforts and cleared away the thick tangle of vegetation, we made a startling discovery—the ground beneath us seemed to descend endlessly, no matter how much mud and debris we removed. What at first appeared to be mere overgrowth concealing the ruins soon revealed itself as a vast and layered descent, each lower level exposing remnants of the past. Among the crumbling stonework and damp earth, we unearthed countless bones, their origins unknown, their stories long lost to time. With every step downward, a growing certainty took hold—this may indeed be the fabled Pit of Sorrows, a place whispered of in fearful legend, its depths untouched and its mysteries still waiting to be unraveled."

  building_the_Pit_of_sorrows_3:0 "The Pit of Sorrows"
  building_type_the_Pit_of_sorrows_3:0 "The Pit of Sorrows"
  building_the_Pit_of_sorrows_3_desc:0 "The Ancient Pit of Sorrows, once a crumbling ruin, has been painstakingly rebuilt and restored to its former ominous grandeur. Yet, for all the efforts to reclaim its upper reaches, the true depths remain an unfathomable abyss. The lower darkness stretches endlessly, swallowing light and sound alike, a gaping maw into the unknown. Many have dared to descend in search of secrets lost to time, but none have ever returned to speak of what lies at the bottom—if, indeed, a bottom exists at all"

  building_type_the_Pit_of_sorrows_3_desc:0 "The Ancient Pit of Sorrows, once a crumbling ruin, has been painstakingly rebuilt and restored to its former ominous grandeur. Yet, for all the efforts to reclaim its upper reaches, the true depths remain an unfathomable abyss. The lower darkness stretches endlessly, swallowing light and sound alike, a gaping maw into the unknown. Many have dared to descend in search of secrets lost to time, but none have ever returned to speak of what lies at the bottom—if, indeed, a bottom exists at all"

  building_the_toad:0 "The Black Toad"
  building_type_the_toad:0 "the Black Toad"
  building_the_toad_desc:0 "The largest statue ever constructed on the Isle of Toads looms over the landscape, a monolithic relic of a civilization long vanished. Carved from an unknown, oily black stone that seems to glisten even in the absence of light, it takes the form of a great toad—squat, grotesque, and unnervingly lifelike. No one knows who built it, nor for what purpose, and whatever meaning it once held has long been lost to time. To most, it is nothing more than a crude and ominous effigy, a bizarre curiosity in a land already steeped in mystery. Yet, there are whispers—spoken in hushed tones by the locals—of strange dreams that come to those who sleep too close, of an unsettling warmth in the stone when touched, and of eyes that seem to glimmer just beneath its surface, as if something watches from within."
  building_type_the_toad_desc:0 "The largest statue ever constructed on the Isle of Toads looms over the landscape, a monolithic relic of a civilization long vanished. Carved from an unknown, oily black stone that seems to glisten even in the absence of light, it takes the form of a great toad—squat, grotesque, and unnervingly lifelike. No one knows who built it, nor for what purpose, and whatever meaning it once held has long been lost to time. To most, it is nothing more than a crude and ominous effigy, a bizarre curiosity in a land already steeped in mystery. Yet, there are whispers—spoken in hushed tones by the locals—of strange dreams that come to those who sleep too close, of an unsettling warmth in the stone when touched, and of eyes that seem to glimmer just beneath its surface, as if something watches from within."

  building_the_ax_hold:0 "The Ax Hold"
  building_type_the_ax_hold:0 "The Ax Hold"
  building_the_ax_hold_desc:0 "The stronghold of House Xhore stands as both a sanctuary and a fortress, a bastion of stone and steel built to endure the tempests of the Basilisk Isles. Nestled atop jagged cliffs and surrounded by treacherous waters, it was designed not just as a home, but as an unyielding stronghold from which the Qartheen pirates of the Western Isles could launch their infamous raids. Its walls, weathered yet formidable, bear the scars of countless battles, while its towering watchtowers offer an unbroken view of the surrounding sea, ever watchful for both prey and pursuers"

  building_type_the_ax_hold_desc:0 "The stronghold of House Xhore stands as both a sanctuary and a fortress, a bastion of stone and steel built to endure the tempests of the Basilisk Isles. Nestled atop jagged cliffs and surrounded by treacherous waters, it was designed not just as a home, but as an unyielding stronghold from which the Qartheen pirates of the Western Isles could launch their infamous raids. Its walls, weathered yet formidable, bear the scars of countless battles, while its towering watchtowers offer an unbroken view of the surrounding sea, ever watchful for both prey and pursuers"

  building_the_garden_of_malice_1:0 "A Large Overgrown Fort"
  building_type_the_garden_of_malice_1:0 "A Large Overgrown Fort"
  building_the_garden_of_malice_1_desc:0 "A vast, overgrown ringwall encircles the ruins, its ancient stones barely visible beneath layers of creeping vines and thick moss. At its heart stands a crumbling keep, its towers broken and half-swallowed by the relentless embrace of nature. Time has erased whatever history this place once held, leaving only an eerie, suffocating silence in its wake. \nYet, those who dare to step beyond the shattered gates quickly realize why no one has reclaimed these ruins—this place is a death trap. Twisting hedges, grown wild and unnatural, form an intricate labyrinth, their paths shifting and closing like living things, leading the unwary deeper into confusion. Among the tangled greenery lurk plants of impossible colors and unnatural shapes, their beauty masking deadly intent. Some release spores that choke the lungs, others secrete toxins that blister the skin, and a few move with unsettling purpose, waiting for prey to draw too close. \nLegends whisper that something—perhaps the remnants of a forgotten sorcery, or the lingering presence of whatever force once ruled here—keeps the flora thriving in ways that defy nature. The ruins remain untouched, not because they are forgotten, but because they are feared. Even the boldest raiders and treasure seekers know better than to tempt the wrath of a place where the very plants themselves seem to hunger for blood."

  building_type_the_garden_of_malice_1_desc:0 "A vast, overgrown ringwall encircles the ruins, its ancient stones barely visible beneath layers of creeping vines and thick moss. At its heart stands a crumbling keep, its towers broken and half-swallowed by the relentless embrace of nature. Time has erased whatever history this place once held, leaving only an eerie, suffocating silence in its wake. \nYet, those who dare to step beyond the shattered gates quickly realize why no one has reclaimed these ruins—this place is a death trap. Twisting hedges, grown wild and unnatural, form an intricate labyrinth, their paths shifting and closing like living things, leading the unwary deeper into confusion. Among the tangled greenery lurk plants of impossible colors and unnatural shapes, their beauty masking deadly intent. Some release spores that choke the lungs, others secrete toxins that blister the skin, and a few move with unsettling purpose, waiting for prey to draw too close. \nLegends whisper that something—perhaps the remnants of a forgotten sorcery, or the lingering presence of whatever force once ruled here—keeps the flora thriving in ways that defy nature. The ruins remain untouched, not because they are forgotten, but because they are feared. Even the boldest raiders and treasure seekers know better than to tempt the wrath of a place where the very plants themselves seem to hunger for blood."


  building_the_garden_of_malice_2:0 "The Garden of Malice"
  building_type_the_garden_of_malice_2:0 "The Garden of Malice"
  building_the_garden_of_malice_2_desc:0 "The Garden of Malice is a fortress of layered death, built from oiled blackstone and surrounded by lethal defenses. The outer ringwall encloses a vast, shifting garden maze, a living deathtrap where thorned vines lash like whips, blossoms exhale toxic spores, and the very hedges twist to mislead and ensnare intruders. No light reaches far beneath its dense canopy, where unseen things skitter through the undergrowth, and the air is thick with the scent of decay. Beyond the maze, the inner walls and moat form a second line of defense, the black waters teeming with unseen horrors that drag the unwary below. Towering ramparts, manned by silent sentinels, watch over the only entrance—a reinforced drawbridge that seldom lowers. At the heart of it all stands the keep, a massive, untouched Valyrian structure, its blackstone halls echoing with an eerie stillness. Its highest tower cradles an ancient dead tree, petrified and skeletal, its roots fused into the stone as if feeding on something deep within. It is said to predate the Doom itself, a relic of old Valyria steeped in sorcery long forgotten. To take the Garden of Malice is not just a battle—it is a descent into something far more sinister, where even the land conspires to kill."

  building_type_the_garden_of_malice_2_desc:0 "The Garden of Malice is a fortress of layered death, built from oiled blackstone and surrounded by lethal defenses. The outer ringwall encloses a vast, shifting garden maze, a living deathtrap where thorned vines lash like whips, blossoms exhale toxic spores, and the very hedges twist to mislead and ensnare intruders. No light reaches far beneath its dense canopy, where unseen things skitter through the undergrowth, and the air is thick with the scent of decay. Beyond the maze, the inner walls and moat form a second line of defense, the black waters teeming with unseen horrors that drag the unwary below. Towering ramparts, manned by silent sentinels, watch over the only entrance—a reinforced drawbridge that seldom lowers. At the heart of it all stands the keep, a massive, untouched Valyrian structure, its blackstone halls echoing with an eerie stillness. Its highest tower cradles an ancient dead tree, petrified and skeletal, its roots fused into the stone as if feeding on something deep within. It is said to predate the Doom itself, a relic of old Valyria steeped in sorcery long forgotten. To take the Garden of Malice is not just a battle—it is a descent into something far more sinister, where even the land conspires to kill."


  building_the_sapphire_quarter:0 "The Sapphire Quarter"
  building_type_the_sapphire_quarter:0 "The Sapphire Quarter"
  building_the_sapphire_quarter_desc:0 "The Sapphire Quarter is a vast, walled district perched atop the highest hill of Gogossos. Once the domain of the Dragonlords of old, it now serves as the exclusive enclave of the city's most illustrious slave masters and merchant princes. Only the elite may reside within its walls, for here, only grand manors and palaces stand—constructed from gleaming marble and adorned with gold. Its private markets are draped in the finest silks, reserved for those who can afford luxuries beyond the reach of lesser men."
  building_type_the_sapphire_quarter_desc:0 "The Sapphire Quarter is a vast, walled district perched atop the highest hill of Gogossos. Once the domain of the Dragonlords of old, it now serves as the exclusive enclave of the city's most illustrious slave masters and merchant princes. Only the elite may reside within its walls, for here, only grand manors and palaces stand—constructed from gleaming marble and adorned with gold. Its private markets are draped in the finest silks, reserved for those who can afford luxuries beyond the reach of lesser men."

  building_the_crimson_gate:0 "The Crimson Gate"
  building_type_the_crimson_gate:0 "The Crimson Gate"
  building_the_crimson_gate_desc:0 "The Crimson Gate stands as an awe-inspiring and fearsome sentinel, the primary line of defense for the legendary city of Gogossos. Towering over the landscape, it is the sole landward passage into the city, guarding the long and treacherous bridge that spans the great river. Forged from Valyrian Blackstone, its dark, unnatural surface seems to drink in the light, its smooth yet unyielding structure imbued with the power of forgotten sorcery. The very stones are steeped in history—stained deep crimson from the ancient Valyrian blood rituals once performed here, leaving a permanent, eerie mark of the dark arts that fortified its defenses. The gatehouse, a colossal bastion standing 140 feet high, looms like a titan over all who approach, its mere presence instilling awe and dread. Perched atop its mighty walls, a row of dragon statues stands in silent vigil, their massive gemstone eyes glinting with an unnatural luster—watching, waiting, as if the souls of the beasts they depict still linger within the stone.\n Few have ever dared to breach the Crimson Gate, and fewer still have lived to tell the tale. It is not merely a barrier—it is a monument to the unyielding might of Gogossos, an enduring testament to the city's forgotten power and the dark legacy of Valyria itself. "


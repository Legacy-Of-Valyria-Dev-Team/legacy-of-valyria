l_english:
  great_project_type_lv_rehabilitate_valyria:0 "Rehabilitate Valyria"
  great_project_type_lv_rehabilitate_valyria_desc:0 "Valyria, once the fiery heart of the world, is now nothing but a cursed and poisoned land. The Fourteen Flames still burn, and the very air is thick with ash and toxic fumes. Yet, the foundations of Valyria's greatness remain, buried beneath the ruin and desolation left in the wake of the Doom. Restoring the land may be nigh-impossible, but with monumental effort and dedication, perhaps Valyria can one day rise again from the ashes."

  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_fallback:0 "The selected [region|E] in [valyria|E] will be rehabilitated"
  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated:0 "The [region|E] of [sub_region.GetName] will be rehabilitated"

  LV_REHABILITATE_VALYRIA_MUST_BE_COUNTY_CAPITAL:0 "The rehabilitation efforts must be based in the county capital of this duchy."
  LV_REHABILITATE_VALYRIA_CAN_PLAN_IN_LOCATION:0 "There must be no other ongoing great projects to rehabilitate Valyria within this duchy."
  LV_REHABILITATE_VALYRIA_MUST_OWN_SUBREGION:0 "You or your [liege|E] must completely control at least one restorable duchy-sized [region|E] of [valyria|E] to plan a rehabilitation effort."
  LV_REHABILITATE_VALYRIA_CAN_START_PLANNING:0 "There are eligible regions in [valyria|E] to rehabilitate that have no ongoing rehabilitation efforts."

  great_project_type_lv_rehabilitate_valyria_contribution_master_engineer:0 "Master Engineer"
  great_project_type_lv_rehabilitate_valyria_contribution_master_engineer_desc:0 "The unique nature of the Doom demands expertise beyond standard stonemasonry and urban planning. We require a leader in both advanced engineering and the esoteric to safely navigate and stabilize the ruins."
  great_project_type_lv_rehabilitate_valyria_contribution_advanced_logistics:0 "Advanced Logistics"
  great_project_type_lv_rehabilitate_valyria_contribution_advanced_logistics_desc:0 "The scale of this rehabilitation effort is unprecedented. We need experts in logistics and supply chain management to ensure that materials, labor, and resources are efficiently allocated across the vast and hazardous terrain of Valyria."
  great_project_type_lv_rehabilitate_valyria_contribution_valyrian_steel_tools:0 "Valyrian Steel Tools"
  great_project_type_lv_rehabilitate_valyria_contribution_valyrian_steel_tools_desc:0 "Common iron and steel corrode and break quickly in the volcanic ash and toxic air. Only tools forged from Valyrian Steel can withstand the labor."
  great_project_type_lv_rehabilitate_valyria_contribution_doom_driven_workforce:0 "Doom-Driven Workforce"
  great_project_type_lv_rehabilitate_valyria_contribution_doom_driven_workforce_desc:0 "Few dare venture into the ruins. This contribution funds high wages and specialized equipment for hardened mercenaries, slaves, or fanatic volunteers who are willing to risk facing the Doom.

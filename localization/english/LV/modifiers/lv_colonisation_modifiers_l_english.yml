l_english:
  wasteland_valyria:0 "Wasteland: Valyria"
  wasteland_valyria_desc:0 "These lands, once considered home by the dragonriders of the ancient Valyrian Freehold, are now nothing but haunted wastes smothered by ash, engulfed by the flames of the Doom.\n\nMost perilous of all are the lands surrounding the Fourteen Flames, Valyria's infamous chain of volcanoes that erupted during the Doom and now spew forth ash and fire.\n\n"

  wasteland_valyria_epicenter:0 "[travel_danger|E] at the Epicenter"
  wasteland_valyria_proximity_to_volcano:0 "Travel danger increases by #N 0.25#! the closer a county is to any of the Fourteen Flames ($MULTIPLIER|-=2$)"
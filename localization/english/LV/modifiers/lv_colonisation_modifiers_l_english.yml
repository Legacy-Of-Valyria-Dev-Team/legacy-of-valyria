l_english:
  wasteland_valyria:0 "Wasteland: Valyria"
  wasteland_valyria_desc:0 "These lands, once considered home by the dragonriders of the ancient Valyrian Freehold, are now nothing but haunted wastes smothered by ash, engulfed by the flames of the Doom.\n\nMost perilous of all are the lands surrounding the Fourteen Flames, Valyria's infamous chain of volcanoes that erupted during the Doom and now spew forth ash and fire.\n\n$wasteland_valyria_desc_tooltip$\n\n"
  wasteland_valyria_desc_tooltip:0 "[SelectLocalization(GetScriptedGui('lv_ruin_valyria_restorable').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).End), 'wasteland_valyria_desc_tooltip_restorable', '')]"
  wasteland_valyria_desc_tooltip_restorable:0 "@warning_icon! #X This county remains dangerous to traverse for each blocker building present#!"

  wasteland_valyria_danger_desc:0 "#weak Travel danger increases by #N 25#! the closer a county is to any of the Fourteen Flames, maxing out at #N 100#! for the counties of the volcanoes themselves. As you clear more blocker buildings, the county becomes safer to traverse.#!\n\nBase Value"
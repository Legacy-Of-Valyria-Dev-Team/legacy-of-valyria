l_english:

 game_concept_wilderness_holding:0 "Wilderness"
 game_concept_wilderness_holding_desc:0 "Time and neglect have left this land a shadow of its former self. What little still stands is cracked and broken, a testament to the past and a warning to the future."
 game_concept_wilderness_holdings:0 "Wilderness Holdings"
 game_concept_wilderness_holdings_desc:0 "Time and neglect have left this land a shadow of its former self. What little still stands is cracked and broken, a testament to the past and a warning to the future."
 
 game_concept_colony_holding:0 "Colony"
 game_concept_colony_holding_desc:0 "A fledgling settlement carved from the wilderness, where pioneers and settlers work to establish a foothold in untamed lands. Though still vulnerable, it serves as the foundation for future expansion, bringing order, trade, and stability to the frontier."
 game_concept_colony_holdings:0 "Colony Holdings"

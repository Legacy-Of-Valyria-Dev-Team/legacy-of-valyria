 COB_HISTORICAL_CHARACTER_TOOLTIP: "#T Historical Character#!\n\n#high [Character.Custom('cobHistoricalCharacterDesc')]#!\n\n#weak This character is historical to the era of the Century of Blood#!"

 historical_character.aurion_varezys_hc:0 "#bold Aurion Varezys#! was a Dragonlord of Valyria. The third son it was unlikely that he would ever rise to the head of his family over his brothers. He was sent on an expedition to Qohor by his father due to neither of his brothers wanting to make the journey. While he was in Qohor with his first son, Maelys, the Doom came to Valyria, killing his entire family and propelling him to the head of his dynasty."

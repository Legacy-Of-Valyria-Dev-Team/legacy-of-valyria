 #7899
 zz_valyria_centuryofblood:0 "The Century of Blood"
 zz_valyria_centuryofblood_group:0 "After the Doom"
 zz_valyria_centuryofblood_desc:0 "The Valyrian Freehold has fallen, collapsing when the peninsula was destroyed in the Doom. Within mere hours, Valyria was gone and the Freehold was destroyed. House Targaryen had relocated to Dragonstone, the westernmost outpost of Valyria located in the narrow sea, thereby ensuring their survival.\n\nSome other dragonlords — those who had not been in Valyria when the Doom occurred — survived as well. In Tyrosh, Lys and Qohor, it is said that dragonlords were spared the destruction and were now unsure of what their futures held. #bold \n\nAurion Varezys, a dragonlord who had been visiting Qohor, proclaimed himself the first Emperor of Valyria and raised forces from the Qohorik. With his dragon and an army of thirty thousand men he marches to claim Valyria's remains...#!"

 bookmark_99_arrec_durrandon:0 "King Arrec"
 bookmark_99_arrec_durrandon_desc:0 "Arrec Durrandon, King of the Stormlands and the wealthy Riverlands which were conquered by his ancestor Arlan III Durrandon three hundred years earlier, sits upon the Storm King's Throne. His rule is not secure, however, as many of the other kings in [westeros|E] continue to envy the potential wealth that comes from the Riverlands. From the West the Ironborn begin to stir, potentially with ambitions to reclaim the Riverlands from the Storm Kings"
 bookmark_99_arrec_durrandon_subheading:0 "The Storm King"
 bookmark_99_erich_durrandon:0 "Erich Durrandon"
 bookmark_99_monfryd_durrandon:0 "Monfryd Durrandon"

 bookmark_99_aenar_targaryen:0 "King Aenar"
 bookmark_99_aenar_targaryen_desc:0 "Twelve years before the [doom_of_valyria|E], Aenar's daughter, Daenys the Dreamer, foretold the destruction of [valyria|E]. In response to this, Aenar sold his holdings in the [valyrian_freehold|E] and the Lands of the Long Summer, and moved with his family and [dragons_plural|E] to Dragonstone, the westernmost outpost of the [valyrian_freehold|E]. The Targaryens were far from the most powerful of the [dragonlords|E], and their rivals in [valyria|E] saw their flight as an act of cowardice. However, because Aenar had moved his family away from [valyria|E], the Targaryens were the strongest of the [dragonlords|E] to survive the [doom|E]"
 bookmark_99_aenar_targaryen_subheading:0 "Lord of Dragonstone"
 bookmark_99_gaemon_targaryen:0 "Gaemon Targaryen"
 bookmark_99_daenys_targaryen:0 "Daenys 'The Dreamer' Targaryen"

# bookmark_99_garland_gardener:0 "Garland VI Gardener"
# bookmark_99_garland_gardener_desc:0 "King Garland VI came to the Oakenseat while still in his minority. The High Steward of the Reach, a Tyrell, ruled as regent until Garland came of age. Garland VI now rules over one of the strongest kingdoms in [westeros|E]. An intelligent, yet cynical, king, Garland's ambitions are known only to himself and only time will tell how far House Gardener will rise"
# bookmark_99_elissa_florent:0 "Elissa Florent"
# bookmark_99_mern_gardener:0 "Mern Gardener"

 bookmark_99_qhorwyn_hoare:0 "King Qhorwyn"
 bookmark_99_qhorwyn_hoare_desc:0 "Qhorwyn has been a shrewd King of the Iron Islands who has avoided war and instead gathered wealth during his reign. He tripled the size of House Hoare's fleets and ordered the creation of additional armament to dissuade enemies from attacking.\n\nQhorwyn's third son Harwyn has returned to the Iron Islands after adventuring for the previous two years to find his father infirm and ill with his brother Harlan preparing to take on the mantle of King of the Iron Islands. Both brothers have ambitions to take their father's military power and claim the Kingdom of the Trident from the Durrandons with the only question being whether they can work together for this aim, or if one will try to claim power over the other."
 bookmark_99_qhorwyn_hoare_subheading:0 "King of the Iron Islands"
 bookmark_99_harlan_hoare:0 "Harlan Hoare"
 bookmark_99_harwyn_hoare:0 "Harwyn Hoare"

 bookmark_99_tommen_lannister:0 "King Tommen II"
 bookmark_99_tommen_lannister_desc:0 "Tommen II Lannister, known as the Lion King, is the King of the Rock of House Lannister. Having heard of the possible collapse of the Valyrian Freehold in a [doom|E] of fire he prepares to launch an expedition to the former [valyrian_freehold_short|E] to plunder the wealth and sorcery that surely remained. The expedition is sure to be a dangerous one and so the question is: should Tommen II risk it all to return to [valyria|E] or take advantage of the massive void in power in the wake of the [valyrian_freehold_short|E]'s demise and take hold of [essos|E] to expand the Lannister wealth and name across the [known_world|E]?"
 bookmark_99_tommen_lannister_subheading:0 "King of the Rock"
 bookmark_99_ellyn_tarbeck:0 "Ellyn Tarbeck"
 bookmark_99_tyrion_lannister:0 "Tyrion Lannister"

 bookmark_99_aurion_varezys:0 "Emperor Aurion"
 bookmark_99_aurion_varezys_desc:0 "[Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_copy|q$' )|E]\nAurion Varezys, one of the few surivivng Dragonlords stranded in Qohor, raised forces from Qohorik colonists and declared himself first Emperor of [valyria|E]. Atop his [dragon|E], he and his thirty thousand men march to lay claim to whatever remains of [valyria|E], or perhaps to create a New [valyria|E] by right of conquest of the [free_cities|E] of [essos|E].\n\n#bold Will Aurion risk everything to lay claim to his former home, or, will he forge a new path with the remaining Dragonlords so that the dream of [valyria|E] will remain at the forefront of the world's mind?#!"
 bookmark_99_aurion_varezys_subheading:0 "The Emperor of Valyria"
 bookmark_99_maelys_varezys:0 "Maelys Varezys"

 bookmark_99_lucifer_justman:0 "River King Lucifer"
 bookmark_99_lucifer_justman_desc:0 "Three centuries after a previous Lucifer Justman declared himself River King by right of blood a new claimant to the crown of the Trident has landed in Blackwater Bay. Standing on the shores of the small fishing village at the mouth of the Trident Lucifer must take his tiny entourage and decide on a path to press his claim upon the lands of his ancestors. Which kingdom would be the most beneficial in ousting the Durrandon's from his family's lands? The Gardeners of Highgarden, the Lannisters of Casterly Rock or the Arryn's of the Vale?"
 bookmark_99_lucifer_justman_subheading:0 "The River King"

 #Story Content

 game_concept_story_content_aurion_varezys_99:0 "$game_concept_story_generic_prefix$ $bookmark_99_aurion_varezys$"
 game_concept_story_content_aurion_varezys_99_desc:0 "#tooltip_heading Story Style: Extensive#!\n\nAs Aurion Varezys you will have the choice to re-colonize [valyria|E] and restore the old order, or, claim Volantis and the other satillite states of [old_valyria|E] to form a new [the_freehold|E]."

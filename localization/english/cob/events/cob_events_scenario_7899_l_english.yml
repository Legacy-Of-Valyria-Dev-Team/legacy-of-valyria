 cob_7899_scenerio.0541.duel.dragon:0 "[vassarion.GetName]! Aderī!"
 cob_7899_scenerio.0541.duel.dragon.tt:0 "You quickly call your dragon and prepare to face the beast."
 cob_7899_scenerio.0541.duel:0 "Steel and fire, then. May the gods bear witness."
 cob_7899_scenerio.0541.duel.tt:0 "You stand your ground and attempt to slay the firewyrm."
 cob_7899_scenerio.0541.b:0 "We must retreat!"

 cob_7899_scenerio.9998.t:0 "Aurion's Lost Expedition"
 cob_7899_scenerio.9998.desc:0 "Traveling through the lands of Valyria your party stumbles upon what appears to be a massive graveyard of skeletons frozen in various poses of terror...\n\nAfter some exploration you deterime that this must be the final resting place of Aurion Varezy's expedition into Valyria, in the center of the carnage you find the skeleton of a large dragon encircling the armored skeleton of its rider which you believe to be Aurion. At first glance it appears like the dragon was trying to protect Aurion from... something. A feeling of dread passes through you at the thought of something so horrifying that a dragon that size knew the end was near.\n\nYou must decide now if you will disturb this gravesite and recover the sword and armor of House Varezys, knowing that according to ancient lore such an action will result in a punishment..."
 cob_7899_scenerio.9998.a:0 "Take the artifacts and accept the punishment"
 cob_7899_scenerio.9998.b:0 "I will reclaim my family legacy"
 cob_7899_scenerio.9998.c:0 "These artifacts should remain in this graveyard"

 cob_7899_scenerio.9999.t:0 "Attempted Defiance of the Gods"
 cob_7899_scenerio.9999.desc:0 "You find yourself in the midst of a dream, an deep seated fear flows through you as a voice bellows from the darkness\n\n"You have tried to defy the will of the Gods, the artifact you have attempted to summon has been lost to the deep magic and cannot be recovered until such a time as the Gods deem it so."\n\nOnly moments later you manage to awaken yourself, confused at what just occured...\n\nDEV NOTE - this artifact is currently blocked from being spawnable via debug as there is an event chain hidden in the world to recover it"
 cob_7899_scenerio.9999.a:0 "I really need to stop drinking..."
 cob_7899_scenerio.9999.b:0 "I DO WHAT I WANT (don't press this, but you will anyway)"

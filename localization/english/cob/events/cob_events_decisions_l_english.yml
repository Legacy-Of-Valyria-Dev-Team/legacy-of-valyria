l_english:
#Events

 cob_decisions.0001.t:0 "A Message from Valyria?"
 cob_decisions.0001.desc:0 "I look upon the letter in my hand in simple disbelief. Someone named [dragonlord_of_valyria.GetName] has claimed to have repopulated Valyria and is asking for all dragon riders to return to claim their birthright. I have enjoyed my life as a dragonrider in this world and I do not know if I wish to live underneath the rule of someone else..."
 cob_decisions.0001.a:0 "I will accept [dragonlord_of_valyria.GetNamePossessive] proposal"
 cob_decisions.0001.b:0 "I must decline and find my own way"

 cob_decisions.0002.t:0 "A Proposal Accepted"
 cob_decisions.0002.desc:0 "I look upon the parchment in my hands and quietly celebrate my good fortunes. [dragonlord.GetName] has accepted my proposal and wishes to come to my court immediately. Today is truly a glorious day for Valyria"
 cob_decisions.0002.a:0 "I shall make preperations to recieve them"

 cob_decisions.0003.t:0 "A Proposal Rejected"
 cob_decisions.0003.desc:0 "I cannot believe the words that I am reading... [dragonlord.GetName] has rejected my proposal to come to Valyria and claim their birthright. This is truly a setback, but, perhaps once I gather more power and titles I can attempt to entice them once more with more success..."
 cob_decisions.0003.a:0 "We will push forward"

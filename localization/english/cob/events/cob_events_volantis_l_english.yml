l_english:
#Events Volantis

# Welcome to Volantis
 cob_events_volantis.0001.t:0 "A Message from Valyria?"
 cob_events_volantis.0001.desc:0 "I look upon the letter in my hand in simple disbelief. Someone named [dragonlord_of_valyria.GetName] has claimed to have repopulated Valyria and is asking for all dragon riders to return to claim their birthright. I have enjoyed my life as a dragonrider in this world and I do not know if I wish to live underneath the rule of someone else..."
 cob_events_volantis.0001.a:0 "I will accept [dragonlord_of_valyria.GetNamePossessive] proposal"
 cob_events_volantis.0001.b:0 "I must decline and find my own way"

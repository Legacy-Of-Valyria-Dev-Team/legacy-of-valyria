 cob_7899_scenerio.0524.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0524.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0525.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0525.desc:0 "Nous traversons les terres en ruines de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de tous dans mon ost. Je décide que nous devrions prendre un moment pour nous orienter et j'appelle pour que [vassarion.GetName] me soit amené afin que je puisse voler au-dessus des nuages. Pendant que j'attends, l'un de mes éclaireurs crie et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un du groupe vêtu des vêtements en lambeaux d'un Général Valyrien sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiqué par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Envoyer [vassarion.GetName] combattre ? Ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0525.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0525.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b:0 "Vous affronterez [vassarion.GetName] !"
 cob_7899_scenerio.0525.b_1_tt:0 "[freeholder_survivor.GetName] meurt !"
 cob_7899_scenerio.0525.b_2_tt:0 "[vassarion.GetName] meurt !"
 cob_7899_scenerio.0525.b.win:0 "[vassarion.GetName] tue [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b.dead:0 "[freeholder_survivor.GetName] parvient à survivre contre [vassarion.GetName]"
 cob_7899_scenerio.0525.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0525.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0527.t:0 "Embuscade par un Seigneur Dragon"
 cob_7899_scenerio.0527.desc:0 "Alors que je vole sur [vassarion.GetName] à l'avant-garde de mon ost au-dessus des ruines de [location.GetName], un cri perçant déchire l'air suivi d'une énorme boule de feu de dragon qui manque de tout incinérer autour de moi.\n\nJe me réoriente pour scruter les nuages au-dessus à la recherche du [dragon|E] sauvage qui a survécu au cataclysme pour m'attaquer. Il ne faut pas longtemps avant que l'agresseur ne se fasse connaître car, à ma grande surprise, le [dragon|E] avait un cavalier qui commença à faire planer sa bête tout aussi massive devant moi. Je décide de parler avec [freeholder_dragonlord.GetHerHim] avant une autre attaque.\n\n« Je suis [aurion.GetName] et je suis revenu sur ces terres pour les revendiquer pour Valyria. » criai-je vers le [dragonlord|E]\n\n« Je m'en moque [aurion.GetName], je suis [freeholder_dragonlord.GetName], chevaucheur de [enemy_dragon.GetName] et je revendique toutes ces terres sur lesquelles vous êtes en train d'empiéter. »"
 cob_7899_scenerio.0527.a:0 "J'affronterai [freeholder_dragonlord.GetName] et son [dragon|E]"
 cob_7899_scenerio.0527.a_tt:0 "Un duel de [dragon|E] commence avec [freeholder_dragonlord.GetName]"
 cob_7899_scenerio.0527.b:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0527.b_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0529.t:0 "Un Retour Doux-Amer"
 cob_7899_scenerio.0529.desc:0 "Je descends du navire sur les quais de pierre en ruines de [location.GetName], mes yeux fixés sur les portes carbonisées et ruinées de la capitale valyrienne.\n\n'Je suis chez moi' pensé-je. 'Je suis enfin chez moi... mais il reste encore beaucoup de travail à accomplir avant que les [valyrian_freehold_short|E] ne se relèvent à nouveau.'\n\nJe m'agenouille et pose ma main sur la pierre chaude du quai pour un bref instant, je relève la tête une fois de plus et me mets en route pour restaurer les ruines de cette puissante cité une fois de plus..."
 cob_7899_scenerio.0529.a:0 "Je suis revenu chez moi à Valyria..."


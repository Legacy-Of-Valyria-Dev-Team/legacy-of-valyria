 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je traverse les couloirs du palais en ruines de [location.GetName] qui fut jadis la demeure de [Nymeria.GetName] des Rhoynars, et je me retrouve transporté vers les récits que ma mère me contait enfant. Des récits sur les [dragonlords|E] d'antan et leurs conquêtes à travers [essos|E], prenant ce qui leur revenait de droit divin et par le feu des dragons. Ceux qui s'inclinaient étaient épargnés et ceux qui résistaient étaient effacés du monde ou chassés en exil, leurs anciens royaumes laissés à pourrir comme celui-ci.\n\nAlors que je laisse ces récits affluer dans mon esprit, je ne puis m'empêcher de me demander si les [valyrian_freehold_short|E] se sont affaiblies au fil du temps, je me demande si ces conquérants, ces héros des récits regarderaient mes semblables et éprouveraient de la honte pour ce que nous sommes devenus. [valyria|E] fut jadis le pinacle du monde, mais à la fin on aurait dit que nous n'étions plus que des enfants querelleurs se disputant le pouvoir et la richesse... peut-être est-ce pour cela que [ROOT.Char.GetFaith.HighGodName] a choisi de frapper notre peuple du [doom|E]... peut-être ai-je été choisi pour maintenir vivant le rêve de [valyria|E]."
 cob_7899_scenerio.0500.a:0 "Nous poursuivons vers la Porte Sombre"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers la Porte Sombre"

 cob_7899_scenerio.0501.t:0 "La Décision à la Porte Sombre"
 cob_7899_scenerio.0501.desc:0 "Alors que je contemple les eaux de la Rhoyne, les ruines de [location.GetName], une autre des conquêtes des [valyrian_freehold_short|E], derrière moi, je réalise qu'en cet instant j'ai un choix. Je puis poursuivre la quête que j'imaginais au début de ce voyage et mener mon ost vers les vestiges peut-être calcinés et emplis de magma de [valyria|E] et restaurer la puissance des [valyrian_freehold_short|E] à mon image... ou... je puis incarner l'esprit des premiers [dragonlords|E] de [valyria|E], rassembler les Lords dragons survivants d'[essos|E] et reconquérir les colonies des [valyrian_freehold_short|E] par droit de conquête et par le feu des dragons.\n\nAlors que je me tiens à la frontière de [GetTitleByKey('k_volantis').GetName], je dois décider : est-ce que je fais le voyage vers les terres brûlées de [GetTitleByKey('e_valyria').GetName], ou est-ce que je forge un nouveau chemin et crée une Nouvelle [valyria|E] à la manière de mes ancêtres ?\n\n#bold ATTENTION - chaque voie s'annonce difficile, il est recommandé de sauvegarder souvent pour éviter un game over#!"
 cob_7899_scenerio.0501.b:0 "Je conquerrai les [free_cities|E] pour former une Nouvelle [valyria|E]"
 cob_7899_scenerio.0501.a:0 "Nous devons nous réapprovisionner à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager vers Volantis"

 ##Aurion Valyria Expedition

 cob_7899_scenerio.0502.t:0 "Ravitaillement au Pont-Long"
 cob_7899_scenerio.0502.desc:0 "La première chose que j'ai remarquée à [location.GetName] fut le bruit incessant et sans fin qui semblait envahir chaque recoin de la cité. Je ne saurais l'affirmer avec certitude, mais il me semblait que la ville était dix fois plus bruyante que la capitale valyrienne tout en faisant moins de la moitié de sa taille. La seule chose pire que le bruit était l'odeur : gens crasseux, latrines surexploitées et mal entretenues, poisson et tout un fatras d'autres choses se mélangeant pour former la plus impie des puanteurs le long du pont-long où mon camp se ravitaillait.\n\nHeureusement, il ne faudrait pas longtemps avant que nous reprenions la marche vers [valyria|E] pour reconquérir notre foyer. En traversant les rues, j'avais remarqué un assortiment toujours croissant de gens qui célébraient la destruction de ma patrie, déclarant que le monde était enfin libéré de l'emprise étouffante des [valyrian_freehold_short|E]. Je ne les ai pas provoqués, reconnaissant d'avoir gardé [vassarion.GetName] hors de la ville pour éviter toute confrontation inutile durant mon voyage.\n\nLeurs pensées importaient peu car ils verraient la vérité : moi, [aurion.GetName], je retournerais à [valyria|E] et la ramènerais à la grandeur qu'elle avait jadis. Pour l'instant, je pouvais prendre un moment de repos avant de poursuivre vers ce qui reste de mon foyer..."
 cob_7899_scenerio.0502.a:0 "Il est temps d'avancer vers la Petite [valyria|E]"
 cob_7899_scenerio.0502.a_tt:0 "Voyager vers la Petite [valyria|E]"

 cob_7899_scenerio.0503.t:0 "Arrivée aux confins des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0503.desc:0 "Je me tiens ici aux confins de Volantis, à l'extérieur de [location.GetName], et je ne puis en croire mes yeux alors que je contemple les terres à quelques lieues seulement devant moi. Un nuage noir comme la nuit brisait le ciel bleu au-dessus, créant une pluie qui brûlait la peau au contact. Les terres devant semblaient enveloppées d'une brume qui obscurcissait ma vision et m'empêchait de voir ce qui se trouvait devant moi et ma caravane, créant un sentiment d'effroi que je sentais se répandre dans les rangs. Je me tournai vers Vassarion et remontai en selle avant de faire pivoter la bête vers mon ost.\n\n« Ce fut un long voyage et la route devant nous semble sombre, mes amis. Cependant, nous avons tous été choisis pour un dessein divin : reconquérir ce qui semble perdu pour chasser les ténèbres et ramener la lumière dans ce monde. [ROOT.Char.GetFaith.HighGodName] ne nous aurait pas permis de venir si loin pour nous abandonner maintenant, aussi nous irons de l'avant et reconquerrons ce qui nous appartient de droit pour rebâtir le rêve de [valyria|E] pour tous ceux qui foulent ce monde ! »\n\nL'acclamation qui s'éleva des troupes était toute la confirmation dont j'avais besoin pour savoir qu'ils étaient prêts à affronter ce qui viendrait..."
 cob_7899_scenerio.0503.a:0 "Il est temps de reconquérir notre foyer"
 cob_7899_scenerio.0503.a_tt:0 "Pénétrer en [valyria|E]"

 ##Aurion New Valyria Conquest

 cob_7899_scenerio.0510.t:0 "Archonte Aurion Ier de la Nouvelle [valyria|E]"
 cob_7899_scenerio.0510.desc:0 "Alors que je pénètre dans les salles dorées de l'Ancienne Volantis, je me sens empli d'une détermination vertueuse. Ce sont les salles que [ROOT.Char.GetFaith.HighGodName] de [valyria|E] me destinait à fouler ; les fondateurs de la colonie de l'Ancienne Volantis n'auraient jamais pu réaliser que la cité qu'ils bâtiraient était destinée par droit divin à accueillir le premier Archonte d'une Nouvelle [valyria|E].\n\nCependant, je ne puis me reposer tant que toutes les filles de l'ancien [the_freehold|E] ne seront pas sous ma bannière. Je dois rassembler les [dragonlords|E] survivants d'[essos|E] et les convoquer à ma cour. De là, nous partirons reprendre ce qui nous appartient de droit divin et par la force."
 cob_7899_scenerio.0510.a:0 "Je partirai unifier les filles de [valyria|E]"

 cob_7899_scenerio.0511.t:0 "Tout ce qui fut jadis... sera à nouveau"
 cob_7899_scenerio.0511.desc:0 "De chaque coin d'[essos|E], les autres [dragonlords|E] choisis par [ROOT.Char.GetFaith.HighGodName] pour survivre au [doom|E] se tiennent dans ma salle d'audience. Devant moi se trouvaient [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal], emplis du désir vertueux de me rejoindre pour restaurer l'ordre dans ce monde à la manière de nos ancêtres.\n\nIl ne reste plus qu'à lancer une campagne de conquête à travers les anciennes colonies des [valyrian_freehold_short|E] afin de les unifier sous la puissance du [dragon|E] une fois encore par la fureur indomptée du feu des dragons... nous marcherons depuis Volantis mais je dois maintenant décider laquelle des [free_cities|E] sera conquise en premier au nom des [dragonlords|E] de la Nouvelle [valyria|E]... dois-je frapper Myr pour ouvrir la voie vers Pentos ? Ou dois-je frapper Lys puis Tyrosh et prendre le contrôle des régions méridionales ?"
 cob_7899_scenerio.0511.a:0 "La Maison Urnebar régnera sur Tyrosh"
 cob_7899_scenerio.0511.b:0 "La Maison Sonaryen régnera sur Lys"
 cob_7899_scenerio.0511.c:0 "La Maison Mataeryon régnera sur Myr"
 cob_7899_scenerio.0511.d:0 "La Maison Belaerys régnera sur Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des [free_cities|E]"
 cob_7899_scenerio.0512.desc:0 "Je marche parmi le champ de bataille ensanglanté et en flammes, les cris des blessés se mêlant aux acclamations victorieuses de mes soldats, formant une sorte de symphonie impie à mes oreilles. Mes soldats se tiennent victorieux derrière moi tandis que j'accepte la capitulation de l'Archonte, leurs acclamations couvrant le reste du monde alors que je décrète que cette [free_city|E] est désormais sous la juridiction directe des Nouvelles [valyrian_freehold|E] et qu'un nouveau [dragonlord|E] régnera par droit divin.\n\nJe dois maintenant choisir la prochaine cité qui se soumettra à la puissance de la Nouvelle [valyria|E]..."

 cob_7899_scenerio.0516.t:0 "Un Rameau d'Olivier pour un Ancien Avant-Poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, avec les [dragonlords|E] survivants de [valyria|E] régnant sous mon autorité. Cependant, alors que je contemple la carte de mon empire en expansion, une petite chaîne d'îles de l'autre côté du [narrow_sea|El] à l'embouchure de la Baie de la Néra continue de retenir mon attention. Je pose mon doigt sur la carte près de la plus grande de ces îles... Peyredragon, un ancien avant-poste à la lisière des [valyrian_freehold|E] se tenant désormais indépendant du Nouvel Empire Valyrien.\n\nAlors que j'envisageais une déclaration de conquête pure et simple pour reprendre ce qui appartenait jadis à [valyria|E] comme je l'avais fait pour les [free_cities|E], j'eus une révélation. Les Targaryen ont survécu au [doom|E] de la même manière que les [dragonlords|E] régnant sur mon nouvel empire : par intervention divine. Par conséquent, il est logique que j'envoie un message à quiconque règne sur ce rocher désolé avec une offre de réintégrer le giron..."
 cob_7899_scenerio.0516.a:0 "Envoyer un corbeau avec une offre de prêter allégeance à la Nouvelle [valyria|E]"

 cob_7899_scenerio.0517.t:0 "Un Corbeau des [valyrian_freehold_short|E] ?"
 cob_7899_scenerio.0517.desc:0 "Je me trouve réveillé au milieu de la nuit par des coups violents à la porte de ma chambre. Je parviens à m'extirper du confort chaleureux de mon lit et à enfiler une robe pour découvrir qui ose me déranger à cette heure tardive. En ouvrant la porte, je trouve le mestre dans le couloir, un message de corbeau tremblant dans sa main. Je prends la lettre en silence, déroulant le parchemin pour en lire le contenu...\n\nPlusieurs heures plus tard, le Lord de Lamarck se tenait avec moi dans la salle du trône de Peyredragon, le même regard de stupeur sur son visage que j'avais quelques heures auparavant. [aurion.GetName] avait pris son dragon et conquis les anciennes colonies des [valyrian_freehold_short|E] pour se proclamer Archonte de la Nouvelle [valyria|E] et demandait que Peyredragon prête allégeance à ce nouvel ordre... il m'appartient maintenant de décider du sort de mon royaume..."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne s'inclinera pas devant un nouveau Lord dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons cette offre de rejoindre une Nouvelle [valyria|E]"

 cob_7899_scenerio.0518.t:0 "Un Rameau d'Olivier Rejeté et Brisé"
 cob_7899_scenerio.0518.desc:0 "« Maudits couards ! »\n\nJe froissai la réponse reçue de Peyredragon et la jetai dans l'âtre flamboyant, furieux. Comment osent-ils se croire si supérieurs qu'ils peuvent refuser de faire partie de mon nouvel empire ? Croient-ils vraiment pouvoir rester seuls dans ce monde et résister à la puissance de la Nouvelle [valyria|E] ? Cet avant-poste appartenait aux anciennes [the_freehold|E] et devrait par droit revenir à l'Empire de la Nouvelle [valyria|E], que les couards Targaryen l'habitent ou non.\n\nJe dois maintenant décider quelle ligne de conduite adopter..."
 cob_7899_scenerio.0518.a:0 "Nous ramènerons Peyredragon dans le giron de [valyria|E] par la force !"
 cob_7899_scenerio.0518.b:0 "Qu'ils restent sur leur rocher à trembler"

 # cob_7899_scenerio.0519.t:0 "An Embarassing Defeat..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "We have been beaten defeated"

 cob_7899_scenerio.0520.t:0 "Peyredragon Revient à [valyria|E]"
 cob_7899_scenerio.0520.desc:0 "C'est un jour glorieux pour mon nouvel Empire : la nouvelle est parvenue à ma cour que Peyredragon a déclaré son intention de prêter allégeance à l'Empire de la Nouvelle [valyria|E]. Avec cette nouvelle, les dernières anciennes colonies des [valyrian_freehold_short|E] ont été unifiées comme jamais auparavant avec un seul dessein : maintenir vivante la puissance des [valyrian_freehold|E] dans l'esprit de ceux qui se réjouiraient de notre disparition. Nous devons désormais rester unis contre ceux qui s'opposeraient à nous jusqu'au jour où [valyria|E] n'aura plus d'ennemis à craindre."
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueilli au sein de la Nouvelle [valyria|E]"

 ##Aurion Valyria Events

 cob_7899_scenerio.0521.t:0 "Attaque de Veur de Feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds. Tandis que la panique commence à se répandre dans le groupe, le sol devant nous s'ouvre et un veur de feu massif émerge pour nous barrer le passage.\n\n« Mon [ROOT.Char.GetLadyLord] ! Que faisons-nous ? » crie l'un des courtisans en reculant lentement comme pour battre en retraite. Je regarde autour de moi l'armée qui a choisi de me suivre dans cette quête et dois maintenant décider exactement comment nous allons gérer cette situation..."
 cob_7899_scenerio.0521.a:0 "J'affronterai la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons battre en retraite !"
 cob_7899_scenerio.0521.c:0 "L'un de mes chevaliers peut s'en charger !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Une Embuscade de Survivants des [valyrian_freehold_short|E] !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre ost traverse [location.GetName], un cri de guerre déchire l'air frais du matin, nous glaçant le sang. Même parmi les voyageurs les plus braves, ce son aurait fait courir les hommes les plus hardis se réfugier dans les jupes de leurs mères.\n\n« Des cavaliers, mon [ROOT.Char.GetLadyLord] ! » La voix d'un éclaireur retentit à travers la tension, attirant mon attention alors qu'il dégaine son épée, la pointant devant lui. Il n'y a encore rien à voir, mais le son de nombreux sabots, une douzaine de chevaux ou plus, s'amplifie, se rapproche. La panique se répand parmi nous comme un feu de forêt, une autre voix rejoignant le chœur de la peur quand ils apparaissent. « Ils sont #bold si nombreux#!! »\n\nBien que leurs effectifs ne soient pas considérables, les ennemis sont imposants, intrépides, et apparemment prêts à donner leur vie pour nos biens. À leur tête chevauche un imposant [freeholder_looter.GetWomanMan] dans les vestiges en lambeaux de ce qui fut jadis de fins vêtements valyriens, armé d'un espadon à deux mains. Le chef de cette bande crie son nom pour que tous l'entendent, [freeholder_looter.GetFirstNameNicknamed]. Le pillard en devenir proclame d'une voix confiante et puissante sa cruauté, ses raids audacieux comme celui-ci, et son tempérament de feu.\n\nAlors que les pillards approchent, mon cheval se cabre et souffle, menaçant de me désarçonner, mais je tiens fermement les rênes, me redressant sur ma selle. Levant mon [ROOT.Char.Custom('signature_weapon')] en l'air, je crie..."
 cob_7899_scenerio.0522.a:0 "Faites demi-tour ! Faites demi-tour immédiatement !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre escorte tentez de fuir les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.a.toast:0 "Fuyez !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous vous êtes échappés sans encombre. Bien fait, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous vous êtes échappés, mais cela a causé un léger retard dans votre voyage."
 cob_7899_scenerio.0522.a.majordelay:0 "Vous vous êtes échappés, mais cela a causé un retard majeur dans votre voyage."
 cob_7899_scenerio.0522.a.minortheft:0 "Vous avez sauvé vos vies, mais pas tous vos biens."
 cob_7899_scenerio.0522.a.majortheft:0 "Vous avez sauvé vos vies, mais votre bourse est tombée de votre selle pendant la fuite."
 cob_7899_scenerio.0522.a.minorcombo:0 "Malgré la manœuvre, [freeholder_looter.GetFirstNameNoTooltip] a réussi à voler certains de vos biens."
 cob_7899_scenerio.0522.a.majorcombo:0 "Malgré la manœuvre complexe, [freeholder_looter.GetFirstNameNoTooltip] a réussi à voler la plupart de vos biens."
 cob_7899_scenerio.0522.a.scattered:0 "Votre escorte a été dispersée — chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Ressaisissez-vous les gars et suivez-moi ! Chargez !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille."
 cob_7899_scenerio.0522.b.win:0 "Victoire"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez tué tous les pillards du groupe."
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef du groupe de pillards des [valyrian_freehold_short|E], [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "Le groupe de pillards des [valyrian_freehold_short|E] et leur chef [freeholder_looter.GetFirstName] se sont échappés après une heure de combat !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille."
 cob_7899_scenerio.0522.b.loss:0 "Défaite"
 cob_7899_scenerio.0522.b.robbed:0 "Vous avez été vaincus, rassemblés et dépouillés ; ils ont pris tout ce que vous aviez."
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous avez été vaincus, et les pillards ont emmené [kidnapped_entourage.GetName]..."
 cob_7899_scenerio.0522.c:0 "Et si nous parlions pot-de-vin..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]."
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] rejoint votre cour"
 cob_7899_scenerio.0522.c.else:0 "Mais devriez-vous faire confiance à un Possesseur déchu ?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] s'est enfui avec l'argent"
 cob_7899_scenerio.0522.d:0 "Si nous abandonnons [sacrificed_entourage.GetFirstNameNoTooltip], cela pourrait nous faire gagner du temps."
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifierez [sacrificed_entourage.GetName] pour tenter de distraire les pillards."
 cob_7899_scenerio.0522.d.sacrifice:0 "PLACEHOLDER"

 cob_7899_scenerio.0523.t:0 "Rencontre avec un Soldat Valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissaient la vue tout en étouffant le souffle de tous dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et demande qu'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Alors que j'attends, l'un de mes éclaireurs crie et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un du groupe, vêtu des habits d'un officier de bas rang, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiqué par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Dois-je essayer de les convaincre de rejoindre mon ost ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Vous devriez nous rejoindre !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissaient la vue tout en étouffant le souffle de tous dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et demande qu'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Alors que j'attends, l'un de mes éclaireurs crie et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un du groupe, vêtu des habits d'un officier de bas rang, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiqué par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Dois-je essayer de les convaincre de rejoindre mon ost ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0524.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0524.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b:0 "Vous devriez nous rejoindre !"
 cob_7899_scenerio.0524.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0524.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0524.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0525.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0525.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissaient la vue tout en étouffant le souffle de tous dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et demande qu'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Alors que j'attends, l'un de mes éclaireurs crie et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un du groupe, vêtu des vestiges en lambeaux d'un Général Valyrien, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiqué par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Envoyer [vassarion.GetName] combattre ? Ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0525.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0525.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b:0 "Vous affronterez [vassarion.GetName] !"
 cob_7899_scenerio.0525.b_1_tt:0 "[freeholder_survivor.GetName] meurt !"
 cob_7899_scenerio.0525.b_2_tt:0 "[vassarion.GetName] meurt !"
 cob_7899_scenerio.0525.b.win:0 "[vassarion.GetName] tue [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b.dead:0 "[freeholder_survivor.GetName] parvient à survivre face à [vassarion.GetName]"
 cob_7899_scenerio.0525.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0525.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0527.t:0 "Embuscade par un Lord Dragon"
 cob_7899_scenerio.0527.desc:0 "Alors que je vole sur [vassarion.GetName] à l'avant-garde de mon ost au-dessus des ruines de [location.GetName], un cri perçant déchire l'air suivi d'une massive boule de feu draconique qui manque de tout incinérer autour de moi.\n\nJe me réoriente pour scruter les nuages au-dessus à la recherche du [dragon|E] sauvage qui a survécu au cataclysme pour m'attaquer. Bientôt l'agresseur se fit connaître et, à ma grande surprise, le [dragon|E] avait un cavalier qui commença à faire planer sa bête tout aussi massive devant moi. Je décide de parler avec [freeholder_dragonlord.GetHerHim] avant une autre attaque.\n\n« Je suis [aurion.GetName] et je suis revenu sur ces terres pour les reconquérir pour [valyria|E]. » crié-je vers le [dragonlord|E]\n\n« Peu m'importe [aurion.GetName], je suis [freeholder_dragonlord.GetName], cavalier de [enemy_dragon.GetName] et je revendique toutes ces terres sur lesquelles vous êtes un intrus. »"
 cob_7899_scenerio.0527.a:0 "J'affronterai [freeholder_dragonlord.GetName] et son [dragon|E]"
 cob_7899_scenerio.0527.a_tt:0 "Un duel de [dragon|E] commence avec [freeholder_dragonlord.GetName]"
 cob_7899_scenerio.0527.b:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0527.b_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0529.t:0 "Un Retour Doux-Amer"
 cob_7899_scenerio.0529.desc:0 "Je descends du navire sur les quais de pierre en ruines de [location.GetName], les yeux fixés sur les portes calcinées et dévastées de la capitale valyrienne.\n\n« Je suis chez moi » pensé-je. « Je suis enfin chez moi... mais il reste encore beaucoup à accomplir avant que les [valyrian_freehold_short|E] ne se relèvent. »\n\nJe mets un genou à terre et pose ma main sur la pierre chaude du quai pour un bref instant, puis je relève la tête et me mets en route pour restaurer les ruines de cette puissante cité une fois encore..."
 cob_7899_scenerio.0529.a:0 "Je suis revenu chez moi à [valyria|E]..."

# Updated Firewyrm Attack
 cob_7899_scenerio.0541.t:0 "Attaque de Veur de Feu !"
 cob_7899_scenerio.0541.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds. Tandis que la panique commence à se répandre dans le groupe, le sol devant nous s'ouvre et un Veur de Feu massif émerge pour nous barrer le passage.\n\n« Mon [ROOT.Char.GetLadyLord] ! Que faisons-nous ? » crie l'un des courtisans en reculant lentement comme pour battre en retraite. Je regarde autour de moi l'armée qui a choisi de me suivre dans cette quête et dois maintenant décider exactement comment nous allons gérer cette situation..."
 cob_7899_scenerio.0541.duel.dragon:0 "[vassarion.GetName] ! Aderī !"
 cob_7899_scenerio.0541.duel.dragon.tt:0 "Vous appelez rapidement votre dragon et vous préparez à affronter la bête."
 cob_7899_scenerio.0541.duel:0 "Acier et feu, alors. Que les dieux en soient témoins."
 cob_7899_scenerio.0541.duel.tt:0 "Vous tenez bon et tentez de tuer le veur de feu."
 cob_7899_scenerio.0541.b:0 "Nous devons battre en retraite !"

 cob_7899_scenerio.9998.t:0 "L'Expédition Perdue d'Aurion"
 cob_7899_scenerio.9998.desc:0 "En traversant les terres de Valyria, votre groupe tombe sur ce qui semble être un immense cimetière de squelettes figés dans diverses poses de terreur...\n\nAprès quelques explorations, vous déterminez qu'il doit s'agir du dernier lieu de repos de l'expédition d'Aurion Varezys en Valyria. Au centre du carnage, vous trouvez le squelette d'un grand dragon enroulé autour du squelette en armure de son cavalier, que vous croyez être Aurion. À première vue, il semble que le dragon essayait de protéger Aurion de... quelque chose. Un sentiment d'effroi vous traverse à l'idée de quelque chose de si horrifiant qu'un dragon de cette taille savait que la fin était proche.\n\nVous devez maintenant décider si vous allez profaner cette sépulture et récupérer l'épée et l'armure de la Maison Varezys, sachant que selon les anciennes légendes, une telle action entraînera un châtiment..."
 cob_7899_scenerio.9998.a:0 "Prendre les artefacts et accepter le châtiment"
 cob_7899_scenerio.9998.b:0 "Je récupérerai l'héritage de ma famille"
 cob_7899_scenerio.9998.c:0 "Ces artefacts doivent rester dans ce cimetière"


 cob_7899_scenerio.9999.t:0 "Tentative de Défier les Dieux"
 cob_7899_scenerio.9999.desc:0 "Vous vous retrouvez au milieu d'un rêve, une peur profonde vous envahit alors qu'une voix tonne depuis les ténèbres\n\n« Vous avez tenté de défier la volonté des Dieux, l'artefact que vous avez tenté d'invoquer a été perdu dans la magie profonde et ne pourra être récupéré que lorsque les Dieux le jugeront bon. »\n\nQuelques instants plus tard, vous parvenez à vous réveiller, confus par ce qui vient de se passer...\n\nNOTE DEV - cet artefact est actuellement bloqué et ne peut être généré via debug car il y a une chaîne d'événements cachée dans le monde pour le récupérer"
 cob_7899_scenerio.9999.a:0 "Je dois vraiment arrêter de boire..."
 cob_7899_scenerio.9999.b:0 "JE FAIS CE QUE JE VEUX (n'appuyez pas, mais vous le ferez quand même)"

 cob_decisions.0001.t:0 "Un Message de Valyria ?"
 cob_decisions.0001.desc:0 "Je contemple la lettre dans ma main avec une simple incrédulité. Quelqu'un nommé [dragonlord_of_valyria.GetName] prétend avoir repeuplé Valyria et demande à tous les dragonniers de revenir réclamer leur droit de naissance. J'ai apprécié ma vie de dragonnier dans ce monde et je ne sais pas si je souhaite vivre sous l'autorité de quelqu'un d'autre..."
 cob_decisions.0001.a:0 "J'accepterai la proposition de [dragonlord_of_valyria.GetNamePossessive]"
 cob_decisions.0001.b:0 "Je dois décliner et trouver ma propre voie"

 cob_decisions.0002.t:0 "Une Proposition Acceptée"
 cob_decisions.0002.desc:0 "Je contemple le parchemin dans mes mains et célèbre discrètement ma bonne fortune. [dragonlord.GetName] a accepté ma proposition et souhaite venir à ma cour immédiatement. Aujourd'hui est véritablement un jour glorieux pour Valyria."
 cob_decisions.0002.a:0 "Je ferai les préparatifs pour les recevoir"

 cob_decisions.0003.t:0 "Une Proposition Rejetée"
 cob_decisions.0003.desc:0 "Je ne puis croire les mots que je lis... [dragonlord.GetName] a rejeté ma proposition de venir à Valyria réclamer son droit de naissance. C'est véritablement un revers, mais peut-être qu'une fois que j'aurai rassemblé plus de pouvoir et de titres, je pourrai tenter de les attirer à nouveau avec plus de succès..."
 cob_decisions.0003.a:0 "Nous poursuivrons"



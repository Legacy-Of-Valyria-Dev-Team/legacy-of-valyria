 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je parcours les couloirs du palais en ruines de [location.GetName], jadis demeure de [Nymeria.GetName] des Rhoynars, et je me retrouve plongé dans les récits que ma mère me contait enfant. Des histoires sur les [dragonlords|E] d'antan et leurs conquêtes à travers [essos|E], s'emparant de ce qui leur revenait de droit divin par la flamme draconique. Ceux qui ployaient le genou étaient épargnés, tandis que ceux qui résistaient étaient effacés du monde ou contraints à l'exil, leurs anciens royaumes abandonnés à la putréfaction, tout comme celui-ci.\n\nAlors que ces récits affluent dans mon esprit, je ne peux m'empêcher de me demander si le [valyrian_freehold_short|E] s'est affaibli au fil du temps. Je me demande si ces conquérants, ces héros des légendes, regarderaient mes frères avec honte pour ce que nous sommes devenus. Valyria fut jadis le pinacle du monde, mais à la fin, nous n'étions que des enfants querelleurs se disputant pouvoir et richesses... peut-être est-ce pour cela que [ROOT.Char.GetFaith.HighGodName] a choisi de [doom|E] notre peuple... peut-être ai-je été choisi pour maintenir vivant le rêve de Valyria"
 cob_7899_scenerio.0500.a:0 "Nous avançons vers la Porte Lugubre"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers la Porte Lugubre"

 cob_7899_scenerio.0501.t:0 "La Décision à la Porte Lugubre"
 cob_7899_scenerio.0501.desc:0 "Tandis que je contemple les eaux du Risou, les ruines de [location.GetName], une autre conquête du [valyrian_freehold_short|E], derrière moi, je réalise qu'en cet instant j'ai un choix à faire. Je peux poursuivre la quête que j'avais imaginée au début de ce voyage et mener mon ost vers les restes possiblement calcinés et emplis de magma de Valyria pour restaurer la puissance du [valyrian_freehold_short|E] à mon image... ou... je peux incarner l'esprit des premiers [dragonlords|E] de Valyria, rassembler les Seigneurs Dragons survivants d'[essos|E] et reconquérir les colonies du [valyrian_freehold_short|E] par droit de conquête et feu draconique.\n\nDebout à la frontière de [GetTitleByKey('k_volantis').GetName], je dois décider - dois-je entreprendre le voyage vers les terres brûlées de [GetTitleByKey('e_valyria').GetName], ou dois-je forger une Nouvelle Valyria à l'image de mes ancêtres ?\n\n#bold AVERTISSEMENT - les deux voies s'avéreront difficiles, il est recommandé de sauvegarder fréquemment pour éviter une fin de partie#!"
 cob_7899_scenerio.0005.b:0 "Je conquerrai les cités libres pour former une Nouvelle Valyria"
 cob_7899_scenerio.0501.a:0 "Nous devons nous ravitailler à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager vers Volantis"

 ##Aurion Valyria Expedition

 cob_7899_scenerio.0502.t:0 "Ravitaillement au Long Pont"
 cob_7899_scenerio.0502.desc:0 "La première chose que je remarquai à propos de [location.GetName] fut le bruit incessant et interminable qui semblait envahir chaque recoin de la cité. Je ne saurais dire avec certitude, mais il semblait presque que la cité était dix fois plus bruyante que la capitale valyrienne tout en étant moins de la moitié de sa taille. La seule chose pire que le bruit était l'odeur : gens crasseux, latrines surutilisées et mal entretenues, poisson et une multitude d'autres effluves se mêlant pour former le plus impie des parfums le long du pont où mon campement se ravitaillait.\n\nHeureusement, nous ne tarderions pas à reprendre notre marche vers Valyria pour reconquérir notre foyer. En traversant les rues, j'avais remarqué un nombre croissant de personnes célébrant la chute de ma patrie, déclarant que le monde était enfin libéré de l'emprise étouffante du [valyrian_freehold_short|E]. Je ne m'engageai pas avec eux, reconnaissant d'avoir gardé [vassarion.GetName] hors de la cité pour éviter toute confrontation inutile durant mon voyage.\n\nAucune de leurs pensées n'importait vraiment car ils verraient la vérité : moi, [aurion.GetName], je retournerais à Valyria et la ramènerais à sa gloire d'antan. Pour l'heure, je pouvais prendre le temps de me détendre avant de poursuivre vers ce qu'il reste de mon foyer..."
 cob_7899_scenerio.0502.a:0 "Il est temps d'avancer vers Petite Valyria"
 cob_7899_scenerio.0502.a_tt:0 "Voyager vers Petite Valyria"

 cob_7899_scenerio.0503.t:0 "Arrivée aux confins du [valyrian_freehold_short|E]"
 cob_7899_scenerio.0503.desc:0 "Je me tiens ici, aux confins de Volantis, devant [location.GetName], et je peine à croire ce que mes yeux contemplent lorsque je fixe les terres situées quelques lieues plus loin. Un nuage aussi noir que la nuit tranchait avec le ciel bleu au-dessus, créant une pluie qui brûlait la peau à son contact. Les terres devant nous semblaient voilées d'une brume qui troublait ma vision et m'empêchait de discerner ce qui pourrait se trouver devant moi et ma caravane, instillant une terreur que je sentais se répandre dans les rangs. Je me tournai vers Vassarion et remontai en selle avant de diriger la bête vers mon ost.\n\n« Ce fut un long voyage et la route qui nous attend semble sombre, mes amis. Cependant, nous avons tous été choisis pour un dessein divin : reprendre ce qui semble perdu, chasser les ténèbres et ramener la lumière en ce monde. [ROOT.Char.GetFaith.HighGodName] ne nous aurait pas permis de venir si loin pour nous abandonner maintenant. Nous allons donc avancer et récupérer ce qui nous appartient de droit pour reconstruire le rêve de Valyria pour tous ceux qui foulent cette terre ! »\n\nL'acclamation qui s'éleva des troupes était toute la confirmation dont j'avais besoin pour affirmer qu'elles étaient prêtes à affronter ce qui pourrait advenir..."
 cob_7899_scenerio.0503.a:0 "Il est temps de reprendre notre foyer"
 cob_7899_scenerio.0503.a_tt:0 "Voyager vers Valyria"

 ##Aurion New Valyria Conquest

 cob_7899_scenerio.0510.t:0 "Empereur Aurion Ier de Nouvelle Valyria"
 cob_7899_scenerio.0510.desc:0 "En pénétrant dans les salles dorées de Vieille-Volantis, je me sens empli d'une détermination vertueuse. Voici les salles où [ROOT.Char.GetFaith.HighGodName] de Valyria m'a destiné à siéger. Les fondateurs de la colonie de Vieille-Volantis n'auraient jamais pu imaginer que la cité qu'ils construiraient serait destinée, par droit divin, à accueillir le premier Empereur d'une Nouvelle Valyria.\n\nCependant, je ne pourrai me reposer avant que toutes les filles de l'ancien [the_freehold|E] ne soient sous ma bannière. Je dois rassembler les [dragonlords|E] survivants d'[essos|E] et les convoquer à ma cour. De là, nous partirons reconquérir ce qui nous revient de droit divin et par la force"
 cob_7899_scenerio.0510.a:0 "Je m'en vais unir les filles de Valyria"

 cob_7899_scenerio.0511.t:0 "Tout Ce Qui Fut... Sera À Nouveau"
 cob_7899_scenerio.0511.desc:0 "De tous les recoins d'[essos|E], les autres [dragonlords|E] choisis par [ROOT.Char.GetFaith.HighGodName] pour survivre au [doom|E] se tiennent dans ma salle d'audience. Devant moi se tenaient [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal], animés du désir vertueux de me rejoindre pour restaurer l'ordre en ce monde comme le firent jadis nos ancêtres.\n\nIl ne reste plus qu'à lancer une campagne de conquête à travers les anciennes colonies du [valyrian_freehold_short|E] afin de les unir sous la puissance du [dragon|E] une fois de plus, par la fureur indomptée du feu draconique... Nous partirons de Volantis, mais je dois maintenant décider laquelle des Cités Libres sera conquise en premier au nom des [dragonlords|E] de Nouvelle Valyria... Dois-je frapper Myr pour ouvrir la voie vers Pentos ? Ou dois-je attaquer Lys puis Tyrosh et prendre le contrôle des régions méridionales?"
 cob_7899_scenerio.0511.a:0 "La Maison Urnebar gouvernera Tyrosh"
 cob_7899_scenerio.0511.b:0 "La Maison Sonaryen gouvernera Lys"
 cob_7899_scenerio.0511.c:0 "La Maison Mataeryon gouvernera Myr"
 cob_7899_scenerio.0511.d:0 "La Maison Belaerys gouvernera Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des Cités Libres"
 cob_7899_scenerio.0512.desc:0 "Je marche parmi le champ de bataille sanglant et fumant, les cris des blessés se mêlant aux acclamations triomphales de mes soldats pour former une sorte de symphonie impie à mes oreilles. Mes soldats se tiennent victorieux derrière moi tandis que j'accepte la capitulation de l'Archonte, leurs vivats étouffant le reste du monde alors que je décrète que cette [free_city|E] est désormais sous la juridiction directe du Nouveau [valyrian_freehold|E] et qu'un nouveau [dragonlord|E] y règnera par droit divin.\n\nJe dois maintenant choisir la prochaine cité qui se soumettra à la puissance de la Nouvelle Valyria..."

 cob_7899_scenerio.0516.t:0 "Un Rameau d'Olivier pour un Ancien Avant-poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, avec les [dragonlords|E] survivants de Valyria régnant sous mon autorité. Cependant, alors que je contemple la carte de mon empire grandissant, une petite chaîne d'îles de l'autre côté du [narrow_sea|El], à l'embouchure de la baie de la Néra, continue de capter mon attention. Je pose mon doigt sur la carte près de la plus grande de ces îles... Peyredragon, un ancien avant-poste à l'extrême frontière du [valyrian_freehold|E], désormais indépendant de l'Empire de Nouvelle Valyria.\n\nAlors que j'envisageais une déclaration directe de conquête pour récupérer ce qui appartenait autrefois à Valyria, comme je l'avais fait pour les [free_cities|E], j'eus une révélation. Les Targaryen ont survécu au [doom|E] de la même façon que les [dragonlords|E] qui règnent sur mon nouvel empire : par intervention divine. Il est donc logique que j'envoie un message à quiconque gouverne ce rocher désolé, avec une offre pour être à nouveau accueilli dans le giron..."
 cob_7899_scenerio.0516.a:0 "Envoyez un corbeau avec une offre de prêter allégeance à la Nouvelle Valyria"

 cob_7899_scenerio.0517.t:0 "Un Corbeau des [valyrian_freehold_short|E]?"
 cob_7899_scenerio.0517.desc:0 "Je me trouve réveillé au milieu de la nuit par de bruyants coups à la porte de ma chambre. Je parviens à m'extraire du confort chaleureux de mon lit et passe une robe pour découvrir qui oserait me déranger à une heure si tardive. En ouvrant la porte, je trouve le mestre debout dans le couloir, un message de corbeau dans sa main tremblante. Je prends la lettre en silence, déroulant le parchemin pour en lire le contenu...\n\nPlusieurs heures plus tard, le Seigneur de Pontdemousse se tenait avec moi dans la salle du trône de Peyredragon, arborant le même regard stupéfait que j'avais eu quelques heures auparavant. [aurion.GetName] avait enfourché son dragon et conquis les anciennes colonies du [valyrian_freehold_short|E] pour se déclarer Empereur de Nouvelle Valyria, et demandait que Peyredragon prête allégeance à ce nouvel ordre... Il m'appartient maintenant de décider du sort de mon royaume..."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne ploiera pas le genou devant un nouveau Seigneur Dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons cette offre de rejoindre une Nouvelle Valyria"

 cob_7899_scenerio.0518.t:0 "Un Rameau d'Olivier Rejeté et Brisé"
 cob_7899_scenerio.0518.desc:0 "« Maudits lâches ! »\n\nJe froissai la réponse reçue de Peyredragon et la jetai dans l'âtre flamboyant avec rage. Comment osent-ils se croire si supérieurs qu'ils peuvent refuser de faire partie de mon nouvel empire ? Croient-ils vraiment pouvoir rester seuls en ce monde et résister à la puissance de la Nouvelle Valyria ? Cet avant-poste appartenait à l'ancien [the_freehold|E] et devrait, de droit, revenir à l'Empire de Nouvelle Valyria, que les couards Targaryen l'habitent ou non.\n\nJe dois maintenant décider quelle action entreprendre..."
 cob_7899_scenerio.0518.a:0 "Nous ramènerons Peyredragon dans le giron de Valyria par la force !"
 cob_7899_scenerio.0518.b:0 "Qu'ils restent sur leur rocher à trembler"

 # cob_7899_scenerio.0519.t:0 "Une Défaite Embarrassante..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "Nous avons été vaincus"

 cob_7899_scenerio.0520.t:0 "Peyredragon Retourne à Valyria"
 cob_7899_scenerio.0520.desc:0 "C'est un jour glorieux pour mon nouvel Empire : la nouvelle est parvenue à ma cour que Peyredragon a déclaré son intention de prêter allégeance à l'Empire de Nouvelle Valyria. Avec cette annonce, les dernières des anciennes colonies du [valyrian_freehold_short|E] ont été unies comme jamais auparavant avec un seul objectif : maintenir la puissance du [valyrian_freehold|E] vivante dans l'esprit de ceux qui se réjouiraient de notre chute. Nous devons désormais rester unis contre ceux qui s'opposeraient à nous jusqu'au jour où Valyria n'aura plus d'ennemis à craindre"
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueilli dans la Nouvelle Valyria"

 ##Aurion Valyria Events

 cob_7899_scenerio.0521.t:0 "Attaque de Vouivre de feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds. Tandis que la panique commence à se répandre parmi notre groupe, le sol s'ouvre devant nous et une énorme vouivre de feu émerge pour nous barrer le passage.\n\n« Mon [ROOT.Char.GetLadyLord] ! Que faisons-nous ? » s'écrie l'un des courtisans en reculant lentement comme pour battre en retraite. Je regarde l'armée qui a choisi de me suivre dans cette quête et dois maintenant décider exactement comment nous allons gérer cette situation..."
 cob_7899_scenerio.0521.a:0 "J'affronterai la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons nous replier !"
 cob_7899_scenerio.0521.c:0 "L'un de mes chevaliers peut s'en charger !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Une Embuscade de Survivants du [valyrian_freehold_short|E] !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre ost traverse [location.GetName], un cri de guerre déchire l'air fin du matin, nous glaçant le sang. Même parmi les voyageurs les plus braves, ce son aurait poussé des hommes hardis à se réfugier sous les jupes de leurs mères.\n\n« Des cavaliers, mon [ROOT.Char.GetLadyLord] ! » La voix d'un éclaireur retentit à travers la tension, attirant mon attention tandis qu'il dégaine son épée, la pointant vers l'avant. Il n'y a encore rien à voir, mais le bruit de nombreux sabots, une douzaine de chevaux ou plus, s'intensifie, se rapprochant. La panique se répand parmi nous comme une traînée de poudre, une autre voix rejoignant le chœur de la peur lorsqu'ils apparaissent à notre vue. « Il y en a #bold tellement#!! »\n\nBien que leur nombre ne soit pas important, les ennemis sont grands, intrépides et semblent prêts à perdre la vie pour nos biens. À leur tête chevauche un[freeholder_looter.GetWomanMan] immense dans les vestiges déchirés de ce qui fut jadis de fins atours valyriens, armé[freeholder_looter.GetWomanMan] d'une épée à deux mains. Le chef de cette bande clame son nom pour que tous l'entendent, [freeholder_looter.GetFirstNameNicknamed]. Le pillard en herbe déclare d'une voix confiante et puissante [freeholder_looter.GetHerHis] cruauté, [freeholder_looter.GetHerHis] raids audacieux comme celui-ci, et [freeholder_looter.GetHerHis] tempérament fougueux.\n\nTandis que les pillards se rapprochent, mon cheval se cabre et renâcle, menaçant de me désarçonner, mais je tiens fermement les rênes, me redressant. Levant mon [ROOT.Char.Custom('signature_weapon')] en l'air, je crie..."
 cob_7899_scenerio.0522.a:0 "Reculez ! Reculez immédiatement !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre entourage tentez de fuir les pillards du [valyrian_freehold_short|E]"
 cob_7899_scenerio.0522.a.toast:0 "Prenez la Fuite !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous vous êtes échappé sans encombre. Dans les dents, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous vous êtes échappé, mais cela a causé un léger retard dans votre voyage"
 cob_7899_scenerio.0522.a.majordelay:0 "Vous vous êtes échappé, mais cela a causé un retard important dans votre voyage"
 cob_7899_scenerio.0522.a.minortheft:0 "Vous avez pu sauver vos vies, mais pas tous vos biens"
 cob_7899_scenerio.0522.a.majortheft:0 "Vous avez pu sauver vos vies, mais votre bourse est tombée de votre selle pendant la fuite"
 cob_7899_scenerio.0522.a.minorcombo:0 "Malgré la manœuvre, [freeholder_looter.GetFirstNameNoTooltip] a réussi à voler une partie de vos affaires"
 cob_7899_scenerio.0522.a.majorcombo:0 "Malgré la manœuvre complexe, [freeholder_looter.GetFirstNameNoTooltip] a réussi à voler la plupart de vos affaires"
 cob_7899_scenerio.0522.a.scattered:0 "Votre entourage a été dispersé — chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Ressaisissez-vous, soldats, et suivez-moi ! Chargez !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez les pillards du [valyrian_freehold_short|E]"
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille"
 cob_7899_scenerio.0522.b.win:0 "Vous Avez Gagné"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez tué tous les pillards du groupe"
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef du groupe de pillards du [valyrian_freehold_short|E], [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "Le groupe de pillards du [valyrian_freehold_short|E] et leur chef [freeholder_looter.GetFirstName] se sont échappés après une heure de combat !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille"
 cob_7899_scenerio.0522.b.loss:0 "Vous Avez Perdu"
 cob_7899_scenerio.0522.b.robbed:0 "Vous avez été vaincu, encerclé et dépouillé ; ils ont pris tout ce que vous aviez"
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous avez été vaincu, et les pillards ont emmené [kidnapped_entourage.GetName]..."
 cob_7899_scenerio.0522.c:0 "Et si nous proposions un pot-de-vin..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]"
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] Rejoint Votre Cour"
 cob_7899_scenerio.0522.c.else:0 "Mais devriez-vous faire confiance à un Possesseur déchu?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] S'est Enfui avec l'Argent"
 cob_7899_scenerio.0522.d:0 "Si nous abandonnons [sacrificed_entourage.GetFirstNameNoTooltip], cela pourrait nous faire gagner du temps"
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifierez [sacrificed_entourage.GetName] pour tenter de distraire les pillards"

 cob_7899_scenerio.0523.t:0 "Rencontre avec un Soldat Valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous traversons les terres en ruines de [location.GetName], l'air chargé de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de tous ceux qui m'accompagnent. Je décide que nous devrions prendre un moment pour nous repérer et appelle à ce qu'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs lance un cri et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un du groupe, vêtu des habits d'un officier de rang inférieur, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et votre ost est encerclé. [location.GetName] a été revendiqué par nous et vous vous rendrez à moi. »\n\nJe dois maintenant décider quoi faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de les convaincre de rejoindre mon ost ou devrions-nous battre en retraite?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Vous devriez nous rejoindre !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous traversons les terres en ruines de [location.GetName], l'air chargé de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de tous ceux qui m'accompagnent. Je décide que nous devrions prendre un moment pour nous repérer et appelle à ce qu'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs lance un cri et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un du groupe, vêtu des habits d'un officier de rang inférieur, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et votre ost est encerclé. [location.GetName] a été revendiqué par nous et vous vous rendrez à moi. »\n\nJe dois maintenant décider quoi faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de les convaincre de rejoindre mon ost ou devrions-nous battre en retraite?"

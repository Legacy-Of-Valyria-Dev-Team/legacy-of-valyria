#  cob_7899_scenerio.0400.desc:0 "À mon arrivée à [GetTitleByKey('c_lannisport').GetName], je suis immédiatement accueilli par [lannisport.GetName] qui m'informe rapidement que mon navire a été préparé et est prêt à prendre la mer. Je sens une grande vague d'énergie me traverser à l'idée de commencer mon voyage. J'étais impatient au palais, attendant ce moment, sachant que chaque heure qui passait était une heure de plus durant laquelle quelqu'un d'autre pourrait arriver et revendiquer les restes des [valyrian_freehold_short|E] avant moi.\n\nL'heure est venue de prendre la mer et d'entamer le long voyage vers [essos|E] afin de découvrir ce qui reste de Valyria après le [doom|E]. La flotte partira pour Valyria dès que je serai à bord de mon navire amiral, faisant sa première escale à [GetTitleByKey('c_oldtown').GetName] pour acheter des provisions et poursuivre le voyage. Cette quête s'avérera coûteuse, mais à la fin, les richesses des [valyrian_freehold_short|E] compenseront largement ces dépenses"

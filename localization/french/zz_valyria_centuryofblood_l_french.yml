 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je marche dans les couloirs du palais en ruines de [location.GetName], qui fut autrefois la demeure de [Nymeria.GetName] des Rhoynar, et je me retrouve transporté dans les histoires que ma mère me racontait lorsque j’étais enfant. Des histoires sur les [dragonlords|E] d’antan et leurs conquêtes à travers [essos|E], s’emparant de ce qui leur revenait de droit par décret divin et par le feu des dragons. Ceux qui se soumettaient étaient épargnés et ceux qui résistaient étaient éradiqués ou chassés en exil, leurs anciens royaumes laissés à l'abandon, pourrissant comme celui-ci.\n\nAlors que je laisse ces récits envahir mon esprit, je ne peux m'empêcher de me demander si les [freehold|E] ne sont pas devenues faibles avec le temps. Je me demande si ces conquérants, ces héros des histoires, regarderaient aujourd’hui leurs descendants avec honte pour ce que nous sommes devenus. Valyria fut jadis le sommet du monde, mais à la fin, il semblait que nous n'étions plus que des enfants querelleurs se disputant pouvoir et richesse... peut-être est-ce pour cela que [ROOT.Char.GetFaith.HighGodName] a choisi de [doom|E] notre peuple... peut-être ai-je été choisi pour maintenir vivant le rêve de Valyria."
 cob_7899_scenerio.0500.a:0 "En avant vers la Porte Lugubre"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers la Porte Lugubre"

 cob_7899_scenerio.0501.t:0 "La décision à la Porte Lugubre"
 cob_7899_scenerio.0501.desc:0 "Alors que je me tiens devant les eaux du Rhoyne, les ruines de [location.GetName], une autre conquête des [freehold|E], derrière moi, je réalise qu’en cet instant un choix s’offre à moi. Je peux continuer la quête que j’avais imaginée au début de ce voyage, marcher avec mon armée vers les terres peut-être encore brûlantes et recouvertes de magma de Valyria, et restaurer la puissance des [freehold|E] à mon image... ou... je peux incarner l’esprit des premiers [dragonlords|E] de Valyria, rassembler les derniers Dragonlords survivants d’[essos|E] et reconquérir les anciennes colonies des [freehold|E] par le droit du feu draconique.\n\nMe tenant à la frontière de [GetTitleByKey('k_volantis').GetName], je dois décider : entreprendre le voyage vers les terres calcinées de [GetTitleByKey('e_valyria').GetName], ou bien avancer et forger une Nouvelle Valyria dans la tradition de mes ancêtres.\n\n#bold AVERTISSEMENT - quel que soit le chemin choisi, il sera difficile. Il est recommandé de sauvegarder fréquemment pour éviter une défaite prématurée#!"
 cob_7899_scenerio.0005.b:0 "Je conquérirai les cités libres pour fonder une Nouvelle Valyria"
 cob_7899_scenerio.0501.a:0 "Nous devons nous ravitailler à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager jusqu'à Volantis"

##Aurion Valyria Expedition

cob_7899_scenerio.0502.t:0 "Ravitaillement au Pont Long"
cob_7899_scenerio.0502.desc:0 "La première chose que je remarquai en arrivant à [location.GetName] fut le vacarme incessant et omniprésent qui semblait imprégner chaque recoin de la cité. Je ne saurais dire avec certitude, mais il me sembla que cette ville était presque dix fois plus bruyante que la capitale valyrienne, tout en étant deux fois plus petite. Le seul élément pire que le bruit était l’odeur : des gens sales, des latrines surchargées et mal entretenues, des poissons et toute une multitude d’autres effluves se mêlaient pour former les plus nauséabondes senteurs tout le long du pont où mon camp se ravitaillait.\n\nHeureusement, nous ne tarderions pas à reprendre notre marche vers Valyria pour y reconquérir notre foyer. En traversant les rues, je remarquai une foule grandissante de gens célébrant la chute de ma patrie, proclamant que le monde était enfin libéré de l’emprise étouffante des [freehold|E]. Je ne les confrontai point, heureux d’avoir laissé [vassarion.GetName] hors de la ville afin d’éviter tout affrontement inutile sur notre chemin.\n\nAucune de leurs paroles n’avait d’importance, car ils verraient bientôt la vérité : moi, [aurion.GetName], je retournerai à Valyria et lui rendrai sa grandeur d’antan. Pour l’heure, je pouvais prendre un moment de repos avant de poursuivre vers ce qu’il reste de mon foyer..."
cob_7899_scenerio.0502.a:0 "Il est temps d'avancer vers Petite Valyria"
cob_7899_scenerio.0502.a_tt:0 "Voyager vers Petite Valyria"

cob_7899_scenerio.0503.t:0 "Arrivée aux confins des Possessions"
cob_7899_scenerio.0503.desc:0 "Je me tiens ici, à la lisière de Volantis, devant [location.GetName], et je ne peux croire ce que mes yeux aperçoivent au loin. Un nuage noir comme la nuit déchire le ciel bleu, déversant une pluie qui brûle la peau au toucher. Devant nous, une brume flotte sur les terres, troublant ma vision et dissimulant ce qui pourrait s'y trouver, semant un malaise que je sens se répandre dans les rangs. Je me tourne vers Vassarion et remonte en selle avant de diriger la bête vers mon ost.\n\n« Le voyage fut long et la voie devant nous semble sombre, mes amis. Cependant, nous avons tous été choisis pour une mission sacrée : reprendre ce qui semble perdu, chasser les ténèbres et rendre la lumière au monde. [ROOT.Char.GetFaith.HighGodName] ne nous aurait pas laissés venir jusqu'ici pour nous abandonner maintenant. Nous irons de l'avant pour reconquérir ce qui nous revient et rebâtir le rêve de Valyria pour tous ceux qui foulent cette terre ! »\n\nLes acclamations qui s’élevèrent des troupes furent la seule confirmation dont j'avais besoin pour savoir qu'ils étaient prêts à affronter ce qui nous attendait..."
cob_7899_scenerio.0503.a:0 "Il est temps de reconquérir notre foyer"
cob_7899_scenerio.0503.a_tt:0 "Voyager en Valyria"

 ##Conquête de la Nouvelle Valyria par Aurion

 cob_7899_scenerio.0510.t:0 "Archonte Aurion Ier de la Nouvelle Valyria"
 cob_7899_scenerio.0510.desc:0 "Alors que je foule les couloirs dorés de l'ancienne Volantis, je me sens empli d'une détermination juste. Ce sont ces salles que [ROOT.Char.GetFaith.HighGodName] de Valyria m'avait destiné à occuper ; les fondateurs de la colonie de l'ancienne Volantis n'auraient jamais pu imaginer que la cité qu'ils bâtissaient était destinée par droit divin à accueillir le premier Archonte d'une Nouvelle Valyria.\n\nCependant, je ne pourrai goûter au repos tant que toutes les filles des anciennes [freehold|E] ne seront pas réunies sous ma bannière. Je dois rassembler les [dragonlords|E] survivants en [essos|E] et les convoquer à ma cour. De là, nous partirons reconquérir ce qui nous revient de droit par le feu du dragon et la volonté divine."
 cob_7899_scenerio.0510.a:0 "Je partirai unir les filles de Valyria"

 cob_7899_scenerio.0511.t:0 "Tout ce qui fut... renaîtra"
 cob_7899_scenerio.0511.desc:0 "De tous les coins de [essos|E], les autres [dragonlords|E] choisis par [ROOT.Char.GetFaith.HighGodName] pour survivre au [doom|E] se tiennent dans ma salle d’audience. Devant moi se tiennent [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal], remplis du désir ardent de restaurer l'ordre dans le monde, tout comme nos ancêtres autrefois.\n\nIl ne reste plus désormais qu'à lancer une campagne de conquête à travers les anciennes colonies des [freehold|E], afin de les unir de nouveau sous la domination des [dragon|E] par la furie déchaînée du feu de dragon... Nous marcherons depuis Volantis, mais je dois maintenant décider quelle cité libre tombera la première au nom des [dragonlords|E] de la Nouvelle Valyria... dois-je frapper Myr pour ouvrir la voie vers Pentos, ou bien attaquer Lys puis Tyrosh pour asseoir notre domination au sud ?"
 cob_7899_scenerio.0511.a:0 "La Maison Urnebar régnera sur Tyrosh"
 cob_7899_scenerio.0511.b:0 "La Maison Sonaryen régnera sur Lys"
 cob_7899_scenerio.0511.c:0 "La Maison Mataeryon régnera sur Myr"
 cob_7899_scenerio.0511.d:0 "La Maison Belaerys régnera sur Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des cités libres"
 cob_7899_scenerio.0512.desc:0 "Je marche au milieu du champ de bataille ensanglanté et fumant, les cris des blessés mêlés aux acclamations de mes soldats formant une symphonie impie à mes oreilles. Derrière moi, mes troupes se tiennent victorieuses tandis que j'accepte la capitulation de l'Archonte, les vivats assourdissant le monde tandis que je proclame que cette [free_city|E] passe désormais sous la juridiction directe de la Nouvelle [valyrian_freehold|E] et qu’un nouveau [dragonlord|E] y régnera par droit divin.\n\nIl me faut maintenant choisir la prochaine cité qui devra se soumettre à la puissance de la Nouvelle Valyria..."

 cob_7899_scenerio.0516.t:0 "Une branche d'olivier tendue vers un ancien avant-poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, les [dragonlords|E] survivants de Valyria régnant sous mon autorité. Cependant, en contemplant la carte de mon empire grandissant, une petite chaîne d'îles au-delà du [narrow_sea|El], à l'embouchure de la baie de la Néra, attire sans cesse mon attention. Je pose mon doigt sur la plus grande de ces îles... Peyredragon, un ancien avant-poste situé à l'extrême bordure des [freehold|E], aujourd'hui indépendant de l'Empire de la Nouvelle Valyria.\n\nAlors que j'envisageais une déclaration de guerre pour le reprendre, une épiphanie me saisit : les Targaryen ont survécu au [doom|E], tout comme les [dragonlords|E] qui règnent à mes côtés. Il serait donc plus sage de leur envoyer une missive leur offrant la possibilité de revenir dans le giron valyrien..."
 cob_7899_scenerio.0516.a:0 "Envoyer un corbeau avec une offre d'allégeance à la Nouvelle Valyria"

 cob_7899_scenerio.0517.t:0 "Un corbeau venu des Possessions ?"
 cob_7899_scenerio.0517.desc:0 "Je suis tiré du sommeil par des coups violents frappant ma porte. Émergeant à contrecœur de mon lit chaud, j'enfile une robe et vais ouvrir. Là, dans le couloir, se tient le mestre, la main tremblante, tenant un message scellé. Je le saisis et déroule le parchemin pour en lire le contenu...\n\nQuelques heures plus tard, le seigneur de Lamarck se tient à mes côtés dans la salle du trône de Peyredragon, aussi choqué que moi. [aurion.GetName] a conquis les anciennes colonies des [freehold|E] à dos de dragon et s'est proclamé Archonte de la Nouvelle Valyria. Il réclame maintenant que Peyredragon prête serment d'allégeance à son nouvel empire... Le destin de mon royaume repose désormais entre mes mains."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne pliera pas devant un nouveau Seigneur-Dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons de rejoindre la Nouvelle Valyria"

 cob_7899_scenerio.0518.t:0 "Une branche d'olivier rejetée et brisée"
 cob_7899_scenerio.0518.desc:0 "'Misérables lâches !'\n\nJe froissai la réponse de Peyredragon et la jetai dans les flammes du foyer, fou de rage. Comment osaient-ils se croire supérieurs et refuser d'intégrer mon nouvel empire ? Pensent-ils vraiment pouvoir survivre seuls face à la puissance de la Nouvelle Valyria ? Cet avant-poste appartenait autrefois aux [freehold|E] et doit revenir, par droit, à l'Empire de la Nouvelle Valyria, qu'importe que des Targaryen couards y habitent.\n\nIl me faut maintenant décider de la suite..."
 cob_7899_scenerio.0518.a:0 "Nous reprendrons Peyredragon par la force !"
 cob_7899_scenerio.0518.b:0 "Laissons-les croupir sur leur rocaille"

 # cob_7899_scenerio.0519.t:0 "Une Défaite Humiliante..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "Nous avons été vaincus"

 cob_7899_scenerio.0520.t:0 "Peyredragon revient à Valyria"
 cob_7899_scenerio.0520.desc:0 "C'est un jour glorieux pour mon empire : la cour m'apprend que Peyredragon a prêté serment d'allégeance à l'Empire de la Nouvelle Valyria. Ainsi, toutes les anciennes colonies des [freehold|E] sont enfin réunies sous une seule bannière avec un seul but : faire vivre à jamais la grandeur des [valyrian_freehold|E] dans l'esprit de ceux qui souhaiteraient notre chute. Désormais, nous nous tiendrons unis face à nos ennemis jusqu'au jour où Valyria n'aura plus à craindre personne."
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueilli en Nouvelle Valyria"

##Événements de Valyria - Aurion

 cob_7899_scenerio.0521.t:0 "Attaque de Vouivre de Feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds. Tandis que la panique commence à se répandre parmi la troupe, la terre s'ouvre devant nous et une immense vouivre de feu en émerge pour nous défier.\n\n\"Mon [ROOT.Char.GetLadyLord] ! Que devons-nous faire ?\" s’écrie l’un des courtisans en reculant lentement comme pour fuir. Je jette un regard autour de moi vers l'armée qui a choisi de me suivre dans cette quête et je dois maintenant décider comment affronter cette situation..."
 cob_7899_scenerio.0521.a:0 "Je vais affronter la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons battre en retraite !"
 cob_7899_scenerio.0521.c:0 "Un de mes chevaliers peut s'en charger !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Embuscade d’un survivant des Possessions !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre troupe traverse [location.GetName], un cri de guerre fend l'air du matin, glaçant nos sangs. Même les plus braves auraient couru se réfugier derrière les jupes de leur mère.\n\n\"Des cavaliers, mon [ROOT.Char.GetLadyLord] !\" hurle un éclaireur, dégainant son épée et pointant droit devant lui. On ne voit encore rien, mais le bruit sourd de sabots, une dizaine de chevaux ou plus, s'amplifie. La panique s'empare de nous comme une traînée de poudre, tandis qu'une voix alarmée crie : \"Ils sont #bold si nombreux# !!\"\n\nBien que leurs rangs ne soient pas immenses, nos ennemis sont massifs, intrépides et prêts à mourir pour nos biens. À leur tête chevauche un gigantesque [freeholder_looter.GetWomanMan] vêtu de guenilles issues d’anciens habits valyriens, maniant une énorme épée à deux mains. Leur chef hurle son nom pour que tous l’entendent, [freeholder_looter.GetFirstNameNicknamed], se vantant de ses raids audacieux et de sa cruauté.\n\nAlors que les pillards s’approchent, mon cheval s’ébroue et rue, menaçant de me désarçonner. Je tiens fermement les rênes, redressant le buste, et brandis mon [ROOT.Char.Custom('signature_weapon')], criant..."
 cob_7899_scenerio.0522.a:0 "Faites demi-tour ! Maintenant !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre escorte tentez de fuir les pillards des [freehold|E]."
 cob_7899_scenerio.0522.a.toast:0 "Fuyez !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous vous êtes échappés sans encombre. Bien joué, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous avez fui, mais cela a causé un léger retard."
 cob_7899_scenerio.0522.a.majordelay:0 "Vous avez fui, mais cela a causé un retard important."
 cob_7899_scenerio.0522.a.minortheft:0 "Vous êtes partis avec vos vies, mais sans toutes vos possessions."
 cob_7899_scenerio.0522.a.majortheft:0 "Votre bourse est tombée de votre selle durant votre fuite."
 cob_7899_scenerio.0522.a.minorcombo:0 "[freeholder_looter.GetFirstNameNoTooltip] a réussi à voler certaines de vos affaires."
 cob_7899_scenerio.0522.a.majorcombo:0 "[freeholder_looter.GetFirstNameNoTooltip] a réussi à voler la majeure partie de vos biens."
 cob_7899_scenerio.0522.a.scattered:0 "Votre escorte s'est dispersée — chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Ne faiblissez pas, à l'assaut derrière moi !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez contre les pillards des [freehold|E]."
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille."
 cob_7899_scenerio.0522.b.win:0 "Victoire"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez tué tous les pillards."
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef des pillards, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "Les pillards des [freehold|E] et leur chef [freeholder_looter.GetFirstName] se sont échappés après un long combat !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille."
 cob_7899_scenerio.0522.b.loss:0 "Défaite"
 cob_7899_scenerio.0522.b.robbed:0 "Vous êtes battus, rassemblés et dépouillés."
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous êtes battus et [kidnapped_entourage.GetName] est capturé."
 cob_7899_scenerio.0522.c:0 "Et si nous proposions un pot-de-vin..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]."
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] rejoint votre cour"
 cob_7899_scenerio.0522.c.else:0 "Peut-on vraiment faire confiance à un survivant déchu des Possessions ?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] s'est enfui avec votre argent"
 cob_7899_scenerio.0522.d:0 "Si nous abandonnons [sacrificed_entourage.GetFirstNameNoTooltip], cela pourrait nous faire gagner du temps."
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifiez [sacrificed_entourage.GetName] pour distraire les pillards."

 cob_7899_scenerio.0523.t:0 "Rencontre avec un soldat valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous traversons les terres dévastées de [location.GetName], l’air saturé de fumée volcanique et de cendres, obscurcissant la vue et étouffant chaque souffle de mon escorte. Je décide que nous devons prendre un moment pour nous orienter et demande que l'on m'amène [vassarion.GetName] pour survoler les nuages. Alors que j’attends, l’un de mes éclaireurs crie et je me retourne pour voir un groupe de soldats valyriens sortir de la brume, armés d’arbalètes et d’épées. L’un d’eux, vêtu des habits d'un officier subalterne, s’avance pour me faire face.\n\n\"Je suis [freeholder_survivor.GetName] et j'ai encerclé votre troupe. [location.GetName] nous appartient désormais, rendez-vous !\"\n\nJe dois maintenant décider de ce que je vais faire. Dois-je affronter [freeholder_survivor.GetName] en duel ? Tenter de le convaincre de rejoindre ma cause ? Ou battre en retraite ?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Rejoins-nous !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre escorte"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre avec un centurion valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous traversons les terres dévastées de [location.GetName], l’air saturé de fumée volcanique et de cendres, obscurcissant la vue et étouffant chaque souffle de mon escorte. Je décide que nous devons prendre un moment pour nous orienter et demande que l'on m'amène [vassarion.GetName] pour survoler les nuages. Alors que j’attends, l’un de mes éclaireurs crie et je me retourne pour voir un groupe de soldats valyriens sortir de la brume, armés d’arbalètes et d’épées. L’un d’eux, vêtu des habits d'un officier subalterne, s’avance pour me faire face.\n\n\"Je suis [freeholder_survivor.GetName] et j'ai encerclé votre troupe. [location.GetName] nous appartient désormais, rendez-vous !\"\n\nJe dois maintenant décider de ce que je vais faire. Dois-je affronter [freeholder_survivor.GetName] en duel ? Tenter de le convaincre de rejoindre ma cause ? Ou battre en retraite ?"
 cob_7899_scenerio.0524.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"

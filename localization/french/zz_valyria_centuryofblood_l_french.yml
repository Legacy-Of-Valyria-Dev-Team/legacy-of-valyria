 #7899
 zz_valyria_centuryofblood:0 "The Century of Blood"
 zz_valyria_centuryofblood_group:0 "After the Doom"
 zz_valyria_centuryofblood_desc:0 "Les Possessions Valyriennes se sont effondrées lorsque la péninsule fut engloutie par le Fléau. En l'espace de quelques heures à peine, Valyria disparut et les Possessions furent anéanties. La Maison Targaryen s'était relocalisée à Peyredragon, l'avant-poste le plus occidental de Valyria situé dans le Détroit, assurant ainsi sa survie.\n\nQuelques autres Lords Dragons — ceux qui ne se trouvaient point en Valyria lorsque le Fléau survint — survécurent également. À Tyrosh, Lys et Qohor, on raconte que des Lords Dragons furent épargnés par la destruction et ignorent désormais ce que l'avenir leur réserve. #bold \n\nAurion Varezys, un Lord Dragon qui se trouvait en visite à Qohor, se proclama premier Empereur de Valyria et leva des forces parmi les Qohoriens. Chevauchant son dragon à la tête d'une armée de trente mille hommes, il marche pour revendiquer les vestiges de Valyria...#!"

 bookmark_99_arrec_durrandon:0 "Roi Arrec"
 bookmark_99_arrec_durrandon_desc:0 "Arrec Durrandon, Roi des Terres de l'Orage et du prospère Conflans conquis par son ancêtre Arlan III Durrandon trois siècles plus tôt, siège sur le Trône des Rois de l'Orage. Son règne demeure cependant précaire, car maints autres rois de [westeros|E] continuent de convoiter les richesses potentielles que recèle le Conflans. Depuis l'Ouest, les Fer-nés commencent à s'agiter, nourrissant peut-être l'ambition de reprendre le Conflans aux Rois de l'Orage."
 bookmark_99_arrec_durrandon_subheading:0 "Le Roi de l'Orage"
 bookmark_99_erich_durrandon:0 "Erich Durrandon"
 bookmark_99_monfryd_durrandon:0 "Monfryd Durrandon"

 bookmark_99_aenar_targaryen:0 "Roi Aenar"
 bookmark_99_aenar_targaryen_desc:0 "Douze années avant le [doom_of_valyria|E], la fille d'Aenar, Daenys la Rêveuse, prophétisa la destruction de [valyria|E]. En réponse à cette vision, Aenar vendit tous ses domaines dans les [valyrian_freehold|E] et les Terres du Long Été, puis s'exila avec sa famille et ses [dragons_plural|E] vers Peyredragon, l'avant-poste le plus occidental des [valyrian_freehold|E]. Les Targaryen étaient loin d'être les plus puissants parmi les [dragonlords|E], et leurs rivaux de [valyria|E] considérèrent leur fuite comme un acte de couardise. Toutefois, parce qu'Aenar avait éloigné sa famille de [valyria|E], les Targaryen devinrent les plus puissants des [dragonlords|E] à avoir survécu au [doom|E]."
 bookmark_99_aenar_targaryen_subheading:0 "Seigneur de Peyredragon"
 bookmark_99_gaemon_targaryen:0 "Gaemon Targaryen"
 bookmark_99_daenys_targaryen:0 "Daenys « la Rêveuse » Targaryen"

# bookmark_99_garland_gardener:0 "Garland VI Gardener"
# bookmark_99_garland_gardener_desc:0 "King Garland VI came to the Oakenseat while still in his minority. The High Steward of the Reach, a Tyrell, ruled as regent until Garland came of age. Garland VI now rules over one of the strongest kingdoms in [westeros|E]. An intelligent, yet cynical, king, Garland's ambitions are known only to himself and only time will tell how far House Gardener will rise"
# bookmark_99_elissa_florent:0 "Elissa Florent"
# bookmark_99_mern_gardener:0 "Mern Gardener"

 bookmark_99_qhorwyn_hoare:0 "Roi Qhorwyn"
 bookmark_99_qhorwyn_hoare_desc:0 "Qhorwyn s'est révélé un roi avisé des Îles de Fer, évitant la guerre pour accumuler les richesses durant son règne. Il tripla la taille des flottes de la Maison Hoare et ordonna la fabrication d'armements supplémentaires afin de dissuader ses ennemis de l'attaquer.\n\nHarwyn, le troisième fils de Qhorwyn, est revenu aux Îles de Fer après deux années d'aventures pour découvrir son père infirme et malade, tandis que son frère Harlan se prépare à endosser le manteau de Roi des Îles de Fer. Les deux frères nourrissent l'ambition de s'emparer de la puissance militaire de leur père pour arracher le Royaume du Trident aux Durrandon. La seule question est de savoir s'ils parviendront à œuvrer de concert, ou si l'un tentera de s'emparer du pouvoir sur l'autre."
 bookmark_99_qhorwyn_hoare_subheading:0 "Roi des Îles de Fer"
 bookmark_99_harlan_hoare:0 "Harlan Hoare"
 bookmark_99_harwyn_hoare:0 "Harwyn Hoare"

 bookmark_99_tommen_lannister:0 "Roi Tommen II"
 bookmark_99_tommen_lannister_desc:0 "Tommen II Lannister, surnommé le Roi Lion, est le Roi du Roc de la Maison Lannister. Ayant ouï dire de l'effondrement possible des Possessions Valyriennes dans un [doom|E] de feu, il se prépare à lancer une expédition vers l'ancienne [valyrian_freehold_short|E] afin de piller les richesses et les sortilèges qui y demeurent assurément. L'expédition promet d'être périlleuse, aussi la question se pose : Tommen II devrait-il tout risquer pour retourner en [valyria|E], ou bien profiter de l'immense vide de pouvoir laissé par la disparition des [valyrian_freehold_short|E] pour s'emparer d'[essos|E] et étendre la fortune et le nom des Lannister à travers le [known_world|E] ?"
 bookmark_99_tommen_lannister_subheading:0 "Roi du Roc"
 bookmark_99_ellyn_tarbeck:0 "Ellyn Tarbeck"
 bookmark_99_tyrion_lannister:0 "Tyrion Lannister"

 bookmark_99_aurion_varezys:0 "Empereur Aurion"
 bookmark_99_aurion_varezys_desc:0 "[Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_copy|q$' )|E]\nAurion Varezys, l'un des rares Lords Dragons ayant survécu, échoué à Qohor, leva des forces parmi les colons qohoriens et se proclama premier Empereur de [valyria|E]. Juché sur son [dragon|E], lui et ses trente mille hommes marchent pour revendiquer ce qui subsiste de [valyria|E], ou peut-être pour forger une Nouvelle [valyria|E] par droit de conquête sur les [free_cities|E] d'[essos|E].\n\n#bold Aurion risquera-t-il tout pour revendiquer son ancienne patrie, ou forgera-t-il une nouvelle voie aux côtés des Lords Dragons survivants afin que le rêve de [valyria|E] demeure au premier plan dans l'esprit du monde ?#!"
 bookmark_99_aurion_varezys_subheading:0 "L'Empereur de Valyria"

 bookmark_99_lucifer_justman:0 "Roi du Conflans Lucifer"
 bookmark_99_lucifer_justman_desc:0 "Trois siècles après qu'un précédent Lucifer Justman se fut proclamé Roi du Conflans par droit du sang, un nouveau prétendant à la couronne du Trident a débarqué dans la baie de la Néra. Debout sur les rivages d'un modeste village de pêcheurs à l'embouchure du Trident, Lucifer doit prendre sa petite suite et choisir une voie pour faire valoir sa revendication sur les terres de ses ancêtres. Quel royaume serait le plus propice pour chasser les Durrandon des terres de sa famille ? Les Jardinier de Hautjardin, les Lannister de Castral Roc, ou les Arryn du Val ?"
 bookmark_99_lucifer_justman_subheading:0 "Le Roi du Conflans"


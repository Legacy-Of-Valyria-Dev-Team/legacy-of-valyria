#Events
# lv_scenerio_cob:0 "The Century of Blood"
 cob_7899_scenerio.0001.t:0 "Le Roi des Orages et des Rivières"
 cob_7899_scenerio.0001.desc:0 "C'est une ère de richesse et de prospérité pour le Royaume des Orages et des Rivières. Depuis que mon ancêtre [arlan.GetName] unifia les deux empires en un seul et détruisit le roi prétendant [lucifer.GetFirstName], la lignée de [benedict.GetName] s'est éteinte. La Maison Durrandon demeure seule Reine du Trident et des Terres de l'Orage.\n\nMais tout n'est pas ce qu'il paraît. La discorde grandit au sein du royaume... De l'Ouest parviennent des rumeurs selon lesquelles les Fer-nés sous [qhorwyn.GetName] s'agitent, nourrissant peut-être l'ambition de conquérir les richesses du Trident. On murmure également qu'un membre survivant de la Maison Justman répand la nouvelle qu'il serait le souverain légitime du Trident... Un autre Justman qui désire être libéré de cette enveloppe mortelle afin que le cerf continue de régner sur les Rivières et les Orages."
 cob_7899_scenerio.0001.a:0 "Notre est la Fureur"

 cob_7899_scenerio.0002.t:0 "L'Exilé et la Rêveuse"
 cob_7899_scenerio.0002.desc:0 "Le [doom|E] s'est abattu sur [valyria|E] exactement comme [dreamer.GetFirstName] l'avait prédit. Si je n'avais point agi quand je le fis, vendant toute la fortune de notre famille et déménageant vers ce morne avant-poste volcanique, notre maison aurait assurément été anéantie. Les [valyrian_freehold_short|E] passèrent de la force la plus puissante du monde à l'ombre du néant en l'espace de quelques heures. La Maison Targaryen pourrait bien être la famille la plus puissante qui subsiste.\n\nJe dois méditer sur ce que l'avenir réserve à ma personne et à ma famille. Bâtirons-nous nos domaines et maintiendrons-nous la volonté des [valyrian_freehold_short|E] dans cet unique avant-poste, ou étendrons-nous à nouveau l'influence des [valyrian_freehold_short|E] sur les [free_cities|E] et, peut-être, sur [westeros|E] lui-même ?"
 cob_7899_scenerio.0002.a:0 "Feu et Sang"

 cob_7899_scenerio.0003.t:0 "Le Roi du Sel et de la Mer"
 cob_7899_scenerio.0003.desc:0 "Mon heure approche... Je sens [ROOT.Char.GetFaith.HighGodName] m'appeler depuis ses salles aquatiques tandis que cette maladie incessante envahit mon corps frêle et vieillissant. Depuis le trépas de mon premier fils, [harmund.GetName], mon deuxième fils [harlan.GetName] a pris de l'assurance, gérant les affaires du royaume alors que la maladie m'a lentement terrassé.\n\n[harwyn.GetName], mon troisième fils parti chercher gloire dans les [free_cities|E], est revenu avec des intentions inconnues. Je ne puis que supposer qu'il a appris que j'étais malade et aux portes de la mort depuis ce qui semble une éternité, et qu'il souhaite revendiquer sa part de l'héritage qu'il croit lui être dû.\n\nSeul le temps dira quand [ROOT.Char.GetFaith.HighGodName] m'appellera dans ses salles aquatiques ; pour l'heure, je ne puis qu'imaginer ce qu'il adviendra du royaume que j'ai bâti avec tant de diligence."
 cob_7899_scenerio.0003.a:0 "Ce qui est mort ne saurait mourir"

 cob_7899_scenerio.0004.t:0 "Le Roi du Roc"
 cob_7899_scenerio.0004.desc:0 "La nouvelle est parvenue à Castral Roc que [valyria|E] a été détruite dans un cataclysme d'une destruction indicible. La quasi-totalité de l'Empire des [dragonlord|E] a péri avec leurs [dragons_plural|E], laissant les anciennes terres mûres pour le pillage si un souverain ambitieux choisissait de profiter de cette situation. Peut-être que toutes les richesses et la magie n'ont point été détruites... La Maison Lannister pourrait à jamais cimenter sa place comme la maison la plus fortunée et la plus puissante que [westeros|E] ait jamais connue..."
 cob_7899_scenerio.0004.a:0 "Ce n'est qu'un rêve insensé, je devrais concentrer mon attention ici"
 cob_7899_scenerio.0004.a_tt:0 "Vous choisissez de ne point risquer la mort et de demeurer à Castral Roc"
 cob_7899_scenerio.0004.b:0 "Une opportunité m'attend en [valyria|E] que je ne saurais ignorer"
 cob_7899_scenerio.0004.b_tt:0 "Vous choisissez de tout risquer pour voyager vers les vestiges de [valyria|E]"

 cob_7899_scenerio.0005.t:0 "L'Héritier des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0005.desc:0 "Les [valyrian_freehold_short|E] sont tombées... Je n'ai reçu aucune réponse à ma correspondance depuis des lustres... Je ne puis que supposer que les rumeurs de ce que les gens appellent un « [doom|E] » sont véridiques.\n\nJ'ai rassemblé une force de soldats parmi les Qohoriens dans le dessein de voler avec [vassarion.GetName] vers ce qui subsiste de [valyria|E]... J'espère restaurer l'ordre en ce monde une fois encore... Cependant, si les rumeurs sont exactes et que les [valyrian_freehold_short|E] ne sont plus que cendres, peut-être cette armée serait-elle mieux employée à soumettre les [free_cities|E] sous mon autorité... Tout ce que je sais, c'est que je dois mettre cet ost en marche vers le sud depuis [location.GetName] pour découvrir par moi-même ce qu'il est advenu de ma patrie..."
 cob_7899_scenerio.0005.a:0 "Je retournerai aux [valyrian_freehold_short|E] et revendiquerai ce qui demeure"
 cob_7899_scenerio.0005.a_tt:0 "Voyager vers Ny Sar"
 cob_7899_scenerio.0005.b:0 "À la réflexion, n'allons point en Valyria, c'est un lieu absurde..."
 cob_7899_scenerio.0005.b_tt:0 "Tracer votre propre voie"

 cob_7899_scenerio.0006.t:0 "L'Héritier du Roi du Conflans"
 cob_7899_scenerio.0006.desc:0 "Mon illustre ancêtre [lucifer.GetFirstName], le légitime Roi du Conflans, se proclama le dernier descendant vivant de [benedict.GetName]. Il fut occis par [arlan.GetName], afin que les Rois de l'Orage maintiennent leur domination illégitime sur le Royaume du Trident.\n\nDurant des siècles, la lignée de la Maison Justman est demeurée dans l'ombre, fuyant la fureur des Rois de l'Orage qui pourrait mener à notre extinction. Je ne puis perpétuer cette tradition plus longtemps... Je dois me mettre en route et rassembler des alliés afin de faire valoir ma revendication sur les terres de mes ancêtres.\n\nDésormais, je dois décider où je me rendrai... Les terres fertiles du Bief ? Les richesses des Terres de l'Ouest ? Ou les montagnes du Val ?"
 cob_7899_scenerio.0006.a:0 "Chercher l'aide du Bief"
 cob_7899_scenerio.0006.a_tt:0 "Voyager vers Hautjardin"
 cob_7899_scenerio.0006.b:0 "Chercher l'aide du Roc"
 cob_7899_scenerio.0006.b_tt:0 "Voyager vers Castral Roc"
 cob_7899_scenerio.0006.c:0 "Chercher l'aide du Val"
 cob_7899_scenerio.0006.c_tt:0 "Voyager vers les Eyrié"
 cob_7899_scenerio.0006.d:0 "Partir seul"


 #Swords/armor

 vs_stormbringer_name:0 "Vāedroma"
 vs_stormbringer_description:0 "l'épée en acier valyrien de la Maison Varezys, est une relique de feu et d'ombre, une lame forgée dans les creusets des Quatorze Flammes. Cette lame a parcouru les confins les plus lointains de l'Empire Valyrien"
 vs_skullbasher_name:0 "Rīnakharys"
 vs_skullbasher_description:0 "La Masse en Acier Valyrien de la Maison Belaerys"
 vs_inferno_name:0 "Vāedarion"
 vs_inferno_description:0 "Le Marteau en Acier Valyrien de la Maison Urnebar"
 vs_eclipse_name:0 "Embāelī"
 vs_eclipse_description:0 "L'Épée en Acier Valyrien de la Maison Mataeryon, forgée durant les siècles crépusculaires des Possessions Valyriennes, mais portant des parties bien plus anciennes encore. L'épée connue en langue commune sous le nom d'Éclipse est à la fois un artefact et une énigme — une union de la puissance valyrienne et du mystère pré-valyrien. Elle est taillée dans une pierre sombre unique, veinée de mouchetures violettes qui scintillent faiblement sous la lumière de la lune, et aussi froide que la tombe. Selon les Mataeryon, elle n'a pas été façonnée par l'homme, mais découverte — déterrée — des ruines noircies de N'ghai. On dit que lorsqu'on empoigne sa garde, le porteur peut entendre les sombres murmures de l'inconnu"
 vs_ashbringer_name:0 "Vūjōsān"
 vs_ashbringer_description:0 "L'Épée en Acier Valyrien de la Maison Sonaryen"

 aurion_valyrian_steel_armor_name:0 "Hrōmagon"
 aurion_valyrian_steel_armor_description:0 "Une armure d'acier valyrien ornementée, revendiquée par Aurion Varezys lors de son légendaire retour dans les ossements fumants de Valyria. Aucun artisan vivant ne peut nommer son créateur, et les érudits ne s'accordent pas sur la question de savoir si elle fut forgée dans les derniers jours des Possessions ou par une main plus ancienne, depuis longtemps perdue dans les cendres et le mythe. Sa valeur ne peut être mesurée en pièces ou en couronnes. Des royaumes entiers ne pourraient égaler son prix. C'est assurément la plus belle armure du monde connu"


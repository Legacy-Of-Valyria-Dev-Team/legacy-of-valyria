 #Swords/armor

 vs_stormbringer_name:0 "Vāedroma"
 vs_stormbringer_description:0 "l'épée en acier valyrien de la Maison Varezys, relique de feu et d'ombre, forgée dans les creusets des Quatorze Flammes. Cette lame a parcouru les confins les plus reculés de l'Empire Valyrien."
 vs_skullbasher_name:0 "Rīnakharys"
 vs_skullbasher_description:0 "La Masse en Acier Valyrien de la Maison Belaerys"
 vs_inferno_name:0 "Vāedarion"
 vs_inferno_description:0 "Le Marteau en Acier Valyrien de la Maison Urnebar"
 vs_eclipse_name:0 "Embāelī"
 vs_eclipse_description:0 "L'Épée en Acier Valyrien de la Maison Mataeryon, forgée dans les siècles crépusculaires des Possessions Valyriennes, mais recelant des éléments bien plus anciens encore, cette épée connue sous le nom d'Éclipse est à la fois artefact et énigme — union de la puissance valyrienne et d'un mystère pré-valyrien. Elle est taillée dans une unique pierre sombre, veinée de mouchetures pourpres qui scintillent faiblement au clair de lune, et froide comme la tombe. Selon les Mataeryons, elle ne fut point façonnée par la main de l'homme, mais découverte — déterrée — dans les ruines noircies de N'ghai. On raconte que celui qui empoigne sa garde peut entendre les murmures sombres de l'inconnu."
 vs_ashbringer_name:0 "Vūjōsān"
 vs_ashbringer_description:0 "L'Épée en Acier Valyrien de la Maison Sonaryen"

 aurion_valyrian_steel_armor_name:0 "Hrōmagon"
 aurion_valyrian_steel_armor_description:0 "Une armure ornée d'acier valyrien, revendiquée par Aurion Varezys lors de son légendaire retour parmi les ossements fumants de [valyria|E]. Nul artisan vivant ne saurait en nommer le créateur, et les érudits eux-mêmes ne s'accordent pas à dire si elle fut forgée dans les derniers jours des Possessions Valyriennes ou par quelque main plus ancienne, depuis longtemps perdue dans la cendre et le mythe. Sa valeur ne saurait se mesurer en pièces d'or ni en couronnes. Nul royaume ne pourrait en égaler le prix. Elle est assurément la plus belle armure du [known_world|E]"

 #Story Content

 game_concept_story_content_aurion_varezys_99:0 "$game_concept_story_generic_prefix$ $bookmark_99_aurion_varezys$"
 game_concept_story_content_aurion_varezys_99_desc:0 "#tooltip_heading Style Narratif : Approfondi#!\n\nEn tant qu'Aurion Varezys, vous aurez le choix de recoloniser [valyria|E] et de restaurer l'ancien ordre, ou de revendiquer Volantis et les autres états satellites de l'[old_valyria|E] pour fonder un nouveau [the_freehold|E]."


 #Swords/armor

 vs_stormbringer_name:0 "Vāedroma"
 vs_stormbringer_description:0 "L'épée d'acier valyrien de la Maison Varezys est une relique de feu et d'ombre, une lame forgée dans les creusets des Quatorze Flammes. Cette lame a contemplé les confins les plus éloignés de l'Empire Valyrien."
 vs_skullbasher_name:0 "Rīnakharys"
 vs_skullbasher_description:0 "La masse d'acier valyrien de la Maison Belaerys."
 vs_inferno_name:0 "Vāedarion"
 vs_inferno_description:0 "Le marteau d'acier valyrien de la Maison Urnebar."
 vs_eclipse_name:0 "Embāelī"
 vs_eclipse_description:0 "L'épée d'acier valyrien de la Maison Mataeryon, forgée dans les siècles crépusculaires des Possessions Valyriennes, porte pourtant des éléments bien plus anciens encore. L'épée connue sous le nom d'Éclipse est à la fois artefact et énigme — une union de la puissance valyrienne et du mystère pré-valyrien. Elle est taillée dans une unique pierre sombre, veinée de mouchetures pourpres qui scintillent faiblement sous le clair de lune, et aussi froide que la tombe. Selon les Mataeryon, elle ne fut point façonnée par la main de l'homme, mais découverte — exhumée — des ruines noircies de N'ghai. Paraît-il que lorsqu'on saisit la poignée, le porteur peut entendre les murmures ténébreux de l'inconnu."
 vs_ashbringer_name:0 "Vūjōsān"
 vs_ashbringer_description:0 "L'épée d'acier valyrien de la Maison Sonaryen."

 aurion_valyrian_steel_armor_name:0 "Hrōmagon"
 aurion_valyrian_steel_armor_description:0 "Une armure d'acier valyrien ouvragée, réclamée par Aurion Varezys lors de son légendaire retour aux ossements fumants de [valyria|E]. Nul artisan vivant ne peut nommer son créateur, et les érudits ne s'accordent point sur le fait qu'elle fut forgée dans les derniers jours des Possessions ou par quelque main plus ancienne, depuis longtemps disparue dans les cendres et le mythe. Sa valeur ne saurait se mesurer en pièces ou en couronnes. Des royaumes entiers ne pourraient égaler sa valeur. C'est assurément la plus belle armure du [known_world|E]."


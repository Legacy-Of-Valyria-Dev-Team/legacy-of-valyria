 #COB Decisions
 cob_send_for_the_dragonlords_decision:0 "Mander les Lords Dragons"
 cob_send_for_the_dragonlords_decision_desc:0 "Le temps est venu de lancer un appel au monde pour que tous les Lords dragons sans terres reviennent chez eux réclamer leur droit de naissance.\n\nDepuis trop longtemps ces terres sont restées inoccupées ; je souhaite voir à nouveau les cieux emplis du battement d'ailes des dragons portant leurs maîtres Lords dragons dans les airs."
 cob_send_for_the_dragonlords_decision_tooltip:0 "Envoyer des corbeaux à travers le monde et demander aux Lords dragons de revenir"
 cob_send_for_the_dragonlords_decision_confirm:0 "Envoyer les Corbeaux"

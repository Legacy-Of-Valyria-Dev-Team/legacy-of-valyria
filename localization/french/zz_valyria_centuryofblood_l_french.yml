 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je déambule à travers les salles du palais en ruines de [location.GetName] qui fut jadis la demeure de [Nymeria.GetName] des Rhoynars, et je me retrouve transporté vers les récits que ma mère me contait enfant. Des récits sur les [dragonlords|E] d'antan et leurs conquêtes à travers [essos|E], prenant ce qui leur revenait de droit divin et par la flamme draconique. Ceux qui pliaient le genou étaient épargnés et ceux qui résistaient étaient effacés du monde ou chassés en exil, leurs anciens royaumes abandonnés à la ruine comme celui-ci.\n\nTandis que ces récits affluent dans mon esprit, je ne puis m'empêcher de me demander si les [valyrian_freehold_short|E] s'étaient affaiblies au fil du temps ; je me demande si ces conquérants, ces héros des récits, regarderaient mes semblables et éprouveraient de la honte pour ce que nous sommes devenus. [valyria|E] fut jadis le pinacle du monde, mais à la fin il semblait que nous n'étions plus que des enfants querelleurs se disputant pouvoir et richesses... peut-être est-ce pour cela que [ROOT.Char.GetFaith.HighGodName] a choisi de frapper notre peuple du [doom|E]... peut-être ai-je été choisi pour maintenir vivant le rêve de [valyria|E]."
 cob_7899_scenerio.0500.a:0 "Nous poursuivons vers la Porte Lugubre"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers la Porte Lugubre"

 cob_7899_scenerio.0501.t:0 "La Décision à la Porte Lugubre"
 cob_7899_scenerio.0501.desc:0 "Alors que je contemple les eaux de la Rhoyne, les ruines de [location.GetName], une autre des conquêtes des [valyrian_freehold_short|E], derrière moi, je réalise qu'en cet instant j'ai un choix à faire. Je puis poursuivre la quête que j'imaginais au commencement de ce voyage et mener mon ost sur les vestiges possiblement calcinés et noyés de lave de [valyria|E] pour restaurer la puissance des [valyrian_freehold_short|E] à mon image... ou bien... je puis incarner l'esprit des premiers [dragonlords|E] de [valyria|E], rassembler les Seigneurs Dragons survivants d'[essos|E] et reconquérir les colonies des [valyrian_freehold_short|E] par droit de conquête et de flamme draconique.\n\nAlors que je me tiens à la frontière de [GetTitleByKey('k_volantis').GetName], je dois décider — dois-je entreprendre le voyage vers les terres calcinées de [GetTitleByKey('e_valyria').GetName], ou bien forger ma route et créer une Nouvelle [valyria|E] à la manière de mes ancêtres ?\n\n#bold ATTENTION — l'une ou l'autre voie s'annonce ardue, il est recommandé de sauvegarder souvent pour éviter une fin de partie#!"
 cob_7899_scenerio.0005.b:0 "Je conquerrai les [free_cities|E] pour forger une Nouvelle [valyria|E]"
 cob_7899_scenerio.0501.a:0 "Nous devons nous ravitailler à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager vers Volantis"

 ##Aurion Valyria Expedition

 cob_7899_scenerio.0502.t:0 "Ravitaillement au Long Pont"
 cob_7899_scenerio.0502.desc:0 "La première chose que je remarquai à propos de [location.GetName] fut le vacarme incessant et sans fin qui semblait envahir chaque recoin de la cité. Je ne saurais l'affirmer avec certitude, mais il me semblait que cette ville était en quelque sorte dix fois plus bruyante que la capitale valyrienne tout en étant moins de la moitié de sa taille. La seule chose pire que le bruit était l'odeur — gens crasseux, latrines sur-utilisées et mal entretenues, poisson et une myriade d'autres choses se mêlant pour former le plus impie des relents le long du pont où mon camp se procurait des vivres.\n\nHeureusement, il ne faudrait guère de temps avant que nous reprenions notre marche vers [valyria|E] pour reconquérir notre foyer. En traversant les rues, j'avais remarqué un nombre croissant de personnes qui célébraient la chute de ma patrie, proclamant que le monde était enfin libéré de l'emprise étouffante des [valyrian_freehold_short|E]. Je ne m'engageai point avec eux, reconnaissant d'avoir laissé [vassarion.GetName] hors de la cité pour éviter toute confrontation inutile lors de mon périple.\n\nAucune de leurs pensées n'importait véritablement car ils verraient la vérité : que moi, [aurion.GetName], retournerais en [valyria|E] et la ramènerais à la grandeur qui fut jadis la sienne. Pour l'heure, je pouvais prendre un moment de repos avant de poursuivre vers ce qui demeure de mon foyer..."
 cob_7899_scenerio.0502.a:0 "Il est temps d'avancer vers la Petite [valyria|E]"
 cob_7899_scenerio.0502.a_tt:0 "Voyager vers la Petite [valyria|E]"

 cob_7899_scenerio.0503.t:0 "Arrivée aux confins des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0503.desc:0 "Je me tiens ici aux confins de Volantis, aux abords de [location.GetName], et ne puis véritablement croire ce que mes yeux contemplent alors que je regarde les terres à quelques lieues devant moi. Un nuage noir comme la nuit déchirait l'azur des cieux, engendrant une pluie qui brûlait la peau au moindre contact. Les terres devant moi semblaient enveloppées d'une brume qui voilait ma vue, m'empêchant de discerner ce qui pouvait se dresser devant moi et ma caravane, répandant un sentiment d'effroi que je pouvais sentir gagner les rangs. Je me tournai vers Vassarion et grimpai de nouveau en selle avant de diriger la bête vers mon ost.\n\n« Ce fut un long voyage et la route devant nous semble funeste, mes amis. Cependant, nous avons tous été choisis pour une mission divine : reconquérir ce qui semble perdu, chasser les ténèbres et ramener la lumière en ce monde. [ROOT.Char.GetFaith.HighGodName] ne nous aurait pas permis de venir si loin pour nous abandonner maintenant, aussi nous irons de l'avant et reprendrons ce qui nous revient de droit pour rebâtir le rêve de [valyria|E] pour tous ceux qui foulent cette terre ! »\n\nL'acclamation qui s'éleva des troupes fut toute la confirmation dont j'avais besoin pour savoir qu'ils étaient prêts à affronter ce qui les attendait..."
 cob_7899_scenerio.0503.a:0 "Il est temps de reconquérir notre foyer"
 cob_7899_scenerio.0503.a_tt:0 "Pénétrer en [valyria|E]"

 ##Aurion New Valyria Conquest

 cob_7899_scenerio.0510.t:0 "Archonte Aurion Ier de la Nouvelle [valyria|E]"
 cob_7899_scenerio.0510.desc:0 "Alors que je pénètre dans les salles dorées de l'Ancienne Volantis, je me trouve empli d'une détermination vertueuse. Voici les salles que [ROOT.Char.GetFaith.HighGodName] de [valyria|E] me destinait à occuper ; les fondateurs de la colonie de l'Ancienne Volantis n'auraient jamais pu imaginer que la cité qu'ils bâtiraient était destinée par droit divin à accueillir le premier Archonte d'une Nouvelle [valyria|E].\n\nCependant, je ne puis trouver le repos tant que toutes les filles des anciennes [the_freehold|E] ne seront pas sous ma bannière. Je dois rassembler les [dragonlords|E] survivants d'[essos|E] et les convoquer à ma cour. De là, nous partirons reprendre ce qui nous revient de droit divin et de puissance."
 cob_7899_scenerio.0510.a:0 "Je m'en irai unir les filles de [valyria|E]"

 cob_7899_scenerio.0511.t:0 "Tout ce qui fut jadis... le sera de nouveau"
 cob_7899_scenerio.0511.desc:0 "Des quatre coins d'[essos|E], les autres [dragonlords|E] qui furent choisis par [ROOT.Char.GetFaith.HighGodName] pour survivre au [doom|E] se tiennent dans ma salle d'audience. Devant moi se dressent [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal], emplis du désir vertueux de se joindre à moi pour restaurer l'ordre en ce monde à la manière de nos ancêtres.\n\nTout ce qui demeure à présent est de lancer une campagne de conquête à travers les anciennes colonies des [valyrian_freehold_short|E] afin de les unir sous la puissance du [dragon|E] une fois encore par la fureur indomptée du feu draconique... nous marcherons depuis Volantis mais je dois à présent décider laquelle des [free_cities|E] sera conquise en premier au nom des [dragonlords|E] de la Nouvelle [valyria|E]... dois-je frapper Myr pour ouvrir la voie vers Pentos ? Ou dois-je frapper Lys puis Tyrosh et prendre le contrôle des régions méridionales ?"
 cob_7899_scenerio.0511.a:0 "La Maison Urnebar régnera sur Tyrosh"
 cob_7899_scenerio.0511.b:0 "La Maison Sonaryen régnera sur Lys"
 cob_7899_scenerio.0511.c:0 "La Maison Mataeryon régnera sur Myr"
 cob_7899_scenerio.0511.d:0 "La Maison Belaerys régnera sur Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des [free_cities|E]"
 cob_7899_scenerio.0512.desc:0 "Je déambule parmi le champ de bataille ensanglanté et fumant, les cris des blessés se mêlant aux acclamations victorieuses de mes soldats pour former une sorte de symphonie impie à mes oreilles. Mes soldats se tiennent victorieux derrière moi tandis que j'accepte la capitulation de l'Archon, leurs vivats couvrant le reste du monde alors que je décrète que cette [free_city|E] est désormais sous la juridiction directe des Nouvelles [valyrian_freehold|E] et qu'un nouveau [dragonlord|E] y régnera par droit divin.\n\nÀ présent, je dois choisir la prochaine cité qui se soumettra à la puissance de la Nouvelle [valyria|E]..."

 cob_7899_scenerio.0516.t:0 "Un Rameau d'Olivier pour un Ancien Avant-poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, avec les [dragonlords|E] survivants de [valyria|E] régnant sous mon autorité. Cependant, alors que je contemple la carte de mon empire grandissant, une petite chaîne d'îles de l'autre côté du [narrow_sea|El], à l'embouchure de la Baie de la Néra, continue de retenir mon attention. Je pose mon doigt sur la carte près de la plus grande de ces îles... Peyredragon, un ancien avant-poste à l'extrémité des [valyrian_freehold|E], demeurant désormais indépendant du Nouvel Empire Valyrien.\n\nAlors que j'envisageais une déclaration de conquête pure et simple pour reprendre ce qui appartenait jadis à [valyria|E] de la même façon que j'avais conquis les [free_cities|E], j'eus une révélation. Les Targaryen survécurent au [doom|E] de la même manière que les [dragonlords|E] régnant sur mon nouvel empire : par intervention divine. Il s'ensuit donc que je dois envoyer un message à quiconque gouverne ce rocher désolé avec une offre de réintégrer le giron une fois encore..."
 cob_7899_scenerio.0516.a:0 "Envoyer un corbeau avec une offre de prêter allégeance à la Nouvelle [valyria|E]"

 cob_7899_scenerio.0517.t:0 "Un Corbeau des [valyrian_freehold_short|E] ?"
 cob_7899_scenerio.0517.desc:0 "Je me trouve réveillé au milieu de la nuit par un martèlement sonore contre la porte de ma chambre. Je parviens à m'extraire de la chaleur réconfortante de mon lit et à enfiler une robe pour découvrir qui oserait me déranger à cette heure tardive. En ouvrant la porte, je trouve le mestre debout dans le couloir, un message de corbeau tremblant dans sa main. Je prends la lettre en silence, déroulant le parchemin pour en lire le contenu...\n\nPlusieurs heures plus tard, le Seigneur de Lamarck se tenait avec moi dans la salle du trône de Peyredragon, le même air de stupéfaction sur le visage que j'avais eu quelques heures auparavant. [aurion.GetName] avait pris son envol à dos de dragon et conquis les anciennes colonies des [valyrian_freehold_short|E] pour se proclamer Archonte de la Nouvelle [valyria|E] et demandait que Peyredragon déclare allégeance à ce nouvel ordre... il m'appartient désormais de décider du destin de mon royaume..."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne pliera point le genou devant un nouveau Seigneur Dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons cette offre de rejoindre une Nouvelle [valyria|E]"

 cob_7899_scenerio.0518.t:0 "Un Rameau d'Olivier Rejeté et Brisé"
 cob_7899_scenerio.0518.desc:0 "« Maudits couards ! »\n\nJe froissai la réponse reçue de Peyredragon et la jetai dans l'âtre flamboyant dans un accès de rage. Comment osent-ils se croire si supérieurs qu'ils peuvent refuser de rejoindre mon nouvel empire ? Croient-ils véritablement pouvoir tenir seuls en ce monde et résister à la puissance de la Nouvelle [valyria|E] ? Cet avant-poste appartenait aux anciennes [the_freehold|E] et devrait de droit revenir à l'Empire de la Nouvelle [valyria|E], que les couards Targaryen l'habitent ou non.\n\nJe dois à présent décider quelle ligne de conduite adopter..."
 cob_7899_scenerio.0518.a:0 "Nous ramènerons Peyredragon dans le giron de [valyria|E] par la force !"
 cob_7899_scenerio.0518.b:0 "Qu'ils restent sur leur rocher à trembler de peur"

 # cob_7899_scenerio.0519.t:0 "An Embarassing Defeat..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "We have been beaten defeated"

 cob_7899_scenerio.0520.t:0 "Peyredragon Revient à [valyria|E]"
 cob_7899_scenerio.0520.desc:0 "Voici un jour glorieux pour mon nouvel Empire : la nouvelle est parvenue à ma cour que Peyredragon a déclaré son intention de prêter allégeance à l'Empire de la Nouvelle [valyria|E]. Avec cette nouvelle, les dernières anciennes colonies des [valyrian_freehold_short|E] ont été unies comme jamais auparavant avec un seul dessein : maintenir vivante la puissance des [valyrian_freehold|E] dans l'esprit de ceux qui se réjouiraient de notre disparition. Nous devons désormais demeurer unis contre ceux qui s'opposeraient à nous jusqu'au jour où [valyria|E] n'aura plus d'ennemis à craindre."
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueillie au sein de la Nouvelle [valyria|E]"

 ##Aurion Valyria Events

 cob_7899_scenerio.0521.t:0 "Attaque de Vouivre de Feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds. Tandis que la panique commence à se répandre dans le groupe, le sol devant nous s'ouvre et une massive vouivre de feu émerge pour se dresser comme un défi à notre passage.\n\n« Mon [ROOT.Char.GetLadyLord] ! Que faisons-nous ? » crie l'un des courtisans, reculant lentement comme pour battre en retraite. Je jette un regard circulaire sur l'armée qui a choisi de me suivre dans cette quête et dois à présent décider comment nous allons gérer cette situation..."
 cob_7899_scenerio.0521.a:0 "J'affronterai la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons battre en retraite !"
 cob_7899_scenerio.0521.c:0 "L'un de mes chevaliers peut s'en charger !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Une Embuscade de Survivants des [valyrian_freehold_short|E] !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre ost traverse [location.GetName], un cri de guerre déchire l'air matinal, nous glaçant les sangs. Même parmi les voyageurs les plus intrépides, ce son aurait fait courir les hommes les plus hardis se réfugier dans les jupes de leurs mères.\n\n« Des cavaliers, mon [ROOT.Char.GetLadyLord] ! » La voix d'un éclaireur retentit à travers la tension, attirant mon attention tandis qu'il dégaine son épée, la pointant devant lui. Il n'y a encore rien à voir, mais le son de nombreux sabots, une douzaine de chevaux ou plus, s'amplifie, se rapproche. La panique se répand parmi nous comme une traînée de poudre, une autre voix rejoignant le chœur de la peur lorsqu'ils apparaissent. « Ils sont #bold si nombreux#!! »\n\nBien que leurs rangs ne soient pas considérables, les ennemis sont massifs, intrépides, et semblent prêts à perdre la vie pour nos biens. À leur tête chevauche [freeholder_looter.GetWomanMan] imposant[freeholder_looter.Custom('FR_E')] dans les vestiges en lambeaux de ce qui fut jadis de fins atours valyriens, armé[freeholder_looter.Custom('FR_E')] d'une grande épée à deux mains. Le chef de cette bande hurle son nom pour que tous l'entendent : [freeholder_looter.GetFirstNameNicknamed]. Le pillard autoproclamé déclare d'une voix confiante et puissante [freeholder_looter.GetHerHis] cruauté, ses raids audacieux comme celui-ci, et un tempérament de feu.\n\nAlors que les pillards se rapprochent, mon cheval se cabre et renâcle, menaçant de me désarçonner, mais je tiens fermement les rênes, me redressant. Levant mon [ROOT.Char.Custom('signature_weapon')] dans les airs, je crie..."
 cob_7899_scenerio.0522.a:0 "Faites demi-tour ! Demi-tour immédiatement !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre suite tentez de fuir les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.a.toast:0 "Fuyez !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous vous êtes échappé sans encombre. Bien fait pour toi, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous vous êtes échappé, mais cela a causé un léger retard dans votre voyage."
 cob_7899_scenerio.0522.a.majordelay:0 "Vous vous êtes échappé, mais cela a causé un retard considérable dans votre voyage."
 cob_7899_scenerio.0522.a.minortheft:0 "Vous avez sauvé vos vies, mais pas tous vos biens."
 cob_7899_scenerio.0522.a.majortheft:0 "Vous avez sauvé vos vies, mais votre bourse est tombée de votre selle pendant la fuite."
 cob_7899_scenerio.0522.a.minorcombo:0 "Malgré la manœuvre, [freeholder_looter.GetFirstNameNoTooltip] a réussi à dérober certaines de vos affaires."
 cob_7899_scenerio.0522.a.majorcombo:0 "Malgré la manœuvre complexe, [freeholder_looter.GetFirstNameNoTooltip] a réussi à dérober la plupart de vos affaires."
 cob_7899_scenerio.0522.a.scattered:0 "Votre suite a été dispersée — chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Reprenez-vous, compagnons, et suivez-moi ! Chargez !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille."
 cob_7899_scenerio.0522.b.win:0 "Victoire"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez occis tous les pillards du groupe."
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef du groupe de pillards des [valyrian_freehold_short|E], [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "Le groupe de pillards des [valyrian_freehold_short|E] et leur chef [freeholder_looter.GetFirstName] se sont échappés après une heure de combat !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille."
 cob_7899_scenerio.0522.b.loss:0 "Défaite"
 cob_7899_scenerio.0522.b.robbed:0 "Vous avez été vaincus, rassemblés et dépouillés ; ils ont pris tout ce que vous aviez."
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous avez été vaincus, et les pillards ont enlevé [kidnapped_entourage.GetName]..."
 cob_7899_scenerio.0522.c:0 "Que diriez-vous d'un pot-de-vin..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]."
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] rejoint votre cour"
 cob_7899_scenerio.0522.c.else:0 "Mais peut-on faire confiance à un Franc-tenancier déshonoré ?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] s'est enfui avec l'argent"
 cob_7899_scenerio.0522.d:0 "Si nous abandonnons [sacrificed_entourage.GetFirstNameNoTooltip], cela pourrait nous faire gagner du temps."
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifierez [sacrificed_entourage.GetName] pour tenter de distraire les pillards."
 cob_7899_scenerio.0522.d.sacrifice:0 "PLACEHOLDER"

 cob_7899_scenerio.0523.t:0 "Rencontre avec un Soldat Valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de chacun dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et fais appeler [vassarion.GetName] afin de pouvoir voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs pousse un cri et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émerger de la brume, armés d'arbalètes et d'épées. L'un du groupe, vêtu des atours d'un officier de rang inférieur, sort de la brume pour se dresser devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiquée par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de le convaincre de rejoindre mon ost, ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Vous devriez vous joindre à nous !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de chacun dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et fais appeler [vassarion.GetName] afin de pouvoir voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs pousse un cri et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émerger de la brume, armés d'arbalètes et d'épées. L'un du groupe, vêtu des atours d'un officier de rang inférieur, sort de la brume pour se dresser devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiquée par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de le convaincre de rejoindre mon ost, ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0524.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0524.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b:0 "Vous devriez vous joindre à nous !"
 cob_7899_scenerio.0524.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0524.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0524.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0525.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0525.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de chacun dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et fais appeler [vassarion.GetName] afin de pouvoir voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs pousse un cri et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émerger de la brume, armés d'arbalètes et d'épées. L'un du groupe, vêtu des atours en lambeaux d'un Général Valyrien, sort de la brume pour se dresser devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiquée par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Envoyer [vassarion.GetName] combattre ? Ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0525.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0525.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b:0 "Vous affronterez [vassarion.GetName] !"
 cob_7899_scenerio.0525.b_1_tt:0 "[freeholder_survivor.GetName] périt !"
 cob_7899_scenerio.0525.b_2_tt:0 "[vassarion.GetName] périt !"
 cob_7899_scenerio.0525.b.win:0 "[vassarion.GetName] tue [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b.dead:0 "[freeholder_survivor.GetName] parvient à survivre face à [vassarion.GetName]"
 cob_7899_scenerio.0525.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0525.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0527.t:0 "Embuscade par un Seigneur Dragon"
 cob_7899_scenerio.0527.desc:0 "Alors que je vole sur [vassarion.GetName] à l'avant-garde de mon ost au-dessus des ruines de [location.GetName], un cri perçant déchire l'air, suivi d'une massive boule de flamme draconique qui manque de peu d'incinérer tout ce qui m'entoure.\n\nJe me réoriente pour scruter les nuages au-dessus de moi à la recherche de ce [dragon|E] sauvage ayant survécu au cataclysme pour m'attaquer. Il ne faut guère de temps avant que l'agresseur se révèle car, à ma grande surprise, le [dragon|E] avait un cavalier qui fit planer sa bête tout aussi massive devant moi. Je décide de parler avec [freeholder_dragonlord.GetHerHim] avant une autre attaque.\n\n« Je suis [aurion.GetName] et je suis revenu en ces terres pour les reconquérir au nom de [valyria|E]. » Je crie vers le [dragonlord|E].\n\n« Peu m'importe, [aurion.GetName]. Je suis [freeholder_dragonlord.GetName], chevaucheur de [enemy_dragon.GetName], et je revendique toutes ces terres sur lesquelles vous violez mon territoire. »"
 cob_7899_scenerio.0527.a:0 "J'affronterai [freeholder_dragonlord.GetName] et son [dragon|E]"
 cob_7899_scenerio.0527.a_tt:0 "Un duel de [dragon|E] commence avec [freeholder_dragonlord.GetName]"
 cob_7899_scenerio.0527.b:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0527.b_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0529.t:0 "Un Retour au Foyer Amer-doux"
 cob_7899_scenerio.0529.desc:0 "Je descends du navire sur les quais de pierre en ruines de [location.GetName], les yeux fixés sur les portes calcinées et dévastées de la capitale valyrienne.\n\n« Je suis chez moi », pensé-je. « Je suis enfin chez moi... mais il reste encore tant à accomplir avant que les [valyrian_freehold_short|E] ne renaissent. »\n\nJe mets un genou à terre et pose ma main sur la pierre tiède du quai un bref instant, puis relève la tête et m'en vais restaurer les ruines de cette cité puissante une fois encore..."
 cob_7899_scenerio.0529.a:0 "Je suis revenu chez moi en [valyria|E]..."


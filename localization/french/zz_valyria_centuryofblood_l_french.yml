 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je parcours les couloirs du palais en ruines de [location.GetName], jadis demeure de [Nymeria.GetName] des Rhoynars, et je me retrouve emporté par les récits que ma mère me contait enfant. Des récits sur les [dragonlords|E] d'antan et leurs conquêtes à travers [essos|E], s'emparant par droit divin et flamme de dragon de ce qui leur revenait de plein droit. Ceux qui pliaient le genou étaient épargnés ; ceux qui résistaient étaient effacés du monde ou jetés en exil, leurs royaumes déchus laissés à pourrir comme celui-ci.\n\nTandis que ces récits affluent dans mon esprit, je ne puis m'empêcher de me demander si les [valyrian_freehold_short|E] s'affaiblirent avec le temps ; je me demande si ces conquérants, ces héros des légendes, contempleraient mes frères et ressentiraient de la honte pour ce que nous sommes devenus. [valyria|E] fut jadis l'apogée du monde, mais à la fin, il semblait que nous n'étions plus que des enfants querelleurs se disputant pouvoir et richesse... peut-être est-ce pour cela que [ROOT.Char.GetFaith.HighGodName] choisit de [doom|E] notre peuple... peut-être ai-je été choisi pour maintenir vivant le rêve de [valyria|E]."
 cob_7899_scenerio.0500.a:0 "Nous poursuivons vers la Porte Lugubre"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers la Porte Lugubre"

 cob_7899_scenerio.0501.t:0 "La Décision à la Porte Lugubre"
 cob_7899_scenerio.0501.desc:0 "Debout, contemplant les eaux de la Rhoyne, la ruine de [location.GetName] — une autre conquête des [valyrian_freehold_short|E] — derrière moi, je réalise qu'en cet instant, un choix s'offre à moi. Je peux poursuivre la quête que j'imaginais au début de ce voyage et faire marcher mon ost sur les vestiges peut-être calcinés et emplis de magma de [valyria|E], afin d'y restaurer la puissance des [valyrian_freehold_short|E] à ma propre image... ou bien... je peux incarner l'esprit des premiers [dragonlords|E] de [valyria|E], rassembler les Lords dragons survivants d'[essos|E] et reconquérir les colonies des [valyrian_freehold_short|E] par droit de conquête et flamme de dragon\n\nÀ la frontière de [GetTitleByKey('k_volantis').GetName], je dois décider - entreprendre le voyage vers les terres brûlées de [GetTitleByKey('e_valyria').GetName], ou bien poursuivre et fonder une Nouvelle [valyria|E] à la manière de mes ancêtres ?\n\n#bold AVERTISSEMENT - l'une comme l'autre voie s'annoncent périlleuses ; il est recommandé de sauvegarder fréquemment pour éviter une fin de partie prématurée#!"
 cob_7899_scenerio.0501.b:0 "Je conquerrai les [free_cities|E] pour fonder une Nouvelle [valyria|E]"
 cob_7899_scenerio.0501.a:0 "Nous devons nous ravitailler à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager vers Volantis"

 ##Aurion Valyria Expedition

 cob_7899_scenerio.0502.t:0 "Ravitaillement au Long Pont"
 cob_7899_scenerio.0502.desc:0 "La première chose que je remarquai à [location.GetName] fut ce vacarme incessant et sans fin qui semblait envahir chaque recoin de la ville. Je ne saurais l'affirmer avec certitude, mais il semblait presque que la cité fût dix fois plus bruyante que la capitale valyrienne, tout en étant deux fois plus petite. Seule l'odeur surpassait ce vacarme : des gens crasseux, des latrines trop utilisées et mal entretenues, du poisson, et toute une multitude d'autres relents se mêlant pour former les effluves les plus impies le long du long pont où mon campement s'approvisionnait.\n\nHeureusement, il ne faudrait pas longtemps avant que nous reprenions la marche vers [valyria|E] pour reconquérir notre foyer. En traversant les rues, je remarquai une foule sans cesse grandissante célébrant la disparition de ma patrie, proclamant que le monde était enfin libéré de l'étreinte étouffante des [valyrian_freehold_short|E]. Je ne m'engageai pas avec eux, soulagé d'avoir laissé [vassarion.GetName] hors de la ville pour éviter toute confrontation inutile durant mon périple.\n\nAucune de leurs pensées n'avait vraiment d'importance, car ils verraient bien la vérité : moi, [aurion.GetName], je retournerais à [valyria|E] et la ramènerais à la splendeur qu'elle connut jadis. Pour l'heure, je pouvais m'accorder un instant de répit avant de poursuivre vers ce qu'il reste de mon foyer..."
 cob_7899_scenerio.0502.a:0 "Il est temps de poursuivre vers la Petite [valyria|E]"
 cob_7899_scenerio.0502.a_tt:0 "Voyager vers la Petite [valyria|E]"

 cob_7899_scenerio.0503.t:0 "Arrivée aux confins des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0503.desc:0 "Je me tiens ici aux confins de Volantis, hors de [location.GetName], et je ne puis en croire mes yeux en contemplant les terres qui s'étendent à quelques lieues devant moi. Un nuage noir comme la nuit fendait le ciel bleu au-dessus, engendrant une pluie qui brûlait la peau au moindre contact. Les terres devant nous semblaient enveloppées d'une brume qui troublait ma vue, m'empêchant de discerner ce qui pouvait se trouver devant ma caravane, faisant naître un sentiment d'effroi que je sentais se répandre parmi les rangs. Je me tournai vers Vassarion, remontai en selle, puis fis pivoter la bête vers mon ost.\n\n« Le voyage fut long et la route qui s'ouvre devant nous semble sombre, mes amis. Pourtant, nous avons tous été choisis pour un dessein divin : reconquérir ce qui semble perdu, chasser les ténèbres et ramener la lumière en ce monde. [ROOT.Char.GetFaith.HighGodName] ne nous aurait pas menés si loin pour nous abandonner à présent ; aussi irons-nous de l'avant reconquérir ce qui nous revient de droit, afin de rebâtir le rêve de [valyria|E] pour tous ceux qui foulent ce monde ! »\n\nLes acclamations qui s'élevèrent des troupes furent toute la confirmation dont j'avais besoin : elles étaient prêtes à affronter ce qui viendrait..."
 cob_7899_scenerio.0503.a:0 "Il est temps de reconquérir notre foyer"
 cob_7899_scenerio.0503.a_tt:0 "Voyager en [valyria|E]"

 ##Aurion New Valyria Conquest

 cob_7899_scenerio.0510.t:0 "Archonte Aurion Ier de la Nouvelle [valyria|E]"
 cob_7899_scenerio.0510.desc:0 "En franchissant les halls dorés du Vieux Volantis, je me sens envahi d'une détermination sacrée. Ce sont ces halls que [ROOT.Char.GetFaith.HighGodName] de [valyria|E] me destinait à fouler ; les fondateurs de la colonie du Vieux Volantis n'auraient jamais pu imaginer que la cité qu'ils bâtissaient était vouée, par droit divin, à accueillir le premier Archonte d'une Nouvelle [valyria|E].\n\nCependant, je ne saurais trouver de répit tant que toutes les filles de l'ancien [the_freehold|E] ne seront pas rassemblées sous ma bannière ; je dois réunir les [dragonlords|E] survivants d'[essos|E] et les convoquer à ma cour. De là, nous marcherons pour reprendre ce qui nous revient de droit divin et de puissance."
 cob_7899_scenerio.0510.a:0 "Je partirai unir les filles de [valyria|E]"
 cob_7899_scenerio.0510.tt:0 "Vos troupes qohoriennes seront dissoutes afin de tenir la ville."

 cob_7899_scenerio.0511.t:0 "Tout Ce Qui Fut Jadis... Sera à Nouveau"
 cob_7899_scenerio.0511.desc:0 "Venus de chaque recoin d'[essos|E], les autres [dragonlords|E] choisis par [ROOT.Char.GetFaith.HighGodName] pour survivre au [doom|E] se tiennent dans ma salle d'audience. Devant moi se dressaient [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal], animés du désir sacré de se joindre à moi pour restaurer l'ordre en ce monde, comme nos ancêtres le firent jadis.\n\nIl ne me reste plus qu'à lancer une campagne de conquête à travers les anciennes colonies des [valyrian_freehold_short|E], afin de les réunir une fois de plus sous la puissance du [dragon|E], par la fureur indomptée de la flamme draconique... Nous marcherons depuis Volantis, mais je dois à présent décider laquelle des [free_cities|E] sera conquise en premier au nom des [dragonlords|E] de la Nouvelle [valyria|E]... Dois-je frapper Myr pour ouvrir la voie vers Pentos ? Ou frapper Lys, puis Tyrosh, pour prendre le contrôle des régions méridionales ?"
 cob_7899_scenerio.0511.a:0 "La Maison Urnebar régnera sur Tyrosh"
 cob_7899_scenerio.0511.b:0 "La Maison Sonaryen régnera sur Lys"
 cob_7899_scenerio.0511.c:0 "La Maison Mataeryon régnera sur Myr"
 cob_7899_scenerio.0511.d:0 "La Maison Belaerys régnera sur Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des [free_cities|E]"
 cob_7899_scenerio.0512.desc:0 "Je marche à travers le champ de bataille embrasé et ensanglanté, les cris des blessés se mêlant aux acclamations triomphantes de mes soldats pour former une sorte de symphonie impie à mes oreilles. Mes soldats se tiennent victorieux derrière moi tandis que j'accepte la capitulation de l'Archonte, leurs clameurs assourdissant le reste du monde alors que je décrète que cette [free_city|E] relève désormais directement de la juridiction des Nouvelles [valyrian_freehold|E], et qu'un nouveau [dragonlord|E] y régnera par droit divin\n\nIl me faut à présent choisir la prochaine cité qui se soumettra à la puissance de la Nouvelle [valyria|E]..."

 cob_7899_scenerio.0516.t:0 "Un Rameau d'Olivier pour un Ancien Avant-poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, les [dragonlords|E] survivants de [valyria|E] régnant désormais sous mon autorité. Pourtant, alors que je contemple la carte de mon empire grandissant, une petite chaîne d'îles au-delà du [narrow_sea|El], à l'embouchure de la Baie de la Néra, ne cesse d'attirer mon attention. Je pose le doigt sur la carte, près de la plus grande de ces îles... Peyredragon, ancien avant-poste à l'extrémité des [valyrian_freehold|E], se tenant aujourd'hui indépendant de l'Empire de la Nouvelle Valyria.\n\nAlors que j'envisageais une déclaration de conquête pure et simple pour reconquérir ce qui appartint jadis à [valyria|E], à la manière dont j'avais soumis les [free_cities|E], une révélation me traversa. Les Targaryen survécurent au [doom|E] de la même façon que les [dragonlords|E] régnant sur mon nouvel empire : par intervention divine. Il apparaît donc raisonnable d'envoyer un message à quiconque gouverne ce rocher désolé, avec une offre de réintégrer le giron une fois encore..."
 cob_7899_scenerio.0516.a:0 "Envoyer un corbeau avec une offre de prêter allégeance à la Nouvelle [valyria|E]"

 cob_7899_scenerio.0517.t:0 "Un Corbeau des [valyrian_freehold_short|E] ?"
 cob_7899_scenerio.0517.desc:0 "Je me retrouve tiré du sommeil au cœur de la nuit par des coups violents frappés à la porte de ma chambre. Je parviens à m'arracher au confort chaleureux de mon lit et enfile une robe pour découvrir qui oserait me déranger à une heure si tardive. En ouvrant la porte, je trouve le mestre dans le couloir, un message porté par corbeau serré dans sa main tremblante. Je prends la lettre en silence, déroulant le parchemin pour en lire le contenu...\n\nQuelques heures plus tard, le Lord de Lamarck se tenait avec moi dans la salle du trône de Peyredragon, arborant la même expression de stupeur que j'avais moi-même affichée quelques heures auparavant. [aurion.GetName] avait pris son envol à dos de dragon et conquis les anciennes colonies des [valyrian_freehold_short|E] pour se proclamer Archonte de la Nouvelle [valyria|E], et exigeait à présent que Peyredragon prête allégeance à ce nouvel ordre... il m'incombe désormais de décider du destin de mon royaume..."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne pliera pas devant un nouveau Lord dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons cette offre de rejoindre une Nouvelle [valyria|E]"

 cob_7899_scenerio.0518.t:0 "Un Rameau d'Olivier Rejeté et Brisé"
 cob_7899_scenerio.0518.desc:0 "« Maudits lâches ! »\n\nJe froissai la réponse reçue de Peyredragon et la jetai dans l'âtre embrasé, saisi de rage. Comment osent-ils se croire assez supérieurs pour refuser de rejoindre mon nouvel empire ? Croient-ils vraiment pouvoir se tenir seuls en ce monde et résister à la puissance de la Nouvelle [valyria|E] ? Cet avant-poste appartenait à l'ancien [the_freehold|E] et devrait, de droit, revenir à l'Empire de la Nouvelle [valyria|E], que les lâches Targaryens l'habitent ou non.\n\nJe dois à présent décider de la marche à suivre..."
 cob_7899_scenerio.0518.a:0 "Nous ramènerons Peyredragon dans le giron de [valyria|E] par la force !"
 cob_7899_scenerio.0518.b:0 "Qu'ils demeurent sur leur rocher à trembler de peur"

 # cob_7899_scenerio.0519.t:0 "An Embarassing Defeat..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "We have been beaten defeated"

 cob_7899_scenerio.0520.t:0 "Peyredragon Retourne à [valyria|E]"
 cob_7899_scenerio.0520.desc:0 "C'est un jour glorieux pour mon nouvel Empire : la nouvelle est parvenue à ma cour que Peyredragon a déclaré son intention de prêter allégeance à l'Empire de la Nouvelle [valyria|E]. Grâce à cette annonce, les dernières anciennes colonies des [valyrian_freehold_short|E] se trouvent unies comme jamais auparavant, animées d'un unique dessein : maintenir vivante la puissance des [valyrian_freehold|E] dans l'esprit de ceux qui se réjouiraient de notre chute. Nous devons désormais nous tenir unis contre quiconque s'opposerait à nous, jusqu'au jour où [valyria|E] n'aura plus d'ennemis à craindre."
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueillie au sein de la Nouvelle [valyria|E]"

 ##Aurion Valyria Events

 cob_7899_scenerio.0521.t:0 "Attaque de Ver de Feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds ; la panique commence à se répandre parmi le groupe tandis que le sol s'ouvre devant nous, laissant émerger un massif ver de feu qui se dresse comme un défi à franchir.\n\n« Mon/Ma [ROOT.Char.GetLadyLord] ! Que faisons-nous ? » s'écrie l'un des courtisans, reculant lentement comme pour battre en retraite. Je regarde autour de moi l'armée qui a choisi de me suivre dans cette quête et dois à présent décider comment gérer cette situation..."
 cob_7899_scenerio.0521.a:0 "J'affronterai la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons battre en retraite !"
 cob_7899_scenerio.0521.c:0 "L'un de mes chevaliers peut s'en charger !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Une Embuscade de Survivants des [valyrian_freehold_short|E] !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre ost traverse [location.GetName], un cri de guerre déchire l'air frais du matin, nous glaçant l'échine. Même parmi les voyageurs les plus braves, un tel bruit aurait poussé les hommes les plus hardis à courir se réfugier dans les jupes de leur mère.\n\n« Des cavaliers, mon/ma [ROOT.Char.GetLadyLord] ! » La voix d'un éclaireur retentit à travers la tension ambiante, attirant mon attention alors qu'il dégaine son épée, la pointant devant lui. Il n'y a encore rien à voir, mais le bruit de nombreux sabots, une douzaine de chevaux ou plus, s'amplifie et se rapproche. La panique se répand parmi nous comme une traînée de poudre, une autre voix rejoignant le chœur de la peur lorsqu'ils apparaissent enfin. « Ils sont #bold si nombreux#!! »\n\nBien que peu nombreux, les ennemis sont massifs, sans peur, et semblent prêts à perdre la vie pour s'emparer de nos biens. À leur tête chevauche un(e) immense [freeholder_looter.GetWomanMan], vêtu(e) des lambeaux de ce qui fut autrefois de fins habits valyriens, armé(e) d'une épée à deux mains. Le chef de cette bande hurle son nom pour que tous l'entendent : [freeholder_looter.GetFirstNameNicknamed]. Ce pillard en devenir proclame d'une voix assurée et puissante sa cruauté, ses raids audacieux tels que celui-ci, et son tempérament de feu.\n\nAlors que les pillards se rapprochent, mon cheval rue et s'ébroue, menaçant de me désarçonner, mais je tiens fermement les rênes, me redressant en selle. Levant mon [ROOT.Char.Custom('signature_weapon')] dans les airs, je m'écrie..."
 cob_7899_scenerio.0522.a:0 "Faites demi-tour ! Faites demi-tour sur-le-champ !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre suite tentez de fuir les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.a.toast:0 "Fuyez !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous vous échappez sans encombre. Prends ça, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous vous êtes échappé, mais cela a légèrement retardé votre voyage."
 cob_7899_scenerio.0522.a.majordelay:0 "Vous vous êtes échappé, mais cela a considérablement retardé votre voyage."
 cob_7899_scenerio.0522.a.minortheft:0 "Vous avez sauvé votre vie, mais pas tous vos biens."
 cob_7899_scenerio.0522.a.majortheft:0 "Vous avez sauvé votre vie, mais votre bourse est tombée de votre selle durant la fuite."
 cob_7899_scenerio.0522.a.minorcombo:0 "Malgré la manœuvre, [freeholder_looter.GetFirstNameNoTooltip] est parvenu(e) à dérober certains de vos biens."
 cob_7899_scenerio.0522.a.majorcombo:0 "Malgré la manœuvre complexe, [freeholder_looter.GetFirstNameNoTooltip] est parvenu(e) à dérober la plupart de vos biens."
 cob_7899_scenerio.0522.a.scattered:0 "Votre suite fut dispersée — chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Assez tergiversé, mes gaillards, suivez-moi ! Chargez !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille."
 cob_7899_scenerio.0522.b.win:0 "Vous avez Gagné"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez tué tous les pillards du groupe."
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef de la bande de pillards des [valyrian_freehold_short|E], [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "La bande de pillards des [valyrian_freehold_short|E] et son chef [freeholder_looter.GetFirstName] s'échappent après une heure de combat !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille."
 cob_7899_scenerio.0522.b.loss:0 "Vous avez Perdu"
 cob_7899_scenerio.0522.b.robbed:0 "Vous fûtes vaincu, rassemblé et dépouillé ; ils prirent tout ce que vous aviez."
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous fûtes vaincu, et les pillards emmenèrent [kidnapped_entourage.GetName]..."
 cob_7899_scenerio.0522.c:0 "Et si nous les soudoyions..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]."
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] Rejoint Votre Cour"
 cob_7899_scenerio.0522.c.else:0 "Mais devriez-vous faire confiance à un Valyrien déchu ?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] s'Enfuit avec l'Argent"
 cob_7899_scenerio.0522.d:0 "Si nous abandonnons [sacrificed_entourage.GetFirstNameNoTooltip], cela pourrait nous faire gagner du temps."
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifierez [sacrificed_entourage.GetName] pour tenter de distraire les pillards."
 cob_7899_scenerio.0522.d.sacrifice:0 "PLACEHOLDER"

 cob_7899_scenerio.0523.t:0 "Rencontre avec un Soldat Valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous traversons les terres ravagées de [location.GetName], l'air épaissi par la fumée volcanique et les cendres qui obscurcissent la vue tout en étouffant le souffle de chaque membre de mon ost. Je décide que nous devrions prendre un moment pour nous orienter et fais venir [vassarion.GetName] afin de survoler les nuages. Tandis que j'attends, l'un de mes éclaireurs appelle et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un d'eux, vêtu des habits d'un officier subalterne, sort de la brume pour se planter devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] nous appartient désormais et vous allez vous rendre à moi. »\n\nJe dois à présent décider de la conduite à tenir. Dois-je affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je tenter de le/la convaincre de rejoindre mon ost, ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Vous devriez nous rejoindre !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous traversons les terres ravagées de [location.GetName], l'air épaissi par la fumée volcanique et les cendres qui obscurcissent la vue tout en étouffant le souffle de chaque membre de mon ost. Je décide que nous devrions prendre un moment pour nous orienter et fais venir [vassarion.GetName] afin de survoler les nuages. Tandis que j'attends, l'un de mes éclaireurs appelle et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un d'eux, vêtu des habits d'un officier subalterne, sort de la brume pour se planter devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] nous appartient désormais et vous allez vous rendre à moi. »\n\nJe dois à présent décider de la conduite à tenir. Dois-je affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je tenter de le/la convaincre de rejoindre mon ost, ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0524.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0524.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b:0 "Vous devriez nous rejoindre !"
 cob_7899_scenerio.0524.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0524.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0524.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0525.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0525.desc:0 "Nous traversons les terres ravagées de [location.GetName], l'air épaissi par la fumée volcanique et les cendres qui obscurcissent la vue tout en étouffant le souffle de chaque membre de mon ost. Je décide que nous devrions prendre un moment pour nous orienter et fais venir [vassarion.GetName] afin de survoler les nuages. Tandis que j'attends, l'un de mes éclaireurs appelle et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un d'eux, vêtu des habits en lambeaux d'un général valyrien, sort de la brume pour se planter devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] nous appartient désormais et vous allez vous rendre à moi. »\n\nJe dois à présent décider de la conduite à tenir. Dois-je affronter [freeholder_survivor.GetName] en combat singulier ? Envoyer [vassarion.GetName] combattre ? Ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0525.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0525.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b:0 "[vassarion.GetName] se chargera du combat !"
 cob_7899_scenerio.0525.b_1_tt:0 "[freeholder_survivor.GetName] meurt !"
 cob_7899_scenerio.0525.b_2_tt:0 "[vassarion.GetName] meurt !"
 cob_7899_scenerio.0525.b.win:0 "[vassarion.GetName] tue [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b.dead:0 "[freeholder_survivor.GetName] parvient à survivre face à [vassarion.GetName]"
 cob_7899_scenerio.0525.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0525.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0527.t:0 "Embusqué par un Lord dragon"
 cob_7899_scenerio.0527.desc:0 "Tandis que je vole sur [vassarion.GetName], à l'avant-garde de mon ost, au-dessus des ruines de [location.GetName], un cri perçant déchire l'air, suivi d'une gigantesque gerbe de flamme draconique qui manque d'incinérer tout ce qui m'entoure.\n\nJe me réoriente pour scruter les nuages à la recherche du [dragon|E] sauvage qui aurait survécu au cataclysme pour m'attaquer. Peu après, l'agresseur se révèle : à ma grande surprise, le [dragon|E] avait un cavalier qui vint faire planer sa bête tout aussi massive devant moi. Je décide de m'adresser à [freeholder_dragonlord.GetHerHim] avant une nouvelle attaque.\n\n« Je suis [aurion.GetName] et je suis revenu sur ces terres pour les reconquérir au nom de [valyria|E]. » je crie en direction du [dragonlord|E]\n\n« Peu m'importe, [aurion.GetName], je suis [freeholder_dragonlord.GetName], cavalier de [enemy_dragon.GetName], et je revendique toutes ces terres sur lesquelles vous vous trouvez en intrus. »"
 cob_7899_scenerio.0527.a:0 "J'affronterai [freeholder_dragonlord.GetName] et son [dragon|E]"
 cob_7899_scenerio.0527.a_tt:0 "Un duel de [dragon|E] commence avec [freeholder_dragonlord.GetName]"
 cob_7899_scenerio.0527.b:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0527.b_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0529.t:0 "Un Retour au Foyer Doux-Amer"
 cob_7899_scenerio.0529.desc:0 "Je descends du navire sur les quais de pierre en ruines de [location.GetName], les yeux rivés sur les portes calcinées et dévastées de la capitale valyrienne.\n\n« Je suis chez moi », me dis-je. « Je suis enfin chez moi... mais il reste encore tant à accomplir avant que les [valyrian_freehold_short|E] ne renaissent. »\n\nJe mets un genou à terre et pose ma main sur la pierre tiède du quai un bref instant, puis relève la tête et me mets en marche pour restaurer les ruines de cette puissante cité une fois encore..."
 cob_7899_scenerio.0529.a:0 "Je suis rentré chez moi à [valyria|E] et j'ai trouvé un Diadème des Possessions Valyriennes..."
 cob_7899_scenerio.0529.b:0 "Je suis rentré chez moi à [valyria|E] et j'ai trouvé une Couronne des Possessions Valyriennes..."
 cob_7899_scenerio.0529.tt:0 "Vos troupes qohoriennes seront dissoutes pour servir de gardiens de la cité"

 # Updated Firewyrm Attack
 cob_7899_scenerio.0541.t:0 "Attaque de Veur de Feu !"
 cob_7899_scenerio.0541.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds ; la panique commence à se répandre parmi le groupe tandis que le sol s'ouvre devant nous, laissant émerger un massif Veur de Feu qui se dresse comme un défi à franchir.\n\n« Mon/Ma [ROOT.Char.GetLadyLord] ! Que faisons-nous ? » s'écrie l'un des courtisans, reculant lentement comme pour battre en retraite. Je regarde autour de moi l'armée qui a choisi de me suivre dans cette quête et dois à présent décider comment gérer cette situation..."
 cob_7899_scenerio.0541.duel.dragon:0 "[vassarion.GetName] ! Aderī !"
 cob_7899_scenerio.0541.duel.dragon.tt:0 "Vous appelez rapidement votre dragon et vous préparez à affronter la bête."
 cob_7899_scenerio.0541.duel:0 "Acier et feu, alors. Que les dieux en soient témoins."
 cob_7899_scenerio.0541.duel.tt:0 "Vous tenez bon et tentez de terrasser le veur de feu."
 cob_7899_scenerio.0541.b:0 "Nous devons battre en retraite !"

 cob_7899_scenerio.9998.t:0 "L'Expédition Perdue d'Aurion"
 cob_7899_scenerio.9998.desc:0 "En traversant les terres de Valyria, votre groupe tombe sur ce qui ressemble à un vaste cimetière de squelettes figés dans diverses postures de terreur...\n\nAprès quelques explorations, vous déterminez qu'il doit s'agir du dernier repos de l'expédition d'Aurion Varezys en Valyria ; au centre du carnage, vous découvrez le squelette d'un grand dragon enroulé autour de la dépouille armurée de son cavalier, que vous croyez être Aurion. À première vue, il semble que le dragon tentait de protéger Aurion contre... quelque chose. Un sentiment d'effroi vous envahit à l'idée qu'un danger si terrifiant ait pu faire pressentir sa fin à un dragon d'une telle taille.\n\nVous devez maintenant décider si vous troublerez ce lieu de sépulture pour récupérer l'épée et l'armure de la Maison Varezys, sachant que, selon les légendes anciennes, un tel acte entraînera un châtiment..."
 cob_7899_scenerio.9998.a:0 "Prendre les artefacts et accepter le châtiment"
 cob_7899_scenerio.9998.b:0 "Je réclamerai l'héritage de ma famille"
 cob_7899_scenerio.9998.c:0 "Ces artefacts doivent rester dans ce cimetière"


 cob_7899_scenerio.9999.t:0 "Tentative de Défi envers les Dieux"
 cob_7899_scenerio.9999.desc:0 "Vous vous trouvez au cœur d'un rêve, une peur profonde vous étreint tandis qu'une voix rugit depuis les ténèbres\n\n« Tu as tenté de défier la volonté des Dieux ; l'artefact que tu cherchais à invoquer a été perdu dans la magie profonde et ne pourra être récupéré que lorsque les Dieux le jugeront bon. »\n\nQuelques instants plus tard seulement, vous parvenez à vous réveiller, désorienté par ce qui vient de se produire...\n\nNOTE DU DÉVELOPPEUR - cet artefact est actuellement bloqué et ne peut être généré via le débogage, car une chaîne d'événements cachée dans le monde permet de le récupérer"
 cob_7899_scenerio.9999.a:0 "Je dois vraiment arrêter de boire..."
 cob_7899_scenerio.9999.b:0 "JE FAIS CE QUE JE VEUX (n'appuyez pas là-dessus, mais vous le ferez quand même)"

 cob_decisions.0001.t:0 "Un Message de Valyria ?"
 cob_decisions.0001.desc:0 "Je contemple la lettre entre mes mains, incrédule. Quelqu'un du nom de [dragonlord_of_valyria.GetName] prétend avoir repeuplé Valyria et demande à tous les dragonniers de revenir réclamer leur droit de naissance. J'ai savouré ma vie de dragonnier en ce monde et j'ignore si je souhaite vivre sous l'autorité d'un autre..."
 cob_decisions.0001.a:0 "J'accepterai la proposition de [dragonlord_of_valyria.GetNamePossessive]"
 cob_decisions.0001.b:0 "Je dois refuser et tracer ma propre voie"

 cob_decisions.0002.t:0 "Une Proposition Acceptée"
 cob_decisions.0002.desc:0 "Je contemple le parchemin entre mes mains et célèbre en silence ma bonne fortune. [dragonlord.GetName] a accepté ma proposition et souhaite se rendre à ma cour sur-le-champ. Ce jour est véritablement glorieux pour Valyria"
 cob_decisions.0002.a:0 "Je ferai les préparatifs pour les recevoir"

 cob_decisions.0003.t:0 "Une Proposition Rejetée"
 cob_decisions.0003.desc:0 "Je ne puis croire les mots que je lis... [dragonlord.GetName] a rejeté ma proposition de venir à Valyria réclamer son droit de naissance. Voilà un véritable revers, mais peut-être qu'une fois que j'aurai rassemblé davantage de pouvoir et de titres, je pourrai tenter de le/la convaincre à nouveau, avec plus de succès..."
 cob_decisions.0003.a:0 "Nous irons de l'avant"



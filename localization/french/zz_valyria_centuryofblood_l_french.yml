#Events
# lv_scenerio_cob:0 "The Century of Blood"
 cob_7899_scenerio.0001.t:0 "Le Roi des Orages et des Rivières"
 cob_7899_scenerio.0001.desc:0 "C'est une période de richesse et de prospérité pour le Royaume des Orages et des Rivières. Depuis que mon ancêtre [arlan.GetName] a uni les deux empires et détruit le roi prétendant [lucifer.GetFirstName], la lignée de [benedict.GetName] s'est éteinte. La maison Durrandon demeure la seule à régner sur le Trident et les Terres de l'Orage.\n\nTout n'est pourtant pas aussi serein qu'il y paraît. Les tensions grandissent au sein du royaume... À l'ouest, des rumeurs indiquent que les Fer-nés sous [qhorwyn.GetName] s'agitent, nourrissant peut-être des ambitions de conquête des richesses du Trident. On murmure également qu'un survivant de la maison Justman répand la nouvelle qu'il serait le souverain légitime du Trident... Un autre Justman qui désire être libéré de cette vie mortelle pour garantir que le cerf continue à régner sur les Rivières et les Orages"
 cob_7899_scenerio.0001.a:0 "Notre Fureur est Légendaire"

 cob_7899_scenerio.0002.t:0 "L'Exilé et la Rêveuse"
 cob_7899_scenerio.0002.desc:0 "Le [doom|E] s'est abattu sur Valyria exactement comme [dreamer.GetFirstName] l'avait prédit. Si je n'avais pas agi quand je l'ai fait, vendant toute la fortune de notre famille pour nous installer sur cet avant-poste volcanique lugubre, notre famille aurait sûrement été détruite. Les [valyrian_freehold_short|E], autrefois la plus grande puissance du monde, sont devenues l'ombre d'un néant en quelques heures. La maison Targaryen pourrait bien être la famille la plus puissante qui reste.\n\nJe dois réfléchir à ce que l'avenir réserve à ma famille et à moi-même. Devons-nous développer nos terres et maintenir la volonté des [valyrian_freehold_short|E] dans cet unique avant-poste, ou étendre à nouveau l'influence des [valyrian_freehold_short|E] sur les Cités Libres et, peut-être, sur [westeros|E] même?"
 cob_7899_scenerio.0002.a:0 "Feu et Sang"

 cob_7899_scenerio.0003.t:0 "Le Roi du Sel et de la Mer"
 cob_7899_scenerio.0003.desc:0 "Mon heure approche... Je sens [ROOT.Char.GetFaith.HighGodName] m'appeler depuis ses salles aquatiques tandis que cette maladie incessante s'empare de mon corps frêle et vieillissant. Depuis la mort de mon premier fils, [harmund.GetName], mon second fils [harlan.GetName] s'est affirmé, gérant le royaume alors que je suis lentement terrassé par la maladie.\n\n[harwyn.GetName], mon troisième fils qui était parti chercher la gloire dans les Cités Libres, est revenu avec des intentions mystérieuses. Je suppose qu'il a appris que je suis malade et aux portes de la mort depuis ce qui me semble une éternité, et qu'il vient réclamer l'héritage qu'il croit lui être dû.\n\nSeul le temps dira quand [ROOT.Char.GetFaith.HighGodName] m'appellera dans ses salles aquatiques. Pour l'instant, je ne peux qu'imaginer ce qu'il adviendra du royaume que j'ai si diligemment bâti"
 cob_7899_scenerio.0003.a:0 "Ce qui est mort ne saurait mourir"

 cob_7899_scenerio.0004.t:0 "Le Roi du Roc"
 cob_7899_scenerio.0004.desc:0 "La nouvelle est parvenue à Castral Roc que Valyria a été détruite dans un cataclysme d'une destruction sans précédent. La quasi-totalité de l'Empire des [dragonlord|E] a péri avec leurs dragons, laissant leurs anciennes terres mûres pour le pillage si un souverain ambitieux choisit de tirer parti de cette situation. Peut-être que toutes les richesses et la magie n'ont pas été détruites... La maison Lannister pourrait cimenter définitivement sa place comme la plus riche et la plus puissante maison de [westeros|E] à jamais..."
 cob_7899_scenerio.0004.a:0 "Ce n'est qu'un rêve insensé, je devrais concentrer mon attention ici"
 cob_7899_scenerio.0004.a_tt:0 "Vous choisissez de ne pas risquer votre vie et de rester à Castral Roc"
 cob_7899_scenerio.0004.b:0 "Une opportunité m'attend à Valyria que je ne peux ignorer"
 cob_7899_scenerio.0004.b_tt:0 "Vous choisissez de tout risquer pour voyager vers les vestiges de Valyria"

 cob_7899_scenerio.0005.t:0 "L'Héritier des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0005.desc:0 "Les [valyrian_freehold_short|E] sont tombées... Je n'ai reçu aucune réponse à ma correspondance depuis des lustres... Je ne peux que supposer que les rumeurs de ce que l'on appelle un '[doom|E]' sont vraies.\n\nJ'ai rassemblé une force de soldats qohoriens dans le but de voler avec [vassarion.GetName] vers ce qui reste de Valyria... J'espère restaurer l'ordre dans ce monde une fois encore... Cependant, si les rumeurs sont exactes et que les [valyrian_freehold_short|E] ne sont plus que cendres, peut-être cette armée serait-elle mieux utilisée à soumettre les Cités Libres sous mon règne... Tout ce que je sais, c'est que je dois mettre cette ost en marche vers le sud depuis [location.GetName] pour découvrir par moi-même ce qu'il est advenu de ma patrie..."
 cob_7899_scenerio.0005.a:0 "Je retournerai aux [valyrian_freehold_short|E] et réclamerai ce qui en reste"
 cob_7899_scenerio.0005.a_tt:0 "Voyager jusqu'à Ny Sar"

 cob_7899_scenerio.0006.t:0 "L'Héritier du Roi des Rivières"
 cob_7899_scenerio.0006.desc:0 "Mon illustre ancêtre [lucifer.GetFirstName], le légitime Roi des Rivières du Trident, s'est déclaré dernier descendant vivant de [benedict.GetName]. Il fut tué par [arlan.GetName], afin que les Rois de l'Orage maintiennent leur domination illégitime sur le Royaume du Trident.\n\nPendant des siècles, la lignée de la maison Justman est restée dans l'ombre, évitant la fureur des Rois de l'Orage qui aurait pu conduire à notre extinction. Je ne peux plus continuer cette tradition... Je dois partir et rassembler des alliés pour faire valoir ma revendication sur les terres de mes ancêtres\n\nMaintenant, je dois décider où me rendre... Les terres fertiles du Bief ? La richesse des Terres de l'Ouest ? Ou les montagnes du Val?"
 cob_7899_scenerio.0006.a:0 "Chercher de l'aide auprès du Bief"
 cob_7899_scenerio.0006.a_tt:0 "Voyager jusqu'à Hautjardin"
 cob_7899_scenerio.0006.b:0 "Chercher de l'aide auprès du Roc"
 cob_7899_scenerio.0006.b_tt:0 "Voyager jusqu'à Castral Roc"
 cob_7899_scenerio.0006.c:0 "Chercher de l'aide auprès du Val"
 cob_7899_scenerio.0006.c_tt:0 "Voyager jusqu'aux Eyrié"
 cob_7899_scenerio.0006.d:0 "Partir seul"

 #Tommen Events

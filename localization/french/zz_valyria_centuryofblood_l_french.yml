#  cob_7899_scenerio.0400.desc:0 "En arrivant à [GetTitleByKey('c_lannisport').GetName] je suis immédiatement accueilli par [lannisport.GetName] qui m'informe rapidement que mon navire a été préparé et est prêt à naviguer. Je sens une grande vague d'énergie me traverser à la pensée de commencer mon voyage, j'étais impatient dans le palais en attendant ce moment sachant que chaque heure qui passait était une heure de plus que quelqu'un d'autre pourrait arriver et revendiquer les restes des [valyrian_freehold_short|E] avant moi.\n\nC'était maintenant le moment de prendre la mer et commencer le long voyage vers [essos|E] pour découvrir ce qui reste de [valyria|E] après le [doom|E]. La flotte partirait pour [valyria|E] dès qu'il serait à bord de son vaisseau amiral, faisant son premier arrêt à [GetTitleByKey('c_oldtown').GetName] pour acheter des provisions pour continuer le voyage, cette quête s'avérerait coûteuse, mais, à la fin les richesses des [valyrian_freehold_short|E] compenseraient largement le coût."

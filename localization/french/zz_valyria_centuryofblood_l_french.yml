 #COB Decisions
 cob_send_for_the_dragonlords_decision:0 "Convoquer les Lords dragons"
 cob_send_for_the_dragonlords_decision_desc:0 "Le temps est venu de lancer un appel au monde afin que tous les Lords dragons sans terre reviennent chez eux réclamer leur droit de naissance.\n\nTrop longtemps ces terres sont demeurées inoccupées ; je souhaite voir à nouveau les cieux se remplir du battement d'ailes des dragons portant leurs maîtres Lords dragons à travers les airs."
 cob_send_for_the_dragonlords_decision_tooltip:0 "Envoyer des corbeaux à travers le monde pour demander aux Lords dragons de revenir"
 cob_send_for_the_dragonlords_decision_confirm:0 "Envoyer les Corbeaux"

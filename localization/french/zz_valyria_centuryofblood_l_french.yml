 #Events
 # lv_scenerio_cob:0 "The Century of Blood"
 cob_7899_scenerio.0001.t:0 "Le Roi des Orages et des Rivières"
 cob_7899_scenerio.0001.desc:0 "C'est un temps de richesse et de prospérité pour le Royaume des Orages et des Rivières. Depuis que mon ancêtre [arlan.GetName] unifia les deux empires en un seul et anéantit le roi usurpateur [lucifer.GetFirstName], la lignée de [benedict.GetName] s'est éteinte. La Maison Durrandon demeure l'unique dynastie régnant sur le Trident et les Terres de l'Orage.\n\nMais tout n'est pas ce qu'il paraît. Les dissensions grandissent au sein du royaume... De l'Ouest parviennent des rumeurs selon lesquelles les Fer-nés, sous [qhorwyn.GetName], s'agitent avec l'ambition possible de conquérir les richesses du Trident. On chuchote également qu'un survivant de la Maison Justman clame haut et fort être le seigneur légitime du Trident... Un autre Justman, prêt à quitter cette dépouille mortelle pour que le cerf continue de régner sur les Rivières et les Orages."
 cob_7899_scenerio.0001.a:0 "Notre est la Fureur"

 cob_7899_scenerio.0002.t:0 "L'Exilé et la Rêveuse"
 cob_7899_scenerio.0002.desc:0 "Le [doom|E] s'est abattu sur [valyria|E], exactement comme [dreamer.GetFirstName] l'avait prédit. Si je n'avais pas agi quand je l'ai fait, vendant toute la fortune de notre famille pour nous établir sur ce morne avant-poste volcanique, notre lignée aurait assurément péri. Les [valyrian_freehold_short|E], jadis la force la plus puissante du monde, ne sont plus qu'une ombre de néant en l'espace de quelques heures. La Maison Targaryen pourrait bien être la plus puissante famille survivante.\n\nJe dois méditer sur ce que l'avenir réserve à ma famille et à moi-même. Devons-nous consolider nos terres et préserver la volonté des [valyrian_freehold_short|E] au sein de ce seul avant-poste, ou étendre à nouveau l'influence des [valyrian_freehold_short|E] sur les [free_cities|E] et, peut-être, sur [westeros|E] lui-même ?"
 cob_7899_scenerio.0002.a:0 "Feu et Sang"

 cob_7899_scenerio.0003.t:0 "Le Roi du Sel et de la Mer"
 cob_7899_scenerio.0003.desc:0 "Mon heure approche... Je sens [ROOT.Char.GetFaith.HighGodName] m'appeler depuis ses salles aquatiques, tandis que cette maladie incessante s'empare de mon corps vieux et frêle. Depuis le trépas de mon premier fils, [harmund.GetName], mon second fils [harlan.GetName] a pris de l'assurance, gérant les affaires du royaume tandis que le mal me consume lentement.\n\n[harwyn.GetName], mon troisième fils parti chercher la gloire dans les [free_cities|E], est revenu avec des intentions incertaines. Je ne peux que supposer qu'ayant appris que je suis malade et proche du trépas depuis ce qui semble une éternité, il vient réclamer l'héritage qu'il estime lui être dû.\n\nSeul le temps dira quand [ROOT.Char.GetFaith.HighGodName] m'appellera dans ses salles aquatiques ; pour l'heure, je ne puis qu'imaginer ce qu'il adviendra du royaume que j'ai si diligemment bâti."
 cob_7899_scenerio.0003.a:0 "Ce qui est Mort ne saurait Mourir"

 cob_7899_scenerio.0004.t:0 "Le Roi du Roc"
 cob_7899_scenerio.0004.desc:0 "La nouvelle est parvenue jusqu'à Castral Roc : [valyria|E] a été anéantie dans un cataclysme d'une destruction inouïe. Presque la totalité de l'Empire des [dragonlord|E] a péri avec leurs [dragons_plural|E], laissant les anciennes terres mûres pour le pillage, pour peu qu'un dirigeant ambitieux sache saisir l'occasion. Peut-être toute la richesse et toute la magie n'ont-elles pas été détruites... La Maison Lannister pourrait bien asseoir à jamais sa place de maison la plus riche et la plus puissante à jamais honorer [westeros|E]..."
 cob_7899_scenerio.0004.a:0 "Ce n'est là qu'un rêve insensé, je ferais mieux de concentrer mon attention ici"
 cob_7899_scenerio.0004.a_tt:0 "Vous choisissez de ne pas risquer la mort et de demeurer à Castral Roc"
 cob_7899_scenerio.0004.b:0 "Une opportunité m'attend à [valyria|E], que je ne saurais ignorer"
 cob_7899_scenerio.0004.b_tt:0 "Vous choisissez de tout risquer pour vous rendre sur les ruines de [valyria|E]"

 cob_7899_scenerio.0005.t:0 "L'Héritier des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0005.desc:0 "Les [valyrian_freehold_short|E] sont tombées... Je n'ai reçu aucune réponse à mes correspondances depuis des lustres... Je ne peux que supposer que les rumeurs de ce que l'on appelle désormais un « [doom|E] » sont vraies.\n\nJ'ai rassemblé une troupe de soldats qohoriens dans l'intention de voler avec [vassarion.GetName] jusqu'à ce qu'il reste de [valyria|E]... J'espère restaurer l'ordre en ce monde une fois encore... Cependant, si les rumeurs sont exactes et que les [valyrian_freehold_short|E] ne sont plus que cendres, peut-être cette armée servirait-elle mieux à assujettir les [free_cities|E] sous mon autorité... Tout ce que je sais, c'est que je dois faire marcher cet ost vers le sud depuis [location.GetName] pour découvrir par moi-même ce qu'il est advenu de ma patrie..."
 cob_7899_scenerio.0005.a:0 "Je retournerai vers les [valyrian_freehold_short|E] et revendiquerai ce qu'il en reste"
 cob_7899_scenerio.0005.a_tt:0 "Voyager vers Ny Sar"
 cob_7899_scenerio.0005.b:0 "À la réflexion, n'allons pas à Valyria, c'est un endroit stupide..."
 cob_7899_scenerio.0005.b_tt:0 "Vous tracez votre propre voie"

 cob_7899_scenerio.0006.t:0 "L'Héritier du Roi du Conflans"
 cob_7899_scenerio.0006.desc:0 "Mon illustre ancêtre [lucifer.GetFirstName], légitime Roi du Conflans du Trident, se proclama dernier descendant vivant de [benedict.GetName]. Il fut assassiné par [arlan.GetName], afin que les Rois de l'Orage puissent conserver leur domination illégitime sur le Royaume du Trident.\n\nDepuis des siècles, la lignée de la Maison Justman s'est tenue dans l'ombre, fuyant la fureur des Rois de l'Orage, qui pourrait causer notre extinction. Je ne peux plus perpétuer cette tradition... Je dois me mettre en chemin et rassembler des alliés afin de faire valoir mes droits sur les terres de mes ancêtres\n\nIl me faut à présent décider où je me rendrai... Les terres fertiles du Bief ? La richesse des Terres de l'Ouest ? Ou les montagnes du Val ?"
 cob_7899_scenerio.0006.a:0 "Chercher de l'aide auprès du Bief"
 cob_7899_scenerio.0006.a_tt:0 "Voyager vers Hautjardin"
 cob_7899_scenerio.0006.b:0 "Chercher de l'aide auprès du Roc"
 cob_7899_scenerio.0006.b_tt:0 "Voyager vers Castral Roc"
 cob_7899_scenerio.0006.c:0 "Chercher de l'aide auprès du Val"
 cob_7899_scenerio.0006.c_tt:0 "Voyager vers les Eyrié"
 cob_7899_scenerio.0006.d:0 "Partir seul"

 #Tommen Events
 #  cob_7899_scenerio.0400.t:0 "Setting Sail from Lannisport"
 #  cob_7899_scenerio.0400.desc:0 "As I arrive in [GetTitleByKey('c_lannisport').GetName] I am immediately greeted by [lannisport.GetName] who quickly informs me that my ship has been prepared and is ready to sail. I feel a great wave of energy flow through me at the thought of getting my journey underway, I was restless in the palace waiting for this moment knowing that every hour that passed was another hour that someone else could arrive and lay claim to the remains of the [valyrian_freehold_short|E] before me.\n\nNow was the time to push out into the sea and begin the long journey to [essos|E] so that we can discover what remains of [valyria|E] after the [doom|E]. The fleet would depart for [valyria|E] as soon as he was on board his flagship, making it's first stop at [GetTitleByKey('c_oldtown').GetName] to purchase supplies to continue the journey, this quest would prove to be expensive, but, at the end the riches of the [valyrian_freehold_short|E] would more than make up for the cost."

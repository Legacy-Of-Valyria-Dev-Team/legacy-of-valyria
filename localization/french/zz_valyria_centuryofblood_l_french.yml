 #Swords/armor

 vs_stormbringer_name:0 "Vāedroma"
 vs_stormbringer_description:0 "l'épée d'acier valyrien de la Maison Varezys, est une relique de feu et d'ombre, une lame forgée dans les creusets des Quatorze Flammes. La lame a vu les étendues les plus lointaines de l'Empire Valyrien."
 vs_skullbasher_name:0 "Rīnakharys"
 vs_skullbasher_description:0 "La Masse d'Acier Valyrien de la Maison Belaerys"
 vs_inferno_name:0 "Vāedarion"
 vs_inferno_description:0 "Le Marteau d'Acier Valyrien de la Maison Urnebar"
 vs_eclipse_name:0 "Embāelī"
 vs_eclipse_description:0 "L'Épée d'Acier Valyrien de la Maison Mataeryon, forgée dans les siècles crépusculaires des Possessions de Valyria, mais portant des éléments bien plus anciens encore, l'épée connue communément sous le nom d'Éclipse est à la fois artefact et énigme — une union de la puissance valyrienne et du mystère pré-valyrien. Elle est taillée dans une seule pierre sombre, veinée de particules pourpres qui scintillent faiblement sous le clair de lune, et froide comme la tombe. Selon les Mataeryon, elle n'a pas été façonnée par l'homme, mais découverte — exhumée — des ruines noircies de N'ghai. Apparemment, en saisissant la poignée, le porteur peut entendre les sombres murmures de l'inconnu."
 vs_ashbringer_name:0 "Vūjōsān"
 vs_ashbringer_description:0 "L'Épée d'Acier Valyrien de la Maison Sonaryen"

 aurion_valyrian_steel_armor_name:0 "Hrōmagon"
 aurion_valyrian_steel_armor_description:0 "Une armure d'acier valyrien décorée, revendiquée par Aurion Varezys lors de son légendaire retour aux ossements fumants de Valyria. Aucun artisan vivant ne peut nommer son créateur, et les érudits ne s'accordent pas pour savoir si elle fut forgée dans les derniers jours des Possessions ou par une main plus ancienne, perdue depuis longtemps dans les cendres et le mythe. Sa valeur ne peut être mesurée en pièces ou en couronne. Des royaumes ne pourraient égaler sa valeur. C'est assurément la plus belle armure du monde connu"


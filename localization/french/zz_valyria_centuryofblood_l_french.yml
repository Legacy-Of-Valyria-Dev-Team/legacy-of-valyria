#  cob_7899_scenerio.0400.desc:0 "En arrivant à [GetTitleByKey('c_lannisport').GetName], je suis immédiatement accueilli par [lannisport.GetName] qui m'informe rapidement que mon navire a été préparé et est prêt à prendre la mer. Je ressens une grande vague d'énergie me traverser à l'idée de commencer mon voyage, j'étais agité dans le palais attendant ce moment sachant que chaque heure qui passait était une heure de plus où quelqu'un d'autre pourrait arriver et revendiquer les vestiges des [valyrian_freehold_short|E] avant moi.\n\nLe moment était venu de prendre la mer et de commencer le long voyage vers [essos|E] pour que nous puissions découvrir ce qui reste de Valyria après le [doom|E]. La flotte partirait pour Valyria dès qu'il serait à bord de son navire amiral, faisant sa première escale à [GetTitleByKey('c_oldtown').GetName] pour acheter des provisions pour continuer le voyage, cette quête s'avérerait coûteuse, mais, à la fin, les richesses des [valyrian_freehold_short|E] compenseraient largement le coût."

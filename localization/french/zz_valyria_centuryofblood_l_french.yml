 #Contenu Narratif

 game_concept_story_content_aurion_varezys_99:0 "$game_concept_story_generic_prefix$ $bookmark_99_aurion_varezys$"
 game_concept_story_content_aurion_varezys_99_desc:0 "#tooltip_heading Style du récit : Étendu#!\n\nEn incarnant Aurion Varezys, vous aurez le choix entre recoloniser Valyria pour restaurer l'ancien ordre ou revendiquer Volantis ainsi que les autres États satellites de l'ancienne [freehold|E] afin de former une nouvelle [freehold|E]."


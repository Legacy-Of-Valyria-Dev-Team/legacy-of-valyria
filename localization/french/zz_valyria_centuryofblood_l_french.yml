 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je déambule dans les couloirs du palais en ruines de [location.GetName] qui fut jadis la demeure de [Nymeria.GetName] des Rhoynars, et je me surprends à me remémorer les récits que ma mère me contait enfant. Des récits sur les [dragonlords|E] d'antan et leurs conquêtes à travers [essos|E], s'emparant de ce qui leur revenait de droit divin et par le feu du dragon. Ceux qui ployaient le genou étaient épargnés, et ceux qui résistaient étaient effacés du monde ou chassés en exil, leurs anciens royaumes laissés à pourrir comme celui-ci.\n\nTandis que ces récits affluent dans mon esprit, je ne puis m'empêcher de me demander si le [valyrian_freehold_short|E] était devenu faible avec le temps. Je me demande si ces conquérants, ces héros des récits, regarderaient mes semblables et éprouveraient de la honte pour ce que nous sommes devenus. [valyria|E] fut jadis le pinacle du monde, mais à la fin, il semblait que nous n'étions plus que des enfants querelleurs nous disputant pouvoir et richesses... peut-être est-ce pourquoi [ROOT.Char.GetFaith.HighGodName] choisit d'infliger le [doom|E] à notre peuple... peut-être ai-je été choisi pour maintenir le rêve de [valyria|E] en vie."
 cob_7899_scenerio.0500.a:0 "Nous poursuivons vers Portenfer"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers Portenfer"

 cob_7899_scenerio.0501.t:0 "La Décision à Portenfer"
 cob_7899_scenerio.0501.desc:0 "Alors que je me tiens contemplant les eaux de la Rhoyne, les ruines de [location.GetName], une autre des conquêtes du [valyrian_freehold_short|E], derrière moi, je réalise qu'en cet instant, j'ai un choix. Je puis poursuivre la quête que j'imaginais au début de ce périple et mener mon ost sur les vestiges possiblement calcinés et emplis de magma de [valyria|E] pour restaurer la puissance du [valyrian_freehold_short|E] à mon image... ou... je puis incarner l'esprit des premiers [dragonlords|E] de [valyria|E], rassembler les Lords Dragons survivants d'[essos|E] et reconquérir les colonies du [valyrian_freehold_short|E] par droit de conquête et feu de dragon.\n\nAlors que je me tiens à la frontière de [GetTitleByKey('k_volantis').GetName], je dois décider : fais-je le voyage vers les terres calcinées de [GetTitleByKey('e_valyria').GetName], ou forge-je de l'avant pour créer une Nouvelle [valyria|E] à la manière de mes ancêtres ?\n\n#bold ATTENTION — l'une ou l'autre voie s'annonce difficile ; il est recommandé de sauvegarder souvent pour éviter un game over#!"
 cob_7899_scenerio.0005.b:0 "Je conquerrai les [free_cities|E] pour former une Nouvelle [valyria|E]"
 cob_7899_scenerio.0501.a:0 "Nous devons nous ravitailler à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager vers Volantis"

 ##Aurion Valyria Expedition

 cob_7899_scenerio.0502.t:0 "Ravitaillement au Pont Long"
 cob_7899_scenerio.0502.desc:0 "La première chose que je remarquai à propos de [location.GetName] fut le vacarme incessant et sans fin qui semblait englober chaque recoin de la cité. Je ne saurais l'affirmer avec certitude, mais il semblait presque que la cité était dix fois plus bruyante que la capitale valyrienne tout en étant moins de la moitié de sa taille. La seule chose pire que le bruit était l'odeur : des gens crasseux, des latrines sur-utilisées et sous-entretenues, du poisson et une foule d'autres choses se mêlant pour former le plus impie des effluves le long du pont long où mon camp se procurait des provisions.\n\nFort heureusement, il ne se passerait guère de temps avant que nous ne reprenions la marche vers [valyria|E] pour reconquérir notre foyer. En traversant les rues, j'avais remarqué un assortiment croissant de gens qui célébraient la chute de ma patrie, déclarant que le monde était enfin libéré de l'étreinte étouffante du [valyrian_freehold_short|E]. Je ne m'engageai point avec eux, reconnaissant d'avoir gardé [vassarion.GetName] hors de la cité pour éviter toute confrontation superflue lors de mon voyage.\n\nAucune de leurs pensées n'importait véritablement, car ils verraient la vérité : que moi, [aurion.GetName], retournerais en [valyria|E] et la ramènerais au sommet qu'elle avait jadis atteint. Pour l'heure, je pouvais prendre un moment de repos avant de poursuivre vers ce qui reste de mon foyer..."
 cob_7899_scenerio.0502.a:0 "Il est temps d'avancer vers la Petite [valyria|E]"
 cob_7899_scenerio.0502.a_tt:0 "Voyager vers la Petite [valyria|E]"

 cob_7899_scenerio.0503.t:0 "Arrivée aux confins du [valyrian_freehold_short|E]"
 cob_7899_scenerio.0503.desc:0 "Je me tiens ici aux confins de Volantis, à l'extérieur de [location.GetName], et je ne puis véritablement croire mes yeux tandis que je contemple les terres à quelques lieues seulement. Un nuage noir comme la nuit déchirait les cieux bleus au-dessus, engendrant une pluie qui brûlait la peau au toucher. Les terres devant semblaient nimbées d'une brume qui embuait ma vision, m'empêchant de discerner ce qui pourrait se trouver devant moi et ma caravane, créant un sentiment d'effroi que je sentais se répandre dans les rangs. Je me tournai vers Vassarion et remontai en selle avant de faire pivoter la bête vers mon ost.\n\n« Ce fut un long voyage et la voie qui s'ouvre devant nous semble funeste, mes amis. Cependant, nous avons tous été choisis pour un dessein divin : reconquérir ce qui semble perdu, chasser les ténèbres et ramener la lumière en ce monde. [ROOT.Char.GetFaith.HighGodName] ne nous aurait point permis de venir si loin pour nous refuser maintenant ce triomphe. Nous irons donc de l'avant et reprendrons ce qui nous revient de droit pour rebâtir le rêve de [valyria|E] pour tous ceux qui foulent ce monde ! »\n\nL'acclamation qui s'éleva des troupes fut toute la confirmation dont j'avais besoin pour savoir qu'ils étaient prêts à affronter ce qui pourrait advenir..."
 cob_7899_scenerio.0503.a:0 "Il est temps de reconquérir notre foyer"
 cob_7899_scenerio.0503.a_tt:0 "Voyager en [valyria|E]"

 ##Aurion New Valyria Conquest

 cob_7899_scenerio.0510.t:0 "Archonte Aurion Ier de la Nouvelle [valyria|E]"
 cob_7899_scenerio.0510.desc:0 "Alors que je pénètre dans les salles dorées de l'Ancienne Volantis, je me trouve empli d'une détermination vertueuse. Ce sont les salles que [ROOT.Char.GetFaith.HighGodName] de [valyria|E] me destinait à occuper ; les fondateurs de la colonie de l'Ancienne Volantis n'auraient jamais pu imaginer que la cité qu'ils bâtiraient était destinée par droit divin à accueillir le premier Archonte d'une Nouvelle [valyria|E].\n\nCependant, je ne puis me reposer tant que toutes les filles de l'ancien [the_freehold|E] ne seront sous ma bannière. Je dois rassembler les [dragonlords|E] survivants d'[essos|E] et les convoquer à ma cour. De là, nous partirons reprendre ce qui nous revient de droit divin et de puissance."
 cob_7899_scenerio.0510.a:0 "Je partirai unir les filles de [valyria|E]"

 cob_7899_scenerio.0511.t:0 "Tout ce qui fut... sera à nouveau"
 cob_7899_scenerio.0511.desc:0 "De chaque recoin d'[essos|E], les autres [dragonlords|E] choisis par [ROOT.Char.GetFaith.HighGodName] pour survivre au [doom|E] se tiennent dans ma salle d'audience. Devant moi se trouvaient [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal], emplis du désir vertueux de me rejoindre pour restaurer l'ordre en ce monde à la manière de nos ancêtres jadis.\n\nTout ce qu'il reste maintenant est de lancer une campagne de conquête à travers les anciennes colonies du [valyrian_freehold_short|E] afin de les unir à nouveau sous la puissance du [dragon|E] par la furie indomptée du feu de dragon... nous marcherons hors de Volantis, mais je dois maintenant décider laquelle des [free_cities|E] sera conquise en premier au nom des [dragonlords|E] de la Nouvelle [valyria|E]... dois-je frapper Myr pour ouvrir la voie vers Pentos ? Ou dois-je frapper Lys puis Tyrosh et prendre le contrôle des régions méridionales ?"
 cob_7899_scenerio.0511.a:0 "La Maison Urnebar régnera sur Tyrosh"
 cob_7899_scenerio.0511.b:0 "La Maison Sonaryen régnera sur Lys"
 cob_7899_scenerio.0511.c:0 "La Maison Mataeryon régnera sur Myr"
 cob_7899_scenerio.0511.d:0 "La Maison Belaerys régnera sur Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des [free_cities|E]"
 cob_7899_scenerio.0512.desc:0 "Je déambule parmi le champ de bataille en flammes et ensanglanté, les cris des blessés se mêlant aux acclamations victorieuses de mes soldats formant une sorte de symphonie impie à mes oreilles. Mes soldats se tiennent victorieux derrière moi tandis que j'accepte la capitulation de l'Archonte, leurs acclamations assourdissant le reste du monde alors que je décrète que cette [free_city|E] est désormais sous la juridiction directe du Nouveau [valyrian_freehold|E] et qu'un nouveau [dragonlord|E] régnera par droit divin.\n\nÀ présent, je dois choisir la prochaine cité qui se soumettra à la puissance de la Nouvelle [valyria|E]..."

 cob_7899_scenerio.0516.t:0 "Un Rameau d'Olivier pour un Ancien Avant-Poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, avec les [dragonlords|E] survivants de [valyria|E] régnant sous mon autorité. Cependant, alors que je contemple la carte de mon empire grandissant, une petite chaîne d'îles de l'autre côté du [narrow_sea|El], à l'embouchure de la Baie de la Néra, continue de capter mon attention. Je pose mon doigt sur la carte près de la plus grande de ces îles... Peyredragon, un ancien avant-poste aux confins du [valyrian_freehold|E], maintenant indépendant de l'Empire de la Nouvelle Valyria.\n\nAlors que j'envisageais une déclaration de conquête pure et simple pour reprendre ce qui appartenait jadis à [valyria|E], à la même façon que j'avais conquis les [free_cities|E], j'eus une révélation. Les Targaryen ont survécu au [doom|E] de la même manière que les [dragonlords|E] régnant sur mon nouvel empire : par intervention divine. Il s'ensuit donc que je dois envoyer un message à quiconque règne sur ce rocher désolé avec une offre d'être accueillis à nouveau dans le giron..."
 cob_7899_scenerio.0516.a:0 "Envoyer un corbeau avec une offre de prêter allégeance à la Nouvelle [valyria|E]"

 cob_7899_scenerio.0517.t:0 "Un Corbeau du [valyrian_freehold_short|E] ?"
 cob_7899_scenerio.0517.desc:0 "Je me trouve réveillé au milieu de la nuit par de violents coups frappés à la porte de ma chambre. Je parviens à m'extraire du confort chaleureux de mon lit et à enfiler une robe pour découvrir qui oserait me déranger à cette heure tardive. En ouvrant la porte, je trouve le mestre debout dans le couloir, un message de corbeau tremblant dans sa main. Je prends la lettre en silence, déroulant le parchemin afin d'en lire le contenu...\n\nPlusieurs heures plus tard, le Lord de Lamarck se tenait avec moi dans la salle du trône de Peyredragon, le même air de stupeur sur le visage que j'avais eu quelques heures plus tôt. [aurion.GetName] avait pris son dragon et conquis les anciennes colonies du [valyrian_freehold_short|E] pour se proclamer Archonte de la Nouvelle [valyria|E], et demandait que Peyredragon déclare allégeance à ce nouvel ordre... il m'appartient maintenant de décider du destin de mon royaume..."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne ploiera point devant un nouveau Lord Dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons cette offre de rejoindre une Nouvelle [valyria|E]"

 cob_7899_scenerio.0518.t:0 "Un Rameau d'Olivier Rejeté et Brisé"
 cob_7899_scenerio.0518.desc:0 "« Maudits couards ! »\n\nJe froissai la réponse reçue de Peyredragon et la jetai dans l'âtre flamboyant, empli de rage. Comment osent-ils se croire si supérieurs qu'ils peuvent refuser de faire partie de mon nouvel empire ? Croient-ils véritablement qu'ils peuvent se dresser seuls en ce monde et résister à la puissance de la Nouvelle [valyria|E] ? Cet avant-poste appartenait à l'ancien [the_freehold|E] et devrait de droit revenir à l'Empire de la Nouvelle [valyria|E], que les couards Targaryen l'habitent ou non.\n\nJe dois maintenant décider quelle ligne de conduite j'adopterai..."
 cob_7899_scenerio.0518.a:0 "Nous ramènerons Peyredragon dans le giron de [valyria|E] par la force !"
 cob_7899_scenerio.0518.b:0 "Qu'ils restent sur leur rocher à trembler"

 # cob_7899_scenerio.0519.t:0 "An Embarassing Defeat..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "We have been beaten defeated"

 cob_7899_scenerio.0520.t:0 "Peyredragon Revient à [valyria|E]"
 cob_7899_scenerio.0520.desc:0 "C'est un jour glorieux pour mon nouvel Empire : la nouvelle est parvenue à ma cour que Peyredragon a déclaré son intention de prêter allégeance à l'Empire de la Nouvelle [valyria|E]. Avec cette nouvelle, les dernières anciennes colonies du [valyrian_freehold_short|E] ont été unies comme jamais auparavant avec un seul dessein : maintenir la puissance du [valyrian_freehold|E] vivante dans l'esprit de ceux qui se réjouiraient de nous voir périr. Nous devons désormais nous tenir unis contre ceux qui s'opposeraient à nous jusqu'au jour où [valyria|E] n'aura plus d'ennemis à craindre."
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueillie au sein de la Nouvelle [valyria|E]"

 ##Aurion Valyria Events

 cob_7899_scenerio.0521.t:0 "Attaque de Vouivre de Feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds. Tandis que la panique commence à se répandre dans le groupe, le sol devant nous s'ouvre et une massive vouivre de feu émerge pour se dresser en défi sur notre passage.\n\n« Mon [ROOT.Char.GetLadyLord] ! Que faisons-nous ? » crie l'un des courtisans, reculant lentement comme pour battre en retraite. Je jette un regard autour de moi sur l'armée qui a choisi de me suivre dans cette quête et dois maintenant décider exactement comment nous allons gérer cette situation..."
 cob_7899_scenerio.0521.a:0 "J'affronterai la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons battre en retraite !"
 cob_7899_scenerio.0521.c:0 "L'un de mes chevaliers peut s'en charger !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Une Embuscade de Survivants du [valyrian_freehold_short|E] !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre ost traverse [location.GetName], un cri de guerre déchire l'air matinal ténu, nous faisant frissonner jusqu'aux os. Même parmi les voyageurs les plus braves, ce son aurait fait courir les hommes les plus hardis se réfugier dans les jupes de leur mère.\n\n« Des cavaliers, mon [ROOT.Char.GetLadyLord] ! » La voix d'un éclaireur retentit à travers la tension, attirant mon attention tandis qu'il dégaine son épée, la pointant devant. Il n'y a encore rien à voir, mais le son de nombreux sabots, une douzaine de chevaux ou plus, s'amplifie, se rapprochant. La panique se répand parmi nous comme un feu de forêt, une autre voix rejoignant le chœur de la peur lorsqu'ils apparaissent. « Ils sont #bold si nombreux#!! »\n\nBien que leurs nombres ne soient pas vastes, les ennemis sont grands, intrépides, et apparemment prêts à perdre la vie pour nos biens. À leur tête chevauche un imposant [freeholder_looter.GetWomanMan] dans les vestiges en lambeaux de ce qui fut jadis de fines parures valyriennes, armé d'une épée à deux mains. Le chef de cette bande hurle son nom pour que tous l'entendent : [freeholder_looter.GetFirstNameNicknamed]. Le pillard proclame d'une voix confiante et puissante [freeholder_looter.GetHerHis] cruauté, ses raids audacieux comme celui-ci, et un tempérament de feu.\n\nTandis que les pillards se rapprochent, mon cheval se cabre et renâcle, menaçant de me désarçonner, mais je tiens fermement les rênes, me redressant droit. Levant mon [ROOT.Char.Custom('signature_weapon')] en l'air, je crie..."
 cob_7899_scenerio.0522.a:0 "Faites demi-tour ! Faites demi-tour sur-le-champ !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre escorte tentez de fuir les pillards du [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.a.toast:0 "Fuyez !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous vous êtes échappé sans encombre. Prends ça, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous vous êtes échappé, mais cela a causé un léger retard dans votre voyage."
 cob_7899_scenerio.0522.a.majordelay:0 "Vous vous êtes échappé, mais cela a causé un retard majeur dans votre voyage."
 cob_7899_scenerio.0522.a.minortheft:0 "Vous avez sauvé vos vies, mais pas tous vos biens."
 cob_7899_scenerio.0522.a.majortheft:0 "Vous avez sauvé vos vies, mais votre bourse est tombée de votre selle pendant la fuite."
 cob_7899_scenerio.0522.a.minorcombo:0 "Malgré la manœuvre, [freeholder_looter.GetFirstNameNoTooltip] a réussi à dérober certains de vos biens."
 cob_7899_scenerio.0522.a.majorcombo:0 "Malgré la manœuvre complexe, [freeholder_looter.GetFirstNameNoTooltip] a réussi à dérober la plupart de vos biens."
 cob_7899_scenerio.0522.a.scattered:0 "Votre escorte a été dispersée — chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Ressaisissez-vous et suivez-moi ! Chargez !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez les pillards du [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille."
 cob_7899_scenerio.0522.b.win:0 "Victoire"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez tué tous les pillards du groupe."
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef du groupe de pillards du [valyrian_freehold_short|E], [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "Le groupe de pillards du [valyrian_freehold_short|E] et leur chef [freeholder_looter.GetFirstName] se sont échappés après un combat d'une heure !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille."
 cob_7899_scenerio.0522.b.loss:0 "Défaite"
 cob_7899_scenerio.0522.b.robbed:0 "Vous avez été vaincus, rassemblés et dépouillés ; ils ont pris tout ce que vous aviez."
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous avez été vaincus, et les pillards ont enlevé [kidnapped_entourage.GetName]..."
 cob_7899_scenerio.0522.c:0 "Que diriez-vous d'un pot-de-vin..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]."
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] rejoint votre cour"
 cob_7899_scenerio.0522.c.else:0 "Mais peut-on faire confiance à un Possessionné disgracié ?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] s'est enfui avec l'argent"
 cob_7899_scenerio.0522.d:0 "Si nous abandonnons [sacrificed_entourage.GetFirstNameNoTooltip], cela pourrait nous faire gagner du temps."
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifierez [sacrificed_entourage.GetName] pour tenter de distraire les pillards."
 cob_7899_scenerio.0522.d.sacrifice:0 "PLACEHOLDER"

 cob_7899_scenerio.0523.t:0 "Rencontre avec un Soldat Valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de chacun dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et demande que l'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs lance un cri et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émerger de la brume, armés d'arbalètes et d'épées. L'un d'entre eux, vêtu des parements d'un officier subalterne, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiqué par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Dois-je essayer de le convaincre de rejoindre mon ost, ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Vous devriez vous joindre à nous !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de chacun dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et demande que l'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs lance un cri et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émerger de la brume, armés d'arbalètes et d'épées. L'un d'entre eux, vêtu des parements d'un officier subalterne, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiqué par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Dois-je essayer de le convaincre de rejoindre mon ost, ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0524.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0524.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b:0 "Vous devriez vous joindre à nous !"
 cob_7899_scenerio.0524.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0524.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0524.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0525.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0525.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de chacun dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et demande que l'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs lance un cri et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émerger de la brume, armés d'arbalètes et d'épées. L'un d'entre eux, vêtu des parements en lambeaux d'un Général valyrien, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiqué par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Envoyer [vassarion.GetName] combattre ? Ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0525.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0525.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b:0 "Tu affronteras [vassarion.GetName] !"
 cob_7899_scenerio.0525.b_1_tt:0 "[freeholder_survivor.GetName] meurt !"
 cob_7899_scenerio.0525.b_2_tt:0 "[vassarion.GetName] meurt !"
 cob_7899_scenerio.0525.b.win:0 "[vassarion.GetName] tue [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b.dead:0 "[freeholder_survivor.GetName] parvient à survivre contre [vassarion.GetName]"
 cob_7899_scenerio.0525.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0525.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0527.t:0 "Embuscade d'un Lord Dragon"
 cob_7899_scenerio.0527.desc:0 "Alors que je vole sur [vassarion.GetName] à l'avant-garde de mon ost au-dessus des ruines de [location.GetName], un cri perçant déchire l'air, suivi d'une massive boule de feu de dragon qui manque de peu d'incinérer tout autour de moi.\n\nJe me réoriente pour scruter les nuages au-dessus à la recherche du [dragon|E] sauvage qui aurait survécu au cataclysme pour m'attaquer. Il ne faut pas longtemps avant que l'agresseur ne se révèle car, à ma grande surprise, le [dragon|E] avait un cavalier qui fait maintenant planer sa bête tout aussi massive devant moi. Je décide de parlementer avec [freeholder_dragonlord.GetHerHim] avant une nouvelle attaque.\n\n« Je suis [aurion.GetName] et je suis revenu en ces terres pour les reconquérir au nom de [valyria|E]. » Je crie vers le [dragonlord|E].\n\n« Peu m'importe, [aurion.GetName]. Je suis [freeholder_dragonlord.GetName], cavalier de [enemy_dragon.GetName], et je revendique toutes ces terres sur lesquelles tu pénètres sans permission. »"
 cob_7899_scenerio.0527.a:0 "J'affronterai [freeholder_dragonlord.GetName] et son [dragon|E]"
 cob_7899_scenerio.0527.a_tt:0 "Un duel de [dragon|E] commence avec [freeholder_dragonlord.GetName]"
 cob_7899_scenerio.0527.b:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0527.b_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0529.t:0 "Un Retour Doux-Amer"
 cob_7899_scenerio.0529.desc:0 "Je descends du navire sur les quais de pierre en ruines de [location.GetName], mes yeux fixés sur les portes calcinées et dévastées de la cité capitale valyrienne.\n\n« Je suis chez moi, » pensé-je. « Je suis enfin chez moi... mais il reste encore tant à accomplir avant que le [valyrian_freehold_short|E] ne se relève. »\n\nJe mets un genou à terre et pose ma main sur la pierre chaude du quai un bref instant. Je relève la tête une fois de plus et m'avance pour restaurer les ruines de cette puissante cité..."
 cob_7899_scenerio.0529.a:0 "Je suis revenu chez moi en [valyria|E]..."

 cob_7899_scenerio.9998.t:0 "L'Expédition Perdue d'Aurion"
 cob_7899_scenerio.9998.desc:0 "En traversant les terres de Valyria, votre groupe tombe sur ce qui semble être un immense cimetière de squelettes figés dans diverses poses de terreur...\n\nAprès quelques explorations, vous déterminez qu'il doit s'agir du dernier repos de l'expédition d'Aurion Varezys en Valyria. Au centre du carnage, vous trouvez le squelette d'un grand dragon encerclant le squelette en armure de son cavalier, que vous croyez être Aurion. À première vue, il semble que le dragon tentait de protéger Aurion de... quelque chose. Un sentiment d'effroi vous traverse à la pensée de quelque chose de si horrifiant qu'un dragon de cette taille savait que la fin était proche.\n\nVous devez maintenant décider si vous profanerez ce lieu de sépulture pour récupérer l'épée et l'armure de la Maison Varezys, sachant que selon les anciennes traditions, un tel acte entraînera un châtiment..."
 cob_7899_scenerio.9998.a:0 "Prendre les artefacts et accepter le châtiment"
 cob_7899_scenerio.9998.b:0 "Ces artefacts devraient demeurer en ce cimetière"

 cob_7899_scenerio.9999.t:0 "Tentative de Défiance des Dieux"
 cob_7899_scenerio.9999.desc:0 "Vous vous retrouvez au milieu d'un rêve ; une peur profonde vous envahit tandis qu'une voix tonne depuis les ténèbres :\n\n« Tu as tenté de défier la volonté des Dieux. L'artefact que tu as tenté d'invoquer a été perdu dans les profondeurs de la magie et ne pourra être récupéré jusqu'à ce que les Dieux le jugent opportun. »\n\nQuelques instants plus tard, vous parvenez à vous réveiller, confus par ce qui vient de se produire...\n\nNOTE DEV - cet artefact est actuellement bloqué et ne peut être généré via debug car il existe une chaîne d'événements cachée dans le monde pour le récupérer"
 cob_7899_scenerio.9999.a:0 "Je devrais vraiment arrêter de boire..."
 cob_7899_scenerio.9999.b:0 "JE FAIS CE QUE JE VEUX (n'appuyez pas, mais vous le ferez quand même)"


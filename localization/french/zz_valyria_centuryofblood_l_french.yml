 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je traverse les couloirs du palais en ruine de [location.GetName], autrefois demeure de [Nymeria.GetName] des Rhoynars, et je me remémore les histoires que ma mère me contait enfant. Des récits sur les [dragonlords|E] d’autrefois et leurs conquêtes à travers [essos|E], s’emparant de ce qui leur revenait de droit divin, par le feu des dragons. Ceux qui se soumettaient étaient épargnés, ceux qui résistaient étaient balayés du monde ou poussés à l’exil, leurs anciens royaumes laissés à l’abandon comme celui-ci.\n\nAlors que ces récits envahissent mon esprit, je ne peux m’empêcher de me demander si les [the_freehold|E] se sont affaiblis avec le temps. Je me demande si ces conquérants, ces héros des légendes, verraient mes semblables aujourd’hui avec honte. Valyria fut autrefois le sommet du monde, mais à la fin, nous n’étions guère plus que des enfants querelleurs se disputant pouvoir et richesses… peut-être est-ce pour cela que [ROOT.Char.GetFaith.HighGodName] a décidé de [doom|E] notre peuple… peut-être ai-je été choisi pour raviver le rêve de Valyria."
 cob_7899_scenerio.0500.a:0 "Cap sur la Porte Lugubre"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers la Porte Lugubre"

 cob_7899_scenerio.0501.t:0 "La Décision à la Porte Lugubre"
 cob_7899_scenerio.0501.desc:0 "Alors que je contemple les eaux du Rhoyne, les ruines de [location.GetName] — autre conquête des [the_freehold|E] — derrière moi, je réalise qu’un choix se présente à moi. Je peux poursuivre la quête que j’ai imaginée au début de ce périple et mener mon armée jusqu’aux restes possiblement calcinés et couverts de magma de Valyria pour restaurer la puissance des [the_freehold|E] à mon image… ou bien… incarner l’esprit des premiers [dragonlords|E] de Valyria, rassembler les survivants des Sang-de-Dragon en [essos|E] et reconquérir les anciennes colonies des [the_freehold|E] par le feu des dragons.\n\nMe tenant à la frontière de [GetTitleByKey('k_volantis').GetName], je dois décider — dois-je poursuivre mon voyage vers les terres brûlées de [GetTitleByKey('e_valyria').GetName], ou bien dois-je aller de l’avant et fonder une Nouvelle Valyria dans la lignée de mes ancêtres ?\n\n#bold ATTENTION – chaque voie s’annonce ardue, il est recommandé de sauvegarder fréquemment pour éviter une fin de partie prématurée.#!"
 cob_7899_scenerio.0005.b:0 "Je conquérirai les cités libres pour fonder une Nouvelle Valyria"
 cob_7899_scenerio.0501.a:0 "Nous devons nous ravitailler à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager vers Volantis"

 ##Aurion Valyria Expedition

 cob_7899_scenerio.0502.t:0 "Ravitaillement au Pont Long"
 cob_7899_scenerio.0502.desc:0 "La première chose que j’ai remarquée en arrivant à [location.GetName], c’était le vacarme incessant et omniprésent qui semblait imprégner chaque recoin de la ville. Je ne saurais l’expliquer, mais il me semblait que cette cité faisait dix fois plus de bruit que la capitale valyrienne, tout en étant deux fois plus petite. Le seul élément pire que le bruit était l’odeur : une puanteur mêlant la saleté des habitants, des latrines surutilisées, du poisson, et bien d’autres choses encore, formant un parfum des plus profanes le long du Pont Long, là où mon camp s’approvisionnait.\n\nHeureusement, nous ne tarderions pas à reprendre la route vers Valyria pour y reconquérir notre foyer. En parcourant les rues, j’ai remarqué une foule grandissante qui célébrait la chute de ma patrie, clamant que le monde était enfin libéré de l’étreinte étouffante des [the_freehold|E]. Je n’ai pas répondu, heureux d’avoir laissé [vassarion.GetName] en dehors de la ville, évitant ainsi toute confrontation inutile durant ce périple.\n\nMais leurs pensées n’ont aucune importance. Ils verront la vérité : moi, [aurion.GetName], je retournerai à Valyria et la ramènerai à la grandeur qui fut jadis la sienne. Pour l’instant, je peux savourer un moment de répit avant de reprendre la route vers ce qu’il reste de ma maison..."
 cob_7899_scenerio.0502.a:0 "Il est temps d’avancer vers Petite Valyria"
 cob_7899_scenerio.0502.a_tt:0 "Voyager vers Petite Valyria"

 cob_7899_scenerio.0503.t:0 "Arrivée aux confins des Possessions"
 cob_7899_scenerio.0503.desc:0 "Je me tiens ici, aux abords de Volantis, à l’extérieur de [location.GetName], et je n’en crois pas mes yeux en contemplant les terres à quelques lieues devant moi. Un nuage noir comme la nuit a déchiré le ciel bleu, déversant une pluie brûlante au simple contact de la peau. Les terres devant nous semblaient nimbées d’une brume qui obscurcissait ma vision, me rendant incapable de discerner ce qui attendait ma caravane. Une angoisse glaçante se répandait parmi mes hommes. Je me suis tourné vers Vassarion et suis remonté en selle, avant de guider la bête face à mon ost.\n\n« Le voyage a été long et la voie devant nous semble sombre, mes amis. Mais nous avons été choisis pour une mission divine : reconquérir ce qui semble perdu, chasser les ténèbres et ramener la lumière en ce monde. [ROOT.Char.GetFaith.HighGodName] ne nous aurait pas permis d’arriver si loin pour nous abandonner maintenant. Nous allons donc avancer et reprendre ce qui nous revient de droit, afin de rebâtir le rêve de Valyria pour tous ceux qui foulent cette terre ! »\n\nLes acclamations de mes troupes furent la confirmation qu’il me fallait : ils étaient prêts à affronter ce qui nous attendait..."
 cob_7899_scenerio.0503.a:0 "Il est temps de reconquérir notre foyer"
 cob_7899_scenerio.0503.a_tt:0 "Voyager vers Valyria"

 ##Conquête de la Nouvelle Valyria par Aurion

 cob_7899_scenerio.0510.t:0 "L’Empereur Aurion Ier de la Nouvelle Valyria"
 cob_7899_scenerio.0510.desc:0 "Alors que je foule les salles dorées de l’ancienne Volantis, une détermination sacrée s’empare de moi. C’est en ces lieux que [ROOT.Char.GetFaith.HighGodName] de Valyria avait destiné que je me tienne. Les fondateurs de la colonie de Volantis ne pouvaient imaginer que la cité qu’ils érigeaient était, par droit divin, destinée à accueillir le premier Empereur d’une Nouvelle Valyria.\n\nCependant, je ne peux connaître le repos tant que toutes les filles des anciennes [the_freehold|E] ne sont pas rassemblées sous ma bannière. Je dois convoquer les [dragonlords|E] survivants d’[essos|E] à ma cour. C’est d’ici que nous lancerons notre entreprise : reprendre ce qui nous appartient de droit par la volonté divine et la force des armes."
 cob_7899_scenerio.0510.a:0 "Je vais partir unifier les filles de Valyria"

 cob_7899_scenerio.0511.t:0 "Tout ce qui fut... le sera de nouveau"
 cob_7899_scenerio.0511.desc:0 "Des quatre coins d’[essos|E], les autres [dragonlords|E] choisis par [ROOT.Char.GetFaith.HighGodName] pour survivre au [doom|E] se tiennent dans ma salle d’audience. Devant moi se tiennent [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal], animés par le désir juste de m’accompagner dans la restauration de l’ordre du monde, à l’image de nos glorieux ancêtres.\n\nTout ce qui reste à faire désormais est de lancer une campagne de conquête contre les anciennes colonies des [the_freehold|E], afin de les unir à nouveau sous le pouvoir du [dragon|E], par la furie indomptée du feu draconique... Nous partirons de Volantis, mais je dois désormais décider quelle Cité Libre sera conquise la première au nom des [dragonlords|E] de la Nouvelle Valyria... Frapperai-je Myr pour ouvrir la voie vers Pentos ? Ou bien attaquerai-je Lys puis Tyrosh pour prendre le contrôle du sud ?"
 cob_7899_scenerio.0511.a:0 "La maison Urnebar régnera sur Tyrosh"
 cob_7899_scenerio.0511.b:0 "La maison Sonaryen régnera sur Lys"
 cob_7899_scenerio.0511.c:0 "La maison Mataeryon régnera sur Myr"
 cob_7899_scenerio.0511.d:0 "La maison Belaerys régnera sur Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des cités libres"
 cob_7899_scenerio.0512.desc:0 "Je marche au milieu du champ de bataille ensanglanté et fumant, les cris des blessés mêlés aux acclamations de mes soldats formant une symphonie impie à mes oreilles. Derrière moi, mes troupes se tiennent victorieuses tandis que j'accepte la capitulation de l'Archonte, les vivats assourdissant le monde tandis que je proclame que cette [free_city|E] passe désormais sous la juridiction directe de la Nouvelle [valyrian_freehold|E] et qu’un nouveau [dragonlord|E] y régnera par droit divin.\n\nIl me faut maintenant choisir la prochaine cité qui devra se soumettre à la puissance de la Nouvelle Valyria..."

 cob_7899_scenerio.0516.t:0 "Une branche d'olivier tendue vers un ancien avant-poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, les [dragonlords|E] survivants de Valyria régnant sous mon autorité. Cependant, en contemplant la carte de mon empire grandissant, une petite chaîne d'îles au-delà du [narrow_sea|El], à l'embouchure de la baie de la Néra, attire sans cesse mon attention. Je pose mon doigt sur la plus grande de ces îles... Peyredragon, un ancien avant-poste situé à l'extrême bordure des [the_freehold|E], aujourd'hui indépendant de l'Empire de la Nouvelle Valyria.\n\nAlors que j'envisageais une déclaration de guerre pour le reprendre, une épiphanie me saisit : les Targaryen ont survécu au [doom|E], tout comme les [dragonlords|E] qui règnent à mes côtés. Il serait donc plus sage de leur envoyer une missive leur offrant la possibilité de revenir dans le giron valyrien..."
 cob_7899_scenerio.0516.a:0 "Envoyer un corbeau avec une offre d'allégeance à la Nouvelle Valyria"

 cob_7899_scenerio.0517.t:0 "Un corbeau depuis les Possessions ?"
 cob_7899_scenerio.0517.desc:0 "Je suis tiré de mon sommeil au beau milieu de la nuit par de violents coups frappés à la porte de mes appartements. Je parviens à sortir tant bien que mal de la chaleur réconfortante de mon lit et j'enfile une robe pour aller voir qui ose me déranger à une heure pareille. En ouvrant la porte, je découvre le mestre dans le couloir, un message attaché à la patte d’un corbeau tremblant entre ses mains. Je prends la lettre en silence, déroulant le parchemin pour lire son contenu...\n\nQuelques heures plus tard, le Seigneur de Lamarck se tenait à mes côtés dans la salle du trône de Peyredragon, affichant la même expression de stupeur que moi plus tôt dans la nuit. [aurion.GetName] avait enfourché son dragon, conquis les anciennes colonies des [the_freehold|E], et s'était proclamé Empereur de la Nouvelle Valyria. Il exigeait désormais que Peyredragon prête allégeance à ce nouvel ordre... il me revient à présent de décider du sort de mon royaume..."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne pliera pas devant un nouveau Lord Dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons cette offre et rejoindrons la Nouvelle Valyria"

 cob_7899_scenerio.0518.t:0 "Une branche d'olivier rejetée et brisée"
 cob_7899_scenerio.0518.desc:0 "'Misérables lâches !'\n\nJe froissai la réponse de Peyredragon et la jetai dans les flammes du foyer, fou de rage. Comment osaient-ils se croire supérieurs et refuser d'intégrer mon nouvel empire ? Pensent-ils vraiment pouvoir survivre seuls face à la puissance de la Nouvelle Valyria ? Cet avant-poste appartenait autrefois aux [the_freehold|E] et doit revenir, par droit, à l'Empire de la Nouvelle Valyria, qu'importe que des Targaryen couards y habitent.\n\nIl me faut maintenant décider de la suite..."
 cob_7899_scenerio.0518.a:0 "Nous reprendrons Peyredragon par la force !"
 cob_7899_scenerio.0518.b:0 "Laissons-les croupir sur leur rocaille"

 # cob_7899_scenerio.0519.t:0 "Une Défaite Humiliante..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "Nous avons été vaincus"

 cob_7899_scenerio.0520.t:0 "Peyredragon revient en Valyria"
 cob_7899_scenerio.0520.desc:0 "C’est un jour glorieux pour mon nouvel Empire : la nouvelle est parvenue à ma cour que Peyredragon a déclaré son intention de prêter allégeance à l’Empire de la Nouvelle Valyria. Par cette annonce, les dernières anciennes colonies des [the_freehold|E] sont désormais unies comme jamais auparavant, animées d’un seul but : maintenir la puissance des [valyrian_freehold|E] vivante dans l’esprit de ceux qui se réjouiraient de notre chute. Désormais, nous devons rester unis contre ceux qui s’opposeraient à nous, jusqu’au jour où Valyria n’aura plus aucun ennemi à craindre."
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueilli au sein de la Nouvelle Valyria"

 ##Événements de Valyria - Aurion

 cob_7899_scenerio.0521.t:0 "Attaque de Vouivre de Feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds. Tandis que la panique commence à se répandre parmi la troupe, la terre s'ouvre devant nous et une immense vouivre de feu en émerge pour nous défier.\n\n\"Mon [ROOT.Char.GetLadyLord] ! Que devons-nous faire ?\" s’écrie l’un des courtisans en reculant lentement comme pour fuir. Je jette un regard autour de moi vers l'armée qui a choisi de me suivre dans cette quête et je dois maintenant décider comment affronter cette situation..."
 cob_7899_scenerio.0521.a:0 "Je vais affronter la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons battre en retraite !"
 cob_7899_scenerio.0521.c:0 "Un de mes chevaliers peut s'en charger !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Embuscade d’un survivant des Possessions !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre troupe traverse [location.GetName], un cri de guerre fend l'air du matin, glaçant nos sangs. Même les plus braves auraient couru se réfugier derrière les jupes de leur mère.\n\n\"Des cavaliers, mon [ROOT.Char.GetLadyLord] !\" hurle un éclaireur, dégainant son épée et pointant droit devant lui. On ne voit encore rien, mais le bruit sourd de sabots, une dizaine de chevaux ou plus, s'amplifie. La panique s'empare de nous comme une traînée de poudre, tandis qu'une voix alarmée crie : \"Ils sont #bold si nombreux# !!\"\n\nBien que leurs rangs ne soient pas immenses, nos ennemis sont massifs, intrépides et prêts à mourir pour nos biens. À leur tête chevauche un gigantesque [freeholder_looter.GetWomanMan] vêtu de guenilles issues d’anciens habits valyriens, maniant une énorme épée à deux mains. Leur chef hurle son nom pour que tous l’entendent, [freeholder_looter.GetFirstNameNicknamed], se vantant de ses raids audacieux et de sa cruauté.\n\nAlors que les pillards s’approchent, mon cheval s’ébroue et rue, menaçant de me désarçonner. Je tiens fermement les rênes, redressant le buste, et brandis mon [ROOT.Char.Custom('signature_weapon')], criant..."
 cob_7899_scenerio.0522.a:0 "Faites demi-tour ! Maintenant !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre escorte tentez de fuir les pillards des [the_freehold|E]."
 cob_7899_scenerio.0522.a.toast:0 "Fuyez !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous vous êtes échappés sans encombre. Bien joué, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous avez fui, mais cela a causé un léger retard."
 cob_7899_scenerio.0522.a.majordelay:0 "Vous avez fui, mais cela a causé un retard important."
 cob_7899_scenerio.0522.a.minortheft:0 "Vous êtes partis avec vos vies, mais sans toutes vos possessions."
 cob_7899_scenerio.0522.a.majortheft:0 "Votre bourse est tombée de votre selle durant votre fuite."
 cob_7899_scenerio.0522.a.minorcombo:0 "[freeholder_looter.GetFirstNameNoTooltip] a réussi à voler certaines de vos affaires."
 cob_7899_scenerio.0522.a.majorcombo:0 "[freeholder_looter.GetFirstNameNoTooltip] a réussi à voler la majeure partie de vos biens."
 cob_7899_scenerio.0522.a.scattered:0 "Votre escorte s'est dispersée — chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Ne faiblissez pas, à l'assaut derrière moi !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez contre les pillards des [the_freehold|E]."
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille."
 cob_7899_scenerio.0522.b.win:0 "Victoire"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez tué tous les pillards."
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef des pillards, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "Les pillards des [the_freehold|E] et leur chef [freeholder_looter.GetFirstName] se sont échappés après un long combat !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille."
 cob_7899_scenerio.0522.b.loss:0 "Défaite"
 cob_7899_scenerio.0522.b.robbed:0 "Vous êtes battus, rassemblés et dépouillés."
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous êtes battus et [kidnapped_entourage.GetName] est capturé."
 cob_7899_scenerio.0522.c:0 "Et si nous proposions un pot-de-vin..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]."
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] rejoint votre cour"
 cob_7899_scenerio.0522.c.else:0 "Peut-on vraiment faire confiance à un survivant déchu des Possessions ?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] s'est enfui avec votre argent"
 cob_7899_scenerio.0522.d:0 "Si nous abandonnons [sacrificed_entourage.GetFirstNameNoTooltip], cela pourrait nous faire gagner du temps."
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifiez [sacrificed_entourage.GetName] pour distraire les pillards."

 cob_7899_scenerio.0523.t:0 "Rencontre avec un soldat valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous traversons les terres dévastées de [location.GetName], l’air saturé de fumée volcanique et de cendres, obscurcissant la vue et étouffant chaque souffle de mon escorte. Je décide que nous devons prendre un moment pour nous orienter et demande que l'on m'amène [vassarion.GetName] pour survoler les nuages. Alors que j’attends, l’un de mes éclaireurs crie et je me retourne pour voir un groupe de soldats valyriens sortir de la brume, armés d’arbalètes et d’épées. L’un d’eux, vêtu des habits d'un officier subalterne, s’avance pour me faire face.\n\n\"Je suis [freeholder_survivor.GetName] et j'ai encerclé votre troupe. [location.GetName] nous appartient désormais, rendez-vous !\"\n\nJe dois maintenant décider de ce que je vais faire. Dois-je affronter [freeholder_survivor.GetName] en duel ? Tenter de le convaincre de rejoindre ma cause ? Ou battre en retraite ?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Rejoins-nous !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre escorte"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre avec un centurion valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous traversons les terres dévastées de [location.GetName], l’air saturé de fumée volcanique et de cendres, obscurcissant la vue et étouffant chaque souffle de mon escorte. Je décide que nous devons prendre un moment pour nous orienter et demande que l'on m'amène [vassarion.GetName] pour survoler les nuages. Alors que j’attends, l’un de mes éclaireurs crie et je me retourne pour voir un groupe de soldats valyriens sortir de la brume, armés d’arbalètes et d’épées. L’un d’eux, vêtu des habits d'un officier subalterne, s’avance pour me faire face.\n\n\"Je suis [freeholder_survivor.GetName] et j'ai encerclé votre troupe. [location.GetName] nous appartient désormais, rendez-vous !\"\n\nJe dois maintenant décider de ce que je vais faire. Dois-je affronter [freeholder_survivor.GetName] en duel ? Tenter de le convaincre de rejoindre ma cause ? Ou battre en retraite ?"
 cob_7899_scenerio.0524.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"

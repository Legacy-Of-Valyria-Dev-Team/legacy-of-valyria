 #Swords/armor

 vs_stormbringer_name:0 "Vāedroma"
 vs_stormbringer_description:0 "L'épée en acier valyrien de la Maison Varezys est une relique de feu et d'ombre, une lame forgée dans les creusets des Quatorze Flammes. Cette lame a vu les confins les plus lointains de l'Empire Valyrien."
 vs_skullbasher_name:0 "Rīnakharys"
 vs_skullbasher_description:0 "La masse en acier valyrien de la Maison Belaerys"
 vs_inferno_name:0 "Vāedarion"
 vs_inferno_description:0 "Le marteau en acier valyrien de la Maison Urnebar"
 vs_eclipse_name:0 "Embāelī"
 vs_eclipse_description:0 "L'épée en acier valyrien de la Maison Mataeryon, forgée dans les siècles crépusculaires des Possessions Valyriennes, tout en portant des éléments bien plus anciens encore. L'épée connue communément sous le nom d'Éclipse est à la fois artefact et énigme : une union de la puissance valyrienne et du mystère pré-valyrien. Elle est taillée dans une unique pierre sombre, veinée de mouchetures pourpres qui scintillent faiblement sous le clair de lune, et froide comme la tombe. Selon les Mataeryon, elle ne fut pas façonnée par l'homme, mais découverte — exhumée — des ruines noircies de N'ghai. Supposément, quand on saisit la poignée, le porteur peut entendre les sombres murmures de l'inconnu."
 vs_ashbringer_name:0 "Vūjōsān"
 vs_ashbringer_description:0 "L'épée en acier valyrien de la Maison Sonaryen"

 aurion_valyrian_steel_armor_name:0 "Hrōmagon"
 aurion_valyrian_steel_armor_description:0 "Une armure d'acier valyrien ornementée, réclamée par Aurion Varezys lors de son légendaire retour aux ossements fumants de [valyria|E]. Aucun artisan vivant ne peut nommer son créateur, et les érudits ne s'accordent pas sur le fait qu'elle fut forgée dans les derniers jours des Possessions ou par quelque main plus ancienne, depuis longtemps perdue dans les cendres et le mythe. Sa valeur ne peut se mesurer en pièces ou en couronnes. Des royaumes ne pourraient égaler sa valeur. C'est assurément la plus belle armure du [known_world|E]."

 #Story Content

 game_concept_story_content_aurion_varezys_99:0 "$game_concept_story_generic_prefix$ $bookmark_99_aurion_varezys$"
 game_concept_story_content_aurion_varezys_99_desc:0 "#tooltip_heading Style d'Histoire : Approfondi#!\n\nEn tant qu'Aurion Varezys, vous aurez le choix de recoloniser [valyria|E] et restaurer l'ancien ordre, ou de revendiquer Volantis et les autres états satellites de l'[old_valyria|E] pour former de nouvelles [the_freehold|E]."


 #Swords/armor

 vs_stormbringer_name:0 "Vāedroma"
 vs_stormbringer_description:0 "l'épée en Acier Valyrien de la Maison Varezys, est une relique de feu et d'ombre, une lame forgée dans les creusets des Quatorze Flammes. Cette lame a contemplé les confins les plus reculés de l'Empire Valyrien."
 vs_skullbasher_name:0 "Rīnakharys"
 vs_skullbasher_description:0 "la masse en Acier Valyrien de la Maison Belaerys"
 vs_inferno_name:0 "Vāedarion"
 vs_inferno_description:0 "le marteau en Acier Valyrien de la Maison Urnebar"
 vs_eclipse_name:0 "Embāelī"
 vs_eclipse_description:0 "l'épée en Acier Valyrien de la Maison Mataeryon, forgée dans les siècles crépusculaires des Possessions Valyriennes, mais comportant des parties bien plus anciennes encore. La lame connue dans le langage commun sous le nom d'Éclipse est à la fois artefact et énigme — une union de la puissance valyrienne et du mystère pré-valyrien. Elle est taillée dans une unique pierre sombre, veinée de mouchetures pourpres qui scintillent faiblement sous la lumière de la lune, et aussi froide que la tombe. Selon les Mataeryon, elle ne fut point façonnée par l'homme, mais découverte — exhumée — des ruines noircies de N'ghai. Il paraît que lorsqu'on saisit la garde, le porteur peut entendre les sombres murmures de l'inconnu."
 vs_ashbringer_name:0 "Vūjōsān"
 vs_ashbringer_description:0 "l'épée en Acier Valyrien de la Maison Sonaryen"

 aurion_valyrian_steel_armor_name:0 "Hrōmagon"
 aurion_valyrian_steel_armor_description:0 "une armure en Acier Valyrien richement ornée, revendiquée par Aurion Varezys lors de son légendaire retour sur les ossements fumants de [valyria|E]. Nul artisan vivant ne peut nommer son créateur, et les érudits ne s'accordent point sur sa forge — dans les derniers jours des Possessions ou par quelque main plus ancienne, depuis longtemps réduite en cendres et en légende. Sa valeur ne saurait se mesurer en pièces ou en couronnes. Des royaumes ne pourraient égaler sa valeur. C'est assurément la plus fine armure du [known_world|E]."

 #Story Content

 game_concept_story_content_aurion_varezys_99:0 "$game_concept_story_generic_prefix$ $bookmark_99_aurion_varezys$"
 game_concept_story_content_aurion_varezys_99_desc:0 "#tooltip_heading Style de Récit : Étendu#!\n\nEn tant qu'Aurion Varezys, vous aurez le choix de recoloniser [valyria|E] et restaurer l'ancien ordre, ou bien de revendiquer Volantis et les autres états satellites de [old_valyria|E] pour former de nouvelles [the_freehold|E]."


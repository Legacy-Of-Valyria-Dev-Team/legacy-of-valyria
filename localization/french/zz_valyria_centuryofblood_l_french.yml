 #7899
 zz_valyria_centuryofblood:0 "The Century of Blood"
 zz_valyria_centuryofblood_group:0 "After the Doom"
 zz_valyria_centuryofblood_desc:0 "Les Possessions de Valyria se sont effondrées, s'écroulant lorsque la péninsule fut détruite par le Fléau. En quelques heures à peine, Valyria disparut et les Possessions furent anéanties. La Maison Targaryen s'était établie à Peyredragon, l'avant-poste le plus occidental de Valyria situé dans le détroit, assurant ainsi sa survie.\n\nCertains autres seigneurs dragons — ceux qui n'étaient pas à Valyria lors du Fléau — survécurent également. À Tyrosh, Lys et Qohor, on raconte que des seigneurs dragons furent épargnés par la destruction et ignoraient désormais ce que leur réservait l'avenir. #bold \n\nAurion Varezys, un seigneur dragon en visite à Qohor, se proclama premier Archonte de Valyria et leva des forces parmi les Qhohoriens. Avec son dragon et une armée de trente mille hommes, il marche pour revendiquer les vestiges de Valyria...#!"

 bookmark_99_arrec_durrandon:0 "Roi Arrec"
 bookmark_99_arrec_durrandon_desc:0 "Arrec Durrandon, Roi des Terres de l'Orage et des riches Conflans conquis par son ancêtre Arlan III Durrandon trois cents ans plus tôt, siège sur le Trône du Roi de l'Orage. Son règne n'est cependant pas assuré, car nombre d'autres rois de [westeros|E] continuent d'envier la richesse potentielle que recèlent les Conflans. À l'Ouest, les Fer-nés commencent à s'agiter, peut-être avec l'ambition de reprendre les Conflans aux Rois de l'Orage"
 bookmark_99_erich_durrandon:0 "Erich Durrandon"
 bookmark_99_monfryd_durrandon:0 "Monfryd Durrandon"

 bookmark_99_aenar_targaryen:0 "Roi Aenar"
 bookmark_99_aenar_targaryen_desc:0 "Douze ans avant le [doom_of_valyria|E], la fille d'Aenar, Daenys la Rêveuse, prédit la destruction de Valyria. En réponse à cela, Aenar vendit ses possessions dans les [valyrian_freehold|E] et les Contrées de l'été constant, et déménagea avec sa famille et ses dragons à Peyredragon, l'avant-poste le plus occidental des [valyrian_freehold|E]. Les Targaryen étaient loin d'être les plus puissants des seigneurs dragons, et leurs rivaux à Valyria considérèrent leur fuite comme un acte de lâcheté. Cependant, parce qu'Aenar avait éloigné sa famille de Valyria, les Targaryen furent les plus puissants des seigneurs dragons à survivre au [doom|E]"
 bookmark_99_gaemon_targaryen:0 "Gaemon Targaryen"
 bookmark_99_daenys_targaryen:0 "Daenys 'La Rêveuse' Targaryen"

 bookmark_99_qhorwyn_hoare:0 "Roi Qhorwyn"
 bookmark_99_qhorwyn_hoare_desc:0 "Qhorwyn a été un Roi avisé des Îles de Fer qui a évité la guerre et amassé des richesses durant son règne. Il a triplé la taille des flottes de la Maison Hoare et ordonné la création d'armements supplémentaires pour dissuader les ennemis d'attaquer.\n\nLe troisième fils de Qhorwyn, Harwyn, est revenu aux Îles de Fer après deux années d'aventures pour trouver son père infirme et malade, son frère Harlan se préparant à endosser le manteau de Roi des Îles de Fer. Les deux frères ont l'ambition de prendre le pouvoir militaire de leur père et de revendiquer le Royaume du Trident aux Durrandon, la seule question étant de savoir s'ils peuvent œuvrer ensemble dans ce but, ou si l'un tentera de s'emparer du pouvoir sur l'autre."
 bookmark_99_harlan_hoare:0 "Harlan Hoare"
 bookmark_99_harwyn_hoare:0 "Harwyn Hoare"

 bookmark_99_tommen_lannister:0 "Roi Tommen II"
 bookmark_99_tommen_lannister_desc:0 "Tommen II Lannister, connu comme le Roi Lion, est le Roi du Roc de la Maison Lannister. Ayant entendu parler de l'effondrement possible des [valyrian_freehold|E] dans un [doom|E] de feu, il se prépare à lancer une expédition vers les anciennes [valyrian_freehold_short|E] pour piller les richesses et la sorcellerie qui y demeurent sûrement. L'expédition s'annonce dangereuse et la question est donc : Tommen II devrait-il tout risquer pour retourner à Valyria ou profiter du vide massif de pouvoir dans le sillage de la disparition des [valyrian_freehold_short|E] et s'emparer d'[essos|E] pour étendre la richesse et le nom Lannister à travers le monde connu ?"
 bookmark_99_ellyn_tarbeck:0 "Ellyn Tarbeck"
 bookmark_99_tyrion_lannister:0 "Tyrion Lannister"

 bookmark_99_aurion_varezys:0 "Archonte Aurion"
 bookmark_99_aurion_varezys_desc:0 "[Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_copy|q$' )|E]\nAurion Varezys, l'un des rares Seigneurs Dragons survivants échoué à Qohor, leva des forces parmi les colons Qhohoriens et se déclara premier Archonte de Valyria. Chevauchant son [dragon|E], lui et ses trente mille hommes marchent pour revendiquer ce qui reste de Valyria, ou peut-être pour créer une Nouvelle Valyria par droit de conquête des Cités Libres d'[essos|E].\n\n#bold Aurion risquera-t-il tout pour revendiquer son ancienne patrie, ou forgera-t-il une nouvelle voie avec les Seigneurs Dragons restants afin que le rêve de Valyria demeure au premier plan de l'esprit du monde ?#!"

 bookmark_99_lucifer_justman:0 "Roi du Conflans Lucifer"
 bookmark_99_lucifer_justman_desc:0 "Trois siècles après qu'un précédent Lucifer Justman se soit déclaré Roi du Conflans par droit du sang, un nouveau prétendant à la couronne du Trident a débarqué dans la baie de la Néra. Se tenant sur les rives du petit village de pêcheurs à l'embouchure du Trident, Lucifer doit prendre son minuscule entourage et décider d'une voie pour faire valoir sa revendication sur les terres de ses ancêtres. Quel royaume serait le plus bénéfique pour chasser les Durrandon des terres de sa famille ? Les Jardinier de Hautjardin, les Lannister de Castral Roc ou les Arryn du Val ?"


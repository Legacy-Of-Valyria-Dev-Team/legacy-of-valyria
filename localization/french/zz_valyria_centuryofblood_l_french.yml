 #Swords/armor

 vs_stormbringer_name:0 "Vāedroma"
 vs_stormbringer_description:0 "L'épée d'acier valyrien de la Maison Varezys est une relique de feu et d'ombre, une lame forgée dans les creusets des Quatorze Flammes. Cette lame a vu les confins les plus reculés de l'Empire Valyrien."
 vs_skullbasher_name:0 "Rīnakharys"
 vs_skullbasher_description:0 "La masse d'acier valyrien de la Maison Belaerys"
 vs_inferno_name:0 "Vāedarion"
 vs_inferno_description:0 "Le marteau d'acier valyrien de la Maison Urnebar"
 vs_eclipse_name:0 "Embāelī"
 vs_eclipse_description:0 "L'épée d'acier valyrien de la Maison Mataeryon, forgée durant les siècles crépusculaires des Possessions Valyriennes, mais comportant des éléments bien plus anciens encore. L'épée connue communément sous le nom d'Éclipse est à la fois artefact et énigme : une union de la puissance valyrienne et d'un mystère pré-valyrien. Elle est taillée dans une unique pierre sombre, veinée de mouchetures pourpres qui scintillent faiblement sous la lumière lunaire, et froide comme la tombe. Selon les Mataeryon, elle ne fut point façonnée par la main de l'homme, mais découverte, exhumée des ruines noircies de N'ghai. On dit que lorsqu'on saisit la poignée, le porteur peut entendre les sombres murmures de l'inconnu."
 vs_ashbringer_name:0 "Vūjōsān"
 vs_ashbringer_description:0 "L'épée d'acier valyrien de la Maison Sonaryen"

 aurion_valyrian_steel_armor_name:0 "Hrōmagon"
 aurion_valyrian_steel_armor_description:0 "Une armure d'acier valyrien richement ouvragée, revendiquée par Aurion Varezys lors de son légendaire retour sur les os fumants de [valyria|E]. Nul artisan vivant ne saurait en nommer le créateur, et les érudits ne s'accordent point sur le fait qu'elle fut forgée dans les derniers jours des Possessions ou par quelque main plus ancienne, à jamais perdue dans les cendres et les mythes. Sa valeur ne saurait être mesurée en pièces ou en couronnes. Des royaumes entiers ne pourraient égaler sa valeur. C'est assurément la plus belle armure du [known_world|E]."


#Events
# lv_scenerio_cob:0 "The Century of Blood"
 cob_7899_scenerio.0001.t:0 "Le Roi des Tempêtes et des Rivières"
 cob_7899_scenerio.0001.desc:0 "C’est une époque de richesse et de prospérité pour le Royaume des Tempêtes et des Rivières. Depuis que mon ancêtre [arlan.GetName] a uni les deux empires en un seul et détruit le roi prétendant [lucifer.GetFirstName], la lignée de [benedict.GetName] a été éteinte. La maison Durrandon demeure la seule à porter le titre de Rois du Conflans et des Terres de l'Orage.\n\nCependant, tout n'est pas aussi paisible qu’il n’y paraît. Les tensions croissent dans le royaume... À l’Ouest, des rumeurs murmurent que les Fer-nés sous [qhorwyn.GetName] s'agitent avec peut-être l’ambition de conquérir les richesses du Conflans. Il se murmure également qu’un membre survivant de la maison Justman propage l’idée qu’il est le souverain légitime du Conflans... Encore un Justman qui souhaiterait être libéré de sa condition mortelle pour assurer que le cerf continue de régner sur les Rivières et les Tempêtes."
 cob_7899_scenerio.0001.a:0 "Nôtre est la fureur"

 cob_7899_scenerio.0002.t:0 "L’Exilé et la Rêveuse"
 cob_7899_scenerio.0002.desc:0 "Le [doom|E] s’est abattu sur Valyria exactement comme [dreamer.GetFirstName] l’avait prédit. Si je n’avais pas agi quand je l’ai fait, vendant toute la richesse de notre famille pour déménager dans ce morne avant-poste volcanique, notre lignée aurait sûrement été anéantie. Les [the_freehold|E] sont passées de la force la plus puissante du monde à l’ombre d’un néant en quelques heures. La maison Targaryen pourrait bien être la famille la plus puissante désormais.\n\nJe dois réfléchir à ce que l’avenir réserve pour moi et les miens. Devons-nous renforcer nos terres et maintenir la volonté des [the_freehold|E] depuis cet unique bastion, ou devons-nous étendre à nouveau l’influence des [the_freehold|E] sur les cités libres, et peut-être même sur [westeros|E] ?"
 cob_7899_scenerio.0002.a:0 "Feu et Sang"

 cob_7899_scenerio.0003.t:0 "Le Roi du Sel et de la Mer"
 cob_7899_scenerio.0003.desc:0 "Mon heure approche... Je sens [ROOT.Char.GetFaith.HighGodName] m’appeler depuis ses salles aquatiques alors que cette maladie implacable consume mon vieux corps fragile. Depuis la mort de mon premier fils [harmund.GetName], mon second fils [harlan.GetName] a su s’imposer, prenant en main l’administration du royaume tandis que la maladie me gagnait.\n\n[harwyn.GetName], mon troisième fils, parti chercher la gloire dans les cités libres, est revenu avec des intentions inconnues. Je ne peux qu’imaginer qu’il a entendu parler de ma longue agonie et qu’il souhaite revendiquer l’héritage qu’il croit lui revenir.\n\nSeul le temps dira quand [ROOT.Char.GetFaith.HighGodName] m’appellera dans ses salles aquatiques ; pour l’instant, je ne peux qu’imaginer ce qu’il adviendra du royaume que j’ai si ardemment bâti."
 cob_7899_scenerio.0003.a:0 "Ce qui est mort ne saurait mourir"

 cob_7899_scenerio.0004.t:0 "Le Roi du Roc"
 cob_7899_scenerio.0004.desc:0 "La nouvelle est parvenue à Castral Roc : Valyria a été détruite dans un cataclysme de destruction indicible. Presque tout l’Empire [dragonlord|E] a péri avec ses dragons, laissant ses terres jadis prospères ouvertes au pillage pour quiconque oserait en profiter. Peut-être que toute la richesse et la magie n’ont pas été anéanties... La maison Lannister pourrait définitivement asseoir sa place comme la maison la plus riche et la plus puissante à jamais régner sur [westeros|E]."
 cob_7899_scenerio.0004.a:0 "Ce n’est qu’un rêve insensé, je devrais concentrer mes efforts ici"
 cob_7899_scenerio.0004.a_tt:0 "Vous choisissez de ne pas risquer votre vie et de rester à Castral Roc"
 cob_7899_scenerio.0004.b:0 "Il y a une opportunité en Valyria que je ne peux ignorer"
 cob_7899_scenerio.0004.b_tt:0 "Vous choisissez de tout risquer pour voyager vers les vestiges de Valyria"

 cob_7899_scenerio.0005.t:0 "L'Héritier des Possessions"
 cob_7899_scenerio.0005.desc:0 "Les [the_freehold|E] sont tombées... Je n’ai plus reçu aucune réponse à mes correspondances depuis des lustres... Je ne peux que supposer que les rumeurs au sujet de ce que les gens appellent un '[doom|E]' sont vraies.\n\nJ’ai rassemblé une force de soldats venus de Qohor avec l’objectif de voler avec [vassarion.GetName] vers ce qu’il reste de Valyria... J’espère pouvoir rétablir l’ordre dans ce monde... Cependant, si les rumeurs sont exactes et que les possessions ne sont plus que cendres, alors peut-être que cette armée serait mieux employée à soumettre les Cités Libres sous mon autorité... Tout ce que je sais, c’est que je dois faire avancer cette troupe vers le sud depuis [location.GetName] pour découvrir par moi-même ce qu’est devenu mon foyer..."
 cob_7899_scenerio.0005.a:0 "Je retournerai aux [the_freehold|E] et revendiquerai ce qu’il en reste"
 cob_7899_scenerio.0005.a_tt:0 "Voyage vers Ny Sar"

 cob_7899_scenerio.0006.t:0 "L’Héritier du Roi du Conflans"
 cob_7899_scenerio.0006.desc:0 "Mon illustre ancêtre [lucifer.GetFirstName], véritable Roi du Conflans, s’était proclamé dernier descendant vivant de [benedict.GetName]. Il fut abattu par [arlan.GetName], afin que les Rois de l’Orage puissent maintenir leur domination illégitime sur le Royaume du Conflans.\n\nDurant des siècles, la lignée de la maison Justman a survécu dans l’ombre, fuyant la fureur des Rois de l’Orage qui auraient pu mener à notre extinction. Je ne peux plus poursuivre cette tradition... Je dois me lancer et rassembler des alliés pour revendiquer les terres de mes ancêtres.\n\nÀ présent, je dois choisir où chercher de l’aide... Les terres fertiles du Bief ? La richesse de l’Ouest ? Ou les montagnes du Val ?"
 cob_7899_scenerio.0006.a:0 "Chercher de l’aide au Bief"
 cob_7899_scenerio.0006.a_tt:0 "Voyager jusqu’à Hautjardin"
 cob_7899_scenerio.0006.b:0 "Chercher de l’aide au Roc"
 cob_7899_scenerio.0006.b_tt:0 "Voyager jusqu’à Castral Roc"
 cob_7899_scenerio.0006.c:0 "Chercher de l’aide au Val"
 cob_7899_scenerio.0006.c_tt:0 "Voyager jusqu’à la demeure du Val"
 cob_7899_scenerio.0006.d:0 "Me lancer seul"

 #Tommen Events
#  cob_7899_scenerio.0400.t:0 "Mettre les Voiles depuis Lannisport"
#  cob_7899_scenerio.0400.desc:0 "À mon arrivée à [GetTitleByKey('c_lannisport').GetName], je suis immédiatement accueilli par [lannisport.GetName], qui m’informe sans tarder que mon navire est prêt à partir. Une grande vague d’excitation me traverse à l’idée de débuter enfin ce voyage. J’étais agité au palais, attendant ce moment avec impatience, conscient qu’à chaque heure écoulée, quelqu’un d’autre pouvait atteindre les vestiges des [the_freehold|E] avant moi.\n\nLe moment était venu de prendre la mer et d’entamer le long périple vers [essos|E], afin de découvrir ce qu’il reste de Valyria après le [doom|E]. La flotte partirait vers Valyria dès que je serais à bord de mon vaisseau amiral, faisant un premier arrêt à [GetTitleByKey('c_oldtown').GetName] pour acheter les provisions nécessaires à la suite du voyage. Cette expédition serait coûteuse, certes, mais les richesses des [the_freehold|E] compenseraient largement ces dépenses."

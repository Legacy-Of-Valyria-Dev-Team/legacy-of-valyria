 #7899
 zz_valyria_centuryofblood:0 "Century of Blood"
 zz_valyria_centuryofblood_group:0 "After the Doom"
 zz_valyria_centuryofblood_desc:0 "Les Possessions Valyriennes sont tombées, s'effondrant quand la péninsule fut détruite dans le Fléau. En quelques heures seulement, Valyria disparut et les Possessions furent anéanties. La Maison Targaryen s'était relocalisée à Peyredragon, l'avant-poste le plus occidental de Valyria situé dans le Détroit, assurant ainsi leur survie.\n\nQuelques autres seigneurs dragons — ceux qui n'étaient pas à Valyria quand le Fléau survint — survécurent également. À Tyrosh, Lys et Qohor, on dit que des seigneurs dragons furent épargnés par la destruction et ne savaient maintenant que réserver l'avenir. #bold \n\nAurion Varezys, un seigneur dragon qui visitait Qohor, se proclama premier Archonte de Valyria et leva des forces parmi les Qohoriens. Avec son dragon et une armée de trente mille hommes, il marche pour revendiquer les restes de Valyria...#!"

 bookmark_99_arrec_durrandon:0 "Roi Arrec"
 bookmark_99_arrec_durrandon_desc:0 "Arrec Durrandon, Roi des Terres de l'Orage et des riches Conflans qui furent conquis par son ancêtre Arlan III Durrandon trois siècles plus tôt, siège sur le Trône du Roi de l'Orage. Son règne n'est cependant pas assuré, car de nombreux autres rois de [westeros|E] continuent d'envier la richesse potentielle des Conflans. De l'Ouest, les Fer-nés commencent à s'agiter, potentiellement avec l'ambition de reprendre les Conflans aux Rois de l'Orage."
 bookmark_99_erich_durrandon:0 "Erich Durrandon"
 bookmark_99_monfryd_durrandon:0 "Monfryd Durrandon"

 bookmark_99_aenar_targaryen:0 "Roi Aenar"
 bookmark_99_aenar_targaryen_desc:0 "Douze ans avant le [doom_of_valyria|E], la fille d'Aenar, Daenys la Rêveuse, prédit la destruction de [valyria|E]. En réponse à cela, Aenar vendit ses possessions dans les [valyrian_freehold|E] et les Terres du Long Été, et déménagea avec sa famille et ses [dragons_plural|E] à Peyredragon, l'avant-poste le plus occidental des [valyrian_freehold|E]. Les Targaryen étaient loin d'être les plus puissants des [dragonlords|E], et leurs rivaux de [valyria|E] virent leur fuite comme un acte de lâcheté. Cependant, parce qu'Aenar avait éloigné sa famille de [valyria|E], les Targaryen furent les plus forts des [dragonlords|E] à survivre au [doom|E]."
 bookmark_99_gaemon_targaryen:0 "Gaemon Targaryen"
 bookmark_99_daenys_targaryen:0 "Daenys 'la Rêveuse' Targaryen"

# bookmark_99_garland_gardener:0 "Garland VI Gardener"
# bookmark_99_garland_gardener_desc:0 "King Garland VI came to the Oakenseat while still in his minority. The High Steward of the Reach, a Tyrell, ruled as regent until Garland came of age. Garland VI now rules over one of the strongest kingdoms in [westeros|E]. An intelligent, yet cynical, king, Garland's ambitions are known only to himself and only time will tell how far House Gardener will rise"
# bookmark_99_elissa_florent:0 "Elissa Florent"
# bookmark_99_mern_gardener:0 "Mern Gardener"

 bookmark_99_qhorwyn_hoare:0 "Roi Qhorwyn"
 bookmark_99_qhorwyn_hoare_desc:0 "Qhorwyn a été un Roi avisé des Îles de Fer qui a évité la guerre et a plutôt amassé des richesses durant son règne. Il tripla la taille des flottes de la Maison Hoare et ordonna la création d'armements supplémentaires pour dissuader les ennemis d'attaquer.\n\nLe troisième fils de Qhorwyn, Harwyn, est retourné aux Îles de Fer après avoir voyagé pendant les deux années précédentes pour trouver son père infirme et malade, avec son frère Harlan se préparant à endosser le manteau de Roi des Îles de Fer. Les deux frères ont l'ambition de prendre le pouvoir militaire de leur père et revendiquer le Royaume du Trident des Durrandon, la seule question étant s'ils peuvent travailler ensemble pour cet objectif, ou si l'un tentera de réclamer le pouvoir sur l'autre."
 bookmark_99_harlan_hoare:0 "Harlan Hoare"
 bookmark_99_harwyn_hoare:0 "Harwyn Hoare"

 bookmark_99_tommen_lannister:0 "Roi Tommen II"
 bookmark_99_tommen_lannister_desc:0 "Tommen II Lannister, connu sous le nom de Roi Lion, est le Roi du Roc de la Maison Lannister. Ayant entendu parler de l'effondrement possible des Possessions Valyriennes dans un [doom|E] de feu, il se prépare à lancer une expédition vers les anciennes [valyrian_freehold_short|E] pour piller la richesse et la sorcellerie qui y demeuraient sûrement. L'expédition s'annonce dangereuse et la question demeure : Tommen II devrait-il tout risquer pour retourner à [valyria|E] ou profiter du vide massif de pouvoir suite à la disparition des [valyrian_freehold_short|E] et s'emparer d'[essos|E] pour étendre la richesse et le nom Lannister à travers le [known_world|E] ?"
 bookmark_99_ellyn_tarbeck:0 "Ellyn Tarbeck"
 bookmark_99_tyrion_lannister:0 "Tyrion Lannister"

 bookmark_99_aurion_varezys:0 "Archonte Aurion"
 bookmark_99_aurion_varezys_desc:0 "[Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_copy|q$' )|E]\nAurion Varezys, l'un des rares Seigneurs Dragons survivants échoués à Qohor, leva des forces parmi les colons qohoriens et se déclara premier Archonte de [valyria|E]. Au sommet de son [dragon|E], lui et ses trente mille hommes marchent pour revendiquer ce qui reste de [valyria|E], ou peut-être pour créer une Nouvelle [valyria|E] par droit de conquête des [free_cities|E] d'[essos|E].\n\n#bold Aurion risquera-t-il tout pour revendiquer son ancien foyer, ou forgera-t-il un nouveau chemin avec les Seigneurs Dragons restants pour que le rêve de [valyria|E] demeure au premier plan de l'esprit du monde ?#!"

 bookmark_99_lucifer_justman:0 "Roi du Conflans Lucifer"
 bookmark_99_lucifer_justman_desc:0 "Trois siècles après qu'un précédent Lucifer Justman se soit déclaré Roi du Conflans par droit du sang, un nouveau prétendant à la couronne du Trident a débarqué dans la Baie de la Néra. Debout sur les rivages du petit village de pêcheurs à l'embouchure du Trident, Lucifer doit prendre son petit entourage et décider d'un chemin pour presser sa revendication sur les terres de ses ancêtres. Quel royaume serait le plus bénéfique pour évincer les Durrandon de ses terres familiales ? Les Jardinier d'Hautjardin, les Lannister de Castral Roc ou les Arryn du Val ?"


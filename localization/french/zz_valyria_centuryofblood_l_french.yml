 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je marche à travers les halls en ruines du palais de [location.GetName] qui fut jadis la demeure de [Nymeria.GetName] des Rhoynars et je me retrouve ramené aux histoires que ma mère me racontait enfant. Des histoires sur les [dragonlords|E] d'antan et leurs conquêtes à travers [essos|E], prenant ce qui leur revenait de droit divin et par les flammes draconiques. Ceux qui se soumettaient étaient épargnés et ceux qui résistaient étaient effacés du monde ou chassés en exil avec leurs anciens royaumes laissés à pourrir comme celui-ci.\n\nAlors que je laisse ces histoires affluer dans mon esprit, je ne peux m'empêcher de me demander si les [valyrian_freehold_short|E] sont devenues faibles avec le temps, je me demande si ces conquérants, ces héros des histoires regarderaient mes frères et ressentiraient de la honte pour ce que nous sommes devenus. [valyria|E] fut jadis le pinacle du monde, mais à la fin il semblait que nous n'étions rien d'autre que des enfants querelleurs se battant pour le pouvoir et la richesse... peut-être est-ce pourquoi [ROOT.Char.GetFaith.HighGodName] choisit de [doom|E] notre peuple... peut-être ai-je été choisi pour maintenir le rêve de [valyria|E] vivant."
 cob_7899_scenerio.0500.a:0 "Nous avançons vers la Porte Lugubre"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers la Porte Lugubre"

 cob_7899_scenerio.0501.t:0 "La Décision à la Porte Lugubre"
 cob_7899_scenerio.0501.desc:0 "Alors que je me tiens regardant les eaux de la Rhoyne, la ruine de [location.GetName], une autre des conquêtes des [valyrian_freehold_short|E], derrière moi, je réalise qu'en ce moment j'ai un choix. Je peux continuer la quête que j'avais imaginée au début de ce voyage et marcher avec mon ost sur les restes possiblement calcinés et remplis de magma de [valyria|E] et restaurer la puissance des [valyrian_freehold_short|E] à mon image... ou... je peux incarner l'esprit des premiers [dragonlords|E] de [valyria|E], rassembler les Lords-Dragons survivants en [essos|E] et reconquérir les colonies des [valyrian_freehold_short|E] par droit de conquête par les flammes draconiques.\n\nAlors que je me tiens à la frontière de [GetTitleByKey('k_volantis').GetName] je dois décider - fais-je le voyage vers les terres brûlées de [GetTitleByKey('e_valyria').GetName], ou avancé-je et créé une Nouvelle [valyria|E] de la même façon que mes ancêtres ?\n\n#bold ATTENTION - l'une ou l'autre voie devrait s'avérer difficile, il est recommandé de sauvegarder souvent pour éviter un game over#!"
 cob_7899_scenerio.0005.b:0 "Je conquerrai les [free_cities|E] pour former une Nouvelle [valyria|E]"
 cob_7899_scenerio.0501.a:0 "Nous devons nous ravitailler à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager vers Volantis"

 ##Aurion Valyria Expedition

 cob_7899_scenerio.0502.t:0 "Ravitaillement au Long Pont"
 cob_7899_scenerio.0502.desc:0 "La première chose que j'ai remarquée à propos de [location.GetName] fut le bruit incessant et sans fin qui semblait englober chaque recoin de la cité. Je ne pouvais le dire avec certitude, mais il semblait presque que la ville était d'une façon ou d'une autre dix fois plus bruyante que la capitale valyrienne tout en étant moins de la moitié de sa taille. La seule chose qui était pire que le bruit était l'odeur, des gens sales, des latrines surutilisées et mal entretenues, du poisson et toute une foule d'autres choses se mélangeant pour former la plus impie des puanteurs le long du long pont où mon camp obtenait des provisions.\n\nHeureusement il ne faudrait pas longtemps avant que nous soyons de nouveau en marche vers [valyria|E] pour reconquérir notre foyer. En passant dans les rues j'avais remarqué un assortiment toujours croissant de gens qui célébraient la chute de ma patrie, déclarant que le monde était enfin libéré de l'emprise étouffante des [valyrian_freehold_short|E]. Je ne me suis pas mêlé à eux, reconnaissant que j'avais gardé [vassarion.GetName] hors de la ville pour éviter une confrontation inutile pendant mon voyage.\n\nAucune de leurs pensées n'importait vraiment car ils verraient la vérité que moi, [aurion.GetName], retournerais à [valyria|E] et la ramènerais à la hauteur qu'elle avait jadis. Pour l'instant, je pouvais prendre le moment pour me détendre avant de procéder vers ce qui reste de mon foyer..."
 cob_7899_scenerio.0502.a:0 "Il est temps d'avancer vers la Petite [valyria|E]"
 cob_7899_scenerio.0502.a_tt:0 "Voyager vers la Petite [valyria|E]"

 cob_7899_scenerio.0503.t:0 "Arrivée à la lisière des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0503.desc:0 "Je me tiens ici à la lisière de Volantis hors de [location.GetName] et ne peux vraiment pas croire mes yeux alors que je contemple les terres seulement quelques lieues devant. Un nuage noir comme la nuit brisa les cieux bleus au-dessus, créant une pluie qui causait des brûlures à la peau quand elle la touchait. Les terres devant semblaient avoir une brume qui causait un voile à ma vision et être incapable de voir ce qui pourrait se trouver devant moi et ma caravane, créant un sentiment de terreur que je pouvais sentir se répandre dans les rangs. Je me tournai vers Vassarion et grimpai de nouveau en selle avant de tourner la bête vers mon ost.\n\n"Ce fut un long voyage et le chemin devant semble lugubre, mes amis. Cependant, nous avons tous été choisis pour un dessein divin de reconquérir ce qui semble perdu pour chasser les ténèbres et ramener la lumière dans ce monde encore. [ROOT.Char.GetFaith.HighGodName] ne nous aurait pas permis de venir si loin seulement pour nous refuser maintenant alors nous irons de l'avant et reconquerrons ce qui nous revient de droit pour reconstruire le rêve de [valyria|E] pour tous ceux qui se tiennent sur ce monde !"\n\nLe cri qui s'éleva des troupes fut toute la confirmation dont j'avais besoin pour dire qu'elles étaient prêtes à affronter ce qui pourrait venir..."
 cob_7899_scenerio.0503.a:0 "Il est temps de reconquérir notre foyer"
 cob_7899_scenerio.0503.a_tt:0 "Voyager dans [valyria|E]"

 ##Aurion New Valyria Conquest

 cob_7899_scenerio.0510.t:0 "Archonte Aurion Ier de la Nouvelle [valyria|E]"
 cob_7899_scenerio.0510.desc:0 "Alors que je pénètre dans les halls dorés d'Ancienne Volantis, je me trouve empli d'une détermination vertueuse. Ce sont les halls que [ROOT.Char.GetFaith.HighGodName] de [valyria|E] me destinait à fouler, les fondateurs de la colonie d'Ancienne Volantis n'auraient jamais pu réaliser que la cité qu'ils construiraient était destinée par droit divin à asseoir le premier Archonte d'une Nouvelle [valyria|E].\n\nCependant, je ne peux me reposer facilement jusqu'à ce que toutes les filles des anciennes [the_freehold|E] soient sous ma bannière, je dois rassembler les [dragonlords|E] survivants en [essos|E] et les convoquer à la cour. D'ici nous partirons et reprendrons ce qui nous revient de droit par droit divin et par la puissance."
 cob_7899_scenerio.0510.a:0 "Je partirai pour unir les filles de [valyria|E]"

 cob_7899_scenerio.0511.t:0 "Tout Ce Qui Fut Jadis... Sera Une Fois Encore"
 cob_7899_scenerio.0511.desc:0 "De chaque recoin d'[essos|E] les autres [dragonlords|E] qui furent choisis par [ROOT.Char.GetFaith.HighGodName] pour survivre au [doom|E] se tiennent dans ma salle d'audience. Devant moi se tenaient [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal] emplis du désir vertueux de se joindre à moi pour restaurer l'ordre dans ce monde de la même façon que nos ancêtres le firent jadis.\n\nTout ce qui reste maintenant c'est de lancer une campagne de conquête à travers les anciennes colonies des [valyrian_freehold_short|E] pour que nous puissions les unir sous la puissance du [dragon|E] une fois encore à travers la fureur indomptée des flammes draconiques... nous marcherons de Volantis mais je dois maintenant décider laquelle des [free_cities|E] sera conquise en premier au nom des [dragonlords|E] de la Nouvelle [valyria|E]... est-ce que je frappe Myr pour ouvrir la voie vers Pentos ? Ou est-ce que je frappe Lys puis Tyrosh et prends le contrôle des régions du sud ?"
 cob_7899_scenerio.0511.a:0 "La Maison Urnebar régnera sur Tyrosh"
 cob_7899_scenerio.0511.b:0 "La Maison Sonaryen régnera sur Lys"
 cob_7899_scenerio.0511.c:0 "La Maison Mataeryon régnera sur Myr"
 cob_7899_scenerio.0511.d:0 "La Maison Belaerys régnera sur Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des [free_cities|E]"
 cob_7899_scenerio.0512.desc:0 "Je marche parmi le champ de bataille en feu et sanglant, les cris des blessés se mêlant aux acclamations célébratoires de mes soldats formant une sorte de symphonie impie dans mes oreilles. Mes soldats se tiennent victorieux derrière moi alors que j'accepte la capitulation de l'Archonte, leurs acclamations assourdissant le reste du monde tandis que je décrète que cette [free_city|E] est maintenant sous la juridiction directe des Nouvelles [valyrian_freehold|E] et qu'un nouveau [dragonlord|E] régnera par droit divin.\n\nMaintenant je dois choisir la prochaine cité qui se soumettra à la puissance de la Nouvelle [valyria|E]..."

 cob_7899_scenerio.0516.t:0 "Un Rameau d'Olivier pour un Ancien Avant-Poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, avec les [dragonlords|E] survivants de [valyria|E] régnant sous moi. Cependant, alors que je me tiens regardant la carte de mon empire grandissant, une petite chaîne d'îles à travers le [narrow_sea|El] à l'embouchure de la baie de la Néra continue d'attirer mon attention. Je place mon doigt sur la carte près de la plus grande de ces îles... Peyredragon, un ancien avant-poste à l'extrême limite des [valyrian_freehold|E] se tenant maintenant indépendant du Nouvel Empire Valyrien.\n\nAlors que je considérais une déclaration pure et simple de conquête pour reconquérir ce qui appartenait jadis à [valyria|E] de la même façon que j'avais les [free_cities|E] j'eus une épiphanie. Les Targaryen survécurent au [doom|E] de la même façon que les [dragonlords|E] régnant sur mon nouvel empire : par intervention divine. Par conséquent, il va de soi que je dois envoyer un message à quiconque règne sur ce rocher désolé avec une offre d'être accueilli de nouveau dans le giron une fois encore..."
 cob_7899_scenerio.0516.a:0 "Envoyer un corbeau avec une offre de jurer allégeance à la Nouvelle [valyria|E]"

 cob_7899_scenerio.0517.t:0 "Un Corbeau des [valyrian_freehold_short|E] ?"
 cob_7899_scenerio.0517.desc:0 "Je me trouve réveillé au milieu de la nuit par de forts coups sur la porte de ma chambre. Je parviens à me traîner du confort chaud de mon lit et mets une robe pour découvrir qui osait me déranger à cette heure tardive. En ouvrant la porte je trouve le mestre se tenant dans le hall, un message de corbeau tenu dans sa main tremblante. Je prends la lettre silencieusement, déroulant le parchemin pour lire le contenu dedans...\n\nPlusieurs heures plus tard le Lord de Lamarck se tenait avec moi dans la salle du trône de Peyredragon, le même regard de choc sur leur visage que j'avais eu seulement quelques heures plus tôt. [aurion.GetName] avait pris son dragon et conquis les anciennes colonies des [valyrian_freehold_short|E] pour se déclarer Archonte de la Nouvelle [valyria|E] et demandait que Peyredragon déclare allégeance à ce nouvel ordre... c'est maintenant à moi de décider le sort de mon royaume..."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne s'inclinera pas devant un nouveau Lord-Dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons cette offre de rejoindre une Nouvelle [valyria|E]"

 cob_7899_scenerio.0518.t:0 "Un Rameau d'Olivier Rejeté et Brisé"
 cob_7899_scenerio.0518.desc:0 "'Maudits lâches !'\n\nJe froissai la réponse que je reçus de Peyredragon et la jetai dans l'âtre flamboyant dans une rage. Comment osent-ils se croire si supérieurs qu'ils peuvent refuser de devenir partie de mon nouvel empire ? Croient-ils vraiment qu'ils peuvent se tenir seuls dans ce monde et résister au pouvoir de la Nouvelle [valyria|E] ? Cet avant-poste appartenait aux anciennes [the_freehold|E] et par droit devrait retourner à l'Empire de la Nouvelle [valyria|E] peu importe si les lâches Targaryen l'habitent ou non.\n\nJe dois maintenant décider quelle ligne de conduite je prendrai..."
 cob_7899_scenerio.0518.a:0 "Nous ramènerons Peyredragon dans [valyria|E] par la force !"
 cob_7899_scenerio.0518.b:0 "Laissez-les rester sur leur rocher et trembler"

 # cob_7899_scenerio.0519.t:0 "Une Défaite Embarrassante..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "Nous avons été battus défaits"

 cob_7899_scenerio.0520.t:0 "Peyredragon Retourne à [valyria|E]"
 cob_7899_scenerio.0520.desc:0 "C'est un jour glorieux pour mon nouvel Empire : la nouvelle est venue à ma cour que Peyredragon a déclaré son intention de jurer allégeance à l'Empire de la Nouvelle [valyria|E]. Avec cette nouvelle les dernières des anciennes colonies des [valyrian_freehold_short|E] ont été unies comme elles ne l'ont jamais été auparavant avec un seul dessein : maintenir la puissance des [valyrian_freehold|E] vivante dans les esprits de ceux qui se délecteraient de voir notre chute. Nous devons dorénavant rester unis contre ceux qui s'opposeraient à nous jusqu'au jour où [valyria|E] n'aura plus d'ennemis à craindre."
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueilli dans la Nouvelle [valyria|E]"

 ##Aurion Valyria Events

 cob_7899_scenerio.0521.t:0 "Attaque de vouivre de feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName] nous sentons le sol trembler sous nos pieds, tandis que la panique commençait à se répandre dans le groupe le sol devant nous s'ouvrit alors qu'une massive vouivre de feu émerge pour se dresser comme un défi pour nous faire passer.\n\n"Mon [ROOT.Char.GetLadyLord] ! Que faisons-nous ?" crie un des courtisans reculant lentement comme pour battre en retraite. Je jette un regard autour de l'armée qui a choisi de me suivre dans cette quête et dois maintenant décider exactement comment nous gérerons cette situation..."
 cob_7899_scenerio.0521.a:0 "J'affronterai la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons battre en retraite !"
 cob_7899_scenerio.0521.c:0 "Un de mes chevaliers peut s'en occuper !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Une Embuscade de Survivant des [valyrian_freehold_short|E] !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre ost passe à travers [location.GetName], un cri de guerre perce l'air mince du matin, envoyant des frissons dans nos épines. Même parmi les voyageurs les plus braves, ce son aurait envoyé des hommes audacieux courir vers les jupons de leurs mères.\n\n"Cavaliers, mon [ROOT.Char.GetLadyLord] !" La voix d'un éclaireur résonne à travers la tension, attirant mon attention alors qu'il dégaine son épée, la pointant devant. Il n'y a rien à voir encore, mais le son de nombreux sabots, une douzaine de chevaux ou plus, grandit, se rapprochant. La panique se répand parmi nous comme un feu de forêt, avec une autre voix rejoignant le chœur de la peur quand ils viennent en vue. "Il y en a #bold tant#!!"\n\nBien que leurs nombres ne soient pas vastes, les ennemis sont gros, intrépides, et semblent prêts à perdre leurs vies pour nos biens. À leur tête chevauche un [freeholder_looter.GetWomanMan] énorme dans les restes en lambeaux de ce qui fut jadis de fins vêtements valyriens, armé d'une épée à deux mains. Le chef de cette bande crie son nom pour que tous l'entendent, [freeholder_looter.GetFirstNameNicknamed]. Le pillard en devenir déclare dans une voix confiante et puissante de [freeholder_looter.GetHerHis] cruauté, raids audacieux comme celui-ci, et un tempérament de feu.\n\nAlors que les pillards se rapprochent, mon cheval rue et renâcle, menaçant de me désarçonner, mais je tiens fermement les rênes, me redressant. Levant mon [ROOT.Char.Custom('signature_weapon')] en l'air, je crie..."
 cob_7899_scenerio.0522.a:0 "Rebroussez chemin ! Rebroussez chemin immédiatement !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre entourage tentez de fuir les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.a.toast:0 "Fuyez !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous avez échappé sans problème. Prends ça, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous avez échappé, mais cela a causé un retard mineur dans votre voyage."
 cob_7899_scenerio.0522.a.majordelay:0 "Vous avez échappé, mais cela a causé un retard majeur dans votre voyage."
 cob_7899_scenerio.0522.a.minortheft:0 "Vous vous en êtes sortis avec vos vies, mais pas avec tous vos biens."
 cob_7899_scenerio.0522.a.majortheft:0 "Vous vous en êtes sortis avec vos vies, mais votre bourse est tombée de votre selle en fuyant."
 cob_7899_scenerio.0522.a.minorcombo:0 "Malgré la manœuvre, [freeholder_looter.GetFirstNameNoTooltip] a réussi à voler certaines de vos affaires."
 cob_7899_scenerio.0522.a.majorcombo:0 "Malgré la manœuvre compliquée, [freeholder_looter.GetFirstNameNoTooltip] a réussi à voler la plupart de vos affaires."
 cob_7899_scenerio.0522.a.scattered:0 "Votre entourage fut dispersé — chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Ressaisissez-vous et suivez-moi ! Chargez !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille."
 cob_7899_scenerio.0522.b.win:0 "Vous Avez Gagné"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez tué tous les pillards du groupe."
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef du groupe de pillards des [valyrian_freehold_short|E], [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "Le groupe de pillards des [valyrian_freehold_short|E] et leur chef [freeholder_looter.GetFirstName] ont échappé après un combat d'une heure !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille."
 cob_7899_scenerio.0522.b.loss:0 "Vous Avez Perdu"
 cob_7899_scenerio.0522.b.robbed:0 "Vous avez été défait, rassemblé et volé ; ils ont pris tout ce que vous aviez."
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous avez été défait, et les pillards ont pris [kidnapped_entourage.GetName]..."
 cob_7899_scenerio.0522.c:0 "Que diriez-vous d'un pot-de-vin..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]."
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] Rejoint Votre Cour"
 cob_7899_scenerio.0522.c.else:0 "Mais devriez-vous faire confiance à un Possédant disgracié ?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] S'est Enfui avec l'Argent"
 cob_7899_scenerio.0522.d:0 "Si nous laissons [sacrificed_entourage.GetFirstNameNoTooltip], cela peut nous faire gagner du temps."
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifierez [sacrificed_entourage.GetName] dans une tentative de distraire les pillards."

 cob_7899_scenerio.0523.t:0 "Rencontre Avec un Soldat Valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous voyageons à travers les terres en ruines de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissaient la vue tout en étouffant le souffle de tous dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et demande que [vassarion.GetName] me soit amené pour que je puisse voler au-dessus des nuages. Alors que j'attends un de mes éclaireurs crie et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume armés d'arbalètes et d'épées. Un du groupe vêtu des vêtements d'un officier de bas rang sort de la brume pour se tenir devant moi.\n\n"Je suis [freeholder_survivor.GetName] et j'ai votre ost encerclé. [location.GetName] a été réclamé par nous et vous vous rendrez à moi."\n\nJe dois maintenant décider que faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de les convaincre de rejoindre mon ost ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Vous devriez vous joindre à nous !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre Avec un Centurion Valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous voyageons à travers les terres en ruines de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissaient la vue tout en étouffant le souffle de tous dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et demande que [vassarion.GetName] me soit amené pour que je puisse voler au-dessus des nuages. Alors que j'attends un de mes éclaireurs crie et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume armés d'arbalètes et d'épées. Un du groupe vêtu des vêtements d'un officier de bas rang sort de la brume pour se tenir devant moi.\n\n"Je suis [freeholder_survivor.GetName] et j'ai votre ost encerclé. [location.GetName] a été réclamé par nous et vous vous rendrez à moi."\n\nJe dois maintenant décider que faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de les convaincre de rejoindre mon ost ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0524.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0524.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b:0 "Vous devriez vous joindre à nous !"
 cob_7899_scenerio.0524.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0524.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0524.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0525.t:0 "Rencontre Avec un Centurion Valyrien"
 cob_7899_scenerio.0525.desc:0 "Nous voyageons à travers les terres en ruines de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissaient la vue tout en étouffant le souffle de tous dans mon ost. Je décide que nous devrions prendre un moment pour nous repérer et demande que [vassarion.GetName] me soit amené pour que je puisse voler au-dessus des nuages. Alors que j'attends un de mes éclaireurs crie et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume armés d'arbalètes et d'épées. Un du groupe vêtu des vêtements en lambeaux d'un Général Valyrien sort de la brume pour se tenir devant moi.\n\n"Je suis [freeholder_survivor.GetName] et j'ai votre ost encerclé. [location.GetName] a été réclamé par nous et vous vous rendrez à moi."\n\nJe dois maintenant décider que faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Envoyer [vassarion.GetName] combattre ? Ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0525.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0525.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b:0 "Vous affronterez [vassarion.GetName] !"
 cob_7899_scenerio.0525.b_1_tt:0 "[freeholder_survivor.GetName] meurt !"
 cob_7899_scenerio.0525.b_2_tt:0 "[vassarion.GetName] meurt !"
 cob_7899_scenerio.0525.b.win:0 "[vassarion.GetName] tue [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b.dead:0 "[freeholder_survivor.GetName] parvient à survivre contre [vassarion.GetName]"
 cob_7899_scenerio.0525.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0525.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0527.t:0 "Embuscade par un Lord-Dragon"
 cob_7899_scenerio.0527.desc:0 "Alors que je vole sur [vassarion.GetName] à l'avant-garde de mon ost au-dessus des ruines de [location.GetName] un cri perçant perce l'air suivi d'une boule massive de flammes draconiques qui manque d'incinérer tout autour de moi.\n\nJe me réoriente pour scruter les nuages au-dessus à la recherche de quelque [dragon|E] sauvage qui a réussi à survivre au cataclysme pour m'attaquer. Avant longtemps l'agresseur se fit connaître car, à ma grande surprise, le [dragon|E] avait un cavalier qui commença à faire planer sa bête également massive devant moi. Je décide de parler avec [freeholder_dragonlord.GetHerHim] avant une autre attaque.\n\n"Je suis [aurion.GetName] et je suis revenu dans ces terres pour les reconquérir pour [valyria|E]." Je crie vers le [dragonlord|E]\n\n"Je me moque de [aurion.GetName], je suis [freeholder_dragonlord.GetName], cavalier de [enemy_dragon.GetName] et je revendique toutes ces terres sur lesquelles vous empiétez.""
 cob_7899_scenerio.0527.a:0 "J'affronterai [freeholder_dragonlord.GetName] et [freeholder_dragonlord.GetHerHis] [dragon|E]"
 cob_7899_scenerio.0527.a_tt:0 "Un duel de [dragon|E] commence avec [freeholder_dragonlord.GetName]"
 cob_7899_scenerio.0527.b:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0527.b_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0529.t:0 "Un Retour au Foyer Doux-Amer"
 cob_7899_scenerio.0529.desc:0 "Je descends du navire sur les quais de pierre en ruines de [location.GetName], mes yeux fixés sur les portes calcinées et en ruines de la cité capitale valyrienne.\n\n'Je suis chez moi' pensé-je. 'Je suis enfin chez moi... mais il reste encore beaucoup de travail à accomplir avant que les [valyrian_freehold_short|E] ne renaissent.'\n\nJe tombe à un genou et place ma main sur la pierre chaude du quai pour un bref moment, je relève la tête une fois de plus et pars pour restaurer les ruines de cette puissante cité une fois encore..."
 cob_7899_scenerio.0529.a:0 "Je suis rentré chez moi à [valyria|E]..."


 cob_7899_scenerio.0525.t:0 "Rencontre avec un centurion valyrien"
 cob_7899_scenerio.0525.desc:0 "Nous traversons les terres dévastées de [location.GetName], l’air saturé de fumée volcanique et de cendres, obscurcissant la vue et étouffant chaque souffle de mon escorte. Je décide que nous devons prendre un moment pour nous orienter et demande que l'on m'amène [vassarion.GetName] pour survoler les nuages. Alors que j’attends, l’un de mes éclaireurs crie et je me retourne pour voir un groupe de soldats valyriens sortir de la brume, armés d’arbalètes et d’épées. L’un d’eux, vêtu des oripeaux d’un général valyrien, s’avance pour me faire face.\n\n\"Je suis [freeholder_survivor.GetName] et j'ai encerclé votre troupe. [location.GetName] nous appartient désormais, rendez-vous !\"\n\nJe dois maintenant décider de ce que je vais faire. Dois-je affronter [freeholder_survivor.GetName] en duel ? Envoyer [vassarion.GetName] au combat ? Ou battre en retraite ?"
 cob_7899_scenerio.0525.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0525.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b:0 "Tu affronteras [vassarion.GetName] !"
 cob_7899_scenerio.0525.b_1_tt:0 "[freeholder_survivor.GetName] meurt !"
 cob_7899_scenerio.0525.b_2_tt:0 "[vassarion.GetName] meurt !"
 cob_7899_scenerio.0525.b.win:0 "[vassarion.GetName] tue [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b.dead:0 "[freeholder_survivor.GetName] survit à l'affrontement contre [vassarion.GetName]"
 cob_7899_scenerio.0525.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0525.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0527.t:0 "Embuscade par un Seigneur-Dragon"
 cob_7899_scenerio.0527.desc:0 "Alors que je vole sur [vassarion.GetName] à l’avant de ma troupe au-dessus des ruines de [location.GetName], un cri perçant fend l’air, suivi d’une immense boule de feu draconique manquant de tout réduire en cendres autour de moi.\n\nJe reprends mes esprits et scrute les nuages pour repérer la créature sauvage. Rapidement, l’assaillant se révèle — à ma surprise, le [dragon|E] a un cavalier qui, monté sur sa bête aussi massive, plane devant moi. Je décide de lui parler avant qu'une nouvelle attaque n'éclate.\n\n\"Je suis [aurion.GetName] et je suis revenu pour reconquérir ces terres pour Valyria !\" criai-je au [dragonlord|E]\n\n\"Je m'en moque, [aurion.GetName]. Je suis [freeholder_dragonlord.GetName], cavalier de [enemy_dragon.GetName], et je revendique toutes ces terres sur lesquelles tu n'es qu'un intrus.\""
 cob_7899_scenerio.0527.a:0 "J'affronterai [freeholder_dragonlord.GetName] et son [dragon|E]"
 cob_7899_scenerio.0527.a_tt:0 "Un duel de [dragon|E] commence contre [freeholder_dragonlord.GetName]"
 cob_7899_scenerio.0527.b:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0527.b_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0529.t:0 "Un retour doux-amer"
 cob_7899_scenerio.0529.desc:0 "Je descends du navire sur les quais de pierre en ruine de [location.GetName], mes yeux fixés sur les portes calcinées et ravagées de la capitale valyrienne.\n\n\"Je suis chez moi\", pensai-je. \"Enfin chez moi... mais tant de travail reste à accomplir pour que les [the_freehold|E] renaissent.\"\n\nJe m'agenouille, posant une main sur la pierre tiède du quai un instant, puis me relève, prêt à entreprendre la restauration de cette majestueuse cité en ruines."
 cob_7899_scenerio.0529.a:0 "Je suis enfin revenu à Valyria..."


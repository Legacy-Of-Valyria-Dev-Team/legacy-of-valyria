 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je marche dans les salles du palais en ruines de [location.GetName] qui fut autrefois la demeure de [Nymeria.GetName] des Rhoynars et je me retrouve ramené aux histoires que ma mère me racontait enfant. Des histoires sur les [dragonlords|E] d'antan et leurs conquêtes à travers [essos|E], prenant ce qui leur revenait de droit divin et par le feu des dragons. Ceux qui se soumettaient étaient épargnés et ceux qui résistaient étaient effacés du monde ou conduits à l'exil avec leurs anciens royaumes laissés à pourrir comme celui-ci.\n\nAlors que je laisse ces histoires affluer dans mon esprit, je ne peux m'empêcher de me demander si les [valyrian_freehold_short|E] se sont affaiblies au fil du temps, je me demande si ces conquérants, ces héros des histoires regarderaient mes frères et ressentiraient de la honte pour ce que nous sommes devenus. Valyria était autrefois le pinacle du monde, mais à la fin, on avait l'impression que nous n'étions rien de plus que des enfants querelleurs se disputant le pouvoir et la richesse... peut-être est-ce pourquoi [ROOT.Char.GetFaith.HighGodName] a choisi de [doom|E] notre peuple... peut-être ai-je été choisi pour maintenir vivant le rêve de Valyria."
 cob_7899_scenerio.0500.a:0 "Nous avançons vers la Porte Lugubre"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers la Porte Lugubre"

 cob_7899_scenerio.0501.t:0 "La Décision à la Porte Lugubre"
 cob_7899_scenerio.0501.desc:0 "Alors que je me tiens regardant les eaux de la Rhoyne, la ruine de [location.GetName], une autre des conquêtes des [valyrian_freehold_short|E], derrière moi, je réalise qu'en ce moment j'ai un choix. Je peux continuer la quête que j'ai imaginée au début de ce voyage et marcher mon ost sur les vestiges possiblement carbonisés et remplis de magma de Valyria et restaurer la puissance des [valyrian_freehold_short|E] à ma propre image... ou... je peux incarner l'esprit des premiers [dragonlords|E] de Valyria, rassembler les Seigneurs Dragons survivants en [essos|E] et reprendre les colonies des [valyrian_freehold_short|E] par droit de conquête par le feu des dragons\n\nAlors que je me tiens à la frontière de [GetTitleByKey('k_volantis').GetName], je dois décider - est-ce que je fais le voyage vers les terres brûlées de [GetTitleByKey('e_valyria').GetName], ou est-ce que je forge en avant et crée une Nouvelle Valyria de la même manière que mes ancêtres ?\n\n#bold AVERTISSEMENT - l'un ou l'autre chemin devrait s'avérer difficile, il est recommandé de sauvegarder souvent pour éviter un game over#!"
 cob_7899_scenerio.0005.b:0 "Je conquerrai les cités libres pour former une Nouvelle Valyria"
 cob_7899_scenerio.0501.a:0 "Nous devons nous ravitailler à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager vers Volantis"

 ##Aurion Valyria Expedition

 cob_7899_scenerio.0502.t:0 "Ravitaillement au Long Pont"
 cob_7899_scenerio.0502.desc:0 "La première chose que j'ai remarquée à propos de [location.GetName] était le bruit incessant et sans fin qui semblait englober chaque coin de la ville. Je ne pourrais pas l'affirmer avec certitude, mais il semblait presque que la ville était d'une manière ou d'une autre dix fois plus bruyante que la capitale valyrienne tout en étant moins de la moitié de sa taille. La seule chose qui était pire que le bruit était l'odeur, des gens sales, des latrines sur-utilisées et sous-entretenues, du poisson et toute une série d'autres choses se mélangeant pour former le plus impie des parfums le long du long pont où mon camp s'approvisionnait.\n\nHeureusement, il ne faudrait pas longtemps avant que nous ne soyons de nouveau en marche vers Valyria pour reprendre notre patrie. En passant dans les rues, j'avais remarqué un assortiment toujours croissant de personnes qui célébraient la disparition de ma patrie, déclarant que le monde était enfin libéré de l'emprise étouffante des [valyrian_freehold_short|E]. Je ne me suis pas engagé avec eux, reconnaissant d'avoir gardé [vassarion.GetName] à l'extérieur de la ville pour éviter une confrontation inutile lors de mon voyage.\n\nAucune de leurs pensées n'avait vraiment d'importance car ils verraient la vérité que moi, [aurion.GetName], je retournerais à Valyria et la ramènerais à la hauteur qu'elle avait autrefois. Pour l'instant, je pouvais prendre le moment de me détendre avant de procéder vers ce qui reste de ma maison..."
 cob_7899_scenerio.0502.a:0 "Il est temps d'avancer vers la Petite Valyria"
 cob_7899_scenerio.0502.a_tt:0 "Voyager vers la Petite Valyria"

 cob_7899_scenerio.0503.t:0 "Arrivée au bord des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0503.desc:0 "Je me tiens ici au bord de Volantis à l'extérieur de [location.GetName] et ne peux vraiment pas en croire mes yeux alors que je contemple les terres à seulement quelques lieues devant. Un nuage noir comme la nuit brisait le ciel bleu au-dessus, créant une pluie qui brûlait la peau au toucher. Les terres devant semblaient avoir une brume qui embrouillait ma vision et m'empêchait de voir ce qui pourrait se trouver devant moi et ma caravane, créant un sentiment d'effroi que je pouvais sentir se répandre dans les rangs. Je me suis tourné vers Vassarion et suis remonté en selle avant de tourner la bête vers mon ost.\n\n« Le voyage a été long et la route devant nous semble sombre, mes amis. Cependant, nous avons tous été choisis dans un but divin pour reprendre ce qui semble perdu, pour chasser les ténèbres et ramener la lumière dans ce monde. [ROOT.Char.GetFaith.HighGodName] ne nous aurait pas permis de venir si loin pour nous refuser maintenant, alors nous irons de l'avant et reprendrons ce qui nous revient de droit pour reconstruire le rêve de Valyria pour tous ceux qui se tiennent sur ce monde ! »\n\nL'acclamation qui s'éleva des troupes était toute la confirmation dont j'avais besoin pour dire qu'ils étaient prêts à affronter ce qui pourrait venir..."
 cob_7899_scenerio.0503.a:0 "Il est temps de reprendre notre patrie"
 cob_7899_scenerio.0503.a_tt:0 "Voyager dans Valyria"

 ##Aurion New Valyria Conquest

 cob_7899_scenerio.0510.t:0 "Archonte Aurion Ier de la Nouvelle Valyria"
 cob_7899_scenerio.0510.desc:0 "En pénétrant dans les salles dorées de l'Ancienne Volantis, je me trouve rempli d'une détermination vertueuse. C'étaient les salles dans lesquelles [ROOT.Char.GetFaith.HighGodName] de Valyria m'a destiné à me tenir, les fondateurs de la colonie de l'Ancienne Volantis n'auraient jamais pu réaliser que la ville qu'ils construiraient était destinée par droit divin à accueillir le premier Archonte d'une Nouvelle Valyria.\n\nCependant, je ne peux me reposer tant que toutes les filles de l'ancienne [the_freehold|E] ne sont pas sous ma bannière, je dois rassembler les [dragonlords|E] survivants en [essos|E] et les convoquer à la cour. D'ici, nous partirons et reprendrons ce qui nous revient de droit divin et de puissance."
 cob_7899_scenerio.0510.a:0 "Je partirai pour unir les filles de Valyria"

 cob_7899_scenerio.0511.t:0 "Tout ce qui fut... Sera à nouveau"
 cob_7899_scenerio.0511.desc:0 "De tous les coins d'[essos|E], les autres [dragonlords|E] qui furent choisis par [ROOT.Char.GetFaith.HighGodName] pour survivre au [doom|E] se tiennent dans ma salle d'audience. Devant moi se tenaient [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal], remplis du désir vertueux de se joindre à moi pour restaurer l'ordre dans ce monde de la même manière que nos ancêtres l'avaient fait autrefois.\n\nTout ce qui reste maintenant est de lancer une campagne de conquête à travers les anciennes colonies des [valyrian_freehold_short|E] afin que nous puissions les unir sous la puissance du [dragon|E] une fois de plus par la furie indomptée du feu des dragons... nous marcherons depuis Volantis mais je dois maintenant décider laquelle des Cités Libres sera conquise en premier au nom des [dragonlords|E] de la Nouvelle Valyria... dois-je frapper Myr pour ouvrir la voie vers Pentos ? Ou dois-je frapper Lys puis Tyrosh et prendre le contrôle des régions méridionales ?"
 cob_7899_scenerio.0511.a:0 "La Maison Urnebar régnera sur Tyrosh"
 cob_7899_scenerio.0511.b:0 "La Maison Sonaryen régnera sur Lys"
 cob_7899_scenerio.0511.c:0 "La Maison Mataeryon régnera sur Myr"
 cob_7899_scenerio.0511.d:0 "La Maison Belaerys régnera sur Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des Cités Libres"
 cob_7899_scenerio.0512.desc:0 "Je marche parmi le champ de bataille brûlant et sanglant, les cris des blessés se mêlant aux acclamations de célébration de mes soldats formant une sorte de symphonie impie dans mes oreilles. Mes soldats se tiennent victorieux derrière moi alors que j'accepte la capitulation de l'Archonte, leurs acclamations assourdissant le reste du monde alors que je décrète que cette [free_city|E] est maintenant sous la juridiction directe de la Nouvelle [valyrian_freehold|E] et qu'un nouveau [dragonlord|E] régnera par droit divin\n\nMaintenant je dois choisir la prochaine cité qui se soumettra à la puissance de la Nouvelle Valyria..."

 cob_7899_scenerio.0516.t:0 "Une Branche d'Olivier pour un Ancien Avant-poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, avec les [dragonlords|E] survivants de Valyria régnant sous moi. Cependant, alors que je me tiens regardant la carte de mon empire en expansion, une petite chaîne d'îles à travers le [narrow_sea|El] à l'embouchure de la Baie de la Néra continue d'attirer mon attention. Je place mon doigt sur la carte près de la plus grande de ces îles... Peyredragon, un ancien avant-poste à l'extrémité des [valyrian_freehold|E] maintenant indépendant du Nouvel Empire Valyrien.\n\nAlors que je considérais une déclaration pure et simple de conquête pour reprendre ce qui appartenait autrefois à Valyria de la même manière que je l'avais fait pour les [free_cities|E], j'ai eu une épiphanie. Les Targaryen ont survécu au [doom|E] de la même manière que les [dragonlords|E] régnant sur mon nouvel empire : par intervention divine. Par conséquent, il est logique que j'envoie un message à quiconque règne sur ce rocher désolé avec une offre d'être accueilli à nouveau dans le giron..."
 cob_7899_scenerio.0516.a:0 "Envoyer un corbeau avec une offre de prêter allégeance à la Nouvelle Valyria"

 cob_7899_scenerio.0517.t:0 "Un Corbeau des [valyrian_freehold_short|E] ?"
 cob_7899_scenerio.0517.desc:0 "Je me retrouve réveillé au milieu de la nuit par un coup fort frappé à la porte de ma chambre. Je parviens à m'arracher du confort chaud de mon lit et à enfiler une robe pour découvrir qui oserait me déranger à cette heure tardive. En ouvrant la porte, je trouve le mestre debout dans le couloir, un message de corbeau tenu dans sa main tremblante. Je prends la lettre en silence, déroulant le parchemin pour lire le contenu à l'intérieur...\n\nPlusieurs heures plus tard, le Seigneur de Lamarck se tenait avec moi dans la salle du trône de Peyredragon, le même regard de choc sur son visage que j'avais seulement quelques heures plus tôt. [aurion.GetName] avait pris son dragon et conquis les anciennes colonies des [valyrian_freehold_short|E] pour se déclarer Archonte de la Nouvelle Valyria et demandait que Peyredragon déclare fidélité à ce nouvel ordre... c'est maintenant à moi de décider du sort de mon royaume..."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne s'inclinera pas devant un nouveau Seigneur Dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons cette offre de rejoindre une Nouvelle Valyria"

 cob_7899_scenerio.0518.t:0 "Une Branche d'Olivier Dédaignée et Brisée"
 cob_7899_scenerio.0518.desc:0 "'Maudits lâches !'\n\nJ'ai froissé la réponse que j'ai reçue de Peyredragon et l'ai jetée dans l'âtre enflammé dans une rage. Comment osent-ils se croire si supérieurs qu'ils peuvent refuser de faire partie de mon nouvel empire ? Croient-ils vraiment qu'ils peuvent rester seuls dans ce monde et résister au pouvoir de la Nouvelle Valyria ? Cet avant-poste appartenait à l'ancienne [the_freehold|E] et devrait par droit retourner à l'Empire de la Nouvelle Valyria, que les lâches Targaryen l'habitent ou non.\n\nJe dois maintenant décider quelle ligne de conduite je vais prendre..."
 cob_7899_scenerio.0518.a:0 "Nous ramènerons Peyredragon à Valyria par la force !"
 cob_7899_scenerio.0518.b:0 "Qu'ils restent sur leur rocher et se terrent"

 # cob_7899_scenerio.0519.t:0 "Une Défaite Embarrassante..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "Nous avons été battus et vaincus"

 cob_7899_scenerio.0520.t:0 "Peyredragon Retourne à Valyria"
 cob_7899_scenerio.0520.desc:0 "C'est un jour glorieux pour mon nouvel Empire : la nouvelle est parvenue à ma cour que Peyredragon a déclaré son intention de prêter allégeance à l'Empire de la Nouvelle Valyria. Avec cette nouvelle, les dernières des anciennes colonies des [valyrian_freehold_short|E] ont été unies comme elles ne l'ont jamais été auparavant avec un seul but : maintenir vivante la puissance des [valyrian_freehold|E] dans l'esprit de ceux qui se réjouiraient de voir notre disparition. Nous devons désormais rester unis contre ceux qui s'opposeraient à nous jusqu'au jour où Valyria n'aura plus d'ennemis à craindre."
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueillie dans la Nouvelle Valyria"

 ##Aurion Valyria Events

 cob_7899_scenerio.0521.t:0 "Attaque de vouivre de feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds, alors que la panique commençait à se répandre dans le groupe, le sol devant nous s'ouvrit et une vouivre de feu massive émergea pour se dresser comme un défi à notre passage.\n\n« Mon [ROOT.Char.GetLadyLord] ! Que faisons-nous ? » crie l'un des courtisans en reculant lentement comme pour battre en retraite. Je regarde autour de moi l'armée qui a choisi de me suivre dans cette quête et dois maintenant décider exactement comment nous allons gérer cette situation..."
 cob_7899_scenerio.0521.a:0 "J'affronterai la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons battre en retraite !"
 cob_7899_scenerio.0521.c:0 "L'un de mes chevaliers peut s'en charger !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Une Embuscade de Survivants des [valyrian_freehold_short|E] !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre ost traverse [location.GetName], un cri de guerre déchire l'air ténu du matin, envoyant des frissons le long de nos échines. Même parmi les voyageurs les plus braves, ce son aurait fait courir les hommes les plus hardis se réfugier dans les jupes de leur mère.\n\n« Des cavaliers, mon [ROOT.Char.GetLadyLord] ! » La voix d'un éclaireur résonne dans la tension, attirant mon attention alors qu'il dégaine son épée, la pointant devant. Il n'y a encore rien à voir, mais le son de nombreux sabots, une douzaine de chevaux ou plus, devient plus fort, s'approchant. La panique se répand parmi nous comme une traînée de poudre, une autre voix se joignant au chœur de la peur quand ils arrivent en vue. « Ils sont #bold si nombreux#  ! ! »\n\nBien que leur nombre ne soit pas immense, les ennemis sont grands, intrépides et apparemment prêts à perdre leur vie pour nos biens. À leur tête chevauche un[freeholder_looter.GetWomanMan] énorme dans les restes en lambeaux de ce qui fut autrefois de beaux vêtements valyriens, armé[freeholder_looter.Custom('FR_E')] d'une grande épée à deux mains. Le chef de cette bande crie son nom pour que tous l'entendent, [freeholder_looter.GetFirstNameNicknamed]. Le pillard en devenir déclare d'une voix confiante et puissante sa cruauté, ses raids audacieux comme celui-ci, et son tempérament fougueux.\n\nAlors que les pillards se rapprochent, mon cheval rue et renâcle, menaçant de me désarçonner, mais je tiens fermement les rênes, me redressant. Levant mon [ROOT.Char.Custom('signature_weapon')] en l'air, je crie..."
 cob_7899_scenerio.0522.a:0 "Faites demi-tour ! Faites demi-tour immédiatement !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre entourage tentez de fuir les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.a.toast:0 "Fuyez !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous avez échappé sans encombre. Prends ça, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous avez échappé, mais cela a causé un retard mineur dans votre voyage."
 cob_7899_scenerio.0522.a.majordelay:0 "Vous avez échappé, mais cela a causé un retard majeur dans votre voyage."
 cob_7899_scenerio.0522.a.minortheft:0 "Vous vous en êtes sortis vivants, mais pas avec toutes vos possessions."
 cob_7899_scenerio.0522.a.majortheft:0 "Vous vous en êtes sortis vivants, mais votre bourse est tombée de votre selle en fuyant."
 cob_7899_scenerio.0522.a.minorcombo:0 "Malgré la manœuvre, [freeholder_looter.GetFirstNameNoTooltip] a réussi à voler certaines de vos affaires."
 cob_7899_scenerio.0522.a.majorcombo:0 "Malgré la manœuvre compliquée, [freeholder_looter.GetFirstNameNoTooltip] a réussi à voler la plupart de vos affaires."
 cob_7899_scenerio.0522.a.scattered:0 "Votre entourage fut dispersé — chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Ressaisissez-vous, mes braves, et suivez-moi ! Chargez !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille."
 cob_7899_scenerio.0522.b.win:0 "Vous avez gagné"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez tué tous les pillards du groupe."
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef du groupe de pillards des [valyrian_freehold_short|E], [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "Le groupe de pillards des [valyrian_freehold_short|E] et leur chef [freeholder_looter.GetFirstName] se sont échappés après un combat d'une heure !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille."
 cob_7899_scenerio.0522.b.loss:0 "Vous avez perdu"
 cob_7899_scenerio.0522.b.robbed:0 "Vous avez été vaincu, rassemblé et dépouillé ; ils ont pris tout ce que vous aviez."
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous avez été vaincu, et les pillards ont pris [kidnapped_entourage.GetName]..."
 cob_7899_scenerio.0522.c:0 "Que diriez-vous d'un pot-de-vin..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]."
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] rejoint votre cour"
 cob_7899_scenerio.0522.c.else:0 "Mais devriez-vous faire confiance à un Possédant déchu ?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] s'est enfui avec l'argent"
 cob_7899_scenerio.0522.d:0 "Si nous laissons [sacrificed_entourage.GetFirstNameNoTooltip], cela pourrait nous faire gagner du temps."
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifierez [sacrificed_entourage.GetName] pour tenter de distraire les pillards."

 cob_7899_scenerio.0523.t:0 "Rencontre avec un Soldat Valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous traversons les terres en ruines de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de tous dans mon ost. Je décide que nous devrions prendre un moment pour nous orienter et j'appelle pour que [vassarion.GetName] me soit amené afin que je puisse voler au-dessus des nuages. Pendant que j'attends, l'un de mes éclaireurs crie et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un du groupe vêtu des insignes d'un officier de bas rang sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiqué par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de les convaincre de rejoindre mon ost ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Vous devriez nous rejoindre !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous traversons les terres en ruines de [location.GetName], l'air épais de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de tous dans mon ost. Je décide que nous devrions prendre un moment pour nous orienter et j'appelle pour que [vassarion.GetName] me soit amené afin que je puisse voler au-dessus des nuages. Pendant que j'attends, l'un de mes éclaireurs crie et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un du groupe vêtu des insignes d'un officier de bas rang sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] a été revendiqué par nous et vous allez vous rendre à moi. »\n\nJe dois maintenant décider ce que je dois faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de les convaincre de rejoindre mon ost ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0524.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0524.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b:0 "Vous devriez nous rejoindre !"
 cob_7899_scenerio.0524.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"

 #7899
 zz_valyria_centuryofblood:0 "Le Siècle de Sang"
 zz_valyria_centuryofblood_group:0 "Après le Fléau"
 zz_valyria_centuryofblood_desc:0 "Les Possessions Valyriennes se sont effondrées lorsque la péninsule fut anéantie par le Fléau. En l'espace de quelques heures à peine, Valyria disparut et les Possessions furent détruites. La Maison Targaryen s'était établie à Peyredragon, l'avant-poste le plus occidental de Valyria, niché au cœur du Détroit, assurant ainsi sa survie.\n\nD'autres Lords dragons — ceux qui ne se trouvaient pas à Valyria lorsque le Fléau frappa — survécurent également. À Tyrosh, à Lys et à Qohor, on raconte que des Lords dragons furent épargnés par la destruction, désormais incertains de ce que leur réservait l'avenir. #bold \n\nAurion Varezys, un Lord dragon qui se trouvait alors à Qohor, se proclama premier Archonte de Valyria et leva des forces parmi les Qohoriens. Monté sur son dragon, à la tête d'une armée de trente mille hommes, il marche pour revendiquer ce qu'il reste de Valyria...#!"

 bookmark_99_arrec_durrandon:0 "Roi Arrec"
 bookmark_99_arrec_durrandon_desc:0 "Arrec Durrandon, Roi des Terres de l'Orage et du prospère Conflans conquis par son ancêtre Arlan III Durrandon trois siècles plus tôt, siège sur le Trône du Roi de l'Orage. Son pouvoir demeure pourtant fragile, car nombre des autres rois de [westeros|E] convoitent toujours la richesse potentielle que recèle le Conflans. À l'Ouest, les Fer-nés commencent à s'agiter, nourrissant peut-être l'ambition de ravir le Conflans aux Rois de l'Orage"
 bookmark_99_arrec_durrandon_subheading:0 "Le Roi de l'Orage"
 bookmark_99_erich_durrandon:0 "Erich Durrandon"
 bookmark_99_monfryd_durrandon:0 "Monfryd Durrandon"

 bookmark_99_aenar_targaryen:0 "Roi Aenar"
 bookmark_99_aenar_targaryen_desc:0 "Douze ans avant le [doom_of_valyria|E], la fille d'Aenar, Daenys la Rêveuse, prédit la destruction de [valyria|E]. En réponse à cette prophétie, Aenar vendit ses possessions dans les [valyrian_freehold|E] ainsi que dans les Terres du Long Été, et s'établit avec sa famille et ses [dragons_plural|E] à Peyredragon, l'avant-poste le plus occidental des [valyrian_freehold|E]. Les Targaryens étaient loin d'être les plus puissants des [dragonlords|E], et leurs rivaux de [valyria|E] virent dans leur fuite un acte de lâcheté. Pourtant, parce qu'Aenar avait éloigné sa famille de [valyria|E], les Targaryens furent les plus puissants des [dragonlords|E] à survivre au [doom|E]"
 bookmark_99_aenar_targaryen_subheading:0 "Lord de Peyredragon"
 bookmark_99_gaemon_targaryen:0 "Gaemon Targaryen"
 bookmark_99_daenys_targaryen:0 "Daenys « la Rêveuse » Targaryen"

 # bookmark_99_garland_gardener:0 "Garland VI Gardener"
 # bookmark_99_garland_gardener_desc:0 "King Garland VI came to the Oakenseat while still in his minority. The High Steward of the Reach, a Tyrell, ruled as regent until Garland came of age. Garland VI now rules over one of the strongest kingdoms in [westeros|E]. An intelligent, yet cynical, king, Garland's ambitions are known only to himself and only time will tell how far House Gardener will rise"
 # bookmark_99_elissa_florent:0 "Elissa Florent"
 # bookmark_99_mern_gardener:0 "Mern Gardener"

 bookmark_99_qhorwyn_hoare:0 "Roi Qhorwyn"
 bookmark_99_qhorwyn_hoare_desc:0 "Qhorwyn s'est révélé un Roi avisé des Îles de Fer, évitant la guerre pour mieux amasser richesses durant son règne. Il tripla la taille des flottes de la Maison Hoare et ordonna la fabrication d'armements supplémentaires pour dissuader quiconque oserait l'attaquer.\n\nHarwyn, troisième fils de Qhorwyn, est revenu aux Îles de Fer après deux années d'aventures pour y trouver son père infirme et malade, tandis que son frère Harlan se prépare à endosser le manteau de Roi des Îles de Fer. Les deux frères nourrissent l'ambition de s'emparer de la puissance militaire de leur père et de revendiquer le Royaume du Trident sur les Durrandon — la seule question étant de savoir s'ils sauront s'unir dans ce dessein, ou si l'un tentera de dominer l'autre."
 bookmark_99_qhorwyn_hoare_subheading:0 "Roi des Îles de Fer"
 bookmark_99_harlan_hoare:0 "Harlan Hoare"
 bookmark_99_harwyn_hoare:0 "Harwyn Hoare"

 bookmark_99_tommen_lannister:0 "Roi Tommen II"
 bookmark_99_tommen_lannister_desc:0 "Tommen II Lannister, surnommé le Roi Lion, règne en tant que Roi du Roc de la Maison Lannister. Ayant appris l'effondrement possible des [valyrian_freehold|E] dans un [doom|E] de feu, il prépare une expédition vers les anciennes [valyrian_freehold_short|E] afin d'y piller la richesse et la sorcellerie qui y subsistent assurément. L'expédition s'annonce périlleuse, et la question demeure : Tommen II doit-il tout risquer pour retourner à [valyria|E], ou profiter du vide de pouvoir laissé par la chute des [valyrian_freehold_short|E] pour s'emparer d'[essos|E] et étendre la richesse et le nom des Lannister à travers le [known_world|E] ?"
 bookmark_99_tommen_lannister_subheading:0 "Roi du Roc"
 bookmark_99_ellyn_tarbeck:0 "Ellyn Tarbeck"
 bookmark_99_tyrion_lannister:0 "Tyrion Lannister"

 bookmark_99_aurion_varezys:0 "Archonte Aurion"
 bookmark_99_aurion_varezys_desc:0 "[Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_copy|q$' )|E]\nAurion Varezys, l'un des rares Lords dragons survivants échoués à Qohor, leva des forces parmi les colons qohoriens et se proclama premier Archonte de [valyria|E]. Monté sur son [dragon|E], il marche à la tête de trente mille hommes pour revendiquer ce qu'il reste de [valyria|E], ou peut-être pour fonder une Nouvelle [valyria|E] par droit de conquête sur les [free_cities|E] d'[essos|E].\n\n#bold Aurion risquera-t-il tout pour revendiquer son ancien foyer, ou tracera-t-il une nouvelle voie aux côtés des Lords dragons survivants, afin que le rêve de [valyria|E] demeure gravé au cœur du monde ?#!"
 bookmark_99_aurion_varezys_subheading:0 "L'Archonte de Valyria"
 bookmark_99_maelys_varezys:0 "Maelys Varezys"

 bookmark_99_lucifer_justman:0 "Lucifer, Roi du Conflans"
 bookmark_99_lucifer_justman_desc:0 "Trois siècles après qu'un précédent Lucifer Justman se soit proclamé Roi du Conflans par droit du sang, un nouveau prétendant à la couronne du Trident a débarqué dans la Baie de la Néra. Debout sur les rives du petit village de pêcheurs à l'embouchure du Trident, Lucifer doit rassembler sa maigre suite et choisir la voie qui lui permettra de faire valoir ses droits sur les terres de ses ancêtres. Quel royaume lui serait le plus profitable pour chasser les Durrandon des terres de sa famille ? Les Jardinier de Hautjardin, les Lannister de Castral Roc, ou les Arryn du Val ?"
 bookmark_99_lucifer_justman_subheading:0 "Le Roi du Conflans"


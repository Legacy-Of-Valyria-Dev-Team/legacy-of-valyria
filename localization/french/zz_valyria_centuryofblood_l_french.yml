 #COB Decisions
 cob_send_for_the_dragonlords_decision:0 "Envoyer Quérir les Lords Dragons"
 cob_send_for_the_dragonlords_decision_desc:0 "Le temps est venu de lancer un appel à travers le monde afin que tous les Lords Dragons sans terres reviennent chez eux revendiquer leur droit de naissance.\n\nPendant trop longtemps, ces terres sont demeurées inoccupées. Je souhaite à nouveau voir les cieux emplis du battement d'ailes des Dragons portant leurs maîtres Lords Dragons à travers les airs."

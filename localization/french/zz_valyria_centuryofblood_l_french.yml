 #Aurion Events
 cob_7899_scenerio.0500.t:0 "Arrivée au Palais de Nymeria"
 cob_7899_scenerio.0500.desc:0 "Je déambule dans les couloirs du palais en ruine de [location.GetName], jadis demeure de [Nymeria.GetName] des Rhoynars, et je me retrouve transporté vers les récits que ma mère me contait enfant. Des histoires sur les [dragonlords|E] d'antan et leurs conquêtes à travers [essos|E], prenant ce qui leur revenait de droit divin et par le feu du dragon. Ceux qui ployaient le genou étaient épargnés, et ceux qui résistaient étaient rayés du monde ou chassés en exil, leurs anciens royaumes laissés à pourrir comme celui-ci.\n\nTandis que ces récits affluent dans mon esprit, je ne puis m'empêcher de me demander si les [valyrian_freehold_short|E] s'étaient affaiblies au fil du temps. Je me demande si ces conquérants, ces héros des récits, contempleraient mes semblables avec honte pour ce que nous étions devenus. [valyria|E] fut jadis le pinacle du monde, mais à la fin, il semblait que nous n'étions plus que des enfants querelleurs se disputant pouvoir et richesses... peut-être est-ce la raison pour laquelle [ROOT.Char.GetFaith.HighGodName] choisit de condamner notre peuple au [doom|E]... peut-être ai-je été choisi pour maintenir vivant le rêve de [valyria|E]."
 cob_7899_scenerio.0500.a:0 "Nous poursuivons vers la Porte Sinistre"
 cob_7899_scenerio.0500.a_tt:0 "Voyager vers la Porte Sinistre"

 cob_7899_scenerio.0501.t:0 "La Décision à la Porte Sinistre"
 cob_7899_scenerio.0501.desc:0 "Alors que je contemple les eaux de la Rhoyne, les ruines de [location.GetName], une autre des conquêtes des [valyrian_freehold_short|E], derrière moi, je réalise qu'en cet instant j'ai un choix à faire. Je puis poursuivre la quête que j'imaginais au commencement de ce périple et mener mon ost sur les vestiges possiblement calcinés et emplis de lave de [valyria|E] pour restaurer la puissance des [valyrian_freehold_short|E] à mon image... ou... je puis incarner l'esprit des premiers [dragonlords|E] de [valyria|E], rassembler les Lords Dragons survivants d'[essos|E] et reconquérir les colonies des [valyrian_freehold_short|E] par droit de conquête et feu du dragon.\n\nAlors que je me tiens à la frontière de [GetTitleByKey('k_volantis').GetName], je dois décider : vais-je entreprendre le voyage vers les terres brûlées de [GetTitleByKey('e_valyria').GetName], ou bien forger une Nouvelle [valyria|E] à la manière de mes ancêtres ?\n\n#bold ATTENTION : l'une ou l'autre voie s'annonce difficile, il est recommandé de sauvegarder fréquemment pour éviter un game over#!"
 cob_7899_scenerio.0501.b:0 "Je conquerrai les [free_cities|E] pour fonder une Nouvelle [valyria|E]"
 cob_7899_scenerio.0501.a:0 "Nous devons nous ravitailler à Volantis"
 cob_7899_scenerio.0501.a_tt:0 "Voyager vers Volantis"

 ##Aurion Valyria Expedition

 cob_7899_scenerio.0502.t:0 "Ravitaillement au Long Pont"
 cob_7899_scenerio.0502.desc:0 "La première chose que je remarquai à propos de [location.GetName] fut le vacarme incessant et sans fin qui semblait envahir chaque recoin de la cité. Je ne saurais l'affirmer avec certitude, mais il me sembla que la ville était dix fois plus bruyante que la capitale valyrienne tout en étant moins de la moitié de sa taille. La seule chose pire que le bruit était l'odeur : gens crasseux, latrines surexploitées et mal entretenues, poisson, et toute une cohorte d'autres effluves se mêlant pour former la plus impie des puanteurs le long du Long Pont où mon campement se procurait des vivres.\n\nFort heureusement, il ne faudrait guère longtemps avant que nous reprenions notre marche vers [valyria|E] pour reconquérir notre patrie. Tandis que je traversais les rues, j'avais remarqué un assortiment croissant de gens célébrant la disparition de ma terre natale, déclarant que le monde était enfin libéré de l'étreinte étouffante des [valyrian_freehold_short|E]. Je ne m'engageai point avec eux, reconnaissant d'avoir gardé [vassarion.GetName] hors de la cité pour éviter toute confrontation inutile durant mon périple.\n\nAucune de leurs pensées n'importait véritablement car ils verraient la vérité : moi, [aurion.GetName], je retournerai en [valyria|E] et la ramènerai au sommet de sa gloire d'antan. Pour l'heure, je pouvais prendre un moment de répit avant de poursuivre vers ce qui reste de ma patrie..."
 cob_7899_scenerio.0502.a:0 "Il est temps d'avancer vers la Petite [valyria|E]"
 cob_7899_scenerio.0502.a_tt:0 "Voyager vers la Petite [valyria|E]"

 cob_7899_scenerio.0503.t:0 "Arrivée aux confins des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0503.desc:0 "Je me tiens ici aux confins de Volantis, devant [location.GetName], et je ne puis véritablement croire mes yeux en contemplant les terres situées à quelques lieues seulement. Un nuage aussi noir que la nuit brisait le ciel azuré au-dessus, déversant une pluie qui brûlait la peau au contact. Les terres devant nous semblaient nimbées d'une brume qui troublait ma vision et m'empêchait de distinguer ce qui pouvait s'étendre devant moi et ma caravane, créant un sentiment d'effroi que je sentais se répandre dans les rangs. Je me tournai vers Vassarion et remontai en selle avant de faire pivoter la bête vers mon ost.\n\n« Ce fut un long périple et la voie qui s'ouvre devant nous semble sinistre, mes amis. Cependant, nous avons tous été choisis pour un dessein divin : reconquérir ce qui semble perdu, chasser les ténèbres et ramener la lumière en ce monde. [ROOT.Char.GetFaith.HighGodName] ne nous aurait point permis de venir si loin pour nous refuser la victoire maintenant. Aussi avançons-nous pour reconquérir ce qui nous revient de droit et rebâtir le rêve de [valyria|E] pour tous ceux qui foulent ce monde ! »\n\nL'acclamation qui s'éleva des troupes était toute la confirmation dont j'avais besoin pour savoir qu'ils étaient prêts à affronter ce qui nous attendait..."
 cob_7899_scenerio.0503.a:0 "Il est temps de reconquérir notre patrie"
 cob_7899_scenerio.0503.a_tt:0 "Voyager en [valyria|E]"

 ##Aurion New Valyria Conquest

 cob_7899_scenerio.0510.t:0 "Empereur Aurion Ier de la Nouvelle [valyria|E]"
 cob_7899_scenerio.0510.desc:0 "Alors que je pénètre dans les salles dorées de l'Ancienne Volantis, je me sens empli d'une détermination vertueuse. Voici les salles que [ROOT.Char.GetFaith.HighGodName] de [valyria|E] m'a destiné à occuper ; les fondateurs de la colonie de l'Ancienne Volantis n'auraient jamais pu imaginer que la cité qu'ils construiraient était destinée par droit divin à accueillir le trône du premier Empereur d'une Nouvelle [valyria|E].\n\nToutefois, je ne saurais trouver le repos tant que toutes les filles de l'ancienne [the_freehold|E] ne seront point sous ma bannière. Je dois rassembler les [dragonlords|E] survivants d'[essos|E] et les convoquer à ma cour. De là, nous partirons reconquérir ce qui nous revient de droit divin et par notre puissance."
 cob_7899_scenerio.0510.a:0 "Je partirai unifier les filles de [valyria|E]"

 cob_7899_scenerio.0511.t:0 "Tout ce qui fut... sera à nouveau"
 cob_7899_scenerio.0511.desc:0 "De tous les coins d'[essos|E], les autres [dragonlords|E] que [ROOT.Char.GetFaith.HighGodName] a choisis pour survivre au [doom|E] se tiennent dans ma salle d'audience. Devant moi se dressent [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] et [mataeryon_house.GetFirstNameRegnal], emplis du désir vertueux de me rejoindre pour restaurer l'ordre en ce monde comme le firent jadis nos ancêtres.\n\nIl ne reste plus qu'à lancer une campagne de conquête à travers les anciennes colonies des [valyrian_freehold_short|E] afin de les unir à nouveau sous la puissance du [dragon|E] par la furie indomptée du feu draconique... Nous marcherons depuis Volantis, mais je dois désormais décider laquelle des [free_cities|E] sera conquise en premier au nom des [dragonlords|E] de la Nouvelle [valyria|E]... Dois-je frapper Myr pour ouvrir la voie vers Pentos ? Ou dois-je frapper Lys puis Tyrosh pour prendre le contrôle des régions méridionales ?"
 cob_7899_scenerio.0511.a:0 "La Maison Urnebar régnera sur Tyrosh"
 cob_7899_scenerio.0511.b:0 "La Maison Sonaryen régnera sur Lys"
 cob_7899_scenerio.0511.c:0 "La Maison Mataeryon régnera sur Myr"
 cob_7899_scenerio.0511.d:0 "La Maison Belaerys régnera sur Pentos"

 cob_7899_scenerio.0512.t:0 "La Conquête des [free_cities|E]"
 cob_7899_scenerio.0512.desc:0 "Je marche parmi le champ de bataille sanglant et fumant, les cris des blessés se mêlant aux acclamations victorieuses de mes soldats pour former une sorte de symphonie impie à mes oreilles. Mes soldats se tiennent victorieux derrière moi tandis que j'accepte la capitulation de l'Archonte, leurs vivats couvrant le reste du monde alors que je décrète que cette [free_city|E] est désormais sous la juridiction directe de la Nouvelle [valyrian_freehold|E] et qu'un nouveau [dragonlord|E] régnera par droit divin.\n\nJe dois maintenant choisir la prochaine cité qui se soumettra à la puissance de la Nouvelle [valyria|E]..."

 cob_7899_scenerio.0516.t:0 "Un Rameau d'Olivier pour un Ancien Avant-poste"
 cob_7899_scenerio.0516.desc:0 "Ma conquête des [free_cities|E] se poursuit, les [dragonlords|E] survivants de [valyria|E] régnant sous mon autorité. Cependant, alors que je contemple la carte de mon empire en expansion, une petite chaîne d'îles de l'autre côté du [narrow_sea|El], à l'embouchure de la baie de la Néra, ne cesse de capter mon attention. Je pose mon doigt sur la carte près de la plus grande de ces îles... Peyredragon, un ancien avant-poste aux confins extrêmes des [valyrian_freehold|E], désormais indépendant de l'Empire de la Nouvelle Valyria.\n\nAlors que j'envisageais une déclaration de conquête pure et simple pour récupérer ce qui appartenait jadis à [valyria|E], comme je l'avais fait pour les [free_cities|E], j'eus une révélation. Les Targaryen ont survécu au [doom|E] de la même manière que les [dragonlords|E] régnant sur mon nouvel empire : par intervention divine. Il me semble donc raisonnable d'envoyer un message à quiconque règne sur ce rocher désolé avec une offre de réintégration au sein de l'Empire..."
 cob_7899_scenerio.0516.a:0 "Envoyer un corbeau avec une offre de prêter allégeance à la Nouvelle [valyria|E]"

 cob_7899_scenerio.0517.t:0 "Un Corbeau des [valyrian_freehold_short|E] ?"
 cob_7899_scenerio.0517.desc:0 "Je me trouve éveillé au milieu de la nuit par des coups violents frappés à la porte de ma chambre. Je parviens à m'extirper du confort chaleureux de mon lit et enfile une robe pour découvrir qui ose me déranger à cette heure tardive. En ouvrant la porte, je trouve le mestre debout dans le couloir, un message de corbeau tremblant dans sa main. Je prends la lettre en silence, déroulant le parchemin pour en lire le contenu...\n\nPlusieurs heures plus tard, le Seigneur de Lamarck se tenait à mes côtés dans la salle du trône de Peyredragon, le même air de stupeur sur le visage que j'avais eu quelques heures plus tôt. [aurion.GetName] avait chevauché son dragon et conquis les anciennes colonies des [valyrian_freehold_short|E] pour se proclamer Empereur de la Nouvelle [valyria|E], et demandait à Peyredragon de prêter allégeance à ce nouvel ordre... Il m'appartient désormais de décider du destin de mon royaume..."
 cob_7899_scenerio.0517.a:0 "Peyredragon ne ploiera point devant un nouveau Lord Dragon"
 cob_7899_scenerio.0517.b:0 "Nous accepterons cette offre de rejoindre une Nouvelle [valyria|E]"

 cob_7899_scenerio.0518.t:0 "Un Rameau d'Olivier Rejeté et Brisé"
 cob_7899_scenerio.0518.desc:0 "« Maudits couards ! »\n\nJe froissai la réponse reçue de Peyredragon et la jetai dans l'âtre flamboyant dans un accès de rage. Comment osent-ils se croire si supérieurs qu'ils peuvent refuser de faire partie de mon nouvel empire ? Croient-ils véritablement pouvoir rester seuls en ce monde et résister à la puissance de la Nouvelle [valyria|E] ? Cet avant-poste appartenait à l'ancienne [the_freehold|E] et devrait de droit revenir à l'Empire de la Nouvelle [valyria|E], que les couards Targaryen l'habitent ou non.\n\nJe dois maintenant décider quelle ligne de conduite adopter..."
 cob_7899_scenerio.0518.a:0 "Nous ramènerons Peyredragon au sein de [valyria|E] par la force !"
 cob_7899_scenerio.0518.b:0 "Qu'ils restent sur leur rocher à trembler de peur"

 # cob_7899_scenerio.0519.t:0 "An Embarassing Defeat..."
 # cob_7899_scenerio.0519.desc:0 "..."
 # cob_7899_scenerio.0519.a:0 "We have been beaten defeated"

 cob_7899_scenerio.0520.t:0 "Peyredragon Revient à [valyria|E]"
 cob_7899_scenerio.0520.desc:0 "C'est un jour glorieux pour mon nouvel Empire : la nouvelle est parvenue à ma cour que Peyredragon a déclaré son intention de prêter allégeance à l'Empire de la Nouvelle [valyria|E]. Avec cette nouvelle, la dernière des anciennes colonies des [valyrian_freehold_short|E] a été unie comme jamais auparavant dans un dessein unique : maintenir vivante la puissance des [valyrian_freehold|E] dans l'esprit de ceux qui se réjouiraient de notre disparition. Nous devons désormais demeurer unis contre ceux qui s'opposeraient à nous jusqu'au jour où [valyria|E] n'aura plus d'ennemis à craindre."
 cob_7899_scenerio.0520.a:0 "Peyredragon sera accueilli au sein de la Nouvelle [valyria|E]"

 ##Aurion Valyria Events

 cob_7899_scenerio.0521.t:0 "Attaque de Vouivre de Feu !"
 cob_7899_scenerio.0521.desc:0 "Alors que le campement arrive aux ruines de [location.GetName], nous sentons le sol trembler sous nos pieds. Tandis que la panique commence à se répandre dans notre groupe, le sol devant nous s'ouvre et une massive vouivre de feu émerge pour nous barrer le passage.\n\n« Mon [ROOT.Char.GetLadyLord] ! Que faisons-nous ? » crie l'un des courtisans en reculant lentement comme pour battre en retraite. Je jette un regard circulaire sur l'armée qui a choisi de me suivre dans cette quête et dois maintenant décider exactement comment nous allons gérer cette situation..."
 cob_7899_scenerio.0521.a:0 "J'affronterai la bête moi-même"
 cob_7899_scenerio.0521.b:0 "Nous devons battre en retraite !"
 cob_7899_scenerio.0521.c:0 "L'un de mes chevaliers peut s'en charger !"

 cob_7899_scenerio.0522.t:0 "$travel_danger_prefix$ Embuscade de Survivants des [valyrian_freehold_short|E] !"
 cob_7899_scenerio.0522.desc:0 "Alors que notre ost traverse [location.GetName], un cri de guerre déchire l'air matinal ténu, nous glaçant le sang. Même parmi les voyageurs les plus intrépides, ce son aurait fait courir les hommes les plus hardis vers les jupes de leurs mères.\n\n« Des cavaliers, mon [ROOT.Char.GetLadyLord] ! » La voix d'un éclaireur résonne à travers la tension, attirant mon attention tandis qu'il dégaine son épée, la pointant droit devant. Il n'y a encore rien à voir, mais le bruit de nombreux sabots, une douzaine de chevaux ou plus, s'amplifie, se rapproche. La panique se répand parmi nous comme une traînée de poudre, une autre voix rejoignant le chœur de la peur lorsqu'ils apparaissent. « Ils sont #bold si nombreux#!! »\n\nBien que leurs effectifs ne soient pas vastes, les ennemis sont imposants, intrépides, et apparemment prêts à sacrifier leurs vies pour nos biens. À leur tête chevauche un[freeholder_looter.GetWomanMan] massif[freeholder_looter.GetWomanMan] vêtu des lambeaux de ce qui fut jadis de fins atours valyriens, armé d'une épée à deux mains. Le chef de cette bande hurle son nom pour que tous l'entendent : [freeholder_looter.GetFirstNameNicknamed]. Le pillard autoproclamé déclare d'une voix confiante et puissante sa cruauté, ses raids audacieux comme celui-ci, et son tempérament de feu.\n\nTandis que les pillards se rapprochent, mon cheval se cabre et s'ébroue, menaçant de me désarçonner, mais je tiens fermement les rênes et me redresse. Levant mon [ROOT.Char.Custom('signature_weapon')] en l'air, je crie..."
 cob_7899_scenerio.0522.a:0 "Faites demi-tour ! Demi-tour immédiatement !"
 cob_7899_scenerio.0522.a.tt:0 "Vous et votre suite tentez de fuir les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.a.toast:0 "Fuyez !"
 cob_7899_scenerio.0522.a.fleeing:0 "Vous vous êtes échappé sans encombre. Bien fait pour toi, [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.a.minordelay:0 "Vous vous êtes échappé, mais cela a causé un léger retard dans votre voyage."
 cob_7899_scenerio.0522.a.majordelay:0 "Vous vous êtes échappé, mais cela a causé un retard majeur dans votre voyage."
 cob_7899_scenerio.0522.a.minortheft:0 "Vous en êtes sortis vivants, mais pas avec tous vos biens."
 cob_7899_scenerio.0522.a.majortheft:0 "Vous en êtes sortis vivants, mais votre bourse est tombée de votre selle pendant la fuite."
 cob_7899_scenerio.0522.a.minorcombo:0 "Malgré la manœuvre, [freeholder_looter.GetFirstNameNoTooltip] a réussi à dérober certains de vos biens."
 cob_7899_scenerio.0522.a.majorcombo:0 "Malgré la manœuvre complexe, [freeholder_looter.GetFirstNameNoTooltip] a réussi à dérober la plupart de vos biens."
 cob_7899_scenerio.0522.a.scattered:0 "Votre suite s'est dispersée : chacun pour soi !"
 cob_7899_scenerio.0522.b:0 "Reprenez-vous, braves gens, et suivez-moi ! À la charge !"
 cob_7899_scenerio.0522.b.tt:0 "Vous et vos gardes chargez les pillards des [valyrian_freehold_short|E]."
 cob_7899_scenerio.0522.b.winning:0 "Vous remportez la bataille."
 cob_7899_scenerio.0522.b.win:0 "Victoire"
 cob_7899_scenerio.0522.b.killed:0 "Vous avez occis tous les pillards du groupe."
 cob_7899_scenerio.0522.b.imprisoned:0 "Vous avez capturé le chef du groupe de pillards des [valyrian_freehold_short|E], [freeholder_looter.GetFirstName] !"
 cob_7899_scenerio.0522.b.fleeing:0 "Le groupe de pillards des [valyrian_freehold_short|E] et leur chef [freeholder_looter.GetFirstName] se sont échappés après une heure de combat !"
 cob_7899_scenerio.0522.b.losing:0 "Vous perdez la bataille."
 cob_7899_scenerio.0522.b.loss:0 "Défaite"
 cob_7899_scenerio.0522.b.robbed:0 "Vous avez été vaincus, rassemblés et dépouillés ; ils ont pris tout ce que vous possédiez."
 cob_7899_scenerio.0522.b.kidnapping:0 "Vous avez été vaincus, et les pillards ont enlevé [kidnapped_entourage.GetName]..."
 cob_7899_scenerio.0522.c:0 "Que diriez-vous d'un pot-de-vin..."
 cob_7899_scenerio.0522.c.tt:0 "Vous tentez de recruter [freeholder_looter.GetFirstNameNoTooltip]."
 cob_7899_scenerio.0522.c.joined:0 "[freeholder_looter.GetFirstNameNoTooltip] rejoint votre cour"
 cob_7899_scenerio.0522.c.else:0 "Mais devriez-vous faire confiance à un Possesseur déshonoré ?"
 cob_7899_scenerio.0522.c.ranwithmoney:0 "[freeholder_looter.GetFirstNameNoTooltip] s'est enfui avec l'argent"
 cob_7899_scenerio.0522.d:0 "Si nous abandonnons [sacrificed_entourage.GetFirstNameNoTooltip], cela pourrait nous faire gagner du temps."
 cob_7899_scenerio.0522.d.tt:0 "Vous sacrifierez [sacrificed_entourage.GetName] pour tenter de distraire les pillards."
 cob_7899_scenerio.0522.d.sacrifice:0 "PLACEHOLDER"

 cob_7899_scenerio.0523.t:0 "Rencontre avec un Soldat Valyrien"
 cob_7899_scenerio.0523.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air chargé de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de chaque membre de mon ost. Je décide que nous devrions prendre un moment pour nous orienter et j'ordonne qu'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs pousse un cri et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émerger de la brume, armés d'arbalètes et d'épées. L'un d'eux, vêtu des atours d'un officier de rang inférieur, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] nous appartient désormais et vous allez vous rendre à moi. »\n\nJe dois maintenant décider quoi faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de les convaincre de rejoindre mon ost, ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0523.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0523.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b:0 "Vous devriez vous joindre à nous !"
 cob_7899_scenerio.0523.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0523.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0523.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0523.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0524.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0524.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air chargé de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de chaque membre de mon ost. Je décide que nous devrions prendre un moment pour nous orienter et j'ordonne qu'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs pousse un cri et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émerger de la brume, armés d'arbalètes et d'épées. L'un d'eux, vêtu des atours d'un officier de rang inférieur, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] nous appartient désormais et vous allez vous rendre à moi. »\n\nJe dois maintenant décider quoi faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Devrais-je essayer de les convaincre de rejoindre mon ost, ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0524.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0524.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b:0 "Vous devriez vous joindre à nous !"
 cob_7899_scenerio.0524.b_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0524.b.joined:0 "[freeholder_survivor.GetName] rejoint notre ost"
 cob_7899_scenerio.0524.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0524.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0525.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0525.desc:0 "Nous traversons les terres dévastées de [location.GetName], l'air chargé de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de chaque membre de mon ost. Je décide que nous devrions prendre un moment pour nous orienter et j'ordonne qu'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs pousse un cri et je me retourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émerger de la brume, armés d'arbalètes et d'épées. L'un d'eux, vêtu des lambeaux des atours d'un Général Valyrien, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et j'ai encerclé votre ost. [location.GetName] nous appartient désormais et vous allez vous rendre à moi. »\n\nJe dois maintenant décider quoi faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Envoyer [vassarion.GetName] au combat ? Ou devrions-nous battre en retraite ?"
 cob_7899_scenerio.0525.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0525.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b:0 "Vous affronterez [vassarion.GetName] !"
 cob_7899_scenerio.0525.b_1_tt:0 "[freeholder_survivor.GetName] périt !"
 cob_7899_scenerio.0525.b_2_tt:0 "[vassarion.GetName] périt !"
 cob_7899_scenerio.0525.b.win:0 "[vassarion.GetName] occit [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b.dead:0 "[freeholder_survivor.GetName] parvient à survivre face à [vassarion.GetName]"
 cob_7899_scenerio.0525.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0525.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0527.t:0 "Embuscade d'un Lord Dragon"
 cob_7899_scenerio.0527.desc:0 "Alors que je survole à dos de [vassarion.GetName] l'avant-garde de mon ost au-dessus des ruines de [location.GetName], un cri perçant déchire l'air, suivi d'une massive boule de feu draconique qui manque de peu d'incinérer tout ce qui m'entoure.\n\nJe me réoriente pour scruter les nuages à la recherche du [dragon|E] sauvage qui a survécu au cataclysme pour m'attaquer. Il ne s'écoule guère de temps avant que l'agresseur se révèle : à ma grande surprise, le [dragon|E] avait un cavalier qui fit planer sa bête tout aussi massive devant moi. Je décide de lui parler avant une nouvelle attaque.\n\n« Je suis [aurion.GetName] et je suis revenu en ces terres pour les reconquérir au nom de [valyria|E]. » crié-je vers le [dragonlord|E].\n\n« Peu me chaut, [aurion.GetName]. Je suis [freeholder_dragonlord.GetName], chevaucheur de [enemy_dragon.GetName], et je revendique toutes ces terres sur lesquelles vous empiétez. »"
 cob_7899_scenerio.0527.a:0 "J'affronterai [freeholder_dragonlord.GetName] et son [dragon|E]"
 cob_7899_scenerio.0527.a_tt:0 "Un duel de [dragon|E] commence avec [freeholder_dragonlord.GetName]"
 cob_7899_scenerio.0527.b:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0527.b_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0529.t:0 "Un Retour au Pays Amer et Doux"
 cob_7899_scenerio.0529.desc:0 "Je descends du navire sur les quais de pierre en ruine de [location.GetName], les yeux fixés sur les portes calcinées et dévastées de la capitale valyrienne.\n\n« Je suis chez moi », pensé-je. « Je suis enfin chez moi... mais il reste encore bien du labeur à accomplir avant que les [valyrian_freehold_short|E] ne se relèvent. »\n\nJe mets un genou à terre et pose ma main sur la pierre chaude du quai durant un bref instant. Je relève la tête une fois encore et me mets en route pour restaurer les ruines de cette puissante cité..."
 cob_7899_scenerio.0529.a:0 "Je suis revenu chez moi en [valyria|E]..."

 cob_7899_scenerio.9998.t:0 "L'Expédition Perdue d'Aurion"
 cob_7899_scenerio.9998.desc:0 "En traversant les terres de Valyria, votre groupe tombe sur ce qui semble être un immense cimetière de squelettes figés dans diverses postures de terreur...\n\nAprès quelques explorations, vous déterminez qu'il s'agit de la dernière demeure de l'expédition d'Aurion Varezys en Valyria. Au centre du carnage, vous trouvez le squelette d'un immense dragon enroulé autour du squelette en armure de son cavalier, que vous croyez être Aurion. À première vue, il semble que le dragon tentait de protéger Aurion de... quelque chose. Un sentiment d'effroi vous traverse à la pensée de quelque chose de si terrifiant qu'un dragon de cette taille savait que la fin était proche.\n\nVous devez maintenant décider si vous allez profaner ce lieu de sépulture et récupérer l'épée et l'armure de la Maison Varezys, sachant que selon les anciennes traditions, un tel acte entraînera un châtiment..."
 cob_7899_scenerio.9998.a:0 "Prendre les artefacts et accepter le châtiment"
 cob_7899_scenerio.9998.b:0 "Ces artefacts devraient demeurer en ce cimetière"

 cob_7899_scenerio.9999.t:0 "Tentative de Défiance envers les Dieux"
 cob_7899_scenerio.9999.desc:0 "Vous vous retrouvez au milieu d'un rêve, une peur profonde vous envahit tandis qu'une voix tonne depuis les ténèbres :\n\n« Tu as tenté de défier la volonté des Dieux, l'artefact que tu as tenté d'invoquer a été perdu dans la magie profonde et ne pourra être récupéré que lorsque les Dieux le jugeront bon. »\n\nQuelques instants plus tard, vous parvenez à vous réveiller, confus par ce qui vient de se produire...\n\nNOTE DEV : cet artefact est actuellement bloqué et ne peut être invoqué via le debug car il existe une chaîne d'événements cachée dans le monde pour le récupérer"
 cob_7899_scenerio.9999.a:0 "Je dois vraiment arrêter de boire..."
 cob_7899_scenerio.9999.b:0 "JE FAIS CE QUE JE VEUX (n'appuyez pas là-dessus, mais vous le ferez quand même)"

 cob_decisions.0001.t:0 "Un Message de Valyria ?"
 cob_decisions.0001.desc:0 "Je contemple la lettre dans ma main avec une incrédulité totale. Quelqu'un nommé [dragonlord_of_valyria.GetName] prétend avoir repeuplé Valyria et invite tous les chevaucheurs de dragons à revenir pour revendiquer leur droit de naissance. J'ai apprécié ma vie de dragonnier en ce monde et j'ignore si je souhaite vivre sous l'autorité d'autrui..."
 cob_decisions.0001.a:0 "J'accepterai la proposition de [dragonlord_of_valyria.GetNamePossessive]"
 cob_decisions.0001.b:0 "Je dois décliner et trouver ma propre voie"

 cob_decisions.0002.t:0 "Une Proposition Acceptée"
 cob_decisions.0002.desc:0 "Je contemple le parchemin dans mes mains et célèbre silencieusement ma bonne fortune. [dragonlord.GetName] a accepté ma proposition et souhaite se rendre immédiatement à ma cour. Ce jour est véritablement glorieux pour Valyria."
 cob_decisions.0002.a:0 "Je ferai les préparatifs pour les recevoir"

 cob_decisions.0003.t:0 "Une Proposition Rejetée"
 cob_decisions.0003.desc:0 "Je ne puis croire les mots que je lis... [dragonlord.GetName] a rejeté ma proposition de venir en Valyria et de revendiquer son droit de naissance. C'est véritablement un revers, mais peut-être qu'une fois que j'aurai accumulé plus de puissance et de titres, je pourrai tenter de les séduire à nouveau avec plus de succès..."
 cob_decisions.0003.a:0 "Nous poursuivrons notre route"



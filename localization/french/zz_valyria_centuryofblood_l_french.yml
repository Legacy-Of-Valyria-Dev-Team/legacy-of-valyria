#Events
# lv_scenerio_cob:0 "The Century of Blood"
 cob_7899_scenerio.0001.t:0 "Le Roi de l'Orage et des Rivières"
 cob_7899_scenerio.0001.desc:0 "C'est une époque de richesse et de prospérité pour le Royaume de l'Orage et des Rivières. Depuis que mon ancêtre [arlan.GetName] a uni les deux empires en un seul et détruit le roi prétendant [lucifer.GetFirstName], la lignée de [benedict.GetName] s'est éteinte. La Maison Durrandon demeure les seuls Rois du Trident et des Terres de l'Orage.\n\nMais tout n'est pas ce qu'il paraît. La discorde grandit au sein du royaume... De l'Ouest parviennent des rumeurs selon lesquelles les Fer-nés sous [qhorwyn.GetName] s'agitent avec peut-être l'ambition de conquérir les richesses du Trident. On murmure aussi qu'un membre survivant de la Maison Justman répand la parole qu'il est le souverain légitime du Trident... Un autre Justman qui désire être libéré de cette enveloppe mortelle pour s'assurer que le cerf continue de régner sur les Rivières et l'Orage."
 cob_7899_scenerio.0001.a:0 "Ours is the Fury"

 cob_7899_scenerio.0002.t:0 "L'Exilé et la Rêveuse"
 cob_7899_scenerio.0002.desc:0 "Le [doom|E] s'est abattu sur Valyria exactement comme [dreamer.GetFirstName] l'avait prédit. Si je n'avais pas agi quand je l'ai fait, vendant toutes les richesses de notre famille et déménageant vers cet avant-poste volcanique lugubre, notre famille aurait sûrement été détruite. Les [valyrian_freehold_short|E] sont passées de la force la plus puissante du monde à l'ombre d'un néant en quelques heures. La Maison Targaryen pourrait très bien être la famille la plus puissante qui reste.\n\nJe dois réfléchir à ce que l'avenir réserve à moi-même et à ma famille. Bâtissons-nous nos terres et maintenons-nous la volonté des [valyrian_freehold_short|E] dans cet avant-poste singulier, ou étendons-nous à nouveau l'influence des [valyrian_freehold_short|E] sur les Cités Libres et, peut-être, sur [westeros|E] lui-même ?"
 cob_7899_scenerio.0002.a:0 "Feu et Sang"

 cob_7899_scenerio.0003.t:0 "Le Roi du Sel et de la Mer"
 cob_7899_scenerio.0003.desc:0 "Mon heure approche... Je sens [ROOT.Char.GetFaith.HighGodName] m'appeler depuis ses salles aquatiques alors que cette maladie incessante s'empare de mon corps frêle et vieux. Depuis le décès de mon premier fils, [harmund.GetName], mon deuxième fils [harlan.GetName] s'est épanoui, gérant les affaires du royaume alors que j'ai été lentement submergé par la maladie.\n\n[harwyn.GetName], mon troisième fils qui est parti chercher la gloire dans les Cités Libres, est revenu avec des intentions inconnues. Je ne peux que supposer qu'il a entendu dire que j'étais malade et aux portes de la mort depuis ce qui semble être des lustres maintenant et veut venir revendiquer l'héritage qu'il croit lui être dû.\n\nSeul le temps dira maintenant quand [ROOT.Char.GetFaith.HighGodName] m'appellera dans ses salles aquatiques, pour l'instant je ne peux qu'imaginer ce qui adviendra du royaume que j'ai travaillé si diligemment à bâtir."
 cob_7899_scenerio.0003.a:0 "Ce qui est mort ne peut jamais mourir"

 cob_7899_scenerio.0004.t:0 "Le Roi du Roc"
 cob_7899_scenerio.0004.desc:0 "La nouvelle a atteint Castral Roc que Valyria a été détruite dans un cataclysme d'une destruction inouïe. Presque l'intégralité de l'Empire des [dragonlord|E] a péri avec leurs dragons, laissant les anciennes terres mûres pour le pillage si un dirigeant ambitieux choisit de profiter de la situation. Peut-être que toute la richesse et la magie n'ont pas été détruites... La Maison Lannister pourrait définitivement cimenter sa place comme la maison la plus riche et la plus puissante à honorer [westeros|E] pour toujours..."
 cob_7899_scenerio.0004.a:0 "Ce n'est qu'un rêve insensé, je devrais concentrer mon attention ici"
 cob_7899_scenerio.0004.a_tt:0 "Vous choisissez de ne pas risquer la mort et de rester à Castral Roc"
 cob_7899_scenerio.0004.b:0 "Il y a une opportunité qui m'attend à Valyria que je ne peux ignorer"
 cob_7899_scenerio.0004.b_tt:0 "Vous choisissez de tout risquer pour voyager jusqu'aux vestiges de Valyria"

 cob_7899_scenerio.0005.t:0 "L'Héritier des [valyrian_freehold_short|E]"
 cob_7899_scenerio.0005.desc:0 "Les [valyrian_freehold_short|E] sont tombées... Je n'ai reçu aucune réponse à ma correspondance depuis des lustres... Je ne peux que supposer que les rumeurs de ce que les gens appellent un '[doom|E]' sont vraies.\n\nJ'ai rassemblé une force de soldats parmi les Qhohoriens dans le but de voler avec [vassarion.GetName] jusqu'à ce qui reste de Valyria... J'espère restaurer l'ordre dans ce monde une fois de plus... Cependant, si les rumeurs sont exactes et que les [valyrian_freehold_short|E] ne sont plus que cendres, peut-être que cette armée serait mieux employée à soumettre les Cités Libres sous mon règne... tout ce que je sais, c'est que je dois faire marcher cet ost vers le sud depuis [location.GetName] pour découvrir par moi-même ce qu'il est advenu de ma patrie..."
 cob_7899_scenerio.0005.a:0 "Je retournerai aux [valyrian_freehold_short|E] et revendiquerai ce qui reste"
 cob_7899_scenerio.0005.a_tt:0 "Voyager vers le Ny Sar"

 cob_7899_scenerio.0006.t:0 "L'Héritier du Roi du Conflans"
 cob_7899_scenerio.0006.desc:0 "Mon grand ancêtre [lucifer.GetFirstName], le légitime Roi du Conflans du Trident, se déclara le dernier descendant vivant de [benedict.GetName]. Il fut tué par [arlan.GetName], afin que les Rois de l'Orage maintiennent leur domination illégitime sur le Royaume du Trident.\n\nPendant des siècles, la lignée de la Maison Justman est restée dans l'ombre, évitant la fureur des Rois de l'Orage, qui pourrait mener à notre extinction. Je ne peux plus continuer cette tradition... Je dois partir et rassembler des alliés afin de pouvoir faire valoir ma revendication sur les terres de mes ancêtres\n\nMaintenant, je dois décider où je voyagerai... Les terres fertiles du Bief ? Les richesses des Terres de l'Ouest ? Ou les montagnes du Val ?"
 cob_7899_scenerio.0006.a:0 "Chercher l'aide du Bief"
 cob_7899_scenerio.0006.a_tt:0 "Voyager vers Hautjardin"
 cob_7899_scenerio.0006.b:0 "Chercher l'aide du Roc"
 cob_7899_scenerio.0006.b_tt:0 "Voyager vers Castral Roc"
 cob_7899_scenerio.0006.c:0 "Chercher l'aide du Val"
 cob_7899_scenerio.0006.c_tt:0 "Voyager vers les Eyrié"
 cob_7899_scenerio.0006.d:0 "Partir seul"

 #Tommen Events

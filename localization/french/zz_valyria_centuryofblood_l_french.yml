# lv_scenerio_cob:0 "The Century of Blood"
 cob_7899_scenerio.0001.t:0 "Le Roi des Orages et des Rivières"
 cob_7899_scenerio.0001.desc:0 "C'est une ère de richesse et de prospérité pour le Royaume des Orages et des Rivières. Depuis que mon ancêtre [arlan.GetName] unifia les deux empires en un seul et détruisit le roi prétendant [lucifer.GetFirstName], la lignée de [benedict.GetName] s'est éteinte. La Maison Durrandon demeure les seuls Rois du Trident et des Terres de l'Orage.\n\nTout n'est pas aussi serein qu'il y paraît. La discorde croît au sein du royaume... De l'Ouest parviennent des rumeurs selon lesquelles les Fer-nés sous [qhorwyn.GetName] s'agitent, peut-être avec l'ambition de conquérir les richesses du Trident. L'on murmure également qu'un membre survivant de la Maison Lejuste répand la parole qu'il est le souverain légitime du Trident... Un autre Lejuste qui désire être libéré de cette enveloppe mortelle pour s'assurer que le cerf continue de régner sur les Rivières et les Orages."
 cob_7899_scenerio.0001.a:0 "Notre est la Fureur"

 cob_7899_scenerio.0002.t:0 "L'Exilé et la Rêveuse"
 cob_7899_scenerio.0002.desc:0 "Le [doom|E] s'est abattu sur [valyria|E] exactement comme [dreamer.GetFirstName] l'avait prévu. Si je n'avais point agi quand je l'ai fait, vendant toute la fortune de notre famille et nous établissant sur ce morne avant-poste volcanique, notre famille aurait assurément été anéantie. Le [valyrian_freehold_short|E] passa de la force la plus puissante du monde à l'ombre d'un néant en l'espace de quelques heures. La Maison Targaryen pourrait bien être la famille la plus puissante qui reste.\n\nJe dois méditer sur ce que l'avenir réserve à moi-même et à ma famille. Devons-nous développer nos terres et maintenir la volonté du [valyrian_freehold_short|E] dans cet unique avant-poste, ou devons-nous étendre à nouveau l'influence du [valyrian_freehold_short|E] sur les [free_cities|E] et, peut-être, sur [westeros|E] même ?"
 cob_7899_scenerio.0002.a:0 "Feu et Sang"

 cob_7899_scenerio.0003.t:0 "Le Roi du Sel et de la Mer"
 cob_7899_scenerio.0003.desc:0 "Mon heure approche... Je sens [ROOT.Char.GetFaith.HighGodName] m'appeler depuis ses salles aquatiques tandis que cette maladie incessante s'empare de mon corps fragile et vieillissant. Depuis le trépas de mon premier fils, [harmund.GetName], mon second fils [harlan.GetName] s'est révélé, gérant l'administration du royaume alors que la maladie me consumait lentement.\n\n[harwyn.GetName], mon troisième fils parti chercher la gloire dans les [free_cities|E], est revenu avec des intentions obscures. Je ne puis que supposer qu'il a appris que je suis souffrant et aux portes de la mort depuis ce qui semble une éternité, et qu'il souhaite revendiquer l'héritage qu'il croit lui revenir.\n\nSeul le temps dira quand [ROOT.Char.GetFaith.HighGodName] m'appellera dans ses salles aquatiques ; pour l'heure, je ne puis qu'imaginer ce qu'il adviendra du royaume que j'ai œuvré si diligemment à bâtir."
 cob_7899_scenerio.0003.a:0 "Ce qui est mort ne saurait mourir"

 cob_7899_scenerio.0004.t:0 "Le Roi du Roc"
 cob_7899_scenerio.0004.desc:0 "La nouvelle est parvenue à Castral Roc que [valyria|E] a été détruite dans un cataclysme d'une destruction indicible. La quasi-totalité de l'Empire des [dragonlord|E] a péri avec leurs [dragons_plural|E], laissant les anciennes terres mûres pour le pillage si un souverain ambitieux choisissait de tirer avantage de cette situation. Peut-être que toutes les richesses et la magie n'ont pas été détruites... La Maison Lannister pourrait asseoir définitivement sa place comme la maison la plus riche et la plus puissante que [westeros|E] ait jamais connue, pour l'éternité..."
 cob_7899_scenerio.0004.a:0 "Ce n'est qu'un rêve de fou, je devrais concentrer mon attention ici"
 cob_7899_scenerio.0004.a_tt:0 "Vous choisissez de ne pas risquer la mort et de demeurer à Castral Roc"
 cob_7899_scenerio.0004.b:0 "Une opportunité m'attend en [valyria|E] que je ne puis ignorer"
 cob_7899_scenerio.0004.b_tt:0 "Vous choisissez de tout risquer pour voyager vers les vestiges de [valyria|E]"

 cob_7899_scenerio.0005.t:0 "L'Héritier du [valyrian_freehold_short|E]"
 cob_7899_scenerio.0005.desc:0 "Le [valyrian_freehold_short|E] est tombé... Je n'ai reçu aucune réponse à ma correspondance depuis des lustres... Je ne puis que supposer que les rumeurs de ce que les gens appellent un « [doom|E] » sont vraies.\n\nJ'ai assemblé une force de soldats parmi les Qohoriens dans le dessein de voler avec [vassarion.GetName] jusqu'à ce qui reste de [valyria|E]... J'espère restaurer l'ordre en ce monde une fois encore... Cependant, si les rumeurs s'avèrent exactes et que le [valyrian_freehold_short|E] n'est plus que cendres, peut-être cette armée serait-elle mieux employée à soumettre les [free_cities|E] sous mon autorité... tout ce que je sais, c'est que je dois mettre cet ost en marche vers le sud depuis [location.GetName] pour découvrir par moi-même ce qu'il est advenu de ma patrie..."
 cob_7899_scenerio.0005.a:0 "Je retournerai au [valyrian_freehold_short|E] et revendiquerai ce qui en reste"
 cob_7899_scenerio.0005.a_tt:0 "Voyager vers Ny Sar"

 cob_7899_scenerio.0006.t:0 "L'Héritier du Roi du Conflans"
 cob_7899_scenerio.0006.desc:0 "Mon illustre ancêtre [lucifer.GetFirstName], le légitime Roi du Conflans du Trident, se proclama dernier descendant vivant de [benedict.GetName]. Il fut occis par [arlan.GetName], afin que les Rois de l'Orage maintiennent leur domination illégitime sur le Royaume du Trident.\n\nPendant des siècles, la lignée de la Maison Lejuste est demeurée dans l'ombre, évitant la fureur des Rois de l'Orage, qui pourrait mener à notre extinction. Je ne puis plus perpétuer cette tradition... Je dois partir et rassembler des alliés afin de faire valoir mes droits sur les terres de mes ancêtres.\n\nÀ présent, je dois décider où je me rendrai... Les terres fertiles du Bief ? Les richesses des Terres de l'Ouest ? Ou les montagnes du Val ?"
 cob_7899_scenerio.0006.a:0 "Chercher l'aide du Bief"
 cob_7899_scenerio.0006.a_tt:0 "Voyager vers Hautjardin"
 cob_7899_scenerio.0006.b:0 "Chercher l'aide du Roc"
 cob_7899_scenerio.0006.b_tt:0 "Voyager vers Castral Roc"
 cob_7899_scenerio.0006.c:0 "Chercher l'aide du Val"
 cob_7899_scenerio.0006.c_tt:0 "Voyager vers Les Eyrié"
 cob_7899_scenerio.0006.d:0 "Partir seul"


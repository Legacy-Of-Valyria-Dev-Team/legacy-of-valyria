 #7899
 zz_valyria_centuryofblood:0 "The Century of Blood"
 zz_valyria_centuryofblood_group:0 "After the Doom"
 zz_valyria_centuryofblood_desc:0 "Les Possessions Valyriennes se sont effondrées, anéanties lorsque la péninsule fut détruite par la Fléau. En l’espace de quelques heures à peine, Valyria avait disparu et les Possessions étaient détruites. La maison Targaryen, qui s’était établie à Peyredragon, l’avant-poste le plus occidental de Valyria situé dans la mer étroite, assura ainsi sa survie.\n\nQuelques autres seigneurs-dragons — ceux qui n’étaient pas présents à Valyria lors du Fléau — survécurent également. À Tyrosh, Lys et Qohor, il est dit que des seigneurs-dragons échappèrent à la destruction, mais qu'ils demeuraient incertains quant à leur avenir. #bold\n\nAurion Varezys, un seigneur-dragon en visite à Qohor, se proclama premier Empereur de Valyria et leva des forces parmi les Qohoriens. Avec son dragon et une armée de trente mille hommes, il marche pour revendiquer les vestiges de Valyria...#!"

 bookmark_99_arrec_durrandon:0 "Roi Arrec"
 bookmark_99_arrec_durrandon_desc:0 "Arrec Durrandon, Roi des Terres de l'Orage ainsi que des riches Terres de la Rivière conquises par son ancêtre Arlan III Durrandon trois siècles auparavant, siège sur le Trône du Roi de l'Orage. Cependant, son règne n'est pas assuré, car nombre des autres rois de [westeros|E] convoitent toujours la richesse potentielle que recèlent les Terres de la Rivière. À l’ouest, les Fer-nés commencent à s’agiter, nourrissant peut-être l’ambition de reprendre les Terres de la Rivière aux Rois de l’Orage"
 bookmark_99_erich_durrandon:0 "Erich Durrandon"
 bookmark_99_monfryd_durrandon:0 "Monfryd Durrandon"

 bookmark_99_aenar_targaryen:0 "Roi Aenar"
 bookmark_99_aenar_targaryen_desc:0 "Douze ans avant le [doom_of_valyria|E], Daenys la Rêveuse, fille d'Aenar, prophétisa la destruction de Valyria. En réponse, Aenar vendit ses possessions dans les [valyrian_freehold|E] et les Terres de l'Été Constant, puis s'exila avec sa famille et ses dragons à Peyredragon, l'avant-poste le plus occidental des [valyrian_freehold|E]. Les Targaryen n’étaient pas les plus puissants parmi les Lords dragons, et leurs rivaux virent leur fuite comme un acte de lâcheté. Pourtant, parce qu’Aenar avait éloigné sa famille de Valyria, les Targaryen furent les plus puissants des Lords dragons ayant survécu au [doom|E]"
 bookmark_99_gaemon_targaryen:0 "Gaemon Targaryen"
 bookmark_99_daenys_targaryen:0 "Daenys 'la Rêveuse' Targaryen"

 bookmark_99_qhorwyn_hoare:0 "Roi Qhorwyn"
 bookmark_99_qhorwyn_hoare_desc:0 "Qhorwyn fut un roi avisé des Îles de Fer, évitant les guerres et accumulant plutôt richesses durant son règne. Il tripla la taille des flottes de la maison Hoare et ordonna la fabrication d’armes supplémentaires pour dissuader toute attaque ennemie.\n\nLe troisième fils de Qhorwyn, Harwyn, revint aux Îles de Fer après deux années d’aventures pour trouver son père affaibli et malade, tandis que son frère Harlan se préparait à assumer la couronne de Roi des Îles de Fer. Tous deux ambitionnent de prendre la puissance militaire paternelle pour s’emparer du Royaume du Conflans détenu par les Durrandon. La seule question qui demeure est de savoir s'ils sauront unir leurs forces pour réaliser ce dessein, ou si l'un tentera de s'emparer du pouvoir au détriment de l'autre."
 bookmark_99_harlan_hoare:0 "Harlan Hoare"
 bookmark_99_harwyn_hoare:0 "Harwyn Hoare"

 bookmark_99_tommen_lannister:0 "Roi Tommen II"
 bookmark_99_tommen_lannister_desc:0 "Tommen II Lannister, connu sous le nom de Roi-Lion, est le Roi du Roc de la maison Lannister. Ayant entendu parler de l'effondrement possible des [valyrian_freehold|E] dans un [doom|E] de feu, il se prépare à lancer une expédition vers l'ancienne [the_freehold|E] afin d'y piller les richesses et les savoirs magiques qui s'y trouveraient encore. L'expédition promet d'être périlleuse, et la question se pose : Tommen II doit-il tout risquer pour retourner à Valyria, ou bien profiter de l'immense vide de pouvoir laissé par la chute des [the_freehold|E] pour s'emparer de [essos|E] et étendre la richesse et le nom des Lannister à travers le monde connu ?"
 bookmark_99_ellyn_tarbeck:0 "Ellyn Tarbeck"
 bookmark_99_tyrion_lannister:0 "Tyrion Lannister"

 bookmark_99_aurion_varezys:0 "Archonte Aurion"
 bookmark_99_aurion_varezys_desc:0 "[Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_copy|q$' )|E]\nAurion Varezys, l’un des rares seigneurs-dragons survivants bloqués à Qohor, a levé des forces parmi les colons qohoriens et s’est proclamé premier Archonte de Valyria. Juché sur son [dragon|E], lui et ses trente mille hommes marchent pour revendiquer ce qui subsiste de Valyria, ou peut-être pour créer une Nouvelle Valyria par la conquête des cités libres d’[essos|E].\n\n#bold Aurion risquera-t-il tout pour réclamer son ancien foyer, ou choisira-t-il de forger une nouvelle voie afin que le rêve de Valyria demeure vivant dans l'esprit du monde ?#!"

 bookmark_99_lucifer_justman:0 "Roi du Conflans Lucifer"
 bookmark_99_lucifer_justman_desc:0 "Trois siècles après qu’un précédent Lucifer Justman se soit proclamé Roi du Conflans par droit du sang, un nouveau prétendant à la couronne du Conflans a débarqué dans la baie de La Nera. Se tenant sur les rivages du petit village de pêcheurs à l’embouchure du Trident, Lucifer doit choisir son chemin pour revendiquer les terres de ses ancêtres. Quel royaume serait le plus avantageux pour évincer les Durrandon de leurs terres ancestrales ? Les Jardiniers de Hautjardin, les Lannister de Castral Roc ou les Arryn du Val ?"


 cob_7899_scenerio.0525.t:0 "Rencontre avec un Centurion Valyrien"
 cob_7899_scenerio.0525.desc:0 "Nous traversons les terres en ruines de [location.GetName], l'air chargé de fumée volcanique et de cendres qui obscurcissent la vue tout en étouffant le souffle de tous ceux qui m'accompagnent. Je décide que nous devrions prendre un moment pour nous repérer et appelle à ce qu'on m'amène [vassarion.GetName] afin que je puisse voler au-dessus des nuages. Tandis que j'attends, l'un de mes éclaireurs lance un cri et je me tourne pour voir un groupe de silhouettes qui semblent être des soldats valyriens émergeant de la brume, armés d'arbalètes et d'épées. L'un du groupe, vêtu des habits déchirés d'un Général Valyrien, sort de la brume pour se tenir devant moi.\n\n« Je suis [freeholder_survivor.GetName] et votre ost est encerclé. [location.GetName] a été revendiqué par nous et vous vous rendrez à moi. »\n\nJe dois maintenant décider quoi faire. Dois-je tenter d'affronter [freeholder_survivor.GetName] en combat singulier ? Envoyer [vassarion.GetName] combattre ? Ou devrions-nous battre en retraite?"
 cob_7899_scenerio.0525.a:0 "J'affronterai [freeholder_survivor.GetName] moi-même"
 cob_7899_scenerio.0525.a_tt:0 "Un duel commence avec [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b:0 "Vous affronterez [vassarion.GetName] !"
 cob_7899_scenerio.0525.b_1_tt:0 "[freeholder_survivor.GetName] meurt !"
 cob_7899_scenerio.0525.b_2_tt:0 "[vassarion.GetName] meurt !"
 cob_7899_scenerio.0525.b.win:0 "[vassarion.GetName] tue [freeholder_survivor.GetName]"
 cob_7899_scenerio.0525.b.dead:0 "[freeholder_survivor.GetName] parvient à survivre face à [vassarion.GetName]"
 cob_7899_scenerio.0525.c:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0525.c_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0527.t:0 "Pris en Embuscade par un Seigneur Dragon"
 cob_7899_scenerio.0527.desc:0 "Alors que je vole sur [vassarion.GetName] à l'avant-garde de mon ost au-dessus des ruines de [location.GetName], un cri perçant déchire l'air, suivi d'une énorme boule de flamme draconique qui a failli tout incinérer autour de moi.\n\nJe me réoriente pour scruter les nuages au-dessus à la recherche du [dragon|E] sauvage qui aurait pu survivre au cataclysme pour m'attaquer. Peu de temps après, l'agresseur se fait connaître car, à ma grande surprise, le [dragon|E] a un cavalier qui fait planer sa bête tout aussi massive devant moi. Je décide de parler avec [freeholder_dragonlord.GetHerHim] avant une nouvelle attaque.\n\n« Je suis [aurion.GetName] et je suis revenu sur ces terres pour les reprendre au nom de Valyria », crié-je en direction du [dragonlord|E].\n\n« Je m'en moque, [aurion.GetName], je suis [freeholder_dragonlord.GetName], cavalier de [enemy_dragon.GetName], et je revendique toutes ces terres sur lesquelles vous êtes en train d'empiéter. »"
 cob_7899_scenerio.0527.a:0 "J'affronterai [freeholder_dragonlord.GetName] et son [dragon|E]"
 cob_7899_scenerio.0527.a_tt:0 "Un duel de [dragon|E] commence avec [freeholder_dragonlord.GetName]"
 cob_7899_scenerio.0527.b:0 "Je dois battre en retraite !"
 cob_7899_scenerio.0527.b_tt:0 "Vous vous échappez"

 cob_7899_scenerio.0529.t:0 "Un Retour Doux-amer"
 cob_7899_scenerio.0529.desc:0 "Je descends du navire sur les quais de pierre en ruine de [location.GetName], mes yeux fixés sur les portes carbonisées et ruinées de la capitale valyrienne.\n\n« Je suis chez moi », pensé-je. « Je suis enfin chez moi... mais il reste encore beaucoup à accomplir avant que le [valyrian_freehold_short|E] ne se relève à nouveau. »\n\nJe m'agenouille et pose ma main sur la pierre chaude du quai pour un bref instant, puis je relève la tête et me mets en route pour restaurer une fois de plus les ruines de cette puissante cité..."
 cob_7899_scenerio.0529.a:0 "Je suis revenu chez moi, à Valyria..."


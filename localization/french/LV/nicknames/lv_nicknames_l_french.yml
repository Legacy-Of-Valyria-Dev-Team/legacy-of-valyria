 nick_the_ironshark:0 "Le Requin de Fer"
 nick_the_ironshark_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] Connu pour sa férocité implacable, ce pillard infâme s'est forgé son nom en dépeçant des flottes entières dans les eaux périlleuses de la Baie des Serfs. Tel un prédateur des profondeurs, il frappait sans avertissement, sa galère noire ne laissant aucun survivant pour en conter l'histoire.


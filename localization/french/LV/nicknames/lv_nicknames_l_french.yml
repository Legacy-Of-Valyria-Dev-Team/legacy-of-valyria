l_french:
  nick_the_wyrmslayer:0 "le Tueur de Veurs"
  nick_the_wyrmslayer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] réputé pour avoir terrassé un veur de feu colossal."
  nick_the_wyvernslayer:0 "le Tueur de Vouivres"
  nick_the_wyvernslayer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] célèbre pour avoir abattu une vouivre monstrueuse."
  nick_the_phoenix:0 "le Phénix"
  nick_the_phoenix_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] renommé pour avoir rendu à Gogossos sa gloire d'antan et l'avoir élevée au rang de cité libre."
  nick_the_lantern_of_the_sea:0 "La Lanterne de la Mer"
  nick_the_lantern_of_the_sea_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] légendaire pour avoir navigué maintes fois jusqu'à Asshaï et en être revenu, éclairant la route des voies commerciales sûres à travers les mers périlleuses."
  nick_the_salt_wyrm:0 "Le Veur de Sel"
  nick_the_salt_wyrm_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] Le tristement célèbre seigneur pirate des Îles du Basilic."
  nick_the_ironshark:0 "Le Requin de Fer"
  nick_the_ironshark_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] Réputé pour sa férocité implacable, cet infâme pillard gagna son nom en déchiquetant des flottes entières dans les eaux traîtresses de la Baie des Serfs. Tel un prédateur des profondeurs, il frappait sans avertissement, sa galère noire ne laissant nul survivant pour conter le récit de son passage.

  nick_the_archmage:0 "l'Archimage"
  nick_the_archmage_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] renommé pour sa maîtrise encyclopédique des mystères de la magie."
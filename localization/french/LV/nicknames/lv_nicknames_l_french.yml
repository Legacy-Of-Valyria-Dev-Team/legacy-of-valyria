l_french:
  nick_the_wyrmslayer:0 "le Tue-Vouivre"
  nick_the_wyrmslayer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] connu(e) pour avoir occis une vouivre de feu gigantesque"
  nick_the_wyvernslayer:0 "le Tueur de Wyverne"
  nick_the_wyvernslayer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] connu(e) pour avoir occis une wyverne colossale"
  nick_the_phoenix:0 "le Phénix"
  nick_the_phoenix_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] connu(e) pour avoir restauré Gogossos à sa gloire d'antan et l'avoir élevée au rang de cité libre"
  nick_the_lantern_of_the_sea:0 "La Lanterne des Mers"
  nick_the_lantern_of_the_sea_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] connu(e) pour avoir navigué maintes fois vers Asshaï et en être revenu(e), illuminant la voie des routes commerciales sûres"
  nick_the_salt_wyrm:0 "La Vouivre des Sels"
  nick_the_salt_wyrm_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] le notoire seigneur pirate des îles du Basilic"
  nick_the_ironshark:0 "Le Requin de Fer"
  nick_the_ironshark_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] connu(e) pour sa férocité implacable, cet infâme écumeur a gagné son nom en déchiquetant des flottes dans les eaux perfides de la Baie des Serfs. Tel un prédateur des profondeurs, il frappait sans prévenir, sa galère noire ne laissant nul survivant pour conter l'histoire"

  nick_the_archmage:0 "l'Archimage"
  nick_the_archmage_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] connu(e) pour sa maîtrise encyclopédique des mystères de la magie"
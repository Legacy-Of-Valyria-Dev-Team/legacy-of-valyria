    # Special Buildings And Ruins #
 
 building_bloodstone_mines_1:0 "Mines de Pierre-de-Sang Inexploitées"
 building_type_bloodstone_mines_1:0 "Mines de Pierre-de-Sang"
 building_bloodstone_mines_1_desc:0 "Une étendue de falaises abruptes qui séparent la jungle de la mer en contrebas. Cette formation rocheuse semble riche en fer et en un minéral vert-rouge connu sous le nom de pierre-de-sang.\n\nCette pierre semi-précieuse semble avoir une importance culturelle pour les autochtones régionaux, qui la collectent à la main, sans aucun outil ni technique d'extraction. L'exploitation de ces falaises serait hautement profitable, bien que sacrilège pour les natifs."
 
 building_bloodstone_mines_2:0 "Mines de Pierre-de-Sang"
 building_type_bloodstone_mines_2:0 "Mines de Pierre-de-Sang"
 building_bloodstone_mines_2_desc:0 "Une étendue de falaises abruptes qui séparent la jungle de la mer en contrebas. Cette formation rocheuse semble riche en fer et en un minéral vert-rouge connu sous le nom de pierre-de-sang.\n\nDésormais exploitée à son plein potentiel, des puits de mine et des outils extraient maintenant fer et pierres précieuses à des taux hautement efficaces."


 building_green_gate_1:0 "La Porte Verte"
 building_type_green_gate_1:0 "La Porte Verte"
 building_green_gate_1_desc:0 "Un treillis impressionnant de formations rocheuses en forme de lances au point de convergence des murs de pierre-de-sang est-ouest. Les lances de roche forment une canopée presque complète au-dessus de l'entrée de la vallée ombragée. Cette 'porte' apparemment naturelle est le seul chemin terrestre vers les Plaines Centrales de Sothoryos.\n\nLes nombreuses cavités et recoins dans ce treillis de roche abritent *également* une colonie de perchoirs de vouivres vraiment massive. Les navires ne peuvent s'approcher trop près de cette zone, sous peine d'être vidés de tout leur équipage. Si la menace des vouivres pouvait être éliminée, cette porte serait la clé pour tenir les vastes plaines fertiles du sud contre tout envahisseur maritime."
 
 building_green_gate_2:0 "Porte Verte Fortifiée"
 building_type_green_gate_2:0 "Mines de Pierre-de-Sang"
 building_green_gate_2_desc:0 "Un treillis impressionnant de formations rocheuses en forme de lances au point de convergence des murs de pierre-de-sang est-ouest. Les lances de roche forment une canopée presque complète au-dessus de l'entrée de la vallée ombragée. Cette 'porte' apparemment naturelle est le seul chemin terrestre vers les Plaines Centrales de Sothoryos.\n\nLes vouivres éliminées, le col a été fortifié et un port a été érigé dans le havre profond trouvé à son embouchure."
 
 
 building_cos_corpse_mound_1:0 "Monticules de Cadavres Défrichés"
 building_type_cos_corpse_mound_1:0 "Monticules de Cadavres"
 building_cos_corpse_mound_1_desc:0 "Cette clairière de jungle abritait autrefois les infâmes Monticules de Cadavres des Abysses du Basilic. Les natifs de cette région transportaient tous les 'envahisseurs' vaincus depuis le rivage, avec toutes leurs possessions étrangères pour être entassées ici ; la croyance locale étant que tous les objets étrangers sont maléfiques et donc, doivent être laissés aux 'dieux'. Les dieux en question étant les centaines de basilics qui convergeaient ici pour se repaître des corps laissés derrière.\n\nAvec les corps et artefacts déblayés, les basilics se sont à nouveau dispersés dans les profondeurs de la jungle. La clairière possède toujours une odeur nauséabonde et une aura de désespoir."
 
 building_cos_corpse_mound_2:0 "Vastes Monticules de Cadavres"
 building_type_cos_corpse_mound_2:0 "Monticules de Cadavres"
 building_cos_corpse_mound_2_desc:0 "Entassés dans une clairière de jungle se dressent des monticules constitués de milliers de corps et d'artefacts en ruine, peut-être des ordres de grandeur supérieurs. Les natifs de cette région transportent tous les 'envahisseurs' vaincus depuis le rivage, avec toutes leurs possessions étrangères pour être entassées ici ; la croyance locale étant que tous les objets étrangers sont maléfiques et donc, doivent être laissés aux 'dieux'. Les dieux en question étant les centaines de basilics qui convergent ici pour se repaître des corps laissés derrière.\n\nBien qu'une grande partie de cet amas desséché par le soleil soit sans valeur à cause des âges passés, récupérer son contenu serait extrêmement lucratif ; bien que sacrilège pour les natifs."
 
 
 building_basilisk_point_ruins_1:0 "Ruines de la Pointe du Basilic"
 building_type_basilisk_point_ruins_1:0 "Pointe du Basilic"
 building_basilisk_point_ruins_1_desc:0 "Les anciennes ruines de plusieurs colonisations par les Ghiscaris, les Valyriens et bien plus tard les Rhoynars. Bien que les différents styles architecturaux s'entrechoquent constamment à travers les ruines, un donjon de pierre reste intact et défiant, semblant repousser la jungle envahissante. Une unique colonne de pierre noire huileuse jaillit du centre de la cour du donjon.\n\nBien qu'actuellement en état de délabrement, les bâtiments et fossés qui demeurent ici offrent encore une position défensive significative contre tout assaillant potentiel."
 
 building_basilisk_point_ruins_2:0 "Pointe du Basilic Restaurée"
 building_type_basilisk_point_ruins_2:0 "Pointe du Basilic"
 building_basilisk_point_ruins_2_desc:0 "Les ruines maintenant restaurées de la Pointe du Basilic. Les styles architecturaux contradictoires ont été partiellement démolis par endroits pour les concentrer et créer un effet de voyage dans le temps en marchant sur les routes pavées. De grands brûlis ont repoussé la jungle et une palissade défensive a été érigée comme défense secondaire aux murs de pierre maintenant restaurés. Avec le phare du donjon brûlant vivement, les habitants natifs vicieux de Sothoryos, sensibles ou non, craindront désormais cet endroit comme un phare de puissance."
 
 
 building_zamettar_ruins_1:0 "Ruines de Zamettar"
 building_type_zamettar_ruins_1:0 "Zamettar"
 building_zamettar_ruins_1_desc:0 "Les anciennes ruines de Zamettar, fondées à l'origine par les Ghiscaris et capturées plus tard par les Lords dragons des Possessions de Valyria, pendant la Quatrième Guerre Ghiscari. Finalement, l'environnement hostile de Sothoryos chassa les colons valyriens. Ce ne fut que plusieurs centaines d'années plus tard que les Rhoynars tentèrent de coloniser la ville, pour échouer pour la même raison que les Valyriens.\n\nLa jungle s'est frayé un chemin à travers la ville, des vignes escaladant chaque mur et des racines massives renversant les bâtiments de pierre. La jungle n'a cependant pas encore reconquis quelques quartiers de la ville ; ceux portant des colonnes de pierre noire huileuse en leur centre.\n\nRestaurer Zamettar serait une tâche exceptionnellement difficile, mais avec suffisamment de temps, d'efforts et d'or, cette ville pourrait à nouveau s'étendre jusqu'au delta du Zamoyos lui-même."
 
 building_zamettar_ruins_2:0 "Zamettar Restaurée"
 building_type_zamettar_ruins_2:0 "Zamettar"
 building_zamettar_ruins_2_desc:0 "Enfin restaurée à sa gloire première pour la première fois depuis l'âge de l'Ancienne Ghis, Zamettar grouille de nouveaux colons et de navires marchands étrangers. Des murs de pierre défendent maintenant en sécurité les nombreux habitants de la ville contre le pire de l'environnement et des brûlis réguliers aux lisières de la forêt repoussent le pire des insectes piqueurs. La jungle profonde a été repoussée jusqu'aux franges mêmes du delta et des palissades ont été érigées à ses frontières.\n\nAvec de l'eau douce puisée et bouillie du Zamoyos, les navires fréquentent les ports de Zamettar pour se ravitailler et se loger."
 
 
 building_balam_glade_1:0 "Clairières Ravagées de Balam"
 building_type_balam_glade_1:0 "Clairières de Balam"
 building_balam_glade_1_desc:0 "Les clairières cachées de Balam étaient un lieu hautement spirituel pour ceux de la foi de la Mère Verte. L'histoire orale raconte que c'est ici que la Mère Verte elle-même descendit sur le sol de la jungle pour sauver les Hommes Tachetés des fléaux qui les assiégeaient. La puissance de ses sortilèges divins fut telle que la jungle elle-même fut purgée de cette petite zone, laissant derrière elle une clairière fertile pour ses fidèles.\n\nLes clairières étaient considérées comme le principal site sacré de la Mère Verte et beaucoup de ses fidèles jurèrent de les défendre de leur vie... ils échouèrent.\n\nLes clairières ont depuis été livrées aux flammes et la jungle a empiété en leur absence. Il reste peu de la flore et de la faune originales de la clairière ; mais un zélote ou un érudit déterminé pourrait encore sauver ou même restaurer les clairières à leur splendeur d'antan."
 
 building_balam_glade_2:0 "Clairières Florissantes de Balam"
 building_type_balam_glade_2:0 "Clairières de Balam"
 building_balam_glade_2_desc:0 "Ces clairières cachées sont un lieu hautement spirituel pour ceux de la foi de la Mère Verte. L'histoire orale raconte que c'est ici que la Mère Verte elle-même descendit sur le sol de la jungle pour sauver les Hommes Tachetés des fléaux qui les assiégeaient. La puissance de ses sortilèges divins fut telle que la jungle elle-même fut purgée de cette petite zone, laissant derrière elle une clairière fertile pour ses fidèles.\n\nLes clairières sont considérées comme le principal site sacré de la Mère Verte et beaucoup de ses fidèles jurent de les défendre de leur vie."
 
 
 building_the_maw_1:0 "Colline de la Gueule"
 building_type_the_maw_1:0 "Colline de la Gueule"
 building_the_maw_1_desc:0 "De ce système de grottes effondré jaillissent les sources de la rivière tributaire Yeenos. Plus que cela cependant, c'était autrefois le centre de la religion de la Gueule Éternelle. Ses fidèles croient que le monde entier, ou au moins Sothoryos, est une entité unique qui dévore les faibles et nourrit les forts dans un cycle continu qui engendre des créatures toujours plus grandes et plus fortes.\n\nLes adeptes de cette religion apportaient leurs proies les plus audacieuses ou impressionnantes (animales ou autres) et les déposaient dans les chambres les plus externes de la grotte pour être 'dévorées' ; apaisant supposément la gueule et leur apportant du pouvoir. Quelle que soit la vérité, la rivière Yeenos qui coule à travers les fissures de l'entrée scellée de la grotte maintient la région assez fertile à ce jour.\n\nCertains fidèles plus zélés pourraient même souhaiter dégager l'entrée de la grotte et reprendre leurs pratiques macabres."
 
 building_the_maw_2:0 "La Gueule Dévorante"
 building_type_the_maw_2:0 "Colline de la Gueule"
 building_the_maw_2_desc:0 "De ce système de grottes massif jaillissent les sources de la rivière tributaire Yeenos. Plus que cela cependant, c'est le centre et un site sacré de la religion de la Gueule Éternelle. Ses fidèles croient que le monde entier, ou au moins Sothoryos, est une entité unique qui dévore les faibles et nourrit les forts dans un cycle continu qui engendre des créatures toujours plus grandes et plus fortes.\n\nLes adeptes de cette religion apportent leurs proies les plus audacieuses ou impressionnantes (animales ou autres) et les déposent dans les chambres les plus externes de la grotte pour être 'dévorées' ; apaisant ainsi la gueule et leur apportant du pouvoir. Quelle que soit la vérité, la rivière Yeenos qui coule d'ici semble rendre les régions extrêmement fertiles."
 
 
 building_yeen_ruins_1:0 "Cité en Ruines de Yeen"
 building_type_yeen_ruins_1:0 "Cité de Yeen"
 building_yeen_ruins_1_desc:0 "Une vaste cité en ruines qui s'étend plus loin que l'œil peut voir. Yeen est l'une des plus anciennes cités du monde connu, construite presque exclusivement en pierre noire huileuse, dont certaines pièces sont si grandes que plusieurs éléphants seraient nécessaires pour déplacer chacune d'elles.\n\nIl semble que la jungle ne puisse pénétrer dans Yeen. Les rues restent libres de toute végétation sauf la plus frêle et délicate. Il n'y a ni vignes obstructrices ni racines, juste beaucoup de terre meuble ; une ville usée par les intempéries, étrange, silencieuse et menaçante dans l'ensemble.\n\nBien que toutes les tentatives précédentes d'habiter cet endroit se soient terminées dans l'horreur... Sûrement une telle chose ne peut se reproduire. Après tout, comparé aux jungles vicieuses du Sothoryos profond, Yeen semble un havre remarquablement sûr."
 
 building_yeen_ruins_2:0 "Occupation Initiale (Yeen)" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_2:0 "Cité de Yeen"
 building_yeen_ruins_2_desc:0 "Suivant les traces d'innombrables expéditions maudites avant nous, un camp de base a été établi dans l'une des parties les plus défendables de la ville ; près des bateaux, au cas où une retraite hâtive serait nécessaire.\n\nLes faubourgs ont été principalement explorés maintenant. Des os éparpillés, des cadavres desséchés de bétail et de bêtes sothoryies, des armes et armures de divers âges et origines... est-ce une lame westerosie ? Peu importe. Les quartiers du centre-ville se sont révélés difficiles. Toutes nos équipes envoyées jusqu'à présent ne sont pas revenues. Étant donné les toiles d'araignées anormalement grandes qui s'entrecroisent dans les rues... nous avons au moins une idée du pourquoi.\n\nLes colons crient dans leur sommeil, une quantité anormalement élevée de cauchemars les tourmente, bien que cela soit compréhensible étant donné l'histoire de la région. Néanmoins, avec au moins les quartiers extérieurs cartographiés, nous devrions avoir un net avantage sur tous les envahisseurs. De plus, les reliques récupérées ici prendront des années à cataloguer et peut-être vendre, rapportant une belle somme d'or."
 
 building_yeen_ruins_3:0 "Restauration Extérieure (Yeen)"
 building_type_yeen_ruins_3:0 "Cité de Yeen"
 building_yeen_ruins_3_desc:0 "Les quartiers extérieurs ont été fortifiés et restaurés dans la mesure du possible. Tout envahisseur fait maintenant face à un labyrinthe de routes et de ruelles bloquées... bien que plus de colons continuent à disparaître, sans jamais être vus partant par les guetteurs. Les quartiers intérieurs ont bien sûr été bloqués, mais cela n'a pas aidé le moins du monde. Sans craintes de menaces extérieures pour l'instant, peut-être qu'une expédition plus militarisée au cœur de la ville pourrait être planifiée.\n\nD'autres rapports de cauchemars et de manque de sommeil tourmentent les guérisseurs déjà peu nombreux dans la région..."
 
 building_yeen_ruins_4:0 "Quartiers Intérieurs Repris (Yeen)" 
 building_type_yeen_ruins_4:0 "Cité de Yeen"
 building_yeen_ruins_4_desc:0 "À travers de grands efforts et pertes de vies, les quartiers intérieurs, moins quelques zones tenaces, ont été reconquis. Les coques viles et chitineuses d'attercopes ont été déblayées et certaines des ruines les plus majestueuses de la région ont déjà été revendiquées par ceux de plus haut rang.\n\nLes attercopes restantes ont été confinées principalement à un unique temple massif au cœur de Yeen. Les préparatifs pour purger correctement ceci prendront beaucoup de temps et seront probablement extrêmement dangereux. Les groupes refusent catégoriquement, même sous peine de mort, d'entrer à moins que leur propre seigneur ne les accompagne pour partager le risque.\n\nLes cauchemars s'aggravent et le manque de sommeil semble avoir induit des hallucinations éveillées chez certains."
 
 building_yeen_ruins_5:0 "Quartiers Intérieurs Restaurés (Yeen)" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_5:0 "Cité de Yeen"
 building_yeen_ruins_5_desc:0 "Les quartiers intérieurs de Yeen ont maintenant été restaurés à un état vraiment habitable. Les routes ont été dégagées, les entrepôts approvisionnés et les manoirs occupés. Il semble que les rues nécessitent une quantité remarquable de lanternes pour rester éclairées. Bien que les temples et palais soient fermés pour l'instant, à la suite de la dernière purge... Yeen est néanmoins devenue un centre commercial central pour tous ceux qui voyagent sur la rivière Zamoyos.\n\nLes cauchemars sont une occurrence nocturne pour ceux du quartier intérieur... C'est une réalité incontournable et beaucoup se tournent vers la douce libération d'un sommeil sans rêves induit par la drogue. Ceux qui ne peuvent se permettre de tels luxes souffrent en silence, sauf pour les cris d'un sommeil agité."
 
 building_yeen_ruins_6:0 "Grande Cité de Yeen" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_6:0 "Cité de Yeen"
 building_yeen_ruins_6_desc:0 "La ville a été restaurée et le mal habitant cet endroit a été banni... espérons-le pour de bon. Yeen est maintenant le havre sûr au cœur de la jungle qu'elle a toujours semblé être... pour l'instant."
 
 
 building_gold_mine_1:0 "Gisement d'Or"
 building_type_gold_mine_1:0 "Mine d'Or"
 building_gold_mine_1_desc:0 "On a toujours dit que Sothoryos possédait une grande richesse en minéraux et minerais. Les prospecteurs ont déterminé que cette zone est riche en quartz et en or."
 
 building_gold_mine_2:0 "Mine d'Or Prospère"
 building_type_gold_mine_2:0 "Mine d'Or"
 building_gold_mine_2_desc:0 "Non satisfaits de simples veines de surface, des tunnels profonds ont été creusés pour accéder aux gisements de quartz-or dans cette zone. Avec des équipes de 12 heures par travailleurs et de nouveaux tunnels ajoutés régulièrement, ce gisement extrait maintenant de l'or à un rythme stupéfiant."
 
 
 building_bloodletters_hall_1:0 "Salle du Saigneur Abandonnée"
 building_type_bloodletters_hall_1:0 "Salle du Saigneur"
 building_bloodletters_hall_1_desc:0 "Étant donné que la salle du Saigneur était dite composée de vignes et d'os, il n'est pas étonnant qu'il en reste peu après que de grands incendies l'aient rasée.\n\nSeul un bassin d'autel de pierre noire huileuse reste où se trouvait autrefois la chambre centrale. Fascinant, et sans source réelle visible, le bassin contient une petite quantité de sang frais.\n\nC'est ici que le Saigneur en chef vivait autrefois et menait ses pratiques viles. Si ses héritiers ou d'autres fidèles de leur dieu sombre reprennent jamais l'autel, ils pourraient tenter de faire repousser la Salle du Saigneur."
 
 building_bloodletters_hall_2:0 "Salle du Saigneur"
 building_type_bloodletters_hall_2:0 "Salle du Saigneur"
 building_bloodletters_hall_2_desc:0 "Les murs de la salle du Saigneur sont en fait composés de vignes entrelacées depuis la haute canopée des Arbres Exsangues. Ces vignes sont verrouillées ensemble avec une variété d'os d'apparence très humaine, les faisant fusionner avec le temps à cause de la tension.\n\nC'est ici que le Saigneur en chef réside et mène ses pratiques viles."

 
 building_gimlet_watch_1:0 "Ruines de la Garde de la Vrille"
 building_type_gimlet_watch_1:0 "Garde de la Vrille"
 building_gimlet_watch_1_desc:0 "Autrefois le deuxième refuge de pirates le plus important sur la côte orientale, la Garde de la Vrille a été pillée et ruinée par les natifs. La jungle a commencé à s'infiltrer et bien que pas entièrement habitable maintenant, elle a encore une certaine valeur défensive."
 
 building_gimlet_watch_2:0 "Garde de la Vrille"
 building_type_gimlet_watch_2:0 "Garde de la Vrille"
 building_gimlet_watch_2_desc:0 "Le deuxième port le plus important sur la côte orientale, la Garde de la Vrille est la sœur cadette de la Garde de la Vouivre.\n\nConstruite grâce aux lourds investissements des Lords pirates locaux, cette forteresse côtière est un poste de surveillance contre les groupes plus importants de sauvages au sud."
 
 
 building_wyvern_watch_1:0 "Ruines de la Garde de la Vouivre"
 building_type_wyvern_watch_1:0 "Garde de la Vouivre"
 building_wyvern_watch_1_desc:0 "Autrefois le port le plus important sur la côte orientale, la Garde de la Vouivre était la sœur aînée de la Garde de la Vrille.\n\nMaintenant réduite aux fondations d'un ancien phare ghiscari, la jungle a reconquis de grandes zones du donjon. L'emplacement reste cependant une position hautement défendable."
 
 building_wyvern_watch_2:0 "Garde de la Vouivre"
 building_type_wyvern_watch_2:0 "Garde de la Vouivre"
 building_wyvern_watch_2_desc:0 "Le port le plus important sur la côte orientale, la Garde de la Vouivre est la sœur aînée de la Garde de la Vrille.\n\nConstruite par des Lords pirates sur les fondations d'un ancien phare ghiscari, cette forteresse côtière est maintenant le plus grand repaire de racaille et de vilenie sur le continent sothoryi. Les navires marchands se méfient de la lumière menteuse de la Pointe de la Vouivre, dont la lumière les mène plus souvent qu'autrement à s'échouer sur le rivage et à être submergés par les pirates."
 
 
 building_maunga_pass_1:0 "Col de Maunga"
 building_type_maunga_pass_1:0 "Col de Maunga"
 building_maunga_pass_1_desc:0 "Le Col de Maunga consiste en une série de cols de montagne extrêmement difficiles à naviguer. Tout groupe ou résident du col ayant connaissance de son paysage fréquemment changeant peut devenir très influent, ou riche, en guidant les autres à travers."
 
 building_maunga_pass_2:0 "Col de Maunga Fortifié"
 building_type_maunga_pass_2:0 "Col de Maunga"
 building_maunga_pass_2_desc:0 "Maintenant fortifié, le Col de Maunga est un pā quasi-infranchissable que tout groupe de guerre hésiterait à traverser ; sans payer le péage requis d'abord bien sûr."
 
 
 building_fleshcarver_1:0 "Plateau Rocheux"
 building_type_fleshcarver_1:0 "Plateau Rocheux"
 building_fleshcarver_1_desc:0 "Une zone rocheuse et aride du littoral, surélevée par une falaise trapue. Si pas particulièrement attrayante pour les colons, la formation terrestre sert au moins de point de repère aux marins ; et de point de ralliement défendable pour ceux qui s'échouent."
 
 building_fleshcarver_2:0 "Épave du Tailleur-de-Chair"
 building_type_fleshcarver_2:0 "Plateau Rocheux"
 building_fleshcarver_2_desc:0 "Les histoires disent qu'une vague colossale rebelle projeta autrefois une galère d'esclavagiste au sommet d'un plateau rocheux sur la côte, laissant l'équipage gratter une existence sur le littoral, sans moyen de s'échapper. Quoi qu'il en soit, la coque de ce navire, positionnée où elle est au sommet d'une falaise trapue, est un refuge défendable pour beaucoup de petites bourgades de la région quand les groupes de guerre des hommes tachetés viennent frapper."
 
 
 building_gorosh_ruin_1:0 "Ruines de Gorosh"
 building_type_gorosh_ruin_1:0 "Ruines de Gorosh"
 building_gorosh_ruin_1_desc:0 "Autrefois une colonie pénitentiaire ghiscarie, Gorosh est restée abandonnée pendant la majeure partie de son histoire récente. Occasionnellement, l'ancien port est utilisé par les capitaines de navire les plus désespérés, mais ceux qui tentent de s'installer dans la région n'ont rencontré que mutineries ou catastrophes. Bien que la jungle se soit infiltrée dans certaines zones, les ruines restent remarquablement libres de toute végétation sauf la plus petite.\n\nLa cour centrale de la prison semble porter un obélisque de pierre noire huileuse."
 
 building_gorosh_ruin_2:0 "Colonie Pénitentiaire de Gorosh"
 building_type_gorosh_ruin_2:0 "Ruines de Gorosh"
 building_gorosh_ruin_2_desc:0 "Maintenant restaurée, cette ancienne colonie pénitentiaire ghiscarie agit comme une ville portuaire bien défendue, facilement capable d'héberger des milliers de personnes à court préavis. Bien que les chambres soient peut-être... indésirables. En fait, ceux qui dorment dans la prison rapportent avoir des quantités croissantes de cauchemars et d'hallucinations pendant leur séjour.\n\nLa cour centrale de la prison porte toujours un obélisque de pierre noire huileuse."
 
 
 building_kahiwi_pa_1:0 "Colline de Kahiwi"
 building_type_kahiwi_pa_1:0 "Colline de Kahiwi"
 building_kahiwi_pa_1_desc:0 "Une colline terrassée hautement défendable qui a abrité une lignée fréquemment changeante de tribus pendant des centaines d'années. La tradition orale locale affirme que la colline était autrefois la capitale d'un royaume tribal hautement unifié qui 'Chassa les gens du ciel'. Que les 'gens du ciel' se réfèrent aux Ghiscaris adorateurs de harpies ou aux Valyriens volant sur des dragons est un débat ouvert.\n\nLes tribus de la région considèrent la revendication du pā historique par la force comme hautement prestigieuse ; d'où la fréquence à laquelle il est perdu et pris."
 
 building_kahiwi_pa_2:0 "Kahiwi Pā"
 building_type_kahiwi_pa_2:0 "Kahiwi Pā"
 building_kahiwi_pa_2_desc:0 "Une capitale digne à nouveau, ce pā, ou fort dans la langue commune, est un foyer extrêmement défendable et prestigieux pour toute tribu. Fossés, tunnels secrets, tranchées terrassées et palissades entourent la colline en une douzaine d'anneaux de protection. Des réserves souterraines, refroidies dans la terre profonde, contiennent suffisamment de provisions pour des mois, sinon des années."
 
 
 building_serpents_lair_1:0 "Faille du Serpent"
 building_type_serpents_lair_1:0 "Faille du Serpent"
 building_serpents_lair_1_desc:0 "Deux grandes failles qui traversent le Littoral de la Vouivre et se rejoignent beaucoup plus loin dans les terres. Cela formerait une île mais pour un mince pont terrestre naturel où la terre n'est pas encore tombée dans le gouffre en dessous. À cause des failles, cette 'île' est presque complètement entourée de falaises sauf pour le pont terrestre naturel comme point d'étranglement. Une formation rocheuse à couper le souffle pour ceux assez chanceux pour la voir.\n\nLes falaises sont également dites contenir de nombreux tunnels et grottes traversant la zone et ressortant comme des taches sombres sur les parois des falaises."
 
 building_serpents_lair_2:0 "Repaire du Serpent"
 building_type_serpents_lair_2:0 "Faille du Serpent"
 building_serpents_lair_2_desc:0 "Convertie en la forteresse imprenable qu'elle était destinée à devenir par le Culte du Serpent, cette formation est un bastion avancé contre les pirates. Cet emplacement peut héberger des milliers, en sécurité au sommet de ses hautes falaises, les capitaines de navires éclaireurs craignant toujours de s'écraser sur les rochers déchiquetés en contrebas."
 
 
 building_laanas_refuge_1:0 "Ville Fantôme"
 building_type_laanas_refuge_1:0 "Refuge de Laana"
 building_laanas_refuge_1_desc:0 "Une ville fantôme abandonnée. Maisons, rues et tours de guet vides, toutes partiellement cachées avec des feuilles et des broussailles. Où sont passés tous les habitants ?"
 
 building_laanas_refuge_2:0 "Refuge de Laana"
 building_type_laanas_refuge_2:0 "Refuge de Laana"
 building_laanas_refuge_2_desc:0 "Un havre sûr pour les navires des Îles d'Été pour commercer avec certains des hommes tachetés moins sauvages et le peuple de Qhour. La jungle a été défrichée de la zone environnante et ceux qui vivent ici trouveront d'innombrables innovations dans la construction qui repoussent ou annulent une grande partie de la nature hostile de Sothoryos. Les collines derrière le refuge sont remplies d'or et de plusieurs autres métaux précieux ; ceux-ci sont extraits avec prudence et raffinés sur place pour le commerce.\n\nOn prend soin de rester en harmonie avec les locaux, et encore plus de soin est pris pour rester caché des pirates et des sauvages moins agréables."
 
 
 
 
 
 
 
 

    # Wildlife and Flora Blockers #
 
 building_ravenous_basilisk_1:0 "Basilics Voraces"
 building_type_ravenous_basilisk_1:0 "Basilics Voraces"
 building_ravenous_basilisk_1_desc:0 "Des basilics voraces ont envahi cette zone. Leur morsure porte des infections si puissantes qu'elle nécrose les tissus environnants en quelques heures. Retirer les membres atteints est le seul moyen d'éviter une mort exceptionnellement douloureuse.\n\nLa présence de ces créatures est un risque massif pour les colonies de la région et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'ils disparaissent.\n\nCes basilics particuliers semblent être plus grands et plus agressifs que ceux vus auparavant. Nous soupçonnons qu'ils sont attirés par quelque chose à proximité..."
 
 building_ravenous_basilisk_2:0 "Basilics Éliminés"
 building_type_ravenous_basilisk_2:0 "Basilics Éliminés"
 building_ravenous_basilisk_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 building_ravenous_basilisk_tame:0 "Basilics Apprivoisés"
 building_type_ravenous_basilisk_tame:0 "Basilics Apprivoisés"
 building_ravenous_basilisk_tame_desc:0 "Les basilics voraces résidant ici vivent avec nous en symbiose. Ces grands lézards à six pattes passent une grande partie de leur temps à chasser ou à se prélasser au sommet des branches d'arbres plus robustes. Leur morsure porte des infections si puissantes qu'elle nécrose les tissus environnants en quelques heures, ce qui rend la chasse une simple question d'obtenir une seule bonne morsure... puis de traquer leur victime jusqu'à ce qu'elle tombe.\n\nLa présence de ces créatures est une aubaine pour nos colonies, réduisant le besoin de gardes.\n\nGrâce à notre relation, cette faune native a grandi beaucoup plus grande que la normale..."
 
 building_basilisk_1:0 "Basilics"
 building_type_basilisk_1:0 "Basilics"
 building_basilisk_1_desc:0 "Des basilics ont envahi cette zone. Leur morsure porte des infections si puissantes qu'elle nécrose les tissus environnants en quelques heures. Retirer les membres atteints est le seul moyen d'éviter une mort exceptionnellement douloureuse.\n\nLa présence de ces créatures est un risque massif pour les colonies de la région et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'ils disparaissent."
 
 building_basilisk_2:0 "Basilics Éliminés"
 building_type_basilisk_2:0 "Basilics Éliminés"
 building_basilisk_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 

 building_ghoulish_bat_1:0 "Chauves-souris Vampires Macabres"
 building_type_ghoulish_bat_1:0 "Chauves-souris Vampires Macabres"
 building_ghoulish_bat_1_desc:0 "Des chauves-souris vampires macabres ont envahi cette zone. Ces chauves-souris vampires blanc-pâle passent une grande partie de leur temps à ramper de manière presque imperceptible à travers les canopées des Arbres Exsangues. Elles descendent sur leurs proies endormies et se gorgent du sang vital de leurs victimes, les drainant complètement en quelques minutes, le tout sans qu'elles ne ressentent rien. Les estomacs des chauves-souris complètement rassasiées ressemblent à des tiques ; monstrueusement gonflées de sang.\n\nLa présence de ces créatures est un risque massif pour les colonies de la région et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'elles disparaissent.\n\nCette espèce semble particulièrement résistante à nos efforts pour les chasser. Quelque chose, ou quelqu'un, doit les maintenir ici..."
 
 building_ghoulish_bat_2:0 "Chauves-souris Vampires Éliminées"
 building_type_ghoulish_bat_2:0 "Chauves-souris Vampires Éliminées"
 building_ghoulish_bat_2_desc:0 "Cette région a été débarrassée de sa faune dominante."

 building_ghoulish_bat_tame:0 "Chauves-souris Vampires Apprivoisées"
 building_type_ghoulish_bat_tame:0 "Chauves-souris Vampires Apprivoisées"
 building_ghoulish_bat_tame_desc:0 "Les Tahae-toto résidant ici vivent avec nous en symbiose. Ces chauves-souris vampires blanc-pâle passent une grande partie de leur temps à ramper de manière presque imperceptible à travers les canopées des Arbres Exsangues. Elles descendent sur leurs proies endormies et se gorgent du sang vital de leurs victimes, les drainant complètement en quelques minutes, le tout sans qu'elles ne ressentent rien. Les estomacs des chauves-souris complètement rassasiées ressemblent à des tiques ; monstrueusement gonflées de sang.\n\nLa présence de ces créatures est une aubaine pour nos colonies, réduisant le besoin de gardes.\n\nGrâce à notre relation, cette faune native a grandi beaucoup plus grande que la normale..."
 
 building_cos_bat_1:0 "Chauves-souris Vampires"
 building_type_cos_bat_1:0 "Chauves-souris Vampires"
 building_cos_bat_1_desc:0 "Des chauves-souris vampires ont envahi cette zone. Ces chauves-souris vampires blanc-pâle passent une grande partie de leur temps à ramper de manière presque imperceptible à travers les canopées des Arbres Exsangues. Elles descendent sur leurs proies endormies et se gorgent du sang vital de leurs victimes, les drainant complètement en quelques minutes, le tout sans qu'elles ne ressentent rien. Les estomacs des chauves-souris complètement rassasiées ressemblent à des tiques ; monstrueusement gonflées de sang.\n\nLa présence de ces créatures est un risque massif pour les colonies de la région et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'elles disparaissent."
 
 building_cos_bat_2:0 "Chauves-souris Vampires"
 building_type_cos_bat_2:0 "Chauves-souris Vampires Éliminées"
 building_cos_bat_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 
 building_cos_wyvern_1:0 "Vouivres"
 building_type_cos_wyvern_1:0 "Vouivres"
 building_cos_wyvern_1_desc:0 "Bien qu'ayant une silhouette similaire avec le soleil dans leur dos, les vouivres de Sothoryos sont plus étroitement apparentées aux lézards terrestres qu'aux dragons. Elles ne s'avèrent pas moins mortelles cependant, en tombant sur leurs proies depuis les cieux ouverts ; les plus grandes étant capables d'emporter hommes et même chevaux sans effort. Les efforts pour débarrasser ces bêtes de la zone ne seront pas une mince affaire, car elles nichent presque exclusivement dans des endroits rocheux difficiles d'accès.\n\nLa présence de ces créatures est un risque massif pour les colonies de la région et des gardes supplémentaires surveillant les cieux sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'elles disparaissent ; bien qu'au moins aucune vouivre alpha ne soit présente dans cette zone..."
 
 building_cos_wyvern_2:0 "Vouivres Éliminées"
 building_type_cos_wyvern_2:0 "Vouivres Éliminées"
 building_cos_wyvern_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 building_cos_wyvern_alpha_1:0 "Vouivres Menées par un Alpha"
 building_type_cos_wyvern_alpha_1:0 "Vouivres Menées par un Alpha"
 building_cos_wyvern_alpha_1_desc:0 "Bien qu'ayant une silhouette similaire avec le soleil dans leur dos, les vouivres de Sothoryos sont plus étroitement apparentées aux lézards terrestres qu'aux dragons. C'est doublement vrai des Vouivres Alpha, créatures âgées qui se sont établies comme leaders des créatures autrement solitaires. En présence d'un alpha, les vouivres se perchent en une colonie dense, signifiant que les déloger nécessitera non seulement de vastes quantités d'efforts, mais aussi l'abattage de l'alpha lui-même ; sinon il déplacera simplement sa colonie ailleurs.\n\nLa présence de ces créatures est un risque massif pour les colonies de la région et des gardes supplémentaires surveillant les cieux sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'elles disparaissent ; la présence d'une vouivre alpha annonce la ruine..."
 
 building_cos_wyvern_alpha_2:0 "Vouivres Alpha Tuées"
 building_type_cos_wyvern_alpha_2:0 "Vouivres Alpha Tuées"
 building_cos_wyvern_alpha_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 
 building_cos_carn_plant_1:0 "Plantes Carnivores"
 building_type_cos_carn_plant_1:0 "Plantes Carnivores"
 building_cos_carn_plant_1_desc:0 "Peut-être le groupe de vie naturelle le plus distinct au sein de l'Enfer Vert sont ses plantes carnivores. Bien que des variétés plus petites attrape-mouches existent encore ici, elles sont obscènement éclipsées par leurs cousines sothoryies.\n\nLes plantes carnivores sothoryies peuvent atteindre 15 pieds de large et leurs vrilles tactiles sont capables d'entraver les membres de toute créature, humains inclus, qui déclenchent une réponse de leur part. La plante utilise les propres mouvements de lutte de ses victimes comme catalyseur énergétique pour les soulever et les déplacer vers sa chambre de digestion centrale remplie d'acide.\n\nUne fois baignés dans ces fluides digestifs... les survivants déclarent qu'ils auraient préféré être laissés mourir, car les éruptions et brûlures persistent pendant des années après."
 
 building_cos_carn_plant_2:0 "Plantes Carnivores Taillées"
 building_type_cos_carn_plant_2:0 "Plantes Carnivores"
 building_cos_carn_plant_2_desc:0 "Cette région a été débarrassée de sa faun-... Je veux dire flore dominante."
 
 
 building_cos_spider_yeen_1:0 "Attercopes de Yeen"
 building_type_cos_spider_yeen_1:0 "Attercopes"
 building_cos_spider_yeen_1_desc:0 "PLACEHOLDER"
 
 building_cos_spider_yeen_2:0 "Attercopes Éliminées"

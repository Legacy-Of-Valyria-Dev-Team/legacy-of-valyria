    # Special Buildings And Ruins #
 
 building_bloodstone_mines_1:0 "Mines de Sangdragon Vierges"
 building_type_bloodstone_mines_1:0 "Mines de Sangdragon"
 building_bloodstone_mines_1_desc:0 "Une étendue de falaises escarpées qui séparent la jungle de la mer en contrebas. Cette formation rocheuse semble riche en fer et en un minéral vert-rouge connu sous le nom de sangdragon.\n\nCette pierre semi-précieuse semble avoir une signification culturelle pour les indigènes de la région, qui la collectent à la main, sans outils ni technique minière. Exploiter ces falaises serait hautement profitable, quoique sacrilège pour les natifs."
 
 building_bloodstone_mines_2:0 "Mines de Sangdragon"
 building_type_bloodstone_mines_2:0 "Mines de Sangdragon"
 building_bloodstone_mines_2_desc:0 "Une étendue de falaises escarpées qui séparent la jungle de la mer en contrebas. Cette formation rocheuse semble riche en fer et en un minéral vert-rouge connu sous le nom de sangdragon.\n\nMaintenant exploitée à son plein potentiel, puits de mine et outils extraient désormais fer et pierres précieuses à un rythme hautement efficace."


 building_green_gate_1:0 "La Porte Verte"
 building_type_green_gate_1:0 "La Porte Verte"
 building_green_gate_1_desc:0 "Un impressionnant treillis de formations rocheuses abruptes, semblables à des lances, au point de convergence des murailles de sangdragon est-ouest. Les lances de roche forment une canopée presque complète au-dessus de l'entrée de la vallée ombragée à l'intérieur. Cette 'porte' apparemment naturelle est le seul chemin terrestre vers les Plaines Centrales de Sothoryos.\n\nLes nombreuses cavités et recoins de ce treillis rocheux abritent *également* une colonie de repos vraiment massive de wyvernes. Les navires ne peuvent s'approcher trop près de cette zone, de peur d'être vidés de tout leur équipage. Si la menace wyverne pouvait être réglée, cette porte est la clé pour tenir les vastes plaines fertiles du sud contre tout envahisseur venu par mer."
 
 building_green_gate_2:0 "Porte Verte Fortifiée"
 building_type_green_gate_2:0 "Mines de Sangdragon"
 building_green_gate_2_desc:0 "Un impressionnant treillis de formations rocheuses abruptes, semblables à des lances, au point de convergence des murailles de sangdragon est-ouest. Les lances de roche forment une canopée presque complète au-dessus de l'entrée de la vallée ombragée à l'intérieur. Cette 'porte' apparemment naturelle est le seul chemin terrestre vers les Plaines Centrales de Sothoryos.\n\nAvec les wyvernes éliminées, le passage a été fortifié et un port a été érigé dans le havre profond trouvé à son embouchure."
 
 
 building_cos_corpse_mound_1:0 "Monticules de Cadavres Déblayés"
 building_type_cos_corpse_mound_1:0 "Monticules de Cadavres"
 building_cos_corpse_mound_1_desc:0 "Cette clairière de jungle abritait jadis les infâmes Monticules de Cadavres des Abysses du Basilic. Les natifs de cette région portaient tous les 'envahisseurs' défaits de la côte, ainsi que toutes leurs possessions étrangères pour les empiler ici ; la croyance locale étant que tous les objets étrangers sont maléfiques et doivent donc être laissés 'aux dieux'. Les dieux en l'occurrence étant les centaines de basilics qui convergeaient ici pour se gorger des corps abandonnés.\n\nAvec les corps et artefacts déblayés, les basilics se sont une fois de plus dispersés dans les profondeurs de la jungle. La clairière possède encore une odeur fétide et une aura de désespoir."
 
 building_cos_corpse_mound_2:0 "Vastes Monticules de Cadavres"
 building_type_cos_corpse_mound_2:0 "Monticules de Cadavres"
 building_cos_corpse_mound_2_desc:0 "Empilés haut dans une clairière de jungle se dressent des monticules composés de milliers de corps et d'artefacts en ruine, peut-être des ordres de grandeur de plus. Les natifs de cette région portent tous les 'envahisseurs' défaits de la côte, ainsi que toutes leurs possessions étrangères pour les empiler ici ; la croyance locale étant que tous les objets étrangers sont maléfiques et doivent donc être laissés 'aux dieux'. Les dieux en l'occurrence étant les centaines de basilics qui convergent ici pour se gorger des corps abandonnés.\n\nBien qu'une grande partie de ce tas desséché par le soleil soit sans valeur du fait des âges passés, récupérer son contenu serait extrêmement lucratif ; quoique sacrilège pour les natifs."
 
 
 building_basilisk_point_ruins_1:0 "Ruines de la Pointe du Basilic"
 building_type_basilisk_point_ruins_1:0 "Pointe du Basilic"
 building_basilisk_point_ruins_1_desc:0 "Les ruines antiques de plusieurs colonisations par les Ghiscaris, Valyriens et bien plus tard les Rhoynars. Bien que les différents styles architecturaux s'affrontent constamment à travers les ruines, un donjon de pierre demeure intact et défiant, semblant repousser la jungle envahissante. Une unique colonne de pierre noire huileuse jaillit du centre de la cour du donjon.\n\nBien qu'actuellement en état de délabrement, les bâtiments et fossés qui demeurent ici offrent encore une position défensive significative contre tout attaquant potentiel."
 
 building_basilisk_point_ruins_2:0 "Pointe du Basilic Restaurée"
 building_type_basilisk_point_ruins_2:0 "Pointe du Basilic"
 building_basilisk_point_ruins_2_desc:0 "Les ruines désormais restaurées de la Pointe du Basilic. Les styles architecturaux s'affrontant ont été partiellement démolis par endroits pour les concentrer et créer un effet de voyage dans le temps en marchant sur les routes pavées. De grands brûlis ont repoussé la jungle et une palissade défensive a été érigée comme défense secondaire aux murs de pierre maintenant restaurés. Avec le phare du donjon brûlant brillamment, les vicieux habitants natifs de Sothoryos, sentients ou non, craindront désormais ce lieu comme un phare de puissance."
 
 
 building_zamettar_ruins_1:0 "Ruines de Zamettar"
 building_type_zamettar_ruins_1:0 "Zamettar"
 building_zamettar_ruins_1_desc:0 "Les ruines antiques de Zamettar, originellement fondée par les Ghiscaris et plus tard capturée par les seigneurs-dragons des Possessions de Valyria, durant la Quatrième Guerre Ghiscarie. Finalement l'environnement hostile de Sothoryos chassa les colons valyriens. Il fallut attendre plusieurs centaines d'années avant que les Rhoynars tentent de coloniser la cité, pour échouer pour la même raison que les valyriens.\n\nLa jungle s'est frayé un chemin à travers la cité, des lianes escaladant chaque mur et des racines massives renversant les bâtiments de pierre. La jungle n'a cependant pas encore reconquis quelques districts de la cité ; ceux portant des colonnes de pierre noire huileuse en leurs centres.\n\nRestaurer Zamettar serait une tâche exceptionnellement difficile, mais avec assez de temps, d'effort et d'or, cette cité pourrait à nouveau s'étendre jusqu'au Delta de Zamoyos lui-même."
 
 building_zamettar_ruins_2:0 "Zamettar Restaurée"
 building_type_zamettar_ruins_2:0 "Zamettar"
 building_zamettar_ruins_2_desc:0 "Finalement restaurée à sa gloire première pour la première fois depuis l'âge du Vieil Ghis, Zamettar grouille de nouveaux colons et de navires marchands étrangers. Des murs de pierre défendent maintenant en sécurité les nombreux habitants de la cité des pires aspects de l'environnement et des brûlis réguliers aux lisières forestières repoussent le pire des insectes piqueurs. La jungle profonde a été repoussée aux franges mêmes du delta et des palissades ont été érigées à ses frontières.\n\nAvec de l'eau fraîche tirée et bouillie du Zamoyos, les navires fréquentent les ports de Zamettar pour ravitaillement et logement."
 
 
 building_balam_glade_1:0 "Clairières Ravagées de Balam"
 building_type_balam_glade_1:0 "Clairières de Balam"
 building_balam_glade_1_desc:0 "Les clairières cachées de Balam étaient un lieu hautement spirituel pour ceux de la foi de la Mère Verte. L'histoire orale raconte que c'est ici que la Mère Verte elle-même descendit sur le sol de la jungle pour sauver les Hommes Tachetés des pestes qui les affligeaient. La puissance de ses sorts divins fut telle que la jungle elle-même fut purgée de cette petite zone, laissant derrière elle une clairière fertile pour ses fidèles.\n\nLes clairières étaient considérées comme le site le plus sacré de la Mère Verte et nombre de ses fidèles jurèrent de les défendre de leurs vies... ils échouèrent.\n\nLes clairières ont depuis été livrées aux flammes et la jungle a pressé à leur absence. Bien peu de la flore et faune originales des clairières demeurent ; mais un zélote déterminé ou un érudit pourrait encore sauver ou même restaurer les clairières à leur splendeur première."
 
 building_balam_glade_2:0 "Clairières Florissantes de Balam"
 building_type_balam_glade_2:0 "Clairières de Balam"
 building_balam_glade_2_desc:0 "Ces clairières cachées sont un lieu hautement spirituel pour ceux de la foi de la Mère Verte. L'histoire orale raconte que c'est ici que la Mère Verte elle-même descendit sur le sol de la jungle pour sauver les Hommes Tachetés des pestes qui les affligeaient. La puissance de ses sorts divins fut telle que la jungle elle-même fut purgée de cette petite zone, laissant derrière elle une clairière fertile pour ses fidèles.\n\nLes clairières sont considérées comme le site le plus sacré de la Mère Verte et nombre de ses fidèles jurent de les défendre de leurs vies."
 
 
 building_the_maw_1:0 "Colline de la Gueule"
 building_type_the_maw_1:0 "Colline de la Gueule"
 building_the_maw_1_desc:0 "De ce système de grottes effondré jaillissent les sources de la rivière tributaire Yeenos. Plus que cela cependant, c'était autrefois le point central de la religion de la Gueule Éternelle. Ses fidèles croient que le monde entier, ou du moins Sothoryos, est une entité unique qui dévore les faibles et nourrit les forts dans un cycle continu qui engendre des créatures plus grandes et plus fortes.\n\nLes fidèles de cette religion apportaient leurs prises les plus audacieuses ou impressionnantes (animales ou autres) et les déposaient dans les chambres extérieures de la grotte pour être 'dévorées' ; apaisant supposément la gueule et leur apportant le pouvoir. Quelle que soit la vérité de l'affaire, la rivière Yeenos qui coule à travers les fissures de l'entrée scellée de la grotte maintient la région assez fertile à ce jour.\n\nCertains fidèles plus zélés pourraient même souhaiter dégager l'entrée de la grotte et reprendre leurs pratiques lugubres."
 
 building_the_maw_2:0 "La Gueule Dévorante"
 building_type_the_maw_2:0 "Colline de la Gueule"
 building_the_maw_2_desc:0 "De ce système de grottes massif jaillissent les sources de la rivière tributaire Yeenos. Plus que cela cependant, c'est le point central et un site sacré de la religion de la Gueule Éternelle. Ses fidèles croient que le monde entier, ou du moins Sothoryos, est une entité unique qui dévore les faibles et nourrit les forts dans un cycle continu qui engendre des créatures plus grandes et plus fortes.\n\nLes fidèles de cette religion apportent leurs prises les plus audacieuses ou impressionnantes (animales ou autres) et les déposent dans les chambres extérieures de la grotte pour être 'dévorées' ; apaisant ainsi la gueule et leur apportant le pouvoir. Quelle que soit la vérité de l'affaire, la rivière Yeenos qui coule d'ici semble rendre les régions extrêmement fertiles."
 
 
 building_yeen_ruins_1:0 "Cité en Ruines de Yeen"
 building_type_yeen_ruins_1:0 "Cité de Yeen"
 building_yeen_ruins_1_desc:0 "Une vaste cité en ruines qui s'étend à perte de vue, du moins depuis les hauteurs des grands arbres avoisinants. Yeen est l'une des cités les plus anciennes du monde connu, construite presque exclusivement d'une pierre noire huileuse, dont certaines pièces sont si grandes que plusieurs éléphants seraient requis pour déplacer chacune d'elles.\n\nLa jungle semble ne pouvoir pénétrer Yeen. Les rues demeurent dégagées de toute végétation hormis les plus chétives et délicates. Il n'y a ni lianes ni racines obstruantes, juste beaucoup de terre meuble ; une cité érodée par les intempéries, inquiétante et silencieuse et tout à fait sinistre.\n\nBien que toutes les tentatives précédentes d'habiter ce lieu se soient terminées dans l'horreur... Sûrement une telle chose ne peut se reproduire. Après tout, comparée aux vicieuses jungles du Sothoryos profond, Yeen semble un havre remarquablement sûr."
 
 building_yeen_ruins_2:0 "Occupation Initiale (Yeen)" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_2:0 "Cité de Yeen"
 building_yeen_ruins_2_desc:0 "Suivant les traces d'innombrables expéditions condamnées avant nous, un camp de base a été établi dans l'une des parties les plus défendables de la cité ; proche des bateaux au cas où une retraite hâtive serait requise.\n\nLes faubourgs ont maintenant été largement explorés. Os éparpillés, carcasses desséchées de bétail et de bêtes sothoryi, armes et armures de divers âges et origines... est-ce une lame westeroise ? Peu importe. Les districts intérieurs de la cité se sont avérés difficiles. Toutes nos équipes envoyées n'ont jusqu'ici pas été de retour et vu les toiles d'araignée anormalement grandes qui entrecroisent les rues... nous avons au moins une idée du pourquoi.\n\nLes colons crient dans leur sommeil, un nombre anormalement élevé de cauchemars les tourmente, bien que ceci soit compréhensible vu l'histoire de la zone. Néanmoins, avec au moins les districts extérieurs cartographiés nous devrions avoir un avantage considérable sur tout envahisseur. De plus, les reliques récupérées ici prendront des années à cataloguer et peut-être vendre, rapportant une belle quantité d'or."
 
 building_yeen_ruins_3:0 "Restauration Extérieure (Yeen)"
 building_type_yeen_ruins_3:0 "Cité de Yeen"
 building_yeen_ruins_3_desc:0 "Les districts extérieurs ont été fortifiés et restaurés où possible. Tout envahisseur fait maintenant face à un labyrinthe de routes et ruelles bloquées... bien que plus de colons continuent de disparaître, sans jamais être vus partant par les guetteurs. Les districts intérieurs ont été bloqués bien sûr, bien que cela n'ait en rien aidé. Sans craindre les menaces extérieures pour l'instant, peut-être qu'une expédition plus militarisée profondément dans la cité pourrait être planifiée.\n\nPlus de rapports de cauchemars et de sommeil perdu tourmentent les guérisseurs déjà limités de la zone..."
 
 building_yeen_ruins_4:0 "Districts Intérieurs Repris (Yeen)" 
 building_type_yeen_ruins_4:0 "Cité de Yeen"
 building_yeen_ruins_4_desc:0 "Par de grands efforts et la perte de nombreuses vies les districts intérieurs, moins quelques zones tenaces, ont été reconquis. Les viles coques chitineuses d'attercopes ont été déblayées et certaines des ruines les plus majestueuses de la zone ont déjà été réclamées par ceux de rang supérieur.\n\nLes attercopes restantes ont été confinées principalement à un unique temple massif au cœur de Yeen. Les préparatifs pour purger proprement ceci prendront beaucoup de temps et seront probablement extrêmement dangereux. Les groupes refusent catégoriquement, même sous peine de mort, d'y entrer à moins que leur propre suzerain ne les accompagne pour partager le risque.\n\nLes cauchemars empirent et le manque de sommeil semble avoir induit des hallucinations éveillées chez certains."
 
 building_yeen_ruins_5:0 "Districts Intérieurs Restaurés (Yeen)" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_5:0 "Cité de Yeen"
 building_yeen_ruins_5_desc:0 "Les districts intérieurs de Yeen ont maintenant été restaurés à un état vraiment vivable. Les routes ont été dégagées, les entrepôts stockés et les demeures occupées ; bien qu'il semble que les rues prennent un nombre remarquable de lanternes pour rester éclairées. Bien que les temples et palais soient fermés pour l'instant, suite au dernier nettoyage... Yeen est néanmoins devenue un hub commercial central pour tous ceux voyageant sur la rivière Zamoyos.\n\nLes cauchemars sont une occurrence nocturne pour ceux du district intérieur. C'est une réalité inéchappable et beaucoup se tournent vers la douce libération induite par les drogues d'un sommeil sans rêves. Ceux qui ne peuvent s'offrir de tels luxes souffrent en silence, hormis les cris d'un sommeil agité."
 
 building_yeen_ruins_6:0 "Grande Cité de Yeen" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_6:0 "Cité de Yeen"
 building_yeen_ruins_6_desc:0 "La cité a été restaurée et le mal habitant ce lieu a été banni... espérons pour de bon. Yeen est maintenant le havre sûr au cœur de la jungle qu'elle a toujours semblé être... pour l'instant."
 
 
 building_gold_mine_1:0 "Gisement d'Or"
 building_type_gold_mine_1:0 "Mine d'Or"
 building_gold_mine_1_desc:0 "Sothoryos a toujours été réputée posséder une grande richesse en minéraux et minerais. Les prospecteurs ont déterminé que cette zone était riche en quartz et or."
 
 building_gold_mine_2:0 "Mine d'Or Prospère"
 building_type_gold_mine_2:0 "Mine d'Or"
 building_gold_mine_2_desc:0 "Insatisfaits des simples filons de surface, de profonds tunnels ont été creusés pour accéder aux dépôts de quartz-or de cette zone. Avec des équipes de 12 heures par les ouvriers et de nouveaux tunnels ajoutés régulièrement, ce gisement exhume maintenant de l'or à un rythme stupéfiant."
 
 
 building_bloodletters_hall_1:0 "Halle du Saigneur Abandonnée"
 building_type_bloodletters_hall_1:0 "Halle du Saigneur"
 building_bloodletters_hall_1_desc:0 "Étant donné que la halle du Saigneur était censée être composée de lianes et d'os, il n'est guère étonnant qu'il reste si peu après que de grands incendies l'aient rasée.\n\nSeul un bassin d'autel de pierre noire huileuse demeure là où se dressait jadis la chambre centrale. De façon fascinante, et sans source visible, le bassin contient une petite quantité de sang frais.\n\nC'est ici que le Saigneur en chef vivait autrefois et accomplissait ses viles pratiques. Si ses héritiers ou d'autres fidèles de leur dieu sombre devaient jamais reprendre l'autel, ils pourraient tenter de faire repousser la Halle du Saigneur."
 
 building_bloodletters_hall_2:0 "Halle du Saigneur"
 building_type_bloodletters_hall_2:0 "Halle du Saigneur"
 building_bloodletters_hall_2_desc:0 "Les murs de la halle du Saigneur sont en fait composés de lianes entrelacées de la haute canopée des Arbres Exsangues. Ces lianes sont verrouillées ensemble par une variété d'os d'apparence très humaine, les faisant fusionner avec le temps par la tension.\n\nC'est ici que le Saigneur en chef réside et accomplit ses viles pratiques."

 
 building_gimlet_watch_1:0 "Ruines de la Veille de Gimlet"
 building_type_gimlet_watch_1:0 "Veille de Gimlet"
 building_gimlet_watch_1_desc:0 "Autrefois le second havre pirate le plus proéminent de la côte orientale, la Veille de Gimlet a été saccagée et ruinée par les natifs. La jungle a commencé à s'infiltrer et bien que pas entièrement habitable en ce moment, elle a encore une certaine valeur défensive."
 
 building_gimlet_watch_2:0 "Veille de Gimlet"
 building_type_gimlet_watch_2:0 "Veille de Gimlet"
 building_gimlet_watch_2_desc:0 "Le second port le plus proéminent de la côte orientale, la Veille de Gimlet est la sœur cadette de la Veille des Wyvernes.\n\nConstruite grâce aux lourds investissements de seigneurs pirates locaux, cette forteresse côtière est un poste de guet contre les plus grands groupes de sauvages au sud."
 
 
 building_wyvern_watch_1:0 "Ruines de la Veille des Wyvernes"
 building_type_wyvern_watch_1:0 "Veille des Wyvernes"
 building_wyvern_watch_1_desc:0 "Autrefois le port le plus proéminent de la côte orientale, la Veille des Wyvernes était la sœur aînée de la Veille de Gimlet.\n\nMaintenant réduite aux fondations d'un ancien phare ghiscari, la jungle a reconquis de vastes zones du donjon. L'emplacement cependant demeure une position hautement défendable."
 
 building_wyvern_watch_2:0 "Veille des Wyvernes"
 building_type_wyvern_watch_2:0 "Veille des Wyvernes"
 building_wyvern_watch_2_desc:0 "Le port le plus proéminent de la côte orientale, Wyvern Watch est la sœur aînée de Gimlet Watch.\n\nConstruite par des seigneurs pirates sur les fondations d'un ancien phare ghiscari, cette forteresse côtière est maintenant le plus grand hub de racaille et vilenie du continent sothori. Que les navires marchands se méfient de la lumière menteuse de la Pointe des Wyvernes, dont la lumière plus souvent qu'autrement les mène à s'écraser sur la côte et être envahis par les pirates."
 
 
 building_maunga_pass_1:0 "Passe Maunga"
 building_type_maunga_pass_1:0 "Passe Maunga"
 building_maunga_pass_1_desc:0 "La Passe Maunga consiste en une série de passes montagneuses extrêmement difficiles à naviguer. Tout groupe ou résident de la passe ayant connaissance de son paysage fréquemment changeant peut devenir hautement influent, ou riche, en guidant d'autres à travers."
 
 building_maunga_pass_2:0 "Passe Maunga Fortifiée"
 building_type_maunga_pass_2:0 "Passe Maunga"
 building_maunga_pass_2_desc:0 "Maintenant fortifiée, la Passe Maunga est un pā quasi-infranchissable que toute partie de guerre hésiterait à traverser ; sans payer d'abord les frais requis bien sûr."
 
 
 building_fleshcarver_1:0 "Plateau Rocheux"
 building_type_fleshcarver_1:0 "Plateau Rocheux"
 building_fleshcarver_1_desc:0 "Une zone rocheuse et stérile du littoral, soutenue par une falaise trapue. Si pas particulièrement attrayante pour les colons, la formation terrestre agit au moins comme point de repère pour les marins ; et un point de ralliement défendable pour ceux qui s'échouent."
 
 building_fleshcarver_2:0 "Épave du Taille-Chair"
 building_type_fleshcarver_2:0 "Plateau Rocheux"
 building_fleshcarver_2_desc:0 "Les histoires racontent qu'une vague colossale scélérate projeta jadis une galère d'esclavagiste au sommet d'un plateau rocheux sur le littoral, laissant l'équipage gratter une existence sur la côte, sans moyen d'évasion. Quoi qu'il en soit, la coque de ce navire, positionnée comme elle l'est au sommet d'une falaise trapue est un refuge défendable pour beaucoup des petites bourgades de la zone quand les parties de guerre des hommes tachetés viennent frapper."
 
 
 building_gorosh_ruin_1:0 "Ruines de Gorosh"
 building_type_gorosh_ruin_1:0 "Ruines de Gorosh"
 building_gorosh_ruin_1_desc:0 "Autrefois une colonie pénitentiaire ghiscarie, Gorosh est demeurée abandonnée durant la majeure partie de son histoire récente. Occasionnellement l'ancien port est utilisé par les plus désespérés des capitaines, mais ceux qui tentent de coloniser la zone n'ont rencontré que mutineries ou désastres. Bien que la jungle ait envahi certaines zones, les ruines demeurent remarquablement dégagées de toute forme de végétation hormis les plus petites.\n\nLa cour centrale de la prison semble porter un obélisque de pierrenoire huileuse."
 
 building_gorosh_ruin_2:0 "Colonie Pénitentiaire de Gorosh"
 building_type_gorosh_ruin_2:0 "Ruines de Gorosh"
 building_gorosh_ruin_2_desc:0 "Maintenant restaurée, cette ancienne colonie pénitentiaire ghiscarie agit comme une cité portuaire bien défendue, facilement capable d'héberger des milliers à court terme. Bien que les chambres soient peut-être... indésirables. En fait ceux qui dorment dans la prison rapportent avoir de plus en plus de cauchemars et hallucinations en y séjournant.\n\nLa cour centrale de la prison porte encore un obélisque de pierrenoire huileuse."
 
 
 building_kahiwi_pa_1:0 "Colline Kahiwi"
 building_type_kahiwi_pa_1:0 "Colline Kahiwi"
 building_kahiwi_pa_1_desc:0 "Une colline hautement défendable, terrassée, qui a abrité une lignée fréquemment changeante de tribus pendant des centaines d'années. La tradition orale locale affirme que la colline fut jadis la capitale d'un royaume tribal hautement unifié qui 'Chassa les gens du ciel'. Que les 'gens du ciel' fassent référence aux Ghiscaris adorateurs de harpies ou aux Valyriens chevaucheurs de dragons est un débat ouvert.\n\nLes tribus de la région considèrent la prise du pā historique par la force comme hautement prestigieuse ; d'où la fréquence avec laquelle il est perdu et pris."
 
 building_kahiwi_pa_2:0 "Pā Kahiwi"
 building_type_kahiwi_pa_2:0 "Pā Kahiwi"
 building_kahiwi_pa_2_desc:0 "Une capitale digne à nouveau, ce pā, ou fort en langue commune, est un foyer extrêmement défendable et prestigieux pour toute tribu. Fossés, tunnels secrets, tranchées de terrassement et palissades entourent la colline en une douzaine d'anneaux de protection. Les réserves souterraines, refroidies dans la terre profonde contiennent assez de provisions pour des mois, sinon des années."
 
 
 building_serpents_lair_1:0 "Faille du Serpent"
 building_type_serpents_lair_1:0 "Faille du Serpent"
 building_serpents_lair_1_desc:0 "Deux grandes failles qui traversent la Côte des Wyvernes et se rejoignent bien plus à l'intérieur des terres. Ceci formerait une île mais pour un mince pont terrestre naturel où la terre n'est pas encore tombée dans le gouffre en dessous. À cause des failles, cette 'île' est presque complètement entourée de falaises hormis le pont terrestre naturel comme point d'étranglement. Une formation rocheuse à couper le souffle pour ceux assez chanceux pour la voir.\n\nLes falaises sont aussi dites contenir de nombreux tunnels et grottes traversant la zone et perçant comme des taches sombres sur les parois de falaise."
 
 building_serpents_lair_2:0 "Repaire du Serpent"
 building_type_serpents_lair_2:0 "Faille du Serpent"
 building_serpents_lair_2_desc:0 "Convertie en la forteresse inattaquable qu'elle était destinée à devenir par le Culte du Serpent, cette formation est un bastion avancé contre les pirates. Cet emplacement peut abriter des milliers, en sécurité au sommet de ses hautes falaises, avec les capitaines éclaireurs toujours dans la crainte de se fracasser sur les rochers déchiquetés en dessous."
 
 
 building_laanas_refuge_1:0 "Ville Fantôme"
 building_type_laanas_refuge_1:0 "Refuge de Laana"
 building_laanas_refuge_1_desc:0 "Une ville fantôme abandonnée d'une cité. Maisons vides, rues et tours de guet, toutes partiellement cachées de feuilles et broussailles. Où sont passés tous les gens ?"
 
 building_laanas_refuge_2:0 "Refuge de Laana"
 building_type_laanas_refuge_2:0 "Refuge de Laana"
 building_laanas_refuge_2_desc:0 "Un havre sûr pour les navires des Îles d'Été pour commercer avec certains des hommes tachetés moins sauvages et les gens de Qhour. La jungle a été défrichée de la zone environnante et ceux vivant ici trouveront d'innombrables innovations de construction qui repoussent ou neutralisent une grande partie de la nature hostile de Sothoryos. Les collines derrière le refuge sont remplies d'or et plusieurs autres métaux précieux ; ceux-ci sont extraits avec prudence et raffinés sur place pour le commerce.\n\nSoin est pris de rester en harmonie avec les locaux, et plus de soin encore est pris de rester cachés à la fois des pirates et des sauvages moins arrangeants."
 
 
 
 
 
 
 
 

    # Wildlife and Flora Blockers #
 
 building_ravenous_basilisk_1:0 "Basilics Voraces"
 building_type_ravenous_basilisk_1:0 "Basilics Voraces"
 building_ravenous_basilisk_1_desc:0 "Des basilics voraces ont envahi cette région. Leur morsure porte des infections si puissantes qu'elles nécrosent les tissus environnants en quelques heures. L'amputation des membres affectés est le seul moyen d'éviter une mort exceptionnellement douloureuse.\n\nLa présence de ces créatures représente un risque massif pour les établissements de la région et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à leur disparition.\n\nCes basilics particuliers semblent plus grands et plus agressifs que ceux vus auparavant. Nous soupçonnons qu'ils sont attirés par quelque chose dans les environs..."
 
 building_ravenous_basilisk_2:0 "Basilics Éliminés"
 building_type_ravenous_basilisk_2:0 "Basilics Éliminés"
 building_ravenous_basilisk_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 building_ravenous_basilisk_tame:0 "Basilics Apprivoisés"
 building_type_ravenous_basilisk_tame:0 "Basilics Apprivoisés"
 building_ravenous_basilisk_tame_desc:0 "Les basilics voraces résidant ici vivent avec nous en symbiose. Ces grands lézards à six pattes passent la majeure partie de leur temps soit à chasser soit à se prélasser au sommet des branches des arbres les plus robustes. Leur morsure porte des infections si puissantes qu'elles nécrosent les tissus environnants en quelques heures, ce qui rend la chasse simple : une seule bonne morsure... puis traquer leur victime jusqu'à ce qu'elle tombe.\n\nLa présence de ces créatures est un atout pour nos établissements, réduisant le besoin de gardes.\n\nGrâce à notre relation, cette faune native a grandi bien plus que la normale..."
 
 building_basilisk_1:0 "Basilics"
 building_type_basilisk_1:0 "Basilics"
 building_basilisk_1_desc:0 "Des basilics ont envahi cette région. Leur morsure porte des infections si puissantes qu'elles nécrosent les tissus environnants en quelques heures. L'amputation des membres affectés est le seul moyen d'éviter une mort exceptionnellement douloureuse.\n\nLa présence de ces créatures représente un risque massif pour les établissements de la région et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à leur disparition."
 
 building_basilisk_2:0 "Basilics Éliminés"
 building_type_basilisk_2:0 "Basilics Éliminés"
 building_basilisk_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 

 building_ghoulish_bat_1:0 "Chauves-souris Vampires Goules"
 building_type_ghoulish_bat_1:0 "Chauves-souris Vampires Goules"
 building_ghoulish_bat_1_desc:0 "Des Chauves-souris Vampires Goules ont envahi cette région. Ces chauves-souris vampires blanc pâle passent la majeure partie de leur temps à ramper presque imperceptiblement à travers les canopées des Arbres Exsangues. Elles descendent sur les proies endormies et se gorgent du sang de leurs victimes, les vidant complètement en quelques minutes, tout cela sans qu'elles ne ressentent jamais rien. Les estomacs des chauves-souris repues ressemblent à des tiques ; monstrueusement gonflés de sang.\n\nLa présence de ces créatures représente un risque massif pour les établissements de la région et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à leur disparition.\n\nCette espèce semble particulièrement résistante à nos efforts pour les chasser. Quelque chose, ou quelqu'un, doit les maintenir dans les parages..."
 
 building_ghoulish_bat_2:0 "Chauves-souris Vampires Éliminées"
 building_type_ghoulish_bat_2:0 "Chauves-souris Vampires Éliminées"
 building_ghoulish_bat_2_desc:0 "Cette région a été débarrassée de sa faune dominante."

 building_ghoulish_bat_tame:0 "Chauves-souris Vampires Apprivoisées"
 building_type_ghoulish_bat_tame:0 "Chauves-souris Vampires Apprivoisées"
 building_ghoulish_bat_tame_desc:0 "Les Tahae-toto résidant ici vivent avec nous en symbiose. Ces chauves-souris vampires blanc pâle passent la majeure partie de leur temps à ramper presque imperceptiblement à travers les canopées des Arbres Exsangues. Elles descendent sur les proies endormies et se gorgent du sang de leurs victimes, les vidant complètement en quelques minutes, tout cela sans qu'elles ne ressentent jamais rien. Les estomacs des chauves-souris repues ressemblent à des tiques ; monstrueusement gonflés de sang.\n\nLa présence de ces créatures est un atout pour nos établissements, réduisant le besoin de gardes.\n\nGrâce à notre relation, cette faune native a grandi bien plus que la normale..."
 
 building_cos_bat_1:0 "Chauves-souris Vampires"
 building_type_cos_bat_1:0 "Chauves-souris Vampires"
 building_cos_bat_1_desc:0 "Des Chauves-souris Vampires ont envahi cette région. Ces chauves-souris vampires blanc pâle passent la majeure partie de leur temps à ramper presque imperceptiblement à travers les canopées des Arbres Exsangues. Elles descendent sur les proies endormies et se gorgent du sang de leurs victimes, les vidant complètement en quelques minutes, tout cela sans qu'elles ne ressentent jamais rien. Les estomacs des chauves-souris repues ressemblent à des tiques ; monstrueusement gonflés de sang.\n\nLa présence de ces créatures représente un risque massif pour les établissements de la région et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à leur disparition."
 
 building_cos_bat_2:0 "Chauves-souris Vampires"
 building_type_cos_bat_2:0 "Chauves-souris Vampires Éliminées"
 building_cos_bat_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 
 building_cos_wyvern_1:0 "Wyvernes"
 building_type_cos_wyvern_1:0 "Wyvernes"
 building_cos_wyvern_1_desc:0 "Bien qu'offrant une silhouette similaire le soleil dans le dos, les wyvernes de Sothoryos sont plus étroitement apparentées aux lézards terrestres qu'aux dragons. Elles ne se révèlent pas moins mortelles cependant, quand elles fondent sur leurs proies depuis les cieux ouverts ; les plus grandes étant capables d'emporter hommes et même chevaux sans effort. Les efforts pour débarrasser la région de ces bêtes ne seront pas une mince affaire, car elles nichent presque exclusivement dans des endroits rocheux et difficiles d'accès.\n\nLa présence de ces créatures représente un risque massif pour les établissements de la région et des gardes supplémentaires scrutant les cieux sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à leur disparition ; bien qu'au moins aucun alpha wyverne ne soit présent dans cette zone..."
 
 building_cos_wyvern_2:0 "Wyvernes Éliminées"
 building_type_cos_wyvern_2:0 "Wyvernes Éliminées"
 building_cos_wyvern_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 building_cos_wyvern_alpha_1:0 "Wyvernes Menées par un Alpha"
 building_type_cos_wyvern_alpha_1:0 "Wyvernes Menées par un Alpha"
 building_cos_wyvern_alpha_1_desc:0 "Bien qu'offrant une silhouette similaire le soleil dans le dos, les wyvernes de Sothoryos sont plus étroitement apparentées aux lézards terrestres qu'aux dragons. Ceci est doublement vrai des Wyvernes Alpha, créatures âgées qui se sont établies comme chefs des créatures autrement solitaires. En présence d'un alpha, les wyvernes se perchent en une colonie dense, ce qui signifie que les déloger nécessitera non seulement de vastes quantités d'effort, mais l'abattage de l'alpha lui-même ; de peur qu'il ne déplace simplement sa colonie ailleurs.\n\nLa présence de ces créatures représente un risque massif pour les établissements de la région et des gardes supplémentaires scrutant les cieux sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à leur disparition ; la présence d'une wyverne alpha signe notre perte..."
 
 building_cos_wyvern_alpha_2:0 "Wyvernes Alpha Abattues"
 building_type_cos_wyvern_alpha_2:0 "Wyvernes Alpha Abattues"
 building_cos_wyvern_alpha_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 
 building_cos_carn_plant_1:0 "Plantes Carnivores"
 building_type_cos_carn_plant_1:0 "Plantes Carnivores"
 building_cos_carn_plant_1_desc:0 "Peut-être le groupe le plus distinct de vie naturelle dans l'Enfer Vert sont ses plantes carnivores. Bien que des variétés plus petites, attrape-mouches, existent encore ici, celles-ci sont obscènement éclipsées par leurs cousines sothoryi.\n\nLes plantes carnivores sothoryi peuvent atteindre 15 pieds de large et leurs vrilles tactiles sont capables d'entraver les membres de toute créature, humains inclus, qui déclenchent une réponse de leur part. La plante utilise les propres mouvements de lutte de leurs victimes comme catalyseur énergétique pour les soulever et les déplacer vers sa chambre de digestion centrale remplie d'acide.\n\nUne fois baignés dans ces fluides digestifs... les survivants affirment qu'ils auraient préféré être laissés pour morts, car les éruptions et brûlures persistent pendant des années."
 
 building_cos_carn_plant_2:0 "Plantes Carnivores Élaguées"
 building_type_cos_carn_plant_2:0 "Plantes Carnivores"
 building_cos_carn_plant_2_desc:0 "Cette région a été débarrassée de sa faune dominan-... je veux dire flore."
 
 

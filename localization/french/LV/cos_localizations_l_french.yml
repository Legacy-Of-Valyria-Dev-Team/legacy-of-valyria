 cos_ambush_events.1000.title:0 "Marche Silencieuse - Expéditions de Yeen" 
 cos_ambush_events.1000.desc:0 "Beaucoup de temps et de ressources ont été investis pour rassembler cette expédition armée dans les quartiers intérieurs de Yeen. Il y a une peur silencieuse sur les visages de ceux qui s'exercent en formations devant vous, tandis que les maréchaux tentent de détourner leurs esprits de la cité. Pourtant il y a encore une détermination sinistre chez beaucoup. La volonté de récupérer ou au moins trouver les corps de ceux emmenés dans les nuits depuis notre arrivée ici.\n\nLa cour est lugubre tandis que les barricades sont démolies et aucun cri d'encouragement ne salue l'expédition qui marche... pas un murmure ou bruissement ne peut être entendu ; comme si la jungle elle-même retenait son souffle." 
 cos_ambush_events.1000.attack:0 "Maintenant nous attendons..." 
 
 cos_ambush_events.1001.title:0 "Une Mer de Membres - Expéditions de Yeen" 
 cos_ambush_events.1001.desc:0 "Ce n'est pas le lendemain matin que les premiers signes de l'expédition peuvent être vus. Des feux de camp brûlant par dizaines au-dessus des murs intérieurs. Mes conseillers semblent juger cela comme un bon signe... jusqu'à ce que la fumée monte plus vite et en bien plus d'endroits. Quelque chose ne va clairement pas du tout.\n\nDes cris résonnent maintenant de l'autre côté des barricades replacées. Cris de peur et d'avertissement. À peine un moment de plus passe avant que les premiers appels de mes propres hommes retentissent :\n\n« Regardez là ! Ils passent par-dessus les murs ! »\n\nLa glace coule dans mon cœur tandis que tous les yeux se concentrent sur le corps gras et obscène d'une araignée géante, rampant depuis les murs intérieurs ; bientôt suivie par de nombreuses dizaines d'autres. Peut-être des centaines..." 
 cos_ambush_events.1001.attack:0 "Aux a- Aux armes ! Lances en avant !" 
 

 
    # Decisions #
 
 
 sack_the_maw:0 "Saccager la Gueule Dévorante"
 sack_the_maw_decision_desc:0 "Trop longtemps les fidèles sauvages de la Gueule Éternelle se sont nourris de nous. Mais maintenant leur source de fanatisme est sous notre contrôle...\n\nSimplement laisser la Gueule en l'état risquerait que ses fidèles la reprennent. Avec seulement une poignée d'engins de siège, nous pourrions leur montrer que leur religion appartient au passé, avec leurs pratiques maléfiques."
 sack_the_maw_decision_tooltip:0 "Saccager la Gueule Dévorante"
 sack_the_maw_decision_confirm_text_desc:0 "Faites s'effondrer le toit !"
 sack_the_maw_custom:0 "Les hommes tigrés de cette région perdront beaucoup de leur pouvoir contre-nature... à moins que la gueule ne soit rouverte une fois de plus."
 
 sack_the_glade:0 "Raser les Clairières de Balam"
 sack_the_glade_decision_desc:0 "Les soi-disant 'fils et filles' ont fui maintes et maintes fois devant nous, se retirant de plus en plus profondément dans les brouillards, mais maintenant nous avons trouvé leur site de culte le plus sacré.\n\nPeut-être leurs volontés peuvent-elles enfin être brisées... en détruisant leur connexion à leur 'Mère' une fois pour toutes !"
 sack_the_glade_decision_tooltip:0 "Raser les Clairières de Balam"
 sack_the_glade_decision_confirm_text_desc:0 "Arrachez-les tous !"
 sack_the_glade_custom:0 "Les fidèles de la Mère Verte perdront beaucoup de leur résistance... à moins que la clairière ne soit patiemment refaite pousser sur de nombreuses années."
 
 empower_the_maw:0 "Sacrifier à la Grande Gueule"
 empower_the_maw_decision_desc:0 "La Gueule a faim, elle convoite, d'une certaine manière elle nous fait connaître cela et nous répondrons à ses appels."
 empower_the_maw_decision_tooltip:0 "Sacrifier à la Grande Gueule"
 empower_the_maw_decision_confirm_text_desc:0 "Assouvir la Faim"
 empower_the_maw_custom:0 "Dépensez plus de piété pour recevoir de plus grands dons."
 
 empower_the_mother:0 "Tribut à la Mère Verte"
 empower_the_mother_decision_desc:0 "Il y a longtemps que nous avons rendu grâce à notre Mère pour la dernière fois. D'une certaine manière, nous sentons comme un seul être, qu'Elle est prête à nous bénir une fois de plus."
 empower_the_mother_decision_tooltip:0 "Tribut à la Mère Verte"
 empower_the_mother_decision_confirm_text_desc:0 "Apportez les offrandes"
 empower_the_mother_custom:0 "Dépensez de la piété pour recevoir de plus grands pouvoirs."
 
 sack_the_bloodletters_hall:0 "Raser la Salle du Saigneur"
 sack_the_bloodletters_hall_decision_desc:0 "Les Arbres Exsangues sont ainsi nommés pour la prévalence d'une espèce de chauve-souris vampire blanc pâle y vivant. Ces chauves-souris sont anormalement grandes et peuvent tuer un homme en quelques minutes sans même déranger son sommeil. Cette menace a troublamment donné naissance à un culte adorateur du sang dans les profondeurs de cette zone ; ses fidèles étant connus simplement sous le nom de 'Saigneurs'\n\nCes cultistes vils doivent et seront déracinés de leur source même. Avec eux fuyant maintenant leur salle dans la panique, nous la raserons jusqu'au sol."
 sack_the_bloodletters_hall_decision_tooltip:0 "Raser la Salle du Saigneur"
 sack_the_bloodletters_hall_decision_confirm_text_desc:0 "Mettez-y le feu !"
 sack_the_bloodletters_hall_custom:0 "Les obstacles de chauves-souris vampires goules seront enfin éliminables, sans leurs quasi-bergers pour nous arrêter."
 
 cos_tame_bats:0 "Pacifier les Chauves-Souris Vampires Locales"
 cos_tame_bats_decision_desc:0 "Les Tahae-toto, ou chauves-souris vampires comme les étrangers les appellent, sont des esprits apparentés avec nous. Elles ressentent La Soif, tout comme nous. Bien qu'elles s'attaquent aux étrangers, la sève plâtrée sur nos corps depuis notre jeune âge leur fait savoir que nous ne leur voulons aucun mal. Il est bien temps que nous travaillions avec, et non contre elles."
 cos_tame_bats_decision_tooltip:0 "Pacifier les Chauves-Souris Vampires Locales"
 cos_tame_bats_decision_confirm_text_desc:0 "Comme Un"
 cos_tame_bats_custom:0 "Nous pourrions avoir besoin de prendre cette décision plusieurs fois s'il y en a beaucoup à apprivoiser..."
 
 treat_with_feeders:0 "Apprivoiser les Tahae-toto"
 treat_with_feeders_decision_desc:0 "Étant donné l'interaction constante avec les meutes locales de 'chauves-souris vampires', il n'est pas surprenant qu'un alpha cherche occasionnellement un approvisionnement alimentaire constant avec ses bergers.\n\nLes Chauves-Souris Vampires Goules ont toujours faim de sang frais, bien qu'elles n'aiment pas s'éloigner trop de leur habitat naturel. Avec assez d'incitation et d'entraînement cependant, nous pouvons diriger nos voisines vers les ennemis, répandant ainsi La Soif à tous.\n\nElles se souviendront du sang de leur maître et se disperseront probablement vers leur foyer original si ce maître devait mourir."
 treat_with_feeders_decision_tooltip:0 "Berger une meute de chauves-souris vampires locales plus près de chez nous. Elles se souviendront du sang de leur maître et se disperseront probablement vers leur foyer original si ce maître devait mourir."
 treat_with_feeders_decision_confirm_text_desc:0 "Préparez un festin sanglant !"
 treat_with_feeders_custom:0 "Nos consœurs spirituelles se tiendront prêtes près de notre capitale jusqu'à ce que nous soyons prêts à les déchaîner sur des ennemis sans méfiance."
 

 sack_the_corpse_mounds:0 "Démanteler les Monticules de Cadavres"
 sack_the_corpse_mounds_decision_desc:0 "Entassés haut dans une clairière de jungle se dressent des monticules composés de milliers de corps et d'artefacts en ruines, peut-être bien davantage. Les indigènes de cette région transportent tous les 'envahisseurs' vaincus depuis le rivage, avec toutes leurs possessions étrangères pour les entasser ici.\n\nDes basilics sont attirés par centaines, peut-être même milliers, vers ces collines puantes et pourrissantes. Si nous espérons jamais faire usage de cette rare clairière naturelle dans la jungle, ces monticules doivent disparaître.\n\nLa zone elle-même mise à part, tamiser les détritus pourrait être hautement profitable."
 sack_the_corpse_mounds_decision_tooltip:0 "Démanteler les Monticules de Cadavres"
 sack_the_corpse_mounds_decision_confirm_text_desc:0 "Jusqu'aux genoux dans de vieux os..."
 sack_the_corpse_mounds_custom_1:0 "Les obstacles de Basilics Voraces seront enfin éliminables, sans leur source de nourriture puante pour les garder à proximité."
 sack_the_corpse_mounds_custom_2:0 "Probablement une poignée d'artefacts anciens. Ils travaillent sur ces monticules depuis des centaines, sinon des milliers d'années."
 
 cos_tame_basilisks:0 "Pacifier les Basilics Locaux"
 cos_tame_basilisks_decision_desc:0 "Les Raksasa, ou basilics géants comme les étrangers les appellent, sont des messagers des dieux eux-mêmes. Ils ressentent la grande faim, tout comme nous. Bien qu'ils s'attaquent aux étrangers, notre entretien des Monticules de Cadavres les a rendus presque aimables envers nous en tant que gardiens. Il est bien temps que nous travaillions avec, et non contre eux."
 cos_tame_basilisks_decision_tooltip:0 "Pacifier les Basilics Locaux"
 cos_tame_basilisks_decision_confirm_text_desc:0 "Comme Un"
 cos_tame_basilisks_custom:0 "Nous pourrions avoir besoin de prendre cette décision plusieurs fois s'il y en a beaucoup à apprivoiser..."
 
 
 cos_swamp_wyvern_bonding_decision:0 "Chercher des Vouivres des Marais Vénérables"
 cos_swamp_wyvern_bonding_decision_desc:0 "Bien que les jeunes vouivres des marais soient promptes à la colère et hautement territoriales, celles d'un âge vénérable sont bien plus ouvertes à la manipulation.\n\nEn envoyant des éclaireurs pour trouver, nourrir et diriger ces rares élues, nous pouvons gagner un avantage exceptionnellement aiguisé contre nos ennemis."
 cos_swamp_wyvern_bonding_decision_decision_tooltip:0 ""
 cos_swamp_wyvern_bonding_decision_decision_confirm_text_desc:0 "Envoyez les éclaireurs"
 cos_wyvern_decision_tooltip:0 "Le temps dira si des vouivres appropriées nichent à proximité..."
 


    # Events #
 
 
 cos_swamp_wyvern_bonding:0 "Leurrer un Léviathan - Le Grand Marais"
 cos_swamp_wyvern_bonding_title:0 "Leurrer un Léviathan - Le Grand Marais"
 cos_swamp_wyvern_bonding_desc:0 "Les vouivres qui font du Grand Marais leur foyer sont des créatures extrêmement territoriales. Rivalisant constamment contre leurs voisines pour de plus grandes étendues du sol détrempé à revendiquer. Approcher le territoire d'une telle bête se terminera presque certainement en désastre, car leurs becs et queues létaux font court travail de tout ennemi non-vouivre.\n\nCependant, en vieillissant vers un âge plus vénérable, les vouivres des marais deviennent plus paresseuses et dociles ; plus acceptantes aux offrandes de l'homme. Si c'est bien fait, la bête peut devenir dépendante de ses fournisseurs, finalement devenant disposée à suivre des directions vers de nouvelles sources de 'nourriture'. Que cette nourriture arrive à être d'autres peuples tribaux plus hostiles est sans importance pour la bête.\n\nPlusieurs éclaireurs sont revenus et l'un s'avance pour parler : « Trois ont été trouvées. Combien pouvons-nous nous permettre de nourrir ? »" 
 cos_swamp_wyvern_bonding.opt1:0 "Juste une seule"
 cos_swamp_wyvern_bonding.opt2:0 "Deux seront plus qu'assez"
 cos_swamp_wyvern_bonding.opt3:0 "Trois et que nos ennemis tremblent..."
 cos_swamp_wyvern_bonding.opt4:0 "Aucune... c'était une perte de temps"
 
 
 cos_empower.1001.t:0 "Nourrir la Gueule Dévorante"
 cos_empower.1001.a:0 "Poisson-chat géant toujours affamé des rives du Zamoyos"
 cos_empower.1001.b:0 "Un grand singe abatteur d'arbres du sud"
 cos_empower.1001.c:0 "Une vouivre rusée et monstrueuse du Col Vert !"
 cos_empower.1001.desc:0 "L'année tourne et avec son passage nous devons décider de notre tribut principal à la Gueule Dévorante cette année. Comme nous l'avons fait dans les années plus maigres, de plus petits tributs n'offenseront pas les dieux. Mais pour obtenir de plus grands pouvoirs pour notre peuple, nous devons considérer des prix plus élevés.\n\nLes dieux AURONT leur tribut, peu importe si nous avons l'intention de le retenir ou non... Que sera dévoré cette année, pour que son pouvoir puisse nous être transféré ?"
 
 
 cos_empower.1002.t:0 "Pétitionner la Mère Verte"
 cos_empower.1002.a:0 "Paniers de fourrage frais"
 cos_empower.1002.b:0 "Ornements de pierre sanglante sculptés des falaises"
 cos_empower.1002.c:0 "Une rare orchidée de nuit du lac Zamoyos"
 cos_empower.1002.desc:0 "L'année tourne et avec son passage nous devons décider de notre tribut principal à la Mère Verte cette année. Comme nous l'avons fait dans les années plus maigres, de plus petits tributs n'offenseront pas notre dieu. Mais pour obtenir de plus grands pouvoirs pour notre peuple, nous devons considérer des prix plus élevés.\n\nComme fils et filles véritables, nous serions terriblement honteux de ne pas offrir de remerciements à notre propre mère. La question demeure, quel cadeau lui présenterons-nous cette année ?"
 
 
 cos_blocker.1001.t:0 "La Vouivre Alpha"
 cos_blocker.1001.a:0 "Combat singulier comme les dieux l'ont voulu"
 wyvern_duel_tooltip_1:0 "Vous affrontez l'alpha en duel seul"
 cos_blocker.1001.b:0 "Encercler la bête et ne prendre aucun risque"
 cos_blocker.1001.b.success.desc:0 "Nous encerclons et tuons la bête"
 cos_blocker.1001.b.failure.desc:0 "Nous sommes repoussés par la bête, mais j'échappe dans la foule fuyante"
 cos_blocker.1001.c:0 "Quelque chose de furtif... du poison peut-être..."
 cos_blocker.1001.c.success.desc:0 "La bête est morte, la colonie se disperse."
 cos_blocker.1001.c.failure.desc:0 "Rien ne semble se passer... quelle perte de temps"
 cos_blocker.1001.d:0 "Cette province ne vaut pas ma vie"
 cos_blocker.1001.desc:0 "Cette province a eu un problème significatif de vouivres depuis que nous y avons mis le pied. Bien que les colons aient travaillé diligemment pour les éliminer, et au coût de nombreuses vies qui plus est, il est devenu clair que nous ne pouvons avancer.\n\nLa présence d'une vouivre alpha complique les choses. Si nous continuons maintenant, cette bête déplacera simplement sa colonie ailleurs, potentiellement directement dans une zone plus peuplée. Avec cela à l'esprit...\n\nComment devrais-je m'attaquer à cette bête ?"
 
 cos_blocker.1002.t:0 "La Vouivre Alpha"
 cos_blocker.1002.a:0 "Plus d'hésitation..."
 cos_blocker.1002.a.success.desc:0 "Je me dresse au-dessus des plus puissants ennemis de Sothoryos..."
 cos_blocker.1002.a.failure.desc:0 "Je suis repoussé par la bête et subis de sérieuses blessures..."
 cos_blocker.1002.a.critical.desc:0 "Quel bec aiguisé..."
 
 cos_blocker.1002.b:0 "Peut-être puis-je encore m'échapper !"
 cos_blocker.1002.b.success.desc:0 "Je subis quelques blessures mineures, mais m'échappe..."
 cos_blocker.1002.b.failure.desc:0 "Je subis des blessures majeures, mais m'échappe..."
 
 cos_blocker.1002.desc:0 "Bien que l'on m'ait mis en garde contre une telle témérité... aucun recul ne change le fait que j'affronte maintenant une vouivre alpha en combat singulier.\n\nLa bête se dresse devant moi, ailes étendues de chaque côté en défi. Dans cet état, l'alpha apparaît presque 20 mètres de large et sa silhouette contre le ciel envoie un frisson dans mon épine dorsale. Ses griffes sont aiguisées, son bec plus aiguisé encore. Je n'ai qu'un seul moment maintenant pour faire mon mouvement..."

##################

 cos_yeen_ruins.1000.t:0 "Le Foyer - Expéditions de Yeen"
 cos_yeen_ruins.1000.desc:0 "Le palais est vieux, très vieux. Plein de mémoire et de colère. Des toiles d'araignée filées en cordage épais, bien que non moins collant, s'étendent en grands filets à travers les nombreux halls et passages. Comme c'est l'entrée est complètement impraticable et seule une lame bien aiguisée est capable de trancher.\n\nIl n'y a encore aucun signe des créatures filant ces toiles, bien que le sentiment d'être observé se renforce plus nous nous attardons dans le foyer..."
 
 cos_yeen_ruins.1000.a:0 "Nous nous taillerons un chemin !"
 cos_yeen_ruins.1000.a.success.desc:0 "Nous faisons bon temps vers la grande salle !"
 cos_yeen_ruins.1000.a.failure.desc:0 "Nous progressons lentement..."
 cos_yeen_ruins.1000.a.critical.desc:0 "Nous progressons lentement... et beaucoup d'hommes ont disparu sans laisser de trace."
 
 cos_yeen_ruins.1000.b:0 "Au diable, brûlez tout !"
 cos_yeen_ruins.1000.b.success.desc:0 "Les dommages aux bâtiments environnants sont gardés au minimum."
 cos_yeen_ruins.1000.b.failure.desc:0 "Les bâtiments environnants sont rasés."
 cos_yeen_ruins.1000.b.critical.desc:0 "Le quartier environnant est dévasté... attendez, qu'est-ce qui s'envole du toit ?"
 
 cos_yeen_ruins.1000.c:0 "Le moment n'est pas venu... barrez les portes et dissolvez l'expédition"
 
 
 cos_yeen_ruins.1001.t:0 "Salles Centrales - Expéditions de Yeen"
 cos_yeen_ruins.1001.desc:0 "Un vaste labyrinthe organique de toiles, sacs d'œufs et restes desséchés s'étend devant nous. Nous nous tenons dans ce qui devait être autrefois la grande salle du palais, maintenant il semble être le cœur de la redoutable infestation d'araignées de Yeen."
 
 cos_yeen_ruins.1001.a:0 "Lances en avant ! Haches sur les flancs ! En avant !"
 cos_yeen_ruins.1001.a.success.desc:0 "Ces créatures sans esprit n'ont jamais eu une chance..."
 cos_yeen_ruins.1001.a.failure.desc:0 "Nous sommes mis en déroute, subissant de lourdes pertes."
 cos_yeen_ruins.1001.a.critical.desc:0 "Je me retrouve seul dans les salles."
 
 cos_yeen_ruins.1001.b:0 "Au diable, brûlez tout !"
 cos_yeen_ruins.1001.b.success.desc:0 "Les dommages aux bâtiments environnants sont gardés au minimum."
 cos_yeen_ruins.1001.b.failure.desc:0 "Les bâtiments environnants sont rasés."
 cos_yeen_ruins.1001.b.critical.desc:0 "Le quartier environnant est dévasté... attendez, qu'est-ce qui s'envole du toit ?"
 
 cos_yeen_ruins.1001.c:0 "Le moment n'est pas venu... barrez les portes et dissolvez l'expédition"
 
 cos_yeen_ruins.1002.t:0 "Encerclés - Expéditions de Yeen"
 cos_yeen_ruins.1002.desc:0 "Moi-même et ceux qui restent à mes côtés nous trouvons maintenant encerclés par ces abominations arachnides dans les salles centrales. Les corps paralysés des tombés sont déjà en train d'être coconnés et emportés. Je vois la peur sur les visages de mes compagnons. Leurs yeux dardent vers l'entrée, encore partiellement dégagée d'araignées...\n\nCependant, ces morts ou mourants nous présentent une opportunité unique. Ces araignées qui ont déjà commencé leurs repas macabres semblent singulièrement concentrées sur eux. Cela pourrait être une chance de prendre l'avantage !\n\nOu une façon plus rapide de mourir..."
 
 cos_yeen_ruins.1002.a:0 "Prêts avec moi ! Nous vengeons les tombés !"
 cos_yeen_ruins.1002.a.success.desc:0 "Nous apportons un peu de paix aux tombés..."
 cos_yeen_ruins.1002.a.failure.desc:0 "Nous sommes mis en déroute, subissant de lourdes pertes."
 cos_yeen_ruins.1002.a.critical.desc:0 "Je me retrouve seul dans les salles..."
 cos_yeen_ruins.1002.b:0 "Retraite ! Nous nous taillerons un chemin dehors !"
 cos_yeen_ruins.1002.b.success.desc:0 "Au moins nous nous en sommes sortis vivants. Enfin... la plupart d'entre nous."
 cos_yeen_ruins.1002.b.failure.desc:0 "Au moins nous nous en sommes sortis vivants. Enfin... certains d'entre nous."
 cos_yeen_ruins.1002.b.critical.desc:0 "Je suis forcé de fuir plus profondément à l'intérieur... seul."
 
cos_yeen_ruins.1002.c:0 "Il est temps de se replier... barrez les portes et dissolvez l'expédition"
 
 cos_yeen_ruins.1003.t:0 "Les Salles Gémissantes"
 cos_yeen_ruins.1003.desc:0 "Au-delà du nid proprement dit se trouve une salle étrange entièrement dépourvue de toute toile. En fait, cette zone est dépourvue de tout signe de créatures vivantes. Le passage s'ouvre sur une chambre massive, ouverte à l'air par un balcon d'un côté, surplombant le quartier noble. Les murs, sol et plafond sont tous gravés avec une sorte de langage ici, des couleurs sombres tourbillonnant dans les lettres. Du coin de l'œil vous pouvez presque les voir pulser, mais elles demeurent toujours apparemment inertes une fois votre attention revenue sur elles.\n\nLes gravures sont impeccables et il ne faut pas longtemps avant que vous réalisiez comment c'est possible. Les murs suintent constamment une sorte de fluide huileux à une vitesse extrêmement lente ; presque imperceptible. Cette 'ichor' coule à travers de minuscules fissures entre les carreaux du sol vers une destination inconnue, nous épargnant de son accumulation.\n\nMis à part les murs fascinants, la pièce est sans particularité et nue. Quelques minutes de plus passent avant que quoi que ce soit d'autre de significatif soit trouvé tandis que la vaste chambre est fouillée. Des marques de griffes... massives et indubitablement celles d'un dragon. Il y a aussi des marques de brûlure, une région des gravures soufflée par les flammes de dragon ; vous aviez entendu dire que le feu de dragon, spécialement d'un spécimen de cette taille, aurait transformé la pierre froide en beurre en moments, mais cette pierre noire huileuse semble avoir résisté à l'effet, ne serait-ce que quelque peu...\n\nUn dernier appel d'attention résonne à travers la chambre résonnante. Les restes anciens et décomposés d'un campement près du balcon. Il semble que son propriétaire soit parti précipitamment, laissant derrière lui une grande partie de son camp, plus notamment #bold un coffre d'artefacts valyriens mineurs #! Plus excitant encore, caché dans un paquet au fond d'un coffre se trouve un grand œuf écaillé. Ce doit être le campement de Jaenara Belaerys, faisant de cet œuf celui du dragon Terrax ! Vous priez que les âges dans ce lieu maudit n'aient pas affecté l'œuf d'une certaine façon..."
 
 cos_yeen_ruins.1003.a:0 "Nous avons réussi là où les seigneurs dragons ont échoué !"
 cos_yeen_ruins.1003.a.success.desc:0 "Ces créatures sans esprit n'ont jamais eu une chance..."
 cos_yeen_ruins.1003.a.failure.desc:0 "Nous sommes mis en déroute, subissant de lourdes pertes."
 cos_yeen_ruins.1003.a.critical.desc:0 "Je me retrouve seul dans les salles. J'entends des sons tout autour de moi...\n\nSoudain ces sons de cliquetis et de craquements se taisent et je suis tiré vers le haut par l'épaule. Je ressens une douleur soudaine et mordante dans ma cuisse, avant que la douleur... toute douleur, me quitte. C'est ainsi que je finis."
 
 cos_yeen_ruins.9999.t:0 "Seul dans les Ténèbres - Expéditions de Yeen"
 cos_yeen_ruins.9999.desc:0 "Je me retrouve seul dans les salles. J'entends des sons tout autour de moi...\n\nSoudain ces sons de cliquetis et de craquements se taisent et je suis tiré vers le haut par l'épaule. Je ressens une douleur soudaine et mordante dans ma cuisse, avant que la douleur... toute douleur, me quitte. C'est ainsi que je finis."
 cos_yeen_ruins.9999.a:0 "C'est ainsi que mon histoire se termine..."

    # Custom Tooltips #
    
 yeen_burn_it_down:0 "Brûlez toute trace de vie du bâtiment... avec tout ce qui a de la valeur ou de l'intérêt à l'intérieur."
 yeen_partial_refund:0 "Vous récupérez une grande partie des biens investis dans l'expédition."
 yeen_death:0 "Pas de seconde chance. Vous mourez tout seul."
 yeen_advance:0 "Vous avancez..."
 yeen_no_retreat:0 "Vous avez encore l'option de forcer une autre attaque..."
 
    # Modifiers #
 
 
 cos_empowered_maw_1:0 "A Satisfait la Gueule Dévorante"

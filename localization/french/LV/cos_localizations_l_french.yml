    # Ambush Names #

 cos_name_spider_man:0 "Homme-araignée" 
 cos_name_spider_duchy_title:0 "Les Fils et Filles de Yeen"
 spider_army_name:0 "Fils et Filles de Yeen"
 cos_spider_ambush_cb:0 "Autodéfense Sauvage"
 SPIDER_AMBUSH_CB_NAME:0 "Autodéfense Sauvage"
 SPIDER_AMBUSH_CB_NAME_BASE:0 "Autodéfense Sauvage"
 SPIDER_AMBUSH_CB:0 "Autodéfense Sauvage"
 
 cos_ambush_events.1000.title:0 "Marche Silencieuse - Expéditions de Yeen" 
 cos_ambush_events.1000.desc:0 "Beaucoup de temps et de ressources ont été investis pour rassembler cette expédition armée dans les quartiers intérieurs de Yeen. Il y a une peur silencieuse sur les visages de ceux qui s'entraînent en formation devant vous, alors que les maréchaux tentent de détourner leurs esprits de la ville. Pourtant, il y a une détermination sinistre chez beaucoup. La volonté de retrouver ou au moins trouver les corps de ceux pris dans les nuits depuis notre arrivée ici.\n\nLa cour est étrange alors que les barricades sont démolies et aucun encouragement n'est crié à l'expédition alors qu'elle marche... pas un murmure ou bruissement ne peut être entendu ; comme si la jungle elle-même retenait son souffle." 
 cos_ambush_events.1000.attack:0 "Maintenant nous attendons..." 
 
 cos_ambush_events.1001.title:0 "Une Mer de Membres - Expéditions de Yeen" 
 cos_ambush_events.1001.desc:0 "Ce n'est pas le lendemain matin que les premiers signes de l'expédition peuvent être vus. Des feux de camp brûlant par dizaines sur les murs intérieurs. Mes conseillers semblent juger cela comme un bon signe... jusqu'à ce que la fumée s'élève plus vite et en beaucoup plus d'endroits. Quelque chose ne va clairement pas bien.\n\nDes cris résonnent maintenant de l'autre côté des barricades remplacées. Des cris de peur et d'avertissement. À peine un instant de plus passe avant que les premiers appels de mes propres hommes ne retentissent :\n\n\"Regardez là ! Ils arrivent par-dessus les murs !\"\n\nLa glace coule dans mon cœur alors que tous les yeux se concentrent sur le corps gras et obscène d'une araignée géante, rampant depuis les murs intérieurs ; rapidement suivie par plusieurs dizaines d'autres. Peut-être des centaines..." 
 cos_ambush_events.1001.attack:0 "A- Aux armes ! Lances en avant !" 
 

 
    # Decisions #
 
 
 sack_the_maw:0 "Piller la Gueule Dévorante"
 sack_the_maw_decision_desc:0 "Trop longtemps les adeptes sauvages de la Gueule Éternelle ont fait de nous leurs proies. Mais maintenant leur source de fanatisme est sous notre contrôle...\n\nSimplement laisser la Gueule ainsi risquerait que ses fidèles la reprennent. Avec juste une poignée d'engins de siège, nous pourrions leur montrer que leur religion appartient au passé, avec leurs pratiques maléfiques."
 sack_the_maw_decision_tooltip:0 "Piller la Gueule Dévorante"
 sack_the_maw_decision_confirm_text_desc:0 "Faites s'écrouler le plafond !"
 sack_the_maw_custom:0 "Les hommes tachetés de cette région perdront beaucoup de leur pouvoir surnaturel... à moins que la gueule ne soit rouverte."
 
 sack_the_glade:0 "Raser les Clairières de Balam"
 sack_the_glade_decision_desc:0 "Les soi-disant 'fils et filles' ont fui encore et encore devant nous, se retirant toujours plus profondément dans les brumes, mais maintenant nous avons trouvé leur site de culte le plus sacré.\n\nPeut-être que leurs volontés peuvent enfin être brisées... en détruisant leur connexion à leur 'Mère' une fois pour toutes !"
 sack_the_glade_decision_tooltip:0 "Raser les Clairières de Balam"
 sack_the_glade_decision_confirm_text_desc:0 "Arrachez-les toutes !"
 sack_the_glade_custom:0 "Les fidèles de la Mère Verte perdront beaucoup de leur résilience... à moins que la clairière ne soit minutieusement cultivée à nouveau pendant de nombreuses années."
 
 empower_the_maw:0 "Sacrifice à la Grande Gueule"
 empower_the_maw_decision_desc:0 "La Gueule a faim, elle désire, d'une manière ou d'une autre elle nous le fait savoir et nous répondrons à ses appels."
 empower_the_maw_decision_tooltip:0 "Sacrifice à la Grande Gueule"
 empower_the_maw_decision_confirm_text_desc:0 "Assouvir la Faim"
 empower_the_maw_custom:0 "Dépensez plus de piété pour recevoir de plus grands dons."
 
 empower_the_mother:0 "Tribut à la Mère Verte"
 empower_the_mother_decision_desc:0 "Cela fait longtemps que nous n'avons pas remercié notre Mère. D'une certaine manière, nous sentons comme un seul qu'Elle est prête à nous bénir à nouveau."
 empower_the_mother_decision_tooltip:0 "Tribut à la Mère Verte"
 empower_the_mother_decision_confirm_text_desc:0 "Apportez les offrandes"
 empower_the_mother_custom:0 "Dépensez de la piété pour recevoir de plus grands pouvoirs."
 
 sack_the_bloodletters_hall:0 "Raser la Salle du Saigneur"
 sack_the_bloodletters_hall_decision_desc:0 "Les Arbres Exsangues sont ainsi nommés en raison de la prévalence d'une espèce de chauve-souris vampire blanc-pâle y vivant. Ces chauves-souris sont anormalement grandes et peuvent tuer un homme en quelques minutes sans même perturber son sommeil. Cette menace a donné naissance de manière troublante à un culte du sang dans les profondeurs de cette zone ; ses fidèles étant connus simplement comme 'Saigneurs'.\n\nCes vils cultistes doivent et seront déracinés de leur source même. Avec eux fuyant maintenant leur salle dans la panique, nous la raserons jusqu'au sol."
 sack_the_bloodletters_hall_decision_tooltip:0 "Raser la Salle du Saigneur"
 sack_the_bloodletters_hall_decision_confirm_text_desc:0 "Mettez-y le feu !"
 sack_the_bloodletters_hall_custom:0 "Les bloqueurs de chauves-souris vampires macabres pourront enfin être éliminés, sans leurs quasi-bergers pour nous arrêter."
 
 cos_tame_bats:0 "Pacifier les Chauves-souris Vampires locales"
 cos_tame_bats_decision_desc:0 "Les Tahae-toto, ou chauves-souris vampires comme les étrangers les appellent, sont des esprits apparentés aux nôtres. Elles ressentent La Soif, tout comme nous. Bien qu'elles s'attaquent aux étrangers, la sève plâtrée sur nos corps depuis notre plus jeune âge leur fait savoir que nous ne leur voulons aucun mal. Il est grand temps que nous travaillions avec, et non contre elles."
 cos_tame_bats_decision_tooltip:0 "Pacifier les Chauves-souris Vampires locales"
 cos_tame_bats_decision_confirm_text_desc:0 "Comme Un"
 cos_tame_bats_custom:0 "Nous devrons peut-être prendre cette décision plusieurs fois s'il y en a beaucoup à apprivoiser..."
 
 treat_with_feeders:0 "Apprivoiser les Tahae-toto"
 treat_with_feeders_decision_desc:0 "Étant donné l'interaction constante avec les meutes locales de 'chauves-souris vampires', il n'est pas surprenant qu'un alpha cherche occasionnellement un approvisionnement alimentaire constant avec leurs bergers.\n\nLes chauves-souris vampires macabres ont toujours faim de sang frais, bien qu'elles n'aiment pas trop s'éloigner de leur habitat naturel. Avec suffisamment d'incitation et d'entraînement cependant, nous pouvons guider nos voisins vers les ennemis, répandant ainsi La Soif à tous.\n\nElles se souviendront du sang de leur maître et se disperseront probablement vers leur foyer d'origine si ce maître meurt."
 treat_with_feeders_decision_tooltip:0 "Guider une meute de chauves-souris vampires locales plus près de chez nous. Elles se souviendront du sang de leur maître et se disperseront probablement vers leur foyer d'origine si ce maître meurt."
 treat_with_feeders_decision_confirm_text_desc:0 "Préparez un festin sanglant !"
 treat_with_feeders_custom:0 "Nos esprits-parents se tiendront prêts près de notre capitale jusqu'à ce que nous soyons prêts à les lâcher sur des ennemis sans méfiance."
 
 treat_with_devourers:0 "Apprivoiser les Basilics Voraces"
 treat_with_devourers_decision_desc:0 "PLACEHOLDER"
 treat_with_devourers_decision_tooltip:0 "PLACEHOLDER"
 treat_with_devourers_decision_confirm_text_desc:0 "PLACEHOLDER"
 treat_with_devourers_custom:0 "PLACEHOLDER"

 cos_ruin_completion_fallback:0 "Achèvement de Ruine de Débug"
 cos_debug_trigger_decision_desc:0 "PLACEHOLDER"
 cos_debug_trigger_decision_tooltip:0 "PLACEHOLDER"
 cos_debug_trigger_decision_confirm_text_desc:0 "PLACEHOLDER"

 cos_debug_trigger_dont_touch:0 "Débug Ne Pas Toucher"

 sack_the_corpse_mounds:0 "Démanteler les Monticules de Cadavres"
 sack_the_corpse_mounds_decision_desc:0 "Entassés dans une clairière de jungle se dressent des monticules constitués de milliers de corps et d'artefacts en ruine, peut-être des ordres de grandeur supérieurs. Les natifs de cette région transportent tous les 'envahisseurs' vaincus depuis le rivage, avec toutes leurs possessions étrangères pour être entassées ici.\n\nDes basilics sont attirés par centaines, peut-être même milliers, vers ces collines puantes et pourrissantes. Si nous espérons jamais faire usage de cette rare clairière naturelle dans la jungle, ces monticules doivent disparaître.\n\nLa zone elle-même mise à part, tamiser à travers les déchets pourrait être très profitable."
 sack_the_corpse_mounds_decision_tooltip:0 "Démanteler les Monticules de Cadavres"
 sack_the_corpse_mounds_decision_confirm_text_desc:0 "Jusqu'aux genoux dans de vieux os..."
 sack_the_corpse_mounds_custom_1:0 "Les bloqueurs de Basilics Voraces pourront enfin être éliminés, sans leur source de nourriture puante qui les maintient à proximité."
 sack_the_corpse_mounds_custom_2:0 "Probablement une poignée d'artefacts anciens. Ils travaillent sur ces monticules depuis des centaines, sinon des milliers d'années."
 
 cos_tame_basilisks:0 "Pacifier les Basilics locaux"
 cos_tame_basilisks_decision_desc:0 "Les Raksasa, ou basilics géants comme les étrangers les appellent, sont des messagers des dieux eux-mêmes. Ils ressentent la grande faim, tout comme nous. Bien qu'ils s'attaquent aux étrangers, notre entretien des Monticules de Cadavres les a rendus presque aimables envers nous en tant que gardiens. Il est grand temps que nous travaillions avec, et non contre eux."
 cos_tame_basilisks_decision_tooltip:0 "Pacifier les Basilics locaux"
 cos_tame_basilisks_decision_confirm_text_desc:0 "Comme Un"
 cos_tame_basilisks_custom:0 "Nous devrons peut-être prendre cette décision plusieurs fois s'il y en a beaucoup à apprivoiser..."
 
 
 cos_swamp_wyvern_bonding_decision:0 "Chercher des Vouivres des Marais Vénérables"
 cos_swamp_wyvern_bonding_decision_desc:0 "Bien que les jeunes vouivres des marais soient rapides à s'énerver et hautement territoriales, celles d'un âge vénérable sont bien plus ouvertes à la manipulation.\n\nEn envoyant des éclaireurs pour trouver, nourrir et diriger ces rares élues, nous pouvons gagner un avantage exceptionnellement tranchant contre nos ennemis."
 cos_swamp_wyvern_bonding_decision_decision_tooltip:0 ""
 cos_swamp_wyvern_bonding_decision_decision_confirm_text_desc:0 "Envoyez les éclaireurs"
 cos_wyvern_decision_tooltip:0 "Le temps dira si des vouivres appropriées se perchent à proximité..."
 


    # Events #
 
 
 cos_swamp_wyvern_bonding:0 "Attirer un Léviathan - Le Grand Marais"
 cos_swamp_wyvern_bonding_title:0 "Attirer un Léviathan - Le Grand Marais"
 cos_swamp_wyvern_bonding_desc:0 "Les vouivres qui habitent le Grand Marais sont des créatures extrêmement territoriales. Constamment en compétition avec leurs voisins pour de plus grandes étendues du sol détrempé à revendiquer comme leur. S'approcher du territoire d'une telle bête finira presque certainement en catastrophe, car leurs becs et queues mortels font rapidement le travail de tout ennemi non-vouivre.\n\nCependant, en vieillissant, les vouivres des marais deviennent plus paresseuses et dociles ; plus acceptant les offrandes de l'homme. Si bien fait, la bête peut devenir dépendante de ses fournisseurs, devenant finalement disposée à suivre les directions vers de nouvelles sources de 'nourriture'. Que cette nourriture soit d'autres personnes tribales plus hostiles est sans importance pour la bête.\n\nPlusieurs éclaireurs sont revenus et l'un s'avance pour parler : \"Trois ont été trouvées. Combien pouvons-nous nous permettre de nourrir ?\""
 cos_swamp_wyvern_bonding.opt1:0 "Juste une"
 cos_swamp_wyvern_bonding.opt2:0 "Deux suffiront amplement"
 cos_swamp_wyvern_bonding.opt3:0 "Trois et que nos ennemis tremblent..."
 cos_swamp_wyvern_bonding.opt4:0 "Aucune... c'était une perte de temps"
 
 
 cos_empower.1001.t:0 "Nourrir la Gueule Dévorante"
 cos_empower.1001.a:0 "Des poissons-chats géants toujours affamés sur les rives du Zamoyos"
 cos_empower.1001.b:0 "Un grand singe abatteur d'arbres du sud"
 cos_empower.1001.c:0 "Une vouivre rusée et monstrueuse du Col Vert !"
 cos_empower.1001.desc:0 "L'année tourne et avec son passage nous devons décider de notre tribut principal à la Gueule Dévorante cette année. Comme nous l'avons fait dans les années plus rares, de plus petits tributs n'offenseront pas les dieux. Mais pour obtenir de plus grands pouvoirs pour notre peuple, nous devons considérer des prix plus élevés.\n\nLes dieux AURONT leur tribut, que nous ayons l'intention de le retenir ou non... Qu'est-ce qui sera dévoré cette année, afin que sa puissance puisse nous être transférée ?"
 
 
 cos_empower.1002.t:0 "Pétitionner la Mère Verte"
 cos_empower.1002.a:0 "Paniers de cueillette fraîche"
 cos_empower.1002.b:0 "Ornements de pierre-de-sang sculptés des falaises"
 cos_empower.1002.c:0 "Une rare orchidée nocturne du lac Zamoyos"
 cos_empower.1002.desc:0 "L'année tourne et avec son passage nous devons décider de notre tribut principal à la Mère Verte cette année. Comme nous l'avons fait dans les années plus rares, de plus petits tributs n'offenseront pas notre dieu. Mais pour obtenir de plus grands pouvoirs pour notre peuple, nous devons considérer des prix plus élevés.\n\nComme vrais fils et filles, nous serions terriblement honteux de ne pas offrir de remerciements à notre propre mère. La question demeure, quel cadeau lui présenterons-nous cette année ?"
 
 
 cos_blocker.1001.t:0 "La Vouivre Alpha"
 cos_blocker.1001.a:0 "Combat singulier comme les dieux l'ont voulu"
 wyvern_duel_tooltip_1:0 "Vous engagez l'alpha en duel seul"
 cos_blocker.1001.b:0 "Encerclez la bête et ne prenez aucun risque"
 cos_blocker.1001.b.success.desc:0 "Nous encerclons et tuons la bête"
 cos_blocker.1001.b.failure.desc:0 "Nous sommes repoussés par la bête, mais j'échappe dans la foule en fuite"
 cos_blocker.1001.c:0 "Quelque chose de discret... du poison peut-être..."
 cos_blocker.1001.c.success.desc:0 "La bête est morte, la colonie se disperse."
 cos_blocker.1001.c.failure.desc:0 "Rien ne semble se passer... quelle perte de temps"
 cos_blocker.1001.d:0 "Cette province ne vaut pas ma vie"
 cos_blocker.1001.desc:0 "Cette province a eu un problème de vouivres significatif depuis que nous y avons mis les pieds. Bien que les colons aient travaillé diligemment pour les éliminer, et au coût de nombreuses vies, il est devenu clair que nous ne pouvons pas avancer.\n\nLa présence d'une vouivre alpha complique les choses. Si nous continuons maintenant, cette bête déplacera simplement sa colonie ailleurs, potentiellement directement dans une zone plus peuplée. Avec cela en tête...\n\nComment devrais-je m'attaquer à cette bête ?"
 
 cos_blocker.1002.t:0 "La Vouivre Alpha"
 cos_blocker.1002.a:0 "Plus d'hésitation..."
 cos_blocker.1002.a.success.desc:0 "Je me tiens au-dessus des ennemis les plus puissants de Sothoryos..."
 cos_blocker.1002.a.failure.desc:0 "Je suis repoussé par la bête et subis de graves blessures..."
 cos_blocker.1002.a.critical.desc:0 "Quel bec tranchant..."
 
 cos_blocker.1002.b:0 "Peut-être puis-je encore m'échapper !"
 cos_blocker.1002.b.success.desc:0 "Je subis quelques blessures mineures, mais m'échappe..."
 cos_blocker.1002.b.failure.desc:0 "Je subis des blessures majeures, mais m'échappe..."
 
 cos_blocker.1002.desc:0 "Bien qu'on m'ait mis en garde contre une telle imprudence... aucune rétrospection ne change le fait que je fais maintenant face à une vouivre alpha en combat singulier.\n\nLa bête se dresse devant moi, ailes étendues de chaque côté en défi. Dans cet état, l'alpha apparaît presque 20 mètres (~60ft) de largeur et sa silhouette contre le ciel m'envoie un frisson dans l'échine. Ses griffes sont tranchantes, son bec plus tranchant. Je n'ai qu'un seul moment maintenant pour faire mon mouvement..."

##################

 cos_yeen_ruins.1000.t:0 "Le Foyer - Expéditions de Yeen"
 cos_yeen_ruins.1000.desc:0 "Le palais est vieux, très vieux. Plein de mémoire et de colère. Des toiles d'araignée filées en cordage épais, bien que non moins collantes, s'étendent en grands filets à travers les nombreuses salles et passages. Tel quel, l'entrée est complètement infranchissable et seule une lame bien affûtée est capable de trancher.\n\nIl n'y a encore aucun signe des créatures filant ces toiles, bien que le sentiment d'être observé devienne plus fort plus nous nous attardons dans le foyer..."
 
 cos_yeen_ruins.1000.a:0 "Nous nous frayerons un chemin !"
 cos_yeen_ruins.1000.a.success.desc:0 "Nous progressons bien vers la grande salle !"
 cos_yeen_ruins.1000.a.failure.desc:0 "Nous progressons lentement..."
 cos_yeen_ruins.1000.a.critical.desc:0 "Nous progressons lentement... et beaucoup d'hommes ont disparu sans laisser de trace."
 
 cos_yeen_ruins.1000.b:0 "Au diable, brûlez tout !"
 cos_yeen_ruins.1000.b.success.desc:0 "Les dommages aux bâtiments environnants sont maintenus au minimum."
 cos_yeen_ruins.1000.b.failure.desc:0 "Les bâtiments environnants sont rasés."
 cos_yeen_ruins.1000.b.critical.desc:0 "Le quartier environnant est dévasté... attendez, qu'est-ce qui sort du toit ?"
 
 cos_yeen_ruins.1000.c:0 "Le moment n'est pas propice... barrez les portes et dissolvez l'expédition"
 
 
 cos_yeen_ruins.1001.t:0 "Salles Centrales - Expéditions de Yeen"
 cos_yeen_ruins.1001.desc:0 "Un vaste labyrinthe organique de toiles, sacs d'œufs et restes desséchés s'étend devant nous. Nous nous tenons dans ce qui devait être autrefois la grande salle du palais, maintenant c'est le cœur de l'infestation d'araignées redoutée de Yeen."
 
 cos_yeen_ruins.1001.a:0 "Lances devant ! Haches sur les flancs ! En avant !"
 cos_yeen_ruins.1001.a.success.desc:0 "Ces créatures sans cervelle n'avaient aucune chance..."
 cos_yeen_ruins.1001.a.failure.desc:0 "Nous sommes mis en déroute, tout en subissant de lourdes pertes."
 cos_yeen_ruins.1001.a.critical.desc:0 "Je me retrouve seul dans les salles."
 
 cos_yeen_ruins.1001.b:0 "Au diable, brûlez tout !"
 cos_yeen_ruins.1001.b.success.desc:0 "Les dommages aux bâtiments environnants sont maintenus au minimum."
 cos_yeen_ruins.1001.b.failure.desc:0 "Les bâtiments environnants sont rasés."
 cos_yeen_ruins.1001.b.critical.desc:0 "Le quartier environnant est dévasté... attendez, qu'est-ce qui sort du toit ?"
 
 cos_yeen_ruins.1001.c:0 "Le moment n'est pas propice... barrez les portes et dissolvez l'expédition"
 
 cos_yeen_ruins.1002.t:0 "Encerclés - Expéditions de Yeen"
 cos_yeen_ruins.1002.desc:0 "Moi-même et ceux qui restent à mes côtés nous trouvons maintenant encerclés par ces abominations arachnides dans les salles centrales. Les corps paralysés des tombés sont déjà en train d'être encoconnés et emportés. Je vois la peur sur les visages de mes compagnons. Leurs yeux retournent vers l'entrée, encore partiellement dégagée d'araignées...\n\nCependant, ces morts ou mourants nous présentent une opportunité unique. Ces araignées qui ont déjà commencé leurs repas macabres semblent singulièrement concentrées sur eux. Cela pourrait être une chance de prendre l'avantage !\n\nOu une façon plus rapide de mourir..."
 
 cos_yeen_ruins.1002.a:0 "Préparez-vous avec moi ! Nous vengeons les tombés !"
 cos_yeen_ruins.1002.a.success.desc:0 "Nous apportons une petite paix aux tombés..."
 cos_yeen_ruins.1002.a.failure.desc:0 "Nous sommes mis en déroute, tout en subissant de lourdes pertes."
 cos_yeen_ruins.1002.a.critical.desc:0 "Je me retrouve seul dans les salles..."
 cos_yeen_ruins.1002.b:0 "Retraite ! Nous nous frayerons un chemin !"
 cos_yeen_ruins.1002.b.success.desc:0 "Au moins nous sommes sortis vivants. Enfin... la plupart d'entre nous."
 cos_yeen_ruins.1002.b.failure.desc:0 "Au moins nous sommes sortis vivants. Enfin... certains d'entre nous."
 cos_yeen_ruins.1002.b.critical.desc:0 "Je suis forcé de fuir plus loin à l'intérieur... seul." 
 
 cos_yeen_ruins.1002.c:0 "Il est temps de battre en retraite... barrez les portes et dissolvez l'expédition"
 
 cos_yeen_ruins.1003.t:0 "Les Salles Pleurantes"
 cos_yeen_ruins.1003.desc:0 "Au-delà du nid proprement dit se trouve une salle étrangement dépourvue de toute toile. En fait, cette zone est dépourvue de tout signe de créatures vivantes. Le passage s'ouvre sur une chambre massive, ouverte sur l'air par un balcon d'un côté, surplombant le quartier noble. Les murs, le sol et le plafond sont tous gravés d'une sorte de langue ici, des couleurs sombres tourbillonnant dans les lettres. Du coin de votre œil, vous pouvez presque les voir pulser, mais elles restent toujours apparemment inertes une fois votre attention revenue sur elles.\n\nLes gravures sont impeccables et il ne faut pas longtemps avant de réaliser comment c'est possible. Les murs suintent constamment une sorte de fluide huileux à une vitesse extrêmement lente ; presque imperceptible. Cet 'ichor' coule à travers de minuscules espaces entre les carreaux du sol vers une destination inconnue, nous épargnant de son accumulation.\n\nÀ part les murs fascinants, la pièce est banale et nue. Quelques minutes de plus passent avant que quelque chose d'autre d'important ne soit trouvé alors que la vaste chambre est fouillée. Des marques de griffes... massives et indubitablement celles d'un dragon. Il y a aussi des marques de brûlure, une région des gravures soufflée par le feu de dragon ; vous aviez entendu dire que le feu de dragon, surtout d'un spécimen de cette taille, aurait transformé la pierre froide en beurre en quelques instants, mais cette pierre noire huileuse semble avoir résisté à l'effet, ne serait-ce que quelque peu...\n\nUn dernier appel d'attention résonne à travers la chambre résonnante. Les restes anciens décomposés d'un campement près du balcon. Il semble que son propriétaire soit parti à la hâte, laissant derrière lui une grande partie de son camp, notamment #bold un coffre à bagages de petits artefacts valyriens #! Plus excitant encore, rangé dans un paquet au fond d'un coffre se trouve un grand œuf écaillé. Ce doit être le campement de Jaenara Belaerys, faisant de cet œuf celui du dragon Terrax ! Vous priez que les âges passés dans cet endroit maléfique n'aient pas affecté l'œuf d'une manière ou d'une autre..."
 
 cos_yeen_ruins.1003.a:0 "Nous avons réussi là où les Lords dragons ont échoué !"
 cos_yeen_ruins.1003.a.success.desc:0 "Ces créatures sans cervelle n'avaient aucune chance..."
 cos_yeen_ruins.1003.a.failure.desc:0 "Nous sommes mis en déroute, tout en subissant de lourdes pertes."
 cos_yeen_ruins.1003.a.critical.desc:0 "Je me retrouve seul dans les salles. J'entends des sons tout autour de moi...\n\nSoudain, ces sons de cliquetis et de claquements se taisent et je suis tiré vers le haut par mon épaule. Je ressens une douleur soudaine et mordante dans ma cuisse, avant que la douleur... toute douleur, ne me quitte. C'est ainsi que je finis."
 
 cos_yeen_ruins.9999.t:0 "Seul dans le Noir - Expéditions de Yeen"
 cos_yeen_ruins.9999.desc:0 "Je me retrouve seul dans les salles. J'entends des sons tout autour de moi...\n\nSoudain, ces sons de cliquetis et de claquements se taisent et je suis tiré vers le haut par mon épaule. Je ressens une douleur soudaine et mordante dans ma cuisse, avant que la douleur... toute douleur, ne me quitte. C'est ainsi que je finis."
 cos_yeen_ruins.9999.a:0 "C'est ainsi que mon histoire se termine..."


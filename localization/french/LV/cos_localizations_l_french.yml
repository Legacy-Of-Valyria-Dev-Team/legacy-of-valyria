 yeen_burn_it_down:0 "Brûlez toute trace de vie du bâtiment... avec tout ce qui a de la valeur ou de l'intérêt à l'intérieur."
 yeen_partial_refund:0 "Vous récupérez une grande partie des actifs investis dans l'expédition."
 yeen_death:0 "Pas de seconde chance. Vous mourez tout seul."
 yeen_advance:0 "Vous avancez..."
 yeen_no_retreat:0 "Vous avez toujours la possibilité de forcer une autre attaque..."
 

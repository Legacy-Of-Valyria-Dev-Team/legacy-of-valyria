 lv_tradition_brindled_men_name:0 "Peau Tigrée"
 lv_tradition_brindled_men_desc:0 "Les mestres de Westeros écrivent que les Sothoryens ne sont point de vrais hommes, mais des créatures brutales — aux membres énormes, à la peau tigrée, plus porcs qu'humains. Leurs récits parlent de sauvagerie, de dieux sombres, de festins cannibales et de rites obscènes. Ainsi disent les érudits, et ainsi répètent les marchands et pirates des côtes méridionales, qui traitent le peuple tigré comme moins qu'humain. Pourtant de tels récits sont tissés davantage de rumeurs et de calomnies que de vérité, car les Sothoryens sont bel et bien humains, bien qu'étranges aux yeux des étrangers. Ce qui est appelé sauvagerie n'est souvent pas plus que la coutume d'un peuple peu connu et rarement compris, survivants tenaces des profondeurs vertes de l'enfer sothoryien."
 
 
                
                
    # Faiths Locals #
 
sothoryos_religion:0 "Cultes de l'Enfer Vert" 
sothoryos_religion_adj:0 "Cultes de l'Enfer Vert" 
sothoryos_religion_desc:0 "Forgées par l'isolement et l'environnement impitoyable, les religions de Sothoryos ont été façonnées par la survie, le monde naturel et les horreurs surnaturelles qui, dit-on, hantent ces terres maudites." 

the_eternal_maw:0 "La Gueule Éternelle"         
the_eternal_maw_adj:0 "La Gueule Éternelle"
the_eternal_maw_desc:0 "La Gueule Éternelle est une religion centrée sur l'idée que le monde est une grande force dévorante, et que toute vie existe pour être consumée. Ses fidèles croient que le sacrifice et le cannibalisme renforcent l'âme, permettant de revenir dans la prochaine vie comme prédateur plus puissant plutôt que comme proie."         

the_green_mother:0 "La Mère Verte"         
the_green_mother_adj:0 "La Mère Verte"
the_green_mother_desc:0 "Cette foi vénérant la nature considère que la jungle elle-même est une déesse vivante, à la fois nourricière et impitoyable. La Mère Verte pourvoit à ceux qui la respectent mais dévore ceux qui prennent trop."  

the_thirst:0 "La Soif"     
the_thirst_adj:0 "La Soif"
the_thirst_desc:0 "Le culte régional des Hommes Tachetés, régnant sur les Arbres Exsangues. La Soif est une extension de leur symbiose avec les chauves-souris vampires blanc-pâle de la région. Plus précisément, le culte gravite autour des caprices d'un chef tout-puissant connu comme 'Le Saigneur'.\n\nPeu sont admis dans les salles les plus privées du Saigneur, mais ceux qui y pénètrent rapportent un unique bassin de pierre noire huileuse en son centre ; toujours 'rempli'."
holy_site_thirsty_hall_name:0 "La Salle du Saigneur"
the_thirst_adherent_plural:0 "Liés-par-le-Sang"

serpents_grasp:0 "L'Étreinte du Serpent"     

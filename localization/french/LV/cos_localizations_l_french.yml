 # Ambush Names #

 cos_name_spider_man:0 "Homme-Araignée"
 cos_name_spider_duchy_title:0 "Les Fils et Filles de Yeen"
 spider_army_name:0 "Fils et Filles de Yeen"
 cos_spider_ambush_cb:0 "Légitime Défense Sauvage"
 SPIDER_AMBUSH_CB_NAME:0 "Légitime Défense Sauvage"
 SPIDER_AMBUSH_CB_NAME_BASE:0 "Légitime Défense Sauvage"
 SPIDER_AMBUSH_CB:0 "Légitime Défense Sauvage"

 cos_ambush_events.1000.title:0 "Marche Silencieuse — Expéditions de Yeen"
 cos_ambush_events.1000.desc:0 "Un temps et des ressources considérables ont été consacrés à rassembler cette expédition armée vers les quartiers intérieurs de Yeen. Une peur silencieuse se lit sur les visages de ceux qui s'exercent en formation devant vous, tandis que les maréchaux s'efforcent de détourner leurs pensées de la cité. Pourtant, une détermination farouche anime encore beaucoup d'entre eux. La volonté de récupérer, ou du moins de retrouver, les corps de ceux emportés durant les nuits passées ici.\n\nLa cour est sinistre tandis que les barricades sont démantelées ; nul cri d'encouragement n'accompagne l'expédition qui s'ébranle... pas un murmure, pas un frémissement ne se fait entendre, comme si la jungle elle-même retenait son souffle."
 cos_ambush_events.1000.attack:0 "Maintenant, nous attendons..."

 cos_ambush_events.1001.title:0 "Une Mer de Membres — Expéditions de Yeen"
 cos_ambush_events.1001.desc:0 "Ce n'est pas avant le lendemain matin que l'on aperçoit les premiers signes de l'expédition. Des feux de camp brûlent par dizaines au-delà des murs intérieurs. Mes conseillers semblent y voir un bon signe... jusqu'à ce que la fumée s'élève plus vite et en bien plus d'endroits. Quelque chose ne va manifestement pas.\n\nDes cris résonnent désormais de l'autre côté des barricades reconstituées. Cris de peur, cris d'alerte. À peine un instant de plus s'écoule avant que retentissent les premiers appels de mes propres hommes :\n\n"Regardez là-bas ! Ils escaladent les murs !"\n\nLa glace me saisit le cœur alors que tous les regards se fixent sur le corps gras et obscène d'une araignée géante, rampant le long des murs intérieurs ; bientôt suivie de plusieurs dizaines d'autres. Peut-être des centaines..."
 cos_ambush_events.1001.attack:0 "A- Aux armes ! Lances en avant !"



 # Decisions #


 sack_the_maw:0 "Piller la Gueule Dévorante"
 sack_the_maw_decision_desc:0 "Trop longtemps les fidèles sauvages de la Gueule Éternelle nous ont pris pour proies. Mais désormais, la source même de leur fanatisme se trouve sous notre contrôle...\n\nLaisser la Gueule telle quelle risquerait de permettre à ses fidèles de la reprendre. Avec une simple poignée d'engins de siège, nous pourrions leur démontrer que leur religion appartient au passé, tout comme leurs pratiques maléfiques."
 sack_the_maw_decision_tooltip:0 "Piller la Gueule Dévorante"
 sack_the_maw_decision_confirm_text_desc:0 "Faites tomber le toit !"
 sack_the_maw_custom:0 "Les Hommes Tachetés de cette région perdront une grande part de leur pouvoir contre-nature... à moins que la gueule ne soit rouverte."

 sack_the_glade:0 "Raser les Clairières de Balam"
 sack_the_glade_decision_desc:0 "Les soi-disant « fils et filles » nous ont fui maintes et maintes fois, se retirant toujours plus profondément dans les brumes, mais nous avons désormais trouvé leur site de culte le plus sacré.\n\nPeut-être leur volonté peut-elle enfin être brisée... en détruisant, une fois pour toutes, leur lien avec leur « Mère » !"
 sack_the_glade_decision_tooltip:0 "Raser les Clairières de Balam"
 sack_the_glade_decision_confirm_text_desc:0 "Arrachez tout !"
 sack_the_glade_custom:0 "Les fidèles de la Mère Verte perdront une grande part de leur résilience... à moins que la clairière ne soit péniblement régénérée au fil de nombreuses années.

 empower_the_maw:0 "Sacrifice à la Grande Gueule"
 empower_the_maw_decision_desc:0 "La Gueule a faim, elle désire, et d'une manière ou d'une autre, elle nous le fait savoir ; nous répondrons à son appel."
 empower_the_maw_decision_tooltip:0 "Sacrifice à la Grande Gueule"
 empower_the_maw_decision_confirm_text_desc:0 "Rassasier la Faim"
 empower_the_maw_custom:0 "Dépensez davantage de piété pour recevoir de plus grands dons."

 empower_the_mother:0 "Tribut à la Mère Verte"
 empower_the_mother_decision_desc:0 "Voilà bien longtemps que nous n'avons rendu grâce à notre Mère. D'une manière ou d'une autre, nous sentons tous, comme un seul homme, qu'Elle est prête à nous bénir de nouveau."
 empower_the_mother_decision_tooltip:0 "Tribut à la Mère Verte (Traduction : Ai-je bien fait, maman ?)"
 empower_the_mother_decision_confirm_text_desc:0 "Apportez les offrandes"
 empower_the_mother_custom:0 "Dépensez de la piété pour recevoir de plus grands pouvoirs."

 sack_the_bloodletters_hall:0 "Raser la Salle du Saigneur"
 sack_the_bloodletters_hall_decision_desc:0 "Les Arbres Exsangues doivent leur nom à la prévalence d'une espèce de chauve-souris vampire d'un blanc pâle qui y vit. Ces chauves-souris sont anormalement grandes et peuvent tuer un homme en quelques minutes sans même perturber son sommeil. Cette menace a, de façon troublante, donné naissance à un culte du sang au cœur de cette région ; ses fidèles étant simplement connus sous le nom de « Saigneurs ».\n\nCes vils sectateurs doivent être, et seront, déracinés jusqu'à leur source même. Alors qu'ils fuient désormais leur salle dans la panique, nous la raserons jusqu'aux fondations."
 sack_the_bloodletters_hall_decision_tooltip:0 "Raser la Salle du Saigneur"
 sack_the_bloodletters_hall_decision_confirm_text_desc:0 "Livrez-la aux flammes !"
 sack_the_bloodletters_hall_custom:0 "Les blocages de chauves-souris vampires monstrueuses pourront enfin être levés, leurs quasi-bergers ne pouvant plus nous arrêter."

 cos_tame_bats:0 "Pacifier les Chauves-souris Vampires Locales"
 cos_tame_bats_decision_desc:0 "Les Tahae-toto, ou chauves-souris vampires comme les étrangers les nomment, sont des esprits apparentés aux nôtres. Elles ressentent la Soif, tout comme nous. Bien qu'elles s'en prennent aux étrangers, la sève dont nous enduisons nos corps dès le plus jeune âge leur fait savoir que nous ne leur voulons aucun mal. Il est grand temps que nous travaillions avec elles, et non contre elles."
 cos_tame_bats_decision_tooltip:0 "Pacifier les Chauves-souris Vampires Locales"
 cos_tame_bats_decision_confirm_text_desc:0 "Ne Faire Qu'Un"
 cos_tame_bats_custom:0 "Il se peut que nous devions prendre cette décision à plusieurs reprises, s'il y en a beaucoup à apprivoiser..."

 treat_with_feeders:0 "Apprivoiser les Tahae-toto"
 treat_with_feeders_decision_desc:0 "Étant donné notre interaction constante avec les meutes locales de « chauves-souris vampires », il n'est guère surprenant qu'un alpha cherche parfois auprès de ses bergers un approvisionnement constant en nourriture.\n\nLes chauves-souris vampires monstrueuses ont une faim de sang frais sans cesse renouvelée, bien qu'elles répugnent à trop s'éloigner de leur habitat naturel. Avec suffisamment d'incitation et d'entraînement, cependant, nous pouvons guider nos voisines vers nos ennemis, propageant ainsi la Soif à tous.\n\nElles se souviendront du sang de leur maître et, si celui-ci venait à mourir, elles se disperseraient probablement pour regagner leur foyer d'origine."
 treat_with_feeders_decision_tooltip:0 "Guidez une meute de chauves-souris vampires locales plus près de votre foyer. Elles se souviendront du sang de leur maître et, si celui-ci venait à mourir, elles se disperseraient probablement pour regagner leur foyer d'origine."
 treat_with_feeders_decision_confirm_text_desc:0 "Préparez un festin sanglant !"
 treat_with_feeders_custom:0 "Nos esprits apparentés se tiendront prêts près de notre capitale jusqu'à ce que nous soyons disposés à les déchaîner sur des ennemis sans méfiance."

 treat_with_devourers:0 "Apprivoiser les Basilics Voraces"
 treat_with_devourers_decision_desc:0 "PLACEHOLDER"
 treat_with_devourers_decision_tooltip:0 "PLACEHOLDER"
 treat_with_devourers_decision_confirm_text_desc:0 "PLACEHOLDER"
 treat_with_devourers_custom:0 "PLACEHOLDER"

 cos_ruin_completion_fallback:0 "Repli de Débogage - Achèvement des Ruines"
 cos_debug_trigger_decision_desc:0 "PLACEHOLDER"
 cos_debug_trigger_decision_tooltip:0 "PLACEHOLDER"
 cos_debug_trigger_decision_confirm_text_desc:0 "PLACEHOLDER"

 cos_debug_trigger_dont_touch:0 "Débogage - Ne Pas Toucher"

 sack_the_corpse_mounds:0 "Démanteler les Tertres de Cadavres"
 sack_the_corpse_mounds_decision_desc:0 "Amoncelés dans une clairière de la jungle s'élèvent des tertres formés de milliers de corps et d'artefacts brisés, peut-être bien plus encore. Les autochtones de cette région portent ici tous les « envahisseurs » vaincus du rivage, avec l'ensemble de leurs possessions étrangères, pour les y empiler.\n\nLes basilics sont attirés par centaines, voire par milliers, vers ces collines puantes et pourrissantes. Si nous espérons un jour tirer parti de cette rare clairière naturelle au sein de la jungle, ces tertres doivent disparaître.\n\nAu-delà même de la zone elle-même, fouiller ces détritus pourrait s'avérer extrêmement lucratif."
 sack_the_corpse_mounds_decision_tooltip:0 "Démanteler les Tertres de Cadavres"
 sack_the_corpse_mounds_decision_confirm_text_desc:0 "Jusqu'aux genoux dans les vieux ossements..."
 sack_the_corpse_mounds_custom_1:0 "Les blocages de Basilics Voraces pourront enfin être levés, leur puante source de nourriture ne les retenant plus à proximité."
 sack_the_corpse_mounds_custom_2:0 "Au cours des opérations de déblaiement, vous pourriez mettre la main sur une poignée d'artefacts anciens. Ces tertres ont été alimentés durant des centaines, voire des milliers d'années."

 cos_tame_basilisks:0 "Pacifier les Basilics Locaux"
 cos_tame_basilisks_decision_desc:0 "Les Raksasa, ou basilics géants comme les étrangers les nomment, sont les messagers des dieux eux-mêmes. Ils ressentent la grande faim, tout comme nous. Bien qu'ils s'en prennent aux étrangers, notre entretien des Tertres de Cadavres les a rendus presque aimables envers nous, leurs gardiens. Il est grand temps que nous travaillions avec eux, et non contre eux."
 cos_tame_basilisks_decision_tooltip:0 "Pacifier les Basilics Locaux"
 cos_tame_basilisks_decision_confirm_text_desc:0 "Ne Faire Qu'Un"
 cos_tame_basilisks_custom:0 "Il se peut que nous devions prendre cette décision à plusieurs reprises, s'il y en a beaucoup à apprivoiser..."


 cos_swamp_wyvern_bonding_decision:0 "Rechercher des Vénérables Wyvernes des Marais"
 cos_swamp_wyvern_bonding_decision_desc:0 "Bien que les jeunes wyvernes des marais s'irritent aisément et se montrent hautement territoriales, celles d'un âge vénérable se laissent bien plus volontiers manipuler.\n\nEn envoyant des éclaireurs pour trouver, nourrir et diriger ces quelques élues, nous pouvons acquérir un avantage exceptionnellement précieux sur nos ennemis."
 cos_swamp_wyvern_bonding_decision_decision_tooltip:0 ""
 cos_swamp_wyvern_bonding_decision_decision_confirm_text_desc:0 "Envoyez les éclaireurs"
 cos_wyvern_decision_tooltip:0 "Le temps dira si des wyvernes adéquates nichent à proximité..."



 # Events #


 cos_swamp_wyvern_bonding:0 "Attirer un Léviathan — Le Grand Marais"
 cos_swamp_wyvern_bonding_title:0 "Attirer un Léviathan — Le Grand Marais"
 cos_swamp_wyvern_bonding_desc:0 "Les wyvernes qui font du Grand Marais leur foyer sont des créatures extrêmement territoriales. Elles rivalisent sans cesse avec leurs voisines pour s'approprier de plus vastes étendues de terrain détrempé. S'approcher du territoire de l'une de ces bêtes se soldera presque à coup sûr par un désastre, leurs becs et leurs queues meurtriers ayant tôt fait de venir à bout de tout ennemi non-wyverne.\n\nCependant, en vieillissant vers un âge plus vénérable, les wyvernes des marais deviennent plus paresseuses et plus dociles ; plus enclines à accepter les offrandes des hommes. Bien menée, cette approche peut rendre la bête dépendante de ses pourvoyeurs, jusqu'à ce qu'elle consente à se laisser diriger vers de nouvelles sources de « nourriture ». Que cette nourriture se trouve être d'autres tribus, plus hostiles, importe peu à la bête.\n\nPlusieurs éclaireurs sont revenus, et l'un d'eux s'avance pour parler : « Trois ont été trouvées. Combien pouvons-nous nous permettre d'en nourrir ? »"
 cos_swamp_wyvern_bonding.opt1:0 "Une seule suffira"
 cos_swamp_wyvern_bonding.opt2:0 "Deux seront plus que suffisantes"
 cos_swamp_wyvern_bonding.opt3:0 "Trois, et que nos ennemis tremblent..."
 cos_swamp_wyvern_bonding.opt4:0 "Aucune... quelle perte de temps"


 cos_empower.1001.t:0 "Nourrir la Gueule Dévorante"
 cos_empower.1001.a:0 "Un silure géant, toujours affamé, des rives du Zamoyos"
 cos_empower.1001.b:0 "Un grand singe abatteur d'arbres venu du sud"
 cos_empower.1001.c:0 "Une wyverne rusée et monstrueuse du Col Vert !"
 cos_empower.1001.desc:0 "L'année tourne, et avec elle vient le moment de décider de notre tribut principal à la Gueule Dévorante. Comme nous l'avons fait lors des années plus maigres, de modestes offrandes ne sauraient offenser les dieux. Mais pour acquérir de plus grands pouvoirs pour notre peuple, nous devons envisager des prix plus élevés.\n\nLes dieux AURONT leur tribut, que nous comptions le leur refuser ou non... Que devra-t-on dévorer cette année, afin que sa puissance nous soit transférée ?"


 cos_empower.1002.t:0 "Adresser une Requête à la Mère Verte"
 cos_empower.1002.a:0 "Des paniers de fourrage frais"
 cos_empower.1002.b:0 "Des ornements de pierre-de-sang sculptés dans les falaises"
 cos_empower.1002.c:0 "Une rare orchidée nocturne du lac Zamoyos"
 cos_empower.1002.desc:0 "L'année tourne, et avec elle vient le moment de décider de notre tribut principal à la Mère Verte. Comme nous l'avons fait lors des années plus maigres, de modestes offrandes ne sauraient offenser notre déesse. Mais pour acquérir de plus grands pouvoirs pour notre peuple, nous devons envisager des prix plus élevés.\n\nEn tant que fils et filles véritables, quelle honte terrible ce serait que de ne pas rendre grâce à notre propre mère. La question demeure : quel présent lui offrirons-nous cette année ?"


  cos_blocker.1001.t:0 "La Wyverne Alpha"
 cos_blocker.1001.a:0 "Un combat singulier, tel que les dieux l'entendaient"
 wyvern_duel_tooltip_1:0 "Vous affrontez l'alpha seul, en duel"
 cos_blocker.1001.b:0 "Encercler la bête et ne rien laisser au hasard"
 cos_blocker.1001.b.success.desc:0 "Nous encerclons et abattons la bête"
 cos_blocker.1001.b.failure.desc:0 "Nous sommes repoussés par la bête, mais je m'échappe dans la cohue en fuite"
 cos_blocker.1001.c:0 "Quelque chose de plus discret... du poison, peut-être..."
 cos_blocker.1001.c.success.desc:0 "La bête est morte, la colonie se disperse."
 cos_blocker.1001.c.failure.desc:0 "Rien ne semble se produire... quelle perte de temps"
 cos_blocker.1001.d:0 "Cette province ne vaut pas ma vie"
 cos_blocker.1001.desc:0 "Cette province connaît un sérieux problème de wyvernes depuis que nous y avons posé le pied. Bien que les colons s'échinent à les éliminer, et ce au prix de nombreuses vies, il est devenu évident que nous ne pouvons progresser davantage.\n\nLa présence d'une wyverne alpha complique les choses. Si nous poursuivons maintenant, cette bête déplacera simplement sa colonie ailleurs, potentiellement en plein cœur d'une zone plus peuplée. Cela étant...\n\nComment devrais-je m'attaquer à cette bête ?"

 cos_blocker.1002.t:0 "La Wyverne Alpha"
 cos_blocker.1002.a:0 "Plus d'hésitation..."
 cos_blocker.1002.a.success.desc:0 "Je me dresse au-dessus des ennemis les plus redoutables de Sothoryos..."
 cos_blocker.1002.a.failure.desc:0 "Je suis repoussé par la bête et subis de graves blessures..."
 cos_blocker.1002.a.critical.desc:0 "Quel bec acéré..."

 cos_blocker.1002.b:0 "Peut-être puis-je encore m'échapper !"
 cos_blocker.1002.b.success.desc:0 "Je subis quelques blessures mineures, mais je m'échappe..."
 cos_blocker.1002.b.failure.desc:0 "Je subis de graves blessures, mais je m'échappe..."

 cos_blocker.1002.desc:0 "Bien qu'on m'ait mis en garde contre pareille témérité... aucun recul ne change le fait que je me trouve désormais face à une wyverne alpha en combat singulier.\n\nLa bête se dresse devant moi, ailes déployées de chaque côté en signe de défi. Dans cette posture, l'alpha semble large de près de 20 mètres (~60 pieds), et sa silhouette se découpant contre le ciel m'envoie un frisson le long de l'échine. Ses griffes sont acérées, son bec plus encore. Je n'ai qu'un seul instant, désormais, pour faire mon choix..."

 ##################

 cos_yeen_ruins.1000.t:0 "Le Vestibule - Expéditions de Yeen"
 cos_yeen_ruins.1000.desc:0 "Le palais est vieux, très vieux. Empli de mémoire et de colère. Des toiles d'araignées tissées en épais cordages, non moins poisseuses pour autant, s'étendent en de vastes filets à travers les nombreuses salles et couloirs. En l'état, l'entrée est totalement impraticable, et seule une lame parfaitement affûtée parvient à s'y frayer un passage.\n\nNulle trace encore des créatures tissant ces toiles, bien que le sentiment d'être observés se fasse plus fort à mesure que nous nous attardons dans le vestibule..."

 cos_yeen_ruins.1000.a:0 "Nous nous frayerons un chemin à la hache !"
 cos_yeen_ruins.1000.a.success.desc:0 "Nous progressons bien vers la grande salle !"
 cos_yeen_ruins.1000.a.failure.desc:0 "Notre progression est lente..."
 cos_yeen_ruins.1000.a.critical.desc:0 "Notre progression est lente... et de nombreux hommes ont disparu sans laisser de trace."

 cos_yeen_ruins.1000.b:0 "Tant pis, brûlons tout !"
 cos_yeen_ruins.1000.b.success.desc:0 "Les dégâts aux bâtiments environnants sont réduits au minimum."
 cos_yeen_ruins.1000.b.failure.desc:0 "Les bâtiments environnants sont rasés jusqu'aux fondations."
 cos_yeen_ruins.1000.b.critical.desc:0 "Le quartier environnant est dévasté... attendez, qu'est-ce qui s'envole du toit ?"

 cos_yeen_ruins.1000.c:0 "Le moment n'est pas propice... barricadez les portes et dissolvez l'expédition"


 cos_yeen_ruins.1001.t:0 "Les Salles Centrales - Expéditions de Yeen"
 cos_yeen_ruins.1001.desc:0 "Un vaste labyrinthe organique de toiles, de sacs d'œufs et de restes desséchés s'étend devant nous. Nous nous tenons dans ce qui dut être autrefois la grande salle du palais ; elle semble aujourd'hui être le cœur de la redoutable infestation d'araignées de Yeen."

 cos_yeen_ruins.1001.a:0 "Lances en tête ! Haches sur les flancs ! En avant !"
 cos_yeen_ruins.1001.a.success.desc:0 "Ces créatures sans pensée n'ont jamais eu la moindre chance..."
 cos_yeen_ruins.1001.a.failure.desc:0 "Nous sommes mis en déroute, subissant de lourdes pertes."
 cos_yeen_ruins.1001.a.critical.desc:0 "Je me retrouve seul dans les salles."

 cos_yeen_ruins.1001.b:0 "Tant pis, brûlons tout !"
 cos_yeen_ruins.1001.b.success.desc:0 "Les dégâts aux bâtiments environnants sont réduits au minimum."
 cos_yeen_ruins.1001.b.failure.desc:0 "Les bâtiments environnants sont rasés jusqu'aux fondations."
 cos_yeen_ruins.1001.b.critical.desc:0 "Le quartier environnant est dévasté... attendez, qu'est-ce qui s'envole du toit ?"

 cos_yeen_ruins.1001.c:0 "Le moment n'est pas propice... barricadez les portes et dissolvez l'expédition"

 cos_yeen_ruins.1002.t:0 "Encerclés - Expéditions de Yeen"
 cos_yeen_ruins.1002.desc:0 "Moi-même et ceux qui demeurent à mes côtés nous retrouvons désormais encerclés par ces abominations arachnéennes dans les salles centrales. Les corps paralysés des tombés sont déjà cocoonés et emportés. Je vois la peur sur le visage de mes compagnons. Leurs yeux se tournent sans cesse vers l'entrée, encore partiellement dégagée d'araignées...\n\nPourtant, ces morts et ces mourants nous offrent une occasion unique. Les araignées ayant déjà entamé leur macabre festin semblent entièrement absorbées par eux. Voilà peut-être une chance de prendre l'avantage !\n\nOu un moyen plus rapide de mourir..."

 cos_yeen_ruins.1002.a:0 "À mes côtés ! Vengeons les tombés !"
 cos_yeen_ruins.1002.a.success.desc:0 "Nous apportons un peu de paix aux tombés..."
 cos_yeen_ruins.1002.a.failure.desc:0 "Nous sommes mis en déroute, subissant de lourdes pertes."
 cos_yeen_ruins.1002.a.critical.desc:0 "Je me retrouve seul dans les salles..."
 cos_yeen_ruins.1002.b:0 "Retraite ! Nous nous frayerons un chemin à la lame !"
 cos_yeen_ruins.1002.b.success.desc:0 "Au moins nous en sortons vivants. Enfin... la plupart d'entre nous."
 cos_yeen_ruins.1002.b.failure.desc:0 "Au moins nous en sortons vivants. Enfin... quelques-uns d'entre nous."
 cos_yeen_ruins.1002.b.critical.desc:0 "Je suis contraint de fuir plus profondément à l'intérieur... seul."

 cos_yeen_ruins.1002.c:0 "Il est temps de se replier... barricadez les portes et dissolvez l'expédition"

 cos_yeen_ruins.1003.t:0 "Les Salles Pleureuses"
 cos_yeen_ruins.1003.desc:0 "Au-delà du nid proprement dit s'étend une salle troublante, totalement dépourvue de toiles. En fait, cette zone est dépourvue de tout signe de créature vivante. Le passage s'ouvre sur une chambre massive, ouverte à l'air libre par un balcon d'un côté, surplombant le quartier noble. Les murs, le sol et le plafond sont tous gravés de quelque langage, des couleurs sombres tourbillonnant dans les lettres. Du coin de l'œil, on croit presque les voir palpiter, mais elles semblent toujours redevenir inertes dès que le regard s'y fixe.\n\nLes gravures sont immaculées, et il ne faut pas longtemps pour comprendre pourquoi. Les murs suintent constamment une sorte de fluide huileux, à une vitesse extrêmement lente ; presque imperceptible. Cet « ichor » s'écoule à travers de minuscules interstices entre les dalles du sol, vers une destination inconnue, nous épargnant ainsi son accumulation.\n\nMis à part les murs fascinants, la pièce est sans particularité et dépouillée. Quelques minutes de plus s'écoulent avant que quoi que ce soit d'autre de significatif ne soit découvert, à mesure que la vaste chambre est fouillée. Des marques de griffes... massives et indubitablement celles d'un dragon. Il y a aussi des traces de brûlures, une portion des gravures soufflée par un souffle de dragon ; on vous avait pourtant dit que le feu de dragon, surtout provenant d'un spécimen de cette taille, aurait dû transformer la pierre froide en beurre en quelques instants, mais cette pierre noire huileuse semble avoir résisté à l'effet, ne serait-ce que partiellement...\n\nUn dernier appel résonne à travers la chambre où l'écho se répercute. Les restes antiques et décomposés d'un campement, près du balcon. Il semble que son occupant soit parti précipitamment, laissant derrière lui la majeure partie de son camp, notamment #bold une malle de petits artefacts valyriens #! Plus excitant encore, dissimulé dans un baluchon au fond d'une malle, se trouve un grand œuf écailleux. Ce doit être le campement de Jaenara Belaerys, ce qui ferait de cet œuf celui du dragon Terrax ! Vous priez que les âges passés en ce lieu maléfique n'aient affecté l'œuf en aucune façon..."

 cos_yeen_ruins.1003.a:0 "Nous avons réussi là où des Lords dragons ont échoué !"
 cos_yeen_ruins.1003.a.success.desc:0 "Ces créatures sans pensée n'ont jamais eu la moindre chance..."
 cos_yeen_ruins.1003.a.failure.desc:0 "Nous sommes mis en déroute, subissant de lourdes pertes."
 cos_yeen_ruins.1003.a.critical.desc:0 "Je me retrouve seul dans les salles. J'entends des bruits tout autour de moi...\n\nSoudain, ces bruits de cliquetis et de crissements se taisent, et je suis arraché vers le haut par l'épaule. Je ressens une douleur soudaine et mordante à la cuisse, avant que la douleur... toute douleur, ne me quitte. C'est ainsi que je meurs."

 cos_yeen_ruins.9999.t:0 "Seul dans le Noir - Expéditions de Yeen"
 cos_yeen_ruins.9999.desc:0 "Je me retrouve seul dans les salles. J'entends des bruits tout autour de moi...\n\nSoudain, ces bruits de cliquetis et de crissements se taisent, et je suis arraché vers le haut par l'épaule. Je ressens une douleur soudaine et mordante à la cuisse, avant que la douleur... toute douleur, ne me quitte. C'est ainsi que je meurs."
 cos_yeen_ruins.9999.a:0 "C'est ainsi que mon histoire se termine..."

 # Custom Tooltips #

 yeen_burn_it_down:0 "Brûlez toute trace de vie dans le bâtiment... ainsi que tout objet de valeur ou d'intérêt à l'intérieur."
 yeen_partial_refund:0 "Vous recouvrez une grande partie des ressources investies dans l'expédition."
 yeen_death:0 "Pas de seconde chance. Vous mourez tout seul."
 yeen_advance:0 "Vous avancez..."
 yeen_no_retreat:0 "Vous avez encore la possibilité de forcer une nouvelle attaque..."


    # Culture Locals #
 
 
brindled_men:0 "Sothoryi"
 name_list_sothori_high:0 "Bas Sothori"
 name_list_sothori_low:0 "Bas Sothori"
 
 brindled_men_high:0 "Hauts Sothoryi" 
 
 brindled_ghoul:0 "Goule Tachetée"
 
 language_sothori_name:0 "Sothoryien"
 
 heritage_sothori_name:0 "Sothori"
 
 agot_tradition_brindled_men_name:0 "Peau Tachetée"
 agot_tradition_brindled_men_desc:0 "Les mestres de Westeros écrivent que les Sothoryi ne sont point de véritables hommes, mais de brutales créatures aux membres massifs et à la peau bigarrée, tenant plus du porc que de l'humain. Leurs chroniques parlent de sauvagerie, de dieux sombres, de festins cannibales et de rites obscènes. Ainsi parlent les lettrés, et ainsi répètent les marchands et pirates des côtes méridionales, qui traitent le peuple tacheté comme moins qu'humain. Pourtant, de tels récits sont tissés davantage de rumeurs et de calomnies que de vérité, car les Sothoryi sont bel et bien des hommes, quoique étrangers aux yeux des étrangers. Ce que l'on nomme sauvagerie n'est souvent que la coutume d'un peuple mal connu et rarement compris." 
 
 
                
                
    # Faiths Locals #
 
sothoryos_religion:0 "Cultes de l'Enfer Vert" 
sothoryos_religion_adj:0 "Cultes de l'Enfer Vert" 
sothoryos_religion_desc:0 "Étant donné son isolement et son environnement unique, les religions de Sothoryos ont été façonnées par la survie, le monde naturel, et les horreurs surnaturelles qui rôdent en ces lieux maudits." 

the_eternal_maw:0 "La Gueule Éternelle"         
the_eternal_maw_adj:0 "La Gueule Éternelle"
the_eternal_maw_desc:0 "La Gueule Éternelle est une religion centrée sur l'idée que le monde est une grande force dévorante, et que toute vie existe pour être consumée. Ses adeptes croient que le sacrifice et le cannibalisme renforcent l'âme, permettant de renaître dans la prochaine vie comme prédateur plus fort plutôt que proie."         

the_green_mother:0 "La Mère Verte"         
the_green_mother_adj:0 "La Mère Verte"
the_green_mother_desc:0 "Cette foi vénérant la nature considère que la jungle elle-même est une déesse vivante, à la fois nourricière et impitoyable. La Mère Verte pourvoit à ceux qui la respectent mais dévore ceux qui prennent trop."  

the_thirst:0 "La Soif"     
the_thirst_adj:0 "La Soif"
the_thirst_desc:0 "Le culte régional des Goules Tachetées, régnant sur les Arbres Exsangues. La Soif est une extension de leur symbiose avec les chauves-souris vampires blanc pâle de la région. Plus précisément, le culte tourne autour des caprices d'un chef tout-puissant connu sous le nom de 'Saigneur'.\n\nPeu sont autorisés dans les salles les plus privées du Saigneur, mais ceux qui y pénètrent rapportent un unique bassin de pierre noire huileuse en son centre ; toujours 'empli'."
holy_site_thirsty_hall_name:0 "La Halle du Saigneur"
the_thirst_adherent_plural:0 "Liés-par-le-Sang"

serpents_grasp:0 "Étreinte du Serpent"     
serpents_grasp_adj:0 "Étreinte du Serpent"
serpents_grasp_desc:0 "Le culte régional de"



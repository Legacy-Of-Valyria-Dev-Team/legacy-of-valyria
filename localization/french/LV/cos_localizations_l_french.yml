 language_sothori_name:0 "Sothoryen"

 lv_tradition_brindled_man_name:0 "Peau Tachetée"
 lv_tradition_brindled_man_desc:0 "Les mestres de Westeros écrivent que les Sothoryi ne seraient point de véritables hommes, mais des créatures brutales — aux membres énormes, à la peau tachetée, plus proches du porc que de l'humain. Leurs récits parlent de sauvagerie, de dieux obscurs, de festins cannibales et de rites obscènes. Ainsi disent les savants, ainsi répètent marchands et pirates des côtes méridionales, qui traitent le peuple tacheté comme moins que des hommes. Pourtant, de tels récits sont tissés de rumeurs et de calomnies bien plus que de vérité, car les Sothoryi sont bel et bien des hommes, quoique étranges aux yeux des étrangers. Ce que l'on nomme sauvagerie n'est souvent rien de plus que la coutume d'un peuple peu connu et rarement compris."




 # Faiths Locals #

 sothoryos_religion:0 "Religions de l'Enfer Vert"
 sothoryos_religion_adj:0 "Religions de l'Enfer Vert"
 sothoryos_religion_desc:0 "En raison de son isolement et de son environnement unique, les religions de Sothoryos se sont forgées au fil de la survie, du monde naturel et des horreurs surnaturelles que la rumeur dit y régner."

 the_eternal_maw:0 "La Gueule Éternelle"
 the_eternal_maw_adj:0 "La Gueule Éternelle"
 the_eternal_maw_desc:0 "La Gueule Éternelle est une religion fondée sur l'idée que le monde est une grande force dévorante, et que toute vie existe pour être consumée. Ses fidèles croient que le sacrifice et le cannibalisme renforcent l'âme, permettant de renaître dans la prochaine vie en prédateur plus puissant plutôt qu'en proie."

 the_green_mother:0 "La Mère Verte"
 the_green_mother_adj:0 "La Mère Verte"
 the_green_mother_desc:0 "Cette foi qui vénère la nature enseigne que la jungle elle-même est une déesse vivante, à la fois nourricière et impitoyable. La Mère Verte pourvoit aux besoins de ceux qui la respectent, mais dévore ceux qui prennent trop."

 the_thirst:0 "La Soif"
 the_thirst_adj:0 "La Soif"
 the_thirst_desc:0 "Le culte régional des Hommes Tachetés, établi au-dessus des Arbres Exsangues. La Soif prolonge leur symbiose avec les chauves-souris vampires d'un blanc pâle propres à la région. Plus exactement encore, ce culte gravite autour des caprices d'un chef à l'autorité absolue, connu sous le nom du « Saigneur ».\n\nRares sont ceux admis dans les salles les plus privées du Saigneur, mais ceux qui y pénètrent rapportent l'existence d'un unique bassin de pierre noire huileuse en son centre ; toujours « rempli »."
 holy_site_thirsty_hall_name:0 "La Salle du Saigneur"
 the_thirst_adherent_plural:0 "Sang-liés"

 serpents_grasp:0 "L'Étreinte du Serpent"

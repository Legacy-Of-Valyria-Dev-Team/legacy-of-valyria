     # Starting Quests #
 
 #The Maw
 cos_start_quests.1000.t:0 "À Travers les Champs de la Faim"
 cos_start_quests.1000.d:0 "Pendant mille ans l'équilibre des pouvoirs n'a cessé de changer dans le chaudron que sont les Plaines de Yeen... cet équilibre est maintenant brisé. Avec la défaite écrasante des nobles et de leur Mère Verte, la Gueule Éternelle résonne comme l'unique vérité à travers les plaines. Les vraies tribus se dressent maintenant unies dans la foi, tandis que les nobles se sont glissés de retour vers les Plaines Moindres, couvant leur 'gloire' perdue.\n\nLes nobles sont vulnérables, les Balami ont été flétrés de leurs brouillards et nul ne nous égale maintenant, nous les dévoreurs. La Gueule a encore faim... et la question demeure, où frapperons-nous maintenant ?"
 cos_start_quests.1000.a:0 "... à l'est vers les Clairières de Balam !"
 cos_start_quests.1000.b:0 "... au nord vers le rivage des pirates !"
 cos_start_quests.1000.c:0 "... au sud, les Qhoris ne peuvent être invincibles..."
 
 #The Lesser Plain
 cos_start_quests.1001.t:0 "Gloires Perdues"
 cos_start_quests.1001.d:0 "On nous avait dit que le culte marginal passerait bientôt, ou resterait peu nombreux ; des parias de notre société noble. Ces mensonges furent prononcés jusqu'au moment même où nos partis de guerre se brisèrent contre les leurs. Maintenant, après une série de défaites écrasantes aux mains des cultistes de la Gueule, notre mode de vie se dresse sur le tranchant d'un couteau. Si la Gueule se déplace unie contre nous maintenant, nous sommes trop peu nombreux pour avoir une chance.\n\nQue nous reste-t-il maintenant ?"
 cos_start_quests.1001.a:0 "Nous ne pouvons nous permettre d'être anéantis !"
 cos_start_quests.1001.b:0 "Notre temps est fini, nous devons embrasser la Gueule Éternelle..." 
 

 
 
 
 
 
 
 
 
 
 
 
 
 
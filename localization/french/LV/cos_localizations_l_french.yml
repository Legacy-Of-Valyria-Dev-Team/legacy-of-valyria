 # Starting Quests #

 #The Maw
 cos_start_quests.1000.t:0 "À travers les Champs de la Faim"
 cos_start_quests.1000.d:0 "Depuis mille ans, l'équilibre des pouvoirs n'a cessé de changer dans ce chaudron que sont les Plaines Yeenish... cet équilibre est désormais rompu. Avec la défaite écrasante des nobles et de leur Mère Verte, la Gueule Éternelle résonne comme l'unique vérité à travers les plaines. Les tribus véritables se dressent désormais unies dans la foi, tandis que les nobles se sont repliés vers les Petites Plaines, ruminant leur « gloire » perdue.\n\nLes nobles sont vulnérables, les Balami ont été chassés de leurs brumes, et nul ne se dresse plus en égal face à nous, les dévoreurs. La Gueule a faim encore... et la question demeure : où frapperons-nous à présent ?"
 cos_start_quests.1000.a:0 "... à l'est, vers les Clairières de Balam !"
 cos_start_quests.1000.b:0 "... au nord, vers la côte des pirates !"
 cos_start_quests.1000.c:0 "... au sud, les Qhori ne sauraient être invincibles..."

 #The Lesser Plain
 cos_start_quests.1001.t:0 "Gloires Perdues"
 cos_start_quests.1001.d:0 "On nous avait dit que ce culte marginal passerait bientôt, ou du moins demeurerait peu nombreux ; des parias au sein de notre noble société. Ces mensonges, nous les avons répétés jusqu'au moment même où nos troupes de guerre se sont brisées contre les leurs. Désormais, après une série de défaites écrasantes face aux sectateurs de la Gueule, notre mode de vie se tient sur le fil du rasoir. Si la Gueule venait à se dresser unie contre nous maintenant, nous sommes trop peu nombreux pour tenir tête.\n\nQue nous reste-t-il, à présent ?"
 cos_start_quests.1001.a:0 "Nous ne pouvons nous permettre d'être anéantis !"
 cos_start_quests.1001.b:0 "Notre temps est révolu, nous devons embrasser la Gueule Éternelle..."
 cos_start_quests.1001.c:0 "PLACEHOLDER"


    # Culture Locals #
 
 
 brindled_men:0 "Sothoryens"
 name_list_sothori_high:0 "Bas-Sothoryens"
 name_list_sothori_low:0 "Bas-Sothoryens"
 
 brindled_men_high:0 "Hauts-Sothoryens" 
 
 brindled_ghoul:0 "Goule Tigrée"
 
 language_sothori_name:0 "Sothoryen"
 
 heritage_sothori_name:0 "Sothoryens"
 
 agot_tradition_brindled_men_name:0 "Peau Tigrée"
 agot_tradition_brindled_men_desc:0 "Les mestres de Westeros écrivent que les Sothoryens ne sont point de vrais hommes, mais des créatures brutales — aux membres énormes, à la peau tigrée, plus porcs qu'humains. Leurs récits parlent de sauvagerie, de dieux sombres, de festins cannibales et de rites obscènes. Ainsi disent les érudits, et ainsi répètent les marchands et pirates des côtes méridionales, qui traitent le peuple tigré comme moins qu'humain. Pourtant de tels récits sont tissés davantage de rumeurs et de calomnies que de vérité, car les Sothoryens sont bel et bien humains, bien qu'étranges aux yeux des étrangers. Ce qui est appelé sauvagerie n'est souvent pas plus que la coutume d'un peuple peu connu et rarement compris, survivants tenaces des profondeurs vertes de l'enfer sothoryien."
 
 
                
                
    # Faiths Locals #
 
sothoryos_religion:0 "Fois de l'Enfer Vert" 
sothoryos_religion_adj:0 "Fois de l'Enfer Vert" 
sothoryos_religion_desc:0 "Étant donnés son isolement et son environnement unique, les religions de Sothoryos ont été façonnées par la survie, le monde naturel et les horreurs surnaturelles que l'on dit exister dans ces contrées maudites où la jungle dévore les intrus et où les anciens secrets murmurent dans les ombres vertes." 

the_eternal_maw:0 "La Gueule Éternelle"         
the_eternal_maw_adj:0 "La Gueule Éternelle"
the_eternal_maw_desc:0 "La Gueule Éternelle est une religion centrée sur l'idée que le monde est une grande force dévorante, et que toute vie existe pour être consumée. Ses fidèles croient que le sacrifice et le cannibalisme fortifient l'âme, permettant de renaître dans la prochaine vie comme un prédateur plus fort plutôt que comme une proie destinée à être dévorée dans les ténèbres éternelles."         

the_green_mother:0 "La Mère Verte"         
the_green_mother_adj:0 "La Mère Verte"
the_green_mother_desc:0 "Cette foi adoratrice de la nature soutient que la jungle elle-même est une déesse vivante, à la fois nourricière et impitoyable. La Mère Verte pourvoit à ceux qui la respectent mais dévore ceux qui prennent trop, ses racines et ses lianes étant les veines de sa colère divine qui étreint les impies."  

the_thirst:0 "La Soif"     
the_thirst_adj:0 "La Soif"
the_thirst_desc:0 "Le culte régional des Goules Tigrées, résidant au-dessus des Arbres Exsangues. La Soif est une extension de leur symbiose avec les chauves-souris vampires blanc pâle de la région. Plus précisément, le culte tourne autour des caprices d'un chef tout-puissant connu sous le nom de 'Saigneur'.\n\nPeu sont autorisés dans les salles les plus privées du Saigneur, mais ceux qui y pénètrent rapportent un unique bassin de pierre noire et huileuse en son centre ; toujours 'rempli' d'un liquide sombre qui pulse comme un cœur vivant."
holy_site_thirsty_hall_name:0 "La Salle du Saigneur"
the_thirst_adherent_plural:0 "Liés-par-le-Sang"

serpents_grasp:0 "Étreinte du Serpent"     
serpents_grasp_adj:0 "Étreinte du Serpent"
serpents_grasp_desc:0 "Le culte régional de l'Étreinte du Serpent vénère les grands serpents constricteurs des jungles profondes, croyant que leur étreinte mortelle est une bénédiction divine qui unit l'âme au grand cycle de la prédation et de la renaissance."


    # Buildings And Ruins #
 
jungle_ruin_01:0 "Enfer Vert"
building_jungle_ruin_01:0 "Enfer Vert"
building_type_jungle_ruin_01:0 "Enfer Vert"
building_jungle_ruin_01_desc:0 "Bien qu'entièrement consumée par la jungle, cette province n'est au moins pas aussi dense que la jungle profonde où rôdent les pires abominations de Sothoryos."

jungle_ruin_02:0 "Enfer Vert"
building_jungle_ruin_02:0 "Enfer Vert"
building_type_jungle_ruin_02:0 "Enfer Vert"
building_jungle_ruin_02_desc:0 "Une clairière a été établie et des brûlis massifs ont lieu pour repousser à la fois la jungle et ses occupants, dans un combat constant contre la nature qui cherche à tout reprendre."

jungle_ruin_03:0 "Enfer Vert"
building_jungle_ruin_03:0 "Enfer Vert"
building_type_jungle_ruin_03:0 "Enfer Vert"
building_jungle_ruin_03_desc:0 "Les derniers brûlis sont presque éteints et la prospection de la terre défrichée a commencé, révélant les mystères enfouis sous des siècles de croissance végétale."

jungle_ruin_04:0 "Enfer Vert"
building_jungle_ruin_04:0 "Enfer Vert"
building_type_jungle_ruin_04:0 "Enfer Vert"
building_jungle_ruin_04_desc:0 "Une parcelle de calme relatif a été taillée dans la jungle à force de sueur, de larmes et de beaucoup, beaucoup de sang versé dans cette terre maudite."


jungle_ruin_deep_01:0 "Jungle Profonde"
building_jungle_ruin_deep_01:0 "Jungle Profonde"
building_type_jungle_ruin_deep_01:0 "Enfer Vert"
building_jungle_ruin_deep_01_desc:0 "Bien qu'entièrement consumée par la jungle profonde, cette province regorge du pire que Sothoryos ait à offrir — créatures indicibles et mystères anciens qui feraient fuir même les plus braves."

jungle_ruin_02:0 "Jungle Profonde"
building_jungle_ruin_deep_02:0 "Jungle Profonde"
building_type_jungle_ruin_deep_02:0 "Enfer Vert"
building_jungle_ruin_deep_02_desc:0 "Une clairière a été établie et des brûlis massifs ont lieu pour repousser à la fois la jungle et ses occupants, un combat désespéré contre l'emprise verdoyante de l'enfer sothoryien."

jungle_ruin_03:0 "Jungle Profonde"
building_jungle_ruin_deep_03:0 "Jungle Profonde"
building_type_jungle_ruin_deep_03:0 "Enfer Vert"
building_jungle_ruin_deep_03_desc:0 "Les derniers brûlis sont presque éteints et la prospection de la terre défrichée a commencé, bien que les ombres semblent toujours murmurer des avertissements depuis les lisières de la jungle."

jungle_ruin_04:0 "Jungle Profonde"
building_jungle_ruin_deep_04:0 "Jungle Profonde"
building_type_jungle_ruin_deep_04:0 "Enfer Vert"
building_jungle_ruin_deep_04_desc:0 "Une parcelle de calme relatif a été taillée dans la jungle à force de sueur, de larmes et de beaucoup, beaucoup de sang versé dans cette terre maudite où les ombres murmurent des secrets anciens."


    # Special Buildings And Ruins #
 
 building_bloodstone_mines_1:0 "Mines de Pierre Sanglante Inexploitées"
 building_type_bloodstone_mines_1:0 "Mines de Pierre Sanglante"
 building_bloodstone_mines_1_desc:0 "Une étendue de falaises escarpées qui séparent la jungle de la mer en contrebas. Cette formation rocheuse semble riche en fer et en un minéral vert-rouge connu sous le nom de pierre sanglante.\n\nCette gemme semi-précieuse semble avoir une signification culturelle pour les indigènes de la région, qui la collectent à la main, sans outils ni technique minière. L'exploitation de ces falaises serait hautement profitable, bien que sacrilège aux yeux des natifs qui vénèrent ces pierres comme les larmes pétrifiées de leurs ancêtres."
 
 building_bloodstone_mines_2:0 "Mines de Pierre Sanglante"
 building_type_bloodstone_mines_2:0 "Mines de Pierre Sanglante"
 building_bloodstone_mines_2_desc:0 "Une étendue de falaises escarpées qui séparent la jungle de la mer en contrebas. Cette formation rocheuse semble riche en fer et en un minéral vert-rouge connu sous le nom de pierre sanglante.\n\nMaintenant exploitées à leur plein potentiel, des puits de mine et des outils extraient désormais le fer et les gemmes à des taux hautement efficaces, arrachant ces trésors ensanglantés aux entrailles de la terre sothoryienne."


 building_green_gate_1:0 "La Porte Verte"
 building_type_green_gate_1:0 "La Porte Verte"
 building_green_gate_1_desc:0 "Un treillis impressionnant de formations rocheuses abruptes en forme de lances au point de convergence des murs de pierre sanglante est-ouest. Les lances de roche forment une canopée presque complète au-dessus de l'entrée vers la vallée ombragée à l'intérieur. Cette « porte » apparemment naturelle est le seul chemin terrestre vers les Plaines Centrales de Sothoryos.\n\nLes nombreuses cavités et recoins de ce treillis rocheux abritent *également* une colonie de repos véritablement massive de vouivres. Les navires ne peuvent s'approcher trop près de cette zone, de peur d'être vidés de tout leur équipage. Si la menace des vouivres pouvait être éliminée, cette porte est la clé pour tenir les vastes plaines fertiles du sud contre tout envahisseur maritime."
 
 building_green_gate_2:0 "Porte Verte Fortifiée"
 building_type_green_gate_2:0 "Mines de Pierre Sanglante"
 building_green_gate_2_desc:0 "Un treillis impressionnant de formations rocheuses abruptes en forme de lances au point de convergence des murs de pierre sanglante est-ouest. Les lances de roche forment une canopée presque complète au-dessus de l'entrée vers la vallée ombragée à l'intérieur. Cette « porte » apparemment naturelle est le seul chemin terrestre vers les Plaines Centrales de Sothoryos.\n\nAvec les vouivres éliminées, le passage a été fortifié et un port a été érigé dans le port profond trouvé à son embouchure, créant une forteresse imprenable gardant l'entrée du cœur verdoyant de Sothoryos."
 
 
 building_cos_corpse_mound_1:0 "Monticules de Cadavres Déblayés"
 building_type_cos_corpse_mound_1:0 "Monticules de Cadavres"
 building_cos_corpse_mound_1_desc:0 "Cette clairière de jungle abritait autrefois les infâmes Monticules de Cadavres des Profondeurs du Basilic. Les indigènes de cette région transportaient tous les « envahisseurs » vaincus depuis le rivage, avec toutes leurs possessions étrangères pour les entasser ici ; la croyance locale étant que tous les objets étrangers sont maléfiques et doivent donc être laissés « aux dieux ». Les dieux en l'occurrence étant les centaines de basilics qui convergeaient ici pour se gorger des corps abandonnés.\n\nAvec les corps et artefacts déblayés, les basilics se sont à nouveau dispersés dans les profondeurs de la jungle. La clairière possède encore une odeur fétide et une aura de désespoir qui imprègne la terre souillée par tant de morts."
 
 building_cos_corpse_mound_2:0 "Vastes Monticules de Cadavres"
 building_type_cos_corpse_mound_2:0 "Monticules de Cadavres"
 building_cos_corpse_mound_2_desc:0 "Entassés haut dans une clairière de jungle se dressent des monticules composés de milliers de corps et d'artefacts en ruines, peut-être bien davantage. Les indigènes de cette région transportent tous les « envahisseurs » vaincus depuis le rivage, avec toutes leurs possessions étrangères pour les entasser ici ; la croyance locale étant que tous les objets étrangers sont maléfiques et doivent donc être laissés « aux dieux ». Les dieux en l'occurrence étant les centaines de basilics qui convergent ici pour se gorger des corps abandonnés.\n\nBien qu'une grande partie de ce tas desséché par le soleil soit sans valeur après des siècles écoulés, récupérer son contenu serait extrêmement lucratif ; bien que sacrilège aux yeux des natifs qui considèrent ce lieu comme un temple de la mort."
 
 
 building_basilisk_point_ruins_1:0 "Ruines de Pointe du Basilic"
 building_type_basilisk_point_ruins_1:0 "Pointe du Basilic"
 building_basilisk_point_ruins_1_desc:0 "Les ruines antiques de plusieurs colonisations par les Ghiscaris, Valyriens et bien plus tard les Rhoynars. Bien que les différents styles architecturaux s'entrechoquent constamment à travers les ruines, un donjon de pierre demeure intact et défiant, semblant repousser la jungle envahissante. Une seule colonne de pierre noire huileuse jaillit du centre de la cour du donjon.\n\nBien qu'actuellement en état de délabrement, les bâtiments et fossés qui demeurent ici offrent encore une position défensive significative contre tout attaquant potentiel, témoins silencieux des ambitions brisées de trois empires."
 
 building_basilisk_point_ruins_2:0 "Pointe du Basilic Restaurée"
 building_type_basilisk_point_ruins_2:0 "Pointe du Basilic"
 building_basilisk_point_ruins_2_desc:0 "Les ruines désormais restaurées de Pointe du Basilic. Les styles architecturaux discordants ont été partiellement démolis par endroits pour les concentrer et créer un effet de voyage dans le temps en marchant sur les routes pavées. De grands brûlages ont repoussé la jungle et une palissade défensive a été érigée comme défense secondaire aux murs de pierre maintenant restaurés. Avec le phare du donjon brillant de mille feux, les habitants indigènes vicieux de Sothoryos, qu'ils soient conscients ou non, craindront désormais ce lieu comme un phare de puissance dans l'enfer vert."
 
 
 building_zamettar_ruins_1:0 "Ruines de Zamettar"
 building_type_zamettar_ruins_1:0 "Zamettar"
 building_zamettar_ruins_1_desc:0 "Les ruines antiques de Zamettar, originellement fondée par les Ghiscaris et plus tard capturée par les seigneurs dragons des Possessions Valyriennes, durant la Quatrième Guerre Ghiscarie. Finalement, l'environnement hostile de Sothoryos chassa les colons valyriens. Il ne fallut que plusieurs centaines d'années de plus avant que les Rhoynars tentent de coloniser la cité, pour échouer pour la même raison que les Valyriens.\n\nLa jungle s'est frayé un chemin à travers la cité, des lianes escaladant chaque mur et des racines massives renversant les bâtiments de pierre. La jungle n'a cependant pas encore reconquis quelques quartiers de la ville ; ceux portant des colonnes de pierre noire huileuse en leurs centres.\n\nRestaurer Zamettar serait une tâche exceptionnellement difficile, mais avec assez de temps, d'efforts et d'or, cette cité pourrait à nouveau s'étendre jusqu'au Delta de Zamoyos lui-même."
 
 building_zamettar_ruins_2:0 "Zamettar Restaurée"
 building_type_zamettar_ruins_2:0 "Zamettar"
 building_zamettar_ruins_2_desc:0 "Finalement restaurée dans sa gloire première pour la première fois depuis l'âge de l'Ancienne Ghis, Zamettar grouille de nouveaux colons et de navires marchands étrangers. Des murs de pierre défendent désormais en sécurité les nombreux habitants de la ville contre le pire de l'environnement et des brûlages réguliers aux lisières de la forêt repoussent le pire des insectes piqueurs. La jungle profonde a été repoussée jusqu'aux franges mêmes du delta et des palissades ont été érigées à ses frontières.\n\nAvec l'eau fraîche puisée et bouillie du Zamoyos, les navires fréquentent les ports de Zamettar tant pour le réapprovisionnement que pour le logement, faisant revivre cette cité légendaire."
 
 
 building_balam_glade_1:0 "Clairières Flétrées de Balam"
 building_type_balam_glade_1:0 "Clairières de Balam"
 building_balam_glade_1_desc:0 "Les clairières cachées de Balam étaient un lieu hautement spirituel pour ceux de la foi de la Mère Verte. L'histoire orale raconte que c'est ici que la Mère Verte elle-même descendit sur le sol de la jungle pour sauver les Hommes Tigrés des fléaux qui les accablaient. Le pouvoir de ses sorts divins fut tel que la jungle elle-même fut purgée de cette petite zone, laissant derrière elle une clairière fertile pour ses fidèles.\n\nLes clairières étaient considérées comme le lieu saint principal de la Mère Verte et beaucoup de ses fidèles jurèrent de les défendre de leur vie... ils échouèrent.\n\nLes clairières ont depuis été mises au feu et la jungle a pressé en leur absence. Bien peu de la flore et faune originelles de la clairière demeurent ; mais un zélote déterminé ou un érudit pourrait encore sauver ou même restaurer les clairières dans leur splendeur d'antan."
 
 building_balam_glade_2:0 "Clairières Florissantes de Balam"
 building_type_balam_glade_2:0 "Clairières de Balam"
 building_balam_glade_2_desc:0 "Ces clairières cachées sont un lieu hautement spirituel pour ceux de la foi de la Mère Verte. L'histoire orale raconte que c'est ici que la Mère Verte elle-même descendit sur le sol de la jungle pour sauver les Hommes Tigrés des fléaux qui les accablaient. Le pouvoir de ses sorts divins fut tel que la jungle elle-même fut purgée de cette petite zone, laissant derrière elle une clairière fertile pour ses fidèles.\n\nLes clairières sont considérées comme le lieu saint principal de la Mère Verte et beaucoup de ses fidèles jurent de les défendre de leur vie, gardant ce sanctuaire verdoyant au cœur de l'enfer sothoryien."
 
 
 building_the_maw_1:0 "Colline de la Gueule"
 building_type_the_maw_1:0 "Colline de la Gueule"
 building_the_maw_1_desc:0 "De ce système de grottes effondrées jaillissent les sources de la rivière tributaire de Yeenos. Plus que cela cependant, c'était autrefois le point central de la religion de la Gueule Éternelle. Ses fidèles croient que le monde entier, ou au moins Sothoryos, est une entité unique qui dévore les faibles et nourrit les forts dans un cycle continu qui fait naître des créatures plus grandes et plus fortes.\n\nLes fidèles de cette religion apportaient leurs prises les plus audacieuses ou impressionnantes (animales ou autres) et les déposaient dans les chambres extérieures de la grotte pour être « dévorées » ; apaisant supposément la gueule et leur apportant du pouvoir. Quelle que soit la vérité de l'affaire, la rivière Yeenos qui coule à travers les fissures de l'embouchure scellée de la grotte maintient la région très fertile à ce jour.\n\nCertains fidèles plus zélés pourraient même souhaiter déblayer l'embouchure de la grotte et reprendre leurs pratiques macabres."
 
 building_the_maw_2:0 "La Gueule Dévorante"
 building_type_the_maw_2:0 "Colline de la Gueule"
 building_the_maw_2_desc:0 "De ce système de grottes massives jaillissent les sources de la rivière tributaire de Yeenos. Plus que cela cependant, c'est le point central et un lieu saint de la religion de la Gueule Éternelle. Ses fidèles croient que le monde entier, ou au moins Sothoryos, est une entité unique qui dévore les faibles et nourrit les forts dans un cycle continu qui fait naître des créatures plus grandes et plus fortes.\n\nLes fidèles de cette religion apportent leurs prises les plus audacieuses ou impressionnantes (animales ou autres) et les déposent dans les chambres extérieures de la grotte pour être « dévorées » ; apaisant ainsi la gueule et leur apportant du pouvoir. Quelle que soit la vérité de l'affaire, la rivière Yeenos qui coule d'ici semble rendre les régions extrêmement fertiles."
 
 
 building_yeen_ruins_1:0 "Cité en Ruines de Yeen"
 building_type_yeen_ruins_1:0 "Cité de Yeen"
 building_yeen_ruins_1_desc:0 "Une vaste cité en ruines qui s'étend à perte de vue, du moins depuis les hauteurs des grands arbres proches. Yeen est l'une des cités les plus anciennes du monde connu, construite presque exclusivement en pierre noire huileuse, certains blocs étant si grands que plusieurs éléphants seraient nécessaires pour déplacer chacun d'eux.\n\nLa jungle, semble-t-il, ne peut pénétrer dans Yeen. Les rues demeurent vides de toute végétation hormis les plus maigres et délicates des plantes. Il n'y a ni lianes ni racines obstruantes, juste beaucoup de terre meuble ; une cité usée par les intempéries, lugubre et silencieuse et menaçante dans l'ensemble.\n\nBien que toutes les tentatives précédentes d'habiter ce lieu se soient terminées dans l'horreur... Sûrement une telle chose ne peut arriver à nouveau. Après tout, comparé aux jungles vicieuses de Sothoryos profond, Yeen semble un havre remarquablement sûr."
 
 building_yeen_ruins_2:0 "Occupation Initiale (Yeen)" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_2:0 "Cité de Yeen"
 building_yeen_ruins_2_desc:0 "Suivant les traces d'innombrables expéditions condamnées avant nous, un camp de base a été établi dans l'une des parties les plus défendables de la cité ; près des bateaux si une retraite hâtive était nécessaire.\n\nLes abords ont été largement explorés maintenant. Des os éparpillés, des cadavres desséchés de bétail et de bêtes sothoryens, des armes et armures de divers âges et origines... est-ce une lame ouestienne ? Peu importe. Les quartiers intérieurs de la ville se sont révélés difficiles. Toutes nos équipes envoyées jusqu'à présent ne sont pas revenues et étant donné les toiles d'araignées d'une taille anormalement grande qui s'entrecroisent dans les rues... nous avons au moins une idée du pourquoi.\n\nLes colons crient dans leur sommeil, un nombre anormalement élevé de cauchemars les accablent, bien que cela soit compréhensible étant donné l'histoire de la zone. Néanmoins, avec au moins les quartiers extérieurs cartographiés, nous devrions détenir un avantage considérable sur tout envahisseur. De plus, les reliques récupérées ici prendront des années à cataloguer et peut-être à vendre, rapportant une quantité considérable d'or."
 
 building_yeen_ruins_3:0 "Restauration Extérieure (Yeen)"
 building_type_yeen_ruins_3:0 "Cité de Yeen"
 building_yeen_ruins_3_desc:0 "Les quartiers extérieurs ont été fortifiés et restaurés dans la mesure du possible. Tout envahisseur fait maintenant face à un labyrinthe de routes et ruelles bloquées... bien que davantage de colons continuent de disparaître, sans jamais être vus partant par les guetteurs. Les quartiers intérieurs ont été bloqués bien sûr, bien que cela n'ait pas aidé le moins du monde. Sans craindre les menaces extérieures pour l'instant, peut-être qu'une expédition plus militarisée profondément dans la cité pourrait être planifiée.\n\nDavantage de rapports de cauchemars et de manque de sommeil harassent les guérisseurs déjà limités de la zone..."
 
 building_yeen_ruins_4:0 "Quartiers Intérieurs Repris (Yeen)" 
 building_type_yeen_ruins_4:0 "Cité de Yeen"
 building_yeen_ruins_4_desc:0 "Par de grands efforts et la perte de nombreuses vies, les quartiers intérieurs, moins quelques zones obstinées, ont été reconquis. Les carapaces viles et chitineuses des attercops ont été déblayées et certaines des ruines les plus majestueuses de la zone ont déjà été réclamées par ceux de rang élevé.\n\nLes attercops restants ont été confinés principalement à un seul temple massif au cœur de Yeen. Les préparatifs pour purger correctement ceci prendront beaucoup de temps et seront probablement extrêmement dangereux. Les groupes refusent catégoriquement, même sous peine de mort, d'entrer à moins que leur propre seigneur les accompagne pour partager le risque.\n\nLes cauchemars empirent et le manque de sommeil semble avoir induit des hallucinations éveillées chez certains."
 
 building_yeen_ruins_5:0 "Quartiers Intérieurs Restaurés (Yeen)" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_5:0 "Cité de Yeen"
 building_yeen_ruins_5_desc:0 "Les quartiers intérieurs de Yeen ont maintenant été restaurés dans un état véritablement habitable. Les routes ont été déblayées, les entrepôts remplis et les manoirs occupés ; bien qu'il semble que les rues nécessitent une quantité remarquable de lanternes pour rester éclairées. Bien que les temples et palais soient fermés pour l'instant, dans les suites du dernier flétrissement... Yeen est néanmoins devenue un centre commercial central pour tous ceux voyageant sur la rivière Zamoyos.\n\nLes cauchemars sont une occurrence nocturne pour ceux du quartier intérieur. C'est une réalité inévitable et beaucoup se tournent vers la libération induite par la drogue douce du sommeil sans rêves. Ceux qui ne peuvent se permettre de tels luxes souffrent en silence, mais pour les cris du sommeil agité."
 
 building_yeen_ruins_6:0 "Grande Cité de Yeen" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_6:0 "Cité de Yeen"
 building_yeen_ruins_6_desc:0 "La cité a été restaurée et le mal habitant ce lieu a été banni... espérons-le pour de bon. Yeen est maintenant le havre sûr au cœur de la jungle qu'elle a toujours semblé être... pour l'instant."
 
 
 building_gold_mine_1:0 "Gisement d'Or"
 building_type_gold_mine_1:0 "Mine d'Or"
 building_gold_mine_1_desc:0 "Sothoryos a toujours été réputé posséder une grande richesse en minéraux et minerais. Les prospecteurs ont déterminé que cette zone est riche en quartz et en or, des trésors enfouis dans les entrailles de cette terre maudite."
 
 building_gold_mine_2:0 "Mine d'Or Prospère"
 building_type_gold_mine_2:0 "Mine d'Or"
 building_gold_mine_2_desc:0 "Insatisfaits des simples filons de surface, des tunnels profonds ont été creusés pour accéder aux gisements de quartz-or de cette zone. Avec des équipes de 12 heures par les ouvriers et de nouveaux tunnels ajoutés régulièrement, ce gisement déterré maintenant de l'or à un rythme stupéfiant."
 
 
 building_bloodletters_hall_1:0 "Salle du Saigneur Abandonnée"
 building_type_bloodletters_hall_1:0 "Salle du Saigneur"
 building_bloodletters_hall_1_desc:0 "Étant donné que la salle du Saigneur était dite composée de vignes et d'os, il n'est pas étonnant qu'il reste si peu après que de grands feux l'aient rasée.\n\nSeul un bassin d'autel en pierre noire huileuse demeure où se dressait autrefois la chambre centrale. De façon fascinante, et sans source réelle visible, le bassin contient une petite quantité de sang frais.\n\nC'est ici que le Saigneur en chef vivait autrefois et pratiquait ses rites vils. Si ses héritiers ou d'autres fidèles de leur dieu sombre devaient jamais reprendre l'autel, ils pourraient tenter de faire repousser la Salle du Saigneur."
 
 building_bloodletters_hall_2:0 "Salle du Saigneur"
 building_type_bloodletters_hall_2:0 "Salle du Saigneur"
 building_bloodletters_hall_2_desc:0 "Les murs de la salle du Saigneur sont en réalité composés de vignes entrelacées de la haute canopée des Arbres Exsangues. Ces vignes sont verrouillées ensemble avec une variété d'os d'apparence très humaine, les faisant fusionner ensemble au fil du temps par la tension.\n\nC'est ici que le Saigneur en chef réside et pratique ses rites vils, orchestrant des rituels sanglants dans cette cathédrale de chair et de verdure."

 
 building_gimlet_watch_1:0 "Ruines de Garde-Vrille"
 building_type_gimlet_watch_1:0 "Garde-Vrille"
 building_gimlet_watch_1_desc:0 "Autrefois le second refuge de pirates le plus proéminent de la côte orientale, Garde-Vrille a été saccagé et ruiné par les indigènes. La jungle a commencé à s'infiltrer et bien qu'elle ne soit pas entièrement habitable maintenant, elle conserve encore une certaine valeur défensive."
 
 building_gimlet_watch_2:0 "Garde-Vrille"
 building_type_gimlet_watch_2:0 "Garde-Vrille"
 building_gimlet_watch_2_desc:0 "Le second port le plus proéminent de la côte orientale, Garde-Vrille est la sœur cadette de Veille-Vouivre.\n\nConstruite grâce aux lourds investissements des seigneurs pirates locaux, cette forteresse côtière est un poste de guet contre les plus grands groupes de sauvages du sud."
 
 
 building_wyvern_watch_1:0 "Ruines de Veille-Vouivre"
 building_type_wyvern_watch_1:0 "Veille-Vouivre"
 building_wyvern_watch_1_desc:0 "Autrefois le port le plus proéminent de la côte orientale, Veille-Vouivre était la sœur aînée de Garde-Vrille.\n\nMaintenant réduite aux fondations d'un ancien phare ghiscari, la jungle a reconquis de grandes zones du château. L'emplacement cependant demeure une position hautement défendable."
 
 building_wyvern_watch_2:0 "Veille-Vouivre"
 building_type_wyvern_watch_2:0 "Veille-Vouivre"
 building_wyvern_watch_2_desc:0 "Le port le plus proéminent de la côte orientale, Veille-Vouivre est la sœur aînée de Garde-Vrille.\n\nConstruite par des seigneurs pirates sur les fondations d'un ancien phare ghiscari, cette forteresse côtière est maintenant le plus grand centre de racaille et de vilenie du continent sothoryien. Que les navires marchands se méfient de la lumière menteuse de Pointe-Vouivre, dont la clarté les mène plus souvent qu'autrement à s'écraser sur le rivage et être envahis par les pirates."
 
 
 building_maunga_pass_1:0 "Col de Maunga"
 building_type_maunga_pass_1:0 "Col de Maunga"
 building_maunga_pass_1_desc:0 "Le Col de Maunga consiste en une série de cols montagneux extrêmement difficiles à naviguer. Tout groupe ou résident du col avec la connaissance de son paysage fréquemment changeant peut devenir hautement influent, ou riche, en guidant les autres à travers."
 
 building_maunga_pass_2:0 "Col de Maunga Fortifié"
 building_type_maunga_pass_2:0 "Col de Maunga"
 building_maunga_pass_2_desc:0 "Maintenant fortifié, le Col de Maunga est un pā presque infranchissable que toute partie de guerre hésiterait à traverser ; sans payer d'abord les frais requis bien sûr."
 
 
 building_fleshcarver_1:0 "Plateau Rocheux"
 building_type_fleshcarver_1:0 "Plateau Rocheux"
 building_fleshcarver_1_desc:0 "Une zone rocheuse et stérile du littoral, soutenue par une falaise trapue. Si elle n'est pas particulièrement attrayante pour les colons, la formation terrestre agit au moins comme un repère pour les marins ; et un point de ralliement défendable pour ceux qui s'échouent."
 
 building_fleshcarver_2:0 "Épave du Dépeçoir"
 building_type_fleshcarver_2:0 "Plateau Rocheux"
 building_fleshcarver_2_desc:0 "Les histoires racontent qu'une vague colossale rebelle a autrefois lancé une galère d'esclavagistes au sommet d'un plateau rocheux sur le littoral, laissant l'équipage gratter une existence sur la côte, sans moyen d'évasion. Quoi qu'il en soit, la coque de ce navire, positionnée là où elle est au sommet d'une falaise trapue est un refuge défendable pour beaucoup des petites communes de la zone quand les partis de guerre des hommes tigrés viennent frapper."
 
 
 building_gorosh_ruin_1:0 "Ruines de Gorosh"
 building_type_gorosh_ruin_1:0 "Ruines de Gorosh"
 building_gorosh_ruin_1_desc:0 "Autrefois une colonie pénitentiaire ghiscarie, Gorosh est restée abandonnée pendant la majeure partie de son histoire récente. Occasionnellement l'ancien port est utilisé par les capitaines de navires les plus désespérés, mais ceux qui tentent de s'installer dans la zone n'ont été rencontrés que par des mutineries ou des désastres. Bien que la jungle ait rampé dans certaines zones, les ruines demeurent remarquablement claires de toute végétation hormis les plus petites formes de vie végétale.\n\nLa cour centrale de la prison semble porter un obélisque de pierre noire huileuse."
 
 building_gorosh_ruin_2:0 "Colonie Pénitentiaire de Gorosh"
 building_type_gorosh_ruin_2:0 "Ruines de Gorosh"
 building_gorosh_ruin_2_desc:0 "Maintenant restaurée, cette ancienne colonie pénitentiaire ghiscarie agit comme une ville portuaire bien défendue, facilement capable d'abriter des milliers en peu de temps. Bien que les chambres soient peut-être... indésirables. En fait, ceux qui dorment dans la prison rapportent avoir de plus en plus de cauchemars et d'hallucinations en y séjournant.\n\nLa cour centrale de la prison porte encore un obélisque de pierre noire huileuse."
 
 
 building_kahiwi_pa_1:0 "Colline de Kahiwi"
 building_type_kahiwi_pa_1:0 "Colline de Kahiwi"
 building_kahiwi_pa_1_desc:0 "Une colline hautement défendable, travaillée en terre qui a abrité une lignée fréquemment changeante de tribus pendant des centaines d'années. La tradition orale locale affirme que la colline était autrefois la capitale d'un royaume tribal hautement unifié qui « Chassa les gens du ciel ». Que les « gens du ciel » se réfèrent aux Ghiscaris adorateurs de harpie ou aux Valyriens chevaucheurs de dragons est un débat ouvert.\n\nLes tribus de la région voient la prise du pā historique par la force comme hautement prestigieuse ; d'où la fréquence avec laquelle il est perdu et pris."
 
 building_kahiwi_pa_2:0 "Pā de Kahiwi"
 building_type_kahiwi_pa_2:0 "Pā de Kahiwi"
 building_kahiwi_pa_2_desc:0 "Une capitale digne à nouveau, ce pā, ou fort dans la langue commune, est un foyer extrêmement défendable et prestigieux pour toute tribu. Fossés, tunnels secrets, tranchées de terrassement et palissades entourent la colline en une douzaine d'anneaux de protection. Les réserves souterraines, refroidies dans la terre profonde contiennent assez de provisions pour des mois, sinon des années."
 
 
 building_serpents_lair_1:0 "Faille du Serpent"
 building_type_serpents_lair_1:0 "Faille du Serpent"
 building_serpents_lair_1_desc:0 "Deux grandes failles qui coupent à travers la Côte des Vouivres et se rejoignent beaucoup plus à l'intérieur des terres. Cela formerait une île si ce n'était pour un mince pont terrestre naturel où la terre n'est pas encore tombée dans le gouffre en dessous. À cause des failles, cette « île » est presque complètement entourée de falaises hormis le pont terrestre naturel comme point d'étranglement. Une formation rocheuse à couper le souffle pour ceux assez chanceux pour la voir.\n\nLes falaises sont également dites contenir de nombreux tunnels et grottes parcourant la zone et surgissant comme des taches sombres sur les parois de falaise."
 
 building_serpents_lair_2:0 "Repaire du Serpent"
 building_type_serpents_lair_2:0 "Faille du Serpent"
 building_serpents_lair_2_desc:0 "Convertie en la forteresse inattaquable qu'elle était destinée à devenir par le Culte du Serpent, cette formation est un bastion avancé contre les pirates. Cet emplacement peut abriter des milliers, en sécurité au sommet de ses hautes falaises, avec les capitaines éclaireurs de navires toujours dans la crainte de se fracasser sur les rochers déchiquetés en dessous."
 
 
 building_laanas_refuge_1:0 "Ville Fantôme"
 building_type_laanas_refuge_1:0 "Refuge de Laana"
 building_laanas_refuge_1_desc:0 "Une ville fantôme abandonnée d'une cité. Maisons vides, rues et tours de guet, toutes partiellement cachées par les feuilles et broussailles. Où sont allés tous les gens ?"
 
 building_laanas_refuge_2:0 "Refuge de Laana"
 building_type_laanas_refuge_2:0 "Refuge de Laana"
 building_laanas_refuge_2_desc:0 "Un havre sûr pour les navires des Îles d'Été pour commercer avec certains des hommes tigrés moins sauvages et le peuple de Qhour. La jungle a été déblayée de la zone environnante et ceux vivant ici trouveront d'innombrables innovations en construction qui repoussent ou neutralisent une grande partie de la nature hostile de Sothoryos. Les collines derrière le refuge sont remplies d'or et de plusieurs autres métaux précieux ; ceux-ci sont extraits avec précaution et raffinés sur place pour le commerce.\n\nL'attention est prise pour demeurer en harmonie avec les locaux, et plus d'attention encore est prise pour rester caché des pirates et des sauvages moins agréables."
 
 
 
 
 
 
 
 

    # Wildlife and Flora Blockers #
 
 building_ravenous_basilisk_1:0 "Basilics Voraces"
 building_type_ravenous_basilisk_1:0 "Basilics Voraces"
 building_ravenous_basilisk_1_desc:0 "Des basilics voraces ont envahi cette zone. Leur morsure porte des infections si puissantes qu'elles nécrosent les tissus environnants en quelques heures. Retirer les membres affectés est le seul moyen d'éviter une mort exceptionnellement douloureuse.\n\nLa présence de ces créatures est un risque massif pour les établissements de la zone et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'ils disparaissent.\n\nCes basilics particuliers semblent plus grands et plus agressifs que ceux vus auparavant. Nous soupçonnons qu'ils sont attirés par quelque chose de proche..."
 
 building_ravenous_basilisk_2:0 "Basilics Éliminés"
 building_type_ravenous_basilisk_2:0 "Basilics Éliminés"
 building_ravenous_basilisk_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 building_ravenous_basilisk_tame:0 "Basilics Apprivoisés"
 building_type_ravenous_basilisk_tame:0 "Basilics Apprivoisés"
 building_ravenous_basilisk_tame_desc:0 "Les basilics voraces résidant ici vivent avec nous en symbiose. Ces grands lézards à six pattes passent une grande partie de leur temps soit à chasser soit à se prélasser au sommet des branches des arbres plus robustes. Leur morsure porte des infections si puissantes qu'elles nécrosent les tissus environnants en quelques heures, ce qui fait de la chasse une simple affaire d'obtenir une seule bonne morsure... puis de traquer leur victime jusqu'à ce qu'elle tombe.\n\nLa présence de ces créatures est un bienfait pour nos établissements, réduisant le besoin de gardes.\n\nGrâce à notre relation, cette faune indigène a grandi bien plus que la normale..."
 
 building_basilisk_1:0 "Basilics"
 building_type_basilisk_1:0 "Basilics"
 building_basilisk_1_desc:0 "Des basilics ont envahi cette zone. Leur morsure porte des infections si puissantes qu'elles nécrosent les tissus environnants en quelques heures. Retirer les membres affectés est le seul moyen d'éviter une mort exceptionnellement douloureuse.\n\nLa présence de ces créatures est un risque massif pour les établissements de la zone et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'ils disparaissent."
 
 building_basilisk_2:0 "Basilics Éliminés"
 building_type_basilisk_2:0 "Basilics Éliminés"
 building_basilisk_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 

 building_ghoulish_bat_1:0 "Chauves-Souris Vampires Goules"
 building_type_ghoulish_bat_1:0 "Chauves-Souris Vampires Goules"
 building_ghoulish_bat_1_desc:0 "Des Chauves-Souris Vampires Goules ont envahi cette zone. Ces chauves-souris vampires blanc pâle passent une grande partie de leur temps à ramper presque imperceptiblement à travers les canopées des Arbres Exsangues. Elles descendent sur les proies endormies et se gorgent du sang vital de leurs victimes, les vidant complètement en quelques minutes, tout cela sans qu'elles ne ressentent jamais rien. Les estomacs des chauves-souris entièrement rassasiées ressemblent à des tiques ; monstrueusement gonflées de sang.\n\nLa présence de ces créatures est un risque massif pour les établissements de la zone et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'elles disparaissent.\n\nCette espèce semble particulièrement résistante à nos efforts pour les chasser. Quelque chose, ou quelqu'un, doit les maintenir dans les parages..."
 
 building_ghoulish_bat_2:0 "Chauves-Souris Vampires Éliminées"
 building_type_ghoulish_bat_2:0 "Chauves-Souris Vampires Éliminées"
 building_ghoulish_bat_2_desc:0 "Cette région a été débarrassée de sa faune dominante."

 building_ghoulish_bat_tame:0 "Chauves-Souris Vampires Apprivoisées"
 building_type_ghoulish_bat_tame:0 "Chauves-Souris Vampires Apprivoisées"
 building_ghoulish_bat_tame_desc:0 "Les Tahae-toto résidant ici vivent avec nous en symbiose. Ces chauves-souris vampires blanc pâle passent une grande partie de leur temps à ramper presque imperceptiblement à travers les canopées des Arbres Exsangues. Elles descendent sur les proies endormies et se gorgent du sang vital de leurs victimes, les vidant complètement en quelques minutes, tout cela sans qu'elles ne ressentent jamais rien. Les estomacs des chauves-souris entièrement rassasiées ressemblent à des tiques ; monstrueusement gonflées de sang.\n\nLa présence de ces créatures est un bienfait pour nos établissements, réduisant le besoin de gardes.\n\nGrâce à notre relation, cette faune indigène a grandi bien plus que la normale..."
 
 building_cos_bat_1:0 "Chauves-Souris Vampires"
 building_type_cos_bat_1:0 "Chauves-Souris Vampires"
 building_cos_bat_1_desc:0 "Des Chauves-Souris Vampires ont envahi cette zone. Ces chauves-souris vampires blanc pâle passent une grande partie de leur temps à ramper presque imperceptiblement à travers les canopées des Arbres Exsangues. Elles descendent sur les proies endormies et se gorgent du sang vital de leurs victimes, les vidant complètement en quelques minutes, tout cela sans qu'elles ne ressentent jamais rien. Les estomacs des chauves-souris entièrement rassasiées ressemblent à des tiques ; monstrueusement gonflées de sang.\n\nLa présence de ces créatures est un risque massif pour les établissements de la zone et des postes de garde supplémentaires sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'elles disparaissent."
 
 building_cos_bat_2:0 "Chauves-Souris Vampires"
 building_type_cos_bat_2:0 "Chauves-Souris Vampires Éliminées"
 building_cos_bat_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 
 building_cos_wyvern_1:0 "Vouivres"
 building_type_cos_wyvern_1:0 "Vouivres"
 building_cos_wyvern_1_desc:0 "Bien qu'ayant une silhouette similaire avec le soleil dans le dos, les vouivres de Sothoryos sont plus étroitement apparentées aux lézards terrestres qu'aux dragons. Elles se révèlent néanmoins tout aussi mortelles, quand elles fondent sur leurs proies depuis les cieux ouverts ; les plus grandes étant capables d'emporter hommes et même chevaux sans effort. Les efforts pour débarrasser ces bêtes de la zone ne seront pas une tâche facile, car elles nichent presque exclusivement dans des endroits rocheux, difficiles d'accès.\n\nLa présence de ces créatures est un risque massif pour les établissements de la zone et des gardes supplémentaires regardant vers les cieux sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'elles disparaissent ; bien qu'au moins aucun alpha de vouivre ne soit présent dans cette zone..."
 
 building_cos_wyvern_2:0 "Vouivres Éliminées"
 building_type_cos_wyvern_2:0 "Vouivres Éliminées"
 building_cos_wyvern_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 building_cos_wyvern_alpha_1:0 "Vouivres Menées par un Alpha"
 building_type_cos_wyvern_alpha_1:0 "Vouivres Menées par un Alpha"
 building_cos_wyvern_alpha_1_desc:0 "Bien qu'ayant une silhouette similaire avec le soleil dans le dos, les vouivres de Sothoryos sont plus étroitement apparentées aux lézards terrestres qu'aux dragons. C'est doublement vrai des Vouivres Alpha, créatures âgées qui se sont établies comme dirigeantes de créatures autrement solitaires. En présence d'un alpha, les vouivres se perchent en une colonie dense, ce qui signifie les déloger nécessitera non seulement de vastes quantités d'effort, mais l'abattage de l'alpha lui-même ; de peur qu'il ne déplace simplement sa colonie ailleurs.\n\nLa présence de ces créatures est un risque massif pour les établissements de la zone et des gardes supplémentaires regardant vers les cieux sont essentiels. Le développement de cette terre sera extrêmement difficile jusqu'à ce qu'elles disparaissent ; la présence d'une vouivre alpha annonce la damnation..."
 
 building_cos_wyvern_alpha_2:0 "Vouivres Alpha Abattues"
 building_type_cos_wyvern_alpha_2:0 "Vouivres Alpha Abattues"
 building_cos_wyvern_alpha_2_desc:0 "Cette région a été débarrassée de sa faune dominante."
 
 
 building_cos_carn_plant_1:0 "Plantes Carnivores"
 building_type_cos_carn_plant_1:0 "Plantes Carnivores"
 building_cos_carn_plant_1_desc:0 "Peut-être le groupe le plus distinct de la vie naturelle de l'Enfer Vert sont ses plantes carnivores. Bien que des variétés plus petites attrapant les mouches existent encore ici, celles-ci sont obscènement éclipsées par leurs cousines sothoryiennes.\n\nLes plantes carnivores sothoryiennes peuvent atteindre 15 pieds de large et leurs vrilles tactiles-réactives sont capables d'entraver les membres de toute créature, humains inclus, qui déclenchent une réponse de leur part. La plante utilise les mouvements de lutte de leurs victimes comme catalyseur énergétique pour les soulever et les déplacer vers sa chambre de digestion centrale remplie d'acide.\n\nUne fois baignés dans ces fluides digestifs... les survivants affirment qu'ils auraient préféré être laissés pour morts, car les éruptions et brûlures persistent pendant des années après."
 
 building_cos_carn_plant_2:0 "Plantes Carnivores Élaguées"
 building_type_cos_carn_plant_2:0 "Plantes Carnivores"
 building_cos_carn_plant_2_desc:0 "Cette région a été débarrassée de sa faun-... je veux dire flore dominante."
 
 

     # Starting Quests #
 
 #The Maw
 cos_start_quests.1000.t:0 "À Travers les Champs de la Faim"
 cos_start_quests.1000.d:0 "Pendant mille ans, l'équilibre du pouvoir changeait constamment dans le chaudron que sont les Plaines de Yeen... cet équilibre est maintenant brisé. Avec la défaite écrasante des bien-nés et de leur Mère Verte, la Gueule Éternelle résonne comme la seule vérité à travers les plaines. Les vraies tribus sont maintenant unies dans la foi, tandis que les bien-nés se sont repliés dans les Plaines Inférieures, ruminant leur 'gloire' perdue.\n\nLes bien-nés sont vulnérables, les Balami ont été purgés de leurs brumes et personne ne nous égale maintenant, nous, les dévoreurs. La Gueule a encore faim... et la question demeure, où frapperons-nous maintenant ?"
 cos_start_quests.1000.a:0 "... à l'est vers les Clairières de Balam !"
 cos_start_quests.1000.b:0 "... au nord vers la côte des pirates !"
 cos_start_quests.1000.c:0 "... au sud, les Qhori ne peuvent pas être invincibles..."
 
 #The Lesser Plain
 cos_start_quests.1001.t:0 "Gloires Perdues"
 cos_start_quests.1001.d:0 "On nous a dit que le culte marginal passerait bientôt, ou resterait peu nombreux ; des parias de notre noble société. Ces mensonges ont été prononcés jusqu'au moment même où nos groupes de guerre se sont brisés contre les leurs. Maintenant, après une série de défaites écrasantes aux mains des cultistes de la Gueule, notre mode de vie se tient sur le fil du rasoir. Si la Gueule se déplace unie contre nous maintenant, nous sommes trop peu pour avoir une chance.\n\nQue nous reste-t-il maintenant ?"
 cos_start_quests.1001.a:0 "Nous ne pouvons pas nous permettre d'être anéantis !"
 cos_start_quests.1001.b:0 "Notre temps est révolu, nous devons embrasser la Gueule Éternelle..."

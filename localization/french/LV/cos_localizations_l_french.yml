 # Special Buildings And Ruins #

 building_bloodstone_mines_1:0 "Mines de Pierre-de-Sang Inexploitées"
 building_type_bloodstone_mines_1:0 "Mines de Pierre-de-Sang"
 building_bloodstone_mines_1_desc:0 "Une étendue de falaises abruptes sépare la jungle de la mer, en contrebas. Cette formation rocheuse semble riche en fer ainsi qu'en un minéral vert et rouge connu sous le nom de pierre-de-sang.\n\nCette pierre semi-précieuse paraît revêtir une importance culturelle pour les autochtones de la région, qui la récoltent à mains nues, sans le moindre outil ni technique minière. Exploiter ces falaises serait extrêmement lucratif, quoique sacrilège aux yeux des indigènes."

 building_bloodstone_mines_2:0 "Mines de Pierre-de-Sang"
 building_type_bloodstone_mines_2:0 "Mines de Pierre-de-Sang"
 building_bloodstone_mines_2_desc:0 "Une étendue de falaises abruptes sépare la jungle de la mer, en contrebas. Cette formation rocheuse semble riche en fer ainsi qu'en un minéral vert et rouge connu sous le nom de pierre-de-sang.\n\nDésormais exploitée à son plein potentiel, des galeries et des outils en extraient le fer et la gemme à un rythme hautement efficace."


 building_green_gate_1:0 "La Porte Verte"
 building_type_green_gate_1:0 "La Porte Verte"
 building_green_gate_1_desc:0 "Un entrelacs impressionnant de formations rocheuses acérées, semblables à des lances, se dresse au point de convergence des murailles orientale et occidentale de Pierre-de-Sang. Ces lances de pierre forment une canopée presque complète au-dessus de l'entrée de la vallée ombragée qui s'étend derrière elles. Cette « porte » apparemment naturelle constitue l'unique voie terrestre vers les Plaines Centrales de Sothoryos.\n\nLes nombreuses cavités et recoins de cet entrelacs rocheux abritent *également* une colonie de wyvernes véritablement gigantesque. Les navires ne peuvent s'approcher de trop près de cette zone, sous peine d'être vidés de tout leur équipage. Si la menace des wyvernes pouvait être écartée, cette porte deviendrait la clé permettant de défendre les vastes plaines fertiles du sud contre tout envahisseur venu de la mer."

 building_green_gate_2:0 "Porte Verte Fortifiée"
 building_type_green_gate_2:0 "Mines de Pierre-de-Sang"
 building_green_gate_2_desc:0 "Un entrelacs impressionnant de formations rocheuses acérées, semblables à des lances, se dresse au point de convergence des murailles orientale et occidentale de Pierre-de-Sang. Ces lances de pierre forment une canopée presque complète au-dessus de l'entrée de la vallée ombragée qui s'étend derrière elles. Cette « porte » apparemment naturelle constitue l'unique voie terrestre vers les Plaines Centrales de Sothoryos.\n\nLes wyvernes ayant été écartées, le col a été fortifié et un port a été érigé dans la rade profonde qui s'ouvre à son embouchure."


 building_cos_corpse_mound_1:0 "Vastes Tertres de Cadavres"
 building_type_cos_corpse_mound_1:0 "Tertres de Cadavres"
 building_cos_corpse_mound_1_desc:0 "Amoncelés dans une clairière de la jungle, des tertres formés de milliers de corps et d'artefacts brisés s'élèvent, peut-être bien plus encore. Les autochtones de la région portent ici tous les « envahisseurs » vaincus sur le rivage, avec l'ensemble de leurs possessions étrangères, pour les y empiler ; selon la croyance locale, tout objet façonné par des mains étrangères serait maléfique et devrait donc être abandonné « aux dieux ». Les dieux, en l'occurrence, sont les centaines de basilics qui convergent ici pour se repaître des corps laissés à l'abandon.\n\nBien qu'une grande partie de cet amas desséché par le soleil soit sans valeur, vestige d'âges révolus, en récupérer le contenu serait extrêmement lucratif — quoique sacrilège aux yeux des indigènes."

 building_cos_corpse_mound_2:0 "Périmètres des Cadavres Cartographiés"
 building_type_cos_corpse_mound_2:0 "Tertres de Cadavres"
 building_cos_corpse_mound_2_trigger:0 "Seuls les dirigeants qui ne pratiquent pas [GetFaithByKey('shanty_black').GetName] peuvent prendre la décision d'entamer le déblaiement des tertres de cadavres."
 building_cos_corpse_mound_2_desc:0 "L'ordre a été donné de reconquérir les tertres, mais la jungle ne cède pas facilement ses trésors. Un périmètre de gardes armés encercle désormais la clairière, leurs piques tournées non pas contre des hommes, mais contre le bétail sifflant et venimeux des Profondeurs du Basilic.\n\nArpenteurs et travailleurs courageux œuvrent sous la menace constante de mâchoires claquantes, tentant de cartographier l'étendue du trésor tout en luttant contre la nausée que provoque la putréfaction cuite au soleil. Les basilics, enragés par l'interruption de leur festin, se jettent contre les barricades, mettant à l'épreuve la détermination de ceux qui cherchent l'or enfoui sous la charogne."

 building_cos_corpse_mound_3:0 "Tranchées de Putréfaction Excavées"
 building_type_cos_corpse_mound_3:0 "Tertres de Cadavres"
 building_cos_corpse_mound_3_desc:0 "L'ampleur même de la mort en ce lieu a exigé des mesures industrielles. De profondes tranchées ont été creusées à travers les tertres, tranchant les couches d'histoire et d'ossements comme les cernes d'un arbre morbide. L'air s'épaissit de la fumée des bûchers tandis que les couches les plus fraîches, encore couvertes de chair, sont brûlées pour atteindre les dépôts anciens en dessous.\n\nC'est un travail lugubre et éreintant. À mesure que les tertres rétrécissent, les basilics se font désespérés et agressifs, bien que beaucoup aient été abattus ou repoussés. Des éclats d'acier valyrien, du jade de Yi Ti et de l'or des Îles d'Été percent désormais à travers la cendre grise et la boue, encourageant les travailleurs malgré le risque de peste."

 building_cos_corpse_mound_4:0 "Campement de Catalogage sur le Terrain"
 building_type_cos_corpse_mound_4:0 "Tertres de Cadavres"
 building_cos_corpse_mound_4_desc:0 "Les montagnes de corps ont été aplanies ; il ne reste plus qu'à trier. Des tentes et des tables de fortune occupent désormais la terre gorgée de sang, où scribes et serfs séparent avec soin les rebuts des richesses. Le gros des basilics, privés de leurs repas faciles et lassés des torches, s'est retiré au plus profond de la canopée, ne laissant derrière lui qu'un silence inquiétant.\n\nDes tas de fer rouillé et d'ossements brisés sont repoussés en périphérie, tandis que les artefacts récupérés sont récurés de leurs siècles de crasse. La richesse est stupéfiante, mais chaque pièce et chaque plastron porte le relent lourd et écœurant de la tombe, qu'aucun récurage ne saurait totalement effacer."

 building_cos_corpse_mound_5:0 "Tertres de Cadavres Déblayés"
 building_type_cos_corpse_mound_5:0 "Tertres de Cadavres"
 building_cos_corpse_mound_5_desc:0 "Cette clairière de la jungle abritait autrefois les tristement célèbres Tertres de Cadavres des Profondeurs du Basilic. Les autochtones de la région y portaient tous les « envahisseurs » vaincus sur le rivage, avec l'ensemble de leurs possessions étrangères, pour les y empiler ; selon la croyance locale, tout objet façonné par des mains étrangères serait maléfique et devrait donc être abandonné « aux dieux ». Les dieux, en l'occurrence, étaient les centaines de basilics qui convergeaient ici pour se repaître des corps laissés à l'abandon.\n\nLes corps et artefacts déblayés, les basilics se sont une nouvelle fois dispersés au plus profond de la jungle. La clairière conserve néanmoins une odeur infecte et une aura de désespoir."


 building_basilisk_point_ruins_1:0 "Ruines de la Pointe du Basilic"
 building_type_basilisk_point_ruins_1:0 "Pointe du Basilic"
 building_basilisk_point_ruins_1_desc:0 "Les ruines anciennes de plusieurs vagues de colonisation, ghiscarie, valyrienne, puis bien plus tard rhoynar. Bien que les styles architecturaux s'y heurtent sans cesse, un donjon de pierre demeure intact et provocant, semblant tenir à distance la jungle envahissante. Une unique colonne de pierre noire huileuse se dresse au centre de la cour du donjon.\n\nBien qu'actuellement à l'abandon, les bâtiments et les fossés qui subsistent ici offrent toujours une position défensive considérable contre tout assaillant potentiel."

 building_basilisk_point_ruins_2:0 "Pointe du Basilic Restaurée"
 building_type_basilisk_point_ruins_2:0 "Pointe du Basilic"
 building_basilisk_point_ruins_2_desc:0 "Les ruines désormais restaurées de la Pointe du Basilic. Les styles architecturaux discordants ont été en partie démolis par endroits afin de les regrouper et de créer, le long des routes pavées, une impression de traversée du temps. De vastes brûlis ont repoussé la jungle et une palissade défensive a été érigée en seconde ligne, derrière les murailles de pierre désormais restaurées. Le phare du donjon brûlant avec éclat, les féroces habitants indigènes de Sothoryos, doués de raison ou non, craindront désormais ce lieu comme un phare de puissance."


 building_zamettar_ruins_1:0 "Ruines de Zamettar"
 building_type_zamettar_ruins_1:0 "Zamettar"
 building_zamettar_ruins_1_desc:0 "Les ruines antiques de Zamettar, fondée à l'origine par les Ghiscaris puis conquise par les Lords dragons des Possessions Valyriennes lors de la Quatrième Guerre Ghiscarie. L'environnement hostile de Sothoryos finit par chasser les colons valyriens. Il fallut attendre plusieurs centaines d'années de plus avant que les Rhoynars ne tentent à leur tour de coloniser la cité, échouant pour les mêmes raisons que les Valyriens.\n\nLa jungle s'est frayé un chemin à travers la cité, ses lianes escaladant chaque muraille, ses racines massives renversant les bâtiments de pierre. La jungle n'a toutefois pas encore repris quelques quartiers de la ville ; ceux dont le centre porte des colonnes de pierre noire huileuse.\n\nRestaurer Zamettar serait une tâche exceptionnellement ardue, mais avec suffisamment de temps, d'efforts et d'or, cette cité pourrait un jour s'étendre à nouveau jusqu'au Delta du Zamoyos lui-même."

 building_zamettar_ruins_2:0 "Zamettar Restaurée"
 building_type_zamettar_ruins_2:0 "Zamettar"
 building_zamettar_ruins_2_desc:0 "Enfin rendue à sa gloire première pour la première fois depuis l'âge du Vieux Ghis, Zamettar grouille de nouveaux colons et de navires marchands étrangers. Des murailles de pierre protègent désormais en sécurité les nombreux habitants de la cité contre le pire de l'environnement, et des brûlis réguliers en lisière de forêt repoussent les pires insectes piqueurs. La jungle profonde a été repoussée jusqu'aux franges mêmes du delta, et des palissades ont été érigées à ses frontières.\n\nAvec de l'eau fraîche puisée et bouillie dans le Zamoyos, les navires fréquentent les ports de Zamettar tant pour se ravitailler que pour s'y loger."


 building_balam_glade_1:0 "Clairières Flagellées de Balam"
 building_type_balam_glade_1:0 "Clairières de Balam"
 building_balam_glade_1_desc:0 "Les clairières cachées de Balam furent un lieu hautement spirituel pour les fidèles de la Mère Verte. La tradition orale raconte que c'est ici que la Mère Verte elle-même descendit sur le sol de la jungle pour sauver les Hommes Tachetés des fléaux qui les affligeaient. La puissance de ses sortilèges divins fut telle que la jungle elle-même fut purgée de cette petite zone, laissant derrière elle une clairière fertile pour ses fidèles.\n\nLes clairières étaient considérées comme le principal site sacré de la Mère Verte, et nombre de ses fidèles jurèrent de les défendre au péril de leur vie... ils échouèrent.\n\nLes clairières ont depuis été livrées aux flammes, et la jungle s'est refermée en leur absence. Il ne subsiste que peu de la flore et de la faune d'origine ; mais un zélote déterminé ou un érudit pourrait encore sauver, voire restaurer, les clairières à leur splendeur passée."

 building_balam_glade_2:0 "Clairières Florissantes de Balam"
 building_type_balam_glade_2:0 "Clairières de Balam"
 building_balam_glade_2_desc:0 "Ces clairières cachées demeurent un lieu hautement spirituel pour les fidèles de la Mère Verte. La tradition orale raconte que c'est ici que la Mère Verte elle-même descendit sur le sol de la jungle pour sauver les Hommes Tachetés des fléaux qui les affligeaient. La puissance de ses sortilèges divins fut telle que la jungle elle-même fut purgée de cette petite zone, laissant derrière elle une clairière fertile pour ses fidèles.\n\nLes clairières sont considérées comme le principal site sacré de la Mère Verte, et nombre de ses fidèles jurent de les défendre au péril de leur vie."


 building_the_maw_1:0 "Colline de la Gueule"
 building_type_the_maw_1:0 "Colline de la Gueule"
 building_the_maw_1_desc:0 "De ce système de grottes effondrées jaillissent les sources du Yeenos, rivière affluente. Mais ce lieu fut surtout, autrefois, le centre de la religion de la Gueule Éternelle. Ses fidèles croient que le monde entier, ou du moins Sothoryos, est une entité unique qui dévore les faibles et nourrit les forts dans un cycle continu engendrant des créatures toujours plus grandes et plus puissantes.\n\nLes fidèles de cette religion apportaient leurs proies les plus audacieuses ou les plus impressionnantes (animales ou non) et les déposaient dans les chambres les plus extérieures de la grotte pour qu'elles soient « dévorées » ; apaisant ainsi, croyaient-ils, la gueule et leur conférant du pouvoir. Quelle que soit la vérité en la matière, le Yeenos, qui s'écoule à travers les fissures de l'embouchure scellée de la grotte, maintient la région remarquablement fertile encore aujourd'hui.\n\nCertains fidèles plus zélés pourraient même souhaiter dégager l'embouchure de la grotte et reprendre leurs macabres pratiques."

 building_the_maw_2:0 "La Gueule Dévorante"
 building_type_the_maw_2:0 "Colline de la Gueule"
 building_the_maw_2_desc:0 "De ce vaste système de grottes jaillissent les sources du Yeenos, rivière affluente. Mais ce lieu est surtout le centre et le site sacré de la religion de la Gueule Éternelle. Ses fidèles croient que le monde entier, ou du moins Sothoryos, est une entité unique qui dévore les faibles et nourrit les forts dans un cycle continu engendrant des créatures toujours plus grandes et plus puissantes.\n\nLes fidèles de cette religion apportent leurs proies les plus audacieuses ou les plus impressionnantes (animales ou non) et les déposent dans les chambres les plus extérieures de la grotte pour qu'elles soient « dévorées » ; apaisant ainsi la gueule et leur conférant du pouvoir. Quelle que soit la vérité en la matière, le Yeenos, qui prend sa source ici, semble rendre la région extrêmement fertile."


 building_yeen_ruins_1:0 "Cité en Ruines de Yeen"
 building_type_yeen_ruins_1:0 "Cité de Yeen"
 building_yeen_ruins_1_desc:0 "Une vaste cité en ruines s'étend au-delà de ce que l'œil peut voir. Yeen est l'une des cités les plus anciennes du monde connu, construite presque exclusivement en pierre noire huileuse, dont certains blocs sont si massifs qu'il faudrait plusieurs éléphants pour en déplacer un seul.\n\nIl semble que la jungle ne puisse pénétrer Yeen. Les rues ne laissent passer que la végétation la plus chétive et la plus délicate. Nulles lianes ni racines encombrantes, seulement une terre meuble à profusion ; une cité usée par les intempéries, inquiétante, silencieuse et sinistre tout à la fois.\n\nBien que toutes les tentatives précédentes d'habiter ce lieu se soient achevées dans l'horreur... une telle chose ne saurait certainement pas se reproduire. Après tout, comparé aux jungles féroces des profondeurs de Sothoryos, Yeen semble un havre remarquablement sûr."

 building_yeen_ruins_2:0 "Occupation Initiale (Yeen)" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_2:0 "Cité de Yeen"
 building_yeen_ruins_2_desc:0 "Suivant les traces d'innombrables expéditions vouées à l'échec avant nous, un camp de base a été établi dans l'une des parties les plus défendables de la cité ; à proximité des embarcations, au cas où une retraite précipitée s'imposerait.\n\nLes faubourgs ont désormais été explorés dans leur majeure partie. Ossements épars, cadavres desséchés de bétail et de bêtes sothori, armes et armures d'âges et d'origines diverses... serait-ce une lame ouestrienne ? Peu importe. Les quartiers intérieurs de la cité se sont révélés plus ardus. Aucune de nos équipes envoyées là-bas n'est revenue jusqu'à présent. Vu l'étendue anormalement vaste des toiles d'araignées qui sillonnent les rues... nous avons au moins une idée de la raison.\n\nLes colons hurlent dans leur sommeil, en proie à un nombre anormalement élevé de cauchemars, ce qui se comprend au vu de l'histoire du lieu. Néanmoins, avec au moins les quartiers extérieurs cartographiés, nous devrions détenir un avantage certain sur tout envahisseur. Par ailleurs, les reliques récupérées ici demanderont des années à cataloguer, et peut-être à revendre, rapportant une somme d'or non négligeable."

 building_yeen_ruins_3:0 "Restauration Extérieure (Yeen)"
 building_type_yeen_ruins_3:0 "Cité de Yeen"
 building_yeen_ruins_3_desc:0 "Les quartiers extérieurs ont été fortifiés et restaurés autant que possible. Tout envahisseur se heurte désormais à un labyrinthe de routes et de ruelles obstruées... bien que davantage de colons continuent de disparaître, sans jamais être vus s'éloigner par les guetteurs. Les quartiers intérieurs ont bien entendu été bloqués, quoique cela n'ait guère aidé. Sans crainte immédiate de menaces extérieures, peut-être pourrait-on envisager une expédition plus militarisée au cœur de la cité.\n\nDe nouveaux rapports de cauchemars et de nuits sans sommeil accablent les guérisseurs déjà peu nombreux de la région..."

 building_yeen_ruins_4:0 "Quartiers Intérieurs Repris (Yeen)"
 building_type_yeen_ruins_4:0 "Cité de Yeen"
 building_yeen_ruins_4_desc:0 "Au prix de grands efforts et de nombreuses vies, les quartiers intérieurs, à l'exception de quelques poches résistantes, ont été reconquis. Les vils exosquelettes chitineux des arantèles ont été déblayés, et certaines des ruines les plus majestueuses de la zone ont déjà été revendiquées par les personnages de plus haut rang.\n\nLes arantèles restantes se sont pour l'essentiel repliées dans un unique et massif temple au cœur de Yeen. Les préparatifs nécessaires pour le purger convenablement demanderont beaucoup de temps et s'annoncent extrêmement dangereux. Les compagnies refusent catégoriquement, même sous peine de mort, d'y pénétrer à moins que leur propre suzerain ne les accompagne pour partager le risque.\n\nLes cauchemars empirent, et le manque de sommeil semble avoir provoqué chez certains des hallucinations à l'état de veille."

 building_yeen_ruins_5:0 "Quartiers Intérieurs Restaurés (Yeen)" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_5:0 "Cité de Yeen"
 building_yeen_ruins_5_desc:0 "Les quartiers intérieurs de Yeen ont désormais été restaurés à un état véritablement habitable. Les routes ont été déblayées, les entrepôts approvisionnés et les demeures occupées. Il semble que les rues nécessitent un nombre remarquable de lanternes pour rester éclairées. Bien que temples et palais demeurent fermés pour l'heure, dans le sillage de la dernière purge... Yeen n'en est pas moins devenue une plaque tournante du commerce pour quiconque emprunte le fleuve Zamoyos.\n\nLes cauchemars sont une occurrence nocturne pour ceux du quartier intérieur... C'est une réalité inéluctable, et nombreux sont ceux qui se tournent vers la douce délivrance induite par la drogue d'un sommeil sans rêves. Ceux qui ne peuvent s'offrir un tel luxe souffrent en silence, sinon par les cris d'un sommeil agité."

 building_yeen_ruins_6:0 "Grande Cité de Yeen" #This triggers a Yeen Restoration Event
 building_type_yeen_ruins_6:0 "Cité de Yeen"
 building_yeen_ruins_6_desc:0 "La cité a été restaurée et le mal qui hantait ce lieu a été banni... espérons-le, pour de bon. Yeen est désormais le havre sûr au cœur de la jungle qu'elle a toujours semblé être... pour l'instant."


 building_gold_mine_1:0 "Gisement d'Or"
 building_type_gold_mine_1:0 "Mine d'Or"
 building_gold_mine_1_desc:0 "L'on a toujours dit de Sothoryos qu'elle recélait une grande richesse en minéraux et en minerais. Les prospecteurs ont établi que cette zone était riche en quartz et en or."

 building_gold_mine_2:0 "Mine d'Or Prospère"
 building_type_gold_mine_2:0 "Mine d'Or"
 building_gold_mine_2_desc:0 "Peu satisfaits des simples veines de surface, de profonds tunnels ont été creusés pour accéder aux gisements de quartz aurifère de la zone. Avec des équipes travaillant par quarts de douze heures et de nouveaux tunnels ajoutés régulièrement, ce gisement extrait désormais de l'or à un rythme stupéfiant."


 building_bloodletters_hall_1:0 "Salle Abandonnée du Saigneur"
 building_type_bloodletters_hall_1:0 "Salle du Saigneur"
 building_bloodletters_hall_1_desc:0 "Puisque la salle du Saigneur aurait été composée de lianes et d'ossements, il n'est guère surprenant qu'il n'en reste que peu de choses après que de grands incendies l'eurent réduite en cendres.\n\nSeul subsiste un bassin d'autel en pierre noire huileuse, à l'emplacement où se dressait jadis la chambre centrale. Fait fascinant, et sans source visible, le bassin contient une petite quantité de sang frais.\n\nC'est ici que vivait autrefois le Saigneur en chef, et qu'il menait ses pratiques immondes. Si ses héritiers ou d'autres fidèles de leur dieu obscur venaient un jour à reprendre l'autel, ils pourraient tenter de faire renaître la Salle du Saigneur."

 building_bloodletters_hall_2:0 "Salle du Saigneur"
 building_type_bloodletters_hall_2:0 "Salle du Saigneur"
 building_bloodletters_hall_2_desc:0 "Les murs de la salle du Saigneur sont en réalité composés de lianes entrelacées, tirées de la haute canopée des Arbres Exsangues. Ces lianes sont maintenues tendues à l'aide d'une variété d'ossements à l'apparence troublante humaine, qui finissent par fusionner sous l'effet de la tension au fil du temps.\n\nC'est ici que réside le Saigneur en chef et qu'il mène ses pratiques immondes."


 building_gimlet_watch_1:0 "Ruines de la Vigie de Gimlet"
 building_type_gimlet_watch_1:0 "Vigie de Gimlet"
 building_gimlet_watch_1_desc:0 "Jadis le deuxième plus important repaire de pirates de la côte orientale, la Vigie de Gimlet a été mise à sac et ruinée par les autochtones. La jungle a commencé à s'y infiltrer, et bien qu'elle ne soit pas totalement habitable pour l'heure, elle conserve encore une certaine valeur défensive."

 building_gimlet_watch_2:0 "Vigie de Gimlet"
 building_type_gimlet_watch_2:0 "Vigie de Gimlet"
 building_gimlet_watch_2_desc:0 "Deuxième port le plus important de la côte orientale, la Vigie de Gimlet est la cadette de la Vigie de la Wyverne.\n\nBâtie grâce aux lourds investissements des lords pirates locaux, cette forteresse côtière sert de poste de guet contre les groupes plus nombreux de sauvages venus du sud."


 building_wyvern_watch_1:0 "Ruines de la Vigie de la Wyverne"
 building_type_wyvern_watch_1:0 "Vigie de la Wyverne"
 building_wyvern_watch_1_desc:0 "Jadis le port le plus important de la côte orientale, la Vigie de la Wyverne était l'aînée de la Vigie de Gimlet.\n\nRéduite désormais aux fondations d'un vieux phare ghiscari, la jungle a repris de vastes portions du donjon. L'emplacement demeure néanmoins une position hautement défendable."

 building_wyvern_watch_2:0 "Vigie de la Wyverne"
 building_type_wyvern_watch_2:0 "Vigie de la Wyverne"
 building_wyvern_watch_2_desc:0 "Port le plus important de la côte orientale, la Vigie de la Wyverne est l'aînée de la Vigie de Gimlet.\n\nBâtie par des lords pirates sur les fondations d'un vieux phare ghiscari, cette forteresse côtière est aujourd'hui le plus vaste repaire de crapules et de brigands du continent sothori. Les navires marchands se méfient de la lumière trompeuse de la Pointe de la Wyverne, dont l'éclat les conduit le plus souvent à s'échouer sur le rivage et à se retrouver assaillis de pirates."


 building_maunga_pass_1:0 "Col de Maunga"
 building_type_maunga_pass_1:0 "Col de Maunga"
 building_maunga_pass_1_desc:0 "Le Col de Maunga se compose d'une série de passages montagneux extrêmement difficiles à franchir. Tout groupe ou résident du col possédant une connaissance de son paysage sans cesse changeant peut y gagner une grande influence, voire une grande richesse, en guidant les autres à travers."

 building_maunga_pass_2:0 "Col de Maunga Fortifié"
 building_type_maunga_pass_2:0 "Col de Maunga"
 building_maunga_pass_2_desc:0 "Désormais fortifié, le Col de Maunga forme un pā quasiment infranchissable, que toute troupe de guerre hésiterait à traverser ; sans avoir d'abord acquitté le péage requis, bien entendu."


 building_fleshcarver_1:0 "Plateau Rocheux"
 building_type_fleshcarver_1:0 "Plateau Rocheux"
 building_fleshcarver_1_desc:0 "Une portion rocheuse et stérile du littoral, soutenue par une falaise trapue. Si elle n'est guère engageante pour les colons, cette formation sert au moins de repère aux marins, et de point de ralliement défendable pour ceux qui échouent sur ses rives."

 building_fleshcarver_2:0 "Épave du Taille-Chair"
 building_type_fleshcarver_2:0 "Plateau Rocheux"
 building_fleshcarver_2_desc:0 "Les récits racontent qu'une vague scélérate colossale projeta jadis une galère d'esclavagistes tout en haut d'un plateau rocheux du littoral, laissant son équipage se débattre pour survivre sur la côte, sans aucun moyen de fuite. Quoi qu'il en soit, la coque de ce navire, perchée qu'elle est au sommet d'une falaise trapue, sert de refuge défendable à nombre des petites bourgades de la région lorsque les troupes de guerre des Hommes Tachetés viennent frapper à leur porte."


 building_gorosh_ruin_1:0 "Ruines de Gorosh"
 building_type_gorosh_ruin_1:0 "Ruines de Gorosh"
 building_gorosh_ruin_1_desc:0 "Jadis colonie pénitentiaire ghiscarie, Gorosh est demeurée abandonnée durant la majeure partie de son histoire récente. À l'occasion, le vieux port sert aux capitaines les plus désespérés, mais ceux qui ont tenté de s'installer dans la région n'ont rencontré que mutineries ou désastres. Bien que la jungle se soit infiltrée par endroits, les ruines demeurent remarquablement dégagées, hormis les formes de végétation les plus modestes.\n\nLa cour centrale de la prison semble porter un obélisque de pierre noire huileuse."

 building_gorosh_ruin_2:0 "Colonie Pénitentiaire de Gorosh"
 building_type_gorosh_ruin_2:0 "Ruines de Gorosh"
 building_gorosh_ruin_2_desc:0 "Désormais restaurée, cette ancienne colonie pénitentiaire ghiscarie fait office de cité portuaire bien défendue, capable d'accueillir des milliers d'habitants en un court délai. Les chambres, cependant, sont peut-être... peu désirables. De fait, ceux qui dorment dans la prison rapportent des cauchemars et des hallucinations de plus en plus fréquents durant leur séjour.\n\nLa cour centrale de la prison porte toujours un obélisque de pierre noire huileuse."


 building_kahiwi_pa_1:0 "Colline de Kahiwi"
 building_type_kahiwi_pa_1:0 "Colline de Kahiwi"
 building_kahiwi_pa_1_desc:0 "Une colline hautement défendable, façonnée de terrassements, qui a abrité une lignée de tribus sans cesse renouvelée durant des centaines d'années. La tradition orale locale affirme que la colline fut jadis la capitale d'un royaume tribal hautement unifié, lequel « chassa le peuple du ciel ». Que ce « peuple du ciel » désigne les Ghiscaris adorateurs d'Harpies ou les Valyriens chevaucheurs de dragons demeure un débat ouvert.\n\nLes tribus de la région considèrent la conquête par la force de ce pā historique comme hautement prestigieuse ; d'où la fréquence à laquelle il est perdu, puis repris."

 building_kahiwi_pa_2:0 "Kahiwi Pā"
 building_type_kahiwi_pa_2:0 "Kahiwi Pā"
 building_kahiwi_pa_2_desc:0 "Redevenue une capitale digne de ce nom, ce pā — ou « fort » dans la langue commune — constitue un foyer extrêmement défendable et prestigieux pour toute tribu. Fossés, tunnels secrets, tranchées de terrassement et palissades entourent la colline d'une douzaine d'anneaux de protection. Des réserves souterraines, gardées au frais dans les profondeurs de la terre, contiennent assez de provisions pour des mois, voire des années."


 building_serpents_lair_1:0 "Faille du Serpent"
 building_type_serpents_lair_1:0 "Faille du Serpent"
 building_serpents_lair_1_desc:0 "Deux grandes failles traversent le littoral de la Wyverne et se rejoignent bien plus loin à l'intérieur des terres. Elles formeraient une île, sans un mince pont de terre naturel où le sol n'est pas encore tombé dans le gouffre en contrebas. En raison de ces failles, cette « île » est presque entièrement cernée de falaises, à l'exception du pont de terre naturel qui en constitue le goulet. Une formation rocheuse à couper le souffle, pour qui a la chance de la contempler.\n\nLes falaises renfermeraient également de nombreux tunnels et grottes qui parcourent la zone et s'ouvrent comme des taches sombres sur les parois rocheuses."

 building_serpents_lair_2:0 "Antre du Serpent"
 building_type_serpents_lair_2:0 "Faille du Serpent"
 building_serpents_lair_2_desc:0 "Transformée par le Culte du Serpent en la forteresse imprenable qu'elle était destinée à devenir, cette formation constitue un bastion avancé contre les pirates. Ce lieu peut accueillir des milliers d'habitants, en sécurité au sommet de ses hautes falaises, tandis que les capitaines des navires éclaireurs redoutent sans cesse de se briser sur les rochers déchiquetés en contrebas."


 building_laanas_refuge_1:0 "Ville Fantôme"
 building_type_laanas_refuge_1:0 "Refuge de Laana"
 building_laanas_refuge_1_desc:0 "Une cité devenue ville fantôme abandonnée. Maisons, rues et tours de guet vides, en partie dissimulées sous les feuilles et les broussailles. Où donc tous ses habitants sont-ils passés ?"

 building_laanas_refuge_2:0 "Refuge de Laana"
 building_type_laanas_refuge_2:0 "Refuge de Laana"
 building_laanas_refuge_2_desc:0 "Un havre sûr où les navires des Îles d'Été viennent commercer avec certains des Hommes Tachetés les moins sauvages et le peuple de Qhour. La jungle a été déblayée aux alentours, et ceux qui vivent ici bénéficient d'innombrables innovations architecturales qui repoussent ou neutralisent une grande part de la nature hostile de Sothoryos. Les collines derrière le refuge regorgent d'or et de plusieurs autres métaux précieux ; ceux-ci sont extraits avec prudence et raffinés sur place en vue du commerce.\n\nOn prend soin de rester en harmonie avec les autochtones, et plus grand soin encore de demeurer caché tant des pirates que des sauvages les moins conciliants."









 # Wildlife and Flora Blockers #

 building_ravenous_basilisk_1:0 "Basilics Voraces"
 building_type_ravenous_basilisk_1:0 "Basilics Voraces"
 building_ravenous_basilisk_1_desc:0 "Des basilics voraces ont envahi cette zone. Leur morsure transmet des infections si puissantes qu'elles nécrosent les tissus environnants en quelques heures. Amputer les membres atteints demeure le seul moyen d'éviter une mort exceptionnellement douloureuse.\n\nLa présence de ces créatures représente un risque considérable pour les colonies de la région, et des postes de garde supplémentaires s'imposent. Le développement de cette terre restera extrêmement difficile tant qu'elles ne seront pas parties.\n\nCes basilics-là semblent plus grands et plus agressifs que ceux observés jusqu'ici. Nous soupçonnons qu'ils sont attirés par quelque chose à proximité..."

 building_ravenous_basilisk_2:0 "Basilics Éliminés"
 building_type_ravenous_basilisk_2:0 "Basilics Éliminés"
 building_ravenous_basilisk_2_desc:0 "Cette région a été débarrassée de sa faune dominante."

 building_ravenous_basilisk_tame:0 "Basilics Apprivoisés"
 building_type_ravenous_basilisk_tame:0 "Basilics Apprivoisés"
 building_ravenous_basilisk_tame_desc:0 "Les basilics voraces résidant ici vivent avec nous en symbiose. Ces grands lézards à six pattes passent le plus clair de leur temps à chasser ou à se prélasser au soleil sur les branches des arbres les plus robustes. Leur morsure transmet des infections si puissantes qu'elles nécrosent les tissus environnants en quelques heures, ce qui réduit la chasse à une simple bonne morsure... suivie d'une traque de leur victime jusqu'à ce qu'elle s'effondre.\n\nLa présence de ces créatures est une aubaine pour nos colonies, réduisant le besoin de gardes.\n\nGrâce à notre relation, cette faune indigène a grandi bien au-delà de sa taille normale..."

 building_basilisk_1:0 "Basilics"
 building_type_basilisk_1:0 "Basilics"
 building_basilisk_1_desc:0 "Des basilics ont envahi cette zone. Leur morsure transmet des infections si puissantes qu'elles nécrosent les tissus environnants en quelques heures. Amputer les membres atteints demeure le seul moyen d'éviter une mort exceptionnellement douloureuse.\n\nLa présence de ces créatures représente un risque considérable pour les colonies de la région, et des postes de garde supplémentaires s'imposent. Le développement de cette terre restera extrêmement difficile tant qu'elles ne seront pas parties."

 building_basilisk_2:0 "Basilics Éliminés"
 building_type_basilisk_2:0 "Basilics Éliminés"
 building_basilisk_2_desc:0 "Cette région a été débarrassée de sa faune dominante."


 building_ghoulish_bat_1:0 "Chauves-souris Vampires Monstrueuses"
 building_type_ghoulish_bat_1:0 "Chauves-souris Vampires Monstrueuses"
 building_ghoulish_bat_1_desc:0 "Des chauves-souris vampires monstrueuses ont envahi cette zone. Ces chauves-souris d'un blanc pâle passent le plus clair de leur temps à ramper, presque imperceptiblement, à travers les canopées des Arbres Exsangues. Elles fondent sur leurs proies endormies et se repaissent de leur sang vital, les vidant entièrement en quelques minutes, sans que leurs victimes ne ressentent jamais rien. L'estomac des chauves-souris rassasiées ressemble à celui des tiques ; monstrueusement gonflé de sang.\n\nLa présence de ces créatures représente un risque considérable pour les colonies de la région, et des postes de garde supplémentaires s'imposent. Le développement de cette terre restera extrêmement difficile tant qu'elles ne seront pas parties.\n\nCette espèce semble particulièrement résistante à nos efforts pour la chasser. Quelque chose, ou quelqu'un, doit la retenir ici..."

 building_ghoulish_bat_2:0 "Chauves-souris Vampires Éliminées"
 building_type_ghoulish_bat_2:0 "Chauves-souris Vampires Éliminées"
 building_ghoulish_bat_2_desc:0 "Cette région a été débarrassée de sa faune dominante."

 building_ghoulish_bat_tame:0 "Chauves-souris Vampires Apprivoisées"
 building_type_ghoulish_bat_tame:0 "Chauves-souris Vampires Apprivoisées"
 building_ghoulish_bat_tame_desc:0 "Les Tahae-toto résidant ici vivent avec nous en symbiose. Ces chauves-souris d'un blanc pâle passent le plus clair de leur temps à ramper, presque imperceptiblement, à travers les canopées des Arbres Exsangues. Elles fondent sur leurs proies endormies et se repaissent de leur sang vital, les vidant entièrement en quelques minutes, sans que leurs victimes ne ressentent jamais rien. L'estomac des chauves-souris rassasiées ressemble à celui des tiques ; monstrueusement gonflé de sang.\n\nLa présence de ces créatures est une aubaine pour nos colonies, réduisant le besoin de gardes.\n\nGrâce à notre relation, cette faune indigène a grandi bien au-delà de sa taille normale..."

 building_cos_bat_1:0 "Chauves-souris Vampires"
 building_type_cos_bat_1:0 "Chauves-souris Vampires"
 building_cos_bat_1_desc:0 "Des chauves-souris vampires ont envahi cette zone. Ces chauves-souris d'un blanc pâle passent le plus clair de leur temps à ramper, presque imperceptiblement, à travers les canopées des Arbres Exsangues. Elles fondent sur leurs proies endormies et se repaissent de leur sang vital, les vidant entièrement en quelques minutes, sans que leurs victimes ne ressentent jamais rien. L'estomac des chauves-souris rassasiées ressemble à celui des tiques ; monstrueusement gonflé de sang.\n\nLa présence de ces créatures représente un risque considérable pour les colonies de la région, et des postes de garde supplémentaires s'imposent. Le développement de cette terre restera extrêmement difficile tant qu'elles ne seront pas parties."

 building_cos_bat_2:0 "Chauves-souris Vampires"
 building_type_cos_bat_2:0 "Chauves-souris Vampires Éliminées"
 building_cos_bat_2_desc:0 "Cette région a été débarrassée de sa faune dominante."


 building_cos_wyvern_1:0 "Wyvernes"
 building_type_cos_wyvern_1:0 "Wyvernes"
 building_cos_wyvern_1_desc:0 "Bien qu'elles dessinent une silhouette semblable, le soleil dans leur dos, les wyvernes de Sothoryos sont en réalité plus proches des lézards terrestres que des dragons. Elles n'en demeurent pas moins meurtrières lorsqu'elles fondent sur leurs proies depuis le ciel ouvert ; les plus grandes pouvant emporter des hommes, voire des chevaux, sans le moindre effort. Les débarrasser de la zone ne sera pas chose aisée, car elles nichent presque exclusivement dans des lieux rocheux et difficiles d'accès.\n\nLa présence de ces créatures représente un risque considérable pour les colonies de la région, et des gardes supplémentaires surveillant les cieux s'imposent. Le développement de cette terre restera extrêmement difficile tant qu'elles ne seront pas parties ; encore heureux qu'aucune wyverne alpha ne soit présente dans cette zone..."

 building_cos_wyvern_2:0 "Wyvernes Éliminées"
 building_type_cos_wyvern_2:0 "Wyvernes Éliminées"
 building_cos_wyvern_2_desc:0 "Cette région a été débarrassée de sa faune dominante."

 building_cos_wyvern_alpha_1:0 "Wyvernes Menées par un Alpha"
 building_type_cos_wyvern_alpha_1:0 "Wyvernes Menées par un Alpha"
 building_cos_wyvern_alpha_1_desc:0 "Bien qu'elles dessinent une silhouette semblable, le soleil dans leur dos, les wyvernes de Sothoryos sont en réalité plus proches des lézards terrestres que des dragons. Cela vaut doublement pour les wyvernes alpha, créatures âgées qui se sont imposées comme meneuses de ces bêtes autrement solitaires. En présence d'un alpha, les wyvernes se rassemblent en une colonie dense, ce qui signifie que les en déloger exigera non seulement des efforts considérables, mais également la mort de l'alpha lui-même ; sans quoi il déplacerait tout simplement sa colonie ailleurs.\n\nLa présence de ces créatures représente un risque considérable pour les colonies de la région, et des gardes supplémentaires surveillant les cieux s'imposent. Le développement de cette terre restera extrêmement difficile tant qu'elles ne seront pas parties ; la présence d'une wyverne alpha est annonciatrice de malheurs..."

 building_cos_wyvern_alpha_2:0 "Wyvernes à l'Alpha Abattu"
 building_type_cos_wyvern_alpha_2:0 "Wyvernes à l'Alpha Abattu"
 building_cos_wyvern_alpha_2_desc:0 "Cette région a été débarrassée de sa faune dominante."


 building_cos_carn_plant_1:0 "Plantes Carnivores"
 building_type_cos_carn_plant_1:0 "Plantes Carnivores"
 building_cos_carn_plant_1_desc:0 "Le groupe le plus singulier de la vie naturelle de l'Enfer Vert est peut-être celui de ses plantes carnivores. Bien que des variétés plus modestes, gobe-mouches, existent encore ici, elles sont scandaleusement éclipsées par leurs cousines sothori.\n\nLes plantes carnivores sothori peuvent atteindre près de cinq mètres de large, et leurs vrilles sensibles au toucher sont capables d'entraver les membres de toute créature, humains compris, qui déclenche une réaction chez elles. La plante utilise les mouvements de lutte de sa victime comme catalyseur énergétique pour la soulever et l'acheminer vers sa chambre de digestion centrale, emplie d'acide.\n\nUne fois baignés dans ces sucs digestifs... les survivants affirment qu'ils auraient préféré être laissés pour morts, tant les éruptions et les brûlures persistent des années durant."

 building_cos_carn_plant_2:0 "Plantes Carnivores Élaguées"
 building_type_cos_carn_plant_2:0 "Plantes Carnivores"
 building_cos_carn_plant_2_desc:0 "Cette région a été débarrassée de sa faun-... pardon, de sa flore dominante."



 cos_ambush_events.1000.title:0 "Marche Silencieuse - Expéditions de Yeen" 
 cos_ambush_events.1000.desc:0 "Beaucoup de temps et de ressources ont été investis pour rassembler cette expédition armée dans les districts intérieurs de Yeen. Il y a une peur silencieuse sur les visages de ceux qui s'entraînent en formations devant vous, tandis que les maréchaux tentent de détourner leurs esprits de la cité. Pourtant il y a encore une sombre détermination chez beaucoup. La volonté de récupérer ou au moins de trouver les corps de ceux emportés dans les nuits depuis notre arrivée ici.\n\nLa cour est sinistre tandis que les barricades sont démontées et aucun cri d'encouragement ne salue l'expédition alors qu'elle marche... pas un murmure ou froissement ne peut être entendu ; comme si la jungle elle-même retenait son souffle." 
 cos_ambush_events.1000.attack:0 "Maintenant nous attendons..." 
 
 cos_ambush_events.1001.title:0 "Une Mer de Membres - Expéditions de Yeen" 
 cos_ambush_events.1001.desc:0 "Ce n'est pas le matin suivant quand les premiers signes de l'expédition peuvent être vus. Des feux de camp brûlant par dizaines au-dessus des murs intérieurs. Mes conseillers semblent juger ceci comme un bon signe... jusqu'à ce que la fumée monte plus vite et en bien plus d'endroits. Quelque chose va clairement très mal.\n\nDes cris résonnent maintenant de l'autre côté des barricades replacées. Cris de peur et d'avertissement. À peine un moment de plus passe avant que les premiers appels de mes propres hommes retentissent :\n\n"Regardez là ! Ils passent par-dessus les murs !"\n\nLa glace court dans mes veines tandis que tous les yeux se focalisent sur le corps gras et obscène d'une araignée géante, rampant depuis les murs intérieurs ; peu après suivie par beaucoup de dizaines d'autres. Peut-être des centaines..." 
 cos_ambush_events.1001.attack:0 "A- Aux Armes ! Lances en avant !" 
 

 
    # Decisions #
 
 
 sack_the_maw:0 "Saccager la Gueule Dévorante"
 sack_the_maw_decision_desc:0 "Trop longtemps les sauvages fidèles de la Gueule Éternelle se sont repus de nous. Mais maintenant leur source de fanatisme est sous notre contrôle...\n\nLaisser simplement la Gueule telle quelle risquerait que ses fidèles la reprennent. Avec juste une poignée d'engins de siège, nous pourrions leur montrer que leur religion appartient au passé, avec leurs pratiques maléfiques."
 sack_the_maw_decision_tooltip:0 "Saccager la Gueule Dévorante"
 sack_the_maw_decision_confirm_text_desc:0 "Faites s'effondrer le toit !"
 sack_the_maw_custom:0 "Les hommes tachetés de cette région perdront beaucoup de leur pouvoir surnaturel... à moins que la gueule ne soit rouverte."
 
 sack_the_glade:0 "Raser les Clairières de Balam"
 sack_the_glade_decision_desc:0 "Les soi-disant 'fils et filles' ont fui maintes et maintes fois devant nous, se retirant toujours plus profondément dans les brumes, mais maintenant nous avons trouvé leur site de culte le plus sacré.\n\nPeut-être leurs volontés peuvent-elles enfin être brisées... en détruisant leur connexion à leur 'Mère' une fois pour toutes !"
 sack_the_glade_decision_tooltip:0 "Raser les Clairières de Balam"
 sack_the_glade_decision_confirm_text_desc:0 "Arrachez-les toutes !"
 sack_the_glade_custom:0 "Les fidèles de la Mère Verte perdront beaucoup de leur résilience... à moins que la clairière ne soit patiemment refaite pousser sur de nombreuses années."
 
 empower_the_maw:0 "Sacrifier à la Grande Gueule"
 empower_the_maw_decision_desc:0 "La Gueule a faim, elle désire ardemment, d'une manière ou d'une autre elle nous fait connaître ceci et nous répondrons à ses appels."
 empower_the_maw_decision_tooltip:0 "Sacrifier à la Grande Gueule"
 empower_the_maw_decision_confirm_text_desc:0 "Assouvir la Faim"
 empower_the_maw_custom:0 "Dépensez plus de piété pour recevoir de plus grands dons."
 
 empower_the_mother:0 "Tribut à la Mère Verte"
 empower_the_mother_decision_desc:0 "Il y a longtemps que nous avons rendu grâce à notre Mère pour la dernière fois. D'une manière ou d'une autre, nous sentons comme un seul être, qu'Elle est prête à nous bénir à nouveau."
 empower_the_mother_decision_tooltip:0 "Tribut à la Mère Verte"
 empower_the_mother_decision_confirm_text_desc:0 "Apportez les offrandes"
 empower_the_mother_custom:0 "Dépensez de la piété pour recevoir de plus grands pouvoirs."
 
 sack_the_bloodletters_hall:0 "Raser la Halle du Saigneur"
 sack_the_bloodletters_hall_decision_desc:0 "Les Arbres Exsangues sont ainsi nommés pour la prévalence d'une espèce de chauve-souris vampire blanc pâle y vivant. Ces chauves-souris sont anormalement grandes et peuvent tuer un homme en quelques minutes sans même déranger son sommeil. Cette menace a étrangement donné naissance à un culte vénérant le sang dans les profondeurs de cette zone ; ses fidèles étant connus simplement sous le nom de 'Saigneurs'.\n\nCes vils cultistes doivent et seront déracinés de leur source même. Avec eux fuyant maintenant leur halle en panique, nous la raserons."
 sack_the_bloodletters_hall_decision_tooltip:0 "Raser la Halle du Saigneur"
 sack_the_bloodletters_hall_decision_confirm_text_desc:0 "Mettez-y le feu !"
 sack_the_bloodletters_hall_custom:0 "Les bloqueurs de chauves-souris vampires goules seront enfin éliminables, sans leurs quasi-bergers pour nous arrêter."
 
 cos_tame_bats:0 "Pacifier les Chauves-souris Vampires Locales"
 cos_tame_bats_decision_desc:0 "Les Tahae-toto, ou chauves-souris vampires comme les étrangers les appellent, sont des âmes sœurs avec nous. Elles ressentent La Soif, tout comme nous. Bien qu'elles s'attaquent aux étrangers, la sève plaquée sur nos corps depuis notre jeune âge leur fait savoir que nous ne leur voulons aucun mal. Il est grand temps que nous travaillions avec, et non contre elles."
 cos_tame_bats_decision_tooltip:0 "Pacifier les Chauves-souris Vampires Locales"
 cos_tame_bats_decision_confirm_text_desc:0 "Comme Un"
 cos_tame_bats_custom:0 "Nous pourrions devoir prendre cette décision plusieurs fois s'il y en a beaucoup à apprivoiser..."
 
 treat_with_feeders:0 "Apprivoiser les Tahae-toto"
 treat_with_feeders_decision_desc:0 "Étant donné l'interaction constante avec les meutes locales de 'chauves-souris vampires', il n'est pas surprenant qu'un alpha cherche occasionnellement un approvisionnement constant en nourriture avec leurs bergers.\n\nLes Chauves-souris Vampires Goules ont toujours faim de sang frais, bien qu'elles n'aiment pas s'éloigner trop de leur habitat naturel. Avec assez d'incitation et d'entraînement cependant, nous pouvons guider nos voisines vers les ennemis, répandant ainsi La Soif à tous.\n\nElles se souviendront du sang de leur maître et se disperseront probablement vers leur foyer d'origine si ce maître meurt."
 treat_with_feeders_decision_tooltip:0 "Guidez une meute de chauves-souris vampires locales plus près de chez vous. Elles se souviendront du sang de leur maître et se disperseront probablement vers leur foyer d'origine si ce maître meurt."
 treat_with_feeders_decision_confirm_text_desc:0 "Préparez un festin sanglant !"
 treat_with_feeders_custom:0 "Nos sœurs d'esprit se tiendront prêtes près de notre capitale jusqu'à ce que nous soyons prêts à les déchaîner sur des ennemis sans méfiance."
 

 sack_the_corpse_mounds:0 "Démanteler les Monticules de Cadavres"
 sack_the_corpse_mounds_decision_desc:0 "Empilés haut dans une clairière de jungle se dressent des monticules composés de milliers de corps et d'artefacts en ruine, peut-être des ordres de grandeur de plus. Les natifs de cette région portent tous les 'envahisseurs' défaits de la côte, ainsi que toutes leurs possessions étrangères pour les empiler ici.\n\nLes basilics sont attirés par centaines, peut-être même milliers, vers ces collines puantes et pourrissantes. Si nous espérons jamais faire usage de cette rare clairière naturelle dans la jungle, ces monticules doivent disparaître.\n\nLa zone elle-même mise à part, tamiser les détritus pourrait être hautement profitable."
 sack_the_corpse_mounds_decision_tooltip:0 "Démanteler les Monticules de Cadavres"
 sack_the_corpse_mounds_decision_confirm_text_desc:0 "Jusqu'aux genoux dans les vieux os..."
 sack_the_corpse_mounds_custom_1:0 "Les bloqueurs de Basilics Voraces seront enfin éliminables, sans leur source de nourriture puante pour les maintenir dans les parages."
 sack_the_corpse_mounds_custom_2:0 "Probablement une poignée d'artefacts anciens. Ils travaillent sur ces monticules depuis des centaines, sinon des milliers d'années."
 
 cos_tame_basilisks:0 "Pacifier les Basilics Locaux"
 cos_tame_basilisks_decision_desc:0 "Les Raksasa, ou basilics géants comme les étrangers les appellent, sont les messagers des dieux eux-mêmes. Ils ressentent la grande faim, tout comme nous. Bien qu'ils s'attaquent aux étrangers, notre entretien des Monticules de Cadavres les a rendus presque aimables envers nous en tant que leurs gardiens. Il est grand temps que nous travaillions avec, et non contre eux."
 cos_tame_basilisks_decision_tooltip:0 "Pacifier les Basilics Locaux"
 cos_tame_basilisks_decision_confirm_text_desc:0 "Comme Un"
 cos_tame_basilisks_custom:0 "Nous pourrions devoir prendre cette décision plusieurs fois s'il y en a beaucoup à apprivoiser..."
 
 
 cos_swamp_wyvern_bonding_decision:0 "Chercher des Wyvernes des Marais Vénérables"
 cos_swamp_wyvern_bonding_decision_desc:0 "Bien que les jeunes wyvernes des marais soient promptes à la colère et hautement territoriales, celles d'un âge vénérable sont bien plus ouvertes à la manipulation.\n\nEn envoyant des éclaireurs pour trouver, nourrir et diriger ces quelques élues, nous pouvons gagner un avantage exceptionnellement aiguisé contre nos ennemis."
 cos_swamp_wyvern_bonding_decision_decision_tooltip:0 ""
 cos_swamp_wyvern_bonding_decision_decision_confirm_text_desc:0 "Envoyez les éclaireurs"
 cos_wyvern_decision_tooltip:0 "Le temps dira si des wyvernes appropriées se perchent dans les environs..."
 


    # Events #
 
 
 cos_swamp_wyvern_bonding:0 "Attirer un Léviathan - Le Grand Marais"
 cos_swamp_wyvern_bonding_title:0 "Attirer un Léviathan - Le Grand Marais"
 cos_swamp_wyvern_bonding_desc:0 "Les wyvernes qui font du Grand Marais leur foyer sont des créatures extrêmement territoriales. Rivalisant constamment contre leurs voisines pour de plus grandes étendues de sol détrempé à appeler leur. S'approcher du territoire d'une telle bête se terminera presque certainement en désastre, car leurs becs et queues mortels font court travail de tout ennemi non-wyverne.\n\nCependant, en grandissant vers un âge plus vénérable, les wyvernes des marais deviennent plus paresseuses et plus dociles ; plus acceptantes aux offrandes de l'homme. Si bien fait, la bête peut devenir dépendante de ses pourvoyeurs, finalement devenant disposée à suivre les directions vers de nouvelles sources de 'nourriture'. Que cette nourriture soit d'autres peuples tribaux plus hostiles est sans importance pour la bête.\n\nPlusieurs éclaireurs sont revenus et l'un s'avance pour parler : "Trois ont été trouvées. Combien pouvons-nous nous permettre de nourrir ?"" 
 cos_swamp_wyvern_bonding.opt1:0 "Juste une seule"
 cos_swamp_wyvern_bonding.opt2:0 "Deux seront plus que suffisantes"
 cos_swamp_wyvern_bonding.opt3:0 "Trois et que nos ennemis tremblent..."
 cos_swamp_wyvern_bonding.opt4:0 "Aucune... c'était une perte de temps"
 
 
 cos_empower.1001.t:0 "Nourrir la Gueule Dévorante"
 cos_empower.1001.a:0 "Poisson-chat géant toujours affamé des rives du Zamoyos"
 cos_empower.1001.b:0 "Un grand singe abatteur d'arbres du sud"
 cos_empower.1001.c:0 "Une wyverne rusée et monstrueuse de la Passe Verte !"
 cos_empower.1001.desc:0 "L'année tourne et avec son passage nous devons décider de notre tribut principal à la Gueule Dévorante cette année. Comme nous l'avons fait dans les années plus maigres, de plus petits tributs n'offenseront pas les dieux. Mais pour obtenir de plus grands pouvoirs pour notre peuple, nous devons considérer des prix plus élevés.\n\nLes dieux AURONT leur tribut, que nous ayons l'intention de le retenir ou non... Que sera dévoré cette année, pour que son pouvoir puisse nous être transféré ?"
 
 
 cos_empower.1002.t:0 "Pétitionner la Mère Verte"
 cos_empower.1002.a:0 "Paniers de fourrage frais"
 cos_empower.1002.b:0 "Ornements de sangdragon sculptés des falaises"
 cos_empower.1002.c:0 "Une orchidée de nuit rare du lac Zamoyos"
 cos_empower.1002.desc:0 "L'année tourne et avec son passage nous devons décider de notre tribut principal à la Mère Verte cette année. Comme nous l'avons fait dans les années plus maigres, de plus petits tributs n'offenseront pas notre dieu. Mais pour obtenir de plus grands pouvoirs pour notre peuple, nous devons considérer des prix plus élevés.\n\nComme fils et filles véritables, nous serions terriblement honteux de ne pas offrir de remerciements à notre propre mère. La question demeure, quel don lui présenterons-nous cette année ?"
 
 
 cos_blocker.1001.t:0 "La Wyverne Alpha"
 cos_blocker.1001.a:0 "Combat singulier comme les dieux l'ont voulu"
 wyvern_duel_tooltip_1:0 "Vous affrontez l'alpha en duel seul"
 cos_blocker.1001.b:0 "Encercler la bête et ne prendre aucun risque"
 cos_blocker.1001.b.success.desc:0 "Nous encerclons et abattons la bête"
 cos_blocker.1001.b.failure.desc:0 "Nous sommes repoussés par la bête, mais j'échappe dans la foule fuyante"
 cos_blocker.1001.c:0 "Quelque chose de secret... du poison peut-être..."
 cos_blocker.1001.c.success.desc:0 "La bête est morte, la colonie se disperse."
 cos_blocker.1001.c.failure.desc:0 "Rien ne semble se passer... quelle perte de temps"
 cos_blocker.1001.d:0 "Cette province ne vaut pas ma vie"
 cos_blocker.1001.desc:0 "Cette province a eu un problème significatif de wyvernes depuis que nous y avons mis le pied. Bien que les colons aient travaillé diligemment pour les éliminer, et au coût de nombreuses vies en plus, il est devenu clair que nous ne pouvons avancer.\n\nLa présence d'une wyverne alpha complique les choses. Si nous continuons maintenant cette bête déplacera simplement sa colonie ailleurs, potentiellement directement dans une zone plus peuplée. Avec ceci à l'esprit...\n\nComment devrais-je m'attaquer à cette bête ?"
 
 cos_blocker.1002.t:0 "La Wyverne Alpha"
 cos_blocker.1002.a:0 "Plus d'hésitation..."
 cos_blocker.1002.a.success.desc:0 "Je me dresse au-dessus des plus puissants ennemis de Sothoryos..."
 cos_blocker.1002.a.failure.desc:0 "Je suis repoussé par la bête et prends de sérieuses blessures..."
 cos_blocker.1002.a.critical.desc:0 "Quel bec acéré..."
 
 cos_blocker.1002.b:0 "Peut-être puis-je encore m'enfuir !"
 cos_blocker.1002.b.success.desc:0 "Je prends quelques blessures mineures, mais m'échappe..."
 cos_blocker.1002.b.failure.desc:0 "Je prends des blessures majeures, mais m'échappe..."
 
 cos_blocker.1002.desc:0 "Bien que l'on m'ait mis en garde contre une telle témérité... aucun recul ne change le fait que j'affronte maintenant une wyverne alpha en combat singulier.\n\nLa bête se dresse devant moi, ailes étendues de chaque côté en défi. Dans cet état l'alpha apparaît presque 20 mètres (~60ft) de largeur et sa silhouette contre le ciel m'envoie un frisson dans l'échine. Ses griffes sont acérées, son bec plus acéré encore. Je n'ai qu'un seul moment maintenant pour faire mon mouvement..."

##################

 cos_yeen_ruins.1000.t:0 "Le Vestibule - Expéditions de Yeen"
 cos_yeen_ruins.1000.desc:0 "Le palais est ancien, très ancien. Plein de mémoire et de colère. Des toiles d'araignées filées en épais cordage, bien que pas moins collant, s'étendent en grands filets à travers les nombreuses salles et passages. Tel qu'il est l'entrée est complètement infranchissable et seule une lame bien aiguisée est capable de trancher à travers.\n\nIl n'y a pas encore de signe des créatures filant ces toiles, bien que le sentiment d'être observé grandit plus nous nous attardons dans le vestibule..."
 
 cos_yeen_ruins.1000.a:0 "Nous nous taillerons un chemin !"
 cos_yeen_ruins.1000.a.success.desc:0 "Nous faisons bon temps vers la grande salle !"
 cos_yeen_ruins.1000.a.failure.desc:0 "Nous progressons lentement..."
 cos_yeen_ruins.1000.a.critical.desc:0 "Nous progressons lentement... et beaucoup d'hommes ont disparu sans trace."
 
 cos_yeen_ruins.1000.b:0 "Au diable, brûlons tout !"
 cos_yeen_ruins.1000.b.success.desc:0 "Les dommages aux bâtiments environnants sont maintenus au minimum."
 cos_yeen_ruins.1000.b.failure.desc:0 "Les bâtiments environnants sont rasés."
 cos_yeen_ruins.1000.b.critical.desc:0 "Le district environnant est dévasté... attendez, qu'est-ce qui vole hors du toit ?"
 
 cos_yeen_ruins.1000.c:0 "Le moment n'est pas venu... barrez les portes et dissolvez l'expédition"
 
 
 cos_yeen_ruins.1001.t:0 "Salles Centrales - Expéditions de Yeen"
 cos_yeen_ruins.1001.desc:0 "Un vaste labyrinthe organique de toiles, sacs d'œufs et restes desséchés s'étend devant nous. Nous nous tenons dans ce qui a dû être autrefois la grande salle du palais, maintenant cela semble être le cœur de la redoutable infestation d'araignées de Yeen."
 
 cos_yeen_ruins.1001.a:0 "Lances en avant ! Haches sur les flancs ! En avant !"
 cos_yeen_ruins.1001.a.success.desc:0 "Ces créatures sans esprit n'ont jamais eu une chance..."
 cos_yeen_ruins.1001.a.failure.desc:0 "Nous sommes mis en déroute, en prenant de lourdes pertes."
 cos_yeen_ruins.1001.a.critical.desc:0 "Je me retrouve seul dans les salles."
 
 cos_yeen_ruins.1001.b:0 "Au diable, brûlons tout !"
 cos_yeen_ruins.1001.b.success.desc:0 "Les dommages aux bâtiments environnants sont maintenus au minimum."
 cos_yeen_ruins.1001.b.failure.desc:0 "Les bâtiments environnants sont rasés."
 cos_yeen_ruins.1001.b.critical.desc:0 "Le district environnant est dévasté... attendez, qu'est-ce qui vole hors du toit ?"
 
 cos_yeen_ruins.1001.c:0 "Le moment n'est pas venu... barrez les portes et dissolvez l'expédition"
 
 cos_yeen_ruins.1002.t:0 "Encerclés - Expéditions de Yeen"
 cos_yeen_ruins.1002.desc:0 "Moi-même et ceux qui restent à mes côtés nous trouvons maintenant encerclés par ces abominations arachnides dans les salles centrales. Les corps paralysés des tombés sont déjà en train d'être coconnés et emportés. Je vois la peur sur les visages de mes compagnons. Leurs yeux dardent vers l'entrée, encore partiellement dégagée d'araignée...\n\nCependant, ces morts ou mourants nous présentent une opportunité unique. Ces araignées qui ont déjà commencé leurs lugubres repas semblent singulièrement focalisées sur eux. Ceci pourrait être une chance de prendre l'avantage !\n\nOu une façon plus rapide de mourir..."
 
 cos_yeen_ruins.1002.a:0 "Prêts avec moi ! Nous vengeons les tombés !"
 cos_yeen_ruins.1002.a.success.desc:0 "Nous apportons quelque petite paix aux tombés..."
 cos_yeen_ruins.1002.a.failure.desc:0 "Nous sommes mis en déroute, en prenant de lourdes pertes."
 cos_yeen_ruins.1002.a.critical.desc:0 "Je me retrouve seul dans les salles..."
 cos_yeen_ruins.1002.b:0 "Retraite ! Nous nous taillerons un chemin !"
 cos_yeen_ruins.1002.b.success.desc:0 "Au moins nous nous en sommes sortis vivants. Eh bien... la plupart d'entre nous."
 cos_yeen_ruins.1002.b.failure.desc:0 "Au moins nous nous en sommes sortis vivants. Eh bien... certains d'entre nous."
 cos_yeen_ruins.1002.b.critical.desc:0 "Je suis forcé de fuir plus profondément à l'intérieur... seul."
 
 cos_yeen_ruins.1002.c:0 "Il est temps de se replier... barrez les portes et dissolvez l'expédition"
 
 cos_yeen_ruins.1003.t:0 "Les Salles Pleurantes"
 cos_yeen_ruins.1003.desc:0 "Au-delà du nid proprement dit se trouve une salle étrange entièrement dépourvue de toute toile. En fait cette zone est dépourvue de tout signe de créatures vivantes. Le passage s'ouvre sur une chambre massive, ouverte sur l'air par un balcon d'un côté, surplombant le district noble. Les murs, sol et plafond sont tous gravés d'une sorte de langage ici, des couleurs sombres tourbillonnant dans les lettres. Du coin de l'œil vous pouvez presque les voir pulser, mais demeurent toujours apparemment inertes une fois votre attention revenue sur elles.\n\nLes gravures sont impeccables et il ne faut pas longtemps avant que vous réalisiez comment c'est possible. Les murs suintent constamment une sorte de fluide huileux à une vitesse extrêmement lente ; presque imperceptible. Cet 'ichor' coule à travers de minuscules fissures entre les carreaux du sol vers une destination inconnue, nous épargnant de son accumulation.\n\nMis à part les murs fascinants, la salle est quelconque et nue. Quelques minutes de plus passent avant que quoi que ce soit d'autre de significatif soit trouvé tandis que la vaste chambre est fouillée. Des marques de griffes... massives et indéniablement celles d'un dragon. Il y a aussi des marques de brûlure, une région des gravures carbonisée par le feu du dragon ; vous aviez entendu dire que le feu de dragon, spécialement d'un spécimen de cette taille, aurait transformé la pierre froide en beurre en moments, mais cette pierrenoire huileuse semble avoir résisté à l'effet, ne serait-ce que quelque peu...\n\nUn dernier appel d'attention résonne à travers la chambre résonnante. Les restes anciens et décomposés d'un campement près du balcon. Il semble que son propriétaire soit parti précipitamment, laissant derrière lui une grande partie de son camp, notamment #bold une malle de petits artefacts valyriens #! Plus excitant encore, caché dans un ballot au fond d'une malle se trouve un grand œuf écailleux. Ce doit être le campement de Jaenara Belaerys, faisant de cet œuf celui du dragon Terrax ! Vous priez que les âges dans ce lieu maléfique n'aient pas affecté l'œuf d'une quelconque manière..."
 
 cos_yeen_ruins.1003.a:0 "Nous avons réussi là où les seigneurs-dragons ont échoué !"
 cos_yeen_ruins.1003.a.success.desc:0 "Ces créatures sans esprit n'ont jamais eu une chance..."
 cos_yeen_ruins.1003.a.failure.desc:0 "Nous sommes mis en déroute, en prenant de lourdes pertes."
 cos_yeen_ruins.1003.a.critical.desc:0 "Je me retrouve seul dans les salles. J'entends des sons tout autour de moi...\n\nSoudain ces sons de crissements et cliquetis tombent silencieux et je suis tiré vers le haut par l'épaule. Je sens une douleur soudaine et mordante à la cuisse, avant que la douleur... toute douleur, ne me quitte. C'est ainsi que je finis."
 
 cos_yeen_ruins.9999.t:0 "Seul dans les Ténèbres - Expéditions de Yeen"
 cos_yeen_ruins.9999.desc:0 "Je me retrouve seul dans les salles. J'entends des sons tout autour de moi...\n\nSoudain ces sons de crissements et cliquetis tombent silencieux et je suis tiré vers le haut par l'épaule. Je sens une douleur soudaine et mordante à la cuisse, avant que la douleur... toute douleur, ne me quitte. C'est ainsi que je finis."
 cos_yeen_ruins.9999.a:0 "C'est ainsi que mon histoire se termine..."

    # Custom Tooltips #
    
 yeen_burn_it_down:0 "Brûler toute trace de vie du bâtiment... avec tout ce qui a de la valeur ou d'intérêt à l'intérieur."
 yeen_partial_refund:0 "Vous récupérez une grande partie des biens investis dans l'expédition."
 yeen_death:0 "Pas de seconde chance. Vous mourez tout seul."
 yeen_advance:0 "Vous progressez..."
 yeen_no_retreat:0 "Vous avez encore l'option de forcer une autre attaque..."
 

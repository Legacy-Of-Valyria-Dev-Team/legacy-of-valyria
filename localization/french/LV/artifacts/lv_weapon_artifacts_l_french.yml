l_french:
 #VS Weapons
 vs_torment_name:0 "Tourment"
 vs_torment_description:0 "Tourment est une lame légendaire en acier valyrien, forgée par Daemon Volar au cœur de [GetTitleByKey('k_lokiria').GetNameNoTier], bien avant le [doom|E]. Son premier possesseur, Taurin, souverain fondateur du royaume, s'en empara lors de la naissance de celui-ci, la maniant pour unir sous son autorité des terres jusque-là fracturées. Forgée dans l'acier valyrien le plus rare, son pommeau est façonné en forme de dragon féroce, symbole de puissance et de volonté inébranlable.\n\n« Jamais conquis, toujours redouté »"

 vs_dragon_halberd_name:0 "Hallebarde du Dragon"
 vs_dragon_halberd_description:0 "Une antique hallebarde en acier valyrien, jadis maniée par les Gardes-dragons de l'Ancienne Valyria."

 vs_abyss_name:0 "Abîme"
 vs_abyss_description:0 "Une hache de guerre en acier valyrien au manche de bois flotté noir. La tête et les tentacules d'un kraken sont sculptées sur la tête de la hache, des pierres de rubis serties en guise d'yeux."

 dothraki_arakh_name:0 "Arakh Dothraki"
 dothraki_arakh_description:0 "Arme traditionnelle des Dothrakis."

 vs_frostbite_hammer_name:0 "Morsure de Givre"
 vs_frostbite_hammer_description:0 "Morsure de Givre est une arme de légende, forgée dans un acier valyrien bleu pâle, témoignage de la puissance de la Maison Frimas. Sa tête massive, façonnée en bec de corbeau, est aussi redoutable que les vents du nord qui balaient sa patrie glacée.\n\nJadis maniée par le dernier des rois Frimas, elle fut le symbole d'une dynastie qui régna depuis le cœur de Fort-Frimas. Après la chute du roi, celui-ci fut exilé vers la [nw_govt|E], avant de finalement déserter pour fuir vers Crocgivre.\n\nPerdue dans les brumes du temps, la localisation de Morsure de Givre demeure inconnue — pourtant, sa légende perdure, et l'on murmure que l'arme repose cachée quelque part dans les étendues gelées, attendant la main de celui ou celle qui saura se montrer digne de sa puissance."

 dragon_tail_name:0 "Queue de Dragon"
 dragon_tail_description:0 "..."
 vs_mages_fire_name:0 "Feu du Mage"
 vs_mages_fire_desc:0 "Une rapière à une main, dotée d'une lame fine à double tranchant conçue pour percer les défenses d'un adversaire d'un coup d'estoc. Le métal de sa garde arbore une teinte dégradée, glissant du blanc au bleu, en harmonie avec le bleu de sa poignée et de son pommeau. C'est une arme de précision, plus proche d'une œuvre d'art que d'un instrument de guerre."

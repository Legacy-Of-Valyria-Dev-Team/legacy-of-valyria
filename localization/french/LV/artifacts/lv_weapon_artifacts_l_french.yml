l_french:
  #VS Weapons
  vs_torment_name:0 "Tourment"
  vs_torment_description:0 "Tourment est une lame légendaire d'acier valyrien forgée par Daemon Volar au cœur de [GetTitleByKey('k_lokiria').GetNameNoTier], bien avant [doom|E]. Son premier propriétaire, Taurin, souverain fondateur du royaume, s'en empara lors de la naissance du royaume et la brandit pour unifier les terres fracturées sous son règne. Forgée dans l'acier valyrien le plus rare, son pommeau prend la forme d'un dragon féroce, symbole de puissance et de volonté inébranlable.\n\nLes runes gravées sur sa lame murmurent encore l'antique devise : « Jamais Conquis, toujours Redouté »"

  vs_dragon_halberd_name:0 "Hallebarde du Dragon"
  vs_dragon_halberd_description:0 "Une antique hallebarde d'acier valyrien maniée par les Gardes Dragons dans l'ancienne Valyria. Ses lames tranchantes luisent encore d'un éclat spectral, témoins silencieux de la grandeur perdue des Possessions."

  vs_abyss_name:0 "Abysses"
  vs_abyss_description:0 "Une hache de guerre d'acier valyrien au manche de bois flotté noir comme la nuit. La tête et les tentacules d'un kraken sont ciselés dans le fer de la hache, ses yeux sertis de rubis sanglants qui semblent fixer quiconque ose croiser son regard. Forgée dans les abysses marines, elle porte en elle la fureur des tempêtes et la rage des profondeurs."

  dothraki_arakh_name:0 "Arakh Dothraki"
  dothraki_arakh_description:0 "Arme traditionnelle des Dothrakis, cette lame courbe est l'extension de l'âme guerrière des seigneurs des chevaux. Sa courbure parfaite épouse les mouvements fluides du combat à cheval, tranchant chair et os avec la grâce mortelle des steppes."

  vs_frostbite_hammer_name:0 "Morsure-de-Givre"
  vs_frostbite_hammer_description:0 "Morsure-de-Givre est une arme de légende, forgée dans l'acier valyrien d'un bleu pâle comme les glaces éternelles, testament de la puissance de la Maison Frost. Sa tête massive, sculptée à l'image d'un bec de corbeau, inspire une terreur égale aux vents du nord qui balayent sa terre natale glacée.\n\nAutrefois brandie par le dernier des rois Frost, elle incarnait le symbole d'une dynastie qui régnait depuis le cœur de Frostguard. Après la chute du roi, il fut exilé vers [nw_govt|E], désertant finalement pour fuir vers les Crocgivre.\n\nPerdue dans les méandres du temps, nul ne connaît le refuge de Morsure-de-Givre — cependant, sa légende perdure, et l'on murmure que l'arme gît cachée quelque part dans les étendues gelées, attendant la main de quelqu'un digne de sa puissance."

  dragon_tail_name:0 "Queue-de-Dragon"
  dragon_tail_description:0 "..."
  vs_mages_fire_name:0 "Flamme du Mage"
  vs_mages_fire_desc:0 "Une rapière à une main dotée d'une lame effilée à double tranchant conçue pour percer les défenses adverses. Le métal de sa garde arbore une teinte dégradée qui transite du blanc au bleu, s'harmonisant avec l'azur de sa poignée et de son pommeau. Cette arme de précision s'apparente davantage à une œuvre d'art qu'à un instrument de guerre, chaque détail ciselé témoignant de la maîtrise de son forgeron."

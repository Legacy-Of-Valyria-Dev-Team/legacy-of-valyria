l_french:
  #VS Weapons
  vs_torment_name:0 "Tourment"
  vs_torment_description:0 "Tourment est une légendaire lame d'acier valyrien forgée par Daemon Volar au cœur de [GetTitleByKey('k_lokiria').GetNameNoTier], bien avant le [doom|E]. Son premier propriétaire, Taurin, souverain fondateur du royaume, s'en empara lors de la naissance du royaume, la brandissant pour unir des terres fragmentées sous son règne. Forgée dans l'acier valyrien le plus rare, son pommeau est sculpté en forme de dragon féroce, symbole de puissance et de volonté inébranlable.\n\n« Jamais conquis, toujours redouté »"

  vs_dragon_halberd_name:0 "Hallebarde du Dragon"
  vs_dragon_halberd_description:0 "Une antique hallebarde d'Acier Valyrien maniée par les Gardes du Dragon dans l'Ancienne Valyria."

  vs_abyss_name:0 "Abîme"
  vs_abyss_description:0 "Une hache de guerre en Acier Valyrien dotée d'un manche en bois flotté noir. La tête et les tentacules d'un kraken sont gravées sur le fer de la hache, avec des rubis sertis dans les yeux."

  dothraki_arakh_name:0 "Arakh Dothraki"
  dothraki_arakh_description:0 "L'arme traditionnelle des Dothrakis."

  vs_frostbite_hammer_name:0 "Morsure de Givre"
  vs_frostbite_hammer_description:0 "Morsure de Givre est une arme de légende, forgée dans un acier valyrien bleu pâle, témoignage de la puissance de la Maison Frost. Sa tête massive, façonnée en bec de corbeau, est aussi redoutable que les vents du nord qui balaient sa patrie glacée.\n\nJadis brandie par le dernier des rois Frost, elle fut le symbole d'une dynastie qui régna depuis le cœur de Frostguard. Après la chute du roi, celui-ci fut exilé à la [nw_govt|E], avant de déserter pour fuir vers les Crocgivre.\n\nPerdue dans les brumes du temps, nul ne sait où gît Morsure de Givre. Pourtant, sa légende perdure, et l'on murmure que l'arme repose quelque part dans les étendues glacées, attendant la main de quelqu'un digne de sa puissance."

  dragon_tail_name:0 "Queue de Dragon"
  dragon_tail_description:0 "..."
  vs_mages_fire_name:0 "Feu du Mage"
  vs_mages_fire_desc:0 "Une rapière à une main dotée d'une lame élancée à double tranchant, conçue pour transpercer les défenses adverses. Le métal de sa garde arbore un dégradé de couleurs passant du blanc au bleu, assorti au bleu de sa poignée et de son pommeau. C'est une arme de précision, plus proche d'une œuvre d'art que d'un instrument de guerre."
  
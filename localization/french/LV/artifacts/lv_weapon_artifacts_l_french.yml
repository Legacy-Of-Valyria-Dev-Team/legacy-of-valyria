l_french:
  #VS Weapons
  vs_torment_name:0 "Tourment"
  vs_torment_description:0 "Tourment est une lame légendaire d'acier valyrien forgée par Daemon Volar au cœur du Royaume de Lokiria, bien avant que le Fléau ne s'abatte sur les terres anciennes. Son premier maître, le Roi Taurin, souverain fondateur du royaume, s'en empara lors de la naissance de son domaine, la brandissant pour unifier des contrées morcelées sous son autorité. Façonnée du plus rare acier valyrien, son pommeau prend la forme d'un dragon féroce, emblème de puissance et de volonté indomptable.\n\n'Jamais Conquis, toujours redouté'"

  vs_dragon_halberd_name:0 "Hallebarde Draconique"
  vs_dragon_halberd_description:0 "Une antique hallebarde d'acier valyrien maniée jadis par la Garde des Dragons dans l'ancienne Valyria, quand les seigneurs-dragons régnaient encore sur leur empire de feu et de sang"

  vs_abyss_name:0 "Abîme"
  vs_abyss_description:0 "Une hache de guerre en acier valyrien au manche de bois noir flotté des océans lointains. La tête et les tentacules d'un kraken sont ciselées sur le fer de la hache avec une finesse surnaturelle, tandis que des rubis écarlates, telles des prunelles infernales, ornent ses yeux scintillants"

  dothraki_arakh_name:0 "Arakh Dothraki"
  dothraki_arakh_description:0 "Lame ancestrale des Dothrakis, aussi courbe que le galop de leurs montures, aussi tranchante que leur férocité. Dans les mains d'un étalon de guerre, elle fauche les âmes comme le vent couche les herbes de la Mer Dothraki"

  vs_frostbite_hammer_name:0 "Morsure-de-Givre"
  vs_frostbite_hammer_description:0 "Morsure-de-Givre est une arme de légende, forgée d'acier valyrien d'un bleu pâle comme les glaces éternelles, témoignage de la puissance de la Maison Frost. Sa tête massive, façonnée tel un bec de corbeau, est aussi redoutable que les vents septentrionaux qui balaient sa patrie glaciale.\n\nJadis brandie par le dernier des rois Frost, elle se dressait comme le symbole d'une dynastie qui régnait depuis le cœur de Gardegivre. Après la chute du roi, celui-ci fut exilé à la Garde de Nuit, avant de déserter pour fuir vers les Crocgivre.\n\nPerdue dans les méandres du temps, nul ne connaît la demeure actuelle de Morsure-de-Givre — cependant, sa légende perdure, murmurant que l'arme reposerait quelque part dans les étendues gelées, attendant la main d'un être digne de sa puissance"

  dragon_tail_sword_name:0 "Queue-de-Dragon"
  dragon_tail_description:0 "..."
l_french:
  #VS Weapons
  vs_torment_name:0 "Tourment"
  vs_torment_description:0 "Tourment est une lame légendaire d'acier valyrien forgée par Daemon Volar au cœur du Royaume de Lokiria, bien avant le Fléau. Son premier propriétaire, le roi Taurin, souverain fondateur du royaume, s'en empara lors de la naissance du royaume, la brandissant pour unifier les terres fracturées sous son règne. Forgée dans le plus rare des aciers valyriens, son pommeau est façonné à l'image d'un dragon féroce, symbole de puissance et de volonté inflexible.\n\n'Jamais conquis, toujours redouté'"

  vs_dragon_halberd_name:0 "Hallebarde Draconique"
  vs_dragon_halberd_description:0 "Une antique hallebarde d'acier valyrien maniée par les Gardes Dragons dans l'Ancienne Valyria."

  vs_abyss_name:0 "Abîme"
  vs_abyss_description:0 "Une hache de guerre d'acier valyrien au manche de bois flotté noir. La tête et les tentacules d'un kraken sont gravés dans le fer de la hache, avec des rubis sertis dans les yeux."

  dothraki_arakh_name:0 "Arakh Dothraki"
  dothraki_arakh_description:0 "Arme traditionnelle des Dothrakis."

  vs_frostbite_hammer_name:0 "Morsure-de-Givre"
  vs_frostbite_hammer_description:0 "Morsure-de-Givre est une arme de légende, forgée dans un acier valyrien bleu pâle, testament de la puissance de la maison Frost. Sa tête massive, façonnée comme un bec de corbeau, est aussi redoutable que les vents septentrionaux qui balaient sa terre natale glacée.\n\nJadis brandie par le dernier des rois Frost, elle se dressait comme le symbole d'une dynastie qui régnait depuis le cœur de Garde-Givre. Après la chute du roi, celui-ci fut exilé à la Garde de Nuit, avant de déserter pour fuir vers les Crocgivre.\n\nPerdue dans les méandres du temps, la localisation de Morsure-de-Givre demeure inconnue — cependant, sa légende perdure, l'arme étant murmurée comme reposant quelque part dans les désolations gelées, attendant la main de quelqu'un digne de sa puissance."

  dragon_tail_name:0 "Queue de Dragon"
  dragon_tail_description:0 "..."
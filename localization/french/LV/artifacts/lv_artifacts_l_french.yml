l_french:
  book_of_dragonlore_name:0 "Le Traité de Dracologie"
  book_dragonlore_desc:0 "Un imposant grimoire patiné par les âges, traitant de la dracologie, de l'art d'élever les dragons et des secrets de leur domptage, rédigé avant le terrible Fléau de Valyria. La reliure rigide est forgée dans le plus pur acier valyrien, sa surface sombre et chatoyante gravée de motifs draconiques d'une complexité hypnotique. Malgré la résistance légendaire de l'acier, les pages intérieures trahissent le poids inexorable des siècles — jaunies et cassantes, leurs bords s'effilochent comme les vestiges d'un temps révolu. L'encre jadis éclatante s'est estompée dans les brumes du temps, mais les secrets de la maîtrise draconique demeurent parfaitement lisibles, préservés par la force éternelle de cette reliure enchantée. Ce livre constitue une relique d'une rareté inouïe, son contenu aussi dangereux et puissant que les créatures légendaires qu'il décrit avec une précision troublante."
  book_of_life_name:0 "Le Codex de Vie"
  book_life_desc:0 "Ce tome vénérable, entièrement consacré à l'étude de la vie, de la santé, de la fertilité et des arts de la médecine, fut minutieusement élaboré dans les cités de Valyria bien avant leur anéantissement. Bien que la reliure de cuir soit profondément craquelée et patinée par les siècles, les pages intérieures renferment le savoir le plus avancé connu de ce monde. Des diagrammes détaillés, des formules d'une précision absolue et des théories révolutionnaires sur l'art de la guérison, les mystères de l'enfantement et les secrets de la longévité emplissent ses pages fragiles et jaunies. Malgré son apparence usée par le temps, ce livre demeure un trésor de sagesse absolument inestimable — ses révélations surpassent largement tout ce qui fut jamais produit en ces temps modernes. L'encre pâlie peut suggérer l'ancienneté, mais la connaissance qu'elle véhicule transcende les âges, ultime testament de l'intellect sans égal des guérisseurs de l'antique Valyria."
  the_dragons_book:0 "Le Livre des Dragons"
  the_dragons_book_desc:0 "Cet antique tome, relié dans le plus précieux acier valyrien, constitue un compendium exhaustif du savoir draconique, détaillant minutieusement l'histoire, l'art de l'élevage et les techniques de domptage des dragons. Ses pages précieuses regorgent d'illustrations d'une complexité stupéfiante et des notes personnelles des plus grands seigneurs dragons de l'antique Valyria, chroniquant leurs expériences périlleuses et leur sagesse ancestrale. La couverture du livre s'orne majestueusement de la représentation d'un dragon en plein vol, ses écailles scintillant dans la lumière d'un éclat presque magique. Malgré son âge immémorial, le livre demeure dans un état absolument remarquable, témoignage vivant de l'art incomparable de ses créateurs valyriens. Les sages racontent que ceux qui parcourent ses pages avec dévotion peuvent acquérir une compréhension profonde des dragons et de leurs mystères les plus secrets."

  zz_valyria_dragon_skulls.tt:0 "Seuls le Donjon Rouge ou une capitale située dans les [valyrian_freehold_short|E] peuvent exposer dignement cet artefact."
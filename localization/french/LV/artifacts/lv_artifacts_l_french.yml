l_french:
 book_of_dragonlore_name:0 "Livre de Dracologie"
 book_dragonlore_desc:0 "Un lourd volume usé par le temps, consacré à la dracologie, à l'élevage et au dressage des dragons, rédigé avant le Fléau de Valyria. Sa reliure cartonnée est faite d'acier valyrien, sa surface sombre et chatoyante gravée de motifs draconiques d'une extrême finesse. Malgré la robustesse de l'acier, les pages qu'il renferme portent les marques de l'âge — jaunies, cassantes, certains bords s'effilochant. L'encre, jadis éclatante, s'est estompée, mais les secrets permettant de maîtriser les dragons demeurent lisibles, préservés par la force pérenne de sa reliure enchantée. Cet ouvrage est une relique rare, son contenu aussi dangereux et puissant que les créatures qu'il décrit."
 book_of_life_name:0 "Livre de la Vie"
 book_life_desc:0 "Ce tome vénérable, consacré à l'étude de la vie, de la santé, de la fertilité et de la médecine, fut façonné à Valyria bien avant son Fléau. Bien que sa couverture de cuir soit craquelée et usée par les âges, les pages qu'elle renferme recèlent le savoir le plus avancé jamais connu du monde. Diagrammes minutieux, formules précises et théories révolutionnaires sur la guérison, l'accouchement et la longévité emplissent ses pages fragiles et jaunies. Malgré son aspect fatigué, cet ouvrage demeure un trésor de sagesse — ses enseignements surpassant tout ce que produit notre époque. L'encre effacée trahit peut-être son grand âge, mais le savoir qu'elle renferme est intemporel, témoignage de l'intelligence sans égale des guérisseurs de Valyria."
 the_dragons_book:0 "Le Livre des Dragons"
 the_dragons_book_desc:0 "Cet antique tome, relié d'acier valyrien, constitue un compendium du savoir draconique, détaillant l'histoire, l'élevage et le dressage des dragons. Ses pages foisonnent d'illustrations minutieuses et de notes rédigées par les plus grands Lords dragons de Valyria, consignant leurs expériences et leurs connaissances. La couverture de l'ouvrage s'orne de la représentation d'un dragon en plein vol, ses écailles chatoyant sous la lumière. Malgré son grand âge, ce livre demeure dans un état remarquable, témoignage du savoir-faire de ses créateurs. On raconte que quiconque parcourt ses pages peut acquérir une compréhension plus profonde des dragons et de leurs mœurs."

 lv_override_valyria_dragon_skulls.tt:0 "Seuls le Donjon Rouge ou une capitale des [valyrian_freehold_short|E] peuvent exposer cet artefact."
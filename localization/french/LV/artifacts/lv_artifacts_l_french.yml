l_french:
  book_of_dragonlore_name:0 "Livre de Dracologie"
  book_dragonlore_desc:0 "Un lourd tome usé par le temps, consacré à la dracologie, à l'élevage et au dressage des dragons, rédigé avant le Fléau de Valyria. La couverture rigide est forgée en acier valyrien, sa surface sombre et chatoyante gravée d'entrelacs représentant des dragons. Malgré la robustesse de l'acier, les pages intérieures portent les stigmates du temps : jaunies et fragiles, leurs bords s'effilochent par endroits. L'encre autrefois éclatante s'est estompée, mais les secrets de la maîtrise des dragons demeurent lisibles, préservés par la puissance immuable de sa reliure enchantée. Ce livre est une relique rarissime, son contenu aussi dangereux et puissant que les créatures qu'il décrit."
  book_of_life_name:0 "Livre de la Vie"
  book_life_desc:0 "Cet antique grimoire, dédié à l'étude de la vie, de la santé, de la fertilité et de la médecine, fut façonné à Valyria bien avant le Fléau. Bien que sa couverture de cuir soit craquelée et patinée par les âges, les pages qu'il renferme recèlent les connaissances les plus avancées connues en ce monde. Des diagrammes détaillés, des formules précises et des théories révolutionnaires sur la guérison, l'enfantement et la longévité emplissent ses feuillets jaunis et fragiles. Malgré son apparence usée, ce livre demeure un trésor de sagesse inestimable : ses enseignements surpassent tout ce qui fut produit aux temps modernes. L'encre pâlie trahit son âge, mais le savoir qu'il contient est éternel, témoignage de l'intellect inégalé des guérisseurs de Valyria."
  the_dragons_book:0 "Le Livre des Dragons"
  the_dragons_book_desc:0 "Cet antique grimoire, relié en acier valyrien, est un compendium de dracologie, détaillant l'histoire, l'élevage et le dressage des dragons. Ses pages regorgent d'illustrations minutieuses et de notes rédigées par les plus grands Seigneurs Dragons de Valyria, relatant leurs expériences et leurs connaissances. La couverture du livre est ornée d'un dragon en plein vol, dont les écailles scintillent à la lumière. Malgré son grand âge, l'ouvrage demeure en état remarquable, témoignage du savoir-faire de ses créateurs. On dit que ceux qui en lisent les pages peuvent acquérir une compréhension plus profonde des dragons et de leurs mystères."

  zz_valyria_dragon_skulls.tt:0 "Seuls le Donjon Rouge ou une capitale des [valyrian_freehold_short|E] peuvent exposer cet artefact."
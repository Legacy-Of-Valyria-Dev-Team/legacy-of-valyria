l_french:
  book_of_dragonlore_name:0 "Traité de Dracologie"
  book_dragonlore_desc:0 "Un lourd grimoire usé par les âges traitant de dracologie, de l'élevage des dragons et de l'art de les dompter, rédigé avant le Fléau de Valyria. La reliure rigide est forgée en acier valyrien, sa surface sombre et chatoyante gravée de motifs draconiques d'une complexité hypnotique. Malgré la résistance légendaire de l'acier, les pages intérieures trahissent le poids des siècles — jaunies et cassantes, certains bords s'effilochent. L'encre jadis éclatante s'est estompée, mais les secrets de la maîtrise draconique demeurent lisibles, préservés par la force éternelle de cette reliure enchantée. Ce livre est une relique d'une rareté inouïe, son contenu aussi dangereux et puissant que les créatures qu'il décrit."
  book_of_life_name:0 "Codex de Vie"
  book_life_desc:0 "Ce tome vénérable, consacré à l'étude de la vie, de la santé, de la fertilité et de la médecine, fut élaboré en Valyria bien avant son anéantissement. Bien que la reliure de cuir soit craquelée et patinée, les pages renferment le savoir le plus avancé connu de ce monde. Diagrammes détaillés, formules d'une précision absolue et théories révolutionnaires sur la guérison, l'enfantement et la longévité emplissent ses pages fragiles et jaunies. Malgré son apparence usée, ce livre demeure un trésor de sagesse inestimable — ses révélations surpassent tout ce qui fut produit en ces temps modernes. L'encre pâlie peut suggérer l'ancienneté, mais la connaissance qu'elle véhicule transcende les âges, testament de l'intellect sans égal des guérisseurs de Valyria."
  the_dragons_book:0 "Le Livre des Dragons"
  the_dragons_book_desc:0 "Ce tome antique, relié d'acier valyrien, est un compendium de savoir draconique détaillant l'histoire, l'élevage et le domptage des dragons. Ses pages regorgent d'illustrations complexes et de notes des plus grands seigneurs dragons de Valyria, chroniquant leurs expériences et leur sagesse ancestrale. La couverture du livre s'orne de la représentation d'un dragon en plein vol, ses écailles scintillant dans la lumière. Malgré son âge immémorial, le livre demeure dans un état remarquable, témoignage de l'art incomparable de ses créateurs. On raconte que ceux qui parcourent ses pages peuvent acquérir une compréhension profonde des dragons et de leurs mystères."

  zz_valyria_dragon_skulls.tt:0 "Seuls le Donjon Rouge ou une capitale dans les [valyrian_freehold_short|E] peuvent exposer cet artefact."
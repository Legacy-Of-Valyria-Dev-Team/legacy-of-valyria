l_french:
  book_of_dragonlore_name:0 "Grimoire de Dracologie"
  book_dragonlore_desc:0 "Un lourd grimoire séculaire consacré à l'art occulte des dragons, leur élevage et leur asservissement, forgé en les temps anciens qui précédèrent la Malédiction de Valyria. Sa couverture d'acier valyrien miroite de reflets ténébreux, ciselée d'entrelacs draconiens d'une complexité indicible. En dépit de l'inaltérable métal, les feuillets intérieurs portent les stigmates des âges—jaunis et friables, leurs lisières s'effritant au toucher. L'encre jadis flamboyante s'est évanouie dans les brumes du temps, mais les arcanes de la domination des dragons demeurent lisibles, préservés par la puissance de sa reliure enchantée. Cette relique d'un autre âge recèle des savoirs aussi périlleux et puissants que les créatures fabuleuses qu'elle dépeint"
  book_of_life_name:0 "Codex de la Vie"
  book_life_desc:0 "Ce vénérable manuscrit, voué à l'étude des mystères de la vie, de la vigueur corporelle, de la fertilité et des arts curatifs, fut façonné dans l'ancienne Valyria, bien avant que les flammes ne la dévorent. La couverture de cuir, quoique craquelée par les siècles, protège en son sein le savoir le plus sublime jamais conçu par les mortels. Des enluminures minutieuses, des formules ésotériques et des théories prodigieuses sur la guérison des maux, l'enfantement et l'allongement de l'existence mortelle emplissent ses pages diaphanes et ambrées. Malgré sa mise éprouvée par les âges, ce manuscrit demeure un trésor inestimable de sapience—ses révélations surpassent toute connaissance des temps présents. Si l'encre s'estompe sous le joug des saisons, le savoir qu'elle couche sur le vélin est immortel, témoin de l'esprit incomparable des thaumaturges de l'antique Valyria"

  crimson_band:0 "Anneau Incarnadin"
  crimson_band_desc:0 "Un annelet forgé d'acier valyrien qui insuffle à son porteur la maîtrise des arcanes sanglants"
  umbral_band:0 "Anneau des Ténèbres"
  umbral_band_desc:0 "Un annelet forgé d'acier valyrien qui confère à son porteur les secrets des ombres ancestrales"
  lucid_band:0 "Anneau de Clairvoyance"
  lucid_band_desc:0 "Un annelet forgé d'acier valyrien qui éveille en son porteur la perception des songes prophétiques"
  aetherforge_band:0 "Anneau de l'Éther Forgé"
  aetherforge_band_desc:0 "Un annelet forgé d'acier valyrien qui révèle à son porteur les mystères alchimiques oubliés"
  inferno_band:0 "Anneau du Brasier Éternel"
  inferno_band_desc:0 "Un annelet forgé d'acier valyrien qui embrase l'âme de son porteur des flammes de la magie ignée"
  zephyrs_band:0 "Anneau des Vents Célestes"
  zephyrs_band_desc:0 "Un annelet forgé d'acier valyrien qui insuffle à son porteur la maîtrise des courants aériens invisibles"
  aqua_band:0 "Anneau des Flots Primordiaux"
  aqua_band_desc:0 "Un annelet forgé d'acier valyrien qui imprègne son porteur des secrets des eaux mystiques et ancestrales"


colonize_county_or_duchy_decision_desc: "Le temps est venu de poser nos racines. N'étant plus de simples errants, nous taillerons un foyer pour nous-mêmes, nous emparant des terres indomptées qui s'étendent devant nous.\n\nNos bandes armées prêtes et nos colons impatients, nous revendiquerons ces terres par le fer, l'or ou la pure détermination. Une fois l'affaire conclue, nous ne serons plus de simples aventuriers. Nous serons des seigneurs."

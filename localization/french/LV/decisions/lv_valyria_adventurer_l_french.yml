l_french:
colonize_county_or_duchy_decision: "Forgez un nouveau foyer"
colonize_county_or_duchy_decision_desc: "Il est temps de prendre racine. Nous ne serons plus de simples nomades, nous nous taillerons un foyer, saisissant les terres indomptées qui s'étendent devant nous.\n\nAvec nos bandes de guerriers prêtes et nos colons enthousiastes, nous revendiquons ces terres, que ce soit par l'acier, l'or ou la seule détermination. Une fois l'acte accompli, nous ne serons plus de simples aventuriers. Nous serons des seigneurs."
colonize_county_or_duchy_decision_tooltip: "Implantez-vous dans la région locale en devenant un [ruler|E] possédant des terres"
colonize_county_or_duchy_decision_confirm: "Le moment est venu de s'installer"

need_settler_camp_3_or_higher: "Nécessite un avant-poste de pionnier ou un équivalent de niveau supérieur"
need_settler_camp_6: "Nécessite un terrain de mobilisation coloniale étendu"


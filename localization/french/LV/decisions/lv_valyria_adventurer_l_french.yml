l_french:
 colonize_county_or_duchy_decision: "Forger un Nouveau Foyer"
 colonize_county_or_duchy_decision_desc: "Le temps est venu de nous enraciner. Nous ne serons plus de simples errants ; nous tracerons notre propre foyer, en nous emparant de ces terres sauvages qui s'étendent devant nous.\n\nNos bandes de guerre sont prêtes, nos colons impatients : nous ferons valoir nos droits sur ces terres, que ce soit par l'acier, par l'or, ou par la seule force de notre détermination. Une fois l'acte accompli, nous ne serons plus de simples aventuriers. Nous serons des Lords."
 colonize_county_or_duchy_decision_tooltip: "Colonisez la région locale et devenez un [ruler|E] doté de terres"
 colonize_county_or_duchy_decision_confirm: "Le temps est venu de s'installer"

 need_settler_camp_3_or_higher: "Nécessite un Avant-poste de Pionniers ou un équivalent de niveau supérieur"

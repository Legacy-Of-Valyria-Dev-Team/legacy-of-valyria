colonize_county_or_duchy_decision: "Forger un Nouveau Foyer"
colonize_county_or_duchy_decision_desc: "Le moment est venu de prendre racine. N'étant plus de simples vagabonds, nous allons nous tailler un foyer, nous emparant des terres indomptées qui s'offrent à nous.\n\nAvec nos bandes de guerre préparées et nos colons impatients, nous établirons notre revendication sur ces terres, que ce soit par l'acier, l'or ou la pure détermination. Une fois l'œuvre accomplie, nous ne serons plus de simples aventuriers. Nous serons seigneurs."
colonize_county_or_duchy_decision_tooltip: "Coloniser la région locale, devenant un [ruler|E] possessionné"
colonize_county_or_duchy_decision_confirm: "Le moment est venu de s'établir"


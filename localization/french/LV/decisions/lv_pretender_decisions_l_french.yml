l_french:
  LV_form_pretender_empire_decision:0 "Revendiquer le Titre des Possessions"
  LV_form_pretender_empire_decision_tooltip:0 "Déclarez-vous successeur des Possessions"
  LV_form_pretender_empire_decision_desc:0 "Depuis le Fléau de Valyria, Essos est privé de main directrice. Au nord, les sauvages Dothrakis ravagent tout ce qui se trouve sous leurs montures, tandis qu’à l’est, les rejetons de la harpie s’enhardissent dans l'affirmation de leur héritage ghiscari. Les colonies-filles des Possessions ont été livrées à elles-mêmes sous la forme des Cités Libres, chacune prétendant, d'une manière ou d'une autre, être l'héritière véritable de Valyria. Nombreux sont ceux qui ont rêvé de raviver l’héritage des Possessions, mais bien peu ont osé tenter l’aventure."

  LV_form_pretender_empire_legendary_dragonrider_requirement:0 "Être [trait|E] [GetTrait('dragonrider').GetName( GetNullCharacter )] et détenir au moins #V 1#! titre de royaume"
  LV_form_pretender_empire_legendary_generic_requirement:0 "Être issu du sang de l’ancienne Valyria et détenir au moins #V 1#! titre d’empire"
  LV_form_pretender_empire_generic_title_requirement:0 "Contrôler au moins #V 3#! titres de royaume ou #V 2#! titres d’empire"
  LV_form_pretender_empire_free_city_requirement:0 "Contrôler au moins #V 3#! des Cités Libres"
  LV_form_pretender_empire_capital_requirement:0 "Détenir au moins #V 1#! capitale de Cité Libre ou [GetTitleByKey('c_dragonstone').GetBaseNameNoTier]"
  LV_form_pretender_empire_decision_effect:0 "Vous évaluez les coûts pour revendiquer l’héritage des Possessions et vous imposer comme son nouvel État successeur"
  LV_form_pretender_empire_decision_confirm:0 "Nous sommes les véritables héritiers de Valyria!"
l_french:
  LV_form_pretender_empire_decision:0 "Revendiquer le Manteau des [valyrian_freehold_short|E]"
  LV_form_pretender_empire_decision_tooltip:0 "Vous déclarer successeur des [valyrian_freehold_short|E]"
  LV_form_pretender_empire_decision_desc:0 "Depuis le Fléau de Valyria, Essos est dépourvu d'une main directrice. Au nord, les sauvageons dothrakis ravagent tout ce qui se trouve sous les sabots de leurs montures, et à l'est, les rejetons de la harpie s'enhardissent à embrasser leur héritage ghiscari. Les cités-filles des [valyrian_freehold_short|E] ont été livrées à elles-mêmes en tant que Cités Libres, chacune s'affirmant d'une manière ou d'une autre comme les véritables héritières de Valyria. Nombreux sont ceux qui ont rêvé de raviver l'héritage des [valyrian_freehold_short|E], et bien moins nombreux ceux qui ont osé tenter l'aventure"

  LV_form_pretender_empire_legendary_dragonrider_requirement:0 "Être un [GetTrait('dragonrider').GetName( GetNullCharacter )] et détenir au moins #V 1#! titre de royaume"
  LV_form_pretender_empire_legendary_generic_requirement:0 "Être du sang de l'ancienne Valyria et détenir au moins #V 1#! titre d'empire"
  LV_form_pretender_empire_generic_title_requirement:0 "Doit contrôler au moins #V 3#! titres de royaume ou #V 2#! titres d'empire"
  LV_form_pretender_empire_free_city_requirement:0 "Doit contrôler au moins #V 3#! des Cités Libres"
  LV_form_pretender_empire_capital_requirement:0 "Doit détenir au moins #V 1#! des capitales des Cités Libres ou [GetTitleByKey('c_dragonstone').GetBaseNameNoTier]"
  LV_form_pretender_empire_decision_effect:0 "Vous pesez le coût de revendiquer l'héritage des [valyrian_freehold_short|E] et de vous affirmer comme leur État successeur"
  LV_form_pretender_empire_decision_confirm:0 "Nous sommes les véritables héritiers de Valyria !"
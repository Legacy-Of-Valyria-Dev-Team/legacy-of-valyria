l_french:
  LV_form_pretender_empire_decision:0 "Revendiquer le manteau des Possessions"
  LV_form_pretender_empire_decision_tooltip:0 "Vous proclamez être le successeur des Possessions"
  LV_form_pretender_empire_decision_desc:0 "Depuis la Doom de Valyria, Essos est privé de toute main directrice. Au nord, les sauvages Dothraki ravagent tout sur leur passage, et à l’est, les héritiers de la Harpie s’endurcissent dans leur tradition ghiscarienne. Les cités‑filles des Possessions se débrouillent seules tandis que les cités‑libres, chacune à leur manière, prétendent être les véritables héritières de Valyria. Nombreux sont ceux qui ont rêvé de ressusciter la grandeur des Possessions, et rares ceux qui ont osé passer à l’acte."

  LV_form_pretender_empire_legendary_dragonrider_requirement:0 "Être [GetTrait('dragonrider').GetName( GetNullCharacter )] et posséder au moins #V 1#! titre de royaume"
  LV_form_pretender_empire_legendary_generic_requirement:0 "Avoir le sang ancien de Valyria et posséder au moins #V 1#! titre d’Empire"
  LV_form_pretender_empire_generic_title_requirement:0 "Contrôler au moins #V 3#! titres de royaume ou #V 2#! titres d’Empire"
  LV_form_pretender_empire_free_city_requirement:0 "Contrôler au moins #V 3#! des cités‑libres"
  LV_form_pretender_empire_capital_requirement:0 "Détenir au moins #V 1#! des capitales des cités‑libres ou [GetTitleByKey('c_dragonstone').GetBaseNameNoTier]"
  LV_form_pretender_empire_decision_effect:0 "Vous pesez les coûts de la revendication de l’héritage des Possessions et de votre proclamation en tant qu’État successeur"
  LV_form_pretender_empire_decision_confirm:0 "Nous sommes les véritables héritiers de Valyria !"
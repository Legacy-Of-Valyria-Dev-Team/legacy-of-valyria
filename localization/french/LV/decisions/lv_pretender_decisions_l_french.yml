l_french:
  LV_form_pretender_empire_decision:0 "Revendiquer le Manteau des [valyrian_freehold_short|E]"
  LV_form_pretender_empire_decision_tooltip:0 "Vous déclarer le successeur des [valyrian_freehold_short|E]"
  LV_form_pretender_empire_decision_desc:0 "Depuis le [doom_of_valyria|E], [essos|E] demeure sans main directrice. Au nord, les sauvages Dothrakis sèment la désolation sous les sabots de leurs destriers, et à l'est les rejetons de la harpie s'enhardissent davantage à embrasser leur héritage ghiscari. Les colonies-filles de la [valyrian_freehold_short|E] ont été livrées à elles-mêmes en tant que [free_cities|E], chacune affirmant sous une forme ou une autre être les véritables héritières de [valyria|E]. Nombreux sont ceux qui ont rêvé de raviver l'héritage de la [valyrian_freehold_short|E], et plus rares encore sont ceux qui ont osé tenter l'entreprise."

  LV_form_pretender_empire_legendary_dragonrider_requirement:0 "Être un [GetTrait('dragonrider').GetName( GetNullCharacter )] et détenir au moins #V 1#! titre de royaume"
  LV_form_pretender_empire_legendary_generic_requirement:0 "Être du sang de l'ancienne [valyria|E] et détenir au moins #V 1#! titre d'empire"
  LV_form_pretender_empire_generic_title_requirement:0 "Doit contrôler au moins #V 3#! titres de royaume ou #V 2#! titres d'empire"
  LV_form_pretender_empire_free_city_requirement:0 "Doit contrôler au moins #V 3#! des [free_cities|E]"
  LV_form_pretender_empire_capital_requirement:0 "Doit détenir au moins #V 1#! des capitales des Cités Libres ou [GetTitleByKey('c_dragonstone').GetBaseNameNoTier]"
  LV_form_pretender_empire_decision_effect:0 "Vous pesez le coût de revendiquer l'héritage de la [valyrian_freehold_short|E] et de vous affirmer comme son État successeur"
  LV_form_pretender_empire_decision_confirm:0 "Nous sommes les véritables héritiers de [valyria|E] !"
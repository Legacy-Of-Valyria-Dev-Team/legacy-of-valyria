l_french:
  restore_gogossos:0 "Proclamer La Dixième Cité"
  restore_gogossos_tooltip:0 "Restaurer Gogossos"
  restore_gogossos_desc:0 "Des centaines d'années se sont écoulées depuis le Fléau, et Gogossos retourne enfin au bercail sous ma gouvernance, digne à nouveau d'être considérée comme prétendante à l'héritage des [valyrian_freehold_short|E]"
  restore_gogossos_choice:0 "Une liste de choix vous sera présentée sur la manière dont vous souhaitez restaurer Gogossos"
  restore_gogossos_confirm:0 "La Dixième Cité se relèvera à nouveau !"

  gogossos_restoration.0001.t:0 "La Renaissance de la Dixième Cité"
  gogossos_restoration.0001.desc:0 "Après maintes années et quantité d'or dépensés à reconstruire et restaurer non seulement la cité, mais toutes les îles environnant Gogossos, j'ai apporté richesse et prospérité à cette région. Les seigneurs pirates ayant été chassés et ma domination sur l'ancienne colonie des [valyrian_freehold_short|E] étant désormais incontestée, je proclame Gogossos comme étant à nouveau digne de la gloire qu'elle avait jadis atteinte. Le joyau de Sothoryos brille désormais plus magnifiquement que toutes ses rivales"
  gogossos_restoration.0001.a:0 "Gogossos redeviendra la Dixième Cité Libre !"
  gogossos_restoration.0001.b:0 "Ce n'est que par l'influence et le pouvoir que Gogossos prospèrera !"
  gogossos_restoration.0001.c:0 "Seule la ferme gouvernance d'un monarque permettra d'éviter de répéter les erreurs des esclavagistes"
  gogossos_restoration.0001.d:0 "Cette cité prospèrera sous ma gouvernance"
  gogossos_restoration.0001.d.tooltip:0 "Vous conserverez votre forme actuelle de gouvernement"

  gogossos_restoration.0002.t:0 "La Renaissance de la Dixième Cité Libre"
  gogossos_restoration.0002.desc:0 "Jadis ruinée et ravagée par la Mort Rouge, Gogossos se dresse à nouveau fièrement. Le commerce afflue à nouveau dans la cité, et la restauration de l'ancienne colonie valyrienne sera contée durant des années"
  gogossos_restoration.0002.a:0 "Seul le temps nous dira ce qu'il en adviendra..."

  expedition_quest:0 "Financer une Expédition"
  expedition_quest_tooltip:0 "Financer une expédition pour explorer les anciennes ruines le long des Îles du Basilic"
  expedition_quest_desc:0 "L'appel de l'aventure s'éveille en moi, attraction irrésistible vers les ruines oubliées évoquées dans les récits des vieux marins—les vestiges perdus de Sothoryos et Gogossos. Lieux de légende, enveloppés de mystère et d'effroi, où d'antiques civilisations prospérèrent avant de sombrer dans la ruine.\n\nJe peux presque entendre les murmures de secrets indicibles dissimulés sous leurs pierres croulantes, la promesse de reliques perdues attendant d'être mises au jour. Cette simple pensée fait s'emballer mon cœur.\n\nJe dois agir promptement. J'aurai besoin de cartes, de provisions et d'un équipage disposé à braver l'inconnu. Il n'y a point de temps à perdre—une expédition doit être planifiée sur-le-champ"
  expedition_quest_effect:0 "Vous financez une expédition vers Gogossos"
  expedition_quest_confirm:0 "Trésors et périls à l'horizon—quelle tentation..."

  gobshite.1:0 "Pourquoi regardes-tu ici alors que j'ai dit que ça ne fonctionne pas... Pendard"

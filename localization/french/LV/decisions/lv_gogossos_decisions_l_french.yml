l_french:
  restore_gogossos:0 "Proclamer la Dixième Cité"
  restore_gogossos_tooltip:0 "Restaurer Gogossos"
  restore_gogossos_desc:0 "Des centaines d'années se sont écoulées depuis le Fléau, et Gogossos revient enfin au bercail sous ma direction, digne à nouveau d'être appelée prétendante à l'héritage de la [valyrian_freehold_short|E]."
  restore_gogossos_choice:0 "Une liste de choix vous sera présentée sur la manière dont vous souhaitez restaurer Gogossos"
  restore_gogossos_confirm:0 "La Dixième Cité s'élèvera à nouveau !"

  gogossos_restoration.0001.t:0 "La Dixième Cité Renaît"
  gogossos_restoration.0001.desc:0 "Après de nombreuses années et l'or dépensé à reconstruire et restaurer non seulement la cité, mais toutes les îles entourant Gogossos, j'ai apporté richesse et prospérité à cette région. Avec les seigneurs pirates chassés et ma domination sur l'ancienne colonie de la [valyrian_freehold_short|E] incontestée, je proclame que Gogossos est à nouveau digne de la gloire qu'elle atteignit jadis. Le joyau de la couronne de Sothoryos se dresse plus beau que tous ses États rivaux, témoignage éclatant de la renaissance de la grandeur valyrienne."
  gogossos_restoration.0001.a:0 "Gogossos redeviendra la Dixième Cité Libre !"
  gogossos_restoration.0001.b:0 "Seuls l'influence et le pouvoir feront prospérer Gogossos !"
  gogossos_restoration.0001.c:0 "Il faut la règle forte d'un monarque pour ne pas répéter les erreurs des esclavagistes."
  gogossos_restoration.0001.d:0 "Cette cité prospérera sous ma gouvernance."
  gogossos_restoration.0001.d.tooltip:0 "Vous conserverez votre forme actuelle de gouvernement."

  gogossos_restoration.0002.t:0 "La Dixième Cité Libre Renaît"
  gogossos_restoration.0002.desc:0 "Jadis ruinée et ravagée par la Mort Rouge, Gogossos se dresse à nouveau fièrement. Le commerce afflue une fois de plus dans la cité, et la restauration de l'ancienne colonie valyrienne sera contée pendant des années à venir, légende vivante de la résurrection d'un empire."
  gogossos_restoration.0002.a:0 "Seul le temps dira ce que cela deviendra..."

  expedition_quest:0 "Financer une Expédition"
  expedition_quest_tooltip:0 "Financer une expédition pour explorer les anciennes ruines le long des Îles du Basilic"
  expedition_quest_desc:0 "L'appel de l'aventure s'agite en moi, une attraction irrésistible vers les ruines oubliées dont parlent les vieux contes de marins — les vestiges perdus de Sothoryos et Gogossos. Des lieux de légende, enveloppés de mystère et d'effroi, où d'anciennes civilisations prospérèrent jadis avant de sombrer dans la ruine.\n\nJe peux presque entendre les murmures de secrets indicibles cachés sous leurs pierres croulantes, la promesse de reliques perdues attendant d'être déterrées. Cette seule pensée fait battre mon cœur plus fort.\n\nJe dois agir rapidement. Il me faudra des cartes, des provisions et un équipage prêt à braver l'inconnu. Il n'y a pas de temps à perdre — une expédition doit être planifiée sur-le-champ."
  expedition_quest_effect:0 "Vous financez une expédition vers Gogossos"
  expedition_quest_confirm:0 "Trésors et dangers nous attendent — comme c'est séduisant..."

  gobshite.1:0 "Pourquoi regardez-vous même, j'ai dit que ça ne marche pas... Crétin"

l_french:
 restore_gogossos:0 "Proclamer la Dixième Cité"
 restore_gogossos_tooltip:0 "Restaurer Gogossos"
 restore_gogossos_desc:0 "Des centaines d'années s'étaient écoulées depuis le Fléau, et Gogossos rejoint enfin le giron sous ma conduite, digne à nouveau d'être considérée comme prétendante à l'héritage des [valyrian_freehold_short|E]."
 restore_gogossos_choice:0 "Une liste de choix vous sera présentée quant à la manière dont vous souhaitez restaurer Gogossos"
 restore_gogossos_confirm:0 "La Dixième Cité renaîtra !"

 gogossos_restoration.0001.t:0 "La Dixième Cité Renaît"
 gogossos_restoration.0001.desc:0 "Après de longues années et une fortune dépensée à rebâtir et restaurer non seulement la cité, mais aussi toutes les îles environnant Gogossos, j'ai apporté richesse et prospérité à cette région. Les seigneurs pirates chassés, et ma domination sur l'ancienne colonie des [valyrian_freehold_short|E] désormais incontestée, je proclame Gogossos digne une fois encore de la gloire qu'elle connut jadis. Le joyau de la couronne de Sothoryos se dresse plus resplendissant que tous ses États rivaux."
 gogossos_restoration.0001.a:0 "Gogossos redeviendra la Dixième Cité Libre !"
 gogossos_restoration.0001.b:0 "Seuls l'influence et le pouvoir permettront à Gogossos de prospérer !"
 gogossos_restoration.0001.c:0 "Il faut la poigne ferme d'un monarque pour ne pas répéter les erreurs des négriers."
 gogossos_restoration.0001.d:0 "Cette cité prospérera sous mon autorité."
 gogossos_restoration.0001.d.tooltip:0 "Vous conserverez votre forme de gouvernement actuelle."

 gogossos_restoration.0002.t:0 "La Dixième Cité Libre Renaît"
 gogossos_restoration.0002.desc:0 "Jadis en ruines et ravagée par la Mort Rouge, Gogossos se dresse à nouveau fièrement. Le commerce afflue de nouveau dans la cité, et la restauration de cette ancienne colonie valyrienne sera contée pour les années à venir."
 gogossos_restoration.0002.a:0 "Seul le temps dira ce qu'il adviendra de tout cela..."

 expedition_quest:0 "Financer une Expédition"
 expedition_quest_tooltip:0 "Financer une expédition pour explorer les anciennes ruines le long des Îles du Basilic"
 expedition_quest_desc:0 "L'appel de l'aventure s'éveille en moi, une attirance irrésistible vers ces ruines oubliées dont parlent les vieux récits de marins — les vestiges perdus de Sothoryos et de Gogossos. Des lieux de légende, enveloppés de mystère et d'effroi, où d'antiques civilisations prospérèrent jadis avant de sombrer dans la ruine.\n\nJe crois presque entendre les murmures de secrets insoupçonnés dissimulés sous leurs pierres croulantes, la promesse de reliques perdues attendant d'être exhumées. Cette seule pensée fait s'emballer mon cœur.\n\nJe dois agir promptement. Il me faudra des cartes, des provisions, et un équipage prêt à braver l'inconnu. Il n'y a pas de temps à perdre — une expédition doit être planifiée sans délai."
 expedition_quest_effect:0 "Vous financez une expédition vers Gogossos"
 expedition_quest_confirm:0 "Trésors et dangers en perspective — quelle séduction..."

 gobshite.1:0 "Pourquoi cherches-tu encore, j'ai dit que ça ne marchait pas... Abruti"

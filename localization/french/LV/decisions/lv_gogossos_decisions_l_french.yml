l_french:
  restore_gogossos:0 "Proclamer La Dixième Cité"
  restore_gogossos_tooltip:0 "Restaurer Gogossos"
  restore_gogossos_desc:0 "Des centaines d'années se sont écoulées depuis le Fléau, et Gogossos revient enfin dans le giron sous mon commandement, digne à nouveau d'être appelée prétendante à l'héritage des [valyrian_freehold_short|E]."
  restore_gogossos_choice:0 "Une liste de choix vous sera présentée sur la manière dont vous souhaitez restaurer Gogossos"
  restore_gogossos_confirm:0 "La Dixième Cité s'élèvera à nouveau !"

  gogossos_restoration.0001.t:0 "La Dixième Cité Renaît"
  gogossos_restoration.0001.desc:0 "Après de nombreuses années et de l'or dépensé à reconstruire et restaurer non seulement la cité, mais toutes les îles entourant Gogossos, j'ai apporté richesse et prospérité à cette région. Avec les seigneurs pirates chassés et ma domination sur l'ancienne colonie des [valyrian_freehold_short|E] incontestée, je proclame Gogossos comme étant à nouveau digne de la gloire qu'elle a atteinte. Le joyau de la couronne de Sothoryos se dresse plus magnifique que tous ses États rivaux."
  gogossos_restoration.0001.a:0 "Gogossos deviendra à nouveau la Dixième Cité Libre !"
  gogossos_restoration.0001.b:0 "Seules l'influence et le pouvoir permettront à Gogossos de prospérer !"
  gogossos_restoration.0001.c:0 "Il faut la poigne ferme d'un monarque pour ne pas répéter les erreurs des esclavagistes."
  gogossos_restoration.0001.d:0 "Cette cité prospérera sous mon règne."
  gogossos_restoration.0001.d.tooltip:0 "Vous conserverez votre forme actuelle de gouvernement."

  gogossos_restoration.0002.t:0 "La Dixième Cité Libre Renaît"
  gogossos_restoration.0002.desc:0 "Autrefois ruinée et ravagée par la Mort Rouge, Gogossos se dresse à nouveau fièrement. Le commerce afflue à nouveau dans la cité, et la restauration de l'ancienne colonie valyrienne sera contée pour les années à venir."
  gogossos_restoration.0002.a:0 "Seul le temps dira ce qu'il en adviendra..."

  expedition_quest:0 "Financer une Expédition"
  expedition_quest_tooltip:0 "Financer une expédition pour explorer les anciennes ruines le long des Îles du Basilic"
  expedition_quest_desc:0 "L'appel de l'aventure s'agite en moi, une attraction irrésistible vers les ruines oubliées dont parlent les vieux contes de marins — les vestiges perdus de Sothoryos et de Gogossos. Des lieux de légende, enveloppés de mystère et d'effroi, où des civilisations anciennes ont autrefois prospéré avant de tomber en ruine.\n\nJe peux presque entendre les murmures de secrets indicibles cachés sous leurs pierres en décomposition, la promesse de reliques perdues attendant d'être déterrées. Cette seule pensée fait battre mon cœur.\n\nJe dois agir rapidement. J'aurai besoin de cartes, de provisions et d'un équipage prêt à braver l'inconnu. Il n'y a pas de temps à perdre — une expédition doit être planifiée immédiatement."
  expedition_quest_effect:0 "Vous financez une expédition vers Gogossos"
  expedition_quest_confirm:0 "Trésors et dangers en perspective — quelle séduction..."

  gobshite.1:0 "Pourquoi regardez-vous même, j'ai dit que ça ne marche pas... Crétin"

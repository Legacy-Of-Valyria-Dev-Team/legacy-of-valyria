l_french:
  restore_gogossos:0 "Proclamer la Dixième Cité"
  restore_gogossos_tooltip:0 "Restaurer Gogossos"
  restore_gogossos_desc:0 "Des centaines d'années se sont écoulées depuis le Fléau, et Gogossos revient enfin dans le giron sous ma gouverne, digne à nouveau d'être considérée comme prétendante à l'héritage des [valyrian_freehold_short|E]."
  restore_gogossos_choice:0 "Une liste de choix vous sera présentée sur la manière dont vous souhaitez restaurer Gogossos"
  restore_gogossos_confirm:0 "La Dixième Cité s'élèvera à nouveau !"

  gogossos_restoration.0001.t:0 "La Dixième Cité Renaît"
  gogossos_restoration.0001.desc:0 "Après de nombreuses années et une fortune dépensée à reconstruire et restaurer non seulement la cité, mais toutes les îles environnant Gogossos, j'ai apporté richesse et prospérité à cette région. Les seigneurs pirates chassés et ma domination sur l'ancienne colonie des [valyrian_freehold_short|E] incontestée, je proclame Gogossos digne à nouveau de la gloire qu'elle atteignit jadis. Le joyau de la couronne de Sothoryos surpasse en beauté toutes ses cités rivales."
  gogossos_restoration.0001.a:0 "Gogossos redeviendra la Dixième Cité Libre !"
  gogossos_restoration.0001.b:0 "C'est par l'influence et le pouvoir seuls que Gogossos prospérera !"
  gogossos_restoration.0001.c:0 "Il faut la poigne d'un monarque pour ne pas répéter les erreurs des esclavagistes."
  gogossos_restoration.0001.d:0 "Cette cité prospérera sous mon règne."
  gogossos_restoration.0001.d.tooltip:0 "Vous conserverez votre forme de gouvernement actuelle."

  gogossos_restoration.0002.t:0 "La Dixième Cité Libre Renaît"
  gogossos_restoration.0002.desc:0 "Jadis ruinée et ravagée par la Mort Rouge, Gogossos se dresse à nouveau fièrement. Le commerce afflue de nouveau vers la cité, et la restauration de cette ancienne colonie valyrienne sera contée pour les années à venir."
  gogossos_restoration.0002.a:0 "Seul le temps dira ce qu'il adviendra de tout ceci..."

  expedition_quest:0 "Financer une Expédition"
  expedition_quest_tooltip:0 "Financez une expédition pour explorer les anciennes ruines des Îles du Basilic"
  expedition_quest_desc:0 "L'appel de l'aventure s'éveille en moi, une attraction irrésistible vers les ruines oubliées évoquées dans les récits des vieux marins : les vestiges perdus de Sothoryos et de Gogossos. Des lieux de légende, enveloppés de mystère et d'effroi, où d'antiques civilisations prospérèrent jadis avant de sombrer dans la ruine.\n\nJe peux presque entendre les murmures de secrets indicibles dissimulés sous leurs pierres croulantes, la promesse de reliques perdues n'attendant que d'être exhumées. Cette seule pensée fait battre mon cœur plus vite.\n\nJe dois agir promptement. J'aurai besoin de cartes, de provisions et d'un équipage prêt à braver l'inconnu. Il n'y a pas de temps à perdre : une expédition doit être organisée sur-le-champ."
  expedition_quest_effect:0 "Vous financez une expédition vers Gogossos"
  expedition_quest_confirm:0 "Trésors et périls en perspective, quelle tentation..."

  gobshite.1:0 "Pourquoi regardes-tu ici, j'ai dit que ça ne marchait pas... Crétin"
  
l_french:
  # Decision group
  decision_group_type_valyria:0 "Décisions Valyriennes"

  lv_restore_valyrian_freehold_decision:0 "Restaurer les Possessions Valyriennes"
  lv_restore_valyrian_freehold_decision_desc:0 "À son apogée, les Possessions Valyriennes se dressaient sans rivales comme la plus grande et dominante civilisation de leur temps, célèbres par-dessus tout pour leur capacité à commander d'innombrables dragons en leur nom en temps de guerre. Si grande était cette puissance militaire et culturelle que seul le cataclysme du Fléau suffit à mettre fin à leur règne de cinq mille ans sur Essos. Tout ce qui subsista de cette grande civilisation furent les flèches fumantes des grands Seigneurs Dragons et des terres hantées, couvertes de cendres, partiellement dévorées par la Mer Fumante.\n\nSi le cœur de Valyria pouvait être reconquis, ainsi qu'une bonne partie de ses anciens territoires, nul ne pourrait contester ma revendication et mon autorité en tant que véritable et légitime souverain des Possessions Valyriennes."
  lv_restore_valyrian_freehold_decision_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] seront restaurées."
  lv_restore_valyrian_freehold_decision_confirm:0 "Notre heure est venue"
  lv_restore_valyrian_freehold_decision_effect_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] seront restaurées et acquerront le [de_jure|E] de tous les [empires|E] actuellement détenus en Essos."

  lv_restore_valyrian_freehold_valyria_requirement_tooltip:0 "Vous devez [completely_control|E] la péninsule valyrienne."
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip:0 "Vous devez [completely_control|E] au moins trois territoires de rang [empire|E] qui étaient d'anciennes colonies des Possessions Valyriennes."

  decision_study_dragonlore.t:0 "Étudier la Dracologie"
  decision_study_dragonlore_desc:0 "Lisez l'antique grimoire de dracologie récupéré de l'[old_valyria|E]"
  decision_study_dragonlore_tooltip:0 "Vous étudierez la dracologie"
  decision_study_dragonlore_confirm:0 "Il est temps d'étudier les dragons"
  has_dragonlore_book:0 "Possède un livre de dracologie"
  has_not_read_dragonlore_book:0 "N'a pas lu le livre de dracologie"

  unite_valyria_empire_decision:0 "Unir le Royaume"
  unite_valyria_empire_decision_desc:0 "Restaurez le cœur des autrefois puissantes [valyrian_freehold|E]."
  unite_valyria_empire_decision_effect_tooltip:0 "Unissez les terres fragmentées de [valyria|E], ainsi que toute autre terre que vous avez conquise."
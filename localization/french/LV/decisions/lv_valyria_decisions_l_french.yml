l_french:
  # Decision group
  decision_group_type_valyria:0 "Décisions valyriennes"

  lv_restore_valyrian_freehold_decision:0 "Restaurer les Possessions valyriennes"
  lv_restore_valyrian_freehold_decision_desc:0 "À leur apogée, les Possessions valyriennes régnaient sans rival comme la plus grande et la plus dominante des civilisations de leur temps, célèbres pour leur capacité à commander d'innombrables dragons en temps de guerre. Si formidable était cette puissance militaire et culturelle que seul le cataclysme du Fléau put mettre fin à cinq millénaires de domination sur Essos. De cette grande civilisation ne subsistèrent que les flèches fumantes des puissants seigneurs dragons et des terres hantées, recouvertes de cendres, partiellement englouties par la Mer Fumante.\n\nSi le cœur ancestral de Valyria pouvait être reconquis, ainsi qu'une part substantielle de ses anciens territoires, nul ne saurait contester ma légitimité et mon autorité en tant que véritable et légitime souverain des Possessions valyriennes."
  lv_restore_valyrian_freehold_decision_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] sera restauré."
  lv_restore_valyrian_freehold_decision_confirm:0 "Notre heure est venue"
  lv_restore_valyrian_freehold_decision_effect_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] sera restauré et acquerra le territoire [de_jure|E] de tous les [empires|E] actuellement détenus en Essos."

  lv_restore_valyrian_freehold_valyria_requirement_tooltip:0 "Vous devez [completely_control|E] la péninsule valyrienne."
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip:0 "Vous devez [completely_control|E] au moins trois territoires de rang [empire|E] qui furent d'anciennes colonies des Possessions valyriennes."

  decision_study_dragonlore.t:0 "Étudier la dracologie"
  decision_study_dragonlore_desc:0 "Lire l'ancien tome de dracologie récupéré de l'[old_valyria|E]"
  decision_study_dragonlore_tooltip:0 "Vous étudierez la dracologie"
  decision_study_dragonlore_confirm:0 "Il est temps d'étudier les dragons"
  has_dragonlore_book:0 "Possède un ouvrage de dracologie"
  has_not_read_dragonlore_book:0 "N'a pas lu l'ouvrage de dracologie"

  unite_valyria_empire_decision:0 "Unifier le royaume"
  unite_valyria_empire_decision_desc:0 "Restaurer le cœur des [valyrian_freehold|E] jadis toutes-puissantes."
  unite_valyria_empire_decision_effect_tooltip:0 "Unifier les terres fracturées de [valyria|E], ainsi que toute autre terre que vous avez conquise."

  lv_find_the_dragonblood_decision:0 "Trouver les dynasties au Sang du Dragon"
  lv_find_the_dragonblood_decision_desc:0 "Ordonnez à vos courtisans de vous dresser la liste de toutes les familles encore vivantes en ce monde qui portent le Sang du Dragon."
  lv_find_the_dragonblood_decision_tooltip:0 "Trouvez-moi ceux qui portent le Sang du Dragon."
  lv_find_the_dragonblood_decision_confirm:0 "Trouvez-moi ceux qui portent le Sang du Dragon."
  lv_find_the_dragonblood_decision_effect:0 "Une liste de toutes les familles potentielles au sang draconique vous sera présentée."
  lv_find_the_dragonblood_decision_effect_tooltip:0 "Une liste de toutes les familles potentielles au sang draconique vous sera présentée."

  choose_lv_find_the_dragonblood_name:0 "Lister les maisons au Sang de l'Ancienne Valyria"
  choose_lv_find_the_dragonriders_name:0 "Lister les maisons de dragonniers"
  choose_lv_find_the_current_dragonriders_name:0 "Lister les dragonniers actuels"

l_french:
 # Decision group
 decision_group_type_valyria:0 "Décisions Valyriennes"

 lv_restore_valyrian_freehold_decision:0 "Restaurer les Possessions Valyriennes"
 lv_restore_valyrian_freehold_decision_desc:0 "À son apogée, les Possessions Valyriennes s'élevaient sans rivales, la plus grande et la plus dominante des civilisations de leur temps, renommées entre toutes pour leur capacité à commander d'innombrables dragons en leur nom lors des temps de guerre. Si grande fut cette puissance militaire et culturelle que seul le cataclysme du Fléau suffit à mettre un terme à cinq mille années de domination sur Essos. De cette grande civilisation ne subsistèrent que les flèches encore fumantes des grands Lords dragons, et des terres hantées, recouvertes de cendres, partiellement englouties par la Mer Fumante.\n\nSi le cœur de Valyria pouvait être reconquis, ainsi qu'une part considérable de ses anciens territoires, nul ne pourrait contester ma revendication ni mon autorité en tant que véritable et légitime souverain des Possessions Valyriennes."
 lv_restore_valyrian_freehold_decision_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] seront restaurées."
 lv_restore_valyrian_freehold_decision_confirm:0 "Notre heure est venue"
 lv_restore_valyrian_freehold_decision_effect_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] seront restaurées et acquerront le [de_jure|E] de tous les [empires|E] actuellement détenus en Essos."

 lv_restore_valyrian_freehold_valyria_requirement_tooltip:0 "Vous devez [completely_control|E] la péninsule valyrienne."
 lv_restore_valyrian_freehold_former_colonies_requirement_tooltip:0 "Vous devez contrôler au moins trois territoires de rang [empire|E] qui furent d'anciennes colonies des Possessions Valyriennes. Plus précisément :\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_daoryrdembos$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_narrow_sea$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_volantis$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_mantarys$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_ghiscar$\n$lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_rhoyne$"
 lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_daoryrdembos:0 "[GetTitleByKey('e_daoryrdembos').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('k_pentos').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('k_andalos').GetName] s'il existe"
 lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_narrow_sea:0 "[GetTitleByKey('e_narrow_sea').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('k_tyrosh').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('k_lys').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('k_myr').GetName]"
 lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_volantis:0 "[GetTitleByKey('e_volantis').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('d_volantis').GetName]\n$EFFECT_LIST_BULLET$ Si certaines des ruines rhoynars de Volantis sont colonisées, vous devez également les contrôler"
 lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_mantarys:0 "[GetTitleByKey('e_old_valyria').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('k_mantarys').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('d_tolos').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('d_elyria').GetName]\n$EFFECT_LIST_BULLET$ Si certaines des ruines de [GetTitleByKey('k_draconys').GetNameNoTier] ou de [GetTitleByKey('d_velos').GetNameNoTier] sont colonisées, vous devez également les contrôler"
 lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_ghiscar:0 "[GetTitleByKey('e_ghiscar').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('k_meereen').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('k_yunkai').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('k_astapor').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('d_new_ghis').GetName]\n$EFFECT_LIST_BULLET$ Si les ruines de [GetTitleByKey('c_old_ghis').GetNameNoTier] sont colonisées, vous devez également en assurer le contrôle"
 lv_restore_valyrian_freehold_former_colonies_requirement_tooltip_rhoyne:0 "[GetTitleByKey('e_rhoyne').GetNameNoTier]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('d_ny_sar').GetName]\n$EFFECT_LIST_BULLET$ Vous devez [completely_control|E] [GetTitleByKey('d_chroyane').GetName]\n$EFFECT_LIST_BULLET$ Toutes les régions restantes de la Rhoyne, ni en ruines ni inhabitées, doivent être sous votre contrôle"

 decision_study_dragonlore.t:0 "Étudier la Dracologie"
 decision_study_dragonlore_desc:0 "Lire l'antique tome de Dracologie récupéré des [old_valyria|E]"
 decision_study_dragonlore_tooltip:0 "Vous étudierez la dracologie"
 decision_study_dragonlore_confirm:0 "Il est temps d'étudier les dragons"
 has_dragonlore_book:0 "Possède un livre de dracologie"
 has_not_read_dragonlore_book:0 "N'a pas lu le livre de dracologie"

 unite_valyria_empire_decision:0 "Unifier le Royaume"
 unite_valyria_empire_decision_desc:0 "Restaurer le cœur des jadis-puissantes [valyrian_freehold|E]."
 unite_valyria_empire_decision_effect_tooltip:0 "Unifie les terres fracturées de [valyria|E], ainsi que toute autre terre que vous avez conquise."

 lv_find_the_dragonblood_decision:0 "Trouver les Dynasties au Sang du Dragon"
 lv_find_the_dragonblood_decision_desc:0 "Faites appel à vos courtisans pour qu'ils vous rapportent la liste de toutes les familles vivantes en ce monde possédant le Sang du Dragon."
 lv_find_the_dragonblood_decision_tooltip:0 "Trouvez-moi le Sang du Dragon."
 lv_find_the_dragonblood_decision_confirm:0 "Trouvez-moi le Sang du Dragon."
 lv_find_the_dragonblood_decision_effect:0 "Une liste de toutes les familles potentiellement porteuses du Sang du Dragon vous sera rapportée."
 lv_find_the_dragonblood_decision_effect_tooltip:0 "Une liste de toutes les familles potentiellement porteuses du Sang du Dragon vous sera rapportée."


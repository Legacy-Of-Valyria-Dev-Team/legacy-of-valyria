l_french:
  # Decision group
  decision_group_type_valyria:0 "Décisions Valyriennes"

  lv_restore_valyrian_freehold_decision:0 "Restaurer les Possessions Valyriennes"
  lv_restore_valyrian_freehold_decision_desc:0 "À son apogée glorieux, les Possessions Valyriennes régnaient sans rivales comme la plus grande et la plus dominante civilisation de tous les temps, célèbre pour leur capacité légendaire à commander d'innombrables dragons au combat, faisant trembler le monde entier sous leurs ailes de feu. Si immense était cette puissance militaire et culturelle inégalée que seul le cataclysme apocalyptique du Fléau put mettre fin à cinq millénaires de domination absolue sur Essos. Tout ce qui subsiste de cette civilisation titanesque ne sont que les tours fumantes des anciens seigneurs-dragons et des terres hantées, dévorées par les cendres éternelles et partiellement englouties par la Mer Fumante.\n\nSi le cœur ancestral de Valyria pouvait être reconquis et purifié, ainsi qu'une partie substantielle de ses anciens territoires impériaux, nul ne pourrait contester ma revendication légitime et mon autorité divine en tant que véritable héritier et souverain incontesté des Possessions Valyriennes ressuscitées. L'Empire renaîtra de ses cendres, et les dragons voleront à nouveau sous ma bannière."
  lv_restore_valyrian_freehold_decision_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] sera restauré dans toute sa gloire."
  lv_restore_valyrian_freehold_decision_confirm:0 "Notre heure de gloire est venue"
  lv_restore_valyrian_freehold_decision_effect_tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] sera restauré et acquerra le [de_jure|E] de tous les [empires|E] actuellement détenus en Essos."

  lv_restore_valyrian_freehold_valyria_requirement_tooltip:0 "Vous devez [completely_control|E] l'intégralité de la péninsule valyrienne ancestrale."
  lv_restore_valyrian_freehold_former_colonies_requirement_tooltip:0 "Vous devez [completely_control|E] au moins trois territoires de rang [empire|E] qui furent jadis des colonies glorieuses des Possessions Valyriennes."

  decision_study_dragonlore.t:0 "Étudier la Dracologie"
  decision_study_dragonlore_desc:0 "Lire l'ancien tome de Dracologie sacrée qui fut miraculeusement récupéré des ruines de l'[old_valyria|E]"
  decision_study_dragonlore_tooltip:0 "Vous étudierez les mystères ancestraux de la dracologie"
  decision_study_dragonlore_confirm:0 "Il est temps de percer les secrets des dragons"
  has_dragonlore_book:0 "Possède un livre de dracologie"
  has_not_read_dragonlore_book:0 "N'a pas encore lu le livre de dracologie"

  unite_valyria_empire_decision:0 "Unifier le Royaume"
  unite_valyria_empire_decision_desc:0 "Restaurer le cœur légendaire de l'antique et toute-puissante [valyrian_freehold|E] dans sa gloire d'antan."
  unite_valyria_empire_decision_effect_tooltip:0 "Unifier les terres fracturées et maudites de [valyria|E], ainsi que toutes les autres contrées que vous avez conquises sous votre bannière."
  lv_valyria_recent_rehabilitation_efforts_modifier:0 "Efforts de Réhabilitation Récents"
  lv_valyria_recent_rehabilitation_efforts_modifier_desc:0 "Grâce à des efforts titanesques défiant l'imagination et des sacrifices innombrables, cette région autrefois maudite a bénéficié de campagnes de réhabilitation couronnées de succès. Les terres empoisonnées retrouvent peu à peu leur fertilité d'antan, la stabilité géologique se renforce progressivement, et ce qui était jadis un enfer inhabitable devient un havre de prospérité où la vie peut à nouveau s'épanouir. Les cendres toxiques du Fléau cèdent enfin place à l'espoir d'un renouveau, transformant ces terres désolées en un territoire plus sûr et plus prospère, digne héritier de la gloire valyrienne."
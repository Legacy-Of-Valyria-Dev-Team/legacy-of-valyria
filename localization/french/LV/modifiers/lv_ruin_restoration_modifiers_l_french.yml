l_french:
  lv_restoration_steward_modifier:0 "Efforts de Restauration"
  lv_restoration_steward_modifier_desc:0 "La gestion et la restauration de cet établissement sont supervisées par un intendant compétent, qui améliore son rétablissement et l'efficacité générale dans la conduite des projets de reconstruction. Son expertise administrative et sa connaissance du terrain permettent d'optimiser les ressources disponibles et d'accélérer le retour à la prospérité."
  lv_restoration_steward_modifier_scale_desc:0 "Ce modificateur réduit le temps de construction d'environ #V 2.5%#! tous les #V 3#! points d'[stewardship|E] à partir de #V 11#! #weak (Facteur d'Échelle : #P $MULTIPLIER|0$#!)#!, Plafonne à #V 50%#! #weak (Facteur d'Échelle : #V 10#!)#!"
  lv_restoration_steward_title:0 "Efforts de Restauration Renforcés"
  lv_restoration_steward_desc:0 "Votre intendant a joué un rôle déterminant dans la restauration de [county.GetName], orchestrant avec maîtrise les travaux de reconstruction et redonnant vie à ces terres."
l_french:
  # North Valyria
  agot_tradition_north_valyrian_1_name:0 "Échos des Possessions"
  agot_tradition_north_valyrian_1_desc:0 "Le Fléau a peut‑être consumé Valyria dans les flammes et la désolation. Son écho persiste dans ces cités, fané, déformé et à demi oublié. Ici, les traditions anciennes sont suivies sans compréhension et les légendes d’un passé glorieux hantent les ombres. Cette culture est l’héritage d’un empire perdu, une tapisserie tissée des vestiges d’une puissance qui touchait autrefois le ciel et qui gît désormais dans la poussière, incapable de disparaître complètement ou de renaître"

  agot_tradition_north_valyrian_2_name:0 "Renaissance des Possessions"
  agot_tradition_north_valyrian_2_desc:0 "Les Possessions n’ont jamais été vraiment perdues, seulement endormies, attendant que les cendres du Fléau se refroidissent et que les braises se ravivent. Après des siècles de sommeil, le sang de l’ancienne Valyria s’éveille et le feu qui a forgé son héritage renaît. Cette renaissance n’est pas un simple écho mais une résurgence de pouvoir brut et d’ambition, guidée par la sagesse ancestrale et tempérée par les erreurs d’un passé fracturé. Les traditions jadis suivies aveuglément se renouvellent avec un but clair et les légendes prennent vie comme plans pour restaurer un empire"

  agot_tradition_mantaryan_name:0 "Monstruosités de Mantarys"
  agot_tradition_mantaryan_desc:0 "Originaires de la mystérieuse cité de Mantarys sur la péninsule valyrienne en ruines, les Mantaryens sont connus pour leur isolement et leurs coutumes étranges. On raconte qu’ils présentent des déformations physiques distinctes et pratiquent une magie noire, vestiges probables de l’influence valyrienne. Réclus et craints, leur cité est rarement visitée en raison de sa réputation dangereuse et des créatures sinistres censées y rôder"
  culture_parameter_mantaryan_mutation_trait_bonuses:0 "La lignée de mutations mantaryenne incluant [GetTrait('doomsurvivors').GetName], [GetTrait('scaly').GetName], [GetTrait('scarred').GetName], [GetTrait('burned').GetName], [GetTrait('hunchbacked').GetName], [GetTrait('clubfooted').GetName], [GetTrait('stuttering').GetName], [GetTrait('lisping').GetName], [GetTrait('wheezing').GetName], [GetTrait('spindly').GetName], [GetTrait('beauty_bad_1').GetName], [GetTrait('beauty_bad_2').GetName] et [GetTrait('beauty_bad_3').GetName] bénéficie de bonus supplémentaires"
  culture_parameter_mantaryan_mutation_trait_more_common:0 "La lignée de mutations mantaryenne incluant [GetTrait('doomsurvivors').GetName], [GetTrait('scaly').GetName], [GetTrait('scarred').GetName], [GetTrait('burned').GetName], [GetTrait('hunchbacked').GetName], [GetTrait('clubfooted').GetName], [GetTrait('stuttering').GetName], [GetTrait('lisping').GetName], [GetTrait('wheezing').GetName], [GetTrait('spindly').GetName], [GetTrait('beauty_bad_1').GetName], [GetTrait('beauty_bad_2').GetName] et [GetTrait('beauty_bad_3').GetName] est plus courante"
  culture_parameter_unlock_maa_mantaryan_monsters:0 "Peut recruter [GetMaA('mantaryan_monsters').GetName] en tant que [men_at_arms|E]"

  agot_tradition_tolosi_name:0 "Tentations tortueuses"
  agot_tradition_tolosi_desc:0 "Les Tolosi sont un peuple endurci et redoutable, réputé à travers Essos pour leur traitement brutal des captifs et leur persécution impitoyable dans le commerce d’esclaves. Ils manient des frondes de plomb avec une précision mortelle, privilégiant ce mode de guerre pour mutiler et terroriser à distance. Insensibles à la souffrance d’autrui, ils considèrent la cruauté comme une force et forgent une société où l’impitoyabilité est aussi centrale que leur habileté au tir"
  culture_parameter_unlock_maa_tolosi_slingers:0 "Peut recruter [GetMaA('tolosi_slingers').GetName] en tant que [men_at_arms|E]"

  agot_tradition_elyrian_name:0 "Le Chemin essentiel"
  agot_tradition_elyrian_desc:0 "Ce chemin façonne le peuple elyrien en alliant sagesse spirituelle, bureaucratie sophistiquée et économie marchande florissante, incluant la pratique controversée de l’esclavage. Leur société axée sur le commerce et le pouvoir est également réputée pour son hospitalité et ses archers d’élite dont la précision est un symbole de force"
  culture_parameter_unlock_maa_elyrian_longbowmen:0 "Peut recruter [GetMaA('elyrian_longbowmen').GetName] en tant que [men_at_arms|E]"

  # Dothraki
  culture_parameter_unlock_maa_dothraki_riders:0 "Peut recruter [GetMaA('dothraki_riders').GetName] en tant que [men_at_arms|E]"
  culture_parameter_physique_good_3_trait_more_common:0 "Les traits [GetTrait('physique_good_3').GetName], [GetTrait('physique_good_2').GetName] et [GetTrait('physique_good_1').GetName] sont plus courants"
  culture_parameter_lifestyle_voyager_trait_more_common:0 "Le trait [GetTrait('lifestyle_voyager').GetName] est plus courant"
  culture_parameter_lifestyle_wayfarer_trait_more_common:0 "Le trait [GetTrait('lifestyle_wayfarer').GetName] est plus courant"

  # Gogossos
  agot_tradition_blood_cultists_name:0 "Fanatiques du sang"
  agot_tradition_blood_cultists_desc:0 "Cette culture s’enorgueillit de sa fascination pour la magie du sang et de sa capacité à la contrôler ; bien que leurs pouvoirs se soient fortement affaiblis après la chute de la Valyria, ils restent l’un des derniers peuples au monde à pouvoir pratiquer des arts mystiques similaires, leur conférant une influence immense, au grand dam de tous..."
  culture_parameter_unlock_maa_berserkers:0 "Peut recruter [GetMaA('gogossi_berserkers').GetName] en tant que [men_at_arms|E]"
  culture_parameter_unlock_maa_blood_mutants:0 "Les [GetMaA('blood_mutants').GetName] [men_at_arms|E] sont recrutables."
  culture_parameter_sadistic_trait_more_common:0 "Le [GetTrait('sadistic').GetName( GetNullCharacter )] [trait|E] est plus courant."

  # Asshai
  agot_tradition_sorcerers_name:0 "Sorciers"
  agot_tradition_sorcerers_desc:0 "Les membres de cette culture sont réputés pour leur fascination, leurs études et leur pratique de l’arcane. Des forces obscures et mystiques connues sous le nom de magie les rendent incroyablement puissants"
  culture_parameter_witch_trait_more_common:0 "Le trait [GetTrait('witch').GetName] est plus courant"
  culture_parameter_unlock_maa_esoteric_grenadiers:0 "Peut recruter [GetMaA('esoteric_grenadiers').GetName] en tant que [men_at_arms|E]"

  agot_tradition_mountain_diviners_name:0 "Divinateurs des Montagnes"
  agot_tradition_mountain_diviners_desc:0 "Cette culture a peu à peu perdu ses dons de sorcellerie en migrant vers les montagnes et en se séparant de la société magique principale. Devenus divinateurs montagnards, ils ont perdu la plupart des pouvoirs qui accompagnaient leurs origines. Ils ont néanmoins acquis la capacité de découvrir des secrets par ruses et épreuves et peuvent échanger des informations pour la bonne cause ou contre paiement"
  culture_parameter_unlock_maa_shadow_raiders:0 "Peut recruter [GetMaA('shadow_raiders').GetName] en tant que [men_at_arms|E]"

  # Special/Mythical Cultures
  agot_tradition_the_others_name:0 "Marcheurs blancs"
  agot_tradition_the_others_desc:0 "Cette culture a reçu l’immortalité de son créateur, le Roi de la Nuit, cependant cette vie éternelle corrompt leur esprit… presque zombifié…"
  agot_tradition_the_stallions_name:0 "Les Étalons"
  agot_tradition_the_stallions_desc:0 "Cette culture s’enorgueillit de son lien avec les chevaux, considérant ces animaux comme presque sacrés et dignes de tout sacrifice."
  white_walkers:0 "Marcheurs blancs"
  white_walkers_flavor:0 "Les Marcheurs blancs sont d’anciens humains transformés en guerriers zombifiés par le Roi de la Nuit."
  culture_parameter_unlock_maa_white_walkers:0 "Les [GetMaA('white_walkers').GetName] [men_at_arms|E] sont recrutables."
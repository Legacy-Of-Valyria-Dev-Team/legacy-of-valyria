l_french:
  # Northern Valyria
  agot_tradition_north_valyrian_1_name:0 "Échos des [valyrian_freehold_short|E]"
  agot_tradition_north_valyrian_1_desc:0 "Le Fléau a pu revendiquer Valyria dans le feu et la ruine, mais son écho persiste dans ces cités — s'estompant, déformé et à moitié oublié. Ici, des traditions anciennes sont suivies sans compréhension, et les légendes d'un passé glorieux hantent les ombres. Cette culture est l'héritage d'un empire perdu, une tapisserie tissée à partir des vestiges d'une puissance qui touchait autrefois le ciel mais gît maintenant dans la poussière, incapable de s'effacer complètement ou de revenir."

  agot_tradition_north_valyrian_2_name:0 "Renaissance des [valyrian_freehold_short|E]"
  agot_tradition_north_valyrian_2_desc:0 "Les [valyrian_freehold_short|E] n'ont jamais été véritablement perdues, seulement dormantes, attendant que les cendres refroidissent et que les braises s'enflamment à nouveau. Maintenant, après des siècles de sommeil, le sang de l'ancienne Valyria s'agite, et le feu qui grava autrefois son héritage dans la pierre et l'acier s'élève. Cette renaissance n'est pas un écho obscur mais une résurgence de pouvoir brut et d'ambition, guidée par la sagesse ancienne et tempérée par les erreurs d'un passé fracturé. Les traditions autrefois suivies aveuglément sont maintenant renouvelées avec un but, tandis que les légendes prennent vie — non pas comme des mythes mais comme des plans pour un empire restauré."

  agot_tradition_mantaryan_name:0 "Monstruosités Mantaryennes"
  agot_tradition_mantaryan_desc:0 "Originaires de la mystérieuse cité de Mantarys sur la péninsule valyrienne en ruine, ils sont connus pour leur isolement et leurs étranges coutumes. On dit qu'ils ont des difformités physiques distinctes et pratiquent la magie noire, probablement des vestiges de l'influence de Valyria. Les Mantaryens sont reclus et craints, leur cité étant rarement visitée en raison de sa réputation dangereuse et des créatures sinistres qui, dit-on, rôdent à proximité."
  culture_parameter_mantaryan_mutation_trait_bonuses:0 "La lignée de traits de mutation mantaryenne qui comprend [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('beauty_bad_1').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] ont des bonus supplémentaires"
  culture_parameter_mantaryan_mutation_trait_more_common:0 "La lignée de traits de mutation mantaryenne qui comprend [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('beauty_bad_1').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] sont plus courants"
  culture_parameter_unlock_maa_mantaryan_monsters:0 "Peut recruter [GetMaA('mantaryan_monsters').GetName] comme [men_at_arms|E]"

  agot_tradition_tolosi_name:0 "Tentations Tortueuses"
  agot_tradition_tolosi_desc:0 "Les Tolosiens sont un peuple endurci et redoutable, notoire à travers Essos pour leur traitement brutal des captifs et leur persécution impitoyable des peuples dans le commerce des esclaves. Ils manient des frondes de plomb avec une précision mortelle, préférant cette méthode de guerre pour sa capacité à mutiler et terroriser à distance. Insensibles à la souffrance d'autrui, les Tolosiens voient l'insensibilité comme une force, façonnant une société où l'impitoyabilité fait autant partie de leur identité que leur prouesse légendaire à la fronde."
  culture_parameter_unlock_maa_tolosi_slingers:0 "Peut recruter [GetMaA('tolosi_slingers').GetName] comme [men_at_arms|E]"

  agot_tradition_elyrian_name:0 "La Voie Essentielle"
  agot_tradition_elyrian_desc:0 "Cette voie façonne le peuple élyréen, mêlant sagesse spirituelle avec une bureaucratie sophistiquée et une économie mercantile florissante, qui comprend la pratique controversée du commerce des esclaves. Alors que leur société se concentre sur le commerce et le pouvoir, ils sont également connus pour leur hospitalité et tirent grande fierté de leurs archers d'élite, dont les compétences exceptionnelles en archerie sont une marque de force et de précision."
  culture_parameter_unlock_maa_elyrian_longbowmen:0 "Peut recruter [GetMaA('elyrian_longbowmen').GetName] comme [men_at_arms|E]"

  # Dothraki
  culture_parameter_unlock_maa_dothraki_riders:0 "Les [GetMaA('dothraki_riders').GetName] [men_at_arms|E] sont recrutables."
  culture_parameter_physique_good_3_trait_more_common:0 "Les [trait|E]s [GetTrait('physique_good_3').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )] et [GetTrait('physique_good_1').GetName( GetNullCharacter )] sont plus courants."
  culture_parameter_lifestyle_voyager_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_voyager').GetName( GetNullCharacter )] est plus courant."
  culture_parameter_lifestyle_wayfarer_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_wayfarer').GetName( GetNullCharacter )] est plus courant."
  
  # Gogossos
  agot_tradition_blood_cultists_name:0 "Cultistes du sang"
  agot_tradition_blood_cultists_desc:0 "Cette culture s'enorgueillit de sa fascination pour la magie du sang et de sa capacité à la contrôler. Bien que leurs pouvoirs se soient grandement affaiblis après la chute de Valyria, ils demeurent l'un des derniers peuples sur terre capables de pratiquer quoi que ce soit de similaire aux arts mystiques, leur conférant une influence immense au grand déplaisir de tous..."
  culture_parameter_unlock_maa_berserkers:0 "Peut recruter [GetMaA('gogossi_berserkers').GetName] comme [men_at_arms|E]"
  culture_parameter_unlock_maa_blood_mutants:0 "Les [GetMaA('blood_mutants').GetName] [men_at_arms|E] sont recrutables."
  culture_parameter_sadistic_trait_more_common:0 "Le [trait|E] [GetTrait('sadistic').GetName( GetNullCharacter )] est plus courant."

  # Asshai
  agot_tradition_sorcerers_name:0 "Sorciers"
  agot_tradition_sorcerers_desc:0 "Les membres de cette culture sont connus pour leur fascination, leurs études et leur pratique de l'arcane. Les forces ombreuses et mystiques connues sous le nom de magie les rendent incroyablement puissants."
  culture_parameter_witch_trait_more_common:0 "Le [trait|E] [GetTrait('witch').GetName( GetNullCharacter )] est plus courant."
  culture_parameter_unlock_maa_esoteric_grenadiers:0 "Les [GetMaA('esoteric_grenadiers').GetName] [men_at_arms|E] sont recrutables."

  agot_tradition_mountain_diviners_name:0 "Devins des Montagnes"
  agot_tradition_mountain_diviners_desc:0 "Cette Culture a progressivement perdu ses traits sorciers en raison de leur migration vers les montagnes et de leur séparation conséquente de la société sorcière principale, devenant ainsi des devins des montagnes et perdant la plupart ou tous les pouvoirs et avantages qui en découlent. Ils ont également acquis la capacité de découvrir des secrets par des ruses et des épreuves, et peuvent donner et utiliser des informations pour la bonne cause ou le bon prix."
  culture_parameter_unlock_maa_shadow_raiders:0 "Les [GetMaA('shadow_raiders').GetName] [men_at_arms|E] sont recrutables."

  # Special/Mythical Cultures
  agot_tradition_the_others_name:0 "Marche Blanche"
  agot_tradition_the_others_desc:0 "Cette culture a reçu la capacité de vivre éternellement par leur créateur le Roi de la Nuit, cependant cette immortalité laisse leur esprit corrompu... presque comme des zombies..."
  agot_tradition_the_stallions_name:0 "Les Étalons"
  agot_tradition_the_stallions_desc:0 "Cette culture s'enorgueillit de son lien avec ses chevaux, considérant ces animaux comme presque sacrés et dignes de tout sacrifice."
  white_walkers:0 "Marcheurs Blancs"
  white_walkers_flavor:0 "Les Marcheurs Blancs sont des humains morts qui ont été transformés en guerriers semblables à des zombies par le roi de la nuit."
  culture_parameter_unlock_maa_white_walkers:0 "Les [GetMaA('white_walkers').GetName] [men_at_arms|E] sont recrutables."
l_french:
  # North Valyria
  agot_tradition_north_valyrian_1_name:0 "Échos des Possessions"
  agot_tradition_north_valyrian_1_desc:0 "Le Désastre a peut-être transformé Valyria en feu et en ruines, mais son écho persiste dans ces cités, estompé, déformé et à demi oublié. Ici, d’anciennes traditions sont suivies sans qu’on en comprenne le sens, et les légendes d’un passé glorieux hantent les ombres. Cette culture est l’héritage d’un empire disparu, une tapisserie tissée à partir de vestiges d’un pouvoir qui tutoyait jadis le ciel, mais repose désormais dans la poussière, incapable de disparaître totalement ou de renaître."

  agot_tradition_north_valyrian_2_name:0 "Renaissance des Possessions"
  agot_tradition_north_valyrian_2_desc:0 "Les Possessions n’ont jamais vraiment disparu, seulement sommeillé, attendant que les cendres se refroidissent et que les braises se ravivent. Désormais, après des siècles de torpeur, le sang de l’ancienne Valyria s’éveille, et le feu qui grava jadis son empreinte dans la pierre et l’acier renaît. Cette renaissance n’est pas un écho voilé, mais une résurgence de puissance brute et d’ambition, guidée par la sagesse ancestrale et tempérée par les erreurs d’un passé fracturé. Des traditions autrefois suivies aveuglément reprennent vie avec un véritable dessein, tandis que les légendes cessent d’être des mythes pour devenir les plans d’un empire restauré."

  agot_tradition_mantaryan_name:0 "Monstruosités mantaryennes"
  agot_tradition_mantaryan_desc:0 "Originaires de la mystérieuse cité de Mantarys, sur la péninsule valyrienne en ruines, ils sont réputés pour leur isolement et leurs coutumes étranges. On dit qu’ils présentent des difformités physiques distinctes et pratiquent la magie noire, vestiges de l’influence de Valyria. Les Mantaryens sont reclus et redoutés, leur cité étant rarement visitée en raison de sa réputation dangereuse et des créatures inquiétantes qui y rôdent."
  culture_parameter_mantaryan_mutation_trait_bonuses:0 "La lignée de mutations mantaryennes, comprenant les traits [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('beauty_bad_1').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] bénéficie de bonus supplémentaires"
  culture_parameter_mantaryan_mutation_trait_more_common:0 "La lignée de mutations mantaryennes, comprenant les traits [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('beauty_bad_1').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] sont plus fréquents"
  culture_parameter_unlock_maa_mantaryan_monsters:0 "Peut recruter [GetMaA('mantaryan_monsters').GetName] comme [men_at_arms|E]"

  agot_tradition_tolosi_name:0 "Tentations tortueuses"
  agot_tradition_tolosi_desc:0 "Les Tolosi sont un peuple endurci et redouté, célèbre à travers l’Essos pour leur traitement brutal des captifs et leur persécution sans merci dans le commerce d’esclaves. Ils manient la fronde de plomb avec une précision mortelle, préférant mutiler et terroriser à distance. Insensibles à la souffrance d’autrui, les Tolosi considèrent la cruauté comme une force et font de l’impitoyabilité le cœur de leur identité."
  culture_parameter_unlock_maa_tolosi_slingers:0 "Peut recruter [GetMaA('tolosi_slingers').GetName] comme [men_at_arms|E]"

  agot_tradition_elyrian_name:0 "Le Chemin essentiel"
  agot_tradition_elyrian_desc:0 "Cette voie façonne le peuple élyrien en combinant sagesse spirituelle, bureaucratie raffinée et économie marchande dynamique, incluant la pratique controversée de la traite des esclaves. Si leur société valorise le commerce et le pouvoir, elle est aussi réputée pour son hospitalité et tire une grande fierté de ses archers d’élite, dont la précision hors pair symbolise force et maîtrise."
  culture_parameter_unlock_maa_elyrian_longbowmen:0 "Peut recruter [GetMaA('elyrian_longbowmen').GetName] comme [men_at_arms|E]"

  # Dothraki
  culture_parameter_unlock_maa_dothraki_riders:0 "Les [men_at_arms|E] [GetMaA('dothraki_riders').GetName] sont recrutables."
  culture_parameter_physique_good_3_trait_more_common:0 "Les [traits|E] [GetTrait('physique_good_3').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )] et [GetTrait('physique_good_1').GetName( GetNullCharacter )] sont plus courants."
  culture_parameter_lifestyle_voyager_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_voyager').GetName( GetNullCharacter )] est plus courant."
  culture_parameter_lifestyle_wayfarer_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_wayfarer').GetName( GetNullCharacter )] est plus courant."

  # Gogossos
  agot_tradition_blood_cultists_name:0 "Cultistes du sang"
  agot_tradition_blood_cultists_desc:0 "Cette culture s’enorgueillit de sa fascination pour la magie du sang et de sa maîtrise de cet art. Bien que leurs pouvoirs se soient grandement affaiblis après la chute de Valyria, ils demeurent l’un des derniers peuples capables de prodiges mystiques, ce qui leur confère une influence immense—à la grande consternation de tous..."
  culture_parameter_unlock_maa_berserkers:0 "Peut recruter [GetMaA('gogossi_berserkers').GetName] comme [men_at_arms|E]"
  culture_parameter_unlock_maa_blood_mutants:0 "Les [men_at_arms|E] [GetMaA('blood_mutants').GetName] sont recrutables"
  culture_parameter_sadistic_trait_more_common:0 "Le [trait|E] [GetTrait('sadistic').GetName( GetNullCharacter )] est plus courant"

  # Asshai
  agot_tradition_sorcerers_name:0 "Sorciers"
  agot_tradition_sorcerers_desc:0 "Les membres de cette culture sont réputés pour leur fascination, leurs études et leur pratique de l’arcane. Des forces obscures et mystiques connues sous le nom de magie les rendent incroyablement puissants"
  culture_parameter_witch_trait_more_common:0 "Le trait [GetTrait('witch').GetName] est plus courant"
  culture_parameter_unlock_maa_esoteric_grenadiers:0 "Peut recruter [GetMaA('esoteric_grenadiers').GetName] en tant que [men_at_arms|E]"

  agot_tradition_mountain_diviners_name:0 "Divinateurs des Montagnes"
  agot_tradition_mountain_diviners_desc:0 "Cette culture a peu à peu perdu ses dons de sorcellerie en migrant vers les montagnes et en se séparant de la société magique principale. Devenus divinateurs montagnards, ils ont perdu la plupart des pouvoirs qui accompagnaient leurs origines. Ils ont néanmoins acquis la capacité de découvrir des secrets par ruses et épreuves et peuvent échanger des informations pour la bonne cause ou contre paiement"
  culture_parameter_unlock_maa_shadow_raiders:0 "Les [men_at_arms|E] [GetMaA('shadow_raiders').GetName] sont recrutables."

  # Special/Mythical Cultures
  agot_tradition_the_others_name:0 "Marcheurs Blancs"
  agot_tradition_the_others_desc:0 "Cette culture a reçu de son créateur, le Roi de la Nuit, la capacité de vivre éternellement, cependant, cette immortalité corrompt leur esprit... les rendant presque zombifiés..."
  agot_tradition_the_stallions_name:0 "Les Étalons"
  agot_tradition_the_stallions_desc:0 "Cette culture s’enorgueillit de son lien sacré avec les chevaux, qu’elle considère presque comme des êtres divins, dignes de n’importe quel sacrifice."
  white_walkers:0 "Marcheurs Blancs"
  white_walkers_flavor:0 "Les Marcheurs Blancs sont d’anciens humains transformés en guerriers zombifiés par le Roi de la Nuit."
  culture_parameter_unlock_maa_white_walkers:0 "Les [men_at_arms|E] [GetMaA('white_walkers').GetName] sont recrutables"
l_french:
  # Northern Valyria
  lv_tradition_north_valyrian_1_name:0 "Échos des [valyrian_freehold_short|E]"
  lv_tradition_north_valyrian_1_desc:0 "Le Fléau a peut-être englouti Valyria dans le feu et la ruine, mais son écho persiste dans ces cités : pâlissant, déformé, à moitié oublié. Ici, d'antiques traditions sont suivies sans être comprises, et les légendes d'un passé glorieux hantent les ombres. Cette culture est l'héritage d'un empire perdu, une tapisserie tissée des vestiges d'une puissance qui jadis touchait le ciel mais gît désormais dans la poussière, incapable de s'éteindre complètement ou de renaître."

  lv_tradition_north_valyrian_2_name:0 "Renaissance des [valyrian_freehold_short|E]"
  lv_tradition_north_valyrian_2_desc:0 "Les [valyrian_freehold_short|E] ne furent jamais véritablement perdues, seulement en sommeil, attendant que les cendres refroidissent et que les braises s'embrasent à nouveau. Désormais, après des siècles de torpeur, le sang de l'ancienne Valyria s'éveille, et le feu qui jadis grava son héritage dans la pierre et l'acier se relève. Cette renaissance n'est point un écho assombri mais une résurgence de puissance brute et d'ambition, guidée par la sagesse antique et tempérée par les erreurs d'un passé fracturé. Les traditions autrefois suivies aveuglément sont désormais renouvelées avec dessein, tandis que les légendes prennent vie, non comme mythes mais comme plans d'un empire restauré."

  lv_tradition_mantaryan_name:0 "Monstruosités Mantaryennes"
  lv_tradition_mantaryan_desc:0 "Originaires de la mystérieuse cité de Mantarys sur la péninsule valyrienne dévastée, ils sont connus pour leur isolement et leurs étranges coutumes. On murmure qu'ils présentent des difformités physiques distinctes et pratiquent la magie noire, probablement des vestiges de l'influence valyrienne. Les Mantaryens sont reclus et redoutés, leur cité rarement visitée en raison de sa réputation dangereuse et des créatures sinistres qui rôderaient dans les environs."
  culture_parameter_mantaryan_mutation_trait_bonuses:0 "La lignée de traits de mutation mantaryenne qui comprend [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('beauty_bad_1').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] bénéficient de bonus supplémentaires"
  culture_parameter_mantaryan_mutation_trait_more_common:0 "La lignée de traits de mutation mantaryenne qui comprend [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('beauty_bad_1').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et [GetTrait('beauty_bad_3').GetName( GetNullCharacter )] sont plus fréquents"
  culture_parameter_unlock_maa_mantaryan_monsters:0 "Peut recruter des [GetMaA('mantaryan_monsters').GetName] comme [men_at_arms|E]"

  lv_tradition_tolosi_name:0 "Tentations Tortionnaires"
  lv_tradition_tolosi_desc:0 "Les Tolosiens sont un peuple endurci et redoutable, tristement célèbre à travers Essos pour leur traitement brutal des captifs et leur persécution implacable des peuples dans le commerce des esclaves. Ils manient les frondes de plomb avec une précision mortelle, préférant cette méthode de guerre pour sa capacité à mutiler et terroriser à distance. Insensibles à la souffrance d'autrui, les Tolosiens considèrent la cruauté comme une force, façonnant une société où l'impitoyabilité fait autant partie de leur identité que leur légendaire maîtrise de la fronde."
  culture_parameter_unlock_maa_tolosi_slingers:0 "Peut recruter des [GetMaA('tolosi_slingers').GetName] comme [men_at_arms|E]"

  lv_tradition_elyrian_name:0 "La Voie Essentielle"
  lv_tradition_elyrian_desc:0 "Cette voie façonne le peuple élyrien, mêlant sagesse spirituelle, bureaucratie sophistiquée et économie marchande florissante, laquelle inclut la pratique controversée du commerce des esclaves. Bien que leur société se concentre sur le commerce et le pouvoir, ils sont également réputés pour leur hospitalité et tirent grande fierté de leurs archers d'élite, dont les talents exceptionnels au tir à l'arc sont une marque de force et de précision."
  culture_parameter_unlock_maa_elyrian_longbowmen:0 "Peut recruter des [GetMaA('elyrian_longbowmen').GetName] comme [men_at_arms|E]"

  # Dothraki
  culture_parameter_unlock_maa_dothraki_riders:0 "Les [GetMaA('dothraki_riders').GetName] sont recrutables comme [men_at_arms|E]."
  culture_parameter_physique_good_3_trait_more_common:0 "Les [trait|E]s [GetTrait('physique_good_3').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )] et [GetTrait('physique_good_1').GetName( GetNullCharacter )] sont plus fréquents."
  culture_parameter_lifestyle_voyager_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_voyager').GetName( GetNullCharacter )] est plus fréquent."
  culture_parameter_lifestyle_wayfarer_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_wayfarer').GetName( GetNullCharacter )] est plus fréquent."
  
  # Gogossos
  lv_tradition_blood_cultists_name:0 "Cultistes du Sang"
  lv_tradition_blood_cultists_desc:0 "Cette culture tire fierté de sa fascination pour la magie du sang et de sa capacité à la maîtriser. Bien que leurs pouvoirs se soient considérablement affaiblis après la chute de Valyria, ils demeurent l'un des derniers peuples sur terre capables d'accomplir quoi que ce soit de similaire aux arts mystiques, leur conférant une influence immense, au grand déplaisir de tous..."
  culture_parameter_unlock_maa_berserkers:0 "Peut recruter des [GetMaA('gogossi_berserkers').GetName] comme [men_at_arms|E]"
  culture_parameter_unlock_maa_blood_mutants:0 "Les [GetMaA('blood_mutants').GetName] sont recrutables comme [men_at_arms|E]."
  culture_parameter_sadistic_trait_more_common:0 "Le [trait|E] [GetTrait('sadistic').GetName( GetNullCharacter )] est plus fréquent."

  # Asshai
  lv_tradition_sorcerers_name:0 "Sorciers"
  lv_tradition_sorcerers_desc:0 "Les membres de cette culture sont réputés pour leur fascination, leurs études et leur pratique des arts occultes. Des forces ténébreuses et mystiques connues sous le nom de magie les rendent incroyablement puissants."
  culture_parameter_witch_trait_more_common:0 "Le [trait|E] [GetTrait('witch').GetName( GetNullCharacter )] est plus fréquent."
  culture_parameter_unlock_maa_esoteric_grenadiers:0 "Les [GetMaA('esoteric_grenadiers').GetName] sont recrutables comme [men_at_arms|E]."

  lv_tradition_mountain_diviners_name:0 "Devins des Montagnes"
  lv_tradition_mountain_diviners_desc:0 "Cette culture a progressivement perdu ses traits de sorcellerie en raison de sa migration vers les montagnes et de sa séparation consécutive de la principale société de sorciers, devenant ainsi des devins des montagnes et perdant la plupart des pouvoirs et avantages qui les accompagnaient. Ils ont également acquis la capacité de découvrir des secrets par ruses et épreuves, et peuvent donner ou utiliser des informations pour la juste cause ou le juste prix."
  culture_parameter_unlock_maa_shadow_raiders:0 "Les [GetMaA('shadow_raiders').GetName] sont recrutables comme [men_at_arms|E]."

  # Special/Mythical Cultures
  lv_tradition_the_others_name:0 "La Marche Blanche"
  lv_tradition_the_others_desc:0 "Cette culture a reçu le don de vivre éternellement de son créateur, le Roi de la Nuit. Cependant, cette immortalité laisse leur esprit corrompu... presque semblable à des morts-vivants..."
  lv_tradition_the_stallions_name:0 "Les Étalons"
  lv_tradition_the_stallions_desc:0 "Cette culture tire fierté de son lien avec les chevaux, considérant ces animaux comme presque sacrés et dignes de tout sacrifice."
  white_walkers:0 "Marcheurs Blancs"
  white_walkers_flavor:0 "Les Marcheurs Blancs sont des humains morts transformés en guerriers semblables à des morts-vivants par le Roi de la Nuit."
  culture_parameter_unlock_maa_white_walkers:0 "Les [GetMaA('white_walkers').GetName] sont recrutables comme [men_at_arms|E]."
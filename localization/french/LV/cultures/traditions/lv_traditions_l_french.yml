l_french:
  # Northern Valyria
  agot_tradition_north_valyrian_1_name:0 "Échos des Possessions"
  agot_tradition_north_valyrian_1_desc:0 "Le Fléau a peut-être consumé Valyria dans le feu et la ruine, mais son écho persiste dans ces cités — affaibli, déformé et à moitié oublié. Ici, des traditions anciennes sont suivies sans réelle compréhension, tandis que les légendes d'un glorieux passé hantent les ombres. Cette culture est l'héritage d'un empire perdu, une tapisserie tissée des vestiges d'une puissance qui, autrefois, touchait le ciel, mais qui repose désormais dans la poussière, incapable de s'effacer complètement ou de renaître"

  agot_tradition_north_valyrian_2_name:0 "Renaissance des Possessions"
  agot_tradition_north_valyrian_2_desc:0 "Les Possessions n'ont jamais été véritablement perdues, seulement assoupies, attendant que les cendres refroidissent et que les braises rallument une étincelle. Aujourd'hui, après des siècles de sommeil, le sang de l'ancienne Valyria s'agite, et le feu qui avait autrefois gravé son héritage dans la pierre et l'acier se rallume. Cette renaissance n'est pas un écho assombri, mais une résurgence de puissance brute et d'ambition, guidée par la sagesse ancienne et tempérée par les erreurs d'un passé fracturé. Les traditions autrefois suivies aveuglément sont aujourd'hui renouvelées avec dessein, tandis que les légendes renaissent — non plus comme des mythes, mais comme des plans pour un empire restauré"

  agot_tradition_mantaryan_name:0 "Monstruosités de Mantarys"
  agot_tradition_mantaryan_desc:0 "Originaires de la mystérieuse cité de Mantarys, sur la péninsule valyrienne en ruine, ils sont connus pour leur isolement et leurs coutumes étranges. On leur prête des difformités physiques distinctes et la pratique de sombres arts magiques, vestiges de l'influence de Valyria. Les Mantaryens sont reclus et redoutés, leur cité étant rarement visitée en raison de sa réputation dangereuse et des créatures sinistres que l'on dit rôder alentour"
  culture_parameter_mantaryan_mutation_trait_bonuses:0 "La lignée de mutations mantaryennes, comprenant les [traits|E] [GetTrait('doomsurvivors').GetName( GetNullCharacter )],  [GetTrait('scaly').GetName( GetNullCharacter )],  [GetTrait('scarred').GetName( GetNullCharacter )],  [GetTrait('burned').GetName( GetNullCharacter )],  [GetTrait('hunchbacked').GetName( GetNullCharacter )],  [GetTrait('clubfooted').GetName( GetNullCharacter )],  [GetTrait('stuttering').GetName( GetNullCharacter )],  [GetTrait('lisping').GetName( GetNullCharacter )],  [GetTrait('wheezing').GetName( GetNullCharacter )],  [GetTrait('spindly').GetName( GetNullCharacter )],  [GetTrait('beauty_bad_1').GetName( GetNullCharacter )],  [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et  [GetTrait('beauty_bad_3').GetName( GetNullCharacter )], bénéficie de bonus supplémentaires"
  culture_parameter_mantaryan_mutation_trait_more_common:0 "La lignée de mutations mantaryennes, comprenant les [traits|E] [GetTrait('doomsurvivors').GetName( GetNullCharacter )],  [GetTrait('scaly').GetName( GetNullCharacter )],  [GetTrait('scarred').GetName( GetNullCharacter )],  [GetTrait('burned').GetName( GetNullCharacter )],  [GetTrait('hunchbacked').GetName( GetNullCharacter )],  [GetTrait('clubfooted').GetName( GetNullCharacter )],  [GetTrait('stuttering').GetName( GetNullCharacter )],  [GetTrait('lisping').GetName( GetNullCharacter )],  [GetTrait('wheezing').GetName( GetNullCharacter )],  [GetTrait('spindly').GetName( GetNullCharacter )],  [GetTrait('beauty_bad_1').GetName( GetNullCharacter )],  [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et  [GetTrait('beauty_bad_3').GetName( GetNullCharacter )], est plus fréquente"
  culture_parameter_unlock_maa_mantaryan_monsters:0 "Les [men_at_arms|E] [GetMaA('mantaryan_monsters').GetName] sont recrutables"

  agot_tradition_tolosi_name:0 "Tentations Torturantes"
  agot_tradition_tolosi_desc:0 "Les Tolosi sont un peuple endurci et redoutable, tristement célèbre à travers Essos pour leur traitement brutal des captifs et leur persécution acharnée dans la traite des esclaves. Ils manient des frondes de plomb avec une précision mortelle, préférant cette méthode pour mutiler et terroriser à distance. Insensibles à la souffrance d'autrui, les Tolosi considèrent la cruauté comme une force, façonnant une société où l'impitoyabilité est aussi valorisée que leur maîtrise renommée de la fronde"
  culture_parameter_unlock_maa_tolosi_slingers:0 "Les [men_at_arms|E] [GetMaA('tolosi_slingers').GetName] sont recrutables"

  agot_tradition_elyrian_name:0 "La Voie Essentielle"
  agot_tradition_elyrian_desc:0 "Cette voie façonne le peuple élyrien, alliant sagesse spirituelle, bureaucratie sophistiquée et économie marchande florissante, incluant la pratique controversée de la traite des esclaves. Bien que centrée sur le commerce et le pouvoir, leur société est également reconnue pour son hospitalité et la fierté qu'elle tire de ses archers d'élite, dont la précision exceptionnelle est un symbole de force"
  culture_parameter_unlock_maa_elyrian_longbowmen:0 "Les [men_at_arms|E] [GetMaA('elyrian_longbowmen').GetName] sont recrutables"

  # Dothraki
  culture_parameter_unlock_maa_dothraki_riders:0 "Les [men_at_arms|E] [GetMaA('dothraki_riders').GetName] sont recrutables"
  culture_parameter_physique_good_3_trait_more_common:0 "Les [trait|E] [GetTrait('physique_good_3').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )] et [GetTrait('physique_good_1').GetName( GetNullCharacter )] sont plus fréquents"
  culture_parameter_lifestyle_voyager_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_voyager').GetName( GetNullCharacter )] est plus courant"
  culture_parameter_lifestyle_wayfarer_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_wayfarer').GetName( GetNullCharacter )] est plus courant"
  
  # Gogossos
  agot_tradition_blood_cultists_name:0 "Cultistes du Sang"
  agot_tradition_blood_cultists_desc:0 "Cette culture est fière de sa fascination pour la magie du sang et de sa capacité à la maîtriser. Bien que leurs pouvoirs aient grandement diminué après la chute de Valyria, ils demeurent parmi les derniers capables de pratiquer les arts mystiques, leur conférant une immense influence, au grand dam de tous.."
  culture_parameter_unlock_maa_berserkers:0 "Les [men_at_arms|E] [GetMaA('gogossi_berserkers').GetName] sont recrutables"
  culture_parameter_unlock_maa_blood_mutants:0 "Les [men_at_arms|E] [GetMaA('blood_mutants').GetName] sont recrutables"
  culture_parameter_sadistic_trait_more_common:0 "Le [trait|E] [GetTrait('sadistic').GetName( GetNullCharacter )] est plus courant"

  # Asshai
  agot_tradition_sorcerers_name:0 "Sorcellerie"
  agot_tradition_sorcerers_desc:0 "Les membres de cette culture sont réputés pour leur fascination, leurs études et leur pratique des arcanes. Des forces obscures et mystiques, connues sous le nom de magie, leur confèrent un pouvoir considérable"
  culture_parameter_witch_trait_more_common:0 "Le [trait|E] [GetTrait('witch').GetName( GetNullCharacter )] est plus courant"
  culture_parameter_unlock_maa_esoteric_grenadiers:0 "Les [men_at_arms|E] [GetMaA('esoteric_grenadiers').GetName] sont recrutables"

  agot_tradition_mountain_diviners_name:0 "Prophètes des Montagnes"
  agot_tradition_mountain_diviners_desc:0 "Cette culture a progressivement perdu ses traits sorciers en migrant vers les montagnes et en se séparant de la société principale, devenant ainsi des devins montagnards. Ils ont acquis la capacité de découvrir des secrets par ruses et épreuves, et peuvent les utiliser ou les vendre au service d'une cause"
  culture_parameter_unlock_maa_shadow_raiders:0 "Les [men_at_arms|E] [GetMaA('shadow_raiders').GetName] sont recrutables"

  # Special/Mythical Cultures
  agot_tradition_the_others_name:0 "Marcheurs Blancs"
  agot_tradition_the_others_desc:0 "Cette culture a été dotée par le Roi de la Nuit de la capacité de vivre éternellement, mais cette immortalité corrompt leur esprit... jusqu’à les rendre presque semblables à des morts-vivants"
  agot_tradition_the_stallions_name:0 "Les Étalons"
  agot_tradition_the_stallions_desc:0 "Cette culture est fière du lien sacré qu'elle entretient avec ses chevaux, considérés comme dignes de tout sacrifice"
  white_walkers:0 "Marcheurs Blancs"
  white_walkers_flavor:0 "Les Marcheurs Blancs sont des humains morts transformés en guerriers zombifiés par le Roi de la Nuit"
  culture_parameter_unlock_maa_white_walkers:0 "Les [men_at_arms|E] [GetMaA('white_walkers').GetName] sont recrutables"
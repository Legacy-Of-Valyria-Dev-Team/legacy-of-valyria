l_french:
 # Northern Valyria
 lv_tradition_north_valyrian_1_name:0 "Échos des [valyrian_freehold_short|E]"
 lv_tradition_north_valyrian_1_desc:0 "Le Fléau a peut-être englouti Valyria dans le feu et la ruine, mais son écho persiste au sein de ces cités — décoloré, déformé et à demi oublié. Ici, d'antiques traditions sont suivies sans être comprises, et les légendes d'un passé glorieux hantent les ombres. Cette culture est l'héritage d'un empire perdu, une tapisserie tissée à partir des vestiges d'une puissance qui jadis touchait le ciel, mais qui gît désormais dans la poussière, incapable tant de s'effacer entièrement que de renaître."

 lv_tradition_north_valyrian_2_name:0 "Renaissance des [valyrian_freehold_short|E]"
 lv_tradition_north_valyrian_2_desc:0 "Les [valyrian_freehold_short|E] ne furent jamais véritablement perdues, seulement endormies, attendant que les cendres refroidissent et que les braises se ravivent une fois de plus. Aujourd'hui, après des siècles de sommeil, le sang de l'antique Valyria s'agite, et le feu qui jadis grava son héritage dans la pierre et l'acier renaît. Cette renaissance n'est pas un écho voilé, mais un ressurgissement de puissance brute et d'ambition, guidé par une sagesse ancienne et tempéré par les erreurs d'un passé fracturé. Les traditions jadis suivies aveuglément sont désormais renouvelées avec un dessein précis, tandis que les légendes prennent vie — non plus comme mythes, mais comme plans d'un empire restauré."

 lv_tradition_mantaryan_name:0 "Monstruosités Mantaryennes"
 lv_tradition_mantaryan_desc:0 "Venus de la mystérieuse cité de Mantarys, sur la péninsule valyrienne en ruines, les Mantaryens sont connus pour leur isolement et leurs coutumes étranges. On les dit affligés de difformités physiques marquées et adeptes de magie noire, vraisemblablement des vestiges de l'influence de Valyria. Les Mantaryens sont reclus et redoutés, leur cité étant rarement visitée en raison de sa réputation dangereuse et des créatures inquiétantes que l'on dit rôder à proximité."
 culture_parameter_mantaryan_mutation_trait_bonuses:0 "La lignée de mutations mantaryennes, comprenant [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('beauty_bad_1').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et [GetTrait('beauty_bad_3').GetName( GetNullCharacter )], bénéficie de bonus supplémentaires"
 culture_parameter_mantaryan_mutation_trait_more_common:0 "La lignée de mutations mantaryennes, comprenant [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('beauty_bad_1').GetName( GetNullCharacter )], [GetTrait('beauty_bad_2').GetName( GetNullCharacter )] et [GetTrait('beauty_bad_3').GetName( GetNullCharacter )], est plus fréquente"
 culture_parameter_unlock_maa_mantaryan_monsters:0 "Peut recruter [GetMaA('mantaryan_monsters').GetName] en tant que [men_at_arms|E]"

 lv_tradition_tolosi_name:0 "Tentations Tortionnaires"
 lv_tradition_tolosi_desc:0 "Les Tolosiens forment un peuple endurci et redoutable, tristement célèbres à travers tout Essos pour leur traitement brutal des captifs et leur implacable persécution des peuples voués à la traite d'esclaves. Ils manient la fronde de plomb avec une précision mortelle, privilégiant cette arme pour sa capacité à mutiler et à terroriser à distance. Indifférents à la souffrance d'autrui, les Tolosiens voient dans l'insensibilité une force, façonnant une société où l'impitoyabilité fait tout autant partie de leur identité que leur fameuse maîtrise de la fronde."
 culture_parameter_unlock_maa_tolosi_slingers:0 "Peut recruter [GetMaA('tolosi_slingers').GetName] en tant que [men_at_arms|E]"

 lv_tradition_elyrian_name:0 "La Voie Essentielle"
 lv_tradition_elyrian_desc:0 "Cette voie façonne le peuple élyréen, mêlant sagesse spirituelle, bureaucratie raffinée et économie marchande florissante, laquelle inclut la controversée pratique de la traite d'esclaves. Bien que leur société se concentre sur le commerce et le pouvoir, les Élyréens sont également réputés pour leur hospitalité et tirent grande fierté de leurs archers d'élite, dont les talents exceptionnels au tir à l'arc témoignent de force et de précision."
 culture_parameter_unlock_maa_elyrian_longbowmen:0 "Peut recruter [GetMaA('elyrian_longbowmen').GetName] en tant que [men_at_arms|E]"

 # Dothraki
 culture_parameter_unlock_maa_dothraki_riders:0 "Les [GetMaA('dothraki_riders').GetName] [men_at_arms|E] sont recrutables."
 culture_parameter_physique_good_3_trait_more_common:0 "Les [trait|E]s [GetTrait('physique_good_3').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )] et [GetTrait('physique_good_1').GetName( GetNullCharacter )] sont plus fréquents."
 culture_parameter_lifestyle_voyager_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_voyager').GetName( GetNullCharacter )] est plus fréquent."
 culture_parameter_lifestyle_wayfarer_trait_more_common:0 "Le [trait|E] [GetTrait('lifestyle_wayfarer').GetName( GetNullCharacter )] est plus fréquent."

 # Gogossos
 lv_tradition_blood_cultists_name:0 "Cultistes du Sang"
 lv_tradition_blood_cultists_desc:0 "Cette culture s'enorgueillit de sa fascination pour la magie du sang et de sa capacité à la maîtriser ; bien que leurs pouvoirs se soient considérablement affaiblis depuis la chute de Valyria, ils demeurent l'un des derniers peuples de ce monde capables d'accomplir quoi que ce soit qui s'apparente aux arts mystiques, leur conférant une influence immense, au grand dam de tous..."
 culture_parameter_unlock_maa_berserkers:0 "Peut recruter [GetMaA('gogossi_berserkers').GetName] en tant que [men_at_arms|E]"
 culture_parameter_unlock_maa_blood_mutants:0 "Les [GetMaA('blood_mutants').GetName] [men_at_arms|E] sont recrutables."
 culture_parameter_sadistic_trait_more_common:0 "Le [trait|E] [GetTrait('sadistic').GetName( GetNullCharacter )] est plus fréquent."

 # Asshai
 lv_tradition_sorcerers_name:0 "Sorciers"
 lv_tradition_sorcerers_desc:0 "Les membres de cette culture sont réputés pour leur fascination, leurs études et leur pratique des arts arcanes. Des forces ténébreuses et mystiques, que l'on nomme magie, leur confèrent un pouvoir incroyable."
 culture_parameter_witch_trait_more_common:0 "Le [trait|E] [GetTrait('witch').GetName( GetNullCharacter )] est plus fréquent."
 culture_parameter_unlock_maa_esoteric_grenadiers:0 "Les [GetMaA('esoteric_grenadiers').GetName] [men_at_arms|E] sont recrutables."

 lv_tradition_mountain_diviners_name:0 "Devins des Montagnes"
 lv_tradition_mountain_diviners_desc:0 "Cette culture a peu à peu perdu ses traits sorciers en raison de sa migration vers les montagnes et de la séparation qui s'ensuivit d'avec la société sorcière principale, devenant ainsi des devins des montagnes et perdant la plupart, voire la totalité, des pouvoirs et avantages qui accompagnaient ces traits. Ils ont en revanche développé la capacité de découvrir des secrets par la ruse et l'épreuve, et peuvent livrer ou exploiter des informations pour peu que la cause ou le prix en vaille la peine."
 culture_parameter_unlock_maa_shadow_raiders:0 "Les [GetMaA('shadow_raiders').GetName] [men_at_arms|E] sont recrutables."

  # Participant Groups
  valyria_situation_participant_group_blood_of_valyria:0 "Le Sang de Valyria"
  valyria_situation_participant_group_blood_of_valyria_desc:0 "Tous ceux qui prétendent être d'ascendance valyrienne, qu'ils soient véritables descendants ou non. Cela inclut depuis les Targaryens et Velaryons jusqu'au Sang Ancien de Volantis, ainsi que les autres maisons nobles qui font remonter leur lignée aux glorieux temps des Possessions. Leur sang prétendument pur leur confère une légitimité ancestrale sur ces terres maudites."
  valyria_situation_participant_group_restorationists:0 "Restaurateurs Valyriens"
  valyria_situation_participant_group_restorationists_desc:0 "Tous ceux qui cherchent à restaurer Valyria dans sa gloire passée en reconquérant les terres perdues au Fléau et en rebâtissant leurs grandes cités, bien qu'ils ne soient pas de descendance valyrienne directe. Animés par l'ambition et la soif de grandeur, ils rêvent de ressusciter l'empire défunt sur les cendres du cataclysme."
  valyria_situation_participant_group_remnants:0 "Vestiges des Possessions"
  valyria_situation_participant_group_remnants_desc:0 "Tous ceux qui ont d'une manière ou d'une autre survécu au Fléau et constituent tout ce qui reste des anciennes Possessions. Ces survivants éparpillés portent en eux les derniers échos d'une civilisation disparue, gardiens involontaires de traditions et de secrets perdus dans les flammes."
  valyria_situation_participant_group_opportunists:0 "Charognards du Fléau"
  valyria_situation_participant_group_opportunists_desc:0 "Tous ceux qui cherchent à tirer profit des ruines de Valyria, que ce soit par le commerce, le pillage ou d'autres moyens. Cela inclut marchands, aventuriers et chasseurs de trésors qui voient dans les ruines antiques un potentiel d'enrichissement, indifférents aux malédictions qui pèsent sur ces terres désolées."



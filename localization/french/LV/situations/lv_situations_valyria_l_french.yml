 # Participant Groups
 valyria_situation_participant_group_blood_of_valyria:0 "Le Sang de Valyria"
 valyria_situation_participant_group_blood_of_valyria_desc:0 "Tous ceux qui prétendent descendre de Valyria, qu'ils en soient de véritables descendants ou non. Cela inclut aussi bien les Targaryens et les Velaryons que le Vieux Sang de Volantis et d'autres maisons nobles qui font remonter leur lignée jusqu'à Valyria."
 valyria_situation_participant_group_restorationists:0 "Restaurationnistes Valyriens"
 valyria_situation_participant_group_restorationists_desc:0 "Tous ceux qui cherchent à restaurer Valyria dans son ancienne gloire en reconquérant les terres perdues lors du Fléau et en rebâtissant ses grandes cités, bien qu'ils ne descendent pas directement de Valyria."
 valyria_situation_participant_group_remnants:0 "Vestiges des Possessions"
 valyria_situation_participant_group_remnants_desc:0 "Tous ceux qui ont d'une manière ou d'une autre survécu au Fléau et qui constituent tout ce qui reste des antiques Possessions."
 valyria_situation_participant_group_opportunists:0 "Charognards du Fléau"
 valyria_situation_participant_group_opportunists_desc:0 "Tous ceux qui cherchent à tirer profit des ruines de Valyria, que ce soit par le commerce, le pillage, ou d'autres moyens. Cela inclut les marchands, les aventuriers, et les chasseurs de trésors qui voient un potentiel de richesse dans les ruines antiques."



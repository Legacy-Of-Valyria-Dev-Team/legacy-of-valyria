  # Participant Groups
  valyria_situation_participant_group_blood_of_valyria:0 "Le Sang de Valyria"
  valyria_situation_participant_group_blood_of_valyria_desc:0 "Tous ceux qui prétendent être de descendance valyrienne, qu'ils soient de véritables descendants ou non. Cela inclut tout le monde, des Targaryen et Velaryon au Sang Ancien de Volantis et aux autres maisons nobles qui retracent leur lignée jusqu'à Valyria."
  valyria_situation_participant_group_restorationists:0 "Restaurationnistes Valyriens"
  valyria_situation_participant_group_restorationists_desc:0 "Tous ceux qui cherchent à restaurer Valyria dans sa gloire d'antan en reconquérant les terres perdues lors du Fléau et en rebâtissant leurs grandes cités, bien qu'ils ne soient pas de descendance valyrienne directe."
  valyria_situation_participant_group_remnants:0 "Vestiges des Possessions"
  valyria_situation_participant_group_remnants_desc:0 "Tous ceux qui ont d'une manière ou d'une autre survécu au Fléau et constituent tout ce qui reste des anciennes Possessions."
  valyria_situation_participant_group_opportunists:0 "Charognards du Fléau"
  valyria_situation_participant_group_opportunists_desc:0 "Tous ceux qui cherchent à tirer profit des ruines de Valyria, que ce soit par le commerce, le pillage ou d'autres moyens. Cela inclut les marchands, aventuriers et chasseurs de trésors qui voient le potentiel de richesse dans les ruines antiques."



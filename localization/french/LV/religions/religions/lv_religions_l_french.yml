  ## Asshai Religion
  shadowbinders:0 "Lieurs d'Ombre"
  shadowbinders_religion:0 "Lieurs d'Ombre"
  shadowbinders_adj:0 "Lieurs d'Ombre"
  shadowbinders_religion_adj:0 "Essosi de l'Extrême-Orient"
  shadowbinders_adherent:0 "Lieur d'Ombre"
  shadowbinders_adherent_plural:0 "Lieurs d'Ombre"
  shadowbinders_religion_desc:0 "La foi des Lieurs d'Ombre est pratiquée principalement dans les terres obscures d'Asshaï et des régions avoisinantes. Il s'agit d'une religion mystérieuse et ésotérique centrée sur la manipulation des ombres et de la magie noire. Les fidèles vénèrent l'ombre et la magie à la fois comme outil et essence divine, croyant qu'elles renferment les secrets du pouvoir et du savoir dissimulés à la lumière. Les Lieurs d'Ombre accomplissent des rituels complexes pour canaliser ce pouvoir, impliquant souvent magie du sang et symboles arcaniques, cherchant à commander les ténèbres et à communier avec les forces énigmatiques qui y résident"

  # Doctrines
  doctrine_asshaii_pantheon_name:0 "Les Dieux de l'Ombre"
  doctrine_asshaii_pantheon_desc:0 "Cette foi vénère les mystérieux dieux de l'ombre"
  doctrine_asshaii_syncreticism_name:0 "Syncrétisme Asshaï'i"
  doctrine_asshaii_syncreticism_desc:0 "Les dieux de l'ombre, aussi énigmatiques soient-ils, ont été jugés dignes de respect et de vénération, et ainsi, nous honorerons les rites et traditions de leurs fidèles"

  tenet_magicae_cultus_name:0 "Culte de la Magie"
  tenet_magicae_cultus_desc:0 "Le Culte de la Magie, comme son nom l'indique, est une tradition mystique consacrée à l'étude et à la vénération des forces arcaniques mystérieuses. Les cultures qui suivent cette tradition cherchent l'illumination et la puissance à travers des rituels anciens, l'art des sorts et la communion avec des énergies magiques invisibles qui façonnent le monde"

  ## Stonemen
  stonemen_religion:0 "Hommes de Pierre"
  stonemen_religion_adj:0 "Hommes de Pierre"
  shrouded_lord:0 "Seigneur Voilé"
  shrouded_lord_adj:0 "Après le Fléau de Valyria"
  shrouded_lord_adherent:0 "Vaisseau Voilé"
  shrouded_lord_adherent_plural:0 "Vaisseaux Voilés"
  shrouded_lord_desc:0 "Les adeptes du Seigneur Voilé vénèrent une figure mystérieuse et ténébreuse, censée régner sur la mort et l'au-delà. Issue des sombres légendes de Valyria, cette foi lie la mort à la puissance et à la souffrance. Les disciples du Seigneur Voilé embrassent la douleur, croyant que par l'exaltation de la souffrance, ils peuvent transcender les limites mortelles et gagner les faveurs dans l'au-delà. Le sacrifice humain est au cœur de leurs rites, une offrande sinistre pour apaiser le Seigneur Voilé et obtenir sa guidance dans le domaine obscur de la mort"

  ## Hérésies Gogossies
  green_wyrm_religion_adj:0 "Valyrien"
  green_wyrm_religion:0 "Culte de la Vouivre Verte"
  green_wyrm:0 "Culte de la Vouivre Verte"
  green_wyrm_adj:0 "Culte de la Vouivre Verte"
  green_wyrm_adherent:0 "Vouivriens"
  green_wyrm_adherent_plural:0 "Vouivriens"
  green_wyrm_religion_desc:0 "Le Culte de la Vouivre Verte est une branche issue des Dieux de Valyria, apparue sur les rivages gogossis. À l’image du Seigneur Voilé, cette culture vénère la mort et le sang comme moyen de communiquer avec les dieux et d’assurer sa place dans l’au-delà. De plus, la sacralité de la nature fait partie de ses croyances fondamentales, apportant une lueur particulière à une religion globalement sombre"

  # Doctrines
  tenet_junglecaster_name:0 "Oracles de la jungle"
  tenet_junglecaster_desc:0 "Cette religion accorde une grande valeur à la magie et à sa pratique, reconnaissant son importance cruciale et son lien incontestable avec la nature, tout en l’harmonisant avec ses traditions sanglantes"
  ## Asshai Religion
  shadowbinders:0 "Entrelieurs d'Ombres"
  shadowbinders_religion:0 "Entrelieurs d'Ombres"
  shadowbinders_adj:0 "des Entrelieurs d'Ombres"
  shadowbinders_religion_adj:0 "d'Essos Extrême-Oriental"
  shadowbinders_adherent:0 "Entrelieur d'Ombres"
  shadowbinders_adherent_plural:0 "Entrelieurs d'Ombres"
  shadowbinders_religion_desc:0 "La foi des Entrelieurs d'Ombres est pratiquée principalement dans les terres ténébreuses d'Asshaï et les régions environnantes. C'est une religion mystérieuse et ésotérique centrée sur la manipulation des ombres et de la magie noire. Ses adeptes vénèrent l'ombre et la magie comme à la fois un outil et une essence divine, croyant qu'elles détiennent les secrets du pouvoir et du savoir cachés de la lumière. Les Entrelieurs d'Ombres accomplissent des rituels complexes pour maîtriser ce pouvoir, recourant souvent à la magie du sang et aux symboles arcanes, cherchant à commander les ténèbres et à communier avec les forces énigmatiques qui y résident"

  # Doctrines
  doctrine_asshaii_pantheon_name:0 "Les Dieux de l'Ombre"
  doctrine_asshaii_pantheon_desc:0 "Cette foi suit les mystérieux dieux de l'ombre"
  doctrine_asshaii_syncreticism_name:0 "Syncrétisme Asshaï'i"
  doctrine_asshaii_syncreticism_desc:0 "Les dieux de l'ombre, aussi énigmatiques soient-ils, ont été jugés dignes de notre respect et de notre culte, ainsi honorerons-nous les droits et traditions de leurs dévots"

  tenet_magicae_cultus_name:0 "Magicae Cultus"
  tenet_magicae_cultus_desc:0 "Le Magicae Cultus, comme son nom l'implique, est une tradition mystique vouée à l'étude et à la vénération des forces arcanes mystérieuses. Les cultures possédant cette tradition recherchent l'illumination et le pouvoir à travers des rituels anciens, la sorcellerie et la communion avec les énergies magiques invisibles qui façonnent le monde"

  ## Stonemen
  stonemen_religion:0 "Hommes de Pierre"
  stonemen_religion_adj:0 "des Hommes de Pierre"
  shrouded_lord:0 "Seigneur Voilé"
  shrouded_lord_adj:0 "Post-Fléau Valyrien"
  shrouded_lord_adherent:0 "Vaisseau Voilé"
  shrouded_lord_adherent_plural:0 "Vaisseaux Voilés"
  shrouded_lord_desc:0 "Les fidèles du Seigneur Voilé vénèrent une figure mystérieuse et ténébreuse supposée régner sur la mort et l'au-delà. Enracinée dans les sombres légendes de Valyria, cette foi entremêle la mort avec le pouvoir et la souffrance. Les adeptes du Seigneur Voilé embrassent la douleur, croyant que par l'exaltation de la souffrance, ils peuvent transcender les limites mortelles et gagner les faveurs dans l'au-delà. Le sacrifice humain est au cœur de leurs rites, une sinistre offrande pour apaiser le Seigneur Voilé et assurer sa guidance dans le sombre domaine de la mort"

  ## Gogossi Heresies
  green_wyrm_religion_adj:0 "Valyrien"
  green_wyrm_religion:0 "Culte de la Vouivre Verte"
  green_wyrm:0 "Culte de la Vouivre Verte"
  green_wyrm_adj:0 "du Culte de la Vouivre Verte"
  green_wyrm_adherent:0 "Vouivrien"
  green_wyrm_adherent_plural:0 "Vouivriens"
  green_wyrm_religion_desc:0 "Le Culte de la Vouivre Verte est un rejeton des Dieux de Valyria qui a pris naissance sur les rivages de Gogossos. À l'instar du Seigneur Voilé, cette culture vénère la mort et le sang, les considérant comme un moyen de communiquer avec les dieux et d'assurer leur place dans l'au-delà. De plus, la sacralité de la nature constitue l'une de ses croyances fondamentales, apportant sa propre touche de lumière à une religion généralement sombre"

  # Doctrines
  tenet_junglecaster_name:0 "Oracles de la Jungle"
  tenet_junglecaster_desc:0 "Cette religion valorise la magie et sa pratique, comprenant et respectant son lien crucial et indéniable avec la nature, le conciliant avec leurs traditions sanglantes"
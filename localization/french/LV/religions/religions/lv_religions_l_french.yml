 ## Asshai Religion
 shadowbinders:0 "Lieurs d'Ombre"
 shadowbinders_religion:0 "Lieurs d'Ombre"
 shadowbinders_adj:0 "Lieurs d'Ombre"
 shadowbinders_religion_adj:0 "Essosien d'Extrême-Orient"
 shadowbinders_adherent:0 "Lieur d'Ombre"
 shadowbinders_adherent_plural:0 "Lieurs d'Ombre"
 shadowbinders_religion_desc:0 "La foi des Lieurs d'Ombre se pratique principalement dans les terres ombreuses d'Asshaï et les régions environnantes ; c'est une religion mystérieuse et ésotérique centrée sur la manipulation des ombres et de la magie noire. Ses fidèles vénèrent l'ombre et la magie à la fois comme un outil et comme une essence divine, croyant qu'elle recèle les secrets du pouvoir et du savoir cachés à la lumière. Les Lieurs d'Ombre accomplissent des rituels complexes pour exploiter ce pouvoir, impliquant souvent magie du sang et symboles arcaniques, cherchant à commander les ténèbres et à communier avec les forces énigmatiques qui y résident."

 # Doctrines
 doctrine_asshaii_pantheon_name:0 "Les Dieux de l'Ombre"
 doctrine_asshaii_pantheon_desc:0 "Cette foi suit les dieux mystérieux de l'ombre."
 doctrine_asshaii_syncreticism_name:0 "Syncrétisme Asshaï'i"
 doctrine_asshaii_syncreticism_desc:0 "Les dieux de l'ombre, aussi énigmatiques soient-ils, en sont venus à être jugés dignes de notre respect et de notre adoration, et nous honorerons donc les droits et traditions de leurs dévots."

 tenet_magicae_cultus_name:0 "Magicae Cultus"
 tenet_magicae_cultus_desc:0 "Le Magicae Cultus, comme son nom l'indique, est une tradition mystique vouée à l'étude et à la vénération de forces arcaniques mystérieuses. Les cultures pratiquant cette tradition recherchent l'illumination et le pouvoir à travers d'anciens rituels, l'art des sortilèges, et la communion avec des énergies magiques invisibles qui façonnent le monde"

 ## Stonemen
 stonemen_religion:0 "Hommes de Pierre"
 stonemen_religion_adj:0 "Hommes de Pierre"
 shrouded_lord:0 "Seigneur Enveloppé"
 shrouded_lord_adj:0 "Post-Fléau de Valyria"
 shrouded_lord_adherent:0 "Vaisseau Enveloppé"
 shrouded_lord_adherent_plural:0 "Vaisseaux Enveloppés"
 shrouded_lord_desc:0 "Les fidèles du Seigneur Enveloppé vénèrent une figure mystérieuse et ombreuse que l'on croit régner sur la mort et l'au-delà. Enracinée dans les sombres légendes de Valyria, cette foi entrelace la mort avec le pouvoir et la douleur. Les adeptes du Seigneur Enveloppé embrassent la souffrance, croyant que par l'exaltation de la douleur, ils peuvent transcender les limites mortelles et gagner sa faveur dans l'au-delà. Le sacrifice humain est au cœur de leurs rites, une offrande funeste pour apaiser le Seigneur Enveloppé et s'assurer de sa guidance dans le sombre domaine de la mort."

 ## Gogossi Heresies
 green_wyrm_religion_adj:0 "Valyrien"
 green_wyrm_religion:0 "Culte du Veur Vert"
 green_wyrm:0 "Culte du Veur Vert"
 green_wyrm_adj:0 "Culte du Veur Vert"
 green_wyrm_adherent:0 "Veurites"
 green_wyrm_adherent_plural:0 "Veurites"
 green_wyrm_religion_desc:0 "La religion du Culte du Veur Vert est une ramification des Dieux de Valyria née sur les rives gogossites ; tout comme le Seigneur Enveloppé, cette culture vénère la mort et le sang et y voit un moyen de communiquer avec les dieux et d'assurer sa place dans l'au-delà. De plus, la sanctité de la nature est l'une de ses croyances fondamentales, apportant sa propre touche de lumière à une religion généralement sombre."

 # Doctrines
 tenet_junglecaster_name:0 "Oracles de la Jungle"
 tenet_junglecaster_desc:0 "Cette religion valorise la magie et sa pratique ; elle comprend et respecte son lien crucial et indéniable avec la nature, le conciliant avec ses traditions sanglantes."
  ## Asshai Religion
  shadowbinders:0 "Ombromanciens"
  shadowbinders_religion:0 "Ombromanciens"
  shadowbinders_adj:0 "Ombromanciens"
  shadowbinders_religion_adj:0 "Extrême-Orient Essossien"
  shadowbinders_adherent:0 "Ombromancien"
  shadowbinders_adherent_plural:0 "Ombromanciens"
  shadowbinders_religion_desc:0 "La foi des Ombromanciens est pratiquée principalement dans les contrées ombreuses d'Asshaï et des régions environnantes. C'est une religion mystérieuse et ésotérique centrée sur la manipulation des ombres et de la magie noire. Les fidèles vénèrent l'ombre et la magie à la fois comme un outil et une essence divine, croyant qu'elle détient les secrets du pouvoir et de la connaissance cachés à la lumière. Les Ombromanciens accomplissent des rituels complexes pour exploiter ce pouvoir, impliquant souvent la magie du sang et des symboles arcaniques, cherchant à commander les ténèbres et à communier avec les forces énigmatiques qui demeurent en elles."

  # Doctrines
  doctrine_asshaii_pantheon_name:0 "Les Dieux de l'Ombre"
  doctrine_asshaii_pantheon_desc:0 "Cette foi suit les mystérieux dieux de l'ombre dans leurs voies ténébreuses."
  doctrine_asshaii_syncreticism_name:0 "Syncrétisme d'Asshaï"
  doctrine_asshaii_syncreticism_desc:0 "Les dieux de l'ombre, énigmatiques comme ils le sont, en sont venus à être jugés dignes de notre respect et de notre vénération, et ainsi nous honorerons les droits et traditions de leurs dévoués."

  tenet_magicae_cultus_name:0 "Magicae Cultus"
  tenet_magicae_cultus_desc:0 "Le Magicae Cultus, comme le nom l'implique, est une tradition mystique dédiée à l'étude et à la vénération des forces arcaniques mystérieuses. Les cultures possédant cette tradition cherchent l'illumination et le pouvoir à travers les rituels anciens, la sorcellerie et la communion avec les énergies magiques invisibles qui façonnent le monde."

  ## Stonemen
  stonemen_religion:0 "Hommes de Pierre"
  stonemen_religion_adj:0 "Hommes de Pierre"
  shrouded_lord:0 "Seigneur Voilé"
  shrouded_lord_adj:0 "Post-Fléau de Valyria"
  shrouded_lord_adherent:0 "Réceptacle Voilé"
  shrouded_lord_adherent_plural:0 "Réceptacles Voilés"
  shrouded_lord_desc:0 "Les fidèles du Seigneur Voilé vénèrent une figure mystérieuse et ombragée que l'on croit régner sur la mort et l'au-delà. Enracinée dans les sombres légendes de Valyria, cette foi entremêle la mort avec le pouvoir et la douleur. Les adeptes du Seigneur Voilé embrassent la souffrance, croyant qu'à travers l'exaltation de la douleur, ils peuvent transcender les limites mortelles et gagner les faveurs dans l'au-delà. Le sacrifice humain est central à leurs rites, une offrande sinistre pour apaiser le Seigneur Voilé et assurer sa guidance dans le sombre domaine de la mort."

  ## Gogossi Heresies
  green_wyrm_religion_adj:0 "Valyrien"
  green_wyrm_religion:0 "Culte du Wyrm Vert"
  green_wyrm:0 "Culte du Wyrm Vert"
  green_wyrm_adj:0 "Culte du Wyrm Vert"
  green_wyrm_adherent:0 "Wyrmite"
  green_wyrm_adherent_plural:0 "Wyrmites"
  green_wyrm_religion_desc:0 "La religion du Culte du Wyrm Vert est un rejeton des Dieux de Valyria qui a pris naissance sur les rivages gogossiens. Tout comme le Seigneur Voilé, cette culture vénère la mort et le sang et les voit comme un moyen de communiquer avec les dieux et d'assurer leur place dans l'au-delà. De plus, la sainteté de la nature est l'une de ses croyances centrales, donnant sa propre touche de lumière à une religion généralement sombre."

  # Doctrines
  tenet_junglecaster_name:0 "Oracles de la Jungle"
  tenet_junglecaster_desc:0 "Cette religion valorise la magie et sa pratique. Elle comprend et respecte sa connexion cruciale et indéniablement liée à la nature, la conciliant avec leurs traditions sanglantes."s"
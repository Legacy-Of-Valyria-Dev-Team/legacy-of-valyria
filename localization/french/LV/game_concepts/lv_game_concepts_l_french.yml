l_french:

 game_concept_wilderness:0 "Terres sauvages"
 game_concept_wilderness_holding:0 "Terres sauvages"
 game_concept_wilderness_holding_desc:0 "Le temps et l'abandon ont réduit ces terres à l'ombre de leur ancienne splendeur. Les quelques vestiges encore debout ne sont que fissures et ruines, témoignage du passé et avertissement pour l'avenir"
 game_concept_wilderness_holdings:0 "Domaines sauvages"
 game_concept_wilderness_holdings_desc:0 "Le temps et l'abandon ont réduit ces terres à l'ombre de leur ancienne splendeur. Les quelques vestiges encore debout ne sont que fissures et ruines, témoignage du passé et avertissement pour l'avenir"
 
 game_concept_colony_holding:0 "Colonie"
 game_concept_colony_holding_desc:0 "Une jeune implantation taillée dans les terres sauvages, où pionniers et colons œuvrent à établir un avant-poste en contrées indomptées. Bien que vulnérable, elle constitue le fondement d'une expansion future, apportant ordre, commerce et stabilité à la frontière"
 game_concept_colony_holdings:0 "Domaines coloniaux"
 game_concept_colony_holdings_desc:0 "Des implantations naissantes taillées dans les terres sauvages, où pionniers et colons œuvrent à établir un avant-poste en contrées indomptées. Bien que vulnérables, elles constituent le fondement d'une expansion future, apportant ordre, commerce et stabilité à la frontière"
 game_concept_colony:0 "Colonie"
 game_concept_colony_desc:0 "Une jeune implantation taillée dans les terres sauvages, où pionniers et colons œuvrent à établir un avant-poste en contrées indomptées. Bien que vulnérable, elle constitue le fondement d'une expansion future, apportant ordre, commerce et stabilité à la frontière"
 game_concept_colonies:0 "Colonies"
 game_concept_colonies_desc:0 "Des implantations naissantes taillées dans les terres sauvages, où pionniers et colons œuvrent à établir un avant-poste en contrées indomptées. Bien que vulnérables, elles constituent le fondement d'une expansion future, apportant ordre, commerce et stabilité à la frontière"

#Doom
 game_concept_doom_of_valyria:0 "Fléau de Valyria"
 game_concept_doom_of_valyria_desc:0 "#bold Le Fléau de Valyria#!, ou simplement le #bold Fléau#!, fut un cataclysme de nature indéterminée qui provoqua l'effondrement du [valyrian_freehold|E], lequel avait prospéré pendant cinq mille ans. Il survint environ un siècle avant la Conquête d'Aegon sur [westeros|E], en 102 avant la Conquête. Sortilèges, connaissances et chroniques furent perdus dans le #bold Fléau#!, et le Siècle de Sang suivit ce désastre"
 game_concept_doom:0 "Fléau"

#[valyrian_freehold|E]
 game_concept_valyrian_freehold_short:0 "Possessions"
 game_concept_valyrian_freehold:0 "Fief Libre de Valyria"
 game_concept_valyrian_freehold_desc:0 "Le #bold [valyrian_freehold|E]#! était un vaste territoire qui s'étendait sur une grande partie du continent d'[essos|E], mais qui est depuis tombé en ruine. Il fut détruit environ cent ans avant la Conquête d'Aegon, lorsqu'il fut anéanti par un événement cataclysmique connu sous le nom de [doom_of_valyria|E].\n\nÀ son apogée, le #bold [valyrian_freehold|E]#! englobait la majeure partie du continent oriental et s'étendait jusqu'aux actuelles [free_cities|E] et l'île de Peyredragon au large des côtes de [westeros|E]. #bold Les [valyrian_freehold_short|E]#! n'étaient techniquement jamais un empire, cependant par commodité on s'y réfère comme tel.\n\n#bold Les [valyrian_freehold_short|E]#! constituaient une civilisation avancée, et la puissance militaire et culturelle dominante du monde connu. Sa capitale était la cité de Valyria. #bold Les [valyrian_freehold_short|E]#! étaient gouvernées par les seigneurs francs-tenanciers, de puissantes familles nobles. Les plus puissants d'entre eux étaient les [dragonlords|El]"
 game_concept_the_freehold:0 "Les Possessions"

#Dragonlords
 game_concept_dragonlord:0 "Lord Dragon"
 game_concept_dragonlords:0 "Lords Dragons"
 game_concept_dragonlord_desc:0 "Les #bold Lords Dragons#! étaient les plus puissants nobles [dragon_riding|El] du [valyrian_freehold|E]. Certains membres de la maison Targaryen, comme Aegon le Conquérant, ont été désignés comme « Seigneurs Dragons » après le [doom_of_valyria|E] et la destruction de cette civilisation"

#Dragonrider
 game_concept_dragonrider:0 "Chevaucheur de dragon"
 game_concept_dragonriders:0 "Chevaucheurs de dragons"
 game_concept_dragon_riding:0 "Art de chevaucher les dragons"
 game_concept_dragonrider_desc:0 "Un [GetTrait('dragonrider').GetName(GetNullCharacter)] est une personne dont la monture est un [dragon|E].\n\nLes [GetTrait('dragonrider').GetName(GetNullCharacter)]s se trouvaient parmi les familles [dragonlord|El] du [valyrian_freehold|E], lorsque [the_freehold|E] était encore puissant.\n\nLes Targaryen étaient l'une de ces familles de seigneurs dragons, bien que loin d'être la plus puissante, et furent les derniers [GetTrait('dragonrider').GetName(GetNullCharacter)]s connus à survivre au [doom_of_valyria|E] et à ses conséquences"

#Continents
  game_concept_known_world:0 "Monde connu"
  game_concept_three_known_continents:0 "Trois continents connus"
  game_concept_known_world_desc:0 "#bold Le monde connu#! est composé d'au moins trois continents ([westeros|E], [essos|E] et [sothoryos|E]), d'une vaste masse terrestre ([ulthos|E]) et de nombreuses îles plus petites.\n\nAucune des quatre principales masses terrestres n'a été entièrement cartographiée, et une grande partie du monde reste inexplorée.\n\nBien que les [maesters|El] de [westeros|E] connaissent bien les terres situées à l'extrême est, la distance reste un problème, et au-delà d'un certain point, mythes et légendes s'immiscent dans leurs archives"
  #Westeros
   game_concept_westeros:0 "Westeros"
   game_concept_westerosi:0 "Westerosi"
   game_concept_westeros_desc:0 "#bold Westeros#! est l'un des [three_known_continents|E] du [known_world|E], les autres étant [essos|E] et [sothoryos|E]. La majeure partie de #bold Westeros#! est couverte par une entité politique connue sous le nom de [seven_kingdoms|E], tandis que l'extrême nord au-delà du Mur abrite le peuple libre.\n\nLes nations étrangères les plus proches de #bold Westeros#! sont les [free_cities|E]. Au sud de #bold Westeros#! se trouvent les Îles d'Été"
   game_concept_seven_kingdoms:0 "Sept Couronnes"
   game_concept_seven_kingdoms_desc:0 "#bold Les Sept Couronnes#! sont un royaume situé sur le continent de [westeros|E], gouverné par un monarque portant le titre de Roi des [andals|E], des [rhoynar|E] et des [first_men|E], et Seigneur des #bold Sept Couronnes#!, le roi qui siège sur le Trône de Fer dans la capitale, Port-Réal. Son nom provient de la situation qui prévalait il y a trois siècles, lorsqu'Aegon le Conquérant entreprit d'unifier les terres de [westeros|E], alors gouvernées par sept royaumes indépendants, outre les terres [beyond_the_wall|E]. Le nouveau royaume issu de la Conquête d'Aegon est divisé en neuf régions ou provinces distinctes"
   game_concept_narrow_sea:0 "Détroit"
   game_concept_narrow_sea_desc:0 "#bold Le Détroit#! est la mer qui sépare les continents de [westeros|E] à l'ouest et d'[essos|E] à l'est. Cette mer est relativement étroite et facile à traverser, mais suffisamment vaste pour rendre difficiles les invasions et incursions militaires d'envergure entre les [seven_kingdoms|E] et les [free_cities|E].\n\nLes échanges commerciaux sont réguliers à travers le Détroit entre les deux continents et le Port d'Ibben. Les nobles [westerosi|E] sont parfois élevés ou cherchent refuge dans les cités d'outre-mer"
   game_concept_others:0 "Autres"
   game_concept_white_walkers:0 "Marcheurs Blancs"
   game_concept_cold_gods:0 "Dieux Froids"
   game_concept_white_shadows:0 "Ombres Blanches"
   game_concept_cold_shadows:0 "Ombres Froides"
   game_concept_others_desc:0 "Les #bold Autres#!, également connus sous le nom de #bold Marcheurs Blancs#!, #bold Dieux Froids#!, #bold Ombres Blanches#! et #bold Ombres Froides#!, sont une espèce d'êtres humanoïdes qui existent dans le nord au-delà du [watch_wall|E]. Comme ils n'ont pas été aperçus depuis six à huit mille ans, ils sont considérés comme éteints"
   game_concept_watch_wall:0 "Mur"
   game_concept_watch_wall_desc:0 "Le #bold Mur#! est une immense barrière principalement de glace qui s'étend le long de la frontière nord des [seven_kingdoms|E], la séparant des [wild_lands_beyond|E]. Le #bold Mur#! mesure cent lieues de long (trois cents milles) et atteint plus de sept cents pieds à son point le plus élevé, bien que certains blocs de fondation en régions vallonnées, comme près de Griposte, l'élèvent à neuf cents pieds dans les airs.\n\n L'une des neuf Merveilles faites par l'Homme de Lomas Longstep, le #bold Mur#! est défendu et tenu par les Frères Jurés de la [nw_govt|E], qui patrouillent et gardent dix-neuf châteaux, des montagnes Crocgivre à l'ouest jusqu'à la baie des Phoques à l'est. Seuls la Tour Ombreuse, Châteaunoir et Fort-Levant sont occupés au début de #bold A Song of Ice and Fire#!. Ceux qui rejoignent la Garde pour éviter une autre punition peuvent être désignés comme #bold envoyés au Mur#!"
   game_concept_beyond_the_wall:0 "Au-delà du Mur"
   game_concept_wild_lands_beyond:0 "Terres sauvages au-delà"
   game_concept_beyond_the_wall_desc:0 "#bold Au-delà du Mur#! est un terme général désignant la région la plus septentrionale de [westeros|E], les terres au nord du [watch_wall|E] et des [seven_kingdoms|E]"
   game_concept_age_of_heroes:0 "Âge des Héros"
   game_concept_age_of_heroes_desc:0 "L'#bold Âge des Héros#! fut une ère de l'histoire [westerosi|E] antérieure à l'[coming_of_the_andals|E]. Il tire son nom des grands hommes et femmes qui vécurent durant les années de paix qui suivirent la conclusion du [pact|E] entre les [first_men|E] et les [children_of_the_forest|E]. De nombreuses maisons nobles font remonter leur histoire familiale à l'#bold Âge des Héros#!, bien qu'il soit difficile pour les historiens de distinguer la vérité de la légende"
   game_concept_dawn_age:0 "Âge de l'Aube"
   game_concept_dawn_age_desc:0 "L'#bold Âge de l'Aube#!, aussi appelé l'#bold Aube des Jours#! ou les #bold siècles de l'aube#!, fut une période d'une durée indéterminée durant laquelle les [first_men|E] arrivèrent d'[essos|E] et commencèrent à coloniser [westeros|E]. Avant eux, les [children_of_the_forest|E] — êtres mystérieux et minuscules dotés de dons surnaturels — habitaient cette terre, vénérant les [nameless_gods|E] de la nature et vivant en harmonie avec elle, possiblement aux côtés des géants"
   game_concept_long_night:0 "Longue Nuit"
   game_concept_long_night_desc:0 "La #bold Longue Nuit#! est le terme par lequel les [westerosi|E] désignent une période où d'affreuses ténèbres s'abattirent sur le [known_world|E]. Elle survint durant l'[age_of_heroes|E], environ huit mille ans avant la Conquête d'Aegon, au cœur d'un grand hiver qui dura des années. La #bold Longue Nuit#! persista pendant une génération et sema la dévastation par la famine et la terreur"
   game_concept_first_men:0 "Premiers Hommes"
   game_concept_first_men_desc:0 "Les #bold Premiers Hommes#! constituent l'un des trois grands groupes ethniques dont descendent les humains de [westeros|E], les autres étant les [andals|E] et les [rhoynar|E]. Les #bold Premiers Hommes#! furent la culture humaine qui posa en premier le pied sur le continent. L'influence des #bold Premiers Hommes#! se fait encore sentir à [westeros|E], plus fortement dans le Nord. Le Seigneur des [seven_kingdoms|E], le roi sur le Trône de Fer, se proclame Roi des [andals|E], des [rhoynar|E] et des #bold Premiers Hommes#!"
   game_concept_andal:0 "Andal"
   game_concept_andals:0 "Andals"
   game_concept_andal_desc:0 "Les #bold Andals#! constituent l'un des trois grands groupes ethniques dont descendent les humains de [westeros|E], les autres étant les [first_men|E] et les [rhoynar|E]. L'[coming_of_the_andals|E] à [westeros|E] provoqua la chute de nombreux royaumes des [first_men|E] qui s'étaient développés après leur [pact|E] avec les [children_of_the_forest|E].\n\nLes #bold Andals#! apportèrent également la Foi des Sept sur le continent. Le Seigneur des [seven_kingdoms|E], le roi sur le Trône de Fer, se proclame Roi des #bold Andals#!, des [rhoynar|E] et des [first_men|E].\n\nLes [dothraki|E] désignent [westeros|E] comme Rhaesh Andahli, la terre des #bold Andals#!"
   game_concept_rhoynar:0 "Rhoynars"
   game_concept_rhoynar_desc:0 "Les #bold Rhoynars#! constituent l'un des trois grands groupes ethniques dont descendent les humains de [westeros|E], les autres étant les [andals|E] et les [first_men|E]. Ils formaient une culture de peuple fluvial qui habitait les rives de l'immense fleuve #bold Rhoyne#! en [essos|E]. Après avoir été contraints de fuir à bord de dix mille navires durant les Guerres Rhoynaises contre Valyria, les #bold Rhoynars#! survivants finirent par s'établir à Dorne, dans le sud de [westeros|E].\n\n\nBien que la plupart des #bold Rhoynars#! se soient intégrés à la société dornienne, particulièrement aux soi-disant « Dorniens salés », les orphelins de la Sangleverte ont conservé leur héritage et leur langue rhoynais. Le Seigneur des [seven_kingdoms|E], qui siège sur le Trône de Fer, revendique le titre de Roi des [andals|E], des Rhoynars et des [first_men|E]"
   game_concept_coming_of_the_andals:0 "Venue des Andals"
   game_concept_coming_of_the_andals_desc:0 "La #bold venue des Andals#!, #bold traversée des Andals#! ou #bold arrivée des Andals#! fait référence à la migration des [andals|E] d'[essos|E] vers [westeros|E]. L'époque à laquelle cela s'est produit est contestée ; certaines sources indiquent il y a six mille ans, l'Histoire Véritable affirme que c'était il y a quatre mille ans, et certains [maesters|E] comme Denestan prétendent que c'était il y a deux mille ans.\n\nBeaucoup des petits royaumes des [first_men|E] furent détruits par les envahisseurs [andal|E] et les [children_of_the_forest|E] furent repoussés vers le nord. La prise de contrôle fut cependant parfois pacifique, avec des mariages mixtes entre [andals|E] et [first_men|E]"
   game_concept_children_of_the_forest:0 "Enfants de la forêt"
   game_concept_children_of_the_forest_desc:0 "Les #bold enfants de la forêt#!, parfois désignés simplement comme les #bold enfants#!, sont une race mystérieuse non humaine qui habitait à l'origine le continent de [westeros|E] durant l'[dawn_age|E], bien avant l'arrivée des [first_men|E] il y a des milliers d'années. Les géants les appellent woh dak nag gram (petit peuple écureuil). Ils se nomment eux-mêmes #bold ceux qui chantent le chant de la terre#! dans la Langue Véritable. Les #bold enfants#! n'ont pas été vus par les hommes depuis des centaines d'années"
   game_concept_pact:0 "Pacte"
   game_concept_pact_desc:0 "Le #bold Pacte de l'Île aux Visages#! mit fin à l'ancienne guerre entre les [first_men|E] et les [children_of_the_forest|E] il y a plus de 10 000 ans. Il fut signé sur une île dans l'#bold Œildieu#!, où des visages furent sculptés dans les barrals pour que les dieux puissent témoigner du traité. Les hommes verts furent chargés de garder l'île.\n\nLe #bold Pacte#! perdura tout au long de l'[age_of_heroes|E], de la [long_night|E] et de l'essor des [seven_kingdoms|E], jusqu'à ce que, plusieurs siècles plus tard, les [andals|E] traversent le [narrow_sea|E], apportant de grands changements à [westeros|E]"
   game_concept_old_gods:0 "Anciens Dieux"
   game_concept_nameless_gods:0 "Dieux Sans Nom"
   game_concept_old_gods_desc:0 "Les #bold anciens dieux#! sont des divinités sans nom de la forêt, des ruisseaux et de la pierre, encore vénérés dans les [seven_kingdoms|E], principalement dans le nord de [westeros|E] et au-delà du [watch_wall|E]. Bien que la Foi des Sept les ait remplacés dans la plupart des régions, la croyance aux #bold anciens dieux#! persiste parmi les nordiens, les paludiers et le peuple libre. De nombreux [westerosi|E] jurent encore par les anciens et les nouveaux"

   #Sothoryos
   game_concept_sothoryos:0 "Sothoryos"
   game_concept_sothoros:0 "Sothoros"
   game_concept_sothoryos_desc:0 "#bold Sothoryos#! ou #bold Sothoros#! est l'un des [three_known_continents|E] du monde. Il se trouve au sud-est de [westeros|E] et au sud d'[essos|E], de l'autre côté de la mer d'Été. À l'est de #bold Sothoryos#! se trouve la partie méridionale de la mer de Jade"
  #Essos
   game_concept_essos:0 "Essos"
   game_concept_essosi:0 "Essosi"
   game_concept_the_east:0 "Est"
   game_concept_essos_desc:0 "#bold Essos#!, souvent simplement appelé l'est, est le plus vaste des [three_known_continents|El] du monde.\n\nIl s'étend à l'est de [westeros|E] et au nord de [sothoryos|E] et d'[ulthos|E], s'étirant de la mer Grelotte au nord jusqu'à la mer d'Été au sud, et du Détroit à l'ouest jusqu'aux terres entourant la mer de Jade à l'est, voire au-delà.\n\n#bold Essos#! est peuplé par de nombreux peuples différents et possède une géographie vaste et variée"
   #Free cities
    game_concept_free_cities:0 "Cités Libres"
    game_concept_free_city:0 "Cité Libre"
    game_concept_free_cities_desc:0 "#bold Les Cités Libres#!, également appelées les #bold Neuf Cités Libres#!, sont un groupe de neuf cités-états indépendantes dans l'ouest d'[essos|E], situées à l'ouest de la [dothraki_sea|E] et des Montagnes Peintes, et au nord-ouest de la péninsule valyrienne.\n\n#bold Les Cités Libres#! commercent et interagissent fréquemment avec les [seven_kingdoms|E] de [westeros|E]. Beaucoup dans #bold les Cités Libres#! se considèrent plus sophistiqués que les Westerosi, certains considérant même les habitants des [seven_kingdoms|E] comme des sauvages"
   #Dothraki
    game_concept_dothraki_sea:0 "Mer Dothraki"
    game_concept_dothraki_sea_desc:0 "#bold La Mer Dothraki#!, également connue sous le nom de #bold Grande Mer d'Herbe#!, les #bold Terres Hantées#! et la #bold Grande Désolation#!, est une vaste région continentale du continent d'[essos|E], située à l'est des [free_cities|E], au nord de la Baie des Serfs et à l'ouest des Montagnes d'Os.\n\nSes paysages de steppes et de plaines abritent le peuple équestre nomade [dothraki|E], qui se livre constamment à des batailles entre eux et à des raids sur les terres environnantes"
    game_concept_dothraki:0 "Dothraki"
    game_concept_dothraki_desc:0 "Le peuple #bold Dothraki#! est une culture de guerriers nomades d'[essos|E] qui parcourent les vastes prairies de la [dothraki_sea|E] en hordes connues sous le nom de khalasars. Les habitants des [seven_kingdoms|E] et des [free_cities|E] appellent aussi les #bold Dothraki#! les seigneurs des chevaux"
  #Ulthos
   game_concept_ulthos:0 "Ulthos"
   game_concept_ulthos_desc:0 "#bold Ulthos#! est une masse terrestre située à l'extrême est, qui pourrait être ou non un autre continent. Elle se trouve au sud d'Asshaï et des Terres de l'Ombre en [essos|E] et à l'est de [sothoryos|E]. Elle est séparée des Terres de l'Ombre par les Détroits de Safran. L'île d'Ulos est située dans les détroits entre #bold Ulthos#! et [essos|E].\n\nOn sait peu de choses sur #bold Ulthos#! hormis sa localisation et le fait qu'elle est couverte d'une jungle dense"


#Crafting
 game_concept_resources:0 "Ressources"
 game_concept_resources_desc:0 "Les ressources incluent le [zz_iron|E], l'[zz_steel|E], l'[zz_obsidian|E] et l'[zz_valyrian_steel|E], qui constituent les réserves de matériaux d'un royaume pour l'artisanat. Des bâtiments générateurs de ressources peuvent être construits dans n'importe quelle province disposant d'un domaine"
 game_concept_crafting_resources_tooltip:0 "@lov_icon_resources!"

 zz_iron:0 "Fer"
 game_concept_zz_iron:0 "$zz_iron$"
 game_concept_zz_iron_desc:0 "Le fer est un métal résistant souvent utilisé dans les outils et l'armement, qui peut être extrait dans les provinces dotées d'une mine de fer. C'est le métal de base de l'[zz_steel|E]"
 game_concept_iron_tooltip:0 "@lov_icon_iron!"
 
 zz_steel:0 "Acier"
 game_concept_zz_steel:0 "$zz_steel$"
 game_concept_zz_steel_desc:0 "L'acier est un alliage dur de [zz_iron|E] et de carbone souvent utilisé pour fabriquer des armes et des armures. Les forges d'acier produisent de l'acier et nécessitent des mines de fer pour être construites"
 game_concept_steel_tooltip:0 "@lov_icon_steel!"

 zz_obsidian:0 "Obsidienne"
 game_concept_zz_obsidian:0 "$zz_obsidian$"
 game_concept_zz_obsidian_desc:0 "L'obsidienne, communément appelée verredragon par le petit peuple, est un verre volcanique formé par une chaleur et une pression immenses dans la terre. Les provinces avec des gisements d'obsidienne — généralement des provinces avec des volcans — peuvent produire de l'obsidienne à partir de mines d'obsidienne dédiées"
 game_concept_obsidian_tooltip:0 "@lov_icon_obsidian!"

 zz_valyrian_steel:0 "Acier valyrien"
 game_concept_zz_valyrian_steel:0 "$zz_valyrian_steel$"
 game_concept_zz_valyrian_steel_desc:0 "L'acier valyrien est un type d'[zz_steel|E] originaire de Valyria, utilisé pour fabriquer des armes et divers autres objets d'une qualité sans égale. La magie joue un rôle dans sa forge, ce qui rend l'acier spécial et lui confère des caractéristiques magiques. Les [dragonlords|E] peuvent produire de l'acier valyrien dans des forges d'acier valyrien spéciales qui peuvent être construites dans des provinces disposant de mines de fer"
 game_concept_zz_v_steel:0 "Acier V"
 game_concept_v_steel_tooltip:0 "@lov_icon_valyrian_steel!"
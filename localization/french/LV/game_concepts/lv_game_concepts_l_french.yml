l_french:
#Doom
 game_concept_doom_of_valyria:0 "Fléau de Valyria"
 game_concept_doom_of_valyria_desc:0 "Le #bold Fléau de Valyria#!, ou simplement le #bold Fléau#!, fut un cataclysme de nature indéterminée qui provoqua l'effondrement des [valyrian_freehold|E], lesquelles avaient prospéré pendant cinq mille ans. Il survint environ un siècle avant la Conquête d'Aegon sur [westeros|E], en 102 av. C. Sortilèges, savoirs et archives historiques furent perdus dans le #bold Fléau#!, et le Siècle de Sang suivit le désastre."
 game_concept_doom:0 "Fléau"

#[valyrian_freehold|E]
 game_concept_valyrian_freehold_short:0 "Possessions"
 game_concept_valyrian_freehold:0 "Possessions Valyriennes"
 game_concept_valyrian_freehold_desc:0 "Les #bold Possessions Valyriennes#! étaient un vaste territoire qui s'étendait sur une grande partie du continent d'[essos|E], mais qui est depuis tombé en ruines. Elles furent détruites environ cent ans avant la Conquête d'Aegon, lorsqu'elles furent anéanties par un événement cataclysmique connu sous le nom de [doom_of_valyria|E].\n\nÀ leur apogée, les #bold Possessions Valyriennes#! englobaient la majeure partie du continent oriental et s'étendaient jusqu'aux actuelles [free_cities|E] et l'île de Peyredragon au large des côtes de [westeros|E]. Les #bold Possessions#! ne furent techniquement jamais un empire, mais par commodité elles sont souvent désignées comme tel.\n\nLes #bold Possessions#! étaient une civilisation avancée, et la puissance militaire et culturelle dominante du monde connu. Leur capitale était la cité de Valyria. Les #bold Possessions#! étaient gouvernées par les lords des possessions, de puissantes familles nobles. Les plus puissantes d'entre elles étaient les [dragonlords|El]."
 game_concept_the_freehold:0 "Les Possessions"

#Dragonlords
 game_concept_dragonlord:0 "Lord Dragon"
 game_concept_dragonlords:0 "Lords Dragons"
 game_concept_dragonlord_desc:0 "Les #bold Lords Dragons#! étaient les nobles les plus puissants des [valyrian_freehold|E], pratiquant l'[dragon_riding|El]. Certains membres de la Maison Targaryen, comme Aegon le Conquérant, ont été désignés comme « Lords Dragons » après le [doom_of_valyria|E] et la destruction de la civilisation."

#Dragonrider
 game_concept_dragonrider:0 "Dragonnier"
 game_concept_dragonriders:0 "Dragonniers"
 game_concept_dragon_riding:0 "Monte de dragon"
 game_concept_dragonrider_desc:0 "Un [GetTrait('dragonrider').GetName(GetNullCharacter)] est une personne dont la monture est un [dragon|E].\n\nLes [GetTrait('dragonrider').GetName(GetNullCharacter)]s se trouvaient parmi les familles de [dragonlord|El] des [valyrian_freehold|E], lorsque [the_freehold|E] étaient encore puissantes.\n\nLes Targaryen étaient l'une de ces familles de lords dragons, bien que loin d'être la plus puissante, et furent les derniers [GetTrait('dragonrider').GetName(GetNullCharacter)]s connus à survivre au [doom_of_valyria|E] et à ses suites."

#Continents
  game_concept_known_world:0 "Monde connu"
  game_concept_three_known_continents:0 "Trois continents connus"
  game_concept_known_world_desc:0 "Le #bold monde connu#! est composé d'au moins trois continents ([westeros|E], [essos|E] et [sothoryos|E]), d'une grande masse terrestre ([ulthos|E]) et d'un grand nombre d'îles plus petites.\n\nAucune des quatre grandes masses terrestres n'a été entièrement cartographiée, et une grande partie du monde demeure inexplorée.\n\nBien que les [maesters|El] de [westeros|E] connaissent beaucoup de choses sur les terres de l'extrême orient, la distance reste un obstacle, et au-delà d'un certain point, mythes et légendes entrent en jeu dans leurs archives."
  #Westeros
   game_concept_westeros:0 "Westeros"
   game_concept_westerosi:0 "Westerosi"
   game_concept_westeros_desc:0 "#bold Westeros#! est l'un des [three_known_continents|E] du [known_world|E], les autres étant [essos|E] et [sothoryos|E]. La majeure partie de la superficie de #bold Westeros#! est couverte par une entité politique connue sous le nom des [seven_kingdoms|E], tandis que l'extrême nord au-delà du Mur abrite le peuple libre.\n\nLes nations étrangères les plus proches de #bold Westeros#! sont les [free_cities|E]. Au sud de #bold Westeros#! se trouvent les Îles d'Été."
   game_concept_seven_kingdoms:0 "Sept Couronnes"
   game_concept_seven_kingdoms_desc:0 "Les #bold Sept Couronnes#! sont un royaume situé sur le continent de [westeros|E], gouverné par un monarque titré Roi des [andals|E], des [rhoynar|E] et des [first_men|E] et Lord des #bold Sept Couronnes#!, le roi qui siège sur le Trône de Fer dans la capitale, Port-Réal. Leur nom dérive de la situation trois siècles plus tôt, quand Aegon le Conquérant entreprit d'unifier les terres de [westeros|E], alors gouvernées par sept royaumes indépendants, outre les terres [beyond_the_wall|E]. Le nouveau royaume créé par la Conquête d'Aegon est divisé en neuf régions ou provinces distinctes."
   game_concept_narrow_sea:0 "Détroit"
   game_concept_narrow_sea_desc:0 "Le #bold Détroit#! est la mer située entre les continents de [westeros|E] à l'ouest et d'[essos|E] à l'est. La mer est relativement étroite et facile à traverser, mais suffisamment large pour rendre difficiles les invasions à grande échelle et les incursions militaires entre les [seven_kingdoms|E] et les [free_cities|E].\n\nIl existe un commerce régulier à travers le Détroit entre les deux continents et le Port d'Ibben. Les nobles [westerosi|E] sont parfois élevés ou cherchent refuge dans les cités de l'autre côté des eaux."
   game_concept_others:0 "Autres"
   game_concept_white_walkers:0 "Marcheurs Blancs"
   game_concept_cold_gods:0 "Dieux froids"
   game_concept_white_shadows:0 "Ombres blanches"
   game_concept_cold_shadows:0 "Ombres froides"
   game_concept_others_desc:0 "Les #bold Autres#!, également connus sous le nom de #bold Marcheurs Blancs#!, #bold dieux froids#!, #bold ombres blanches#! et #bold ombres froides#!, sont une espèce d'êtres humanoïdes qui existent dans le nord au-delà du [watch_wall|E]. Comme ils n'ont pas été aperçus depuis six à huit mille ans, ils sont considérés comme éteints."
   game_concept_watch_wall:0 "Mur"
   game_concept_watch_wall_desc:0 "Le #bold Mur#! est une barrière massive principalement constituée de glace qui s'étend le long de la frontière nord des [seven_kingdoms|E], la séparant des [wild_lands_beyond|E]. Le #bold Mur#! mesure cent lieues de long (trois cents miles) et atteint plus de sept cents pieds à son point le plus haut, bien que certains blocs de fondation dans les régions vallonnées, comme près de Gardegivre, le portent à neuf cents pieds dans les airs.\n\nL'une des neuf Merveilles Faites par l'Homme de Lomas Longstrider, le #bold Mur#! est défendu et tenu par les Frères Jurés de la [nw_govt|E], qui patrouillent et gardent dix-neuf châteaux depuis la chaîne de montagnes des Crocgivre à l'ouest jusqu'à la Baie des Phoques à l'est. Seuls Tour Ombreuse, Châteaunoir et Fort-Levant sont garnis au début du #bold Trône de Fer#!. Ceux qui rejoignent la Garde pour éviter une autre punition peuvent être désignés comme #bold envoyés au Mur#!."
   game_concept_beyond_the_wall:0 "Au-delà du Mur"
   game_concept_wild_lands_beyond:0 "Terres sauvages d'au-delà"
   game_concept_beyond_the_wall_desc:0 "#bold Au-delà du Mur#! est un terme général désignant la région la plus septentrionale de [westeros|E], les terres au nord du [watch_wall|E] et des [seven_kingdoms|E]."
   game_concept_age_of_heroes:0 "Âge des Héros"
   game_concept_age_of_heroes_desc:0 "L'#bold Âge des Héros#! était une ère de l'histoire [westerosi|E] antérieure à l'[coming_of_the_andals|E]. Il tire son nom des grands hommes et femmes qui vécurent durant les années de paix qui suivirent la conclusion du [pact|E] entre les [first_men|E] et les [children_of_the_forest|E]. De nombreuses maisons nobles font remonter leur histoire familiale à l'#bold Âge des Héros#!, bien qu'il soit difficile pour les historiens de distinguer la vérité de la légende."
   game_concept_dawn_age:0 "Âge de l'Aube"
   game_concept_dawn_age_desc:0 "L'#bold Âge de l'Aube#!, également appelé l'#bold Aube des Jours#! ou les #bold siècles de l'aube#!, fut une période de durée indéterminée durant laquelle les [first_men|E] arrivèrent d'[essos|E] et commencèrent à coloniser [westeros|E]. Avant eux, les [children_of_the_forest|E], êtres mystérieux et chétifs dotés de dons surnaturels, habitaient ces terres, vénérant les [nameless_gods|E] de la nature et vivant en harmonie avec elle, possiblement aux côtés des géants."
   game_concept_long_night:0 "Longue Nuit"
   game_concept_long_night_desc:0 "La #bold Longue Nuit#! est le nom donné par les [westerosi|E] à une période où de terribles ténèbres s'abattirent sur le [known_world|E]. Elle survint durant l'[age_of_heroes|E], environ huit mille ans avant la Conquête d'Aegon, au milieu d'un grand hiver qui dura des années. La #bold Longue Nuit#! perdura une génération entière et sema la désolation par la famine et la terreur."
   game_concept_first_men:0 "Premiers Hommes"
   game_concept_first_men_desc:0 "Les #bold Premiers Hommes#! sont l'un des trois principaux groupes ethniques dont descendent les humains de [westeros|E], les autres étant les [andals|E] et les [rhoynar|E]. Les #bold Premiers Hommes#! furent la première culture humaine à fouler le continent. L'influence des #bold Premiers Hommes#! se fait encore sentir à [westeros|E], plus fortement dans le nord. Le Lord des [seven_kingdoms|E], le roi sur le Trône de Fer, prétend être le Roi des [andals|E], des [rhoynar|E] et des #bold Premiers Hommes#!."
   game_concept_andal:0 "Andal"
   game_concept_andals:0 "Andals"
   game_concept_andal_desc:0 "Les #bold Andals#! sont l'un des trois principaux groupes ethniques dont descendent les humains de [westeros|E], les autres étant les [first_men|E] et les [rhoynar|E]. L'[coming_of_the_andals|E] à [westeros|E] provoqua la chute de nombreux royaumes des [first_men|E] qui s'étaient développés à la suite de leur [pact|E] avec les [children_of_the_forest|E].\n\nLes #bold Andals#! apportèrent également la Foi des Sept sur le continent. Le Lord des [seven_kingdoms|E], le roi sur le Trône de Fer, prétend être le Roi des #bold Andals#!, des [rhoynar|E] et des [first_men|E].\n\nLes [dothraki|E] désignent [westeros|E] comme Rhaesh Andahli, la terre des #bold Andals#!."
   game_concept_rhoynar:0 "Rhoynar"
   game_concept_rhoynar_desc:0 "Les #bold Rhoynars#! sont l'un des trois principaux groupes ethniques dont descendent les humains de [westeros|E], les autres étant les [andals|E] et les [first_men|E]. C'était une culture de gens du fleuve qui vivaient sur les rives de l'immense #bold Rhoyne#! en [essos|E]. Après avoir été contraints de fuir sur dix mille navires durant les Guerres Rhoynaises contre Valyria, les #bold Rhoynars#! survivants s'établirent finalement à Dorne, dans le sud de [westeros|E].\n\nBien que la plupart des #bold Rhoynars#! se soient intégrés à la société dornienne, en particulier aux « Dorniens salés », les orphelins du Sang-vert ont conservé leur héritage et leur langue rhoynars. Le Lord des [seven_kingdoms|E], qui siège sur le Trône de Fer, revendique le titre de Roi des [andals|E], des Rhoynars et des [first_men|E]."
   game_concept_coming_of_the_andals:0 "Arrivée des Andals"
   game_concept_coming_of_the_andals_desc:0 "L'#bold arrivée des Andals#!, la #bold traversée des Andals#! ou l'#bold invasion des Andals#! désigne la migration des [andals|E] d'[essos|E] vers [westeros|E]. L'époque à laquelle cela se produisit est disputée ; certaines sources indiquent il y a six mille ans, la Vraie Histoire affirme il y a quatre mille ans, et certains [maesters|E] comme Denestan prétendent il y a deux mille ans.\n\nDe nombreux petits royaumes des [first_men|E] furent détruits par les envahisseurs [andal|E] et les [children_of_the_forest|E] furent repoussés vers le nord. La prise de contrôle fut parfois pacifique, cependant, par des mariages mixtes entre [andals|E] et [first_men|E]."
   game_concept_children_of_the_forest:0 "Enfants de la forêt"
   game_concept_children_of_the_forest_desc:0 "Les #bold enfants de la forêt#!, parfois simplement appelés les #bold enfants#!, sont une mystérieuse race non humaine qui habitait à l'origine le continent de [westeros|E] durant l'[dawn_age|E], bien avant l'arrivée des [first_men|E] il y a des milliers d'années. Les géants les appellent woh dak nag gram (petit peuple écureuil). Ils se nomment eux-mêmes #bold ceux qui chantent le chant de la terre#! dans la Vraie Langue. Les #bold enfants#! n'ont pas été vus par les hommes depuis des centaines d'années."
   game_concept_pact:0 "Pacte"
   game_concept_pact_desc:0 "Le #bold Pacte de l'Île aux Faces#! mit fin à l'antique guerre entre les [first_men|E] et les [children_of_the_forest|E] il y a plus de 10 000 ans. Il fut signé sur une île dans l'#bold Œildieu#!, où des visages furent sculptés dans les barrals afin que les dieux puissent être témoins du traité. Les hommes verts furent chargés de garder l'île.\n\nLe #bold Pacte#! perdura tout au long de l'[age_of_heroes|E], de la [long_night|E] et de l'ascension des [seven_kingdoms|E], jusqu'à ce que, bien des siècles plus tard, les [andals|E] traversent le [narrow_sea|E], apportant un grand changement à [westeros|E]."
   game_concept_old_gods:0 "Anciens Dieux"
   game_concept_nameless_gods:0 "Dieux sans nom"
   game_concept_old_gods_desc:0 "Les #bold anciens dieux#! sont des divinités sans nom de la forêt, du ruisseau et de la pierre, encore vénérées dans les [seven_kingdoms|E] principalement dans le nord de [westeros|E] et au-delà du [watch_wall|E]. Bien que la Foi des Sept les ait remplacés dans la plupart des régions, la croyance aux #bold anciens dieux#! persiste parmi les nordiens, les paludiers et le peuple libre. De nombreux [westerosi|E] jurent encore par les anciens et les nouveaux."

   #Sothoryos
   game_concept_sothoryos:0 "Sothoryos"
   game_concept_sothoros:0 "Sothoros"
   game_concept_sothoryos_desc:0 "#bold Sothoryos#! ou #bold Sothoros#! est l'un des [three_known_continents|E] du monde. Il se situe au sud-est de [westeros|E] et au sud d'[essos|E] de l'autre côté de la [summer_sea|E]. À l'est de #bold Sothoryos#! se trouve le sud de la Mer de Jade."
  #Essos
   game_concept_essos:0 "Essos"
   game_concept_essosi:0 "Essosi"
   game_concept_the_east:0 "Orient"
   game_concept_essos_desc:0 "#bold Essos#!, souvent simplement appelé l'orient, est le plus grand des [three_known_continents|El] du monde.\n\nIl se situe à l'est de [westeros|E] et au nord de [sothoryos|E] et d'[ulthos|E], s'étendant de la Mer Grelotte au nord à la Mer d'Été au sud, et du Détroit à l'ouest aux terres entourant la Mer de Jade à l'est, voire au-delà.\n\n#bold Essos#! est peuplé de nombreux peuples différents et possède une géographie vaste et variée."
   game_concept_summer_sea:0 "Mer d'Été"
   game_concept_summer_sea_desc:0 "La #bold Mer d'Été#! est l'un des principaux océans du [known_world]. Elle est située au sud de [westeros|E] et d'[essos|E], séparant ces continents de la masse terrestre méridionale de [sothoryos|E]. Elle est séparée du [narrow_sea|E] par les îles connues sous le nom de Degrés de Pierre, et de la Mer de Jade par les Détroits de Qarth. La Baie des Serfs et le Golfe des Chagrins sont de grandes échancrures de la #bold Mer d'Été#!, et la [valyrian_peninsula|E] s'y avance."
   #Free cities
    game_concept_free_cities:0 "Cités Libres"
    game_concept_free_city:0 "Cité Libre"
    game_concept_free_cities_desc:0 "Les #bold Cités Libres#!, également appelées les #bold Neuf Cités Libres#!, sont un groupe de neuf cités-états indépendantes dans l'ouest d'[essos|E], situées à l'ouest de la [dothraki_sea|E] et des Montagnes Peintes et au nord-ouest de la péninsule valyrienne.\n\nLes #bold Cités Libres#! commercent et interagissent fréquemment avec les [seven_kingdoms|E] de [westeros|E]. Beaucoup dans les #bold Cités Libres#! se considèrent plus sophistiqués que les Westerosi, certains considérant les habitants des [seven_kingdoms|E] comme des sauvages."
   #Dothraki
    game_concept_dothraki_sea:0 "Mer Dothrak"
    game_concept_dothraki_sea_desc:0 "La #bold Mer Dothrak#!, également connue sous le nom de #bold Grande Mer d'Herbe#!, les #bold Terres Hantées#! et la #bold Grande Désolation#!, est une vaste région intérieure du continent d'[essos|E], située à l'est des [free_cities|E], au nord de la Baie des Serfs et à l'ouest des Montagnes des Os.\n\nSon paysage de steppes et de plaines abrite le peuple équestre nomade des [dothraki|E], qui se battent constamment entre eux et pillent les terres environnantes."
    game_concept_dothraki:0 "Dothrakis"
    game_concept_dothraki_desc:0 "Le peuple #bold Dothraki#! est une culture de guerriers nomades d'[essos|E] qui parcourent les vastes prairies de la [dothraki_sea|E] en hordes appelées khalasars. Les habitants des [seven_kingdoms|E] et des [free_cities|E] désignent également les #bold Dothrakis#! comme seigneurs des chevaux."
  #Ulthos
   game_concept_ulthos:0 "Ulthos"
   game_concept_ulthos_desc:0 "#bold Ulthos#! est une masse terrestre située à l'extrême orient, qui peut ou non être un autre continent. Elle se trouve au sud d'Asshaï et des Contrées de l'Ombre en [essos|E] et à l'est de [sothoryos|E]. Elle est séparée des Contrées de l'Ombre par les Détroits de Safran. L'île d'Ulos est située dans les détroits entre #bold Ulthos#! et [essos|E].\n\nPeu de choses sont connues sur #bold Ulthos#! hormis son emplacement et le fait qu'elle est couverte de jungle dense."
  #Valyria
   game_concept_valyria:0 "Valyria"
   game_concept_old_valyria:0 "Ancienne Valyria"
   game_concept_valyria_desc:0 "L'#bold Ancienne Valyria#!, originellement connue simplement sous le nom de #bold Valyria#!, était la cité capitale de la civilisation jadis glorieuse connue sous le nom de [valyrian_freehold|E]. La cité de Valyria est située sur le continent oriental d'[essos|E], au sud-est des [free_cities|E], sur la [valyrian_peninsula|E], une grande péninsule s'étendant vers le sud dans la [summer_sea|E]."
   game_concept_valyrian_peninsula:0 "Péninsule valyrienne"
   game_concept_valyrian_peninsula_desc:0 "La #bold péninsule valyrienne#! est un grand et large promontoire s'étendant vers le sud depuis [essos|E] dans la [summer_sea|E], le cœur des [valyrian_freehold|E] désormais éteintes et l'emplacement de leur cité capitale, [valyria|E]. Partiellement détruite par le [doom|E], avec de nombreuses îles formées et des zones basses inondées, devenant la [smoking_sea|E]."
   game_concept_smoking_sea:0 "Mer Fumante"
   game_concept_smoking_sea_desc:0 "La #bold Mer Fumante#! est une étendue d'eau située immédiatement au sud de la [valyrian_peninsula|E], sur la côte sud d'[essos|E]. Elle fait partie de l'océan connu sous le nom de [summer_sea|E]. Formée par le [doom_of_valyria|E], la #bold Mer Fumante#! sépare les nombreuses îles qui faisaient autrefois partie de [valyria|E] les unes des autres et du continent au nord."

#Crafting
 game_concept_resources:0 "Ressources"
 game_concept_resources_desc:0 "Les ressources incluent le [zz_iron|E], l'[zz_steel|E], l'[zz_obsidian|E] et l'[zz_valyrian_steel|E] qui constituent les stocks de matériaux d'un royaume pour l'artisanat. Des bâtiments générateurs de ressources peuvent être construits dans toute province possédant un domaine."
 game_concept_crafting_resources_tooltip:0 "@lov_icon_resources!"

 zz_iron:0 "Fer"
 game_concept_zz_iron:0 "$zz_iron$"
 game_concept_zz_iron_desc:0 "Le fer est un métal résistant souvent utilisé pour les outils et l'armement, et peut être extrait dans les provinces disposant d'une mine de fer. C'est le métal de base de l'[zz_steel|E]."
 game_concept_iron_tooltip:0 "@lov_icon_iron!"
 
 zz_steel:0 "Acier"
 game_concept_zz_steel:0 "$zz_steel$"
 game_concept_zz_steel_desc:0 "L'acier est un alliage dur de [zz_iron|E] et de carbone souvent utilisé pour fabriquer armes et armures. Les forges d'acier produisent de l'acier et nécessitent des mines de fer pour être construites."
 game_concept_steel_tooltip:0 "@lov_icon_steel!"

 zz_obsidian:0 "Obsidienne"
 game_concept_zz_obsidian:0 "$zz_obsidian$"
 game_concept_zz_obsidian_desc:0 "L'obsidienne, communément appelée verredragon par le petit peuple, est un verre volcanique formé par une chaleur et une pression immenses dans la terre. Les provinces possédant des gisements d'obsidienne, généralement des provinces avec des volcans, peuvent produire de l'obsidienne à partir de mines d'obsidienne dédiées."
 game_concept_obsidian_tooltip:0 "@lov_icon_obsidian!"

 zz_valyrian_steel:0 "Acier Valyrien"
 game_concept_zz_valyrian_steel:0 "$zz_valyrian_steel$"
 game_concept_zz_valyrian_steel_desc:0 "L'Acier Valyrien est un type d'[zz_steel|E] originaire de Valyria, utilisé pour fabriquer des armes et divers autres objets d'une qualité inégalée. La magie joue un rôle dans sa forge, ce qui rend l'acier spécial et lui confère des caractéristiques magiques. Les [dragonlords|E] peuvent produire de l'Acier Valyrien dans des forges d'Acier Valyrien spéciales qui peuvent être construites dans les provinces disposant de mines de fer."
 game_concept_zz_v_steel:0 "Acier V."
 game_concept_v_steel_tooltip:0 "@lov_icon_valyrian_steel!"
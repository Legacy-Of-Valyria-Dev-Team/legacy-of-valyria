l_french:

 game_concept_wilderness_holding:0 "Terres Sauvages"
 game_concept_wilderness_holding_desc:0 "Le temps et la négligence ont laissé cette terre comme l’ombre d’elle-même. Ce qui tient encore debout est fendu et brisé, témoignage du passé et avertissement pour l’avenir."
 game_concept_wilderness_holdings:0 "Domaines Sauvages"
 game_concept_wilderness_holdings_desc:0 "Le temps et la négligence ont laissé cette terre comme l’ombre d’elle-même. Ce qui tient encore debout est fendu et brisé, témoignage du passé et avertissement pour l’avenir."

 game_concept_colony_holding:0 "Colonie"
 game_concept_colony_holding_desc:0 "Une colonie naissante taillée dans les terres sauvages, où pionniers et colons s’efforcent d’établir une base dans des terres indomptées. Bien que vulnérable, elle sert de fondation à l’expansion future, apportant ordre, commerce et stabilité à la frontière."
 game_concept_colony_holdings:0 "Domaines Coloniaux"
 game_concept_colony_holdings_desc:0 "Des colonies naissantes taillées dans les terres sauvages, où pionniers et colons s’efforcent d’établir une base dans des terres indomptées. Bien que vulnérables, elles servent de fondation à l’expansion future, apportant ordre, commerce et stabilité à la frontière."
 game_concept_colony:0 "Colonie"
 game_concept_colony_desc:0 "Une colonie naissante taillée dans les terres sauvages, où pionniers et colons s’efforcent d’établir une base dans des terres indomptées. Bien que vulnérable, elle sert de fondation à l’expansion future, apportant ordre, commerce et stabilité à la frontière."
 game_concept_colonies:0 "Colonies"
 game_concept_colonies_desc:0 "Des colonies naissantes taillées dans les terres sauvages, où pionniers et colons s’efforcent d’établir une base dans des terres indomptées. Bien que vulnérables, elles servent de fondation à l’expansion future, apportant ordre, commerce et stabilité à la frontière."

#Doom
 game_concept_doom_of_valyria:0 "Fléau de Valyria"
 game_concept_doom_of_valyria_desc:0 "#bold Le Fléau de Valyria#!, ou simplement le #bold Fléau#!, fut un cataclysme de nature inconnue qui causa l’effondrement des [valyrian_freehold|E], qui avaient prospéré pendant cinq mille ans. Il se produisit environ un siècle avant la Conquête d’Aegon sur Westeros, en 102 av.C.. Sorts, savoirs et histoires enregistrées furent perdus dans le #bold Fléau#!, et le Siècle de Sang s’ensuivit."
 game_concept_doom:0 "Fléau"
 #game_concept_doom_desc:0 "#bold Le Fléau de Valyria#!, ou simplement le #bold Fléau#!, fut un cataclysme de nature inconnue qui causa l’effondrement des [valyrian_freehold|E], qui avaient prospéré pendant cinq mille ans. Il se produisit environ un siècle avant la Conquête d’Aegon sur Westeros, en 102 av.C.. Sorts, savoirs et histoires enregistrées furent perdus dans le #bold Fléau#!, et le Siècle de Sang s’ensuivit."

#Valyrian Freehold
 game_concept_valyrian_freehold:0 "Les possessions valyriennes"
 game_concept_valyrian_freehold_desc:0 "Les #bold possessions valyriennes#! constituaient un vaste territoire couvrant une grande partie du continent d’[essos|E], aujourd’hui en ruines. Elles furent détruites environ cent ans avant la Conquête d’Aegon, lors d’un cataclysme appelé le [doom_of_valyria|E].\n\nÀ leur apogée, les #bold possessions#! englobèrent la majeure partie du continent oriental, s’étendant jusqu’aux actuelles [free_cities|E] et jusqu’à l’île de Peyredragon au large de [westeros|E]. #bold Les possessions#! n’étaient techniquement pas un empire, mais on les désigne ainsi par commodité.\n\n#bold Les possessions#! formaient une civilisation avancée et la puissance militaire et culturelle dominante du monde connu. Leur capitale était la cité de Valyria. #bold Les possessions#! étaient dirigées par les seigneurs possédants, de puissantes familles nobles. Les plus puissantes d’entre elles étaient les [dragonlords|El]."
 game_concept_freehold:0 "Possessions"
 #game_concept_freehold_desc:0 "Les #bold possessions valyriennes#! constituaient un vaste territoire couvrant une grande partie du continent d’[essos|E], aujourd’hui en ruines. Elles furent détruites environ cent ans avant la Conquête d’Aegon, lors d’un cataclysme appelé le [doom_of_valyria|E].\n\nÀ leur apogée, les #bold possessions#! englobèrent la majeure partie du continent oriental, s’étendant jusqu’aux actuelles Cités Libres et jusqu’à l’île de Peyredragon au large de Westeros. #bold Les possessions#! n’étaient techniquement pas un empire, mais on les désigne ainsi par commodité.\n\n#bold Les possessions#! formaient une civilisation avancée et la puissance militaire et culturelle dominante du monde connu. Leur capitale était la cité de Valyria. #bold Les possessions#! étaient dirigées par les seigneurs possédants, de puissantes familles nobles. Les plus puissantes d’entre elles étaient les [dragonlords|El]."

#Dragonlords
 game_concept_dragonlord:0 "Seigneur-Dragon"
 game_concept_dragonlords:0 "Seigneurs-Dragons"
 game_concept_dragonlord_desc:0 "Les #bold Seigneurs-Dragons#! étaient les nobles les plus puissants [dragon_riding|El] des [valyrian_freehold|E]. Certains membres de la maison Targaryen, tels qu’Aegon le Conquérant, furent appelés « Seigneurs-Dragons » après le [doom_of_valyria|E] et la destruction de leur civilisation."

#Dragonrider
 game_concept_dragonrider:0 "Cavalier de dragon"
 game_concept_dragonriders:0 "Cavaliers de dragon"
 game_concept_dragon_riding:0 "Équitation draconique"
 game_concept_dragonrider_desc:0 "Un [GetTrait('dragonrider').GetName(GetNullCharacter)] est une personne dont la monture est un [dragon|E].\n\nLes [GetTrait('dragonrider').GetName(GetNullCharacter)]s se trouvaient parmi les familles des [dragonlord|El] dans les [valyrian_freehold|E], lorsque les [freehold|E] étaient encore puissantes.\n\nLes Targaryen étaient l’une de ces familles de Seigneurs-Dragons, bien qu’ils ne fussent pas les plus puissants, et furent les derniers [GetTrait('dragonrider').GetName(GetNullCharacter)]s connus à survivre au [doom_of_valyria|E] et à ses conséquences."

#Continents
  game_concept_known_world:0 "Monde connu"
  game_concept_three_known_continents:0 "Trois continents connus"
  game_concept_known_world_desc:0 "#bold Le monde connu#! est composé d'au moins trois continents ([westeros|E], [essos|E], et [sothoryos|E]), d'une grande masse terrestre ([ulthos|E]) et de nombreuses petites îles.\n\nAucune des quatre principales masses terrestres n’a été entièrement cartographiée, et une grande partie du monde demeure inexplorée.\n\nBien que les [maesters|El] de [westeros|E] aient une bonne connaissance des terres à l’est lointain, la distance reste un problème, et au-delà d’un certain point, les mythes et légendes altèrent leurs récits."
  #Westeros
   game_concept_westeros:0 "Westeros"
   game_concept_westeros_desc:0 "#bold Westeros#! est l’un des [three_known_continents|E] du [known_world|E], les autres étant [essos|E] et [sothoryos|E]. La majeure partie de #bold Westeros#! est couverte par une entité politique appelée les [seven_kingdoms|E], tandis que le Grand Nord au-delà du Mur comprend les peuples libres.\n\nLes nations étrangères les plus proches de #bold Westeros#! sont les [free_cities|E]. Au sud de #bold Westeros#! se trouvent les Îles d'Été."
   game_concept_seven_kingdoms:0 "Sept Royaumes"
   game_concept_seven_kingdoms_desc:0 "#bold Les Sept Royaumes#! sont un royaume situé sur le continent de [westeros|E], dirigé par un monarque portant le titre de Roi des Andals, des Rhoynars et des Premiers Hommes, et Seigneur des Sept Royaumes, le roi siégeant sur le Trône de Fer dans la capitale, Port-Réal. Le nom provient de la situation d’il y a trois siècles, lorsque Aegon le Conquérant entreprit d’unifier les terres de [westeros|E], alors divisées en sept royaumes indépendants, sans compter les terres au-delà du Mur. Le nouveau royaume issu de la Conquête d’Aegon est divisé en neuf régions ou provinces distinctes."
   game_concept_narrow_sea:0 "Mer étroite"
   game_concept_narrow_sea_desc:0 "#bold La mer étroite#! est la mer qui sépare les continents de [westeros|E] à l’ouest et [essos|E] à l’est. Elle est relativement étroite et facile à traverser, mais assez large pour rendre les invasions à grande échelle et les incursions militaires entre les [seven_kingdoms|E] et les [free_cities|E] difficiles.\n\nLe commerce est régulier entre les deux continents par-delà la mer étroite, notamment avec le port d’Ibben. Les nobles de Westeros y sont parfois envoyés comme pupilles ou y cherchent refuge."
  #Sothoryos
   game_concept_sothoryos:0 "Sothoryos"
   game_concept_sothoros:0 "Sothoros"
   game_concept_sothoryos_desc:0 "#bold Sothoryos#! ou #bold Sothoros#! est l’un des [three_known_continents|E] du monde. Il se situe au sud-est de [westeros|E] et au sud de [essos|E] au-delà de la Mer d’Été. À l’est de #bold Sothoryos#! se trouve la mer de Jade méridionale."
  #Essos
   game_concept_essos:0 "Essos"
   game_concept_the_east:0 "Orient"
   game_concept_essos_desc:0 "#bold Essos#!, souvent simplement appelé l'Orient, est le plus vaste des [three_known_continents|El] du monde.\n\nIl se trouve à l’est de [westeros|E], au nord de [sothoryos|E] et [ulthos|E], s’étendant de la mer Frissonnante au nord jusqu’à la Mer d’Été au sud, et de la mer étroite à l’ouest jusqu’aux terres entourant la mer de Jade à l’est, voire au-delà.\n\n#bold Essos#! est peuplé par de nombreux peuples différents et possède une géographie vaste et variée."
   #Free Cities
    game_concept_free_cities:0 "Cités libres"
    game_concept_free_city:0 "Cité libre"
    game_concept_free_cities_desc:0 "#bold Les Cités Libres#!, aussi appelées les #bold Neuf Cités Libres#!, sont un groupe de neuf cités-États indépendantes situées à l’ouest de [essos|E], à l’ouest de la [dothraki_sea|E] et des Montagnes Peintes, et au nord-ouest de la péninsule valyrienne.\n\n#bold Les Cités Libres#! commercent et interagissent fréquemment avec les [seven_kingdoms|E] de [westeros|E]. Beaucoup d’habitants des #bold Cités Libres#! se considèrent plus raffinés que les Westerosi, certains allant jusqu’à les considérer comme des sauvages."
   #Dothraki
    game_concept_dothraki_sea:0 "Mer Dothraki"
    game_concept_dothraki_sea_desc:0 "#bold La mer Dothraki#!, également connue comme la #bold Grande Mer d’Herbe#!, les #bold Terres Hantées#! et la #bold Grande Désolation#!, est une vaste région intérieure du continent de [essos|E], située à l’est des [free_cities|E], au nord de la Baie des Serfs, et à l’ouest des Montagnes Osseuses.\n\nSon paysage de steppes et de plaines abrite les [dothraki|E], un peuple équestre nomade qui se bat en permanence entre eux et pille les terres environnantes."
    game_concept_dothraki:0 "Dothrakis"
    game_concept_dothraki_desc:0 "Le peuple #bold Dothraki#! est une culture de guerriers nomades de [essos|E] qui parcourent les vastes prairies de la [dothraki_sea|E] en hordes appelées khalasars. Les habitants des [seven_kingdoms|E] et des [free_cities|E] les appellent aussi #bold seigneurs des chevaux#!."
  #Ulthos
   game_concept_ulthos:0 "Ulthos"
   game_concept_ulthos_desc:0 "#bold Ulthos#! est une masse terrestre située à l’extrême est, qui pourrait être ou non un autre continent. Elle se trouve au sud d’Asshaï et des Terres de l’Ombre en [essos|E], et à l’est de [sothoryos|E]. Elle est séparée des Terres de l’Ombre par les Détroits du Safran. L’île d’Ulos est située entre #bold Ulthos#! et [essos|E].\n\nOn sait peu de choses sur #bold Ulthos#!, si ce n’est son emplacement et qu’elle est couverte de jungle dense."


#Crafting
 game_concept_resources:0 "Ressources"
 game_concept_resources_desc:0 "Les ressources incluent [zz_iron|E], [zz_steel|E], [zz_obsidian|E], et [zz_valyrian_steel|E], qui constituent le stock de matériaux d’un domaine pour l’artisanat. Des bâtiments générateurs de ressources peuvent être construits dans toute province disposant d’un domaine."
 game_concept_crafting_resources_tooltip:0 "@lov_icon_resources!"

 zz_iron:0 "Fer"
 game_concept_zz_iron:0 "$zz_iron$"
 game_concept_zz_iron_desc:0 "Le fer est un métal solide souvent utilisé pour les outils et l’armement. Il peut être extrait dans les provinces dotées d’une mine de fer. Il constitue le métal de base du [zz_steel|E]."
 game_concept_iron_tooltip:0 "@lov_icon_iron!"

 zz_steel:0 "Acier"
 game_concept_zz_steel:0 "$zz_steel$"
 game_concept_zz_steel_desc:0 "L’acier est un alliage dur de [zz_iron|E] et de carbone, souvent utilisé pour fabriquer armes et armures. Les forges à acier produisent de l’acier et nécessitent des mines de fer pour être construites."
 game_concept_steel_tooltip:0 "@lov_icon_steel!"

 zz_obsidian:0 "Obsidienne"
 game_concept_zz_obsidian:0 "$zz_obsidian$"
 game_concept_zz_obsidian_desc:0 "L’obsidienne, souvent appelée verredragon par les petites gens, est un verre volcanique formé par une chaleur et une pression extrêmes dans la terre. Les provinces avec des dépôts d’obsidienne — typiquement des provinces volcaniques — peuvent en produire grâce à des mines dédiées."
 game_concept_obsidian_tooltip:0 "@lov_icon_obsidian!"

 zz_valyrian_steel:0 "Acier valyrien"
 game_concept_zz_valyrian_steel:0 "$zz_valyrian_steel$"
 game_concept_zz_valyrian_steel_desc:0 "L’acier valyrien est un type de [zz_steel|E] originaire de Valyria, utilisé pour forger des armes et divers objets d’une qualité inégalée. La magie joue un rôle dans sa forge, ce qui confère à l’acier ses propriétés uniques. Les [dragonlords|E] peuvent produire de l’acier valyrien dans des forges spéciales, construites dans des provinces disposant de mines de fer."
 game_concept_zz_v_steel:0 "A. valyrien"
 game_concept_v_steel_tooltip:0 "@lov_icon_valyrian_steel!"
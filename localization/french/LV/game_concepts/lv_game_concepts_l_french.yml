l_french:

 game_concept_wilderness:0 "Terres Sauvages"
 game_concept_wilderness_holding:0 "Terres Sauvages"
 game_concept_wilderness_holding_desc:0 "Le temps et la négligence ont laissé cette terre comme l’ombre d’elle-même. Ce qui tient encore debout est fendu et brisé, témoignage du passé et avertissement pour l’avenir."
 game_concept_wilderness_holdings:0 "Domaines Sauvages"
 game_concept_wilderness_holdings_desc:0 "Le temps et la négligence ont laissé cette terre comme l’ombre d’elle-même. Ce qui tient encore debout est fendu et brisé, témoignage du passé et avertissement pour l’avenir."
 
 game_concept_colony_holding:0 "Colonie"
 game_concept_colony_holding_desc:0 "Une colonie naissante taillée dans les terres sauvages, où pionniers et colons s’efforcent d’établir une base dans des terres indomptées. Bien que vulnérable, elle sert de fondation à l’expansion future, apportant ordre, commerce et stabilité à la frontière."
 game_concept_colony_holdings:0 "Domaines Coloniaux"
 game_concept_colony_holdings_desc:0 "Des colonies naissantes taillées dans les terres sauvages, où pionniers et colons s’efforcent d’établir une base dans des terres indomptées. Bien que vulnérables, elles servent de fondation à l’expansion future, apportant ordre, commerce et stabilité à la frontière."
 game_concept_colony:0 "Colonie"
 game_concept_colony_desc:0 "Une colonie naissante taillée dans les terres sauvages, où pionniers et colons s’efforcent d’établir une base dans des terres indomptées. Bien que vulnérable, elle sert de fondation à l’expansion future, apportant ordre, commerce et stabilité à la frontière."
 game_concept_colonies:0 "Colonies"
 game_concept_colonies_desc:0 "Des colonies naissantes taillées dans les terres sauvages, où pionniers et colons s’efforcent d’établir une base dans des terres indomptées. Bien que vulnérables, elles servent de fondation à l’expansion future, apportant ordre, commerce et stabilité à la frontière."

#Doom
 game_concept_doom_of_valyria:0 "Fléau de Valyria"
 game_concept_doom_of_valyria_desc:0 "#bold Le Fléau de Valyria#!, ou simplement le #bold Fléau#!, fut un cataclysme de nature inconnue qui causa l’effondrement des [valyrian_freehold|E], qui avaient prospéré pendant cinq mille ans. Il se produisit environ un siècle avant la Conquête d’Aegon sur Westeros, en 102 av.C.. Sorts, savoirs et histoires enregistrées furent perdus dans le #bold Fléau#!, et le Siècle de Sang s’ensuivit."
 game_concept_doom:0 "Le Fléau"

#Valyrian Freehold
 game_concept_valyrian_freehold:0 "Les possessions valyriennes"
 game_concept_valyrian_freehold_desc:0 "Les #bold possessions valyriennes#! constituaient un vaste territoire couvrant une grande partie du continent d’[essos|E], aujourd’hui en ruines. Elles furent détruites environ cent ans avant la Conquête d’Aegon, lors d’un cataclysme appelé le [doom_of_valyria|E].\n\nÀ leur apogée, les #bold possessions#! englobèrent la majeure partie du continent oriental, s’étendant jusqu’aux actuelles [free_cities|E] et jusqu’à l’île de Peyredragon au large de [westeros|E]. #bold Les possessions#! n’étaient techniquement pas un empire, mais on les désigne ainsi par commodité.\n\n#bold Les possessions#! formaient une civilisation avancée et la puissance militaire et culturelle dominante du monde connu. Leur capitale était la cité de Valyria. #bold Les possessions#! étaient dirigées par les seigneurs possédants, de puissantes familles nobles. Les plus puissantes d’entre elles étaient les [dragonlords|El]."
 game_concept_the_freehold:0 "Les Possessions"

#Dragonlords
 game_concept_dragonlord:0 "Seigneur-Dragon"
 game_concept_dragonlords:0 "Seigneurs-Dragons"
 game_concept_dragonlord_desc:0 "Les #bold Seigneurs-Dragons#! étaient les nobles les plus puissants [dragon_riding|El] des [valyrian_freehold|E]. Certains membres de la maison Targaryen, tels qu’Aegon le Conquérant, furent appelés « Seigneurs-Dragons » après le [doom_of_valyria|E] et la destruction de leur civilisation."

#Dragonrider
 game_concept_dragonrider:0 "Cavalier de dragon"
 game_concept_dragonriders:0 "Cavaliers de dragon"
 game_concept_dragon_riding:0 "Équitation draconique"
 game_concept_dragonrider_desc:0 "Un [GetTrait('dragonrider').GetName(GetNullCharacter)] est une personne dont la monture est un [dragon|E].\n\nLes [GetTrait('dragonrider').GetName(GetNullCharacter)]s se trouvaient parmi les familles des [dragonlord|El] dans les [valyrian_freehold|E], lorsque les [valyrian_freehold_short|E] étaient encore puissantes.\n\nLes Targaryen étaient l’une de ces familles de Seigneurs-Dragons, bien qu’ils ne fussent pas les plus puissants, et furent les derniers [GetTrait('dragonrider').GetName(GetNullCharacter)]s connus à survivre au [doom_of_valyria|E] et à ses conséquences."

#Continents
  game_concept_known_world:0 "Monde connu"
  game_concept_three_known_continents:0 "Trois continents connus"
  game_concept_known_world_desc:0 "#bold Le monde connu#! est composé d'au moins trois continents ([westeros|E], [essos|E], et [sothoryos|E]), d'une grande masse terrestre ([ulthos|E]) et de nombreuses petites îles.\n\nAucune des quatre principales masses terrestres n’a été entièrement cartographiée, et une grande partie du monde demeure inexplorée.\n\nBien que les [maesters|El] de [westeros|E] aient une bonne connaissance des terres à l’est lointain, la distance reste un problème, et au-delà d’un certain point, les mythes et légendes altèrent leurs récits."
  #Westeros
   game_concept_westeros:0 "Westeros"
   game_concept_westerosi:0 "Westerosi"
   game_concept_westeros_desc:0 "#bold Westeros#! est l'un des [three_known_continents|E] du [known_world|E], les autres étant [essos|E] et [sothoryos|E]. La majeure partie de #bold Westeros#! est couverte par une entité politique connue sous le nom des [seven_kingdoms|E], tandis que l'extrême nord au-delà du [watch_wall|E] comprend le peuple libre.\n\nLes nations étrangères les plus proches de #bold Westeros#! sont les [free_cities|E]. Au sud de #bold Westeros#! se trouvent les Îles d'Été."
   game_concept_seven_kingdoms:0 "Sept Couronnes"
   game_concept_seven_kingdoms_desc:0 "#bold Les Sept Couronnes#! forment un royaume situé sur le continent de [westeros|E], gouverné par un monarque portant le titre de Roi des [andals|E], des [rhoynar|E] et des [first_men|E] et Seigneur des #bold Sept Couronnes#!, siégeant sur le Trône de Fer à Port-Réal. Ce nom provient de la situation d'il y a trois siècles, lorsque Aegon le Conquérant entreprit d'unifier les terres de [westeros|E], alors divisées en sept royaumes indépendants, en dehors des terres [beyond_the_wall|E]. Le nouveau royaume issu de la Conquête d'Aegon est divisé en neuf régions ou provinces distinctes."
   game_concept_narrow_sea:0 "le Détroit"
   game_concept_narrow_sea_desc:0 "#bold Le Détroit#! est la mer séparant les continents de [westeros|E] à l'ouest et de [essos|E] à l'est. Relativement étroit et facile à traverser, il est cependant assez large pour rendre difficiles les invasions militaires d'envergure entre les [seven_kingdoms|E] et les [free_cities|E].\n\nUn commerce régulier traverse le Détroit entre les deux continents et le port d'Ibben. Les nobles [westerosi|E] y sont parfois envoyés en nourrice ou y cherchent refuge."
   game_concept_others:0 "Les Autres"
   game_concept_white_walkers:0 "Marcheurs Blancs"
   game_concept_cold_gods:0 "Dieux Froids"
   game_concept_white_shadows:0 "Ombres Blanches"
   game_concept_cold_shadows:0 "Ombres Froides"
   game_concept_others_desc:0 "Les #bold Autres#!, également appelés #bold Marcheurs Blancs#!, #bold Dieux Froids#!, #bold Ombres Blanches#! et #bold Ombres Froides#!, sont une espèce humanoïde vivant au nord au-delà du [watch_wall|E]. N'ayant pas été aperçus depuis six à huit mille ans, ils sont considérés comme éteints."
   game_concept_watch_wall:0 "Le Mur"
   game_concept_watch_wall_desc:0 "#bold Le Mur#! est une immense barrière de glace s'étendant le long de la frontière nord des [seven_kingdoms|E], séparant ces derniers des [wild_lands_beyond|E]. #bold Le Mur#! s'étend sur cent lieues (environ trois cents miles) et atteint plus de sept cents pieds de hauteur à son point culminant, et même neuf cents pieds près de certaines collines, telles que Greyguard.\n\nConsidéré comme l'une des neuf Merveilles Ouvrées par l'Homme selon Lomas Longstrider, #bold Le Mur#! est défendu par les Frères Jurés de la [nights_watch|E], qui patrouillent dix-neuf châteaux entre les montagnes Frostfangs à l'ouest et la Baie des Phoques à l'est. Au début de #bold A Song of Ice and Fire#!, seuls la Tour de l'Ombre, Châteaunoir et Eastwatch-by-the-Sea sont encore garnisonnés. Ceux qui rejoignent la Garde pour échapper à un châtiment sont dits #bold envoyés au Mur#!."
   game_concept_beyond_the_wall:0 "Au-delà du Mur"
   game_concept_wild_lands_beyond:0 "Terres Sauvages au-delà"
   game_concept_beyond_the_wall_desc:0 "#bold Au-delà du Mur#! est un terme désignant les terres les plus septentrionales de [westeros|E], situées au nord du [watch_wall|E] et des [seven_kingdoms|E]."
   game_concept_age_of_heroes:0 "Âge des Héros"
   game_concept_age_of_heroes_desc:0 "L'#bold Âge des Héros#! fut une époque de l'histoire [westerosi|E] précédant l'[coming_of_the_andals|E]. Il tire son nom des grands hommes et femmes qui vécurent pendant les années de paix ayant suivi la signature du [pact|E] entre les [first_men|E] et les [children_of_the_forest|E]. De nombreuses maisons nobles prétendent remonter à l'#bold Âge des Héros#!, bien qu'il soit difficile pour les historiens de séparer le mythe de la réalité."
   game_concept_dawn_age:0 "Âge de la Prime Aube"
   game_concept_dawn_age_desc:0 "L'#bold Âge de la Prime Aube#!, également appelé #bold Aube des Jours#! ou #bold siècles de l'Aube#!, est une période d'une durée indéterminée durant laquelle les [first_men|E] arrivèrent de [essos|E] pour coloniser [westeros|E]. Avant eux, les [children_of_the_forest|E] — êtres mystérieux et dotés de dons surnaturels — habitaient la terre, vénérant les [nameless_gods|E] et vivant en harmonie avec la nature, peut-être aux côtés des géants."
   game_concept_long_night:0 "Longue Nuit"
   game_concept_long_night_desc:0 "La #bold Longue Nuit#! désigne une période où une obscurité terrible s'abattit sur le [known_world|E]. Elle survint durant l'[age_of_heroes|E], environ huit mille ans avant l'[aegons_conquest|E], au cœur d'un hiver qui dura des années. La #bold Longue Nuit#! persista une génération entière, semant la famine et la terreur."
   game_concept_first_men:0 "Premiers Hommes"
   game_concept_first_men_desc:0 "Les #bold Premiers Hommes#! sont l'un des trois principaux groupes ethniques humains de [westeros|E], avec les [andals|E] et les [rhoynar|E]. Les #bold Premiers Hommes#! furent les premiers humains à fouler le continent. Leur influence est encore très forte dans le nord de [westeros|E]. Le Roi des [seven_kingdoms|E], siégeant sur le Trône de Fer, porte les titres de Roi des [andals|E], des [rhoynar|E] et des #bold Premiers Hommes#!."
   game_concept_andal:0 "Andal"
   game_concept_andals:0 "Andals"
   game_concept_andal_desc:0 "Les #bold Andals#! sont l'un des trois grands groupes ethniques humains de [westeros|E], aux côtés des [first_men|E] et des [rhoynar|E]. L'[coming_of_the_andals|E] entraîna la chute de nombreux royaumes des [first_men|E] fondés après leur [pact|E] avec les [children_of_the_forest|E].\n\nLes #bold Andals#! apportèrent également la Foi des Sept sur le continent. Le Roi des [seven_kingdoms|E], siégeant sur le Trône de Fer, porte les titres de Roi des #bold Andals#!, des [rhoynar|E] et des [first_men|E].\n\nLes [dothraki|E] désignent [westeros|E] sous le nom de Rhaesh Andahli, la Terre des #bold Andals#!."
   game_concept_rhoynar:0 "Rhoynar"
   game_concept_rhoynar_desc:0 "Les #bold Rhoynar#! sont l'un des trois principaux groupes ethniques humains de [westeros|E], aux côtés des [andals|E] et des [first_men|E]. Ce peuple de mariniers habitait les rives du gigantesque fleuve #bold Rhoyne#! en [essos|E]. Après avoir fui en dix mille navires lors des guerres contre Valyria, les survivants #bold Rhoynar#! s'installèrent dans le Dorne, au sud de [westeros|E].\n\nBien que la plupart des #bold Rhoynar#! se soient intégrés à la société dorienne, notamment parmi les « Dorniens salés », les orphelins du Sang-Vert ont conservé leur langue et leur culture rhoynaises. Le Roi des [seven_kingdoms|E], siégeant sur le Trône de Fer, revendique les titres de Roi des [andals|E], des Rhoynar et des [first_men|E]."
   game_concept_coming_of_the_andals:0 "Arrivée des Andals"
   game_concept_coming_of_the_andals_desc:0 "L'#bold arrivée des Andals#!, également appelée #bold traversée des Andals#! ou #bold venue des Andals#!, désigne la migration des [andals|E] depuis [essos|E] vers [westeros|E]. La date est contestée : certains parlent de six mille ans, d'autres de quatre mille, et certains [maesters|E] comme Denestan estiment seulement deux mille ans.\n\nDe nombreux royaumes des [first_men|E] furent détruits par les [andal|E], tandis que les [children_of_the_forest|E] furent repoussés vers le nord. Cependant, des unions pacifiques eurent parfois lieu entre [andals|E] et [first_men|E]."
   game_concept_children_of_the_forest:0 "Enfants de la Forêt"
   game_concept_children_of_the_forest_desc:0 "Les #bold Enfants de la Forêt#!, parfois simplement appelés #bold enfants#!, sont une mystérieuse race non humaine ayant habité [westeros|E] durant l'[dawn_age|E], bien avant l'arrivée des [first_men|E]. Les géants les nommaient « petits écureuils » dans leur langue. Eux-mêmes se désignent comme #bold ceux qui chantent la chanson de la terre#!. Les #bold enfants#! n'ont pas été vus par les humains depuis des siècles."
   game_concept_pact:0 "Pacte"
   game_concept_pact_desc:0 "Le #bold Pacte de l'Île aux Visages#! mit fin à l'antique guerre entre les [first_men|E] et les [children_of_the_forest|E] il y a plus de 10 000 ans. Il fut signé sur une île du #bold Gods Eye#!, où des visages furent sculptés dans les barrals pour témoigner devant les dieux. Les Hommes Verts furent chargés de la protection de l'île.\n\nLe #bold Pacte#! dura à travers l'[age_of_heroes|E], la [long_night|E], et l'ascension des [seven_kingdoms|E], jusqu'à ce que les [andals|E] traversent le [narrow_sea|E], bouleversant Westeros."
   game_concept_old_gods:0 "Anciens Dieux"
   game_concept_nameless_gods:0 "Dieux Sans Nom"
   game_concept_old_gods_desc:0 "Les #bold Anciens Dieux#! sont des divinités sans nom liées à la forêt, aux ruisseaux et aux pierres, encore vénérées dans les [seven_kingdoms|E], principalement au nord de [westeros|E] et au-delà du [watch_wall|E]. Bien que la Foi des Sept ait remplacé ce culte dans la majorité du royaume, la croyance en les #bold Anciens Dieux#! subsiste parmi les nordiens, les crannogmen et le peuple libre. De nombreux [westerosi|E] prêtent encore serment aux dieux anciens et nouveaux."

   #Sothoryos
   game_concept_sothoryos:0 "Sothoryos"
   game_concept_sothoros:0 "Sothoros"
   game_concept_sothoryos_desc:0 "#bold Sothoryos#! ou #bold Sothoros#! est l'un des [three_known_continents|E] du monde. Il se situe au sud-est de [westeros|E] et au sud de [essos|E], au-delà de la Mer d'Été. À l'est de #bold Sothoryos#! s'étend la mer de Jade méridionale."
  #Essos
   game_concept_essos:0 "Essos"
   game_concept_essosi:0 "Essosi"
   game_concept_the_east:0 "Est"
   game_concept_essos_desc:0 "#bold Essos#!, souvent simplement appelé l'Est, est le plus grand des [three_known_continents|E] du monde.\n\nIl se trouve à l'est de [westeros|E] et au nord de [sothoryos|E] et [ulthos|E], s'étendant de la mer Frissonnante au nord jusqu'à la Mer d'Été au sud, du [narrow_sea|E] à l'ouest jusqu'aux terres bordant la mer de Jade à l'est, voire au-delà.\n\n#bold Essos#! est peuplé par de nombreux peuples différents et présente une géographie vaste et variée."
   # Cités Libres
    game_concept_free_cities:0 "Cités Libres"
    game_concept_free_city:0 "Cité Libre"
    game_concept_free_cities_desc:0 "#bold Les Cités Libres#!, également appelées les #bold Neuf Cités Libres#!, sont un groupe de neuf cités-États indépendantes situées dans l'ouest de [essos|E], à l'ouest de la [dothraki_sea|E] et des Montagnes Peintes, et au nord-ouest de la péninsule valyrienne.\n\n#bold Les Cités Libres#! commercent et interagissent fréquemment avec les [seven_kingdoms|E] de [westeros|E]. Beaucoup parmi les habitants des #bold Cités Libres#! se considèrent plus sophistiqués que les Westerosi, certains allant jusqu'à voir les habitants des [seven_kingdoms|E] comme des sauvages."
   # Mer Dothraki
    game_concept_dothraki_sea:0 "Mer Dothraki"
    game_concept_dothraki_sea_desc:0 "#bold La Mer Dothrakie#!, également appelée #bold Grande Mer Herbeuse#!, #bold Terres Hantées#! et #bold Grande Désolation#!, est une vaste région intérieure du continent de [essos|E], située à l'est des [free_cities|E], au nord de la Baie des Serfs, et à l'ouest des Montagnes d'Os.\n\nSon paysage de steppes et de plaines est habité par les [dothraki|E], un peuple nomade cavalier, qui se battent entre eux et pillent les terres environnantes."
    game_concept_dothraki:0 "Dothraki"
    game_concept_dothraki_desc:0 "Le peuple #bold Dothraki#! est une culture de guerriers nomades d'[essos|E], parcourant les vastes plaines de la [dothraki_sea|E] en hordes appelées khalasars. Les habitants des [seven_kingdoms|E] et des [free_cities|E] les appellent également les #bold Seigneurs des Chevaux#!."
  #Ulthos
   game_concept_ulthos:0 "Ulthos"
   game_concept_ulthos_desc:0 "#bold Ulthos#! est une masse terrestre située à l'extrême est, qui pourrait constituer un autre continent. Il se trouve au sud d'Asshaï et des Terres de l'Ombre en [essos|E], et à l'est de [sothoryos|E]. Il est séparé des Terres de l'Ombre par le Détroit du Safran. L'île d'Ulos est située dans le détroit entre #bold Ulthos#! et [essos|E].\n\nOn sait peu de choses sur #bold Ulthos#!, si ce n'est son emplacement et le fait qu'il soit recouvert de jungles denses."


# Artisanat
 game_concept_resources:0 "Ressources"
 game_concept_resources_desc:0 "Les ressources comprennent [zz_iron|E], [zz_steel|E], [zz_obsidian|E] et [zz_valyrian_steel|E], qui représentent le stock de matériaux d'un royaume pour l'artisanat. Des bâtiments générant des ressources peuvent être construits dans toute province disposant d'un domaine."
 game_concept_crafting_resources_tooltip:0 "@lov_icon_resources!"

 zz_iron:0 "Fer"
 game_concept_zz_iron:0 "$zz_iron$"
 game_concept_zz_iron_desc:0 "Le fer est un métal solide utilisé couramment pour la fabrication d'outils et d'armements, extrait dans les provinces équipées de mines de fer. C'est le métal de base nécessaire à la fabrication du [zz_steel|E]."
 game_concept_iron_tooltip:0 "@lov_icon_iron!"
 
 zz_steel:0 "Acier"
 game_concept_zz_steel:0 "$zz_steel$"
 game_concept_zz_steel_desc:0 "L'acier est un alliage dur de [zz_iron|E] et de carbone, souvent utilisé pour fabriquer des armes et des armures. Les forges d'acier produisent de l'acier et nécessitent des mines de fer pour être construites."
 game_concept_steel_tooltip:0 "@lov_icon_steel!"

 zz_obsidian:0 "Obsidienne"
 game_concept_zz_obsidian:0 "$zz_obsidian$"
 game_concept_zz_obsidian_desc:0 "L'obsidienne, communément appelée verredragon par le petit peuple, est un verre volcanique formé par une chaleur et une pression extrêmes dans les entrailles de la terre. Les provinces riches en dépôts d'obsidienne — typiquement volcaniques — peuvent extraire l'obsidienne à l'aide de mines spécialisées."
 game_concept_obsidian_tooltip:0 "@lov_icon_obsidian!"

 zz_valyrian_steel:0 "Acier Valyrien"
 game_concept_zz_valyrian_steel:0 "$zz_valyrian_steel$"
 game_concept_zz_valyrian_steel_desc:0 "L'acier valyrien est un type d'[zz_steel|E] originaire de Valyria, utilisé pour forger des armes et divers objets d'une qualité inégalée. La magie joue un rôle dans sa forge, conférant à cet acier des propriétés uniques. Les [dragonlords|E] peuvent produire de l'acier valyrien dans des forges spéciales, construites dans des provinces disposant de mines de fer."
 game_concept_zz_v_steel:0 "A. Valyrien"
 game_concept_v_steel_tooltip:0 "@lov_icon_valyrian_steel!"
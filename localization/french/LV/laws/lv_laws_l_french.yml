l_french:
  volantene_triarchy_succession_law:0 "Élective Triarchique Volantaine"
  volantene_triarchy_succession_law_subname:0 "Triarchie Volantaine"
  volantene_triarchy_succession_law_effects:1 "\n#V Sous une $volantene_triarchy_succession_law$, les membres des familles nobles qui peuvent retracer leur lignée jusqu'aux [valyrian_freehold|E] sont éligibles à la candidature. Tous les propriétaires terriens nés libres du royaume peuvent voter, et chacun des trois triarques choisis servira pendant une année.#!\n\n#weak $volantene_triarchy_base_desc$#!"
  volantene_triarchy_base_desc:2 "#weak Au premier jour de la nouvelle année, une élection se tient pour déterminer les triarques qui gouverneront pour le reste de l'année. Une période de campagne de dix jours commence, avec force festivités, chaos et corruption alors que les aspirants triarques rivalisent pour les votes des francs-tenanciers.\n\nLes triarques ayant servi leur mandat peuvent se représenter autant de fois qu'ils le souhaitent.\n#!"

  volantene_triarchy_elective_electors:0 "Francs-Tenanciers"
  volantene_triarchy_elective_electors_tooltip:0 "Tous les propriétaires terriens nés libres du royaume, quel que soit leur sexe, peuvent voter"
  volantene_triarchy_elective_candidates:0 "Le Sang Ancien"
  volantene_triarchy_elective_candidates_tooltip:0 "Membres des familles nobles de Volantis qui peuvent prouver une descendance ininterrompue de l'[old_valyria|E]"

  volantene_triarchy_succession_attached_titles_law:0 "Élective Triarchique Volantaine"
  volantene_triarchy_succession_attached_titles_law_subname:0 "Triarchie Volantaine"
  volantene_triarchy_succession_attached_titles_law_tooltip:0 "Ce titre suivra l'élection du royaume."
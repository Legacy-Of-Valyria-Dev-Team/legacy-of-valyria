  # Silly Stuff!!!
  PORTRAIT_MODIFIER_custom_headgear_female_head_silly_bear:0 "Ours Farceur"
  PORTRAIT_MODIFIER_custom_headgear_male_head_silly_bear:0 "Ours Farceur"

  lv_silly_events.0001.t:0 "Un Ours Danseur"
  lv_silly_events.0001.desc:0 "Vous avez trouvé un ours dansant !"
  lv_silly_events.0001.a:0 "Hein ?"
  lv_silly_events.0001.a.tooltip:0 "Personne ne vous croit"

  trait_silly_bear:0 "Ours"
  trait_silly_bear_desc:0 "Oui, vous êtes un ours véritable avec toute la fourrure, les dents et l’amour du saumon…\n\n#weak Ne me mangez pas s’il vous plaît#!"

  trait_silent_monster:0 "Monstre Silencieux"
  trait_silent_monster_desc:0 "Né de magies corrompues, cette créature abjecte n’est plus que l’ombre de ce qu’elle fut jadis — si tant est qu’elle ait un jour été humaine. Déformée au‑delà de toute reconnaissance, son corps est altéré par une sombre sorcellerie et son esprit, consumé par la folie qui l’anime\n\nElle n’est plus qu’une bête, poussée par une faim insatiable de destruction. Son corps refuse de dépérir, sa chair n’est plus soumise aux lois de la vie ou de la mort. Immortelle, implacable et terriblement redoutable au combat, elle est un cauchemar incarné — inarrêtable, à moins de faire face à des forces aussi puissantes que la magie obscure qui l’a engendrée"

  trait_demon_trait:0 "Démon"
  trait_demon_trait_desc:0 "Un démon des plus immondes, ces créatures infâmes naissent des profondeurs de la terre, là où le feu et la magie se mêlent dans un mélange chaotique de puissance brute et impie. Forgés dans l’obscurité, ils émergent de cavernes en fusion, leurs formes tordues façonnées par la haine et des flammes maudites\n\nIls méprisent tout ce qui vit, ne voyant dans les êtres vivants que des proies à déchiqueter dans leur courroux éternel. Une fois sortis de leur sommeil ancestral, il n’y a ni raison, ni pitié — seulement le carnage. Ils ne s’arrêteront pas, ne se lasseront pas, tant que leur soif de sang ne sera pas étanchée et que le monde ne sera pas réduit en ruines"
  PORTRAIT_MODIFIER_custom_headgear_female_head_silly_bear:0 "Ours Rigolo"
  PORTRAIT_MODIFIER_custom_headgear_male_head_silly_bear:0 "Ours Rigolo"

  lv_silly_events.0001.t:0 "Un Ours Danseur"
  lv_silly_events.0001.desc:0 "Vous avez trouvé un ours danseur !"
  lv_silly_events.0001.a:0 "Hein ?"
  lv_silly_events.0001.a.tooltip:0 "Personne ne vous croit"

  trait_silly_bear:0 "Ours"
  trait_silly_bear_desc:0 "Oui, vous êtes un véritable ours avec toute la fourrure, les dents et l'amour du saumon qui vont avec...\n\n#weak Ne me mangez pas s'il vous plaît#!"

  trait_silent_monster:0 "Monstre Silencieux"
  trait_silent_monster_desc:0 "Monstre né de magies corrompues, ces créatures viles ne sont que les ombres de ce qu'elles furent jadis — si tant est qu'elles aient jamais été véritablement humaines. Tordues au-delà de toute reconnaissance, leurs formes sont déformées par une sorcellerie ténébreuse, leurs esprits perdus dans la folie qui les consume.\n\nElles ne sont plus désormais que des bêtes sauvages, poussées par une faim insatiable de destruction. Leurs corps refusent de se flétrir, leur chair n'étant plus liée aux lois de la vie et de la mort. Immortelles, implacables et terriblement mortelles au combat, elles sont un cauchemar fait chair — imparables à moins d'être confrontées à des forces aussi puissantes que la magie noire qui les a créées."

  trait_demon_trait:0 "Démon"
  trait_demon_trait_desc:0 "Démon des plus ignobles, ces êtres misérables naissent des profondeurs mêmes de la terre, là où le feu et la magie fusionnent en un mélange chaotique de pouvoir brut et impie. Forgés dans les ténèbres, ils s'élèvent des cavernes de lave, leurs formes tordues sculptées par la haine et les flammes maudites.\n\nIls méprisent tout ce qui vit, ne voyant en ces créatures que des proies à déchiqueter dans leur courroux éternel. Une fois tirés de leur sommeil ancestral, il n'y a plus de raison, plus de pitié — seulement le carnage. Ils ne s'arrêteront pas, ne se lasseront jamais, jusqu'à ce que leur soif de sang soit assouvie et que le monde soit livré à la ruine."
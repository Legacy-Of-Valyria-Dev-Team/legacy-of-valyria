 lv_silly_events.0001.t:0 "Un Ours Dansant"
 lv_silly_events.0001.desc:0 "Vous avez trouvé un ours dansant !"
 lv_silly_events.0001.a:0 "Hein ?"
 lv_silly_events.0001.a.tooltip:0 "Personne ne vous croit"

 trait_silly_bear:0 "Ours"
 trait_silly_bear_desc:0 "Oui, vous êtes un véritable ours, avec tout ce que cela suppose : la fourrure, les crocs, et cet amour immodéré pour le saumon...\n\n#weak Ne me mangez pas, je vous prie#!"

 trait_silent_monster:0 "Monstre Silencieux"
 trait_silent_monster_desc:0 "Un monstre né de magies corrompues, ces créatures immondes ne sont plus que l'ombre de ce qu'elles furent jadis — si tant est qu'elles aient jamais été véritablement humaines. Défigurées au-delà de toute reconnaissance, leurs formes sont tordues par une sorcellerie ténébreuse, leurs esprits engloutis dans la folie qui les consume.\n\nElles ne sont plus rien d'autre que des bêtes, à présent, mues par une faim insatiable de destruction. Leurs corps refusent de dépérir, leur chair n'étant plus soumise aux lois de la vie et de la mort. Immortelles, implacables et effroyablement mortelles au combat, elles sont un cauchemar prenant forme — impossibles à arrêter, sinon par des forces aussi puissantes que la magie noire qui les a engendrées."

 trait_demon_trait:0 "Démon"
 trait_demon_trait_desc:0 "Un démon des plus immondes, ces êtres maudits naissent des tréfonds mêmes de la terre, où le feu et la magie fusionnent en un chaos de puissance brute et impie. Forgés dans les ténèbres, ils surgissent des cavernes en fusion, leurs formes tourmentées façonnées par la haine et la flamme maudite.\n\nIls exècrent tout ce qui vit, n'y voyant que des proies à déchiqueter dans leur colère éternelle. Une fois tirés de leur sommeil ancestral, point de raison, point de pitié — seulement le carnage. Ils ne s'arrêteront pas, ne connaîtront jamais la lassitude, tant que leur soif de sang ne sera pas assouvie et que le monde ne sera pas laissé en ruine."
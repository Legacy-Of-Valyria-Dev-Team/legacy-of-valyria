  lv_silly_events.0001.t:0 "Un Ours dansant"
  lv_silly_events.0001.desc:0 "Vous avez trouvé un ours dansant!"
  lv_silly_events.0001.a:0 "Hein?"
  lv_silly_events.0001.a.tooltip:0 "Personne ne vous croit"

  trait_silly_bear:0 "Ours"
  trait_silly_bear_desc:0 "Oui, vous êtes un véritable ours, avec toute la fourrure, les crocs et l’amour du saumon…\n\n#weak Ne me mangez pas, s’il vous plaît#!"

  trait_silent_monster:0 "Monstre silencieux"
  trait_silent_monster_desc:0 "Né de magies corrompues, ce monstre est l'ombre de ce qu'il fut, s'il fut jamais humain. Déformé au-delà de toute reconnaissance par la sorcellerie noire, son esprit est perdu dans la folie qui l'anime.\n\nIl n'est plus qu'une bête, mûe par un appétit insatiable de destruction. Son corps ne flétrit jamais, sa chair échappe aux lois de la vie et de la mort. Immortel, acharné et terriblement meurtrier au combat, il incarne un cauchemar vivant, invincible sauf face à une magie aussi puissante que celle qui l'a créé"

  trait_demon_trait:0 "Démon"
  trait_demon_trait_desc:0 "Un démon abominable, engendré dans les profondeurs de la terre où le feu et la magie se confondent en un pouvoir chaotique et impie. Forgés dans l'ombre, ils émergent des cavernes de lave, formes tordues par la haine et la flamme maudite.\n\nIls méprisent toute vie, ne voyant en les êtres vivants que des proies à déchirer dans leur éternelle fureur. Réveillés de leur ancien sommeil, ils n'offrent ni raison ni pitié, seulement carnage. Ils ne s'arrêtent pas et ne s'épuisent pas tant que leur soif de sang n'est pas étanchée et que le monde n'est pas laissé en ruines"
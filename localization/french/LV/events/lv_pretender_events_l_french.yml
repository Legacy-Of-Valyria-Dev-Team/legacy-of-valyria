l_french:
  lv_pretender_empire.1.title:0 "Un Héritier de [valyria|E]"
  lv_pretender_empire.1.desc:0 "Depuis [doom_of_valyria|E], [essos|E] demeure privé d'une main directrice capable de restaurer l'ordre ancien. Vers le septentrion, les sauvages [dothraki|E] sèment la désolation sous les sabots de leurs destriers impitoyables, tandis qu'à l'orient les rejetons de la harpie s'enhardissent davantage dans l'étreinte de leur héritage ghiscari. Les colonies-filles de [valyrian_freehold_short|E] ont été abandonnées à leur propre sort, devenant [free_cities|E] d'[essos|E] indépendantes et rivales.\n\nVous méditez sur les options qui s'offrent à votre ambition. Nombreux sont ceux qui ont rêvé de raviver l'héritage glorieux de [valyrian_freehold_short|E], et plus rares encore ceux qui ont osé tenter l'entreprise. [free_cities|E] — ayant résisté à maintes tentatives de subjugation par le passé — demeurent fières de leur patrimoine valyrien, chacune revendiquant sous une forme ou une autre le titre de véritable héritière de [valyria|E]. Vous établir comme État successeur ne manquerait point de leur signaler vos intentions de domination sur les anciennes terres de [valyrian_freehold_short|E]."
  lv_pretender_empire.1.a:0 "Il est temps de ramener [essos|E] dans le giron impérial"
  lv_pretender_empire.1.b:0 "[valyrian_freehold_short|E] perdure à travers nous"
  lv_pretender_empire.1.c:0 "Je dois encore patienter pour le moment..."

  LV_form_pretender_empire_effect_form_title_successor:0 "Vous proclamez votre royaume comme le successeur légitime de l'antique [valyrian_freehold_short|E], qui sera connu du monde entier sous le nom de #game_link $LV_NEW_PRETENDER_EMPIRE_NAME_SUCCESSOR$#!"
  LV_form_pretender_empire_effect_form_title_continuation:0 "En tant que vestige de l'antique [valyrian_freehold_short|E] et membre d'une dynastie du sang de l'ancienne [valyria|E], vous affirmez être la continuation légitime de [valyrian_freehold_short|E]. Votre empire sera connu sous le nom de #game_link $LV_NEW_PRETENDER_EMPIRE_NAME_CONTINUATION$#!"
  LV_form_pretender_empire_effect_warning:0 "#warning @warning_icon! [free_cities|E] considéreront ceci comme une menace et formeront une coalition contre vous !#!"

  #LV_NEW_PRETENDER_EMPIRE_NAME:0 "[pretender.GetPrimaryTitle.GetAdjectiveNoTooltip] [valyria|E]"
  LV_NEW_PRETENDER_EMPIRE_NAME_SUCCESSOR:0 "[forming_kingdom.GetBaseNameNoTier]"
  LV_NEW_PRETENDER_EMPIRE_NAME_CONTINUATION:0 "[valyria|E]"
  #LV_NEW_PRETENDER_EMPIRE_NAME:0 "[valyria|E]"
  #SPECIAL_CREATED_TITLE_NAME:0 "[special_duchy.GetBaseNameNoTierNoTooltip]"

  lv_pretender_empire.2.title:0 "Un Héritier de [valyria|E]"
  lv_pretender_empire.2.desc:0 "Depuis [doom_of_valyria|E], [essos|E] demeure privé d'une main directrice capable de restaurer l'ordre ancien. Vers le septentrion, les sauvages [dothraki|E] sèment la désolation sous les sabots de leurs destriers impitoyables, tandis qu'à l'orient les rejetons de la harpie s'enhardiissent davantage dans l'étreinte de leur héritage ghiscari. Les colonies-filles de [valyrian_freehold_short|E] ont été abandonnées à leur propre sort, devenant [free_cities|E] d'[essos|E] indépendantes et rivales.\n\nDes nouvelles vous sont parvenues que [pretender.GetName] de [pretender.GetCapitalLocation.GetName] a revendiqué l'héritage de [valyria|E], proclamant [pretender.GetPrimaryTitle.GetName] comme son État successeur. Ceci n'est point une simple proclamation, mais une déclaration d'autorité sur les anciennes terres et colonies de [valyrian_freehold_short|E]."
  lv_pretender_empire.2.a:0 "Ce prétendant doit chuter !"
  lv_pretender_empire.2.b:0 "Les affaires des parvenus ne me concernent point."

  lv_pretender_empire.3.title:0 "La Coalition [pretender_opponent.GetPrimaryTitle.GetAdjective]"
  lv_pretender_empire.3.desc:0 "Depuis [doom_of_valyria|E], [essos|E] demeure privé d'une main directrice capable de restaurer l'ordre ancien. Vers le septentrion, les sauvages [dothraki|E] sèment la désolation sous les sabots de leurs destriers impitoyables, tandis qu'à l'orient les rejetons de la harpie s'enhardiissent davantage dans l'étreinte de leur héritage ghiscari. Les colonies-filles de [valyrian_freehold_short|E] ont été abandonnées à leur propre sort, devenant [free_cities|E] d'[essos|E] indépendantes et rivales.\n\nDes nouvelles vous sont parvenues que [pretender.GetName] de [pretender.GetCapitalLocation.GetName] a revendiqué l'héritage de [valyria|E], proclamant [pretender.GetPrimaryTitle.GetName] comme son État successeur. Ceci n'est point une simple proclamation, mais une déclaration d'autorité sur les anciennes terres et colonies de [valyrian_freehold_short|E]."
  lv_pretender_empire.3.a:0 "Ce prétendant doit chuter !"
  lv_pretender_empire.3.b:0 "Les affaires des parvenus ne me concernent point."
l_french:
  lv_pretender_empire.1.title:0 "Un Héritier de Valyria"
  lv_pretender_empire.1.desc:0 "Depuis le Fléau de Valyria, Essos est privé de toute main directrice. Au nord, les sauvages Dothrakis ravagent tout ce qui se trouve sous leurs montures, et à l'est, les rejetons de la harpie s'enhardissent en revendiquant leur héritage ghiscari, tandis que les colonies-filles des Possessions ont été livrées à elles-mêmes sous la forme des Cités Libres d'Essos.\n\nVous envisagez vos options pour l'avenir. Nombreux sont ceux qui ont rêvé de raviver l'héritage des Possessions, et encore moins nombreux sont ceux qui ont osé tenter l'aventure. Les Cités Libres — ayant résisté de nombreuses fois aux tentatives de soumission — demeurent fières de leur héritage valyrien, chacune prétendant d'une manière ou d'une autre être la véritable héritière de Valyria. Vous imposer comme État successeur annoncerait sans nul doute vos intentions de domination sur les anciennes terres des Possessions"
  lv_pretender_empire.1.a:0 "Il est temps de rassembler Essos sous notre bannière"
  lv_pretender_empire.1.b:0 "Les Possessions se perpétuent à travers nous"
  lv_pretender_empire.1.c:0 "Je dois attendre encore un peu..."

  LV_form_pretender_empire_effect_form_title_successor:0 "Vous proclamez votre royaume comme successeur légitime des anciennes Possessions, qui sera désormais connu sous le nom de #game_link $LV_NEW_PRETENDER_EMPIRE_NAME_SUCCESSOR$#!"
  LV_form_pretender_empire_effect_form_title_continuation:0 "En tant que vestige des anciennes Possessions et membre d'une lignée du sang de l'ancienne Valyria, vous affirmez être la continuation légitime des Possessions. Votre empire sera désormais connu sous le nom de #game_link $LV_NEW_PRETENDER_EMPIRE_NAME_CONTINUATION$#!"
  LV_form_pretender_empire_effect_warning:0 "#warning @warning_icon! Les Cités Libres considéreront cela comme une menace et formeront une coalition contre vous !#!"

  #LV_NEW_PRETENDER_EMPIRE_NAME:0 "[pretender.GetPrimaryTitle.GetAdjectiveNoTooltip] Valyria"
  LV_NEW_PRETENDER_EMPIRE_NAME_SUCCESSOR:0 "[forming_kingdom.GetBaseNameNoTier]"
  LV_NEW_PRETENDER_EMPIRE_NAME_CONTINUATION:0 "Valyria"
  #LV_NEW_PRETENDER_EMPIRE_NAME:0 "Valyria"
  #SPECIAL_CREATED_TITLE_NAME:0 "[special_duchy.GetBaseNameNoTierNoTooltip]"

  lv_pretender_empire.2.title:0 "Un Héritier de Valyria"
  lv_pretender_empire.2.desc:0 "Depuis le Fléau de Valyria, Essos est privé de toute main directrice. Au nord, les sauvages Dothrakis ravagent tout ce qui se trouve sous leurs montures, et à l'est, les rejetons de la harpie s'enhardissent en revendiquant leur héritage ghiscari, tandis que les colonies-filles des Possessions ont été livrées à elles-mêmes sous la forme des Cités Libres d'Essos.\n\nLa rumeur vous parvient que [pretender.GetName] de [pretender.GetCapitalLocation.GetName] a revendiqué l'héritage de Valyria, établissant [pretender.GetPrimaryTitle.GetName] comme État successeur. Il ne s'agit pas d'une simple proclamation, mais bien d'une déclaration d'autorité sur les anciennes terres et colonies des Possessions"
  lv_pretender_empire.2.a:0 "L'usurpateur tombera!"
  lv_pretender_empire.2.b:0 "Les affaires des parvenus ne me concernent pas"

  lv_pretender_empire.3.title:0 "La Coalition [pretender_opponent.GetPrimaryTitle.GetAdjective]"
  lv_pretender_empire.3.desc:0 "Depuis le Fléau de Valyria, Essos est privé de toute main directrice. Au nord, les sauvages Dothrakis ravagent tout ce qui se trouve sous leurs montures, et à l'est, les rejetons de la harpie s'enhardissent en revendiquant leur héritage ghiscari, tandis que les colonies-filles des Possessions ont été livrées à elles-mêmes sous la forme des Cités Libres d'Essos.\n\nLa rumeur vous parvient que [pretender.GetName] de [pretender.GetCapitalLocation.GetName] a revendiqué l'héritage de Valyria, établissant [pretender.GetPrimaryTitle.GetName] comme État successeur. Il ne s'agit pas d'une simple proclamation, mais bien d'une déclaration d'autorité sur les anciennes terres et colonies des Possessions"
  lv_pretender_empire.3.a:0 "L'usurpateur tombera!"
  lv_pretender_empire.3.b:0 "Les affaires des parvenus ne me concernent pas"
l_french:
  lv_pretender_empire.1.title:0 "Un Héritier de Valyria"
  lv_pretender_empire.1.desc:0 "Depuis le Fléau de Valyria, Essos est dépourvu d'une main directrice. Au nord, les sauvageons dothrakis ravagent tout ce qui se trouve sous les sabots de leurs montures, et à l'est, les rejetons de la harpie s'enhardissent à embrasser leur héritage ghiscari, tandis que les cités-filles des [valyrian_freehold_short|E] ont été livrées à elles-mêmes en tant que Cités Libres d'Essos.\n\nVous méditez sur vos options pour l'avenir. Nombreux sont ceux qui ont rêvé de raviver l'héritage des [valyrian_freehold_short|E], et bien moins nombreux ceux qui ont osé tenter. Les Cités Libres—ayant résisté à des tentatives d'assujettissement de nombreuses fois auparavant—sont elles-mêmes encore fières de leur héritage valyrien, chacune s'affirmant d'une manière ou d'une autre comme les véritables héritières de Valyria. Vous établir comme son État successeur signalerait sans doute à ces cités vos intentions de domination sur les anciennes terres des [valyrian_freehold_short|E]"
  lv_pretender_empire.1.a:0 "Il est temps qu'Essos soit à nouveau réuni sous une même bannière"
  lv_pretender_empire.1.b:0 "Les [valyrian_freehold_short|E] se perpétuent à travers nous"
  lv_pretender_empire.1.c:0 "Je dois patienter pour le moment..."

  LV_form_pretender_empire_effect_form_title_successor:0 "Vous proclamez votre royaume comme le successeur légitime des anciens [valyrian_freehold_short|E], qui sera connu du monde sous le nom de #game_link $LV_NEW_PRETENDER_EMPIRE_NAME_SUCCESSOR$#!"
  LV_form_pretender_empire_effect_form_title_continuation:0 "En tant que vestige des anciens [valyrian_freehold_short|E] et membre d'une dynastie du sang de l'ancienne Valyria, vous affirmez être la continuation légitime des [valyrian_freehold_short|E]. Votre empire sera connu sous le nom de #game_link $LV_NEW_PRETENDER_EMPIRE_NAME_CONTINUATION$#!"
  LV_form_pretender_empire_effect_warning:0 "#warning @warning_icon! Les Cités Libres prendront cela comme une menace et formeront une coalition contre vous!#!"

  #LV_NEW_PRETENDER_EMPIRE_NAME:0 "[pretender.GetPrimaryTitle.GetAdjectiveNoTooltip] Valyria"
  LV_NEW_PRETENDER_EMPIRE_NAME_SUCCESSOR:0 "[forming_kingdom.GetBaseNameNoTier]"
  LV_NEW_PRETENDER_EMPIRE_NAME_CONTINUATION:0 "Valyria"
  #LV_NEW_PRETENDER_EMPIRE_NAME:0 "Valyria"
  #SPECIAL_CREATED_TITLE_NAME:0 "[special_duchy.GetBaseNameNoTierNoTooltip]"

  lv_pretender_empire.2.title:0 "Un Héritier de Valyria"
  lv_pretender_empire.2.desc:0 "Depuis le Fléau de Valyria, Essos est dépourvu d'une main directrice. Au nord, les sauvageons dothrakis ravagent tout ce qui se trouve sous les sabots de leurs montures, et à l'est, les rejetons de la harpie s'enhardissent à embrasser leur héritage ghiscari, tandis que les cités-filles des [valyrian_freehold_short|E] ont été livrées à elles-mêmes en tant que Cités Libres d'Essos.\n\nLa nouvelle vous est parvenue que [pretender.GetName] de [pretender.GetCapitalLocation.GetName] a revendiqué l'héritage de Valyria, avec [pretender.GetPrimaryTitle.GetName] comme son État successeur. Il ne s'agit pas d'une simple proclamation, mais d'une déclaration d'autorité sur les anciennes terres et colonies des [valyrian_freehold_short|E]"
  lv_pretender_empire.2.a:0 "Le prétendant tombera!"
  lv_pretender_empire.2.b:0 "Les affaires des parvenus ne me concernent point"

  lv_pretender_empire.3.title:0 "La Coalition [pretender_opponent.GetPrimaryTitle.GetAdjective]"
  lv_pretender_empire.3.desc:0 "Depuis le Fléau de Valyria, Essos est dépourvu d'une main directrice. Au nord, les sauvageons dothrakis ravagent tout ce qui se trouve sous les sabots de leurs montures, et à l'est, les rejetons de la harpie s'enhardissent à embrasser leur héritage ghiscari, tandis que les cités-filles des [valyrian_freehold_short|E] ont été livrées à elles-mêmes en tant que Cités Libres d'Essos.\n\nLa nouvelle vous est parvenue que [pretender.GetName] de [pretender.GetCapitalLocation.GetName] a revendiqué l'héritage de Valyria, avec [pretender.GetPrimaryTitle.GetName] comme son État successeur. Il ne s'agit pas d'une simple proclamation, mais d'une déclaration d'autorité sur les anciennes terres et colonies des [valyrian_freehold_short|E]"
  lv_pretender_empire.3.a:0 "Le prétendant tombera!"
  lv_pretender_empire.3.b:0 "Les affaires des parvenus ne me concernent point"
l_french:
  funding_expedition.0001:0 "Financer une Expédition"
  fund_expedition_0001_t:0 "Financer une Expédition"
  fund_expedition_0001_desc:0 "J'ai décidé de partir en expédition, me procurant les cartes nécessaires des régions cartographiées autour des Îles du Basilic et planifiant les provisions dont j'aurai besoin. À présent, je dois choisir une destination. Entre Gogossos et Sothoryos, la première est l'option la plus sûre, bien que beaucoup moins susceptible de rapporter des objets de valeur. Je pourrais emprunter le chemin plus périlleux vers Sothoryos, dont les terres largement intactes regorgent assurément de trésors, mais grouillent de dangers encore plus grands dans leurs profondeurs."
  funding_expedition.0001.a:0 "Je devrais me diriger vers Gogossos"
  funding_expedition.0001.b:0 "Je devrais me diriger vers Sothoryos (Pas encore fonctionnel - en développement)"
  funding_expedition.0001.z:0 "Finalement, non"

  gogossos_expedition.0001:0 "Qu'ai-je Découvert ?"
  gogossos_expedition_0001_t:0 "Qu'ai-je Découvert ?"
  gogossos_expedition_0001_desc:0 "Après avoir marché pendant des jours à travers une jungle épaisse et la boue, nous avons finalement trouvé nos premiers vestiges de civilisation. Il semble s'agir d'un grand bâtiment de pierre envahi par la végétation, bien que je puisse distinguer la forme d'une porte à travers toute cette broussaille."
  gogossos_expedition.0001.a:0 "Qu'avons-nous là ?"
  gogossos_expedition.0001.a.outcome:0 "Vous entamez un duel avec cette... #emphasis chose#! !"
  gogossos_expedition.0001.b:0 "Je pense qu'il est temps de partir..."
  gogossos_expedition.0001.b.outcome:0 "Vous vous frayez un chemin hors de la jungle et rentrez chez vous."

  gogossos_expedition.0002:0 "Pas ces Maudites Énigmes de Piliers"
  gogossos_expedition_0002_t:0 "Pas ces Maudites Énigmes de Piliers"
  gogossos_expedition_0002_desc:0 "Ayant franchi l'entrée, je me suis aventuré plus profond dans la ruine, la trouvant en état remarquablement exquis. La ruine mène à une chambre avec une grande porte d'acier et trois piliers autour de la pièce, avec différents piliers rotatifs portant des formes sur chaque face représentant respectivement un chien, un aigle, un loup-garou et un corbeau. Au centre de la pièce se trouve un levier solitaire.\n\nUne fresque peut être trouvée sur le mur au-dessus de la porte. Y sont gravés ces mots :\n\n#emphasis Près d'un arbre au bord d'une rivière il y a un trou dans le sol\nCinq loups-garous combattent sept chiens, tandis que deux corbeaux volent en rond\nSix chiens moururent en tuant les cinq loups-garous dans le voile de la nuit\nTandis qu'un corbeau fut tué par un aigle dans un terrible combat#!\n\nSous chaque section de la fresque apparaît le texte suivant :\n\n#emphasis J'ai du temps à tuer, regards sournois dans les couloirs\nSans un plan de ta part\nUn merle chante sur la colline du merle bleu\nGrâce à l'appel de l'Enfant du Sage Sauvage#!"

  gogossos_expedition.0002.a:0 "Allez, on tente le coup..."
  gogossos_expedition.0002.a.outcome:0 "Vous tirez le levier"

  pillar_mural_turn:0 "Vous tournez le pilier"

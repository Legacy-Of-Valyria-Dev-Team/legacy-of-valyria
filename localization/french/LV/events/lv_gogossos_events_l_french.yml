  gogossos_expedition.0003:0 "Je n’en crois pas mes yeux"
  gogossos_expedition.0003_t:0 "Tombeau du Seigneur Dragon"
  gogossos_expedition.0003_desc:0 "En entrant dans le tombeau, je découvre une vaste salle carrée ornée de statues de chevaliers valyriens et de magnifiques fresques représentant l’Ancienne Valyria à son apogée. Je vois d’importantes piles d’or soigneusement empilées à côté du grand sarcophage au centre de la pièce, parsemées de gemmes précieuses et d’ornements en or. En repoussant le couvercle du sarcophage, je découvre un squelette à l’intérieur et…"
  gogossos_expedition.0003.a:0 "Que trouvons-nous ici ?"
  gogossos_expedition.0003.outcome:0 "Vous récupérez le trésor et concluez votre expédition à Gogossos"

  gogossos_expedition.0003.a.outcome.egg:0 "Vous trouvez un œuf de dragon"
  gogossos_expedition.0003.a.outcome.blood:0 "Vous trouvez un parchemin de magie du sang"
  gogossos_expedition.0003.a.outcome.water:0 "Vous trouvez un parchemin de magie de l’eau"
  gogossos_expedition.0003.a.outcome.shadow:0 "Vous trouvez un parchemin de magie des ombres"

  gogossos_expedition.0004:0 "Je n’en crois pas mes yeux !"
  gogossos_expedition.0004_t:0 "Je n’en crois pas mes yeux !"
  gogossos_expedition.0004_desc:0 "En entrant dans le tombeau dans l’espoir d’en piller les trésors, je m’arrête net. Figé par la peur, je lève les yeux et je vois…"
  gogossos_expedition.0004.a:0 "UN DRAGON !"

  gogossos_expedition.00041:0 "Pas ce qu’il paraît ?"
  gogossos_expedition.00041_t:0 "Pas ce qu’il paraît ?"
  gogossos_expedition.00041_desc:0 "Heureusement, il semble que le dragon soit depuis longtemps mort et n’est plus qu’une carcasse en décomposition, mais le trésor sur lequel repose son corps est bien réel ; le dragon mort reposait sur un immense butin d’or tandis que le reste du tombeau paraît profané ; toutes les œuvres d’art et les statues sont vandalisées et endommagées au point d’être méconnaissables"
  gogossos_expedition.00041.a:0 "Espérons que ce trésor n’est pas maudit comme l’or de Thorin"
  gogossos_expedition.00041.outcome:0 "Vous concluez votre expédition à Gogossos"

  gogossos_expedition.00042:0 "Le Tueur de Dragons"
  gogossos_expedition.00042_t:0 "Le Tueur de Dragons"
  gogossos_expedition.00042_desc:0 "L’adrénaline pulse encore dans tout mon corps. Pendant un instant, rien ne semblait réel. Je ne sais pas ce qui s’est passé exactement mais une chose est sûre : ce dragon ne me tourmentera plus jamais. J’ai tué un dragon et je suis encore en vie pour en témoigner"
  gogossos_expedition.00042.a:0 "Au moins j’ai gagné de l’or pour mes efforts !"
  gogossos_expedition.00042.outcome:0 "Vous concluez votre expédition à Gogossos"

  gogossos_expedition.0050:0 "Que se passe‑t‑il dans ce monde ?"
  gogossos_expedition.0050_t:0 "Que se passe‑t‑il dans ce monde ?"
  gogossos_expedition.0050_desc:0 "Après avoir traversé la jungle pendant plusieurs heures, je découvre un campement où je rencontre un petit nain attisant le feu. Il lève les yeux et nos regards se croisent, puis il parle doucement avec un accent prononcé :\n\n« Et que crois‑tu faire ici, [Select_CString( ROOT.Char.IsFemale, 'jeune fille', 'jeune homme' )] ? » demandait le nain, auquel je réponds que je cherche à explorer les ruines de Gogossos pour y trouver des trésors. Le nain caresse sa barbe pensivement.\n\nSoudain, il éclate d’un rire sinistre et parle en haut valyrien parfait. La magie brille dans ses yeux"
  gogossos_expedition.0050.a:0 "Je ne me sens pas bien…"
  gogossos_expedition.0050.a.bear:0 "Votre expédition à Gogossos prend fin et vous rentrez chez vous, car vous êtes devenu un ours stupide\n#weak Vous n’en pouvez plus !#!"

  gogossos_expedition.0060:0 "La Bibliothèque"
  gogossos_expedition.0060_t:0 "La Bibliothèque"
  gogossos_expedition.0060_desc:0 "Il semble que j’aie découvert une vieille bibliothèque ; je distingue des rangées d’étagères, certaines garnies de livres, d’autres décrépites et qui s’effritent. Au fond, une table supporte un squelette vêtu de robes en lambeaux, entouré de plusieurs livres dont je devine les titres"
  gogossos_expedition.0060.outcome:0 "Vous concluez votre expédition à Gogossos"
  gogossos_expedition.0060.a:0 "Un livre sur les techniques martiales"
  gogossos_expedition.0060.b:0 "Un livre sur la philosophie"
  gogossos_expedition.0060.c:0 "Un livre intitulé #emphasis L’art de la diplomatie#!"
  gogossos_expedition.0060.d:0 "Un livre explorant la gestion et la gouvernance"
  gogossos_expedition.0060.e:0 "Un livre intitulé #emphasis Le Prince#!"

  gogossos_expedition.0119:0 "Pirates à l’horizon"
  gogossos_expedition.0119_t:0 "Pirates à l’horizon"
  gogossos_expedition.0119_desc:0 "Après plusieurs jours de navigation vers Gogossos, nous apercevons à l’horizon un navire arborant un pavillon noir ; ce drapeau est habituellement celui des pirates dans ces eaux. Espérons qu’ils ne nous remarquent pas…"
  gogossos_expedition.0119.z:0 "Je déteste les pirates…"

  gogossos_expedition.0110:0 "Nous sommes abordés !"
  gogossos_expedition.0110_t:0 "Nous sommes abordés !"
  gogossos_expedition.0110_desc:0 "Les pirates ont rapidement rattrapé notre navire et nous avons été abordés ; leur capitaine et ses hommes sautent sur le pont, épées brandies plus vite que prévu. Cela n’augure rien de bon…"
  gogossos_expedition.0110.a:0 "Cela ne présage rien de bon…"
  gogossos_expedition.0110.a.outcome:0 "Vous vous rendez aux pirates"
  gogossos_expedition.0110.b:0 "Tenez bon, singes de pont maladroits ! Un jour pour mourir vaut un jour de vécu !"
  gogossos_expedition.0110.b.outcome:0 "Vous engagez un duel avec le capitaine pirate"

  gogossos_expedition.0120:0 "Pirates évités"
  gogossos_expedition.0120_t:0 "Pirates évités"
  gogossos_expedition.0120_desc:0 "Il semblerait que les pirates ne nous aient pas repérés ou qu’ils ne se soient pas intéressés à notre navire. Nous avons accosté en toute sécurité ; désormais le véritable danger commence alors que la jungle de Gogossos nous attend"
  gogossos_expedition.120.a:0 "Allons de l’avant pour découvrir ce qui nous attend"

  gogossos_expedition.0111:0 "Aucun adversaire pour mon acier"
  gogossos_expedition.0111_t:0 "Aucun adversaire pour mon acier"
  gogossos_expedition.0111_desc:0 "Le pirate n’a pas résisté à mon acier et [pirate_lord.GetSheHe|l] a été abattu. Les hommes restants du capitaine ont rapidement pris la fuite, nous permettant de poursuivre notre voyage. Espérons que la suite se déroule sans encombre"
  gogossos_expedition.0111.a:0 "Espérons qu’ils étaient le dernier obstacle"
  gogossos_expedition.0111.a.outcome:0 "Votre expédition continue"

  gogossos_expedition.0112:0 "Ma fierté est ternie"
  gogossos_expedition.0112_t:0 "Ma fierté est ternie"
  gogossos_expedition.0112_desc:0 "Le capitaine pirate était trop fort et habile pour moi et j’ai été vaincu et abattu. Bien que vivant, ma fierté est blessée et je suis désormais à la merci des pirates"
  gogossos_expedition.0112.a:0 "Maudits soient-ils !"

  gogossos_expedition.1001:0 "L’ascension"
  gogossos_expedition.1001_t:0 "L’ascension"
  gogossos_expedition.1001_desc:0 "Après avoir échoué sur la plage, nous prenons un moment pour reprendre nos esprits et observer le paysage. Les falaises imposantes nous enferment dans une prison naturelle, ne laissant qu’un seul chemin à suivre : vers le haut. Sans autre moyen d’explorer l’île, nous devons commencer notre ascension en escaladant les parois rocheuses qui se dressent devant nous, espérant trouver des réponses — ou peut‑être un trésor — au‑delà de leur sommet"
  gogossos_expedition.1001.a:0 "En avant et vers le haut !"
  gogossos_expedition.1001.b:0 "Envole‑toi, [my_dragon.GetNameNoTooltip] !"

  gogossos_expedition.1006:0 "La descente finale"
  gogossos_expedition.1006_t:0 "La descente finale"
  gogossos_expedition.1006_desc:0 "Mes doigts agrippent la roche friable, le cœur battant alors que je me hisse toujours plus haut. Le vent hurle et mord ma peau, mais je me force à continuer. Encore un effort — puis la corniche sous mon pied cède. Pendant un instant vertigineux, je flotte dans le vide, les bras cherchant l’air. Le monde tourne tandis que je chute, la plage se précipitant vers moi. Un souffle étouffé s’échappe de mes lèvres, non pas de peur, mais de prise de conscience — c’est la fin. Puis, le silence"
  gogossos_expedition.1006.a:0 "..."

  gogossos_expedition.1002:0 "Le Palais de Marbre"
  gogossos_expedition.1002_t:0 "Le Palais de Marbre"
  gogossos_expedition.1002_desc:0 "En atteignant le sommet abrupt, je secoue la poussière et les débris qui m’adhèrent, exhalant un souffle tandis que le paysage se déploie sous mes yeux ; la terre s’étend à perte de vue, une tapisserie éblouissante de roches dentelées, de jungle dense et de collines ondoyantes baignées dans la lueur dorée du soleil déclinant. Une brume s’élève du couvert végétal, tourbillonnant comme des volutes fantomatiques entre les arbres antiques dont les feuilles émeraude scintillent encore de la chaleur du jour. Mais au‑delà de la jungle et de sa beauté sauvage, mon regard se fixe sur quelque chose de véritablement magnifique : un palais de pierre blanche, majestueux et défiant perché au sommet d’une colline lointaine. Ses flèches élancées percent le ciel, capturant les derniers rayons du jour et brillant comme la citadelle d’anciens dieux. Un frisson m’envahit, une force irrésistible comme si le destin m’appelait. C’est là que doit se trouver le trésor — scellé derrière des murs de marbre et voilé par les échos d’empires oubliés. Mais le temps presse ; la jungle sera traîtresse à la nuit, ses ombres peuplées de créatures inconnues et ses profondeurs chargées de dangers"

  gogossos_expedition.1007:0 "En route vers le palais !"

  gogossos_expedition.1003:0 "Le Palais Silencieux"
  gogossos_expedition.1003_t:0 "Le Palais Silencieux"
  gogossos_expedition.1003_desc:0 "En franchissant l’entrée grandiose du palais, un étrange contraste se dévoile ; de l’extérieur, ses murs blancs immaculés et ses flèches imposantes semblent intacts, mais à l’intérieur, la décrépitude règne. Les halls autrefois majestueux s’effritent, leurs arches dorées fissurées et usées. La poussière étouffe l’air et l’odeur de pourriture imprègne le silence stagnant. Des meubles brisés, réduits à l’état de ruines, jonchent le sol de pierre, leurs tissus autrefois somptueux n’étant plus que lambeaux. Je poursuis ma recherche dans les couloirs abandonnés sans trouver aucun trésor ni signe de vie, seulement les échos d’un âge oublié. Pourtant, alors que le doute s’installe, je découvre un escalier descendant vers l’ombre. Attiré, je descends vers le sous‑sol où les derniers rayons du soleil filtrent à travers des miroirs de cristal complexes, projetant des faisceaux dorés et violets dans la pièce. La lumière se reflète sur des œuvres valyriennes anciennes gravées dans la pierre au‑dessus d’une grande porte ; ces images racontent l’histoire de puissants Seigneurs Dragons régnant sur les cieux, leurs créatures serpentant à travers des nuages de flammes. Leurs yeux, taillés dans des gemmes précieuses, scintillent dans la lumière brisée comme s’ils m’observaient et me jugeaient. Je reste captivé par cette œuvre, ressentant tout le poids de l’histoire peser sur ce lieu, jusqu’à ce qu’une inquiétante réalisation me saisisse : dans tout ce palais, aucun signe de mort. Aucun squelette, aucun reste de ceux qui l’habitaient jadis. Un endroit abandonné par le temps mais étrangement épargné par la mort. Un frisson me parcourt l’échine alors que je m’approche de la porte, la main effleurant sa surface froide ; quelque chose ne tourne pas rond, et je suis sur le point de le découvrir"
  gogossos_expedition.1003.a:0 "Allons dans le sous‑sol je suppose"
  #palace.1:0 "La seule voie pour aller de l'avant est de descendre...."

  gogossos_expedition.1004:0 "La Fresque"
  gogossos_expedition.1004_t:0 "La Fresque"
  gogossos_expedition.1004_desc:0 "En descendant toujours plus profondément dans les entrailles du palais, l’escalier en colimaçon semble infini et l’air devient de plus en plus froid. Des ombres se tordent le long des murs de pierre antiques mais je poursuis ma route, poussé par la curiosité et une inquiétude croissante. Enfin, j’atteins le bas : une vaste chambre étrangement illuminée malgré la profondeur. Une lumière douce et dorée émane de sources invisibles, projetant une lueur surnaturelle sur les murs. Mon souffle se coupe en découvrant une fresque magnifique dont l’art rivalise de beauté et inspire la révérence. Elle représente des dragons dans toute leur splendeur ; chacun unique, chacun époustouflant. Le Dragon Pourpre, ses écailles étincelant comme de l’améthyste, déchaîne un torrent de feu incomparable. Le Dragon Blanc, rapide et féroce, semble se fondre dans le mouvement, tranchant les nuages tel une lame. Le Dragon Rouge, aux yeux brûlants de malice, se dresse en tyran imposant la peur. Et enfin le Dragon Noir, mystérieux et mythique, enveloppé d’une aura sombre, comme s’il existait entre ce monde et l’au‑delà. Je n’ai qu’un instant pour admirer la beauté de la fresque avant d’entendre un grondement familier : la pierre ancienne qui bouge. Mon cœur se serre alors que le bruit s’amplifie et que le sol cède sous mes pieds. Le monde bascule et je hurle, emporté dans les ténèbres tandis que la lueur de la fresque disparaît"
  gogossos_expedition.1004.a:0 "Oh non..."

  evil_death_events.1:0 "Je ne peux plus supporter…"
  evil_death_events.1_t:0 "Je ne peux plus supporter…"
  evil_death_events.1_desc:0 "Je n’en peux plus. Quatre portes se dressent devant moi, chacune vibrant d’une énergie invisible sans offrir aucune issue. Pourpre, Blanc, Rouge, Noir, peu importe combien je scrute leurs motifs complexes, elles restent un mystère. Il n’y a aucune échappatoire, aucune sortie de cet endroit maudit. Juste la pierre froide, la lueur étrange des cristaux et le silence oppressant qui semble s’étendre à l’infini. Je suis condamné à pourrir ici, piégé dans ce cauchemar éternel, avec rien d’autre que ces portes maudites et mon désespoir grandissant. Ma force faiblit déjà, mon corps s’affaiblit à chaque instant. Pourtant je refuse de finir ainsi, oublié et consumé. Si c’est ma fin, ce sera selon mes termes. Mieux vaut affronter l’inconnu que laisser cette forteresse me dépouiller de tout ce que je suis. Mieux vaut mourir debout que mourir lentement dans l’oubli"
  sewingside.1:0 "Je sors mon épée une dernière fois…"

  gogossos_expedition.1005:0 "Emporium des Portes de l’Ours"
  gogossos_expedition.1005_t:0 "Emporium des Portes de l’Ours"
  gogossos_expedition.1005_desc:0 "Alors que je me tiens dans la lueur étrange des cristaux, la chambre s’étend devant moi, vaste et vide, hormis quatre portes qui dominent le mur opposé. Chacune est massive et sculptée de motifs complexes illuminés par la lumière scintillante. Mon cœur bat à tout rompre alors que je m’approche, attiré par leur présence menaçante. La Porte Pourpre brille comme de l’améthyste polie, ornée de flammes et de dragons sinueux dont le feu semble s’animer sous la lumière. La Porte Blanche, en contraste, est lisse comme de l’ivoire poli, sculptée d’un dragon en vol capturé dans un mouvement éternel et baignée d’une lueur spectrale. La Porte Rouge est audacieuse et terrifiante, ses motifs criblés de marques brûlées et d’un dragon monstrueux aux yeux cruels, sa présence irradiant la menace. La Porte Noire est la plus énigmatique, absorbant la lumière comme de l’obsidienne, ses ombres dansantes évoquant une créature plus esprit que bête. Chacune pulse d’une force invisible comme pour m’appeler. Aucune indication de ce qui se cache derrière elles mais je sais qu’il n’y a pas de retour possible. L’une de ces portes est mon chemin — ou ma perte"
  gogossos_expedition.1005.a:0 "Porte Pourpre"
  gogossos_expedition.1005.b:0 "Porte Blanche"
  gogossos_expedition.1005.c:0 "Porte Rouge"
  gogossos_expedition.1005.d:0 "Porte Noire"
  gogossos_expedition.1005.z:0 "Je n’en peux plus…"

  gogossos_expedition.1008:0 "Les sombres couloirs s'étendent sans fin !"
  gogossos_expedition.1008_t:0 "Les sombres couloirs s'étendent sans fin !"
  gogossos_expedition.1008_desc:0 "J’y suis parvenu. D’une manière ou d’une autre j’ai traversé le piège infernal de la salle aux portes et me voilà plus profondément encore dans les profondeurs tortueuses du palais. Mon souffle est court, mon cœur bat à tout rompre tandis que je prends un instant pour reprendre mes esprits. L’air ici semble plus lourd, plus froid, comme s’il m’écrasait, et la faible lueur des cristaux persiste pour me guider vers l’avant.\n\nDevant moi s’étend un couloir interminable, son extrémité avalée par les ombres. Les murs, taillés dans la même pierre antique que le reste du palais, sont ici gravés de runes faiblement lumineuses — motifs d’une langue oubliée qui pulsent doucement comme vivants. Le couloir vibre d’une énergie étrange que je sens jusque dans mes os.\n\nLe sol est humide, glissant de condensation, et chaque pas résonne comme un murmure qui me revient. J’ai l’impression que cet endroit m’observe, m’écoute, attend.\n\nQuelque chose d’inquiétant se dégage de ce passage, au point que la nuque se hérisse. L’air se refroidit à chaque pas et un bourdonnement sourd envahit le silence, d’abord lointain puis de plus en plus fort, tel un cœur battant au loin.\n\nLe couloir paraît sans fin, les ombres devant refusant de céder à la lumière. Tous mes instincts me disent de rebrousser chemin, de trouver une autre issue, mais je sais qu’il n’y a plus de retour possible. Quoi qu’il m’attende au bout, je dois l’affronter. Mes doigts se resserrent sur la garde de mon arme tandis que j’avance, pas après pas, vers l’inconnu"
  gogossos_expedition.1008.a:0 "Au moins ce ne sont pas les arrière‑salles…"

  gogossos_expedition.1009:0 "Le Mage !"
  gogossos_expedition.1009_t:0 "Le Mage !"
  gogossos_expedition.1009_desc:0 "Enfin, le couloir s’achève. Devant moi, une vieille porte en bois gît brisée au sol, ses débris épars comme les vestiges d’une barrière oubliée. Au-delà du cadre fracassé s’ouvre une pièce hors du commun : les quartiers d’un mage, intacte malgré le poids des siècles, lourdement marquée par l’abandon.\n\nLa pièce est un chaos organisé : murs bordés d’étagères croulant sous des tomes anciens, parchemins et fragments de papyrus. L’air est chargé de l’odeur âcre du papier vieilli et d’expériences alchimiques oubliées. Des fioles de verre, certaines brisées, d’autres intactes, jonchent les tables, leurs liquides luisant faiblement sous la pâle lumière cristalline. D’étranges appareils, au but insondable, reposent à côté, leurs cadres de laiton et d’argent ternis mais finement ouvragés.\n\nMais c’est la table au fond qui attire mon regard : un squelette drapé d’une robe à capuche en lambeaux, les os jaunis par le temps, disposé comme s’il avait choisi ce lieu pour son ultime repos. Devant lui, éparpillés sur la table, reposent un journal relié de cuir craquelé mais intact et plusieurs lingots d’or scintillant même dans la faible clarté. Le journal semble m’appeler, sa présence plus fascinante que l’or lui-même. Mes doigts hésitent au‑dessus de sa couverture — cette pièce semble receler des réponses, ou peut‑être encore plus de questions.\n\nQui était ce mage ? Que lui est‑il arrivé ? Et pourquoi ai‑je l’impression d’avoir découvert quelque chose qui n’aurait jamais dû être trouvé ?"

  gogossos_expedition.1009.b:0 "Que dit le journal ?"

  gogossos_expedition.1210:0 "Le rêve d’une vie…"
  gogossos_expedition.1210_t:0 "Le rêve d’une vie…"
  gogossos_expedition.1210_desc:0 "Je saisis le journal à mains tremblantes, essuyant la fine couche de poussière qui le recouvrait. Mes doigts suivent la reliure de cuir fissurée tandis que je feuillette ses pages fragiles, l’encre fanée mais toujours lisible. Je me concentre rapidement sur la dernière entrée, attiré par les pensées finales du mage défunt.\n\nCes mots me glacèrent le sang. Il y décrivait ses dernières heures, comment la Peste de Sang gogossosi avait ravagé son corps de l’intérieur — fièvre, hémorragies, faiblesse qui l’auraient empêché de poursuivre son œuvre. Il regrettait ses expériences inachevées, son potentiel gâché et l’héritage qu’il ne laisserait jamais. Son désespoir suintait de chaque mot, rappel cruel de la fatalité de sa fin.\n\nMais avant que je puisse continuer, la pièce trembla. Un grondement sourd, tel le rugissement d’une bête éveillée, fit vibrer les murs de pierre. La poussière tomba en nuages tandis que la lumière cristalline vacillait. Des morceaux de roche se détachaient du plafond, suivis de craquements menaçants. La pièce s’effondrait.\n\nLa panique m’envahit. Je repoussai le journal — trop lourd et fragile — et attrapai les lingots d’or. Instinctivement, je courus vers la sortie, mais à ma sortie, les runes gravées au sol s’illuminèrent d’une lueur aveuglante. Un bourdonnement assourdissant m’engloutit et ma vision se mua en lumière blanche.\n\nLorsque je repris connaissance, je n’étais plus dans le palais mais sur une plage. Le sable chaud sous mes pieds, le fracas des vagues, l’air salin — tout contrastait avec l’atmosphère froide et putride que je venais de quitter. Mon cœur battait encore la chamade, mon esprit tourbillonnant de questions. Comment avais-je atterri ici ? Était-ce un mécanisme de secours du mage ou une force inconnue qui avait agi ? Une seule certitude subsistait : j’avais échappé au palais — pour l’instant."
  gogossos_expedition.1210.b:0 "Allons… simplement rentrer chez nous"
  gogossos_expedition.1210.b.outcome:0 "Vous concluez votre expédition à Gogossos"
  ambush.1:0 "AAAAAAAGHH!!!!"

  gogossos_expedition.1100:0 "La Chambre du Dragon"
  gogossos_expedition.1100_t:0 "La Chambre du Dragon"
  gogossos_expedition.1100_desc:0 "En descendant dans le sous-sol, un frisson me parcourt l’échine. L’air est épais de poussière et d’une odeur d’antique oubli. Mes pas résonnent dans la pénombre jusqu’à ce que je m’arrête net : dans l’ombre se tient un dragon vivant. Sa forme massive, lovée dans l’obscurité, scintille faiblement. Ma respiration se fige ; un tel spectacle ne devrait pas être possible. Les Seigneurs Dragons d’autrefois sont devenus légende — comment une de leurs créatures a‑t‑elle survécu ici ?\n\nÉmerveillé et terrifié, je réalise qu’il doit y avoir quelque chose de précieux caché ici. Je ne suis pas venu jusqu’ici pour repartir les mains vides"

  gogossos_expedition.1100.a:0 "Je vais tuer cette bête et réclamer mon prix !"
  gogossos_expedition.1100.b:0 "Je suis du sang du dragon ! Vous vous inclinerez devant moi !"
  gogossos_expedition.1100.b.outcome:0 "Vous tentez de dompter le dragon. Quel que soit le résultat, votre expédition à Gogossos prend fin ici."

  gogossos_expedition.1101:0 "Le Champion"
  gogossos_expedition.1101_t:0 "Le Champion"
  gogossos_expedition.1101_desc:0 "La bataille fut féroce, chaque instant un test de volonté et d’endurance. Le dragon rugissait, son souffle enflammé brûlant l’air, mais j’avais déjà appris à anticiper ses mouvements. À chaque coup retentissant de ses griffes, je dansais entre la mort et la survie, ma lame trouvant des ouvertures là où ses écailles s’écartaient juste assez. Il a chargé, et je me suis roulé sous lui, enfonçant mon arme profondément dans son ventre exposé. Un cri assourdissant a déchiré la chambre alors que la bête se débattait, sa queue massive fracassant la pierre lors de son ultime lutte désespérée.\n\nDans un dernier sursaut de force, j’ai grimpé sur son dos, agrippant les crêtes de sa colonne vertébrale pendant que j’enfonçais mon épée à la base de son crâne. Le dragon a poussé un dernier souffle tremblant avant de s’effondrer, son corps énorme faisant vibrer le sol à sa chute. Je suis resté au-dessus de lui, le torse haletant, le sang et la suie accrochés à ma peau. La créature autrefois puissante gisait immobile, son règne oublié enfin révolu.\n\nLe silence qui suivit était lourd, mais je ne ressentais aucun regret. J’avais abattu une légende — et désormais, le butin de son antre ancien était mien pour toujours"

  gogossos_expedition.1101.a:0 "Qu’est-ce que c’est ?"

  gogossos_expedition.1102:0 "L’Épreuve du Sang"
  gogossos_expedition.1102_t:0 "L’Épreuve du Sang"
  gogossos_expedition.1102_desc:0 "Après avoir tué le dragon et réclamé son trésor, je tournai mon regard vers l’autre extrémité de la chambre, où quelque chose de bien plus sinistre m’attendait. Une porte massive, forgée en acier noirci, se dressait devant moi. Tordue et déchiquetée, sa surface arborait l’image d’un visage grimaçant, figé dans une expression éternelle, sa gueule béante assez large pour engloutir un homme tout entier.\n\nDevant la porte se tenait un pilier de pierre, ancien et usé, sur lequel reposait un simple bol. Il paraissait anodin au premier regard, excepté pour les étranges runes gravées sur son rebord — des symboles qui semblaient se mouvoir et se tordre sous mon regard. À l’intérieur du bol gisait un poignard rouillé, dont la lame jadis aiguisée était émoussée par le temps et la corrosion.\n\nÀ mesure que je m’approchais, un frisson me parcourut l’échine. Des murmures — doux, insidieux — effleuraient mon esprit comme des doigts glacés. Ils m’appelaient, murmurant des mots que je ne pouvais comprendre, mais que je ressentais jusque dans mes os. Ils m’incitaient, m’ordonnaient d’avancer, me contraignant à saisir le poignard.\n\nL’offrande exigée était claire : mon sang. Les runes pulsaient faiblement, comme si elles ressentaient mon hésitation, tandis que les murmures se faisaient de plus en plus pressants. Quoi qu’il y ait derrière cette porte ne se révélera pas sans sacrifice"

  gogossos_expedition.1102.a:0 "Une petite offrande suffira"
  gogossos_expedition.1102.b:0 "Seule une grande offrande conviendra"
  gogossos_expedition.1102.c:0 "Je ne pense pas que ce soit judicieux. Je vais laisser tomber"
  gogossos_expedition.1102.c.outcome:0 "Vous concluez votre expédition à Gogossos"

  gogossos_expedition.2001:0 "T'es un débile !"
  gogossos_expedition.2001_t:0 "T'es un débile"
  gogossos_expedition.2001_desc:0 "Le couteau, bien qu’apparaissant émoussé et usé, a ouvert ma peau comme du beurre. Il n'y avait aucune résistance, aucune douleur—seulement cette étrange facilité avec laquelle il traversait la chair. Le sang a instantanément jailli, coulant en ruisseaux épais et cramoisis dans le bol qui attendait. Les runes bordant son rebord ont éclaté d'une lueur maladive, comme si elles buvaient profondément dans mon offrande. Puis, la porte a gémi. Un bruit lent, grinçant, du métal frottant contre la pierre. Le visage tordu gravé dessus semblait se transformer, son expression autrefois accrochante se tordant en quelque chose de bien pire—un sourire. Un sourire profond et sinistre. Une vague de vertige m'a envahi. Ma vision s’est floutée, sombres aux bords. Je balançais sur mes pieds, luttant pour rester debout, mais mes membres me semblaient incroyablement lourds. Malgré tout, je l'ai vue—la porte s’ouvrait. Ce qu'il y avait derrière était à portée de main. Je me forçais à avancer, voulant que mon corps bouge. Mais je suis tombé. Une chute brusque, implacable, sur le sol de pierre glacée. La panique m’a envahi en tentant de me relever, mais ma force était partie. Le poignard a glissé de mes doigts, frappant inutilement le sol à côté de moi. Et alors, la véritable horreur a frappé.
  gogossos_expedition.2001.dumbass:0 "..."

  gogossos_expedition.2002:0 "Le Caveau des Souhaits"
  gogossos_expedition.2002_t:0 "Le Caveau des Souhaits"
  gogossos_expedition.2002_desc:0 "La lame, bien que paraissant émoussée et usée, a fendu ma peau comme du beurre. Il n’y eut aucune résistance, aucun mal — seulement la facilité troublante avec laquelle elle trancha la chair. Le sang jaillit immédiatement, s’écoulant en épais filets cramoisis dans le bol en attente. Les runes bordant son rebord s’embrasèrent d’une lueur maladive, comme assoiffées de mon offrande.\n\nPuis, la porte gémit. Un bruit lent et râpeux, du métal frottant contre la pierre. Le visage tordu qui y était sculpté sembla se mouvoir, son expression autrefois menaçante se transformant en quelque chose de bien pire — un sourire. Un sourire profond et plein de savoir.\n\nMais alors, quelque chose d’inattendu se produisit. Une vive sensation de picotement parcourut ma paume et, en baissant les yeux, je constatai que la blessure avait disparu. Ma peau s’était reconstituée, l’offrande de sang absorbée sans laisser la moindre trace de dommage. Mon souffle hésitait tandis que j’avançais, franchissant le seuil de la porte désormais ouverte, pour pénétrer dans la chambre au-delà.\n\nLe Caveau des Souhaits.\n\nMes yeux s’écarquillèrent en découvrant le spectacle devant moi — des artefacts dorés empilés en hauteur, des coupes ornées de pierres précieuses étincelant dans la faible lumière des torches, des gemmes dispersées telles de simples cailloux sur le sol. Une richesse inimaginable, intacte depuis des siècles. Tel était le véritable trésor, le butin que le dragon avait gardé, le prix dissimulé derrière sa forme monstrueuse.\n\nMais parmi ces richesses scintillantes, un objet attira mon regard par-dessus tout. Perché sur un piédestal, baigné d’une lueur éthérée, se trouvait l’artefact que je recherchais. La raison pour laquelle j’étais parvenu aussi loin. Mon cœur battait à tout rompre en m’approchant, le poids de mon périple culminant en ce moment tant attendu."
  gogossos_expedition.2002.a:0 "C'est magnifique..."
  gogossos_expedition.2002.a.outcome:0 "Vous concluez votre expédition à Gogossos."

  evil_death_events.1:0 "Je n'en peux plus..."
  evil_death_events.1_t:0 "Je n'en peux plus..."
  evil_death_events.1_desc:0 "Quatre portes se dressent devant moi — pourpre, rouge, blanche et noire. Je les ai toutes essayées, passant de l'une à l'autre, pour être ramené sans cesse dans cette même pièce maudite. Quel que soit le chemin choisi, peu importe le nombre de fois, je finis toujours ici. Un cercle vicieux, une prison sans murs.\n\nJe serre les poings, mon souffle court alors que la frustration me déchire. Je ne peux plus continuer ainsi. Le cycle interminable, la répétition étouffante — cela me brise. Mais je refuse de céder à la folie. Je refuse de mourir de faim, de me faner dans cet endroit, en attendant une échappatoire inexistante.\n\nSi tel est mon destin, alors je le finirai selon mes propres termes."

  sewingside.1:0 "Je sors mon épée une dernière fois..."
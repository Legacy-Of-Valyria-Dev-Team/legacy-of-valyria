l_french:
  funding_expedition.0001:0 "Financer une Expédition"
  fund_expedition_0001_t:0 "Financer une Expédition"
  fund_expedition_0001_desc:0 "J'ai pris la décision de me lancer dans une expédition, me procurant les cartes nécessaires des régions cartographiées autour des Îles du Basilic et calculant avec soin les provisions dont j'aurai besoin. Il me faut maintenant choisir une destination. Entre Gogossos et Sothoryos, la première demeure l'option la plus sûre, bien qu'elle soit moins susceptible de révéler des trésors de valeur. Je pourrais emprunter le chemin le plus périlleux et mettre le cap sur Sothoryos, dont les terres quasiment inviolées regorgent assurément de richesses, mais grouillent également de dangers bien plus terrifiants dans leurs profondeurs."
  funding_expedition.0001.a:0 "Je devrais me rendre à Gogossos"
  funding_expedition.0001.b:0 "Je devrais me rendre à Sothoryos (Non fonctionnel, en développement)"
  funding_expedition.0001.z:0 "Finalement, non"

  gogossos_expedition.0001:0 "Qu'ai-je Découvert ?"
  gogossos_expedition_0001_t:0 "Qu'ai-je Découvert ?"
  gogossos_expedition_0001_desc:0 "Après avoir marché des jours durant à travers une jungle épaisse et une boue tenace, nous avons enfin découvert les premiers vestiges de civilisation. Il s'agit d'un vaste édifice de pierre envahi par la végétation, bien que je parvienne à distinguer la forme d'une porte à travers les broussailles enchevêtrées."
  gogossos_expedition.0001.a:0 "Qu'avons-nous là ?"
  gogossos_expedition.0001.a.outcome:0 "Vous engagez un duel contre cette... #emphasis chose#!"
  gogossos_expedition.0001.b:0 "Je crois qu'il est temps de partir..."
  gogossos_expedition.0001.b.outcome:0 "Vous vous frayez un chemin hors de la jungle et reprenez la route du foyer."

  gogossos_expedition.0002:0 "Pas Ces Maudits Casse-têtes de Piliers"
  gogossos_expedition_0002_t:0 "Pas Ces Maudits Casse-têtes de Piliers"
  gogossos_expedition_0002_desc:0 "Ayant franchi l'entrée, je me suis aventuré plus avant dans la ruine, la découvrant dans un état remarquablement préservé. La ruine mène à une chambre dotée d'une imposante grille d'acier et de trois piliers disposés dans la pièce, chacun étant rotatif et orné de symboles sur chaque face représentant respectivement un chien, un aigle, un loup-garou et un corbeau. Au centre de la salle se dresse un levier solitaire.\n\nUne fresque orne le mur au-dessus de la porte. Ces mots y sont gravés :\n\n#emphasis Près d'un arbre au bord d'une rivière, un trou s'ouvre dans le sol\nCinq loups-garous affrontent sept chiens, tandis que deux corbeaux tournent en rond\nSix chiens périrent en tuant les cinq loups-garous sous le voile de la nuit\nTandis qu'un corbeau fut occis par un aigle dans un terrible combat#!\n\nSous chaque section de la fresque apparaît le texte suivant :\n\n#emphasis J'ai du temps à tuer, regards furtifs dans les corridors\nSans le moindre plan de ta part\nUn merle chante sur la colline de l'oiseau bleu\nGrâce à l'appel de l'Enfant du Sage Sauvage#!"

  gogossos_expedition.0002.a:0 "Advienne que pourra..."
  gogossos_expedition.0002.a.outcome:0 "Vous actionnez le levier"

  pillar_mural_turn:0 "Vous tournez le pilier"

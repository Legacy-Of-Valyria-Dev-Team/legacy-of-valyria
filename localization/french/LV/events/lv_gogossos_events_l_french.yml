l_french:
  funding_expedition.0001:0 "Financement d'une Expédition"
  fund_expedition_0001_t:0 "Financement d'une Expédition"
  fund_expedition_0001_desc:0 "J'ai décidé de partir en expédition, me procurant les cartes nécessaires des régions cartographiées autour des Îles du Basilic et planifiant les provisions dont j'aurai besoin. Je dois maintenant choisir une destination. Entre Gogossos et Sothoryos, la première est l'option la plus sûre bien que moins susceptible de receler des objets de valeur. Je pourrais emprunter le chemin plus périlleux vers Sothoryos, dont les terres largement inexplorées regorgent certainement de trésors, mais aussi de dangers bien plus grands en leurs profondeurs"
  funding_expedition.0001.a:0 "Je devrais me diriger vers Gogossos"
  funding_expedition.0001.b:0 "Je devrais me diriger vers Sothoryos (Pas encore fonctionnel - En développement)"
  funding_expedition.0001.z:0 "J'y repenserai"

  gogossos_expedition.0001:0 "Qu'ai-je Découvert?"
  gogossos_expedition_0001_t:0 "Qu'ai-je Découvert?"
  gogossos_expedition_0001_desc:0 "Après avoir marché durant des jours à travers l'épaisse jungle et la boue, nous avons enfin trouvé nos premiers vestiges de civilisation. Il semble s'agir d'un grand bâtiment de pierre envahi par la végétation, bien que je puisse distinguer la forme d'une porte à travers tout ce sous-bois"
  gogossos_expedition.0001.a:0 "Qu'avons-nous là?"
  gogossos_expedition.0001.a.outcome:0 "Vous entamez un duel avec cette... #emphasis chose#!"
  gogossos_expedition.0001.b:0 "Je crois qu'il est temps de partir..."
  gogossos_expedition.0001.b.outcome:0 "Vous vous frayez un chemin hors de la jungle et rentrez chez vous"

  gogossos_expedition.0002:0 "Pas Encore Ces Maudits Casse-têtes à Piliers"
  gogossos_expedition_0002_t:0 "Pas Encore Ces Maudits Casse-têtes à Piliers"
  gogossos_expedition_0002_desc:0 "Ayant franchi l'entrée, je me suis aventuré plus loin dans la ruine, la trouvant dans un état remarquablement préservé. La ruine mène à une chambre avec une grande porte d'acier entourée de 3 piliers, chacun comportant différents éléments rotatifs ornés de symboles représentant respectivement un chien, un aigle, un loup-garou et un corbeau. Au centre de la pièce se trouve un levier solitaire.\n\nUne fresque orne le mur au-dessus de la porte. Ces mots y sont gravés :\n\n#emphasis Près d'un arbre au bord d'une rivière se trouve un trou dans le sol\nCinq loups-garous affrontent sept chiens, tandis que deux corbeaux volent en cercle\nSix chiens périrent en tuant les cinq loups-garous dans le voile de la nuit\nTandis qu'un corbeau fut tué par un aigle dans un terrible combat#!\n\nSous chaque section de la fresque apparaît le texte suivant :\n\n#emphasis J'ai du temps à tuer, regards furtifs dans les corridors\nSans un plan qui soit vôtre\nUn merle chante sur la colline du rouge-gorge\nGrâce à l'appel de l'Enfant du Sage Sauvage#!"

  gogossos_expedition.0002.a:0 "Allons-y..."
  gogossos_expedition.0002.a.outcome:0 "Vous actionnez le levier"

  pillar_mural_turn:0 "Vous tournez le pilier"

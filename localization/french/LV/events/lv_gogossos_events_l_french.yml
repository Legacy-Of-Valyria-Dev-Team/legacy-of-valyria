  gogossos_expedition.0003:0 "Je n'en Crois Pas Mes Yeux"
  gogossos_expedition.0003_t:0 "Le Tombeau du Seigneur Dragon"
  gogossos_expedition.0003_desc:0 "En pénétrant dans le tombeau, je constate qu'il s'agit d'une vaste salle carrée ornée de statues de chevaliers valyriens et de magnifiques fresques représentant [old_valyria|E] à son apogée.\n\nJ'aperçois d'imposants monceaux d'or soigneusement empilés près du grand sarcophage au centre de la pièce, accompagnés de pierres précieuses et d'ornements d'or fin.\n\nEn faisant glisser le couvercle du sarcophage, je découvre un squelette à l'intérieur et..."
  gogossos_expedition.0003.a:0 "Qu'avons-nous là ?"
  gogossos_expedition.0003.outcome:0 "Vous récupérez le trésor à l'intérieur et concluez votre expédition à Gogossos."

  gogossos_expedition.0003.a.outcome.egg:0 "Vous découvrez un œuf de dragon"
  gogossos_expedition.0003.a.outcome.blood:0 "Vous découvrez un parchemin de magie du sang"
  gogossos_expedition.0003.a.outcome.water:0 "Vous découvrez un parchemin de magie aquatique"
  gogossos_expedition.0003.a.outcome.shadow:0 "Vous découvrez un parchemin de magie des ombres"

  gogossos_expedition.0004:0 "Je n'en Crois Pas Mes Yeux !"
  gogossos_expedition.0004_t:0 "Je n'en Crois Pas Mes Yeux !"
  gogossos_expedition.0004_desc:0 "En pénétrant dans le tombeau avec l'espoir de le piller de ses trésors, je m'immobilise aussitôt. Glacé de terreur, je lève les yeux et aperçois..."
  gogossos_expedition.0004.a:0 "UN DRAGON !"

  gogossos_expedition.00041:0 "Les Apparences Sont Trompeuses ?"
  gogossos_expedition.00041_t:0 "Les Apparences Sont Trompeuses ?"
  gogossos_expedition.00041_desc:0 "Fort heureusement, il semble que le dragon soit mort depuis longtemps et ne soit plus qu'une carcasse en décomposition, mais ce sur quoi sa dépouille repose est bien réel... de l'or ! Le dragon défunt couvait un immense trésor d'or, bien que le reste du tombeau semble avoir été profané. Toutes les œuvres d'art et les statues ont été défigurées et endommagées au-delà de toute reconnaissance."
  gogossos_expedition.00041.a:0 "Espérons que ce n'est pas maudit comme l'or de Thorin"
  gogossos_expedition.00041.outcome:0 "Vous concluez votre expédition à Gogossos."

  gogossos_expedition.00042:0 "Le Tueur de Dragons"
  gogossos_expedition.00042_t:0 "Le Tueur de Dragons"
  gogossos_expedition.00042_desc:0 "L'adrénaline continue de déferler violemment dans tout mon corps. Pendant un instant, rien ne semblait réel. Je ne suis pas certain de ce qui s'est passé, mais une chose est sûre : ce dragon ne me causera plus jamais d'ennuis. J'ai terrassé un dragon et j'ai survécu pour en conter l'histoire."
  gogossos_expedition.00042.a:0 "Au moins, j'ai obtenu de l'or pour mes peines !"
  gogossos_expedition.00042.outcome:0 "Vous concluez votre expédition à Gogossos."

  gogossos_expedition.0050:0 "Que Se Passe-t-il Donc ?"
  gogossos_expedition.0050_t:0 "Que Se Passe-t-il Donc ?"
  gogossos_expedition.0050_desc:0 "Après avoir voyagé à travers la jungle pendant quelques heures, j'ai découvert un campement où j'ai rencontré un petit nain attisant le feu. Il leva les yeux et nos regards se croisèrent, puis il parla doucement avec un accent prononcé :\n\n« Et que penses-tu faire ici, [Select_CString( ROOT.Char.IsFemale, 'fillette', 'garçon' )] ? » demanda le nain, à quoi je répondis que je souhaitais explorer les ruines de Gogossos en quête de trésors. Le nain caressa pensivement sa barbe.\n\nSoudain, il éclata d'un rire sinistre et parla en haut valyrien parfait. La magie emplit les yeux du nain."
  gogossos_expedition.0050.a:0 "Je ne me sens pas très bien..."
  gogossos_expedition.0050.a.bear:0 "Votre expédition à Gogossos prend fin et vous regagnez votre foyer, car vous êtes devenu un ours ridicule.\n#weak C'est insupportable !#!"

  gogossos_expedition.0060:0 "La Bibliothèque"
  gogossos_expedition.0060_t:0 "La Bibliothèque"
  gogossos_expedition.0060_desc:0 "Il semble que je sois tombé sur une ancienne bibliothèque.\n\nJ'aperçois des rangées et des rangées d'étagères, certaines garnies de livres, d'autres décrépites et s'effritant en morceaux. Je distingue une table au fond avec un squelette vêtu de robes en lambeaux, assis devant plusieurs ouvrages étalés. Je parviens tout juste à lire les titres de chacun d'eux."
  gogossos_expedition.0060.outcome:0 "Vous concluez votre expédition à Gogossos."
  gogossos_expedition.0060.a:0 "Un livre sur les techniques martiales"
  gogossos_expedition.0060.b:0 "Un livre sur la philosophie"
  gogossos_expedition.0060.c:0 "Un livre intitulé #emphasis L'Art de la Diplomatie#!"
  gogossos_expedition.0060.d:0 "Un livre explorant l'intendance et la gouvernance"
  gogossos_expedition.0060.e:0 "Un livre intitulé #emphasis Le Prince#!"

  gogossos_expedition.0119:0 "Pirates à l'Horizon"
  gogossos_expedition.0119_t:0 "Pirates à l'Horizon"
  gogossos_expedition.0119_desc:0 "Ayant pris la mer il y a plusieurs jours en direction de notre aventure à Gogossos, nous avons repéré un navire à l'horizon arborant un pavillon noir, typiquement hissé par les pirates qui écument ces eaux.\n\nEspérons qu'ils ne nous repèrent pas..."
  gogossos_expedition.0119.z:0 "Je hais les pirates..."

  gogossos_expedition.0110:0 "Nous Avons Été Abordés !"
  gogossos_expedition.0110_t:0 "Nous Avons Été Abordés !"
  gogossos_expedition.0110_desc:0 "Les pirates ont rapidement rattrapé notre navire et nous avons été abordés ! Leur capitaine et ses hommes bondissent sur le pont, épées brandies plus vite que je ne l'avais anticipé. Cela s'annonce mal..."
  gogossos_expedition.0110.a:0 "Cela s'annonce très mal..."
  gogossos_expedition.0110.a.outcome:0 "Vous vous rendez aux pirates."
  gogossos_expedition.0110.b:0 "Bordez les vergues, bande de singes maladroits ! Un jour pour mourir est un jour qui vaut la peine d'être vécu !"
  gogossos_expedition.0110.b.outcome:0 "Vous engagez un duel avec le capitaine pirate."

  gogossos_expedition.0120:0 "Pirates Évités"
  gogossos_expedition.0120_t:0 "Pirates Évités"
  gogossos_expedition.0120_desc:0 "Il semblerait que les pirates ne nous aient pas repérés, ou s'ils l'ont fait, ils n'étaient manifestement pas intéressés par notre vaisseau.\n\nNous avons accosté sains et saufs. À partir d'ici, le véritable danger commence alors que la jungle de Gogossos nous fait signe."
  gogossos_expedition.120.a:0 "En avant, voyons ce qu'il y a à découvrir"

  gogossos_expedition.0111:0 "Pas de Taille Face à Mon Acier"
  gogossos_expedition.0111_t:0 "Pas de Taille Face à Mon Acier"
  gogossos_expedition.0111_desc:0 "Le pirate n'était pas de taille face à mon acier et [pirate_lord.GetSheHe|l] fut abattu. Les hommes restants du seigneur pirate prirent rapidement la fuite, nous permettant de poursuivre notre voyage. Espérons que la navigation sera paisible désormais."
  gogossos_expedition.0111.a:0 "Espérons qu'ils étaient le dernier obstacle"
  gogossos_expedition.0111.a.outcome:0 "Votre expédition se poursuit."

  gogossos_expedition.0112:0 "Mon Orgueil Est Terni"
  gogossos_expedition.0112_t:0 "Mon Orgueil Est Terni"
  gogossos_expedition.0112_desc:0 "Le seigneur pirate était trop fort et trop habile pour que je puisse le vaincre, et j'ai été battu et terrassé. Bien que je vive encore, mon orgueil est blessé, et me voilà désormais à la merci des pirates."
  gogossos_expedition.0112.a:0 "Malédiction !"

  gogossos_expedition.1001:0 "L'Ascension"
  gogossos_expedition.1001_t:0 "L'Ascension"
  gogossos_expedition.1001_desc:0 "Après nous être échoués sur la plage, nous avons pris un moment pour reprendre nos esprits, scrutant le paysage autour de nous. Les falaises imposantes nous encerclaient telle une prison naturelle, ne laissant qu'un seul chemin possible : vers le haut. Sans autre moyen d'explorer l'île, nous devons entamer notre ascension, escaladant les parois rocheuses qui se dressent au-dessus de nous, espérant trouver des réponses, ou peut-être même un trésor, au-delà de leurs hauteurs."
  gogossos_expedition.1001.a:0 "En avant et vers le sommet !"
  gogossos_expedition.1001.b:0 "Envolons-nous, [my_dragon.GetNameNoTooltip] !"

  gogossos_expedition.1006:0 "La Chute Fatale"
  gogossos_expedition.1006_t:0 "La Chute Fatale"
  gogossos_expedition.1006_desc:0 "Mes doigts s'agrippaient à la roche friable, le cœur battant à tout rompre tandis que je me hissais toujours plus haut. Le vent hurlait, mordant ma peau, mais je me forçais à continuer l'escalade. Encore un peu... puis la corniche sous mon pied céda. Pendant un instant déchirant, je fus en apesanteur, mes bras saisissant le vide. Le monde tourbillonna tandis que je plongeais, la plage en contrebas se précipitant à ma rencontre. Un hoquet étranglé s'échappa de mes lèvres, non pas de peur, mais de réalisation : c'était la fin. Puis, le silence."
  gogossos_expedition.1006.a:0 "..."

  gogossos_expedition.1002:0 "Le Palais de Marbre"
  gogossos_expedition.1002_t:0 "Le Palais de Marbre"
  gogossos_expedition.1002_desc:0 "Alors que je franchis le sommet de la falaise escarpée, je secoue la poussière et les débris qui s'accrochent à moi, expirant tandis que le monde se déploie sous mon regard. La terre s'étend à perte de vue, une tapisserie époustouflante de roches déchiquetées, de jungle dense et de collines ondulantes baignées dans la lueur dorée du soleil couchant. La brume s'élève de la canopée en contrebas, tourbillonnant comme des vrilles fantomatiques entre les arbres anciens, leurs feuilles émeraude scintillant des vestiges de la chaleur du jour. Mais au-delà de la jungle, au-delà de cette beauté sauvage et indomptée, mes yeux se posent sur quelque chose de véritablement magnifique : un palais de pierre blanche immaculée, se dressant majestueux et défiant au sommet d'une colline lointaine. Ses flèches imposantes percent le ciel, captant les dernières lueurs du jour, brillant comme la citadelle de dieux oubliés.\n\nUn frisson d'excitation me parcourt, une attraction indéniable, comme si le destin lui-même m'appelait. C'est là que doit se trouver le trésor, scellé entre des murs de marbre, voilé dans les échos d'empires perdus. Mais le temps joue contre moi. La jungle en contrebas sera traîtresse de nuit, ses ombres dissimulant des créatures inconnues, ses profondeurs vibrant de murmures de danger."

  gogossos_expedition.1007:0 "En route vers le palais !"

  gogossos_expedition.1003:0 "Le Palais Silencieux"
  gogossos_expedition.1003_t:0 "Le Palais Silencieux"
  gogossos_expedition.1003_desc:0 "Alors que je franchis la grande entrée du palais, un étrange contraste se dévoile devant moi. De l'extérieur, ses murs blancs étincelants et ses flèches imposantes semblent intacts par le temps, majestueux et inébranlables. Mais à l'intérieur, la décrépitude a pris le dessus. Les salles autrefois majestueuses s'effondrent, leurs arches dorées fissurées et usées par les âges. La poussière étouffe l'air, et l'odeur de pourriture persiste dans le silence stagnant. Du mobilier brisé, depuis longtemps réduit à l'état de ruines, jonche les sols de pierre, ses étoffes jadis somptueuses réduites à de simples lambeaux du passé.\n\nJe fouille, m'enfonçant plus profondément dans les corridors abandonnés, mais je ne trouve rien : pas de trésor, aucun signe de vie, seulement les échos d'un âge oublié. C'est comme si le palais lui-même n'était qu'une coquille, une enveloppe vide de grandeur que le temps a depuis longtemps abandonnée. Pourtant, alors que le doute commence à s'insinuer, je découvre un escalier s'enroulant vers les ténèbres.\n\nAttiré, je descends dans le sous-sol, où les derniers rayons du soleil filtrent à travers d'ingénieux miroirs de cristal, projetant des faisceaux chatoyants d'or et de violet à travers la chambre. La lumière accroche quelque chose de stupéfiant : d'antiques œuvres d'art valyriennes, gravées dans la pierre au-dessus de la grande porte devant moi. Les images content une histoire de puissance et de feu, de puissants Seigneurs Dragons régnant sur les cieux, leurs grandes bêtes s'enroulant à travers des nuages de flammes. Leurs yeux, taillés dans des pierres précieuses, scintillent dans la lumière fragmentée, comme s'ils m'observaient, me jugeaient.\n\nJe m'attarde, captivé par l'art, par le poids immense de l'histoire qui pèse sur ce lieu. Mais alors, une réalisation glaçante s'impose à moi : dans tout ce palais, je n'ai vu aucun signe des morts. Pas de squelettes. Pas de restes de ceux qui appelaient autrefois cet endroit leur foyer.\n\nUn lieu abandonné par le temps... mais apparemment épargné par la mort.\nUn frisson me parcourt l'échine tandis que je m'approche de la grande porte, ma main planant au-dessus de sa surface froide. Quelque chose cloche ici. Et je suis sur le point de découvrir quoi."
  gogossos_expedition.1003.a:0 "Descendons dans ce sous-sol, je suppose"
  #palace.1:0 "The only way forward is down...."

  gogossos_expedition.1004:0 "La Fresque"
  gogossos_expedition.1004_t:0 "La Fresque"
  gogossos_expedition.1004_desc:0 "Alors que je descends plus profondément dans les entrailles du palais, l'escalier en spirale semble interminable, l'air se faisant plus froid à chaque pas. Les ombres se tordent et s'agitent le long des anciens murs de pierre, mais je continue d'avancer, poussé à parts égales par la curiosité et l'inquiétude. Enfin, j'atteins le fond : une vaste chambre, impossiblement illuminée malgré les profondeurs. La lumière, douce et dorée, se déverse de sources invisibles, projetant une lueur surnaturelle sur les murs.\n\nMon souffle se coupe devant le spectacle qui s'offre à moi : une autre magnifique fresque, d'un art inégalé, irradiant un sentiment de crainte et de révérence. Celle-ci représente des dragons dans toute leur gloire majestueuse, chacun unique, chacun époustouflant dans sa splendeur.\n\nLe Puissant Dragon Pourpre, ses écailles chatoyant comme l'améthyste, déchaîne un torrent de feu, sa puissance sans égale.\n\nLe Dragon Blanc, rapide et féroce, semble presque flou dans son mouvement, sa silhouette élancée fendant les nuages comme une lame.\n\nLe Dragon Rouge, ses yeux brûlant de malveillance, se dresse en tyran, sa présence imposant crainte et terreur.\n\nEt enfin, le Dragon Noir, mystérieux, mythique, sa forme enveloppée d'une aura de sombre majesté, comme s'il existait entre ce monde et le suivant.\n\nJe n'ai qu'un instant pour m'émerveiller devant la beauté de la fresque, mes doigts effleurant le bord des sculptures complexes. Puis, le bruit survient. Un grondement sourd et familier de pierre ancienne qui se déplace. Mon cœur se fige dans ma poitrine, et un frisson glacé me parcourt l'échine tandis que le bruit s'intensifie, plus violent. Je fais volte-face, les yeux écarquillés d'alarme, juste au moment où le sol sous mes pieds cède.\n\nLe monde bascule, et je suis en apesanteur, mon cri restant coincé dans ma gorge tandis que la pierre s'effondre dans les ténèbres. Mon esprit a à peine le temps d'enregistrer la terreur avant que je ne plonge dans l'inconnu, la faible lueur de la fresque s'évanouissant tandis que je chute."
  gogossos_expedition.1004.a:0 "Oh non..."

  # evil_death_events.1:0 "I Can't Take it..."
  # evil_death_events.1_t:0 "I Can't Take it..."
  # evil_death_events.1_desc:0 "I can't take it anymore. These four doors stand before me, each one pulsing with an unseen energy, yet none offering a way out. Purple, White, Red, Black—no matter how long I stare, no matter how much I search for answers in their intricate designs, they remain an enigma. There's no escape, no exit from this wretched place. Just the cold, unyielding stone, the eerie glow of the crystals, and the oppressive silence that seems to stretch into eternity.\n\nI'm doomed to waste away here, trapped in this endless nightmare, with nothing but these cursed doors and my own growing despair for company. My strength is already failing me, my body weakening with every passing moment. I can feel the emptiness creeping in, my mind clawing at the edges of sanity.\n\nBut I won't let it end like this. I refuse to wither into a husk, to become a shadow of myself, forgotten and consumed by this place. If this is to be my end, it will be on my terms, by my own hand. I will not let dishonor take me, nor the slow, cruel grip of starvation.\n\nI glance at the doors one last time, their silent presence mocking me, and steel myself for what must be done. Better to face the unknown than to let this cursed palace strip me of all that I am. Better to go with defiance in my heart than to let the darkness claim me piece by piece."
  # sewingside.1:0 "I pull out my sword one last time..."

  gogossos_expedition.1005:0 "L'Emporium des Portes de l'Ours"
  gogossos_expedition.1005_t:0 "L'Emporium des Portes de l'Ours"
  gogossos_expedition.1005_desc:0 "Alors que je me tiens dans la lueur inquiétante des cristaux, la chambre s'étend devant moi, vaste et vide, à l'exception de quatre portes qui dominent son mur du fond. Chaque porte est massive et ornée de motifs complexes, leurs détails illuminés par la lumière chatoyante des cristaux au-dessus. Mon cœur bat la chamade tandis que je fais un pas, attiré par leur présence sinistre.\n\nLes portes sont sans pareilles, chacune irradiant sa propre aura distincte, comme si elle était imprégnée de pouvoir.\n\nLa Porte Pourpre luit comme de l'améthyste polie, sa surface animée de gravures de flammes et de dragons serpentins entrelacés. Le feu qu'ils crachent semble presque se mouvoir lorsque la lumière l'effleure, et l'air autour vibre d'une énergie surnaturelle.\n\nLa Porte Blanche, en contraste saisissant, est lisse et uniforme, comme de l'ivoire poli. Ses gravures représentent un dragon en vol, sa forme élancée et gracieuse, les ailes déployées comme figé dans un mouvement éternel. La lumière froide des cristaux lui confère une lueur presque spectrale, comme si elle était épargnée par le temps.\n\nLa Porte Rouge est audacieuse et terrifiante. Sa surface est gravée de motifs déchiquetés et chaotiques, les lignes profondes et rugueuses, comme brûlées dans le bois par le feu lui-même. Un dragon monstrueux aux yeux cruels et perçants est sculpté dans son cadre, sa présence irradiant la menace. Même se tenir près d'elle rend l'air lourd et oppressant.\n\nLa Porte Noire est la plus énigmatique. Elle semble absorber la lumière, sa surface lisse et sombre comme l'obsidienne. Des ombres semblent danser sur elle, se déplaçant et se tordant comme si elles avaient une vie propre. Les gravures ici sont subtiles et difficiles à distinguer, mais le dragon représenté semble d'un autre monde, presque incompréhensible : plus esprit que bête.\n\nChaque porte pulse faiblement d'une force invisible, comme pour me faire signe d'avancer. Pourtant, rien n'indique ce qui se trouve derrière elles. Mes yeux passent de l'une à l'autre, mon esprit en ébullition. Est-ce la fin du palais ? Ou le commencement de quelque chose de bien pire ?\n\nMes instincts me hurlent de choisir avec prudence, mais quoi qu'il arrive, je sais qu'il n'y a plus de retour possible. L'une de ces portes renferme ma voie, ou ma perte."
  gogossos_expedition.1005.a:0 "Porte Pourpre"
  gogossos_expedition.1005.b:0 "Porte Blanche"
  gogossos_expedition.1005.c:0 "Porte Rouge"
  gogossos_expedition.1005.d:0 "Porte Noire"
  gogossos_expedition.1005.z:0 "Je ne veux plus continuer..."

  gogossos_expedition.1008:0 "Les Sombres Couloirs S'étendent à l'Infini !"
  gogossos_expedition.1008_t:0 "Les Sombres Couloirs S'étendent à l'Infini !"
  gogossos_expedition.1008_desc:0 "J'ai réussi. D'une manière ou d'une autre, j'ai traversé le piège dément de la salle aux portes, et me voilà plus profondément encore dans les entrailles tortueuses du palais. Mon souffle est haletant, mon cœur tambourinant dans ma poitrine tandis que je prends un moment pour me stabiliser. L'air ici est plus lourd, plus froid, comme s'il pesait sur moi, et la faible lueur des cristaux persiste encore, me guidant vers l'avant.\n\nDevant moi s'étend un long corridor, impossiblement long, son extrémité engloutie par les ténèbres. Les murs sont taillés dans la même pierre ancienne que le reste du palais, mais ici ils sont bordés de runes faiblement luminescentes : des motifs d'une langue oubliée qui pulsent doucement comme si elles étaient vivantes. Le corridor semble vibrer d'une énergie inquiétante, une étrange vibration que je peux sentir jusque dans mes os.\n\nLe sol sous mes pieds est humide, glissant de condensation, et chaque pas que je fais envoie un écho dans le corridor qui me revient comme un murmure. C'est comme si l'endroit observait, écoutait, attendait.\n\nIl y a quelque chose de troublant dans ce couloir, quelque chose qui fait dresser les cheveux sur ma nuque. L'air devient plus froid à chaque pas, et un étrange bourdonnement sourd commence à emplir le silence. Il est distant au début, mais plus je marche, plus il s'intensifie, comme le son d'un battement de cœur lointain, profond et résonnant.\n\nLe corridor semble sans fin, les ténèbres devant refusant de céder à la lumière. Chaque instinct me dit de faire demi-tour, de trouver une autre voie, mais je sais qu'il n'y a plus de retour possible. Quoi qu'il se trouve au bout de ce corridor, je dois l'affronter. Mes doigts se resserrent autour de la poignée de mon arme tandis que je poursuis ma progression, chaque pas m'entraînant plus profondément dans l'inconnu."
  gogossos_expedition.1008.a:0 "Au moins, ce ne sont pas les backrooms..."

  gogossos_expedition.1009:0 "Le Mage !"
  gogossos_expedition.1009_t:0 "Le Mage !"
  gogossos_expedition.1009_desc:0 "Enfin, le corridor prend fin. Devant moi, une vieille porte de bois gît fracassée au sol, ses débris éparpillés comme les vestiges d'une barrière depuis longtemps oubliée. Au-delà du cadre brisé se trouve une salle sans pareille dans ce palais : les quartiers d'un mage, épargnés par le temps mais lourds du poids de l'abandon.\n\nLa pièce est un chef-d'œuvre chaotique, ses murs bordés d'étagères imposantes croulant sous les tomes anciens, les parchemins et les fragments de papier. L'air est chargé du léger parfum du papier vieilli et de la senteur âcre d'expériences alchimiques depuis longtemps dormantes. Des fioles de verre, certaines fêlées et d'autres encore intactes, encombrent les tables, remplies de liquides qui scintillent faiblement sous la lumière pâle des cristaux au-dessus. D'étranges appareils, dont le but est insondable, reposent à leurs côtés, leurs cadres de laiton et d'argent ternis mais curieusement ouvragés.\n\nMais c'est la table au fond de la pièce qui attire mon attention. Là, affalé sur sa surface, se trouve un squelette drapé d'une robe à capuche en lambeaux. Les os sont jaunis par l'âge, mais il y a quelque chose d'étrangement délibéré dans sa position. C'est comme si le mage, si c'est bien ce qu'il était, savait que la fin approchait et avait choisi cet endroit comme dernier lieu de repos.\n\nDevant le squelette, éparpillée sur la table, se trouve une collection d'objets. Un journal poussiéreux relié de cuir, sa couverture craquelée mais intacte, trône au centre. L'air autour semble lourd, comme s'il recelait des secrets destinés à rester enfouis. À côté du journal, luisant même dans la faible lumière, se trouvent plusieurs lingots d'or, leurs bords usés mais leur valeur indéniable.\n\nJe m'approche, le souffle court tandis que j'embrasse le tout du regard. Le journal semble presque m'appeler, sa présence captant mon attention bien plus que l'or ne le pourrait jamais. Mes doigts planent au-dessus de sa couverture, hésitants. Cette pièce semble détenir des réponses, ou peut-être davantage de questions.\n\nQui était ce mage ? Que lui est-il arrivé ? Et pourquoi ai-je l'impression d'être tombé sur quelque chose qui n'était jamais censé être découvert ?"

  gogossos_expedition.1009.b:0 "Que dit le journal ?"

  gogossos_expedition.1210:0 "Le Rêve d'une Vie..."
  gogossos_expedition.1210_t:0 "Le Rêve d'une Vie..."
  gogossos_expedition.1210_desc:0 "Je saisis le journal de mes mains tremblantes, balayant la fine couche de poussière qui s'était déposée dessus. Mes doigts tracent la couverture de cuir craquelé tandis que je feuillette ses pages fragiles, l'encre effacée mais encore lisible. Je parcours rapidement la dernière entrée, attiré par les ultimes pensées du mage défunt depuis si longtemps.\n\nLes mots me glacent jusqu'aux os. Il écrivait ses dernières heures, comment la Peste de Sang de Gogossos s'était emparée de son corps, le ravageant de l'intérieur. Ses descriptions sont vivides et hantées : la fièvre, les saignements et la faiblesse qui le consumait, lui volant la force de poursuivre son œuvre. Il se lamentait sur ses expériences inachevées, son potentiel gâché et l'héritage qu'il ne laisserait jamais. Son désespoir suinte de la page, chaque mot un rappel douloureux de la cruauté et de la finalité de sa fin.\n\nMais avant que je puisse approfondir ma lecture, la pièce se mit à trembler. Un grondement sourd, semblable au grognement d'une bête s'éveillant, vibre à travers les murs de pierre. La poussière tombe en nuages épais d'en haut, et la faible lumière des cristaux commence à vaciller sauvagement. Je lève les yeux tandis que de petites pierres commencent à tomber, suivies par les craquements grinçants du plafond qui cède sous une pression invisible. La pièce s'effondre.\n\nLa panique inonde mes veines. Je repousse le journal sur la table, trop lourd, trop fragile pour être emporté, et saisis plutôt les lingots d'or luisants. Mes instincts me hurlent de fuir, de m'échapper avant d'être enseveli vivant aux côtés des restes du mage.\n\nJe me précipite vers la porte, ou ce qu'il en reste, mais alors que j'atteins le seuil, l'écriture runique gravée dans le sol s'embrase. Les symboles lumineux pulsent avec une intensité aveuglante, emplissant la pièce d'une radiance d'un autre monde. Le fracas de la pièce qui s'effondre est noyé par un bourdonnement aigu, presque assourdissant, et avant que je puisse comprendre ce qui se passe, ma vision est consumée par une lumière blanche.\n\nQuand la lumière se dissipe, je ne suis plus dans le palais.\n\nJe me tiens sur une plage. Du sable chaud se déplace sous mes pieds, le bruit des vagues se brisant contre le rivage emplissant mes oreilles. La senteur salée de l'air marin est un contraste impossible avec l'atmosphère froide et décadente que je viens de quitter. Mon cœur s'emballe tandis que je pivote sur moi-même, essayant de comprendre ce qui vient de se passer. Le palais, la pièce qui s'effondrait, le mage : tout a disparu, remplacé par l'horizon infini de l'océan et du ciel.\n\nJe serre les lingots d'or fermement, le souffle encore haletant du chaos, l'esprit envahi de questions. Comment suis-je arrivé ici ? Pourquoi les runes m'ont-elles téléporté en ce lieu ? Était-ce une sécurité laissée par le mage, ou quelque force invisible intervenant ?\n\nLa seule certitude est que je me suis échappé, pour l'instant. Mais cette plage... elle semble trop paisible, trop parfaite. Et au fond de moi, je savais que tout cela était bien réel."
  gogossos_expedition.1210.b:0 "Rentrons... simplement au bercail..."
  gogossos_expedition.1210.b.outcome:0 "Vous concluez votre expédition à Gogossos."
  ambush.1:0 "AAAAAAAGHH !!!!"

  gogossos_expedition.1100:0 "La Chambre du Dragon"
  gogossos_expedition.1100_t:0 "La Chambre du Dragon"
  gogossos_expedition.1100_desc:0 "Alors que je descends dans le sous-sol, un frisson me parcourt l'échine. L'air est chargé de poussière et de l'odeur de quelque chose d'ancien, de quelque chose oublié depuis longtemps. Mes pas résonnent dans la faible lumière, puis je m'arrête brusquement, figé sur place.\n\nDevant moi, surgissant des ombres, se trouve un dragon. Un vrai dragon vivant. Sa forme massive est lovée dans les ténèbres, ses écailles chatoyant faiblement même dans la pénombre. Mon souffle se bloque dans ma gorge. Cela ne devrait pas être possible. Les Seigneurs Dragons d'antan se sont depuis longtemps estompés dans la légende : comment l'une de leurs bêtes pourrait-elle encore exister ici, cachée sous ce lieu ?\n\nUn mélange de crainte et de terreur m'étreint, mais au milieu de la peur, une autre pensée s'impose. Il y a plus dans cet endroit que je n'aurais jamais imaginé. Des secrets enfouis sous les siècles, des mystères attendant d'être percés.\n\nMais je ne suis pas venu jusqu'ici pour repartir les mains vides. Si ce dragon a été préservé ici depuis si longtemps, il doit y avoir quelque chose de grande valeur dissimulé entre ces murs. Et j'ai bien l'intention de réclamer ma récompense."

  gogossos_expedition.1100.a:0 "Je terrasserai cette bête et réclamerai mon prix !"
  gogossos_expedition.1100.b:0 "Je suis du sang du dragon ! Tu te soumettras à moi !"
  gogossos_expedition.1100.b.outcome:0 "Vous tentez de dompter le dragon. Quel que soit le résultat, votre expédition à Gogossos prend fin ici."

  gogossos_expedition.1101:0 "Le Champion"
  gogossos_expedition.1101_t:0 "Le Champion"
  gogossos_expedition.1101_desc:0 "Le combat fut féroce, chaque instant une épreuve de volonté et d'endurance. Le dragon rugissait, son souffle enflammé calcinant l'air, mais j'avais déjà appris à lire ses mouvements. À chaque coup de griffe tonitruant, je dansais entre la mort et la survie, ma lame trouvant les ouvertures là où les écailles s'écartaient juste assez. Il chargea, et je roulai sous lui, enfonçant mon arme profondément dans son ventre exposé. Un hurlement assourdissant déchira la chambre tandis que la bête se débattait, sa queue massive fracassant la pierre dans sa lutte finale et désespérée.\n\nDans un dernier élan de force, je grimpai sur son dos, agrippant les crêtes de son épine dorsale tandis que j'enfonçai mon épée à la base de son crâne. Le dragon exhala un dernier souffle frémissant avant de s'effondrer, son corps énorme faisant trembler le sol dans sa chute. Je me tenais au-dessus de lui, la poitrine haletante, le sang et la suie collant à ma peau. La créature autrefois puissante gisait immobile, son règne oublié depuis longtemps enfin révolu.\n\nLe silence qui suivit était lourd, mais je ne ressentais aucun regret. J'avais terrassé une légende, et désormais, les dépouilles de son antre ancien m'appartenaient."

  gogossos_expedition.1101.a:0 "Qu'est-ce que cela ?"

  gogossos_expedition.1102:0 "L'Épreuve du Sang"
  gogossos_expedition.1102_t:0 "L'Épreuve du Sang"
  gogossos_expedition.1102_desc:0 "Ayant terrassé le dragon et réclamé son trésor, je tournai mon regard vers l'extrémité de la chambre, où quelque chose de bien plus sinistre m'attendait. Une porte massive, forgée d'acier noirci, se dressait devant moi. Tordue et dentelée, sa surface portait l'image d'un visage ricanant, figé dans une grimace éternelle, sa gueule béante assez large pour engloutir un homme entier.\n\nDevant la porte se dressait un pilier de pierre, ancien et érodé, sur lequel reposait un simple bol. Il semblait ordinaire au premier regard, si ce n'était pour les étranges runes gravées le long de son rebord : des symboles qui semblaient se déplacer et se tordre sous mon regard. À l'intérieur du bol gisait une dague rouillée, immobile, son tranchant autrefois aiguisé émoussé par le temps et la corrosion.\n\nEn m'approchant, un frisson me parcourut l'échine. Des murmures, doux et insidieux, effleurèrent mon esprit comme des doigts glacés. Ils m'appelaient, chuchotant des mots que je ne comprenais pas mais que je ressentais pourtant jusqu'aux os. Ils m'attiraient, me pressant de saisir la dague.\n\nL'offrande qu'elle exigeait était claire. Du sang. Le mien. Les runes pulsèrent faiblement comme si elles percevaient mon hésitation, les murmures devenant impatients. Quoi qu'il se trouve au-delà de cette porte, cela ne se révélerait pas sans sacrifice."

  gogossos_expedition.1102.a:0 "Une petite offrande suffira"
  gogossos_expedition.1102.b:0 "Seule une grande offrande sera suffisante"
  gogossos_expedition.1102.c:0 "Je ne pense pas que ce soit sage. Je vais le laisser tranquille"
  gogossos_expedition.1102.c.outcome:0 "Vous concluez votre expédition à Gogossos."

  gogossos_expedition.2001:0 "Quel Imbécile !"
  gogossos_expedition.2001_t:0 "Quel Imbécile"
  gogossos_expedition.2001_desc:0 "Le couteau, bien que paraissant émoussé et usé, fendit ma peau comme du beurre. Il n'y eut aucune résistance, aucune douleur : seulement la facilité déconcertante avec laquelle il tailla la chair. Le sang jaillit instantanément, coulant en épais ruisselets cramoisis dans le bol qui attendait. Les runes bordant son rebord s'embrasèrent d'une lueur malsaine, comme si elles s'abreuvaient goulûment de mon offrande.\n\nPuis, la porte gémit. Un son lent et grinçant, le métal raclant contre la pierre. Le visage tordu qui y était sculpté sembla se modifier, son expression autrefois ricanante se tordant en quelque chose de bien pire : un sourire. Un sourire profond et entendu. Une vague de vertige me submergea. Ma vision se troubla, s'assombrissant sur les bords. Je vacillai sur mes pieds, luttant pour rester debout, mais mes membres étaient devenus impossiblement lourds. Pourtant, je le vis : la porte s'ouvrait. Quoi qu'il y ait au-delà était à ma portée. Je me forçai à avancer, ordonnant à mon corps de bouger. Mais alors je m'effondrai. Une chute brutale et impitoyable sur le sol de pierre froide. La panique m'envahit tandis que j'essayais de me relever, mais ma force m'avait abandonné. La dague glissa de mes doigts, cliquetant inutilement à mes côtés. Et alors, la véritable horreur s'installa.\n\nLa douleur. Elle commença comme une sensation lente et rampante sous ma peau, puis s'épanouit en agonie. Ma chair picota, puis brûla, puis se flétrit. Je suffoquai, mais aucun souffle ne vint. Mes veines noircirent, ma peau se craquela et se détacha, se décollant en lambeaux écœurants. Le sang ne coulait plus seulement de ma main : il jaillissait de partout. Mon corps se désagrégeait, pourrissant sous mes propres yeux. J'essayai de hurler, mais ma gorge s'effondra sur elle-même, ma voix volée par la force même que j'avais cherché à éveiller. La dernière chose que je vis avant que les ténèbres ne m'emportent fut la porte, grande ouverte. Et au-delà : des ombres, qui se déplaçaient et observaient.\n\nPuis, le néant."
  gogossos_expedition.2001.dumbass:0 "..."

  gogossos_expedition.2002:0 "La Chambre des Souhaits"
  gogossos_expedition.2002_t:0 "La Chambre des Souhaits"
  gogossos_expedition.2002_desc:0 "Le couteau, bien que paraissant émoussé et usé, fendit ma peau comme du beurre. Il n'y eut aucune résistance, aucune douleur : seulement la facilité déconcertante avec laquelle il tailla la chair. Le sang jaillit instantanément, coulant en épais ruisselets cramoisis dans le bol qui attendait. Les runes bordant son rebord s'embrasèrent d'une lueur malsaine, comme si elles s'abreuvaient goulûment de mon offrande.\n\nPuis, la porte gémit. Un son lent et grinçant, le métal raclant contre la pierre. Le visage tordu qui y était sculpté sembla se modifier, son expression autrefois ricanante se tordant en quelque chose de bien pire : un sourire. Un sourire profond et entendu.\n\nMais alors, quelque chose d'inattendu se produisit. Une vive sensation de picotement parcourut ma paume, et lorsque je baissai les yeux, la blessure avait disparu. Ma peau s'était refermée d'elle-même, l'offrande de sang acceptée, mais ne laissant aucune trace de blessure. Mon souffle était instable tandis que je franchissais le seuil de la porte désormais ouverte, pénétrant dans la chambre au-delà.\n\nLa Chambre des Souhaits.\n\nMes yeux s'écarquillèrent devant le spectacle : des artefacts dorés empilés en hauteur, des coupes serties de joyaux scintillant dans la faible lueur des torches, des pierres précieuses éparpillées comme de simples cailloux sur le sol. Une richesse au-delà de l'imagination, intouchée depuis des siècles. C'était là le véritable trésor, le butin que le dragon gardait, le prix dissimulé au-delà de sa forme monstrueuse.\n\nMais parmi les richesses étincelantes, un objet attira mon regard par-dessus tout. Trônant sur un piédestal, baigné d'une lueur éthérée, se trouvait l'artefact que je cherchais. La raison pour laquelle j'étais venu si loin. Mon cœur battait la chamade tandis que je m'approchais, le poids de mon périple culminant en cet instant unique et tant attendu."
  gogossos_expedition.2002.a:0 "C'est magnifique..."
  gogossos_expedition.2002.a.outcome:0 "Vous concluez votre expédition à Gogossos."

  evil_death_events.1:0 "Je n'en peux plus..."
  evil_death_events.1_t:0 "Je n'en peux plus..."
  evil_death_events.1_desc:0 "Les quatre portes se dressent devant moi : pourpre, rouge, blanche et noire. Je les ai toutes essayées, franchissant chacune tour à tour, pour être ramené dans cette même salle maudite. Quel que soit le chemin que j'emprunte, quel que soit le nombre de fois que je choisis, je finis toujours ici. Une boucle torturée, une prison sans murs.\n\nJe serre les poings, le souffle haletant tandis que la frustration me ronge. Je ne peux pas continuer ainsi. Le cycle sans fin, la répétition suffocante : cela me brise. Mais je refuse de laisser la folie me gagner. Je refuse de mourir de faim, de dépérir dans cet endroit, attendant une évasion qui n'existe pas.\n\nSi c'est tout ce qu'il y a, alors j'y mettrai fin selon mes propres termes."

  sewingside.1:0 "Je dégaine mon épée, une dernière fois..."
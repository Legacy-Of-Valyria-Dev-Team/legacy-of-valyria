  gogossos_expedition.0003:0 "Je n'en crois pas mes yeux"
  gogossos_expedition.0003_t:0 "Tombeau du Lord Dragon"
  gogossos_expedition.0003_desc:0 "En entrant dans le tombeau, je remarque une grande salle carrée ornée de statues de chevaliers valyriens et de magnifiques fresques dépeignant l'ancienne Valyria à son apogée.\n\nJ'aperçois d'imposants tas d'or soigneusement empilés près du grand sarcophage au centre de la pièce, accompagnés de gemmes précieuses et d'ornements dorés.\n\nEn poussant le couvercle du sarcophage, j'y trouve un squelette et..."
  gogossos_expedition.0003.a:0 "Qu'avons-nous là ?"
  gogossos_expedition.0003.outcome:0 "Vous récupérez le trésor à l'intérieur et concluez votre expédition à Gogossos."

  gogossos_expedition.0003.a.outcome.egg:0 "Vous trouvez un œuf de dragon."
  gogossos_expedition.0003.a.outcome.blood:0 "Vous trouvez un parchemin de magie du sang."
  gogossos_expedition.0003.a.outcome.water:0 "Vous trouvez un parchemin de magie de l'eau."
  gogossos_expedition.0003.a.outcome.shadow:0 "Vous trouvez un parchemin de magie des ombres."

  gogossos_expedition.0004:0 "Je n'en crois pas mes yeux !"
  gogossos_expedition.0004_t:0 "Je n'en crois pas mes yeux !"
  gogossos_expedition.0004_desc:0 "Entrant dans le tombeau avec l'espoir de le piller de ses trésors, je m'arrête net dans mon élan. Figé de terreur, je lève les yeux et vois..."
  gogossos_expedition.0004.a:0 "UN DRAGON !"

  gogossos_expedition.00041:0 "Les apparences sont trompeuses"
  gogossos_expedition.00041_t:0 "Les apparences sont trompeuses"
  gogossos_expedition.00041_desc:0 "Heureusement, il semble que le dragon soit mort depuis longtemps et ne soit qu'une carcasse en décomposition, mais ce sur quoi repose sa dépouille imposante est bien réel... de l'or ! Le dragon mort couvait un immense trésor d'or, bien que le reste du tombeau semble avoir été profané. Toutes les œuvres d'art et les statues sont défigurées et endommagées au-delà de toute reconnaissance."
  gogossos_expedition.00041.a:0 "Espérons que ce n'est pas maudit comme l'or de Thorin."
  gogossos_expedition.00041.outcome:0 "Vous concluez votre expédition à Gogossos."

  gogossos_expedition.00042:0 "Le tueur de dragon"
  gogossos_expedition.00042_t:0 "Le tueur de dragon"
  gogossos_expedition.00042_desc:0 "L'adrénaline pulse encore violemment dans tout mon corps. Pendant une minute, rien ne semblait réel. Vous n'êtes pas sûr de ce qui s'est passé, mais d'une chose vous êtes certain : ce dragon ne vous importunera plus. Vous avez tué un dragon et avez survécu pour le raconter."
  gogossos_expedition.00042.a:0 "Au moins j'ai obtenu de l'or pour mes peines !"
  gogossos_expedition.00042.outcome:0 "Vous concluez votre expédition à Gogossos."

  gogossos_expedition.0050:0 "Que se passe-t-il donc ?"
  gogossos_expedition.0050_t:0 "Que se passe-t-il donc ?"
  gogossos_expedition.0050_desc:0 "Après avoir traversé la jungle pendant quelques heures, j'ai découvert un campement où j'ai rencontré un petit nain attisant le feu. Il a levé les yeux, nos regards se sont croisés, et il a parlé doucement avec un accent prononcé.\n\n« Et que crois-tu faire ici, [Select_CString( ROOT.Char.IsFemale, 'fillette', 'garçon' )] ? » demanda le nain, ce à quoi j'ai répondu que je souhaitais explorer les ruines de Gogossos à la recherche de trésors. Le nain caressa sa barbe, pensif.\n\nSoudain, il laissa échapper un rire sinistre et parla en parfait haut valyrien. La magie emplit les yeux du nain."
  gogossos_expedition.0050.a:0 "Je ne me sens pas très bien..."
  gogossos_expedition.0050.a.bear:0 "Votre expédition à Gogossos prend fin et vous rentrez chez vous, car vous êtes devenu un ours ridicule.\n#weak C'est insupportable !#!"

  gogossos_expedition.0060:0 "La bibliothèque"
  gogossos_expedition.0060_t:0 "La bibliothèque"
  gogossos_expedition.0060_desc:0 "Il semble que je sois tombé sur une ancienne bibliothèque.\n\nJe vois des rangées et des rangées d'étagères, certaines garnies de livres, d'autres décrépites et tombant en morceaux. Je distingue une table au fond avec un squelette vêtu de haillons, assis avec plusieurs livres étalés devant lui. Je peux tout juste déchiffrer les titres de chacun d'entre eux."
  gogossos_expedition.0060.outcome:0 "Vous concluez votre expédition à Gogossos."
  gogossos_expedition.0060.a:0 "Un livre sur les techniques martiales"
  gogossos_expedition.0060.b:0 "Un livre de philosophie"
  gogossos_expedition.0060.c:0 "Un livre intitulé #emphasis L'Art de la Diplomatie#!"
  gogossos_expedition.0060.d:0 "Un livre qui explore l'intendance et la gouvernance"
  gogossos_expedition.0060.e:0 "Un livre intitulé #emphasis Le Prince#!"

  gogossos_expedition.0119:0 "Pirates à l'horizon"
  gogossos_expedition.0119_t:0 "Pirates à l'horizon"
  gogossos_expedition.0119_desc:0 "Ayant pris la mer il y a plusieurs jours en direction de notre aventure à Gogossos, nous avons repéré un navire à l'horizon battant le pavillon noir - généralement arboré par les pirates dans ces eaux.\n\nEspérons qu'ils ne nous repèrent pas..."
  gogossos_expedition.0119.z:0 "Je déteste les pirates..."

  gogossos_expedition.0110:0 "Nous sommes abordés !"
  gogossos_expedition.0110_t:0 "Nous sommes abordés !"
  gogossos_expedition.0110_desc:0 "Les pirates ont vite rattrapé notre navire et nous sommes abordés ! Leur capitaine et ses hommes sautent sur le pont, dégainant leurs épées plus rapidement que je ne l'avais prévu. Ça s'annonce mal..."
  gogossos_expedition.0110.a:0 "Ça ne s'annonce vraiment pas bien..."
  gogossos_expedition.0110.a.outcome:0 "Vous vous rendez aux pirates."
  gogossos_expedition.0110.b:0 "Braquez les vergues, bande de singes maladroits ! Un jour pour mourir est un jour qui vaut la peine d'être vécu !"
  gogossos_expedition.0110.b.outcome:0 "Vous engagez un duel avec le capitaine pirate."

  gogossos_expedition.0120:0 "Pirates évités"
  gogossos_expedition.0120_t:0 "Pirates évités"
  gogossos_expedition.0120_desc:0 "Il semblerait que les pirates ne nous aient pas repérés, ou s'ils l'ont fait, n'étaient certainement pas intéressés par notre vaisseau.\n\nNous avons accosté en sécurité. À partir d'ici, le vrai danger commence tandis que la jungle de Gogossos nous attend."
  gogossos_expedition.120.a:0 "En avant, et voyons ce qu'il y a à découvrir."

  gogossos_expedition.0111:0 "Pas de rival pour mon acier"
  gogossos_expedition.0111_t:0 "Pas de rival pour mon acier"
  gogossos_expedition.0111_desc:0 "Le pirate n'était pas de taille face à mon acier et [pirate_lord.GetSheHe|l] a été abattu. Les hommes restants du lord pirate ont rapidement fui, nous permettant de poursuivre notre voyage. Espérons que la navigation sera plus tranquille désormais."
  gogossos_expedition.0111.a:0 "Espérons qu'ils étaient le dernier obstacle."
  gogossos_expedition.0111.a.outcome:0 "Votre expédition continue."

  gogossos_expedition.0112:0 "Mon orgueil est entaché"
  gogossos_expedition.0112_t:0 "Mon orgueil est entaché"
  gogossos_expedition.0112_desc:0 "Le lord pirate était trop fort et habile pour que je puisse le vaincre, et j'ai été battu et terrassé. Bien que je sois encore en vie, mon orgueil est blessé, et je suis maintenant à la merci des pirates."
  gogossos_expedition.0112.a:0 "Malédiction !"

  gogossos_expedition.1001:0 "L'ascension"
  gogossos_expedition.1001_t:0 "L'ascension"
  gogossos_expedition.1001_desc:0 "Après nous être échoués sur la plage, nous avons pris un moment pour reprendre nos repères, scrutant le paysage environnant. Les falaises imposantes nous encerclaient dans une prison naturelle, ne laissant qu'un seul chemin possible - vers le haut. Sans autre moyen d'explorer l'île, nous devons commencer notre ascension, escaladant les parois rocheuses qui se dressent au-dessus de nous, espérant trouver des réponses - ou peut-être même un trésor - au-delà de leurs hauteurs."
  gogossos_expedition.1001.a:0 "En avant et vers le haut !"
  gogossos_expedition.1001.b:0 "Volons, [my_dragon.GetNameNoTooltip] !"

  gogossos_expedition.1006:0 "La descente finale"
  gogossos_expedition.1006_t:0 "La descente finale"
  gogossos_expedition.1006_desc:0 "Mes doigts s'agrippaient à la roche friable, le cœur battant tandis que je me hissais plus haut. Le vent hurlait, mordant ma peau, mais je me forçais à continuer l'escalade. Encore un peu - puis la corniche sous mon pied céda. Pendant un seul instant déchirant, je flottais, mes bras tentant désespérément de saisir le vide. Le monde tourna tandis que je tombais, la plage en contrebas se précipitant à ma rencontre. Un halètement étouffé s'échappa de mes lèvres, non pas de peur, mais de réalisation - c'était la fin. Puis, le silence."
  gogossos_expedition.1006.a:0 "..."

  gogossos_expedition.1002:0 "Le palais de marbre"
  gogossos_expedition.1002_t:0 "Le palais de marbre"
  gogossos_expedition.1002_desc:0 "Alors que j'atteins le sommet de la falaise escarpée, je me débarrasse de la poussière et des débris qui me collent à la peau, exhalant tandis que le monde se dévoile sous mon regard. La terre s'étend à perte de vue, tapisserie saisissante de roches déchiquetées, de jungle dense et de collines ondulantes baignées dans la lueur dorée du soleil mourant. La brume s'élève de la canopée en contrebas, tourbillonnant comme des vrilles fantomatiques entre les arbres anciens, leurs feuilles émeraude scintillant des vestiges de la chaleur du jour. Mais au-delà de la jungle, au-delà de cette beauté sauvage et indomptée, mon regard se fixe sur quelque chose de véritablement magnifique - un palais de pierre d'un blanc pur, se dressant majestueux et défiant au sommet d'une colline lointaine. Ses flèches imposantes percent le ciel, captant la dernière lumière du jour, étincelant comme la citadelle de dieux oubliés.\n\nUn frisson me parcourt, une attraction indéniable, comme si le destin lui-même m'appelait. C'est là que doit se trouver le trésor - scellé dans des murs de marbre, voilé dans les échos d'empires perdus. Mais le temps joue contre moi. La jungle en contrebas sera périlleuse de nuit, ses ombres dissimulant des créatures inconnues, ses profondeurs vivantes de murmures de danger."

  gogossos_expedition.1007:0 "En route vers le palais !"

  gogossos_expedition.1003:0 "Le palais silencieux"
  gogossos_expedition.1003_t:0 "Le palais silencieux"
  gogossos_expedition.1003_desc:0 "En franchissant la grande entrée du palais, un étrange contraste se dévoile devant moi. De l'extérieur, ses murs blancs étincelants et ses flèches imposantes demeurent intacts, majestueux et inflexibles. Mais à l'intérieur, la décrépitude a pris le dessus. Les salles autrefois majestueuses s'effritent, leurs arches dorées fissurées et usées. La poussière étouffe l'air, et l'odeur de putréfaction persiste dans le silence stagnant. Des meubles brisés, depuis longtemps réduits en ruines, gisent éparpillés sur les sols de pierre, leurs tissus jadis somptueux réduits à de misérables lambeaux du passé.\n\nJe cherche, m'enfonçant plus profondément dans les corridors abandonnés, mais je ne trouve rien - ni trésor, ni signe de vie, seulement les échos d'une époque oubliée. C'est comme si le palais lui-même n'était qu'une coquille vide, une enveloppe creuse de grandeur que le temps a depuis longtemps délaissée. Pourtant, alors même que le doute commence à s'insinuer, je tombe sur un escalier qui s'enfonce dans l'ombre.\n\nAttiré vers l'avant, je descends au sous-sol, où les derniers rayons du soleil filtrent à travers d'intriqués miroirs de cristal, projetant des faisceaux scintillants d'or et de violet à travers la chambre. La lumière accroche quelque chose d'époustouflant - des œuvres d'art valyriennes anciennes, gravées dans la pierre au-dessus de la grande porte devant moi. Les images racontent une histoire de pouvoir et de feu, de puissants Lords Dragons régnant sur les cieux, leurs grandes bêtes s'enroulant à travers des nuages de flammes. Leurs yeux, taillés dans des gemmes précieuses, luisent dans la lumière fractionnée, comme s'ils m'observaient, me jugeaient.\n\nJe m'attarde, captivé par cette maîtrise artistique, par le poids même de l'histoire qui pèse sur ce lieu. Mais une réalisation glaçante s'empare alors de moi - dans tout ce palais, je n'ai vu aucun signe des morts. Aucun squelette. Aucun reste de ceux qui jadis appelaient cet endroit leur foyer.\n\nUn lieu abandonné par le temps... pourtant apparemment intouché par la mort.\n\nUn frisson me parcourt l'échine tandis que je m'approche de la grande porte, ma main flottant au-dessus de sa surface froide. Quelque chose ne va pas ici. Et je suis sur le point de découvrir quoi."
  gogossos_expedition.1003.a:0 "Au sous-sol, j'imagine."
  #palace.1:0 "The only way forward is down...."

  gogossos_expedition.1004:0 "La fresque"
  gogossos_expedition.1004_t:0 "La fresque"
  gogossos_expedition.1004_desc:0 "Alors que je descends plus profondément dans les entrailles du palais, l'escalier en spirale semble sans fin, l'air devenant plus froid à chaque pas. Les ombres se tordent et se contorsionnent le long des antiques murs de pierre, pourtant je continue, poussé par un mélange de curiosité et de malaise. Enfin, j'atteins le fond - une vaste chambre, impossiblement illuminée malgré les profondeurs. La lumière, douce et dorée, jaillit de sources invisibles, projetant une lueur surnaturelle sur les murs.\n\nMon souffle se coupe tandis que je contemple le spectacle devant moi : une autre fresque magnifique, son art inégalé, irradiant un sentiment d'émerveillement et de révérence. Celle-ci dépeint des dragons dans toute leur gloire majestueuse, chacun unique, chacun à couper le souffle dans sa splendeur.\n\nLe Puissant Dragon Violet, ses écailles miroitant comme de l'améthyste, déchaîne un torrent de feu, sa puissance inégalée.\n\nLe Dragon Blanc, rapide et féroce, semble presque flou en mouvement, sa silhouette élancée fendant les nuages comme une lame.\n\nLe Dragon Rouge, ses yeux brûlant de malice, se profile en tyran, sa présence inspirant crainte et effroi.\n\nEt enfin, le Dragon Noir - mystérieux, mythique, sa forme enveloppée d'une aura de sombre majesté, comme s'il existait entre ce monde et le suivant.\n\nJe n'ai qu'un moment pour m'émerveiller de la beauté de la fresque, mes doigts traçant le bord des sculptures complexes. Puis, le son survient. Un gémissement bas et familier de pierre ancienne qui se déplace. Mon cœur se serre dans ma poitrine, et un frisson parcourt mon échine alors que le bruit s'amplifie, devient plus violent. Je me retourne brusquement, les yeux écarquillés d'alarme, juste au moment où le sol sous mes pieds cède.\n\nLe monde bascule, et je suis en apesanteur, mon cri se coinçant dans ma gorge tandis que la pierre s'effrite dans l'obscurité. Mon esprit a à peine le temps d'enregistrer la terreur avant que je ne plonge dans l'inconnu en dessous, la faible lueur de la fresque disparaissant alors que je tombe."
  gogossos_expedition.1004.a:0 "Oh non..."

  # evil_death_events.1:0 "I Can't Take it..."
  # evil_death_events.1_t:0 "I Can't Take it..."
  # evil_death_events.1_desc:0 "I can't take it anymore. These four doors stand before me, each one pulsing with an unseen energy, yet none offering a way out. Purple, White, Red, Black—no matter how long I stare, no matter how much I search for answers in their intricate designs, they remain an enigma. There's no escape, no exit from this wretched place. Just the cold, unyielding stone, the eerie glow of the crystals, and the oppressive silence that seems to stretch into eternity.\n\nI'm doomed to waste away here, trapped in this endless nightmare, with nothing but these cursed doors and my own growing despair for company. My strength is already failing me, my body weakening with every passing moment. I can feel the emptiness creeping in, my mind clawing at the edges of sanity.\n\nBut I won't let it end like this. I refuse to wither into a husk, to become a shadow of myself, forgotten and consumed by this place. If this is to be my end, it will be on my terms, by my own hand. I will not let dishonor take me, nor the slow, cruel grip of starvation.\n\nI glance at the doors one last time, their silent presence mocking me, and steel myself for what must be done. Better to face the unknown than to let this cursed palace strip me of all that I am. Better to go with defiance in my heart than to let the darkness claim me piece by piece."
  # sewingside.1:0 "I pull out my sword one last time..."

  gogossos_expedition.1005:0 "Emporium des portes de l'ours"
  gogossos_expedition.1005_t:0 "Emporium des portes de l'ours"
  gogossos_expedition.1005_desc:0 "Debout dans la lueur inquiétante des cristaux, la chambre s'étend devant moi, vaste et vide, hormis quatre portes qui dominent son mur du fond. Chaque porte est massive et sculptée de motifs complexes, leurs détails illuminés par la lumière miroitante des cristaux au-dessus. Mon cœur bat la chamade tandis que je fais un pas en avant, attiré par leur présence menaçante.\n\nLes portes sont comme rien que je n'aie vu auparavant, chacune irradiant sa propre aura distincte, comme imprégnée de pouvoir.\n\nLa Porte Violette brille comme de l'améthyste polie, sa surface vivante de sculptures de flammes et de dragons serpentins entrelacés. Le feu qu'ils crachent semble presque bouger quand la lumière l'atteint sous le bon angle, et l'air autour d'elle vibre d'une énergie surnaturelle.\n\nLa Porte Blanche, en contraste saisissant, est élégante et lisse, comme de l'ivoire poli. Ses sculptures dépeignent un dragon en vol, sa forme élancée et gracieuse, les ailes déployées comme figées dans un mouvement éternel. La froide lumière des cristaux lui confère une lueur presque spectrale, comme si elle était intouchée par le temps.\n\nLa Porte Rouge est audacieuse et terrifiante. Sa surface est gravée de motifs chaotiques et dentelés, les lignes profondes et rugueuses, comme si elles avaient été brûlées dans le bois par le feu lui-même. Un dragon monstrueux aux yeux cruels et perçants est sculpté dans son cadre, sa présence irradiant la menace. Même se tenir près d'elle rend l'air lourd et oppressant.\n\nLa Porte Noire est la plus énigmatique. Elle semble absorber la lumière, sa surface lisse et sombre comme l'obsidienne. Des ombres semblent danser sur elle, se déplaçant et se tordant comme si elles avaient vie propre. Les sculptures ici sont subtiles et difficiles à discerner, mais le dragon représenté paraît surnaturel, presque incompréhensible - plus esprit que bête.\n\nChaque porte pulse faiblement d'une force invisible, comme m'appelant en avant. Pourtant, il n'y a aucune indication de ce qui se cache derrière elles. Mes yeux vacillent entre elles, mon esprit s'emballe. Est-ce la fin du palais ? Ou est-ce le début de quelque chose de bien pire ?\n\nMon instinct me hurle de choisir avec soin, mais quoi qu'il en soit, je sais qu'il n'y a plus de retour possible maintenant. L'une de ces portes contient mon chemin vers l'avant - ou ma perte."
  gogossos_expedition.1005.a:0 "Porte Violette"
  gogossos_expedition.1005.b:0 "Porte Blanche"
  gogossos_expedition.1005.c:0 "Porte Rouge"
  gogossos_expedition.1005.d:0 "Porte Noire"
  gogossos_expedition.1005.z:0 "Je ne veux plus continuer..."

  gogossos_expedition.1008:0 "Les couloirs obscurs se poursuivent sans fin !"
  gogossos_expedition.1008_t:0 "Les couloirs obscurs se poursuivent sans fin !"
  gogossos_expedition.1008_desc:0 "J'y suis arrivé. D'une façon ou d'une autre, j'ai traversé le piège déroutant de la salle des portes, et je me tiens maintenant plus profondément dans les abîmes tordus du palais. Ma respiration est saccadée, mon cœur bat dans ma poitrine tandis que je prends un moment pour me stabiliser. L'air ici semble plus lourd, plus froid, comme s'il pesait sur moi, et la faible lueur des lumières de cristal persiste encore, me guidant en avant.\n\nDevant moi s'étend un long corridor, impossiblement long, son extrémité engloutie par les ombres. Les murs sont taillés dans la même pierre ancienne que le reste du palais, mais ici ils sont bordés de runes faiblement luminescentes - motifs de langage oublié qui pulsent doucement comme s'ils étaient vivants. Le corridor semble vibrant d'une énergie inquiétante, une étrange vibration que je peux ressentir dans mes os.\n\nLe sol sous mes pieds est humide, glissant de condensation, et chaque pas que je fais envoie un écho le long du corridor qui me revient comme un murmure. On dirait que le lieu observe, écoute, attend.\n\nIl y a quelque chose de troublant dans ce couloir - quelque chose qui fait se dresser les cheveux sur ma nuque. L'air devient plus froid à chaque pas, et un étrange bourdonnement sourd commence à remplir le silence. Il est d'abord distant, mais plus j'avance, plus il devient fort, comme le son d'un battement de cœur lointain, profond et résonnant.\n\nLe corridor semble sans fin, les ombres devant refusant de céder à la lumière. Chaque instinct me dit de faire demi-tour, de trouver une autre voie, mais je sais qu'il n'y a plus de retour possible maintenant. Quoi qu'il se trouve au bout de ce corridor, je dois l'affronter. Mes doigts se resserrent sur la garde de mon arme tandis que je continue d'avancer, chaque pas m'emmenant plus profondément dans l'inconnu."
  gogossos_expedition.1008.a:0 "Au moins ce ne sont pas les backrooms..."

  gogossos_expedition.1009:0 "Le mage !"
  gogossos_expedition.1009_t:0 "Le mage !"
  gogossos_expedition.1009_desc:0 "Enfin, le corridor prend fin. Devant moi, une vieille porte en bois gît fracassée sur le sol, ses restes éclatés dispersés comme les vestiges d'une barrière depuis longtemps oubliée. Au-delà du cadre brisé se trouve une salle différente de tout ce que j'ai rencontré dans ce palais - les quartiers d'un mage, intacts malgré le temps mais chargés du poids de l'abandon.\n\nLa pièce est un chef-d'œuvre chaotique, ses murs bordés d'imposantes bibliothèques remplies de tomes anciens, de parchemins et de fragments de vélin. L'air est épais du parfum ténu de papier vieilli et de l'âcre relent d'expériences alchimiques en dormance depuis longtemps. Des fioles de verre, certaines fêlées et d'autres encore intactes, encombrent les tables, remplies de liquides qui scintillent faiblement sous la pâle lumière des cristaux au-dessus. D'étranges appareils, leur fonction insondable, reposent à côté, leurs armatures de laiton et d'argent ternies mais curieusement complexes.\n\nMais c'est la table au fond de la pièce qui attire mon attention. Là, affalé sur sa surface, se trouve un squelette drapé d'une robe à capuche en lambeaux. Les os sont jaunis par l'âge, pourtant il y a quelque chose d'étrangement délibéré dans sa position. C'est comme si le mage - si c'est ce qu'il était - savait que la fin approchait et a choisi cet endroit comme son dernier lieu de repos.\n\nDevant le squelette, éparpillée sur la table, repose une collection d'objets. Un journal poussiéreux relié de cuir, sa couverture craquelée mais intacte, est placé au centre. L'air autour semble lourd, comme s'il renfermait des secrets destinés à rester enfouis. À côté du journal, brillant même dans la faible lumière, se trouvent plusieurs lingots d'or, leurs bords usés mais d'une valeur indéniable.\n\nJe m'approche, ma respiration superficielle tandis que j'assimile tout cela. Le journal semble presque m'appeler, sa présence commandant mon attention bien plus que l'or ne le pourrait jamais. Mes doigts flottent au-dessus de sa couverture, hésitants. Cette pièce semble contenir des réponses - ou peut-être plus de questions.\n\nQui était ce mage ? Que lui est-il arrivé ? Et pourquoi ai-je l'impression d'être tombé sur quelque chose qui n'aurait jamais dû être découvert ?"

  gogossos_expedition.1009.b:0 "Que dit le journal ?"

  gogossos_expedition.1210:0 "Le rêve d'une vie..."
  gogossos_expedition.1210_t:0 "Le rêve d'une vie..."
  gogossos_expedition.1210_desc:0 "Je saisis le journal d'une main tremblante, balayant la fine couche de poussière qui s'y était déposée. Mes doigts tracent la couverture de cuir craquelée tandis que je feuillette ses pages fragiles, l'encre décolorée mais encore lisible. Je parcours rapidement la dernière entrée, attiré par les dernières pensées du mage mort depuis longtemps.\n\nLes mots me glacent jusqu'à l'os. Il écrivait à propos de ses dernières heures, de comment la Peste de Sang de Gogossos s'était emparée de son corps, le ravageant de l'intérieur. Ses descriptions sont vives et obsédantes - de la fièvre, des saignements, et de la faiblesse qui le consumait, le privant de la force de poursuivre son travail. Il se lamentait sur ses expériences inachevées, son potentiel gâché, et l'héritage qu'il ne laisserait jamais. Son désespoir suinte de la page, chaque mot un douloureux rappel de combien cruelle et définitive sa fin a dû être.\n\nMais avant que je ne puisse approfondir, la pièce commence à trembler. Un grondement sourd, comme le rugissement d'une bête qui s'éveille, vibre à travers les murs de pierre. La poussière tombe en épais nuages d'en haut, et la faible lumière des cristaux commence à vaciller follement. Je lève les yeux alors que de petits cailloux commencent à tomber, suivis par les gémissements craquants du plafond qui se déplace sous une pression invisible. La salle s'effondre.\n\nLa panique inonde mes veines. Je repousse le journal sur la table - il est trop lourd, trop fragile à porter - et saisis plutôt les lingots d'or luisants. Mon instinct me hurle de courir, de m'échapper avant d'être enterré vivant aux côtés des restes du mage.\n\nJe me précipite vers la porte - ou ce qu'il en reste - mais juste au moment où j'atteins le seuil, les inscriptions runiques gravées dans le sol s'illuminent. Les symboles luisants pulsent avec une intensité aveuglante, remplissant la pièce d'une radiance surnaturelle. Le son de l'effondrement de la salle est noyé par un bourdonnement aigu, presque assourdissant, et avant que je ne puisse comprendre ce qui se passe, ma vision est consumée par une lumière blanche.\n\nQuand la lumière s'estompe, je ne suis plus dans le palais.\n\nJe me tiens sur une plage. Du sable chaud se déplace sous mes pieds, le son des vagues s'écrasant contre le rivage emplissant mes oreilles. Le goût salé de l'air marin contraste impossiblement avec l'atmosphère froide et en décomposition que je viens de quitter. Mon cœur bat alors que je tourbillonne, essayant de comprendre ce qui vient de se passer. Le palais, la salle qui s'effondre, le mage - tout a disparu, remplacé par l'horizon infini d'océan et de ciel.\n\nJe serre fermement les lingots d'or, ma respiration encore saccadée du chaos, mon esprit bouillonnant de questions. Comment suis-je arrivé ici ? Pourquoi les runes m'ont-elles téléporté à cet endroit ? Était-ce une mesure de sécurité laissée par le mage, ou une force invisible intervenant ?\n\nLa seule certitude est que je me suis échappé - pour l'instant. Mais cette plage... elle semble trop paisible, trop parfaite. Et au fond de moi, je savais que tout cela était réel."
  gogossos_expedition.1210.b:0 "Rentrons... simplement à la maison..."
  gogossos_expedition.1210.b.outcome:0 "Vous concluez votre expédition à Gogossos."
  ambush.1:0 "AAAAAAAGHH !!!!"

  gogossos_expedition.1100:0 "La chambre du dragon"
  gogossos_expedition.1100_t:0 "La chambre du dragon"
  gogossos_expedition.1100_desc:0 "Alors que je descends au sous-sol, un frisson me parcourt l'échine. L'air est épais de poussière et du parfum de quelque chose d'ancien - quelque chose depuis longtemps oublié. Mes pas résonnent dans la pénombre, mais soudain je m'arrête brusquement, figé sur place.\n\nDevant moi, se dressant dans les ombres, se trouve un dragon. Un vrai dragon vivant. Sa forme massive est lovée dans l'obscurité, ses écailles miroitant faiblement même dans la pénombre. Mon souffle se coupe dans ma gorge. Cela ne devrait pas être possible. Les Lords Dragons d'antan se sont depuis longtemps évanouis dans la légende - comment l'une de leurs bêtes pourrait-elle encore exister ici, cachée sous cet endroit ?\n\nUn mélange d'émerveillement et de terreur m'étreint, mais au milieu de la peur, une autre pensée prend forme. Cet endroit recèle plus que je ne l'imaginais. Des secrets enfouis sous des siècles, des mystères attendant d'être dévoilés.\n\nMais je ne suis pas venu jusqu'ici simplement pour faire demi-tour les mains vides. Si ce dragon a été préservé ici si longtemps, il doit y avoir quelque chose de grande valeur caché dans ces murs. Et j'ai l'intention de réclamer ma récompense."

  gogossos_expedition.1100.a:0 "Je vais terrasser cette bête et réclamer mon prix !"
  gogossos_expedition.1100.b:0 "Je suis du sang du dragon ! Tu te prosterneras devant moi !"
  gogossos_expedition.1100.b.outcome:0 "Vous tentez de dompter le dragon. Quel que soit le résultat, votre expédition à Gogossos s'achève ici."

  gogossos_expedition.1101:0 "Le champion"
  gogossos_expedition.1101_t:0 "Le champion"
  gogossos_expedition.1101_desc:0 "La bataille fut féroce, chaque instant un test de volonté et d'endurance. Le dragon rugit, son souffle ardent brûlant l'air, mais j'avais déjà appris à lire ses mouvements. À chaque coup assourdissant de ses griffes, je dansais entre la mort et la survie, ma lame trouvant des ouvertures là où les écailles s'écartaient juste assez. Il bondit, et je roulai sous lui, enfonçant mon arme profondément dans son ventre exposé. Un cri déchirant traversa la chambre tandis que la bête se débattait, sa queue massive fracassant la pierre dans sa lutte finale, désespérée.\n\nDans un dernier sursaut de force, je grimpai sur son dos, agrippant les crêtes de sa colonne vertébrale tandis que j'enfonçais mon épée à la base de son crâne. Le dragon émit un dernier souffle tremblant avant de s'effondrer, son corps énorme secouant le sol en tombant. Je me tins au-dessus de lui, la poitrine haletante, le sang et la suie collant à ma peau. La créature jadis puissante gisait immobile, son règne depuis longtemps oublié enfin terminé.\n\nLe silence qui suivit était lourd, mais je ne ressentais aucun regret. J'avais abattu une légende - et maintenant, les dépouilles de son antre ancestral m'appartenaient."

  gogossos_expedition.1101.a:0 "Qu'est-ce que c'est ?"

  gogossos_expedition.1102:0 "L'épreuve du sang"
  gogossos_expedition.1102_t:0 "L'épreuve du sang"
  gogossos_expedition.1102_desc:0 "Ayant terrassé le dragon et réclamé son trésor, je tournai mon regard vers l'extrémité de la chambre, où quelque chose de bien plus sinistre m'attendait. Une porte massive, forgée d'acier noirci, se dressait devant moi. Tordue et dentelée, sa surface portait l'image d'un visage grognant, figé dans une grimace éternelle, sa gueule béante assez large pour avaler un homme entier.\n\nDevant la porte se dressait un pilier de pierre, ancien et usé, sur lequel reposait un simple bol. Il était sans particularité à première vue, hormis les étranges runes gravées le long de son bord - des symboles qui semblaient se tordre et se contorsionner sous mon regard. À l'intérieur du bol reposait immobile une dague rouillée, son tranchant jadis acéré émoussé par le temps et la décomposition.\n\nEn m'approchant, un frisson parcourut mon échine. Des murmures - doux, insidieux - effleurèrent mon esprit comme des doigts froids. Ils m'appelaient, murmurant des mots que je ne pouvais comprendre mais que je ressentais pourtant dans mes os. Ils me tiraient, m'incitant à avancer, me contraignant à saisir la dague.\n\nL'offrande qu'elle exigeait était claire. Du sang. Le mien. Les runes pulsaient faiblement comme si elles sentaient mon hésitation, les murmures devenant impatients. Quoi que ce soit qui se trouve au-delà de cette porte ne se révélerait pas sans sacrifice."

  gogossos_expedition.1102.a:0 "Une petite offrande est préférable."
  gogossos_expedition.1102.b:0 "Seule une grande offrande suffira."
  gogossos_expedition.1102.c:0 "Je ne pense pas que ce soit sage. Je vais laisser cela tranquille."
  gogossos_expedition.1102.c.outcome:0 "Vous concluez votre expédition à Gogossos."

  gogossos_expedition.2001:0 "Tu es un imbécile !"
  gogossos_expedition.2001_t:0 "Tu es un imbécile"
  gogossos_expedition.2001_desc:0 "Le couteau, bien que paraissant émoussé et usé, trancha ma peau comme du beurre. Il n'y eut aucune résistance, aucune douleur - seulement l'aisance troublante avec laquelle il entaillait la chair. Le sang jaillit instantanément, coulant en épais ruisseaux cramoisis dans le bol qui attendait. Les runes bordant son rebord s'embrasèrent d'une lueur malsaine, comme si elles buvaient profondément mon offrande.\n\nPuis, la porte gémit. Un son lent et grinçant, métal raclant contre pierre. Le visage tordu sculpté dessus semblait se déplacer, son expression jadis grognante se tordant en quelque chose de bien pire - un rictus. Un rictus profond et conscient. Une vague de vertige me submergea. Ma vision se troubla, s'assombrissant aux bords. Je vacillai sur mes jambes, luttant pour rester debout, mais mes membres semblaient impossiblement lourds. Pourtant, je le vis - la porte s'ouvrait. Quoi qu'il y ait au-delà était à ma portée. Je me forçai à avancer, obligeant mon corps à bouger. Mais je tombai. Une chute brutale et impitoyable sur le sol de pierre froide. La panique me submergea alors que j'essayais de me relever, mais ma force avait disparu. La dague glissa de mes doigts, cliquetant inutilement à côté de moi. Et alors, la véritable horreur s'installa.\n\nLa douleur. Elle commença comme une sensation lente et rampante sous ma peau, puis s'épanouit en agonie. Ma chair picota, puis brûla, puis se flétrit. Je haletai, mais aucun souffle ne vint. Mes veines noircirent, ma peau se fissura et s'écailla, se détachant en lambeaux écœurants. Le sang ne coulait plus seulement de ma main - il jaillissait de partout. Mon corps se désagrégeait, pourrissant devant mes propres yeux. J'essayai de hurler, mais ma gorge s'effondra sur elle-même, ma voix volée par la force même que j'avais cherché à éveiller. La dernière chose que je vis avant que les ténèbres ne m'emportent fut la porte, grande ouverte. Et au-delà - des ombres, se déplaçant et observant.\n\nPuis, plus rien."
  gogossos_expedition.2001.dumbass:0 "..."

  gogossos_expedition.2002:0 "Le caveau des souhaits"
  gogossos_expedition.2002_t:0 "Le caveau des souhaits"
  gogossos_expedition.2002_desc:0 "Le couteau, bien que paraissant émoussé et usé, trancha ma peau comme du beurre. Il n'y eut aucune résistance, aucune douleur - seulement l'aisance troublante avec laquelle il entaillait la chair. Le sang jaillit instantanément, coulant en épais ruisseaux cramoisis dans le bol qui attendait. Les runes bordant son rebord s'embrasèrent d'une lueur malsaine, comme si elles buvaient profondément mon offrande.\n\nPuis, la porte gémit. Un son lent et grinçant, métal raclant contre pierre. Le visage tordu sculpté dessus semblait se déplacer, son expression jadis grognante se tordant en quelque chose de bien pire - un rictus. Un rictus profond et conscient.\n\nMais alors, quelque chose d'inattendu se produisit. Une vive sensation de picotement parcourut ma paume, et lorsque je baissai les yeux, la blessure avait disparu. Ma peau s'était ressoudée, l'offrande de sang prise, mais ne laissant aucune trace de mal. Ma respiration était instable tandis que j'avançais, franchissant le seuil de la porte maintenant ouverte, dans la chambre au-delà.\n\nLe Caveau des Souhaits.\n\nMes yeux s'écarquillèrent tandis que j'absorbais le spectacle devant moi - des artefacts d'or empilés haut, des calices ornés de joyaux scintillant dans la faible lueur des torches, des gemmes éparpillées comme de simples cailloux sur le sol. Une richesse au-delà de l'imaginable, intacte depuis des siècles. C'était le véritable trésor, le butin que le dragon avait gardé, le prix caché au-delà de sa forme monstrueuse.\n\nMais parmi les richesses étincelantes, un objet attirait mon regard plus que tout autre. Reposant sur un piédestal, baigné d'une lueur éthérée, se trouvait l'artefact que je cherchais. La raison pour laquelle j'étais venu si loin. Mon cœur battait tandis que je m'approchais, le poids de mon voyage culminant en cet unique moment tant attendu."
  gogossos_expedition.2002.a:0 "C'est magnifique..."
  gogossos_expedition.2002.a.outcome:0 "Vous concluez votre expédition à Gogossos."

  evil_death_events.1:0 "Je n'en peux plus..."
  evil_death_events.1_t:0 "Je n'en peux plus..."
  evil_death_events.1_desc:0 "Les quatre portes se dressent devant moi - violette, rouge, blanche et noire. Je les ai toutes essayées, franchissant chacune à tour de rôle, seulement pour être ramené dans cette même pièce maudite. Peu importe le chemin que je prends, peu importe combien de fois je choisis, je finis toujours ici. Une boucle tordue, une prison sans murs.\n\nJe serre les poings, ma respiration saccadée tandis que la frustration me déchire. Je ne peux pas continuer ainsi. Le cycle sans fin, la répétition suffocante - ça me brise. Mais je refuse de laisser la folie s'emparer de moi. Je refuse de mourir de faim, de dépérir en ce lieu, attendant une évasion qui n'existe pas.\n\nSi c'est tout ce qu'il y a, alors j'y mettrai fin à mes propres conditions."

  sewingside.1:0 "Je dégaine mon épée, une dernière fois..."
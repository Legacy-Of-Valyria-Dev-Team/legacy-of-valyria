  gogossos_expedition.0003:0 "Je n'en Crois pas mes Yeux"
  gogossos_expedition.0003_t:0 "Tombeau du Seigneur Dragon"
  gogossos_expedition.0003_desc:0 "En pénétrant dans le tombeau, je remarque qu'il s'agit d'une grande salle carrée ornée de statues de chevaliers valyriens et de magnifiques fresques dépeignant [old_valyria|E] à son apogée.\n\nJe vois de grandes piles d'or soigneusement empilées à côté du grand sarcophage au centre de la pièce, avec des gemmes précieuses et des ornements d'or scintillant dans la pénombre.\n\nRepoussant le couvercle du sarcophage, je trouve un squelette à l'intérieur et..."
  gogossos_expedition.0003.a:0 "Qu'avons-nous donc là ?"
  gogossos_expedition.0003.outcome:0 "Vous récupérez le trésor à l'intérieur et concluez votre expédition à Gogossos."

  gogossos_expedition.0003.a.outcome.egg:0 "Vous trouvez un œuf de dragon"
  gogossos_expedition.0003.a.outcome.blood:0 "Vous trouvez un parchemin de magie du sang"
  gogossos_expedition.0003.a.outcome.water:0 "Vous trouvez un parchemin de magie de l'eau"
  gogossos_expedition.0003.a.outcome.shadow:0 "Vous trouvez un parchemin de magie de l'ombre"

  gogossos_expedition.0004:0 "Je n'en Crois pas mes Yeux !"
  gogossos_expedition.0004_t:0 "Je n'en Crois pas mes Yeux !"
  gogossos_expedition.0004_desc:0 "En pénétrant dans le tombeau dans l'espoir de le piller de ses trésors, je m'arrête immédiatement net. Figé par la terreur, je levai les yeux et vis..."
  gogossos_expedition.0004.a:0 "UN DRAGON !"

  gogossos_expedition.00041:0 "Pas ce qu'il Semble ?"
  gogossos_expedition.00041_t:0 "Pas ce qu'il Semble ?"
  gogossos_expedition.00041_desc:0 "Heureusement, il semble que le dragon était mort depuis longtemps et n'est plus qu'une carcasse en décomposition, pourtant ce sur quoi couve son cadavre est bien réel... de l'or ! Le dragon mort nichait sur un énorme tas d'or, bien que le reste du tombeau semble avoir été profané. Toutes les œuvres d'art et statues défigurées et endommagées au-delà de toute reconnaissance."
  gogossos_expedition.00041.a:0 "Espérons que ce n'est pas maudit comme l'Or de Thorin"
  gogossos_expedition.00041.outcome:0 "Vous concluez votre expédition à Gogossos."

  gogossos_expedition.00042:0 "Le Tueur de Dragons"
  gogossos_expedition.00042_t:0 "Le Tueur de Dragons"
  gogossos_expedition.00042_desc:0 "L'adrénaline pulse encore violemment dans tout mon corps. Pendant une minute, rien ne semblait réel. Vous n'êtes pas sûr de ce qui s'est passé, mais une chose est certaine : ce dragon ne vous tracassera plus jamais. Vous avez tué un dragon et avez vécu pour raconter l'histoire."
  gogossos_expedition.00042.a:0 "Au moins j'ai eu de l'or pour mes peines !"
  gogossos_expedition.00042.outcome:0 "Vous concluez votre expédition à Gogossos."

  gogossos_expedition.0050:0 "Que Diable se Passe-t-il ?"
  gogossos_expedition.0050_t:0 "Que Diable se Passe-t-il ?"
  gogossos_expedition.0050_desc:0 "Ayant voyagé à travers la jungle pendant quelques heures, j'ai rencontré un campement où j'ai croisé un petit nain attisant le feu. Il leva les yeux et nos regards se croisèrent, et il parla doucement avec un accent prononcé :\n\n« Et que penses-tu faire ici, [Select_CString( ROOT.Char.IsFemale, 'fillette', 'garçon' )] ? » demanda le nain, à quoi je répondis que je souhaitais explorer les ruines de Gogossos à la recherche de trésors. Le nain caressa sa barbe d'un air pensif.\n\nSoudain, il laissa échapper un rire sinistre et parla en haut valyrien parfait. La magie emplit les yeux du nain."
  gogossos_expedition.0050.a:0 "Je ne me sens pas très bien..."
  gogossos_expedition.0050.a.bear:0 "Votre expédition à Gogossos se termine et vous rentrez chez vous, car vous êtes devenu un ours ridicule.\n#weak Vous ne pouvez pas le supporter !#!"

  gogossos_expedition.0060:0 "La Bibliothèque"
  gogossos_expedition.0060_t:0 "La Bibliothèque"
  gogossos_expedition.0060_desc:0 "Il semble que je sois tombé sur une ancienne bibliothèque.\n\nJe peux voir des rangées et des rangées d'étagères, certaines avec des livres et d'autres décrépites et s'effritant en morceaux. Je peux distinguer une table au fond avec un squelette en robes en lambeaux, assis avec plusieurs livres étalés. Je peux juste distinguer les titres de chacun."
  gogossos_expedition.0060.outcome:0 "Vous concluez votre expédition à Gogossos."
  gogossos_expedition.0060.a:0 "Un livre sur les techniques martiales"
  gogossos_expedition.0060.b:0 "Un livre sur la philosophie"
  gogossos_expedition.0060.c:0 "Un livre intitulé #emphasis L'Art de la Diplomatie#!"
  gogossos_expedition.0060.d:0 "Un livre qui explore l'intendance et la gouvernance"
  gogossos_expedition.0060.e:0 "Un livre intitulé #emphasis Le Prince#!"

  gogossos_expedition.0119:0 "Pirates à l'Horizon"
  gogossos_expedition.0119_t:0 "Pirates à l'Horizon"
  gogossos_expedition.0119_desc:0 "Ayant pris la mer il y a plusieurs jours vers notre aventure à Gogossos, nous avons repéré un navire à l'horizon arborant un pavillon noir, typiquement hissé par les pirates de ces eaux.\n\nEspérons qu'ils ne nous repèrent pas..."
  gogossos_expedition.0119.z:0 "Je déteste les pirates..."

  gogossos_expedition.0110:0 "Nous Avons Été Abordés !"
  gogossos_expedition.0110_t:0 "Nous Avons Été Abordés !"
  gogossos_expedition.0110_desc:0 "Les pirates ont rapidement rattrapé notre navire et nous ont abordés ! Leur capitaine et ses hommes sautent sur le pont, épées levées plus vite que je ne l'avais anticipé. Cela n'augure rien de bon..."
  gogossos_expedition.0110.a:0 "Cela n'augure vraiment rien de bon..."
  gogossos_expedition.0110.a.outcome:0 "Vous vous rendez aux pirates."
  gogossos_expedition.0110.b:0 "Brassez les vergues, bande de singes de pont maladroits ! Un jour pour mourir est un jour qui vaut la peine d'être vécu !"
  gogossos_expedition.0110.b.outcome:0 "Vous entamez un duel avec le capitaine pirate."

  gogossos_expedition.0120:0 "Pirates Évités"
  gogossos_expedition.0120_t:0 "Pirates Évités"
  gogossos_expedition.0120_desc:0 "Il semblerait que les pirates ne nous aient pas repérés, ou s'ils l'ont fait, ils n'étaient certainement pas intéressés par notre navire.\n\nNous avons accosté en sécurité. À partir d'ici, le vrai danger commence alors que la jungle de Gogossos nous fait signe."
  gogossos_expedition.120.a:0 "En avant nous allons et voyons ce qu'il y a à découvrir"

  gogossos_expedition.0111:0 "Aucun Adversaire pour mon Acier"
  gogossos_expedition.0111_t:0 "Aucun Adversaire pour mon Acier"
  gogossos_expedition.0111_desc:0 "Le pirate n'était pas de taille face à mon acier et [pirate_lord.GetSheHe|l] fut abattu. Les hommes restants du seigneur pirate ont rapidement fui, nous permettant de continuer notre voyage. Espérons que la navigation sera douce à partir d'ici."
  gogossos_expedition.0111.a:0 "Espérons qu'ils étaient le dernier obstacle"
  gogossos_expedition.0111.a.outcome:0 "Votre expédition continue."

  gogossos_expedition.0112:0 "Ma Fierté est Ternie"
  gogossos_expedition.0112_t:0 "Ma Fierté est Ternie"
  gogossos_expedition.0112_desc:0 "Le seigneur pirate était trop fort et habile pour que je puisse le vaincre, et j'ai été battu et abattu. Bien que je vive, ma fierté est blessée, et maintenant je suis à la merci des pirates."
  gogossos_expedition.0112.a:0 "Maudit soit-il !"

  gogossos_expedition.1001:0 "L'Ascension"
  gogossos_expedition.1001_t:0 "L'Ascension"
  gogossos_expedition.1001_desc:0 "Ayant échoué sur la plage, nous avons pris un moment pour reprendre nos esprits, inspectant le paysage autour de nous. Les falaises imposantes nous enfermaient dans une prison naturelle, ne laissant qu'un seul chemin vers l'avant : vers le haut. Sans autre moyen d'explorer l'île, nous devons commencer notre ascension, escaladant les murs rocheux qui se dressent au-dessus de nous, espérant trouver des réponses, ou peut-être même un trésor, au-delà de leurs hauteurs."
  gogossos_expedition.1001.a:0 "En avant et vers le haut !"
  gogossos_expedition.1001.b:0 "Envolons-nous, [my_dragon.GetNameNoTooltip] !"

  gogossos_expedition.1006:0 "La Descente Finale"
  gogossos_expedition.1006_t:0 "La Descente Finale"
  gogossos_expedition.1006_desc:0 "Mes doigts griffèrent la roche qui s'effritait, le cœur battant la chamade alors que je me hissais plus haut. Le vent hurlait, mordant ma peau, mais je me forçais à continuer l'escalade. Juste un peu plus, puis la corniche sous mon pied céda. Pour un seul moment qui retourne l'estomac, je fus en apesanteur, mes bras saisissant l'air vide. Le monde tourna alors que je dégringolais, la plage en-dessous se précipitant à ma rencontre. Un souffle étouffé se déchira de mes lèvres, non de peur, mais de réalisation : c'était fini. Puis, le silence."
  gogossos_expedition.1006.a:0 "..."

  gogossos_expedition.1002:0 "Le Palais de Marbre"
  gogossos_expedition.1002_t:0 "Le Palais de Marbre"
  gogossos_expedition.1002_desc:0 "Alors que je gravis la falaise escarpée, je secoue la poussière et les débris qui s'accrochent à moi, exhalant tandis que le monde se déploie sous mon regard. La terre s'étend au loin, tapisserie à couper le souffle de roche déchiquetée, de jungle dense et de collines ondulantes baignées dans la lueur dorée du soleil mourant. La brume s'élève de la canopée en contrebas, tourbillonnant comme des vrilles spectrales entre les arbres anciens, leurs feuilles émeraude scintillant des restes de la chaleur du jour. Mais au-delà de la jungle, au-delà de la beauté sauvage et indomptée, mes yeux se verrouillent sur quelque chose de vraiment magnifique : un palais de pierre blanche pure, se dressant royal et défiant au sommet d'une colline lointaine. Ses flèches imposantes percent le ciel, captant la dernière lumière du jour, luisant comme la citadelle de dieux oubliés.\n\nUn frisson me traverse, une attraction indéniable, comme si le destin lui-même appelait. C'est là que doit se trouver le trésor, scellé dans des murs de marbre, voilé dans les échos d'empires perdus. Mais le temps joue contre moi. La jungle en-dessous sera traître la nuit, ses ombres cachant des créatures inconnues, ses profondeurs vivantes de murmures de danger."

  gogossos_expedition.1007:0 "En route vers le palais !"

  gogossos_expedition.1003:0 "Le Palais Silencieux"
  gogossos_expedition.1003_t:0 "Le Palais Silencieux"
  gogossos_expedition.1003_desc:0 "Alors que je franchis la grande entrée du palais, un étrange contraste se déploie devant moi. De l'extérieur, ses murs blancs luisants et ses flèches imposantes se dressent intacts par le temps, royaux et inflexibles. Mais à l'intérieur, la décadence a pris racine. Les salles jadis majestueuses s'effritent, leurs arches dorées fissurées et altérées. La poussière étouffe l'air, et l'odeur de pourriture s'attarde dans le silence stagnant. Des meubles brisés, depuis longtemps réduits en ruine, jonchent les sols de pierre, ses tissus jadis riches réduits à rien que des restes en lambeaux du passé.\n\nJe fouille, m'enfonçant plus profond dans les couloirs abandonnés, mais je ne trouve rien : pas de trésor, pas de signe de vie, seulement les échos d'un âge oublié. On dirait que le palais lui-même est une coque, une coquille vide de grandeur que le temps a depuis longtemps abandonnée. Pourtant, juste alors que le doute commence à s'immiscer, je tombe sur un escalier, s'enroulant vers le bas dans l'ombre.\n\nAttiré vers l'avant, je descends dans le sous-sol, où les derniers rayons de soleil filtrent à travers des miroirs de cristal complexes, projetant des faisceaux scintillants d'or et de violet à travers la chambre. La lumière se reflète sur quelque chose à couper le souffle : d'anciennes œuvres d'art valyriennes, gravées dans la pierre au-dessus de la grande porte devant moi. Les images racontent une histoire de pouvoir et de feu, de puissants Seigneurs Dragons régnant sur les cieux, leurs grandes bêtes se lovant à travers des nuages de flamme. Leurs yeux, sculptés dans des gemmes précieuses, scintillent dans la lumière fracturée, comme s'ils me regardaient, me jugeaient.\n\nJe m'attarde, captivé par l'art, par le poids même de l'histoire qui pèse sur ce lieu. Mais alors une réalisation glaçante s'installe sur moi : dans tout ce palais entier, je n'ai vu aucun signe des morts. Pas de squelettes. Pas de restes de ceux qui appelaient jadis ce lieu leur maison.\n\nUn lieu abandonné par le temps... pourtant apparemment intact par la mort.\n\nUn frisson me parcourt l'échine alors que je m'approche de la grande porte, ma main planant au-dessus de sa surface froide. Quelque chose cloche ici. Et je suis sur le point de découvrir quoi."
  gogossos_expedition.1003.a:0 "Dans le sous-sol nous allons je suppose"
  #palace.1:0 "The only way forward is down...."

  gogossos_expedition.1004:0 "La Fresque"
  gogossos_expedition.1004_t:0 "La Fresque"
  gogossos_expedition.1004_desc:0 "Alors que je descends plus profond dans les entrailles du palais, l'escalier en spirale semble sans fin, l'air devenant plus froid à chaque marche. Les ombres se tordent et se contorsionnent le long des murs de pierre anciens, pourtant je continue, poussé par curiosité et malaise à parts égales. Finalement, j'atteins le fond : une vaste chambre, impossiblement illuminée malgré les profondeurs. La lumière, douce et dorée, se déverse de sources invisibles, projetant une lueur surnaturelle sur les murs.\n\nMon souffle se coupe alors que je contemple le spectacle devant moi : une autre fresque magnifique, son art inégalé, rayonnant un sentiment de crainte et de révérence. Celle-ci dépeint des dragons dans leur gloire complète et majestueuse, chacun unique, chacun à couper le souffle dans sa splendeur.\n\nLe Puissant Dragon Pourpre, ses écailles scintillant comme l'améthyste, libère un torrent de feu, sa puissance inégalée.\n\nLe Dragon Blanc, rapide et féroce, semble presque se brouiller en mouvement, sa silhouette élancée fendant les nuages comme une lame.\n\nLe Dragon Rouge, ses yeux brûlant de malice, se dresse comme un tyran, sa présence commandant peur et terreur.\n\nEt finalement, le Dragon Noir : mystérieux, mythique, sa forme enveloppée dans une aura de majesté sombre, comme s'il existait entre ce monde et le suivant.\n\nJe n'ai qu'un moment pour m'émerveiller de la beauté de la fresque, mes doigts traçant le bord des sculptures complexes. Puis, le son vient. Un grondement bas et familier de pierre ancienne qui bouge. Mon cœur se saisit dans ma poitrine, et un frisson me parcourt l'échine alors que le bruit devient plus fort, plus violent. Je fais volte-face, les yeux écarquillés d'alarme, juste alors que le sol sous moi cède.\n\nLe monde bascule, et je suis en apesanteur, mon cri se coinçant dans ma gorge alors que la pierre s'effrite dans l'obscurité. Mon esprit a à peine le temps d'enregistrer la terreur avant que je ne plonge dans l'inconnu en-dessous, la faible lueur de la fresque disparaissant alors que je tombe."
  gogossos_expedition.1004.a:0 "Oh non..."

  # evil_death_events.1:0 "I Can't Take it..."
  # evil_death_events.1_t:0 "I Can't Take it..."
  # evil_death_events.1_desc:0 "I can't take it anymore. These four doors stand before me, each one pulsing with an unseen energy, yet none offering a way out. Purple, White, Red, Black—no matter how long I stare, no matter how much I search for answers in their intricate designs, they remain an enigma. There's no escape, no exit from this wretched place. Just the cold, unyielding stone, the eerie glow of the crystals, and the oppressive silence that seems to stretch into eternity.\n\nI'm doomed to waste away here, trapped in this endless nightmare, with nothing but these cursed doors and my own growing despair for company. My strength is already failing me, my body weakening with every passing moment. I can feel the emptiness creeping in, my mind clawing at the edges of sanity.\n\nBut I won't let it end like this. I refuse to wither into a husk, to become a shadow of myself, forgotten and consumed by this place. If this is to be my end, it will be on my terms, by my own hand. I will not let dishonor take me, nor the slow, cruel grip of starvation.\n\nI glance at the doors one last time, their silent presence mocking me, and steel myself for what must be done. Better to face the unknown than to let this cursed palace strip me of all that I am. Better to go with defiance in my heart than to let the darkness claim me piece by piece."
  # sewingside.1:0 "I pull out my sword one last time..."

  gogossos_expedition.1005:0 "L'Emporium de Portes de l'ours"
  gogossos_expedition.1005_t:0 "L'Emporium de Portes de l'ours"
  gogossos_expedition.1005_desc:0 "Alors que je me tiens dans la lueur étrange des cristaux, la chambre s'étend devant moi, vaste et vide, sauf pour quatre portes qui dominent son mur du fond. Chaque porte est massive et sculptée avec des motifs complexes, leurs détails illuminés par la lumière scintillante des cristaux au-dessus. Mon cœur bat alors que je fais un pas plus près, attiré par leur présence sinistre.\n\nLes portes sont comme rien que j'aie vu auparavant, chacune rayonnant sa propre aura distincte, comme si imprégnée de pouvoir.\n\nLa Porte Pourpre luit comme l'améthyste polie, sa surface vivante avec des sculptures de flammes et de dragons serpentins tortueux. Le feu qu'ils respirent semble presque bouger quand la lumière la frappe juste comme il faut, et l'air autour d'elle bourdonne d'une énergie surnaturelle.\n\nLa Porte Blanche, en contraste saisissant, est élégante et lisse, comme l'ivoire poli. Ses sculptures dépeignent un dragon en vol, sa forme élancée et gracieuse, ailes étendues larges comme si pris dans un mouvement éternel. La lumière froide des cristaux lui donne une lueur presque spectrale, comme si elle était intacte par le temps.\n\nLa Porte Rouge est audacieuse et terrifiante. Sa surface est gravée avec des motifs déchiquetés et chaotiques, les lignes profondes et rugueuses, comme si calcinées dans le bois par le feu lui-même. Un dragon monstrueux aux yeux cruels et perçants est sculpté dans son cadre, sa présence rayonnant la menace. Même se tenir près d'elle rend l'air lourd et oppressant.\n\nLa Porte Noire est la plus énigmatique. Elle semble absorber la lumière, sa surface lisse et sombre comme l'obsidienne. Les ombres semblent danser à travers elle, se déplaçant et se tordant comme si elles avaient une vie propre. Les sculptures ici sont subtiles et difficiles à distinguer, mais le dragon dépeint se sent surnaturel, presque incompréhensible : plus esprit que bête.\n\nChaque porte pulse faiblement avec une force invisible, comme si me faisant signe vers l'avant. Pourtant il n'y a aucune indication de ce qui se trouve derrière elles. Mes yeux vacillent entre elles, mon esprit s'emballant. Est-ce la fin du palais ? Ou est-ce le commencement de quelque chose de bien pire ?\n\nMes instincts me crient de choisir soigneusement, mais peu importe quoi, je sais qu'il n'y a pas de retour en arrière maintenant. Une de ces portes détient mon chemin vers l'avant, ou ma perte."
  gogossos_expedition.1005.a:0 "Porte Pourpre"
  gogossos_expedition.1005.b:0 "Porte Blanche"
  gogossos_expedition.1005.c:0 "Porte Rouge"
  gogossos_expedition.1005.d:0 "Porte Noire"
  gogossos_expedition.1005.z:0 "Je ne veux plus faire cela..."

  gogossos_expedition.1008:0 "Les Salles Sombres Continuent Toujours !"
  gogossos_expedition.1008_t:0 "Les Salles Sombres Continuent Toujours !"
  gogossos_expedition.1008_desc:0 "J'y suis arrivé. D'une façon ou d'une autre, j'ai traversé le piège fou de la salle des portes, et maintenant je me tiens plus profond dans les profondeurs tordues du palais. Mon souffle est haletant, mon cœur battant dans ma poitrine alors que je prends un moment pour me stabiliser. L'air ici semble plus lourd, plus froid, comme s'il pesait sur moi, et la faible lueur des lumières de cristal s'attarde encore, me guidant vers l'avant.\n\nDevant moi s'étend un long couloir, impossiblement long, sa fin engloutie par les ombres. Les murs sont sculptés de la même pierre ancienne que le reste du palais, mais ici ils sont bordés de runes faiblement luisantes : motifs de langue oubliée qui pulsent doucement comme si vivants. Le couloir semble vivant avec une énergie étrange, une vibration étrange que je peux sentir dans mes os.\n\nLe sol sous moi est humide, glissant de condensation, et chaque pas que je fais envoie un écho dans le couloir qui me revient comme un murmure. On dirait que l'endroit regarde, écoute, attend.\n\nIl y a quelque chose de troublant dans ce couloir, quelque chose qui fait dresser les poils de ma nuque. L'air devient plus froid à chaque pas, et un bourdonnement étrange et bas commence à remplir le silence. C'est distant au début, mais plus je marche, plus il devient fort, comme le son d'un battement de cœur distant, profond et résonnant.\n\nLe couloir semble sans fin, les ombres devant refusant de céder à la lumière. Chaque instinct me dit de faire demi-tour, de trouver un autre chemin, mais je sais qu'il n'y a pas de retour en arrière maintenant. Quoi que ce soit qui se trouve au bout de ce couloir, je dois l'affronter. Mes doigts se resserrent autour de la poignée de mon arme alors que je continue vers l'avant, chaque pas m'emmenant plus profond dans l'inconnu."
  gogossos_expedition.1008.a:0 "Au moins ce ne sont pas les backrooms..."

  gogossos_expedition.1009:0 "Le Mage !"
  gogossos_expedition.1009_t:0 "Le Mage !"
  gogossos_expedition.1009_desc:0 "Enfin, le couloir se termine. Devant moi, une vieille porte de bois gît brisée au sol, ses restes éclatés éparpillés comme les vestiges de quelque barrière oubliée depuis longtemps. Au-delà du cadre brisé se trouve une pièce comme rien que j'aie rencontré dans ce palais : les quartiers d'un mage, intacts par le temps mais lourds du poids de l'abandon.\n\nLa pièce est un chef-d'œuvre chaotique, ses murs bordés d'étagères imposantes bourrées de tomes anciens, de parchemins et de fragments de parchemin. L'air est épais avec le parfum faible de papier vieilli et la saveur âcre d'expériences alchimiques endormies depuis longtemps. Des fioles de verre, certaines fissurées et d'autres encore intactes, encombrent les tables, remplies de liquides qui scintillent faiblement sous la lumière pâle des cristaux au-dessus. D'étranges dispositifs, leur but insondable, sont assis à côté d'eux, leurs cadres de laiton et d'argent ternis mais étrangement complexes.\n\nMais c'est la table au fond de la pièce qui attire mon attention. Là, affaissé sur sa surface, se trouve un squelette drapé dans une robe à capuche en lambeaux. Les os sont jaunis par l'âge, pourtant il y a quelque chose d'étrangement délibéré dans son positionnement. C'est comme si le mage, si c'est ce qu'il était, savait que la fin arrivait et choisit cet endroit comme son lieu de repos final.\n\nDevant le squelette, éparpillés sur la table, se trouve une collection d'objets. Un journal relié de cuir poussiéreux, sa couverture fissurée mais intacte, se trouve au centre. L'air autour de lui semble lourd, comme s'il détenait des secrets destinés à rester enterrés. À côté du journal, luisant même dans la faible lumière, se trouvent plusieurs barres d'or, leurs bords usés mais indéniables dans leur valeur.\n\nJe m'approche, mon souffle superficiel alors que je prends tout cela. Le journal semble presque m'appeler, sa présence commandant mon attention bien plus que l'or ne pourrait jamais le faire. Mes doigts planent au-dessus de sa couverture, hésitant. Cette pièce semble détenir des réponses, ou peut-être plus de questions.\n\nQui était ce mage ? Que lui est-il arrivé ? Et pourquoi ai-je l'impression d'être tombé sur quelque chose qui n'était jamais destiné à être trouvé ?"

  gogossos_expedition.1009.b:0 "Que dit le journal ?"

  gogossos_expedition.1210:0 "Le Rêve d'une Vie..."
  gogossos_expedition.1210_t:0 "Le Rêve d'une Vie..."
  gogossos_expedition.1210_desc:0 "Je ramasse le journal avec des mains tremblantes, brossant la fine couche de poussière qui s'était installée dessus. Mes doigts tracent la couverture de cuir fissurée alors que je feuillette ses pages fragiles, l'encre fanée mais encore lisible. Je parcours rapidement la dernière entrée, attiré par les pensées finales du mage mort depuis longtemps.\n\nLes mots me glacent jusqu'aux os. Il écrivit de ses heures finales, de comment la Peste du Sang Gogossienne avait pris possession de son corps, le ravageant de l'intérieur. Ses descriptions sont vives et hantantes : de la fièvre, du saignement, et de la faiblesse qui le consuma, le privant de la force pour continuer son travail. Il déplorait ses expériences inachevées, son potentiel gaspillé, et l'héritage qu'il ne laisserait jamais derrière. Son désespoir suinte de la page, chaque mot un rappel douloureux de combien sa fin dut être cruelle et finale.\n\nMais avant que je puisse creuser plus loin, la pièce commença à trembler. Un grondement bas, comme le grognement d'une bête qui s'éveille, vibre à travers les murs de pierre. La poussière tombe en épais nuages d'en haut, et la faible lumière des cristaux commence à vaciller sauvagement. Je lève les yeux alors que de petites roches commencent à tomber, suivies par les gémissements craquants du plafond qui buge sous une pression invisible. La pièce s'effondre.\n\nLa panique inonde mes veines. Je remets le journal sur la table à la hâte : il est trop lourd, trop fragile à porter, et à la place je saisis les barres d'or luisantes. Mes instincts me crient de courir, de m'échapper avant d'être enterré vivant aux côtés des restes du mage.\n\nJe fonce vers la porte, ou ce qu'il en reste, mais juste alors que j'atteins le seuil, l'écriture runique sculptée dans le sol s'embrase. Les symboles luisants pulsent avec une intensité aveuglante, remplissant la pièce d'une radiance surnaturelle. Le son de la pièce qui s'effondre est noyé par un bourdonnement aigu et presque assourdissant, et avant que je puisse traiter ce qui se passe, ma vision est consumée par une lumière blanche.\n\nQuand la lumière s'estompe, je ne suis plus dans le palais.\n\nJe me tiens sur une plage. Du sable chaud bouge sous mes pieds, le son des vagues qui s'écrasent contre le rivage remplissant mes oreilles. La saveur salée de l'air marin est un contraste impossible à l'atmosphère froide et décadente que je venais de quitter. Mon cœur s'emballe alors que je tournoie, essayant de comprendre ce qui vient de se passer. Le palais, la pièce qui s'effondrait, le mage : tout a disparu, remplacé par l'horizon sans fin d'océan et de ciel.\n\nJe serre les barres d'or fermement, mon souffle encore haletant du chaos, mon esprit s'emballant de questions. Comment suis-je ici ? Pourquoi les runes m'ont-elles téléporté à cet endroit ? Était-ce un système de sécurité laissé par le mage, ou quelque force invisible intervenant ?\n\nLa seule certitude est que je me suis échappé, pour l'instant. Mais cette plage... elle semble trop paisible, trop parfaite. Et au fond, je savais que tout était réel."
  gogossos_expedition.1210.b:0 "Allons... juste rentrer à la maison..."
  gogossos_expedition.1210.b.outcome:0 "Vous concluez votre expédition à Gogossos."
  ambush.1:0 "AAAAAAAGHH !!!!"

  gogossos_expedition.1100:0 "La Chambre du Dragon"
  gogossos_expedition.1100_t:0 "La Chambre du Dragon"
  gogossos_expedition.1100_desc:0 "Alors que je descends dans le sous-sol, un frisson me parcourt l'échine. L'air est épais de poussière et l'odeur de quelque chose d'ancien, quelque chose oublié depuis longtemps. Mes pas résonnent dans la lumière tamisée, mais alors je m'arrête brusquement, figé sur place.\n\nDevant moi, se dressant dans les ombres, se trouve un dragon. Un vrai dragon vivant. Sa forme massive est lovée dans l'obscurité, ses écailles scintillant faiblement même dans la pénombre. Mon souffle se coupe dans ma gorge. Cela ne devrait pas être possible. Les Seigneurs Dragons d'antan ont depuis longtemps disparu dans la légende : comment une de leurs bêtes pourrait-elle encore exister ici, cachée sous cet endroit ?\n\nUn mélange de crainte et de terreur me saisit, mais au milieu de la peur, une autre pensée prend racine. Il y a plus à cet endroit que je n'aurais jamais imaginé. Des secrets enterrés sous des siècles, des mystères attendant d'être dévoilés.\n\nMais je ne suis pas venu jusqu'ici juste pour faire demi-tour les mains vides. Si ce dragon a été préservé ici si longtemps, il doit y avoir quelque chose de grande valeur caché dans ces murs. Et j'ai l'intention de réclamer ma récompense."

  gogossos_expedition.1100.a:0 "Je tuerai cette bête et réclamerai mon prix !"
  gogossos_expedition.1100.b:0 "Je suis du sang du dragon ! Tu t'inclineras devant moi !"
  gogossos_expedition.1100.b.outcome:0 "Vous tentez d'apprivoiser le dragon. Quel que soit le résultat, votre expédition à Gogossos se termine ici."

  gogossos_expedition.1101:0 "Le Champion"
  gogossos_expedition.1101_t:0 "Le Champion"
  gogossos_expedition.1101_desc:0 "La bataille fut féroce, chaque moment un test de volonté et d'endurance. Le dragon rugit, son souffle enflammé calcinant l'air, mais j'avais déjà appris à lire ses mouvements. À chaque frappe tonitruante de ses griffes, je dansais entre mort et survie, ma lame trouvant des ouvertures où les écailles se séparaient juste assez. Il bondit, et je roulai sous lui, enfonçant mon arme profond dans son ventre exposé. Un cri perçant assourdissant déchira la chambre alors que la bête se débattait, sa queue massive brisant la pierre dans sa lutte finale et désespérée.\n\nAvec une dernière poussée de force, je grimpai sur son dos, saisissant les crêtes de son épine dorsale alors que j'enfonçais mon épée à travers la base de son crâne. Le dragon laissa échapper un dernier souffle frissonnant avant de s'effondrer, son corps énorme secouant le sol en tombant. Je me dressai au-dessus de lui, la poitrine se soulevant, sang et suie s'accrochant à ma peau. La créature jadis puissante gisait immobile, son règne oublié depuis longtemps finalement mis à terme.\n\nLe silence qui suivit était lourd, mais je ne ressentais aucun regret. J'avais tué une légende, et maintenant, les dépouilles de son repaire antique étaient miennes à prendre."

  gogossos_expedition.1101.a:0 "Qu'est-ce que c'est ?"

  gogossos_expedition.1102:0 "L'Épreuve du Sang"
  gogossos_expedition.1102_t:0 "L'Épreuve du Sang"
  gogossos_expedition.1102_desc:0 "Ayant tué le dragon et réclamé son trésor, je tournai mon regard vers l'extrémité de la chambre, où quelque chose de bien plus sinistre m'attendait. Une porte massive, forgée d'acier noirci, se dressait devant moi. Tordue et déchiquetée, sa surface portait l'image d'un visage grimaçant, figé dans une grimace éternelle, sa gueule béante assez large pour avaler un homme entier.\n\nDevant la porte se dressait un pilier de pierre, ancien et altéré, sur lequel reposait un simple bol. Il était peu remarquable au premier regard, sauf pour les runes étranges gravées le long de son rebord : des symboles qui semblaient bouger et se tordre sous mon regard. À l'intérieur du bol, une dague rouillée gisait immobile, son tranchant jadis aiguisé émoussé par le temps et la décadence.\n\nAlors que je m'approchais, un frisson me parcourut l'échine. Des murmures, doux et insidieux, effleuraient mon esprit comme des doigts froids. Ils me faisaient signe, murmurant des mots que je ne pouvais comprendre mais que je ressentais d'une certaine façon dans mes os. Ils m'attiraient, me pressant d'avancer, me contraignant à prendre la dague.\n\nL'offrande qu'elle exigeait était claire. Du sang. Le mien. Les runes pulsaient faiblement comme si sentant mon hésitation, les murmures devenant impatients. Quoi que ce soit qui se trouvait au-delà de cette porte ne se révélerait pas sans sacrifice."

  gogossos_expedition.1102.a:0 "Une petite offrande est préférable"
  gogossos_expedition.1102.b:0 "Seule une grande offrande suffira"
  gogossos_expedition.1102.c:0 "Je ne pense pas que ce soit sage. Je vais laisser cela tranquille"
  gogossos_expedition.1102.c.outcome:0 "Vous concluez votre expédition à Gogossos."

  gogossos_expedition.2001:0 "Tu es un Imbécile !"
  gogossos_expedition.2001_t:0 "Tu es un Imbécile"
  gogossos_expedition.2001_desc:0 "Le couteau, bien qu'apparaissant émoussé et usé, sépara ma peau comme du beurre. Il n'y eut aucune résistance, aucune douleur, seulement la facilité troublante avec laquelle il sculpta à travers la chair. Le sang jaillit instantanément, coulant en filets épais et cramoisis dans le bol qui attendait. Les runes bordant son rebord s'embrasèrent d'une lueur maladive, comme si buvant profondément de mon offrande.\n\nPuis, la porte gémit. Un son lent et grinçant, métal broyant contre pierre. Le visage tordu sculpté dedans semblait bouger, son expression jadis grimaçante se courbant en quelque chose de bien pire : un sourire. Un sourire profond et connaisseur. Une vague de vertige me submergea. Ma vision se brouilla, s'assombrissant aux bords. Je vacillai sur mes pieds, luttant pour rester debout, mais mes membres semblaient impossiblement lourds. Pourtant, je le vis : la porte s'ouvrait. Quoi que ce soit au-delà gisait à ma portée. Je me forçai vers l'avant, contraignant mon corps à bouger. Mais alors je tombai. Un effondrement net et impitoyable sur le sol de pierre froide. La panique surgit en moi alors que j'essayais de me lever, mais ma force était partie. La dague glissa de mes doigts, cliquetant inutilement à côté de moi. Et alors, la vraie horreur s'installa.\n\nLa douleur. Elle commença comme une sensation lente et rampante sous ma peau, puis s'épanouit en agonie. Ma chair picota, puis brûla, puis se flétrit. Je haletai, mais aucun souffle ne vint. Mes veines noircirent, ma peau se fissura et pela, se détachant en feuilles écœurantes. Le sang ne coulait plus seulement de ma main : il se déversait de partout. Mon corps se défaisait, pourrissant sous mes yeux mêmes. J'essayai de crier, mais ma gorge s'effondra sur elle-même, ma voix volée par la force même que j'avais cherché à éveiller. La dernière chose que je vis avant que les ténèbres ne m'emportent fut la porte, grande ouverte. Et au-delà : des ombres, bougeant et observant.\n\nPuis, rien."
  gogossos_expedition.2001.dumbass:0 "..."

  gogossos_expedition.2002:0 "Le Coffre des Souhaits"
  gogossos_expedition.2002_t:0 "Le Coffre des Souhaits"
  gogossos_expedition.2002_desc:0 "Le couteau, bien qu'apparaissant émoussé et usé, sépara ma peau comme du beurre. Il n'y eut aucune résistance, aucune douleur, seulement la facilité troublante avec laquelle il sculpta à travers la chair. Le sang jaillit instantanément, coulant en filets épais et cramoisis dans le bol qui attendait. Les runes bordant son rebord s'embrasèrent d'une lueur maladive, comme si buvant profondément de mon offrande.\n\nPuis, la porte gémit. Un son lent et grinçant, métal broyant contre pierre. Le visage tordu sculpté dedans semblait bouger, son expression jadis grimaçante se courbant en quelque chose de bien pire : un sourire. Un sourire profond et connaisseur.\n\nMais alors, quelque chose d'inattendu se produisit. Une sensation de picotement aiguë parcourut ma paume, et quand je baissai les yeux, la blessure avait disparu. Ma peau s'était recomposée, l'offrande de sang prise, mais ne laissant aucune trace de mal. Mon souffle était irrégulier alors que je m'avançais, dépassant le seuil de la porte maintenant ouverte, dans la chambre au-delà.\n\nLe Coffre des Souhaits.\n\nMes yeux s'écarquillèrent alors que je contemplais le spectacle devant moi : des artefacts dorés empilés haut, des gobelets ornés de joyaux scintillant dans la faible lumière des torches, des gemmes éparpillées comme de simples cailloux sur le sol. Richesse au-delà de l'imagination, intacte depuis des siècles. C'était le vrai trésor, le butin que le dragon gardait, le prix caché au-delà de sa forme monstrueuse.\n\nMais parmi les richesses scintillantes, un objet attira mon regard par-dessus tout. Assis au sommet d'un piédestal, baigné dans une lueur éthérée, se trouvait l'artefact que j'avais cherché. La raison pour laquelle j'étais venu si loin. Mon cœur battit alors que je m'approchais plus près, le poids de mon voyage culminant en ce moment unique et si longtemps attendu."
  gogossos_expedition.2002.a:0 "C'est magnifique..."
  gogossos_expedition.2002.a.outcome:0 "Vous concluez votre expédition à Gogossos."

  evil_death_events.1:0 "Je n'en peux plus..."
  evil_death_events.1_t:0 "Je n'en peux plus..."
  evil_death_events.1_desc:0 "Les quatre portes se dressent devant moi : pourpre, rouge, blanche et noire. Je les ai toutes essayées, passant à travers chacune à tour de rôle, seulement pour être traîné de retour à cette même pièce maudite. Peu importe quel chemin je prends, peu importe combien de fois je choisis, je finis toujours ici. Une boucle tordue, une prison sans murs.\n\nJe serre les poings, mon souffle haletant alors que la frustration me griffe. Je ne peux pas continuer à faire cela. Le cycle sans fin, la répétition suffocante : cela me brise. Mais je refuse de laisser la folie prendre racine. Je refuse de mourir de faim, de dépérir dans cet endroit, attendant une échappatoire qui n'existe pas.\n\nSi c'est tout ce qu'il y a, alors je l'achèverai selon mes propres termes."

  sewingside.1:0 "Je tire mon épée, une dernière fois..."
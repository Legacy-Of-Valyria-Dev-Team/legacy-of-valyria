 gogossos_expedition.0003:0 "Je n'en Crois pas mes Yeux"
 gogossos_expedition.0003_t:0 "Tombeau du Lord Dragon"
 gogossos_expedition.0003_desc:0 "En entrant dans le tombeau, je remarque qu'il s'agit d'une vaste pièce carrée ornée de statues de chevaliers valyriens et de superbes fresques représentant [old_valyria|E] à son apogée.\n\nJe vois de grands monceaux d'or empilés soigneusement à côté du vaste sarcophage au centre de la pièce, avec des gemmes précieuses et des ornements d'or\n\nEn repoussant le couvercle du sarcophage, je trouve un squelette à l'intérieur et..."
 gogossos_expedition.0003.a:0 "Qu'avons-nous là ?"
 gogossos_expedition.0003.outcome:0 "Vous récupérez le trésor à l'intérieur et concluez votre expédition à Gogossos."

 gogossos_expedition.0003.a.outcome.egg:0 "Vous trouvez un œuf de dragon"
 gogossos_expedition.0003.a.outcome.blood:0 "Vous trouvez un parchemin de magie du sang"
 gogossos_expedition.0003.a.outcome.water:0 "Vous trouvez un parchemin de magie de l'eau"
 gogossos_expedition.0003.a.outcome.shadow:0 "Vous trouvez un parchemin de magie de l'ombre"

 gogossos_expedition.0004:0 "Je n'en Crois pas mes Yeux !"
 gogossos_expedition.0004_t:0 "Je n'en Crois pas mes Yeux !"
 gogossos_expedition.0004_desc:0 "En entrant dans le tombeau, espérant le dépouiller de ses trésors, je m'arrête net. Figé de terreur, je lève les yeux et vois..."
 gogossos_expedition.0004.a:0 "UN DRAGON !"

 gogossos_expedition.00041:0 "Pas ce qu'il Semble ?"
 gogossos_expedition.00041_t:0 "Pas ce qu'il Semble ?"
 gogossos_expedition.00041_desc:0 "Heureusement, il semble que le dragon soit mort depuis longtemps et ne soit plus qu'une carcasse en putréfaction, pourtant ce sur quoi repose son cadavre affaissé est bien réel... de l'or ! Le dragon mort nichait sur un immense trésor d'or, bien que le reste du tombeau semble avoir été profané. Toutes les œuvres et statues défigurées et endommagées au-delà de toute reconnaissance."
 gogossos_expedition.00041.a:0 "Espérons que ceci ne soit pas maudit comme l'or de Thorïn"
 gogossos_expedition.00041.outcome:0 "Vous concluez votre expédition à Gogossos."

 gogossos_expedition.00042:0 "Le Tueur de Dragon"
 gogossos_expedition.00042_t:0 "Le Tueur de Dragon"
 gogossos_expedition.00042_desc:0 "L'adrénaline bat encore fort dans tout mon corps. Pendant une minute, rien ne semblait réel. Vous n'êtes pas certain de ce qui s'est passé, mais une chose est sûre : ce dragon ne vous troublera plus jamais. Vous avez terrassé un dragon et avez survécu pour en conter l'histoire."
 gogossos_expedition.00042.a:0 "Au moins j'ai obtenu de l'or pour ma peine !"
 gogossos_expedition.00042.outcome:0 "Vous concluez votre expédition à Gogossos."

 gogossos_expedition.0050:0 "Que se Passe-t-il, au Nom du Monde ?"
 gogossos_expedition.0050_t:0 "Que se Passe-t-il, au Nom du Monde ?"
 gogossos_expedition.0050_desc:0 "Ayant voyagé à travers la jungle durant quelques heures, j'ai rencontré un campement où j'ai trouvé un petit nain attisant le feu. Il leva les yeux et nos regards se croisèrent, et il parla doucement avec un accent prononcé\n\n« Et que crois-tu faire ici, [Select_CString( ROOT.Char.IsFemale, 'fillette', 'garçon' )] ? » demanda le nain, ce à quoi je répondis que je souhaitais explorer les ruines de Gogossos en quête de trésor. Le nain caressa sa barbe, pensif.\n\nSoudain, il éclata d'un rire sinistre et parla en haut valyrien parfait. La magie emplit les yeux du nain."
 gogossos_expedition.0050.a:0 "Je ne me sens pas très bien..."
 gogossos_expedition.0050.a.bear:0 "Votre expédition à Gogossos s'achève et vous rentrez chez vous, car vous êtes devenu un ours ridicule.\n#weak Vous n'ours-ez pas y croire !#!"

 gogossos_expedition.0060:0 "La Bibliothèque"
 gogossos_expedition.0060_t:0 "La Bibliothèque"
 gogossos_expedition.0060_desc:0 "Il semble que je sois tombé sur une ancienne bibliothèque.\n\nJe vois des rangées et des rangées d'étagères, certaines chargées de livres, d'autres décrépites et tombant en morceaux. Je distingue une table au fond, avec un squelette vêtu de robes en lambeaux, assis devant plusieurs livres étalés. Je peux tout juste lire le titre de chacun."
 gogossos_expedition.0060.outcome:0 "Vous concluez votre expédition à Gogossos."
 gogossos_expedition.0060.a:0 "Un livre sur les techniques martiales"
 gogossos_expedition.0060.b:0 "Un livre de philosophie"
 gogossos_expedition.0060.c:0 "Un livre intitulé #emphasis L'Art de la Diplomatie#!"
 gogossos_expedition.0060.d:0 "Un livre explorant l'intendance et la gouvernance"
 gogossos_expedition.0060.e:0 "Un livre intitulé #emphasis Le Prince#!"

 gogossos_expedition.0119:0 "Pirates à l'Horizon"
 gogossos_expedition.0119_t:0 "Pirates à l'Horizon"
 gogossos_expedition.0119_desc:0 "Ayant mis les voiles il y a de nombreux jours vers notre aventure à Gogossos, nous avons repéré un navire à l'horizon arborant un pavillon noir — typiquement hissé par les pirates de ces eaux.\n\nEspérons qu'ils ne nous repèrent pas..."
 gogossos_expedition.0119.z:0 "Je déteste les pirates..."

 gogossos_expedition.0110:0 "Nous Avons Été Abordés !"
 gogossos_expedition.0110_t:0 "Nous Avons Été Abordés !"
 gogossos_expedition.0110_desc:0 "Les pirates ont vite rattrapé notre navire et nous avons été abordés ! Leur capitaine et ses hommes bondissent sur le pont, épées levées plus vite que je ne l'anticipais. Cela ne présage rien de bon..."
 gogossos_expedition.0110.a:0 "Cela ne présage vraiment rien de bon..."
 gogossos_expedition.0110.a.outcome:0 "Vous vous rendez aux pirates."
 gogossos_expedition.0110.b:0 "Bordez les vergues, tas de singes maladroits ! Un jour à mourir est un jour qui vaut la peine d'être vécu !"
 gogossos_expedition.0110.b.outcome:0 "Vous entamez un duel avec le capitaine pirate."

 gogossos_expedition.0120:0 "Pirates Évités"
 gogossos_expedition.0120_t:0 "Pirates Évités"
 gogossos_expedition.0120_desc:0 "Il semblerait que les pirates ne nous aient pas repérés, ou que s'ils l'ont fait, ils n'étaient assurément pas intéressés par notre vaisseau.\n\nNous avons atteint la rive sains et saufs. À partir d'ici, le véritable danger commence, car la jungle gogossite nous appelle."
 gogossos_expedition.120.a:0 "En avant, et voyons ce qu'il y a à découvrir"

 gogossos_expedition.0111:0 "Nul Rival pour Mon Acier"
 gogossos_expedition.0111_t:0 "Nul Rival pour Mon Acier"
 gogossos_expedition.0111_desc:0 "Le pirate n'était nul rival pour mon acier et [pirate_lord.GetSheHe|l] fut abattu. Les hommes restants du seigneur pirate prirent aussitôt la fuite, nous permettant de poursuivre notre voyage. Espérons que la traversée soit sereine désormais."
 gogossos_expedition.0111.a:0 "Espérons qu'ils furent le dernier obstacle"
 gogossos_expedition.0111.a.outcome:0 "Votre expédition se poursuit."

 gogossos_expedition.0112:0 "Ma Fierté est Ternie"
 gogossos_expedition.0112_t:0 "Ma Fierté est Ternie"
 gogossos_expedition.0112_desc:0 "Le seigneur pirate était trop fort et trop habile pour que je puisse le vaincre, et j'ai été battu et terrassé. Bien que je vive, ma fierté est blessée, et me voilà à présent à la merci des pirates."
 gogossos_expedition.0112.a:0 "Malédiction !"

 gogossos_expedition.1001:0 "L'Ascension"
 gogossos_expedition.1001_t:0 "L'Ascension"
 gogossos_expedition.1001_desc:0 "Après nous être échoués sur la plage, nous avons pris un instant pour reprendre nos esprits, examinant le paysage autour de nous. Les falaises imposantes nous encerclaient comme une prison naturelle, ne laissant qu'une seule voie possible — vers le haut. N'ayant nul autre moyen d'explorer l'île, nous devons entamer notre ascension, escaladant les parois rocheuses qui se dressent au-dessus de nous, espérant trouver des réponses — ou peut-être même un trésor — au-delà de leurs sommets."
 gogossos_expedition.1001.a:0 "En avant et vers le haut !"
 gogossos_expedition.1001.b:0 "Volons, [my_dragon.GetNameNoTooltip] !"

 gogossos_expedition.1006:0 "La Dernière Chute
 gogossos_expedition.1006_t:0 "La Dernière Chute
 gogossos_expedition.1006_desc:0 "Mes doigts s'agrippaient à la roche friable, le cœur battant tandis que je me hissais plus haut. Le vent hurlait, mordant ma peau, mais je me forçais à continuer de grimper. Encore un peu — puis la corniche sous mon pied céda. Pour un instant, un seul, déchirant, je fus en apesanteur, mes bras s'agrippant au vide. Le monde tournoyait tandis que je chutais, la plage en contrebas se ruant à ma rencontre. Un halètement étranglé m'échappa, non de peur, mais de compréhension — c'était donc cela. Puis, le silence."
 gogossos_expedition.1006.a:0 "..."

 gogossos_expedition.1002:0 "Le Palais de Marbre"
 gogossos_expedition.1002_t:0 "Le Palais de Marbre"
 gogossos_expedition.1002_desc:0 "Tandis que je gravis le sommet de la falaise escarpée, je secoue la poussière et les débris qui s'accrochent à moi, exhalant tandis que le monde se déploie sous mon regard. La terre s'étend au loin, une tapisserie à couper le souffle de roche déchiquetée, de jungle dense et de collines ondoyantes baignées dans la lueur dorée du soleil mourant. La brume s'élève de la canopée en contrebas, tourbillonnant comme des tentacules spectraux entre les arbres antiques, leurs feuilles d'émeraude luisant des derniers restes de chaleur du jour. Mais au-delà de la jungle, au-delà de cette beauté sauvage et indomptée, mes yeux se fixent sur quelque chose de véritablement magnifique — un palais de pierre d'un blanc pur, se dressant royal et défiant au sommet d'une colline lointaine. Ses flèches imposantes percent le ciel, captant les dernières lueurs du jour, luisant comme la citadelle de dieux oubliés.\n Un frisson me parcourt, une attirance indéniable, comme si le destin lui-même m'appelait. Ce doit être là que repose le trésor — scellé entre des murs de marbre, voilé dans les échos d'empires perdus. Mais le temps m'est compté. La jungle en contrebas deviendra périlleuse à la nuit tombée, ses ombres dissimulant des créatures inconnues, ses profondeurs vivant des murmures du danger."

 gogossos_expedition.1007:0 "En route vers le palais !"

 gogossos_expedition.1003:0 "Le Palais Silencieux"
 gogossos_expedition.1003_t:0 "Le Palais Silencieux"
 gogossos_expedition.1003_desc:0 "Tandis que je franchis l'entrée majestueuse du palais, un étrange contraste se dévoile devant moi. De l'extérieur, ses murs blancs luisants et ses flèches imposantes demeurent intacts, épargnés par le temps, royaux et inflexibles. Mais à l'intérieur, la décrépitude s'est emparée des lieux. Les salles jadis majestueuses s'effritent, leurs arches dorées fissurées et érodées. La poussière étouffe l'air, et l'odeur de la pourriture s'attarde dans le silence stagnant. Des meubles brisés, réduits en ruine depuis longtemps, gisent épars sur les sols de pierre, leurs tissus jadis somptueux réduits à de simples lambeaux d'un passé révolu.\n\nJe fouille, m'enfonçant plus profondément dans les couloirs abandonnés, mais je ne trouve rien — nul trésor, nul signe de vie, seulement les échos d'une ère oubliée. Il semble que le palais lui-même ne soit qu'une coque vide, une carcasse de grandeur que le temps a depuis longtemps délaissée. Pourtant, alors même que le doute commence à s'infiltrer, je tombe sur un escalier, s'enroulant vers l'obscurité en contrebas.\n\nAttiré, je descends dans le sous-sol, où les derniers rayons du soleil filtrent à travers d'exquis miroirs de cristal, projetant des faisceaux chatoyants d'or et de violet à travers la chambre. La lumière accroche quelque chose de saisissant — d'antiques œuvres valyriennes, gravées dans la pierre au-dessus de la grande porte devant moi. Les images racontent une histoire de puissance et de feu, de puissants Lords dragons régnant sur les cieux, leurs grandes bêtes s'enroulant à travers des nuages de flamme. Leurs yeux, taillés dans des gemmes précieuses, scintillent dans la lumière fracturée, comme s'ils m'observaient, me jugeaient.\n Je m'attarde, captivé par l'art, par le poids même de l'histoire pesant sur ce lieu. Mais alors une prise de conscience glaçante s'installe — dans tout ce palais, je n'ai vu nul signe des morts. Nul squelette. Nulle dépouille de ceux qui appelèrent jadis ce lieu leur foyer.\n Un lieu abandonné par le temps... et pourtant apparemment épargné par la mort.\nUn frisson me parcourt l'échine tandis que je m'approche de la grande porte, ma main planant au-dessus de sa surface froide. Quelque chose ne va pas ici. Et je suis sur le point de découvrir quoi."
 gogossos_expedition.1003.a:0 "Vers le sous-sol, je suppose"
 #palace.1:0 "The only way forward is down...."

 gogossos_expedition.1004:0 "La Fresque"
 gogossos_expedition.1004_t:0 "La Fresque"
 gogossos_expedition.1004_desc:0 "Tandis que je descends plus profondément dans les entrailles du palais, l'escalier en spirale semble sans fin, l'air se refroidissant à chaque pas. Des ombres se tordent et frémissent le long des murs de pierre antiques, mais je persévère, poussé à parts égales par la curiosité et le malaise. Enfin, j'atteins le fond — une vaste chambre, impossiblement éclairée malgré la profondeur. La lumière, douce et dorée, jaillit de sources invisibles, projetant une lueur d'un autre monde sur les murs.\n\nMon souffle se coupe tandis que je contemple la vue devant moi — une autre fresque magnifique, son art sans égal, rayonnant d'un sentiment d'émerveillement et de révérence. Celle-ci dépeint des dragons dans toute leur gloire majestueuse, chacun unique, chacun à couper le souffle dans sa splendeur.\n\nLe Puissant Dragon Pourpre, ses écailles scintillant comme l'améthyste, déchaîne un torrent de feu, sa puissance sans égale.\n\nLe Dragon Blanc, rapide et féroce, semble presque se fondre dans le mouvement, sa silhouette élancée tranchant les nuages comme une lame.\n Le Dragon Rouge, ses yeux brûlant de malveillance, se dresse en tyran, sa présence commandant crainte et effroi.\n\nEt enfin, le Dragon Noir — mystérieux, mythique, sa forme enveloppée d'une aura de sombre majesté, comme s'il existait entre ce monde et le suivant.\n\nJe n'ai qu'un instant pour m'émerveiller de la beauté de la fresque, mes doigts traçant le contour des ciselures complexes. Puis, le son survient. Un grondement sourd et familier de pierre antique qui se déplace. Mon cœur se noue dans ma poitrine, et un frisson me parcourt l'échine tandis que le bruit s'amplifie, se fait plus violent. Je me retourne d'un coup, les yeux écarquillés d'alarme, juste au moment où le sol se dérobe sous moi.\n Le monde bascule, et je suis en apesanteur, mon cri se figeant dans ma gorge tandis que la pierre s'effondre dans les ténèbres. Mon esprit a à peine le temps d'enregistrer la terreur avant que je ne plonge dans l'inconnu en contrebas, la faible lueur de la fresque s'évanouissant tandis que je tombe."
 gogossos_expedition.1004.a:0 "Oh non..."

 # evil_death_events.1:0 "I Can't Take it..."
 # evil_death_events.1_t:0 "I Can't Take it..."
 # evil_death_events.1_desc:0 "I can't take it anymore. These four doors stand before me, each one pulsing with an unseen energy, yet none offering a way out. Purple, White, Red, Black—no matter how long I stare, no matter how much I search for answers in their intricate designs, they remain an enigma. There's no escape, no exit from this wretched place. Just the cold, unyielding stone, the eerie glow of the crystals, and the oppressive silence that seems to stretch into eternity.\n\nI'm doomed to waste away here, trapped in this endless nightmare, with nothing but these cursed doors and my own growing despair for company. My strength is already failing me, my body weakening with every passing moment. I can feel the emptiness creeping in, my mind clawing at the edges of sanity.\n\nBut I won't let it end like this. I refuse to wither into a husk, to become a shadow of myself, forgotten and consumed by this place. If this is to be my end, it will be on my terms, by my own hand. I will not let dishonor take me, nor the slow, cruel grip of starvation.\n\nI glance at the doors one last time, their silent presence mocking me, and steel myself for what must be done. Better to face the unknown than to let this cursed palace strip me of all that I am. Better to go with defiance in my heart than to let the darkness claim me piece by piece."
 # sewingside.1:0 "I pull out my sword one last time..."

 gogossos_expedition.1005:0 "L'Officine des Portes de l'Ours"
 gogossos_expedition.1005_t:0 "L'Officine des Portes de l'Ours"
 gogossos_expedition.1005_desc:0 "Debout dans la lueur inquiétante des cristaux, la chambre s'étend devant moi, vaste et vide, hormis quatre portes qui dominent son mur du fond. Chaque porte est massive et ciselée de motifs complexes, leurs détails illuminés par la lumière chatoyante des cristaux au-dessus. Mon cœur bat la chamade tandis que je m'approche, attiré par leur présence sinistre.\n\nCes portes ne ressemblent à rien de ce que j'ai vu auparavant, chacune rayonnant de sa propre aura distincte, comme imprégnée de pouvoir.\n\nLa Porte Pourpre luit comme de l'améthyste polie, sa surface animée de gravures de flammes et de dragons serpentins qui se tordent. Le feu qu'ils crachent semble presque bouger lorsque la lumière la frappe justement, et l'air autour d'elle vibre d'une énergie surnaturelle.\n\nLa Porte Blanche, en contraste saisissant, est lisse et polie, comme de l'ivoire. Ses gravures représentent un dragon en plein vol, sa silhouette élancée et gracieuse, ailes déployées comme figé dans un mouvement éternel. La lumière froide des cristaux lui donne une lueur presque spectrale, comme si elle était épargnée par le temps.\n\nLa Porte Rouge est audacieuse et terrifiante. Sa surface est gravée de motifs déchiquetés et chaotiques, les lignes profondes et rugueuses, comme calcinées dans le bois par le feu lui-même. Un dragon monstrueux aux yeux cruels et perçants est sculpté dans son cadre, sa présence rayonnant la menace. Même se tenir près d'elle rend l'air lourd et oppressant.\n\nLa Porte Noire est la plus énigmatique. Elle semble absorber la lumière, sa surface lisse et sombre comme l'obsidienne. Des ombres semblent y danser, se déplaçant et se tordant comme si elles avaient vie propre. Les gravures ici sont subtiles et difficiles à discerner, mais le dragon qui y est représenté semble d'un autre monde, presque incompréhensible — davantage esprit que bête.\n\nChaque porte palpite faiblement d'une force invisible, comme pour m'inviter à avancer. Pourtant, rien n'indique ce qui se cache derrière elles. Mes yeux passent de l'une à l'autre, mon esprit s'emballe. Est-ce la fin du palais ? Ou le commencement de quelque chose de bien pire ?\n\nMon instinct me hurle de choisir avec prudence, mais quoi qu'il arrive, je sais qu'il n'y a plus de retour en arrière possible désormais. L'une de ces portes détient ma voie à suivre — ou ma perte."
 gogossos_expedition.1005.a:0 "Porte Pourpre"
 gogossos_expedition.1005.b:0 "Porte Blanche"
 gogossos_expedition.1005.c:0 "Porte Rouge"
 gogossos_expedition.1005.d:0 "Porte Noire"
 gogossos_expedition.1005.z:0 "Je ne veux plus faire cela..."

 gogossos_expedition.1008:0 "Les Couloirs Sombres se Poursuivent Sans Fin !"
 gogossos_expedition.1008_t:0 "Les Couloirs Sombres se Poursuivent Sans Fin !"
 gogossos_expedition.1008_desc:0 "J'y suis parvenu. D'une manière ou d'une autre, j'ai franchi le piège affolant de la salle des portes, et me voici à présent plus profond encore dans les entrailles tordues du palais. Mon souffle est haletant, mon cœur battant la chamade tandis que je prends un instant pour me stabiliser. L'air ici semble plus lourd, plus froid, comme s'il pesait sur moi, et la faible lueur des cristaux persiste encore, me guidant plus avant.\n\nDevant moi s'étend un long couloir, impossiblement long, son extrémité engloutie par les ombres. Les murs sont taillés dans la même pierre antique que le reste du palais, mais ici ils sont ornés de runes faiblement luisantes — des motifs d'un langage oublié qui pulsent doucement comme si elles étaient vivantes. Le couloir semble vibrer d'une énergie inquiétante, une étrange vibration que je peux sentir dans mes os.\n\nLe sol sous moi est humide, glissant de condensation, et chaque pas que je fais envoie un écho le long du couloir qui me revient comme un murmure. On dirait que le lieu observe, écoute, attend.\n\nQuelque chose de troublant émane de ce couloir — quelque chose qui hérisse les cheveux sur ma nuque. L'air se refroidit à chaque pas, et un étrange bourdonnement sourd commence à emplir le silence. Il est distant d'abord, mais plus j'avance, plus il s'intensifie, comme le son d'un battement de cœur lointain, profond et résonnant.\n\nLe couloir semble sans fin, les ombres devant refusant de céder à la lumière. Chaque instinct me dit de rebrousser chemin, de trouver une autre voie, mais je sais qu'il n'y a plus de retour en arrière possible désormais. Quoi que ce soit qui se trouve au bout de ce couloir, je dois l'affronter. Mes doigts se resserrent sur la garde de mon arme tandis que je poursuis, chaque pas m'enfonçant davantage dans l'inconnu."
 gogossos_expedition.1008.a:0 "Au moins ce ne sont pas les backrooms..."

 gogossos_expedition.1009:0 "Le Mage !"
 gogossos_expedition.1009_t:0 "Le Mage !"
 gogossos_expedition.1009_desc:0 "Enfin, le couloir se termine. Devant moi, une vieille porte de bois gît fracassée sur le sol, ses restes éclatés éparpillés comme les vestiges d'une barrière depuis longtemps oubliée. Au-delà du cadre brisé se trouve une pièce telle que je n'en ai jamais rencontré dans ce palais — les quartiers d'un mage, épargnés par le temps mais lourds du poids de l'abandon.\n\nLa pièce est un chaos magistral, ses murs bordés d'imposantes étagères débordant de tomes antiques, de parchemins et de fragments de manuscrits. L'air est chargé de l'odeur ténue du vieux papier et de la senteur âcre d'expériences alchimiques depuis longtemps dormantes. Des fioles de verre, certaines fêlées et d'autres encore intactes, encombrent les tables, remplies de liquides qui scintillent faiblement sous la pâle lumière des cristaux au-dessus. D'étranges dispositifs, dont le but m'échappe, reposent à leurs côtés, leurs cadres de laiton et d'argent ternis mais étrangement complexes.\n\nMais c'est la table au fond de la pièce qui attire mon attention. Là, affaissé sur sa surface, gît un squelette drapé dans une robe à capuche en lambeaux. Les os sont jaunis par l'âge, et pourtant il y a quelque chose d'étrangement délibéré dans sa position. C'est comme si le mage — si c'est bien ce qu'il était — savait que la fin venait et avait choisi ce lieu comme sa dernière demeure.\n\nDevant le squelette, éparpillés sur la table, gît un ensemble d'objets. Un journal poussiéreux relié de cuir, sa couverture fissurée mais intacte, repose au centre. L'air autour de lui semble lourd, comme s'il renfermait des secrets destinés à rester ensevelis. À côté du journal, luisant même dans la faible lumière, se trouvent plusieurs lingots d'or, leurs arêtes usées mais leur valeur indéniable.\n\nJe m'approche, mon souffle superficiel tandis que je contemple tout cela. Le journal semble presque m'appeler, sa présence commandant mon attention bien plus que l'or ne le pourrait jamais. Mes doigts hésitent au-dessus de sa couverture. Cette pièce semble receler des réponses — ou peut-être davantage de questions.\n\nQui était ce mage ? Que lui est-il arrivé ? Et pourquoi ai-je le sentiment d'être tombé sur quelque chose qui n'était jamais destiné à être trouvé ?"

 gogossos_expedition.1009.b:0 "Que dit le journal ?"

 gogossos_expedition.1210:0 "Le Rêve d'Une Vie..."
 gogossos_expedition.1210_t:0 "Le Rêve d'Une Vie....."
 gogossos_expedition.1210_desc:0 "Je saisis le journal de mes mains tremblantes, chassant la fine couche de poussière qui s'était déposée dessus. Mes doigts suivent la couverture de cuir fissurée tandis que je feuillette ses pages fragiles, l'encre fanée mais encore lisible. Je parcours rapidement la dernière entrée, attiré par les dernières pensées du mage mort depuis longtemps.\n\nLes mots me glacent jusqu'aux os. Il écrivit ses dernières heures, comment la Peste du Sang Gogossite s'était emparée de son corps, le ravageant de l'intérieur. Ses descriptions sont vives et hantées — de la fièvre, des saignements, et de la faiblesse qui l'a consumé, lui volant la force de poursuivre son œuvre. Il déplorait ses expériences inachevées, son potentiel gâché, et l'héritage qu'il ne laisserait jamais derrière lui. Son désespoir suinte de la page, chaque mot un douloureux rappel de la cruauté et de la finalité de sa fin.\n\nMais avant que je ne puisse approfondir, la pièce se mit à trembler. Un grondement sourd, comme le grognement d'une bête qui s'éveille, vibra à travers les murs de pierre. La poussière tombe en épais nuages depuis le plafond, et la faible lumière des cristaux se met à vaciller follement. Je lève les yeux tandis que de petites pierres commencent à tomber, suivies des craquements gémissants du plafond cédant sous une pression invisible. La pièce s'effondre.\n\nLa panique inonde mes veines. Je repousse le journal sur la table — il est trop lourd, trop fragile à emporter — et saisis plutôt les lingots d'or luisants. Mon instinct me hurle de fuir, d'échapper avant d'être enseveli vivant aux côtés de la dépouille du mage.\n\nJe me rue vers la porte — ou ce qu'il en reste — mais alors même que j'atteins le seuil, l'écriture runique gravée dans le sol s'embrase. Les symboles luisants pulsent d'une intensité aveuglante, emplissant la pièce d'un éclat surnaturel. Le son de la pièce qui s'effondre est noyé par un bourdonnement aigu, presque assourdissant, et avant que je ne puisse comprendre ce qui se passe, ma vision est engloutie par une lumière blanche.\n\nQuand la lumière s'estompe, je ne suis plus dans le palais.\n\nJe me tiens sur une plage. Le sable tiède se dérobe sous mes pieds, le bruit des vagues s'écrasant contre le rivage emplissant mes oreilles. La senteur saline de l'air marin est un contraste impossible avec l'atmosphère froide et décrépite que je viens de quitter. Mon cœur s'emballe tandis que je pivote, tentant de comprendre ce qui vient de se produire. Le palais, la pièce qui s'effondre, le mage — tout a disparu, remplacé par l'horizon infini de l'océan et du ciel.\n\nJe serre les lingots d'or fermement, mon souffle encore haletant du chaos, mon esprit assailli de questions. Comment suis-je ici ? Pourquoi les runes m'ont-elles téléporté en ce lieu ? Était-ce un dispositif de secours laissé par le mage, ou une force invisible intervenant ?\n\nLa seule certitude est que j'ai échappé — pour l'instant. Mais cette plage... elle semble trop paisible, trop parfaite. Et au fond de moi, je savais que tout cela était bien réel."
 gogossos_expedition.1210.b:0 "Rentrons... simplement chez nous..."
 gogossos_expedition.1210.b.outcome:0 "Vous concluez votre expédition à Gogossos."
 ambush.1:0 "AAAAAAAAAH !!!!"

 gogossos_expedition.1100:0 "La Chambre du Dragon"
 gogossos_expedition.1100_t:0 "La Chambre du Dragon"
 gogossos_expedition.1100_desc:0 "Tandis que je descends dans le sous-sol, un frisson me parcourt l'échine. L'air est chargé de poussière et de la senteur de quelque chose d'ancien — quelque chose depuis longtemps oublié. Mes pas résonnent dans la faible lumière, mais alors je m'arrête net, figé sur place.\n\nDevant moi, se dressant dans les ombres, se trouve un dragon. Un dragon réel, vivant. Sa forme massive est lovée dans l'obscurité, ses écailles scintillant faiblement même dans les ténèbres. Mon souffle se coupe dans ma gorge. Cela ne devrait pas être possible. Les Lords dragons d'antan se sont depuis longtemps évanouis dans la légende — comment l'une de leurs bêtes pourrait-elle encore exister ici, cachée sous ce lieu ?\n\nUn mélange d'émerveillement et de terreur me saisit, mais parmi la peur, une autre pensée s'installe. Il y a bien plus à ce lieu que je ne l'aurais jamais imaginé. Des secrets ensevelis sous des siècles, des mystères attendant d'être dévoilés.\n\nMais je ne suis pas venu jusqu'ici pour repartir les mains vides. Si ce dragon a été préservé ici si longtemps, il doit y avoir quelque chose de grande valeur caché entre ces murs. Et j'entends bien réclamer ma récompense"

 gogossos_expedition.1100.a:0 "Je terrasserai cette bête et réclamerai mon prix !"
 gogossos_expedition.1100.b:0 "Je suis du sang du dragon ! Tu t'inclineras devant moi !"
 gogossos_expedition.1100.b.outcome:0 "Vous tentez de dompter le dragon. Quelle que soit l'issue, votre expédition à Gogossos s'achève ici."

 gogossos_expedition.1101:0 "Le Champion"
 gogossos_expedition.1101_t:0 "Le Champion"
 gogossos_expedition.1101_desc:0 "La bataille fut féroce, chaque instant une épreuve de volonté et d'endurance. Le dragon rugit, son souffle ardent embrasant l'air, mais j'avais déjà appris à lire ses mouvements. À chaque frappe tonitruante de ses griffes, je dansais entre la mort et la survie, ma lame trouvant des ouvertures là où les écailles s'écartaient juste assez. Il se jeta en avant, et je roulai sous lui, enfonçant mon arme profondément dans son ventre exposé. Un cri strident assourdissant déchira la chambre tandis que la bête se débattait, sa queue massive brisant la pierre dans son ultime lutte désespérée.\n\nDans un dernier sursaut de force, je grimpai sur son dos, m'agrippant aux crêtes de son échine tandis que j'enfonçais mon épée à la base de son crâne. Le dragon poussa un dernier souffle frémissant avant de s'effondrer, son corps immense ébranlant le sol en tombant. Je me tenais au-dessus de lui, la poitrine haletante, sang et suie collant à ma peau. La créature jadis puissante gisait immobile, son règne depuis longtemps oublié enfin achevé.\n\nLe silence qui suivit était pesant, mais je ne ressentais nul regret. J'avais terrassé une légende — et à présent, les dépouilles de son antique repaire étaient miennes à réclamer."

 gogossos_expedition.1101.a:0 "Qu'est-ce donc que ceci ?"

 gogossos_expedition.1102:0 "L'Épreuve du Sang"
 gogossos_expedition.1102_t:0 "L'Épreuve du Sang"
 gogossos_expedition.1102_desc:0 "Ayant terrassé le dragon et réclamé son trésor, je tournai mon regard vers l'extrémité de la chambre, où quelque chose de bien plus sinistre m'attendait. Une porte massive, forgée dans l'acier noirci, se dressait devant moi. Tordue et déchiquetée, sa surface portait l'image d'un visage grimaçant, figé dans une expression éternelle, sa gueule béante assez large pour engloutir un homme tout entier.\n\nDevant la porte se dressait un pilier de pierre, antique et érodé, sur lequel reposait un simple bol. Il paraissait insignifiant au premier regard, hormis les étranges runes gravées le long de son rebord — des symboles qui semblaient se tordre et frémir sous mon regard. À l'intérieur du bol, une dague rouillée gisait immobile, son tranchant jadis aiguisé émoussé par le temps et la décrépitude.\n\nTandis que je m'approchais, un frisson me parcourut l'échine. Des murmures — doux, insidieux — effleuraient mon esprit comme des doigts glacés. Ils m'appelaient, murmurant des mots que je ne pouvais comprendre et pourtant ressentais d'une certaine manière dans mes os. Ils me tiraient, m'exhortant à avancer, me poussant à saisir la dague.\n\nL'offrande qu'elle exigeait était claire. Du sang. Le mien. Les runes palpitaient faiblement comme si elles sentaient mon hésitation, les murmures se faisant impatients. Quoi que ce soit qui se trouve au-delà de cette porte ne se révélerait pas sans sacrifice."

 gogossos_expedition.1102.a:0 "Une petite offrande vaut mieux"
 gogossos_expedition.1102.b:0 "Seule une grande offrande suffira"
 gogossos_expedition.1102.c:0 "Je ne crois pas que ce soit sage. Je vais laisser cela tranquille"
 gogossos_expedition.1102.c.outcome:0 "Vous concluez votre expédition à Gogossos."

 gogossos_expedition.2001:0 "Quel Idiot Vous Faites !"
 gogossos_expedition.2001_t:0 "Quel Idiot Vous Faites"
 gogossos_expedition.2001_desc:0 "Le couteau, bien que d'apparence émoussée et usée, fendit ma peau comme du beurre. Il n'y eut nulle résistance, nulle douleur — seulement l'aisance troublante avec laquelle il tailla la chair. Le sang jaillit aussitôt, s'écoulant en épais filets écarlates dans le bol qui attendait. Les runes bordant son rebord s'embrasèrent d'une lueur maladive, comme s'abreuvant profondément de mon offrande.\n\nPuis, la porte gémit. Un son lent et grinçant, du métal raclant contre la pierre. Le visage tordu qui y était gravé sembla se déformer, son expression jadis grimaçante se recourbant en quelque chose de bien pire — un sourire. Un sourire profond, entendu. Une vague de vertige me submergea. Ma vision se brouilla, s'assombrissant sur les bords. Je vacillai sur mes jambes, luttant pour rester debout, mais mes membres semblaient impossiblement lourds. Pourtant, je le vis — la porte s'ouvrait. Ce qui se trouvait au-delà était à ma portée. Je me forçai à avancer, ordonnant à mon corps de bouger. Mais alors je tombai. Un effondrement brutal et implacable sur le sol de pierre froid. La panique déferla en moi tandis que je tentais de me relever, mais ma force avait disparu. La dague glissa de mes doigts, tombant inutilement à mes côtés. Et alors, la véritable horreur s'installa.\n\nLa douleur. Elle commença comme une sensation lente et rampante sous ma peau, puis s'épanouit en agonie. Ma chair picotait, puis brûlait, puis se flétrissait. Je haletai, mais nul souffle ne vint. Mes veines noircirent, ma peau se fissura et se pela, se détachant en couches nauséabondes. Le sang ne s'écoulait plus seulement de ma main — il jaillissait de partout. Mon corps se défaisait, pourrissant sous mes propres yeux. Je tentai de crier, mais ma gorge s'effondra sur elle-même, ma voix volée par la force même que j'avais cherché à réveiller. La dernière chose que je vis avant que les ténèbres ne m'emportent fut la porte, grande ouverte. Et au-delà — des ombres, se mouvant et observant.\n\nPuis, plus rien."
 gogossos_expedition.2001.dumbass:0 "..."

 gogossos_expedition.2002:0 "Le Coffre des Vœux"
 gogossos_expedition.2002_t:0 "Le Coffre des Vœux"
 gogossos_expedition.2002_desc:0 "Le couteau, bien que d'apparence émoussée et usée, fendit ma peau comme du beurre. Il n'y eut nulle résistance, nulle douleur — seulement l'aisance troublante avec laquelle il tailla la chair. Le sang jaillit aussitôt, s'écoulant en épais filets écarlates dans le bol qui attendait. Les runes bordant son rebord s'embrasèrent d'une lueur maladive, comme s'abreuvant profondément de mon offrande.\n\nPuis, la porte gémit. Un son lent et grinçant, du métal raclant contre la pierre. Le visage tordu qui y était gravé sembla se déformer, son expression jadis grimaçante se recourbant en quelque chose de bien pire — un sourire. Un sourire profond, entendu.\n\nMais alors, quelque chose d'inattendu se produisit. Une sensation de picotement aigu parcourut ma paume, et lorsque je baissai les yeux, la blessure avait disparu. Ma peau s'était refermée d'elle-même, l'offrande de sang acceptée, mais ne laissant nulle trace de mal. Mon souffle était incertain tandis que j'avançais, franchissant le seuil de la porte désormais ouverte, vers la chambre au-delà.\n\nLe Coffre des Vœux.\n\nMes yeux s'écarquillèrent tandis que je contemplais la vue devant moi — des artefacts dorés empilés haut, des coupes serties de joyaux luisant dans la faible lumière des torches, des gemmes éparpillées comme de simples cailloux sur le sol. Une richesse au-delà de toute imagination, intacte depuis des siècles. Voici le véritable trésor, le magot que le dragon gardait, le prix caché au-delà de sa forme monstrueuse.\n\nMais parmi les richesses scintillantes, un objet attira mon regard par-dessus tous les autres. Reposant au sommet d'un piédestal, baigné d'une lueur éthérée, se trouvait l'artefact que je cherchais. La raison pour laquelle j'étais venu si loin. Mon cœur battait la chamade tandis que je m'approchais, le poids de mon voyage culminant en cet unique instant tant attendu"
 gogossos_expedition.2002.a:0 "C'est magnifique..."
 gogossos_expedition.2002.a.outcome:0 "Vous concluez votre expédition à Gogossos."

 evil_death_events.1:0 "Je n'en peux plus..."
 evil_death_events.1_t:0 "Je n'en peux plus..."
 evil_death_events.1_desc:0 "Les quatre portes se dressent devant moi — pourpre, rouge, blanche et noire. Je les ai toutes essayées, franchissant chacune à tour de rôle, seulement pour être ramené de force dans cette même pièce maudite. Quel que soit le chemin que j'emprunte, quel que soit le nombre de fois où je choisis, je finis toujours ici. Une boucle tordue, une prison sans murs.\n\nJe serre les poings, mon souffle haletant tandis que la frustration me griffe. Je ne peux plus continuer ainsi. Le cycle sans fin, la répétition suffocante — cela me brise. Mais je refuse de laisser la folie s'emparer de moi. Je refuse de mourir de faim, de me flétrir en ce lieu, attendant une échappatoire qui n'existe pas.\n\nSi ceci est tout ce qu'il reste, alors j'y mettrai fin selon mes propres termes"

 sewingside.1:0 "Je dégaine mon épée, une dernière fois..."
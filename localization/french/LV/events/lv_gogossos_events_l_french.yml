l_french:
  funding_expedition.0001:0 "Financer une expédition"
  fund_expedition_0001_t:0 "Financer une expédition"
  fund_expedition_0001_desc:0 "J’ai décidé de partir en expédition pour obtenir des cartes des régions cartographiées autour des Îles du Basilic et planifier les provisions nécessaires. Il me faut maintenant choisir une destination. Entre Gogossos et Sothoryos, le premier est l’option la plus sûre mais offre moins de chance de trouver des trésors. Je pourrais emprunter la route plus périlleuse vers Sothoryos, dont les terres presque intactes regorgent sans doute de richesses mais aussi de dangers bien plus grands"
  funding_expedition.0001.a:0 "Je devrais me rendre à Gogossos"
  funding_expedition.0001.b:0 "Je devrais me rendre à Sothoryos (non fonctionnel, en cours)"
  funding_expedition.0001.z:0 "Annuler"

  gogossos_expedition.0001:0 "Qu’ai-je trouvé ?"
  gogossos_expedition_0001_t:0 "Qu’ai-je trouvé ?"
  gogossos_expedition_0001_desc:0 "Après avoir marché des jours dans une jungle épaisse et la boue, nous avons enfin découvert les premiers vestiges d’une civilisation ; il semble s’agir d’un grand bâtiment de pierre envahi par la végétation, dont on devine la forme d’une porte à travers les broussailles"
  gogossos_expedition.0001.a:0 "Que trouvons-nous ici ?"
  gogossos_expedition.0001.a.outcome:0 "Vous engagez un duel avec cette… #emphasis chose#!"
  gogossos_expedition.0001.b:0 "Je pense qu’il est temps de partir…"
  gogossos_expedition.0001.b.outcome:0 "Vous quittez la jungle et retournez chez vous"

  gogossos_expedition.0002:0 "Pas ces maudits puzzles de piliers"
  gogossos_expedition_0002_t:0 "Pas ces maudits puzzles de piliers"
  gogossos_expedition_0002_desc:0 "Après être passé par l’entrée, j’ai avancé dans la ruine qui est étonnamment bien conservée. Elle mène à une chambre fermée par une grande porte d’acier entourée de trois piliers rotatifs ornés de figures représentant respectivement un chien, un aigle, un loup et un corbeau. Au centre de la pièce se trouve un levier.\n\nUn mural au‑dessus de la porte porte ces mots :\n\n#emphasis Près d’un arbre au bord d’une rivière se trouve un trou dans le sol\nCinq loups affrontent sept chiens tandis que deux corbeaux tournent en rond\nSix chiens périssent en tuant les cinq loups dans le voile de la nuit\nTandis qu’un corbeau est tué par un aigle dans un combat terrible#!\n\nSous chaque section du mural apparaît ce texte :\n\n#emphasis J’ai le temps de tuer, regards sournois dans les couloirs\nSans ton plan\nUn merle chante sur la colline bleue\nGrâce à l’appel de l’Enfant du Sage Sauvage#!"

  gogossos_expedition.0002.a:0 "Allons-y…"
  gogossos_expedition.0002.a.outcome:0 "Vous actionnez le levier"

  pillar_mural_turn:0 "Vous faites tourner le pilier"
  pillar_mural_one:0 "Pilier Un : $pillar_mural_one_dog$$pillar_mural_one_wolf$$pillar_mural_one_crow$$pillar_mural_one_eagle$"

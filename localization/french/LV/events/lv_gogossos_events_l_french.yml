l_french:
 funding_expedition.0001:0 "Financer une Expédition"
 fund_expedition_0001_t:0 "Financer une Expédition"
 fund_expedition_0001_desc:0 "J'ai décidé de partir en expédition, obtenant les cartes nécessaires des régions répertoriées autour des Îles du Basilic et prévoyant les provisions dont j'aurai besoin. Il me faut à présent choisir une destination. Entre Gogossos et Sothoryos, la première est l'option la plus sûre, bien que bien moins susceptible de livrer des richesses. Je pourrais emprunter le chemin plus périlleux et me diriger vers Sothoryos, dont les terres presque intactes regorgent sans doute de trésors, mais grouillent de dangers plus grands encore dans leurs profondeurs."
 funding_expedition.0001.a:0 "Je devrais me rendre à Gogossos"
 funding_expedition.0001.b:0 "Je devrais me rendre à Sothoryos (Ne fonctionne pas encore - WIP)"
 funding_expedition.0001.z:0 "Laissez tomber"

 gogossos_expedition.0001:0 "Qu'ai-je Trouvé ?"
 gogossos_expedition_0001_t:0 "Qu'ai-je Trouvé ?"
 gogossos_expedition_0001_desc:0 "Ayant marché des jours durant à travers jungle épaisse et boue, nous avons enfin trouvé nos premiers vestiges de civilisation. Il semble s'agir d'un vaste édifice de pierre envahi par la végétation, bien que je puisse distinguer la forme d'une porte à travers tous ces fourrés."
 gogossos_expedition.0001.a:0 "Qu'avons-nous là ?"
 gogossos_expedition.0001.a.outcome:0 "Vous entamez un duel avec cette... #emphasis chose#!"
 gogossos_expedition.0001.b:0 "Je crois qu'il est temps de partir..."
 gogossos_expedition.0001.b.outcome:0 "Vous sortez de la jungle et rentrez chez vous."

 gogossos_expedition.0002:0 "Pas ces Maudites Énigmes de Piliers"
 gogossos_expedition_0002_t:0 "Pas ces Maudites Énigmes de Piliers"
 gogossos_expedition_0002_desc:0 "Ayant franchi l'entrée, je me suis aventuré plus avant dans la ruine, la trouvant dans un état plutôt remarquable. La ruine mène à une chambre pourvue d'une grande porte d'acier entourée de 3 piliers, chacun tournant sur lui-même, portant sur chaque face des formes représentant un chien, un aigle, un loup-garou et un corbeau respectivement. Au centre de la pièce se trouve un unique levier.\n\nUne fresque orne le mur au-dessus de la porte. On y trouve gravés ces mots :\n\n#emphasis Près d'un arbre au bord d'un fleuve s'ouvre un trou dans le sol\nCinq loups-garous affrontent sept chiens, tandis que deux corbeaux tournoient et tournoient encore\nSix chiens périrent en tuant les cinq loups-garous dans le voile de la nuit\nTandis qu'un corbeau fut tué par un aigle dans un combat terrible#!\n\nSous chaque section de la fresque apparaît le texte suivant :\n\n#emphasis J'ai du temps à tuer, regards sournois dans les couloirs\nSans nul plan qui soit vôtre\nUn merle chante sur la Colline aux Geais Bleus\nGrâce à l'appel de l'Enfant du Sage Sauvage#!"

 gogossos_expedition.0002.a:0 "Advienne que pourra..."
 gogossos_expedition.0002.a.outcome:0 "Vous tirez le levier"

 pillar_mural_turn:0 "Vous tournez le pilier"

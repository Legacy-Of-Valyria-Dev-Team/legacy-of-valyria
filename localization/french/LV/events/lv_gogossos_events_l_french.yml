  pillar_mural_one_wolf:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_one').GetValue, '(CFixedPoint)1' ), 'Loup')]"
  pillar_mural_one_crow:0 "[AddTextIf(EqualTo_CFixedPoint( GetPlayer.MakeScope.Var('pillar_one').GetValue, '(CFixedPoint)2' ), 'Corbeau')]"

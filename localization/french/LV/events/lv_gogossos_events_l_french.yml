  gogossos_expedition.0003:0 "Je N'en Crois Pas Mes Yeux"
  gogossos_expedition.0003_t:0 "Tombeau du Seigneur-Dragon"
  gogossos_expedition.0003_desc:0 "En pénétrant dans le tombeau, je remarque qu'il s'agit d'une vaste salle carrée ornée de statues de chevaliers valyriens et de splendides fresques dépeignant l'Ancienne Valyria à son apogée.\n\nJe vois d'imposants monceaux d'or soigneusement empilés à côté du grand sarcophage au centre de la pièce, ainsi que des gemmes précieuses et des ornements d'or.\n\nEn poussant le couvercle du sarcophage, j'y trouve un squelette et..."
  gogossos_expedition.0003.a:0 "Qu'avons-nous là?"
  gogossos_expedition.0003.outcome:0 "Vous récupérez le trésor à l'intérieur et concluez votre expédition à Gogossos"

  gogossos_expedition.0003.a.outcome.egg:0 "Vous trouvez un œuf de dragon"
  gogossos_expedition.0003.a.outcome.blood:0 "Vous trouvez un parchemin de magie du sang"
  gogossos_expedition.0003.a.outcome.water:0 "Vous trouvez un parchemin de magie de l'eau"
  gogossos_expedition.0003.a.outcome.shadow:0 "Vous trouvez un parchemin de magie de l'ombre"

  gogossos_expedition.0004:0 "Je N'en Crois Pas Mes Yeux!"
  gogossos_expedition.0004_t:0 "Je N'en Crois Pas Mes Yeux!"
  gogossos_expedition.0004_desc:0 "Entrant dans le tombeau avec l'espoir de le piller de ses trésors, je m'arrête net dans mon élan. Figé de terreur, je lève les yeux et vois..."
  gogossos_expedition.0004.a:0 "UN DRAGON!"

  gogossos_expedition.00041:0 "Pas Ce Qu'il Semble?"
  gogossos_expedition.00041_t:0 "Pas Ce Qu'il Semble?"
  gogossos_expedition.00041_desc:0 "Par chance, il semble que le dragon soit mort depuis longtemps et ne soit plus qu'une carcasse en décomposition, mais ce sur quoi repose sa dépouille est bien réel... de l'or ! Le dragon mort couvait un immense trésor d'or, bien que le reste du tombeau semble profané. Toutes les œuvres d'art et les statues sont défigurées et endommagées au-delà de toute reconnaissance"
  gogossos_expedition.00041.a:0 "Espérons que cet or ne soit pas maudit comme celui de Thorin"
  gogossos_expedition.00041.outcome:0 "Vous concluez votre expédition à Gogossos"

  gogossos_expedition.00042:0 "Le Tueur de Dragon"
  gogossos_expedition.00042_t:0 "Le Tueur de Dragon"
  gogossos_expedition.00042_desc:0 "L'adrénaline pulse encore violemment dans tout mon corps. Durant un instant, rien ne semblait réel. Vous n'êtes pas sûr de ce qui s'est passé, mais une chose est certaine : ce dragon ne vous importunera plus. Vous avez terrassé un dragon et avez survécu pour le raconter"
  gogossos_expedition.00042.a:0 "Au moins ai-je obtenu de l'or pour mes peines!"
  gogossos_expedition.00042.outcome:0 "Vous concluez votre expédition à Gogossos"

  gogossos_expedition.0050:0 "Que Se Passe-t-il Donc?"
  gogossos_expedition.0050_t:0 "Que Se Passe-t-il Donc?"
  gogossos_expedition.0050_desc:0 "Après avoir traversé la Jungle durant quelques heures, j'ai découvert un campement où j'ai rencontré un petit nain attisant le feu. Il leva les yeux, nos regards se croisèrent, et il parla doucement avec un fort accent.\n\n"Et que penses-tu faire ici, [Select_CString( ROOT.Char.IsFemale, 'fillette', 'garçon' )]?" demanda le nain, ce à quoi je répondis que je souhaitais explorer les ruines de Gogossos à la recherche de trésors. Le nain caressa sa barbe, songeur.\n\nSoudain, il laissa échapper un rire sinistre et parla en Haut-Valyrien parfait. La magie emplissait les yeux du nain"
  gogossos_expedition.0050.a:0 "Je ne me sens pas très bien..."
  gogossos_expedition.0050.a.bear:0 "Votre expédition à Gogossos prend fin et vous rentrez chez vous, car vous êtes devenu un ours ridicule.\n#weak C'est une situation inours-table !#!"

  gogossos_expedition.0060:0 "La Bibliothèque"
  gogossos_expedition.0060_t:0 "La Bibliothèque"
  gogossos_expedition.0060_desc:0 "Il semble que je sois tombé sur une ancienne bibliothèque.\n\nJe peux voir des rangées et des rangées d'étagères, certaines garnies de livres, d'autres décrépites et tombant en morceaux. Je distingue une table au fond avec un squelette vêtu de robes en lambeaux, assis avec plusieurs livres étalés devant lui. Je peux tout juste déchiffrer les titres de chacun"
  gogossos_expedition.0060.outcome:0 "Vous concluez votre expédition à Gogossos"
  gogossos_expedition.0060.a:0 "Un livre sur les techniques martiales"
  gogossos_expedition.0060.b:0 "Un livre sur la philosophie"
  gogossos_expedition.0060.c:0 "Un livre intitulé #emphasis L'Art de la Diplomatie#!"
  gogossos_expedition.0060.d:0 "Un livre explorant l'intendance et la gouvernance"
  gogossos_expedition.0060.e:0 "Un livre intitulé #emphasis Le Prince#!"

  gogossos_expedition.0119:0 "Pirates à l'Horizon"
  gogossos_expedition.0119_t:0 "Pirates à l'Horizon"
  gogossos_expedition.0119_desc:0 "Ayant pris la mer il y a maintes journées en direction de notre aventure à Gogossos, nous avons aperçu un navire à l'horizon arborant un pavillon noir—généralement hissé par les pirates dans ces eaux.\n\nEspérons qu'ils ne nous repèrent point..."
  gogossos_expedition.0119.z:0 "Je hais les pirates..."

  gogossos_expedition.0110:0 "Nous Sommes Abordés!"
  gogossos_expedition.0110_t:0 "Nous Sommes Abordés!"
  gogossos_expedition.0110_desc:0 "Les pirates ont vite rattrapé notre navire et nous avons été abordés ! Leur capitaine et ses hommes bondissent sur le pont, leurs épées dégainées plus promptement que je ne l'avais prévu. Cela n'augure rien de bon..."
  gogossos_expedition.0110.a:0 "Cela n'augure rien de bon, en vérité..."
  gogossos_expedition.0110.a.outcome:0 "Vous vous rendez aux pirates"
  gogossos_expedition.0110.b:0 "Parez à virer, bande de singes maladroits ! Un jour pour mourir est un jour qui vaut d'être vécu!"
  gogossos_expedition.0110.b.outcome:0 "Vous engagez un duel avec le capitaine pirate"

  gogossos_expedition.0120:0 "Pirates Évités"
  gogossos_expedition.0120_t:0 "Pirates Évités"
  gogossos_expedition.0120_desc:0 "Il semblerait que les pirates ne nous aient point repérés, ou s'ils l'ont fait, n'étaient certainement pas intéressés par notre embarcation.\n\nNous avons accosté en toute sécurité. À partir d'ici, le véritable péril commence tandis que la jungle de Gogossos nous appelle"
  gogossos_expedition.120.a:0 "Continuons et voyons ce qu'il y a à découvrir"

  gogossos_expedition.0111:0 "Pas de Taille Face à Mon Acier"
  gogossos_expedition.0111_t:0 "Pas de Taille Face à Mon Acier"
  gogossos_expedition.0111_desc:0 "Le pirate n'était point de taille face à mon acier et [pirate_lord.GetSheHe|l] fut abattu. Les hommes restants du seigneur pirate s'enfuirent promptement, nous permettant de poursuivre notre voyage. Espérons que la navigation soit paisible à partir de maintenant"
  gogossos_expedition.0111.a:0 "Espérons qu'ils furent le dernier obstacle"
  gogossos_expedition.0111.a.outcome:0 "Votre expédition se poursuit"

  gogossos_expedition.0112:0 "Ma Fierté est Ternie"
  gogossos_expedition.0112_t:0 "Ma Fierté est Ternie"
  gogossos_expedition.0112_desc:0 "Le seigneur pirate était trop puissant et habile pour que je puisse le vaincre, et j'ai été battu et abattu. Bien que je vive encore, ma fierté est blessée, et je suis désormais à la merci des pirates"
  gogossos_expedition.0112.a:0 "Malédiction!"

  gogossos_expedition.1001:0 "L'Ascension"
  gogossos_expedition.1001_t:0 "L'Ascension"
  gogossos_expedition.1001_desc:0 "Ayant échoué sur la plage, nous prîmes un moment pour retrouver nos repères, examinant le paysage alentour. Les falaises imposantes nous encerclaient dans une prison naturelle, ne laissant qu'un seul chemin possible—vers le haut. Sans autre moyen d'explorer l'île, nous devons entamer notre ascension, escaladant les parois rocheuses qui se dressent au-dessus de nous, espérant trouver des réponses—ou peut-être même un trésor—au-delà de leurs hauteurs"
  gogossos_expedition.1001.a:0 "En avant et vers le haut!"
  gogossos_expedition.1001.b:0 "Volons, [my_dragon.GetNameNoTooltip]!"

  gogossos_expedition.1006:0 "La Descente Finale"
  gogossos_expedition.1006_t:0 "La Descente Finale"
  gogossos_expedition.1006_desc:0 "Mes doigts s'accrochaient à la roche friable, le cœur battant tandis que je me hissais plus haut. Le vent hurlait, mordant ma peau, mais je me forçai à continuer l'escalade. Encore un peu—puis la corniche sous mon pied céda. Durant un seul instant, déchirant les entrailles, je fus en apesanteur, mes bras cherchant à saisir le vide. Le monde tournoya tandis que je chutais, la plage en contrebas se précipitant à ma rencontre. Un halètement étranglé s'arracha de mes lèvres, non de peur, mais de réalisation—c'était la fin. Puis, le silence"
  gogossos_expedition.1006.a:0 "..."

  gogossos_expedition.1002:0 "Le Palais de Marbre"
  gogossos_expedition.1002_t:0 "Le Palais de Marbre"
  gogossos_expedition.1002_desc:0 "Tandis que je domine l'escarpement accidenté, je me débarrasse de la poussière et des débris qui s'accrochent à moi, exhalant tandis que le monde se déploie sous mon regard. La terre s'étend au loin, tapisserie à couper le souffle de roches déchiquetées, de jungle dense et de collines ondulantes baignées dans la lueur dorée du soleil mourant. La brume s'élève de la canopée en contrebas, tourbillonnant comme des vrilles fantomatiques entre les arbres anciens, leurs feuilles émeraude scintillant des vestiges de la chaleur du jour. Mais au-delà de la jungle, au-delà de la beauté sauvage et indomptée, mes yeux se fixent sur quelque chose de véritablement magnifique—un palais de pierre d'un blanc pur, se dressant majestueux et défiant au sommet d'une colline lointaine. Ses flèches imposantes percent le ciel, captant la dernière lumière du jour, resplendissant comme la citadelle de dieux oubliés.\n Un frisson me parcourt, une attraction indéniable, comme si le destin lui-même m'appelait. C'est là que doit se trouver le trésor—scellé dans des murs de marbre, voilé dans les échos d'empires perdus. Mais le temps joue contre moi. La jungle en contrebas sera périlleuse de nuit, ses ombres cachant des créatures inconnues, ses profondeurs vivantes de murmures de danger"

  gogossos_expedition.1007:0 "En route vers le palais!"

  gogossos_expedition.1003:0 "Le Palais Silencieux"
  gogossos_expedition.1003_t:0 "Le Palais Silencieux"
  gogossos_expedition.1003_desc:0 "En franchissant l'entrée majestueuse du palais, un étrange contraste se dévoile devant moi. De l'extérieur, ses murs d'un blanc éclatant et ses flèches imposantes demeurent intacts face au temps, majestueux et inflexibles. Mais à l'intérieur, la décrépitude a pris possession des lieux. Les salles jadis majestueuses s'effritent, leurs arches dorées fissurées et érodées. La poussière étouffe l'air, et l'odeur de pourriture s'attarde dans le silence stagnant. Des meubles brisés, depuis longtemps réduits à la ruine, gisent éparpillés sur les sols de pierre, leurs tissus autrefois riches réduits à de simples lambeaux du passé.\n\nJe cherche, m'enfonçant plus profondément dans les corridors abandonnés, mais je ne trouve rien—ni trésor, ni signe de vie, seulement les échos d'une époque oubliée. C'est comme si le palais lui-même n'était qu'une coquille vide, une carcasse de grandeur que le temps a depuis longtemps délaissée. Pourtant, alors même que le doute commence à s'insinuer, je tombe sur un escalier, s'enroulant vers le bas dans l'ombre.\n\nAttiré en avant, je descends dans le sous-sol, où les derniers rayons du soleil filtrent à travers d'intriqués miroirs de cristal, projetant des rayons miroitants d'or et de violet à travers la chambre. La lumière se pose sur quelque chose de stupéfiant—d'anciennes œuvres d'art valyriennes, gravées dans la pierre au-dessus de la grande porte devant moi. Les images racontent une histoire de pouvoir et de feu, de puissants Seigneurs-Dragons régnant sur les cieux, leurs grandes bêtes s'enroulant à travers des nuages de flammes. Leurs yeux, sculptés dans des gemmes précieuses, scintillent dans la lumière fragmentée, comme s'ils m'observaient, me jugeaient.\n Je m'attarde, captivé par l'art, par le simple poids de l'histoire qui pèse sur ce lieu. Mais alors une réalisation glaciale s'empare de moi—dans tout ce palais, je n'ai vu aucun signe des morts. Aucun squelette. Aucun reste de ceux qui appelaient jadis cet endroit leur foyer.\n Un lieu abandonné par le temps... mais apparemment intact face à la mort.\nUn frisson parcourt mon échine tandis que je m'approche de la grande porte, ma main planant au-dessus de sa surface froide. Quelque chose ne va pas ici. Et je suis sur le point de découvrir quoi"
  gogossos_expedition.1003.a:0 "Dans le sous-sol nous allons, je suppose"
  #palace.1:0 "La seule voie est vers le bas...."

  gogossos_expedition.1004:0 "La Fresque"
  gogossos_expedition.1004_t:0 "La Fresque"
  gogossos_expedition.1004_desc:0 "Tandis que je descends plus profondément dans les entrailles du palais, l'escalier en spirale semble sans fin, l'air devenant plus froid à chaque pas. Les ombres se tordent et se contractent le long des murs de pierre anciens, pourtant je continue, poussé par des parts égales de curiosité et d'inquiétude. Enfin, j'atteins le fond—une vaste chambre, impossiblement illuminée malgré les profondeurs. La lumière, douce et dorée, se déverse de sources invisibles, projetant une lueur surnaturelle sur les murs.\n\nMon souffle se coupe tandis que je contemple la vision devant moi, une autre fresque magnifique, son art inégalé, irradiant un sentiment d'admiration et de révérence. Celle-ci dépeint des dragons dans toute leur gloire majestueuse, chacun unique, chacun à couper le souffle dans sa splendeur.\n\nLe Puissant Dragon Pourpre, ses écailles scintillant comme de l'améthyste, déchaîne un torrent de feu, sa puissance inégalée.\n\nLe Dragon Blanc, rapide et féroce, semble presque flou en mouvement, sa silhouette élancée fendant les nuages comme une lame.\n Le Dragon Rouge, ses yeux brûlant de malveillance, se profile tel un tyran, sa présence commandant peur et effroi.\n\nEt enfin, le Dragon Noir—mystérieux, mythique, sa forme enveloppée d'une aura de sombre majesté, comme s'il existait entre ce monde et le suivant.\n\nJe n'ai qu'un instant pour m'émerveiller de la beauté de la fresque, mes doigts traçant le bord des sculptures complexes. Puis, le son survient. Un gémissement bas et familier de pierre ancienne qui se déplace. Mon cœur se serre dans ma poitrine, et un frisson parcourt mon échine tandis que le bruit s'amplifie, plus violent. Je me retourne brusquement, les yeux écarquillés d'alarme, juste au moment où le sol sous mes pieds cède.\n Le monde bascule, et je suis en apesanteur, mon cri se coinçant dans ma gorge tandis que la pierre s'effrite dans les ténèbres. Mon esprit a à peine le temps d'enregistrer la terreur avant que je ne plonge dans l'inconnu en dessous, la faible lueur de la fresque s'évanouissant tandis que je tombe"
  gogossos_expedition.1004.a:0 "Oh non..."

  # evil_death_events.1:0 "Je Ne Peux Plus le Supporter..."
  # evil_death_events.1_t:0 "Je Ne Peux Plus le Supporter..."
  # evil_death_events.1_desc:0 "Je ne peux plus le supporter. Ces quatre portes se dressent devant moi, chacune pulsant d'une énergie invisible, mais aucune n'offrant une issue. Pourpre, Blanche, Rouge, Noire—peu importe combien de temps je les fixe, peu importe combien je cherche des réponses dans leurs dessins complexes, elles demeurent une énigme. Il n'y a point d'échappatoire, point de sortie de ce lieu misérable. Juste la pierre froide et inflexible, la lueur inquiétante des cristaux et le silence oppressant qui semble s'étendre jusqu'à l'éternité.\n\nJe suis condamné à dépérir ici, piégé dans ce cauchemar sans fin, avec rien d'autre que ces portes maudites et mon propre désespoir grandissant pour compagnie. Ma force me fait déjà défaut, mon corps s'affaiblissant à chaque instant qui passe. Je peux sentir le vide qui s'insinue, mon esprit grattant aux limites de la raison.\n\nMais je ne laisserai pas cela se terminer ainsi. Je refuse de me flétrir en une coquille vide, de devenir l'ombre de moi-même, oublié et consumé par cet endroit. Si ceci doit être ma fin, ce sera selon mes conditions, de ma propre main. Je ne laisserai point le déshonneur me prendre, ni l'étreinte lente et cruelle de la famine.\n\nJe jette un dernier regard aux portes, leur présence silencieuse se moquant de moi, et je me prépare à ce qui doit être fait. Mieux vaut affronter l'inconnu que de laisser ce palais maudit me dépouiller de tout ce que je suis. Mieux vaut partir avec la défiance au cœur que de laisser les ténèbres me réclamer morceau par morceau"
  # sewingside.1:0 "Je dégaine mon épée une dernière fois..."

  gogossos_expedition.1005:0 "L'Empourium des Portes de l'Ours"
  gogossos_expedition.1005_t:0 "L'Empourium des Portes de l'Ours"
  gogossos_expedition.1005_desc:0 "Tandis que je me tiens dans la lueur inquiétante des cristaux, la chambre s'étend devant moi, vaste et vide, hormis quatre portes qui dominent son mur du fond. Chaque porte est massive et sculptée de motifs complexes, leurs détails illuminés par la lumière miroitante des cristaux au-dessus. Mon cœur bat la chamade tandis que je fais un pas en avant, attiré par leur présence menaçante.\n\nLes portes sont différentes de tout ce que j'ai vu auparavant, chacune irradiant sa propre aura distincte, comme imprégnée de pouvoir.\n\nLa Porte Pourpre brille comme de l'améthyste polie, sa surface animée de sculptures de flammes et de dragons serpentins entrelacés. Le feu qu'ils crachent semble presque se mouvoir lorsque la lumière le frappe juste comme il faut, et l'air autour vibre d'une énergie surnaturelle.\n\nLa Porte Blanche, en fort contraste, est élégante et lisse, comme de l'ivoire poli. Ses sculptures dépeignent un dragon en vol, sa forme élancée et gracieuse, les ailes déployées comme figé dans un mouvement éternel. La froide lumière des cristaux lui confère une lueur presque spectrale, comme si elle était intouchée par le temps.\n\nLa Porte Rouge est audacieuse et terrifiante. Sa surface est gravée de motifs chaotiques et déchiquetés, les lignes profondes et rugueuses, comme si elles avaient été brûlées dans le bois par le feu lui-même. Un dragon monstrueux aux yeux cruels et acérés est sculpté dans son cadre, sa présence irradiant la menace. Même se tenir près d'elle rend l'air lourd et oppressant.\n\nLa Porte Noire est la plus énigmatique. Elle semble absorber la lumière, sa surface lisse et sombre comme l'obsidienne. Des ombres semblent danser sur elle, se déplaçant et se tordant comme si elles avaient une vie propre. Les sculptures ici sont subtiles et difficiles à discerner, mais le dragon représenté semble surnaturel, presque incompréhensible—plus esprit que bête.\n\nChaque porte pulse faiblement d'une force invisible, comme si elle m'invitait à avancer. Pourtant, il n'y a aucune indication de ce qui se cache derrière elles. Mes yeux vacillent entre elles, mon esprit s'emballant. Est-ce la fin du palais ? Ou est-ce le début de quelque chose de bien pire ?\n\nMes instincts me hurlent de choisir prudemment, mais quoi qu'il arrive, je sais qu'il n'y a plus de retour possible maintenant. L'une de ces portes recèle mon chemin en avant—ou ma perte"
  gogossos_expedition.1005.a:0 "Porte Pourpre"
  gogossos_expedition.1005.b:0 "Porte Blanche"
  gogossos_expedition.1005.c:0 "Porte Rouge"
  gogossos_expedition.1005.d:0 "Porte Noire"
  gogossos_expedition.1005.z:0 "Je ne veux plus continuer..."

  gogossos_expedition.1008:0 "Les Sombres Couloirs Se Poursuivent Sans Fin!"
  gogossos_expedition.1008_t:0 "Les Sombres Couloirs Se Poursuivent Sans Fin!"
  gogossos_expedition.1008_desc:0 "J'y suis arrivé. D'une façon ou d'une autre, j'ai réussi à traverser le piège déroutant de la salle des portes, et maintenant je me tiens plus profondément dans les abysses tordus du palais. Mon souffle est saccadé, mon cœur battant dans ma poitrine tandis que je prends un moment pour me ressaisir. L'air ici semble plus lourd, plus froid, comme s'il m'écrasait, et la faible lueur des lumières cristallines subsiste encore, me guidant en avant.\n\nDevant moi s'étend un long corridor, impossiblement long, son extrémité engloutie par les ombres. Les murs sont taillés dans la même pierre ancienne que le reste du palais, mais ici ils sont tapissés de runes faiblement incandescentes—motifs d'un langage oublié qui pulsent doucement comme s'ils étaient vivants. Le corridor semble animé d'une énergie sinistre, une étrange vibration que je peux ressentir dans mes os.\n\nLe sol sous mes pieds est humide, glissant de condensation, et chaque pas que je fais envoie un écho dans le corridor qui me revient comme un murmure. On dirait que l'endroit observe, écoute, attend.\n\nIl y a quelque chose d'inquiétant dans ce couloir—quelque chose qui fait se dresser les cheveux sur ma nuque. L'air devient plus froid à chaque pas, et un étrange bourdonnement bas commence à remplir le silence. C'est distant au début, mais plus j'avance, plus il devient fort, comme le son d'un battement de cœur lointain, profond et résonnant.\n\nLe corridor semble interminable, les ombres devant refusant de céder à la lumière. Chaque instinct me dit de faire demi-tour, de trouver une autre voie, mais je sais qu'il n'y a point de retour possible maintenant. Quoi qui se trouve au bout de ce corridor, je dois l'affronter. Mes doigts se resserrent sur la garde de mon arme tandis que je continue d'avancer, chaque pas m'entraînant plus profondément dans l'inconnu"
  gogossos_expedition.1008.a:0 "Au moins ce ne sont pas les arrière-salles..."

  gogossos_expedition.1009:0 "Le Mage!"
  gogossos_expedition.1009_t:0 "Le Mage!"
  gogossos_expedition.1009_desc:0 "Enfin, le corridor prend fin. Devant moi, une vieille porte en bois gît brisée sur le sol, ses restes éparpillés comme les vestiges d'une barrière depuis longtemps oubliée. Au-delà du cadre brisé se trouve une pièce différente de tout ce que j'ai rencontré dans ce palais—les quartiers d'un mage, intacts face au temps mais lourds du poids de l'abandon.\n\nLa pièce est un chef-d'œuvre chaotique, ses murs bordés d'imposantes bibliothèques débordant de tomes anciens, de parchemins et de fragments de vélin. L'air est chargé de la faible odeur de papier vieilli et du relent âcre d'expériences alchimiques depuis longtemps inactives. Des fioles de verre, certaines fêlées et d'autres encore intactes, encombrent les tables, remplies de liquides qui miroitent faiblement sous la pâle lumière des cristaux au-dessus. D'étranges appareils, leur fonction insondable, reposent à leurs côtés, leurs armatures de laiton et d'argent ternies mais étrangement complexes.\n\nMais c'est la table au fond de la pièce qui attire mon attention. Là, affaissé sur sa surface, se trouve un squelette drapé dans une robe à capuche en lambeaux. Les os sont jaunis par l'âge, pourtant il y a quelque chose d'étrangement délibéré dans sa position. C'est comme si le mage—si c'est ce qu'il était—savait que la fin approchait et avait choisi cet endroit comme son dernier lieu de repos.\n\nDevant le squelette, éparpillée sur la table, se trouve une collection d'objets. Un journal poussiéreux relié de cuir, sa couverture craquelée mais intacte, repose au centre. L'air autour de lui semble lourd, comme s'il retenait des secrets destinés à rester enfouis. À côté du journal, brillant même dans la faible lumière, se trouvent plusieurs lingots d'or, leurs bords usés mais indéniables dans leur valeur.\n\nJe m'approche, souffle court tandis que j'absorbe tout cela. Le journal semble presque m'appeler, sa présence commandant mon attention bien plus que l'or ne le pourrait jamais. Mes doigts planent au-dessus de sa couverture, hésitants. Cette pièce semble contenir des réponses—ou peut-être plus de questions.\n\nQui était ce mage ? Que lui est-il arrivé ? Et pourquoi ai-je l'impression d'être tombé sur quelque chose qui n'était jamais destiné à être découvert?"

  gogossos_expedition.1009.b:0 "Que dit le journal?"

  gogossos_expedition.1210:0 "Le Rêve d'une Vie..."
  gogossos_expedition.1210_t:0 "Le Rêve D'une Vie....."
  gogossos_expedition.1210_desc:0 "Je saisis le journal de mes mains tremblantes, essuyant la fine couche de poussière qui s'y était déposée. Mes doigts tracent la couverture de cuir craquelée tandis que je feuillette ses pages fragiles, l'encre pâlie mais encore lisible. Je parcours rapidement la dernière entrée, attiré par les ultimes pensées du mage depuis longtemps disparu.\n\nLes mots me glacent jusqu'à la moelle. Il écrivait ses dernières heures, de comment la Peste Sanglante de Gogossos s'était emparée de son corps, le ravageant de l'intérieur. Ses descriptions sont vives et hantées—de la fièvre, des saignements et de la faiblesse qui le consumaient, lui volant la force de poursuivre son œuvre. Il se lamentait de ses expériences inachevées, de son potentiel gâché et de l'héritage qu'il ne laisserait jamais. Son désespoir suinte de la page, chaque mot un douloureux rappel de combien cruelle et définitive sa fin a dû être.\n\nMais avant que je ne puisse approfondir davantage, la pièce commença à trembler. Un grondement sourd, comme le grognement d'une bête qui s'éveille, vibre à travers les murs de pierre. La poussière tombe en épais nuages d'en haut, et la faible lumière des cristaux commence à vaciller follement. Je lève les yeux tandis que de petits cailloux commencent à tomber, suivis par les craquements gémissants du plafond se déplaçant sous une pression invisible. La pièce s'effondre.\n\nLa panique inonde mes veines. Je repousse le journal sur la table—il est trop lourd, trop fragile à porter—et saisis plutôt les lingots d'or brillants. Mes instincts me hurlent de courir, de m'échapper avant d'être enterré vivant aux côtés des restes du mage.\n\nJe me précipite vers la porte—ou ce qu'il en reste—mais juste au moment où j'atteins le seuil, les inscriptions runiques gravées dans le sol s'animent. Les symboles lumineux pulsent avec une intensité aveuglante, emplissant la pièce d'un éclat surnaturel. Le son de la pièce qui s'effondre est noyé par un bourdonnement aigu, presque assourdissant, et avant que je ne puisse comprendre ce qui se passe, ma vision est consumée par une lumière blanche.\n\nLorsque la lumière s'estompe, je ne suis plus dans le palais.\n\nJe me tiens sur une plage. Du sable chaud se déplace sous mes pieds, le son des vagues se brisant contre le rivage emplissant mes oreilles. Le goût salé de l'air marin contraste impossiblement avec l'atmosphère froide et déliquescente que je viens de quitter. Mon cœur s'emballe tandis que je me retourne vivement, tentant de comprendre ce qui vient de se produire. Le palais, la pièce qui s'effondre, le mage—tout a disparu, remplacé par l'horizon sans fin d'océan et de ciel.\n\nJe serre fermement les lingots d'or, mon souffle encore haletant du chaos, mon esprit bouillonnant de questions. Comment suis-je arrivé ici ? Pourquoi les runes m'ont-elles téléporté en ce lieu ? Était-ce une sécurité laissée par le mage, ou quelque force invisible intervenant ?\n\nLa seule certitude est que j'ai échappé—pour l'instant. Mais cette plage... elle semble trop paisible, trop parfaite. Et au fond de moi, je savais que tout cela était réel"
  gogossos_expedition.1210.b:0 "Rentrons... simplement chez nous..."
  gogossos_expedition.1210.b.outcome:0 "Vous concluez votre expédition à Gogossos"
  ambush.1:0 "AAAAAAAGHH!!!!"

  gogossos_expedition.1100:0 "La Chambre du Dragon"
  gogossos_expedition.1100_t:0 "La Chambre du Dragon"
  gogossos_expedition.1100_desc:0 "Tandis que je descends dans le sous-sol, un frisson parcourt mon échine. L'air est chargé de poussière et du parfum de quelque chose d'ancien—quelque chose depuis longtemps oublié. Mes pas résonnent dans la faible lumière, mais je m'arrête brusquement, figé sur place.\n\nDevant moi, se dressant dans les ombres, se trouve un dragon. Un vrai dragon vivant. Sa forme massive est lovée dans l'obscurité, ses écailles miroitant faiblement même dans la pénombre. Mon souffle se coince dans ma gorge. Cela ne devrait pas être possible. Les Seigneurs-Dragons d'autrefois ont depuis longtemps sombré dans la légende—comment l'une de leurs bêtes pourrait-elle encore exister ici, cachée sous cet endroit ?\n\nUn mélange d'admiration et de terreur m'étreint, mais au milieu de la peur, une autre pensée s'impose. Il y a plus dans cet endroit que je ne l'avais jamais imaginé. Des secrets enfouis sous des siècles, des mystères attendant d'être dévoilés.\n\nMais je ne suis pas venu jusqu'ici pour repartir les mains vides. Si ce dragon a été préservé ici si longtemps, il doit y avoir quelque chose de grande valeur caché entre ces murs. Et j'entends bien réclamer ma récompense"

  gogossos_expedition.1100.a:0 "Je vais occire cette bête et réclamer mon prix!"
  gogossos_expedition.1100.b:0 "Je suis du sang du dragon ! Tu vas t'incliner devant moi!"
  gogossos_expedition.1100.b.outcome:0 "Vous tentez de dompter le dragon. Quel que soit le résultat, votre expédition à Gogossos s'achève ici"

  gogossos_expedition.1101:0 "Le Champion"
  gogossos_expedition.1101_t:0 "Le Champion"
  gogossos_expedition.1101_desc:0 "La bataille fut féroce, chaque instant une épreuve de volonté et d'endurance. Le dragon rugit, son souffle ardent embrasant l'air, mais j'avais déjà appris à lire ses mouvements. À chaque coup tonnant de ses griffes, je dansais entre mort et survie, ma lame trouvant des ouvertures là où les écailles s'écartaient juste assez. Il bondit, et je roulai sous lui, enfonçant mon arme profondément dans son ventre exposé. Un cri assourdissant déchira la chambre tandis que la bête se débattait, sa queue massive fracassant la pierre dans sa lutte finale et désespérée.\n\nDans un dernier sursaut de force, je grimpai sur son dos, agrippant les crêtes de son échine tandis que j'enfonçais mon épée à la base de son crâne. Le dragon exhala un dernier souffle frémissant avant de s'effondrer, son corps énorme ébranlant le sol dans sa chute. Je me tins au-dessus de lui, la poitrine haletante, sang et suie collés à ma peau. La créature jadis puissante gisait immobile, son règne depuis longtemps oublié enfin achevé.\n\nLe silence qui suivit était pesant, mais je ne ressentais aucun regret. J'avais occis une légende—et désormais, les dépouilles de son antre ancestral m'appartenaient"

  gogossos_expedition.1101.a:0 "Qu'est-ce donc?"

  gogossos_expedition.1102:0 "L'Épreuve du Sang"
  gogossos_expedition.1102_t:0 "L'Épreuve du Sang"
  gogossos_expedition.1102_desc:0 "Ayant occis le dragon et revendiqué son trésor, je tournai mon regard vers l'extrémité de la chambre, où quelque chose de bien plus sinistre m'attendait. Une porte massive, forgée d'acier noirci, se dressait devant moi. Tordue et dentelée, sa surface portait l'image d'un visage grimaçant, figé dans une éternelle grimace, sa gueule béante assez large pour engloutir un homme entier.\n\nDevant la porte se tenait un pilier de pierre, ancien et érodé, sur lequel reposait un simple bol. Il était sans particularité à première vue, hormis les étranges runes gravées le long de son rebord—symboles qui semblaient se déplacer et se tordre sous mon regard. À l'intérieur du bol, une dague rouillée gisait immobile, son tranchant jadis acéré émoussé par le temps et la décrépitude.\n\nEn m'approchant, un frisson parcourut mon échine. Des murmures—doux, insidieux—effleurèrent mon esprit comme des doigts glacés. Ils m'appelaient, murmurant des mots que je ne pouvais comprendre mais que je ressentais jusqu'au plus profond de mes os. Ils me tiraient en avant, m'exhortant à saisir la dague.\n\nL'offrande qu'elle réclamait était claire. Du sang. Le mien. Les runes pulsaient faiblement comme si elles percevaient mon hésitation, les murmures devenant impatients. Quoi qui se trouvât au-delà de cette porte ne se révélerait point sans sacrifice"

  gogossos_expedition.1102.a:0 "Une modeste offrande suffira"
  gogossos_expedition.1102.b:0 "Seule une généreuse offrande conviendra"
  gogossos_expedition.1102.c:0 "Je ne crois pas que cela soit sage. Je vais m'en abstenir"
  gogossos_expedition.1102.c.outcome:0 "Vous concluez votre expédition à Gogossos"

  gogossos_expedition.2001:0 "Quel Crétin !"
  gogossos_expedition.2001_t:0 "Quel Crétin"
  gogossos_expedition.2001_desc:0 "La dague, bien qu'émoussée et usée en apparence, trancha ma peau comme du beurre. Nulle résistance, nulle douleur—seulement cette facilité troublante avec laquelle elle incisa ma chair. Le sang perla instantanément, s'écoulant en épais ruisseaux vermeils dans le bol qui attendait. Les runes qui en ornaient le rebord s'embrasèrent d'une lueur malsaine, comme si elles s'abreuvaient avidement de mon offrande.\n\nPuis, la porte gémit. Un son lent et grinçant, métal raclant contre pierre. Le visage tordu sculpté dessus parut se métamorphoser, son expression jadis grimaçante se muant en quelque chose de bien pire—un rictus. Un sourire profond et omniscient. Une vague d'étourdissement me submergea. Ma vision se brouilla, s'obscurcissant sur les bords. Je chancelai, luttant pour rester debout, mais mes membres semblaient d'une lourdeur impossible. Pourtant, je le vis—la porte s'ouvrait. Quoi qu'il y eût au-delà, cela se trouvait à ma portée. Je me forçai à avancer, intimant à mon corps de bouger. Mais je chutai. Un effondrement brutal et impitoyable sur le sol de pierre glacé. La panique me submergea tandis que j'essayais de me relever, mais ma force m'avait quitté. La dague glissa de mes doigts, cliquetant inutilement à mes côtés. Et alors, la véritable horreur s'installa.\n\nLa douleur. Elle commença comme une sensation lente et rampante sous ma peau, puis s'épanouit en agonie. Ma chair picota, puis brûla, puis se flétrit. Je haletai, mais aucun souffle ne vint. Mes veines noircirent, ma peau se craquela et se pela, tombant en lambeaux écœurants. Le sang ne coulait plus seulement de ma main—il jaillissait de partout. Mon corps se défaisait, pourrissant devant mes propres yeux. J'essayai de hurler, mais ma gorge s'effondra sur elle-même, ma voix dérobée par la force même que j'avais cherché à éveiller. La dernière chose que je vis avant que les ténèbres ne m'emportent fut la porte, grande ouverte. Et au-delà—des ombres, mouvantes et observatrices.\n\nPuis, le néant..."
  gogossos_expedition.2001.dumbass:0 "..."

  gogossos_expedition.2002:0 "Le Caveau des Souhaits"
  gogossos_expedition.2002_t:0 "Le Caveau des Souhaits"
  gogossos_expedition.2002_desc:0 "Le couteau, bien que paraissant émoussé et usé, trancha ma peau comme du beurre. Il n'y eut aucune résistance, aucune douleur—seulement l'inquiétante facilité avec laquelle il entailla la chair. Le sang jaillit instantanément, s'écoulant en épais ruisseaux cramoisies dans le bol qui attendait. Les runes bordant son rebord s'embrasèrent d'une lueur malsaine, comme si elles s'abreuvaient avidement de mon offrande.\n\nAlors, la porte gémit. Un son lent et grinçant, métal raclant contre pierre. Le visage tordu sculpté dessus semblait se déplacer, son expression autrefois grimaçante se transformant en quelque chose de bien pire—un rictus. Un rictus profond et sagace.\n\nMais alors, quelque chose d'inattendu se produisit. Une vive sensation de picotement parcourut ma paume, et lorsque je baissai les yeux, la blessure avait disparu. Ma peau s'était ressoudée, l'offrande de sang acceptée, mais ne laissant nulle trace de dommage. Mon souffle était saccadé tandis que j'avançais, franchissant le seuil de la porte désormais ouverte, pénétrant dans la chambre au-delà.\n\nLe Caveau des Souhaits.\n\nMes yeux s'écarquillèrent tandis que je contemplais le spectacle devant moi—artefacts d'or empilés, coupes ornées de joyaux scintillant dans la faible lueur des torches, gemmes éparpillées comme de simples cailloux sur le sol. Richesse au-delà de l'imaginable, intacte depuis des siècles. C'était là le véritable trésor, le butin que le dragon gardait, le prix caché derrière sa forme monstrueuse.\n\nMais parmi les richesses étincelantes, un objet attira mon regard par-dessus tout. Posé sur un piédestal, baigné d'une lueur éthérée, se trouvait l'artefact que je cherchais. La raison pour laquelle j'étais venu si loin. Mon cœur battait la chamade tandis que je m'approchais, le poids de mon voyage culminant en cet instant unique et tant attendu"
  gogossos_expedition.2002.a:0 "C'est magnifique..."
  gogossos_expedition.2002.a.outcome:0 "Vous concluez votre expédition à Gogossos"

  evil_death_events.1:0 "Je ne peux plus supporter..."
  evil_death_events.1_t:0 "Je ne peux plus supporter..."
  evil_death_events.1_desc:0 "Les quatre portes se dressent devant moi—pourpre, rouge, blanche et noire. Je les ai toutes essayées, franchissant chacune à son tour, pour n'être ramené qu'à cette même pièce maudite. Peu importe le chemin que je prends, peu importe combien de fois je choisis, je reviens toujours ici. Une boucle perverse, une prison sans murs.\n\nJe serre les poings, mon souffle haletant tandis que la frustration me consume. Je ne peux continuer ainsi. Le cycle sans fin, la répétition suffocante—cela me brise. Mais je refuse de laisser la folie s'emparer de moi. Je refuse de mourir de faim, de dépérir en ce lieu, attendant une évasion qui n'existe pas.\n\nSi c'est tout ce qu'il y a, alors j'y mettrai fin selon mes conditions"

  sewingside.1:0 "Je dégaine mon épée, une dernière fois..."
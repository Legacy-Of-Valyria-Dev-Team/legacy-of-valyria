l_french:
  funding_expedition.0001:0 "Financer une expédition"
  fund_expedition_0001_t:0 "Financer une expédition"
  fund_expedition_0001_desc:0 "J'ai décidé de partir en expédition, me procurant les cartes nécessaires des régions cartographiées autour des Îles du Basilic et planifiant les provisions dont j'aurai besoin. Maintenant, je dois choisir une destination. Entre Gogossos et Sothoryos, la première demeure l'option la plus sûre, bien que moins susceptible de révéler des richesses. Je pourrais emprunter la voie plus périlleuse vers Sothoryos, dont les terres majoritairement vierges regorgent sans doute de trésors, mais grouillent également de dangers bien plus grands dans leurs profondeurs."
  funding_expedition.0001.a:0 "Je devrais me diriger vers Gogossos."
  funding_expedition.0001.b:0 "Je devrais me diriger vers Sothoryos (Pas encore fonctionnel - En développement)"
  funding_expedition.0001.z:0 "Non, finalement."

  gogossos_expedition.0001:0 "Qu'ai-je découvert ?"
  gogossos_expedition_0001_t:0 "Qu'ai-je découvert ?"
  gogossos_expedition_0001_desc:0 "Après avoir marché pendant des jours à travers une jungle dense et boueuse, nous avons enfin trouvé les premiers vestiges de la civilisation. Il semble s'agir d'un grand bâtiment de pierre envahi par la végétation, bien que je puisse distinguer la forme d'une porte à travers toutes ces broussailles."
  gogossos_expedition.0001.a:0 "Qu'avons-nous là ?"
  gogossos_expedition.0001.a.outcome:0 "Vous engagez un duel avec cette... #emphasis chose#!"
  gogossos_expedition.0001.b:0 "Je crois qu'il est temps de partir..."
  gogossos_expedition.0001.b.outcome:0 "Vous quittez la jungle et rentrez chez vous."

  gogossos_expedition.0002:0 "Pas encore ces maudites énigmes de piliers"
  gogossos_expedition_0002_t:0 "Pas encore ces maudites énigmes de piliers"
  gogossos_expedition_0002_desc:0 "Ayant franchi l'entrée, j'ai pénétré plus avant dans la ruine, la trouvant dans un état remarquable. Le passage mène à une chambre avec une grande porte d'acier entourée de trois piliers, chacun comportant différents cylindres rotatifs avec des formes sur chaque face représentant respectivement un chien, un aigle, un loup géant et un corbeau. Au centre de la pièce se trouve un levier solitaire.\n\nUne fresque orne le mur au-dessus de la porte. Ces mots y sont gravés :\n\n#emphasis Près d'un arbre au bord d'une rivière, il y a un trou dans le sol\nCinq loups géants combattent sept chiens, tandis que deux corbeaux tournent en rond\nSix chiens sont morts en tuant les cinq loups géants dans le voile de la nuit\nTandis qu'un corbeau fut tué par un aigle dans un terrible combat#!\n\nSous chaque section de la fresque apparaît le texte suivant :\n\n#emphasis J'ai du temps à tuer, des regards furtifs dans les corridors\nSans un plan qui soit tien\nUn merle chante sur la colline des geais bleus\nGrâce à l'appel de l'Enfant du Sage Sauvage#!"

  gogossos_expedition.0002.a:0 "C'est maintenant ou jamais..."
  gogossos_expedition.0002.a.outcome:0 "Vous actionnez le levier."

  pillar_mural_turn:0 "Vous tournez le pilier"

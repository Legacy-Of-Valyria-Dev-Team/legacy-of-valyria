l_french:

  lv_travel_danger.0001.t:0 "Le brouillard vit"
  lv_travel_danger.0001.desc:0 "Le brouillard s'élève à l'horizon comme un mur - dense, immobile, et faux. Il attend. Tandis que votre navire pénètre, le brouillard engloutit tout : la mer, le ciel, le son du vent. Le monde derrière vous disparaît.\n\nL'air s'épaissit. Les voiles disparaissent dans le gris. Vous ne pouvez voir vos mains. Les voix de l'équipage résonnent étrangement, comme sous l'eau. Le navire gémit, mais même cela sonne lointain. Le temps se tord. Les minutes s'étirent. Des heures passent - ou point du tout.\n\nPuis un marin trébuche hors de la brume, pieds nus et tremblant. Sa peau est pâle. Ses cheveux ont blanchi.\n\n« J'ai trouvé le navire », marmonne-t-il. « Notre navire. Exactement comme celui-ci. Seulement... nous étions tous morts. Flottant. Fixant. Et je - je crois que je me suis vu me regarder en retour. »"
  lv_travel_danger.0001.a:0 "Le brouillard ment. Gardons le cap."
  lv_travel_danger.0001.a.tt.trait:0 "Chaque membre de votre entourage aura 50% de chances de gagner soit le [trait|E] [GetTrait('lunatic_1').GetName( GetNullCharacter )] ou [GetTrait('paranoid').GetName( GetNullCharacter )]"
  lv_travel_danger.0001.a.tt.opinion:0 "Chaque membre de votre entourage perd #N 30#! points d'[opinion|E] de #V vous#! #weak (M'a moqué dans mon heure de détresse)#!"
  lv_travel_danger.0001.b:0 "Faites demi-tour. Nous rentrons chez nous."
  lv_travel_danger.0001.b.tt.opinion:0 "Chaque membre de votre entourage gagne #P 20#! points d'[opinion|E] de #V vous#! pendant #V 10 ans#! #weak (S'est soucié de ma santé)#!"
  lv_travel_danger.0001.c:0 "Laissez-moi marcher dans le brouillard."
  lv_travel_danger.0001.c.tt:0 "Vous marchez dans le brouillard"
  lv_travel_danger.0001.c.tt.trait:0 "Vous sortez du brouillard, différent de ce que vous étiez auparavant"

  lv_travel_danger.0002.t:0 "Du sang sur le pont"
  lv_travel_danger.0002.desc:0 "Il y a du sang sur les planches. Un marin gît étalé dans la mort, un couteau encore planté dans [victim.GetHerHis] côtes. Un autre se tient au-dessus de [victim.GetHerHim], tremblant, le visage pâle et éclaboussé de rouge.\n\n« [victim.GetSheHe|U] n'était pas réel », marmonne l'assassin, les yeux écarquillés. « Le brouillard l'a envoyé. J'ai vu ce qu'[victim.GetSheHe] était vraiment. »\n\nL'équipage se rassemble dans un silence inquiet. Personne ne bouge. Personne ne parle. L'air pèse lourd de peur - et de la connaissance que la raison s'effiloche."
  lv_travel_danger.0002.a:0 "Exécutez-[killer.GetHerHim] sur-le-champ."
  lv_travel_danger.0002.b:0 "Jetez-[killer.GetHerHim] par-dessus bord."
  lv_travel_danger.0002.c:0 "Enfermez-[killer.GetHerHim] dans une cellule."
  lv_travel_danger.0002.d:0 "[victim.GetSheHe|U] a vu la vérité ! Nous devons l'écouter !"
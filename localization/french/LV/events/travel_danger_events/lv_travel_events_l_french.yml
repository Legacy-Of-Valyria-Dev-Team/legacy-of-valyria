 lv_travel_danger.0001.t:0 "Le Brouillard Vit"
 lv_travel_danger.0001.desc:0 "Le brouillard s'élève à l'horizon comme un mur — dense, immobile, et contre nature. Il attend. Tandis que votre navire y pénètre, le brouillard engloutit tout : la mer, le ciel, le bruit du vent. Le monde derrière vous s'évanouit.\n\nL'air s'épaissit. Les voiles disparaissent dans le gris. Vous ne voyez plus vos propres mains. Les voix de l'équipage résonnent étrangement, comme sous l'eau. Le navire gémit, mais même ce son paraît lointain. Le temps se tord. Les minutes s'étirent. Des heures passent — ou aucune du tout.\n\nPuis un marin surgit en titubant hors de la brume, pieds nus et tremblant. Sa peau est livide. Ses cheveux sont devenus blancs.\n\n« J'ai trouvé le navire, marmonne-t-il. Notre navire. Exactement comme celui-ci. Sauf que... nous étions tous morts. Flottant. Le regard fixe. Et je — je crois que je me suis vu moi-même me regarder. »"
 lv_travel_danger.0001.a:0 "Le brouillard ment. Maintenons le cap."
 lv_travel_danger.0001.a.tt.trait:0 "Chaque membre de votre suite aura 50% de chances de gagner soit le [trait|E] [GetTrait('lunatic_1').GetName( GetNullCharacter )], soit [GetTrait('paranoid').GetName( GetNullCharacter )]"
 lv_travel_danger.0001.a.tt.opinion:0 "Chaque membre de votre suite perd #N 30#! d'[opinion|E] envers #V vous#! #weak (M'a Raillé dans mon Heure de Besoin)#!"
 lv_travel_danger.0001.b:0 "Faites virer le navire. Nous rentrons."
 lv_travel_danger.0001.b.tt.opinion:0 "Chaque membre de votre suite gagne #P 20#! d'[opinion|E] envers #V vous#! pendant #V 10 ans#! #weak (A Veillé sur ma Santé)#!"
 lv_travel_danger.0001.c:0 "Laissez-moi m'avancer dans le brouillard."
 lv_travel_danger.0001.c.tt:0 "Vous vous avancez dans le brouillard"
 lv_travel_danger.0001.c.tt.trait:0 "Vous ressortez du brouillard, changé à jamais"

 lv_travel_danger.0002.t:0 "Du Sang sur le Pont"
 lv_travel_danger.0002.desc:0 "Il y a du sang sur les planches. Un marin gît étalé dans la mort, un couteau encore enfoncé dans [victim.GetHerHis] côtes. Un autre se tient au-dessus de [victim.GetHerHim], tremblant, le visage livide et éclaboussé de rouge.\n\n« [victim.GetSheHe|U] n'était pas réel, marmonne le meurtrier, les yeux écarquillés. Le brouillard l'a envoyé. J'ai vu ce que [victim.GetSheHe] était vraiment. »\n\nL'équipage se rassemble dans un silence pesant. Nul ne bouge. Nul ne parle. L'air est chargé de peur — et de la certitude que la raison se délite."
 lv_travel_danger.0002.a:0 "Exécutez [killer.GetHerHim] sur-le-champ."
 lv_travel_danger.0002.b:0 "Jetez [killer.GetHerHim] par-dessus bord."
 lv_travel_danger.0002.c:0 "Mettez [killer.GetHerHim] au cachot."
 lv_travel_danger.0002.d:0 "[victim.GetSheHe|U] a vu la vérité ! Nous devons en tenir compte !"
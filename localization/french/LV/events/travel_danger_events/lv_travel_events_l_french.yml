l_french:

  lv_travel_danger.0001.t:0 "Le Brouillard Vivant"
  lv_travel_danger.0001.desc:0 "Le brouillard s'élève à l'horizon tel un mur immense, dense, immobile et contre-nature. Il attend votre passage avec une patience surnaturelle. Dès que votre navire y pénètre, le brouillard engloutit tout ce qui existe : la mer, le ciel, le chant du vent dans les voiles. Le monde derrière vous s'évanouit comme s'il n'avait jamais été.\n\nL'air s'épaissit jusqu'à devenir presque solide. Les voiles disparaissent dans le gris uniforme. Vous ne pouvez voir vos propres mains, même tendues devant votre visage. Les voix de l'équipage résonnent étrangement, comme si elles venaient de sous les eaux. Le navire gémit sous une pression invisible, mais même ces sons familiers semblent lointains et déformés. Le temps se tord sur lui-même. Les minutes s'étirent en éternité. Des heures passent... ou peut-être aucune.\n\nPuis un marin titube hors de la brume, pieds nus et tremblant de tous ses membres. Sa peau est d'une pâleur cadavérique. Ses cheveux ont blanchi comme neige fraîche.\n\n« J'ai trouvé le navire », marmonne-t-il d'une voix brisée. « Notre navire. Exactement comme celui-ci. Seulement... nous étions tous morts. Flottant dans l'eau sombre. Fixant le vide. Et je... je crois que je me suis vu me regarder en retour. »"
  lv_travel_danger.0001.a:0 "Le brouillard ment. Gardons le cap."
  lv_travel_danger.0001.a.tt.trait:0 "Chaque membre de votre suite aura 50% de chances de gagner soit le trait [trait|E] [GetTrait('lunatic_1').GetName( GetNullCharacter )] soit [GetTrait('paranoid').GetName( GetNullCharacter )]"
  lv_travel_danger.0001.a.tt.opinion:0 "Chaque membre de votre suite perd #N 30#! d'[opinion|E] envers #V vous#! #weak (M'a tourné en dérision dans mon heure de détresse)#!"
  lv_travel_danger.0001.b:0 "Faites demi-tour. Nous rentrons au port."
  lv_travel_danger.0001.b.tt.opinion:0 "Chaque membre de votre suite gagne #P 20#! d'[opinion|E] envers #V vous#! pendant #V 10 ans#! #weak (S'est soucié de ma santé)#!"
  lv_travel_danger.0001.c:0 "Laissez-moi marcher dans le brouillard."
  lv_travel_danger.0001.c.tt:0 "Vous pénétrez dans le brouillard maudit"
  lv_travel_danger.0001.c.tt.trait:0 "Vous ressortez du brouillard, mais vous n'êtes plus la même personne qu'auparavant"

  lv_travel_danger.0002.t:0 "Du Sang sur le Pont"
  lv_travel_danger.0002.desc:0 "Il y a du sang sur les planches du navire, formant une mare écarlate qui s'étend lentement. Un marin gît étalé dans la mort, une lame encore enfoncée entre [victim.GetHerHis] côtes brisées. Un autre se tient au-dessus de [victim.GetHerHim], tremblant comme feuille au vent, le visage blême et éclaboussé de rouge.\n\n« [victim.GetSheHe|U] n'était pas réel », marmonne l'assassin, les yeux écarquillés par une terreur indicible. « Le brouillard [victim.GetHerHim] a envoyé. J'ai vu ce que [victim.GetSheHe] était véritablement. »\n\nL'équipage se rassemble dans un silence pesant et inquiet. Personne ne bouge. Personne ne parle. L'air pèse lourd de peur et de la terrible certitude que la raison s'effiloche comme voile déchirée par la tempête."
  lv_travel_danger.0002.a:0 "Exécutez [killer.GetHerHim] sur-le-champ."
  lv_travel_danger.0002.b:0 "Jetez [killer.GetHerHim] par-dessus bord."
  lv_travel_danger.0002.c:0 "Enfermez [killer.GetHerHim] dans une cellule."
  lv_travel_danger.0002.d:0 "[victim.GetSheHe|U] a vu la vérité ! Nous devons l'écouter !"
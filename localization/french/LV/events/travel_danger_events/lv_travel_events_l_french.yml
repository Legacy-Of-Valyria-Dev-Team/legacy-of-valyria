l_french:

  lv_travel_danger.0001.t:0 "La Brume Vit"
  lv_travel_danger.0001.desc:0 "La brume s'élève à l'horizon tel un mur : dense, immobile, et mauvaise. Elle attend. Lorsque votre navire y pénètre, la brume engloutit tout : la mer, le ciel, le son du vent. Le monde derrière vous s'évanouit.\n\nL'air s'épaissit. Les voiles disparaissent dans le gris. Vous ne pouvez voir vos mains. Les voix de l'équipage résonnent étrangement, comme sous l'eau. Le navire gémit, mais même cela semble distant. Le temps se tord. Les minutes s'étirent. Des heures passent, ou aucune.\n\nPuis un marin trébuche hors de la brume, pieds nus et tremblant. Sa peau est pâle. Ses cheveux sont devenus blancs.\n\n« J'ai trouvé le navire », marmonne-t-il. « Notre navire. Exactement comme celui-ci. Seulement... nous étions tous morts. Flottant. Les yeux fixes. Et je... je crois m'être vu me regarder en retour. »"
  lv_travel_danger.0001.a:0 "La brume ment. Gardons le cap."
  lv_travel_danger.0001.a.tt.trait:0 "Chaque membre de votre entourage aura 50% de chances de gagner soit le [trait|E] [GetTrait('lunatic_1').GetName( GetNullCharacter )] soit [GetTrait('paranoid').GetName( GetNullCharacter )]"
  lv_travel_danger.0001.a.tt.opinion:0 "Chaque membre de votre entourage perd #N 30#! [opinion|E] envers #V vous#! #weak (M'a raillé dans mon Heure de Besoin)#!"
  lv_travel_danger.0001.b:0 "Faites virer le navire. Nous rentrons."
  lv_travel_danger.0001.b.tt.opinion:0 "Chaque membre de votre entourage gagne #P 20#! [opinion|E] envers #V vous#! pendant #V 10 ans#! #weak (S'est Soucié de Ma Santé)#!"
  lv_travel_danger.0001.c:0 "Laissez-moi marcher dans la brume."
  lv_travel_danger.0001.c.tt:0 "Vous marchez dans la brume"
  lv_travel_danger.0001.c.tt.trait:0 "Vous sortez de la brume, mais vous n'êtes plus la même personne qu'avant"

  lv_travel_danger.0002.t:0 "Du Sang sur le Pont"
  lv_travel_danger.0002.desc:0 "Il y a du sang sur les planches. Un marin gît étalé dans la mort, un couteau encore enfoncé dans [victim.GetHerHis] côtes. Un autre se tient au-dessus [victim.GetHerHim], tremblant, le visage pâle et éclaboussé de rouge.\n\n« [victim.GetSheHe|U] n'était pas réel[victim.GetHerHis] », marmonne le tueur, les yeux écarquillés. « La brume l'a envoyé[victim.GetHerHis]. J'ai vu ce qu'[victim.GetSheHe] était vraiment. »\n\nL'équipage se rassemble dans un silence inquiet. Personne ne bouge. Personne ne parle. L'air est lourd de peur, et de la conscience que la raison s'effiloche."
  lv_travel_danger.0002.a:0 "Exécutez-[killer.GetHerHim] sur-le-champ."
  lv_travel_danger.0002.b:0 "Jetez-[killer.GetHerHim] par-dessus bord."
  lv_travel_danger.0002.c:0 "Mettez-[killer.GetHerHim] en cellule."
  lv_travel_danger.0002.d:0 "[victim.GetSheHe|U] a vu la vérité ! Nous devons en tenir compte !"
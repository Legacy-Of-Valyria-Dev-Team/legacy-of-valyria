  colonize_valyria.0007.t:0 "Fondation de l'Ordre des Gardiens des Dragons"
  colonize_valyria.0007.desc:0 "Pour la première fois dans l'histoire, le Mont Gaelithox accueille en son sein un Ordre des Gardiens des Dragons. [head_dragonkeeper.GetName] a été désigné pour guider cette confrérie sacrée en tant que Premier Gardien."
  
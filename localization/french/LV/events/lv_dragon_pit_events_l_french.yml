l_french:
  colonize_valyria.0007.t:0 "L'Ordre des Gardiens de Dragons Établi"
  colonize_valyria.0007.desc:0 "Pour la première fois depuis des siècles, le Mont Gaelithox possède son propre Ordre des Gardiens de Dragons. [head_dragonkeeper.GetName] a été nommé à la tête de cette institution vénérable, marquant le retour d'une tradition valyriènne oubliée."
  
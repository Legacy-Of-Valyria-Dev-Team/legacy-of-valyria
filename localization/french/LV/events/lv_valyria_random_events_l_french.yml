l_french:
  lv_valyria_random_event.0009.t:0 "Traqué par les Ombres"
  lv_valyria_random_event.0009.desc:0 "La géographie de [haunted_location.GetName] est déjà assez traîtresse en soi : la terre craquelée, les émanations de soufre, la chaleur étouffante. Pourtant, le véritable tribut a commencé à s'enraciner dans votre esprit. Depuis que vous avez posé le pied en ces lieux maudits il y a quelques jours, le sommeil est devenu un champ de bataille. Chaque nuit, vous vous éveillez en sueur, le goût du cuivre dans la bouche et l'écho déclinant d'un millier de voix hurlant à l'unisson.\n\nC'est pire lorsque vous êtes éveillé. Le silence ici pèse, oppressant, chargé de regard. Du coin de l'œil, vous surprenez des mouvements furtifs : l'éclair d'une étoffe cramoisie, le miroitement de cheveux d'argent contre la roche grise. Mais chaque fois que vous tournez la tête, il n'y a rien que cendres dérivantes et désolation.\n\nVos compagnons deviennent nerveux, murmurant à propos de « terre inquiète » et du jugement des ancêtres. Vous ressentez profondément que vous violez un sanctuaire qui se souvient de sa puissance... et de sa colère."
  lv_valyria_random_event.0009.a:0 "De simples mirages dus à l'épuisement. Nous poursuivons."
  lv_valyria_random_event.0009.b:0 "Non, cet endroit est maudit. Trouvons un autre chemin."

  lv_valyria_random_event.0010.t:0 "Les Silhouettes aux Robes Pourpres"
  lv_valyria_random_event.0010.desc:0 "À travers la brume de cendres, vous les apercevez : pâles comme la mort, leurs longs cheveux blancs flottant tels des linceuls. Leurs visages se détachent, fantomatiques, sur le voile grisâtre. Des robes rouge sombre pendent de leurs épaules. Ils ne bougent pas. Ils ne font que vous fixer, immobiles comme des statues. Quand vous clignez des yeux, ils ont disparu."
  lv_valyria_random_event.0010.a:0 "Ils m'observaient... ils me jugeaient."
  lv_valyria_random_event.0010.b:0 "Je suis leur héritier... ou le suis-je vraiment ?"
  lv_valyria_random_event.0010.c:0 "Ils sont réels, plus réels que les vivants eux-mêmes."

  lv_valyria_random_event.0020.t:0 "Ils Sont Revenus"
  lv_valyria_random_event.0020.desc:0 "Une fois encore, vous les apercevez parmi les ruines décharnées. Plus proches cette fois, leurs cheveux blancs luisant à la lueur des flammes mourantes. Leurs yeux rencontrent les vôtres, sans ciller, emplis d'une sagesse millénaire. Lorsque vous approchez, ils s'évanouissent comme fumée au vent, ne laissant que des empreintes dans la cendre qui s'effacent sous vos yeux."
  lv_valyria_random_event.0020.a:0 "Je ne puis supporter leur regard accusateur."
  lv_valyria_random_event.0020.b:0 "Ils me mettent à l'épreuve : je leur prouverai ma valeur."
  lv_valyria_random_event.0020.c:0 "Oui... oui, je marche à leurs côtés désormais..."

  lv_valyria_random_event.0030.t:0 "Les Morts Parmi Nous"
  lv_valyria_random_event.0030.desc:0 "Cette fois, ils ne s'évanouissent pas. Les silhouettes pâles se tiennent parmi vos compagnons, silencieuses comme la tombe, leurs robes pourpres effleurant la cendre. Personne d'autre ne réagit ; nul ne les voit. Leurs visages sont tournés vers vous seul, empreints d'une attente terrible. Vous clignez des yeux, et le monde bascule. Ils ont disparu... mais vous n'êtes plus certain d'être encore vous-même."
  lv_valyria_random_event.0030.a:0 "Que signifie tout ceci ? Que veulent-ils de moi ?"
  
  lv_valyria_random_event.0031.t:0 "Réclamé"
  lv_valyria_random_event.0031.desc:0 "Les silhouettes s'approchent, inexorables. Leurs mains pâles comme l'ivoire se tendent vers vous, et en un instant, le monde sombre dans les ténèbres. Quand vos compagnons regardent autour d'eux, vous avez simplement disparu, comme si vous n'aviez jamais existé."
  lv_valyria_random_event.0031.a:0 "Ils m'emportent dans la cendre éternelle."
  
  lv_valyria_random_event.0032.t:0 "Ils Vivent en Moi Désormais..."
  lv_valyria_random_event.0032.desc:0 "Les silhouettes se dissolvent en cendres dansantes, mais vous les sentez en vous, leur essence fusionnant avec la vôtre. Leurs voix murmurent dans une langue plus ancienne que les hommes, des secrets oubliés depuis des millénaires. Leurs yeux regardent à travers les vôtres, voyant ce que vous voyez."
  lv_valyria_random_event.0032.a:0 "Je ne suis plus seul dans mon propre esprit."

  lv_valyria_random_event.0033.t:0 "Un Don Maudit"
  lv_valyria_random_event.0033.desc:0 "Quand les silhouettes s'évanouissent, quelque chose demeure dans la cendre : un fragment de Valyria elle-même, scintillant faiblement d'une lueur intérieure, comme habité par le feu des Quatorze Flammes. Vous le prenez de vos mains tremblantes, bien que le souvenir de leurs yeux brûle encore dans votre mémoire."
  lv_valyria_random_event.0033.a:0 "Il est mien désormais... quel qu'en soit le prix."


  lv_valyria_random_event.0040.t:0 "Le Dragon dans les Cieux"
  lv_valyria_random_event.0040.desc:0 "À travers la brume de cendres et de fumée sulfureuse, une ombre immense dérive dans le ciel tourmenté. L'espace d'un instant, les nuages se déchirent, et vous contemplez des ailes déployées comme des voiles de guerre, des écailles miroitant telle l'acier en fusion : un dragon planant au-dessus de la cité brisée, vestige d'une gloire anéantie. Mais quand vous clignez des yeux, il a disparu, ne laissant que le silence et les ténèbres mouvantes. L'avez-vous véritablement vu... ou n'était-ce qu'un rêve de l'Ancienne Valyria ?"
  lv_valyria_random_event.0040.a:0 "Réel ou non, je garderai cette vision gravée jusqu'à mon dernier souffle."


  lv_valyria_random_event.0050.t:0 "La Cité Évanescente"
  lv_valyria_random_event.0050.desc:0 "Les ruines se métamorphosent sous vos yeux. Une flèche noire qui guidait vos pas a disparu quand vous tournez la tête, remplacée par un sol vide et désolé. Des rues que vous avez arpentées quelques heures plus tôt ne mènent nulle part, ou vous ramènent inexorablement à votre point de départ. Vos compagnons murmurent que la sorcellerie imprègne l'air même que vous respirez."
  lv_valyria_random_event.0050.a:0 "Elle nous observe. Elle bouge quand nous bougeons."
  lv_valyria_random_event.0050.b:0 "Le Fléau a déformé jusqu'aux pierres elles-mêmes."
  lv_valyria_random_event.0050.c:0 "Oui... elle vit. La cité respire autour de nous."

  lv_valyria_random_event.0060.t:0 "Perdu dans la Cité Évanescente"
  lv_valyria_random_event.0060.desc:0 "Vous errez parmi des tours qui changent dès qu'on cesse de les observer, des rues qui ondulent sous vos pieds comme des serpents de pierre. Les visages familiers s'évanouissent, des voix résonnent en des lieux impossibles, et chaque sentier semble vous entraîner plus profondément dans les cendres. La cité ne souhaite pas vous laisser partir ; elle vous veut pour elle seule."
  lv_valyria_random_event.0060.a:0 "Cet endroit brise les âmes les plus vaillantes."
  lv_valyria_random_event.0060.b:0 "La cité murmure... et je dois lui obéir."
  lv_valyria_random_event.0060.c:0 "De la confusion naît parfois la découverte."

  lv_valyria_random_event.0070.t:0 "Trésor dans les Cendres"
  lv_valyria_random_event.0070.desc:0 "Un corridor tortueux s'effondre soudain, révélant une voûte dissimulée depuis des siècles. Des pièces éparpillées et des ornements à demi fondus scintillent dans la cendre grise : vestiges de la splendeur valyrienne, fragments d'un empire qui dominait le monde."
  lv_valyria_random_event.0070.a:0 "La fortune sourit aux audacieux."

  lv_valyria_random_event.0080.t:0 "La Cité Réclame les Siens"
  lv_valyria_random_event.0080.desc:0 "Les voix de vos compagnons s'estompent, englouties par le néant. Les murs se replient autour de vous comme des mâchoires de pierre, les rues se brouillent, les tours s'élèvent impossiblement haut, touchant un ciel qui n'existe plus. Vous criez, mais nul ne vous entend. Valyria vous engloutit tout entier, vous faisant disparaître dans son labyrinthe mouvant pour l'éternité."
  lv_valyria_random_event.0080.a:0 "..."

  lv_valyria_random_event.0090.t:0 "Tremblement dans les Cendres"
  lv_valyria_random_event.0090.desc:0 "Le sol se cabre sous vos pieds tel un destrier affolé, et l'air saturé de cendres se déchire dans un rugissement de fin du monde. Les murs s'effondrent, les tours vacillent, et des fissures béantes s'ouvrent pour révéler des rivières de feu en fusion, le sang ardent des Quatorze Flammes qui coule encore. Vos compagnons se dispersent dans la panique tandis que les ruines elles-mêmes menacent de vous engloutir."
  lv_valyria_random_event.0090.a:0 "Fuyez avant que la terre ne nous dévore !"
  lv_valyria_random_event.0090.b:0 "Des trésors gisent peut-être cachés dans les flammes..."
  lv_valyria_random_event.0090.c:0 "Tenez bon ! Ne laissez pas la peur nous briser !"

  lv_valyria_random_event.0100.t:0 "Nuée de Dragonnets"
  lv_valyria_random_event.0100.desc:0 "Une nuée de minuscules créatures draconiques fond sur vous, chacune pas plus grosse qu'un poing mais innombrables comme les étoiles. Elles sifflent et crissent, mordant et griffant, dévorant tout ce qui vit sur leur passage. Cendres et flammes tourbillonnent dans leur sillage tandis qu'elles se meuvent telle une tempête vivante, implacables et terrifiantes : les rejetons dégénérés d'un empire déchu."
  lv_valyria_random_event.0100.a:0 "Repoussez-les... ou périssez !"
  lv_valyria_random_event.0100.b:0 "Tentez d'en capturer quelques-uns... si vous survivez."
  lv_valyria_random_event.0100.c:0 "Restez groupés et endurez l'assaut !"

  lv_valyria_random_event.0110.t:0 "Embuscade des Serpents de Cendre"
  lv_valyria_random_event.0110.desc:0 "D'immenses serpents blêmes ondulent à travers les plaines de cendres, frappant soudain votre groupe sans avertissement. Leurs mâchoires claquent avec une rapidité terrifiante, et leurs écailles irradient une chaleur brûlante : vestiges corrompus de la magie valyrienne. Vous devez agir promptement si vous espérez survivre à leur assaut."
  lv_valyria_random_event.0110.a:0 "Tenez ferme et combattez !"
  lv_valyria_random_event.0110.b:0 "Fuyez pour sauver votre vie !"

  lv_valyria_random_event.0120.t:0 "Vapeurs Toxiques"
  lv_valyria_random_event.0120.desc:0 "Une épaisse brume âcre suinte des fissures de la terre noircie, vous brûlant les yeux et la gorge comme du feu liquide. L'air est lourd de soufre ; chaque souffle menace de vous étouffer, de vous arracher la vie. Poursuivre pourrait s'avérer fatal, mais rebrousser chemin coûterait un temps précieux dans cette course contre la mort."
  lv_valyria_random_event.0120.a:0 "Couvrez votre bouche et forcez le passage."
  lv_valyria_random_event.0120.b:0 "Repliez-vous vers des chemins plus sûrs."
  lv_valyria_random_event.0120.c:0 "Brûlez des provisions pour purifier l'air."

  lv_valyria_random_event.0130.t:0 "Séquelles : La Maladie"
  lv_valyria_random_event.0130.desc:0 "Une toux déchirante secoue votre corps tandis que le mal s'installe dans vos poumons, drainant vos forces comme un parasite invisible. Chaque respiration est un combat, chaque pas une victoire arrachée à la mort."
  lv_valyria_random_event.0130.a:0 "Luttez contre la fièvre qui vous consume."
  lv_valyria_random_event.0130.b:0 "Je m'affaiblis d'heure en heure..."

  lv_valyria_random_event.0140.t:0 "Séquelles : Les Brûlures"
  lv_valyria_random_event.0140.desc:0 "Une douleur cuisante née des cendres et du soufre dévore votre peau. Les cicatrices brûlent encore, rappel constant de la proximité de la mort, marques indélébiles de votre passage à travers l'enfer valyrien."
  lv_valyria_random_event.0140.a:0 "Vivant, enfin. Contre toute attente."

  lv_valyria_random_event.0150.t:0 "Séquelles : La Retraite"
  lv_valyria_random_event.0150.desc:0 "Vous parvenez à vous extraire des vapeurs mortelles, mais le souvenir de cette proximité avec le trépas persiste, rendant chaque pas incertain, chaque souffle précieux. La peur s'est insinuée dans vos os."
  lv_valyria_random_event.0150.a:0 "Nous poursuivons, brisés mais vivants."

  lv_valyria_random_event.0160.t:0 "Séquelles : Les Provisions Sacrifiées"
  lv_valyria_random_event.0160.desc:0 "Vous avez brûlé le peu qu'il vous restait pour dissiper les vapeurs mortelles. L'air s'est purifié, mais la perte de ces ressources vitales hante désormais chacun de vos pas, ombre menaçante sur votre survie."
  lv_valyria_random_event.0160.a:0 "Le sacrifice en valait la peine."
  lv_valyria_random_event.0160.b:0 "Je redoute ce que nous avons abandonné."
l_french:
 lv_valyria_random_event.0009.t:0 "Traqué par les Ombres"
 lv_valyria_random_event.0009.desc:0 "La géographie de [haunted_location.GetName] est déjà assez périlleuse, avec sa terre fissurée, ses évents de soufre, sa chaleur. Pourtant, le véritable tribut a commencé à s'enraciner dans votre esprit. Depuis que vous avez posé le pied ici il y a quelques jours, le sommeil est devenu un champ de bataille. Chaque nuit vous vous réveillez en sueur, avec le goût du cuivre dans la bouche et l'écho persistant d'un millier de voix hurlant à l'unisson.\n\nC'est pire encore lorsque vous êtes éveillé. Le silence ici est lourd, vigilant. Du coin de l'œil, vous saisissez de soudaines lueurs de mouvement — des éclats de tissu écarlate, le miroitement de cheveux argentés contre la roche grise. Pourtant, chaque fois que vous tournez la tête pour regarder, il n'y a rien d'autre que cendre dérivante et ruine.\n\nVos compagnons deviennent nerveux, murmurant à propos d'une « terre inquiète » et du jugement des ancêtres. Vous ressentez un profond sentiment d'être un intrus en un lieu qui se souvient de sa puissance... et de sa colère."
 lv_valyria_random_event.0009.a:0 "De simples jeux de lumière et la fatigue. Nous poursuivons notre chemin."
 lv_valyria_random_event.0009.b:0 "Non, ce lieu est maudit. Nous devrions trouver une autre voie."

 lv_valyria_random_event.0010.t:0 "Les Silhouettes en Robes Rouges"
 lv_valyria_random_event.0010.desc:0 "À travers la brume, vous les voyez — pâles, aux longs cheveux blancs. Leurs visages tranchant contre la cendre. De sombres robes rouges pendent de leurs épaules. Elles ne bougent pas. Elles se contentent d'observer. Lorsque vous clignez des yeux, elles ont disparu."
 lv_valyria_random_event.0010.a:0 "Elles m'observaient."
 lv_valyria_random_event.0010.b:0 "Je suis leur successeur... ou le suis-je vraiment ?"
 lv_valyria_random_event.0010.c:0 "Elles sont réelles — plus réelles que les vivants."

 lv_valyria_random_event.0020.t:0 "Elles Sont de Nouveau Là"
 lv_valyria_random_event.0020.desc:0 "Une fois encore vous les voyez, parmi les ruines. Plus proches à présent, leurs cheveux blancs luisant à la lueur du feu. Leurs yeux croisent les vôtres, sans ciller. Lorsque vous approchez, elles s'évanouissent, ne laissant que des empreintes dans la cendre qui s'effacent sous vos yeux."
 lv_valyria_random_event.0020.a:0 "Je ne peux endurer leur regard."
 lv_valyria_random_event.0020.b:0 "Elles me mettent à l'épreuve — je leur montrerai que je suis digne."
 lv_valyria_random_event.0020.c:0 "Oui... oui, je marche à leurs côtés..."

 lv_valyria_random_event.0030.t:0 "Les Morts Parmi Vous"
 lv_valyria_random_event.0030.desc:0 "Cette fois elles ne s'évanouissent pas. Les silhouettes pâles se tiennent parmi vos compagnons, silencieuses, leurs robes rouges frôlant la cendre. Nul autre ne réagit. Leurs visages ne sont tournés que vers vous. Vous clignez des yeux — et le monde vacille. Elles ont disparu... pourtant vous n'êtes pas certain de demeurer vous-même."
 lv_valyria_random_event.0030.a:0 "Que signifie tout cela ?"

 lv_valyria_random_event.0031.t:0 "Réclamé"
 lv_valyria_random_event.0031.desc:0 "Les silhouettes se rapprochent. Leurs mains pâles se tendent vers vous, et en un instant le monde s'estompe en noir. Lorsque vos compagnons regardent, vous avez simplement disparu."
 lv_valyria_random_event.0031.a:0 "Elles m'emportent dans la cendre."

 lv_valyria_random_event.0032.t:0 "Elles Vivent en Moi à Présent..."
 lv_valyria_random_event.0032.desc:0 "Les silhouettes se dissolvent en cendre — pourtant vous les sentez en vous, leurs voix murmurant dans une langue plus ancienne que les hommes. Leurs yeux regardent à travers les vôtres."
 lv_valyria_random_event.0032.a:0 "Je ne suis plus seul dans mon propre esprit."

 lv_valyria_random_event.0033.t:0 "Un Don Maudit"
 lv_valyria_random_event.0033.desc:0 "Lorsque les silhouettes s'évanouissent, quelque chose demeure dans la cendre — un fragment de Valyria, luisant faiblement d'une lumière intérieure. Vous le saisissez de mains tremblantes, bien que le souvenir de leurs yeux brûle encore."
 lv_valyria_random_event.0033.a:0 "Il est mien à présent... quel qu'en soit le prix."


 lv_valyria_random_event.0040.t:0 "Le Dragon Là-Haut"
 lv_valyria_random_event.0040.desc:0 "À travers la brume de cendre et de fumée, une vaste ombre dérive dans le ciel. Pour un instant les nuages s'écartent, et vous apercevez des ailes déployées, des écailles luisant comme de l'acier en fusion, un dragon planant au-dessus de la cité brisée. Pourtant, lorsque vous clignez des yeux, il a disparu — ne laissant que le silence et la pénombre mouvante. L'avez-vous vraiment vu... ou seulement rêvé ?"
 lv_valyria_random_event.0040.a:0 "Réel ou non, je me souviendrai de cette vision jusqu'à mon dernier jour."


 lv_valyria_random_event.0050.t:0 "La Cité Évanescente"
 lv_valyria_random_event.0050.desc:0 "Les ruines se déplacent sous vos yeux. Une flèche noire qui guidait vos pas a disparu lorsque vous tournez la tête, remplacée par un sol vide. Des rues que vous avez parcourues il y a quelques heures à peine ne mènent nulle part, ou vous ramènent à votre point de départ. Vos compagnons murmurent d'une sorcellerie dans l'air."
 lv_valyria_random_event.0050.a:0 "Elle nous observe. Elle bouge quand nous bougeons."
 lv_valyria_random_event.0050.b:0 "Le Fléau a déformé jusqu'aux pierres elles-mêmes."
 lv_valyria_random_event.0050.c:0 "Oui... elle vit. La cité respire autour de nous."

 lv_valyria_random_event.0060.t:0 "Perdu dans la Cité Évanescente"
 lv_valyria_random_event.0060.desc:0 "Vous errez parmi des tours qui changent lorsqu'on ne les observe pas, des rues qui se déplacent sous vos pieds. Des visages familiers s'évanouissent, des voix résonnent aux mauvais endroits, et chaque chemin semble s'enfoncer davantage dans la cendre. La cité ne souhaite pas vous laisser partir."
 lv_valyria_random_event.0060.a:0 "Ce lieu brise l'esprit."
 lv_valyria_random_event.0060.b:0 "La cité murmure... et je dois obéir."
 lv_valyria_random_event.0060.c:0 "De la confusion naît la découverte."

 lv_valyria_random_event.0070.t:0 "Trésor dans les Cendres"
 lv_valyria_random_event.0070.desc:0 "Un couloir tortueux s'effondre, révélant un coffre caché. Des pièces éparpillées et des ornements à demi fondus scintillent dans la cendre — vestiges de la splendeur valyrienne."
 lv_valyria_random_event.0070.a:0 "La fortune sourit aux audacieux."

 lv_valyria_random_event.0080.t:0 "La Cité Réclame les Siens"
 lv_valyria_random_event.0080.desc:0 "Les voix de vos compagnons s'estompent. Les murs se replient autour de vous, les rues se brouillent, les tours se dressent à une hauteur impossible. Vous criez, mais nul ne vous entend. Valyria vous engloutit tout entier, disparaissant dans son labyrinthe mouvant."
 lv_valyria_random_event.0080.a:0 "..."

 lv_valyria_random_event.0090.t:0 "Tremblement dans la Cendre"
 lv_valyria_random_event.0090.desc:0 "Le sol se dérobe sous vos pieds, et l'air chargé de cendre se fend d'un rugissement. Les murs s'effondrent, les tours penchent, et des fissures s'ouvrent pour révéler des rivières de feu en fusion. Vos compagnons se dispersent en panique tandis que la ruine elle-même menace de vous engloutir."
 lv_valyria_random_event.0090.a:0 "Fuyez avant que la terre ne nous dévore !"
 lv_valyria_random_event.0090.b:0 "Il pourrait y avoir des trésors cachés dans le feu..."
 lv_valyria_random_event.0090.c:0 "Tenez bon ! Ne laissons pas la peur nous briser !"

 lv_valyria_random_event.0100.t:0 "Essaim de Braisillons"
 lv_valyria_random_event.0100.desc:0 "Un nuage de minuscules créatures draconiques s'abat sur vous, chacune pas plus grande qu'un poing mais innombrables. Elles sifflent et poussent des cris stridents, mordant et griffant, dévorant tout ce qui est vivant sur leur passage. Cendre et feu traînent derrière elles tandis qu'elles se déplacent comme une tempête vivante, implacable et terrifiante."
 lv_valyria_random_event.0100.a:0 "Repoussez-les... ou périssez !"
 lv_valyria_random_event.0100.b:0 "Tentez d'en capturer quelques-unes... si vous survivez."
 lv_valyria_random_event.0100.c:0 "Restez groupés et survivez à l'essaim."

 lv_valyria_random_event.0110.t:0 "Embuscade de Serpents de Cendre"
 lv_valyria_random_event.0110.desc:0 "D'énormes serpents pâles se faufilent à travers les plaines de cendre, frappant soudainement votre troupe. Leurs mâchoires claquent avec une vitesse terrifiante, et leurs écailles irradient la chaleur. Vous devez agir vite si vous espérez survivre."
 lv_valyria_random_event.0110.a:0 "Tenir bon et combattre !"
 lv_valyria_random_event.0110.b:0 "Fuir et survivre !"

 lv_valyria_random_event.0120.t:0 "Fumées Toxiques"
 lv_valyria_random_event.0120.desc:0 "Une vapeur épaisse et âcre suinte des fissures du sol noirci, brûlant vos yeux et votre gorge. L'air est lourd de soufre — chaque souffle menace de vous suffoquer. Avancer pourrait s'avérer fatal, mais reculer coûterait un temps précieux."
 lv_valyria_random_event.0120.a:0 "Couvrez-vous la bouche et poussez à travers."
 lv_valyria_random_event.0120.b:0 "Battez en retraite vers des voies plus sûres."
 lv_valyria_random_event.0120.c:0 "Brûlez des provisions pour masquer l'air."

 lv_valyria_random_event.0130.t:0 "Séquelles : Maladie"
 lv_valyria_random_event.0130.desc:0 "La toux ravage votre corps tandis que la maladie s'installe dans vos poumons, affaiblissant vos forces."
 lv_valyria_random_event.0130.a:0 "Se rallier contre la fièvre."
 lv_valyria_random_event.0130.b:0 "Je me sens plus faible d'heure en heure."

 lv_valyria_random_event.0140.t:0 "Séquelles : Brûlé"
 lv_valyria_random_event.0140.desc:0 "Une douleur cuisante causée par la cendre et le soufre brûle votre peau. Les cicatrices brûlent, vous rappelant à quel point la mort fut proche."
 lv_valyria_random_event.0140.a:0 "Vivant, enfin."

 lv_valyria_random_event.0150.t:0 "Séquelles : Repli"
 lv_valyria_random_event.0150.desc:0 "Vous parvenez à vous retirer de l'air toxique, mais le souvenir de la proximité de la mort persiste, rendant chaque pas incertain."
 lv_valyria_random_event.0150.a:0 "Nous poursuivons notre route, brisés mais vivants."

 lv_valyria_random_event.0160.t:0 "Séquelles : Provisions Sacrifiées"
 lv_valyria_random_event.0160.desc:0 "Vous avez brûlé le peu que vous aviez pour masquer les fumées. L'air s'est éclairci, mais la perte des ressources hante désormais chaque pas du voyage."
 lv_valyria_random_event.0160.a:0 "Le sacrifice en valait la peine."
 lv_valyria_random_event.0160.b:0 "Je crains ce que nous avons abandonné."
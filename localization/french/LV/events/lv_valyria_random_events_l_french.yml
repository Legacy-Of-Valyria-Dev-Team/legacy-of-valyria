l_french:
 lv_valyria_random_event.0010.t:0 "Les Silhouettes aux Robes Pourpres"
 lv_valyria_random_event.0010.desc:0 "À travers la brume étouffante, vous les apercevez : pâles comme la mort, avec de longs cheveux blancs comme neige fraîche. Leurs visages se détachent, livides, contre le voile de cendres qui danse dans l'air stagnant. Des robes rouge sombre pendent de leurs épaules décharnées tel un linceul sanglant. Elles ne bougent point, figées dans une immobilité surnaturelle. Elles ne font que vous fixer de leurs yeux vides, perçant votre âme de leur regard glacial. Lorsque vous clignez des paupières, elles s'évaporent comme si elles n'avaient jamais existé."
 lv_valyria_random_event.0010.a:0 "Elles m'observaient avec une attention dévorante."
 lv_valyria_random_event.0010.b:0 "Je suis leur successeur... ou le suis-je vraiment ?"
 lv_valyria_random_event.0010.c:0 "Elles sont réelles, plus réelles que les vivants eux-mêmes."

 lv_valyria_random_event.0020.t:0 "Elles Sont Revenues"
 lv_valyria_random_event.0020.desc:0 "Une fois encore vous les voyez, errant parmi les ruines désolées comme des spectres de l'ancien temps. Plus proches cette fois, leurs cheveux blancs luisant d'un éclat spectral dans la lumière mourante des brasiers qui parsèment encore les décombres. Leurs yeux rencontrent les vôtres, sans jamais ciller, fixant votre regard avec une intensité qui glace le sang. Lorsque vous vous approchez d'un pas hésitant, elles s'évanouissent dans l'air épais, ne laissant que des empreintes de pas dans la cendre qui s'effacent sous vos yeux médusés."
 lv_valyria_random_event.0020.a:0 "Je ne puis endurer plus longtemps leur regard inquisiteur."
 lv_valyria_random_event.0020.b:0 "Elles me mettent à l'épreuve. Je leur montrerai que je suis digne."
 lv_valyria_random_event.0020.c:0 "Oui... oui, je marche à leurs côtés dans cette danse macabre..."

 lv_valyria_random_event.0030.t:0 "Les Morts Parmi Vous"
 lv_valyria_random_event.0030.desc:0 "Cette fois, elles ne s'évanouissent point dans les brumes. Les silhouettes blêmes se dressent au milieu de vos compagnons médusés, silencieuses comme des statues de marbre, leurs robes pourpres effleurant la cendre tiède qui jonche le sol. Nul autre ne réagit à leur présence, comme si vous étiez le seul à percevoir cette vision d'outre-tombe. Leurs visages livides ne se tournent que vers vous, scrutant votre âme de leurs orbites creuses. Vous clignez des paupières, et le monde vacille sur ses fondements. Elles ont disparu... pourtant vous n'êtes point certain de demeurer vous-même."
 lv_valyria_random_event.0030.a:0 "Que signifie donc tout ceci ?"
 
 lv_valyria_random_event.0031.t:0 "Réclamé par les Ombres"
 lv_valyria_random_event.0031.desc:0 "Les silhouettes s'approchent de vous d'une démarche funèbre. Leurs mains pâles et décharnées se tendent vers votre personne, et en un instant le monde s'évanouit dans les ténèbres absolues. Lorsque vos compagnons cherchent votre regard, vous avez tout bonnement disparu, comme si vous n'aviez jamais existé."
 lv_valyria_random_event.0031.a:0 "Elles m'emportent dans les cendres éternelles."
 
 lv_valyria_random_event.0032.t:0 "Elles Vivent Désormais en Moi..."
 lv_valyria_random_event.0032.desc:0 "Les silhouettes se dissolvent en cendres qui tourbillonnent dans l'air empoisonné, pourtant vous les sentez palpiter en vous, leurs voix chuchotant dans une langue plus ancienne que l'humanité elle-même. Leurs yeux morts regardent désormais à travers les vôtres, scrutant le monde avec une vision qui n'appartient plus aux vivants."
 lv_valyria_random_event.0032.a:0 "Je ne suis plus seul dans les méandres de mon propre esprit."

 lv_valyria_random_event.0033.t:0 "Un Don Maudit"
 lv_valyria_random_event.0033.desc:0 "Lorsque les silhouettes s'évanouissent dans l'éther, quelque chose demeure dans la cendre encore tiède : un fragment de l'ancienne Valyria, scintillant faiblement d'une lumière intérieure qui pulse comme un cœur mourant. Vous le ramassez de mains tremblantes, bien que le souvenir de leurs regards brûle encore votre rétine comme un fer rouge."
 lv_valyria_random_event.0033.a:0 "Il m'appartient à présent... quel qu'en soit le prix à payer."


 lv_valyria_random_event.0040.t:0 "Le Dragon des Hauteurs"
 lv_valyria_random_event.0040.desc:0 "À travers la brume épaisse de cendres et de fumées âcres, une ombre colossale dérive à travers les cieux morts. Pour un bref instant, les nuages se séparent comme un rideau de théâtre, et vous contemplez des ailes déployées dans leur majesté terrible, des écailles scintillant comme acier en fusion, un dragon planant au-dessus de la cité brisée dans toute sa splendeur d'antan. Pourtant, lorsque vous clignez des paupières, il a disparu, ne laissant que le silence oppressant et la pénombre mouvante. L'avez-vous vraiment vu... ou n'était-ce qu'un rêve éveillé né de vos tourments ?"
 lv_valyria_random_event.0040.a:0 "Réel ou chimérique, cette vision demeurera gravée dans ma mémoire jusqu'à mon dernier souffle."


 lv_valyria_random_event.0050.t:0 "La Cité qui S'Évanouit"
 lv_valyria_random_event.0050.desc:0 "Les ruines se transforment sous vos yeux médusés, défiant toute logique. Une tour noire qui guidait vos pas s'évapore lorsque vous détournez la tête, remplacée par un terrain vague et désolé. Les rues que vous avez arpentées quelques heures auparavant ne mènent plus nulle part, ou vous ramènent au point de départ dans une boucle infernale. Vos compagnons murmurent des mots de sorcellerie qui flotte dans l'air empoisonné."
 lv_valyria_random_event.0050.a:0 "Elle nous observe. Elle bouge quand nous bougeons."
 lv_valyria_random_event.0050.b:0 "Le Fléau a tordu jusqu'aux pierres elles-mêmes."
 lv_valyria_random_event.0050.c:0 "Oui... elle vit et respire. La cité pulse autour de nous."

 lv_valyria_random_event.0060.t:0 "Égaré dans la Cité qui S'Évanouit"
 lv_valyria_random_event.0060.desc:0 "Vous errez parmi des tours qui se métamorphosent dès qu'elles échappent à votre regard, des rues qui se dérobent sous vos pieds comme du sable mouvant. Les visages familiers s'estompent dans la brume, les voix résonnent en de mauvais endroits, et chaque sentier semble vous entraîner plus profond dans la cendre et le désespoir. La cité ne souhaite point vous laisser partir de ses griffes maudites."
 lv_valyria_random_event.0060.a:0 "Ce lieu brise l'esprit et l'âme."
 lv_valyria_random_event.0060.b:0 "La cité murmure ses secrets... et je dois obéir à sa voix."
 lv_valyria_random_event.0060.c:0 "À travers la confusion naît la découverte."

 lv_valyria_random_event.0070.t:0 "Trésor dans les Cendres"
 lv_valyria_random_event.0070.desc:0 "Un couloir tortueux s'effondre dans un grondement sourd, révélant une chambre forte cachée depuis des siècles. Des pièces éparpillées et des ornements à demi fondus scintillent dans la cendre comme des étoiles déchues, vestiges de la splendeur valyriènne d'antan."
 lv_valyria_random_event.0070.a:0 "La fortune sourit aux audacieux."

 lv_valyria_random_event.0080.t:0 "La Cité Réclame les Siens"
 lv_valyria_random_event.0080.desc:0 "Les voix de vos compagnons s'estompent dans un écho lointain. Les murs se replient autour de vous comme les mâchoires d'un piège, les rues se brouillent dans un tourbillon hallucinatoire, les tours se dressent impossiblement hautes vers les cieux morts. Vous criez à pleins poumons, mais nul ne vous entend dans ce cauchemar de pierre. Valyria vous engloutit tout entier, vous faisant disparaître dans son labyrinthe mouvant."
 lv_valyria_random_event.0080.a:0 "..."

 lv_valyria_random_event.0090.t:0 "Séisme dans les Cendres"
 lv_valyria_random_event.0090.desc:0 "Le sol vacille sous vos pieds dans un fracas d'apocalypse, et l'air saturé de cendres se fend d'un rugissement primordial. Les murs s'effondrent dans un tonnerre assourdissant, les tours penchent dangereusement, et des crevasses s'ouvrent béantes pour révéler des rivières de feu en fusion qui coulent dans les entrailles de la terre. Vos compagnons se dispersent en proie à la panique alors que la ruine elle-même menace de vous engloutir dans ses profondeurs infernales."
 lv_valyria_random_event.0090.a:0 "Fuyez avant que la terre ne nous dévore tous !"
 lv_valyria_random_event.0090.b:0 "Il pourrait y avoir des trésors cachés dans ces flammes..."
 lv_valyria_random_event.0090.c:0 "Tenez bon ! Ne laissez point la peur nous briser !"

 lv_valyria_random_event.0100.t:0 "Nuée de Braisillons"
 lv_valyria_random_event.0100.desc:0 "Un nuage de minuscules créatures draconiques s'abat sur vous tel un fléau d'Égypte, chacune pas plus grosse qu'un poing mais innombrables comme les grains de sable. Elles sifflent et craillent dans une cacophonie infernale, mordant et griffant avec une rage bestiale, dévorant tout ce qui vit sur leur passage. Cendres et flammes tourbillonnent dans leur sillage alors qu'elles se meuvent comme une tempête vivante, implacables et terrifiantes."
 lv_valyria_random_event.0100.a:0 "Repoussez-les... ou périssez dévorés !"
 lv_valyria_random_event.0100.b:0 "Tentez d'en capturer quelques-unes... si vous survivez."
 lv_valyria_random_event.0100.c:0 "Serrez les rangs et survivez à l'essaim maudit."

 lv_valyria_random_event.0110.t:0 "Embuscade des Serpents de Cendre"
 lv_valyria_random_event.0110.desc:0 "D'énormes serpents blêmes ondulent à travers les plaines de cendres, frappant soudainement votre groupe avec la rapidité de l'éclair. Leurs mâchoires claquent avec une vitesse terrifiante, et leurs écailles irradient une chaleur de fournaise. Vous devez agir prestement si vous espérez survivre à cette attaque sournoise."
 lv_valyria_random_event.0110.a:0 "Debout et au combat !"
 lv_valyria_random_event.0110.b:0 "Fuyez et survivez !"

 lv_valyria_random_event.0120.t:0 "Vapeurs Toxiques"
 lv_valyria_random_event.0120.desc:0 "Une vapeur épaisse et âcre suinte des fissures du sol noirci, brûlant vos yeux et votre gorge dans un supplice constant. L'air est lourd de soufre nauséabond, chaque respiration menaçant de vous étouffer dans un râle d'agonie. Pousser plus avant pourrait s'avérer fatal, mais battre en retraite vous coûterait un temps précieux dans cette course contre la mort."
 lv_valyria_random_event.0120.a:0 "Couvrez-vous la bouche et forcez le passage."
 lv_valyria_random_event.0120.b:0 "Retraite vers des chemins plus sûrs."
 lv_valyria_random_event.0120.c:0 "Brûlez les provisions pour masquer les vapeurs."

 lv_valyria_random_event.0130.t:0 "Séquelles : Maladie"
 lv_valyria_random_event.0130.desc:0 "Une toux déchirante ravage votre corps alors que la maladie s'installe dans vos poumons meurtris, sapant vos forces jour après jour."
 lv_valyria_random_event.0130.a:0 "Je me dresse contre la fièvre qui me consume."
 lv_valyria_random_event.0130.b:0 "Je me sens faiblir d'heure en heure."

 lv_valyria_random_event.0140.t:0 "Séquelles : Brûlures"
 lv_valyria_random_event.0140.desc:0 "Une douleur cuisante née des cendres et du soufre calcine votre peau meurtrie. Les cicatrices brûlent encore, vous rappelant à quel point la mort frôla votre existence."
 lv_valyria_random_event.0140.a:0 "Vivant, enfin et malgré tout."

 lv_valyria_random_event.0150.t:0 "Séquelles : Retraite"
 lv_valyria_random_event.0150.desc:0 "Vous parvenez à vous retirer de l'air toxique et empoisonné, mais le souvenir de cette proximité avec la mort s'attarde, rendant chaque pas incertain et chaque souffle précieux."
 lv_valyria_random_event.0150.a:0 "Nous continuons, brisés mais vivants."

 lv_valyria_random_event.0160.t:0 "Séquelles : Provisions Sacrifiées"
 lv_valyria_random_event.0160.desc:0 "Vous avez brûlé le peu que vous possédiez pour masquer les vapeurs mortelles. L'air s'est purifié, mais la perte de ces ressources vitales hante désormais chaque pas de votre périple dans cette terre maudite."
 lv_valyria_random_event.0160.a:0 "Le sacrifice en valait la peine."
 lv_valyria_random_event.0160.b:0 "Je crains ce que nous avons abandonné."
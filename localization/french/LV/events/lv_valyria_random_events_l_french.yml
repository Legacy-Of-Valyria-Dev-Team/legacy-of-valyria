l_french:
  lv_valyria_random_event.0009.t:0 "Traqué par les Ombres"
  lv_valyria_random_event.0009.desc:0 "La géographie de [haunted_location.GetName] est déjà assez traîtresse en soi, avec sa terre craquelée, ses évents de soufre, sa chaleur accablante. Pourtant, le véritable tribut a commencé à s'enraciner dans votre esprit. Depuis que vous avez posé le pied ici il y a quelques jours, le sommeil est devenu un champ de bataille. Chaque nuit, vous vous éveillez en sueur, le goût du cuivre dans la bouche et l'écho faiblissant de mille voix hurlant à l'unisson.\n\nC'est pire lorsque vous êtes éveillé. Le silence ici semble lourd, vigilant. Du coin de l'œil, vous captez des aperçus soudains de mouvement : des éclairs d'étoffe cramoisie, le chatoiement de cheveux argentés contre la roche grise. Pourtant, chaque fois que vous tournez la tête pour regarder, il n'y a rien que cendres dérivantes et ruines.\n\nVos compagnons deviennent nerveux, murmurant des paroles sur une « terre sans repos » et le jugement des ancêtres. Vous ressentez profondément que vous violez un lieu qui se souvient de sa puissance... et de sa colère."
  lv_valyria_random_event.0009.a:0 "De simples mirages dus à la lumière et à la fatigue. Nous poursuivons."
  lv_valyria_random_event.0009.b:0 "Non, ce lieu est maudit. Nous devrions trouver un autre chemin."

  lv_valyria_random_event.0010.t:0 "Les Figures aux Robes Rouges"
  lv_valyria_random_event.0010.desc:0 "À travers la brume, vous les apercevez : pâles, aux longs cheveux blancs. Leurs visages se détachent contre la cendre. Des robes rouge sombre pendent de leurs épaules. Ils ne bougent pas. Ils ne font que fixer. Quand vous clignez des yeux, ils ont disparu."
  lv_valyria_random_event.0010.a:0 "Ils m'observaient."
  lv_valyria_random_event.0010.b:0 "Je suis leur successeur... ou le suis-je vraiment ?"
  lv_valyria_random_event.0010.c:0 "Ils sont réels, plus réels que les vivants."

  lv_valyria_random_event.0020.t:0 "Ils Sont Revenus"
  lv_valyria_random_event.0020.desc:0 "Une fois encore vous les apercevez, parmi les ruines. Plus proches maintenant, leurs cheveux blancs luisant dans la lueur des flammes. Leurs yeux croisent les vôtres, sans ciller. Quand vous approchez, ils s'évanouissent, ne laissant que des empreintes dans la cendre qui s'effacent sous vos yeux."
  lv_valyria_random_event.0020.a:0 "Je ne puis supporter leur regard."
  lv_valyria_random_event.0020.b:0 "Ils me mettent à l'épreuve ; je leur prouverai que je suis digne."
  lv_valyria_random_event.0020.c:0 "Oui... oui, je marche à leurs côtés..."

  lv_valyria_random_event.0030.t:0 "Les Morts Parmi Vous"
  lv_valyria_random_event.0030.desc:0 "Cette fois, ils ne s'évanouissent pas. Les silhouettes pâles se tiennent parmi vos compagnons, silencieuses, leurs robes rouges effleurant la cendre. Personne d'autre ne réagit. Leurs visages sont tournés uniquement vers vous. Vous clignez des yeux, et le monde vacille. Ils ont disparu... pourtant vous n'êtes plus certain de demeurer vous-même."
  lv_valyria_random_event.0030.a:0 "Que signifie tout cela ?"
  
  lv_valyria_random_event.0031.t:0 "Réclamé"
  lv_valyria_random_event.0031.desc:0 "Les silhouettes s'approchent. Leurs mains pâles se tendent vers vous, et en un instant le monde s'évanouit dans les ténèbres. Quand vos compagnons regardent, vous avez simplement disparu."
  lv_valyria_random_event.0031.a:0 "Ils m'emportent dans la cendre."
  
  lv_valyria_random_event.0032.t:0 "Ils Vivent En Moi Désormais..."
  lv_valyria_random_event.0032.desc:0 "Les silhouettes se dissolvent en cendres, et pourtant vous les sentez en vous, leurs voix murmurant dans une langue plus ancienne que les hommes. Leurs yeux regardent à travers les vôtres."
  lv_valyria_random_event.0032.a:0 "Je ne suis plus seul dans mon propre esprit."

  lv_valyria_random_event.0033.t:0 "Un Don Maudit"
  lv_valyria_random_event.0033.desc:0 "Quand les silhouettes s'évanouissent, quelque chose demeure dans la cendre : un fragment de Valyria, scintillant faiblement d'une lueur intérieure. Vous le prenez de vos mains tremblantes, bien que le souvenir de leurs yeux brûle encore."
  lv_valyria_random_event.0033.a:0 "Il est mien désormais... quel qu'en soit le prix."


  lv_valyria_random_event.0040.t:0 "Le Dragon dans le Ciel"
  lv_valyria_random_event.0040.desc:0 "À travers la brume de cendre et de fumée, une vaste ombre dérive dans le ciel. Pendant un instant, les nuages se déchirent, et vous contemplez des ailes déployées, des écailles chatoyant comme de l'acier en fusion : un dragon planant au-dessus de la cité brisée. Pourtant, quand vous clignez des yeux, il a disparu, ne laissant que le silence et l'obscurité mouvante. L'avez-vous vraiment vu... ou n'était-ce qu'un rêve ?"
  lv_valyria_random_event.0040.a:0 "Réel ou non, je me souviendrai de cette vision jusqu'à mon dernier souffle."


  lv_valyria_random_event.0050.t:0 "La Cité Évanescente"
  lv_valyria_random_event.0050.desc:0 "Les ruines se déplacent sous vos yeux. Une flèche noire qui guidait vos pas a disparu quand vous tournez la tête, remplacée par un sol vide. Des rues que vous avez arpentées quelques heures plus tôt ne mènent nulle part, ou ramènent à votre point de départ. Vos compagnons murmurent des paroles de sorcellerie dans l'air."
  lv_valyria_random_event.0050.a:0 "Elle nous observe. Elle bouge quand nous bougeons."
  lv_valyria_random_event.0050.b:0 "Le Fléau a déformé jusqu'aux pierres."
  lv_valyria_random_event.0050.c:0 "Oui... elle vit. La cité respire autour de nous."

  lv_valyria_random_event.0060.t:0 "Perdu dans la Cité Évanescente"
  lv_valyria_random_event.0060.desc:0 "Vous errez parmi des tours qui changent quand on ne les observe pas, des rues qui se dérobent sous vos pieds. Les visages familiers disparaissent, les voix résonnent aux mauvais endroits, et chaque chemin semble mener plus profondément dans la cendre. La cité ne souhaite pas que vous partiez."
  lv_valyria_random_event.0060.a:0 "Ce lieu brise l'esprit."
  lv_valyria_random_event.0060.b:0 "La cité murmure... et je dois obéir."
  lv_valyria_random_event.0060.c:0 "De la confusion naît la découverte."

  lv_valyria_random_event.0070.t:0 "Trésor dans les Cendres"
  lv_valyria_random_event.0070.desc:0 "Un corridor tortueux s'effondre, révélant une chambre forte cachée. Des pièces éparpillées et des ornements à demi fondus scintillent dans la cendre : vestiges de la splendeur valyrienne."
  lv_valyria_random_event.0070.a:0 "La fortune sourit aux audacieux."

  lv_valyria_random_event.0080.t:0 "La Cité Réclame les Siens"
  lv_valyria_random_event.0080.desc:0 "Les voix de vos compagnons s'évanouissent. Les murs se referment autour de vous, les rues se brouillent, les tours se dressent impossiblement hautes. Vous criez, mais personne n'entend. Valyria vous engloutit tout entier, vous faisant disparaître dans son labyrinthe mouvant."
  lv_valyria_random_event.0080.a:0 "..."

  lv_valyria_random_event.0090.t:0 "Tremblement dans la Cendre"
  lv_valyria_random_event.0090.desc:0 "Le sol se dérobe sous vos pieds, et l'air chargé de cendres se déchire dans un rugissement. Les murs s'effondrent, les tours penchent, et des fissures s'ouvrent pour révéler des rivières de feu en fusion. Vos compagnons se dispersent dans la panique tandis que les ruines elles-mêmes menacent de vous engloutir."
  lv_valyria_random_event.0090.a:0 "Fuyons avant que la terre nous dévore !"
  lv_valyria_random_event.0090.b:0 "Des trésors se cachent peut-être dans les flammes..."
  lv_valyria_random_event.0090.c:0 "Tenez bon ! Ne laissez pas la peur nous briser !"

  lv_valyria_random_event.0100.t:0 "Essaim de Dragonneaux"
  lv_valyria_random_event.0100.desc:0 "Un nuage de minuscules créatures draconiques s'abat sur vous, chacune pas plus grosse qu'un poing mais innombrables. Elles sifflent et crissent, mordant et griffant, dévorant tout ce qui vit sur leur passage. Cendre et feu traînent derrière elles tandis qu'elles se meuvent comme une tempête vivante, implacables et terrifiantes."
  lv_valyria_random_event.0100.a:0 "Les repousser... ou périr !"
  lv_valyria_random_event.0100.b:0 "Tenter d'en capturer quelques-uns... si vous survivez."
  lv_valyria_random_event.0100.c:0 "Rester groupés et survivre à l'essaim."

  lv_valyria_random_event.0110.t:0 "Embuscade de Serpents des Cendres"
  lv_valyria_random_event.0110.desc:0 "D'immenses serpents pâles rampent à travers les plaines de cendres, frappant soudainement votre groupe. Leurs mâchoires claquent avec une rapidité terrifiante, et leurs écailles irradient de chaleur. Vous devez agir vite si vous espérez survivre."
  lv_valyria_random_event.0110.a:0 "Tenir bon et combattre !"
  lv_valyria_random_event.0110.b:0 "Fuir et survivre !"

  lv_valyria_random_event.0120.t:0 "Vapeurs Toxiques"
  lv_valyria_random_event.0120.desc:0 "Une vapeur épaisse et âcre s'échappe des fissures dans le sol noirci, brûlant vos yeux et votre gorge. L'air est lourd de soufre ; chaque respiration menace de vous asphyxier. Avancer pourrait s'avérer fatal, mais battre en retraite coûterait un temps précieux."
  lv_valyria_random_event.0120.a:0 "Se couvrir la bouche et traverser."
  lv_valyria_random_event.0120.b:0 "Battre en retraite vers des chemins plus sûrs."
  lv_valyria_random_event.0120.c:0 "Brûler des provisions pour masquer l'air."

  lv_valyria_random_event.0130.t:0 "Séquelles : Maladie"
  lv_valyria_random_event.0130.desc:0 "La toux ravage votre corps tandis que la maladie s'installe dans vos poumons, sapant vos forces."
  lv_valyria_random_event.0130.a:0 "Lutter contre la fièvre."
  lv_valyria_random_event.0130.b:0 "Je me sens plus faible d'heure en heure."

  lv_valyria_random_event.0140.t:0 "Séquelles : Brûlures"
  lv_valyria_random_event.0140.desc:0 "Une douleur incandescente causée par la cendre et le soufre consume votre peau. Les cicatrices brûlent, vous rappelant combien la mort fut proche."
  lv_valyria_random_event.0140.a:0 "Vivant, enfin."

  lv_valyria_random_event.0150.t:0 "Séquelles : Retraite"
  lv_valyria_random_event.0150.desc:0 "Vous parvenez à vous retirer de l'air toxique, mais le souvenir de cette proximité avec la mort persiste, rendant chaque pas incertain."
  lv_valyria_random_event.0150.a:0 "Nous poursuivons, brisés mais vivants."

  lv_valyria_random_event.0160.t:0 "Séquelles : Provisions Sacrifiées"
  lv_valyria_random_event.0160.desc:0 "Vous avez brûlé le peu que vous aviez pour masquer les vapeurs. L'air s'est éclairci, mais la perte de ressources hante désormais chacun de vos pas."
  lv_valyria_random_event.0160.a:0 "Le sacrifice en valait la peine."
  lv_valyria_random_event.0160.b:0 "Je redoute ce que nous avons abandonné."
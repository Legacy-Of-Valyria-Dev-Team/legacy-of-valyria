  agot_EE_form_new_valyria_volantis_decision:0 "Établir l'Empire de la Nouvelle Valyria"
  agot_EE_form_new_valyria_volantis_decision_desc:0 "Restaurer une Nouvelle Valyria à partir des anciennes terres des Possessions"
  agot_EE_form_new_valyria_volantis_decision_confirm:0 "Rassembler le royaume"
  agot_EE_form_new_valyria_volantis_decision_tooltip:0 "Établir l'Empire de la Nouvelle Valyria"

  agot_EE_valyrian_restoration.1.t:0 "La Naissance de la Nouvelle Valyria"
  agot_EE_valyrian_restoration.1.desc:0 "Comme un phénix renaissant de ses cendres, la Nouvelle Valyria s'élève elle aussi! Notre bannière flotte dans chaque recoin de notre nouvel empire, portée par des vents aussi féroces que notre propre peuple.\n\nLes anciennes Possessions étaient autrefois le phare de la civilisation, un feu ardent contre les nuits les plus noires, éteint en un instant. Bien que nous ne puissions jamais atteindre à nouveau les sommets de sa grandeur, nous leur devons de nous efforcer d’atteindre une telle magnificence.\n\nEn avant, avec le feu d’une nouvelle aube ! Cette fois, Valyria subsistera"
  agot_EE_valyrian_restoration.1.a:0 "En Marche!"
  agot_EE_valyrian_restoration.1.t:0 "La Naissance de Nouvelle [valyria|E]"
  agot_EE_valyrian_restoration.1.desc:0 "Tel un phénix renaissant de ses cendres, ainsi s'élève la Nouvelle [valyria|E] ! Notre étendard flotte sur chaque recoin de notre nouvel empire, porté par des vents aussi farouches que notre peuple.\n\nLes anciens [valyrian_freehold_short|E] furent jadis le phare de la civilisation, un brasier ardent contre les plus noires des nuits—éteint en un instant. Bien que nous ne puissions peut-être jamais atteindre les sommets de sa splendeur passée, nous devons à nos ancêtres de tendre vers une telle grandeur.\n\nEn avant, avec le feu d'une nouvelle aube ! Cette fois, [valyria|E] perdurera"
  agot_EE_valyrian_restoration.1.a:0 "En avant!"
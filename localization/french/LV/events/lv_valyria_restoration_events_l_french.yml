 agot_EE_valyrian_restoration.1.t:0 "La Naissance de la Nouvelle [valyria|E]"
 agot_EE_valyrian_restoration.1.desc:0 "Tel un phénix renaissant de ses cendres, ainsi s'élève la Nouvelle Valyria ! Notre bannière flotte sur chaque recoin de notre nouvel empire, portée par des vents aussi féroces que notre propre peuple.\n\nLes anciens [valyrian_freehold_short|E] furent jadis le phare de la civilisation, un feu ardent contre les nuits les plus noires — éteint en un instant. Bien que nous ne puissions plus jamais atteindre les sommets de sa grandeur, nous devons à nos aïeux de nous efforcer d'y parvenir.\n\nEn avant, avec le feu d'une nouvelle aube ! Cette fois, [valyria|E] perdurera."
 agot_EE_valyrian_restoration.1.a:0 "En avant !"
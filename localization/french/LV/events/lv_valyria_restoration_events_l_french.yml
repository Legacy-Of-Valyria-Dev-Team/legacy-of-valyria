  agot_EE_form_new_valyria_volantis_decision:0 "Établir l'Empire de la Nouvelle [valyria|E]"
  agot_EE_form_new_valyria_volantis_decision_desc:0 "Restaurer une nouvelle [valyria|E] sur les anciennes terres des [valyrian_freehold_short|E]."
  agot_EE_form_new_valyria_volantis_decision_confirm:0 "Rassembler le royaume"
  agot_EE_form_new_valyria_volantis_decision_tooltip:0 "Établir l'Empire de la Nouvelle [valyria|E]"

  agot_EE_valyrian_restoration.1.t:0 "La Naissance de la Nouvelle [valyria|E]"
  agot_EE_valyrian_restoration.1.desc:0 "Tel un phénix renaissant de ses cendres, ainsi s'élève la Nouvelle Valyria ! Notre bannière flotte aux quatre coins de notre nouvel empire, portée par des vents aussi féroces que notre propre peuple.\n\nLes anciennes [valyrian_freehold_short|E] furent jadis le phare de la civilisation, un brasier ardent contre les nuits les plus noires, éteint en un instant. Bien que nous ne puissions peut-être jamais atteindre de nouveau les sommets de leur grandeur, nous devons à nos ancêtres de tendre vers une telle magnificence.\n\nEn avant, avec le feu d'une aube nouvelle ! Cette fois, [valyria|E] perdurera."
  agot_EE_valyrian_restoration.1.a:0 "En avant !"
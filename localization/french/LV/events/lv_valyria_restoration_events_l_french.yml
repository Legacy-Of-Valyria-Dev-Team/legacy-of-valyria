  agot_EE_form_new_valyria_volantis_decision:0 "Établir l'Empire de Nouvelle [valyria|E]"
  agot_EE_form_new_valyria_volantis_decision_desc:0 "Restaurer une nouvelle [valyria|E] à partir des anciennes terres des [valyrian_freehold_short|E]"
  agot_EE_form_new_valyria_volantis_decision_confirm:0 "Rassembler le royaume"

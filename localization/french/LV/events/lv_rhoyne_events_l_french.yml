l_french:
  agot_EE_reestablish_rhoynar_decision:0 "Unifier Les Rhoynar"
  agot_EE_reestablish_rhoynar_decision_desc:0 "L'héritage du Rhoyne est sur le point d'être restauré, unissant tout le peuple Rhoynar en un grand empire. Des rives du puissant fleuve jusqu'à chaque lointain affluent, vie et prospérité fleuriront sous une même bannière. Les marchands emplissent les voies navigables de notre empire renaissant, s'écoulant tels le sang dans chaque recoin de nos frontières. Notre peuple est désormais assuré qu'il ne sera plus jamais contraint à l'exil. L'avenir des Rhoynar commence ici, avec la promesse de force et d'unité le long de la Mère Rhoyne"
  agot_EE_reestablish_rhoynar_decision_confirm:0 "Restaurer l'Empire Rhoynar"
  agot_EE_reestablish_rhoynar_decision_tooltip:0 "Unifier le peuple Rhoynar et restaurer la prospérité des terres le long de la Mère Rhoyne"

  agot_EE_rhoynar_restoration.1.t:0 "Le Rhoyne Rétabli"
  agot_EE_rhoynar_restoration.1.desc:0 "Aujourd'hui, les habitants des rives du puissant Rhoyne s'éveillent dans un monde transformé. Car j'ai accompli ce que nul n'avait réussi depuis les temps légendaires—j'ai unifié le peuple Rhoynar à nouveau.\n\nDésormais, tandis que les marchands voyagent le long de la Mère Rhoyne et de ses innombrables affluents, vie et prospérité s'écoulent à nouveau vers chaque recoin de notre empire renaissant. Beaucoup de travail nous attend, mais une chose est certaine : jamais plus notre peuple ne sera contraint de fuir comme le fit jadis la Princesse Nymeria.\n\nL'avenir est nôtre à façonner, ici sur les rives du Rhoyne"
  agot_EE_rhoynar_restoration.1.a:0 "La Mère Rhoyne sourit à nouveau!"
l_french:
  agot_EE_reestablish_rhoynar_decision:0 "Unifier les Rhoynars"
  agot_EE_reestablish_rhoynar_decision_desc:0 "L'héritage du Rhoyne est sur le point d’être restauré, unissant tout le peuple rhoynar en un grand empire. Des rives du fleuve majestueux jusqu’à ses affluents les plus lointains, la vie et la prospérité fleuriront sous une même bannière. Les marchands rempliront les voies navigables de notre empire renaissant, s'écoulant tel le sang vers chaque recoin de nos frontières. Notre peuple sera désormais assuré qu'il ne sera plus jamais forcé à l'exil. L'avenir des Rhoynars commence ici, porté par une promesse de force et d'unité le long de la Mère Rhoyne"
  agot_EE_reestablish_rhoynar_decision_confirm:0 "Restaurer l'Empire Rhoynar"
  agot_EE_reestablish_rhoynar_decision_tooltip:0 "Unifiez le peuple rhoynar et ramenez la prospérité sur les terres bordant la Mère Rhoyne"

  agot_EE_rhoynar_restoration.1.t:0 "Le Rhoyne Restauré"
  agot_EE_rhoynar_restoration.1.desc:0 "Aujourd'hui, le long des rives du majestueux Rhoyne, les peuples s’éveillent dans un monde transformé. Car j'ai accompli ce que nul n'avait réussi depuis les âges légendaires : j'ai uni à nouveau le peuple rhoynar.\n\nDésormais, alors que les marchands voguent sur la Mère Rhoyne et ses innombrables affluents, la vie et la prospérité irriguent de nouveau chaque recoin de notre empire renaissant. De nombreux défis nous attendent, mais une chose est certaine : jamais plus notre peuple ne sera contraint à la fuite, comme le fut jadis la princesse Nymeria.\n\nL'avenir est entre nos mains, ici, sur les rives du Rhoyne"
  agot_EE_rhoynar_restoration.1.a:0 "La Mère Rhoyne sourit de nouveau!"
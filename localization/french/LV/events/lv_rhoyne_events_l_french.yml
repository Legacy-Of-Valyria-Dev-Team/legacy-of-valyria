l_french:
  agot_EE_reestablish_rhoynar_decision:0 "Unifier les Rhoynars"
  agot_EE_reestablish_rhoynar_decision_desc:0 "L'héritage de la Rhoyne est au seuil de sa restauration, unissant tous les peuples rhoynars en un seul et grand empire. Des berges du fleuve majestueux jusqu'au moindre affluent lointain, la vie et la prospérité s'épanouiront sous une même bannière. Les marchands sillonnent les voies navigables de notre empire renaissant, coulant comme le sang jusqu'aux confins de nos frontières. Notre peuple vit désormais dans la certitude qu'il ne sera plus jamais contraint à l'exil. L'avenir des Rhoynars commence ici, porteur d'une promesse de force et d'unité le long de la Mère Rhoyne."
  agot_EE_reestablish_rhoynar_decision_confirm:0 "Restaurer l'Empire Rhoynar"
  agot_EE_reestablish_rhoynar_decision_tooltip:0 "Unifier le peuple rhoynar et restaurer la prospérité des terres le long de la Mère Rhoyne"

  agot_EE_rhoynar_restoration.1.t:0 "La Rhoyne Rétablie"
  agot_EE_rhoynar_restoration.1.desc:0 "Aujourd'hui, les peuples qui vivent le long des berges de la puissante Rhoyne s'éveillent dans un monde transformé. Car j'ai accompli ce que nul n'avait réalisé depuis les temps légendaires : j'ai uni le peuple rhoynar une fois encore.\n\nDésormais, tandis que les marchands voyagent le long de la Mère Rhoyne et de ses innombrables affluents, la vie et la prospérité irriguent à nouveau chaque recoin de notre empire renaissant. Bien des travaux nous attendent encore, mais une chose est certaine : plus jamais notre peuple ne sera contraint de fuir comme la Princesse Nymeria le fit jadis.\n\nL'avenir est nôtre à façonner, ici, sur les rives de la Rhoyne."
  agot_EE_rhoynar_restoration.1.a:0 "La Mère Rhoyne sourit de nouveau !"
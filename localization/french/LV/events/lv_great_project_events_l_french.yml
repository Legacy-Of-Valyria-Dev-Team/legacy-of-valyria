 #
 lv_great_project.0001.t:0 "Rompre le Silence : [sub_region.GetName]"
 lv_great_project.0001.desc:0 "Le premier coup de pelle est un son qui n'était pas destiné à être entendu en ce lieu désolé. Les efforts de réhabilitation à [sub_region.GetName] ont commencé, un acte de blasphème contre le Fléau et le silence qu'il impose.\n\nVous avez choisi votre point d'ancrage pour ce projet monumental : une parcelle de sol noirci et ruiné, jouxtant un mur à demi effondré, peut-être jadis une villa ou une tour mineure. Tandis que vos ouvriers commencent à dégager le pire de la cendre et des débris tordus, la terre elle-même semble soupirer de refus. L'air s'alourdit, la chaleur s'intensifie.\n\nUne magie ancienne et indomptée sommeille juste sous la surface. Les graines que vous tentez de semer se flétrissent en flocons de charbon. L'eau que vous puisez d'une source proche, tiède, a le goût du soufre et de sortilèges oubliés. Chaque heure de travail n'apporte que quelques instants de progrès instable. Même à présent, le Fléau persiste dans l'attente, guettant l'occasion de rappeler à quelque prétentieux qu'il règne encore."
 lv_great_project.0001.desc.attempted:0 "Le deuxième, ou peut-être le centième coup de pelle, n'est pas ici un son nouveau — c'est un cri de défi contre le Fléau. La réhabilitation de [sub_region.GetName] n'est pas un commencement, mais une continuation épuisante de ce qui avait déjà été entrepris.\n\nVous examinez le point d'ancrage actuel. D'autres avant vous, ou vos propres entreprises antérieures, ont déjà laissé des cicatrices d'effort en Valyria : des lignes de cendre déblayée qui commencent déjà à s'estomper, des piles de pierre récupérée, et les vestiges spectraux de jardins avortés ou de fondations effondrées.\n\nVos ouvriers se meuvent avec une prudence endurcie. Ils connaissent le rythme de ce travail — le cycle des faux départs et des revirements soudains et violents. La terre ne soupire plus de refus surpris ; à présent, elle semble se moquer de votre persistance. La magie ancienne et indomptée d'ici a appris à s'attendre à l'intrusion. Elle a développé une immunité aux tentatives mineures d'ordre. Le léger goût de soufre dans l'eau et la manière dont l'air pèse sur le site sont des dangers familiers, non des surprises.\n\nLes échos du Fléau vous rappellent que vous ne combattez pas des séquelles, mais une cicatrice vivante. Cette tentative, cependant, porte le poids de tout ce qui l'a précédée. Si vous pouvez bâtir sur ces fondations fragiles et échouées, vous pourriez enfin prouver que le Fléau n'a pas le dernier mot sur [sub_region.GetName]."
 lv_great_project.0001.desc.succeeded:0 "Ce coup de pelle résonne du poids à la fois de la ruine et de la résurrection. Le sol sous [sub_region.GetName] est encore empoisonné, mais vous savez à présent que le poison peut être contré. La formule a déjà été percée ; il vous faut désormais la suivre une nouvelle fois.\n\nVous avez choisi votre point d'ancrage, non plus dans l'obscurité totale, mais dans l'ombre d'un miracle. Vos ouvriers peuvent regarder vers l'horizon de Valyria et savoir qu'une preuve existe quelque part au sein de ces terres hantées — la vision lointaine et chatoyante d'une région reconquise avec succès où les murs se dressent droits, où la fumée s'élève des foyers de cuisine plutôt que des évents de soufre, et où la vie verdoyante s'affirme. Ce savoir est la véritable fondation de cette nouvelle entreprise.\n\nMais l'inspiration n'offre guère de réconfort face à la réalité immédiate. Tandis que votre équipe commence à dégager la pierre tordue et familière et la cendre étouffante, l'air demeure épais et hostile. La résistance magique ici est tenace, peut-être unique à [sub_region.GetName], luttant contre le schéma établi de la guérison. Les premières graines peinent encore, et l'eau locale demeure âpre, comme si le Fléau lui-même refusait d'admettre sa défaite sur ce territoire précis.\n\nCeci est une épreuve monumentale. La voie a été montrée, mais le chemin n'est pas aisé. Vous ne combattez pas contre un désespoir universel, mais contre l'ultime résistance tenace de l'anéantissement. Chaque once de progrès gagnée ici est une victoire durement acquise qui étend le miracle, repoussant les frontières de la vie plus loin encore au cœur de l'empire mort."
 lv_great_project.0001.a:0 "Le combat pour Valyria commence véritablement."
 lv_great_project.0001.a.attempted:0 "Le combat pour Valyria se poursuit."
 lv_great_project.0001.a.succeeded:0 "La résurrection de Valyria est en marche."

 lv_great_project.0003.t:0 "Une Nouvelle Aube pour [sub_region.GetName]"
 lv_great_project.0003.desc:0 "Des générations parleront de ce jour. La longue nuit du Fléau connaît une nouvelle aube, et elle commence à [sub_region.GetName].\n\nVous vous tenez au point culminant de la région nouvellement réhabilitée et contemplez les nouveaux murs et les premières routes stables. Voici la première véritable cité de vie à s'élever au cœur de Valyria depuis qu'elle fut brisée par le Fléau. Le coût fut élevé, les revers écrasants, mais le résultat est un triomphe qui défie l'histoire.\n\nLe son du marteau du forgeron, les cris des marchands locaux, le murmure d'une conversation paisible. Tous ces sons nouveaux noient à présent ce qui n'était autrefois que les murmures des morts. Les mestres de la Citadelle jusqu'aux sorciers d'Asshaï raconteront ce jour peut-être jusqu'à la fin des temps.\n\nPourtant, tandis que vous contemplez la nature sauvage fumante et chaotique au-delà de vos frontières, vous ressentez un profond sentiment d'isolement. Vous avez gagné une bataille, mais la guerre pour Valyria — la lutte pour reconquérir chaque pouce en ruine — ne fait que commencer. L'héritage de Valyria repose désormais sur les épaules des vivants."
 lv_great_project.0003.desc.subsequent:0 "La longue nuit du Fléau continue de se briser. Une nouvelle et brillante étendue de ciel dégagé s'ouvre désormais sur [sub_region.GetName].\n\nVous vous tenez au point culminant de la région nouvellement réhabilitée et contemplez les nouveaux murs et les routes stables. Cette région constitue un puissant nouvel ancrage au cœur mort de Valyria, ajoutant sa force au royaume des vivants. Le coût fut écrasant, les revers légion, mais le résultat est un triomphe qui étend exponentiellement la grande œuvre.\n\nLe son du marteau du forgeron, les cris des marchands locaux, le murmure d'une conversation paisible. Tous ces sons triomphants grossissent à présent le chœur de la vie.\n\nPourtant, tandis que vous contemplez la nature sauvage fumante et chaotique au-delà de vos frontières, vous ressentez le poids profond de la tâche à venir. Vous n'avez pas achevé la guerre, mais vous avez réussi à arracher un autre trésor irremplaçable des griffes de l'anéantissement. Le combat pour Valyria se poursuit, mais avec la sécurisation de [sub_region.GetName], la victoire ultime des vivants semble plus proche que jamais. L'héritage de Valyria repose, plus solidement qu'avant, sur les épaules des vivants."
 lv_great_project.0003.a:0 "Un nouveau phare de vie brille en Valyria."

 lv_great_project.0004.t:0 "Valyria : Une Terre Renaissante"
 lv_great_project.0004.desc:0 "À travers le monde connu — des rivages de Westeros aux marchés d'épices de Qarth, des tours de la Citadelle aux temples d'Yi Ti — une seule et stupéfiante vérité se murmure, se crie, et s'écrit : Valyria revit.\n\nAprès la destruction apportée par le Fléau, l'impossible a été accompli. La région de [sub_region.GetName] a été reconquise, stabilisée et sécurisée par la volonté inébranlable de [founder.GetName] et des ouvriers qui ont défié le Fléau. L'air ici, jadis poison, est désormais respiré par les vivants. Le sol, jadis maudit, répond désormais à la charrue.\n\nLa terre de [sub_region.GetName], jadis empoisonnée et hantée par les spectres des Possessions Valyriennes étouffées, se dresse à présent comme preuve du potentiel ultime de la restauration. [founder.GetName] a défié la malédiction même qui a consumé le plus grand empire de l'histoire, et a remporté la première victoire, essentielle.\n\nQue toutes les cités et tous les royaumes sachent : la terreur demeure, les périls restent vastes, et l'ombre fumante du Fléau enveloppe encore le continent. Mais une lumière a été allumée qu'aucun vent de cendre ne saurait éteindre. La route vers Valyria n'est plus barrée par un silence total et désolé. Le vieux monde tremble, et l'ère du long et lent retour a commencé."
 lv_great_project.0004.a:0 "Que le monde sache : Valyria revit."
 lv_great_project.0004.a.other:0 "Intéressant..."

 lv_great_project.0006.t:0 "Trésors Valyriens"
 lv_great_project.0006.t.major:0 "Les Trésors des Lords Dragons"
 lv_great_project.0006.desc:0 "La terre a livré un trésor incommensurable. L'équipe de relevé a percé un tombeau — ou peut-être un coffre souterrain oublié — intact depuis que le Fléau s'est abattu sur Valyria.\n\nLa percée s'est produite sous la couche la plus profonde de cendre solidifiée : une chambre parfaitement scellée, son entrée masquée par un plafond effondré de pierre-dragon fusionnée. À l'intérieur, le monde de la Vieille Valyria demeurait figé. De grands coffres de pièces d'or et d'argent, non corrompues par le temps, gisaient empilés contre des murs gravés de texte valyrien.\n\nMais la véritable importance de la découverte se trouve plus profondément. Au-delà de la salle principale du trésor, l'équipe de relevé a trouvé des indices d'un sanctuaire intérieur distinct, hautement sécurisé. Cette chambre plus petite et hermétiquement scellée était manifestement conçue pour abriter des objets d'une rareté extrême : des objets qui pourraient rivaliser avec la valeur de royaumes entiers.\n\nVos archéologues travaillent à présent à percer avec soin les sceaux antiques gardant cette pièce intérieure. L'or est sécurisé, le coffre est ouvert, et vous attendez à présent le rapport final : les siècles de silence ont-ils préservé les artefacts qui s'y trouvent... ou le Fléau les a-t-il réclamés, ne laissant que le souvenir de leur puissance ?"
 lv_great_project.0006.a:0 "Les trésors de la Vieille Valyria ont été mis au jour !"

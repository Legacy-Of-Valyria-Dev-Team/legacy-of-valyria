  #
  lv_great_project.0001.t:0 "Briser le Silence : [sub_region.GetName]"
  lv_great_project.0001.desc:0 "Le premier coup de pelle produit un son qui n'était pas destiné à être entendu en ce lieu désolé. Les efforts de réhabilitation de [sub_region.GetName] ont commencé, un acte de blasphème contre le Fléau et le silence qu'il impose.\n\nVous avez choisi votre point d'ancrage pour ce projet monumental—une parcelle de sol noir et ruiné près d'un mur à demi effondré, peut-être autrefois une villa ou une tour mineure. Alors que vos ouvriers commencent à dégager le pire des cendres et des débris tordus, la terre elle-même semble soupirer de refus. L'air devient plus lourd, la chaleur plus intense.\n\nLa magie, ancienne et indomptée, sommeille juste sous la surface. Ce n'est pas une force que vous pouvez encore commander, mais un poison qui résiste au concept même d'ordre. Les graines que vous tentez de semer se flétrissent en flocons de charbon. L'eau que vous puisez d'une source tiède proche a un goût de soufre et de sorts oubliés. Chaque heure de travail n'accomplit que quelques instants de progrès instable. Le Fléau n'est pas parti ; il s'est simplement figé, attendant qu'un impudent lui rappelle qu'il règne encore."
  lv_great_project.0001.desc.attempted:0 "Le second, ou peut-être le centième coup de pelle n'est pas un son nouveau ici—c'est un cri de défiance contre le Fléau. La réhabilitation de [sub_region.GetName] n'est pas un commencement, mais la continuation harassante de ce qui a déjà été entrepris.\n\nVous examinez le point d'appui actuel. D'autres avant vous, ou vos propres efforts antérieurs, ont déjà laissé des cicatrices d'effort dans Valyria : des lignes de cendres dégagées qui commencent déjà à s'estomper, des piles de pierres récupérées, et les vestiges fantomatiques de jardins échoués ou de fondations effondrées.\n\nVos ouvriers avancent avec une prudence endurcie. Ils connaissent le rythme de ce travail—le cycle de faux départs et de revers soudains et violents. La terre ne soupire plus de refus surpris ; maintenant, on dirait qu'elle se moque de votre persistance. La magie ancienne et indomptée d'ici a appris à s'attendre aux intrusions. Elle a développé une immunité aux tentatives mineures d'ordre. Le goût subtil de soufre dans l'eau et la façon dont l'air pèse sur le site sont des dangers familiers, pas des surprises.\n\nLes échos du Fléau vous rappellent que vous ne combattez pas des séquelles, mais une cicatrice vivante. Cette tentative, cependant, porte le poids de tout ce qui précède. Si vous pouvez construire sur ces fondations fragiles et ratées, vous pourriez enfin prouver que le Fléau n'a pas le dernier mot sur [sub_region.GetName]."
  lv_great_project.0001.desc.succeeded:0 "Ce coup de pelle résonne du poids de la ruine et de la résurrection. Le sol sous [sub_region.GetName] est encore empoisonné, mais maintenant vous savez que le poison peut être contré. La formule a déjà été percée ; maintenant, vous devez la suivre une fois de plus.\n\nVous avez choisi votre point d'appui, non pas entièrement dans l'obscurité, mais dans l'ombre d'un miracle. Vos ouvriers peuvent regarder l'horizon de Valyria et savoir qu'il existe une preuve quelque part dans ces terres hantées—la vision distante et scintillante d'une région récupérée avec succès où les murs se dressent droits, où la fumée s'élève des feux de cuisine au lieu des évents de soufre, et où la vie verte s'affirme. Cette connaissance est la vraie fondation de ce nouvel effort.\n\nMais l'inspiration offre peu de réconfort contre la réalité immédiate. Alors que votre équipe commence à dégager les pierres tordues familières et les cendres étouffantes, l'air reste épais et hostile. La résistance magique ici est tenace, peut-être unique à [sub_region.GetName], luttant contre le modèle établi de guérison. Les premières graines peinent encore, et l'eau locale reste âpre, comme si le Fléau lui-même refusait d'admettre sa défaite sur ce territoire spécifique.\n\nC'est une épreuve monumentale. La voie a été montrée, mais le chemin n'est pas facile. Vous ne luttez pas contre le désespoir universel, mais contre la résistance obstinée et finale de l'annihilation. Chaque once de progrès que vous gagnez ici est une victoire durement gagnée qui étend le miracle, poussant les frontières de la vie plus loin dans le cœur de l'empire mort."
  lv_great_project.0001.a:0 "Le combat pour Valyria commence véritablement."
  lv_great_project.0001.a.attempted:0 "Le combat pour Valyria continue."
  lv_great_project.0001.a.succeeded:0 "La résurrection de Valyria est en cours."

  lv_great_project.0003.t:0 "Une Aube Nouvelle pour [sub_region.GetName]"
  lv_great_project.0003.desc:0 "Les générations parleront de ce jour. La longue nuit du Fléau a une nouvelle aube, et elle commence à [sub_region.GetName].\n\nVous vous tenez sur le point le plus élevé de la région nouvellement réhabilitée et contemplez les nouveaux murs et les premières routes stables. C'est la première vraie cité de vie à s'élever au cœur de Valyria depuis qu'elle fut brisée par le Fléau. Le coût fut élevé, les revers écrasants, mais le résultat est un triomphe qui défie l'histoire.\n\nLe son du marteau du forgeron, les cris des marchands locaux, le murmure des conversations stables. Tous ces nouveaux sons noient les murmures des morts. Les mestres de la Citadelle aux sorciers d'Asshai parleront de ce jour jusqu'à peut-être la fin de tous les jours.\n\nPourtant, alors que vous regardez vers la nature sauvage fumante et chaotique au-delà de vos frontières, vous ressentez un profond sentiment d'isolement. Vous avez gagné une bataille, mais la guerre pour Valyria—la lutte pour récupérer chaque pouce ruiné—ne fait que commencer. L'héritage de Valyria repose maintenant sur les épaules des vivants."
  lv_great_project.0003.desc.subsequent:0 "La longue nuit du Fléau continue de se briser. Une nouvelle étendue brillante de ciel clair s'ouvre maintenant sur [sub_region.GetName].\n\nVous vous tenez sur le point le plus élevé de la région nouvellement réhabilitée et contemplez les nouveaux murs et les routes stables. Cette région est un nouvel ancrage puissant dans le cœur mort de Valyria, ajoutant sa force au royaume des vivants. Le coût fut écrasant, les revers légion, mais le résultat est un triomphe qui étend exponentiellement le grand œuvre.\n\nLe son du marteau du forgeron, les cris des marchands locaux, le murmure des conversations stables. Tous ces sons triomphants gonflent maintenant le chœur de la vie.\n\nPourtant, alors que vous regardez vers la nature sauvage fumante et chaotique au-delà de vos frontières, vous ressentez le poids profond de la tâche à venir. Vous n'avez pas terminé la guerre, mais vous avez arraché avec succès un autre prix irremplaçable des griffes de l'annihilation. Le combat pour Valyria continue, mais avec la sécurisation de [sub_region.GetName], la victoire ultime des vivants semble plus proche que jamais. L'héritage de Valyria repose, plus sûrement qu'avant, sur les épaules des vivants."
  lv_great_project.0003.a:0 "Un nouveau phare de vie brille dans Valyria."

  lv_great_project.0004.t:0 "Valyria : Une Terre Renaissante"
  lv_great_project.0004.desc:0 "À travers le monde connu—des rivages de Westeros aux marchés d'épices de Qarth, des tours de la Citadelle aux temples de Yi Ti—une seule vérité stupéfiante est murmurée, criée et écrite : Valyria vit à nouveau.\n\nAprès la destruction apportée par le Fléau, l'impossible a été accompli. La région de [sub_region.GetName] a été récupérée, stabilisée et sécurisée par la volonté inébranlable de [founder.GetName] et des ouvriers qui ont défié le Fléau. L'air ici, autrefois poison, est maintenant respiré par les vivants. Le sol, autrefois maudit, répond maintenant à la charrue.\n\nLa terre de [sub_region.GetName], autrefois empoisonnée et hantée par les fantômes des Possessions étouffées, se dresse maintenant comme preuve du potentiel ultime de restauration. [founder.GetName] a défié la malédiction même qui a consumé le plus grand empire de l'histoire, et a remporté la première victoire vitale.\n\nQue toutes les cités et royaumes le sachent : La terreur demeure, les périls sont encore vastes, et l'ombre fumante du Fléau englobe toujours le continent. Mais une lumière a été allumée qu'aucune cendre ne peut éteindre. La route vers Valyria n'est plus barrée par un silence total et désolé. Le vieux monde tremble, et l'âge du long et lent retour a commencé."
  lv_great_project.0004.a:0 "Que le monde le sache : Valyria vit à nouveau."
  lv_great_project.0004.a.other:0 "Intéressant..."

  lv_great_project.0006.t:0 "Trésors Valyriens"
  lv_great_project.0006.t.major:0 "Les Trésors des Lords Dragons"
  lv_great_project.0006.desc:0 "La terre a livré un trésor inestimable. L'équipe d'exploration a percé une tombe—ou peut-être une chambre forte souterraine oubliée—intouchée depuis que le Fléau s'est abattu sur Valyria.\n\nLa percée est venue sous la couche la plus profonde de cendres solidifiées : une chambre parfaitement scellée, son entrée masquée par un plafond effondré de pierredragon fusionnée. À l'intérieur, le monde de l'Ancienne Valyria demeurait figé. De grands coffres de pièces d'or et d'argent, incorrompus par le temps, étaient empilés contre des murs gravés de texte valyrien.\n\nMais la vraie signification de la découverte se trouve plus profondément. Au-delà de la salle du trésor principal, l'équipe d'exploration a trouvé des preuves d'un sanctuaire intérieur séparé et hautement sécurisé. Cette chambre plus petite et hermétiquement scellée était clairement conçue pour abriter des objets d'extrême rareté : des objets qui pourraient rivaliser avec la valeur de royaumes entiers.\n\nVos archéologues travaillent maintenant à briser soigneusement les sceaux anciens gardant cette pièce intérieure. L'or est sécurisé, la chambre forte est ouverte, et maintenant vous attendez le rapport final : Les siècles de silence ont-ils préservé les artefacts à l'intérieur... ou le Fléau les a-t-il réclamés, ne laissant que le souvenir de leur pouvoir ?"
  lv_great_project.0006.a:0 "Les trésors de l'Ancienne Valyria ont été exhumés !"

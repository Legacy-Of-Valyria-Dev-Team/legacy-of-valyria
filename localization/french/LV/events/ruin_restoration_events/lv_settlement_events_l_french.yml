l_french:
 ## Expedition Events
 lv_settlement_event.0001.t:0 "Reconquérir ce qui fut Perdu"
 lv_settlement_event.0001.desc:0 "Le temps est venu d'agir sur vos ambitions. Les terres dévastées ont été relevées, et un plan est en place — périlleux, certes, mais l'occasion de rendre la vie à ces terres délaissées est à portée de main. Il faudra tracer les routes, rassembler les provisions, recruter des colons, et désigner un chef. Reste la question : qui guidera cette entreprise fondatrice ?"
 lv_settlement_event.0001.a:0 "Je reprendrai [ruin.GetNameNoTooltip] moi-même."
 lv_settlement_event.0001.b:0 "Un courtisan de confiance revendiquera la terre en mon nom."
 lv_settlement_event.0001.c:0 "J'enverrai un vassal loyal."
 lv_settlement_event.0001.d:0 "Ce n'est pas le moment opportun pour cela."

 lv_settlement_event.0002.t:0 "Reconquérir ce qui fut Perdu"
 lv_settlement_event.0002.desc:0 "Le temps est venu d'agir sur vos ambitions. Les terres dévastées ont été relevées, et un plan est en place — périlleux, certes, mais l'occasion de rendre la vie à ces terres délaissées est à portée de main. Il faudra tracer les routes, rassembler les provisions, recruter des colons, et désigner un chef. Reste la question : qui guidera cette entreprise fondatrice ?"
 lv_settlement_event.0002.a:0 "Fort bien."
 lv_settlement_event.0002.b:0 "J'ai changé d'avis."

 lv_settlement_event.0003.t:0 "Un Ordre Venu d'En Haut"
 lv_settlement_event.0003.desc:0 "Un messager arrive, porteur du sceau de votre suzerain et d'une convocation lourde de sens. Vous devez mener une expédition pour reconquérir et coloniser [ruin.GetName] — en ruine, sauvage, à demi engloutie par le temps. Ce n'est pas une mince tâche : le voyage est long, l'issue incertaine, et le fardeau du commandement pesant.\n\nMais qui dit risque dit récompense. Si la colonie prend racine, elle pourrait apporter gloire, richesse et héritage durable. Et si elle échoue... le récit vous en incombera.\n\nSoldats et colons attendent votre parole. La bannière ne s'élève pas encore — mais tous les regards se tournent vers vous."
 lv_settlement_event.0003.a:0 "Je veillerai à ce que cela soit fait. Qu'on dise que j'ai taillé mon nom dans la ruine."
 lv_settlement_event.0003.a.tt:0 "Vous acceptez l'ordre et vous préparez à mener l'expédition au nom de votre suzerain."
 lv_settlement_event.0003.b:0 "Qu'un autre poursuive ombres et poussière."
 lv_settlement_event.0003.b.tt:0 "Vous déclinez respectueusement la mission, laissant votre suzerain trouver quelqu'un d'autre."

 lv_settlement_accepted:0 "Le sujet accepte de diriger l'expédition"
 lv_settlement_accepted_desc:0 "[settler.GetName] a accepté de mener l'expédition vers [ruin.GetName]."

 lv_settlement_event.0004.t:0 "Un Refus Reçu"
 lv_settlement_event.0004.desc:0 "La réponse revient non par la trompette de l'assentiment, mais par le silence et une lettre scellée. Votre vassal désigné, pour ses propres raisons, a décliné l'honneur — et le fardeau — de mener l'expédition. Que ce soit par prudence, par mépris, ou par simple pragmatisme, la tâche a été refusée.\n\nLes colons attendent toujours. Les chariots demeurent chargés. La route se poursuit, mais il semble que vous deviez en désigner un autre pour l'emprunter... ou attendre un moment plus propice à une telle ambition."
 lv_settlement_event.0004.tt:0 "[rejector.GetName] a décliné l'offre de mener l'expédition vers [ruin.GetName]. Vous ne pourrez pas le lui redemander avant 6 mois."
 lv_settlement_event.0004.a:0 "Alors je trouverai quelqu'un de plus déterminé."
 lv_settlement_event.0004.a.tt:0 "Vous chercherez quelqu'un d'autre disposé à relever le défi."
 lv_settlement_event.0004.b:0 "Les vents ne sont pas favorables à cela. Pas encore."
 lv_settlement_event.0004.b.tt:0 "Vous décidez d'attendre un moment plus opportun pour entreprendre l'expédition."

 lv_settlement_event.0010.t:0 "En Route vers [ruin.GetNameNoTooltip]"
 lv_settlement_event.0010.desc.self:0 "Les derniers préparatifs sont achevés. Les provisions sont mesurées, les outils inspectés, et les derniers chariots arrimés sous un ciel matinal gris. Votre monture attend en tête de la caravane, son souffle formant de la buée dans l'air glacé. Derrière vous se trouvent les conforts de la cour, le murmure des serviteurs et des intendants, le poids aisé du commandement. Devant : des routes brisées, de longues journées, et une terre qui ne se souvient que du feu et du silence.\n\nVous n'êtes plus simple voyageur à présent, mais porteur d'un héritage. À chaque battement de sabot et grincement de roue, vous portez le poids de votre nom vers un lieu qui pourrait — si les dieux le veulent bien — renaître de la ruine.\n\nTandis que les portes s'ouvrent et que le vent agite votre cape, vos courtisans s'inclinent en silence, certains se signant, d'autres observant avec gravité. La voie est tracée. La terre n'attendra pas éternellement."
 lv_settlement_event.0010.desc.other:0 "Votre chef désigné se tient en selle, son armure polie, ses bannières roulées pour la longue route à venir. Derrière lui se rassemble la caravane de l'expédition — artisans et gardes, chariots tirés par des bœufs, et gens rudes aux mains calleuses et aux regards méfiants. Le capitaine désigné vous salue une dernière fois depuis sa selle, un vœu silencieux échangé entre vous deux. Ils ne partent pas simplement pour dompter la nature sauvage, mais pour hisser votre étendard au-dessus des ossements de ce qui fut.\n\nLe voyage sera long, et tous ceux qui partiront ne reviendront pas nécessairement. Mais avec de la chance et un commandement solide, la colonie s'élèvera, pierre après pierre, sous votre nom.\n\nDéjà, les portes grincent en s'ouvrant. Déjà, la poussière commence à s'élever."
 lv_settlement_event.0010.a:0 "Vers la promesse d'un nouveau commencement."

 lv_settlement_event.0011.t.self_liege:0 "De Ma Propre Main"
 lv_settlement_event.0011.t.self_non_liege:0 "Au Nom de Mon Suzerain"
 lv_settlement_event.0011.t.other_liege:0 "La Bannière S'Élève"
 lv_settlement_event.0011.t.other_non_liege:0 "Une Flamme Ranimée"
 lv_settlement_event.0011.desc.self_liege:0 "Le sol est retourné, les murs élevés, et les feux allumés. Ce qui gisait jadis étouffé de cendre et de broussaille résonne à présent du rythme des marteaux et de l'espoir. Vous ne vous êtes pas tenu derrière des salles de commandement ou des parchemins — mais sous le ciel ouvert, guidant chaque pierre, chaque âme.\n\nLe peuple prononce votre nom non seulement comme celui d'un lord ou d'une lady, mais comme celui d'un fondateur. Une conquête gagnée par le courage, taillée dans la sueur et le fer. Ce lieu respire parce que vous avez osé le mener."
 lv_settlement_event.0011.desc.self_non_liege:0 "Vos bottes furent les premières à fouler les vieilles pierres. C'est de votre main que les tentes furent dressées, les défenses posées, et les colons affermis dans leur tâche. Ce qui s'élève ici appartiendra peut-être à votre suzerain — mais cela se dresse parce que vous l'avez voulu.\n\nCertains oublieront. Les nobles de la cour porteront peut-être un toast à votre réussite en mots creux. Mais les colons, eux, ne l'oublieront pas. Ni la terre."
 lv_settlement_event.0011.desc.other_liege:0 "L'expédition que vous avez commandée a porté ses fruits. Votre chef désigné rapporte que les premières pierres ont été posées et que des feux réchauffent désormais le ventre des colons. C'est un commencement, humble peut-être, mais porté sur les épaules de votre vision.\n\nLa nature sauvage recule — ne fût-ce que de quelques pouces — et la terre s'agite à nouveau au son des bannières et de la loi. Avec le temps, elle prospérera. Avec le temps, elle se souviendra de la bannière qui l'a rendu possible."
 lv_settlement_event.0011.desc.other_non_liege:0 "Les corbeaux parlent de renouveau. Loin de vos propres terres, une province oubliée s'agite à présent de vie — ses ruines déblayées, ses murs s'élevant de nouveau sous le commandement d'un seigneur lointain. Qu'ils aient été poussés par l'ambition, le devoir, ou la folie, ils ont réussi.\n\nOn dit que le vieux monde dort sous les cendres. Peut-être commence-t-il à présent à s'éveiller."
 lv_settlement_event.0011.a.self_liege:0 "Que cette terre se souvienne de qui lui a donné vie."
 lv_settlement_event.0011.a.self_non_liege:0 "Ce n'était pas la gloire que je cherchais — mais je l'ai gagnée tout de même."
 lv_settlement_event.0011.a.other_liege:0 "Que le royaume sache que cette terre fut reconquise sur ma parole."
 lv_settlement_event.0011.a.other_non_liege:0 "Mieux vaut garder un œil sur de telles choses."

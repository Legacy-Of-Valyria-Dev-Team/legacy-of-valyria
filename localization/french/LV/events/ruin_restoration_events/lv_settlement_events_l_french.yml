l_french:
  ## Expedition Events
  lv_settlement_event.0001.t:0 "Reconquérir ce qui fut Perdu"
  lv_settlement_event.0001.desc:0 "Le temps est venu d'agir selon vos ambitions. Les terres brisées ont été arpentées, et un plan est en place : bien que périlleux, l'occasion de redonner vie à ces contrées abandonnées est à portée de main. Les routes doivent être cartographiées, les provisions rassemblées, les colons recrutés, et un chef désigné. La question demeure : qui guidera cette entreprise fondatrice ?"
  lv_settlement_event.0001.a:0 "Je récupérerai [ruin.GetNameNoTooltip] en personne."
  lv_settlement_event.0001.b:0 "Un courtisan de confiance revendiquera la terre en mon nom."
  lv_settlement_event.0001.c:0 "J'enverrai un vassal loyal."
  lv_settlement_event.0001.d:0 "Le moment n'est pas propice pour cela."

  lv_settlement_event.0002.t:0 "Reconquérir ce qui fut Perdu"
  lv_settlement_event.0002.desc:0 "Le temps est venu d'agir selon vos ambitions. Les terres brisées ont été arpentées, et un plan est en place : bien que périlleux, l'occasion de redonner vie à ces contrées abandonnées est à portée de main. Les routes doivent être cartographiées, les provisions rassemblées, les colons recrutés, et un chef désigné. La question demeure : qui guidera cette entreprise fondatrice ?"
  lv_settlement_event.0002.a:0 "Splendide."
  lv_settlement_event.0002.b:0 "J'ai changé d'avis."

  lv_settlement_event.0003.t:0 "Un Ordre Venu d'En Haut"
  lv_settlement_event.0003.desc:0 "Un messager arrive, portant le sceau de votre suzerain et une convocation lourde de sous-entendus. Vous devez mener une expédition pour reconquérir et coloniser [ruin.GetName], en ruines, sauvage, et à moitié engloutie par le temps. Ce n'est pas mince tâche : le voyage est long, l'issue incertaine, et le fardeau du commandement pesant.\n\nMais avec le risque vient la récompense. Si la colonie prend racine, elle pourrait apporter gloire, richesse et un héritage durable. Et si elle échoue... le récit sera vôtre à porter.\n\nSoldats et colons attendent votre parole. La bannière ne s'élève pas encore, mais tous les regards se tournent vers vous."
  lv_settlement_event.0003.a:0 "J'y veillerai. Qu'on dise que j'ai gravé mon nom dans la ruine."
  lv_settlement_event.0003.a.tt:0 "Vous acceptez le commandement et vous préparez à mener l'expédition au nom de votre suzerain."
  lv_settlement_event.0003.b:0 "Qu'un autre pourchasse ombres et poussière."
  lv_settlement_event.0003.b.tt:0 "Vous déclinez respectueusement la mission, laissant votre suzerain trouver quelqu'un d'autre."

  lv_settlement_accepted:0 "Le sujet accepte la direction de l'expédition"
  lv_settlement_accepted_desc:0 "[settler.GetName] a accepté de mener l'expédition vers [ruin.GetName]."

  lv_settlement_event.0004.t:0 "Un Refus en Retour"
  lv_settlement_event.0004.desc:0 "La réponse revient non avec la trompette de l'assentiment, mais avec le silence et une lettre scellée. Votre vassal désigné, pour des raisons qui lui sont propres, a décliné l'honneur, et le fardeau, de mener l'expédition. Que ce soit par prudence, mépris, ou simple pragmatisme, la tâche a été refusée.\n\nLes colons attendent toujours. Les chariots demeurent chargés. La route serpente au loin, mais il semble que vous devrez en nommer un autre pour la parcourir... ou attendre que le temps soit plus propice à de telles ambitions."
  lv_settlement_event.0004.tt:0 "[rejector.GetName] a décliné de mener l'expédition vers [ruin.GetName]. Vous ne pourrez pas le lui demander à nouveau pendant 6 mois."
  lv_settlement_event.0004.a:0 "Alors je trouverai quelqu'un de plus résolu."
  lv_settlement_event.0004.a.tt:0 "Vous chercherez quelqu'un d'autre disposé à relever le défi."
  lv_settlement_event.0004.b:0 "Les vents ne sont pas favorables pour cela. Pas encore."
  lv_settlement_event.0004.b.tt:0 "Vous décidez d'attendre un moment plus opportun pour entreprendre l'expédition."

  lv_settlement_event.0010.t:0 "En Route vers [ruin.GetNameNoTooltip]"
  lv_settlement_event.0010.desc.self:0 "Les derniers préparatifs sont achevés. Les provisions sont mesurées, les outils inspectés, et les derniers chariots arrimés sous des cieux matinaux gris. Votre monture attend à la tête de la caravane, son souffle embuant l'air froid. Derrière vous gisent les conforts de la cour, le murmure des serviteurs et intendants, le poids facile du commandement. Devant : des routes brisées, de longues journées, et une terre qui ne se souvient que du feu et du silence.\n\nVous n'êtes plus simple voyageur désormais, mais porteur d'un héritage. À chaque coup de sabot et cliquetis de roue, vous portez le poids de votre nom vers un lieu qui pourrait, si les dieux sont cléments, renaître de la ruine.\n\nTandis que les portes s'ouvrent et que le vent agite votre cape, vos courtisans s'inclinent en silence, certains se signant, d'autres observant d'un air sombre. La voie est tracée. La terre n'attendra pas éternellement."
  lv_settlement_event.0010.desc.other:0 "Votre chef choisi est en selle, armure polie, bannières roulées pour la longue route à venir. Derrière lui se rassemble la caravane de l'expédition : artisans et gardes, chariots tirés par des bœufs, et gens rudes aux mains calleuses et aux regards méfiants. Le capitaine désigné vous salue une dernière fois depuis sa selle, un vœu silencieux passant entre vous deux. Ils ne partent pas simplement pour dompter les terres sauvages, mais pour élever votre étendard au-dessus des ossements de ce qui fut.\n\nLe voyage sera long, et tous ceux qui partiront ne reviendront peut-être pas. Mais avec chance et fort commandement, la colonie s'élèvera, pierre après pierre, sous votre nom.\n\nDéjà, les portes grincent en s'ouvrant. Déjà, la poussière commence à s'élever."
  lv_settlement_event.0010.a:0 "Vers la promesse d'un nouveau commencement."

  lv_settlement_event.0011.t.self_liege:0 "De Ma Propre Main"
  lv_settlement_event.0011.t.self_non_liege:0 "Au Nom de Mon Suzerain"
  lv_settlement_event.0011.t.other_liege:0 "La Bannière S'Élève"
  lv_settlement_event.0011.t.other_non_liege:0 "Une Flamme Ravivée"
  lv_settlement_event.0011.desc.self_liege:0 "Le sol est défriché, les murs dressés, et les feux allumés. Ce qui gisait jadis étouffé sous les cendres et les broussailles résonne désormais du rythme des marteaux et de l'espoir. Vous ne vous teniez pas derrière des salles de commandement ou des parchemins, mais sous le ciel ouvert, guidant chaque pierre, chaque âme.\n\nLe peuple prononce votre nom non seulement comme seigneur ou dame, mais comme fondateur. Une revendication gagnée par le courage, gravée par la sueur et le fer. Ce lieu respire parce que vous avez osé mener."
  lv_settlement_event.0011.desc.self_non_liege:0 "Vos bottes furent les premières à fouler les vieilles pierres. C'est de votre main que les tentes furent dressées, les défenses établies, et les colons endurcis à la tâche. Ce qui s'élève ici appartient peut-être à votre suzerain, mais cela tient debout parce que vous l'avez voulu.\n\nCertains oublieront. Les nobles à la cour porteront peut-être des toasts à votre succès avec des mots creux. Mais les colons n'oublieront pas. Ni la terre."
  lv_settlement_event.0011.desc.other_liege:0 "L'expédition que vous avez commandée a porté ses fruits. Votre chef désigné rapporte que les premières pierres ont été posées et que les feux réchauffent désormais le ventre des colons. C'est un commencement, humble peut-être, mais porté sur le dos de votre vision.\n\nLes terres sauvages sont repoussées, ne serait-ce que de quelques pouces, et la terre s'éveille à nouveau à l'appel des bannières et de la loi. Avec le temps, elle prospérera. Avec le temps, elle se souviendra de quelle bannière l'a rendue possible."
  lv_settlement_event.0011.desc.other_non_liege:0 "Les corbeaux parlent de renouveau. Loin de vos propres terres, une province oubliée s'éveille maintenant à la vie, ses ruines dégagées, ses murs s'élevant à nouveau sous le commandement d'un seigneur lointain. Qu'ils aient été poussés par l'ambition, le devoir ou la folie, ils ont réussi.\n\nOn dit que l'ancien monde dort sous les cendres. Peut-être commence-t-il maintenant à s'éveiller."
  lv_settlement_event.0011.a.self_liege:0 "Que cette terre se souvienne de qui lui a donné vie."
  lv_settlement_event.0011.a.self_non_liege:0 "Ce n'était pas la gloire que je cherchais, mais je l'ai gagnée malgré tout."
  lv_settlement_event.0011.a.other_liege:0 "Que le royaume sache que cette terre fut reconquise par ma parole."
  lv_settlement_event.0011.a.other_non_liege:0 "Mieux vaut garder un œil sur de telles choses."
  
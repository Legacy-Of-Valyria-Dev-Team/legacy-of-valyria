l_french:
  ## Expedition Events
  lv_settlement_event.0001.t:0 "Reconquérir ce qui fut perdu"
  lv_settlement_event.0001.desc:0 "L'heure est venue de concrétiser vos ambitions les plus audacieuses. Les terres dévastées ont été méticuleusement arpentées, et un plan d'action s'est dessiné - périlleux certes, mais l'opportunité de redonner la vie à ces contrées maudites demeure à portée de main. Il convient désormais d'établir les routes, de rassembler les provisions nécessaires, de recruter des colons courageux, et de désigner un meneur digne de confiance. La question cruciale demeure : qui guidera cette entreprise fondatrice vers la gloire ou vers la perdition ?"
  lv_settlement_event.0001.a:0 "Je reconquerrai [ruin.GetNameNoTooltip] de mes propres mains."
  lv_settlement_event.0001.b:0 "Un courtisan de confiance revendiquera ces terres en mon nom."
  lv_settlement_event.0001.c:0 "J'enverrai un vassal fidèle mener cette entreprise."
  lv_settlement_event.0001.d:0 "Le moment n'est point encore propice à pareille aventure."

  lv_settlement_event.0002.t:0 "Reconquérir ce qui fut perdu"
  lv_settlement_event.0002.desc:0 "L'heure est venue de concrétiser vos ambitions les plus audacieuses. Les terres dévastées ont été méticuleusement arpentées, et un plan d'action s'est dessiné - périlleux certes, mais l'opportunité de redonner la vie à ces contrées maudites demeure à portée de main. Il convient désormais d'établir les routes, de rassembler les provisions nécessaires, de recruter des colons courageux, et de désigner un meneur digne de confiance. La question cruciale demeure : qui guidera cette entreprise fondatrice vers la gloire ou vers la perdition ?"
  lv_settlement_event.0002.a:0 "Parfait."
  lv_settlement_event.0002.b:0 "J'ai changé d'avis."

  lv_settlement_event.0003.t:0 "Un commandement d'en haut"
  lv_settlement_event.0003.desc:0 "Un messager fait son apparition, porteur du sceau de votre suzerain et d'une convocation lourde d'implications. Vous voici désigné pour mener une expédition destinée à reconquérir et coloniser [ruin.GetName] - territoire en ruine, livré à la sauvagerie, et à demi englouti par les affres du temps. La tâche n'est point aisée : le voyage s'annonce long, l'issue incertaine, et le fardeau du commandement pesant.\n\nMais avec le péril vient la récompense. Si la colonie prend racine, elle pourrait apporter la gloire, les richesses et un héritage durable. Et si elle venait à échouer... ce récit d'échec sera vôtre à porter pour l'éternité.\n\nLes soldats et les colons attendent votre parole. L'étendard ne s'élève point encore - mais tous les regards convergent vers vous."
  lv_settlement_event.0003.a:0 "Je verrai cette œuvre accomplie. Que l'on dise que j'ai gravé mon nom dans les ruines."
  lv_settlement_event.0003.a.tt:0 "Vous acceptez le commandement et vous préparez à mener l'expédition au nom de votre suzerain."
  lv_settlement_event.0003.b:0 "Qu'un autre poursuive donc les ombres et la poussière."
  lv_settlement_event.0003.b.tt:0 "Vous déclinez respectueusement cette mission, contraignant votre suzerain à trouver quelqu'un d'autre."

  lv_settlement_event.0004.t:0 "Un refus qui fait retour"
  lv_settlement_event.0004.desc:0 "Les nouvelles ne reviennent point accompagnées de fanfares d'acquiescement, mais dans le silence et par une lettre scellée. Votre vassal désigné, pour des raisons qui lui sont propres, a décliné l'honneur - et le fardeau - de diriger cette expédition. Que ce soit par prudence, par mépris, ou par simple pragmatisme, la tâche a été refusée.\n\nLes colons attendent toujours. Les chariots demeurent chargés. La route serpente au loin, mais il vous faut désormais nommer un autre pour la parcourir... ou patienter jusqu'à ce que les temps soient mieux disposés à de telles ambitions."
  lv_settlement_event.0004.a:0 "Je trouverai donc quelqu'un doté d'une plus grande résolution."
  lv_settlement_event.0004.a.tt:0 "Vous chercherez un autre volontaire prêt à relever ce défi."
  lv_settlement_event.0004.b:0 "Les vents ne soufflent point favorablement pour cela. Pas encore."
  lv_settlement_event.0004.b.tt:0 "Vous décidez d'attendre un moment plus opportun pour entreprendre cette expédition."

  lv_settlement_event.0010.t:0 "En route vers [ruin.GetNameNoTooltip]"
  lv_settlement_event.0010.desc.self:0 "Les ultimes préparatifs sont achevés. Les provisions ont été soigneusement mesurées, les outils minutieusement inspectés, et les derniers chariots solidement sanglés sous un ciel matinal couleur de plomb. Votre monture piétine d'impatience à la tête de la caravane, son souffle formant des volutes de vapeur dans l'air glacial. Derrière vous s'étendent les conforts de la cour, le murmure familier des serviteurs et des intendants, le poids rassurant du commandement quotidien. Devant vous : des routes brisées, de longues journées d'épreuve, et une terre qui ne se souvient plus que du feu et du silence.\n\nVous n'êtes plus un simple voyageur désormais, mais le porteur d'un héritage. À chaque battement de sabot et grincement de roue, vous transportez le poids de votre nom vers un lieu qui pourrait - si les dieux se montrent cléments - renaître de ses ruines.\n\nTandis que les portes s'ouvrent et que le vent fait claquer votre manteau, vos courtisans s'inclinent en silence, certains se signant, d'autres observant d'un air sombre. La voie est tracée. La terre n'attendra pas éternellement."
  lv_settlement_event.0010.desc.other:0 "Votre chef désigné se tient en selle, l'armure rutilante, les bannières repliées pour le long périple qui s'annonce. Derrière lui se rassemble la caravane de l'expédition - des artisans et des gardes, des chariots tirés par des bœufs, et de rudes gens aux mains calleuses et aux regards méfiants. Le capitaine nommé vous salue une dernière fois depuis sa monture, un serment silencieux passant entre vous. Il ne part point seulement dompter la nature sauvage, mais hisser votre étendard au-dessus des ossements de ce qui fut.\n\nLe voyage sera long, et tous ceux qui prennent la route ne reviendront peut-être point. Mais avec de la chance et un commandement ferme, la colonie s'élèvera, pierre après pierre, sous l'égide de votre nom.\n\nDéjà, les portes grincent en s'ouvrant. Déjà, la poussière commence à s'élever."
  lv_settlement_event.0010.a:0 "Vers la promesse d'un nouveau commencement."

  lv_settlement_event.0011.t.self_liege:0 "De ma propre main"
  lv_settlement_event.0011.t.self_non_liege:0 "Au nom de mon suzerain"
  lv_settlement_event.0011.t.other_liege:0 "L'étendard s'élève"
  lv_settlement_event.0011.t.other_non_liege:0 "Une flamme ravivée"
  lv_settlement_event.0011.desc.self_liege:0 "Le sol a été brisé, les murailles érigées, et les feux allumés. Ce qui gisait jadis étouffé sous les cendres et la végétation sauvage résonne désormais du rythme des marteaux et de l'espoir renaissant. Vous ne vous teniez point derrière les salles de commandement ou les parchemins - mais sous le ciel ouvert, guidant chaque pierre, chaque âme vers leur destinée.\n\nLe peuple prononce votre nom non seulement comme celui d'un seigneur ou d'une dame, mais comme celui d'un fondateur. Une revendication conquise par le courage, taillée dans la sueur et le fer. Ce lieu respire parce que vous avez osé mener."
  lv_settlement_event.0011.desc.self_non_liege:0 "Vos bottes furent les premières à fouler les pierres ancestrales. Ce fut de votre main que les tentes s'élevèrent, que les défenses prirent forme, et que les colons trouvèrent le courage nécessaire à leur tâche. Ce qui s'élève ici appartient peut-être à votre suzerain - mais cela tient debout parce que vous l'avez voulu.\n\nCertains oublieront. Les nobles de la cour pourront porter un toast à votre succès avec des mots creux. Mais les colons n'oublieront point. Pas plus que la terre elle-même."
  lv_settlement_event.0011.desc.other_liege:0 "L'expédition que vous avez commandée a porté ses fruits. Votre chef désigné rapporte que les premières pierres ont été posées et que les feux réchauffent désormais le ventre des colons. C'est un commencement - humble peut-être, mais porté par la force de votre vision.\n\nLa sauvagerie recule - ne serait-ce que de quelques toises - et la terre s'éveille de nouveau à l'appel des bannières et de la loi. Le temps venu, elle prospérera. Le temps venu, elle se souviendra de l'étendard qui rendit cela possible."
  lv_settlement_event.0011.desc.other_non_liege:0 "Les corbeaux parlent de renouveau. Loin de vos propres terres, une province oubliée s'éveille désormais à la vie - ses ruines dégagées, ses murailles s'élevant à nouveau sous le commandement d'un seigneur lointain. Qu'ils soient mus par l'ambition, le devoir, ou la folie, ils ont réussi.\n\nOn dit que l'ancien monde sommeille sous les cendres. Peut-être commence-t-il maintenant à s'éveiller."
  lv_settlement_event.0011.a.self_liege:0 "Que cette terre se souvienne de qui lui donna la vie."
  lv_settlement_event.0011.a.self_non_liege:0 "Ce n'était point la gloire que je cherchais - mais je l'ai gagnée tout de même."
  lv_settlement_event.0011.a.other_liege:0 "Que le royaume sache que cette terre fut reconquise par ma parole."
  lv_settlement_event.0011.a.other_non_liege:0 "Mieux vaut garder un œil sur de telles choses."

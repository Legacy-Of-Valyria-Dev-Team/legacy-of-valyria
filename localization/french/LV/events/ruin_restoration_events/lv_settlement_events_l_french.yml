l_french:
  ## Expedition Events
  lv_settlement_event.0001.t:0 "Reconquérir ce qui fut Perdu"
  lv_settlement_event.0001.desc:0 "L'heure est venue d'agir selon vos ambitions. Les terres brisées ont été arpentées, et un plan a été établi. Bien que périlleuse, l'opportunité de redonner vie à ces contrées maudites demeure à portée de main. Les routes doivent être tracées, les vivres rassemblés, les colons recrutés, et un dirigeant désigné. La question demeure : qui guidera cette entreprise fondatrice ?"
  lv_settlement_event.0001.a:0 "Je reconquerrai [ruin.GetNameNoTooltip] en personne."
  lv_settlement_event.0001.b:0 "Un courtisan de confiance revendiquera ces terres en mon nom."
  lv_settlement_event.0001.c:0 "J'enverrai un vassal loyal."
  lv_settlement_event.0001.d:0 "Ce n'est point le moment propice pour cela."

  lv_settlement_event.0002.t:0 "Reconquérir ce qui fut Perdu"
  lv_settlement_event.0002.desc:0 "L'heure est venue d'agir selon vos ambitions. Les terres brisées ont été arpentées, et un plan a été établi. Bien que périlleuse, l'opportunité de redonner vie à ces contrées maudites demeure à portée de main. Les routes doivent être tracées, les vivres rassemblés, les colons recrutés, et un dirigeant désigné. La question demeure : qui guidera cette entreprise fondatrice ?"
  lv_settlement_event.0002.a:0 "Magnifique."
  lv_settlement_event.0002.b:0 "J'ai changé d'avis."

  lv_settlement_event.0003.t:0 "Un Ordre d'En-Haut"
  lv_settlement_event.0003.desc:0 "Un messager arrive, portant le sceau de votre suzerain et une convocation lourde d'implications. Vous devez mener une expédition pour reconquérir et coloniser [ruin.GetName] : ruinée, sauvage, et à demi engloutie par le temps. Ce n'est point tâche aisée : le voyage est long, l'issue incertaine, et le fardeau du commandement lourd à porter.\n\nMais avec le risque vient la récompense. Si l'établissement prend racine, il pourrait apporter gloire, richesse et héritage durable. Et s'il échoue... le récit vous appartiendra à porter.\n\nSoldats et colons attendent votre parole. L'étendard ne s'élève point encore, mais tous les yeux se tournent vers vous."
  lv_settlement_event.0003.a:0 "Je m'en acquitterai. Qu'ils disent que j'ai gravé mon nom dans les ruines."
  lv_settlement_event.0003.a.tt:0 "Vous acceptez le commandement et vous préparez à mener l'expédition au nom de votre suzerain."
  lv_settlement_event.0003.b:0 "Qu'un autre poursuive ombres et poussière."
  lv_settlement_event.0003.b.tt:0 "Vous déclinez respectueusement la mission, laissant votre suzerain trouver quelqu'un d'autre."

  lv_settlement_event.0004.t:0 "Un Refus Retourné"
  lv_settlement_event.0004.desc:0 "La réponse revient non point avec la trompette de l'assentiment, mais avec le silence et une lettre scellée. Votre vassal désigné, pour des raisons qui lui sont propres, a décliné l'honneur et le fardeau de mener l'expédition. Que ce soit par prudence, mépris, ou simple pragmatisme, la tâche a été refusée.\n\nLes colons attendent toujours. Les chariots demeurent chargés. La route s'étend encore, mais il semble que vous devez nommer un autre pour la parcourir... ou attendre que les temps soient mieux disposés pour de telles ambitions."
  lv_settlement_event.0004.a:0 "Alors je trouverai quelqu'un de plus grande résolution."
  lv_settlement_event.0004.a.tt:0 "Vous chercherez un autre qui soit disposé à relever le défi."
  lv_settlement_event.0004.b:0 "Les vents ne sont point favorables. Pas encore."
  lv_settlement_event.0004.b.tt:0 "Vous décidez d'attendre un moment plus opportun pour entreprendre l'expédition."

  lv_settlement_event.0010.t:0 "En Route vers [ruin.GetNameNoTooltip]"
  lv_settlement_event.0010.desc.self:0 "Les préparatifs finaux sont achevés. Les provisions sont mesurées, les outils inspectés, et les derniers chariots sanglés sous les cieux gris du matin. Votre monture attend en tête de la caravane, son souffle formant de la brume dans l'air froid. Derrière vous gisent les conforts de la cour, le murmure des serviteurs et intendants, le poids familier du commandement. Devant vous : des routes brisées, de longs jours, et une terre qui ne se souvient que du feu et du silence.\n\nVous n'êtes plus un simple voyageur désormais, mais un porteur d'héritage. À chaque battement de sabot et cliquetis de roue, vous portez le poids de votre nom vers un lieu qui pourrait, si les dieux sont cléments, renaître de ses ruines.\n\nAlors que les portes s'ouvrent et que le vent agite votre manteau, vos courtisans s'inclinent en silence, certains se signant, d'autres observant d'un air sombre. Le chemin est tracé. La terre n'attendra point éternellement."
  lv_settlement_event.0010.desc.other:0 "Votre chef choisi se tient en selle sur son destrier, l'armure polie, les bannières roulées pour la longue route qui l'attend. Derrière lui se rassemble la caravane de l'expédition : artisans et gardes, chariots tirés par des bœufs, et rude peuple aux mains calleuses et aux yeux méfiants. Le capitaine désigné vous salue une fois de plus depuis sa selle, un vœu silencieux passant entre vous deux. Il ne va point simplement dompter la nature sauvage, mais élever votre étendard au-dessus des ossements de ce qui fut.\n\nLe voyage sera long, et tous ceux qui partent ne reviendront peut-être point. Mais avec chance et leadership fort, l'établissement s'élèvera, pierre sur pierre, sous votre nom.\n\nDéjà, les portes grincent en s'ouvrant. Déjà, la poussière commence à s'élever."
  lv_settlement_event.0010.a:0 "Vers la promesse d'un nouveau commencement."

  lv_settlement_event.0011.t.self_liege:0 "De Ma Propre Main"
  lv_settlement_event.0011.t.self_non_liege:0 "Au Nom de Mon Suzerain"
  lv_settlement_event.0011.t.other_liege:0 "L'Étendard se Dresse"
  lv_settlement_event.0011.t.other_non_liege:0 "Une Flamme Ravivée"
  lv_settlement_event.0011.desc.self_liege:0 "Le sol est défriché, les murs érigés, et les feux allumés. Ce qui jadis gisait étouffé dans les cendres et la végétation sauvage résonne désormais du rythme des marteaux et de l'espoir. Vous ne vous êtes point tenu derrière des salles de commandement ou des parchemins, mais sous le ciel ouvert, guidant chaque pierre, chaque âme.\n\nLe peuple prononce votre nom non seulement comme seigneur ou dame, mais comme fondateur. Une revendication gagnée par le courage, sculptée de sueur et de fer. Ce lieu respire parce que vous avez osé mener."
  lv_settlement_event.0011.desc.self_non_liege:0 "Vos bottes furent les premières à fouler les anciennes pierres. Ce fut de votre main que les tentes furent dressées, les défenses établies, et les colons aguerris à la tâche. Ce qui s'élève ici peut appartenir à votre suzerain, mais cela tient debout parce que vous l'avez voulu.\n\nCertains oublieront. Les nobles de la cour pourront saluer votre succès de mots creux. Mais les colons n'oublieront point. Ni la terre."
  lv_settlement_event.0011.desc.other_liege:0 "L'expédition que vous avez commandée a porté ses fruits. Votre chef désigné rapporte que les premières pierres ont été posées et que les feux réchauffent désormais les ventres des colons. C'est un commencement, humble peut-être, mais porté par votre vision.\n\nLa nature sauvage est repoussée, ne fût-ce que de quelques pouces, et la terre s'éveille à nouveau à l'appel des bannières et de la loi. Avec le temps, elle prospérera. Avec le temps, elle se souviendra de quelle bannière l'a rendue possible."
  lv_settlement_event.0011.desc.other_non_liege:0 "Les corbeaux parlent de renouveau. Loin de vos propres terres, une province oubliée s'agite désormais de vie : ses ruines déblayées, ses murs s'élevant à nouveau sous le commandement d'un seigneur lointain. Qu'ils soient poussés par l'ambition, le devoir, ou la folie, ils ont réussi.\n\nOn dit que l'ancien monde sommeille sous les cendres. Peut-être maintenant commence-t-il à s'éveiller."
  lv_settlement_event.0011.a.self_liege:0 "Que cette terre se souvienne de qui lui a donné la vie."
  lv_settlement_event.0011.a.self_non_liege:0 "Ce n'était point la gloire que je cherchais, mais je l'ai gagnée tout de même."
  lv_settlement_event.0011.a.other_liege:0 "Que le royaume sache que cette terre fut reconquise par ma parole."
  lv_settlement_event.0011.a.other_non_liege:0 "Mieux vaut garder un œil sur de telles choses."

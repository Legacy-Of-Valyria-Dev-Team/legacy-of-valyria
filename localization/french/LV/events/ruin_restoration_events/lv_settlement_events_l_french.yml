l_french:
  ## Expedition Events
  lv_settlement_event.0001.t:0 "Reprendre ce qui fut Perdu"
  lv_settlement_event.0001.desc:0 "L'heure est venue d'agir selon vos ambitions. Les terres dévastées ont été inspectées, et un plan a été établi—bien que périlleux, l'opportunité de rendre la vie à ces terres abandonnées est désormais à portée. Des routes doivent être tracées, des vivres rassemblés, des colons recrutés, et un meneur désigné. La question demeure : qui guidera cette entreprise fondatrice ?"
  lv_settlement_event.0001.a:0 "Je reprendrai [ruin.GetNameNoTooltip] en personne."
  lv_settlement_event.0001.b:0 "Un courtisan de confiance revendiquera la terre en mon nom."
  lv_settlement_event.0001.c:0 "J'enverrai un vassal loyal."
  lv_settlement_event.0001.d:0 "Ce n'est pas le moment opportun."

  lv_settlement_event.0002.t:0 "Reprendre ce qui fut Perdu"
  lv_settlement_event.0002.desc:0 "L'heure est venue d'agir selon vos ambitions. Les terres dévastées ont été inspectées, et un plan a été établi—bien que périlleux, l'opportunité de rendre la vie à ces terres abandonnées est désormais à portée. Des routes doivent être tracées, des vivres rassemblés, des colons recrutés, et un meneur désigné. La question demeure : qui guidera cette entreprise fondatrice ?"
  lv_settlement_event.0002.a:0 "Excellent. Que cela soit fait."
  lv_settlement_event.0002.b:0 "J'ai reconsidéré ma décision."

  lv_settlement_event.0003.t:0 "Un Ordre du Suzerain"
  lv_settlement_event.0003.desc:0 "Un messager arrive, portant le sceau de votre suzerain et une convocation lourde d'implications. Vous devez mener une expédition pour reprendre et coloniser [ruin.GetName]—ces ruines sauvages, à moitié englouties par le temps et l'oubli. Ce n'est pas une tâche aisée : le voyage sera long, l'issue incertaine, et le fardeau du commandement pesant.\n\nMais avec le risque vient la récompense. Si la colonie prend racine, elle pourrait apporter gloire, richesse et héritage durable. Et si elle échoue... l'échec sera vôtre à porter.\n\nSoldats et colons attendent votre décision. La bannière n'est pas encore levée—mais tous les regards se tournent vers vous."
  lv_settlement_event.0003.a:0 "Je verrai cela accompli. Qu'on dise que j'ai bâti mon nom sur des ruines."
  lv_settlement_event.0003.a.tt:0 "Vous acceptez le commandement et vous préparez à diriger l'expédition au nom de votre suzerain."
  lv_settlement_event.0003.b:0 "Qu'un autre poursuive les ombres et la poussière."
  lv_settlement_event.0003.b.tt:0 "Vous déclinez respectueusement la mission, laissant votre suzerain trouver quelqu'un d'autre."

  lv_settlement_accepted:0 "Le sujet accepte de diriger l'expédition"
  lv_settlement_accepted_desc:0 "[settler.GetName] a accepté de mener l'expédition vers [ruin.GetName]."

  lv_settlement_event.0004.t:0 "Un Refus Scellé"
  lv_settlement_event.0004.desc:0 "La réponse revient non par acclamation, mais par le silence et une lettre cachetée. Votre vassal désigné, pour ses propres raisons, a décliné l'honneur—et le fardeau—de diriger l'expédition. Que ce soit par prudence, dédain ou simple pragmatisme, la tâche a été refusée.\n\nLes colons attendent toujours. Les chariots demeurent chargés. La route serpente encore, mais il semble que vous deviez nommer un autre pour l'emprunter... ou attendre que le moment soit plus propice à de telles ambitions."
  lv_settlement_event.0004.tt:0 "[rejector.GetName] a refusé de diriger l'expédition vers [ruin.GetName]. Vous ne pourrez le solliciter à nouveau avant 6 mois."
  lv_settlement_event.0004.a:0 "Alors je trouverai quelqu'un doté d'une plus grande détermination."
  lv_settlement_event.0004.a.tt:0 "Vous chercherez un autre volontaire pour relever le défi."
  lv_settlement_event.0004.b:0 "Les vents ne sont pas favorables. Pas encore."
  lv_settlement_event.0004.b.tt:0 "Vous décidez d'attendre un moment plus opportun pour entreprendre l'expédition."

  lv_settlement_event.0010.t:0 "En Route pour [ruin.GetNameNoTooltip]"
  lv_settlement_event.0010.desc.self:0 "Les derniers préparatifs sont achevés. Les provisions sont comptées, les outils inspectés, et les derniers chariots fermement arrimés sous les cieux gris du matin. Votre monture attend en tête de la caravane, son souffle formant de la brume dans l'air froid. Derrière vous restent les conforts de la cour, le murmure des serviteurs et intendants, le poids familier du commandement. Devant : des routes brisées, de longues journées, et une terre qui ne se souvient que du feu et du silence.\n\nVous n'êtes plus un simple voyageur, mais porteur d'un héritage. À chaque battement de sabot et grincement de roue, vous portez le poids de votre nom vers un lieu qui pourrait—si les dieux le veulent—renaître de ses ruines.\n\nAlors que les portes s'ouvrent et que le vent agite votre cape, vos courtisans s'inclinent en silence, certains se signant le cœur, d'autres observant gravement. Le chemin est tracé. La terre n'attendra pas éternellement."
  lv_settlement_event.0010.desc.other:0 "Votre champion désigné se tient sur son cheval, armure polie, bannières enroulées pour la longue route. Derrière lui se rassemble la caravane de l'expédition—artisans et gardes, chariots tirés par des bœufs, et gens rudes aux mains calleuses et aux regards méfiants. Le capitaine vous salue une dernière fois depuis sa selle, un serment silencieux passant entre vous. Il ne va pas simplement dompter les terres sauvages, mais élever votre étendard au-dessus des vestiges du passé.\n\nLe voyage sera long, et tous ceux qui partent ne reviendront peut-être pas. Mais avec de la chance et un solide commandement, la colonie s'élèvera, pierre après pierre, sous votre nom.\n\nDéjà, les portes grincent en s'ouvrant. Déjà, la poussière commence à s'élever."
  lv_settlement_event.0010.a:0 "Vers la promesse d'un nouveau commencement."

  lv_settlement_event.0011.t.self_liege:0 "De Mes Propres Mains"
  lv_settlement_event.0011.t.self_non_liege:0 "Au Nom de Mon Suzerain"
  lv_settlement_event.0011.t.other_liege:0 "La Bannière se Dresse"
  lv_settlement_event.0011.t.other_non_liege:0 "Une Flamme Ravivée"
  lv_settlement_event.0011.desc.self_liege:0 "Le sol est retourné, les murs élevés, et les feux allumés. Ce qui gisait étouffé sous les cendres et la végétation résonne maintenant du rythme des marteaux et de l'espoir. Vous n'êtes pas resté derrière des salles de commandement ou des parchemins—mais sous le ciel ouvert, guidant chaque pierre, chaque âme.\n\nLe peuple prononce votre nom non seulement comme seigneur ou dame, mais comme fondateur. Une revendication gagnée par le courage, forgée dans la sueur et le fer. Cet endroit vit parce que vous avez osé le mener à la vie."
  lv_settlement_event.0011.desc.self_non_liege:0 "Vos bottes furent les premières à fouler les vieilles pierres. C'est par votre main que les tentes furent dressées, les défenses établies, et les colons galvanisés pour la tâche. Ce qui s'élève ici appartiendra peut-être à votre suzerain—mais cela existe parce que vous l'avez voulu.\n\nCertains oublieront. Les nobles de la cour porteront peut-être des toasts à votre succès avec des mots vides. Mais les colons n'oublieront pas. La terre non plus."
  lv_settlement_event.0011.desc.other_liege:0 "L'expédition que vous avez commandée a porté ses fruits. Votre meneur désigné rapporte que les premières pierres ont été posées et que des feux réchauffent maintenant le ventre des colons. C'est un début, humble peut-être, mais porté par votre vision.\n\nLa nature sauvage recule—même si ce n'est que peu à peu—et la terre répond à nouveau à l'appel des bannières et de la loi. Avec le temps, elle prospérera. Avec le temps, elle se souviendra de quelle bannière l'a rendue possible."
  lv_settlement_event.0011.desc.other_non_liege:0 "Les corbeaux parlent de renouveau. Loin de vos propres terres, une province oubliée s'éveille à nouveau—ses ruines déblayées, ses murs s'élevant sous le commandement d'un seigneur lointain. Qu'ils soient menés par l'ambition, le devoir ou la folie, ils ont réussi.\n\nOn dit que l'ancien monde dort sous les cendres. Peut-être commence-t-il maintenant à s'éveiller."
  lv_settlement_event.0011.a.self_liege:0 "Que cette terre se souvienne de qui lui a donné vie."
  lv_settlement_event.0011.a.self_non_liege:0 "Ce n'était pas la gloire que je cherchais—mais je l'ai gagnée tout de même."
  lv_settlement_event.0011.a.other_liege:0 "Que le royaume sache que cette terre fut reprise par ma volonté."
  lv_settlement_event.0011.a.other_non_liege:0 "Il vaut mieux garder un œil sur de telles entreprises."

l_french:
  # Mines Pulse
  lv_mines_pulse.0001.t:0 "Des Murmures Sous [mines_province.GetNameNoTooltip]"
  lv_mines_pulse.0001.desc:0 "La nuit venue, les vents portent d'étranges échos depuis les anciennes mines valyriennes : de sourds grondements, comme la pierre qui grince contre la pierre, suivis d'un sifflement qui brûle l'oreille et glace le sang. Les habitants du cru prétendent que ce ne sont que les airs qui se déplacent à travers les tunnels brisés, mais vos éclaireurs parlent de choses bien pires dans l'obscurité.\n\nL'un d'eux jura avoir vu des marques de griffes en fusion gravées le long d'un puits effondré. Un autre, blême de terreur, jura avoir entendu quelque chose respirer là-bas dans les ténèbres profondes. Les mineurs refusent catégoriquement de retourner. Même les bêtes sauvages n'osent s'approcher de la gueule du gouffre.\n\nQuelque chose s'agite sous [mines_province.GetName]. Et quoi que ce soit, cette créature se souvient du goût du feu et de la chair humaine."
  lv_mines_pulse.0001.a:0 "Nous demeurerons vigilants... et prierons pour que les vouivres restent enterrées."
  lv_mines_pulse.0001.a.tt:0 "Les bruits finissent par s'apaiser, et les mines sont laissées tranquilles pour l'instant."
  lv_mines_pulse.0001.a.tt.firewyrm:0 "Quelque chose émerge des profondeurs des mines."

  # Noxious Gases Pulse
  lv_noxious_gases_pulse.0001.t:0 "Quand l'Air Devient Pesant"
  lv_noxious_gases_pulse.0001.desc:0 "Les vents ont tourné de façon sinistre. Ce qui n'était jadis qu'une brume errante s'est épaissi en un brouillard blafard et suffocant qui s'accroche à chaque pierre et chaque feuille. À travers les plaines cicatrisées de [noxious_gases_province.GetName], l'air devient lourd de la morsure âcre du soufre et de la puanteur lente et persistante de la ruine.\n\nLes animaux fuient les vallées empoisonnées. Les hommes crachent le sang avant de s'effondrer à genoux. Même le feu brûle pâlement dans la brume, comme s'il avait peur de respirer. Ceux qui demeurent près des veines volcaniques disent que cela arrive toujours quand la terre gémit sourdement : une saison maudite, quand la terre exhale le poison au lieu du souffle de vie.\n\nCertains murmurent de maladies qui se répandent comme la peste. D'autres parlent de présages funestes. Mais la plupart se contentent d'enrouler des tissus autour de leur bouche et espèrent voir un autre lever de soleil."
  lv_noxious_gases_pulse.0001.a:0 "Nous ne pouvons qu'endurer cette épreuve et prier pour qu'elle passe rapidement."
  
  lv_noxious_gases_pulse.0002.t:0 "Un Souffle Entre les Tempêtes"
  lv_noxious_gases_pulse.0002.desc:0 "Pour la première fois depuis des semaines entières, le vent tourne et souffle pur depuis la mer lointaine. Le brouillard âcre s'amincit, se retirant des plaines comme une marée bougonne et maussade. Les oiseaux reviennent se percher dans les arbres. Un enfant rit sans tousser. Les feux brûlent à nouveau purs et brillants.\n\nLe poison n'a pas disparu pour autant, il a seulement reculé comme une bête qui se glisse sournoisement dans sa tanière. Pourtant en cet instant béni, il y a de la clarté dans l'air. Les montagnes fument encore au loin, mais les cieux au-dessus sont assez clairs pour voir briller les étoiles.\n\nCe n'est pas la guérison. Ce n'est pas le salut. Mais c'est un souffle de vie, si bref soit-il."
  lv_noxious_gases_pulse.0002.a:0 "Nous prendrons toute la miséricorde que la terre veut bien nous accorder."
  lv_noxious_gases_pulse.0002.a.tt:0 "Les vapeurs toxiques de [noxious_gases_province.GetName] se dispersent, et la terre respire à nouveau."

  lv_noxious_gases_pulse.0002.t.normal_1:0 "Les Vents Tournent Favorablement"
  lv_noxious_gases_pulse.0002.desc.normal_1:0 "Un rare changement dans la direction du vent emporte les vapeurs suffocantes vers la mer. Bien que l'air sente encore faiblement le soufre, et que la cendre continue de tomber comme la poussière d'un brasier oublié, la brume étouffante s'est enfin levée de ces terres maudites.\n\nDans les restes squelettiques des rues de pierre, les voix portent plus loin qu'avant. Les feux de camp brûlent sans provoquer de quintes de toux. Pour la première fois depuis des semaines, la terre ne semble plus essayer de vous tuer à chaque respiration."
  lv_noxious_gases_pulse.0002.a.normal_1:0 "Nous prendrons toute la miséricorde possible, même en ces lieux maudits."
  lv_noxious_gases_pulse.0002.a.tt.normal_1:0 "L'air de [noxious_gases_province.GetName] devient un peu plus tolérable."

  lv_noxious_gases_pulse.0002.t.normal_2:0 "Un Ciel Clair, Pour l'Instant"
  lv_noxious_gases_pulse.0002.desc.normal_2:0 "Les cieux au-dessus de [noxious_gases_province.GetName] demeurent gris, non pas de nuages, mais de cendres suspendues éternellement dans l'air stagnant. Pourtant aujourd'hui, les vapeurs basses se sont amincies, et l'on peut marcher dans les avenues fissurées des ruines sans brûler les poumons ou faire pleurer les yeux.\n\nCe n'est pas pur, pas vraiment. Mais c'est vivable. Et cela seul suffit à éveiller un optimisme prudent dans les cœurs."
  lv_noxious_gases_pulse.0002.a.normal_2:0 "Un souffle amer vaut mieux que pas de souffle du tout."
  lv_noxious_gases_pulse.0002.a.tt.normal_2:0 "Le travail continue alors que les colons de [noxious_gases_province.GetName] peuvent à nouveau respirer un peu mieux."

  lv_noxious_gases_pulse.0002.t.normal_3:0 "Un Moment pour Respirer"
  lv_noxious_gases_pulse.0002.desc.normal_3:0 "Les brumes qui s'enroulaient jadis étroitement autour de chaque colonne brisée et chaque crête d'obsidienne se sont retirées. Une pâle lumière solaire lutte à travers un plafond de suie volcanique, projetant une lueur blafarde sur la pierre noircie par les flammes d'antan.\n\nLes sentiers perdus dans les vapeurs et les ombres se révèlent brièvement à nouveau. L'air est encore chaud, encore âcre, mais l'on peut marcher sans avoir de haut-le-cœur, et cela suffit à avoir de l'importance."
  lv_noxious_gases_pulse.0002.a.normal_3:0 "Même dans la cendre, un chemin peut être dégagé."
  lv_noxious_gases_pulse.0002.a.tt.normal_3:0 "[noxious_gases_province.GetName] respire un soupir de soulagement longtemps espéré."

  lv_noxious_gases_pulse.0002.t.normal_4:0 "Nettoyé par la Pluie"
  lv_noxious_gases_pulse.0002.desc.normal_4:0 "Le ciel chargé de cendres de [noxious_gases_province.GetName] pleura pendant des jours entiers : une pluie épaisse et granuleuse qui transforma les routes en boue noire et trempa même les manteaux les plus résistants. Mais quand la tempête passa enfin, elle emporta avec elle le pire du poison qui flottait bas dans l'air.\n\nLes vapeurs se sont amincies, bien que l'odeur de soufre et de fumée demeure, tissée dans chaque pierre. Pourtant, pour une fois, respirer ne brûle plus les poumons."
  lv_noxious_gases_pulse.0002.a.normal_4:0 "La pluie ne nettoie rien, mais elle accorde un répit."
  lv_noxious_gases_pulse.0002.a.tt.normal_4:0 "Les vapeurs ont été emportées par les eaux, pour un temps."

  lv_noxious_gases_pulse.0002.t.normal_5:0 "La Cendre se Pose"
  lv_noxious_gases_pulse.0002.desc.normal_5:0 "Pour un temps, les vents chargés de vapeurs deviennent immobiles. L'air demeure lourd et imprégné du goût amer du feu ancien, mais les nuages roulants de fumée ont reflué. À travers les collines en ruines et les tours brisées, la cendre gît sans être dérangée, épaisse comme la neige, silencieuse comme une crypte.\n\nCe n'est pas la paix, seulement une pause. Mais sous le ciel meurtri de [noxious_gases_province.GetName], c'est ce qu'on peut espérer de mieux."
  lv_noxious_gases_pulse.0002.a.normal_5:0 "La terre exhale, mais elle ne dort pas."
  lv_noxious_gases_pulse.0002.a.tt.normal_5:0 "Avec les vapeurs qui s'amincissent, la colonie de [noxious_gases_province.GetName] a été épargnée."

  lv_noxious_gases_pulse.0002.t.spooky_1:0 "Quelque Chose dans la Brume"
  lv_noxious_gases_pulse.0002.desc.spooky_1:0 "Les vapeurs ne se sont pas contentées de s'épaissir, elles ont changé de nature. Non pas en couleur ou en odeur, mais en présence mystérieuse. Le brouillard s'accroche plus longtemps qu'il ne le devrait, s'enroulant de façons étranges et délibérées. Un éclaireur jure avoir vu des ombres bouger à l'intérieur : ni hommes, ni bêtes, mais quelque chose qui observe.\n\nAu crépuscule, la brume bourdonne d'un son comme un souffle murmuré. Les feux vacillent quand on les place près d'elle. De vieilles runes, longtemps crues dénuées de sens, commencent à luire faiblement sur les pierres englouties.\n\nCertains disent que les gaz réveillent d'anciennes magies enterrées profondément sous Valyria : des pouvoirs liés dans la fumée et l'os. D'autres disent que c'est simplement la terre qui se souvient de ce qu'elle fut jadis : non seulement un royaume de feu, mais de sorcellerie.\n\nPeu dorment facilement. Moins encore osent parler de ce qu'ils ont vu."
  lv_noxious_gases_pulse.0002.a.spooky_1:0 "Mieux vaut ne pas s'attarder sur ce qui ne peut être expliqué."
  lv_noxious_gases_pulse.0002.a.tt.spooky_1:0 "Les vapeurs toxiques de [noxious_gases_province.GetName] se dispersent malgré tout."

  lv_noxious_gases_pulse.0002.t.spooky_2:0 "Des Échos sur le Vent"
  lv_noxious_gases_pulse.0002.desc.spooky_2:0 "Le brouillard roule plus épais qu'auparavant, et avec lui viennent des sons qu'aucune gorge vivante ne devrait produire : des gémissements sourds, des hurlements lointains, le claquement de sabots invisibles sur la pierre. Certains prétendent que c'est le vent qui se tord à travers les salles en ruines, mais d'autres jurent avoir entendu des voix parlant dans une langue depuis longtemps morte.\n\nChaque nuit, les sons deviennent plus audacieux. Pas plus proches, juste plus forts. Comme si ce qui les produit voulait être entendu par les vivants."
  lv_noxious_gases_pulse.0002.a.spooky_2:0 "La terre se souvient de choses que nous n'étions pas censés connaître."
  lv_noxious_gases_pulse.0002.a.tt.spooky_2:0 "[noxious_gases_province.GetName] demeura agité pour un temps, mais les vapeurs finirent par se disperser."

  lv_noxious_gases_pulse.0002.t.spooky_3:0 "Des Morts qui Respirent"
  lv_noxious_gases_pulse.0002.desc.spooky_3:0 "Une bande de voyageurs traverse la brume et en émerge pâle, tremblante... et étrangement silencieuse. Leur peau ne porte aucune blessure, pourtant leurs yeux sont vitreux et sans focus, et leurs bouches tressaillent avec des mots qu'ils ne peuvent prononcer.\n\nIls ne répondent pas quand on leur parle. Ils ne font que respirer : des inspirations lentes et râpeuses, encore et encore. Vous ordonnez qu'on les surveille, mais certains gardes refusent de s'approcher d'eux.\n\nQuoi qu'il soit arrivé dans ce brouillard, une partie en est restée avec eux."
  lv_noxious_gases_pulse.0002.a.spooky_3:0 "Gardez-les confortables... et confinés."
  lv_noxious_gases_pulse.0002.a.tt.spooky_3:0 "Quoi qu'il soit arrivé à ces hommes demeura un mystère, mais finalement le brouillard sur [noxious_gases_province.GetName] s'amincit à ce qu'il était auparavant."

  lv_noxious_gases_pulse.0002.t.spooky_4:0 "La Couleur Dessous"
  lv_noxious_gases_pulse.0002.desc.spooky_4:0 "Pendant une seule heure, le brouillard luit faiblement d'une couleur verte : pas vibrante, mais suffisamment pour projeter une lumière fantomatique sur le sol brisé. Sous sa lueur, de vieux glyphes émergent sur la maçonnerie antique, des motifs invisibles depuis des siècles entiers.\n\nCertains prétendent que c'est une réaction naturelle. D'autres n'en parlent pas du tout. La lueur s'estompe avant l'aube, ne laissant que silence et fumée."
  lv_noxious_gases_pulse.0002.a.spooky_4:0 "Peut-être n'était-ce jamais censé être vu à la lumière du soleil."
  lv_noxious_gases_pulse.0002.a.tt.spooky_4:0 "Bientôt, l'air de [noxious_gases_province.GetName] redevint ce qu'il était auparavant."

  lv_noxious_gases_pulse.0002.t.spooky_5:0 "De la Cendre dans le Sang"
  lv_noxious_gases_pulse.0002.desc.spooky_5:0 "Plusieurs ouvriers travaillant près des vapeurs développent d'étranges afflictions : une peau qui grisonne et pèle comme un parchemin calciné, et des veines qui pulsent faiblement comme si elles luisaient par en dessous. Aucun ne montre de signes de maladie ou de douleur, mais aucun n'a plus l'air tout à fait humain.\n\nUn guérisseur insiste que ce n'est qu'une exposition chimique. Un autre prétend que c'est une malédiction. Et une vieille femme, à demi folle, jure avoir vu de telles marques sur les anciens seigneurs dragons, juste avant le Fléau."
  lv_noxious_gases_pulse.0002.a.spooky_5:0 "Brûlez les corps. Brûlez les outils. Ne parlez de ceci à personne."
  lv_noxious_gases_pulse.0002.a.tt.spooky_5:0 "Finalement, les vapeurs quittent [noxious_gases_province.GetName]."

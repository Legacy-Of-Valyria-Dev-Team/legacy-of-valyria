l_french:
  # Mines Pulse
  lv_mines_pulse.0001.t:0 "Murmures sous la pierre"
  lv_mines_pulse.0001.desc:0 "La nuit venue, les vents portent d'étranges échos depuis les anciennes mines valyriennes : grondements sourds, comme si la pierre grinçait contre la pierre, suivis d'un sifflement qui brûle l'oreille. Les habitants prétendent que ce ne sont là que les souffles d'air qui s'engouffrent dans les tunnels effondrés, mais vos éclaireurs rapportent des choses bien plus troublantes.\n\nL'un d'eux jure avoir aperçu des traces de griffes incandescentes gravées le long d'un puits effondré. Un autre, blême de terreur, affirme avoir entendu quelque chose respirer dans les profondeurs obscures. Les mineurs refusent catégoriquement de retourner au travail. Même les bêtes évitent soigneusement l'entrée de la fosse.\n\nQuelque chose s'agite sous [mines_province.GetName]. Et quoi que ce soit, cette créature se souvient encore du goût du feu et de la chair."
  lv_mines_pulse.0001.a:0 "Nous demeurerons vigilants... et prierons pour que les vouivres restent enfouies."
  lv_mines_pulse.0001.a.tt:0 "Les bruits s'apaisent finalement, et les mines demeurent en paix pour l'heure."
  lv_mines_pulse.0001.a.tt.firewyrm:0 "Quelque chose émerge des profondeurs minières."

  # Noxious Gases Pulse
  lv_noxious_gases_pulse.0001.t:0 "Quand l'air se fait pesant"
  lv_noxious_gases_pulse.0001.desc:0 "Les vents ont tourné. Ce qui n'était qu'une brume errante s'est épaissi en un brouillard livide et suffocant qui s'accroche à chaque pierre, à chaque feuille. À travers les basses-terres marquées par les cicatrices de [noxious_gases_province.GetName], l'air s'alourdit de l'âcre morsure du soufre et de l'odeur persistante de la ruine qui se consume lentement.\n\nLes bêtes fuient les vallées. Les hommes crachent le sang avant de s'effondrer à genoux. Même les flammes brûlent pâlement dans cette brume, comme si elles redoutaient de respirer. Ceux qui demeurent près des veines volcaniques affirment que cela arrive toujours quand la terre gémit dans les profondeurs : une saison maudite, où la terre exhale le poison au lieu du souffle de vie.\n\nCertains murmurent que la maladie se répand. D'autres parlent de présages funestes. Mais la plupart se contentent d'enrouler des étoffes autour de leur bouche et espèrent voir un autre jour se lever."
  lv_noxious_gases_pulse.0001.a:0 "Nous ne pouvons qu'endurer et prier que cela passe rapidement."
  
  lv_noxious_gases_pulse.0002.t:0 "Un souffle entre les tempêtes"
  lv_noxious_gases_pulse.0002.desc:0 "Pour la première fois depuis des semaines, le vent tourne en apportant la fraîcheur marine. Le brouillard âcre s'amincit, reflue des basses-terres comme une marée maussade. Les oiseaux reviennent dans les arbres. Un enfant rit sans tousser. Les feux brûlent à nouveau purs et clairs.\n\nLe poison n'a pas disparu, il a seulement reculé, tel une bête qui regagne sa tanière en rampant. Pourtant, en cet instant, il y a de la clarté. Les montagnes fument encore au loin, mais les cieux sont assez dégagés pour apercevoir les étoiles.\n\nCe n'est pas une guérison. Ce n'est pas le salut. Mais c'est un souffle, si bref soit-il."
  lv_noxious_gases_pulse.0002.a:0 "Nous accepterons la clémence que la terre nous accorde."
  lv_noxious_gases_pulse.0002.a.tt:0 "Les vapeurs toxiques de [noxious_gases_province.GetName] se dispersent, et la terre respire à nouveau."

  lv_noxious_gases_pulse.0002.t.normal_1:0 "Les vents tournent avec bienveillance"
  lv_noxious_gases_pulse.0002.desc.normal_1:0 "Un rare changement de vent emporte vers la mer les vapeurs suffocantes. Bien que l'air sente encore faiblement le soufre, et que la cendre continue de tomber comme poussière d'un brasier oublié, la brume étouffante s'est levée.\n\nDans les restes squelettiques des rues de pierre, les voix portent plus loin. Les feux de camp brûlent sans provoquer de quintes de toux. Pour la première fois depuis des semaines, la terre ne semble plus vouloir vous tuer."
  lv_noxious_gases_pulse.0002.a.normal_1:0 "Nous prendrons la clémence que nous pouvons, même ici."
  lv_noxious_gases_pulse.0002.a.tt.normal_1:0 "L'air de [noxious_gases_province.GetName] devient un peu plus respirable."

  lv_noxious_gases_pulse.0002.t.normal_2:0 "Ciel dégagé, pour l'instant"
  lv_noxious_gases_pulse.0002.desc.normal_2:0 "Le ciel au-dessus de [noxious_gases_province.GetName] demeure gris, non de nuages, mais de cendres suspendues éternellement dans l'air. Pourtant aujourd'hui, les vapeurs basses se sont éclaircies, et l'on peut arpenter les avenues fissurées des ruines sans brûler les poumons ni pleurer.\n\nCe n'est pas pur, pas vraiment. Mais c'est vivable. Et cela seul suffit à éveiller un optimisme prudent."
  lv_noxious_gases_pulse.0002.a.normal_2:0 "Un souffle amer vaut mieux qu'aucun souffle."
  lv_noxious_gases_pulse.0002.a.tt.normal_2:0 "Le travail reprend tandis que les colons de [noxious_gases_province.GetName] peuvent à nouveau respirer un peu mieux."

  lv_noxious_gases_pulse.0002.t.normal_3:0 "Un instant pour respirer"
  lv_noxious_gases_pulse.0002.desc.normal_3:0 "Les brumes qui s'enroulaient étroitement autour de chaque colonne brisée et de chaque crête d'obsidienne ont reculé. Une lumière solaire blafarde perce à travers un plafond de suie volcanique, projetant une clarté livide sur la pierre noircie.\n\nLes sentiers perdus dans les vapeurs et l'ombre se révèlent brièvement. L'air demeure chaud, encore âcre, mais l'on peut marcher sans avoir de haut-le-cœur, et cela suffit à faire la différence."
  lv_noxious_gases_pulse.0002.a.normal_3:0 "Même dans la cendre, un chemin peut être dégagé."
  lv_noxious_gases_pulse.0002.a.tt.normal_3:0 "[noxious_gases_province.GetName] pousse un soupir de soulagement longtemps attendu."

  lv_noxious_gases_pulse.0002.t.normal_4:0 "Lessivé par la pluie"
  lv_noxious_gases_pulse.0002.desc.normal_4:0 "Le ciel chargé de cendres de [noxious_gases_province.GetName] a pleuré pendant des jours : une pluie épaisse et granuleuse qui a transformé les routes en bourbier noir et trempé même les manteaux les plus éprouvés. Mais quand l'orage s'est apaisé, il a emporté avec lui le pire des poisons qui stagnaient dans l'air.\n\nLes vapeurs se sont éclaircies, bien que l'odeur de soufre et de fumée demeure, tissée dans chaque pierre. Néanmoins, pour une fois, respirer ne brûle plus."
  lv_noxious_gases_pulse.0002.a.normal_4:0 "La pluie ne nettoie rien, mais elle accorde un répit."
  lv_noxious_gases_pulse.0002.a.tt.normal_4:0 "Les vapeurs ont été balayées, pour un temps."

  lv_noxious_gases_pulse.0002.t.normal_5:0 "La cendre retombe"
  lv_noxious_gases_pulse.0002.desc.normal_5:0 "Pour un temps, les vents chargés de vapeurs s'apaisent. L'air demeure lourd et imprégné de l'âcre saveur du feu ancien, mais les nuages roulants de fumée ont reflué. À travers les collines en ruine et les tours brisées, la cendre repose immobile, épaisse comme neige, silencieuse comme un sépulcre.\n\nCe n'est pas la paix, seulement une pause. Mais sous le ciel meurtri de [noxious_gases_province.GetName], c'est ce que l'on peut espérer de mieux."
  lv_noxious_gases_pulse.0002.a.normal_5:0 "La terre exhale, mais elle ne dort point."
  lv_noxious_gases_pulse.0002.a.tt.normal_5:0 "Les vapeurs s'éclaircissant, la colonie de [noxious_gases_province.GetName] a été épargnée."

  lv_noxious_gases_pulse.0002.t.spooky_1:0 "Quelque chose dans la brume"
  lv_noxious_gases_pulse.0002.desc.spooky_1:0 "Les vapeurs ne se sont pas contentées de s'épaissir, elles ont changé. Pas de couleur ni d'odeur, mais de présence. Le brouillard s'accroche plus longtemps qu'il ne le devrait, s'enroulant de façons étranges et délibérées. Un éclaireur jure avoir vu des ombres se mouvoir à l'intérieur : ni hommes, ni bêtes, mais quelque chose qui observe.\n\nAu crépuscule, la brume ronronne d'un son semblable à un souffle murmuré. Les feux vacillent lorsqu'on les place près d'elle. D'anciennes runes, longtemps tenues pour dénuées de sens, commencent à luire faiblement sur les pierres enfouies.\n\nCertains affirment que les gaz éveillent d'anciennes magies ensevelies dans les profondeurs de Valyria : des pouvoirs liés par la fumée et l'os. D'autres disent que c'est simplement la terre qui se souvient de ce qu'elle fut jadis, non seulement un royaume de feu, mais de sorcellerie.\n\nPeu dorment paisiblement. Moins encore osent parler de ce qu'ils ont vu."
  lv_noxious_gases_pulse.0002.a.spooky_1:0 "Mieux vaut ne point s'attarder sur ce qui ne peut être expliqué."
  lv_noxious_gases_pulse.0002.a.tt.spooky_1:0 "Les vapeurs toxiques de [noxious_gases_province.GetName] se dispersent néanmoins."

  lv_noxious_gases_pulse.0002.t.spooky_2:0 "Échos dans le vent"
  lv_noxious_gases_pulse.0002.desc.spooky_2:0 "Le brouillard roule plus épais qu'auparavant, et avec lui viennent des sons qu'aucune gorge vivante ne devrait produire : gémissements graves, hurlements lointains, le claquement de sabots invisibles sur la pierre. Certains prétendent que c'est le vent qui se tord à travers les salles en ruine, mais d'autres jurent avoir entendu des voix parlant en une langue depuis longtemps morte.\n\nChaque nuit, les sons s'enhardissent. Pas plus proches, seulement plus forts. Comme si ce qui les produit voulait être entendu."
  lv_noxious_gases_pulse.0002.a.spooky_2:0 "La terre se souvient de choses que nous n'étions pas censés connaître."
  lv_noxious_gases_pulse.0002.a.tt.spooky_2:0 "[noxious_gases_province.GetName] demeure agité pendant un temps, mais les vapeurs finissent par se disperser."

  lv_noxious_gases_pulse.0002.t.spooky_3:0 "Morts qui respirent"
  lv_noxious_gases_pulse.0002.desc.spooky_3:0 "Une bande de voyageurs traverse la brume et en ressort pâle, tremblante... et étrangement silencieuse. Leur peau ne porte aucune blessure, pourtant leurs yeux sont vitreux et troubles, et leurs bouches tressaillent de mots qu'ils ne parviennent à prononcer.\n\nIls ne répondent pas quand on leur parle. Ils se contentent de respirer : inspirations lentes et râpantes, encore et toujours. Vous ordonnez qu'on les surveille, mais certains gardes refusent d'approcher.\n\nQuoi qu'il se soit passé dans ce brouillard, une part en est demeurée avec eux."
  lv_noxious_gases_pulse.0002.a.spooky_3:0 "Qu'on les tienne à l'aise... et contenus."
  lv_noxious_gases_pulse.0002.a.tt.spooky_3:0 "Ce qui est arrivé à ces hommes demeure un mystère, mais finalement le brouillard au-dessus de [noxious_gases_province.GetName] s'éclaircit comme auparavant."

  lv_noxious_gases_pulse.0002.t.spooky_4:0 "La couleur des profondeurs"
  lv_noxious_gases_pulse.0002.desc.spooky_4:0 "Durant une seule heure, le brouillard luit faiblement d'un vert spectral : pas vibrant, mais suffisant pour projeter une lueur fantomatique sur le sol fracassé. Sous cet éclat, d'anciens glyphes émergent sur la maçonnerie antique, des motifs invisibles depuis des siècles.\n\nCertains prétendent que c'est une réaction naturelle. D'autres refusent d'en parler. La lueur s'estompe avant l'aube, ne laissant que silence et fumée."
  lv_noxious_gases_pulse.0002.a.spooky_4:0 "Peut-être n'était-ce jamais destiné à être vu à la lumière du jour."
  lv_noxious_gases_pulse.0002.a.tt.spooky_4:0 "Bientôt, l'air de [noxious_gases_province.GetName] redevient ce qu'il était."

  lv_noxious_gases_pulse.0002.t.spooky_5:0 "Cendre dans le sang"
  lv_noxious_gases_pulse.0002.desc.spooky_5:0 "Plusieurs ouvriers travaillant près des vapeurs développent d'étranges affections : une peau qui grisaille et se desquame comme parchemin brûlé, et des veines qui pulsent faiblement comme si elles luisaient par en dessous. Aucun ne montre de signes de maladie ou de douleur, mais aucun n'a plus tout à fait l'air humain.\n\nUn guérisseur insiste que ce ne sont là qu'expositions aux substances nocives. Un autre prétend que c'est une malédiction. Et une vieille femme, à demi folle, jure avoir vu de telles marques sur les anciens seigneurs-dragons, juste avant le Fléau."
  lv_noxious_gases_pulse.0002.a.spooky_5:0 "Brûlez les corps. Brûlez les outils. Que nul n'en parle."
  lv_noxious_gases_pulse.0002.a.tt.spooky_5:0 "Finalement, les vapeurs quittent [noxious_gases_province.GetName]."

l_french:
 # Mines Pulse
 lv_mines_pulse.0001.t:0 "Murmures Sous [mines_province.GetNameNoTooltip]"
 lv_mines_pulse.0001.desc:0 "La nuit, les vents charrient d'étranges bruits depuis les vieilles mines valyriennes : de sourds grondements, comme la pierre broyant la pierre, suivis d'un sifflement qui brûle l'oreille. Les gens du cru prétendent que ce n'est que l'air qui se faufile à travers les tunnels effondrés, mais vos éclaireurs parlent de pire encore.\n\nL'un d'eux jura avoir vu des griffures incandescentes gravées le long d'un puits éboulé. Un autre, livide de terreur, jura avoir entendu quelque chose respirer dans l'obscurité. Les mineurs refusent d'y retourner. Même les bêtes évitent l'entrée du gouffre.\n\nQuelque chose remue sous [mines_province.GetName]. Et quoi que ce soit, cela se souvient du goût du feu et de la chair."
 lv_mines_pulse.0001.a:0 "Nous resterons vigilants... et prierons pour que les veurs de feu demeurent ensevelis."
 lv_mines_pulse.0001.a.tt:0 "Les bruits finissent par s'apaiser, et les mines demeurent tranquilles... pour l'instant."
 lv_mines_pulse.0001.a.tt.firewyrm:0 "Quelque chose émerge des mines."

 # Noxious Gases Pulse
 lv_noxious_gases_pulse.0001.t:0 "Quand l'Air S'Alourdit"
 lv_noxious_gases_pulse.0001.desc:0 "Les vents ont tourné. La brume flottante de [noxious_gases_province.GetName] s'est épaissie en un brouillard blafard et suffocant qui s'accroche à chaque pierre, à chaque feuille. Sur les basses terres balafrées, l'air s'alourdit de la morsure âcre du soufre et de la puanteur tenace de la ruine.\n\nLes animaux fuient les vallées. Les hommes crachent du sang avant de s'effondrer à genoux. Même le feu brûle pâle dans la brume, comme s'il craignait de respirer. Ceux qui vivent près des veines volcaniques disent que cela arrive toujours quand la terre gronde sourdement : une saison maudite, où la terre exhale du poison au lieu d'un souffle.\n\nCertains murmurent qu'une maladie se propage. D'autres parlent de présages. Mais la plupart se contentent d'envelopper leur bouche d'un linge et d'espérer voir une nouvelle aube."
 lv_noxious_gases_pulse.0001.a:0 "Nous ne pouvons qu'endurer et prier pour que cela passe vite."
 lv_noxious_gases_pulse.0001.a.tt.dispersal:0 "Dissipation"
 lv_noxious_gases_pulse.0001.a.tt.dispersal.outcome:0 "Les fumées de [noxious_gases_province.GetName] finissent par se dissiper."
 lv_noxious_gases_pulse.0001.a.tt.plague_outbreak:0 "Épidémie"
 lv_noxious_gases_pulse.0001.a.tt.plague_outbreak.outcome:0 "Une épidémie éclate dans [noxious_gases_province.GetName]."

 lv_noxious_gases_pulse.0002.t:0 "Un Instant de Répit"
 lv_noxious_gases_pulse.0002.desc:0 "Pour la première fois depuis des semaines, un vent pur souffle de la mer. Le brouillard âcre s'amincit, se retirant des basses terres comme une marée maussade. Les oiseaux reviennent dans les arbres. Un enfant rit sans tousser. Les feux brûlent de nouveau, clairs et vifs.\n\nLe poison n'a pas disparu, il a simplement reflué, comme une bête qui regagne son antre. Pourtant, en cet instant, tout paraît limpide. Les montagnes fument encore au loin, mais le ciel au-dessus est assez dégagé pour laisser voir les étoiles.\n\nEst-ce une guérison ? Loin s'en faut. Ce n'est pas non plus un salut. Mais c'est un souffle, même bref."
 lv_noxious_gases_pulse.0002.a:0 "Nous accepterons la clémence que la terre veut bien nous accorder."
 lv_noxious_gases_pulse.0002.a.tt:0 "Les fumées toxiques de [noxious_gases_province.GetName] se dissipent, et la terre respire de nouveau."

 lv_noxious_gases_pulse.0002.t.normal_1:0 "Les Vents Se Font Cléments"
 lv_noxious_gases_pulse.0002.desc.normal_1:0 "Un rare revirement du vent emporte les fumées suffocantes vers le large. L'air garde encore un vague relent de soufre, et la cendre continue de tomber comme la poussière d'un brasero oublié, mais le brouillard étouffant s'est enfin levé.\n\nDans les squelettes de pierre des rues en ruine, les voix portent plus loin. Les feux de camp brûlent sans provoquer de quintes de toux. Pour la première fois depuis des semaines, l'air ne semble plus chercher à vous tuer."
 lv_noxious_gases_pulse.0002.a.normal_1:0 "Nous prendrons la clémence que nous pouvons trouver, même ici."
 lv_noxious_gases_pulse.0002.a.tt.normal_1:0 "L'air de [noxious_gases_province.GetName] devient un peu plus respirable."

 lv_noxious_gases_pulse.0002.t.normal_2:0 "Ciel Dégagé, Pour l'Instant"
 lv_noxious_gases_pulse.0002.desc.normal_2:0 "Le ciel au-dessus de [noxious_gases_province.GetName] demeure gris. Non de nuages, mais de cendres suspendues à jamais dans l'air. Pourtant, aujourd'hui, les basses fumées se sont amincies, et l'on peut parcourir les avenues fissurées des ruines sans se brûler les poumons ni pleurer des yeux.\n\nCe n'est pas propre, pas vraiment. Mais c'est vivable. Et cela seul suffit à raviver un peu d'optimisme."
 lv_noxious_gases_pulse.0002.a.normal_2:0 "Un souffle amer vaut mieux que pas de souffle du tout."
 lv_noxious_gases_pulse.0002.a.tt.normal_2:0 "Le travail reprend tandis que les colons de [noxious_gases_province.GetName] respirent de nouveau un peu mieux."

 lv_noxious_gases_pulse.0002.t.normal_3:0 "Un Moment de Répit"
 lv_noxious_gases_pulse.0002.desc.normal_3:0 "Les brumes qui s'enroulaient naguère autour de chaque colonne brisée et de chaque crête d'obsidienne se sont retirées. Une lumière pâle peine à percer un plafond de suie volcanique, jetant une clarté blafarde sur la pierre noircie.\n\nDes chemins perdus dans la fumée et l'ombre se révèlent brièvement. L'air reste chaud, reste âcre, mais on peut désormais marcher sans suffoquer, et cela seul compte."
 lv_noxious_gases_pulse.0002.a.normal_3:0 "Même dans la cendre, un chemin peut se dégager."
 lv_noxious_gases_pulse.0002.a.tt.normal_3:0 "[noxious_gases_province.GetName] pousse un soupir de soulagement longtemps attendu."

 lv_noxious_gases_pulse.0002.t.normal_4:0 "Lavé par la Pluie"
 lv_noxious_gases_pulse.0002.desc.normal_4:0 "Le ciel chargé de cendres de [noxious_gases_province.GetName] a pleuré durant des jours. Une pluie épaisse et grumeleuse, changeant les routes en bourbier noir et trempant jusqu'aux capes les plus rudes, est tombée sans relâche. Mais lorsque l'orage s'est retiré, il a emporté avec lui le pire du poison qui stagnait dans l'air.\n\nLes fumées se sont amincies, même si l'odeur de soufre et de fumée demeure, tissée dans chaque pierre. Pourtant, pour une fois, respirer ne brûle plus."
 lv_noxious_gases_pulse.0002.a.normal_4:0 "La pluie ne lave rien, mais elle accorde un sursis."
 lv_noxious_gases_pulse.0002.a.tt.normal_4:0 "Les fumées de [noxious_gases_province.GetName] ont été lavées, pour un temps."

 lv_noxious_gases_pulse.0002.t.normal_5:0 "La Cendre Se Dépose"
 lv_noxious_gases_pulse.0002.desc.normal_5:0 "Pour un temps, les vents chargés de fumées s'apaisent. L'air reste lourd, empreint du goût amer d'un feu ancien, mais les nuées tourbillonnantes de fumée ont reflué. Sur les collines ruinées et les tours brisées, la cendre repose intacte, épaisse comme neige et silencieuse comme une crypte.\n\nCe n'est qu'une pause. Mais sous le ciel meurtri de [noxious_gases_province.GetName], c'est déjà tout ce que l'on peut espérer."
 lv_noxious_gases_pulse.0002.a.normal_5:0 "La terre exhale, mais elle ne dort pas."
 lv_noxious_gases_pulse.0002.a.tt.normal_5:0 "Les fumées s'amincissant, la colonie de [noxious_gases_province.GetName] a été épargnée."

 lv_noxious_gases_pulse.0002.t.spooky_1:0 "Quelque Chose dans la Brume"
 lv_noxious_gases_pulse.0002.desc.spooky_1:0 "Les fumées ne se sont pas contentées d'épaissir, elles ont changé. Non de couleur ni d'odeur, mais de présence. Le brouillard s'attarde plus longtemps qu'il ne le devrait, s'enroulant selon des motifs étranges et délibérés. Un éclaireur jure avoir vu des ombres s'y mouvoir. Des ombres qui ne ressemblaient ni à des hommes, ni à des bêtes, mais à quelque chose... d'autre qui observait.\n\nAu crépuscule, la brume apporte avec elle un bruit semblable à de faibles murmures. Les feux vacillent lorsqu'on les approche d'elle. De vieilles runes, longtemps crues dépourvues de sens, se mettent à luire faiblement sur les pierres enfouies.\n\nCertains disent que ces gaz réveillent d'antiques magies enfouies au plus profond de Valyria. Des pouvoirs liés à la fumée et à l'os. D'autres disent que la terre se souvient simplement de ce qu'elle fut jadis : un royaume de sorcellerie et de magies sombres.\n\nPeu dorment tranquilles. Moins encore osent parler de ce qu'ils ont vu."
 lv_noxious_gases_pulse.0002.a.spooky_1:0 "Mieux vaut ne pas s'attarder sur ce qui ne peut s'expliquer."
 lv_noxious_gases_pulse.0002.a.tt.spooky_1:0 "Les fumées toxiques de [noxious_gases_province.GetName] se dissipent malgré tout."

 lv_noxious_gases_pulse.0002.t.spooky_2:0 "Échos dans le Vent"
 lv_noxious_gases_pulse.0002.desc.spooky_2:0 "Le brouillard revient plus épais qu'avant, et avec lui viennent des sons qu'aucune gorge vivante ne devrait produire : de sourds gémissements, des hurlements lointains, et... le martèlement de sabots invisibles sur la pierre.\n\nCertains prétendent que c'est le vent qui se tord dans les salles en ruine, mais d'autres jurent avoir entendu des voix parler dans une langue morte depuis longtemps.\n\nChaque nuit, les sons se font plus audacieux. Non plus proches, simplement plus forts. Comme si ce qui les produit voulait être entendu."
 lv_noxious_gases_pulse.0002.a.spooky_2:0 "La terre se souvient de choses que nous n'étions pas destinés à connaître."
 lv_noxious_gases_pulse.0002.a.tt.spooky_2:0 "[noxious_gases_province.GetName] est resté agité pour un temps, mais les fumées ont fini par se dissiper."

 lv_noxious_gases_pulse.0002.t.spooky_3:0 "Le Souffle des Morts"
 lv_noxious_gases_pulse.0002.desc.spooky_3:0 "Une bande de voyageurs traverse la brume et en ressort livide, tremblante... et étrangement silencieuse. Leur peau ne porte aucune blessure, pourtant leurs yeux sont vitreux et hagards, et leurs bouches tressaillent de mots qu'ils ne peuvent prononcer.\n\nIls ne répondent pas quand on leur parle. Ils se contentent de respirer, lentement, avec des inspirations rauques, encore et encore. Vous ordonnez qu'on les surveille, mais certains gardes refusent de s'en approcher.\n\nQuoi qu'il se soit passé dans cette brume, une part de la chose est restée en eux."
 lv_noxious_gases_pulse.0002.a.spooky_3:0 "Veillez à leur confort... et à leur confinement."
 lv_noxious_gases_pulse.0002.a.tt.spooky_3:0 "Ce qui est arrivé à ces hommes demeure un mystère, mais la brume au-dessus de [noxious_gases_province.GetName] a fini par retrouver son épaisseur d'antan."

 lv_noxious_gases_pulse.0002.t.spooky_4:0 "La Couleur Sous la Cendre"
 lv_noxious_gases_pulse.0002.desc.spooky_4:0 "Le temps d'une heure, la brume luit d'un vert ténu. Pas un vert éclatant, mais assez pour projeter une lumière spectrale sur le sol dévasté. Sous cette lueur, des motifs qui ressemblent presque à d'anciens glyphes apparaissent sur des pierres antiques, invisibles depuis des siècles.\n\nCertains prétendent qu'il s'agit d'une réaction naturelle. Quoi que cela signifie. D'autres refusent d'en parler. La lueur s'éteint avant l'aube, ne laissant derrière elle que silence et fumée."
 lv_noxious_gases_pulse.0002.a.spooky_4:0 "Peut-être n'était-ce jamais destiné à être vu à la lumière du jour."
 lv_noxious_gases_pulse.0002.a.tt.spooky_4:0 "L'air de [noxious_gases_province.GetName] a vite retrouvé son état d'autrefois."

 lv_noxious_gases_pulse.0002.t.spooky_5:0 "La Cendre dans le Sang"
 lv_noxious_gases_pulse.0002.desc.spooky_5:0 "Plusieurs ouvriers travaillant près des fumées développent d'étranges afflictions : une peau qui grisonne et s'écaille comme un parchemin calciné, des veines qui palpitent faiblement comme si elles luisaient sous la surface. Aucun ne montre de signe de maladie ou de douleur, mais aucun n'a plus tout à fait figure humaine.\n\nUn guérisseur insiste, ce n'est qu'une exposition chimique. Un autre y voit une malédiction. Et une vieille femme, à moitié folle, jure avoir vu de telles marques sur les anciens lords dragons, juste avant le Fléau."
 lv_noxious_gases_pulse.0002.a.spooky_5:0 "Brûlez les corps. Brûlez les outils. N'en parlez à personne."
 lv_noxious_gases_pulse.0002.a.tt.spooky_5:0 "Les fumées finissent par quitter [noxious_gases_province.GetName]."

 lv_noxious_gases_pulse.0003.t:0 "L'Air qui Empoisonne"
 lv_noxious_gases_pulse.0003.desc:0 "L'air fétide qui plane sur [noxious_gases_province.GetName] a fini par réclamer son dû. D'abord, les gens ne faisaient que tousser et pleurer des yeux. Bientôt, cela devient fièvre, puis faiblesse, puis mort. Des foyers entiers tombent malades en quelques jours, et ceux qui soignent les affligés restent rarement en bonne santé longtemps.\n\nQue le poison engendre lui-même cette maladie ou qu'il ne fasse qu'affaiblir ceux qui sont forcés de le respirer, nul guérisseur ne saurait le dire."
 lv_noxious_gases_pulse.0003.a:0 "Que [ROOT.Char.GetFaith.HighGodName] ait pitié de nous."

 lv_noxious_gases_pulse.0003.t.normal_1:0 "Souffles Amers"
 lv_noxious_gases_pulse.0003.desc.normal_1:0 "Les fumées se sont attardées plus longtemps qu'à l'accoutumée au-dessus de [noxious_gases_province.GetName], s'installant sur les vallées jusqu'à ce que chaque souffle porte le goût du soufre. Bientôt, des ouvriers se sont mis à s'effondrer là où ils se tenaient, suivis de leurs familles, puis de leurs voisins.\n\nL'asphyxie était l'explication la plus simple. Mais dès l'apparition des symptômes, la plupart ont compris que le mal était bien pire."
 lv_noxious_gases_pulse.0003.a.normal_1:0 "L'air apporte avec lui maladie et mort."

 lv_noxious_gases_pulse.0003.t.normal_2:0 "Une Contagion Silencieuse"
 lv_noxious_gases_pulse.0003.desc.normal_2:0 "Cela commence discrètement. Une toux ici. Une fièvre là. Peu s'en inquiètent, jusqu'à ce que les guérisseurs se retrouvent débordés par le nombre de patients.\n\nÀ ce moment-là, le mal s'est déjà répandu dans tout [noxious_gases_province.GetName]."
 lv_noxious_gases_pulse.0003.a.normal_2:0 "Scellez les portes et soignez les malades."

 lv_noxious_gases_pulse.0003.t.normal_3:0 "Le Poison Prend Racine"
 lv_noxious_gases_pulse.0003.desc.normal_3:0 "La brume suffocante refuse de se lever. Les hommes qui endurent les fumées depuis des semaines se retrouvent désormais trop faibles pour travailler, tandis que les enfants et les vieillards périssent les premiers.\n\nLe poison qui plane sur [noxious_gases_province.GetName] a cédé la place à quelque chose de plus mortel encore."
 lv_noxious_gases_pulse.0003.a.normal_3:0 "Malédiction !"

 lv_noxious_gases_pulse.0003.t.normal_4:0 "Vents Funestes"
 lv_noxious_gases_pulse.0003.desc.normal_4:0 "Un vent chaud disperse les fumées de [noxious_gases_province.GetName] à travers champs et colonies. En quelques jours, la maladie suit son sillage. Les marchés se vident, les routes se taisent, et chaque étranger de passage est accueilli d'un regard méfiant.\n\nLa colonie ferme ses portes, mais la maladie se soucie peu des murailles."
 lv_noxious_gases_pulse.0003.a.normal_4:0 "Ne laissez pas ce mal se propager."

 lv_noxious_gases_pulse.0003.t.normal_5:0 "Le Prix de Chaque Souffle"
 lv_noxious_gases_pulse.0003.desc.normal_5:0 "Pendant des mois, le peuple de [noxious_gases_province.GetName] a enduré l'air empoisonné, croyant que survivre chaque jour suffisait comme victoire. Aujourd'hui, ce fardeau réclame son dû.\n\nLa fièvre se propage de foyer en foyer, et chaque jour qui passe laisse moins de mains pour enterrer les morts."
 lv_noxious_gases_pulse.0003.a.normal_5:0 "Les vivants doivent continuer."

 lv_noxious_gases_pulse.0003.t.spooky_1:0 "Le Souffle d'En Bas"
 lv_noxious_gases_pulse.0003.desc.spooky_1:0 "Les premières victimes de [noxious_gases_province.GetName] affirment avoir entendu une respiration au sein de la brume.\n\nLente. Lourde. Patiente.\n\nDès le lendemain matin, elles sont fiévreuses, et avant un nouveau lever de soleil, beaucoup sont mortes. Celles qui survivent refusent de parler de ce qu'elles ont entendu, si ce n'est pour jurer que la respiration a continué longtemps après qu'elles eurent fui la brume."
 lv_noxious_gases_pulse.0003.a.spooky_1:0 "Ne vous aventurez pas où s'amasse la brume."

 lv_noxious_gases_pulse.0003.t.spooky_2:0 "La Fièvre Pâle"
 lv_noxious_gases_pulse.0003.desc.spooky_2:0 "Le mal se propage rapidement à travers [noxious_gases_province.GetName], mais ses victimes présentent un aspect troublant. Leur peau pâlit jusqu'à devenir cendreuse, tandis que leurs lèvres s'assombrissent comme poudrées de suie.\n\nLes guérisseurs ne connaissent aucune maladie semblable. Les plus anciens colons murmurent que Valyria recèle des maux que le monde a depuis longtemps oubliés."
 lv_noxious_gases_pulse.0003.a.spooky_2:0 "Certaines choses auraient dû rester enfouies."

 lv_noxious_gases_pulse.0003.t.spooky_3:0 "Murmures à Travers la Fumée"
 lv_noxious_gases_pulse.0003.desc.spooky_3:0 "Ceux que frappe la maladie se mettent à parler dans leur sommeil. Peu comprennent leurs mots, bien que plus d'un érudit insiste sur le fait que cette langue ressemble au haut valyrien ancien.\n\nLa fièvre emporte de nombreuses vies à [noxious_gases_province.GetName] avant que les voix ne finissent par se taire."
 lv_noxious_gases_pulse.0003.a.spooky_3:0 "Quoi qui parle à travers eux, n'y prêtez pas l'oreille."

 lv_noxious_gases_pulse.0003.t.spooky_4:0 "Ceux Qui Marchent dans la Cendre"
 lv_noxious_gases_pulse.0003.desc.spooky_4:0 "Les malades de [noxious_gases_province.GetName] quittent leur lit la nuit sans nul souvenir d'où ils sont allés. Au matin, des traces de pas encerclent les tours en ruine et les temples oubliés avant de disparaître dans la cendre.\n\nLa maladie continue de se propager, ne laissant derrière elle que des rumeurs effrayées et des maisons abandonnées."
 lv_noxious_gases_pulse.0003.a.spooky_4:0 "Barrez les portes avant la tombée de la nuit."

 lv_noxious_gases_pulse.0003.t.spooky_5:0 "Le Souffle du Fléau"
 lv_noxious_gases_pulse.0003.desc.spooky_5:0 "Certains prétendent que ce fléau n'en est pas un. Ils disent que la terre a rouvert d'anciennes blessures, libérant le même souffle empoisonné qui balaya Valyria le jour où les Possessions Valyriennes s'effondrèrent.\n\nConte ou vérité, les morts continuent de s'accumuler, et bien peu s'aventurent désormais volontiers dans la brume."
 lv_noxious_gases_pulse.0003.a.spooky_5:0 "Cette terre maudite..."

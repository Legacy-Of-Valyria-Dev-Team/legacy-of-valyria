  # Mines Pulse
  lv_mines_pulse.0001.t:0 "Murmures Sous [mines_province.GetNameNoTooltip]"
  lv_mines_pulse.0001.desc:0 "La nuit, les vents portent d'étranges sons depuis les anciennes mines valyriennes : de sourds grondements, comme de la pierre grinçant contre la pierre, suivis d'un sifflement qui brûle l'oreille. Les gens du cru prétendent que ce n'est que l'air circulant dans les tunnels effondrés, mais vos éclaireurs parlent de pire.\n\nL'un a juré avoir vu des marques de griffes en fusion gravées le long d'un puits effondré. Un autre, blême de peur, a juré avoir entendu quelque chose respirer dans les ténèbres. Les mineurs refusent de retourner. Même les bêtes ne s'aventurent plus près de l'entrée du puits.\n\nQuelque chose s'agite sous [mines_province.GetName]. Et quoi que ce soit, cela se souvient du goût du feu et de la chair."
  lv_mines_pulse.0001.a:0 "Nous resterons vigilants... et prierons pour que les vouivres restent enfouies."
  lv_mines_pulse.0001.a.tt:0 "Les sons finissent par se taire, et les mines sont laissées en paix pour l'instant."
  lv_mines_pulse.0001.a.tt.firewyrm:0 "Quelque chose émerge des mines."

  # Noxious Gases Pulse
  lv_noxious_gases_pulse.0001.t:0 "Quand l'Air S'Alourdit"
  lv_noxious_gases_pulse.0001.desc:0 "Les vents ont tourné. Ce qui n'était qu'une brume dérivante s'est épaissi en un brouillard blafard et suffocant qui s'accroche à chaque pierre et chaque feuille. À travers les basses terres scarifiées de [noxious_gases_province.GetName], l'air s'alourdit de la morsure âcre du soufre et de la puanteur lente et brûlante de la ruine.\n\nLes animaux fuient les vallées. Les hommes crachent du sang avant de s'effondrer à genoux. Même le feu brûle pâle dans la brume, comme s'il avait peur de respirer. Ceux qui habitent près des veines volcaniques disent que cela arrive toujours quand la terre gronde sourdement : une saison funeste, quand la terre exhale du poison au lieu de souffle.\n\nCertains murmurent que la maladie se propage. D'autres parlent de présages. Mais la plupart se contentent d'enrouler un tissu autour de leur bouche et espèrent voir une autre aube."
  lv_noxious_gases_pulse.0001.a:0 "Nous ne pouvons qu'endurer, et prier pour que cela passe vite."
  
  lv_noxious_gases_pulse.0002.t:0 "Un Souffle Entre les Tempêtes"
  lv_noxious_gases_pulse.0002.desc:0 "Pour la première fois depuis des semaines, le vent tourne, pur depuis la mer. Le brouillard âcre s'amenuise, se retirant des basses terres comme une marée maussade. Les oiseaux reviennent aux arbres. Un enfant rit sans tousser. Les feux brûlent vrai et vif à nouveau.\n\nLe poison n'a pas disparu, seulement reculé : comme une bête se glissant dans sa tanière. Pourtant, en cet instant, il y a de la clarté. Les montagnes fument encore au loin, mais les cieux au-dessus sont assez dégagés pour voir les étoiles.\n\nCe n'est pas la guérison. Ce n'est pas le salut. Mais c'est un souffle, aussi bref soit-il."
  lv_noxious_gases_pulse.0002.a:0 "Nous prendrons toute la clémence que la terre accorde."
  lv_noxious_gases_pulse.0002.a.tt:0 "Les vapeurs toxiques de [noxious_gases_province.GetName] se dispersent, et la terre respire à nouveau."

  lv_noxious_gases_pulse.0002.t.normal_1:0 "Les Vents Tournent Cléments"
  lv_noxious_gases_pulse.0002.desc.normal_1:0 "Un rare changement de vent emporte les vapeurs suffocantes vers la mer. Bien que l'air sente encore faiblement le soufre, et que les cendres continuent de tomber comme poussière d'un brasero oublié, la brume étouffante s'est levée.\n\nDans les restes squelettiques des rues de pierre, les voix portent plus loin. Les feux de camp brûlent sans quintes de toux. Pour la première fois depuis des semaines, la terre ne semble plus vouloir vous tuer."
  lv_noxious_gases_pulse.0002.a.normal_1:0 "Nous prendrons toute la clémence possible, même ici."
  lv_noxious_gases_pulse.0002.a.tt.normal_1:0 "L'air de [noxious_gases_province.GetName] devient un peu plus tolérable."

  lv_noxious_gases_pulse.0002.t.normal_2:0 "Cieux Dégagés, Pour L'Instant"
  lv_noxious_gases_pulse.0002.desc.normal_2:0 "Les cieux au-dessus de [noxious_gases_province.GetName] restent gris, non de nuages, mais de cendres en suspension éternelle dans l'air. Pourtant aujourd'hui, les vapeurs basses se sont amincies, et l'on peut marcher dans les avenues craquelées des ruines sans poumons brûlants ni yeux larmoyants.\n\nCe n'est pas pur, pas vraiment. Mais c'est survivable. Et cela seul suffit à éveiller un optimisme prudent."
  lv_noxious_gases_pulse.0002.a.normal_2:0 "Un souffle amer vaut mieux qu'aucun."
  lv_noxious_gases_pulse.0002.a.tt.normal_2:0 "Le travail continue tandis que les colons de [noxious_gases_province.GetName] peuvent à nouveau respirer un peu mieux."

  lv_noxious_gases_pulse.0002.t.normal_3:0 "Un Moment pour Respirer"
  lv_noxious_gases_pulse.0002.desc.normal_3:0 "Les brumes qui s'enroulaient jadis étroitement autour de chaque colonne brisée et crête d'obsidienne se sont retirées. Une pâle lumière du soleil lutte à travers un plafond de suie volcanique, projetant une lueur blême sur la pierre noircie.\n\nDes chemins perdus dans les vapeurs et l'ombre se révèlent brièvement. L'air est encore chaud, encore âcre, mais l'on peut marcher sans s'étouffer, et cela suffit à compter."
  lv_noxious_gases_pulse.0002.a.normal_3:0 "Même dans les cendres, un chemin peut être dégagé."
  lv_noxious_gases_pulse.0002.a.tt.normal_3:0 "[noxious_gases_province.GetName] pousse un soupir de soulagement longtemps attendu."

  lv_noxious_gases_pulse.0002.t.normal_4:0 "Purifié par la Pluie"
  lv_noxious_gases_pulse.0002.desc.normal_4:0 "Le ciel chargé de cendres de [noxious_gases_province.GetName] a pleuré pendant des jours : une pluie épaisse et granuleuse qui a transformé les routes en bouillie noire et trempé même les capes les plus endurcies. Mais quand l'orage passa, il emporta avec lui le pire du poison stagnant dans l'air.\n\nLes vapeurs se sont amincies, bien que l'odeur de soufre et de fumée persiste, tissée dans chaque pierre. Pourtant, pour une fois, respirer ne brûle pas."
  lv_noxious_gases_pulse.0002.a.normal_4:0 "La pluie ne nettoie rien, mais elle accorde un répit."
  lv_noxious_gases_pulse.0002.a.tt.normal_4:0 "Les vapeurs ont été emportées, pour un temps."

  lv_noxious_gases_pulse.0002.t.normal_5:0 "Les Cendres se Déposent"
  lv_noxious_gases_pulse.0002.desc.normal_5:0 "Pour un temps, les vents chargés de vapeurs s'apaisent. L'air reste lourd et imprégné de l'amertume du feu ancien, mais les nuages roulants de fumée ont reflué. À travers les collines en ruines et les tours brisées, les cendres gisent sans être dérangées, épaisses comme neige, silencieuses comme une crypte.\n\nCe n'est pas la paix, seulement une pause. Mais sous le ciel meurtri de [noxious_gases_province.GetName], c'est le plus qu'on puisse espérer."
  lv_noxious_gases_pulse.0002.a.normal_5:0 "La terre exhale, mais elle ne dort pas."
  lv_noxious_gases_pulse.0002.a.tt.normal_5:0 "Avec l'amincissement des vapeurs, la colonie de [noxious_gases_province.GetName] a été épargnée."

  lv_noxious_gases_pulse.0002.t.spooky_1:0 "Quelque Chose dans la Brume"
  lv_noxious_gases_pulse.0002.desc.spooky_1:0 "Les vapeurs ne se sont pas simplement épaissies : elles ont changé. Non de couleur ou d'odeur, mais de présence. Le brouillard s'accroche plus longtemps qu'il ne le devrait, s'enroulant de manières étranges et délibérées. Un éclaireur jure avoir vu des ombres se mouvoir à l'intérieur, ni hommes, ni bêtes, mais quelque chose qui observe.\n\nAu crépuscule, la brume vibre d'un son semblable à un souffle murmuré. Les feux vacillent quand on les place près d'elle. D'anciennes runes, longtemps considérées comme dénuées de sens, commencent à luire faiblement sur des pierres englouties.\n\nCertains disent que les gaz éveillent d'anciennes magies enfouies sous Valyria, des pouvoirs liés à la fumée et aux ossements. D'autres disent que c'est simplement la terre qui se souvient de ce qu'elle fut jadis : non seulement un royaume de feu, mais de sorcellerie.\n\nPeu dorment paisiblement. Moins encore osent parler de ce qu'ils ont vu."
  lv_noxious_gases_pulse.0002.a.spooky_1:0 "Mieux vaut ne pas s'attarder sur ce qui ne peut être expliqué."
  lv_noxious_gases_pulse.0002.a.tt.spooky_1:0 "Les vapeurs toxiques de [noxious_gases_province.GetName] se dispersent malgré tout."

  lv_noxious_gases_pulse.0002.t.spooky_2:0 "Échos sur le Vent"
  lv_noxious_gases_pulse.0002.desc.spooky_2:0 "Le brouillard roule plus épais qu'avant, et avec lui viennent des sons qu'aucune gorge vivante ne devrait produire : de sourdes plaintes, des hurlements lointains, le claquement de sabots invisibles sur la pierre. Certains prétendent que c'est le vent se tordant dans les salles en ruines, mais d'autres jurent avoir entendu des voix parlant une langue depuis longtemps morte.\n\nChaque nuit, les sons deviennent plus hardis. Pas plus proches, juste plus forts. Comme si ce qui les produit voulait être entendu."
  lv_noxious_gases_pulse.0002.a.spooky_2:0 "La terre se souvient de choses que nous n'étions pas censés connaître."
  lv_noxious_gases_pulse.0002.a.tt.spooky_2:0 "[noxious_gases_province.GetName] est restée agitée un temps, mais les vapeurs ont fini par se disperser."

  lv_noxious_gases_pulse.0002.t.spooky_3:0 "Des Morts qui Respirent"
  lv_noxious_gases_pulse.0002.desc.spooky_3:0 "Un groupe de voyageurs traverse la brume et en émerge pâle, tremblant... et étrangement silencieux. Leur peau ne porte aucune blessure, pourtant leurs yeux sont vitreux et vagues, et leurs bouches tressaillent avec des mots qu'ils ne peuvent prononcer.\n\nIls ne répondent pas quand on leur parle. Ils respirent simplement : de lentes et rauques inhalations, encore et encore. Vous ordonnez qu'on les surveille, mais certains gardes refusent de s'en approcher.\n\nQuoi qu'il soit arrivé dans ce brouillard, une partie est restée avec eux."
  lv_noxious_gases_pulse.0002.a.spooky_3:0 "Veillez à leur confort... et gardez-les confinés."
  lv_noxious_gases_pulse.0002.a.tt.spooky_3:0 "Ce qui est arrivé à ces hommes resta un mystère, mais finalement le brouillard sur [noxious_gases_province.GetName] s'amincit pour redevenir ce qu'il était."

  lv_noxious_gases_pulse.0002.t.spooky_4:0 "La Couleur des Profondeurs"
  lv_noxious_gases_pulse.0002.desc.spooky_4:0 "Durant une seule heure, le brouillard luit faiblement d'un vert, non pas vif, mais suffisant pour projeter une lumière spectrale sur le sol brisé. Sous sa lueur, d'anciens glyphes émergent sur les vieilles pierres, des motifs que nul n'avait vus depuis des siècles.\n\nCertains prétendent que c'est une réaction naturelle. D'autres n'en parlent pas du tout. La lueur s'estompe avant l'aube, ne laissant que silence et fumée."
  lv_noxious_gases_pulse.0002.a.spooky_4:0 "Peut-être n'était-ce jamais destiné à être vu à la lumière du jour."
  lv_noxious_gases_pulse.0002.a.tt.spooky_4:0 "Bientôt, l'air de [noxious_gases_province.GetName] revint à ce qu'il était."

  lv_noxious_gases_pulse.0002.t.spooky_5:0 "Cendres dans le Sang"
  lv_noxious_gases_pulse.0002.desc.spooky_5:0 "Plusieurs ouvriers travaillant près des vapeurs développent d'étranges afflictions : une peau qui grisonne et s'écaille comme du parchemin brûlé, et des veines qui pulsent faiblement comme si elles luisaient par-dessous. Aucun ne montre de signes de maladie ou de douleur, mais aucun n'a plus tout à fait l'air humain.\n\nUn guérisseur insiste que ce n'est qu'une exposition chimique. Un autre prétend que c'est une malédiction. Et une vieille femme, à moitié folle, jure avoir vu de telles marques sur les anciens Seigneurs Dragons, juste avant le Fléau."
  lv_noxious_gases_pulse.0002.a.spooky_5:0 "Brûlez les corps. Brûlez les outils. N'en parlez à personne."
  lv_noxious_gases_pulse.0002.a.tt.spooky_5:0 "Finalement, les vapeurs quittent [noxious_gases_province.GetName]."
  
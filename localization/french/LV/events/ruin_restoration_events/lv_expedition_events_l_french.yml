l_french:
  ## Expedition Events
  lv_expedition_event.0010.a.tt:0 "Vous établissez le camp et commencez vos préparatifs pour l'expédition qui vous attend."

  # Valyria
  lv_expedition_event.0010.t.valyria:0 "À la Lisière du Fléau"
  lv_expedition_event.0010.desc.valyria:0 "Votre navire dérive vers une côte brisée, où la pierre déchiquetée et les flèches d'obsidienne griffent l'horizon comme les vestiges de quelque dieu antique. L'air est lourd et chargé, comme s'il se souvenait encore du feu qui consuma tout. Valyria se dresse devant vous, fracturée mais toujours respirante. Jadis le cœur battant d'un empire de dragons, elle est désormais un lieu dont on parle avec crainte, dans les mythes et la nostalgie. Quoi qui vous attende en ces terres maudites, cela attend depuis très, très longtemps."
  lv_expedition_event.0010.a.valyria:0 "Le Fléau est passé. Mais est-il vraiment terminé ?"

  # Lands of the Long Summer
  lv_expedition_event.0010.t.lands_of_the_long_summer:0 "Sous le Ciel de Cendres"
  lv_expedition_event.0010.desc.lands_of_the_long_summer:0 "La mer se retire derrière vous, et la terre s'élève devant vos pas : brûlée par le soleil, calcinée et immobile. Les Terres du Long Été s'étendent comme les côtes d'une bête enterrée depuis des millénaires. Les routes des dragons découpent les collines noircies, et les ossements de l'ancienne domination gisent fissurés sous la végétation sauvage et les cendres mouvantes. C'est ici que l'ombre de Valyria tomba pour la première fois sur le monde des mortels. Désormais, vous suivez ses traces, incertain de ce qui pourrait répondre à votre appel."
  lv_expedition_event.0010.a.lands_of_the_long_summer:0 "Ici, même la ruine conserve la mémoire."

  ## Expedition Progress Events
  lv_expedition_progress_event.0001.t:0 "Un Tunnel Trop Profond"
  lv_expedition_progress_event.0001.desc:0 "Dans le cadre des efforts de l'expédition pour cartographier les vastes systèmes de grottes tortueuses sous la région, une petite équipe d'éclaireurs fut envoyée en avant pour sonder les passages plus profonds au-delà de la route principale d'exploration. Quand ils ne revinrent pas à la tombée de la nuit, l'inquiétude saisit le campement entier.\n\nPendant une journée complète, il n'y eut aucun signe d'eux, jusqu'à ce qu'ils titubent en retour, couverts de poussière et visiblement ébranlés par ce qu'ils avaient découvert.\n\nIls parlent d'une descente au-delà d'escaliers brisés et de statues usées par le temps, d'un air qui devint immobile et glacé, et d'étranges gravures ciselées en motifs que personne ne reconnut. À la limite de la lumière de leurs torches, ils trouvèrent un vaste gouffre : sans fond, silencieux et d'une ancienneté terrifiante.\n\nIls refusèrent d'aller plus loin. Quelque chose, prétendent-ils, les observait depuis les ténèbres."
  lv_expedition_progress_event.0001.a:0 "Marquez le chemin. Nous y retournerons peut-être quand nous serons prêts."
  
  lv_expedition_progress_event.0002.t:0 "L'Appel du Vide"
  lv_expedition_progress_event.0002.desc:0 "Bien que scellé aux regards, le gouffre au-delà du sentier marqué s'attarde dans les esprits de votre expédition comme une obsession. Ceux qui l'entrevirent se trouvent agités, leurs pensées spiralant sans cesse vers le puits noir et les gravures qui l'entourent. D'autres parlent d'entendre des choses la nuit : de doux murmures sous la terre, ou le son lointain de pierres qui tombent là où aucune ne devrait tomber.\n\nC'est comme si l'abîme attendait patiemment. Observait. Appelait les vivants vers lui.\n\nCertains pressent à la prudence, craignant ce qui pourrait demeurer dans les profondeurs interdites. D'autres suggèrent que de tels mystères ne devraient pas être laissés enterrés. La décision vous appartient entièrement."
  lv_expedition_progress_event.0002.a:0 "Laissons cela intact. Certaines portes valent mieux fermées."
  lv_expedition_progress_event.0002.b:0 "Effondrez l'entrée. Nous n'étions pas censés trouver ceci."
  lv_expedition_progress_event.0002.c:0 "Préparez les cordes et les lanternes. Nous descendons plus profond."
  lv_expedition_progress_event.0002.d:0 "Il y a quelque chose derrière ces gravures. Nous devons savoir ce que c'est."

  lv_expedition_progress_event.0003.t:0 "Les Gravures S'Agitent"
  lv_expedition_progress_event.0003.desc:0 "Le gouffre demeure intact, son sentier non scellé mais évité par tous. Pourtant dans les jours qui suivent, le malaise s'installe sur le camp comme la brume matinale, lourd et persistant.\n\nL'équipe d'éclaireurs qui entrevit en premier l'abîme commence à se plaindre d'étranges rêves : des visions de chute éternelle à travers la pierre noire, ou d'être observés par des yeux invisibles. Certains parlent de symboles qui luisent derrière leurs paupières quand ils les ferment, pulsant avec un rythme qui n'est pas le leur.\n\nDes murmures emplissent le silence entre les tentes durant les longues nuits. Un vent qui n'agite pas les arbres soupire à travers les grottes mystérieuses.\n\nEt bien que personne n'ose retourner au bord du gouffre, quelque chose derrière la roche se souvient parfaitement."
  lv_expedition_progress_event.0003.a:0 "Que personne ne s'en approche à nouveau."
  lv_expedition_progress_event.0003.a.tt:0 "Vous éloignez votre équipe du sentier gravé. La tension persiste dans l'air."

  lv_expedition_progress_event.0004.t:0 "Sceller le Passage"
  lv_expedition_progress_event.0004.desc:0 "Vous donnez l'ordre, et dans la journée, votre équipe se met au travail avec détermination. La pierre et la terre sont délogées avec soin, puis avec urgence, alors que le gouffre est enterré sous des tonnes de roche et de débris. La poussière étouffe l'air tandis que les dernières pierres sont mises en place, et pendant un moment, on dirait que les ténèbres sous vos pieds ont été réduites au silence.\n\nMais le calme ne dure pas longtemps.\n\nLes nuits deviennent immobiles d'une façon peu familière, trop immobiles. Votre peuple dort d'un sommeil agité. Les outils disparaissent, retrouvés plus tard placés en motifs que personne ne se rappelle avoir arrangés. Et quand le vent souffle à travers la caverne scellée, cela ressemble à un souffle retenu entre des dents serrées.\n\nLe vide a été enterré... mais pas oublié."
  lv_expedition_progress_event.0004.a:0 "Qu'il reste enterré. Quoi que ce fût, c'est terminé."
  lv_expedition_progress_event.0004.a.tt:0 "Le passage est scellé, mais quelque chose s'agite encore en dessous."

  lv_expedition_progress_event.0005.t:0 "Des Échos dans les Profondeurs"
  lv_expedition_progress_event.0005.desc:0 "Avec les cordes sécurisées et les lanternes allumées, votre équipe descend dans l'obscurité totale. L'air s'épaissit en descendant, vicié et non remué par le temps. Les murs jadis lisses deviennent déchiquetés, et les gravures mystérieuses : formes tordues et alien, deviennent plus fréquentes et complexes.\n\nPuis le son commence.\n\nAu début, ce n'est que l'écho de vos propres pas, mais il se transforme. Se déforme. Les pas de pied se doublent comme s'ils étaient imités par quelque chose. Les voix rebondissent de mur en mur : douces, lointaines, presque familières. Un porteur de lanterne lâche sa lumière, prétendant que quelqu'un a murmuré son nom depuis les ténèbres.\n\nFinalement, vous atteignez une plateforme de pierre au-dessus d'un vide béant. Le gouffre plonge plus profond que vos torches ne peuvent atteindre. Et de l'intérieur... quelque chose appelle. Pas en mots, mais en sensation : une attraction dans vos os, une pression derrière vos yeux.\n\nQuelque chose d'ancien est là en bas. Qui observe."
  lv_expedition_progress_event.0005.a:0 "Tenez votre position. Prenez des mesures, enregistrez tout."
  lv_expedition_progress_event.0005.a.tt:0 "Vous continuez prudemment, documentant ce qui gît en dessous."

  lv_expedition_progress_event.0006.t:0 "Ce qui Rôde En Dessous"
  lv_expedition_progress_event.0006.desc:0 "Malgré le malaise croissant, votre expédition continue d'avancer. Les gravures commencent à changer de ton : moins comme de l'art, plus comme des avertissements terrifiants. Des cercles de symboles déchiquetés bordent la roche autour de ce qui semble être un puits antique ou un autel, ses bords calcinés comme par le feu... ou quelque chose de plus ancien.\n\nPuis, sans avertissement, un tremblement secoue la pierre. Les ombres les plus profondes ondulent comme des vagues. Un de vos érudits s'effondre, serrant sa tête, murmurant dans une langue que personne ne reconnaît.\n\nVous vous tenez au bord de quelque chose de vaste : que ce soit la connaissance, la ruine, ou l'éveil d'une puissance oubliée."
  lv_expedition_progress_event.0006.a:0 "Aucun artefact ne vaut ce qui gît ici. Nous partons."
  lv_expedition_progress_event.0006.b:0 "Nous sommes venus si loin. Nous irons jusqu'au bout."

  lv_expedition_progress_event.0007.t:0 "Se Détourner de l'Abîme"
  lv_expedition_progress_event.0007.desc:0 "Avec le malaise devenant insupportable et l'air lui-même épais d'effroi, vous sonnez la retraite. L'équipe bouge rapidement, laissant derrière l'étrange plateforme et la relique qu'elle portait. Les ténèbres semblent presque réticentes à vous libérer de leur emprise.\n\nDe retour au camp, le silence règne en maître. L'équipe est ébranlée, mais intacte. L'expédition revient avec des croquis, des inscriptions, et des récits que personne ne croira jamais. Vous n'avez pas touché le vide... mais il vous a touchés.\n\nEt il se souvient parfaitement."
  lv_expedition_progress_event.0007.a:0 "Certaines portes valent mieux fermées."
  lv_expedition_progress_event.0007.a.tt:0 "Vous revenez saufs... avec la connaissance, et le malaise."

  lv_expedition_progress_event.0008.t:0 "La Chambre la Plus Profonde"
  lv_expedition_progress_event.0008.desc:0 "Votre descente continue au-delà des murs gravés et dans un espace intact depuis des millénaires. Au cœur du vide gît une estrade de pierre, sculptée de spirales qui semblent bouger quand on ne les regarde pas directement. Dessus repose un objet : lisse, sombre, et bourdonnant d'énergie froide. Une relique ? Une prison ?\n\nAlors que vous vous approchez, la pression dans vos oreilles devient insupportable. Plusieurs membres de l'équipe s'effondrent. La lumière vacille et meurt, mais pas avant un dernier aperçu de quelque chose de vaste qui s'agite au-delà du voile : serpentin, ailé, ou peut-être entièrement sans forme.\n\nVous saisissez l'objet et battez en retraite, les murs tremblant alors que la chambre réagit. Le chemin de sortie s'effondre derrière vous, scellant le vide une fois de plus."
  lv_expedition_progress_event.0008.a:0 "Nous l'emportons, quel qu'en soit le coût."
  lv_expedition_progress_event.0008.a.tt:0 "Vous récupérez un artefact puissant et dangereux... mais quelque chose pourrait avoir suivi."

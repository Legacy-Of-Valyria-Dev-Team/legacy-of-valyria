l_french:
 ## Expedition Events
 lv_expedition_event.0010.a.tt:0 "Vous établissez le campement et entamez vos préparatifs pour l'expédition à venir."

 # Valyria
 lv_expedition_event.0010.t.valyria:0 "Au Bord du Fléau"
 lv_expedition_event.0010.desc.valyria:0 "Votre vaisseau dérive vers un rivage brisé, où la pierre déchiquetée et les flèches d'obsidienne griffent l'horizon comme les vestiges de quelque dieu ancien. L'air est lourd — chargé, comme s'il se souvenait du feu. Valyria se dresse, fracturée et frémissante. Jadis le cœur d'un empire de dragons, aujourd'hui un lieu que l'on évoque avec crainte, légende et nostalgie. Quoi qui vous attende ici, cela patiente depuis fort longtemps."
 lv_expedition_event.0010.a.valyria:0 "Le Fléau est passé. Mais s'est-il achevé ?"

 # Lands of the Long Summer
 lv_expedition_event.0010.t.lands_of_the_long_summer:0 "Sous le Ciel de Cendre"
 lv_expedition_event.0010.desc.lands_of_the_long_summer:0 "La mer recule derrière vous, et la terre s'élève devant — brûlée de soleil, calcinée, immobile. Les Terres du Long Été s'étendent comme les côtes d'une bête ensevelie. Des routes-dragons tranchent les collines noircies, et les ossements de l'ancienne domination gisent fissurés sous une végétation sauvage et une cendre mouvante. C'est ici que l'ombre de Valyria est tombée pour la première fois sur le monde. Vous suivez à présent ses traces, sans savoir ce qui pourrait répondre."
 lv_expedition_event.0010.a.lands_of_the_long_summer:0 "Ici, même la ruine a mémoire."

 ## Expedition Progress Events
 lv_expedition_progress_event.0001.t:0 "Un Tunnel Trop Profond"
 lv_expedition_progress_event.0001.desc:0 "Dans le cadre des efforts de l'expédition pour cartographier le vaste réseau de grottes sinueuses sous la région, une petite équipe détachée fut envoyée en éclaireur pour sonder les passages au-delà de l'itinéraire principal. Lorsqu'elle ne revint pas à la tombée de la nuit, le malaise s'empara du camp.\n\nDurant une journée entière, nul signe d'eux — jusqu'à ce qu'ils titubent hors des ténèbres, couverts de poussière et visiblement ébranlés.\n\nIls parlent d'une descente au-delà d'escaliers brisés et de statues érodées, d'un air devenu immobile et glacé, et d'étranges gravures tracées selon des motifs que nul ne reconnaissait. À la limite de leurs torches, ils ont découvert un gouffre immense — sans fond, silencieux, et ancien.\n\nIls refusèrent d'aller plus loin. Quelque chose, prétendent-ils, les observait."
 lv_expedition_progress_event.0001.a:0 "Marquez le chemin. Nous y reviendrons quand nous serons prêts."

 lv_expedition_progress_event.0002.t:0 "L'Appel du Vide"
 lv_expedition_progress_event.0002.desc:0 "Bien que scellé hors de vue, le gouffre au-delà du chemin marqué s'attarde dans l'esprit de votre expédition. Ceux qui l'ont aperçu se retrouvent agités, leurs pensées revenant sans cesse vers la fosse noire et les gravures qui l'entourent. D'autres parlent de bruits entendus la nuit — de doux murmures sous la terre, ou le son lointain de pierres qui tombent là où rien n'est tombé.\n\nC'est comme si l'abîme attendait. Observait. Appelait.\n\nCertains pressent à la prudence, craignant ce qui pourrait habiter les profondeurs. D'autres suggèrent que de tels mystères ne devraient pas rester ensevelis. La décision vous revient."
 lv_expedition_progress_event.0002.a:0 "Qu'il demeure intact. Certaines portes sont mieux laissées closes."
 lv_expedition_progress_event.0002.b:0 "Effondrez l'entrée. Nous n'étions pas destinés à trouver cela."
 lv_expedition_progress_event.0002.c:0 "Préparez les cordes et les lanternes. Nous descendons plus profond."
 lv_expedition_progress_event.0002.d:0 "Il y a quelque chose derrière ces gravures. Nous devons savoir ce que c'est."

 lv_expedition_progress_event.0003.t:0 "Les Gravures S'Agitent"
 lv_expedition_progress_event.0003.desc:0 "Le gouffre demeure intact, son passage non scellé mais évité. Pourtant, dans les jours qui suivent, le malaise s'installe sur le camp comme une brume matinale.\n\nL'équipe détachée qui aperçut l'abîme en premier commence à se plaindre de rêves étranges — des visions de chute sans fin à travers la pierre noire, ou d'être observé par des yeux invisibles. Certains parlent de symboles qui luisent derrière leurs paupières closes, palpitant selon un rythme qui n'est pas le leur.\n\nDes murmures emplissent le silence entre les tentes, la nuit venue. Un vent qui n'agite pas les arbres soupire à travers les grottes.\n\nEt bien que nul n'ose retourner au bord, quelque chose derrière la roche se souvient."
 lv_expedition_progress_event.0003.a:0 "Que nul ne s'en approche plus jamais."
 lv_expedition_progress_event.0003.a.tt:0 "Vous éloignez votre équipe du chemin gravé. La tension persiste."

 lv_expedition_progress_event.0004.t:0 "Sceller le Passage"
 lv_expedition_progress_event.0004.desc:0 "Vous donnez l'ordre, et dans la journée, votre équipe se met à l'œuvre. Pierre et terre sont déplacées avec soin, puis avec urgence, tandis que le gouffre est enseveli sous des tonnes de roche et de gravats. La poussière étouffe l'air lorsque les dernières pierres sont posées, et pendant un instant, on croirait que les ténèbres sous vos pieds ont été réduites au silence.\n\nMais le calme ne dure pas.\n\nLes nuits se figent d'une manière inhabituelle — trop immobiles. Votre peuple dort mal. Des outils disparaissent, retrouvés plus tard disposés selon des motifs que nul ne se souvient d'avoir arrangés. Et quand le vent souffle sur la caverne scellée, il résonne comme un souffle retenu entre des dents serrées.\n\nLe vide a été enseveli... non oublié."
 lv_expedition_progress_event.0004.a:0 "Qu'il demeure enseveli. Quoi que ce fût, c'est terminé."
 lv_expedition_progress_event.0004.a.tt:0 "Le passage est scellé, mais quelque chose remue encore en dessous."

 lv_expedition_progress_event.0005.t:0 "Échos dans les Profondeurs"
 lv_expedition_progress_event.0005.desc:0 "Cordes arrimées et lanternes allumées, votre équipe descend dans l'obscurité. L'air s'épaissit à mesure que vous progressez, rance et figé par le temps. Les murs autrefois lisses deviennent déchiquetés, et les gravures — formes tordues, étrangères — se font plus fréquentes et complexes.\n\nPuis le son commence.\n\nD'abord, ce n'est que l'écho de vos propres pas, mais il se déforme. Se torde. Les foulées reviennent en écho comme imitées. Des voix rebondissent de mur en mur — douces, lointaines, presque familières. Un porteur de lanterne laisse tomber sa lumière, jurant qu'une voix a chuchoté son nom depuis les ténèbres.\n\nFinalement, vous atteignez une plate-forme de pierre surplombant un vide béant. Le gouffre plonge plus profond que vos torches ne peuvent l'éclairer. Et de ses tréfonds... quelque chose appelle. Non par des mots, mais par une sensation — une traction dans vos os, une pression derrière vos yeux.\n\nQuelque chose d'ancien se trouve là-dessous. Qui observe."
 lv_expedition_progress_event.0005.a:0 "Tenez bon. Prenez des relevés, consignez tout."
 lv_expedition_progress_event.0005.a.tt:0 "Vous poursuivez avec prudence, documentant ce qui se trouve en contrebas."

 lv_expedition_progress_event.0006.t:0 "Ce Qui Rôde en Dessous"
 lv_expedition_progress_event.0006.desc:0 "Malgré le malaise grandissant, votre expédition poursuit sa route. Les gravures commencent à changer de nature — moins semblables à de l'art, plus proches d'avertissements. Des cercles de symboles acérés bordent la roche autour de ce qui semble être un puits ou un autel ancien, ses rebords calcinés comme par le feu... ou par quelque chose de plus ancien encore.\n\nPuis, sans prévenir, un tremblement parcourt la pierre. Les ombres les plus profondes ondulent. L'un de vos érudits s'effondre, se tenant la tête, murmurant une langue que nul ne reconnaît.\n\nVous vous tenez au bord de quelque chose de vaste — que ce soit savoir, ruine, ou éveil."
 lv_expedition_progress_event.0006.a:0 "Aucun artefact ne vaut ce qui se trouve ici. Nous partons."
 lv_expedition_progress_event.0006.b:0 "Nous sommes venus jusqu'ici. Nous irons au bout."

 lv_expedition_progress_event.0007.t:0 "Détourner l'Abîme"
 lv_expedition_progress_event.0007.desc:0 "Le malaise devenant insupportable et l'air lui-même chargé d'effroi, vous sonnez la retraite. L'équipe se retire promptement, abandonnant l'étrange plate-forme et la relique qu'elle portait. L'obscurité semble presque réticente à vous laisser partir.\n\nDe retour au camp, le silence règne. L'équipe est ébranlée, mais indemne. L'expédition revient avec des croquis, des inscriptions, et des récits que nul ne croira. Vous n'avez pas touché le vide — mais il vous a touchés.\n\nEt il se souvient."
 lv_expedition_progress_event.0007.a:0 "Certaines portes sont mieux laissées closes."
 lv_expedition_progress_event.0007.a.tt:0 "Vous revenez sains et saufs... porteurs de savoir, et de malaise."

 lv_expedition_progress_event.0008.t:0 "La Chambre la Plus Profonde"
 lv_expedition_progress_event.0008.desc:0 "Votre descente se poursuit au-delà des murs gravés, jusque dans un espace intact depuis des millénaires. Au cœur du vide se dresse une estrade de pierre, ciselée de spirales qui semblent bouger lorsqu'on ne les regarde pas directement. Dessus repose un objet — lisse, sombre, vibrant d'une énergie glacée. Une relique ? Une prison ?\n\nÀ mesure que vous approchez, la pression dans vos oreilles devient insoutenable. Plusieurs membres de l'équipe s'effondrent. La lumière vacille et meurt, mais non sans qu'un dernier aperçu ne révèle quelque chose de vaste s'agitant au-delà du voile — serpentin, ailé, ou peut-être totalement informe.\n\nVous saisissez l'objet et battez en retraite, les murs tremblant tandis que la chambre réagit. La sortie s'effondre derrière vous, scellant le vide une fois de plus."
 lv_expedition_progress_event.0008.a:0 "Nous l'emportons, quel qu'en soit le prix."
 lv_expedition_progress_event.0008.a.tt:0 "Vous récupérez un artefact puissant et dangereux... mais quelque chose a peut-être suivi."

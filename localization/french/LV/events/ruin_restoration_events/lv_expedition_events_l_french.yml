l_french:
  ## Expedition Events
  lv_expedition_event.0010.a.tt:0 "Vous établissez le camp et commencez vos préparatifs pour l'expédition à venir."

  # Valyria
  lv_expedition_event.0010.t.valyria:0 "Au Seuil du Fléau"
  lv_expedition_event.0010.desc.valyria:0 "Votre vaisseau dérive vers un rivage brisé, où pierre déchiquetée et flèches d'obsidienne griffent l'horizon comme les restes de quelque dieu ancien. L'air est lourd, chargé, comme s'il se souvenait du feu. Valyria se profile, fracturée et respirante. Jadis cœur d'un empire de dragons, désormais lieu évoqué avec crainte, mythe et nostalgie. Quoi que vous attende ici, cela attend depuis très longtemps."
  lv_expedition_event.0010.a.valyria:0 "Le Fléau est passé. Mais a-t-il pris fin ?"

  # Lands of the Long Summer
  lv_expedition_event.0010.t.lands_of_the_long_summer:0 "Sous le Ciel de Cendres"
  lv_expedition_event.0010.desc.lands_of_the_long_summer:0 "La mer recule derrière vous, et la terre s'élève devant : brûlée par le soleil, calcinée, immobile. Les Terres du Long Été s'étendent comme les côtes d'une bête ensevelie. Les routes de dragon traversent des collines noircies, et les ossements de l'ancienne domination gisent craquelés sous la végétation sauvage et les cendres mouvantes. C'est ici que l'ombre de Valyria tomba pour la première fois sur le monde. Désormais, vous suivez ses traces, incertain de ce qui pourrait répondre."
  lv_expedition_event.0010.a.lands_of_the_long_summer:0 "Ici, même la ruine a de la mémoire."

  ## Expedition Progress Events
  lv_expedition_progress_event.0001.t:0 "Un Tunnel Trop Profond"
  lv_expedition_progress_event.0001.desc:0 "Dans le cadre des efforts de l'expédition pour cartographier les vastes et sinueux réseaux de grottes sous la région, une petite équipe fut envoyée en éclaireur pour sonder des passages plus profonds au-delà de la route principale. Quand elle ne revint pas à la tombée de la nuit, le malaise s'empara du camp.\n\nPendant une journée entière, nulle trace d'eux, jusqu'à ce qu'ils reviennent en titubant, couverts de poussière et visiblement ébranlés.\n\nIls parlent d'une descente au-delà d'escaliers brisés et de statues usées, d'un air devenu immobile et glacé, et d'étranges gravures tracées selon des motifs que nul ne reconnaissait. À la limite de leur lumière de torche, ils trouvèrent un vaste gouffre : sans fond, silencieux, et ancien.\n\nIls refusèrent d'aller plus loin. Quelque chose, prétendent-ils, les observait."
  lv_expedition_progress_event.0001.a:0 "Marquez le chemin. Nous reviendrons quand nous serons prêts."
  
  lv_expedition_progress_event.0002.t:0 "L'Appel du Vide"
  lv_expedition_progress_event.0002.desc:0 "Bien que scellé aux regards, le gouffre au-delà du chemin marqué persiste dans les esprits de votre expédition. Ceux qui l'ont entrevu se retrouvent agités, leurs pensées spiralant sans cesse vers le puits noir et les gravures qui l'entourent. D'autres parlent d'entendre des choses la nuit : de doux murmures sous la terre, ou le son distant de pierres tombant là où aucune n'est tombée.\n\nC'est comme si l'abîme attendait. Observait. Appelait.\n\nCertains prônent la prudence, craignant ce qui pourrait demeurer dans les profondeurs. D'autres suggèrent que de tels mystères ne devraient pas rester ensevelis. La décision vous revient."
  lv_expedition_progress_event.0002.a:0 "Qu'il reste intact. Certaines portes feraient mieux de ne jamais être ouvertes."
  lv_expedition_progress_event.0002.b:0 "Effondrez l'entrée. Nous n'étions pas censés trouver ceci."
  lv_expedition_progress_event.0002.c:0 "Préparez les cordes et les lanternes. Nous descendons plus profond."
  lv_expedition_progress_event.0002.d:0 "Il y a quelque chose derrière ces gravures. Nous devons savoir ce que c'est."

  lv_expedition_progress_event.0003.t:0 "Les Gravures S'Éveillent"
  lv_expedition_progress_event.0003.desc:0 "Le gouffre reste intact, son chemin descellé mais évité. Pourtant, dans les jours qui suivent, le malaise s'installe sur le camp comme une brume matinale.\n\nL'équipe d'éclaireurs qui a d'abord entrevu l'abîme commence à se plaindre de rêves étranges : des visions de chute sans fin à travers la pierre noire, ou d'être observés par des yeux invisibles. Certains parlent de symboles qui luisent derrière leurs paupières quand ils les ferment, pulsant selon un rythme qui n'est pas le leur.\n\nDes murmures emplissent le silence entre les tentes la nuit. Un vent qui n'agite pas les arbres soupire à travers les grottes.\n\nEt bien que nul n'ose retourner au bord, quelque chose derrière la roche se souvient."
  lv_expedition_progress_event.0003.a:0 "Que personne ne s'en approche plus."
  lv_expedition_progress_event.0003.a.tt:0 "Vous éloignez votre équipe du chemin gravé. La tension persiste."

  lv_expedition_progress_event.0004.t:0 "Sceller le Passage"
  lv_expedition_progress_event.0004.desc:0 "Vous donnez l'ordre, et en l'espace d'une journée, votre équipe se met à l'œuvre. Pierre et terre sont délogées avec soin, puis avec urgence, tandis que le gouffre est enseveli sous des tonnes de roche et de débris. La poussière étouffe l'air tandis que les dernières pierres sont posées, et pendant un instant, il semble que les ténèbres sous vos pieds aient été réduites au silence.\n\nMais le calme ne dure pas.\n\nLes nuits deviennent immobiles d'une façon inhabituelle, trop immobiles. Vos gens dorment d'un sommeil agité. Des outils disparaissent, retrouvés plus tard disposés selon des motifs que nul ne se souvient avoir arrangés. Et quand le vent souffle sur la caverne scellée, il ressemble à un souffle retenu entre des dents serrées.\n\nLe vide a été enseveli... pas oublié."
  lv_expedition_progress_event.0004.a:0 "Qu'il reste enseveli. Quoi que ce fût, c'est terminé."
  lv_expedition_progress_event.0004.a.tt:0 "Le passage est scellé, mais quelque chose remue encore en dessous."

  lv_expedition_progress_event.0005.t:0 "Échos dans les Profondeurs"
  lv_expedition_progress_event.0005.desc:0 "Les cordes sécurisées et les lanternes allumées, votre équipe descend dans les ténèbres. L'air s'épaissit à mesure que vous descendez, vicié et figé par le temps. Les parois jadis lisses deviennent déchiquetées, et les gravures, formes tortueuses et étrangères, se font plus fréquentes et complexes.\n\nPuis le son commence.\n\nD'abord, ce n'est que l'écho de vos propres pas, mais il se modifie. Se déforme. Les pas résonnent en retour comme s'ils étaient imités. Des voix rebondissent de paroi en paroi, douces, distantes, presque familières. Un porteur de lanterne laisse tomber sa lumière, prétendant que quelqu'un a murmuré son nom depuis les ténèbres.\n\nFinalement, vous atteignez une plateforme de pierre au-dessus d'un vide béant. Le gouffre plonge plus profond que vos torches ne peuvent atteindre. Et de l'intérieur... quelque chose appelle. Non par des mots, mais par sensation : une traction sur vos os, une pression derrière vos yeux.\n\nQuelque chose d'ancien est là-dessous. Qui observe."
  lv_expedition_progress_event.0005.a:0 "Tenez bon. Prenez des mesures, consignez tout."
  lv_expedition_progress_event.0005.a.tt:0 "Vous avancez prudemment, documentant ce qui gît en contrebas."

  lv_expedition_progress_event.0006.t:0 "Ce qui Rôde en Dessous"
  lv_expedition_progress_event.0006.desc:0 "Malgré le malaise grandissant, votre expédition poursuit. Les gravures commencent à changer de ton : moins comme de l'art, davantage comme des avertissements. Des cercles de symboles dentelés bordent la roche autour de ce qui semble être un ancien puits ou autel, ses bords calcinés comme par le feu... ou quelque chose de plus ancien.\n\nPuis, sans avertissement, un tremblement secoue la pierre. Les ombres les plus profondes ondulent. L'un de vos érudits s'effondre, se tenant la tête, marmonnant une langue que nul ne reconnaît.\n\nVous vous tenez au bord de quelque chose de vaste : que ce soit savoir, ruine ou éveil."
  lv_expedition_progress_event.0006.a:0 "Nul artefact ne vaut ce qui gît ici. Nous partons."
  lv_expedition_progress_event.0006.b:0 "Nous sommes allés si loin. Nous irons jusqu'au bout."

  lv_expedition_progress_event.0007.t:0 "Se Détourner de l'Abîme"
  lv_expedition_progress_event.0007.desc:0 "Le malaise devenant insupportable et l'air lui-même épais d'effroi, vous sonnez la retraite. L'équipe se déplace rapidement, laissant derrière elle l'étrange plateforme et la relique qu'elle portait. Les ténèbres semblent presque réticentes à vous libérer.\n\nDe retour au camp, le silence règne. L'équipe est ébranlée, mais intacte. L'expédition revient avec des croquis, des inscriptions et des récits que nul ne croira. Vous n'avez pas touché le vide, mais il vous a touchés.\n\nEt il se souvient."
  lv_expedition_progress_event.0007.a:0 "Certaines portes feraient mieux de ne jamais être ouvertes."
  lv_expedition_progress_event.0007.a.tt:0 "Vous revenez sains et saufs... avec du savoir, et du malaise."

  lv_expedition_progress_event.0008.t:0 "La Chambre la Plus Profonde"
  lv_expedition_progress_event.0008.desc:0 "Votre descente se poursuit au-delà des murs gravés et dans un espace que nul n'a touché depuis des millénaires. Au cœur du vide se trouve un dais de pierre, gravé de spirales qui semblent bouger quand on ne les regarde pas directement. Dessus repose un objet : lisse, sombre, et vibrant d'une énergie froide. Une relique ? Une prison ?\n\nTandis que vous approchez, la pression dans vos oreilles devient insupportable. Plusieurs membres de l'équipe s'effondrent. La lumière vacille et meurt, mais pas avant un dernier aperçu de quelque chose de vaste s'agitant au-delà du voile : serpentin, ailé, ou peut-être entièrement sans forme.\n\nVous saisissez l'objet et battez en retraite, les murs tremblant tandis que la chambre réagit. La sortie s'effondre derrière vous, scellant le vide une fois de plus."
  lv_expedition_progress_event.0008.a:0 "Nous l'emportons, quel qu'en soit le prix."
  lv_expedition_progress_event.0008.a.tt:0 "Vous récupérez un artefact puissant et dangereux... mais quelque chose a peut-être suivi."
  
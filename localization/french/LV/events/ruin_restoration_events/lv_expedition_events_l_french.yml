l_french:
  ## Expedition Events
  lv_expedition_event.0010.a.tt:0 "Vous établissez le camp et commencez vos préparatifs pour l'expédition à venir."

  # Valyria
  lv_expedition_event.0010.t.valyria:0 "Aux portes du Fléau"
  lv_expedition_event.0010.desc.valyria:0 "Votre vaisseau dérive vers une côte brisée, où des pierres déchiquetées et des flèches d'obsidienne lacèrent l'horizon comme les restes de quelque dieu antique. L'air est lourd, chargé, comme s'il se souvenait encore du feu. Valyria se dresse devant vous, fracturée et respirante. Jadis le cœur battant d'un empire de dragons, elle n'est désormais qu'un lieu dont on parle avec crainte, mythe et nostalgie. Quoi que vous attende ici, cela patiente depuis très, très longtemps."
  lv_expedition_event.0010.a.valyria:0 "Le Fléau est passé. Mais a-t-il vraiment pris fin ?"

  # Lands of the Long Summer
  lv_expedition_event.0010.t.lands_of_the_long_summer:0 "Sous le ciel de cendre"
  lv_expedition_event.0010.desc.lands_of_the_long_summer:0 "La mer reflue derrière vous, et la terre s'élève devant vous : calcinée par le soleil, brûlée et immobile. Les Contrées de l'Été Éternel s'étendent telles les côtes d'une bête ensevelie. Les routes des dragons tranchent à travers des collines noircies, et les ossements de l'ancienne domination gisent fissurés sous une végétation sauvage et la cendre mouvante. C'est ici que l'ombre de Valyria s'abattit pour la première fois sur le monde. Maintenant, vous suivez ses traces, incertain de ce qui pourrait vous répondre."
  lv_expedition_event.0010.a.lands_of_the_long_summer:0 "Ici, même les ruines conservent une mémoire."

  ## Expedition Progress Events
  lv_expedition_progress_event.0001.t:0 "Un tunnel trop profond"
  lv_expedition_progress_event.0001.desc:0 "Dans le cadre des efforts de l'expédition pour cartographier les vastes et sinueux systèmes de cavernes sous la région, une petite équipe d'éclaireurs fut envoyée en avant pour sonder les passages plus profonds au-delà de la route principale d'exploration. Quand ils ne revinrent pas à la tombée de la nuit, l'inquiétude s'empara du camp.\n\nDurant une journée entière, il n'y eut aucun signe d'eux, jusqu'à ce qu'ils reviennent en titubant, couverts de poussière et visiblement ébranlés.\n\nIls parlent d'une descente au-delà d'escaliers brisés et de statues usées, d'un air qui devint immobile et froid, et d'étranges gravures ciselées selon des motifs que nul ne reconnut. À la limite de leur lumière de torche, ils découvrirent un vaste gouffre : sans fond, silencieux et antique.\n\nIls refusèrent catégoriquement d'aller plus loin. Quelque chose, affirment-ils, les observait depuis les ténèbres."
  lv_expedition_progress_event.0001.a:0 "Marquez le chemin. Nous reviendrons quand nous serons prêts."
  
  lv_expedition_progress_event.0002.t:0 "L'appel du vide"
  lv_expedition_progress_event.0002.desc:0 "Bien qu'il soit scellé aux regards, le gouffre au-delà du sentier marqué persiste dans l'esprit de votre expédition. Ceux qui l'ont entrevu se trouvent agités, leurs pensées spiralant vers la fosse noire et les gravures qui l'entourent. D'autres parlent d'entendre des choses la nuit : murmures étouffés sous la terre, ou le son lointain de pierres qui chutent là où rien n'est tombé.\n\nC'est comme si l'abîme attendait. Observait. Appelait.\n\nCertains prônent la prudence, redoutant ce qui peut habiter les profondeurs. D'autres suggèrent que de tels mystères ne devraient pas rester ensevelis. La décision vous revient."
  lv_expedition_progress_event.0002.a:0 "Laissons-le intact. Certaines portes ne doivent pas être ouvertes."
  lv_expedition_progress_event.0002.b:0 "Effondrez l'entrée. Nous n'étions pas censés trouver cela."
  lv_expedition_progress_event.0002.c:0 "Préparez les cordes et les lanternes. Nous descendons plus profond."
  lv_expedition_progress_event.0002.d:0 "Il y a quelque chose derrière ces gravures. Nous devons savoir ce que c'est."

  lv_expedition_progress_event.0003.t:0 "Les gravures s'agitent"
  lv_expedition_progress_event.0003.desc:0 "Le gouffre demeure intact, son chemin non scellé mais évité. Pourtant dans les jours qui suivent, l'inquiétude s'installe sur le camp comme une brume matinale.\n\nL'équipe d'éclaireurs qui aperçut d'abord l'abîme commence à se plaindre d'étranges rêves : visions de chute éternelle à travers la pierre noire, ou d'être observée par des yeux invisibles. Certains parlent de symboles qui luisent derrière leurs paupières quand ils les ferment, pulsant avec un rythme qui n'est pas le leur.\n\nLes murmures emplissent le silence entre les tentes la nuit. Un vent qui ne remue pas les arbres soupire à travers les cavernes.\n\nEt bien que nul n'ose retourner au bord, quelque chose derrière la roche se souvient."
  lv_expedition_progress_event.0003.a:0 "Que personne ne s'en approche plus."
  lv_expedition_progress_event.0003.a.tt:0 "Vous éloignez votre équipe du sentier gravé. La tension persiste."

  lv_expedition_progress_event.0004.t:0 "Sceller le passage"
  lv_expedition_progress_event.0004.desc:0 "Vous donnez l'ordre, et dans la journée, votre équipe se met au travail. Pierre et terre sont délogées avec soin, puis avec urgence, tandis que le gouffre est enseveli sous des tonnes de roc et de débris. La poussière étouffe l'air tandis que les dernières pierres sont posées, et durant un instant, il semble que les ténèbres sous vos pieds ont été réduites au silence.\n\nMais le calme ne dure pas.\n\nLes nuits deviennent immobiles d'une façon inconnue : trop immobiles. Vos gens dorment mal. Des outils disparaissent, retrouvés plus tard disposés selon des motifs que nul ne se rappelle avoir arrangés. Et quand le vent souffle sur la caverne scellée, cela sonne comme un souffle coincé entre dents serrées.\n\nLe vide a été enseveli... pas oublié."
  lv_expedition_progress_event.0004.a:0 "Qu'il reste enseveli. Quoi que ce fût, c'est fini."
  lv_expedition_progress_event.0004.a.tt:0 "Le passage est scellé, mais quelque chose s'agite encore en dessous."

  lv_expedition_progress_event.0005.t:0 "Échos dans les profondeurs"
  lv_expedition_progress_event.0005.desc:0 "Avec les cordes fixées et les lanternes allumées, votre équipe descend dans les ténèbres. L'air s'épaissit tandis que vous allez plus profond, stagnant et immuable depuis des temps immémoriaux. Les murs jadis lisses deviennent déchiquetés, et les gravures (formes tordues et étrangères) se font plus fréquentes et complexes.\n\nPuis le son commence.\n\nD'abord, ce n'est que l'écho de vos propres pas, mais il se modifie. Se déforme. Les foulées redoublent comme si elles étaient imitées. Des voix rebondissent de mur en mur : douces, lointaines, presque familières. Un porteur de lanterne lâche sa lumière, affirmant que quelqu'un a murmuré son nom depuis les ténèbres.\n\nFinalement, vous atteignez une plate-forme de pierre au-dessus d'un vide béant. Le gouffre plonge plus profondément que vos torches ne peuvent l'atteindre. Et de l'intérieur... quelque chose appelle. Pas en mots, mais en sensation : une attraction dans vos os, une pression derrière vos yeux.\n\nQuelque chose d'ancien est là en bas. Qui observe."
  lv_expedition_progress_event.0005.a:0 "Tenez votre position. Prenez des mesures, consignez tout."
  lv_expedition_progress_event.0005.a.tt:0 "Vous continuez prudemment, documentant ce qui gît en dessous."

  lv_expedition_progress_event.0006.t:0 "Ce qui rôde en dessous"
  lv_expedition_progress_event.0006.desc:0 "Malgré l'inquiétude grandissante, votre expédition continue. Les gravures commencent à changer de ton : moins comme de l'art, plus comme des avertissements. Des cercles de symboles déchiquetés bordent la roche autour de ce qui semble être un ancien puits ou autel, ses bords brûlés comme par le feu... ou quelque chose de plus ancien.\n\nPuis, sans avertissement, un tremblement parcourt la pierre. Les ombres les plus profondes ondulent. L'un de vos érudits s'effondre, se serrant la tête, murmurant dans une langue que nul ne reconnaît.\n\nVous vous tenez au bord de quelque chose de vaste : que ce soit savoir, ruine, ou éveil."
  lv_expedition_progress_event.0006.a:0 "Nul artefact ne vaut ce qui gît ici. Nous partons."
  lv_expedition_progress_event.0006.b:0 "Nous sommes venus si loin. Nous irons jusqu'au bout."

  lv_expedition_progress_event.0007.t:0 "Détourner l'abîme"
  lv_expedition_progress_event.0007.desc:0 "Avec l'inquiétude devenant insupportable et l'air lui-même épais d'épouvante, vous sonnez la retraite. L'équipe bouge rapidement, laissant derrière elle l'étrange plate-forme et la relique qu'elle portait. Les ténèbres semblent presque réticentes à vous libérer.\n\nDe retour au camp, le silence règne. L'équipe est ébranlée, mais intacte. L'expédition revient avec des croquis, des inscriptions, et des récits que nul ne croira. Vous n'avez pas touché le vide, mais il vous a touchés.\n\nEt il s'en souvient."
  lv_expedition_progress_event.0007.a:0 "Certaines portes ne doivent pas être ouvertes."
  lv_expedition_progress_event.0007.a.tt:0 "Vous revenez sains et saufs... avec du savoir, et de l'inquiétude."

  lv_expedition_progress_event.0008.t:0 "La chambre la plus profonde"
  lv_expedition_progress_event.0008.desc:0 "Votre descente continue au-delà des murs gravés et dans un espace intact depuis des millénaires. Au cœur du vide gît une estrade de pierre, sculptée de spirales qui semblent bouger quand on ne les regarde pas directement. Sur elle repose un objet : lisse, sombre, et vibrant d'une énergie froide. Une relique ? Une prison ?\n\nTandis que vous vous approchez, la pression dans vos oreilles devient insupportable. Plusieurs membres de l'équipe s'effondrent. La lumière vacille et meurt, mais pas avant un dernier aperçu de quelque chose de vaste s'agitant au-delà du voile : serpentin, ailé, ou peut-être entièrement informe.\n\nVous saisissez l'objet et battez en retraite, les murs tremblant tandis que la chambre réagit. Le chemin du retour s'effondre derrière vous, scellant le vide une fois de plus."
  lv_expedition_progress_event.0008.a:0 "Nous l'emportons, quel qu'en soit le prix."
  lv_expedition_progress_event.0008.a.tt:0 "Vous récupérez un artefact puissant et dangereux... mais quelque chose a peut-être suivi."

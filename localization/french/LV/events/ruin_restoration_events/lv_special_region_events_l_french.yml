l_french:
  ## Special Locations
  # Valyria
  lv_special_region_event.0001.t.valyria:0 "Valyria"
  lv_special_region_event.0001.desc.valyria:0 "Vous vous tenez au seuil de la légende. Valyria, jadis cœur d'un empire, berceau des dragons et siège de la puissance arcanique, gît désormais devant vous. La terre respire d'une façon étrange et lente, ses cieux teintés par les cendres anciennes et la chaleur. Nulle carte ne peut vous guider ici, seulement le poids de l'histoire et la prudence de ceux qui savent à quelle hauteur la grandeur s'éleva... et de quelle profondeur elle chuta.\n\n"
  lv_special_region_event.0001.desc.valyria.ruined:0 "Ceci n'est pas un lieu, c'est une plaie. Des tours de pierre tordue griffent le ciel, à moitié fondues par une flamme qu'aucune forge n'aurait pu engendrer. Des rivières bouillonnent sous la terre, et des murmures résonnent là où nulle bouche ne demeure. Le Fléau ne fut ni tempête ni guerre : ce fut l'annihilation faite manifeste. Et pourtant, même maintenant, des fragments de la puissance de Valyria pulsent faiblement sous les cendres."
  lv_special_region_event.0001.desc.valyria.restored:0 "Certains ont osé revenir. Parmi les décombres d'obsidienne et les routes de dragon brisées, de nouvelles fondations s'élèvent. Des âmes courageuses, ou folles, foulent à nouveau les anciens chemins, apprivoisant des poches de terre stable et rebâtissant sur un sol maudit. Les fantômes des Possessions Valyriennes persistent, mais la promesse aussi. Ce n'est pas la Valyria d'autrefois... mais elle pourrait encore devenir quelque chose de nouveau."
  lv_special_region_event.0001.a.valyria:0 "Ce lieu ne devrait pas être, et pourtant... le voici."

  # Lands of the Long Summer
  lv_special_region_event.0001.t.lands_of_the_long_summer:0 "Les Contrées de l'Été Éternel"
  lv_special_region_event.0001.desc.lands_of_the_long_summer:0 "L'horizon se transforme. Des falaises gris cendre se dressent au-dessus de côtes blanchies par le soleil, et le vent porte l'odeur lointaine du sel, du soufre et d'un pouvoir ancien. Vous avez franchi les Contrées de l'Été Éternel, là où l'ombre de Valyria s'étendait jadis sur le monde connu. Le ciel semble plus lourd ici, l'air plus épais d'histoires non contées et d'héritages défaits. Fouler ces terres, c'est marcher entre la grandeur et la tombe.\n\n"
  lv_special_region_event.0001.desc.lands_of_the_long_summer.ruined:0 "Ce qui reste n'est que le spectre de la gloire. Des routes étouffées par des vignes noircies, des salles de marbre fracassées et à moitié englouties, et des statues usées jusqu'à la lisseur par des siècles de tempêtes de cendres. Rien ne bouge hormis le vent à travers les colonnades brisées. Le Fléau n'a pas simplement tué un peuple : il a défait sa mémoire même. Pourtant, même dans la ruine, les ossements du pouvoir demeurent."
  lv_special_region_event.0001.desc.lands_of_the_long_summer.restored:0 "Bien que les cicatrices du Fléau persistent, la vie est revenue. De nouvelles bannières flottent sur les tours anciennes, et des langues étrangères résonnent dans les rues rebâties. Des marchands négocient sur des marchés construits au-dessus de palais fracassés, et la fumée s'élève non des volcans, mais des âtres. La terre est changée, mais point morte. Elle vit à nouveau, remodelée par des mains audacieuses qui n'ont pas craint de revendiquer un héritage maudit."
  lv_special_region_event.0001.a.lands_of_the_long_summer:0 "Peut-être la terre se souvient-elle de plus que les vivants."

  # Smoking Sea
  lv_special_region_event.0001.t.smoking_sea:0 "La Mer Fumante"
  lv_special_region_event.0001.desc.smoking_sea:0 "Vous naviguez dans un silence brisé seulement par le sifflement de marées invisibles. La Mer Fumante s'étend à l'infini, un miroir d'ombre et de fumée où les étoiles s'évanouissent et les compas deviennent traîtres. Jadis berceau de la puissance de Valyria, c'est désormais un lieu évité par marin et érudit pareillement. Les cartes ne la marquent que d'avertissements. Nul ne s'accorde sur où elle finit, seulement qu'elle change ceux qui la traversent.\n\n"
  lv_special_region_event.0001.desc.smoking_sea.ruined:0 "Votre vaisseau glisse dans les eaux de la Mer Fumante, bien que « eaux » semble un mot trop généreux. Les vagues sifflent comme si elles étaient blessées, la vapeur s'enroule comme des esprits s'élevant d'un champ de bataille, et l'air même a le goût des cendres et de la pierre brûlée. Les marins murmurent des ombres spectrales se mouvant sous la surface, des formes trop grandes, trop silencieuses, trop conscientes. Chaque planche craque d'inquiétude. Certains disent que le Fléau ne s'est jamais vraiment achevé ici : il a seulement sombré, et attend."
  lv_special_region_event.0001.desc.smoking_sea.restored:0 "Vous franchissez les frontières de la Mer Fumante et êtes accueilli non par des brumes brûlantes ou des vapeurs suffocantes, mais par un étrange silence révérencieux. L'eau repose immobile, ne bouillonnant plus, ne murmurant plus. Le ciel au-dessus demeure d'un gris maussade, pourtant il ne pleure plus de suie ni ne hurle de tonnerre. Nulle forme ne remue sous la surface, et pourtant le malaise persiste, comme un silence tenu trop longtemps. Vous êtes les premiers depuis des générations à naviguer ces eaux sans être inquiétés. Mais à quel prix la mer est-elle devenue silencieuse ?"
  lv_special_region_event.0001.a.smoking_sea:0 "Fumée ou immobilité, ce lieu se souvient de ce que nous avons oublié."
  
l_french:
  ## Special Locations
  # Valyria
  lv_special_region_event.0001.t.valyria:0 "Valyria"
  lv_special_region_event.0001.desc.valyria:0 "Vous vous tenez au seuil de la légende elle-même. Valyria, jadis le cœur battant de l'empire, berceau des dragons et siège de la puissance arcane, s'étend désormais devant vous dans sa grandeur déchue. La terre respire d'une manière étrange et lente, ses cieux teintés de cendres antiques et de chaleur résiduelle. Nulle carte ne peut vous guider en ces lieux maudits, seulement le poids de l'histoire et la prudence de ceux qui savent à quelle hauteur s'éleva jadis la grandeur... et de quelle chute elle chut.\n\n"
  lv_special_region_event.0001.desc.valyria.ruined:0 "Ce n'est point un lieu que vous contemplez, mais une blessure béante dans le monde. Des tours de pierre tordue griffent le ciel, à demi fondues par des flammes qu'aucune forge ne saurait enfanter. Les rivières bouillonnent sous la terre meurtrie, et des murmures résonnent là où nulle bouche ne demeure. Le Fléau ne fut point tempête ni guerre, mais l'anéantissement fait chair et manifesté. Et pourtant, même à présent, des fragments de la puissance valyriènne pulsent faiblement sous le linceul de cendres."
  lv_special_region_event.0001.desc.valyria.restored:0 "Certains osèrent revenir fouler cette terre maudite. Parmi les gravats d'obsidienne et les routes de dragon brisées, de nouvelles fondations s'élèvent pierre par pierre. Des âmes braves, ou folles, arpentent à nouveau les anciennes voies, domptant des poches de terrain stable et rebâtissant sur un sol maudit par les dieux. Les fantômes des Possessions s'attardent encore dans l'air épais, mais l'espoir aussi. Ce n'est point la Valyria d'antan... mais cela pourrait devenir quelque chose de nouveau."
  lv_special_region_event.0001.a.valyria:0 "Ce lieu ne devrait point exister, et pourtant... le voici."

  # Lands of the Long Summer
  lv_special_region_event.0001.t.lands_of_the_long_summer:0 "Contrées de l'été éternel"
  lv_special_region_event.0001.desc.lands_of_the_long_summer:0 "L'horizon se transforme sous vos yeux. Des falaises gris-cendre s'élèvent au-dessus de côtes blanchies par le soleil implacable, et le vent porte l'odeur lointaine de sel, de soufre, et d'ancienne puissance qui ne s'éteint jamais tout à fait. Vous avez franchi les frontières des Contrées de l'été éternel, là où l'ombre de Valyria s'étendait jadis sur le monde connu tout entier. Le ciel semble plus lourd en ces contrées, l'air plus épais d'histoires non contées et d'héritages défaits. Poser le pied en ces terres, c'est marcher entre grandeur et tombeau.\n\n"
  lv_special_region_event.0001.desc.lands_of_the_long_summer.ruined:0 "Ce qui demeure n'est que le fantôme décharné de la gloire passée. Des routes étouffées par la vigne noircie, des palais de marbre fracassés et à demi engloutis, et des statues polies jusqu'à l'os par des siècles de tempêtes de cendres. Rien ne remue que le vent à travers les colonnades brisées, chantant sa mélopée funèbre. Le Fléau n'a point simplement tué un peuple : il a défait leur mémoire même, effaçant jusqu'à l'écho de leurs noms. Pourtant, même dans la ruine, les ossements du pouvoir demeurent."
  lv_special_region_event.0001.desc.lands_of_the_long_summer.restored:0 "Bien que les cicatrices du Fléau persistent, la vie a fait son retour en ces terres désolées. De nouvelles bannières flottent au sommet des tours antiques, et des langues étrangères résonnent à travers les rues rebâties pierre par pierre. Les marchands marchandent dans des marchés érigés sur les fondations de palais brisés, et la fumée s'élève non plus des volcans, mais des foyers domestiques. La terre est changée, certes, mais point morte. Elle vit à nouveau, remodelée par des mains audacieuses qui n'ont point craint de revendiquer un héritage maudit."
  lv_special_region_event.0001.a.lands_of_the_long_summer:0 "Peut-être la terre se souvient-elle mieux que les vivants."

  # Smoking Sea
  lv_special_region_event.0001.t.smoking_sea:0 "La Mer Fumante"
  lv_special_region_event.0001.desc.smoking_sea:0 "Vous naviguez dans un silence que ne brise que le sifflement de marées invisibles. La Mer Fumante s'étend à l'infini, miroir d'ombre et de fumée où les étoiles s'effacent et les boussoles deviennent traîtresses. Jadis berceau de la puissance valyriènne, elle est désormais un lieu fui par marin et érudit de même. Les cartes ne la marquent que d'avertissements sinistres. Nul ne s'accorde sur ses limites, seulement sur le fait qu'elle transforme ceux qui la traversent. \n\n"
  lv_special_region_event.0001.desc.smoking_sea.ruined:0 "Votre navire glisse dans les eaux de la Mer Fumante, bien qu'« eaux » semble un terme par trop généreux. Les vagues sifflent comme blessées à mort, la vapeur se love tel des esprits s'élevant d'un champ de bataille, et l'air même a le goût de cendre et de pierre calcinée. Les marins murmurent à propos d'ombres spectrales se mouvant sous la surface maudite : des formes trop grandes, trop silencieuses, trop conscientes. Chaque planche du pont grince d'inquiétude. Certains prétendent que le Fléau ne s'acheva jamais vraiment en ces eaux : il ne fit que sombrer, et attend son heure."
  lv_special_region_event.0001.desc.smoking_sea.restored:0 "Vous franchissez les frontières de la Mer Fumante et êtes accueilli non point par des brumes ébouillantantes ou des vapeurs étouffantes, mais par un silence étrange et révérencieux. L'eau gît immobile, ne bouillonnant plus, ne murmurant plus ses secrets terribles. Le ciel au-dessus demeure d'un gris maussade, pourtant il ne pleure plus suie ni ne hurle le tonnerre. Nulles formes ne s'agitent sous la surface, et pourtant le malaise persiste, tel un silence trop longtemps tenu. Vous êtes le premier depuis des générations à naviguer ces eaux sans défi. Mais à quel prix la mer s'est-elle tue ?"
  lv_special_region_event.0001.a.smoking_sea:0 "Fumée ou immobilité, ce lieu se souvient de ce que nous avons oublié."

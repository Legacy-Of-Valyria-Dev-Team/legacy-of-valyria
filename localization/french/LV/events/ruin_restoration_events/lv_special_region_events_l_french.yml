l_french:
  ## Special Locations
  # Valyria
  lv_special_region_event.0001.t.valyria:0 "Valyria"
  lv_special_region_event.0001.desc.valyria:0 "Vous vous tenez au bord de la légende. Valyria - jadis le cœur de l'empire, le berceau des dragons, et le siège de la puissance arcanique - s'étend désormais devant vous. La terre respire de façon étrange et lente, ses cieux teintés par les cendres anciennes et la chaleur. Nulle carte ne peut vous guider ici, seulement le poids de l'histoire et la prudence de ceux qui savent à quelle hauteur la grandeur s'éleva... et de quelle profondeur elle chuta.\n\n"
  lv_special_region_event.0001.desc.valyria.ruined:0 "Ce n'est point un lieu - c'est une blessure. Des tours de pierre tordue griffent le ciel, à demi fondues par des flammes qu'aucune forge n'aurait pu enfanter. Les rivières bouillonnent sous la terre, et des murmures résonnent là où nulle bouche ne demeure. Le Fléau ne fut point une tempête ou une guerre - il fut l'anéantissement rendu manifeste. Et pourtant, même maintenant, des fragments de la puissance de Valyria pulsent faiblement sous les cendres."
  lv_special_region_event.0001.desc.valyria.restored:0 "Certains osèrent revenir. Parmi les gravats d'obsidienne et les routes des dragons brisées, de nouvelles fondations s'élèvent. Des âmes courageuses - ou folles - foulent de nouveau les anciens chemins, apprivoisant les poches de terrain stable et reconstruisant sur un sol maudit. Les fantômes des Possessions s'attardent, mais l'espoir aussi. Ce n'est point la Valyria d'antan... mais elle pourrait encore devenir quelque chose de nouveau."
  lv_special_region_event.0001.a.valyria:0 "Ce lieu ne devrait point être, et pourtant... le voici."

  # Lands of the Long Summer
  lv_special_region_event.0001.t.lands_of_the_long_summer:0 "Contrées de l'été éternel"
  lv_special_region_event.0001.desc.lands_of_the_long_summer:0 "L'horizon change. Des falaises gris-cendre s'élèvent au-dessus des terres côtières blanchies par le soleil, et le vent porte le parfum lointain du sel, du soufre et de l'ancien pouvoir. Vous avez pénétré dans les Contrées de l'Été Éternel - là où l'ombre de Valyria s'étendit jadis sur le monde connu. Le ciel semble plus lourd ici, l'air plus épais d'histoires non contées et d'héritages défaits. Poser le pied en ces terres, c'est marcher entre la grandeur et la tombe.\n\n"
  lv_special_region_event.0001.desc.lands_of_the_long_summer.ruined:0 "Ce qui demeure n'est que le fantôme de la gloire. Des routes étouffées par les vignes noircies, des halls de marbre brisés et à demi engloutis, et des statues polies par des siècles de tempêtes de cendres. Rien ne bouge hormis le vent à travers les colonnades brisées. Le Fléau n'a point simplement tué un peuple - il a défait leur mémoire même. Pourtant, même dans la ruine, les ossements du pouvoir demeurent."
  lv_special_region_event.0001.desc.lands_of_the_long_summer.restored:0 "Bien que les cicatrices du Fléau s'attardent, la vie est revenue. De nouvelles bannières flottent au-dessus des tours antiques, et des langues étrangères résonnent dans les rues reconstruites. Les marchands marchandent dans des marchés bâtis sur des palais brisés, et la fumée s'élève non des volcans, mais des foyers. La terre a changé - mais elle n'est point morte. Elle vit de nouveau, remodelée par des mains audacieuses qui n'ont point peur de revendiquer un héritage maudit."
  lv_special_region_event.0001.a.lands_of_the_long_summer:0 "Peut-être la terre se souvient-elle plus que les vivants."

  # Smoking Sea
  lv_special_region_event.0001.t.smoking_sea:0 "La mer Fumante"
  lv_special_region_event.0001.desc.smoking_sea:0 "Vous naviguez dans un silence brisé seulement par le sifflement des marées invisibles. La Mer Fumante s'étend sans fin, miroir d'ombre et de fumée où les étoiles disparaissent et les boussoles deviennent traîtresses. Jadis berceau du pouvoir de Valyria, elle est maintenant un lieu fui par le marin et l'érudit pareillement. Les cartes ne la marquent que d'avertissements. Nul ne s'accorde sur l'endroit où elle finit - seulement qu'elle change ceux qui la traversent.\n\n"
  lv_special_region_event.0001.desc.smoking_sea.ruined:0 "Votre vaisseau glisse dans les eaux de la Mer Fumante, bien qu'« eaux » semble un mot trop généreux. Les vagues sifflent comme si elles étaient blessées, la vapeur s'enroule comme des esprits s'élevant d'un champ de bataille, et l'air même a le goût des cendres et de la pierre brûlée. Les marins murmurent d'ombres fantomatiques bougeant sous la surface - formes trop grandes, trop silencieuses, trop savantes. Chaque planche grince d'inquiétude. Certains disent que le Fléau ne finit jamais vraiment ici - il ne fit que sombrer, et attend."
  lv_special_region_event.0001.desc.smoking_sea.restored:0 "Vous traversez les frontières de la Mer Fumante et êtes accueilli non par des brumes brûlantes ou des fumées suffocantes, mais par un étrange silence révérencieux. L'eau gît immobile - ne bouillonnant plus, ne murmurant plus. Le ciel au-dessus demeure d'un gris maussade, pourtant il ne pleure plus de suie ni ne hurle de tonnerre. Nulles formes ne s'agitent sous la surface, et pourtant l'inquiétude s'attarde, comme un silence trop longtemps tenu. Vous êtes le premier depuis des générations à naviguer ces eaux sans défi. Mais à quel prix la mer se tut-elle ?"
  lv_special_region_event.0001.a.smoking_sea:0 "Fumée ou immobilité, ce lieu se souvient de ce que nous avons oublié."

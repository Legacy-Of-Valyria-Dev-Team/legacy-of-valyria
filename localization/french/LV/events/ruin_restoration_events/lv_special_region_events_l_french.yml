l_french:
 ## Special Locations
 # Valyria
 lv_special_region_event.0001.t.valyria:0 "Valyria"
 lv_special_region_event.0001.desc.valyria:0 "Vous vous tenez au bord de la légende. Valyria — jadis cœur d'un empire, berceau des dragons, et siège d'une puissance arcanique — se dresse à présent devant vous. La terre respire étrangement, lentement, ses cieux teintés d'une cendre antique et de chaleur. Nulle carte ne peut vous guider ici, seulement le poids de l'histoire et la prudence de ceux qui savent combien haut la grandeur s'est élevée... et combien loin elle est tombée.\n\n"
 lv_special_region_event.0001.desc.valyria.ruined:0 "Ceci n'est pas un lieu — c'est une plaie. Des tours de pierre tordue griffent le ciel, à demi fondues par un feu qu'aucune forge n'aurait pu engendrer. Des rivières bouillonnent sous la terre, et des murmures résonnent là où nulle bouche ne subsiste. Le Fléau ne fut ni tempête ni guerre — ce fut l'anéantissement rendu manifeste. Et pourtant, même à présent, des fragments de la puissance de Valyria palpitent faiblement sous la cendre."
 lv_special_region_event.0001.desc.valyria.restored:0 "Certains ont osé revenir. Parmi les décombres d'obsidienne et les routes-dragons brisées, de nouvelles fondations s'élèvent. Des âmes braves — ou folles — arpentent de nouveau les anciennes voies, apprivoisant des poches de sol stable et rebâtissant sur une terre maudite. Les spectres des Possessions Valyriennes persistent, mais la promesse aussi. Ceci n'est pas la Valyria d'antan... mais cela pourrait encore devenir quelque chose de nouveau."
 lv_special_region_event.0001.a.valyria:0 "Ce lieu ne devrait pas être, et pourtant... le voici."

 # Lands of the Long Summer
 lv_special_region_event.0001.t.lands_of_the_long_summer:0 "Les Terres du Long Été"
 lv_special_region_event.0001.desc.lands_of_the_long_summer:0 "L'horizon change. Des falaises grises de cendre s'élèvent au-dessus de côtes blanchies par le soleil, et le vent porte le parfum lointain du sel, du soufre et d'une puissance ancienne. Vous avez pénétré dans les Terres du Long Été, où l'ombre de Valyria s'étendait jadis sur le monde connu. Le ciel semble plus lourd ici, l'air plus dense d'histoires tues et d'héritages défaits. Poser le pied sur ces terres, c'est fouler l'espace entre grandeur et tombeau.\n\n"
 lv_special_region_event.0001.desc.lands_of_the_long_summer.ruined:0 "Ce qui demeure n'est que le fantôme de la gloire. Des routes étouffées de vigne noircie, des salles de marbre fracassées et à demi englouties, et des statues polies par des siècles de tempêtes de cendre. Rien ne remue hormis le vent à travers les colonnades brisées. Le Fléau a corrompu jusqu'à la mémoire même des Valyriens. Pourtant, même en ruine, les os de la puissance demeurent."
 lv_special_region_event.0001.desc.lands_of_the_long_summer.restored:0 "Bien que les cicatrices du Fléau persistent, la vie est revenue. De nouvelles bannières flottent au-dessus des tours antiques, et des langues étrangères résonnent à travers les rues rebâties. Les marchands marchandent sur des places bâties sur des palais fracassés, et la fumée s'élève non des volcans, mais des foyers. La terre revit, remodelée par des mains audacieuses qui ne craignent pas de revendiquer un héritage maudit."
 lv_special_region_event.0001.a.lands_of_the_long_summer:0 "Peut-être la terre se souvient-elle davantage que les vivants."

 # Smoking Sea
 lv_special_region_event.0001.t.smoking_sea:0 "La Mer Fumante"
 lv_special_region_event.0001.desc.smoking_sea:0 "Vous voguez dans un silence brisé seulement par le sifflement de marées invisibles. La Mer Fumante s'étend sans fin, un miroir d'ombre et de fumée où les étoiles s'évanouissent et où les boussoles trahissent. Jadis berceau de la puissance de Valyria, elle est à présent un lieu que marins et érudits fuient également. Les cartes ne la marquent que d'avertissements. Nul ne s'accorde sur où elle finit — seulement sur le fait qu'elle transforme ceux qui la traversent.\n\n"
 lv_special_region_event.0001.desc.smoking_sea.ruined:0 "Votre vaisseau glisse dans les eaux de la Mer Fumante, bien qu'« eau » semble un mot trop généreux. Les vagues sifflent comme blessées, la vapeur s'enroule comme des esprits s'élevant d'un champ de bataille, et l'air même a le goût de la cendre et de la pierre calcinée. Les marins murmurent d'ombres spectrales se mouvant sous la surface — des formes trop vastes, trop silencieuses, trop conscientes. Chaque planche craque d'un malaise sourd. Certains disent que le Fléau n'a jamais vraiment pris fin ici — il n'a fait que sombrer, et il attend."
 lv_special_region_event.0001.desc.smoking_sea.restored:0 "Vous franchissez les frontières de la Mer Fumante et n'êtes accueillis ni par des brumes brûlantes ni par des fumées suffocantes, mais par un silence étrange et révérencieux. L'eau demeure immobile — elle ne bouillonne plus, ne murmure plus. Le ciel au-dessus reste d'un gris maussade, pourtant il ne pleure plus la suie ni ne hurle le tonnerre. Nulle forme ne remue sous la surface, et pourtant le malaise persiste, comme un silence trop longtemps retenu. Vous êtes le premier depuis des générations à voguer sur ces eaux sans être défié. Mais à quel prix la mer s'est-elle tue ?"
 lv_special_region_event.0001.a.smoking_sea:0 "Fumée ou immobilité, ce lieu se souvient de ce que nous avons oublié."

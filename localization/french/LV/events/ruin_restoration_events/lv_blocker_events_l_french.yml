 lv_special_blockers.0001.e:0 "Pirate"

 #You find a Dragon Egg when clearing a mine
 lv_special_blockers.0002.t:0 "[valyria_mine_province.GetName] : Une Trouvaille Sous les Flammes"
 lv_special_blockers.0002.desc:0 "La mine de [valyria_mine_province.GetName] a réclamé bien des vies, mais aujourd'hui elle offre quelque chose en retour. Au fond d'un puits effondré, parmi la pierre calcinée et les restes squelettiques de veurs de feu, les mineurs mirent au jour un objet curieux.\n\nLisse comme de l'onyx poli, veiné de braises luisantes, il palpite faiblement dans l'air étouffant — chaud au toucher, presque vivant. Cela ne peut être rien d'autre.\n\nUn œuf de dragon.\n\nLe contremaître frissonne à mon approche, me le tendant avec autant d'émerveillement que de crainte. Mon sang s'accélère."
 lv_special_blockers.0002.a:0 "L'œuf m'appartient désormais."

 #You gain Torment
 lv_special_blockers.0003.t:0 "La Lame dans l'Obscurité"
 #lv_special_blockers.0003.desc:0 "As the final stones are set and the banners once again fly, the Red Wyrm’s Wrath stands reborn. Its dragonstone walls towering once more, unmarred by time, casting long shadows over the land as they did in the reign of King Taurion.\nYet within these halls, the past lingers, not just in echoes, but in whispers that never truly fade.\n\nA sealed chamber is uncovered deep within the great hall, undisturbed since the fall of [GetTitleByKey('k_lokiria').GetNameNoTier]. Inside, amidst dust and forgotten relics, lies a blade made of steel as black as a moonless night, its edge gleaming with an unnatural sharpness.\n\n[newly_created_artifact.GetName], the sword of King Taurin himself, lost to history after The Doom. Even now, its presence is suffused with an eerie weight, as if the blade remembers every battle it has tasted.\n\nThe question remains: will this blade rise once more as a symbol of dominion? Does its return herald an age of bloodshed yet to come?"
 lv_special_blockers.0003.desc:0 "Tandis que les dernières pierres sont posées et que les bannières flottent de nouveau, la Colère de la Guivre Rouge se dresse, renaissante. Ses murs vertigineux de pierre-dragon projettent de longues ombres, comme au temps du règne de Taurion.\n\nPourtant, dans ces halls, le passé s'attarde. Une chambre scellée est mise au jour au plus profond du grand hall, intacte depuis le [doom|E]. À l'intérieur, la poussière s'accroche aux reliques et aux bannières fanées, mais en son cœur repose plus que de simples dépouilles oubliées.\n\nReposant sur un trône, drapée d'un manteau royal désormais en lambeaux, gît une silhouette depuis longtemps réduite en poussière ; à ses côtés repose une lame, faite d'un acier aussi noir qu'une nuit sans lune.\n\n[newly_created_artifact.GetName], l'épée que tinrent les souverains de [GetTitleByKey('k_lokiria').GetNameNoTier], que l'on croyait perdue à l'histoire depuis le [doom|E]. Même aujourd'hui, elle porte un poids étrange, comme si elle se souvenait de chaque bataille qu'elle a connue.\n\nLa question demeure : cette lame se relèvera-t-elle comme symbole de domination, ou son retour annonce-t-il un âge d'effusion de sang ?"
 lv_special_blockers.0003.a:0 "La lame d'un roi pour un souverain digne de ce nom."
 gain_vs_artifact:0 "Vous obtenez l'[artifact|E] [newly_created_artifact.GetName]"

 #You gain Mage's Fire
 lv_special_blockers.0004.t:0 "Une Arme, Plus Art que Guerre"
 lv_special_blockers.0004.desc:0 "La Tour de Lyria a été restaurée. Alors que je parcours les sections nouvellement ouvertes de la tour, je sens les énergies magiques singulières qui parcourent ces murs, plus intensément que jamais. C'était comme si quelque chose d'entièrement nouveau venait de s'éveiller à mesure que la dernière pierre retrouvait sa place.\n\nJe gravis la tour en direction de ce que l'un de mes ouvriers appelait une grande bibliothèque ; ils m'ont dit que lorsque les gravats furent retirés et les portes ouvertes, elle se dressait intacte, comme si le [doom|E] n'y était jamais survenu. En franchissant le seuil, je constate en effet que la pièce semble n'avoir jamais été touchée par le temps, des rayonnages de livres s'élevant loin vers les plafonds voûtés de la salle, renfermant un savoir que l'on croyait sans doute perdu à jamais.\n\nQuelque chose, juste en face du seuil, attira mon regard. En traversant la pièce, je remarquai qu'il s'y dressait une vitrine de verre ; à l'intérieur reposait une rapière en Acier Valyrien, son pommeau bleu poli rehaussé par la garde aux couleurs multiples. Je tends la main pour trouver le loquet et ouvrir la vitrine, mais avant même de la toucher, celle-ci s'ouvrit d'elle-même, la porte pivotant lentement sur le côté. Alors que je tends la main pour m'emparer de [newly_created_artifact.GetName], je sens une énergie magique parcourir mon corps..."
 lv_special_blockers.0004.a:0 "Vous obtenez l'[artifact|E] [newly_created_artifact.GetName]"

 #You find a dragon egg amidts the ruins
 lv_special_blockers.0005.t:0 "Un Héritage de Feu"
 lv_special_blockers.0005.desc:0 "Chaque hall brisé et chaque caveau effondré a promis un trésor, et presque tous n'ont livré que déception. Sculptures brisées, statues fendues et pierre fondue, voilà tout ce qui subsiste de l'Antique Valyria.\n\nJusqu'à aujourd'hui.\n\nDissimulé dans une chambre oubliée parmi les ruines de [blocker_province.GetName] repose un œuf de dragon, intact malgré le temps et épargné par le Fléau qui consuma les Possessions Valyriennes.\n\nBien peu d'âmes vivantes pourraient se targuer d'une telle découverte."
 lv_special_blockers.0005.a:0 "Un trésor qui vaut n'importe quel prix"

 #Toasts
 find_gold_cache:0 "Vous trouvez de l'[gold|E]"
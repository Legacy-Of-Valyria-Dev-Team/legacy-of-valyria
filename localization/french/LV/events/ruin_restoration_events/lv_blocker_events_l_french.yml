l_french:
  ## Successful Blocker Clearance
  # Titles - Standard
  lv_blocker_clearance.0001.t.unexplored_caves:0 "Grottes Inexplorées"
  lv_blocker_clearance.0001.t.swamp:0 "Dompter le Marais"
  lv_blocker_clearance.0001.t.floods:0 "Après le Déluge"
  lv_blocker_clearance.0001.t.noxious_gases:0 "Cendres, Puis Silence"
  lv_blocker_clearance.0001.t.stonemen:0 "Cendres Là Où Ils Demeuraient"
  lv_blocker_clearance.0001.t.bandit_camps:0 "Lames dans les Broussailles"
  lv_blocker_clearance.0001.t.small_ruined_holding:0 "Pierre, Toujours Debout"
  lv_blocker_clearance.0001.t.medium_ruined_holding:0 "De la Poussière, des Fondations"
  lv_blocker_clearance.0001.t.large_ruined_holding:0 "L'Héritage Éveillé"

  # Titles - Treasure
  lv_blocker_clearance.0001.t.unexplored_caves.reward:0 "Lueurs dans les Profondeurs"
  lv_blocker_clearance.0001.t.swamp.reward:0 "La Richesse Oubliée du Bourbier"
  lv_blocker_clearance.0001.t.floods.reward:0 "Ce que le Déluge a Oublié"
  lv_blocker_clearance.0001.t.noxious_gases.reward:0 "Richesses dans les Cendres"
  lv_blocker_clearance.0001.t.stonemen.reward:0 "Le Trésor des Hommes de Pierre"
  lv_blocker_clearance.0001.t.bandit_camps.reward:0 "Le Butin des Bandits"
  lv_blocker_clearance.0001.t.small_ruined_holding.reward:0 "Dépouilles Parmi les Pierres"
  lv_blocker_clearance.0001.t.medium_ruined_holding.reward:0 "Richesses Sous les Ruines"
  lv_blocker_clearance.0001.t.large_ruined_holding.reward:0 "Fortune des Seigneurs Oubliés"

  # Descriptions
  lv_blocker_clearance.0001.desc.unexplored_caves:0 "Après de longues semaines sous terre, les derniers porteurs de torches sont revenus. Les tunnels ont été cartographiés, les dangers marqués, et l'inconnu ramené à la lumière. Là où ne régnaient jadis que ténèbres et effroi, se trouvent désormais des cartes, des campements et les prémices de routes. N'étant plus un repaire de murmures et d'ossements brisés, les cavernes se dressent domptées, revendiquées par ceux qui eurent la volonté d'y descendre.\n\n"
  lv_blocker_clearance.0001.desc.swamp:0 "Ce qui fut jadis un bourbier de pourriture et de ruine est devenu praticable. Le marécage, longtemps refuge d'insectes piqueurs, de pieds s'enfonçant et de disparitions murmurées, a été drainé et dompté, si tant est que pareille chose soit possible. Des chemins surélevés serpentent désormais à travers un sol autrefois trop traître pour y marcher, et la brume étouffante s'est dissipée à chaque arbre abattu et pierre retournée. Ce n'est plus un lieu de mort et de décomposition, mais un lieu d'ordre chèrement acquis. De nouvelles fondations, taillées dans la fange et la folie.\n\n"
  lv_blocker_clearance.0001.desc.floods:0 "Les eaux se sont enfin retirées. Ce qui gisait noyé sous les marées tumultueuses et la terre détrempée se révèle désormais : routes ruinées, murs effondrés et champs gorgés d'eau, certes, mais aussi terre ferme et possibilité de rebâtir. Digues et canaux de drainage ont été creusés, remblais élevés, et la pierre posée là où régnait la boue. C'est encore un pays humide, mais il n'est plus sans défense. Le déluge a été repoussé, ne fût-ce que pour un temps.\n\n"
  lv_blocker_clearance.0001.desc.noxious_gases:0 "L'air s'est enfin purifié. Ce qui pesait lourdement de mort, vapeurs suffocantes et brume âcre, a commencé à se dissiper. Des puits d'aération ont été creusés, les cendres balayées, et la terre a eu le temps de respirer. L'odeur de soufre persiste encore, faible mais plus mortelle. La montagne fume toujours au loin, avertissement silencieux, mais son poison n'étreint plus la terre. Le pire est passé... pour l'instant.\n\n"
  lv_blocker_clearance.0001.desc.stonemen:0 "C'est fait. Les hommes de pierre ont disparu : chassés, passés au fil de l'épée, ou abandonnés à glisser silencieusement sous les eaux noires du fleuve. Ils n'avaient nul espoir, nulle guérison, nul avenir. Défigurés par la grisécaille et à demi fous de douleur et de faim, ils étaient devenus un danger pour quiconque passait à proximité. Pourtant, ce ne fut point aisé. Certains se souvenaient de leurs noms. D'autres suppliaient qu'on les achève dans une langue trop brisée pour être comprise. Désormais, seul le silence demeure là où ils se blottissaient jadis. La terre est plus sûre. Mais quelque chose de plus froid a pris racine dans l'air.\n\n"
  lv_blocker_clearance.0001.desc.bandit_camps:0 "Le campement a été détruit. Tentes abattues, feux étouffés, et sang imbibant la terre. Les bandits ont combattu comme les hommes désespérés qu'ils étaient : en haillons, brutaux, sans illusion de clémence. Mais vos hommes ont tenu bon. Les rares hors-la-loi survivants ont fui dans les terres sauvages, dispersés et blessés. Pour l'heure, les routes sont plus calmes, et le peuple peut respirer un peu plus aisément. Justice, rude, sanglante et tardive, a été rendue.\n\n"
  lv_blocker_clearance.0001.desc.small_ruined_holding:0 "Pierre et silence : voilà tout ce qui restait à votre arrivée. Désormais, la végétation envahissante a été coupée, les murs effondrés examinés, et les derniers dangers éliminés. Ce qui n'était qu'une coquille vide de domaine se tient prêt à servir à nouveau. Il reste encore beaucoup à faire, mais ses fondations sont solides. Qu'il ait été oublié par les seigneurs ou abandonné au temps, ce lieu ne sera plus perdu.\n\n"
  lv_blocker_clearance.0001.desc.medium_ruined_holding:0 "Il a fallu du temps, et du sang, mais la ruine est dégagée. Les tours croulantes ont été inspectées, les salles instables étayées, et les dangers qui s'y attardaient encore ont été chassés ou ensevelis pour de bon. Jadis carcasse de dessein perdu, le domaine se tient prêt à servir à nouveau. Il ne retrouvera peut-être jamais toutes ses gloires passées, mais la terre a été reconquise, et les vieilles pierres s'élèvent avec une intention nouvelle.\n\n"
  lv_blocker_clearance.0001.desc.large_ruined_holding:0 "La ruine se dressait, vaste et silencieuse, imprégnée de mémoires plus anciennes que les cartes. Ses murs, brisés mais encore défiants, portaient les cicatrices de conquêtes, d'incendies et du temps lui-même. Pourtant, même ces pierres pouvaient être domptées. Après un long labeur et des efforts minutieux, le site est sécurisé : ses arches croulantes stabilisées, ses profondeurs oubliées purgées de tout danger. Bien que les fantômes d'empires déchus semblent encore murmurer dans les salles usées par le vent, la ruine n'est plus abandonnée. Un nouveau chapitre commence sur ces vieux ossements.\n\n"

  lv_blocker_clearance.0001.desc.unexplored_caves.dragon_egg:0 "Pourtant, dans les profondeurs de ces grottes, une découverte attend. Parmi les décombres et la poussière gît un œuf de [dragon|E], sa coquille scintillant faiblement dans la lumière ténue. Relique d'un âge révolu, il renferme en lui la promesse de renaissance et de puissance."
  lv_blocker_clearance.0001.desc.swamp.dragon_egg:0 "Parmi la fange et la pierre, enfoui dans des racines plus vieilles que la mémoire, quelque chose fut trouvé : lisse comme un galet de rivière, mais chaud au toucher. Un œuf de [dragon|E], à en croire les murmures. Des légendes fragmentées parlent de telles reliques abandonnées aux jours de [valyria|E], perdues dans le feu ou englouties par la terre. Qu'un tel œuf émerge ici, au cœur d'un marais oublié, voilà un récit que peu croiront. Mais ceux qui l'ont vu savent : le monde vient de basculer."
  lv_blocker_clearance.0001.desc.floods.dragon_egg:0 "Parmi la boue et les débris laissés par le déluge, quelque chose de totalement inattendu fut découvert : lisse, écailleux, et légèrement chaud. Un œuf de [dragon|E]. Qu'il ait été perdu lors d'un ancien cataclysme ou enfoui à la hâte durant la chute de l'[old_valyria|E], nul ne saurait le dire. Mais les récits sont clairs : de telles choses ne sont pas de simples reliques. Elles sont promesse, et péril."
  lv_blocker_clearance.0001.desc.noxious_gases.dragon_egg:0 "Dans le bassin fissuré d'un ravin calciné, enfoui sous des couches de cendres refroidies et de pierre volcanique, quelque chose d'étrange fut exhumé : un œuf, sombre et veiné, palpitant faiblement de chaleur. Un œuf de [dragon|E], selon tous les témoignages. Comment il en vint à reposer là, nul ne peut le dire, mais à l'ombre des montagnes de feu, de telles reliques ne se rejettent pas aisément comme mythes. Le sang de l'ancien monde s'éveille à nouveau."
  lv_blocker_clearance.0001.desc.stonemen.dragon_egg:0 "Au cœur du campement des hommes de pierre, là où cendre et pierre se mêlaient, une étrange relique fut découverte. Un œuf, sombre et veiné, palpitant faiblement de chaleur. Un œuf de [dragon|E], peut-être abandonné par un seigneur en fuite ou enfoui à la hâte durant la chute de [valyria|E]. Sa présence ici n'est point un hasard. Un vestige de feu, dormant sous les cendres."
  lv_blocker_clearance.0001.desc.bandit_camps.dragon_egg:0 "Sous la pierre de l'âtre effondrée de l'ancienne grande salle, vos hommes découvrirent quelque chose d'étrange : ovale, semblable à la pierre, et légèrement chaud au toucher. Un œuf de [dragon|E]. Peut-être abandonné par un noble valyrien en fuite, ou enfoui en secret durant le Fléau. Quelle que soit son origine, sa présence ici n'est point un hasard. Un vestige de feu, dormant sous les cendres."
  lv_blocker_clearance.0001.desc.small_ruined_holding.dragon_egg:0 "Dans les ruines de ce qui fut peut-être jadis une crypte ou un sanctuaire, enfoui sous des décombres calcinés et des sceaux usés par le temps, une étrange relique fut découverte : lisse, ovale, et palpitant faiblement de chaleur. Un œuf de [dragon|E], bien que nul ne puisse dire son âge, ni pourquoi il gisait caché. Relique d'une lignée oubliée, ou de quelque chose de plus ancien encore. La ruine recelait plus que de la pierre."
  lv_blocker_clearance.0001.desc.medium_ruined_holding.dragon_egg:0 "Dans les profondeurs du vieux donjon, derrière des murs que l'on croyait longtemps effondrés, une étrange relique fut trouvée : un œuf, sombre et veiné, palpitant faiblement de chaleur. Un œuf de [dragon|E], peut-être abandonné par un seigneur en fuite ou enfoui à la hâte durant la chute de [valyria|E]. Sa présence ici n'est point un hasard. Un vestige de feu, dormant sous les cendres."
  lv_blocker_clearance.0001.desc.large_ruined_holding.dragon_egg:0 "Loin sous les flèches écroulées, vos hommes exhumèrent une chambre que la lumière du soleil n'avait jamais touchée. En son sein, entouré de pierre calcinée et de glyphes effacés, gisait un unique œuf : lustré, veiné, et chaud au toucher. Qu'il ait été abandonné dans la précipitation ou scellé à dessein, il a survécu à la chute des empires et au silence des siècles. Désormais, il est vôtre. Une relique des [dragons_plural|E], dormant dans les ténèbres."

  lv_blocker_clearance.0001.desc.unexplored_caves.gold_high:0 "Les cavernes, jadis lieu de ténèbres et d'effroi, ont livré leurs secrets. Quand les derniers porteurs de torches revinrent, ils rapportèrent non seulement des récits de danger, mais aussi des trésors au-delà de l'imagination. Or et gemmes, dissimulés même aux regards des [dragonlords|El], gisent désormais à la lumière du jour. Juste récompense pour avoir nettoyé les profondeurs."
  lv_blocker_clearance.0001.desc.swamp.gold_high:0 "Le travail ne visait qu'à drainer la terre et élever des chemins stables, mais la fortune a ses propres desseins. Sous un autel de pierre effondré, au cœur du bourbier, les terrassiers frappèrent l'or. Des coffres scellés par du fer rouillé, des pièces frappées de visages valyriens anciens, et des ornements perdus durant des siècles de pourriture et de racines. Nul ne saurait dire comment cela vint à être enfoui en tel lieu : certains murmurent qu'il s'agit de [dragonlords|El] en fuite, d'autres de bandits qui n'échappèrent jamais à leur propre piège. Quelle que soit son origine, le trésor est réel. Et désormais, il est vôtre."
  lv_blocker_clearance.0001.desc.floods.gold_high:0 "Tandis que les eaux du déluge se retiraient, elles laissèrent derrière elles plus que limon et ruine. Nichée dans une cave en ruine ou à moitié enfouie sous des pierres effondrées, un vaste trésor fut découvert : des pièces d'or par centaines, des bijoux finement ouvragés, et des artefacts de facture oubliée. Une fortune, à tout point de vue. De quoi rebâtir, s'étendre, ou attiser l'envie de seigneurs lointains."
  lv_blocker_clearance.0001.desc.noxious_gases.gold_high:0 "Parmi les ruines noircies et la pierre calcinée, une crypte fut trouvée : ses serrures déformées par la chaleur mais intactes. En son sein, l'or brillait, non terni par les cendres ou le temps. Pièces, lingots et ornements, plus que la plupart des seigneurs ne sauraient prétendre, intouchés par le feu mais dissimulés depuis des générations. Qu'il ait été amassé par des [dragonlords|El] ou enfoui à la hâte avant la colère de la montagne, il vous appartient désormais."
  lv_blocker_clearance.0001.desc.stonemen.gold_high:0 "Au cœur du campement des hommes de pierre, là où cendre et pierre se mêlaient, une cache dissimulée fut découverte. Des pièces d'or, ternies mais intactes, et des reliques d'un artisanat depuis longtemps perdu. Peut-être abandonnées par un seigneur en fuite ou enfouies à la hâte durant la chute de [valyria|E]. Quelle que soit son origine, c'est un trésor digne d'être revendiqué : une récompense pour ceux qui osèrent affronter la malédiction."
  lv_blocker_clearance.0001.desc.bandit_camps.gold_high:0 "Tandis que vos hommes forçaient la crypte cachée sous le camp des bandits, l'éclat de l'or inonda la chambre : des coffres débordant de pièces volées, de colifichets dorés et de parures de marchands. Mais les réjouissances furent prématurées. Des pas résonnent dans la pénombre. Depuis la lisière des arbres, des ombres se rassemblent : des bandits pas encore occis, poussés par le désespoir et la vengeance. L'or est à portée de main, mais un ultime combat reste à mener, et il sera féroce."
  lv_blocker_clearance.0001.desc.small_ruined_holding.gold_high:0 "Cachée dans une cave scellée, derrière des murs à moitié effondrés par le temps, gisait une crypte oubliée. En son sein : des coffres pleins de pièces, de l'or ancien portant des sceaux effacés par la poussière, et des reliques d'une valeur depuis longtemps sortie des mémoires. Peut-être le trésor d'une maison perdue par la guerre ou l'exil. Désormais, il est vôtre : un trésor assez grand pour remodeler les plans et régler les dettes."
  lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_high:0 "Les niveaux inférieurs de la ruine, que l'on croyait effondrés, dissimulaient plus que de la poussière. Des chambres cachées derrière de faux murs révélèrent une fortune : des pièces marquées par des maisons depuis longtemps éteintes, des coupes d'argent, et des héritages que la lumière n'avait pas touchés depuis des décennies. La crypte fut probablement scellée à la hâte, abandonnée en temps de guerre ou d'exil. Sa redécouverte aujourd'hui est une récompense non seulement pour la persévérance, mais pour la survie."
  lv_blocker_clearance.0001.desc.large_ruined_holding.gold_high:0 "Sous la place centrale, scellée par une pierre trop épaisse pour être percée sans des mois de travaux, un antique trésor se révéla. Des pièces plus anciennes que la Foi, des couronnes d'empires depuis longtemps éteints, et des statues dorées sculptées dans des styles que l'on n'avait plus vus depuis des générations. C'est une fortune non seulement en poids, mais en émerveillement : un vestige tangible du monde qui fut. Un trésor rivalisant avec les plus grands trésors des [dragonlords|El], désormais vôtre à revendiquer."

  lv_blocker_clearance.0001.desc.unexplored_caves.gold_low:0 "Les cavernes recelaient plus que des ombres. Parmi les passages sinueux, un petit trésor fut découvert : des pièces ternies par le temps, et une poignée de gemmes nichées dans l'antique pierre. Pas de quoi éveiller l'envie d'un roi, mais assez pour scintiller de promesses. Un digne butin pour ceux assez hardis pour braver les profondeurs."
  lv_blocker_clearance.0001.desc.swamp.gold_low:0 "En dégageant fange et bourbier, quelque chose brilla sous les racines. Un modeste trésor : pas une rançon de roi, mais de quoi couper le souffle. Quelques pièces éparses, un gobelet terni, les vestiges d'une richesse jadis cachée ou oubliée. Peut-être le butin d'un seigneur en fuite, ou le dernier tribut d'une caravane condamnée. Quelle que soit son histoire, l'or est réel, et il garnit désormais vos coffres : une modeste récompense pour un travail dur et salissant."
  lv_blocker_clearance.0001.desc.floods.gold_low:0 "Ce n'était pas grand-chose, du moins à première vue : une bourse de vieilles pièces coincée dans les poutres d'un entrepôt effondré, quelques lingots épars cachés sous des pierres tombées. Pourtant, c'est une trouvaille bienvenue. Si modeste soit-elle, elle suffit à affermir des mains incertaines et financer les premiers pas du rétablissement."
  lv_blocker_clearance.0001.desc.noxious_gases.gold_low:0 "Toutes les richesses ne sont pas grandioses. Nichée sous des roches effondrées et des débris calcinés, un modeste trésor apparut : quelques pièces fusionnées ensemble, un coffre noirci à moitié consumé par le feu. Pourtant, assez subsistait pour compter. Une modeste aubaine, arrachée aux cendres de ce qui fut presque perdu."
  lv_blocker_clearance.0001.desc.stonemen.gold_low:0 "Parmi les ruines du campement des hommes de pierre, une petite cache fut trouvée : des pièces, ternies mais intactes, et quelques colifichets ayant survécu à la décomposition. Ce n'est point une fortune, mais c'est assez pour rappeler à ceux qui restent que même dans les endroits les plus sombres, l'espoir peut être trouvé. Une modeste récompense pour une sinistre tâche."
  lv_blocker_clearance.0001.desc.bandit_camps.gold_low:0 "Cachée sous une latte de plancher pourrie, vos hommes découvrirent une petite réserve de butin : quelques pièces éparses, un anneau d'argent, un gobelet cabossé par les voyages. Assez pour compter, mais pas de quoi se vanter. Tandis qu'ils commençaient à emballer les dépouilles, un mouvement agita les broussailles. Les derniers bandits, en haillons et hurlants, se ruent en avant dans une ultime tentative sauvage de reprendre ce qui est leur. Un dernier affrontement se profile."
  lv_blocker_clearance.0001.desc.small_ruined_holding.gold_low:0 "Parmi les vestiges brisés d'une chambre d'intendant, vos hommes découvrirent une modeste réserve : des bourses de pièces, quelques anneaux, et des outils de facture ancienne cachés sous les lattes du plancher. De quoi mériter le nom de récompense, si ce n'est de manne. Il semble que même les ruines les plus humbles puissent encore s'accrocher à leur passé."
  lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_low:0 "Parmi les décombres d'un ancien solarium, vos hommes découvrirent un petit coffret scellé : ses gonds de fer rouillés, mais son contenu intact. Modeste, mais significatif : des pièces, quelques bijoux, et un étroit registre trop effacé pour être lu. Peut-être les derniers effets d'un châtelain qui ne revint jamais. Quelle que soit l'histoire, sa valeur perdure."
  lv_blocker_clearance.0001.desc.large_ruined_holding.gold_low:0 "Cachée derrière un mur effondré dans ce qui fut peut-être jadis le domaine d'un noble, vos hommes découvrirent une cache longtemps scellée : une modeste collection de bijoux, de vieilles pièces, et des objets cérémoniels probablement cachés dans le chaos de la chute. Bien qu'humbles comparés à la grandeur de la ruine elle-même, c'est un précieux fragment du passé, et la preuve que même les grandes cités furent bâties par des mains humaines."

  #Options
  lv_blocker_clearance.0001.a:0 "Excellent !"

  ## Swamp: Challenge Event
  lv_blocker_clearance.0011.t:0 "Dompter le Marais"
  lv_blocker_clearance.0011.desc:0 "Le marécage a été drainé, son terrain sauvage partiellement soumis, mais un ultime effort reste à accomplir pour reconquérir pleinement la terre. Les digues doivent être renforcées, les canaux redirigés, et de nouvelles fondations posées avec soin. Un seul faux pas pourrait voir le bourbier revenir, engloutissant des mois d'efforts.\n\nLe peuple se tourne vers vous, ou vers votre intendant, pour des directives. Si cette dernière phase est bien gérée, le marais sera conquis. Sinon, les eaux pourraient se relever."
  lv_blocker_clearance.0011.a:0 "Je superviserai moi-même la phase finale."
  lv_blocker_clearance.0011.b:0 "Laissons mon intendant gérer les détails."

  # Swamp: Failure
  lv_blocker_clearance.0012.t:0 "Efforts Engloutis"
  lv_blocker_clearance.0012.desc:0 "Malgré les meilleurs efforts de votre équipe, le marais résiste à toute tentative de domestication. Les fondations glissent, les ouvriers disparaissent dans la fange, et les plateformes hâtivement construites pourrissent en quelques jours. La terre reprend le peu qui avait été gagné, et le progrès s'enfonce à reculons dans le bourbier. Ce n'est pas une perte totale, mais cela y ressemble."
  lv_blocker_clearance.0012.a:0 "Le marais est plus tenace que nous le pensions. Nous réessaierons."

  # Swamp: Critical Failure
  lv_blocker_clearance.0013.t:0 "Engloutis par le Bourbier"
  lv_blocker_clearance.0013.desc:0 "Tout s'est effondré. Des structures entières ont disparu sous la tourbière, et un canal de drainage mal calculé a inondé un terrain vital. Les équipes se sont dispersées, les outils ont été perdus, et le marais s'est épaissi à chaque faux pas. Tout ce qui avait été accompli est désormais défait : la terre n'est à nouveau qu'un marécage traître et mouvant. Il faudra tout reprendre depuis le début."
  lv_blocker_clearance.0013.a:0 "Tout est perdu. Le marais a dévoré notre travail."

  # Swamp: Success
  lv_blocker_clearance.0014.t:0 "Terre Ferme Enfin"
  lv_blocker_clearance.0014.desc:0 "D'une main ferme et d'une planification minutieuse, le marais a été soumis. Des canaux ont été creusés, des soutiens renforcés, et la terre ferme commence à se former là où il n'y avait que boue et décomposition. Il faudra du temps pour bâtir dessus, mais pour l'heure, le danger est écarté. Le bourbier est devenu gérable."
  lv_blocker_clearance.0014.a:0 "Ce fut chèrement acquis, mais le sol est nôtre désormais."

  # Swamp: Critical Success
  lv_blocker_clearance.0015.t:0 "Le Marais Transformé"
  lv_blocker_clearance.0015.desc:0 "Un coup de maître. La phase finale de l'effort s'est déroulée parfaitement : ni faux pas, ni revers. La terre a séché plus vite que prévu, révélant un sol stable et même les vestiges de structures depuis longtemps perdues sous la boue. Parmi les pieux pourris et la pierre engloutie, quelque chose brilla : un coffre scellé, intact par le temps, désormais libéré de l'emprise du marais."
  lv_blocker_clearance.0015.a:0 "Le marais est nettoyé, et le bourbier nous a rendu quelque chose."

  ## Floods: Challenge Event
  lv_blocker_clearance.0021.t:0 "Le Bourbier Cède"
  lv_blocker_clearance.0021.desc:0 "Les eaux du déluge se sont en grande partie retirées, laissant derrière elles un sol détrempé et les prémices fragiles d'un rétablissement. Pourtant, à moins que les rivières ne soient domptées et la terre correctement drainée, tout progrès pourrait être perdu. Des fossés doivent être creusés, des digues renforcées, et le peuple guidé avec détermination, avant que la prochaine pluie ne défasse tout.\n\nLe travail exige une main ferme et un esprit clair. Que ce soit par votre commandement ou celui de votre intendant, cet ultime effort décidera si la terre est reconquise, ou noyée une fois de plus."
  lv_blocker_clearance.0021.a:0 "Je repousserai les flots."
  lv_blocker_clearance.0021.b:0 "Mon intendant achèvera ce qui fut commencé."

  # Floods: Failure
  lv_blocker_clearance.0022.t:0 "Les Eaux Montent à Nouveau"
  lv_blocker_clearance.0022.desc:0 "Les efforts pour rediriger les eaux du déluge ont faibli. Les digues de fortune ont cédé sous la pression, et les plans de drainage se sont avérés insuffisants. Bien que quelques progrès aient été accomplis, il est désormais clair que l'inondation a repris sa lente avancée, défaisant les récents progrès. Les champs se noient à nouveau, et le moral sombre avec eux."
  lv_blocker_clearance.0022.a:0 "Nous avons sous-estimé les eaux. Nous réessaierons, mieux préparés."
  
  # Floods: Critical Failure
  lv_blocker_clearance.0023.t:0 "Emportés"
  lv_blocker_clearance.0023.desc:0 "Un effondrement total. Les pluies sont revenues en force, et les défenses contre le déluge se sont écroulées dans le désordre. Les canaux ont débordé, les ponts se sont effondrés, et des sections entières de terre reconquise ont été perdues. Le terrain est à nouveau engorgé de limon et d'eau, et tous les gains accomplis ont été emportés. La terre a repris ce qui lui avait été pris : il faut tout recommencer."
  lv_blocker_clearance.0023.a:0 "Ce fut un désastre... Il faudra tout reprendre depuis le début."

  # Floods: Success
  lv_blocker_clearance.0024.t:0 "Les Eaux se Retirent"
  lv_blocker_clearance.0024.desc:0 "Après un travail inlassable, les dernières eaux du déluge ont été repoussées. Les digues tiennent bon, les cours d'eau détournés trouvent leur cours, et le sol détrempé commence à sécher sous le soleil revenu. Il reste encore beaucoup à reconstruire, mais le danger est passé, et la terre est vôtre à nouveau."
  lv_blocker_clearance.0024.a:0 "Enfin, les inondations sont derrière nous."

  # Floods: Critical Success
  lv_blocker_clearance.0025.t:0 "Dompter les Eaux"
  lv_blocker_clearance.0025.desc:0 "Non seulement le déluge a été contenu, mais il a été maîtrisé. Une brillante redirection des eaux, un labeur rapide et une planification avisée ont non seulement asséché la terre mais l'ont remodelée. D'anciens marécages sont désormais de fertiles basses terres. Et dans le lit de rivière exposé, quelque chose d'ancien fut découvert : un trésor enfoui et oublié, désormais ramené à la lumière par les eaux qui se retirent."
  lv_blocker_clearance.0025.a:0 "Les eaux se retirent, et elles laissent derrière elles un présent."

  ## Noxious Gases: Challenge Event
  lv_blocker_clearance.0031.t:0 "Sceller les Vapeurs"
  lv_blocker_clearance.0031.desc:0 "Le pire des émanations s'est dissipé, mais la terre n'est pas encore sûre. Des gaz empoisonnés s'élèvent encore des fissures profondes ou stagnent dans les bas-fonds, invisibles et mortels. Le confinement final doit être effectué avec précision : détourner le flux, sceller les fissures, et peut-être construire des canaux pour disperser ce qui persiste.\n\nUne seule erreur de calcul pourrait tout libérer à nouveau. Vous pouvez superviser cet effort vous-même, ou confier la tâche à votre intendant. Quoi qu'il en soit, c'est la dernière barrière entre la ruine et le renouveau."
  lv_blocker_clearance.0031.a:0 "Je gèrerai cela personnellement. Ce doit être fait correctement."
  lv_blocker_clearance.0031.b:0 "Je confierai le confinement à mon intendant."

  # Noxious Gases: Failure
  lv_blocker_clearance.0032.t:0 "Les Vapeurs Montent à Nouveau"
  lv_blocker_clearance.0032.desc:0 "Le travail pour sceller les dernières fissures toxiques a faibli. Que ce soit par mauvais jugement, barrières mal alignées, ou simplement la nature volatile de la terre elle-même, les gaz ont recommencé à s'élever. Des ouvriers malades titubent hors de la brume, et la puanteur s'accroche à l'air comme une malédiction.\n\nLe progrès a été défait, et la zone redevient dangereuse. Bien que ce ne soit pas un effondrement total, le revers est clair, et coûteux.\n\n"
  lv_blocker_clearance.0032.desc.illness.self:0 "Tandis que les vapeurs s'épaississaient à nouveau, vous fûtes pris dans le pire. Le goût du métal s'accroche à votre bouche, et vos poumons semblent brûlés. Des jours ont passé, pourtant le mal persiste : un cruel rappel de combien vous étiez proche du danger."
  lv_blocker_clearance.0032.desc.illness.councillor:0 "Dans le chaos de l'effort échoué, votre intendant a subi le gros de l'exposition. Il gît désormais alité, la peau moite et le souffle court, son rétablissement incertain. Le danger demeure, et désormais l'un des vôtres en paie le prix."
  lv_blocker_clearance.0032.a:0 "Nous avons mal calculé. Nous réessaierons, plus prudemment cette fois."

  # Noxious Gases: Critical Failure
  lv_blocker_clearance.0033.t:0 "Étouffés par nos Aspirations"
  lv_blocker_clearance.0033.desc:0 "Désastre. Ce qui devait être l'ultime effort de confinement a catastrophiquement échoué. Une fissure scellée a éclaté dans un rugissement, inondant la zone de vapeurs suffocantes. Les ouvriers se sont effondrés là où ils se tenaient. Le bétail a péri. Même le vent lui-même sembla se faire traître, portant le poison plus loin qu'auparavant.\n\nTout ce qui avait été gagné est désormais perdu. La terre gît à nouveau étouffée sous d'épais gaz suffocants. La dégager à nouveau demandera du temps, de la prudence, et une bonne dose de chance."
  lv_blocker_clearance.0033.a:0 "Nous avons totalement échoué..."

  # Noxious Gases: Success
  lv_blocker_clearance.0034.t:0 "L'Air se Purifie"
  lv_blocker_clearance.0034.desc:0 "Les derniers efforts ont réussi. Les fissures ont été scellées, les évents détournés, et les dernières traces des vapeurs suffocantes se sont dissipées. L'air, jadis chargé de poison, porte désormais le parfum pur du vent ouvert et de la pluie lointaine. Les cultures peuvent pousser, le bétail peut revenir, et les gens osent à nouveau respirer profondément.\n\nPar la diligence, la planification et un effort considérable, la terre a été arrachée au tueur invisible. Le danger est écarté. Pour l'instant, du moins.\n\n"
  lv_blocker_clearance.0034.desc.illness.self:0 "Pourtant, toutes les victoires n'arrivent pas sans coût. Vous êtes sorti de l'opération victorieux, mais le temps passé près des vapeurs nocives a laissé sa marque. Une toux qui ne veut pas tout à fait partir. Des vertiges qui persistent plus longtemps qu'ils ne le devraient. La terre est sûre... mais vous n'êtes pas indemne."
  lv_blocker_clearance.0034.desc.illness.councillor:0 "Bien que l'opération se soit terminée par un succès, votre intendant ne s'en est pas tiré indemne. L'exposition aux vapeurs l'a laissé pâle et chancelant, sa voix plus faible qu'avant. Il insiste qu'il se rétablira avec le temps, mais son sacrifice ne sera pas oublié."
  lv_blocker_clearance.0034.a:0 "L'air est enfin purifié."

  # Noxious Gases: Critical Success
  lv_blocker_clearance.0035.t:0 "Une Manne dans les Brumes"
  lv_blocker_clearance.0035.desc:0 "La phase finale s'est déroulée plus aisément que les plus audacieux n'osaient l'espérer. Les évents ont été scellés sans incident, l'air s'est purifié en un temps record, et la terre sembla exhaler de soulagement. Pourtant, la fortune réservait plus que de l'air pur. En inspectant la zone une dernière fois, vos ouvriers exhumèrent quelque chose longtemps caché sous la terre empoisonnée : une antique crypte, scellée et oubliée, préservée par les vapeurs mêmes qui rendaient jadis ce lieu mortel.\n\nLe danger est écarté, et à sa place... une manne attend."
  lv_blocker_clearance.0035.a:0 "L'air se purifie, et révèle des richesses enfouies dans la brume."

  ## Stonemen: Challenge Event
  lv_blocker_clearance.0041.t:0 "Les Derniers Hommes de Pierre"
  lv_blocker_clearance.0041.desc:0 "Les hommes de pierre ont été repoussés, mais leur présence persiste encore aux marges : grottes, ruines et abris brisés où les malades et les désespérés se blottissent en silence. Pour nettoyer complètement le campement, la zone doit être ratissée, mise en quarantaine et scellée. Ce n'est pas seulement une affaire d'épée et de feu, mais de structure et d'ordre.\n\nSi le travail est mal fait, les affligés pourraient revenir, et la malédiction se répandrait à nouveau. Prendrez-vous la charge de la purge, ou ferez-vous confiance à la précision de votre maréchal ?"
  lv_blocker_clearance.0041.a:0 "Je verrai ce fléau éradiqué moi-même."
  lv_blocker_clearance.0041.b:0 "Mon maréchal coordonnera le ratissage final."

  # Stonemen: Failure
  lv_blocker_clearance.0042.t:0 "La Malédiction Persiste"
  lv_blocker_clearance.0042.desc:0 "L'opération a faibli. Les routes étaient bloquées, les provisions se sont épuisées, et quand l'assaut final vint, les hommes de pierre se dispersèrent dans le bourbier et les ruines. Trop nombreux ont échappé au cordon, et le camp continue de suppurer hors de portée. Leur présence reste un danger, et pire : ceux qui se sont trop approchés examinent désormais d'étranges taches sur leur peau."
  lv_blocker_clearance.0042.a:0 "Ils nous ont glissé entre les doigts. Nous devons nous préparer à nouveau."

  # Stonemen: Critical Failure
  lv_blocker_clearance.0043.t:0 "Touchés par la Pierre"
  lv_blocker_clearance.0043.desc:0 "Le désastre a frappé. Le groupe d'avant-garde a été submergé, et plusieurs hommes ont été traînés dans le camp infecté, pour ne plus jamais être revus. D'autres ont fui, terrifiés, et les hommes de pierre survivants, enhardis, errent désormais plus loin qu'auparavant. La maladie se répand. Les patrouilles signalent des observations plus proches des campements. Tout l'effort a échoué, et pire : ses conséquences se propagent désormais vers l'extérieur."
  lv_blocker_clearance.0043.a:0 "Nous avons aggravé les choses. La pierre se répand sans contrôle."

  # Stonemen: Success
  lv_blocker_clearance.0044.t:0 "La Malédiction Contenue"
  lv_blocker_clearance.0044.desc:0 "Par la discipline, une planification minutieuse et une sinistre résolution, le campement a été nettoyé. Les feux ont purgé ce qui ne pouvait être sauvé, et nul infecté n'a été laissé à errer. La zone porte encore les cicatrices de la maladie et du chagrin, mais la menace est écartée. La terre peut désormais guérir, lentement et prudemment."
  lv_blocker_clearance.0044.a:0 "C'est fait. Qu'aucune pierre ne reste debout."

  # Stonemen: Critical Success
  lv_blocker_clearance.0045.t:0 "Une Fin Rapide et Propre"
  lv_blocker_clearance.0045.desc:0 "L'opération fut rapide, décisive et miraculeusement propre. Les affligés ont été chassés ou détruits avec une résistance minimale, et même le terrain a joué en votre faveur : des canaux naturels les ont cernés, et personne parmi ceux qui s'y aventurèrent ne tomba malade. Tandis que les dernières cendres refroidissaient, vos éclaireurs découvrirent une crypte scellée sous les ruines, longtemps intacte. Une relique d'avant la chute, préservée par l'isolement... et désormais entre vos mains."
  lv_blocker_clearance.0045.a:0 "Une victoire propre, et un prix inattendu sous les cendres."

  ## Bandit Camps: Challenge Event
  lv_blocker_clearance.0051.t:0 "Briser la Dernière Lame"
  lv_blocker_clearance.0051.desc:0 "Le camp gît en ruines, mais le banditisme est une mauvaise herbe qui repousse vite. Les survivants dispersés pourraient se regrouper, riposter, ou disparaître dans les collines pour revenir un autre jour. Pour véritablement mettre fin à leur emprise, la terre doit être soumise : routes resécurisées, défenses élevées et ordre rétabli.\n\nCe n'est plus une bataille, mais un test de contrôle. Que vous le meniez vous-même ou le déléguiez à votre intendant, cet ultime effort déterminera si la région retombe dans l'anarchie, ou connaît enfin la paix."
  lv_blocker_clearance.0051.a:0 "J'écraserai moi-même les derniers bandits."
  lv_blocker_clearance.0051.b:0 "Mon maréchal les chassera par le fer et le feu."
  lv_blocker_clearance.0051.c:0 "Laissez-moi leur parler : il pourrait encore y avoir une issue pacifique."
  lv_blocker_clearance.0051.d:0 "Envoyez mon chancelier. Peut-être écouteront-ils la raison."

  # Bandit Camps: Failure
  lv_blocker_clearance.0052.t.martial:0 "L'Assaut s'Enlise"
  lv_blocker_clearance.0052.t.diplomacy:0 "Les Pourparlers s'Effondrent"
  lv_blocker_clearance.0052.desc.martial:0 "L'attaque a rencontré une résistance féroce. Le terrain favorisait les bandits : broussailles épaisses et sentiers cachés leur ont donné l'avantage. Vos forces ont été repoussées, ensanglantées et frustrées. Bien que du terrain ait été gagné, le camp reste actif, ses bannières flottant encore en défi."
  lv_blocker_clearance.0052.desc.diplomacy:0 "Votre émissaire a établi le contact, mais les bandits étaient divisés, méfiants, et peu disposés à parlementer de bonne foi. Les négociations ont traîné, puis ont tourné à l'aigre, se terminant par des menaces et des lames tirées. Les hors-la-loi restent retranchés, et pourraient être encore plus méfiants de votre prochain mouvement."
  lv_blocker_clearance.0052.a.martial:0 "Nous nous regroupons. La prochaine fois, nous les écraserons."
  lv_blocker_clearance.0052.a.diplomacy:0 "Nous avons essayé la raison. Nous trouverons un autre moyen."

  # Bandit Camps: Critical Failure
  lv_blocker_clearance.0053.t.martial:0 "Une Embuscade dans les Fourrés"
  lv_blocker_clearance.0053.t.diplomacy:0 "Un Poignard Derrière le Sourire"
  lv_blocker_clearance.0053.desc.martial:0 "C'était un piège. Les bandits avaient anticipé chacun de vos mouvements. Des archers ont fait pleuvoir la mort depuis des crêtes cachées, et le feu a été mis à vos lignes d'approvisionnement. L'attaque s'est effondrée, et vos forces ont fui dans le chaos. Pire : des rumeurs de votre faiblesse se répandent, et davantage de hors-la-loi se rassemblent dans les collines. Vous n'avez pas seulement échoué, vous les avez enhardis."
  lv_blocker_clearance.0053.desc.diplomacy:0 "Ce n'était qu'une ruse. Tandis que votre émissaire parlait, d'autres encerclaient le camp, et furent attaqués sans avertissement. L'un de vos agents a été tué, un autre a disparu. Les bandits riaient tandis que vos hommes repartaient en boitant. Toute bonne volonté est perdue, et les hors-la-loi considèrent désormais la diplomatie comme une faiblesse. Tout l'effort est défait."
  lv_blocker_clearance.0053.a.martial:0 "Ils nous attendaient. Il faudra tout reprendre, et plus durement qu'avant."
  lv_blocker_clearance.0053.a.diplomacy:0 "Nous fûmes sots de leur faire confiance. Retour à la case départ."

  # Bandit Camps: Success
  lv_blocker_clearance.0054.t.martial:0 "Le Camp est Brisé"
  lv_blocker_clearance.0054.t.diplomacy:0 "Le Camp se Disperse"
  lv_blocker_clearance.0054.desc.martial:0 "L'acier et la discipline l'ont emporté. Vos soldats ont pris d'assaut le campement, mettant les bandits en déroute et brûlant leurs masures jusqu'aux cendres. La menace a été étouffée. Bien que quelques traînards puissent s'échapper dans les terres sauvages, la région est enfin en paix, pour l'instant."
  lv_blocker_clearance.0054.desc.diplomacy:0 "Après des jours tendus de négociation, un accord a été trouvé. Certains bandits ont accepté des offres de pardon, d'autres ont pris de l'or pour partir. Quelques-uns ont disparu dans les bois, mais le camp lui-même s'est vidé. Il pourrait y en avoir encore là-bas, mais cette menace, du moins, est passée pacifiquement."
  lv_blocker_clearance.0054.a.martial:0 "Que ceci en soit la fin."
  lv_blocker_clearance.0054.a.diplomacy:0 "Une fin tranquille, sans sang. Espérons que cela dure."

  # Bandit Camps: Critical Success
  lv_blocker_clearance.0055.t.martial:0 "Une Victoire Impitoyable"
  lv_blocker_clearance.0055.t.diplomacy:0 "Hors-la-loi Devenus Alliés"
  lv_blocker_clearance.0055.desc.martial:0 "Une campagne sans faille. L'attaque fut rapide, écrasante, et ne laissa aucun bandit en vie pour en avertir un autre. Parmi le butin pillé, vos hommes découvrirent un coffre enterré : les dépouilles d'une caravane noble perdue des mois auparavant, désormais vôtres par droit de conquête. Le camp a disparu, et la cupidité des bandits a rapporté des dividendes inattendus."
  lv_blocker_clearance.0055.desc.diplomacy:0 "Les négociations ont dépassé toutes les attentes. Non seulement les bandits se sont dispersés, mais plusieurs de leurs chefs ont juré de servir en échange de clémence. Par gratitude, ou ambition, ils ont révélé une cache secrète, volée à un collecteur d'impôts corrompu et enfouie aux abords du camp. La menace bandit est écartée, et vos coffres s'en portent mieux."
  lv_blocker_clearance.0055.a.martial:0 "La terre est sûre, et plus riche qu'avant."
  lv_blocker_clearance.0055.a.diplomacy:0 "Paix et profit à la fois. Chose rare, en vérité."


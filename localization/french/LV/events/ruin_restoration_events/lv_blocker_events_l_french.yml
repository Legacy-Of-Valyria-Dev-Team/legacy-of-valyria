l_french:
  ## Successful Blocker Clearance
  # Titles - Standard
  lv_blocker_clearance.0001.t.unexplored_caves:0 "Les Grottes Oubliées des Anciens Temps"
  lv_blocker_clearance.0001.t.swamp:0 "La Conquête du Marécage Maudit"
  lv_blocker_clearance.0001.t.floods:0 "Quand les Eaux Se Retirent"
  lv_blocker_clearance.0001.t.noxious_gases:0 "Cendres et Silence Éternel"
  lv_blocker_clearance.0001.t.stonemen:0 "Là Où les Hommes de Pierre Régnaient"
  lv_blocker_clearance.0001.t.bandit_camps:0 "Lames Rouges dans les Broussailles"
  lv_blocker_clearance.0001.t.small_ruined_holding:0 "Les Pierres Demeurent Debout"
  lv_blocker_clearance.0001.t.medium_ruined_holding:0 "Poussière des Âges et Fondations Ancestrales"
  lv_blocker_clearance.0001.t.large_ruined_holding:0 "L'Héritage des Seigneurs Disparus"

  # Titles - Treasure
  lv_blocker_clearance.0001.t.unexplored_caves.reward:0 "Lueurs Dorées dans les Profondeurs Infinies"
  lv_blocker_clearance.0001.t.swamp.reward:0 "Les Richesses Englouties du Grand Bourbier"
  lv_blocker_clearance.0001.t.floods.reward:0 "Ce que les Flots Révélèrent"
  lv_blocker_clearance.0001.t.noxious_gases.reward:0 "Trésors Cachés sous les Cendres Mortelles"
  lv_blocker_clearance.0001.t.stonemen.reward:0 "L'Or des Hommes Transformés en Pierre"
  lv_blocker_clearance.0001.t.bandit_camps.reward:0 "Le Butin Sanglant des Hors-la-loi"
  lv_blocker_clearance.0001.t.small_ruined_holding.reward:0 "Fortune Dissimulée entre les Pierres"
  lv_blocker_clearance.0001.t.medium_ruined_holding.reward:0 "Les Richesses Enfouies sous les Décombres"
  lv_blocker_clearance.0001.t.large_ruined_holding.reward:0 "Le Trésor des Seigneurs d'Antan"

  # Descriptions
  lv_blocker_clearance.0001.desc.unexplored_caves:0 "Après d'interminables semaines passées dans les entrailles ténébreuses de la terre, les derniers éclaireurs portant torches ont enfin regagné la surface, le visage marqué par l'épuisement et la terreur vaincue. Ces tunnels qui serpentaient dans l'obscurité absolue ont été méthodiquement cartographiés, leurs périls mortels identifiés et neutralisés, et l'inconnu terrifiant a été arraché aux ténèbres pour être exposé à la lumière crue du jour. Là où ne régnaient autrefois que murmures démoniaques, ossements brisés et terreur primitive, s'étendent désormais des cartes détaillées tracées à l'encre noire, des campements fortifiés et les prémices de véritables routes pavées. Ces cavernes maudites, jadis repaires de créatures innommables et théâtre de disparitions inexpliquées, se dressent enfin domptées et soumises, revendiquées par ceux qui eurent l'audace et la volonté de fer nécessaires pour sonder les abysses.\n\n"
  lv_blocker_clearance.0001.desc.swamp:0 "Ce qui fut jadis un bourbier pestilentiel où la mort rôdait à chaque pas, un marécage putride exhalant des miasmes mortels, a enfin été rendu praticable par la volonté des hommes. Ce marais maudit, longtemps refuge d'insectes venimeux gros comme le poing, de sables mouvants traîtres et de disparitions mystérieuses qui alimentaient les légendes locales, a été méthodiquement drainé et apprivoisé, autant qu'une telle abomination de la nature puisse l'être. Des sentiers surélevés construits en pierre et bois dur serpentent désormais à travers un sol autrefois si traître qu'aucun homme sensé n'osait le fouler, et le brouillard étouffant qui dissimulait mille dangers s'est progressivement dissipé avec chaque arbre centenaire abattu et chaque pierre retournée. Ce n'est plus un lieu de mort lente, de décomposition putride et de désespoir, mais un territoire où l'ordre a été chèrement conquis sur le chaos primordial. Des fondations nouvelles, arrachées à la vase séculaire et à la folie des marais.\n\n"
  lv_blocker_clearance.0001.desc.floods:0 "Les eaux tumultueuses se sont enfin retirées après des lunes d'attente angoissée. Ce qui gisait jadis noyé sous les marées déchaînées et la terre perpétuellement détrempée se révèle aujourd'hui dans toute sa désolation : routes éventrées comme des ventres ouverts, murs effondrés sous le poids des flots, et champs spongieux où la boue se mêle encore aux récoltes perdues. Mais aussi, et surtout, de la terre ferme émergente et l'espoir tangible de reconstruire sur des bases solides. Des digues massives et des canaux de drainage profonds ont été creusés par des centaines de bras, des levées imposantes ont été érigées selon les plans des maîtres bâtisseurs, et la pierre a été posée là où la boue régnait en maître absolu. C'est encore un pays marqué par l'humidité persistante, mais il n'est plus sans défense face aux caprices meurtriers des flots. Le déluge destructeur a été repoussé, ne serait-ce que temporairement, par la détermination humaine.\n\n"
  lv_blocker_clearance.0001.desc.noxious_gases:0 "L'air vicié s'est enfin purifié après des lunes de labeur acharné. Ce qui pesait jadis d'un poids mortel sur toute vie, ces vapeurs asphyxiantes et brumes corrosives qui tuaient en quelques respirations, a commencé à se dissiper comme un mauvais rêve au matin. Des puits d'aération profonds ont été méthodiquement creusés à travers la roche, les cendres toxiques ont été balayées par des équipes protégées, et la terre martyrisée a eu le temps de respirer à nouveau. La puanteur écœurante de soufre s'attarde encore dans l'air, faible mais reconnaissable, pourtant elle n'est plus mortelle. La montagne de feu couve toujours au loin tel un dragon endormi, silencieux avertissement de sa puissance latente, mais son poison ne tient plus la terre sous son emprise maudite. Le pire est passé... pour l'instant du moins.\n\n"
  lv_blocker_clearance.0001.desc.stonemen:0 "C'en est fait. Les hommes de pierre ont disparu à jamais, chassés comme des bêtes malades, passés au fil de l'épée dans un acte de miséricorde brutale, ou abandonnés pour glisser silencieusement sous les eaux noires et froides de la rivière qui les a vus naître. Ils n'avaient nulle espérance de guérison, nulle perspective d'avenir, rien que la lente agonie de la grisécaille. Déformés jusqu'à l'inhumanité par la maladie maudite et rendus à demi-fous par la douleur perpétuelle et la faim dévorante, ils étaient devenus un fléau mortel pour tous ceux qui osaient s'aventurer près de leurs repaires sordides. Pourtant, ce ne fut point tâche aisée que de les éliminer. Certains se souvenaient encore de leurs noms d'avant, murmurant des prières brisées. D'autres imploraient la mort dans une langue trop déformée pour être comprise, leurs yeux exprimant une humanité résiduelle. Maintenant, seul le silence lourd règne là où ils se blottissaient jadis dans l'ombre. La terre est plus sûre, certes. Mais quelque chose de plus froid et implacable a pris racine dans l'air.\n\n"
  lv_blocker_clearance.0001.desc.bandit_camps:0 "Le camp a été anéanti dans le sang et les flammes. Tentes déchirées et abattues, feux étouffés sous la terre, et sang frais imbibant la terre assoiffée qui n'avait connu que sécheresse. Les bandits se sont battus avec la rage désespérée des hommes qui savent leur fin venue, déguenillés mais féroces, brutaux car sans espoir, sans la moindre illusion sur la pitié qu'ils pouvaient espérer de leurs vainqueurs. Mais vos hommes d'armes tinrent bon face à leur furie sauvage, formant un mur d'acier et de discipline. Les quelques hors-la-loi qui survécurent au massacre se sont enfuis dans les contrées sauvages, dispersés comme des loups blessés et ensanglantés. Pour l'heure, les routes sont plus silencieuses, et le petit peuple peut respirer un peu plus librement sans craindre l'embuscade. Justice, rude comme le fer, sanglante comme la guerre, et tardive comme toujours, a été rendue.\n\n"
  lv_blocker_clearance.0001.desc.small_ruined_holding:0 "Pierre antique et silence séculaire, c'était tout ce qui demeurait quand vous êtes arrivé avec vos hommes. Maintenant, après des semaines de dur labeur, la végétation sauvage qui étranglait les murs a été impitoyablement taillée, les structures écroulées ont été minutieusement examinées par les maîtres bâtisseurs, et les derniers dangers tapis dans l'ombre ont été écartés. Ce qui fut jadis une coquille vide, un domaine fantôme hanté par les échos du passé, se dresse maintenant prêt à servir de nouveau un seigneur vivant. Il reste certes encore beaucoup d'ouvrage à accomplir, mais les fondations ancestrales sont solides comme au premier jour. Qu'il ait été oublié par des seigneurs négligents partis guerroyer ou abandonné aux caprices destructeurs du temps, ce lieu ne sera plus jamais livré à l'abandon.\n\n"
  lv_blocker_clearance.0001.desc.medium_ruined_holding:0 "Cela prit du temps, de la sueur et du sang, mais la ruine imposante se dresse enfin déblayée et sécurisée. Les tours croulantes qui menaçaient de s'effondrer ont été soigneusement inspectées pierre par pierre, les salles instables ont été étayées avec des poutres de chêne massif, et les dangers qui s'attardaient encore à l'intérieur - bêtes sauvages, vagabonds, esprits peut-être - ont été chassés ou enterrés pour de bon. Jadis coquille vide d'un dessein perdu dans les brumes du temps, le domaine se dresse maintenant fier et prêt à servir une fois encore. Il ne retrouvera peut-être jamais toute sa gloire passée, quand ses seigneurs commandaient des armées, mais la terre a été reconquise sur l'oubli, et les vieilles pierres se dressent avec une intention nouvelle et un but retrouvé.\n\n"
  lv_blocker_clearance.0001.desc.large_ruined_holding:0 "La ruine colossale se dressait vaste et silencieuse comme un titan endormi, imprégnée de mémoires plus anciennes que les cartes les plus vénérables des mestres. Ses murs cyclopéens, brisés mais toujours altiers et défiant le ciel, portaient les cicatrices indélébiles de conquêtes sanglantes, d'incendies dévastateurs et du passage inexorable du temps lui-même. Pourtant même ces pierres altières qui avaient vu passer des dynasties entières pouvaient être domptées par la volonté humaine. Après des lunes de labeur minutieux et d'efforts coordonnés, le site titanesque est enfin sécurisé, ses arcs monumentaux croulants ont été stabilisés par l'art des bâtisseurs, ses profondeurs caverneuses oubliées ont été purgées de tout danger rôdant. Bien que les fantômes d'empires déchus semblent encore murmurer leurs complaintes à travers les halls immenses battus par les vents, la ruine ne gît plus abandonnée aux éléments. Un nouveau chapitre s'écrit sur ces fondations millénaires.\n\n"

  lv_blocker_clearance.0001.desc.unexplored_caves.dragon_egg:0 "Pourtant dans les profondeurs insondables de ces grottes maudites, une découverte extraordinaire qui défie l'entendement attend. Parmi les gravats séculaires et la poussière des âges révolus gît un œuf de [dragon|E], sa coquille d'obsidienne miroitant faiblement de reflets rougeoyants dans la pâle lueur vacillante des torches. Relique sacrée d'un âge où les seigneurs dragons régnaient sur le monde depuis leurs pyramides de pierre noire, elle renferme en ses entrailles la promesse terrifiante de renaissance et de pouvoir absolu sur les mortels."
  lv_blocker_clearance.0001.desc.swamp.dragon_egg:0 "Parmi la vase millénaire et les pierres oubliées, profondément enfoui dans des racines noueuses plus anciennes que la mémoire des hommes, quelque chose d'extraordinaire et d'impossible fut découvert, lisse comme galet de rivière poli par les âges, mais étrangement chaud au toucher comme brasier étouffé. Un œuf de [dragon|E], ou du moins ainsi le prétendent les murmures tremblants des ouvriers. Les légendes fragmentées racontent que de telles reliques divines furent abandonnées aux jours glorieux de [valyria|E], perdues dans les flammes du Fléau ou englouties par la terre affamée. Qu'une telle merveille refasse surface ici, au cœur putride d'un marécage oublié des dieux et des hommes, est un prodige que peu croiront. Mais ceux qui l'ont vue de leurs yeux savent la vérité : le monde vient de basculer sur ses fondations."
  lv_blocker_clearance.0001.desc.floods.dragon_egg:0 "Parmi la vase gluante et les débris innombrables abandonnés par le déluge dévastateur, quelque chose de totalement inattendu et miraculeux fut découvert : un objet lisse, recouvert d'écailles nacrées, et délicatement chaud comme pierre au soleil. Un œuf de [dragon|E], sans nul doute possible. Qu'il ait été perdu dans quelque cataclysme ancien dont les chroniques ont oublié le nom, ou enterré à la hâte par un seigneur dragon durant la chute apocalyptique de l'[old_valyria|E], nul mortel ne saurait le dire avec certitude. Mais les histoires des mestres sont formelles sur ce point : de telles choses ne sont point de simples reliques mortes. Elles sont promesse de gloire, et péril d'anéantissement."
  lv_blocker_clearance.0001.desc.noxious_gases.dragon_egg:0 "Dans le bassin fissuré d'un ravin calciné par les feux souterrains, profondément enfoui sous des couches stratifiées de cendres refroidies et de pierre volcanique vitrifiée, quelque chose d'étrange et d'impossible fut déterré : un œuf ovoïde, sombre comme la nuit sans lune et veiné de filaments écarlates, pulsant faiblement d'une chaleur intérieure surnaturelle. Un œuf de [dragon|E], selon tous les témoignages tremblants. Comment il en vint à reposer là, nul sage ne saurait l'expliquer, mais dans l'ombre menaçante des monts-de-feu où la terre vomit encore sa bile brûlante, de telles reliques divines ne se laissent point aisément écarter comme simple mythe. Le sang ancien de l'Antique Valyria s'agite de nouveau dans les veines du monde."
  lv_blocker_clearance.0001.desc.stonemen.dragon_egg:0 "Au cœur putride du camp des hommes de pierre, où cendre grise et pierre maudite se mêlaient dans un sinistre mariage de désolation, une étrange relique impossible fut découverte par le plus grand des hasards. Un œuf ovoïde, sombre comme l'obsidienne et veiné de rouge sang, pulsant faiblement d'une chaleur surnaturelle qui défie les lois de la nature. Un œuf de [dragon|E], peut-être abandonné par un seigneur valyrien en fuite devant l'inexorable Fléau, ou enterré à la hâte durant l'effondrement cataclysmique de [valyria|E] la Grande. Sa présence ici, en ce lieu maudit, n'est point le fruit du hasard aveugle. C'est un vestige de feu éternel, dormant sous la cendre des âges."
  lv_blocker_clearance.0001.desc.bandit_camps.dragon_egg:0 "Sous la pierre d'âtre effondrée de l'ancienne grand-salle où les seigneurs d'antan festoyaient, vos hommes découvrirent quelque chose qui dépasse l'entendement : un objet ovale, semblable à une pierre précieuse polie par les dieux eux-mêmes, et délicatement chaud au toucher comme charbon ardent. Un œuf de [dragon|E], sans l'ombre d'un doute. Peut-être abandonné par un noble valyrien fuyant l'apocalypse, ou enterré en secret durant les derniers jours du Fléau quand le monde brûlait. Quelle que soit son origine perdue dans les brumes du temps, sa présence ici n'est point accidentelle. Un vestige de feu primordial, dormant sous la cendre froide des siècles."
  lv_blocker_clearance.0001.desc.small_ruined_holding.dragon_egg:0 "Dans les ruines cyclopéennes de ce qui fut peut-être jadis un caveau sacré ou un sanctuaire dédié aux anciens dieux, profondément enfoui sous des tonnes de gravats calcinés et des sigilles usés jusqu'à l'illisibilité par le temps impitoyable, une relique impossible fut découverte : lisse comme marbre, parfaitement ovale, et pulsant faiblement d'une chaleur intérieure surnaturelle. Un œuf de [dragon|E], bien que nul sage ne puisse déterminer son âge véritable, ni pourquoi il gisait caché en ce lieu oublié. Relique d'une lignée royale oubliée des chroniques, ou quelque chose de plus ancien et terrible encore. La ruine gardait jalousement plus que de la simple pierre morte."
  lv_blocker_clearance.0001.desc.medium_ruined_holding.dragon_egg:0 "Dans les profondeurs ténébreuses de l'ancien donjon, derrière des murs que tous croyaient définitivement effondrés depuis des générations, une relique extraordinaire fut trouvée : un œuf parfait, sombre comme l'obsidienne de Peyredragon et veiné de filaments rougeoyants, pulsant faiblement d'une chaleur qui défie les lois naturelles. Un œuf de [dragon|E], peut-être abandonné par un seigneur dragon en fuite devant la colère des dieux, ou enterré à la hâte durant la chute cataclysmique de [valyria|E] l'Éternelle. Sa présence ici, préservée pendant des siècles, n'est point accidentelle. Un vestige de feu divin, dormant patiemment sous la cendre du temps."
  lv_blocker_clearance.0001.desc.large_ruined_holding.dragon_egg:0 "Loin sous les flèches titanesques écroulées, vos hommes déterrèrent une chambre secrète que la lumière du soleil n'avait jamais profanée depuis la chute des empires. À l'intérieur de ce sanctuaire préservé, entouré de pierre noircie par des feux anciens et de glyphes valyriens fanés mais encore lisibles, gisait un œuf unique et parfait : luisant d'une lumière intérieure, veiné de rouge sang, et chaud au toucher comme braise vivante. Qu'il ait été abandonné dans la panique du Fléau ou scellé avec une intention rituelle précise, il a miraculeusement survécu à la chute des empires et au silence étouffant des siècles morts. Maintenant, par droit de conquête, il vous appartient. Une relique authentique de [dragons_plural|E], dormant dans les ténèbres éternelles."

  lv_blocker_clearance.0001.desc.unexplored_caves.gold_high:0 "Les cavernes maudites, jadis territoire exclusif des ténèbres primordiales et de la terreur sans nom, ont finalement livré leurs secrets les plus précieux et les mieux gardés. Quand les derniers éclaireurs épuisés remontèrent des profondeurs abyssales, ils rapportèrent avec eux non seulement des récits glaçants de périls mortels évités de justesse, mais aussi des trésors qui dépassent l'imagination la plus cupide. Or antique et gemmes parfaites, dissimulés même aux regards perçants des [dragonlords|El] d'antan, gisent maintenant exposés à la lumière éblouissante du jour. Une récompense divine, digne de ceux qui osèrent braver les profondeurs interdites et en revenir victorieux."
  lv_blocker_clearance.0001.desc.swamp.gold_high:0 "Le travail harassant ne visait qu'à drainer la terre putride et élever des sentiers fermes au-dessus de la fange, mais la Fortune capricieuse avait ses propres desseins mystérieux. Sous un autel de pierre noire effondré depuis des siècles, au cœur le plus profond et inaccessible du bourbier maudit, les terrassiers découvrirent un trésor qui défie l'entendement. Coffres massifs scellés de fer rouillé mais intact, milliers de pièces estampillées des visages hautains des anciens seigneurs valyriens, et ornements royaux perdus aux siècles de pourriture et d'oubli. Nul ne peut dire avec certitude comment ce trésor fabuleux en vint à être enterré en un lieu si inhospitalier : certains murmurent de [dragonlords|El] fuyant le Fléau, d'autres évoquent des bandits légendaires qui n'échappèrent jamais à leur propre piège mortel. Quelle que soit son origine mystérieuse, le trésor est indubitablement réel. Et maintenant, par droit de découverte, il vous appartient entièrement."
  lv_blocker_clearance.0001.desc.floods.gold_high:0 "Alors que les eaux de crue tumultueuses se retiraient enfin après des lunes d'angoisse, elles laissèrent derrière elles infiniment plus que limon stérile et ruines désolées. Niché dans une cave éventrée par la fureur des flots ou à demi-enterré sous des tonnes de pierres tombées, un trésor colossal fut miraculeusement découvert : des pièces d'or par milliers, bijoux finement ouvrés par des mains d'artistes morts depuis longtemps, et artefacts mystérieux de facture oubliée des hommes modernes. Une fortune royale, par toute mesure imaginable. Assez pour reconstruire un royaume, étendre ses domaines jusqu'aux frontières des voisins, ou attiser l'envie mortelle de seigneurs lointains et ambitieux."
  lv_blocker_clearance.0001.desc.noxious_gases.gold_high:0 "Parmi les ruines noircies par le feu et la pierre calcinée jusqu'à la vitrification, un caveau secret fut découvert par le plus grand des hasards, ses serrures massives déformées par la chaleur infernale mais miraculeusement demeurées intactes. À l'intérieur de cette chambre forte naturelle, l'or luisait sans la moindre ternissure de cendre ou de temps : pièces antiques, lingots massifs et ornements royaux, plus de richesses que la plupart des grands seigneurs ne pourraient revendiquer en une vie entière, intouchés par le feu dévastateur mais cachés pendant des générations innombrables. Qu'ils aient été patiemment amassés par des [dragonlords|El] cupides ou enterrés à la hâte avant que la montagne ne vomisse sa colère, ils vous appartiennent maintenant par droit de conquête."
  lv_blocker_clearance.0001.desc.stonemen.gold_high:0 "Au cœur putride du camp maudit des hommes de pierre, où cendre grise et pierre maudite se mêlaient dans leur étreinte mortelle, une cache dissimulée avec art fut miraculeusement découverte. Des milliers de pièces d'or, ternies par le temps mais intactes, et des reliques d'artisanat valyrien perdu depuis longtemps aux brumes du temps. Peut-être abandonnées par un seigneur fuyant la malédiction ou enterrées à la hâte durant la chute apocalyptique de [valyria|E] la Grande. Quelle que soit son origine mystérieuse, c'est un trésor royal digne d'être revendiqué, juste récompense pour ceux qui osèrent affronter la malédiction de la grisécaille et en revenir victorieux."
  lv_blocker_clearance.0001.desc.bandit_camps.gold_high:0 "Alors que vos hommes d'armes forçaient brutalement le caveau secret dissimulé sous le camp dévasté des bandits, l'éclat aveuglant de l'or inonda soudain la chambre souterraine : coffres débordant de pièces volées aux marchands assassinés, babioles dorées arrachées aux nobles voyageurs, et fineries marchandes pillées sur d'innombrables caravanes. Mais la célébration triomphante vint trop tôt. Des pas lourds résonnent soudain dans la pénombre menaçante. Depuis la lisière sombre des bois, des ombres armées se rassemblent : les derniers bandits survivants, pas encore occis, poussés par le désespoir absolu et une soif de vengeance inextinguible. L'or scintillant est à portée de main, mais un dernier combat sanglant demeure, et il sera absolument sans merci."
  lv_blocker_clearance.0001.desc.small_ruined_holding.gold_high:0 "Caché dans une cave secrète magistralement dissimulée, derrière des murs à demi-effondrés par le poids impitoyable du temps, gisait un caveau oublié de tous. À l'intérieur, un spectacle éblouissant : des pièces par coffres entiers, de l'or antique portant des sigilles nobles effacés par la poussière des siècles, et des reliques de valeur inestimable depuis longtemps effacées de la mémoire collective. Peut-être le trésor de guerre d'une maison noble perdue lors des guerres sanglantes ou forcée à l'exil précipité. Maintenant, par droit de découverte, il vous appartient entièrement : un trésor assez considérable pour remodeler vos plans les plus ambitieux et régler même les dettes les plus écrasantes."
  lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_high:0 "Les niveaux inférieurs labyrinthiques de la ruine, que tous croyaient définitivement effondrés et inaccessibles, recelaient infiniment plus que poussière et ossements. Des chambres secrètes dissimulées derrière d'ingénieux faux murs révélèrent une fortune stupéfiante : des milliers de pièces marquées par des maisons nobles mortes depuis des générations, des gobelets d'argent massif, et des héritages familiaux que la lumière n'avait pas touchés pendant des décennies entières. Le caveau fut probablement scellé à la hâte dans la panique, abandonné durant une guerre perdue ou un exil forcé. Sa redécouverte miraculeuse maintenant est une récompense non seulement pour la persistance acharnée, mais pour la simple survie dans ce monde cruel."
  lv_blocker_clearance.0001.desc.large_ruined_holding.gold_high:0 "Sous la place d'armes centrale, scellé par une dalle de pierre si épaisse qu'elle nécessita des mois de labeur acharné pour être percée, un trésor antique et fabuleux se révéla enfin. Des pièces plus anciennes que la Foi des Sept elle-même, des couronnes d'empires depuis longtemps éteints et oubliés, et une statuaire dorée sculptée dans des styles artistiques non vus depuis des générations perdues. C'est une fortune colossale non seulement en poids d'or, mais en valeur historique inestimable : un vestige tangible et éblouissant du monde glorieux qui fut. Un trésor à rivaliser avec les plus grandes fortunes des [dragonlords|El] d'antan, maintenant vôtre à revendiquer par droit de conquête."

  lv_blocker_clearance.0001.desc.unexplored_caves.gold_low:0 "Les cavernes sombres renfermaient plus que des ombres menaçantes et des échos lugubres. Parmi les passages tortueux et dangereux, un trésor modeste mais bienvenu fut découvert : des pièces anciennes ternies par les siècles d'abandon, et une poignée de gemmes brutes nichées dans la pierre millénaire. Pas suffisant pour éveiller l'envie jalouse d'un roi cupide, mais assez pour luire de promesse tangible. Un prix honorable et mérité pour ceux assez audacieux pour braver les profondeurs interdites."
  lv_blocker_clearance.0001.desc.swamp.gold_low:0 "Dans le déblaiement laborieux de la vase putride et du bourbier nauséabond, quelque chose scintilla soudain sous les racines pourries. Un trésor modeste mais réel, point la rançon fabuleuse d'un roi, mais suffisant pour couper le souffle d'un homme simple. Des pièces éparpillées par le hasard, un gobelet d'argent terni par les ans, vestiges d'une richesse jadis soigneusement cachée puis oubliée. Peut-être le butin d'un seigneur mineur en fuite, ou le tribut final et désespéré d'une caravane condamnée. Quelle que soit son histoire perdue, l'or est indubitablement réel, et il garnit maintenant vos coffres vides : récompense silencieuse mais tangible pour un labeur dur et répugnant."
  lv_blocker_clearance.0001.desc.floods.gold_low:0 "Ce ne fut point une fortune royale, du moins pas au premier regard avide : une bourse de vieilles pièces usées coincée dans les poutres vermoulues d'un entrepôt effondré, quelques lingots d'argent éparpillés et cachés sous des pierres tombées. Pourtant, c'est une trouvaille plus que bienvenue dans ces temps difficiles. Modeste soit-elle, c'est suffisant pour affermir les mains incertaines et financer les premiers pas hésitants de la reconstruction nécessaire."
  lv_blocker_clearance.0001.desc.noxious_gases.gold_low:0 "Toutes les richesses ne sont point grandioses et éblouissantes. Niché sous la roche volcanique effondrée et les débris calcinés, un trésor modeste mais réel vint à la lumière : quelques dizaines de pièces fusionnées ensemble par la chaleur, un coffre de bois roussi à demi-consumé par le feu ancien. Pourtant, suffisamment demeura intact pour compter. Une aubaine silencieuse mais appréciable, tirée des cendres de ce qui fut presque entièrement perdu à jamais."
  lv_blocker_clearance.0001.desc.stonemen.gold_low:0 "Parmi les ruines désolées du camp maudit des hommes de pierre, une petite cache opportune fut trouvée : des pièces usées, ternies mais intactes et utilisables, et quelques babioles de valeur qui survécurent miraculeusement à la décomposition ambiante. Ce n'est point une fortune légendaire, mais c'est suffisant pour rappeler à ceux qui demeurent que même dans les lieux les plus sombres et désespérés, l'espoir peut être trouvé. Une petite récompense matérielle pour une tâche sinistre mais nécessaire."
  lv_blocker_clearance.0001.desc.bandit_camps.gold_low:0 "Niché sous une planche pourrie du plancher effondré, vos hommes découvrirent une petite réserve de butin modeste : des pièces éparpillées de diverses frappes, un anneau d'argent terni, un gobelet cabossé par les voyages et les combats. Assez pour mériter d'être compté, mais pas suffisant pour s'en vanter devant les autres seigneurs. Alors qu'ils commençaient méthodiquement à empaqueter les maigres dépouilles, un mouvement soudain s'agita dans les sous-bois sombres. Les derniers bandits survivants, déguenillés et hurlant leur rage, surgissent dans une tentative finale et sauvage de reconquérir ce qui leur appartient. Un affrontement sanglant de plus se profile à l'horizon."
  lv_blocker_clearance.0001.desc.small_ruined_holding.gold_low:0 "Parmi les vestiges brisés d'une ancienne chambre d'intendant, vos hommes découvrirent une réserve modeste mais utile : des sacs de pièces communes, quelques anneaux d'argent, et des outils d'artisanat ancien soigneusement nichés sous les planchers vermoulus. Suffisant pour être appelé une récompense, sinon une véritable aubaine. Il semble que même les plus humbles ruines puissent encore s'accrocher désespérément à leur passé révolu."
  lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_low:0 "Parmi les épaves poussiéreuses d'un ancien salon seigneurial, vos hommes découvrirent un petit coffre soigneusement scellé, ses gonds de fer rouillés par les ans, mais son contenu miraculeusement intact. Modeste, mais significatif pour qui sait compter : des pièces de diverses frappes, quelques bijoux ternis, et un étroit registre trop fané pour être déchiffré. Peut-être les derniers biens terrestres d'un châtelain qui ne revint jamais de la guerre. Quelle que soit l'histoire tragique, sa valeur matérielle endure."
  lv_blocker_clearance.0001.desc.large_ruined_holding.gold_low:0 "Niché derrière un mur effondré dans ce qui fut jadis la demeure d'un noble de haut rang, vos hommes découvrirent une cache longtemps scellée et oubliée : une collection modeste mais précieuse de bijoux anciens, de vieilles pièces usées, et d'objets cérémoniels probablement cachés dans le chaos sanglant de la chute. Bien qu'humble comparé à la grandeur architecturale de la ruine titanesque elle-même, c'est un fragment tangible et précieux du passé glorieux, et la preuve irréfutable que même les plus grandes cités furent édifiées par des mains humaines mortelles."

  #Options
  lv_blocker_clearance.0001.a:0 "Les dieux ont souri sur notre entreprise !"

  ## Swamp: Challenge Event
  lv_blocker_clearance.0011.t:0 "La Conquête Finale du Grand Marécage"
  lv_blocker_clearance.0011.desc:0 "Le marécage putride a été partiellement drainé, son terrain sauvage et traître partiellement soumis à la volonté humaine, mais un effort final et décisif demeure pour reconquérir pleinement cette terre maudite. Les remblais précaires doivent être renforcés avec de la pierre et du mortier, les canaux de drainage doivent être astucieusement redirigés selon les plans des ingénieurs, et de nouvelles fondations massives doivent être posées avec un soin méticuleux et obsessionnel. Un seul faux pas, une seule erreur de calcul, pourrait voir le bourbier affamé revenir en force, engloutissant des lunes entières d'effort acharné et de sacrifices.\n\nLe peuple épuisé se tourne vers vous, ou vers votre intendant de confiance, pour une direction ferme. Si cette phase finale cruciale est magistralement menée, le marécage sera définitivement conquis et civilisé. Sinon, les eaux putrides pourront remonter avec vengeance."
  lv_blocker_clearance.0011.a:0 "Je superviserai personnellement cette phase finale décisive."
  lv_blocker_clearance.0011.b:0 "Mon intendant compétent gérera ces détails techniques."

  # Swamp: Failure
  lv_blocker_clearance.0012.t:0 "Les Efforts S'enlisent dans la Défaite"
  lv_blocker_clearance.0012.desc:0 "Malgré les efforts héroïques de votre équipe dévouée, le marécage ancestral résiste avec acharnement à toute tentative de domestication. Les fondations nouvellement posées glissent inexorablement dans la vase, des ouvriers continuent de disparaître mystérieusement dans la boue traîtresse, et les plateformes hâtivement construites pourrissent en quelques jours sous l'humidité dévorante. La terre sauvage reconquiert méthodiquement le peu qui fut si chèrement gagné, et le progrès rampe pathétiquement vers l'arrière dans le bourbier éternel. Ce n'est point une perte complète et définitive, mais cela y ressemble dangereusement."
  lv_blocker_clearance.0012.a:0 "Le marécage est plus têtu que les Sept Enfers. Nous essaierons encore, avec plus de prudence."

  # Swamp: Critical Failure
  lv_blocker_clearance.0013.t:0 "Totalement Englouti par le Bourbier Vengeur"
  lv_blocker_clearance.0013.desc:0 "Tout s'est effondré dans un désastre cataclysmique et absolu. Des structures entières ont disparu sans laisser de trace sous la tourbière affamée, et un canal de drainage tragiquement mal calculé a inondé des hectares de terrain vital. Les équipes de travail se sont dispersées dans la panique, les outils coûteux sont perdus à jamais, et le marécage s'épaissit vicieusement à chaque faux pas désespéré. Tout ce qui avait été si péniblement accompli est maintenant complètement défait : la terre est une fois encore un bourbier mortel, traître et mouvant. Vous devrez tout recommencer depuis le début, si vous en avez encore le courage."
  lv_blocker_clearance.0013.a:0 "Tout est perdu. Le marécage a dévoré notre labeur et nos espoirs."

  # Swamp: Success
  lv_blocker_clearance.0014.t:0 "Terre Ferme et Victoire Enfin"
  lv_blocker_clearance.0014.desc:0 "Avec des mains fermes, une volonté de fer et une planification méticuleuse digne des grands bâtisseurs, le marécage millénaire a été finalement et définitivement soumis. Des canaux profonds ont été expertement creusés selon les anciens savoirs, les supports ont été massivement renforcés avec du chêne et de la pierre, et de la terre sèche et arable commence enfin à se former là où il n'y avait jadis que boue putride et décomposition nauséabonde. Il faudra encore du temps pour y construire des habitations durables, mais pour l'heure bénie, le danger immédiat est écarté. Le bourbier ancestral a été rendu gérable et productif."
  lv_blocker_clearance.0014.a:0 "Victoire chèrement acquise, mais la terre nous appartient enfin !"

  # Swamp: Critical Success
  lv_blocker_clearance.0015.t:0 "Le Grand Marais Miraculeusement Transformé"
  lv_blocker_clearance.0015.desc:0 "Un coup de maître absolu et sans précédent. La phase finale de l'effort titanesque se déroula avec une perfection surnaturelle : nulle erreur humaine, nul revers du destin. La terre maudite sécha plus rapidement que les plus optimistes osaient l'espérer, révélant non seulement un sol étonnamment stable et fertile, mais aussi les vestiges préservés de structures antiques perdues depuis des siècles sous la boue éternelle. Parmi les poteaux pourris et la pierre engloutie noircie, quelque chose scintilla soudain dans la lumière : un coffre massif parfaitement scellé, miraculeusement intouché par le temps et l'humidité, maintenant enfin libéré de l'emprise millénaire du marécage."
  lv_blocker_clearance.0015.a:0 "Le marécage est conquis, et nous a récompensés de notre persévérance !"

  ## Floods: Challenge Event
  lv_blocker_clearance.0021.t:0 "Le Bourbier Cède Enfin"
  lv_blocker_clearance.0021.desc:0 "Les eaux de crue dévastatrices se sont en grande partie retirées après des lunes d'angoisse, laissant derrière elles un sol perpétuellement détrempé et les fragiles commencements d'une récupération hésitante. Pourtant, à moins que les rivières capricieuses ne soient définitivement domptées et la terre proprement drainée avec science, tout progrès difficilement acquis pourrait être anéanti en un instant. Des fossés profonds doivent être creusés selon les anciens savoirs, les levées doivent être massivement renforcées, et le peuple doit être guidé avec une détermination inflexible, avant que la prochaine pluie torrentielle ne défasse tout.\n\nLe travail titanesque demande une main de fer et un esprit clair comme cristal. Que ce soit par votre commandement direct ou celui de votre intendant expérimenté, cet effort final décidera si la terre est reconquise pour de bon, ou noyée une fois encore dans le désespoir."
  lv_blocker_clearance.0021.a:0 "Je repousserai personnellement ces crues maudites."
  lv_blocker_clearance.0021.b:0 "Mon intendant capable finira ce qui fut si bien commencé."

  # Floods: Failure
  lv_blocker_clearance.0022.t:0 "Les Eaux Traîtresses Remontent"
  lv_blocker_clearance.0022.desc:0 "Les efforts désespérés pour rediriger les eaux de crue ont vacillé pitoyablement sous la pression. Les levées de fortune hâtivement érigées se sont brisées comme des brindilles sous la pression hydraulique implacable, et les plans de drainage supposément ingénieux se sont avérés tragiquement insuffisants. Bien qu'un certain progrès eût été péniblement réalisé, il est maintenant cruellement évident que l'inondation a repris son avance lente mais absolument inexorable, défaisant méthodiquement tout progrès récent. Les champs fertiles se noient de nouveau sous les eaux boueuses, et les esprits du peuple sombrent avec eux dans le désespoir."
  lv_blocker_clearance.0022.a:0 "Nous avons gravement sous-estimé la fureur des eaux. Nous devons mieux nous préparer."
  
  # Floods: Critical Failure
  lv_blocker_clearance.0023.t:0 "Totalement Emporté par les Flots"
  lv_blocker_clearance.0023.desc:0 "Un effondrement complet, total et catastrophique. Les pluies diluviennes sont revenues avec une force vengeresse quasi divine, et toutes les défenses contre les crues se sont écroulées dans un désarroi absolu. Les canaux ont débordé en torrents destructeurs, les ponts se sont effondrés dans un fracas apocalyptique, et des sections entières de terre chèrement reconquise ont été perdues à jamais dans les flots tumultueux et impitoyables. Le terrain est une fois encore complètement étouffé par le limon épais et l'eau stagnante, et tous les gains si difficilement acquis ont été balayés sans pitié. La terre sauvage a reconquis avec rage ce qui lui fut arraché : maintenant tout doit être laborieusement refait depuis le début."
  lv_blocker_clearance.0023.a:0 "Désastre total et absolu... Nous devrons tout recommencer, si nous en trouvons le courage."

  # Floods: Success
  lv_blocker_clearance.0024.t:0 "Les Eaux Vaincues Se Retirent"
  lv_blocker_clearance.0024.desc:0 "Après un travail titanesque et infatigable sous un soleil de plomb, les dernières eaux de crue rebelles ont été définitivement repoussées et domptées. Les digues massives tiennent ferme comme des remparts, les ruisseaux astucieusement détournés trouvent docilement leur nouveau cours imposé, et le sol perpétuellement détrempé commence enfin à sécher sous le soleil bienfaiteur qui revient. Il reste certes encore une immense tâche de reconstruction à accomplir, mais le danger mortel est définitivement passé, et la terre vous appartient une fois encore par droit de conquête sur les éléments."
  lv_blocker_clearance.0024.a:0 "Enfin ! Les crues maudites sont derrière nous pour de bon."

  # Floods: Critical Success
  lv_blocker_clearance.0025.t:0 "Les Eaux Domptées et Asservies"
  lv_blocker_clearance.0025.desc:0 "Non seulement la crue dévastatrice fut tenue à distance respectueuse, mais elle fut magistralement maîtrisée et mise au service de l'homme. Une brillante redirection hydraulique, un labeur surhumain, et une planification géniale digne des anciens bâtisseurs ont non seulement asséché la terre martyrisée mais l'ont complètement remodelée à votre avantage. Les anciens marécages stériles sont maintenant des basses-terres d'une fertilité légendaire. Et dans un lit de rivière nouvellement exposé, quelque chose d'antique et précieux fut miraculeusement découvert : un trésor royal enterré et oublié depuis des générations, maintenant ramené à la lumière éblouissante par les eaux qui se retirent en signe de soumission."
  lv_blocker_clearance.0025.a:0 "Les eaux domptées se retirent, et nous laissent un présent royal !"

  ## Noxious Gases: Challenge Event
  lv_blocker_clearance.0031.t:0 "Sceller les Vapeurs Mortelles"
  lv_blocker_clearance.0031.desc:0 "Le pire des vapeurs toxiques s'est considérablement amenuisé, mais la terre tourmentée n'est pas encore entièrement sûre pour les vivants. Des gaz mortels s'élèvent encore sporadiquement d'évents volcaniques profonds ou s'accrochent sournoisement au terrain bas, invisibles comme des spectres et mortels comme le poison. Le confinement final et définitif doit être manipulé avec une précision absolue et scientifique : détourner les flux gazeux, sceller hermétiquement toutes les fissures, et peut-être construire d'ingénieux canaux pour disperser ce qui s'attarde encore.\n\nUn seul faux calcul, une seule erreur, pourrait tout relâcher de nouveau avec des conséquences apocalyptiques. Vous pouvez superviser personnellement cet effort critique, ou confier la tâche périlleuse à votre intendant. Dans tous les cas, c'est la barrière finale et décisive entre la ruine totale et le renouveau tant espéré."
  lv_blocker_clearance.0031.a:0 "Je gérerai ceci personnellement. La précision est vitale."
  lv_blocker_clearance.0031.b:0 "Mon intendant expérimenté supervisera le confinement final."

  # Noxious Gases: Failure
  lv_blocker_clearance.0032.t:0 "Les Vapeurs Mortelles Remontent"
  lv_blocker_clearance.0032.desc:0 "Le travail minutieux pour sceller définitivement les derniers évents nocifs a lamentablement et tragiquement vacillé. Que ce soit par erreur de jugement fatal, barrières mal alignées par incompétence, ou simplement la nature intrinsèquement volatile et imprévisible de la terre volcanique elle-même, les gaz mortels ont commencé à s'élever une fois encore avec vengeance. Des ouvriers malades et agonisants trébuchent hors de la brume empoisonnée, vomissant et toussant, et la puanteur écœurante s'accroche à l'air comme une malédiction divine.\n\nTout progrès a été cruellement défait, et la zone redevient périlleusement mortelle. Bien que ce ne soit point un effondrement complet et définitif, le revers est indéniablement clair, douloureux et coûteux en vies humaines.\n\n"
  lv_blocker_clearance.0032.desc.illness.self:0 "Alors que les vapeurs mortelles s'épaississaient une fois encore comme un linceul, vous fûtes tragiquement pris dans le pire de l'empoisonnement toxique. Un goût métallique de sang s'accroche obstinément à votre bouche, et vos poumons semblent avoir été calcinés de l'intérieur. Des jours ont passé dans l'agonie, pourtant la maladie mystérieuse demeure, cruel et constant rappel de combien près de la mort vous vous êtes tenu."
  lv_blocker_clearance.0032.desc.illness.councillor:0 "Dans le chaos absolu de l'effort tragiquement raté, votre intendant dévoué prit héroïquement le plus gros de l'exposition mortelle. Il gît maintenant au lit, tremblant et délirant, la peau moite de sueur froide et le souffle dangereusement court, sa récupération hautement incertaine. Le péril mortel demeure présent, et maintenant un des vôtres paie le prix ultime de l'échec."
  lv_blocker_clearance.0032.a:0 "Calcul tragiquement erroné. Nous devons réessayer avec infiniment plus de précautions."

  # Noxious Gases: Critical Failure
  lv_blocker_clearance.0033.t:0 "Étouffés par Notre Propre Hubris"
  lv_blocker_clearance.0033.desc:0 "Désastre absolu et apocalyptique. Ce qui était destiné à être l'effort final et décisif de confinement a terriblement et irrémédiablement mal tourné. Une fissure que l'on croyait scellée a soudain éclaté avec un rugissement infernal digne des Sept Enfers, inondant instantanément toute la zone de vapeurs asphyxiantes et mortelles. Des ouvriers se sont effondrés là où ils se tenaient, morts avant de toucher le sol. Le bétail a péri en masse dans d'atroces souffrances. Même le vent lui-même sembla devenir traître, portant le poison mortel plus loin qu'il n'était jamais allé auparavant.\n\nTous les gains si chèrement acquis sont maintenant complètement anéantis. La terre gît une fois encore étouffée sous un linceul de gaz épais et suffocant. La déblayer encore nécessitera un temps infini, une prudence extrême, et une mesure considérable de chance divine."
  lv_blocker_clearance.0033.a:0 "Échec catastrophique et total... Les dieux nous ont abandonnés."

  # Noxious Gases: Success
  lv_blocker_clearance.0034.t:0 "L'Air Enfin Purifié"
  lv_blocker_clearance.0034.desc:0 "Les efforts finaux titanesques ont magistralement et miraculeusement réussi. Toutes les fissures mortelles ont été hermétiquement scellées avec du plomb fondu, les évents toxiques ont été ingénieusement détournés, et les dernières traces persistantes des vapeurs étouffantes se sont enfin évanouies comme un cauchemar au réveil. L'air, jadis épais de poison mortel et de mort certaine, porte maintenant la senteur nette et vivifiante du vent libre et de la pluie lointaine et pure. Les récoltes peuvent enfin pousser sans noircir, le bétail peut paître en sécurité, et les gens osent respirer profondément une fois encore sans craindre la mort.\n\nPar diligence surhumaine, planification méticuleuse, et effort héroïque, la terre a été héroïquement reconquise sur le tueur invisible. Le danger mortel est définitivement écarté. Pour l'instant, du moins.\n\n"
  lv_blocker_clearance.0034.desc.illness.self:0 "Pourtant toutes les victoires glorieuses ne viennent point sans leur prix de sang. Vous êtes certes sorti victorieux de l'opération périlleuse, mais le temps passé dangereusement près des vapeurs infâmes a laissé sa marque indélébile. Une toux persistante qui ne partira jamais tout à fait. Un vertige troublant qui s'attarde plus longtemps qu'il ne devrait naturellement. La terre est enfin sûre... mais vous n'êtes point sorti intouché de l'épreuve."
  lv_blocker_clearance.0034.desc.illness.councillor:0 "Bien que l'opération complexe se soit terminée en succès éclatant, votre intendant courageux n'échappa point indemne aux vapeurs. L'exposition prolongée aux gaz toxiques l'a laissé pâle comme un spectre et chancelant, sa voix autrefois forte maintenant plus faible qu'un murmure. Il insiste stoïquement qu'il récupérera avec le temps et le repos, mais son sacrifice héroïque ne sera jamais oublié."
  lv_blocker_clearance.0034.a:0 "L'air est clair enfin. Nous pouvons respirer librement !"

  # Noxious Gases: Critical Success
  lv_blocker_clearance.0035.t:0 "Fortune Divine dans les Brumes Mortelles"
  lv_blocker_clearance.0035.desc:0 "La phase finale complexe se déroula plus harmonieusement que même les plus optimistes des ingénieurs osaient espérer dans leurs rêves les plus fous. Tous les évents mortels furent scellés sans le moindre incident, l'air empoisonné s'éclaircit en un temps record défiant toute logique, et la terre martyrisée sembla exhaler de soulagement comme un être vivant. Pourtant la Fortune capricieuse tenait infiniment plus que du simple air pur en réserve pour les braves. Tout en inspectant méticuleusement la zone une dernière fois pour s'assurer de la sécurité, vos ouvriers déterrèrent quelque chose de miraculeux, longtemps caché sous la terre empoisonnée : un caveau antique et royal, parfaitement scellé et oublié depuis des siècles, préservé paradoxalement par les vapeurs mortelles mêmes qui rendirent jadis ce lieu inhabitable.\n\nLe péril mortel est définitivement parti, et à sa place... une fortune royale attend d'être revendiquée."
  lv_blocker_clearance.0035.a:0 "L'air purifié révèle des richesses royales enterrées dans la brume !"

  ## Stonemen: Challenge Event
  lv_blocker_clearance.0041.t:0 "Les Derniers Hommes de Pierre"
  lv_blocker_clearance.0041.desc:0 "Les hommes de pierre maudits ont été brutalement repoussés dans le sang et les larmes, mais leur présence spectrale s'attarde encore menaçante aux franges de la civilisation : grottes humides, ruines cyclopéennes, et abris brisés où les malades condamnés et les désespérés sans espoir se blottissent en silence, attendant la mort. Pour pleinement et définitivement déblayer le campement maudit, toute la zone doit être méthodiquement balayée, mise en quarantaine draconienne, et hermétiquement scellée. Ce n'est point simplement affaire d'épée tranchante et de feu purificateur, mais d'organisation militaire et d'ordre implacable.\n\nSi le travail est mal exécuté avec négligence, les affligés peuvent revenir comme une marée, et la malédiction de la grisécaille se répandra de nouveau comme une traînée de poudre. Prendrez-vous personnellement charge de cette purge nécessaire, ou placerez-vous votre confiance absolue dans la précision militaire de votre maréchal ?"
  lv_blocker_clearance.0041.a:0 "Je verrai cette plaie divine terminée de mes propres mains."
  lv_blocker_clearance.0041.b:0 "Mon maréchal expérimenté coordonnera le balayage final avec précision."

  # Stonemen: Failure
  lv_blocker_clearance.0042.t:0 "La Malédiction de Pierre S'attarde"
  lv_blocker_clearance.0042.desc:0 "L'opération militaire a vacillé lamentablement face à l'horreur. Les routes furent maladroitement bloquées, les provisions vitales s'amenuisèrent dangereusement, et quand la poussée finale désespérée vint enfin, les hommes de pierre se dispersèrent comme des spectres dans le bourbier et les ruines labyrinthiques. Trop nombreux s'échappèrent du cordon supposément étanche, et le camp maudit couve encore, hors de portée mais toujours menaçant. Leur présence demeure un danger mortel et constant, et pire encore, certains de ceux qui s'aventurèrent trop près examinent maintenant avec horreur d'étranges taches grises sur leur peau."
  lv_blocker_clearance.0042.a:0 "Ils ont glissé entre nos doigts comme de l'eau. Nous devons mieux nous préparer."

  # Stonemen: Critical Failure
  lv_blocker_clearance.0043.t:0 "Touchés par la Pierre Maudite"
  lv_blocker_clearance.0043.desc:0 "Le désastre a frappé avec une violence apocalyptique. Le parti d'avant-garde fut complètement submergé par une horde d'hommes de pierre, et plusieurs braves soldats furent traînés hurlant dans le camp infecté, pour ne plus jamais être revus parmi les vivants. D'autres ont fui en terreur panique, abandonnant armes et honneur, et les hommes de pierre survivants, enhardis par cette victoire, rôdent maintenant dangereusement plus loin qu'avant. La maladie maudite se répand comme un feu de forêt. Les patrouilles terrifiées rapportent des apparitions toujours plus près des établissements humains. L'effort entier a catastrophiquement échoué, et pire encore, ses conséquences mortelles se répandent maintenant vers l'extérieur comme une peste."
  lv_blocker_clearance.0043.a:0 "Nous avons déchaîné l'enfer. La pierre maudite se répand sans aucun contrôle."

  # Stonemen: Success
  lv_blocker_clearance.0044.t:0 "La Malédiction Enfin Contenue"
  lv_blocker_clearance.0044.desc:0 "Par discipline de fer, planification méticuleuse, et résolution sinistre mais nécessaire, le campement maudit a été définitivement et totalement déblayé. Les feux purificateurs ont consumé ce qui ne pouvait être sauvé, et nul infecté ne fut laissé pour errer et répandre la contagion. La zone porte encore les cicatrices profondes de la maladie et du chagrin collectif, mais la menace mortelle est définitivement éliminée. La terre peut enfin guérir maintenant, lentement et prudemment, comme une blessure cautérisée."
  lv_blocker_clearance.0044.a:0 "C'en est fait pour de bon. Que nulle pierre maudite ne demeure debout."

  # Stonemen: Critical Success
  lv_blocker_clearance.0045.t:0 "Fin Rapide, Nette et Miséricordieuse"
  lv_blocker_clearance.0045.desc:0 "L'opération fut rapide comme l'éclair, décisive comme la mort, et miraculeusement nette. Les affligés furent chassés ou miséricordieusement détruits avec une résistance minimale, et même le terrain hostile travailla providentiellement en votre faveur : des canaux naturels les cernèrent parfaitement, et pas un seul homme qui s'aventura dans la zone ne tomba malade. Alors que les cendres finales de la purification refroidissaient, vos éclaireurs découvrirent une crypte royale scellée sous les ruines antiques, longtemps préservée et non profanée. Une relique d'avant la chute du monde, épargnée par son isolation forcée... et maintenant glorieusement en vos mains."
  lv_blocker_clearance.0045.a:0 "Victoire totale et nette, avec un prix royal inattendu sous la cendre !"

  ## Bandit Camps: Challenge Event
  lv_blocker_clearance.0051.t:0 "Briser la Dernière Lame Rebelle"
  lv_blocker_clearance.0051.desc:0 "Le camp principal gît en ruines fumantes, mais le banditisme est une mauvaise herbe tenace qui repousse toujours plus vite qu'on ne l'arrache. Les survivants éparpillés et enragés peuvent se regrouper dans l'ombre, contre-attaquer avec désespoir, ou disparaître dans les collines sauvages pour revenir hanter les routes un autre jour. Pour vraiment et définitivement briser leur emprise sur la région, la terre entière doit être amenée au talon : toutes les routes doivent être resécurisées avec des patrouilles, des défenses permanentes érigées aux points stratégiques, et l'ordre seigneurial restauré avec une main de fer.\n\nCe n'est plus une simple bataille, mais un test décisif de contrôle territorial. Que vous supervisiez personnellement l'opération, ou que vous déléguiez à votre maréchal expérimenté, cet effort final déterminera si la région retombe dans l'anarchie sanglante, ou connaît enfin la paix sous votre autorité."
  lv_blocker_clearance.0051.a:0 "J'écraserai personnellement ces derniers chiens galeux."
  lv_blocker_clearance.0051.b:0 "Mon maréchal les chassera avec l'acier et le feu."
  lv_blocker_clearance.0051.c:0 "Laissez-moi tenter de leur parler. La paix est peut-être encore possible."
  lv_blocker_clearance.0051.d:0 "Mon chancelier tentera de les raisonner une dernière fois."

  # Bandit Camps: Failure
  lv_blocker_clearance.0052.t.martial:0 "L'Assaut S'enlise dans le Sang"
  lv_blocker_clearance.0052.t.diplomacy:0 "Les Pourparlers S'effondrent dans la Violence"
  lv_blocker_clearance.0052.desc.martial:0 "L'attaque frontale rencontra une résistance acharnée et désespérée. Le terrain accidenté favorisa cruellement les bandits : broussailles épaisses comme des murs, sentiers cachés connus d'eux seuls, embuscades mortelles à chaque tournant. Vos forces furent repoussées dans le désordre, ensanglantées et profondément frustrées. Bien qu'un certain terrain fut chèrement gagné, le camp demeure opérationnel, ses bannières noires flottant encore en défiance moqueuse."
  lv_blocker_clearance.0052.desc.diplomacy:0 "Votre envoyé parvint à établir le contact, mais les bandits étaient profondément divisés, paranoïaquement soupçonneux, et absolument peu désireux de parlementer de bonne foi. Les négociations traînèrent interminablement, puis s'aigrirent soudainement, finissant par des menaces de mort et des lames tirées dans la colère. Les hors-la-loi demeurent solidement retranchés, et sont maintenant encore plus méfiants et hostiles envers votre prochain mouvement."
  lv_blocker_clearance.0052.a.martial:0 "Nous nous regroupons avec rage. La prochaine fois, nous les écraserons totalement."
  lv_blocker_clearance.0052.a.diplomacy:0 "Nous avons tenté la voie de la raison. Il nous faut trouver une autre approche."

  # Bandit Camps: Critical Failure
  lv_blocker_clearance.0053.t.martial:0 "Embuscade Mortelle dans les Fourrés"
  lv_blocker_clearance.0053.t.diplomacy:0 "Le Couteau Traître Derrière le Sourire"
  lv_blocker_clearance.0053.desc.martial:0 "C'était un piège parfait, orchestré avec une précision militaire terrifiante. Les bandits avaient anticipé vos moindres mouvements tactiques. Des archers embusqués firent pleuvoir la mort depuis des crêtes parfaitement cachées, et le feu grégeois fut mis à vos précieuses lignes d'approvisionnement. L'attaque s'effondra dans un chaos sanglant, et vos forces d'élite fuirent en déroute complète. Pire encore, des rumeurs humiliantes se répandent maintenant sur votre faiblesse militaire, et davantage de hors-la-loi se rassemblent dans les collines, sentant le sang dans l'eau. Vous n'avez point seulement échoué : vous les avez dangereusement enhardis."
  lv_blocker_clearance.0053.desc.diplomacy:0 "Tout n'était qu'une ruse élaborée et mortelle. Pendant que votre envoyé naïf parlait de paix, d'autres bandits encerclèrent silencieusement le camp, et vos hommes furent sauvagement attaqués sans le moindre avertissement. Un de vos meilleurs agents fut égorgé, un autre a mystérieusement disparu, probablement torturé pour information. Les bandits rirent cruellement alors que vos hommes survivants boitèrent en retraite. Toute bonne volonté est définitivement morte, et les hors-la-loi traitent maintenant toute diplomatie comme de la faiblesse méprisable. L'effort entier est complètement défait."
  lv_blocker_clearance.0053.a.martial:0 "Ils nous attendaient parfaitement préparés. Nous devrons tout recommencer, avec plus de ruse."
  lv_blocker_clearance.0053.a.diplomacy:0 "Nous fûmes des imbéciles de leur faire confiance. Retour à la case départ, dans le sang."

  # Bandit Camps: Success
  lv_blocker_clearance.0054.t.martial:0 "Le Camp Est Définitivement Brisé"
  lv_blocker_clearance.0054.t.diplomacy:0 "Le Camp Se Disperse Pacifiquement"
  lv_blocker_clearance.0054.desc.martial:0 "L'acier trempé et la discipline militaire ont triomphé. Vos soldats aguerris prirent d'assaut le campement fortifié, mettant les bandits en déroute totale et brûlant leurs masures misérables en cendres fumantes. La menace criminelle a été définitivement étouffée dans le sang. Bien que quelques traînards isolés puissent s'être échappés dans les contrées sauvages, la région est enfin en paix, pour l'instant du moins."
  lv_blocker_clearance.0054.desc.diplomacy:0 "Après des jours tendus de négociation délicate et périlleuse, un accord miraculeux fut finalement atteint. Certains bandits acceptèrent vos offres de pardon conditionnel, d'autres prirent l'or offert pour disparaître à jamais. Quelques irréductibles disparurent silencieusement dans les bois profonds, mais le camp lui-même s'est complètement vidé. Il peut encore y avoir des bandits isolés quelque part, mais cette menace particulière, du moins, est passée sans effusion de sang."
  lv_blocker_clearance.0054.a.martial:0 "Que ce massacre soit la fin définitive de leur menace."
  lv_blocker_clearance.0054.a.diplomacy:0 "Une fin sans violence, sans sang versé. Espérons que cette paix perdure."

  # Bandit Camps: Critical Success
  lv_blocker_clearance.0055.t.martial:0 "Victoire Totale et Impitoyable"
  lv_blocker_clearance.0055.t.diplomacy:0 "Les Hors-la-loi Deviennent des Alliés Jurés"
  lv_blocker_clearance.0055.desc.martial:0 "Une campagne militaire absolument parfaite. L'attaque fut rapide comme l'éclair, écrasante comme une avalanche, et ne laissa pas un seul bandit vivant pour avertir d'autres criminels. Parmi le butin sanglant pillé, vos hommes découvrirent un coffre royal soigneusement enterré : les dépouilles complètes d'une caravane noble massacrée il y a des lunes, maintenant vôtre par droit sacré de conquête. Le camp est totalement annihilé, et la cupidité des bandits a ironiquement payé des dividendes royaux inattendus."
  lv_blocker_clearance.0055.desc.diplomacy:0 "Les négociations dépassèrent miraculeusement toutes les attentes les plus optimistes. Non seulement les bandits se dispersèrent pacifiquement, mais plusieurs de leurs chefs les plus redoutables jurèrent solennellement service militaire en échange de votre clémence. En signe de gratitude sincère, ou peut-être d'ambition calculée, ils révélèrent une cache royale secrète : de l'or volé à un percepteur corrompu et enterré profondément dans la périphérie fortifiée du camp. La menace bandit est définitivement éliminée, et vos coffres sont considérablement plus lourds."
  lv_blocker_clearance.0055.a.martial:0 "La terre est sûre et pacifiée, et nous sommes plus riches que jamais."
  lv_blocker_clearance.0055.a.diplomacy:0 "Paix glorieuse et profit substantiel. Une combinaison véritablement rare."

  #Upgrades colony holding to selected holding type
  special_blockers.0001.t:0 "[former_colony_province.GetName] : Transformation Épique du Domaine"
  special_blockers.0001.desc:0 "La colonie modeste de [former_colony_province.GetName] a prospéré au-delà de nos rêves les plus audacieux et ambitieux. Le moment décisif est venu de forger son destin : quel type de domaine légendaire émergera de ces humbles mais prometteurs commencements ?"
  special_blockers.0001.a:0 "Un Grand Château Imprenable"
  special_blockers.0001.b:0 "Une Grande Cité Marchande"
  special_blockers.0001.c:0 "Un Temple Sacré"
  special_blockers.0001.d:0 "Un Fief Tribal"
  special_blockers.0001.e:0 "Un Repaire de Pirates"

 #You find a Dragon Egg when clearing a mine
  special_blockers.0002.t:0 "[valyria_mine_province.GetName] : Découverte Légendaire Sous les Flammes"
  special_blockers.0002.desc:0 "La mine maudite de [valyria_mine_province.GetName] a réclamé d'innombrables vies innocentes, pourtant aujourd'hui elle offre quelque chose d'extraordinaire et d'impossible en retour. Dans les profondeurs d'un puits effondré depuis des siècles, parmi la pierre calcinée par les feux souterrains et les restes squelettiques blanchis de vouivres de feu antiques, les mineurs terrorisés ont découvert un objet d'une beauté surnaturelle et troublante.\n\nParfaitement lisse comme l'onyx le plus pur, veiné de filaments de braise qui luisent d'une lumière intérieure, il pulse faiblement mais distinctement dans l'air étouffant et sulfureux. Chaud au toucher comme une pierre au soleil de midi, presque vivant sous les doigts tremblants. Ce ne peut être rien d'autre qu'un miracle.\n\nUn œuf de dragon authentique.\n\nLe contremaître, tremblant de terreur sacrée et de respect, s'agenouille en me l'offrant avec une révérence mêlée de peur primitive. Mon sang s'accélère et bouillonne dans mes veines comme jamais auparavant."
  special_blockers.0002.a:0 "L'œuf de dragon m'appartient maintenant. Mon destin est scellé."

 #You gain Torment
  special_blockers.0003.t:0 "La Lame Maudite dans les Ténèbres Éternelles"
  #special_blockers.0003.desc:0 "As the final stones are set and the banners once again fly, the Red Wyrm’s Wrath stands reborn. Its dragonstone walls towering once more, unmarred by time, casting long shadows over the land as they did in the reign of King Taurion.\nYet within these halls, the past lingers, not just in echoes, but in whispers that never truly fade.\n\nA sealed chamber is uncovered deep within the great hall, undisturbed since the fall of [GetTitleByKey('k_lokiria').GetNameNoTier]. Inside, amidst dust and forgotten relics, lies a blade made of steel as black as a moonless night, its edge gleaming with an unnatural sharpness.\n\n[newly_created_artifact.GetName], the sword of King Taurin himself, lost to history after The Doom. Even now, its presence is suffused with an eerie weight, as if the blade remembers every battle it has tasted.\n\nThe question remains: will this blade rise once more as a symbol of dominion? Does its return herald an age of bloodshed yet to come?"
  special_blockers.0003.desc:0 "Alors que les pierres finales et monumentales sont posées avec révérence et que les bannières flottent fièrement une fois encore, la Colère du Wyrm Rouge renaît glorieusement de ses cendres. Ses murs titanesques de pierre-dragon défiant les cieux, jetant de longues ombres menaçantes sur la terre comme au temps légendaire du Roi Taurion lui-même.\n\nPourtant à l'intérieur de ces halls majestueux restaurés, le passé ne s'attarde pas seulement en échos : il vit et respire encore. Une chambre scellée depuis des siècles est découverte dans les profondeurs de la grand-salle, non profanée depuis l'apocalypse du [doom|E]. À l'intérieur, la poussière millénaire s'accroche aux reliques royales et aux bannières fanées, mais en son cœur sacré gît infiniment plus que de simples dépouilles oubliées.\n\nReposant sur un trône d'obsidienne, drapé d'un manteau royal maintenant réduit en lambeaux par le temps, se trouve une silhouette royale depuis longtemps réduite en poussière. Près de la silhouette spectrale gît une lame légendaire, forgée d'acier valyrien noir comme une nuit sans lune ni étoiles.\n\n[newly_created_artifact.GetName], l'épée mythique brandie par les souverains divins de [GetTitleByKey('k_lokiria').GetNameNoTier], que tous croyaient perdue à jamais dans les flammes du [doom|E]. Même maintenant, après des siècles de sommeil, elle porte un poids surnaturel et inquiétant, comme si la lame se souvenait de chaque bataille sanglante qu'elle a goûtée, de chaque vie qu'elle a prise.\n\nLa question cruciale demeure : cette lame légendaire se dressera-t-elle comme symbole de domination légitime, ou son retour annonce-t-il un nouvel âge de carnage et de sang ?"
  special_blockers.0003.a:0 "Une lame de roi pour un dirigeant digne de la brandir."
  gain_vs_artifact:0 "Vous obtenez l'[artifact|E] légendaire [newly_created_artifact.GetName]"

 #You gain Mage's Fire
  special_blockers.0004.t:0 "Une Arme Plus Œuvre d'Art Que de Guerre"
  special_blockers.0004.desc:0 "La Tour de Lyria a été magistralement restaurée dans toute sa splendeur antique et mystique. Alors que je parcours les sections nouvellement ouvertes et purifiées de la tour millénaire, je peux sentir les énergies magiques uniques et anciennes couler à travers ces murs sacrés plus intensément que jamais auparavant. C'est comme si quelque chose d'entièrement nouveau et puissant avait été déverrouillé quand la dernière des pierres runiques fut remise en place selon les anciens plans.\n\nJe monte les escaliers en spirale vers ce qu'un de mes ouvriers terrifiés appela une grande bibliothèque interdite. Ils jurèrent que quand les tonnes de gravats furent enlevées et les portes scellées ouvertes, elle se dressait parfaitement intouchée, comme si le [doom|E] cataclysmique n'était jamais survenu en ces lieux sacrés. Passant à travers l'embrasure monumentale, je constate que la salle semble effectivement intouchée par le passage du temps : d'immenses rayonnages de livres anciens s'élevant vers les plafonds voûtés de la pièce, contenant un savoir que le monde croyait perdu à jamais.\n\nQuelque chose directement en face de l'embrasure attire irrésistiblement mon regard. Alors que je traverse la salle silencieuse, je remarque une vitrine de cristal parfait. À l'intérieur repose une rapière d'acier valyrien, son pommeau de saphir bleu poli accentué par une garde multicolore scintillante. Je tends la main pour trouver le loquet, mais avant que je puisse effleurer le verre, la vitrine s'ouvre d'elle-même avec grâce, la porte se balançant lentement dans un silence surnaturel. Alors que je tends la main pour revendiquer [newly_created_artifact.GetName], je sens une énergie magique antique et pure couler à travers tout mon être..."
  special_blockers.0004.a:0 "Vous obtenez l'[artifact|E] magique [newly_created_artifact.GetName]"

#You find a dragon egg amidst the ruins
 special_blockers.0005.t:0 "[blocker_province.GetName] : Miracle Découvert Parmi les Ruines"
 special_blockers.0005.desc:0 "Parmi les décombres millénaires de [blocker_province.GetName], une découverte qui défie l'entendement attendait les braves. Profondément caché sous des tonnes de pierre et de cendre volcanique, un œuf de dragon parfait fut miraculeusement trouvé : relique divine d'un âge révolu, pulsant encore faiblement du pouvoir ancien et terrible des seigneurs dragons."
 special_blockers.0005.a:0 "Un trésor au-delà de tout prix mortel. Mon destin commence aujourd'hui."

#Toasts
 find_gold_cache:0 "Fortune découverte : gain d'[gold|E] important !"
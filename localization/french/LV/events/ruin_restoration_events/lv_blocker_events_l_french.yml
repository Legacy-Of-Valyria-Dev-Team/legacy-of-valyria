 #You find a Dragon Egg when clearing a mine
  special_blockers.0002.t:0 "[valyria_mine_province.GetName] : Une Découverte Sous les Flammes"
  special_blockers.0002.desc:0 "La mine dangereuse de [valyria_mine_province.GetName] a réclamé de nombreuses vies innocentes, pourtant aujourd'hui elle offre quelque chose d'extraordinaire en retour. Profondément dans un puits effondré, parmi la pierre calcinée et les restes squelettiques de vouivres de feu, les mineurs courageux découvrirent un objet absolument extraordinaire.\n\nLisse comme l'onyx le plus fin, veiné de braises rougeoyantes, il pulse faiblement dans l'air torride et suffocant, chaud au toucher, presque vivant. Cela ne peut être rien d'autre qu'une merveille.\n\nUn œuf de dragon authentique.\n\nLe contremaître frissonne de respect et de crainte alors que j'approche, l'offrant avec à la fois vénération et terreur sacrée. Mon sang s'accélère dans mes veines."
  special_blockers.0002.a:0 "L'œuf précieux m'appartient maintenant."

 #You gain Torment
  special_blockers.0003.t:0 "La Lame dans l'Obscurité"
  #special_blockers.0003.desc:0 "As the final stones are set and the banners once again fly, the Red Wyrm’s Wrath stands reborn. Its dragonstone walls towering once more, unmarred by time, casting long shadows over the land as they did in the reign of King Taurion.\nYet within these halls, the past lingers, not just in echoes, but in whispers that never truly fade.\n\nA sealed chamber is uncovered deep within the great hall, undisturbed since the fall of [GetTitleByKey('k_lokiria').GetNameNoTier]. Inside, amidst dust and forgotten relics, lies a blade made of steel as black as a moonless night, its edge gleaming with an unnatural sharpness.\n\n[newly_created_artifact.GetName], the sword of King Taurin himself, lost to history after The Doom. Even now, its presence is suffused with an eerie weight, as if the blade remembers every battle it has tasted.\n\nThe question remains: will this blade rise once more as a symbol of dominion? Does its return herald an age of bloodshed yet to come?"
  special_blockers.0003.desc:0 "Alors que les dernières pierres sont méticuleusement posées et que les bannières glorieuses flottent à nouveau au vent, la Fureur du Wyrm Rouge se dresse fièrement renaissante. Ses tours imposantes de pierre-dragon projetant de longues ombres menaçantes comme elles le faisaient durant le règne légendaire de Taurion.\n\nPourtant dans ces salles restaurées, le passé s'attarde encore comme un fantôme. Une chambre secrète est découverte profondément dans les entrailles de la grande salle, demeurée intacte depuis le terrible [doom|E]. À l'intérieur, la poussière séculaire s'accroche aux reliques anciennes et aux bannières fanées, mais en son cœur gît bien plus que de simples butins oubliés.\n\nReposant majestueusement sur un trône d'ébène, drapée dans un manteau royal maintenant en lambeaux, se trouve une silhouette depuis longtemps réduite en poussière par le temps. À côté de cette silhouette royale gît une lame fabuleuse, faite d'acier noir comme une nuit sans lune ni étoiles.\n\n[newly_created_artifact.GetName], l'épée légendaire tenue par les dirigeants de [GetTitleByKey('k_lokiria').GetNameNoTier], supposée avoir été perdue à jamais dans l'histoire après le terrible [doom|E]. Même maintenant, elle porte un poids sinistre et mystérieux, comme si elle se souvenait parfaitement de chaque bataille qu'elle a goûtée.\n\nLa question demeure, cette lame légendaire s'élèvera-t-elle à nouveau comme symbole de domination absolue, ou son retour providentiel annonce-t-il un âge d'effusion de sang ?"
  special_blockers.0003.a:0 "Une lame de roi pour un dirigeant digne."
  gain_vs_artifact:0 "Vous gagnez l'[artifact|E] précieux [newly_created_artifact.GetName]"

 #You gain Mage's Fire
  special_blockers.0004.t:0 "Une Arme Plus Œuvre d'Art Que de Guerre"
  special_blockers.0004.desc:0 "La Tour majestueuse de Lyria a été entièrement restaurée dans sa gloire d'antan. Alors que je marche à travers les sections nouvellement ouvertes de la tour mystérieuse, je peux sentir les énergies magiques uniques coulant à travers ces murs antiques plus fort que jamais auparavant. C'était comme si quelque chose d'entièrement nouveau et de puissant avait été déverrouillé alors que la dernière des pierres fut soigneusement remise en place.\n\nJe me dirige vers le haut de la tour vers ce qu'un de mes ouvriers appela avec émerveillement une grande bibliothèque, ils dirent que quand les gravats furent patiemment enlevés et les portes antiques ouvertes elle se tenait miraculeusement intacte, comme si le terrible [doom|E] n'y était jamais survenu. Passant par l'embrasure ornée je peux voir que la pièce semblait effectivement intacte du passage destructeur du temps, des étagères innombrables de livres précieux s'élevant loin vers les plafonds voûtés de la pièce, contenant une connaissance probablement crue perdue à jamais dans le temps.\n\nQuelque chose directement en face de l'embrasure attira immédiatement mon attention. Alors que je traversais respectueusement la pièce je remarquai qu'il se dressait une vitrine de cristal, dans le verre était une rapière d'Acier Valyrien authentique, son pommeau bleu poli accentué par la garde multicolore. Je tends la main pour trouver le loquet pour ouvrir la vitrine mais avant que je puisse même la toucher la vitrine s'ouvrit d'elle-même comme par magie, la porte se balançant lentement d'un côté. Alors que je tends la main pour réclamer [newly_created_artifact.GetName] je peux sentir une énergie magique puissante coulant à travers tout mon être..."
  special_blockers.0004.a:0 "Vous gagnez l'[artifact|E] légendaire [newly_created_artifact.GetName]"


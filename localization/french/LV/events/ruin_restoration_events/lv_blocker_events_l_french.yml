 lv_blocker_clearance.0001.t.noxious_gases:0 "Cendres, Puis Silence"
 lv_blocker_clearance.0001.t.stonemen:0 "Cendres Où Ils Vivaient"
 lv_blocker_clearance.0001.t.bandit_camps:0 "Des Lames dans les Fourrés"
 lv_blocker_clearance.0001.t.small_ruined_holding:0 "Pierre, Toujours Debout"
 lv_blocker_clearance.0001.t.medium_ruined_holding:0 "De la Poussière, une Fondation"
 lv_blocker_clearance.0001.t.large_ruined_holding:0 "L'Héritage Réveillé"

 # Titles - Treasure
 lv_blocker_clearance.0001.t.unexplored_caves.reward:0 "Lueurs dans les Profondeurs"
 lv_blocker_clearance.0001.t.swamp.reward:0 "La Richesse Oubliée du Bourbier"
 lv_blocker_clearance.0001.t.floods.reward:0 "Ce que l'Inondation a Oublié"
 lv_blocker_clearance.0001.t.noxious_gases.reward:0 "Des Richesses dans les Cendres"
 lv_blocker_clearance.0001.t.stonemen.reward:0 "Le Trésor des Hommes de Pierre"
 lv_blocker_clearance.0001.t.bandit_camps.reward:0 "Le Butin des Bandits"
 lv_blocker_clearance.0001.t.small_ruined_holding.reward:0 "Un Butin Parmi les Pierres"
 lv_blocker_clearance.0001.t.medium_ruined_holding.reward:0 "Des Richesses Sous les Ruines"
 lv_blocker_clearance.0001.t.large_ruined_holding.reward:0 "La Fortune des Lords Oubliés"

 # Descriptions
 lv_blocker_clearance.0001.desc.unexplored_caves:0 "Après de longues semaines sous terre, les derniers porteurs de torches sont enfin revenus.\n\nLes tunnels ont été cartographiés, les dangers signalés, et l'inconnu enfin porté à la lumière. Dans les profondeurs de [blocker_province.GetName] ne régnaient jadis que ténèbres et effroi. Désormais, on y trouve des cartes, des campements, et les prémices de routes.\n\nCes grottes ne sont plus le repaire de murmures et d'ossements brisés. Les cavernes sont domptées : conquises par ceux qui ont eu la volonté de s'y aventurer.\n\n"
 lv_blocker_clearance.0001.desc.swamp:0 "Ce qui n'était jadis qu'un bourbier de pourriture et de ruine est désormais praticable. Le marécage, longtemps refuge d'insectes piqueurs, de pieds engloutis et de disparitions chuchotées, a été asséché et dompté — si tant est qu'une telle chose soit possible. Des chemins surélevés serpentent désormais à travers un sol jadis trop périlleux pour y poser le pied, et le brouillard étouffant s'est dissipé à mesure que tombaient les arbres et que se retournait la pierre. Ce n'est plus un lieu de mort et de décomposition, mais un lieu d'ordre chèrement acquis. Une fondation nouvelle, taillée dans la vase et la folie.\n\n"
 lv_blocker_clearance.0001.desc.floods:0 "Les eaux se sont enfin retirées. Ce qui gisait autrefois englouti sous des flots tourbillonnants et une terre détrempée est désormais révélé — routes ravagées, murs brisés et champs gorgés d'eau, certes, mais aussi une terre sèche et la chance de reconstruire. Digues et canaux de drainage ont été creusés, des talus élevés, et la pierre posée là où régnait naguère la boue. C'est encore une contrée humide, mais elle n'est plus impuissante. Le déluge a été repoussé, ne serait-ce que pour un temps.\n\n"
 lv_blocker_clearance.0001.desc.noxious_gases:0 "L'air s'est enfin éclairci. Jadis, ici, dans [blocker_province.GetName], l'air pesait, lourd de mort : fumées suffocantes et brume âcre. Il commence désormais à se dissiper.\n\nDes conduits d'aération ont été creusés, les cendres balayées, et la terre laissée le temps de respirer. La puanteur du soufre s'attarde encore, bien qu'elle ne soit plus mortelle.\n\nLa montagne fume toujours au loin, avertissement silencieux, mais son poison n'étreint plus la terre. Le pire est passé... pour l'instant.\n\n"
 lv_blocker_clearance.0001.desc.stonemen:0 "C'est chose faite. Les hommes de pierre ont disparu — chassés, passés au fil de l'épée, ou laissés à glisser en silence sous les eaux noires du fleuve. Il ne leur restait ni espoir, ni remède, ni avenir. Déformés par la grisécaille, à demi fous de douleur et de faim, ils étaient devenus un danger pour quiconque s'approchait. Pourtant, ce ne fut pas chose aisée. Certains se souvenaient de leur nom. D'autres imploraient la mort dans une langue trop brisée pour être comprise. Aujourd'hui, seul le silence s'attarde là où ils se terraient jadis. La terre est plus sûre. Mais quelque chose de plus froid a pris racine dans l'air.\n\n"
 lv_blocker_clearance.0001.desc.bandit_camps:0 "Le camp a été anéanti. Tentes arrachées, feux étouffés, sang mêlé à la terre. Les bandits se sont battus tels les hommes désespérés qu'ils étaient — hâves, brutaux, sans la moindre illusion de merci. Mais vos hommes ont tenu bon. Les rares hors-la-loi survivants ont fui dans les terres sauvages, dispersés et blessés. Pour l'heure, les routes sont plus paisibles, et le peuple peut respirer un peu plus librement. Justice — rude, sanglante et trop longtemps différée — a été rendue.\n\n"
 lv_blocker_clearance.0001.desc.small_ruined_holding:0 "Pierre et silence : voilà tout ce qui restait à votre arrivée. Aujourd'hui, la végétation a été taillée, les murs brisés examinés, et les derniers dangers écartés. Ce qui n'était qu'une coquille vide de possession se dresse désormais, prête à servir de nouveau. Il reste encore fort à faire, mais ses fondations sont solides. Que ce lieu ait été oublié des lords ou abandonné au temps, il ne sera plus jamais perdu.\n\n"
 lv_blocker_clearance.0001.desc.medium_ruined_holding:0 "Il aura fallu du temps — et du sang — mais la ruine se dresse désormais dégagée. Les tours croulantes ont été inspectées, les halls instables étayés, et les derniers dangers qui s'y attardaient ont été chassés ou définitivement ensevelis. Jadis coquille vide d'un dessein perdu, la possession se tient prête à servir de nouveau. Elle ne retrouvera peut-être jamais toute sa gloire passée, mais la terre a été reconquise, et les vieilles pierres s'élèvent avec une intention nouvelle.\n\n"
 lv_blocker_clearance.0001.desc.large_ruined_holding:0 "La ruine se dressait, vaste et silencieuse, imprégnée d'une mémoire plus ancienne que toute carte. Ses murs, brisés mais toujours farouches, portaient les cicatrices de la conquête, du feu et du temps lui-même. Pourtant, même ces pierres ont pu être domptées. Après un long labeur et des efforts minutieux, le site est désormais sécurisé — ses arches croulantes stabilisées, ses profondeurs oubliées purgées de tout danger. Bien que les fantômes d'empires déchus semblent encore murmurer à travers ces halls érodés par le vent, la ruine n'est plus abandonnée. Un nouveau chapitre s'ouvre sur ces vieux ossements.\n\n"

 lv_blocker_clearance.0001.desc.unexplored_caves.dragon_egg:0 "Pourtant, dans les profondeurs de ces grottes, une découverte attend. Parmi les gravats et la poussière repose un œuf de [dragon|E], sa coquille scintillant faiblement dans la pénombre. Relique d'un âge révolu, il recèle en son sein la promesse d'une renaissance et d'une puissance à venir."
 lv_blocker_clearance.0001.desc.swamp.dragon_egg:0 "Parmi la vase et la pierre, enfoui sous des racines plus anciennes que la mémoire, quelque chose fut découvert — lisse comme une pierre de rivière, mais chaud au toucher. Un œuf de [dragon|E], à en croire les murmures. De vieilles légendes fragmentaires racontent que de telles reliques furent abandonnées à l'époque de [valyria|E], perdues dans les flammes ou englouties par la terre. Qu'un tel objet refasse surface ici, au cœur d'un marécage oublié, est un récit que peu croiront. Mais ceux qui l'ont vu le savent : le monde vient de basculer."
 lv_blocker_clearance.0001.desc.floods.dragon_egg:0 "Parmi la vase et les débris laissés par l'inondation, quelque chose de totalement inattendu fut mis au jour : lisse, écailleux, et légèrement tiède. Un œuf de [dragon|E]. Perdu lors de quelque ancien cataclysme, ou enfoui à la hâte lors de la chute des [old_valyria|E], nul ne saurait le dire. Mais les récits sont clairs — de tels objets ne sont pas de simples reliques. Ils sont promesse, et péril."
 lv_blocker_clearance.0001.desc.noxious_gases.dragon_egg:0 "Dans le bassin craquelé d'un ravin calciné, enfoui sous des couches de cendre refroidie et de roche volcanique, quelque chose d'étrange fut exhumé — un œuf, sombre et veiné, palpitant faiblement de chaleur. Un œuf de [dragon|E], de toute évidence. Comment il en vint à reposer là, nul ne saurait le dire, mais à l'ombre des montagnes de feu, de telles reliques ne sauraient être si aisément reléguées au rang de mythe. Le sang de l'ancien monde s'agite à nouveau."
 lv_blocker_clearance.0001.desc.stonemen.dragon_egg:0 "Au cœur du camp des hommes de pierre, où cendre et pierre se mêlaient, une étrange relique fut mise au jour. Un œuf, sombre et veiné, palpitant faiblement de chaleur. Un œuf de [dragon|E], peut-être abandonné par un lord en fuite ou enfoui à la hâte lors de la chute de [valyria|E]. Sa présence en ces lieux n'est pas un hasard. Un vestige de feu, endormi sous la cendre."
 lv_blocker_clearance.0001.desc.bandit_camps.dragon_egg:0 "Sous la pierre de foyer effondrée du vieux grand hall, vos hommes ont mis au jour quelque chose d'étrange — ovale, semblable à de la pierre, et légèrement chaud au toucher. Un œuf de [dragon|E]. Peut-être abandonné par un noble valyrien en fuite, ou enfoui en secret durant le Fléau. Quelle que soit son origine, sa présence en ces lieux n'est pas un hasard. Un vestige de feu, endormi sous la cendre."
 lv_blocker_clearance.0001.desc.small_ruined_holding.dragon_egg:0 "Dans les ruines de ce qui put jadis être un caveau ou un sanctuaire, enfouie sous des gravats calcinés et des blasons usés par le temps, une étrange relique fut mise au jour : lisse, ovale, et palpitant faiblement de chaleur. Un œuf de [dragon|E], bien que nul ne sût dire son âge, ni pourquoi il gisait ainsi caché. Relique d'une lignée oubliée — ou de quelque chose de plus ancien encore. La ruine recelait plus que de la pierre."
 lv_blocker_clearance.0001.desc.medium_ruined_holding.dragon_egg:0 "Dans les profondeurs du vieux donjon, derrière des murs que l'on croyait depuis longtemps effondrés, une étrange relique fut découverte — un œuf, sombre et veiné, palpitant faiblement de chaleur. Un œuf de [dragon|E], peut-être abandonné par un lord en fuite ou enfoui à la hâte lors de la chute de [valyria|E]. Sa présence en ces lieux n'est pas un hasard. Un vestige de feu, endormi sous la cendre."
 lv_blocker_clearance.0001.desc.large_ruined_holding.dragon_egg:0 "Loin sous les flèches croulantes, vos hommes ont mis au jour une chambre que le soleil n'avait jamais touchée. À l'intérieur, entouré de pierre calcinée et de glyphes effacés, reposait un unique œuf — luisant, veiné, et chaud au toucher. Qu'il ait été abandonné à la hâte ou scellé à dessein, il a survécu à la chute d'empires et au silence des siècles. Il est désormais vôtre. Une relique des [dragons_plural|E], endormie dans l'obscurité."

 lv_blocker_clearance.0001.desc.unexplored_caves.gold_high:0 "Les cavernes, jadis lieu de ténèbres et d'effroi, ont livré leurs secrets. Lorsque les derniers porteurs de torches sont revenus, ils rapportèrent avec eux non seulement des récits de dangers, mais aussi des trésors au-delà de toute imagination. Or et gemmes, dissimulés même aux regards des [dragonlords|El], reposent désormais à la lumière du jour. Une juste récompense pour avoir purgé ces profondeurs."
 lv_blocker_clearance.0001.desc.swamp.gold_high:0 "Le travail ne devait consister qu'à assécher la terre et élever des chemins fermes — mais la fortune n'en fait qu'à sa tête. Sous un autel de pierre effondré, au plus profond du bourbier, les creuseurs ont trouvé de l'or. Des coffres scellés de fer rouillé, des pièces frappées de vieux visages valyriens, et des ornements perdus sous des siècles de pourriture et de racines. Nul ne saurait dire comment un tel trésor en vint à être enfoui en ce lieu — certains murmurent des Lords dragons en fuite, d'autres des bandits qui ne réchappèrent jamais de leur propre piège. Quelle qu'en soit l'origine, le trésor est bien réel. Et désormais, il est vôtre."
 lv_blocker_clearance.0001.desc.floods.gold_high:0 "En se retirant, les eaux de crue laissèrent bien plus que du limon et des ruines derrière elles. Niché dans une cave dévastée, à demi enseveli sous des pierres effondrées, un vaste trésor fut mis au jour — des pièces d'or par centaines, des bijoux finement ouvragés, et des artefacts d'une facture oubliée. Une fortune, quelle que soit la mesure employée. De quoi reconstruire, s'étendre, ou attiser l'envie de lords lointains."
 lv_blocker_clearance.0001.desc.noxious_gases.gold_high:0 "Parmi les ruines noircies et la pierre calcinée, un caveau fut découvert — ses serrures déformées par la chaleur, mais intactes. À l'intérieur, l'or brillait, terni ni par les cendres ni par le temps. Pièces, lingots et ornements, plus que la plupart des lords ne pourraient en réclamer, épargnés par les flammes mais dissimulés depuis des générations. Amassé par des Lords dragons ou enfoui à la hâte avant la colère de la montagne, il vous appartient désormais."
 lv_blocker_clearance.0001.desc.stonemen.gold_high:0 "Au cœur du camp des hommes de pierre, où cendre et pierre se mêlaient, une cache dissimulée fut mise au jour. Des pièces d'or, ternies mais intactes, et des reliques d'un savoir-faire depuis longtemps oublié. Peut-être abandonnées par un lord en fuite, ou enfouies à la hâte lors de la chute de [valyria|E]. Quelle qu'en soit l'origine, c'est un trésor qui mérite d'être revendiqué — une récompense pour ceux qui ont osé affronter la malédiction."
 lv_blocker_clearance.0001.desc.bandit_camps.gold_high:0 "Alors que vos hommes forçaient le caveau dissimulé sous le camp des bandits, l'éclat de l'or inonda la chambre — des coffres débordant de pièces volées, de babioles dorées et de riches étoffes marchandes. Mais la célébration vint trop tôt. Des pas résonnent dans la pénombre. Depuis la lisière des arbres, des ombres se rassemblent — des bandits pas encore abattus, poussés par le désespoir et la vengeance. L'or est à portée de main, mais un dernier combat reste à mener, et il sera féroce."
 lv_blocker_clearance.0001.desc.small_ruined_holding.gold_high:0 "Dissimulé dans une cave scellée, derrière des murs à demi effondrés par le temps, reposait un caveau oublié. À l'intérieur : des pièces par coffres entiers, de l'or ancien portant des blasons effacés par la poussière, et des reliques d'une valeur depuis longtemps effacée de la mémoire. Peut-être le trésor d'une maison perdue à la guerre ou à l'exil. Il est désormais vôtre — un trésor assez considérable pour remodeler vos projets comme pour régler vos dettes."
 lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_high:0 "Les niveaux inférieurs de la ruine, que l'on croyait effondrés, dissimulaient bien plus que de la poussière. Des chambres cachées derrière de faux murs révélèrent une fortune — des pièces marquées de maisons éteintes depuis longtemps, des gobelets d'argent, et des reliques familiales n'ayant pas vu la lumière depuis des décennies. Le caveau fut probablement scellé à la hâte, abandonné dans la guerre ou l'exil. Sa redécouverte constitue aujourd'hui une récompense, non seulement pour la persévérance, mais pour la survie."
 lv_blocker_clearance.0001.desc.large_ruined_holding.gold_high:0 "Sous la place centrale, scellée par une pierre trop épaisse pour être percée sans des mois de labeur, un antique trésor se révéla. Des pièces plus anciennes que la Foi, des couronnes d'empires depuis longtemps éteints, et des statues dorées sculptées dans des styles que nul n'avait vus depuis des générations. C'est une fortune, non seulement par son poids, mais par son émerveillement — un vestige tangible du monde qui fut. Un trésor à faire rivaliser les plus grands amas des Lords dragons, désormais vôtre à revendiquer."

 lv_blocker_clearance.0001.desc.unexplored_caves.gold_low:0 "Les cavernes recelaient plus que de simples ombres. Parmi les passages sinueux, un modeste trésor fut mis au jour — des pièces ternies par le temps, et quelques gemmes éparses nichées dans la pierre ancienne. Pas de quoi éveiller l'envie d'un roi, mais assez pour scintiller de promesses. Un prix digne de ceux assez audacieux pour braver les profondeurs."
 lv_blocker_clearance.0001.desc.swamp.gold_low:0 "Dans la clairière de vase et de bourbe, quelque chose scintillait sous les racines. Un modeste trésor — nulle rançon de roi, mais assez pour couper le souffle. Des pièces éparses, un gobelet terni, les vestiges d'une richesse jadis cachée ou oubliée. Peut-être le butin d'un lord en fuite, ou l'ultime tribut d'une caravane condamnée. Quelle que soit son histoire, l'or est bien réel, et il garnit désormais vos coffres — une discrète récompense pour un labeur rude et éprouvant."
 lv_blocker_clearance.0001.desc.floods.gold_low:0 "Ce n'était pas grand-chose, du moins au premier regard — une bourse de vieilles pièces coincée dans les poutres d'un entrepôt effondré, quelques lingots épars cachés sous des pierres tombées. C'est néanmoins une découverte bienvenue. Aussi modeste soit-elle, elle suffit à raffermir des mains incertaines et à financer les premiers pas du relèvement."
 lv_blocker_clearance.0001.desc.noxious_gases.gold_low:0 "Toutes les richesses ne sont pas grandioses. Nichée sous une roche effondrée et des débris calcinés, une modeste trouvaille vit le jour — quelques pièces fondues ensemble, un coffre roussi à moitié consumé par le feu. Il en restait néanmoins assez pour compter. Une aubaine discrète, tirée des cendres de ce qui avait failli être perdu."
 lv_blocker_clearance.0001.desc.stonemen.gold_low:0 "Parmi les ruines du camp des hommes de pierre, une petite cache fut découverte — des pièces, ternies mais intactes, et quelques babioles ayant survécu à la décrépitude. Ce n'est pas une fortune, mais c'est assez pour rappeler à ceux qui restent que même dans les lieux les plus sombres, l'espoir peut se trouver. Une modeste récompense pour une tâche macabre."
 lv_blocker_clearance.0001.desc.bandit_camps.gold_low:0 "Sous une latte de plancher pourrie, vos hommes ont découvert une petite cache de butin — des pièces éparses, un anneau d'argent, un gobelet cabossé par les voyages. Assez pour compter, mais pas de quoi pavoiser. Alors qu'ils commençaient à rassembler le butin, un mouvement s'agita dans les fourrés. Les derniers bandits, hâves et hurlants, déferlent dans une ultime et sauvage tentative de reprendre leur bien. Un dernier affrontement se profile."
 lv_blocker_clearance.0001.desc.small_ruined_holding.gold_low:0 "Parmi les vestiges brisés de la chambre d'un intendant, vos hommes ont découvert une modeste cache — des bourses de pièces, quelques anneaux, et des outils d'un artisanat ancien dissimulés sous les lattes du plancher. Assez pour mériter le nom de récompense, sinon d'aubaine. Il semble que même les ruines les plus humbles s'accrochent encore à leur passé."
 lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_low:0 "Parmi les décombres d'un vieux solier, vos hommes ont découvert un petit coffret scellé — ses charnières de fer rouillées, mais son contenu intact. Modeste, mais significatif : des pièces, quelques bijoux, et un registre étroit trop effacé pour être lu. Peut-être les derniers biens d'un châtelain jamais revenu. Quelle que soit l'histoire, sa valeur perdure."
 lv_blocker_clearance.0001.desc.large_ruined_holding.gold_low:0 "Derrière un mur effondré, dans ce qui put jadis être le domaine d'un noble, vos hommes ont découvert une cache scellée depuis longtemps : une modeste collection de bijoux, de vieilles pièces, et d'objets cérémoniels vraisemblablement dissimulés dans le chaos de la chute. Bien qu'humble face à la grandeur de la ruine elle-même, c'est un précieux fragment du passé — et la preuve que même les plus grandes cités furent l'œuvre de mains humaines."

 #Options
 lv_blocker_clearance.0001.a:0 "Excellent !"

 ## Swamp: Challenge Event
 lv_blocker_clearance.0011.t:0 "Dompter le Marais"
 lv_blocker_clearance.0011.desc:0 "Le marécage a été asséché, son terrain sauvage partiellement maîtrisé — mais un dernier effort reste nécessaire pour reconquérir pleinement la terre. Les talus doivent être renforcés, les canaux redirigés, et de nouvelles fondations posées avec soin. Un seul faux pas pourrait voir le bourbier revenir, engloutissant des mois d'efforts.\n\nLe peuple se tourne vers vous — ou vers votre intendant — pour obtenir des directives. Si cette dernière phase est bien menée, le marécage sera conquis. Sinon, les eaux pourraient monter à nouveau."
 lv_blocker_clearance.0011.a:0 "Je superviserai moi-même la phase finale."
 lv_blocker_clearance.0011.b:0 "Laissez mon intendant gérer les détails."

 # Swamp: Failure
 lv_blocker_clearance.0012.t:0 "Des Efforts Engloutis"
 lv_blocker_clearance.0012.desc:0 "Malgré les efforts acharnés de votre équipe, le marécage résiste à toute tentative de domestication. Les fondations glissent, des ouvriers disparaissent dans la vase, et les plateformes construites à la hâte pourrissent en quelques jours. La terre reprend le peu qui avait été gagné, et les progrès s'enlisent de nouveau dans le bourbier. Ce n'est pas un échec total — mais on n'en est pas loin."
 lv_blocker_clearance.0012.a:0 "Le marécage est plus tenace que nous ne le pensions. Nous réessaierons."

 # Swamp: Critical Failure
 lv_blocker_clearance.0013.t:0 "Englouti par le Bourbier"
 lv_blocker_clearance.0013.desc:0 "Tout s'est effondré. Des structures entières ont disparu sous la fange, et un canal de drainage mal calculé a inondé un terrain vital. Les équipes se sont dispersées, les outils ont été perdus, et le marécage s'est épaissi à chaque faux pas. Tout ce qui avait été accompli est désormais annulé — la terre est redevenue un marasme périlleux et engloutissant. Il vous faudra tout reprendre depuis le début."
 lv_blocker_clearance.0013.a:0 "Tout a disparu. Le marécage a dévoré notre travail."

 # Swamp: Success
 lv_blocker_clearance.0014.t:0 "Un Sol Ferme, Enfin"
 lv_blocker_clearance.0014.desc:0 "Grâce à des mains fermes et une planification minutieuse, le marécage a été maîtrisé. Des canaux ont été creusés, les étais renforcés, et une terre sèche commence à se former là où il n'y avait jadis que boue et décomposition. Il faudra du temps pour y bâtir — mais pour l'heure, le danger est écarté. Le bourbier est devenu praticable."
 lv_blocker_clearance.0014.a:0 "Ce fut chèrement acquis, mais la terre est désormais nôtre."

 # Swamp: Critical Success
 lv_blocker_clearance.0015.t:0 "Le Marais Transformé"
 lv_blocker_clearance.0015.desc:0 "Un coup de maître. La phase finale de l'entreprise s'est déroulée à la perfection — aucun faux pas, aucun revers. La terre a séché plus vite que prévu, révélant un sol stable et même les vestiges de structures depuis longtemps perdues sous la boue. Parmi les pieux pourris et la pierre engloutie, quelque chose a scintillé — un coffre scellé, intact malgré le temps, enfin libéré de l'emprise du marécage."
 lv_blocker_clearance.0015.a:0 "Le marécage est purgé — et le bourbier nous a offert quelque chose en retour."

 ## Floods: Challenge Event
 lv_blocker_clearance.0021.t:0 "Le Bourbier Cède"
 lv_blocker_clearance.0021.desc:0 "Les eaux de crue se sont pour l'essentiel retirées, laissant derrière elles un sol détrempé et les fragiles prémices d'un relèvement. Pourtant, à moins que les rivières ne soient domptées et la terre correctement drainée, tous ces progrès pourraient être perdus. Des fossés doivent être creusés, les digues renforcées, et le peuple guidé avec détermination — avant que la prochaine pluie ne réduise tout à néant.\n\nCe travail exige une main ferme et un esprit lucide. Que ce soit par votre commandement ou celui de votre intendant, ce dernier effort décidera si la terre est reconquise — ou de nouveau engloutie."
 lv_blocker_clearance.0021.a:0 "Je repousserai moi-même les inondations."
 lv_blocker_clearance.0021.b:0 "Mon intendant achèvera ce qui a été entrepris."

 # Floods: Failure
 lv_blocker_clearance.0022.t:0 "Les Eaux Montent de Nouveau"
 lv_blocker_clearance.0022.desc:0 "Les efforts pour détourner les eaux de crue ont échoué. Les digues de fortune ont cédé sous la pression, et les plans de drainage se sont révélés insuffisants. Bien que quelques progrès aient été accomplis, il est désormais clair que les inondations ont repris leur lente avancée, annulant les avancées récentes. Les champs sont de nouveau engloutis, et les esprits sombrent avec eux."
 lv_blocker_clearance.0022.a:0 "Nous avons sous-estimé les eaux. Nous réessaierons, mieux préparés."

 # Floods: Critical Failure
 lv_blocker_clearance.0023.t:0 "Emporté par les Flots"
 lv_blocker_clearance.0023.desc:0 "Un effondrement total. Les pluies sont revenues avec violence, et les défenses anti-crue se sont écroulées dans le chaos. Les canaux ont débordé, des ponts se sont effondrés, et des sections entières de terre reconquise ont été perdues. Le terrain est de nouveau étouffé par le limon et l'eau, et tous les gains accomplis ont été emportés. La terre a repris ce qu'on lui avait pris — il faut à présent tout recommencer."
 lv_blocker_clearance.0023.a:0 "Ce fut un désastre... Il nous faudra tout reprendre depuis le début."

 # Floods: Success
 lv_blocker_clearance.0024.t:0 "Les Eaux Se Retirent"
 lv_blocker_clearance.0024.desc:0 "Après un labeur infatigable, les dernières eaux de crue ont été repoussées. Les digues tiennent bon, les cours détournés retrouvent leur voie, et le sol détrempé commence à sécher sous le soleil de retour. Il reste beaucoup à reconstruire, mais le danger est passé, et la terre est de nouveau vôtre."
 lv_blocker_clearance.0024.a:0 "Enfin, les inondations sont derrière nous."

 # Floods: Critical Success
 lv_blocker_clearance.0025.t:0 "Dompter les Eaux"
 lv_blocker_clearance.0025.desc:0 "Non seulement l'inondation fut-elle contenue — elle fut maîtrisée. Une redirection brillante des eaux, un labeur rapide et une planification avisée n'ont pas seulement asséché la terre, mais l'ont remodelée. D'anciens marais sont désormais de fertiles plaines basses. Et dans le lit du fleuve mis à nu, quelque chose d'ancien fut mis au jour — un trésor enfoui et oublié, désormais révélé par les eaux en retrait."
 lv_blocker_clearance.0025.a:0 "Les eaux se retirent — et laissent derrière elles un présent."

 ## Noxious Gases: Challenge Event
 lv_blocker_clearance.0031.t:0 "Sceller les Vapeurs"
 lv_blocker_clearance.0031.desc:0 "Le pire des fumées s'est dissipé, mais la terre n'est pas encore sûre. Des gaz toxiques s'élèvent encore des évents profonds ou s'accrochent aux terrains bas, invisibles et mortels. Le confinement final doit être mené avec précision — détournant les flux, scellant les fissures, et peut-être bâtissant des conduits pour disperser ce qui persiste.\n\nUn seul mauvais calcul pourrait tout relâcher de nouveau. Vous pouvez superviser cet effort vous-même, ou en confier la tâche à votre intendant. Quoi qu'il en soit, c'est l'ultime barrière entre la ruine et le renouveau."
 lv_blocker_clearance.0031.a:0 "Je gérerai cela personnellement. Il faut que ce soit fait dans les règles."
 lv_blocker_clearance.0031.b:0 "Je confierai le confinement à mon intendant."

 # Noxious Gases: Failure
 lv_blocker_clearance.0032.t:0 "Les Vapeurs Montent de Nouveau"
 lv_blocker_clearance.0032.desc:0 "Le travail visant à sceller les derniers évents nocifs a échoué. Que ce soit par mauvais jugement, par des barrières mal alignées, ou simplement par la nature instable de la terre elle-même, les gaz ont recommencé à s'élever. Des ouvriers malades vacillent hors de la brume, et la puanteur s'accroche à l'air comme une malédiction.\n\nLes progrès ont été annulés, et la zone redevient dangereuse. Bien que ce ne soit pas un effondrement total, le revers est manifeste — et coûteux.\n\n"
 lv_blocker_clearance.0032.desc.illness.self:0 "Alors que les fumées s'épaississaient à nouveau, vous fûtes pris au cœur du pire. Le goût du métal s'accroche à votre bouche, et vos poumons semblent calcinés. Des jours ont passé, et pourtant le mal persiste — un rappel cruel de la proximité du danger."
 lv_blocker_clearance.0032.desc.illness.councillor:0 "Dans le chaos de l'entreprise avortée, votre intendant a essuyé le plus gros de l'exposition. Il/Elle repose désormais alité(e), la peau moite et le souffle court, son rétablissement incertain. Le danger demeure — et voilà qu'un des vôtres en paie le prix."
 lv_blocker_clearance.0032.a:0 "Nous avons mal calculé. Nous réessaierons — avec plus de prudence, cette fois."

 # Noxious Gases: Critical Failure
 lv_blocker_clearance.0033.t:0 "Étouffés par Nos Ambitions"
 lv_blocker_clearance.0033.desc:0 "Désastre. Ce qui devait être l'ultime effort de confinement a tourné à la catastrophe. Une fissure scellée s'est ouverte dans un grondement, inondant la zone de fumées suffocantes. Des ouvriers se sont effondrés sur place. Le bétail a péri. Même le vent lui-même semblait trahir, portant le poison plus loin qu'auparavant.\n\nTout ce qui avait été gagné a désormais disparu. La terre repose de nouveau étouffée sous un gaz épais et asphyxiant. La purger de nouveau exigera du temps, de la prudence — et une bonne dose de chance."
 lv_blocker_clearance.0033.a:0 "Nous avons échoué, totalement..."

 # Noxious Gases: Success
 lv_blocker_clearance.0034.t:0 "L'Air S'éclaircit"
 lv_blocker_clearance.0034.desc:0 "Les derniers efforts ont porté leurs fruits. Les fissures ont été scellées, les évents détournés, et les dernières traces de fumées suffocantes se sont dissipées. L'air, jadis épais de poison, porte désormais le parfum pur du grand vent et de la pluie lointaine. Les cultures peuvent croître, le bétail peut revenir — et le peuple ose de nouveau respirer profondément.\n\nPar la diligence, la planification et un labeur considérable, la terre a été reconquise sur ce tueur invisible. Le danger est écarté. Pour l'heure, du moins.\n\n"
 lv_blocker_clearance.0034.desc.illness.self:0 "Pourtant, toutes les victoires n'ont pas un prix nul. Vous êtes sorti(e) victorieux(se) de l'opération, mais le temps passé près des vapeurs fétides a laissé sa marque. Une toux qui ne veut pas tout à fait disparaître. Des vertiges qui persistent plus longtemps qu'ils ne le devraient. La terre est sûre... mais vous n'êtes pas indemne."
 lv_blocker_clearance.0034.desc.illness.councillor:0 "Bien que l'opération se soit soldée par un succès, votre intendant n'en a pas réchappé indemne. L'exposition aux fumées l'a laissé(e) pâle et chancelant(e), sa voix plus faible qu'avant. Il/Elle insiste sur le fait qu'il/elle se rétablira avec le temps — mais son sacrifice ne sera pas oublié."
 lv_blocker_clearance.0034.a:0 "L'air est enfin clair."

 # Noxious Gases: Critical Success
 lv_blocker_clearance.0035.t:0 "Une Aubaine dans les Brumes"
 lv_blocker_clearance.0035.desc:0 "La phase finale s'est déroulée plus aisément que même les plus audacieux n'avaient osé l'espérer. Les évents furent scellés sans incident, l'air s'éclaircit en un temps record, et la terre sembla exhaler un soupir de soulagement. Pourtant, la fortune réservait plus qu'un air pur. En arpentant les lieux une dernière fois, vos ouvriers mirent au jour quelque chose de longtemps dissimulé sous la terre empoisonnée — un antique caveau, scellé et oublié, préservé par les fumées mêmes qui avaient jadis rendu ce lieu mortel.\n\nLe danger est écarté, et à sa place... une aubaine attend."
 lv_blocker_clearance.0035.a:0 "L'air s'éclaircit — et révèle des richesses enfouies dans la brume."

 # Noxious Gases: Plague Outbreak!
 lv_blocker_clearance.0036.t:0 "Le Prix de la Purification"
 lv_blocker_clearance.0036.desc:0 "Enfin, les fumées suffocantes qui étouffaient [blocker_province.GetName] se sont dissipées.\n\nLes évents empoisonnés reposent silencieux, et un air frais agite de nouveau les herbes de [blocker_province.GetName]. Ceux qui sont restés pour voir l'œuvre achevée rendent grâce que la terre puisse enfin être reconquise.\n\nMais ce triomphe fut de courte durée.\n\nAvant même que le dernier campement ne soit levé, des ouvriers commencent à tomber malades. La fièvre se répand rapidement à travers les équipes de travail, suivie d'un mal effroyable. Certains blâment l'air stagnant qui s'est attardé si longtemps. D'autres craignent que ce qui sommeillait sous les fumées n'ait désormais été mis au jour."
 lv_blocker_clearance.0036.a:0 "Toute victoire exige son dû."

 ## Stonemen: Challenge Event
 lv_blocker_clearance.0041.t:0 "Les Derniers Hommes de Pierre"
 lv_blocker_clearance.0041.desc:0 "Les hommes de pierre ont été repoussés, mais leur présence s'attarde encore aux marges — grottes, ruines et abris brisés où les malades et les désespérés se terrent en silence. Pour purger entièrement le campement, la zone doit être ratissée, mise en quarantaine, et scellée. Ce n'est pas seulement une affaire d'épée et de feu, mais de structure et d'ordre.\n\nSi le travail est mal mené, les affligés pourraient revenir — et la malédiction se répandrait de nouveau. Prendrez-vous vous-même en charge cette purge, ou ferez-vous confiance à la précision de votre maréchal ?"
 lv_blocker_clearance.0041.a:0 "Je verrai moi-même ce fléau prendre fin."
 lv_blocker_clearance.0041.b:0 "Mon maréchal coordonnera le ratissage final."

 # Stonemen: Failure
 lv_blocker_clearance.0042.t:0 "La Malédiction Persiste"
 lv_blocker_clearance.0042.desc:0 "L'opération a échoué. Les routes furent bloquées, les provisions s'amenuisèrent, et lorsque vint l'ultime assaut, les hommes de pierre se dispersèrent dans le bourbier et les ruines. Trop nombreux échappèrent au cordon, et le camp continue de suppurer, hors d'atteinte. Leur présence demeure un danger, et pire encore — ceux qui s'aventurèrent trop près examinent désormais d'étranges taches sur leur peau."
 lv_blocker_clearance.0042.a:0 "Ils nous ont glissé entre les doigts. Nous devons nous préparer à nouveau."

 # Stonemen: Critical Failure
 lv_blocker_clearance.0043.t:0 "Touchés par la Pierre"
 lv_blocker_clearance.0043.desc:0 "Le désastre frappa. L'avant-garde fut submergée, et plusieurs hommes furent traînés dans le camp infecté, pour ne jamais reparaître. D'autres fuirent, terrifiés, et les hommes de pierre survivants, enhardis, s'aventurent désormais plus loin qu'auparavant. La maladie se répand. Les patrouilles rapportent des observations toujours plus proches des colonies. L'entreprise a échoué dans son ensemble, et pire encore — ses conséquences se propagent désormais au-delà."
 lv_blocker_clearance.0043.a:0 "Nous avons aggravé les choses. La pierre se répand sans entrave."

 # Stonemen: Success
 lv_blocker_clearance.0044.t:0 "La Malédiction Confinée"
 lv_blocker_clearance.0044.desc:0 "Par la discipline, une planification minutieuse et une résolution funeste, le campement a été purgé. Les feux ont éliminé ce qui ne pouvait être sauvé, et nul infecté n'a été laissé à errer. La zone porte encore les cicatrices de la maladie et du chagrin — mais la menace est écartée. La terre peut désormais guérir, lentement et avec prudence."
 lv_blocker_clearance.0044.a:0 "C'est chose faite. Que nulle pierre ne reste debout."

 # Stonemen: Critical Success
 lv_blocker_clearance.0045.t:0 "Une Fin Rapide et Nette"
 lv_blocker_clearance.0045.desc:0 "L'opération fut rapide, décisive, et miraculeusement propre. Les affligés furent chassés ou détruits avec une résistance minime, et même le terrain joua en votre faveur — des conduits naturels les encerclèrent, et nul de ceux qui s'y aventurèrent ne tomba malade. Alors que les dernières cendres refroidissaient, vos éclaireurs découvrirent une crypte scellée sous les ruines, restée intacte depuis longtemps. Une relique d'avant la chute, épargnée par l'isolement... et désormais entre vos mains."
 lv_blocker_clearance.0045.a:0 "Une victoire nette — et un prix inattendu sous la cendre."

 ## Bandit Camps: Challenge Event
 lv_blocker_clearance.0051.t:0 "Briser la Dernière Lame"
 lv_blocker_clearance.0051.desc:0 "Le camp gît en ruines, mais le banditisme est une mauvaise herbe qui repousse vite. Les survivants dispersés pourraient se regrouper, riposter, ou disparaître dans les collines pour revenir un autre jour. Pour véritablement mettre fin à leur emprise, la terre doit être ramenée à l'ordre : les routes de nouveau sécurisées, les défenses élevées, et l'ordre restauré.\n\nCe n'est plus une bataille, mais une épreuve de maîtrise. Que vous meniez cela vous-même ou que vous en déléguiez la charge à votre intendant, ce dernier effort déterminera si la région retombe dans le chaos — ou connaît enfin la paix."
 lv_blocker_clearance.0051.a:0 "J'écraserai moi-même les derniers bandits."
 lv_blocker_clearance.0051.b:0 "Mon maréchal les chassera par l'acier et le feu."
 lv_blocker_clearance.0051.c:0 "Laissez-moi leur parler — il pourrait encore y avoir une issue pacifique."
 lv_blocker_clearance.0051.d:0 "Envoyez mon chancelier. Peut-être entendront-ils raison."

 # Bandit Camps: Failure
 lv_blocker_clearance.0052.t.martial:0 "L'Assaut S'enlise"
 lv_blocker_clearance.0052.t.diplomacy:0 "Les Négociations S'effondrent"
 lv_blocker_clearance.0052.desc.martial:0 "L'attaque se heurta à une résistance farouche. Le terrain favorisait les bandits — fourrés épais et sentiers dissimulés leur donnaient l'avantage. Vos forces furent repoussées, ensanglantées et frustrées. Bien que du terrain ait été gagné, le camp demeure actif, ses bannières flottant encore, provocantes."
 lv_blocker_clearance.0052.desc.diplomacy:0 "Votre envoyé prit contact — mais les bandits étaient divisés, méfiants, et peu disposés à parlementer de bonne foi. Les négociations traînèrent, puis s'envenimèrent, s'achevant sur des menaces et des lames dégainées. Les hors-la-loi demeurent retranchés, et se méfieront peut-être davantage de votre prochaine tentative."
 lv_blocker_clearance.0052.a.martial:0 "Nous nous regrouperons. La prochaine fois, nous les écraserons."
 lv_blocker_clearance.0052.a.diplomacy:0 "Nous avons tenté la raison. Nous trouverons une autre voie."

 # Bandit Camps: Critical Failure
 lv_blocker_clearance.0053.t.martial:0 "Une Embuscade dans les Fourrés"
 lv_blocker_clearance.0053.t.diplomacy:0 "Un Couteau Derrière le Sourire"
 lv_blocker_clearance.0053.desc.martial:0 "C'était un piège. Les bandits anticipèrent chacun de vos mouvements. Des archers firent pleuvoir la mort depuis des crêtes dissimulées, et le feu fut mis à vos lignes de ravitaillement. L'assaut s'effondra, et vos forces fuirent dans le chaos. Pire encore — des rumeurs de votre faiblesse se répandirent, et davantage de hors-la-loi se rassemblent dans les collines. Vous n'avez pas seulement échoué — vous les avez enhardis."
 lv_blocker_clearance.0053.desc.diplomacy:0 "Tout n'était que ruse. Pendant que votre envoyé parlementait, d'autres encerclaient le camp — et furent attaqués sans sommation. L'un de vos agents fut tué, un autre disparut. Les bandits rirent tandis que vos hommes battaient en retraite, boitant. Toute bonne volonté s'est envolée, et les hors-la-loi considèrent désormais la diplomatie comme une faiblesse. L'entreprise tout entière est ruinée."
 lv_blocker_clearance.0053.a.martial:0 "Ils nous attendaient. Il nous faudra tout reprendre — et plus durement qu'avant."
 lv_blocker_clearance.0053.a.diplomacy:0 "Nous fûmes des sots de leur faire confiance. Retour à la case départ."

 # Bandit Camps: Success
 lv_blocker_clearance.0054.t.martial:0 "Le Camp est Anéanti"
 lv_blocker_clearance.0054.t.diplomacy:0 "Le Camp se Disperse"
 lv_blocker_clearance.0054.desc.martial:0 "L'acier et la discipline l'emportèrent. Vos soldats prirent le campement d'assaut, mettant les bandits en déroute et réduisant leurs taudis en cendres. La menace a été maîtrisée. Bien que quelques traînards puissent s'échapper dans les terres sauvages, la région connaît enfin la paix — pour l'instant."
 lv_blocker_clearance.0054.desc.diplomacy:0 "Après de tendues journées de négociation, un accord fut trouvé. Certains bandits acceptèrent des offres de pardon, d'autres empochèrent de l'or pour partir. Quelques-uns disparurent dans les bois, mais le camp lui-même s'est vidé. D'autres subsistent peut-être ailleurs — mais cette menace-là, du moins, s'est dissipée pacifiquement."
 lv_blocker_clearance.0054.a.martial:0 "Que cela en soit la fin."
 lv_blocker_clearance.0054.a.diplomacy:0 "Une fin paisible, sans effusion de sang. Espérons qu'elle dure."

 # Bandit Camps: Critical Success
 lv_blocker_clearance.0055.t.martial:0 "Une Victoire Impitoyable"
 lv_blocker_clearance.0055.t.diplomacy:0 "Des Hors-la-loi Devenus Alliés"
 lv_blocker_clearance.0055.desc.martial:0 "Une campagne sans faille. L'assaut fut rapide, écrasant, et ne laissa aucun bandit en vie pour en avertir un autre. Parmi le butin pillé, vos hommes découvrirent un coffre enfoui — les dépouilles d'une noble caravane perdue des mois plus tôt, désormais vôtres par droit de conquête. Le camp a disparu, et la cupidité des bandits a versé d'inattendus dividendes."
 lv_blocker_clearance.0055.desc.diplomacy:0 "Les négociations dépassèrent toutes les attentes. Non seulement les bandits se dispersèrent, mais plusieurs de leurs chefs jurèrent service en échange de clémence. Par gratitude — ou par ambition — ils révélèrent une cache dissimulée, dérobée à un collecteur d'impôts corrompu et enfouie loin en périphérie du camp. La menace des bandits a disparu — et vos coffres en sont plus lourds."
 lv_blocker_clearance.0055.a.martial:0 "La terre est sûre — et plus riche qu'auparavant."
 lv_blocker_clearance.0055.a.diplomacy:0 "La paix et le profit à la fois. Une chose rare, en vérité."


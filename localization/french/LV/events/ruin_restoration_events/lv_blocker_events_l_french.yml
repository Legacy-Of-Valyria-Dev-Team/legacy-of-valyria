l_french:
  ## Successful Blocker Clearance
  # Titles - Standard
  lv_blocker_clearance.0001.t.unexplored_caves:0 "Les Grottes Inexplorées"
  lv_blocker_clearance.0001.t.swamp:0 "Dompter le Marécage"
  lv_blocker_clearance.0001.t.floods:0 "Après la Grande Inondation"
  lv_blocker_clearance.0001.t.noxious_gases:0 "Cendres, Puis le Silence"
  lv_blocker_clearance.0001.t.stonemen:0 "Des Cendres Là Où Ils Demeuraient"
  lv_blocker_clearance.0001.t.bandit_camps:0 "Les Lames dans les Broussailles"
  lv_blocker_clearance.0001.t.small_ruined_holding:0 "La Pierre, Toujours Debout"
  lv_blocker_clearance.0001.t.medium_ruined_holding:0 "De la Poussière, une Fondation"
  lv_blocker_clearance.0001.t.large_ruined_holding:0 "L'Héritage Réveillé"

  # Titles - Treasure
  lv_blocker_clearance.0001.t.unexplored_caves.reward:0 "Des Lueurs dans les Profondeurs"
  lv_blocker_clearance.0001.t.swamp.reward:0 "La Richesse Oubliée du Bourbier"
  lv_blocker_clearance.0001.t.floods.reward:0 "Ce que l'Inondation Oublia"
  lv_blocker_clearance.0001.t.noxious_gases.reward:0 "Les Richesses dans les Cendres"
  lv_blocker_clearance.0001.t.stonemen.reward:0 "Le Trésor des Hommes de Pierre"
  lv_blocker_clearance.0001.t.bandit_camps.reward:0 "Le Butin des Brigands"
  lv_blocker_clearance.0001.t.small_ruined_holding.reward:0 "Le Butin Parmi les Pierres"
  lv_blocker_clearance.0001.t.medium_ruined_holding.reward:0 "Les Richesses Sous les Ruines"
  lv_blocker_clearance.0001.t.large_ruined_holding.reward:0 "La Fortune des Seigneurs Oubliés"

  # Descriptions
  lv_blocker_clearance.0001.desc.unexplored_caves:0 "Après de longues semaines passées dans les entrailles de la terre, les derniers porteurs de torches sont enfin revenus à la surface. Les tunnels tortueux ont été méticuleusement cartographiés, chaque danger soigneusement marqué, et les mystères de l'inconnu ont été amenés à la lumière du jour. Là où ne gisaient jadis que les ténèbres impénétrables et l'effroi ancestral, il y a désormais des cartes détaillées, des camps établis et les prémices de véritables routes commerciales. Ces cavernes ne sont plus un repaire sinistre de murmures fantomatiques et d'ossements brisés, mais se dressent domptées et civilisées, réclamées par ceux qui eurent la volonté et le courage de fouiller leurs profondeurs interdites.\n\n"
  lv_blocker_clearance.0001.desc.swamp:0 "Ce qui fut jadis un bourbier putride de pourriture et de ruine a été transformé en terrain praticable par la main de l'homme. Le marécage maudit, longtemps havre d'insectes piqueurs, de pieds qui s'enlisent traîtreusement et de disparitions murmurées avec terreur, a été drainé avec science et dompté par la volonté humaine, si une telle chose demeure possible face à la nature sauvage. Des sentiers surélevés serpentent désormais à travers un terrain jadis trop perfide pour être foulé par les vivants, et le brouillard étouffant s'est progressivement éclairci avec chaque arbre abattu et chaque pierre retournée par les ouvriers. Ce n'est plus un lieu maudit de mort et de décomposition, mais un territoire d'ordre chèrement acquis par le sang et la sueur. Une nouvelle fondation pour l'humanité, sculptée dans la fange et arrachée à la folie des éléments.\n\n"
  lv_blocker_clearance.0001.desc.floods:0 "Les eaux tumultueuses ont enfin reflué vers leurs lits naturels. Ce qui gisait jadis noyé sous des marées dévastatrices et une terre détrempée par les pluies torrentielles est désormais révélé au grand jour : des routes ruinées par la violence des flots, des murs brisés par la fureur de l'eau et des champs gorgés d'eau stagnante, certes, mais aussi de la terre sèche et fertile et la précieuse chance de reconstruire ce qui fut perdu. Des digues solides et des canaux de drainage ont été creusés avec soin, des remblais puissants érigés contre les caprices du climat et la pierre posée là où la boue régnait jadis en maîtresse absolue. C'est encore un pays humide et dangereux, mais il n'est plus totalement sans défense face aux éléments. La grande inondation a été repoussée au-delà des terres habitées, ne serait-ce que pour un temps béni.\n\n"
  lv_blocker_clearance.0001.desc.noxious_gases:0 "L'air empoisonné s'est enfin éclairci après de longs mois d'efforts. Ce qui pesait jadis lourd de mort et de désolation, ces vapeurs suffocantes et cette brume amère qui tuaient tout ce qu'elles touchaient, ont commencé à s'amenuiser sous l'action humaine. Des puits d'aération ingénieux ont été creusés dans la roche, les cendres toxiques balayées par des vents favorables, et la terre martyrisée a eu le temps de respirer à nouveau l'air pur. La puanteur âcre du soufre s'attarde encore dans les vallées, faible mais non plus fatale pour les voyageurs. La montagne de feu fume encore au loin comme un sinistre avertissement contre l'orgueil des hommes, mais son poison mortel ne saisit plus la terre de ses griffes venimeuses. Le pire de cette malédiction est passé, du moins pour l'instant.\n\n"
  lv_blocker_clearance.0001.desc.stonemen:0 "C'est fait. Les hommes de pierre ont disparu pour toujours de ces terres : chassés par le fer et le feu, passés au fil de l'épée par nécessité, ou laissés à glisser silencieusement sous les eaux noires du fleuve pour y trouver la paix éternelle. Ces malheureux n'avaient aucun espoir de guérison, aucun remède à leur mal et aucun avenir dans ce monde des vivants. Tordus par la grisécaille implacable et rendus à demi fous par la douleur constante et la faim dévorante, ils étaient devenus un danger mortel pour tous ceux qui passaient près de leur territoire maudit. Pourtant, accomplir cette tâche ne fut point aisé pour le cœur humain. Certains se souvenaient encore de leurs noms d'antan. D'autres imploraient la mort miséricordieuse dans une langue trop brisée et déformée pour être comprise. Désormais, seul le silence lourd de tristesse s'attarde là où ils se blottissaient jadis en groupes pitoyables. La terre est certes plus sûre pour les vivants. Mais quelque chose de plus froid et d'implacable a pris racine dans l'air de ces lieux.\n\n"
  lv_blocker_clearance.0001.desc.bandit_camps:0 "Le camp de brigands a été brisé et détruit dans la violence. Les tentes de cuir ont été arrachées et brûlées, les feux de camp étouffés dans la terre, et le sang des combattants a été imbibé dans la terre assoiffée. Les brigands se sont battus comme les hommes désespérés qu'ils étaient véritablement : en haillons et sans espoir, brutaux dans leurs méthodes, sans illusions de pitié ou de merci de la part de leurs ennemis. Mais vos hommes d'armes tinrent bon dans la mêlée sanglante. Les quelques hors-la-loi qui survécurent aux combats s'enfuirent dans les terres sauvages comme des bêtes traquées, dispersés et blessés, ne représentant plus de menace organisée. Pour l'instant du moins, les routes commerciales sont plus calmes et sûres, et le peuple peut respirer un peu plus facilement dans ses foyers. La justice, dure et sanglante certes, mais longtemps attendue, a enfin été rendue à ceux qui la méritaient.\n\n"
  lv_blocker_clearance.0001.desc.small_ruined_holding:0 "Pierre et silence : voilà tout ce qui demeurait de ce lieu quand vous y arrivâtes en premier. Désormais, la végétation envahissante a été taillée avec soin, les murs brisés examinés par des maîtres maçons, et les derniers dangers qui s'y tapissaient ont été éliminés par vos hommes. Ce qui fut jadis une coquille vide et abandonnée d'un domaine seigneurial se dresse désormais prêt à servir à nouveau ses futurs maîtres. Il y a encore beaucoup de travail à accomplir avant que les lieux ne retrouvent leur splendeur passée, mais les fondations sont solides et les murs principaux encore debout. Qu'il ait été oublié par des seigneurs négligents ou abandonné aux caprices du temps et de la guerre, ce lieu ne sera plus jamais perdu dans l'oubli.\n\n"
  lv_blocker_clearance.0001.desc.medium_ruined_holding:0 "Cela prit du temps, de la patience et du sang versé, mais la ruine imposante se dresse enfin déblayée et sécurisée. Les tours croulantes ont été minutieusement inspectées par des ingénieurs, les salles instables étayées par des poutres de chêne, et les dangers qui s'attardaient encore dans les profondeurs obscures ont été chassés ou enterrés pour de bon. Jadis coque vide d'un dessein noble perdu dans les brumes du temps, le domaine se dresse désormais prêt à servir une fois de plus la cause de ses nouveaux maîtres. Il ne retrouvera peut-être jamais toutes ses gloires passées et ses richesses d'antan, mais la terre a été reconquise sur la sauvagerie, et les vieilles pierres nobles s'élèvent à nouveau avec une intention renouvelée et un dessein clair.\n\n"
  lv_blocker_clearance.0001.desc.large_ruined_holding:0 "La ruine majestueuse se dressait vaste et silencieuse, imprégnée de souvenirs plus anciens que les cartes les plus vieilles et les chroniques les plus poussiéreuses. Ses murs imposants, brisés par le temps mais encore défiant face au destin, portaient les cicatrices profondes de la conquête, du feu dévastateur et du temps implacable lui-même. Pourtant, même ces pierres chargées d'histoire purent être domptées par la volonté humaine. Après un long labeur et des efforts minutieux dirigés par des maîtres artisans, le site est enfin sécurisé et prêt à accueillir la vie : ses arches croulantes ont été stabilisées par d'ingénieux étais, ses profondeurs oubliées purgées de tout danger qui pourrait menacer les futurs habitants. Bien que les fantômes des empires déchus semblent encore murmurer leurs secrets à travers les salles usées par les vents et polies par les siècles, la ruine ne gît plus abandonnée à son sort tragique. Un nouveau chapitre de gloire et de puissance commence sur ces vieux os de pierre vénérable.\n\n"

  lv_blocker_clearance.0001.desc.unexplored_caves.dragon_egg:0 "Pourtant dans les profondeurs les plus secrètes de ces grottes mystérieuses, une découverte extraordinaire attend ceux qui osent s'aventurer si loin. Parmi les gravats accumulés et la poussière des siècles gît un œuf de [dragon|E], sa coquille nacrée chatoyant faiblement dans la lumière tamisée des torches. Une relique d'un âge révolu depuis longtemps, elle renferme en elle la promesse éblouissante de renaissance et de pouvoir immense."
  lv_blocker_clearance.0001.desc.swamp.dragon_egg:0 "Parmi la fange putride et la pierre moussue, enterré dans des racines plus anciennes que la mémoire des hommes, quelque chose d'extraordinaire fut découvert par les ouvriers : lisse comme la pierre de rivière polie, mais étrangement chaud au toucher. Un œuf de [dragon|E], ou du moins le prétendent les murmures émerveillés qui courent parmi les hommes. Les légendes fissurées parlent de telles reliques fabuleuses laissées derrière aux jours glorieux de [valyria|E], perdues dans le feu du cataclysme ou englouties par la terre affamée. Qu'une telle merveille refasse surface ici, au cœur d'un marécage oublié et maudit, est un récit que bien peu croiront sans l'avoir vue de leurs propres yeux. Mais ceux qui l'ont contemplée savent avec certitude : le monde vient de basculer vers un destin nouveau."
  lv_blocker_clearance.0001.desc.floods.dragon_egg:0 "Parmi la fange nauséabonde et les débris innombrables laissés par la grande inondation, quelque chose de totalement inattendu fut découvert par les équipes de déblaiement : lisse et parfaitement formé, écaillé et faiblement chaud au toucher. Un œuf de [dragon|E] authentique. Qu'il ait été perdu dans quelque cataclysme antique ou enterré à la hâte durant la chute tragique de l'[old_valyria|E], nul ne saurait dire avec certitude. Mais les histoires anciennes sont formelles sur ce point : de telles merveilles ne sont pas simplement des reliques du passé. Elles sont à la fois promesse d'un avenir glorieux et péril immense pour celui qui les possède."
  lv_blocker_clearance.0001.desc.noxious_gases.dragon_egg:0 "Dans le bassin fissuré d'un ravin calciné par les flammes, enterré sous d'épaisses couches de cendres refroidies et de pierre volcanique noire, quelque chose d'étrange et de merveilleux fut déterré par les équipes de déblaiement : un œuf mystérieux, sombre et veiné de lignes écarlates, pulsant faiblement d'une chaleur interne. Un œuf de [dragon|E], selon tous les témoignages des sages et des érudits. Comment il en vint à reposer en ce lieu maudit, nul ne saurait dire avec assurance, mais à l'ombre menaçante des montagnes de feu éternelles, de telles reliques fabuleuses ne se laissent pas si facilement écarter comme de simples mythes ou légendes. Le sang de l'ancien monde s'agite à nouveau dans ses veines de pierre."
  lv_blocker_clearance.0001.desc.stonemen.dragon_egg:0 "Au cœur même du camp abandonné des hommes de pierre, là où les cendres froides et la pierre brisée se mêlaient dans un sinistre mélange, une étrange relique fut découverte par les soldats les plus braves. Un œuf mystérieux, sombre et veiné de rouge sang, pulsant faiblement d'une chaleur surnaturelle. Un œuf de [dragon|E] authentique, peut-être laissé là par un seigneur valyrien en fuite ou enterré à la hâte durant la chute cataclysmique de [valyria|E]. Sa présence en ce lieu maudit n'est certainement point le fruit du hasard. Un vestige du feu éternel, dormant paisiblement sous la cendre froide des morts."
  lv_blocker_clearance.0001.desc.bandit_camps.dragon_egg:0 "Sous la pierre de foyer effondrée de l'ancienne grande salle en ruines, vos hommes les plus déterminés découvrirent quelque chose d'absolument extraordinaire : un objet ovale et mystérieux, semblable à la pierre polie mais faiblement chaud au toucher. Un œuf de [dragon|E] véritable. Peut-être laissé là par un noble valyrien en fuite devant ses ennemis, ou enterré en grand secret durant les jours terribles du Fléau. Quelle que soit son origine véritable, sa présence en ce lieu n'est certainement point le fruit du simple hasard. Un vestige précieux du feu éternel, dormant patiemment sous la cendre froide des siècles."
  lv_blocker_clearance.0001.desc.small_ruined_holding.dragon_egg:0 "Dans les ruines de ce qui put jadis être un caveau sacré ou un sanctuaire vénéré, enterré sous les gravats calcinés et les sceaux usés par le passage impitoyable du temps, une étrange relique fut découverte par les plus courageux : lisse et parfaite, ovale comme un galet de rivière, et pulsant faiblement d'une chaleur mystérieuse. Un œuf de [dragon|E] authentique, bien que nul ne puisse dire avec certitude son âge véritable, ou les raisons pour lesquelles il gisait caché en ce lieu. Une relique d'une lignée noble oubliée par l'histoire, ou quelque chose de plus ancien encore que les mémoires humaines. Cette ruine recelait décidément plus que de la simple pierre et de la poussière."
  lv_blocker_clearance.0001.desc.medium_ruined_holding.dragon_egg:0 "Dans les profondeurs obscures de l'ancien donjon, derrière des murs longtemps crus effondrés et perdus, une étrange relique fut découverte par les fouilleurs les plus persévérants : un œuf mystérieux, sombre et veiné de rouge, pulsant faiblement d'une chaleur surnaturelle. Un œuf de [dragon|E] véritable, peut-être laissé là par un seigneur en fuite devant ses ennemis ou enterré à la hâte durant la chute tragique de [valyria|E]. Sa présence en ce lieu reculé n'est certainement point le fruit du hasard aveugle. Un vestige précieux du feu éternel, dormant tranquillement sous la cendre froide des âges."
  lv_blocker_clearance.0001.desc.large_ruined_holding.dragon_egg:0 "Loin sous les flèches écroulées et les voûtes brisées, vos hommes les plus déterminés déterrèrent une chambre secrète demeurée intacte de la lumière du soleil depuis des siècles. À l'intérieur, entouré de pierre calcinée par des feux anciens et de glyphes mystérieux fanés par le temps, gisait un unique œuf de forme parfaite : brillant comme une gemme, veiné de lignes écarlates et chaud au toucher. Qu'il ait été laissé derrière dans la hâte de la fuite ou scellé avec un dessein précis par ses anciens propriétaires, il a enduré la chute d'empires entiers et le silence lourd des siècles. Désormais, il vous appartient par droit de conquête. Une relique fabuleuse des [dragons_plural|E] d'antan, dormant paisiblement dans l'obscurité complète."

  lv_blocker_clearance.0001.desc.unexplored_caves.gold_high:0 "Les cavernes mystérieuses, jadis lieu de ténèbres impénétrables et d'effroi ancestral, ont enfin livré leurs secrets les plus précieux. Quand les derniers porteurs de torches revinrent à la surface, ils rapportèrent avec eux non seulement des récits de dangers mortels, mais aussi des trésors au-delà de toute imagination humaine. De l'or pur et des gemmes scintillantes, cachés même aux regards perçants des [dragonlords|El] dans leur superbe, gisent désormais exposés à la lumière bénie du jour. Une récompense plus que digne pour ceux qui eurent le courage de déblayer ces profondeurs interdites et dangereuses."
  lv_blocker_clearance.0001.desc.swamp.gold_high:0 "Le dur travail était seulement destiné à drainer les eaux stagnantes et élever des sentiers fermes pour les voyageurs, mais la fortune capricieuse a sa propre volonté mystérieuse. Sous un autel de pierre ancienne effondré, au cœur putride du bourbier maudit, les terrassiers acharnés frappèrent de véritables filons d'or pur. Des coffres de bois précieux scellés hermétiquement par des ferrures de fer rouillé, des pièces d'or estampillées de visages valyriens anciens, et des ornements ciselés perdus à des siècles de pourriture et de racines envahissantes. Nul ne peut dire avec certitude comment un tel trésor en vint à être enterré en un lieu si reculé et dangereux : certains murmurent des histoires de [dragonlords|El] en fuite devant leurs ennemis, d'autres évoquent des brigands qui n'échappèrent jamais à leur propre piège mortel. Quelle que soit son origine véritable, le trésor est bien réel et tangible. Et désormais, il vous appartient par droit de conquête."
  lv_blocker_clearance.0001.desc.floods.gold_high:0 "Alors que les eaux tumultueuses de crue se retiraient lentement vers leur lit naturel, elles laissèrent bien plus que du simple limon et des ruines derrière leur passage dévastateur. Nichée dans une cave effondrée ou à demi enterrée sous des pierres tombées, une vaste cache de trésors fut découverte par les équipes de déblaiement : des pièces d'or par centaines étincelant dans la lumière, de la joaillerie fine digne des plus grands orfèvres, et des artefacts précieux d'une facture oubliée et exquise. Une fortune colossale, selon toute mesure humaine. Assez de richesses pour reconstruire des cités entières, étendre des domaines ou tenter dangereusement l'envie de seigneurs lointains et cupides."
  lv_blocker_clearance.0001.desc.noxious_gases.gold_high:0 "Parmi les ruines noircies par les flammes et la pierre calcinée par la chaleur infernale, un caveau secret fut découvert par les plus courageux : ses verrous de fer déformés par la chaleur extrême mais demeurés mystérieusement intacts. À l'intérieur de cette chambre préservée, l'or pur brillait encore intact des cendres destructrices et du passage impitoyable du temps. Pièces rutilantes, lingots massifs et ornements ciselés, plus de richesses que la plupart des grands seigneurs ne sauraient revendiquer en une vie, préservés du feu dévastateur mais cachés depuis des générations entières. Qu'ils aient été amassés par les puissants [dragonlords|El] ou enterrés à la hâte avant que la montagne de feu ne déverse sa colère, ils vous appartiennent désormais par droit de découverte."
  lv_blocker_clearance.0001.desc.stonemen.gold_high:0 "Au cœur même du camp abandonné des hommes de pierre, là où les cendres froides et la pierre brisée se mêlaient en un mélange sinistre, une cache secrète fut découverte par les soldats les plus déterminés. Des pièces d'or anciennes, ternies par le temps mais demeurées parfaitement intactes, et des reliques d'un artisanat exquis depuis longtemps perdu dans les brumes du temps. Peut-être laissé derrière par un seigneur en fuite devant ses ennemis ou enterré à la hâte durant la chute cataclysmique de [valyria|E]. Quelle que soit son origine mystérieuse, c'est un trésor plus que digne d'être réclamé par les vivants : une récompense juste pour ceux qui osèrent affronter la malédiction terrible et purger ces terres du fléau."
  lv_blocker_clearance.0001.desc.bandit_camps.gold_high:0 "Alors que vos hommes d'armes forçaient le caveau secret caché sous les ruines du camp des brigands, l'éclat éblouissant de l'or pur inonda soudain la chambre souterraine : des coffres débordant de pièces volées aux marchands, des bibelots dorés finement ciselés et de la finerie marchande de grande valeur. Mais la célébration et les cris de joie vinrent hélas trop tôt. Des pas lourds résonnent dans la pénombre menaçante. De la lisière sombre des arbres, des ombres hostiles se rassemblent lentement : les derniers brigands non encore abattus, poussés par le désespoir absolu et la soif de vengeance sanglante. L'or tant convoité est à portée de main, mais un dernier combat brutal demeure, et il sera sans doute le plus vicieux de tous."
  lv_blocker_clearance.0001.desc.small_ruined_holding.gold_high:0 "Caché dans une cave scellée depuis des lustres, derrière des murs à demi effondrés par le passage impitoyable du temps, gisait un caveau oublié par l'histoire. À l'intérieur : des pièces par coffres entiers, de l'or ancien portant des sceaux nobles fanés par la poussière des siècles, et des reliques de grande valeur depuis longtemps retirées de la mémoire des hommes. Peut-être le trésor secret d'une noble maison perdue dans les guerres ou contrainte à l'exil. Désormais, il vous appartient par droit de conquête : un trésor assez considérable pour remodeler tous vos plans d'avenir et régler les dettes les plus pressantes de même."
  lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_high:0 "Les niveaux inférieurs de la ruine imposante, longtemps crus effondrés et perdus, dissimulaient bien plus que de la simple poussière et des gravats. Des chambres secrètes cachées derrière de faux murs révélèrent une fortune considérable aux yeux ébahis : des pièces d'or marquées par des maisons nobles mortes depuis longtemps, des gobelets d'argent finement ciselés, et des reliques familiales précieuses demeurées intactes de la lumière depuis des décennies entières. Le caveau fut probablement scellé dans la hâte de la fuite, laissé derrière dans la guerre ou l'exil forcé. Sa redécouverte providentielle maintenant est une récompense méritée non seulement pour la persistance, mais pour la survie même face aux dangers."
  lv_blocker_clearance.0001.desc.large_ruined_holding.gold_high:0 "Sous la place centrale pavée, scellé par une pierre si épaisse qu'il aurait fallu des mois de travail acharné pour la percer, un antique trésor se révéla enfin aux yeux des vivants. Des pièces d'or plus anciennes que la Foi des Sept elle-même, des couronnes somptueuses d'empires depuis longtemps éteints et oubliés, et une statuaire dorée sculptée dans des styles raffinés invisibles depuis des générations entières. C'est une fortune colossale non seulement en poids d'or pur, mais en émerveillement et en beauté : un vestige tangible et précieux du monde glorieux qui fut. Un trésor digne de rivaliser avec les plus grands trésors légendaires des [dragonlords|El] eux-mêmes, désormais vôtre à revendiquer par droit de découverte."

  lv_blocker_clearance.0001.desc.unexplored_caves.gold_low:0 "Les cavernes mystérieuses recelaient bien plus que de simples ombres et des dangers. Parmi les passages tortueux et les galeries secrètes, un petit trésor fut découvert par les plus persévérants : des pièces d'or ternies par le passage du temps, et un éparpillement de gemmes colorées nichées dans la pierre antique. Pas assez de richesses pour éveiller l'envie d'un roi, mais suffisamment pour scintiller de promesse d'avenir. Un prix digne et honorable pour ceux assez audacieux pour braver les profondeurs interdites et dangereuses."
  lv_blocker_clearance.0001.desc.swamp.gold_low:0 "Dans le dur labeur de déblaiement de fange putride et de bourbier, quelque chose scintilla soudain sous les racines emmêlées. Un modeste trésor certes, pas une rançon de roi, mais suffisant pour couper le souffle aux plus humbles. Des pièces éparses mais authentiques, un gobelet d'argent terni mais intact, les vestiges précieux de richesse depuis longtemps cachée ou oubliée par ses propriétaires. Peut-être le butin d'un seigneur en fuite devant ses ennemis, ou le tribut final d'une caravane marchande condamnée par le destin. Quelle que soit son histoire véritable, l'or est bien réel et tangible, et il garnit désormais vos coffres : une récompense silencieuse mais juste pour un travail dur et salissant."
  lv_blocker_clearance.0001.desc.floods.gold_low:0 "Ce n'était pas grand-chose au regard des grands trésors, du moins pas au premier regard superficiel : une bourse de vieilles pièces coincée dans les poutres pourries d'un entrepôt effondré, quelques lingots épars cachés sous la pierre tombée. Pourtant, c'est une trouvaille plus que bienvenue dans ces temps difficiles. Modeste soit-elle en apparence, c'est suffisant pour raffermir les mains incertaines et financer les premiers pas essentiels du rétablissement des terres."
  lv_blocker_clearance.0001.desc.noxious_gases.gold_low:0 "Toutes les richesses de ce monde ne sont pas grandioses et spectaculaires. Nichée sous la roche effondrée et les débris calcinés par les flammes, une modeste cache vint enfin à la lumière du jour : quelques pièces d'or fusionnées ensemble par la chaleur, un coffre de bois roussi à demi consumé par le feu destructeur. Pourtant suffisamment de richesses demeurèrent intactes pour avoir de l'importance. Un bienfait silencieux mais précieux, tiré des cendres de ce qui fut presque entièrement perdu dans les flammes."
  lv_blocker_clearance.0001.desc.stonemen.gold_low:0 "Parmi les ruines désolées du camp abandonné des hommes de pierre, une petite cache fut trouvée par les plus courageux : des pièces d'or anciennes, ternies par le temps mais parfaitement intactes, et quelques bibelots précieux qui survécurent miraculeusement à la décomposition générale. Ce n'est certes pas une fortune de roi, mais c'est suffisant pour rappeler à ceux qui demeurent que même dans les lieux les plus sombres et maudits, l'espoir peut encore être trouvé par les vivants. Une petite récompense méritée pour une tâche aussi sinistre que nécessaire."
  lv_blocker_clearance.0001.desc.bandit_camps.gold_low:0 "Nichée sous une planche de plancher pourrie et vermoulue, vos hommes découvrirent un petit butin de pillage : des pièces éparses mais authentiques, un anneau d'argent ciselé, un gobelet d'étain cabossé par de longs voyages. Suffisant pour avoir de l'importance, mais pas assez pour se vanter auprès des grands seigneurs. Alors qu'ils commençaient à emballer soigneusement le butin, un mouvement hostile s'agita dans les sous-bois ténébreux. Les derniers des brigands, en haillons et hurlant comme des bêtes sauvages, surgissent en avant dans une tentative finale et désespérée de récupérer ce qu'ils considèrent encore comme leur bien. Un dernier affrontement sanglant se profile à l'horizon."
  lv_blocker_clearance.0001.desc.small_ruined_holding.gold_low:0 "Parmi les vestiges brisés d'une ancienne chambre d'intendant, vos hommes les plus minutieux découvrirent une cache modeste mais précieuse : des sacs de pièces d'or, quelques anneaux finement ciselés, et des outils d'artisanat ancien nichés sous les planchers vermoulus. Suffisant pour être qualifiée de récompense honorable, sinon d'aubaine extraordinaire. Il semble que même les ruines les plus humbles et oubliées puissent encore s'accrocher jalousement aux richesses de leur passé glorieux."
  lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_low:0 "Parmi les débris accumulés d'un ancien solarium en ruines, vos hommes découvrirent un petit coffret scellé depuis longtemps : ses gonds de fer complètement rouillés, mais son contenu demeuré miraculeusement intact. Modeste certes, mais significatif : des pièces d'or anciennes, quelques bijoux de valeur, et un registre étroit trop fané pour être déchiffré correctement. Peut-être les derniers biens précieux d'un châtelain fidèle qui ne revint jamais de la guerre. Quelle que soit l'histoire tragique, sa valeur matérielle perdure à travers les siècles."
  lv_blocker_clearance.0001.desc.large_ruined_holding.gold_low:0 "Nichée derrière un mur effondré dans ce qui put jadis être un noble domaine seigneurial, vos hommes découvrirent une cache longtemps scellée : une collection modeste mais précieuse de bijoux anciens, de vieilles pièces d'or, et d'objets cérémoniels probablement cachés dans le chaos de la chute finale. Bien qu'humble comparée à la grandeur architecturale de la ruine elle-même, c'est un fragment précieux et tangible du passé glorieux, et la preuve irréfutable que même les plus grandes cités furent bâties et habitées par des mains humaines."

  #Options
  lv_blocker_clearance.0001.a:0 "Excellent ! La fortune nous sourit enfin !"

  ## Swamp: Challenge Event
  lv_blocker_clearance.0011.t:0 "Dompter le Marécage"
  lv_blocker_clearance.0011.desc:0 "Le marécage traître a été drainé avec succès, son terrain sauvage et hostile partiellement maîtrisé par la volonté humaine, mais un effort final et décisif demeure pour pleinement reconquérir cette terre sur les éléments. Les remblais solides doivent être renforcés contre les caprices du climat, les canaux redirigés avec précision, et de nouvelles fondations durables posées avec le plus grand soin. Un seul faux pas ou une négligence pourrait voir le bourbier maudit revenir en force, engloutissant des mois entiers d'efforts acharnés et de sacrifices.\n\nLe peuple vous regarde avec espoir, ou regarde votre intendant de confiance, pour trouver la direction sage dans cette entreprise. Si cette dernière phase cruciale est bien gérée avec intelligence, le marécage sera définitivement conquis et civilisé. Sinon, les eaux perfides pourraient monter à nouveau et tout détruire."
  lv_blocker_clearance.0011.a:0 "Je superviserai personnellement cette phase finale cruciale."
  lv_blocker_clearance.0011.b:0 "Laissons mon intendant de confiance gérer tous les détails techniques."

  # Swamp: Failure
  lv_blocker_clearance.0012.t:0 "Les Efforts qui Sombrent"
  lv_blocker_clearance.0012.desc:0 "Malgré les meilleurs efforts déployés par votre équipe dévouée, le marécage obstiné résiste avec une ténacité surprenante à toutes les tentatives humaines de domptage. Les fondations censées être solides glissent traîtreusement, les ouvriers courageux disparaissent dans la fange traîtresse, et les plateformes hâtivement construites pourrissent en quelques jours seulement sous l'assaut des éléments. La terre ingrate récupère insidieusement le peu qui fut gagné au prix de tant d'efforts, et les progrès si chèrement acquis reculent furtivement dans le bourbier maudit. Ce n'est certes pas une perte complète et définitive, mais la situation s'en rapproche dangereusement."
  lv_blocker_clearance.0012.a:0 "Le marécage se révèle plus têtu que nous le pensions. Nous essaierons à nouveau avec plus de détermination."

  # Swamp: Critical Failure
  lv_blocker_clearance.0013.t:0 "Englouti par le Bourbier"
  lv_blocker_clearance.0013.desc:0 "Tout s'effondra dans un désastre complet et catastrophique. Des structures entières disparurent sous la tourbière affamée, et un canal de drainage mal calculé inonda un terrain vital fraîchement reconquis. Les équipes de travailleurs se dispersèrent dans la panique, les outils précieux furent perdus dans la fange, et le marécage s'épaissit avec une satisfaction maléfique à chaque faux pas humain. Tout ce qui avait été si laborieusement accompli est désormais entièrement défait et perdu : la terre est une fois de plus un bourbier perfide et mouvant, plus dangereux qu'auparavant. Vous devrez tout recommencer depuis le commencement le plus absolu."
  lv_blocker_clearance.0013.a:0 "Tout est parti dans la fange. Le marécage maudit a dévoré notre travail."

  # Swamp: Success
  lv_blocker_clearance.0014.t:0 "Enfin un Terrain Ferme"
  lv_blocker_clearance.0014.desc:0 "Avec des mains fermes et expertes et une planification minutieuse digne des plus grands ingénieurs, le marécage rebelle a enfin été maîtrisé par la volonté humaine. Des canaux ingénieux ont été creusés selon les règles de l'art, les supports vitaux renforcés par du bois de chêne, et la terre sèche commence à se former là où il n'y avait jadis que boue putride et décomposition. Il faudra certes encore du temps et de la patience pour construire solidement dessus, mais pour l'instant du moins, le danger mortel est définitivement écarté. Le bourbier traître a été rendu gérable et civilisé."
  lv_blocker_clearance.0014.a:0 "Ce fut chèrement acquis, mais la terre ferme est nôtre désormais."

  # Swamp: Critical Success
  lv_blocker_clearance.0015.t:0 "Le Marécage Transformé"
  lv_blocker_clearance.0015.desc:0 "Un véritable coup de maître digne des plus grands ingénieurs ! La phase finale de l'effort se déroula avec une perfection absolue : aucun faux pas regrettable, aucun revers décourageant. La terre sécha bien plus vite que les plus optimistes n'osaient l'espérer, révélant un sol stable et fertile et même les vestiges de structures perdues depuis longtemps sous la boue. Parmi les poteaux pourris et la pierre engloutie, quelque chose scintilla soudain comme une étoile : un coffre de bois précieux scellé depuis des lustres, parfaitement intact du temps destructeur, désormais libéré de l'emprise étouffante du marécage."
  lv_blocker_clearance.0015.a:0 "Le marécage est entièrement déblayé, et le bourbier nous a donné quelque chose de précieux en retour."

  ## Floods: Challenge Event
  lv_blocker_clearance.0021.t:0 "Le Bourbier Cède"
  lv_blocker_clearance.0021.desc:0 "Les eaux tumultueuses de crue ont principalement reflué vers leur lit naturel, laissant derrière un sol détrempé et les fragiles commencements du rétablissement des terres. Pourtant à moins que les rivières capricieuses ne soient définitivement domptées et la terre proprement drainée selon les règles de l'art, tous les progrès si chèrement acquis pourraient être perdus en une seule nuit. Des fossés profonds doivent être creusés avec précision, les levées renforcées par des pierres solides, et le peuple guidé avec détermination et sagesse, avant que la prochaine pluie torrentielle ne défasse tout le travail accompli.\n\nCette entreprise exige une main ferme et experte et un esprit clair et déterminé. Que ce soit par votre commandement direct ou celui de votre intendant de confiance, cet effort final et décisif décidera si la terre est définitivement reconquise sur les éléments, ou noyée une fois de plus dans les flots."
  lv_blocker_clearance.0021.a:0 "Je repousserai personnellement ces inondations maudites."
  lv_blocker_clearance.0021.b:0 "Mon intendant de confiance finira ce qui fut si bien commencé."

  # Floods: Failure
  lv_blocker_clearance.0022.t:0 "Les Eaux Montent à Nouveau"
  lv_blocker_clearance.0022.desc:0 "Les efforts déployés pour rediriger les eaux tumultueuses de crue ont malheureusement faibli face à la puissance des éléments. Les levées de fortune se brisèrent sous la pression implacable des flots, et les plans de drainage les plus ingénieux s'avérèrent tristement insuffisants. Bien que quelques progrès notables aient été accomplis par les équipes, il est désormais clair que la grande inondation a repris son avance lente mais inexorable, défaisant méthodiquement les progrès récents si chèrement acquis. Les champs fertiles se noient à nouveau sous les eaux, et les esprits des habitants sombrent avec eux dans le découragement."
  lv_blocker_clearance.0022.a:0 "Nous avons sous-estimé la puissance des eaux. Nous essaierons à nouveau, mieux préparés cette fois."
  
  # Floods: Critical Failure
  lv_blocker_clearance.0023.t:0 "Emporté par les Flots"
  lv_blocker_clearance.0023.desc:0 "Un effondrement complet et catastrophique de tous nos efforts ! Les pluies torrentielles revinrent avec une violence inouïe, et les défenses contre les inondations s'écroulèrent dans le plus grand désarroi. Les canaux débordèrent de toutes parts, les ponts s'effondrèrent dans un fracas terrible, et des sections entières de terre reconquise furent perdues à jamais. Le terrain est à nouveau complètement étouffé par le limon et l'eau stagnante, et tous les gains si laborieusement faits ont été emportés par les flots en furie. La terre affamée a récupéré ce qui lui fut pris par la force : maintenant tout doit être refait depuis le commencement le plus absolu."
  lv_blocker_clearance.0023.a:0 "Ce fut un véritable désastre... Nous devrons tout recommencer depuis le début."

  # Floods: Success
  lv_blocker_clearance.0024.t:0 "Les Eaux Refluent"
  lv_blocker_clearance.0024.desc:0 "Après un travail infatigable et des efforts soutenus de tous, les dernières eaux de crue ont enfin été repoussées au-delà des terres habitées. Les digues solides tiennent ferme contre les assauts, les cours d'eau détournés trouvent leur route naturelle, et le sol détrempé commence à sécher sous le soleil béni qui revient. Il y a encore beaucoup de reconstruction laborieuse à accomplir, mais le danger immédiat est définitivement passé, et la terre fertile est vôtre une fois de plus."
  lv_blocker_clearance.0024.a:0 "Enfin, les grandes inondations sont derrière nous pour de bon."

  # Floods: Critical Success
  lv_blocker_clearance.0025.t:0 "Dompter les Eaux"
  lv_blocker_clearance.0025.desc:0 "Non seulement la grande inondation fut tenue à distance avec succès, elle fut complètement maîtrisée par le génie humain ! Une brillante redirection des eaux selon les principes les plus savants, un labeur rapide et efficace, et une planification astucieuse digne des plus grands ingénieurs ont non seulement asséché la terre mais l'ont entièrement remodelée. D'anciens marécages inutiles sont désormais des basses terres fertiles et productives. Et dans le lit de rivière exposé, quelque chose d'antique et de précieux fut découvert : un trésor enterré et oublié depuis des lustres, maintenant amené à la lumière bénie par les eaux qui se retirent."
  lv_blocker_clearance.0025.a:0 "Les eaux rebelles reculent définitivement, et elles nous laissent un don précieux."

  ## Noxious Gases: Challenge Event
  lv_blocker_clearance.0031.t:0 "Sceller les Vapeurs"
  lv_blocker_clearance.0031.desc:0 "Le pire des vapeurs mortelles s'est considérablement aminci sous vos efforts, mais la terre n'est pas encore entièrement sûre pour les vivants. Des gaz toxiques s'élèvent encore dangereusement des évents profonds ou s'accrochent pernicieusement aux terrains bas, invisibles et mortels pour quiconque s'en approche. Le confinement final doit être manié avec la plus grande précision : détournant le flux des vapeurs, scellant hermétiquement les fissures, et peut-être construisant des canaux pour disperser ce qui s'attarde encore.\n\nUn seul mauvais calcul ou une négligence pourrait relâcher tout le poison à nouveau sur les terres. Vous pouvez superviser cet effort critique vous-même, ou confier cette tâche délicate à votre intendant de confiance. Dans tous les cas, c'est la dernière barrière décisive entre la ruine complète et le renouveau béni."
  lv_blocker_clearance.0031.a:0 "Je gérerai ceci personnellement. Cela doit être fait parfaitement."
  lv_blocker_clearance.0031.b:0 "Je confierai le confinement délicat à mon intendant de confiance."

  # Noxious Gases: Failure
  lv_blocker_clearance.0032.t:0 "Les Vapeurs S'Élèvent à Nouveau"
  lv_blocker_clearance.0032.desc:0 "Le travail minutieux pour sceller définitivement les derniers évents toxiques a malheureusement faibli face aux forces des éléments. Que ce soit par mauvais jugement humain, barrières mal alignées, ou simplement la nature volatile et imprévisible de la terre elle-même, les gaz mortels ont commencé à s'élever une fois de plus vers le ciel. Les ouvriers malades trébuchent hors de la brume empoisonnée, et la puanteur âcre s'accroche à l'air comme une malédiction persistante.\n\nLes progrès si chèrement acquis ont été défaits par les éléments, et la zone redevient dangereuse pour tous les vivants. Bien que ce ne soit pas un effondrement complet et définitif, le revers est clair et coûteux en vies humaines.\n\n"
  lv_blocker_clearance.0032.desc.illness.self:0 "Alors que les vapeurs s'épaississaient une fois de plus comme un nuage de mort, vous fûtes pris dans le pire de l'exposition. Le goût métallique du poison s'accroche obstinément à votre bouche, et vos poumons semblent calcinés par l'intérieur. Des jours ont passé depuis l'incident, pourtant la maladie demeure et vous affaiblit : un rappel cruel de combien près vous vous teniez du danger mortel."
  lv_blocker_clearance.0032.desc.illness.councillor:0 "Dans le chaos de l'effort échoué, votre intendant fidèle prit le gros de l'exposition toxique. Il gît maintenant alité dans ses appartements, la peau moite de sueur froide et le souffle court et difficile, sa guérison incertaine. Le danger mortel demeure et plane, et maintenant l'un des vôtres en paie le prix de sa personne."
  lv_blocker_clearance.0032.a:0 "Nous avons mal calculé les forces en présence. Nous essaierons à nouveau, plus prudemment cette fois."

  # Noxious Gases: Critical Failure
  lv_blocker_clearance.0033.t:0 "Étouffés par Nos Aspirations"
  lv_blocker_clearance.0033.desc:0 "Un désastre complet et catastrophique ! Ce qui était destiné à être l'effort de confinement final et définitif a terriblement mal tourné. Une fissure scellée éclata soudain avec un rugissement d'enfer, inondant toute la zone de vapeurs suffocantes et mortelles. Les ouvriers courageux s'effondrèrent où ils se tenaient. Le bétail innocent périt dans d'atroces souffrances. Même le vent lui-même sembla se faire traître, portant le poison bien plus loin qu'auparavant dans les terres habitées.\n\nTous les gains qui avaient été si laborieusement faits sont désormais entièrement partis en fumée. La terre gît une fois de plus étouffée dans un gaz épais et suffocant, plus dangereux qu'avant l'intervention. La déblayer à nouveau nécessitera beaucoup de temps, une prudence extrême et une bonne mesure de chance."
  lv_blocker_clearance.0033.a:0 "Nous avons complètement échoué de la pire manière..."

  # Noxious Gases: Success
  lv_blocker_clearance.0034.t:0 "L'Air S'Éclaircit"
  lv_blocker_clearance.0034.desc:0 "Les efforts finaux ont magnifiquement réussi au-delà de toute espérance ! Les fissures dangereuses ont été scellées hermétiquement, les évents mortels détournés loin des zones habitées, et les dernières traces des vapeurs suffocantes se sont estompées dans les vents favorables. L'air, jadis épais de poison mortel, porte maintenant le parfum propre et pur du vent ouvert et de la pluie lointaine. Les cultures peuvent pousser à nouveau, le bétail peut revenir paître en sécurité, et les gens osent respirer profondément une fois de plus sans crainte.\n\nPar la diligence constante, la planification minutieuse et un effort considérable dirigé avec sagesse, la terre a été reconquise sur le tueur invisible. Le danger est définitivement parti. Pour l'instant du moins, la paix règne.\n\n"
  lv_blocker_clearance.0034.desc.illness.self:0 "Pourtant toutes les victoires ne viennent pas sans coût pour les vivants. Vous avez émergé de l'opération avec un succès indéniable, mais le temps passé près des vapeurs nauséabondes a laissé sa marque sur votre corps. Une toux persistante qui ne veut pas vraiment partir. Des vertiges qui s'attardent plus longtemps qu'ils ne le devraient. La terre est sûre et purifiée... mais vous n'êtes pas sorti entièrement intact de l'épreuve."
  lv_blocker_clearance.0034.desc.illness.councillor:0 "Bien que l'opération délicate se soit terminée en succès complet, votre intendant fidèle n'en est pas sorti indemne. L'exposition prolongée aux vapeurs l'a laissé pâle et instable, sa voix plus faible qu'auparavant. Il insiste qu'il récupérera avec le temps et les soins, mais son sacrifice courageux ne sera pas oublié."
  lv_blocker_clearance.0034.a:0 "L'air est enfin clair et pur."

  # Noxious Gases: Critical Success
  lv_blocker_clearance.0035.t:0 "Une Aubaine dans les Brumes"
  lv_blocker_clearance.0035.desc:0 "La phase finale se déroula avec une aisance surprenante, bien plus facilement que même les plus audacieux n'osaient l'espérer ! Les évents mortels furent scellés sans le moindre incident, l'air s'éclaircit en temps record, et la terre martyrisée sembla exhaler de soulagement. Pourtant la fortune capricieuse tenait bien plus que de l'air pur en réserve. Pendant l'inspection méticuleuse de la zone une dernière fois, vos ouvriers les plus déterminés déterrèrent quelque chose de précieux longtemps caché sous la terre empoisonnée : un caveau antique parfaitement scellé et oublié, préservé par les vapeurs mêmes qui rendaient jadis ce lieu mortel pour tout être vivant.\n\nLe danger est définitivement parti, et à sa place... une aubaine extraordinaire attend d'être réclamée."
  lv_blocker_clearance.0035.a:0 "L'air s'éclaircit définitivement et révèle des richesses enterrées dans la brume."

  ## Stonemen: Challenge Event
  lv_blocker_clearance.0041.t:0 "Les Derniers Hommes de Pierre"
  lv_blocker_clearance.0041.desc:0 "Les hommes de pierre maudits ont été repoussés loin des terres habitées, mais leur présence sinistre s'attarde encore aux franges de la civilisation : grottes profondes, ruines anciennes et abris brisés où les malades et désespérés se blottissent en silence, attendant une mort qui ne vient pas. Pour pleinement déblayer le campement de tous ces malheureux, la zone doit être systématiquement balayée, mise en quarantaine stricte et définitivement scellée. Ce n'est pas seulement une affaire d'épée et de feu, mais de structure méthodique et d'ordre implacable.\n\nSi le travail délicat est mal manié par négligence, les affligés pourraient revenir en force, et la malédiction terrible se répandrait à nouveau parmi les vivants. Prendrez-vous personnellement charge de cette purge nécessaire, ou placerez-vous votre confiance dans la précision éprouvée de votre maréchal ?"
  lv_blocker_clearance.0041.a:0 "Je verrai ce fléau terrible terminé moi-même."
  lv_blocker_clearance.0041.b:0 "Mon maréchal coordonnera le balayage final avec précision."

  # Stonemen: Failure
  lv_blocker_clearance.0042.t:0 "La Malédiction S'Attarde"
  lv_blocker_clearance.0042.desc:0 "L'opération délicate faiblit face aux circonstances adverses. Les routes d'accès furent bloquées par des éboulements, les provisions s'amenuisèrent dangereusement, et quand la poussée finale tant attendue vint, les hommes de pierre se dispersèrent comme des fantômes dans le bourbier et les ruines. Trop de ces malheureux s'échappèrent du cordon de sécurité, et le camp maudit suppure encore hors d'atteinte dans les terres sauvages. Leur présence persistante demeure un danger constant, et pire encore : ceux qui s'aventurèrent trop près examinent maintenant avec terreur d'étranges taches grises qui apparaissent sur leur peau."
  lv_blocker_clearance.0042.a:0 "Ils ont glissé entre nos doigts comme des ombres. Nous devons nous préparer à nouveau avec plus de soin."

  # Stonemen: Critical Failure
  lv_blocker_clearance.0043.t:0 "Touché par la Pierre"
  lv_blocker_clearance.0043.desc:0 "Le désastre frappa avec une violence inouïe ! La partie avancée fut complètement submergée par l'ennemi, et plusieurs hommes braves furent traînés dans le camp infecté pour ne jamais être revus vivants. D'autres s'enfuirent de terreur pure, et les hommes de pierre survivants, enhardis par cette victoire, s'aventurent maintenant bien plus loin qu'auparavant dans les terres habitées. La maladie maudite se répand inexorablement. Les patrouilles rapportent des observations inquiétantes plus près des colonies innocentes. L'effort entier a non seulement échoué, mais pire : ses conséquences terribles se répandent maintenant vers l'extérieur comme une tache d'huile."
  lv_blocker_clearance.0043.a:0 "Nous avons empiré les choses de façon catastrophique. La pierre maudite se répand sans contrôle."

  # Stonemen: Success
  lv_blocker_clearance.0044.t:0 "La Malédiction Contenue"
  lv_blocker_clearance.0044.desc:0 "Par la discipline de fer, la planification minutieuse et la résolution sinistre mais nécessaire, le campement maudit a été entièrement déblayé de ses occupants. Les feux purificateurs purgèrent ce qui ne pouvait être sauvé, et aucun infecté ne fut laissé à errer libre dans les terres. La zone porte encore les cicatrices profondes de maladie et de chagrin, mais la menace mortelle est définitivement partie. La terre peut commencer à guérir maintenant, lentement et prudemment sous la protection des vivants."
  lv_blocker_clearance.0044.a:0 "C'est enfin fait. Qu'aucune pierre maudite ne demeure debout."

  # Stonemen: Critical Success
  lv_blocker_clearance.0045.t:0 "Une Fin Rapide et Propre"
  lv_blocker_clearance.0045.desc:0 "L'opération fut d'une efficacité remarquable : rapide, décisive et miraculeusement propre ! Les affligés furent chassés ou détruits avec une résistance minimale de leur part, et même le terrain difficile joua providentiellement en votre faveur : des canaux naturels les cernèrent comme dans un piège, et personne qui s'aventura dans l'opération ne tomba malade. Alors que les dernières cendres purificatrices refroidissaient, vos éclaireurs découvrirent une crypte ancienne scellée sous les ruines, longtemps demeurée intacte. Une relique précieuse d'avant la chute, épargnée par l'isolement complet... et maintenant entre vos mains par droit de conquête."
  lv_blocker_clearance.0045.a:0 "Une victoire propre et complète, et un prix inattendu sous la cendre."

  ## Bandit Camps: Challenge Event
  lv_blocker_clearance.0051.t:0 "Briser la Dernière Lame"
  lv_blocker_clearance.0051.desc:0 "Le camp de brigands gît en ruines fumantes, mais le banditisme est une mauvaise herbe qui repousse rapidement si on ne prend garde. Les survivants dispersés pourraient facilement se regrouper, contre-attaquer avec violence, ou disparaître dans les collines pour revenir un autre jour plus préparés. Pour véritablement terminer leur emprise sur ces terres, la région doit être amenée fermement au talon : routes resécurisées par des patrouilles, défenses érigées aux points stratégiques et ordre restauré par la force si nécessaire.\n\nCe n'est plus une simple bataille, mais un véritable test de contrôle territorial. Que vous le dirigiez vous-même, ou que vous déléguiez cette responsabilité à votre intendant, cet effort final et décisif déterminera si la région retombe dans l'anarchie sanglante, ou connaît enfin la paix durable."
  lv_blocker_clearance.0051.a:0 "J'écraserai les derniers brigands de mes propres mains."
  lv_blocker_clearance.0051.b:0 "Mon maréchal les chassera avec acier et feu."
  lv_blocker_clearance.0051.c:0 "Laissez-moi leur parler directement : il pourrait encore y avoir une fin pacifique."
  lv_blocker_clearance.0051.d:0 "Envoyez mon chancelier diplomate. Peut-être écouteront-ils la voix de la raison."

  # Bandit Camps: Failure
  lv_blocker_clearance.0052.t.martial:0 "La Frappe Cale"
  lv_blocker_clearance.0052.t.diplomacy:0 "Les Pourparlers S'Effondrent"
  lv_blocker_clearance.0052.desc.martial:0 "L'attaque frontale rencontra une résistance plus raide que prévu. Le terrain accidenté favorisa nettement les brigands : des broussailles épaisses et des sentiers cachés leur donnèrent un avantage tactique décisif. Vos forces furent repoussées dans le désordre, ensanglantées et frustrées par cet échec. Bien qu'un peu de terrain fut gagné au prix du sang, le camp principal demeure actif et défiant, ses bannières déchirées flottant encore en défiance de votre autorité."
  lv_blocker_clearance.0052.desc.diplomacy:0 "Votre envoyé prit contact avec les chefs brigands, mais les négociations furent difficiles dès le départ : ils étaient divisés entre eux, soupçonneux de vos intentions et peu disposés à parlementer de bonne foi. Les négociations traînèrent en longueur, puis s'aigrirent progressivement, se terminant par des menaces ouvertes et des lames tirées. Les hors-la-loi demeurent solidement retranchés, et pourraient être encore plus méfiants et hostiles lors de votre prochain mouvement."
  lv_blocker_clearance.0052.a.martial:0 "Nous nous regrouperons et reviendrons. La prochaine fois, nous les écrasons complètement."
  lv_blocker_clearance.0052.a.diplomacy:0 "Nous avons essayé la voie de la raison. Nous trouverons une autre approche."

  # Bandit Camps: Critical Failure
  lv_blocker_clearance.0053.t.martial:0 "Une Embuscade dans les Fourrés"
  lv_blocker_clearance.0053.t.diplomacy:0 "Un Couteau Derrière le Sourire"
  lv_blocker_clearance.0053.desc.martial:0 "C'était un piège parfaitement orchestré ! Les brigands expérimentés anticipèrent chacun de vos mouvements avec une précision redoutable. Les archers embusqués firent pleuvoir la mort depuis des crêtes cachées, et le feu fut mis stratégiquement à vos lignes d'approvisionnement vitales. L'attaque s'effondra dans la confusion la plus totale, et vos forces s'enfuirent dans le chaos le plus complet. Pire encore : des rumeurs de votre faiblesse se répandent rapidement, et plus de hors-la-loi se rassemblent dans les collines comme des vautours. Vous n'avez pas seulement échoué dans votre mission, vous les avez dangereusement enhardis."
  lv_blocker_clearance.0053.desc.diplomacy:0 "Tout était une ruse élaborée depuis le début ! Pendant que votre envoyé parlait de paix et d'accords, d'autres brigands encerclaient sournoisement votre camp et furent attaqués sans le moindre avertissement. Un de vos agents fut brutalement tué, un autre disparut complètement. Les brigands rirent avec mépris tandis que vos hommes boitaient lamentablement au retour. Toute bonne volonté est définitivement partie, et les hors-la-loi traitent maintenant toute diplomatie comme un signe de faiblesse à exploiter. L'effort entier est complètement défait."
  lv_blocker_clearance.0053.a.martial:0 "Ils nous attendaient et nous ont tendu un piège. Nous devrons recommencer, et plus durement qu'avant."
  lv_blocker_clearance.0053.a.diplomacy:0 "Nous fûmes des fous de leur faire confiance. Retour à la case départ."

  # Bandit Camps: Success
  lv_blocker_clearance.0054.t.martial:0 "Le Camp est Brisé"
  lv_blocker_clearance.0054.t.diplomacy:0 "Le Camp se Disperse"
  lv_blocker_clearance.0054.desc.martial:0 "L'acier tranchant et la discipline de fer remportèrent finalement la journée ! Vos soldats entraînés prirent d'assaut le campement avec une efficacité redoutable, mettant en déroute les brigands et brûlant leurs taudis misérables en cendres fumantes. La menace organisée a été définitivement apaisée. Bien que quelques traînards isolés puissent encore s'échapper dans les terres sauvages, la région est enfin en paix et sécurisée, pour l'instant du moins."
  lv_blocker_clearance.0054.desc.diplomacy:0 "Après des jours tendus de négociation délicate, un accord acceptable fut finalement atteint par toutes les parties. Certains des brigands acceptèrent avec reconnaissance des offres de pardon royal, d'autres prirent des pièces d'or pour partir vers d'autres contrées. Quelques-uns disparurent silencieusement dans les bois profonds, mais le camp lui-même s'est entièrement vidé de ses occupants. Il pourrait encore y en avoir d'autres qui rôdent là-bas, mais cette menace particulière, du moins, est passée pacifiquement."
  lv_blocker_clearance.0054.a.martial:0 "Que ce soit définitivement la fin de cette histoire."
  lv_blocker_clearance.0054.a.diplomacy:0 "Une fin silencieuse, sans effusion de sang. Espérons que cela durera."

  # Bandit Camps: Critical Success
  lv_blocker_clearance.0055.t.martial:0 "Une Victoire Impitoyable"
  lv_blocker_clearance.0055.t.diplomacy:0 "Hors-la-loi Devenus Alliés"
  lv_blocker_clearance.0055.desc.martial:0 "Une campagne militaire absolument sans faille ! L'attaque fut rapide comme l'éclair, écrasante et impitoyable, ne laissant aucun brigand vivant pour avertir d'autres bandes. Parmi le butin abondant pillé, vos hommes découvrirent un coffre soigneusement enterré : des butins précieux d'une caravane noble perdue il y a des mois, maintenant vôtres par droit de conquête légitime. Le camp est entièrement détruit, et l'avidité des brigands a payé des dividendes tout à fait inattendus."
  lv_blocker_clearance.0055.desc.diplomacy:0 "Les négociations habiles dépassèrent toutes les attentes les plus optimistes ! Non seulement les brigands se dispersèrent pacifiquement, mais plusieurs de leurs chefs les plus influents jurèrent fidèlement service en échange de clémence royale. En gratitude sincère, ou peut-être par ambition calculée, ils révélèrent l'emplacement d'une cache secrète, volée à un percepteur corrompu et enterrée profondément dans les environs immédiats du camp. La menace brigande est définitivement écartée, et vos coffres sont considérablement plus lourds pour cela."
  lv_blocker_clearance.0055.a.martial:0 "La terre est sûre et plus riche qu'avant."
  lv_blocker_clearance.0055.a.diplomacy:0 "Paix et profit tous deux. Une chose rare en effet."


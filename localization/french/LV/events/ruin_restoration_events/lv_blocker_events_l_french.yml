 #You find a Dragon Egg when clearing a mine
  special_blockers.0002.t:0 "[valyria_mine_province.GetName] : Une Trouvaille Sous les Flammes"
  special_blockers.0002.desc:0 "La mine de [valyria_mine_province.GetName] a réclamé bien des vies, pourtant aujourd'hui elle offre quelque chose en retour. Au fond d'un puits effondré, parmi la pierre calcinée et les restes squelettiques de vouivres de feu, les mineurs ont découvert un curieux objet.\n\nLisse comme l'onyx poli, veiné de braises rougeoyantes, il palpite faiblement dans l'air étouffant : chaud au toucher, presque vivant. Ce ne peut être rien d'autre.\n\nUn œuf de dragon.\n\nLe contremaître frissonne tandis que je m'approche, me l'offrant avec crainte et respect mêlés. Mon sang s'accélère."
  special_blockers.0002.a:0 "L'œuf m'appartient désormais."

 #You gain Torment
  special_blockers.0003.t:0 "La Lame dans les Ténèbres"
  #special_blockers.0003.desc:0 "As the final stones are set and the banners once again fly, the Red Wyrm’s Wrath stands reborn. Its dragonstone walls towering once more, unmarred by time, casting long shadows over the land as they did in the reign of King Taurion.\nYet within these halls, the past lingers, not just in echoes, but in whispers that never truly fade.\n\nA sealed chamber is uncovered deep within the great hall, undisturbed since the fall of [GetTitleByKey('k_lokiria').GetNameNoTier]. Inside, amidst dust and forgotten relics, lies a blade made of steel as black as a moonless night, its edge gleaming with an unnatural sharpness.\n\n[newly_created_artifact.GetName], the sword of King Taurin himself, lost to history after The Doom. Even now, its presence is suffused with an eerie weight, as if the blade remembers every battle it has tasted.\n\nThe question remains: will this blade rise once more as a symbol of dominion? Does its return herald an age of bloodshed yet to come?"
  special_blockers.0003.desc:0 "Tandis que les dernières pierres sont posées et que les bannières flottent à nouveau, la Fureur du Wyrm Rouge renaît. Ses murailles de pierre de dragon s'élèvent à nouveau, intactes par le temps, projetant de longues ombres sur la terre comme aux jours du règne de Taurion.\n\nPourtant, en ces salles, le passé persiste. Une chambre scellée est découverte au cœur de la grande salle, inviolée depuis le [doom|E]. À l'intérieur, la poussière s'accroche aux reliques et aux bannières fanées, mais en son centre gît plus que des dépouilles oubliées.\n\nReposant sur un trône, drapée d'une cape royale désormais en lambeaux, se trouve une silhouette depuis longtemps réduite en poussière. À côté de la silhouette gît une lame, faite d'un acier noir comme une nuit sans lune.\n\n[newly_created_artifact.GetName], l'épée portée par les souverains de [GetTitleByKey('k_lokiria').GetNameNoTier], que l'on croyait perdue à jamais après le [doom|E]. Encore aujourd'hui, elle porte un poids sinistre, comme si elle se souvenait de chaque bataille qu'elle a goûtée.\n\nLa question demeure : cette lame s'élèvera-t-elle comme symbole de domination, ou son retour annonce-t-il un âge de carnage ?"
  special_blockers.0003.a:0 "Une lame de roi pour un souverain digne."
  gain_vs_artifact:0 "Vous obtenez l'[artifact|E] [newly_created_artifact.GetName]"

 #You gain Mage's Fire
  special_blockers.0004.t:0 "Une Arme Plus Art que Guerre"
  special_blockers.0004.desc:0 "La Tour de Lyria a été restaurée. Tandis que je traverse les sections nouvellement ouvertes de la tour, je sens les énergies magiques uniques qui coulent à travers ces murs plus fortes que jamais. C'est comme si quelque chose d'entièrement nouveau avait été déverrouillé quand la dernière pierre fut remise en place.\n\nJe gravis la tour vers ce qu'un de mes ouvriers a appelé une grande bibliothèque. Il a dit que lorsque les décombres furent retirés et les portes ouvertes, elle se tenait intacte, comme si le [doom|E] n'y avait jamais eu lieu. Franchissant le seuil, je constate que la salle semble en effet épargnée par le temps, des étagères de livres s'élevant haut vers les plafonds voûtés de la pièce, contenant un savoir que l'on croyait probablement perdu.\n\nQuelque chose directement en face de la porte attira mon regard. En traversant la pièce, je remarquai un étui de verre dans lequel reposait une rapière en acier valyrien, son pommeau bleu poli rehaussé par une garde multicolore. Je tendis la main pour trouver le loquet pour ouvrir l'étui, mais avant que je puisse le toucher, l'étui s'ouvrit de lui-même, la porte pivotant lentement sur le côté. Tandis que je tends la main pour réclamer [newly_created_artifact.GetName], je sens une énergie magique couler à travers moi..."
  special_blockers.0004.a:0 "Vous obtenez l'[artifact|E] [newly_created_artifact.GetName]"


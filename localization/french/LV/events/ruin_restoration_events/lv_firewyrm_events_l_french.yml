l_french:
  trait_firewyrm:0 "Vouivre de Feu"
  trait_firewyrm_desc:0 "Parente tordue des dragons, la vouivre de feu n'est pas une créature de grâce ou de ciel. Elle rampe depuis les profondeurs de la terre, née de pierre fondue et de folie, façonnée par la chaleur et le temps en une abomination crachant le feu. Là où les dragons inspirent l'émerveillement, les vouivres de feu ne laissent que ruines calcinées et mort empoisonnée de fumée."

  # GUI
  HOLDING_VIEW_FIREWYRM:0 "Vouivre de Feu"

  # Firewyrm Events
  lv_firewyrm_event.0001.t:0 "La Chose qui Brûle"
  lv_firewyrm_event.0001.desc:0 "Les ruines gémissent sous le poids des âges, pourtant ce n'est ni le temps ni les tremblements qui secouent le sol sous vos pieds. Un cri, non, un hurlement, fend l'air étouffé de cendres comme une lame. Et puis elle vient. Rampant hors d'un gouffre de pierre fissurée et de souffle en fusion, la vouivre de feu s'abat sur les ruines tel un démon surgi des anciens parchemins valyriens.\n\nCe n'est pas un dragon. Ses écailles sont déchiquetées, boursouflées, à moitié fondues. La fumée siffle des évents le long de son échine serpentine, son souffle un brasier caustique qui noircit les pierres mêmes qu'elle foule. Ses yeux, par les dieux, ses yeux, sont en fusion, comme des plaies ouvertes, et elle se meut avec une faim qui n'a rien de l'instinct et tout de la malveillance.\n\nMême les dragons craignaient les vouivres de feu, dit-on. Et ce qui vous fait face n'est pas une relique apprivoisée. C'est un vestige tordu de la folie de Valyria, une créature née non seulement du feu, mais de la démence.\n\nVous n'avez que quelques instants pour choisir : affronter la bête, et peut-être devenir légende... ou fuir, et espérer que les ruines soient clémentes."
  lv_firewyrm_event.0001.duel.dragon:0 "[dragon.GetName] ! Aderī !"
  lv_firewyrm_event.0001.duel.dragon.tt:0 "Vous appelez rapidement votre dragon et vous préparez à affronter la bête."
  lv_firewyrm_event.0001.duel:0 "Acier et feu, donc. Que les dieux soient témoins."
  lv_firewyrm_event.0001.duel.tt:0 "Vous tenez bon et tentez de tuer la vouivre de feu."
  lv_firewyrm_event.0001.flee:0 "Ce n'est pas un ennemi fait pour les vivants. Fuyons."
  lv_firewyrm_event.0001.flee.tt:0 "Vous décidez de fuir, laissant la vouivre de feu à son antre."

  lv_firewyrm_spawned_tooltip:0 "Une vouivre de feu a établi son antre dans la région."
  lv_firewyrm_cleared_tooltip:0 "L'antre de [lair_location.GetName] est maintenant dégagé."

  lv_firewyrm_event.0100.t:0 "Une Ombre Levée Sur [former_lair.GetNameNoTooltip]"
  lv_firewyrm_event.0100.desc:0 "L'ombre qui pesait jadis sur ce lieu a disparu. La vouivre de feu qui tenait ces terres en servitude, bête, terreur et flamme vivante, n'est plus là pour régner dans l'effroi ardent. L'air lui-même semble plus léger sans sa chaleur et sa haine qui écrasaient tout. Qu'elle ait été tuée au combat, pliée à votre volonté, ou attirée ailleurs par les faims qui animent de tels monstres, le résultat est le même : la voie s'ouvre devant vous, libérée de sa domination."
  lv_firewyrm_event.0100.a:0 "[former_lair.GetNameNoTooltip] repose en paix à nouveau."

  ## Firewyrm Duel Events
  lv_firewyrm_duel.0001.t.firewyrm_vs_firewyrm:0 "Braises Contre Braises"
  lv_firewyrm_duel.0001.t:0 "La Cendre Rencontre la Flamme"
  lv_firewyrm_duel.0001.desc.firewyrm_vs_firewyrm:0 "#medium La terre tremble sous les griffes de votre monture, chaque pas fissure la pierre et envoie la poussière tourbillonner vers le ciel. De l'autre côté du sol brisé, l'autre vouivre de feu se dresse pour vous affronter, son regard en fusion croisant celui de votre propre bête. Il n'y a nulle parenté ici, seulement la faim, seulement la rage, tandis que l'air s'alourdit de la promesse du feu et de la ruine.\n\nElle se traîne hors des décombres comme un éclat de terre arraché, sa peau en fusion dégoulinant de chaleur à chaque mouvement. Pas d'ailes. Pas de majesté. Juste une fournaise de rage enveloppée d'écailles fissurées et de fumée. Là où votre vouivre est chair liée à la flamme, celle-ci est flamme déchaînée, un brasier rival tirant sur les rênes de son propre corps.\n\nVotre vouivre de feu gronde profondément, le son roulant comme la pierre s'effondrant dans les ténèbres d'une caverne. L'autre répond de même, non par un rugissement, mais par un cri strident comme du fer qu'on déchire, fou et ininterrompu.#!"
  lv_firewyrm_duel.0001.desc.firewyrm_duel:0 "#medium Votre bête se love et piétine le paysage, son corps en fusion sifflant par des évents de fumée et de braises. Pas d'ailes pour commander les airs, seulement des griffes pour commander le sol, seulement du feu pour défaire ce qui se dresse devant elle. Là où le dragon au-dessus est le feu fait forme et vol, votre vouivre est le feu enchaîné à la terre, une bête de ruine brute qui ne s'inclinera pas. Votre vouivre de feu mugit, un tonnerre roulant qui ébranle la pierre fissurée. Au-dessus, le dragon répond, son rugissement vaste comme le ciel, un défi lancé du haut des cieux mêmes.#!"
  lv_firewyrm_duel.0001.desc:0 "#medium Le sol crépite sous les serres de votre monture tandis que votre dragon atterrit, ses ailes se repliant comme des nuages d'orage sur le ciel fracassé. Devant vous gît la vouivre de feu, ni intimidée, ni curieuse, mais affamée.\n\nElle se tortille hors du puits en ruines comme une chose née de fumée et de tourment, sa peau en fusion fumant à chaque mouvement. Pas d'ailes. Pas de grâce. Juste une fureur déchiquetée et des écailles boursouflées, crachant de la fumée par des évents et des fissures le long de son échine. Là où un dragon est le feu fait chair, cette créature est le feu mal fait.\n\nVotre dragon gronde sourdement, un son qui fait trembler la pierre noircie. La vouivre répond, non par un rugissement, mais par un cri strident qui glace le sang, défiant et dément.#!"
  lv_firewyrm_duel.0001.desc.valyria:0 "#medium Ici, dans le cœur fumant de Valyria, deux monstres se rencontrent.#!\n\n"
  lv_firewyrm_duel.0001.desc.lyria:0 "#medium Ici, sur les falaises croulantes d'Epaekros, où la terre glisse et le ciel brûle, deux monstres vont danser.#!\n\n"
  lv_firewyrm_duel.0001.desc.lokiria:0 "#medium Ici, sous l'ombre suffocante de Gaelithox, deux monstres se rencontrent dans une brume de flamme et de fureur.#!\n\n"
  lv_firewyrm_duel.0001.desc.lands_of_the_long_summer:0 "#medium Ici, où la chaleur de l'été ne faiblit jamais et où le souffle de l'ancienne Valyria persiste encore, deux monstres croisent leurs chemins en un défi calciné.#!\n\n"
  lv_firewyrm_duel.0001.desc.elsewhere:0 "#medium Ici, loin des ossements de Valyria, deux terreurs anciennes se rencontrent comme attirées par le destin seul.#!\n\n"
  lv_firewyrm_duel.0001.desc.final:0 "#medium Vos mains se resserrent sur les rênes. Un souffle, un mot, et le ciel s'embrase.#!"
  lv_firewyrm_duel.0001.a:0 "[dragon.GetName], dracarys !"
  lv_firewyrm_duel.0001.b:0 "Sōvēs, [dragon.GetName] !"

  # Defeat
  lv_firewyrm_duel.0003.t:0 "Calcinés des Cieux"
  lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLa vouivre en face de vous s'était immobilisée, ses yeux en fusion se rétrécissant, sa poitrine se contractant. La vôtre s'agitait sous vous, inquiète, incertaine. Et puis l'ennemi a frappé.\n\nElle a bondi non avec un avertissement, non avec un son, mais avec le feu fait chair. Un jet de souffle brûlant a déchiré l'air entre vous, plus vite que la pensée. Votre monture a rugi de défi, mais le brasier a atteint sa tête et ses épaules, faisant éclater écailles et chair.\n\nVous avez senti la chaleur avant de sentir la douleur, le cuir se liquéfiant, la peau devenant cendre. La vouivre de feu sous vous s'est effondrée dans sa propre ruine, et vous avec elle, disparu à l'instant où les flammes ont touché l'os.#!"
  lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe dragon tournoyait haut au-dessus, silencieux hormis le souffle de ses ailes. Votre vouivre de feu s'est cabrée, mâchoires ouvertes, mais l'ombre au-dessus plongeait déjà.\n\nLe ciel s'est fendu avec son attaque : des serres comme des faux, des dents comme des lances. L'impact a jeté votre monture à terre, un coup trop soudain, trop précis pour résister. Les écailles ont volé en éclats. Les os ont cédé. Le sol s'est fendu sous le poids du dragon et de la vouivre.\n\nVous avez essayé de vous relever, mais il n'y avait pas de relèvement. La fureur du dragon vous clouait là où vous étiez assis, votre vouivre de feu brisée sous vous. La dernière chose que vous avez vue fut ses ailes occultant la lueur du feu, avant que les ténèbres ne vous engloutissent tout entier.#!"
  lv_firewyrm_duel.0003.desc.sudden_strike:0 "#medium Il n'y eut aucun avertissement, seulement du mouvement.\n\nUn instant, votre dragon tournoyait dans l'air épais de cendres, observant les mouvements étranges et bouillonnants de la créature. L'instant d'après, la vouivre de feu a surgi vers le haut avec une vitesse impossible, un éclair d'écailles cramoisies et de fumée embrasée. Un rugissement a fendu le ciel, non, pas un rugissement, un hurlement, un cri strident, une chose sans origine, et puis le monde a basculé.\n\nLe coup a frappé sous l'aile de votre dragon, un choc sauvage qui a brisé rythme et équilibre. Le ciel a vacillé sur le côté. Vous vous souvenez du soudain silence de la chute, de la ruée brûlante de l'air, de l'éclair de douleur blanc incandescent.\n\nVous et votre dragon n'avez même jamais touché le sol.#!"

  lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLa vouivre de feu en face de vous s'est soulevée, sa poitrine gonflant comme une fournaise au point de rupture. Pendant un instant, l'air s'est épaissi, la chaleur montant, les cendres dérivant immobiles. Puis elle a lâché.\n\nLe souffle qu'elle a libéré n'était pas un simple brasier, mais une cataracte de ruine incandescente, assez en fusion pour brûler l'air même. Votre vouivre de feu a rugi en retour, mâchoires grandes ouvertes, mais le souffle a écrasé son défi, dévorant le son avant qu'il ne naisse.\n\nVous et votre monture n'avez fait qu'un en cet instant, pris dans une seule vague de feu qui a défait tout ce qu'elle a touché. Il n'y eut pas de chute, pas de lutte. Seulement la flamme se refermant sur vous, absolue et définitive.#!"
  lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe dragon au-dessus n'a pas rugi, n'a pas viré. Il a simplement ouvert ses mâchoires, et le monde s'est transformé en lumière.\n\nLe premier souffle vous a aveuglé, une brillance incandescente qui a englouti terre et ciel. Votre vouivre de feu s'est cabrée en défi, ses écailles en fusion brillant plus fort, mais rien ne résiste au feu de dragon. Le torrent s'est déversé comme un jugement, calcinant pierre et chair, acier et os.\n\nVotre monture s'est débattue une fois sous vous avant de s'effondrer en braises. Les rênes ont brûlé dans vos mains. Le cri dans votre gorge n'a jamais quitté vos lèvres. Il n'y avait pas d'évasion, pas de pitié. Seulement le feu, et le silence après.#!"
  lv_firewyrm_duel.0003.desc.dragonfire:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLa vouivre de feu était immobile, trop immobile. Ses yeux en fusion vous suivaient comme si elle attendait, calculait. Et puis elle a ouvert ses mâchoires, larges et déchiquetées comme une caverne éventrée, et le monde est devenu flamme.\n\nUn torrent de feu a jailli vers le haut en un geyser de colère incandescente. Votre dragon a tenté de virer, tenté de s'élever, mais l'enfer l'a attrapé en plein vol, engloutissant aile, écaille et cavalier dans un seul brasier hurlant. Le ciel bouillonnait autour de vous. Les sangles de la selle se sont consumées en cendres. L'air même s'est retourné contre vous, un vent de braises et de cendres.\n\nVous n'êtes pas tombé. Vous avez disparu, consumé avant même de pouvoir crier.#!"
  
  lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_firewyrm:0 "#medium Vous avez vu le moment où elle a bondi.\n\nLa vouivre rivale n'a pas brûlé ni rugi, elle s'est jetée en avant, une montagne de muscle et de peau en fusion. Votre propre monture a mugi, se cramponnant, mais l'impact vous a projetés tous deux dans la pierre.\n\nLe sol s'est brisé sous le poids. La roche déchiquetée a déchiré les écailles. Votre vouivre de feu s'est débattue, son armure en fusion flamboyant, mais l'autre a pressé plus fort, plus lourd, une avalanche de chair et de fureur. Ses mâchoires se sont refermées autour du cou de votre bête, la forçant à terre, broyant jusqu'à ce que l'air quitte sa poitrine.\n\nVous avez hurlé des ordres, mais votre vouivre ne pouvait se relever. Son battement de cœur a tressailli sous vous, plus lent, plus faible, jusqu'à ce qu'il s'arrête. La pression a écrasé le souffle de vos poumons aussi. Les ténèbres sont venues tandis que la terre se refermait.#!"
  lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_dragon:0 "#medium Vous avez vu l'ombre occulter le ciel.\n\nLe dragon a plongé comme une lance de flamme vivante, ailes repliées, yeux fixés. Votre vouivre de feu s'est cabrée pour l'affronter, mais le coup était plus rapide, plus lourd, irrésistible. Les deux sont entrés en collision dans un coup de tonnerre, et vous avez été arraché à votre équilibre tandis que votre monture était projetée au sol.\n\nLa terre s'est fendue sous l'impact du dragon. Ses serres ont cloué la chair en fusion, ses griffes s'enfonçant à travers l'armure jusqu'à l'os. Votre vouivre s'est tordue, ses écailles en fusion luisant plus fort, mais chaque sursaut ne rencontrait qu'un poids plus grand, une puissance plus grande.\n\nLe rugissement du dragon a noyé le monde tandis qu'il pressait, les os craquant sous sa prise. Les luttes de votre monture ont faibli... et se sont arrêtées. Vous avez senti le dernier tremblement sous vous avant que la lumière ne quitte ses yeux. Puis le regard du dragon s'est tourné vers vous, et il n'y avait plus nulle part où aller.#!"
  lv_firewyrm_duel.0003.desc.driven_to_ground:0 "#medium Vous avez vu le moment où elle a tourné.\n\nLa vouivre de feu s'est lovée, non pour battre en retraite, mais pour s'élever, impossiblement rapide pour quelque chose de sa taille. Puis vint le bond, toute fureur et masse, et avant que votre dragon ne puisse se dégager, elle était sur vous.\n\nLe monde a basculé sur le côté. Griffes et cendres et douleur. Le plein poids de la bête s'est abattu comme une montagne qui s'effondre, et votre dragon a hurlé, un cri terrible et gargouillement qui a ébranlé vos os même alors qu'ils se brisaient avec [fd_loser_dragon.Custom('GetDragonHerHim')]. Les ailes se sont tordues. Les côtes ont cassé. Le sol s'est creusé.\n\nCloué sous la masse de la vouivre de feu, votre dragon s'est débattu une fois... puis plus. Vous avez tout senti, le dernier battement de cœur, le dernier sursaut de résistance, avant que la pierre ne vienne à la rencontre de votre crâne.#!"

  lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre. Votre vouivre a bondi, son armure en fusion flamboyant, chaque muscle tendu pour la mise à mort.\n\nMais l'autre était plus rapide.\n\nElle s'est tordue sous le poids de votre bête, se lovant avec une précision surnaturelle, et ses griffes ont frappé vers le haut, longues, noircies, brûlantes. L'une a griffé la poitrine de votre vouivre. La seconde a déchiré plus profond, tranchant chair et tendons rouge fournaise.\n\nLe son était mouillé, déchirant, insupportable. Votre vouivre de feu a hurlé, son sang en fusion se répandant en un torrent qui fumait contre la pierre. La lueur dans son corps a vacillé comme une forge mourante.\n\nVous vous êtes cramponné un battement de cœur, refusant d'y croire, mais votre monture s'est affaissée sous vous, ses entrailles se répandant sur la terre en filaments incandescents. Son dernier rugissement a secoué vos os avant qu'elle ne s'effondre, vous laissant brisé sur un cadavre qui fut jadis le feu incarné.#!"
  lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre. Votre vouivre a obéi, se cabrant avec une fureur en fusion, mais le dragon l'a affrontée de front.\n\nLe ciel s'est fendu avec la collision, et puis les griffes sont venues, des serres de rasoir, enfoncées avec une précision infaillible. Elles ont tranché la peau en fusion, écartant écaille et cicatrice comme si elles n'étaient rien.\n\nUn seul cri s'est arraché de votre monture tandis que le dragon arrachait vers le bas. La chair a cédé. Les entrailles ont jailli en un flot fumant et nauséabond, se répandant sur le champ de bataille. La puanteur de fer et de feu a submergé l'air.\n\nVotre vouivre a chancelé, la poitrine évidée, son grand corps haletant une fois avant que la lumière dans ses yeux en fusion ne s'éteigne en cendre. Vous avez été projeté en avant dans la ruine, dans l'épave fumante de ce qui avait été votre seul bouclier.#!"
  lv_firewyrm_duel.0003.desc.disemboweled:0 "#medium Vous avez donné l'ordre. Vous vous êtes penché en avant dans la selle, et votre dragon a obéi, brave, rapide, loyal.\n\nMais ce n'était pas suffisant.\n\nLa vouivre de feu a surgi avec une vitesse surnaturelle, plongeant sous votre attaque et vous rencontrant non avec la flamme mais avec des griffes, longues, noircies, et brûlantes. L'une a déchiré les écailles de votre dragon comme du parchemin. La seconde a trouvé prise plus profondément encore.\n\nUn son horrifique a suivi, un cri mouillé et déchirant qui n'était ni celui de votre dragon ni le vôtre. Les entrailles se sont répandues dans le ciel étouffé de cendres comme la vapeur d'une forge éventrée. L'odeur du sang, en fusion et épais, a submergé même le soufre et la fumée.\n\nVous vous êtes cramponné un battement de cœur de plus, regardant les yeux de votre dragon s'éteindre tandis qu'elle vacillait en plein vol, une créature de majesté, défaite non par le feu, mais par la sauvagerie brute d'une bête qui ne devrait pas être.#!"

  lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_firewyrm:0 "#medium Le ciel brûlait de lumière en fusion.\n\nVotre ordre était tranchant, votre vouivre bondit avec la fureur d'une fournaise, mais l'autre bougeait comme un prédateur né pour rien d'autre que le massacre. Ses griffes ont frappé dans un éclair, acier noirci contre magma vivant.\n\nUne fois. Deux fois. Encore. Une frénésie de coups qui a déchiqueté chair et tendon incandescent. Votre vouivre de feu a convulsé, son sang en fusion aspergeant le sol en rivières qui sifflaient et fumaient.\n\nVous avez crié l'ordre, l'avez suppliée de combattre, mais le coup fatal était déjà venu : le ventre ouvert, les entrailles incandescentes se répandant comme des scories d'un creuset brisé. Le cri de la bête a faibli, s'éteignant en un grondement creux tandis qu'elle s'effondrait sous vous.\n\nLa vouivre rivale ne s'est pas arrêtée. Elle a déchiré et arraché avec une malveillance sans relâche, jusqu'à ce que tout ce que vous sentiez soit la ruine tremblante de votre monture se désagrégeant sous votre selle. Le dernier son fut son cri triomphant, résonnant à travers un champ de bataille jonché de cendres et de tripes.#!"
  lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_dragon:0 "#medium Le ciel était rouge de feu et de ruine.\n\nVotre ordre a retenti, votre vouivre s'est élancée, ses écailles en fusion flamboyant, mais le dragon a frappé avec une fureur chirurgicale. Ses serres ont taillé à travers la poitrine blindée de votre bête, déchirant chair et écaille avec une précision terrifiante.\n\nUne griffe. Deux. Un coup sauvage en travers du ventre. Le rugissement de votre vouivre est devenu un gargouillis étouffé, du sang en fusion et des entrailles jaillissant en un torrent qui a embrasé le sol d'un feu fumant.\n\nVous avez crié, tiré, lutté pour tenir la selle, mais votre monture était déjà brisée. Les ailes ont cédé, les côtes ont volé en éclats, son corps a convulsé dans des spasmes d'agonie en fusion.\n\nLe dragon n'a pas cédé. Il a déchiqueté ce qui restait, arrachant poitrine de gorge, tendon d'os, jusqu'à ce que votre vouivre de feu gise en ruine, ses organes incandescents éparpillés sur le champ de bataille. Vous n'avez pas eu le temps de tomber. Vous avez simplement été enseveli dans la ruine.#!"
  lv_firewyrm_duel.0003.desc.eviscerated:0 "#medium Le ciel est rouge de feu et de sang.\n\nVotre ordre était audacieux, mais la bête l'était plus encore. La vouivre de feu a bondi avec un cri strident comme de l'acier qu'on déchire, frappant non avec fureur mais avec dessein. Ses serres ont plongé profond, une fois, deux fois, une rafale de coups sauvages qui ont fendu écaille, peau et chair.\n\nVotre dragon s'est débattu dans l'agonie, ses ailes défaillant, son souffle se figeant en plein rugissement. Vous avez tenu bon, criant, exhortant, mais il était déjà trop tard. Un dernier coup brutal a fendu son ventre, et son cri a été tranché net tandis que sang et feu jaillissaient dans les airs.\n\nLa vouivre ne s'est pas arrêtée.\n\nElle a griffé et déchiré et déchiré encore, une frénésie de haine faite chair. Vous n'avez vu que des éclairs : le craquement d'une aile, le déchirement d'une gorge, votre selle cédant sous vous tandis que le corps brisé de votre dragon spiralait vers la ruine.\n\nLa dernière chose que vous voyez est la vouivre de feu, luisante de sang, hurlant sa victoire à un ciel qui n'oubliera jamais cette boucherie.#!"

  lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_firewyrm:0 "#medium Certains monstres n'auraient jamais dû naître.\n\nLa vouivre devant vous éclipse même votre propre monture, une colossale fournaise de chair et de fureur, écailles fissurées comme de la pierre volcanique, yeux brûlant d'une lumière impie. Votre vouivre de feu, fière et en fusion, tremble en sa présence. L'instinct parle plus fort que l'ordre : ce n'est pas une proie, pas une rivale, mais l'extinction faite forme.\n\nPuis elle bouge.\n\nLe monde frémit tandis que la vouivre géante s'abat, ses griffes clouant votre bête comme si elle n'était qu'une charogne. Vous criez, votre monture se débat, mais la lutte ne dure que quelques battements de cœur.\n\nLes mâchoires descendent, vastes, fumantes, terribles. D'un seul craquement, la moitié de votre vouivre de feu a disparu, cisaillée dans une ruine de broyage d'os. Son cri est réduit au silence dans une gerbe de sang en fusion, et avant que vous ne puissiez reprendre votre souffle, le reste de votre monture est traîné hurlant dans l'abîme de sa gorge.\n\nVous êtes toujours attaché.\n\nLa chaleur vous engloutit tout entier. Ténèbres, feu, sang, et puis l'oubli.#!"
  lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_dragon:0 "#medium Certaines batailles ne sont jamais destinées à être gagnées.\n\nLe dragon plane au-dessus, titanesque par sa taille, une légende de croc et d'aile, son ombre occultant le ciel même. Comparée à lui, votre vouivre de feu est une torche vacillante devant un soleil déchaîné. Même votre bête le sait, tremblant sous votre prise tandis que l'air même frémit du souffle du léviathan.\n\nPuis il frappe.\n\nLe dragon plonge comme une montagne qui s'effondre, ses griffes déchirant la chair de votre vouivre avec une cruauté aisée. Vous criez l'ordre, mais ce n'est rien : votre monture est clouée, écrasée, impuissante sous un prédateur plus ancien et plus grand que tout cauchemar.\n\nLa gueule s'ouvre, large comme une caverne, bordée de dents faites pour les dieux, pas pour les bêtes. Et d'une seule bouchée, votre vouivre de feu est prise entière, arrachée de sous vous dans une gerbe de sang en fusion.\n\nVous êtes toujours attaché.\n\nLes mâchoires se referment. Ténèbres. Sang. Chaleur. La dernière chose que vous sentez est le craquement : la fin de vous, et la fin de votre vouivre, consumés dans le silence.#!"
  lv_firewyrm_duel.0003.desc.chomp:0 "#medium Certains monstres n'étaient pas faits pour être affrontés.\n\nLa vouivre de feu se dresse, une chose montagneuse de peau calcinée et de souffle en fusion, bien plus grande que toute bête que vous avez combattue ou rêvée. Votre dragon tourne avec précaution, la flamme léchant [fd_loser_dragon.Custom('GetDragonHerHis')] mâchoires, mais il y a de l'hésitation maintenant. Une pause. Une terreur instinctive qui parle d'une vérité plus profonde : cette chose n'est pas de leur sang. C'est la ruine faite chair.\n\nPuis elle bondit.\n\nIl n'y a pas de cri strident, pas de rugissement, seulement l'impact. En un instant, votre dragon est arraché du ciel, cloué et écrasé sous le poids de la vouivre. Vous criez, tirant votre épée, mais c'est inutile. Vous êtes inutile.\n\nLa gueule s'ouvre, vaste et fumante, et dans un craquement écœurant d'os et d'écailles, votre dragon disparaît dans sa gorge.\n\nVous êtes toujours attaché.\n\nLa chaleur est insupportable. Tout n'est que sang, feu, ténèbres.\n\nEt puis plus rien.#!"

  lv_firewyrm_duel.0003.a.sudden_strike:0 "Nous... n'avions aucune chance."
  lv_firewyrm_duel.0003.a.tt.sudden_strike:0 "Votre bête est abattue d'un seul coup inattendu."

  lv_firewyrm_duel.0003.a.dragonfire:0 "La lumière est venue trop vite... trop brillante."
  lv_firewyrm_duel.0003.a.tt.dragonfire:0 "Vous et votre bête êtes engloutis par les flammes, incapables d'échapper à l'enfer."

  lv_firewyrm_duel.0003.a.driven_to_ground:0 "Vole... ! Non... non, non, non..."
  lv_firewyrm_duel.0003.a.tt.driven_to_ground:0 "Vous et votre bête êtes projetés au sol, écrasés par l'impact brutal."

  lv_firewyrm_duel.0003.a.disemboweled:0 "Non, [fd_loser_dragon.GetName] ! Tiens... TIENS ! Par pitié... !"
  lv_firewyrm_duel.0003.a.tt.disemboweled:0 "Votre bête est éventrée par les griffes de l'ennemi, et vous regardez impuissant tandis que vous tombez tous deux."

  lv_firewyrm_duel.0003.a.eviscerated:0 "Déchiquette-nous, alors, s'il le faut."
  lv_firewyrm_duel.0003.a.tt.eviscerated:0 "Votre bête est éviscérée, et bientôt vous suivez."

  lv_firewyrm_duel.0003.a.chomp:0 "Argh ! Non, non..."
  lv_firewyrm_duel.0003.a.tt.chomp:0 "Vous et votre bête êtes dévorés d'une seule bouchée brutale."

  # Victory
  lv_firewyrm_duel.0004.t:0 "Dans le Sillage de l'Enfer"

  lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_firewyrm:0 "#medium L'air est épais de cendres, mais seulement un battement de cœur.\n\nVotre vouivre de feu se love, puis bondit avec une vitesse impossible. La vouivre rivale n'a pas le temps de se cabrer ou de cracher son souffle de fournaise avant que votre bête ne soit sur elle.\n\nLe coup est sans pitié. Les serres s'enfoncent dans le crâne et l'échine, les mâchoires se refermant avec une force volcanique. La rivale s'effondre en plein rugissement, son feu mourant dans sa gorge.\n\nElle tombe en silence, une montagne de chair brisée en un instant.\n\nLa victoire n'est pas venue de l'endurance, mais de la précision.#!"
  lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_dragon:0 "#medium La tempête d'ailes du dragon s'arrête, mais seulement un battement de cœur.\n\nVotre vouivre de feu file, plus vite que tout œil de dragon ne peut suivre, et bondit assez haut dans les airs pour intercepter la créature en vol. Un instant la bête se cabre, ses mâchoires rougeoyant de flamme ; l'instant d'après, elle est abattue.\n\nDes griffes déchirent sa gorge, des dents broient l'os avant qu'un seul souffle ne puisse quitter sa poitrine. Le dragon convulse une fois, deux fois, puis s'effondre, son feu éteint avant d'avoir pu brûler.\n\nIl meurt en silence, volé de sa gloire, sa majesté achevée en un seul coup parfait.\n\nLa victoire fut plus rapide que la pensée, plus tranchante que la flamme.#!"
  lv_firewyrm_duel.0004.desc.sudden_strike:0 "#medium Le vent s'immobilise, mais seulement un battement de cœur.\n\nVotre dragon bouge le premier. Un virage sec des ailes, une spirale descendante, et puis une explosion de vitesse impossible. Avant que la vouivre de feu ne puisse crier, se lover ou cracher son feu infernal, votre dragon est déjà sur elle.\n\nLes griffes frappent juste, un coup sauvage au crâne, ou à la gorge, ou à la base de l'échine, et la vouivre s'effondre comme des scories versées sur la pierre froide.\n\nElle meurt sans gloire, sans rugissement, sans brasier de fureur. Juste un effondrement. Un souffle volé. Et puis l'immobilité.\n\nLa victoire n'est pas venue avec la lutte, mais avec la précision.#!"

  lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_firewyrm:0 "#medium Le ciel tremble tandis que votre vouivre de feu exhale la ruine.\n\nUn torrent de souffle en fusion éclate, blanc incandescent et brûlant, inondant l'air d'une brillance aveuglante. Il s'écrase sur la vouivre rivale avec le poids d'une étoile filante, noyant écailles et chair dans un enfer qui colle comme du goudron.\n\nLa bête hurle, un son déchiqueté, moitié fureur, moitié terreur, tandis que son corps noircit et se fend, des fissures incandescentes courant sur sa carcasse. Elle se débat encore, bondissant en avant, mais le feu consume plus vite qu'elle ne peut bouger.\n\nLe sol fume sous sa chute, la pierre coulant comme de la cire.\n\nQuand les flammes meurent, il ne reste qu'une carcasse calcinée, fumant dans l'air cendreux. Le feu d'un monstre a mis fin à un autre.#!"
  lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_dragon:0 "#medium Les cieux s'embrasent tandis que votre vouivre de feu inspire profondément et déchaîne l'enfer.\n\nLe souffle rugit en un déluge de flamme en fusion, rouge-or et aveuglante, engloutissant le dragon avant qu'il ne puisse virer. Ses fières ailes se déploient, mais le feu s'accroche à chaque nervure emplumée, chaque écaille, chaque souffle.\n\nIl hurle, un cri terrible et tonitruant, mais le feu ne cède pas. Le brasier dévore peau, muscle et os, ne laissant qu'une silhouette contre un ciel de fournaise.\n\nEnfin, le cri se brise, les ailes se replient tandis que le dragon s'écrase vers la terre, traînant du feu comme un soleil qui tombe.\n\nCe qui s'élève ensuite n'est que fumée, et silence. Le dragon gît immobile, cendre et braise là où la majesté planait jadis.#!"
  lv_firewyrm_duel.0004.desc.dragonfire:0 "#medium L'air grésille tandis que [fd_attacker_dragon.GetName] exhale la fureur.\n\nLe feu jaillit de ses mâchoires en un torrent de chaleur et de lumière, rouge-or et aveuglant contre le ciel cendreux. Il s'écrase sur la vouivre de feu comme une marée de jugement, engloutissant sa carcasse tordue dans un enfer plus ancien que les rois. La créature hurle, un cri qui ressemble moins à de la douleur qu'à de la rage refusée, tandis que sa peau commence à se boursoufler, noircir, peler.\n\nLa bête se débat sauvagement, les flammes s'accrochant à sa forme comme une malédiction. Pendant un battement de cœur, elle charge en avant, brûlant, à moitié aveugle, défiante jusqu'au bout, mais la flamme ne faiblit pas. La chaleur fait fondre la pierre sous elle.\n\nEt puis, le silence.\n\nIl ne reste que fumée et puanteur de viande calcinée. La vouivre de feu gît immobile, une carcasse fumante parmi les ossements de l'ancien empire.#!"

  lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_firewyrm:0 "#medium Le monde bascule tandis que votre vouivre de feu bondit avec une force terrifiante.\n\nAvec un rugissement qui fend l'air même, elle s'écrase sur la vouivre rivale, tout muscle et fureur en fusion s'abattant comme un marteau. La terre se soulève sous l'impact, cendres et roches explosant vers l'extérieur dans une tempête étouffante.\n\nL'ennemi hurle, non de triomphe, mais de choc, tandis qu'il est écrasé dans le sol, membres se brisant, anneaux se débattant vainement contre le poids. La terre elle-même se fend sous ses convulsions, ravagée et scarifiée par son agonie.\n\nIl n'y a rien de gracieux ici. Seulement la sauvagerie. Votre vouivre de feu presse plus fort, la fumée se déversant de ses mâchoires, puis frappe, les dents déchirant profond, jusqu'à ce que les cris de la vouivre rivale se brisent en silence et en poussière.#!"
  lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_dragon:0 "#medium Votre bête ramène le combat au sol.\n\nVotre vouivre de feu se précipite en avant dans une tempête de fureur, agrippant la queue du dragon en plein virage et le tirant hors des airs comme une proie arrachée au vol. Le sol se rapproche vite, et puis le monde explose dans la poussière et le feu tandis que les deux bêtes s'écrasent sur la terre.\n\nLe dragon crie, ses ailes se brisant sous le poids qui le cloue. Ses serres griffent et labourent, creusant des sillons dans la pierre, mais rien ne trouve de prise. La vouivre de feu se love plus serré, pressant de toute sa force brute et brutale, jusqu'à ce que les os craquent et que la terre ruisselle de rouge.\n\nIl n'y a pas de cérémonie dans la mise à mort. Pas de gloire. Seulement la domination. Un dernier plongeon de crocs réduit le dragon au silence pour toujours, ne laissant que sa forme brisée dans les cendres.#!"
  lv_firewyrm_duel.0004.desc.driven_to_ground:0 "#medium Le ciel rétrécit tandis que nous descendons.\n\nAvec un rugissement qui ébranle les os du monde, [fd_attacker_dragon.GetName] s'écrase sur la vouivre de feu depuis les hauteurs, une force d'ailes, de serres et de fureur rencontrant chair brûlante et haine. Le sol tremble tandis que nous nous écrasons sur la terre calcinée, les cendres volcaniques explosant vers l'extérieur comme une vague noire.\n\nLa vouivre de feu hurle, non de douleur, mais d'incrédulité, tandis qu'elle est enfoncée sous notre poids, clouée contre la pierre fissurée comme une bête traquée. L'une de ses pattes se tord avec un craquement écœurant, et son corps serpentin se débat, creusant de profondes ornières dans le sol taché de lave.\n\nIl n'y a pas d'élégance dans la mise à mort. Seulement la domination brute. [fd_attacker_dragon.GetName] gronde, la fumée se déversant de ses naseaux, et se penche. Les dents rencontrent l'os. Le dernier cri de la vouivre de feu s'éteint dans le vent étouffé de cendres.#!"

  lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_firewyrm:0 "#medium Deux titans se tordent et s'entrechoquent, leurs anneaux frappant comme des tours qui s'effondrent. Avec un rugissement qui ébranle les os, votre vouivre de feu fouette sur le côté, ses griffes s'enfonçant dans le ventre de sa rivale. Une fois, deux fois, puis plus profond, déchirant au-delà des écailles et de la peau.\n\nLe sang jaillit, en fusion et noir-rouge, éclaboussant la pierre brisée. La vouivre blessée convulse, son corps serpentin se tordant violemment, creusant des tranchées dans les cendres. Mais elle ne peut se libérer.\n\nVotre vouivre de feu enfonce plus fort, serres crochées, et éventre la bête. La vapeur s'élève du torrent d'entrailles se répandant dans la poussière. La rivale émet un sifflement étranglé, puis s'immobilise, sa ruine exposée sur le sol calciné.#!"
  lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_dragon:0 "#medium L'acier rencontre la chair-feu tandis que le dragon bondit, ses ailes battant furieusement pour s'élever. Mais la vouivre de feu est plus rapide au sol, un soudain enroulement, une frappe, des griffes déchirant son ventre.\n\nLe sang gicle en jets de chaleur en fusion, les ailes du dragon défaillant tandis qu'il chancelle sous le coup. Il hurle, lacérant sauvagement, mais la vouivre ne cède pas. Un autre coup de griffes, sauvage et précis, et son ventre s'ouvre largement.\n\nLes entrailles cascadent sur la pierre, fumantes et fétides. Le dragon s'effondre en un tas brisé, son feu s'éteignant avec un dernier rugissement sifflant. La vouivre de feu se love au-dessus de lui, victorieuse, tandis que le champ de bataille ruisselle de rouge.#!"
  lv_firewyrm_duel.0004.desc.disemboweled:0 "#medium Acier, écailles et fureur s'entrechoquent. Avec un cri furieux, votre dragon lacère le flanc de la vouivre de feu, une fois, deux fois, puis enfonce pour la mise à mort. Du sang comme du métal en fusion jaillit des blessures de la bête, sifflant en touchant la pierre calcinée.\n\nLa vouivre de feu se débat, sa carcasse musclée se tordant comme un serpent dans les flammes. Mais votre dragon ne cède pas. Un dernier coup brutal éventre la vouivre. Ses entrailles se répandent sur la terre brisée, la vapeur s'élevant de la ruine de ce qui fut jadis un prédateur de cauchemars.\n\nLa vouivre de feu n'émet aucun son en mourant, seulement une grande exhalaison frémissante qui sent le soufre et la pourriture ancienne.#!"

  lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_firewyrm:0 "#medium Leurs corps s'entrechoquent avec un son de pierre qui craque. Les griffes étincellent, les dents claquent, puis votre vouivre de feu trouve sa cible. Elle lacère vers le bas, fendant les écailles en fusion, déchirant muscle et tendon jusqu'à ce que le ventre de la rivale s'ouvre béant.\n\nLa bête blessée convulse, crachant feu et bile de la ruine dans ses entrailles. Elle se tord, sifflant de fureur et de douleur, mais ne peut se libérer. Votre vouivre de feu creuse plus profond, traînant ses serres à travers la fournaise de son ennemi.\n\nUn dernier arrachement, chair et organes se répandent fumants sur le sol. La rivale frémit une fois, puis s'effondre dans le silence, son sang vital calcinant la terre là où elle tombe.#!"
  lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_dragon:0 "#medium Le dragon plonge, ses ailes fouettant le ciel étouffé de cendres, mais la vouivre de feu se tord sous lui, un éclair de muscles écailleux. D'une frappe soudaine elle s'accroche, ses griffes s'enfonçant profond dans le ventre tendre.\n\nUne traction sauvage, et la peau du dragon se fend comme du tissu. Un rugissement d'agonie s'arrache de sa gorge tandis que feu et sang jaillissent, pleuvant en arcs en fusion. Il se débat, tentant de s'arracher vers le ciel, mais la vouivre tient bon, déchirant plus profond.\n\nD'un arrachement brutal les entrailles du dragon se libèrent, fumant dans les cendres. Ses ailes défaillent, son corps s'écrasant sur la terre calcinée en contrebas. La vouivre de feu se dresse au-dessus de la ruine frémissante, victorieuse, tandis que le silence noie le champ de bataille.#!"
  lv_firewyrm_duel.0004.desc.eviscerated:0 "#medium Des écailles rouge-acier se déchirent comme de la toile de voile pourrie.\n\nLes griffes de votre dragon lacèrent profond, au-delà de la peau en fusion et du muscle fumant, jusqu'à ce que le ventre de la vouivre de feu soit mis à nu. La bête hurle, non par défi, mais d'agonie, tandis que flamme et bile se répandent de la plaie béante, son cœur de fournaise exposé à l'air froid étouffé de cendres.\n\nElle se tord, se débattant contre la mort, mais votre dragon tient bon. Un autre arrachement sauvage, une autre colonne de sang, jusqu'à ce que les luttes de la créature deviennent des tremblements... et puis, plus rien du tout.\n\nSes entrailles fument sur la terre brisée. Une terreur des profondeurs, défaite par le croc et la fureur.#!"

  lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_firewyrm:0 "#medium Il n'y a pas de duel, pas de combat. Seulement la faim.\n\nLa vouivre rivale se love pour frapper, trop lente. Votre vouivre de feu bondit, mâchoires béantes, et les referme sur le milieu du corps de son ennemie. Les os craquent. Les écailles se fendent. Le cri du serpent est coupé net, étouffé par la prison de dents.\n\nElle se débat, à moitié avalée, sa queue fouettant dans la fureur. Mais votre vouivre de feu ne fait que mordre plus profond, sa gueule travaillant avec une finalité obscène. En quelques instants la rivale a disparu, traînée dans des déglutitions humides, ses luttes s'éteignant dans le silence.\n\nCe qui reste est l'immobilité, et la lourde puanteur du sang dans l'air. Une terreur a consumé une autre.#!"
  lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_dragon:0 "#medium Le dragon vire au-dessus, ses ailes fendant le ciel épais de cendres, mais il plonge trop bas. La vouivre de feu surgit vers le haut, gueule béante, et le saisit dans un claquement tonitruant. Les serres battent sauvagement, les écailles grincent contre les dents, mais la morsure de la vouivre tient bon.\n\nLes os gémissent. Les ailes se déchirent. Un rugissement étranglé résonne tandis que le dragon est secoué comme une proie, écrasé contre la terre, puis soulevé à nouveau dans une gerbe de cendres et de sang. Les mâchoires de la vouivre de feu travaillent avidement, broyant et avalant, indifférentes aux cris agonisants de la bête.\n\nEnfin le dragon est brisé, une ruine traînée dans le gosier de la vouivre. Le silence suit, brisé seulement par le sifflement des écailles contre la pierre. Le ciel est vide. La vouivre de feu perdure.#!"
  lv_firewyrm_duel.0004.desc.chomp:0 "#medium Il n'y a pas d'élégance ici, seulement la domination faite chair.\n\nLa vouivre de feu se cabre pour frapper, mais votre dragon bondit avec une finalité terrifiante. Des mâchoires comme des portes de château se referment autour de la bête, broyant écailles volcaniques et tendons dans un craquement humide et grinçant. Un cri étouffé se perd dans la gorge de votre dragon tandis qu'il secoue la vouivre de feu comme une charogne, sa gueule travaillant avidement, sa gorge se gonflant.\n\nEn quelques secondes, l'horreur des ruines est réduite à une forme avalée, frémissant une fois tandis qu'elle glisse vers le néant.\n\nL'air s'immobilise. La terre, jadis terrorisée, devient silencieuse sous l'ombre d'un véritable prédateur suprême.#!"

  lv_firewyrm_duel.0004.a.sudden_strike:0 "Rapide. Net. Terminé."
  lv_firewyrm_duel.0004.a.tt.sudden_strike:0 "Votre monture frappe avec une force soudaine et brutale, mettant fin à la vie de la bête d'un seul coup."

  lv_firewyrm_duel.0004.a.dragonfire:0 "Brûle, misérable chose !"
  lv_firewyrm_duel.0004.a.tt.dragonfire:0 "Votre monture déchaîne un torrent de feu, engloutissant la bête dans les flammes."
  
  lv_firewyrm_duel.0004.a.driven_to_ground:0 "C'est ça, [fd_victor_dragon.GetName] ! Achève-la !"
  lv_firewyrm_duel.0004.a.tt.driven_to_ground:0 "La bête est dévorée au milieu des morsures déchaînées de [fd_victor_dragon.GetNameNoTooltip]"

  lv_firewyrm_duel.0004.a.disemboweled:0 "Déchire ! Arrache ! Qu'elle saigne !"
  lv_firewyrm_duel.0004.a.tt.disemboweled:0 "La bête est déchiquetée par [fd_victor_dragon.GetNameNoTooltip], ses entrailles se répandant sur le sol."

  lv_firewyrm_duel.0004.a.eviscerated:0 "Qu'elle brûle de l'intérieur !"
  lv_firewyrm_duel.0004.a.tt.eviscerated:0 "Votre monture éventre la bête, exposant ses entrailles à l'air."

  lv_firewyrm_duel.0004.a.chomp:0 "Et voilà... c'est terminé."
  lv_firewyrm_duel.0004.a.tt.chomp:0 "Votre monture dévore la bête d'une seule bouchée brutale."
  lv_firewyrm_duel.0004.chomp.t:0 "[fd_victor_dragon.GetNameNoTooltip] Apprécie le Goût"

  # Post-Round 1 Text
  lv_firewyrm_duel.0001.desc.succeeding:0 "#medium Le ciel bouillonne de chaleur et de cendres tandis que la bataille ne montre aucun signe de faiblir. La fumée s'enroule comme des doigts avides, et la flamme zèbre les nuages en éclats de fureur. Chaque battement d'ailes de votre dragon soulève des braises de la terre noircie en contrebas. La vouivre de feu, folle et implacable, tourne selon son propre rythme brutal. Ce n'est pas un simple affrontement, c'est une guerre de volontés écrite à travers les cieux.#!"
  lv_firewyrm_duel.0001.desc.succeeding.final:0 "#medium \n\nLe rythme de la bataille continue, feu et fureur battant comme un second cœur dans votre poitrine. Un autre mouvement doit être fait.#!"

  # Post-Special States
  lv_firewyrm_duel.0001.stunned:0 "Tiens bon... respire..."
  lv_firewyrm_duel.0001.tt.stunned.firewyrm:0 "Votre vouivre de feu chancelle sous la dernière attaque de la bête, incapable d'agir ce tour."
  lv_firewyrm_duel.0001.tt.stunned:0 "Votre dragon chancelle sous la dernière attaque de la bête, incapable d'agir ce tour."
  lv_firewyrm_duel.0001.desc.stunned.firewyrm_vs_firewyrm:0 "\n\n#medium La brume se lève. Votre vouivre secoue la tête, sa salive en fusion sifflant là où elle tombe, tandis que l'étourdissement quitte son corps en frissonnant. La faiblesse passe, mais non sans coût. Pierre calcinée et la silhouette massive de l'autre vouivre se profilent devant, ses évents fumant encore du cri strident. Votre bête mugit, un rugissement guttural plus fournaise que voix. Quelle que fût l'emprise de ce cri... elle est brisée maintenant.#!"
  lv_firewyrm_duel.0001.desc.stunned.firewyrm_duel:0 "\n\n#medium La brume se lève. Votre vouivre se soulève, sa peau en fusion ondulant tandis qu'elle reprend le contrôle. L'instant d'immobilité est passé, mais sa piqûre demeure. Au-dessus, le dragon vire dans le ciel, ses ailes fendant la fumée comme des lames, son cavalier pressant déjà l'attaque. Votre bête laisse échapper un cri strident qui fait trembler l'air, ses évents flamboyant de chaleur. Quelle que fût la force qui l'avait clouée au sol... elle ne durera pas.#!"
  lv_firewyrm_duel.0001.desc.stunned:0 "\n\n#medium La brume se lève. Votre dragon cligne des yeux, ses muscles se tendant tandis que la clarté revient dans son regard. Le moment de faiblesse est passé, mais non sans coût. La terre calcinée et la forme menaçante de la vouivre de feu vous accueillent tandis que la bataille reprend. Vous sentez votre monture respirer profondément, un grondement sourd montant dans sa poitrine. Quelle que fût l'emprise de ce cri strident... elle est brisée maintenant.#!"

  lv_firewyrm_duel.0001.takeoff:0 "Nous avons besoin d'altitude ! Sors-nous de là !"
  lv_firewyrm_duel.0001.tt.takeoff:0 "Votre dragon tente de prendre de l'altitude, essayant d'échapper à la portée de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.takeoff:0 "\n\n#medium Vous poussez votre dragon vers le haut, ses ailes forçant contre le poids des cendres et de la fumée. Les yeux en fusion de la vouivre de feu suivent, mais elle ne peut égaler votre ascension. Pour un instant, vous êtes libre, le sol s'éloigne, le ciel s'ouvre, et vous pouvez respirer à nouveau. Mais la bête est implacable. Elle ne vous laissera pas fuir si facilement.#!"

  lv_firewyrm_duel.0001.land:0 "Nous devons atterrir ! Maintenant !"
  lv_firewyrm_duel.0001.tt.land:0 "Votre dragon tente d'atterrir, essayant de reprendre le contrôle de la situation."
  lv_firewyrm_duel.0001.desc.land:0 "\n\n#medium D'une brusque traction sur les rênes et d'un ordre crié, vous guidez votre dragon vers le bas à travers le ciel étouffé de cendres. Le vent calciné fouette votre visage tandis que les serres s'écrasent contre la terre brisée. Le sol gémit sous le poids de votre monture tandis que les ailes se replient, la fumée s'enroulant entre la pierre fissurée et les évents en fusion. Vous plissez les yeux à travers la brume : la vouivre de feu rôde devant, ses yeux des braises ardentes dans l'obscurité. Les cieux sont derrière vous maintenant. Le reste de cette bataille se livrera là où tombent les légendes, au sol, parmi la ruine et la flamme.#!"

  lv_firewyrm_duel.0001.warning.force_land:0 "@warning_icon! #X Votre dragon sera forcé d'atterrir en exécutant ce mouvement !#!"
  lv_firewyrm_duel.0001.warning.burn_contact:0 "@warning_icon! #X Tout mouvement impliquant un contact avec la vouivre de feu dans son état en fusion brûlera ou blessera davantage votre dragon !#!"
  lv_firewyrm_duel.0001.warning.burn_incoming:0 "@warning_icon! #X La flamme de la vouivre de feu approche ! Votre dragon sera brûlé ou blessé davantage si vous ne réagissez pas à temps !#!"
  lv_firewyrm_duel.0001.warning.nullified:0 "@warning_icon! #X Ce mouvement n'infligera aucun dégât dans l'état actuel de la vouivre de feu !#!"

  # Dragon Moves
  lv_firewyrm_duel.0001.circle_beast:0 "Continue à bouger. Laisse-la deviner où tombera le prochain coup."
  lv_firewyrm_duel.0001.tt.circle_beast:0 "Votre dragon garde ses distances, tournant autour de la vouivre de feu pour provoquer la confusion ou créer une ouverture."
  lv_firewyrm_duel.0001.desc.circle_beast:0 "\n\n#medium Votre dragon décrit un large arc à travers le ciel étouffé de fumée, restant juste au-delà de la portée de la vouivre. La bête gronde et se tord, vous suivant de ses yeux incandescents. Vous n'offrez aucune ouverture, mais vous apprenez comment elle bouge, comment elle se love avant de frapper.#!"

  lv_firewyrm_duel.0001.flame_test:0 "Voyons combien de feu elle peut supporter."
  lv_firewyrm_duel.0001.tt.flame_test:0 "Votre dragon crache un jet de flamme mesuré, non pour blesser, mais pour tester la résistance de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.flame_test:0 "\n\n#medium Vous signalez une rafale contrôlée de feu de dragon, non destinée à tuer, mais à provoquer. La vouivre de feu la traverse avec une aisance inquiétante... ou frémit, reculant tandis que la flamme s'enroule le long de ses écailles. Maintenant, au moins, vous savez ce qu'elle peut endurer.#!"
  
  lv_firewyrm_duel.0001.claws_out:0 "Vise les membres ! Enchevêtre-la avant qu'elle ne frappe encore !"
  lv_firewyrm_duel.0001.tt.claws_out:0 "Un bond basique mais direct visant à griffer les pattes ou les flancs de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.claws_out:0 "\n\n#medium Pas de finesse, pas de stratégie, juste dents et serres. Votre dragon s'écrase sur la vouivre dans un concours primitif de force. L'air chante de violence tandis que les deux monstres lacèrent et fouettent, écailles et tendons arrachés au passage.#!"

  lv_firewyrm_duel.0001.reckless_dive:0 "Au diable les risques, on y va maintenant !"
  lv_firewyrm_duel.0001.tt.reckless_dive:0 "Un plongeon à grande vitesse vers le corps à corps. Dangereux pour cavalier et bête, mais cela pourrait mettre fin rapidement à l'affrontement."
  lv_firewyrm_duel.0001.desc.reckless_dive:0 "\n\n#medium Vous vous penchez bas dans le vent et projetez votre dragon dans un plongeon brutal. Vous déchirez feu et cendres comme une lance vivante, mais la vitesse téméraire est un pari. Touché ou manqué, vous payez en sang ou en souffle.#!"

  lv_firewyrm_duel.0001.guard_skies:0 "Garde la formation. Protège les ailes et la gorge."
  lv_firewyrm_duel.0001.tt.guard_skies:0 "Votre dragon protège ses parties vulnérables et tourne en altitude, minimisant les ouvertures pour les frappes de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.guard_skies:0 "\n\n#medium Vous appelez votre dragon plus haut, ses ailes balayant un halo protecteur à travers l'air chargé de ruines. Pas de brèches, pas de bonds téméraires. Vous chevauchezle vent comme une lame sur le fil, prêt à parer tout ce que la bête vous lance.#!"

  lv_firewyrm_duel.0001.rip_joints:0 "Ses genoux plient comme ceux de n'importe quelle bête. Frappe juste !"
  lv_firewyrm_duel.0001.tt.rip_joints:0 "Une frappe précise visant les articulations de la vouivre ou les plaques exposées de son ventre. Risqué, mais potentiellement décisif."
  lv_firewyrm_duel.0001.desc.rip_joints:0 "\n\n#medium Pas la tête. Pas le ventre. Vous signalez vers les jointures de son corps, là où l'écaille rencontre le muscle, là où elle doit bouger pour frapper. Votre dragon griffe juste, et la vouivre de feu hurle tandis qu'une patte spasme sous son poids.#!"

  lv_firewyrm_duel.0001.roar_challenge:0 "Qu'elle sache que nous ne sommes pas une proie."
  lv_firewyrm_duel.0001.tt.roar_challenge:0 "Votre dragon pousse un rugissement assourdissant, essayant de déstabiliser ou de provoquer la vouivre de feu dans une agression téméraire."
  lv_firewyrm_duel.0001.desc.roar_challenge:0 "\n\n#medium Vous exhortez votre dragon à mugir, un son profond et ébranlant l'âme qui répond à la folie de la vouivre de feu par la fureur draconique. La réponse est immédiate : la bête charge, enragée et irréfléchie. Vous avez attiré sa colère. Maintenant, survivez.#!"

  lv_firewyrm_duel.0001.dive_strike:0 "Entrer et sortir, assez vite pour la faire saigner sans se brûler."
  lv_firewyrm_duel.0001.tt.dive_strike:0 "Un passage rapide à travers la portée de la vouivre, visant à laisser une blessure et disparaître avant que les représailles ne tombent."
  lv_firewyrm_duel.0001.desc.dive_strike:0 "\n\n#medium Vous repérez une ouverture, brève, incertaine, et plongez à travers comme un éclair. Votre dragon lacère son flanc au passage, sans s'arrêter pour s'affronter mais traversant directement l'espace de la bête, transformant le ciel lui-même en arme.#!"

  lv_firewyrm_duel.0001.tailspin_slam:0 "Pivote et brise-lui les côtes !"
  lv_firewyrm_duel.0001.tt.tailspin_slam:0 "Votre dragon se jette dans un coup rotatif, tentant de fracasser les os par la pure force de l'impact."
  lv_firewyrm_duel.0001.desc.tailspin_slam:0 "\n\n#medium Vous commandez une roulade et une vrille, votre dragon tournoyant avec une grâce violente. La vouivre est lente à réagir, étourdie ou engourdie, et la queue de votre dragon s'abat comme un marteau sur son flanc. Les os craquent. L'air même tressaille.#!"

  lv_firewyrm_duel.0001.wound_exploit:0 "Cette entaille n'a pas cicatrisé. Nous allons nous assurer qu'elle ne le fera jamais."
  lv_firewyrm_duel.0001.tt.wound_exploit:0 "Vous exploitez une blessure antérieure, espérant l'agrandir et drainer les dernières forces de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.wound_exploit:0 "\n\n#medium Vous la voyez : un endroit brûlé à nu d'écailles, luisant de sang et de chaleur. Un ordre précis, et votre dragon plonge vers elle. Les serres trouvent la chair. La vouivre hurle d'agonie tandis que la blessure est arrachée plus largement, sa force s'écoulant à chaque battement.#!"

  lv_firewyrm_duel.0001.vipers_feint:0 "Glisse à gauche. Frappe à droite."
  lv_firewyrm_duel.0001.tt.vipers_feint:0 "Un faux mouvement éblouissant : seul un cavalier rusé peut l'exécuter proprement."
  lv_firewyrm_duel.0001.desc.vipers_feint:0 "\n\n#medium Comme un serpent en vol, vous changez d'angle en plein air : une feinte, puis une frappe depuis une trajectoire impossible. Votre dragon se faufile à travers un souffle de flamme et délivre un coup de griffes dévastateur avant que la vouivre ne réalise même où vous êtes allé.#!"

  lv_firewyrm_duel.0001.dragonflame_barrage:0 "Réduis-la en cendres, encore et encore !"
  lv_firewyrm_duel.0001.tt.dragonflame_barrage:0 "Votre dragon déchaîne un barrage complet de flammes, visant à submerger la vouivre de pure puissance de feu."
  lv_firewyrm_duel.0001.desc.dragonflame_barrage:0 "\n\n#medium Vous ne retenez rien. Avec un rugissement, votre dragon libère un torrent de feu en vagues balayantes. La vouivre gronde et recule sous la chaleur, sa peau en flammes. Ce n'est pas une mise à mort, mais c'est un message gravé dans la flamme.#!"

  lv_firewyrm_duel.0001.chomp:0 "#bold DÉVORE#!"
  lv_firewyrm_duel.0001.tt.chomp:0 "Vous #bold DÉVOREZ#!"

  lv_firewyrm_duel.0001.commanding_cry:0 "Concentre-toi, mon ami ! Nous respirons ensemble !"
  lv_firewyrm_duel.0001.tt.commanding_cry:0 "Un cri de ralliement à votre dragon, l'exhortant à se concentrer et synchroniser ses attaques avec les vôtres."
  lv_firewyrm_duel.0001.desc.commanding_cry:0 "\n\n#medium D'un mot, ancien, puissant, vous apaisez le souffle de votre dragon. Vous murmurez de la force dans ses oreilles. Son battement d'ailes se stabilise, son sang ralentit. Les blessures se referment juste assez pour voler. Vous gagnez un autre round... peut-être plus.#!"

  lv_firewyrm_duel.0001.hidden_knowledge:0 "Je me souviens des anciens textes. [dragon.GetName], fais exactement ce que je commande !"
  lv_firewyrm_duel.0001.tt.hidden_knowledge:0 "Vous vous souvenez d'une tactique spécifique des anciens textes valyriens, espérant qu'elle renversera le cours de la bataille."
  lv_firewyrm_duel.0001.desc.hidden_knowledge:0 "\n\n#medium Vous vous souvenez des récits. Les tactiques que les Valyriens utilisaient jadis quand les dragons n'étaient pas des bêtes mais des armes de guerre. Votre dragon bouge maintenant avec ce même rythme, transformant la sagesse ancienne en mort venue du ciel. La vouivre ne s'y attend pas.#!"

  lv_firewyrm_duel.0001.risk_it_all:0 "Ceci ne finit que d'une seule façon : sang et cendres."
  lv_firewyrm_duel.0001.tt.risk_it_all:0 "Vous misez tout sur une charge désespérée. Si cela fonctionne, le duel s'achève. Sinon... vous aussi."
  lv_firewyrm_duel.0001.desc.risk_it_all:0 "\n\n#medium Vous donnez l'ordre impensable. Votre dragon plonge du ciel comme une pierre, griffes déployées, flamme montant. La vouivre se dresse pour vous affronter. Deux monstres, un affrontement final. Il n'y aura pas de seconde frappe.#!"

  lv_firewyrm_duel.0001.collapse_ground:0 "Fais s'effondrer le sol sur elle ! Que la terre engloutisse ce monstre !"
  lv_firewyrm_duel.0001.tt.collapse_ground:0 "Vous ordonnez à votre dragon de déchaîner un torrent de feu sur le sol, le déstabilisant et espérant ensevelir la vouivre de feu dans la terre qui s'effondre."
  lv_firewyrm_duel.0001.desc.collapse_ground:0 "\n\n#medium Vous repoussez la vouivre de feu, de plus en plus bas, et puis signalez l'attaque. La pierre craque sous ses membres. La terre gémit. Un effondrement soudain, une colonne de poussière, et la bête disparaît dans un hurlement sous le sol brisé des ruines.#!"

  # Firewyrm Moves
  lv_firewyrm_duel.0001.fume_burst:0 "Calcine l'air, [fd_round_me_dragon.GetName] ! Emplis ses poumons de feu !"
  lv_firewyrm_duel.0001.tt.fume_burst:0 "[fd_round_me_dragon.GetName] libère un nuage de gaz surchauffé, visant à ébouillanter et désorienter [fd_round_opponent_dragon.GetName]."
  lv_firewyrm_duel.0001.desc.fume_burst.firewyrm_vs_firewyrm:0 "\n\n#medium À votre ordre, votre vouivre mugit et se soulève, fendant l'air d'un rugissement né de la fournaise. Elle évacue un nuage de vapeurs brûlantes, de la vapeur en fusion sifflant des évents le long de son échine. La vouivre ennemie se débat contre la brume brûlante, sa peau se boursouflant là où la brume ardente s'accroche. Deux fournaises vivantes s'affrontent, mais en cet instant, la vôtre brûle plus fort.#!"
  lv_firewyrm_duel.0001.desc.fume_burst:0 "\n\n#medium Votre vouivre arque son corps en fusion, les fissures de sa peau luisant plus fort tandis qu'elle libère un torrent de vapeurs brûlantes. La brume étouffante engloutit le dragon, ses ailes défaillant tandis que la bête recule devant la chaleur suffocante. Le feu-fait-chair lutte contre le feu-mal-fait, l'air même devenant votre arme tandis que le dragon hurle de rage et de douleur.#!"
  lv_firewyrm_duel.0001.desc.counter.fume_burst.firewyrm_vs_firewyrm:0 "\n\n#medium La vouivre de feu inspire profondément, puis déchaîne un nuage de vapeurs brûlantes. Votre dragon recule, ailes se déployant tandis qu'il tente d'échapper à la brume ardente. Vous sentez la chaleur même d'ici : un rappel que cette bête n'est pas seulement flamme, mais une fournaise vivante.#!"
  lv_firewyrm_duel.0001.desc.counter.fume_burst:0 "\n\n#medium La vouivre de feu inspire profondément, puis déchaîne un nuage de vapeurs brûlantes. Votre dragon recule, ailes se déployant tandis qu'il tente d'échapper à la brume ardente. Vous sentez la chaleur même d'ici : un rappel que cette bête n'est pas seulement flamme, mais une fournaise vivante.#!"

  lv_firewyrm_duel.0001.boneshattering_screech:0 "Hurle jusqu'à ce que la pierre elle-même se brise !"
  lv_firewyrm_duel.0001.tt.boneshattering_screech:0 "[fd_round_me_dragon.GetName] émet un cri strident assourdissant, visant à désorienter et déstabiliser [fd_round_opponent_dragon.GetName]."
  lv_firewyrm_duel.0001.tt.boneshattering_screech.effect:0 "[fd_round_opponent_dragon.GetName] est étourdi par ce cri brise-os"
  lv_firewyrm_duel.0001.desc.boneshattering_screech.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre s'arque, ses fissures flamboyant, avant de déchaîner un cri arraché du cœur en fusion de la terre. Le son est un tourment brut, fendant pierre et ciel. De l'autre côté du champ de bataille, l'autre vouivre s'effondre dans un spasme de fureur et de douleur, ses membres se bloquant tandis qu'elle trébuche. Deux fournaises vivantes s'entrechoquent, mais la vôtre a volé la voix du gouffre, et elle laisse la rivale brisée, étourdie dans la poussière.#!"
  lv_firewyrm_duel.0001.desc.boneshattering_screech:0 "\n\n#medium Votre vouivre se cabre, ses évents flamboyant, et pousse un cri strident qui fend l'air même. Le dragon se fige en plein rugissement, yeux écarquillés tandis que le son s'écrase sur lui avec la force d'un marteau. Les ailes défaillent, la flamme vacille, et la créature chancelle, étourdie et titubante. Le feu-fait-chair, défait non par griffe ou flamme, mais par un son assez tranchant pour fendre son esprit même.#!"
  lv_firewyrm_duel.0001.desc.counter.boneshattering_screech.firewyrm_vs_firewyrm:0 "\n\n#medium Le monde se déchire dans le son. Votre vouivre convulse, sa peau en fusion frémissant tandis que le cri strident déchire écailles et tendons. Elle se débat, frappant la terre de griffes qui raclent la pierre, ses évents crachant de la fumée dans l'agonie. Vous sentez la force secouer son corps jusque dans vos propres os, vous laissant tous deux chancelants, titubants, impuissants un battement de cœur de trop.#!"
  lv_firewyrm_duel.0001.desc.counter.boneshattering_screech:0 "\n\n#medium L'air se fend d'un cri strident si perçant qu'il semble que votre crâne pourrait craquer. Votre dragon chancelle en plein vol, ailes défaillant, yeux écarquillés de douleur et de désorientation. Le cri de la vouivre de feu résonne sur la pierre brisée et les falaises en fusion, une arme de son plus sauvage que l'acier. Vous essayez de stabiliser la bête sous vous, mais pour l'instant, tout ce que vous pouvez faire est de tenir bon. Il n'y aura pas de manœuvre cette fois, seulement la survie.#!"

  lv_firewyrm_duel.0001.cone_of_flame:0 "Réduis-la en cendres ! Que le feu soit ta réponse !"
  lv_firewyrm_duel.0001.tt.cone_of_flame:0 "[fd_round_me_dragon.GetName] déchaîne un large cône de flamme, essayant d'engloutir votre dragon dans une vague de chaleur."
  lv_firewyrm_duel.0001.tt.cone_of_flame.effect:0 "Le feu de la vouivre de feu se referme sur l'ennemi, menaçant d'incinérer dans un enfer courroucé."
  lv_firewyrm_duel.0001.desc.cone_of_flame.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre rugit, non avec le son, mais avec le feu. Elle vomit un cône de flamme brûlante, une fournaise déchaînée en un seul souffle. L'autre vouivre hurle, sa peau en fusion se boursouflant sous le torrent, ses mouvements réduits à des chancellements, des contorsions de défi. La fumée s'enroule de ses évents, pourtant le feu s'accroche, dévorant plus profond, se nourrissant de chaque souffle qu'elle ose prendre.#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame:0 "\n\n#medium La gorge de votre vouivre gonfle, ses fissures flamboyant, avant qu'elle ne vomisse une tempête de feu qui dévore l'air. Le dragon hurle tandis que le cône l'engloutit, ses ailes se recroquevillant vers l'intérieur, ses écailles noircissant sous le brasier implacable. Même alors qu'il vire au loin, le feu ne lâche pas : il s'accroche comme une malédiction, rongeant peau et tendons, transformant la grâce en agonie.#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre mugit, ventilant du feu jusqu'à ce que le champ de bataille soit noyé dans une vague de flamme brûlante. Pendant un battement de cœur, il semble que rien ne pourrait survivre à l'enfer, jusqu'à ce que le brasier se divise contre l'autre vouivre de feu. Sa peau luit comme du minerai vivant, ses canaux en fusion absorbant le feu comme s'il était souffle, pas fléau. Les flammes se brisent inutilement, s'enroulant en fumée autour d'une bête rendue immune à son propre élément.#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame.miss:0 "\n\n#medium Votre vouivre se soulève, ses évents en fusion luisant tandis qu'elle mugit une tempête de feu qui déchire le champ de bataille. Mais le dragon est déjà dans les airs, ses ailes battant une bourrasque furieuse tandis qu'il grimpe au-dessus du torrent. Le cône de flamme calcine pierre et ciel, mais ne trouve pas de cible : seulement une traînée de fumée qui s'estompe sous la forme qui fuit.#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame.firewyrm_vs_firewyrm:0 "\n\n#medium La vouivre rivale se soulève, ses fissures luisant d'un blanc en fusion, avant de dégorger un torrent de flamme qui roule sur le champ de bataille comme une marée vivante. Votre propre bête se débat tandis que le feu brûle sa peau, les évents hurlant de fumée tandis que cloque rencontre cloque. La chaleur persiste, s'accrochant à ses écailles, brûlant même après que le brasier est passé. Chaque souffle est douleur, et pourtant le feu vous dévore tous les deux.#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame:0 "\n\n#medium Avec un hurlement qui s'arrache de quelque gouffre en fusion, la vouivre de feu se cabre, sa gorge gonflant de feu, et déchaîne un cône de flamme brûlante à travers le champ de bataille. L'air se transforme en fumée et en fureur tandis que le brasier s'évente vers l'extérieur, engloutissant pierre brisée et ciel. Vous sentez la chaleur avant qu'elle ne frappe, comme un marteau fait de lumière. Votre dragon hurle, ailes se déployant contre l'enfer, tandis que le monde se brouille dans un rouge incandescent.#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss.firewyrm_vs_firewyrm:0 "\n\n#medium La vouivre de feu ennemie convulse, sa gorge gonflant de chaleur, avant de cracher un torrent né de fournaise à travers le champ. Il frappe avec la force d'une tempête de soleils, pourtant votre vouivre reste intouchée. Sa peau brûle plus fort, ses évents flamboyant comme des fissures dans le cœur de la terre. Les flammes déferlent sur elle, réclamées et consumées, ne laissant que fumée dérivant dans leur sillage. Pour l'instant, le feu ne peut blesser le feu.#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss:0 "\n\n#medium La vouivre de feu pousse un rugissement guttural, sa poitrine pulsant de lueur de braise avant de cracher un cône de feu tourbillonnant. L'enfer lèche vers le haut, chassant les ombres et transformant la terre brisée en contrebas en une mer mouvante de flammes. Mais votre dragon est déjà en vol, ailes battant fort contre la chaleur montante. Vous grimpez plus haut dans le ciel chargé de cendres, sentant le grillage de l'air ascendant mais pas la morsure du brasier. En bas, le feu déferle inoffensivement sur la pierre noircie, et la vouivre de feu gronde, ses mâchoires fumant de frustration.#!"
  
  lv_firewyrm_duel.0001.frenzied_lunge:0 "Frappe maintenant, folie et fureur mêlées !"
  lv_firewyrm_duel.0001.tt.frenzied_lunge:0 "[fd_round_me_dragon.GetName] charge en avant dans un bond sauvage et incontrôlé, essayant de combler la distance et de porter un coup."
  lv_firewyrm_duel.0001.desc.frenzied_lunge.firewyrm_vs_firewyrm:0 "\n\n#medium Avec un mugissement qui fait tomber les cendres des falaises, votre vouivre surgit en avant dans une frénésie de muscle et de fumée. Les griffes déchirent la peau calcinée tandis que les deux bêtes s'entrechoquent, fureur contre fureur. Le sol tremble sous la violence, et pendant un instant cela ressemble moins à une frappe qu'à un tremblement de terre fait forme.#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge:0 "\n\n#medium Votre vouivre se lance à une vitesse téméraire, un éclair de griffes et de crocs déchiquetés. Elle s'écrase sur le flanc du dragon, déchirant écailles et tendons avec une force sauvage. Le dragon se débat, ailes battant contre le déferlement de douleur, mais votre bête ne cède pas, sa frénésie ne laissant que ruine dans son sillage.#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre se jette en avant, frappant la bête incandescente dans une tempête de griffes et de mâchoires claquantes. Mais au lieu de chair, elle rencontre du feu sans chair : la peau en fusion brûlant à travers ses serres. L'impact déchire les deux créatures, votre monture reculant avec un cri de douleur tandis que son propre assaut se retourne contre elle. La fureur devient agonie en un battement de cœur, fumée et étincelles traînant de l'affrontement.#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge.miss:0 "\n\n#medium Avec un cri strident qui fend la pierre, votre vouivre bondit, griffes labourant vers le haut à travers fumée et cendres. Mais le dragon est déjà vers le ciel, ses ailes déchirant l'air au-dessus du champ de bataille. Le coup ne frappe que ruine et poussière, l'élan projetant votre monture à travers le sol craquelé. Elle s'écrase lourdement, se retournant avec des yeux en fusion fixés sur sa proie, fureur intacte.#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.firewyrm_vs_firewyrm:0 "\n\n#medium La vouivre ennemie explose des cendres, son corps une tempête d'écailles et de rage. Elle percute votre monture dans un fracas qui ébranle les os, crocs taillant profond tandis que les griffes labourent du feu dans la chair. Le sol frémit sous l'impact, votre vouivre hurlant sous la force écrasante de la frénésie déchaînée de sa parente.#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge:0 "\n\n#medium Sans avertissement, la vouivre bondit en avant dans une frénésie, traînant griffe et croc à travers l'air étouffé de cendres. Elle s'écrase sur votre dragon avec une fureur téméraire, arrachant écaille de l'os. Vous sentez le choc traverser la selle, les tendons, jusqu'à vos propres os. Il ne reste plus d'esprit en elle, seulement la haine.#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium La bête se jette en avant, hurlant, griffes et crocs frappant comme une avalanche. Mais quand elle s'écrase sur la peau en fusion de votre vouivre, l'attaque devient sa propre perte. Le feu explose contre le feu, brûlant l'attaquant tandis qu'il lacère inutilement contre l'armure incandescente. Votre vouivre gronde à travers la tempête, intacte, tandis que son ennemie recule boursouflée et hurlante.#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss:0 "\n\n#medium Avec un cri strident insensé, la vouivre de feu bondit, gueule grande ouverte et griffes labourant l'air. Elle s'écrase en avant à travers la fumée et la ruine, mais votre dragon est déjà vers le ciel, ailes battant contre la chaleur montante et les cendres. Le bond ne frappe que poussière et pierre brisée, et l'élan de la vouivre l'envoie déraper sur la terre craquelée. En bas, elle se retourne avec un sifflement, ses yeux en fusion vous suivant au-dessus, sa rage couvant plus fort à chaque souffle.#!"

  lv_firewyrm_duel.0001.rockfall_roar:0 "Rugis, [fd_round_me_dragon.GetName] ! Arrache le ciel de ses piliers !"
  lv_firewyrm_duel.0001.tt.rockfall_roar:0 "[fd_round_me_dragon.GetName] pousse un rugissement qui fait trembler le sol même, délogeant roches et débris."
  lv_firewyrm_duel.0001.desc.rockfall_roar.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre se cabre, poitrine haletante, et déchaîne un rugissement qui ébranle la pierre même. La caverne tremble tandis que les murs se fendent et que les rochers dégringolent. Une grêle de roche s'abat sur la vouivre ennemie, sa peau en fusion étincelant tandis qu'elle se débat sous le poids qui s'effondre. Des nuages de poussière fleurissent dans la lueur du feu, étouffant l'air jusqu'à ce que tout ce que vous entendiez soit le gémissement de la pierre et la fureur étouffée de l'ennemi en dessous.#!"
  lv_firewyrm_duel.0001.desc.rockfall_roar:0 "\n\n#medium Le rugissement que votre vouivre pousse est moins un son qu'une convulsion du monde lui-même. La caverne frémit, les stalactites se brisant comme des dents du plafond, les murs se fendant avec des craquements tonitruants. Le dragon vire vers le haut dans la panique, ailes griffant pour trouver de l'air tandis que la roche cisaille au passage en plaques mortelles. La lueur du feu peint le chaos en rouge et or, votre ennemi piégé entre pierre et flamme, luttant pour survivre dans une tombe qui s'effondre.#!"
  lv_firewyrm_duel.0001.desc.counter.rockfall_roar.firewyrm_vs_firewyrm:0 "\n\n#medium La vouivre ennemie mugit, et le monde s'effondre. La pierre s'arrache du plafond en grandes dalles, le sol convulsant sous les griffes de votre bête. Vous vous agrippez à la selle tandis que les décombres pleuvent autour de vous, assourdi par le rugissement de la terre et du monstre. Votre vouivre chancelle, prise dans l'écrasement claustrophobique, ses yeux en fusion écarquillés tandis qu'elle lutte non contre une rivale, mais contre la montagne elle-même abattue sur vous.#!"
  lv_firewyrm_duel.0001.desc.counter.rockfall_roar:0 "\n\n#medium La vouivre pousse un rugissement guttural qui résonne à travers les parois de la caverne, ou les ruines, ou quel que soit le cimetière où vous combattez. Avec lui vient un tremblement. Les pierres craquent et les plafonds gémissent. Une section de la terre même cède, s'effondrant en poussière et décombres. Vous êtes forcé de fuir vers le haut ou d'être enseveli.#!"

  lv_firewyrm_duel.0001.molten_slough:0 "Mue ta peau, brûle plus fort ! Que rien ne te perce !"
  lv_firewyrm_duel.0001.tt.molten_slough:0 "[fd_round_me_dragon.GetName] mue ses écailles en fusion, se couvrant d'une nouvelle couche d'armure brûlante et cautérisant toutes les blessures qu'elle avait dans le processus."
  lv_firewyrm_duel.0001.tt.molten_slough.effect:0 "Une armure en fusion enveloppe la vouivre de feu, annulant toutes les attaques de feu et infligeant des dégâts de brûlure significatifs pour tout contact."
  lv_firewyrm_duel.0001.desc.molten_slough:0 "\n\n#medium Votre vouivre convulse sous vous avec un son de montagnes qui se brisent. Son dos s'arque, les écailles craquant et pelant en plaques de chair brûlante. Des morceaux de peau fumante glissent, s'écrasant au sol en tas incandescents. De la ruine émerge une bête renaissante, luisant de lumière en fusion, ses blessures cautérisées, chaque souffle un souffle de fournaise. La chaleur s'élevant de son corps brûle votre peau même à travers la selle, comme si vous chevauchiez maintenant non une créature, mais le cœur vivant de la terre elle-même.#!"
  lv_firewyrm_duel.0001.desc.counter.molten_slough:0 "\n\n#medium Avec un soulèvement guttural, la vouivre de feu arque son dos, et se fend. La chair croûtée et les écailles calcinées se déchirent, tombant au sol comme une armure en fusion. Elle rugit, nouvellement luisante, à moitié brûlée et plus terrifiante qu'avant. Ses blessures se ferment dans un sifflement de vapeur, et le feu dans sa gorge brûle encore plus fort.#!"

  lv_firewyrm_duel.0001.berserk_charge:0 "Toute ta force, [fd_round_me_dragon.GetName] ! Brise-la ou brise-toi !"
  lv_firewyrm_duel.0001.tt.berserk_charge:0 "[fd_round_me_dragon.GetName] charge en avant dans une attaque aveugle et furieuse, essayant de piétiner [fd_round_opponent_dragon.GetName]."
  lv_firewyrm_duel.0001.desc.berserk_charge.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre explose en avant avec un hurlement qui fait tomber la pierre des falaises, son corps un char de muscle et de rage en fusion. Elle s'écrase sur l'autre vouivre avec une telle force que la terre elle-même se fend, griffes et dents déchirant sans souci pour sa propre peau. Les deux bêtes se tordent dans une tempête de violence, l'air empli de fumée, de sang et de fureur déchaînée.#!"
  lv_firewyrm_duel.0001.desc.berserk_charge:0 "\n\n#medium Votre monture explose en mouvement, plus une bête mais une avalanche vivante de fureur. Elle s'écrase sur le flanc du dragon avec une force à briser les os, écailles et tendons volant en éclats sous la charge. Le dragon hurle, chancelant sous l'assaut, tandis que votre vouivre griffe et déchire comme si elle voulait faire tomber le ciel avec elle.#!"
  lv_firewyrm_duel.0001.desc.berserk_charge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre se jette tête la première sur la bête incandescente, frappant de tout le poids téméraire de sa fureur. Mais la chair en fusion n'est pas de la chair du tout. Le moment de l'impact devient un cataclysme : les griffes de votre vouivre grésillent, sa peau se boursouflant contre la fournaise qu'elle pensait écraser. Les deux bêtes chancellent, hurlant, le champ de bataille illuminé dans une tempête de flamme et d'agonie née de la rage entrant en collision avec le feu incarné.#!"
  lv_firewyrm_duel.0001.desc.berserk_charge.miss:0 "\n\n#medium Avec un rugissement qui pourrait renverser des montagnes, votre vouivre charge, ses yeux en fusion fixés sur le dragon au-dessus. Elle s'écrase à travers fumée et pierre brisée, griffes labourant vers le ciel, mais le dragon est déjà en vol, ailes l'emportant juste hors de portée. La charge se termine en ruine : votre bête laboure la terre, soulevant une tempête de poussière et de cendres, sa fureur intacte, sa proie intouchée.#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge.firewyrm_vs_firewyrm:0 "\n\n#medium Un rugissement fend la brume, et avant que vous ne puissiez vous arc-bouter, l'autre vouivre est sur vous, une force irrésistible de sang et de haine. Elle s'écrase sur votre monture avec un impact dévastateur, griffes déchirant, mâchoires dévorant avec un abandon suicidaire. Le choc manque de vous arracher de la selle tandis que les deux bêtes se débattent dans un maelström de rage et de ruine.#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge:0 "\n\n#medium Ensanglantée, à moitié folle, et hurlante, la vouivre charge, rien de calculé, rien de sain. Ses yeux luisent comme des braises fendues. Elle jette tout son corps monstrueux dans le combat, ignorant flamme et griffes. Vous voyez un coup venir que vous ne pouvez éviter. Le seul réconfort est ceci : elle pourrait se détruire en essayant de vous détruire.#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium La bête chargeant s'écrase tête la première sur la forme en fusion de votre vouivre, sa fureur entrant en collision avec le feu vivant. L'impact se retourne instantanément, brûlant sa propre chair tandis que griffes et crocs ne trouvent aucune prise sinon la flamme. Votre vouivre tient bon, luisant comme une fournaise, tandis que son attaquant hurle d'agonie, boursouflée, brûlée, défaite par sa propre rage berserk.#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss:0 "\n\n#medium Avec un mugissement qui fend l'air épais de cendres, la vouivre de feu charge, aveuglée par la fureur, indifférente à la douleur. Elle fonce à travers pierre brisée et ruine fumante, ses yeux en fusion fixés là où vous étiez il y a quelques instants. Mais vous êtes déjà en vol, votre dragon tournoyant haut au-dessus. La bête s'écrase en avant sous vous, ses griffes creusant des tranchées dans la terre tandis qu'elle rage contre le ciel. Il n'y a plus de pensée en elle maintenant, seulement la ruine laissée derrière par une frappe qui n'atteint jamais.#!"


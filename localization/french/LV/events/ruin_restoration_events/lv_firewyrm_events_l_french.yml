l_french:
  trait_firewyrm:0 "Veur de Feu"
  trait_firewyrm_desc:0 "Parents tordus des dragons, les veurs de feu ne connaissent ni grâce ni cieux. Ils rampent depuis les profondeurs de la terre, nés de pierre en fusion et de démence, façonnés par la chaleur et le temps en abominations crachant le feu. Là où les dragons inspirent la crainte, les veurs ne laissent que ruines calcinées et morts asphyxiées par la fumée."

  # GUI
  HOLDING_VIEW_FIREWYRM:0 "Veur de Feu"

  # Firewyrm Events
  lv_firewyrm_event.0001.t:0 "La Chose qui Brûle"
  lv_firewyrm_event.0001.desc:0 "Les ruines gémissent sous le poids des âges, mais ce n'est ni le temps ni les tremblements qui ébranlent le sol sous vos pieds. Un cri — non, un hurlement — fend l'air saturé de cendres comme une lame. Et puis il arrive. Surgissant d'un gouffre de pierre craquelée et de souffle fondu, le veur de feu s'abat sur la ruine tel un démon échappé des anciens grimoires valyriens.\n\nCe n'est pas un dragon. Ses écailles sont dentelées, couvertes d'ampoules, à moitié fondues. De la fumée siffle depuis les évents le long de son échine serpentine, son souffle un brasier caustique qui noircit les pierres mêmes qu'il foule. Ses yeux — dieux, ses yeux — sont de lave en fusion, telles des plaies ouvertes, et il se meut avec une faim qui n'a rien d'instinctif et tout de la pure malveillance.\n\nMême les dragons craignaient les veurs de feu, dit-on. Et ce qui vous fait face maintenant n'est nulle relique docile. C'est un vestige tordu de la folie valyrienne, une créature née non seulement du feu, mais de la démence elle-même.\n\nVous n'avez que quelques instants pour choisir — combattre la bête et peut-être devenir légende... ou fuir, en espérant que les ruines se montrent clémentes."
  lv_firewyrm_event.0001.duel.dragon:0 "[dragon.GetName] ! Aderī !"
  lv_firewyrm_event.0001.duel.dragon.tt:0 "Vous appelez rapidement votre dragon et vous préparez à affronter la bête."
  lv_firewyrm_event.0001.duel:0 "L'acier et le feu, alors. Que les dieux en soient témoins."
  lv_firewyrm_event.0001.duel.tt:0 "Vous tenez bon et tentez de terrasser le veur de feu."
  lv_firewyrm_event.0001.flee:0 "Ce n'est pas un ennemi fait pour les vivants. Nous fuyons."
  lv_firewyrm_event.0001.flee.tt:0 "Vous décidez de fuir, abandonnant le veur de feu à son repaire."

  lv_firewyrm_spawned_tooltip:0 "Un veur de feu a établi son repaire dans la région."
  lv_firewyrm_cleared_tooltip:0 "Le repaire dans [lair_location.GetName] est désormais nettoyé."

  lv_firewyrm_event.0100.t:0 "Une Ombre Levée sur [former_lair.GetNameNoTooltip]"
  lv_firewyrm_event.0100.desc:0 "L'ombre qui planait jadis sur ce lieu s'est dissipée. Le veur de feu qui tenait ces terres sous sa coupe — bête, terreur et flamme vivante — n'est plus là pour régner dans sa fureur ignée. L'air lui-même semble plus léger sans sa chaleur et sa haine pesant sur tout. Qu'il ait été abattu au combat, plié à votre volonté, ou attiré ailleurs par les appétits qui poussent de tels monstres, le résultat demeure le même : la voie s'ouvre devant vous, libre de sa domination."
  lv_firewyrm_event.0100.a:0 "[former_lair.GetNameNoTooltip] repose à nouveau en paix."

  ## Firewyrm Duel Events
  lv_firewyrm_duel.0001.t.firewyrm_vs_firewyrm:0 "Braises Contre Braises"
  lv_firewyrm_duel.0001.t:0 "La Cendre Rencontre la Flamme"
  lv_firewyrm_duel.0001.desc.firewyrm_vs_firewyrm:0 "#medium La terre tremble sous les griffes de votre monture, chaque pas fracassant la pierre et projetant des volutes de poussière vers les cieux. De l'autre côté du terrain brisé, l'autre veur de feu se dresse pour vous affronter — son regard de lave se verrouillant avec celui de votre propre bête. Il n'y a nulle parenté ici, seulement la faim, seulement la rage, tandis que l'air se charge de la promesse du feu et de la ruine.\n\nIl s'arrache de la ruine tel un éclat de terre déchiré, sa peau en fusion dégoulinant de chaleur à chaque mouvement. Pas d'ailes. Pas de majesté. Juste une fournaise de rage enveloppée d'écailles craquelées et de fumée. Là où votre veur est chair liée au feu, celui-ci est feu délié, un enfer rival luttant contre la laisse de son propre corps.\n\nVotre veur de feu gronde profondément, le son roulant comme de la pierre s'effondrant dans l'obscurité d'une caverne. L'autre répond en écho — non par un rugissement, mais par un hurlement comme du fer se déchirant, fou et insoumis."#!"
  lv_firewyrm_duel.0001.desc.firewyrm_duel:0 "#medium Votre bête se love et martèle le paysage, son corps fondu sifflant avec des évents de fumée et de braises. Pas d'ailes pour commander les airs — seulement des griffes pour commander le sol, seulement le feu pour défaire ce qui se dresse devant elle. Là où le dragon au-dessus est le feu fait forme et vol, votre veur est le feu enchaîné à la terre, une bête de ruine brute qui ne ploiera pas. Votre veur de feu beugle, un tonnerre grondant qui secoue la pierre craquelée. Au-dessus, le dragon répond, son rugissement vaste comme le ciel, un défi lancé depuis le firmament lui-même.#!"
  lv_firewyrm_duel.0001.desc:0 "#medium Le sol crépite sous les serres de votre monture tandis que votre dragon atterrit, ailes se repliant comme des nuages d'orage à travers le ciel fracassé. Devant vous gît le veur de feu — ni intimidé, ni curieux, mais affamé.\n\nIl se tord hors du puits en ruines tel un être né de fumée et de tourment, sa peau fondue fumant à chaque mouvement. Pas d'ailes. Pas de grâce. Juste une fureur dentelée et des écailles boursouflées, laissant échapper de la fumée depuis les évents et fissures le long de son échine. Là où un dragon est le feu fait chair, cette créature est le feu fait mal.\n\nVotre dragon grogne sourdement, un son qui fait trembler la pierre noircie. Le veur répond — non par un rugissement, mais par un cri qui glace le sang, défiant et démentiel.#!"
  lv_firewyrm_duel.0001.desc.valyria:0 "#medium Ici, au cœur fumant de Valyria, deux monstres se rencontrent.#!\n\n"
  lv_firewyrm_duel.0001.desc.lyria:0 "#medium Ici, sur les falaises écroulées d'Epaekros, où la terre glisse et le ciel brûle, deux monstres vont danser.#!\n\n"
  lv_firewyrm_duel.0001.desc.lokiria:0 "#medium Ici, sous l'ombre étouffante de Gaelithox, deux monstres se rencontrent dans une brume de flammes et de fureur.#!\n\n"
  lv_firewyrm_duel.0001.desc.lands_of_the_long_summer:0 "#medium Ici, où la chaleur de l'été ne s'évanouit jamais et où le souffle de la vieille Valyria persiste encore, deux monstres se croisent dans une défiance calcinée.#!\n\n"
  lv_firewyrm_duel.0001.desc.elsewhere:0 "#medium Ici, loin des ossements de Valyria, deux terreurs antiques se rencontrent comme attirées par le destin seul.#!\n\n"
  lv_firewyrm_duel.0001.desc.final:0 "#medium Vos mains se resserrent sur les rênes. Un souffle, un mot, et le ciel s'embrase.#!"
  lv_firewyrm_duel.0001.a:0 "[dragon.GetName], dracarys !"
  lv_firewyrm_duel.0001.b:0 "Sōvēs, [dragon.GetName] !"

  # Defeat
  lv_firewyrm_duel.0003.t:0 "Calciné des Cieux"
  lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe veur face à vous s'était figé — ses yeux de lave se rétrécissant, sa poitrine se contractant. Le vôtre bougea sous vous, inquiet, incertain. Et puis l'ennemi frappa.\n\nIl bondit sans avertissement, sans bruit, mais avec le feu fait chair. Un jet de souffle brûlant déchira l'air entre vous, plus rapide que la pensée. Votre monture rugit en défiance, mais la fournaise saisit sa tête et ses épaules, faisant éclater écailles et chair ensemble.\n\nVous avez senti la chaleur avant de sentir la douleur — le cuir se transformant en liquide, la peau en cendres. Le veur de feu sous vous s'effondra dans la ruine de lui-même, et vous avec lui, disparu à l'instant où les flammes touchèrent l'os.#!"
  lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe dragon virevolta haut dans les airs, silencieux hormis le bruit des ailes. Votre veur de feu se cabra, gueule s'ouvrant, mais l'ombre au-dessus tombait déjà.\n\nLe ciel se fissura avec sa frappe — des serres comme des faux, des crocs comme des lances. L'impact plaqua votre monture au sol, un coup trop soudain, trop précis pour résister. Les écailles se brisèrent. Les os s'effondrèrent. Le sol se fendit sous le poids du dragon et du veur réunis.\n\nVous avez tenté de vous relever, mais il n'y eut pas de relèvement. La fureur du dragon vous cloua où vous étiez assis, votre veur de feu brisé sous vous. La dernière chose que vous vîtes fut ses ailes masquant la lueur du feu — avant que les ténèbres ne vous engloutissent tout entier.#!"
  lv_firewyrm_duel.0003.desc.sudden_strike:0 "#medium Il n'y eut aucun avertissement — seulement le mouvement.\n\nUn instant, votre dragon cercle dans l'air chargé de cendres, déchiffrant les mouvements étranges et bouillonnants de la créature. L'instant suivant, le veur de feu surgit vers le haut avec une vitesse impossible, un flou d'écailles cramoisies et de fumée brasillante. Un rugissement fendit le ciel — non, pas un rugissement, un hurlement, un cri, une chose sans origine — et puis le monde bascula.\n\nLe coup frappa sous l'aile de votre dragon, une claque sauvage qui fracassa rythme et équilibre. Le ciel chavira de côté. Vous vous souvenez du silence soudain de la chute, de la ruée brûlante de l'air, de l'éclair de douleur blanche et ardente.\n\nVous et votre dragon ne touchâtes même jamais le sol.#!"

  lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe veur de feu d'en face se souleva, poitrine gonflant comme une fournaise au point de rupture. Durant un instant, l'air s'épaissit — la chaleur montant, les cendres flottant immobiles. Puis il lâcha tout.\n\nLe souffle qu'il libéra ne fut nulle flamme ordinaire, mais une cataracte de ruine blanche et ardente, assez fondue pour embraser l'air même. Votre veur de feu rugit en retour, gueule grande ouverte, mais le souffle écrasa sa défiance, dévorant le son avant qu'il ne naisse.\n\nVous et votre monture ne fîtes qu'un en cet instant — pris dans une unique vague de feu qui défit tout ce qu'elle touchait. Il n'y eut ni chute, ni lutte. Seulement la flamme se refermant sur vous, absolue et finale.#!"
  lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe dragon au-dessus ne rugit pas, ne vira pas. Il ouvrit simplement ses mâchoires, et le monde devint lumière.\n\nLe premier souffle vous aveugla — une brillance brûlante qui engloutit terre et ciel ensemble. Votre veur de feu se cabra en défiance, ses écailles fondues brillant plus fort, mais rien ne résiste au feu de dragon. Le torrent se déversa comme un jugement, calcinant pierre et chair, acier et os.\n\nVotre monture se débattit une fois sous vous avant de s'effondrer en braises. Les rênes se consumèrent dans vos mains. Le cri dans votre gorge ne quitta jamais vos lèvres. Il n'y eut nulle échappatoire, nulle pitié. Seulement le feu, et le silence après.#!"
  lv_firewyrm_duel.0003.desc.dragonfire:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe veur de feu était resté immobile — trop immobile. Ses yeux de lave vous suivaient comme en attente, calculant. Et puis il ouvrit ses mâchoires, larges et dentelées comme une caverne brisée, et le monde devint flamme.\n\nUn torrent de feu jaillit vers le haut en un geyser de courroux blanc et ardent. Votre dragon tenta de virer, tenta de s'élever — mais l'enfer le rattrapa en plein vol, engloutissant ailes, écailles et cavalier dans une unique fournaise hurlante. Le ciel bouillonna autour de vous. Les sangles de la selle se consumèrent en cendres. L'air même se retourna contre vous, un vent de braises et de cendres.\n\nVous ne tombâtes pas. Vous disparûtes — consumé avant même de pouvoir crier.#!"
  
  lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_firewyrm:0 "#medium Vous vîtes le moment où il bondit.\n\nLe veur rival ne brûla ni ne rugit — il se projeta en avant, une montagne de muscle et de peau fondue. Votre propre monture beuglat, se préparant, mais l'impact vous plaqua tous deux dans la pierre.\n\nLe sol se brisa sous le poids. La roche dentelée déchira les écailles. Votre veur de feu se débattit, son armure fondue flamboyant, mais l'autre pressa plus fort, plus lourd, une avalanche de chair et de fureur. Ses mâchoires se refermèrent autour du cou de votre bête, la forçant vers le bas, broyant jusqu'à ce que l'air quitte sa poitrine.\n\nVous hurlâtes des ordres, mais votre veur ne put se relever. Son cœur tressauta sous vous, plus lent, plus faible — jusqu'à ce qu'il s'arrête. La pression écrasa le souffle de vos poumons également. Les ténèbres vinrent tandis que la terre se refermait.#!"
  lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_dragon:0 "#medium Vous vîtes l'ombre masquer le ciel.\n\nLe dragon plongea comme une lance de flamme vivante, ailes repliées, yeux fixés. Votre veur de feu se cabra pour l'affronter, mais la frappe fut plus rapide, plus lourde — imparable. Les deux se heurtèrent dans un coup de tonnerre, et vous fûtes arraché de l'équilibre tandis que votre monture était précipitée au sol.\n\nLa terre se fendit sous l'impact du dragon. Des serres clouèrent la chair fondue, des griffes s'enfonçant à travers l'armure jusqu'à l'os. Votre veur se tordit, ses écailles fondues brillant plus fort, mais chaque soubresaut ne rencontra que plus de poids, plus de puissance.\n\nLe rugissement du dragon noya le monde tandis qu'il pressait vers le bas, les os craquant sous son emprise. Les luttes de votre monture faiblirent... puis cessèrent. Vous sentîtes le dernier tremblement sous vous avant que la lumière ne quitte ses yeux. Puis le regard du dragon se tourna vers vous — et il n'y eut plus nulle part où aller.#!"
  lv_firewyrm_duel.0003.desc.driven_to_ground:0 "#medium Vous vîtes l'instant où cela tourna.\n\nLe veur de feu se lova, non pour reculer, mais pour s'élever — impossiblement rapide pour quelque chose de sa taille. Puis vint le bond, toute fureur et masse, et avant que votre dragon ne puisse dégager les airs, il était sur vous.\n\nLe monde bascula de côté. Griffes et cendres et douleur. Le poids entier de la bête s'écrasa comme une montagne tombante, et votre dragon hurla — un cri terrible et gargouillant qui secoua vos os même tandis qu'ils se brisaient avec [fd_loser_dragon.Custom('GetDragonHerHim')]. Les ailes se tordirent. Les côtes se rompirent. Le sol se creusa.\n\nCloué sous la masse du veur de feu, votre dragon se tordit une fois... puis plus. Vous sentîtes tout — le dernier battement de cœur, le dernier soubresaut de résistance — avant que la pierre ne monte à la rencontre de votre crâne.#!"

  lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_firewyrm:0 "#medium Vous donnâtes l'ordre. Votre veur bondit, armure fondue flamboyant, chaque muscle tendu pour le massacre.\n\nMais l'autre fut plus rapide.\n\nIl se tordit sous le poids de votre bête, se lovant avec une précision contre nature, et ses griffes frappèrent vers le haut — longues, noircies, brûlantes. L'une raya la poitrine de votre veur. La seconde déchira plus profond, tranchant à travers chair et tendons rouge-fournaise.\n\nLe son fut humide, déchirant, insupportable. Votre veur de feu hurla, du sang fondu se déversant en torrent qui fumait contre la pierre. La lueur dans son corps vacilla comme une forge mourante.\n\nVous vous agrippâtes l'espace d'un battement de cœur, refusant d'y croire — mais votre monture s'affaissa sous vous, ses entrailles se répandant sur la terre en filaments luisants. Son dernier rugissement fit vibrer vos os avant qu'il ne s'effondre, vous laissant brisé au sommet d'un cadavre qui fut jadis le feu incarné.#!"
  lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_dragon:0 "#medium Vous donnâtes l'ordre. Votre veur obéit, se cabrant avec une fureur fondue, mais le dragon l'affronta de plein fouet.\n\nLe ciel se fendit avec la collision, puis vinrent les griffes — des serres tranchantes comme des rasoirs, menées avec une précision infaillible. Elles tranchèrent la peau fondue, séparant écailles et cicatrices comme si elles n'étaient rien.\n\nUn unique cri déchira votre monture tandis que le dragon arrachait vers le bas. La chair céda. Les entrailles jaillirent dans un déluge fumant et vaporeux, se répandant sur le champ de bataille. La puanteur de fer et de feu submergea l'air.\n\nVotre veur trébucha, poitrine évidée, son grand corps se soulevant une fois avant que la lumière dans ses yeux de lave ne se ternisse en cendres. Vous fûtes projeté en avant dans sa ruine — dans l'épave fumante de ce qui avait été votre seul bouclier.#!"
  lv_firewyrm_duel.0003.desc.disemboweled:0 "#medium Vous donnâtes l'ordre. Vous vous penchâtes en avant dans la selle, et votre dragon obéit — brave, rapide, loyal.\n\nMais ce ne fut pas suffisant.\n\nLe veur de feu surgit avec une vitesse contre nature, se dérobant sous votre frappe et vous affrontant non avec des flammes mais avec des griffes — longues, noircies, et brûlantes d'ardeur. L'une déchira les écailles de votre dragon comme du parchemin. La seconde trouva prise plus profond encore.\n\nUn son horrible suivit — un cri déchirant et humide qui ne fut ni celui de votre dragon ni le vôtre. Des entrailles se déversèrent dans le ciel saturé de cendres comme de la vapeur d'une forge rompue. L'odeur de sang, fondu et épais, submergea même le soufre et la fumée.\n\nVous vous agrippâtes l'espace d'un battement de cœur encore, regardant les yeux de votre dragon s'assombrir tandis qu'elle fléchissait en plein air — une créature de majesté, défaite non par le feu, mais par la sauvagerie brute d'une bête qui ne devrait pas être.#!"

  lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_firewyrm:0 "#medium Le ciel brûla d'une lumière fondue.\n\nVotre ordre fut net, votre veur bondissant en avant avec une fureur de fournaise — mais l'autre bougea comme un prédateur né pour le massacre seul. Ses griffes frappèrent en un flou, acier noirci contre magma vivant.\n\nUne fois. Deux fois. Encore. Une frénésie de coups qui déchiqueta chair et tendons luisants. Votre veur de feu convulsa, du sang fondu aspergeant le sol en rivières qui sifflèrent et fumèrent.\n\nVous hurlâtes l'ordre, le suppliant de combattre, mais la taillade meurtrière était déjà venue — le ventre ouvert, les entrailles luisantes se déversant comme de la scorie d'un creuset brisé. Le cri de la bête faiblit, s'assombrissant en un grondement creux tandis qu'elle s'effondrait sous vous.\n\nLe veur rival ne s'arrêta pas. Il déchira et lacéra avec une malveillance implacable, jusqu'à ce que tout ce que vous sentiez fût la ruine tremblante de votre monture se désagrégeant sous votre selle. Le dernier son fut son hurlement triomphant, résonnant sur un champ de bataille jonché de cendres et de carnage.#!"
  lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_dragon:0 "#medium Le ciel était rouge de feu et de ruine.\n\nVotre ordre retentit, votre veur surgissant en avant — écailles fondues flamboyant — mais le dragon frappa avec une fureur chirurgicale. Ses serres taillèrent à travers la poitrine blindée de votre bête, déchirant chair et écailles avec une précision horrifiante.\n\nUne griffe. Deux. Un ratissage sauvage à travers le ventre. Le rugissement de votre veur devint un gargouillis étouffé, sang fondu et entrailles jaillissant dehors en un torrent qui embrasa le sol de feu fumant.\n\nVous criâtes, vous tirâtes, vous luttâtes pour tenir la selle — mais votre monture était déjà brisée. Ailes brisées, côtes fracassées, son corps convulsa en spasmes d'agonie fondue.\n\nLe dragon ne se relâcha pas. Il déchiqueta ce qui restait — arrachant poitrine de gorge, tendons d'os — jusqu'à ce que votre veur de feu gise en ruine, organes luisants éparpillés sur le champ de bataille. Vous n'eûtes pas le temps de tomber. Vous fûtes simplement enseveli dans sa ruine.#!"
  lv_firewyrm_duel.0003.desc.eviscerated:0 "#medium Le ciel est rouge de feu et de sang.\n\nVotre ordre fut audacieux, mais la bête le fut davantage. Le veur de feu bondit avec un cri comme du métal se déchirant, frappant non avec fureur mais avec dessein. Ses serres s'enfoncèrent profond — une fois, deux fois, une rafale de coups sauvages qui déchirèrent écailles, peau et chair ensemble.\n\nVotre dragon se débattit en agonie, ailes faiblissant, souffle se figeant à mi-rugissement. Vous vous agrippâtes, criant, exhortant — mais c'était déjà trop tard. Une dernière taillade brutale fendit son ventre, et son cri fut coupé net tandis que sang et feu jaillirent dans l'air.\n\nLe veur ne s'arrêta pas.\n\nIl griffa et lacéra et lacéra encore, une frénésie de haine faite chair. Vous ne vîtes que des éclairs — le claquement d'une aile, le déchirement d'une gorge, votre selle se déformant sous vous tandis que le corps brisé de votre dragon spirala dans la ruine.\n\nLa dernière chose que vous voyez est le veur de feu, luisant de carnage, hurlant son triomphe à un ciel qui n'oubliera jamais cette boucherie.#!"

  lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_firewyrm:0 "#medium Certains monstres ne devraient jamais naître.\n\nLe veur devant vous éclipse même votre propre monture — une fournaise colossale de chair et de fureur, écailles craquelées comme de la pierre volcanique, yeux brûlant d'une lumière impie. Votre veur de feu, fier et fondu, tremble en sa présence. L'instinct parle plus fort que l'ordre : ce n'est ni une proie, ni un rival, mais l'extinction faite forme.\n\nPuis il bouge.\n\nLe monde frémit tandis que le veur géant s'abat, griffes clouant votre bête comme si elle n'était rien de plus que charogne. Vous criez, votre monture se débat, mais la lutte ne dure que quelques battements de cœur.\n\nLes mâchoires descendent — vastes, fumantes, terribles. D'un unique craquement, la moitié de votre veur de feu disparaît, cisaillée dans une ruine d'os fracassés. Son cri est réduit au silence dans un jet de sang fondu, et avant que vous ne puissiez reprendre souffle, le reste de votre monture est traîné hurlant dans l'abîme de sa gorge.\n\nVous êtes toujours sanglé.\n\nLa chaleur vous engloutit entier. Ténèbres, feu, sang — puis l'oubli.#!"
  lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_dragon:0 "#medium Certaines batailles ne sont jamais faites pour être gagnées.\n\nLe dragon se dresse au-dessus, titanesque en taille — une légende de crocs et d'ailes, son ombre masquant le ciel même. Comparé à lui, votre veur de feu est une torche vacillante devant un soleil rageur. Même votre bête le sait, tremblant sous votre emprise tandis que l'air même tremble au souffle du léviathan.\n\nPuis il frappe.\n\nLe dragon descend comme une montagne tombante, griffes déchirant la chair de votre veur avec une facilité cruelle. Vous criez l'ordre, mais ce n'est rien — votre monture est clouée, écrasée, impuissante sous un prédateur plus ancien et plus grand que tout cauchemar.\n\nLa gueule s'ouvre, large comme une caverne, bordée de crocs faits pour des dieux, non des bêtes. Et d'une unique morsure, votre veur de feu est pris entier, arraché de sous vous dans un jet de carnage fondu.\n\nVous êtes toujours sanglé.\n\nLes mâchoires se referment. Ténèbres. Sang. Chaleur. La dernière chose que vous sentez est le craquement — la fin de vous, et la fin de votre veur, consumés dans le silence.#!"
  lv_firewyrm_duel.0003.desc.chomp:0 "#medium Certains monstres n'étaient pas faits pour être affrontés.\n\nLe veur de feu se dresse — une chose montagneuse de peau calcinée et de souffle fondu, bien plus grande que toute bête que vous avez combattue ou rêvée. Votre dragon cercle prudemment, flamme léchant [fd_loser_dragon.Custom('GetDragonHerHis')] mâchoires, mais il y a de l'hésitation maintenant. Une pause. Une terreur instinctive qui parle d'une vérité plus profonde : cette chose n'est pas parente. Elle est la ruine faite chair.\n\nPuis elle bondit.\n\nIl n'y a ni cri, ni rugissement — seulement l'impact. En un instant, votre dragon est arraché du ciel, cloué et écrasé sous le poids du veur. Vous criez, tirant votre lame, mais c'est inutile. Vous êtes inutile.\n\nLa gueule s'ouvre, vaste et fumante — et avec un craquement écœurant d'os et d'écailles, votre dragon disparaît dans sa gorge.\n\nVous êtes toujours sanglé.\n\nLa chaleur est insupportable. Tout n'est que sang, feu, ténèbres.\n\nEt puis plus rien.#!"

  lv_firewyrm_duel.0003.a.sudden_strike:0 "Nous... n'avons jamais eu la moindre chance."
  lv_firewyrm_duel.0003.a.tt.sudden_strike:0 "Votre bête est abattue d'un unique coup imprévu."

  lv_firewyrm_duel.0003.a.dragonfire:0 "La lumière arriva trop vite... trop brillante."
  lv_firewyrm_duel.0003.a.tt.dragonfire:0 "Vous et votre bête êtes engloutis dans les flammes, incapables d'échapper à l'enfer."

  lv_firewyrm_duel.0003.a.driven_to_ground:0 "Envole-toi — ! Non... non, non, non —"
  lv_firewyrm_duel.0003.a.tt.driven_to_ground:0 "Vous et votre bête êtes plaqués au sol, écrasés par l'impact brutal."

  lv_firewyrm_duel.0003.a.disemboweled:0 "Non, [fd_loser_dragon.GetName] ! Tiens — TIENS ! Je t'en prie — !"
  lv_firewyrm_duel.0003.a.tt.disemboweled:0 "Votre bête est éventrée par les griffes de l'ennemi, et vous regardez impuissant tandis que vous tombez tous deux."

  lv_firewyrm_duel.0003.a.eviscerated:0 "Déchire-nous alors — si tu le dois."
  lv_firewyrm_duel.0003.a.tt.eviscerated:0 "Votre bête est éviscérée, et bientôt vous la suivez."

  lv_firewyrm_duel.0003.a.chomp:0 "Argh ! Non, non —"
  lv_firewyrm_duel.0003.a.tt.chomp:0 "Vous et votre bête êtes dévorés d'une unique morsure brutale."

  # Victory
  lv_firewyrm_duel.0004.t:0 "Dans le Sillage de l'Enfer"

  lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_firewyrm:0 "#medium L'air est épais de cendres — mais seulement l'espace d'un battement de cœur.\n\nVotre veur de feu se love, puis se lance avec une vitesse impossible. Le veur rival n'a pas le temps de se cabrer ou de cracher son souffle de fournaise avant que votre bête ne soit sur lui.\n\nLa frappe est sans pitié. Les serres s'enfoncent dans crâne et échine, les mâchoires se refermant avec une force volcanique. Le rival s'effondre à mi-rugissement, son feu mourant dans sa gorge.\n\nIl tombe en silence, une montagne de chair brisée en un instant.\n\nLa victoire ne vint pas de l'endurance, mais de la précision.#!"
  lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_dragon:0 "#medium La tempête d'ailes du dragon s'interrompt — mais seulement l'espace d'un battement de cœur.\n\nVotre veur de feu bondit, plus rapide qu'aucun œil de dragon ne peut le suivre, et saute assez haut dans les airs pour intercepter la créature aérienne. Un instant la bête se cabre, mâchoires luisant de flammes ; l'instant suivant, elle est abattue.\n\nDes griffes lacèrent sa gorge, des crocs écrasant l'os avant qu'un seul souffle ne puisse quitter sa poitrine. Le dragon convulse une fois, deux fois, puis s'effondre — son feu éteint avant qu'il ne puisse brûler.\n\nIl meurt en silence, dépouillé de gloire, sa majesté terminée par un unique coup parfait.\n\nLa victoire fut plus rapide que la pensée, plus tranchante que la flamme.#!"
  lv_firewyrm_duel.0004.desc.sudden_strike:0 "#medium Le vent se calme — mais seulement l'espace d'un battement de cœur.\n\nVotre dragon bouge le premier. Un virage sec des ailes, une spirale descendante — puis une rafale impossible de vitesse. Avant que le veur de feu ne puisse hurler, se lover, ou vomir son feu infernal, votre dragon est déjà sur lui.\n\nLes griffes frappent juste — un coup sauvage au crâne, ou à la gorge, ou à la base de l'échine — et le veur s'effondre comme de la scorie versée sur pierre froide.\n\nIl meurt sans gloire, sans rugissement, sans embrasement de fureur. Juste un effondrement. Un souffle volé. Et puis l'immobilité.\n\nLa victoire ne vint pas avec la lutte, mais avec la précision.#!"

  lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_firewyrm:0 "#medium Le ciel tremble tandis que votre veur de feu exhale la ruine.\n\nUn torrent de souffle fondu éclate, blanc et ardent, brûlant, inondant l'air d'une brillance aveuglante. Il s'abat sur le veur rival avec le poids d'une étoile tombante, noyant écailles et chair ensemble dans un enfer qui adhère comme du goudron.\n\nLa bête hurle — un son dentelé, mi-fureur, mi-terreur — tandis que son corps noircit et se fend, des fissures luisantes courant sur son armure. Elle se débat encore, bondissant en avant, mais le feu consume plus vite qu'elle ne peut bouger.\n\nLe sol fume sous sa chute, la pierre coulant comme de la cire.\n\nQuand les flammes meurent, rien ne demeure qu'une coque calcinée, fumant dans l'air cendré. Le feu d'un monstre a mis fin à un autre.#!"
  lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_dragon:0 "#medium Les cieux s'embrasent tandis que votre veur de feu inspire profondément et déchaîne l'enfer.\n\nLe souffle rugit en un déluge de flamme fondue, rouge-or et aveuglant, engloutissant le dragon avant qu'il ne puisse virer. Ses ailes fières se déploient, mais le feu adhère à chaque veine emplumée, chaque écaille, chaque souffle.\n\nIl hurle — un cri terrible, tonitruant — mais le feu ne cède pas. La fournaise dévore peau, muscle et os, ne laissant qu'une silhouette contre un ciel de fournaise.\n\nEnfin, le cri se brise, les ailes se repliant tandis que le dragon s'écrase vers la terre, traînant le feu comme un soleil tombant.\n\nCe qui s'élève après n'est que fumée, et silence. Le dragon gît immobile, cendres et braises là où la majesté planait jadis.#!"
  lv_firewyrm_duel.0004.desc.dragonfire:0 "#medium L'air brûle tandis que [fd_attacker_dragon.GetName] exhale la fureur.\n\nLe feu jaillit de ses mâchoires en un torrent de chaleur et de lumière, doré-rouge et aveuglant contre le ciel cendré. Il s'écrase sur le veur de feu comme une marée de jugement, engloutissant son corps tordu dans un enfer plus ancien que les rois. La créature hurle — un cri qui résonne moins comme la douleur et plus comme la rage niée — tandis que sa peau commence à se cloquer, noircir, peler.\n\nLa bête se débat sauvagement, les flammes adhérant à sa forme comme une malédiction. L'espace d'un battement de cœur, elle charge en avant — brûlant, à moitié aveugle, défiant jusqu'au bout — mais la flamme ne faiblit pas. La chaleur fait fondre la pierre sous elle.\n\nEt puis, le silence.\n\nSeules demeurent la fumée et la puanteur de viande calcinée. Le veur de feu s'immobilise — une coque fumante parmi les ossements du vieil empire.#!"

  lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_firewyrm:0 "#medium Le monde bascule tandis que votre veur de feu bondit avec une force terrifiante.\n\nAvec un rugissement qui fend l'air même, il s'écrase sur le veur rival, tout muscle et fureur fondue s'abattant comme un marteau. La terre se soulève sous l'impact, cendres et roche éclatant vers l'extérieur dans une tempête étouffante.\n\nL'ennemi hurle — non en triomphe, mais en choc — tandis qu'il est écrasé dans le sol, membres se brisant, anneaux s'agitant inutilement contre le poids. La terre même se fend sous ses convulsions, creusée et marquée par ses affres de mort.\n\nIl n'y a rien de gracieux ici. Seulement la sauvagerie. Votre veur de feu presse plus fort, fumée s'échappant de ses mâchoires, puis frappe — dents déchirant profond, jusqu'à ce que les cris du veur rival se brisent en silence et poussière.#!"
  lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_dragon:0 "#medium Votre bête ramène le combat au sol.\n\nVotre veur de feu se rue en avant dans une tempête de fureur, attrapant la queue du dragon à mi-virage et le traînant hors des airs comme une proie arrachée du vol. Le sol monte vite — puis le monde explose en poussière et feu tandis que les deux bêtes s'écrasent dans la terre.\n\nLe dragon crie, ailes se brisant sous le poids qui le cloue. Ses serres grattent et griffent, creusant des sillons dans la pierre, mais rien ne trouve prise. Le veur de feu se love plus serré, pressant vers le bas avec une force brute et brutale, jusqu'à ce que l'os craque et que la terre rougisse.\n\nIl n'y a nulle cérémonie dans le massacre. Nulle gloire. Seulement la domination. Un plongeon final de crocs réduit le dragon au silence pour toujours, ne laissant que sa forme brisée dans les cendres.#!"
  lv_firewyrm_duel.0004.desc.driven_to_ground:0 "#medium Le ciel rétrécit tandis que nous descendons.\n\nAvec un rugissement qui fait vibrer les os du monde, [fd_attacker_dragon.GetName] s'abat sur le veur de feu d'en haut — une force d'ailes, de serres et de fureur rencontrant chair brûlante et haine. Le sol tremble tandis que nous nous écrasons dans la terre calcinée, les cendres volcaniques éclatant vers l'extérieur comme une vague noire.\n\nLe veur de feu hurle — non de douleur, mais d'incrédulité — tandis qu'il est plaqué sous notre poids, cloué contre la pierre craquelée comme une bête chassée. L'une de ses pattes se tord dans un claquement écœurant, et son corps serpentin se débat, creusant de profonds sillons dans le sol marqué par la lave.\n\nIl n'y a nulle élégance au massacre. Seulement la domination brute. [fd_attacker_dragon.GetName] gronde, fumée s'échappant de ses narines, et se penche. Les crocs rencontrent l'os. Le dernier cri du veur de feu s'évanouit dans le vent saturé de cendres.#!"

  lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_firewyrm:0 "#medium Deux titans se tordent et s'écrasent ensemble, leurs anneaux frappant comme des tours tombantes. Avec un rugissement qui fait trembler les os, votre veur de feu frappe de côté, griffes creusant dans le ventre de son rival. Une fois, deux fois — puis plus profond, déchirant au-delà d'écailles et de peau.\n\nDu sang jaillit, fondu et rouge-noir, éclaboussant la pierre fracassée. Le veur blessé convulse, son corps serpentin se tordant violemment, creusant des tranchées dans les cendres. Mais il ne peut se libérer.\n\nVotre veur de feu frappe plus fort, serres accrochées, et arrache la bête en grand. De la vapeur s'élève du torrent d'entrailles se déversant dans la terre. Le rival donne un sifflement étranglé, puis s'immobilise — sa ruine exposée sur le sol calciné.#!"
  lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_dragon:0 "#medium L'acier rencontre la chair-feu tandis que le dragon bondit, ailes battant furieusement pour s'élever. Mais le veur de feu est plus rapide au sol — un enroulement soudain, une frappe, griffes déchirant son ventre.\n\nDu sang jaillit en jets de chaleur fondue, les ailes du dragon faiblissant tandis qu'il chancelle sous le coup. Il hurle, tranchant sauvagement, mais le veur ne relâche pas. Un autre ratissage de griffes, sauvage et précis, et son ventre se fend largement.\n\nLes entrailles cascadent sur la pierre, fumantes et fétides. Le dragon s'effondre en tas brisé, son feu s'éteignant avec un dernier rugissement sifflant. Le veur de feu se love au-dessus, victorieux, tandis que le champ de bataille rougit.#!"
  lv_firewyrm_duel.0004.desc.disemboweled:0 "#medium Acier, écailles et fureur se heurtent. Avec un cri furieux, votre dragon ratisse ses griffes sur le flanc du veur de feu — une fois, deux fois — puis se rue pour le massacre. Du sang comme du métal fondu jaillit des blessures de la bête, sifflant en touchant la pierre calcinée.\n\nLe veur de feu se débat, son corps musclé se tordant comme un serpent en flammes. Mais votre dragon ne relâche pas. Un dernier coup brutal ouvre le ventre du veur. Ses entrailles se répandent sur la terre brisée — vapeur s'élevant de la ruine de ce qui fut jadis un prédateur de cauchemars.\n\nLe veur de feu ne fait nul son en mourant, seulement une grande expiration tremblante qui sent le soufre et la pourriture ancienne.#!"

  lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_firewyrm:0 "#medium Leurs corps se heurtent avec un bruit de pierre se brisant. Les griffes brillent, les crocs claquent — puis votre veur de feu trouve sa marque. Il ratisse vers le bas, fendant à travers écailles fondues, déchirant au-delà de muscle et tendons jusqu'à ce que le ventre du rival béante largement.\n\nLa bête blessée convulse, vomissant feu et bile depuis la ruine de son ventre. Elle se tord, sifflant de fureur et de douleur, mais ne peut se libérer. Votre veur de feu creuse plus profond, traînant ses serres à travers la fournaise de son adversaire.\n\nUne dernière traction — chair et organes se déversent fumants sur le sol. Le rival frémit une fois, puis s'effondre dans le silence, son sang vital brûlant la terre où il tombe.#!"
  lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_dragon:0 "#medium Le dragon plonge, ailes fouettant le ciel saturé de cendres — mais le veur de feu se tord sous lui, un flou de muscle écaillé. D'une frappe soudaine il s'accroche, griffes s'enfonçant profond dans le ventre tendre.\n\nUne traction sauvage, et la peau du dragon se fend comme du tissu. Un rugissement d'agonie déchire sa gorge tandis que feu et sang jaillissent, pleuvant en arcs fondus. Il se débat, tentant de s'envoler, mais le veur tient bon, déchirant plus profond.\n\nD'une déchirure brutale les entrailles du dragon se libèrent, fumantes dans les cendres. Ses ailes faiblissent, son corps s'écrasant dans la terre calcinée en contrebas. Le veur de feu se dresse au-dessus de la ruine convulsive, victorieux, tandis que le silence noie le champ de bataille.#!"
  lv_firewyrm_duel.0004.desc.eviscerated:0 "#medium Les écailles rouge-acier se déchirent comme de la toile de voile pourrie.\n\nLes griffes de votre dragon ratissent profond, au-delà de la peau fondue et du muscle fumant, jusqu'à ce que le ventre du veur de feu soit ouvert. La bête hurle — non en défiance, mais en agonie — tandis que flamme et bile se déversent de l'entaille, son cœur-fournaise exposé à l'air frais saturé de cendres.\n\nElle se tord, se débattant contre la mort, mais votre dragon tient fermement. Une autre déchirure sauvage, un autre panache de carnage, jusqu'à ce que les luttes de la créature deviennent tremblements... puis, plus rien du tout.\n\nSes entrailles fument sur la terre brisée. Une terreur des profondeurs, défaite par croc et fureur.#!"

  lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_firewyrm:0 "#medium Il n'y a nul duel, nul combat. Seulement la faim.\n\nLe veur rival se love pour frapper — trop lent. Votre veur de feu bondit, mâchoires béant largement, et les referme autour du milieu de son adversaire. L'os craque. Les écailles se brisent. Le hurlement du serpent est coupé court, étouffé par la prison de crocs.\n\nIl se débat, à moitié avalé, queue fouettant de fureur. Mais votre veur de feu ne fait que mordre plus profond, gueule œuvrant avec une finalité obscène. En quelques instants le rival disparaît, traîné vers le bas en déglutitions humides, ses luttes s'évanouissant dans le silence.\n\nCe qui demeure est l'immobilité — et la puanteur lourde du sang dans l'air. Une terreur en a consumé une autre.#!"
  lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_dragon:0 "#medium Le dragon virevolte en hauteur, ailes fendant le ciel épais de cendres — mais il plonge trop bas. Le veur de feu surgit vers le haut, gueule béante, et le saisit d'un claquement tonitruant. Des serres battent follement, écailles grinçant contre crocs — mais la morsure du veur tient fermement.\n\nLes os gémissent. Les ailes se déchirent. Un rugissement étranglé résonne tandis que le dragon est secoué comme une proie, claqué dans la terre, puis soulevé à nouveau dans un jet de cendres et de sang. Les mâchoires du veur de feu œuvrent avidement, écrasant et avalant, indifférentes aux cris mourants de la bête.\n\nEnfin le dragon est brisé — une ruine traînée dans le gosier du veur. Le silence suit, brisé seulement par le sifflement d'écailles contre pierre. Le ciel est vide. Le veur de feu perdure.#!"
  lv_firewyrm_duel.0004.desc.chomp:0 "#medium Il n'y a nulle élégance en ceci — seulement la domination faite chair.\n\nLe veur de feu se cabre pour frapper, mais votre dragon bondit avec une finalité terrifiante. Des mâchoires comme des portes de château se referment autour de la bête, écrasant écailles volcaniques et tendons avec un craquement humide et broyant. Un cri étouffé se perd dans la gorge de votre dragon tandis qu'il lance le veur de feu comme de la charogne, gueule œuvrant avidement, gorge se gonflant.\n\nEn quelques secondes, l'horreur des ruines est réduite à une forme avalée, convulsant une fois tandis qu'elle glisse vers le néant.\n\nL'air se calme. La terre — jadis terrorisée — se tait sous l'ombre d'un véritable prédateur suprême.#!"

  lv_firewyrm_duel.0004.a.sudden_strike:0 "Rapide. Net. Terminé."
  lv_firewyrm_duel.0004.a.tt.sudden_strike:0 "Votre monture frappe avec une force soudaine et brutale, mettant fin à la vie de la bête en un unique coup."

  lv_firewyrm_duel.0004.a.dragonfire:0 "Brûle, créature abjecte !"
  lv_firewyrm_duel.0004.a.tt.dragonfire:0 "Votre monture déchaîne un torrent de feu, engloutissant la bête dans les flammes."
  
  lv_firewyrm_duel.0004.a.driven_to_ground:0 "C'est ça, [fd_victor_dragon.GetName] ! Achève-la !"
  lv_firewyrm_duel.0004.a.tt.driven_to_ground:0 "La bête est dévorée parmi les morsures déchaînées de [fd_victor_dragon.GetNameNoTooltip]"

  lv_firewyrm_duel.0004.a.disemboweled:0 "Déchire ! Lacère ! Qu'elle saigne !"
  lv_firewyrm_duel.0004.a.tt.disemboweled:0 "La bête est mise en pièces par [fd_victor_dragon.GetNameNoTooltip], ses entrailles se répandant sur le sol."

  lv_firewyrm_duel.0004.a.eviscerated:0 "Qu'elle brûle de l'intérieur !"
  lv_firewyrm_duel.0004.a.tt.eviscerated:0 "Votre monture ouvre le ventre de la bête, exposant ses entrailles à l'air."

  lv_firewyrm_duel.0004.a.chomp:0 "Et voilà... c'est fait."
  lv_firewyrm_duel.0004.a.tt.chomp:0 "Votre monture dévore la bête d'une unique morsure brutale."
  lv_firewyrm_duel.0004.chomp.t:0 "[fd_victor_dragon.GetNameNoTooltip] Apprécie le Goût"

  # Post-Round 1 Text
  lv_firewyrm_duel.0001.desc.succeeding:0 "#medium Le ciel bouillonne de chaleur et de cendres tandis que la bataille ne montre aucun signe de faiblir. La fumée s'enroule comme des doigts agrippeurs, et le feu strie les nuages en rafales de fureur. Chaque battement des ailes de votre dragon soulève des braises de la terre noircie en contrebas. Le veur de feu, démentiel et implacable, cercle dans son propre rythme brutal. Ce n'est pas un simple affrontement — c'est une guerre de volontés écrite à travers les cieux.#!"
  lv_firewyrm_duel.0001.desc.succeeding.final:0 "#medium \n\nLe rythme de la bataille continue, feu et fureur battant comme un second cœur dans votre poitrine. Un autre mouvement doit être fait.#!"

  # Post-Special States
  lv_firewyrm_duel.0001.stunned:0 "Tiens bon... respire simplement..."
  lv_firewyrm_duel.0001.tt.stunned.firewyrm:0 "Votre veur de feu chancelle sous la dernière attaque de la bête, incapable d'agir ce round."
  lv_firewyrm_duel.0001.tt.stunned:0 "Votre dragon chancelle sous la dernière attaque de la bête, incapable d'agir ce round."
  lv_firewyrm_duel.0001.desc.stunned.firewyrm_vs_firewyrm:0 "\n\n#medium La brume se lève. Votre veur secoue sa tête, crachat fondu sifflant où il tombe, tandis que l'étourdissement s'évacue de son corps. La faiblesse passe — mais non sans un prix. Pierre calcinée et la silhouette massive de l'autre veur se dressent devant, ses évents fumant encore du hurlement. Votre bête beugle, un rugissement guttural plus de fournaise que de voix. Quelle que soit l'emprise qu'eut ce cri... elle est brisée maintenant.#!"
  lv_firewyrm_duel.0001.desc.stunned.firewyrm_duel:0 "\n\n#medium La brume se lève. Votre veur se soulève, peau fondue ondulant tandis qu'il reprend contrôle. Le moment d'immobilité a disparu — mais sa piqûre demeure. Au-dessus, le dragon virevolte dans le ciel, ailes fendant la fumée comme des lames, son cavalier pressant déjà l'attaque. Votre bête laisse échapper un cri qui fait vibrer l'air, évents flambant de chaleur. Quelle que soit la force qui l'a clouée... elle ne durera pas.#!"
  lv_firewyrm_duel.0001.desc.stunned:0 "\n\n#medium La brume se lève. Votre dragon cligne des yeux, muscles se tendant tandis que la clarté revient dans ses yeux. Le moment de faiblesse a passé — mais non sans un prix. Terre calcinée et la forme menaçante du veur de feu vous accueillent tandis que la bataille reprend. Vous sentez votre monture inspirer profondément, un grondement bas s'élevant dans sa poitrine. Quelle que soit l'emprise qu'eut ce hurlement... elle est brisée maintenant.#!"

  lv_firewyrm_duel.0001.takeoff:0 "Nous avons besoin d'altitude ! Sors-nous d'ici !"
  lv_firewyrm_duel.0001.tt.takeoff:0 "Votre dragon tente de gagner de l'altitude, essayant d'échapper à la portée du veur de feu."
  lv_firewyrm_duel.0001.desc.takeoff:0 "\n\n#medium Vous poussez votre dragon vers le haut, ailes luttant contre le poids des cendres et de la fumée. Les yeux fondus du veur de feu suivent, mais il ne peut égaler votre ascension. L'espace d'un instant, vous êtes libre — le sol s'éloigne, le ciel s'ouvre, et vous pouvez respirer à nouveau. Mais la bête est implacable. Elle ne vous laissera pas échapper si facilement.#!"

  lv_firewyrm_duel.0001.land:0 "Nous devons atterrir ! Maintenant !"
  lv_firewyrm_duel.0001.tt.land:0 "Votre dragon tente d'atterrir, essayant de reprendre le contrôle de la situation."
  lv_firewyrm_duel.0001.desc.land:0 "\n\n#medium D'une traction ferme sur les rênes et d'un ordre crié, vous guidez votre dragon vers le bas à travers le ciel saturé de cendres. Le vent calciné vous fouette le visage tandis que les serres s'écrasent contre la terre brisée. Le sol gémit sous le poids de votre monture tandis que les ailes se replient, fumée s'enroulant entre pierre craquelée et évents fondus. Vous plissez les yeux à travers la brume — le veur de feu rôde devant, ses yeux des braises ardentes dans la pénombre. Les cieux sont derrière vous maintenant. Le reste de cette bataille se livrera là où les légendes tombent — au sol, parmi ruine et flamme.#!"

  lv_firewyrm_duel.0001.warning.force_land:0 "@warning_icon! #X Votre dragon sera forcé d'atterrir en effectuant ce mouvement !#!"
  lv_firewyrm_duel.0001.warning.burn_contact:0 "@warning_icon! #X Tout mouvement impliquant un contact avec le veur de feu dans son état fondu brûlera ou blessera davantage votre dragon !#!"
  lv_firewyrm_duel.0001.warning.burn_incoming:0 "@warning_icon! #X Les flammes du veur de feu se rapprochent ! Votre dragon sera brûlé ou davantage blessé si vous ne réagissez pas à temps !#!"
  lv_firewyrm_duel.0001.warning.nullified:0 "@warning_icon! #X Ce mouvement n'infligera aucun dégât dans l'état actuel du veur de feu !#!"

  # Dragon Moves
  lv_firewyrm_duel.0001.circle_beast:0 "Continue à bouger. Qu'elle devine où tombera le prochain coup."
  lv_firewyrm_duel.0001.tt.circle_beast:0 "Votre dragon garde ses distances, cerclant le veur de feu pour provoquer la confusion ou attirer une ouverture."
  lv_firewyrm_duel.0001.desc.circle_beast:0 "\n\n#medium Votre dragon bat un large arc à travers le ciel saturé de fumée, se tenant juste hors de portée du veur. La bête gronde et se tord, vous traquant d'yeux luisants. Vous n'offrez nulle ouverture — pourtant vous apprenez comment elle bouge, comment elle se love avant une frappe.#!"

  lv_firewyrm_duel.0001.flame_test:0 "Voyons combien de feu elle peut supporter."
  lv_firewyrm_duel.0001.tt.flame_test:0 "Votre dragon souffle un jet mesuré de flammes — non pour blesser, mais pour tester la propre résistance du veur de feu."
  lv_firewyrm_duel.0001.desc.flame_test:0 "\n\n#medium Vous signalez une rafale contrôlée de feu de dragon — non pour tuer, mais pour provoquer. Le veur de feu surgit à travers avec une facilité dérangeante... ou frémit, reculant tandis que la flamme s'enroule le long de ses écailles. Maintenant, au moins, vous comprenez ce qu'il peut endurer.#!"
  
  lv_firewyrm_duel.0001.claws_out:0 "Vise les membres ! Emmêle-le avant qu'il ne frappe à nouveau !"
  lv_firewyrm_duel.0001.tt.claws_out:0 "Une attaque basique mais directe visant à griffer les pattes ou flancs du veur de feu."
  lv_firewyrm_duel.0001.desc.claws_out:0 "\n\n#medium Nulle finesse, nulle stratégie — juste crocs et serres. Votre dragon s'écrase vers le veur dans un combat primordial de force. L'air chante de violence tandis que les deux monstres se ratissent et fouettent l'un l'autre, écailles et tendons déchirés au passage.#!"

  lv_firewyrm_duel.0001.reckless_dive:0 "Au diable les risques — on y va maintenant !"
  lv_firewyrm_duel.0001.tt.reckless_dive:0 "Un plongeon à haute vitesse en portée de mêlée. Dangereux tant pour le cavalier que la bête, mais pourrait tout terminer rapidement."
  lv_firewyrm_duel.0001.desc.reckless_dive:0 "\n\n#medium Vous vous penchez bas dans le vent et lancez votre dragon dans un plongeon brutal. Vous déchirez à travers feu et cendres comme une lance vivante — mais la vitesse imprudente est un pari. Touché ou manqué, vous payez en sang ou souffle.#!"

  lv_firewyrm_duel.0001.guard_skies:0 "Garde la formation. Protège ailes et gorge."
  lv_firewyrm_duel.0001.tt.guard_skies:0 "Votre dragon protège ses parties vulnérables et cercle en altitude, minimisant les ouvertures pour les frappes du veur de feu."
  lv_firewyrm_duel.0001.desc.guard_skies:0 "\n\n#medium Vous appelez votre dragon plus haut, ses ailes balayant un halo protecteur à travers l'air criblé de ruines. Pas de brèches, pas de bonds sauvages. Vous chevachez le vent comme une lame en équilibre, prêt à parer tout ce que la bête lance dans votre direction.#!"

  lv_firewyrm_duel.0001.rip_joints:0 "Ses genoux plient comme toute bête. Frappe juste !"
  lv_firewyrm_duel.0001.tt.rip_joints:0 "Une frappe précise visant les articulations du veur ou les plaques sous-exposées. Risqué, mais potentiellement décisif."
  lv_firewyrm_duel.0001.desc.rip_joints:0 "\n\n#medium Pas la tête. Pas le ventre. Vous visez les jointures de son corps — là où écaille rencontre muscle, où elle doit bouger pour frapper. Votre dragon griffe juste, et le veur de feu hurle tandis qu'une patte spasme sous son poids.#!"

  lv_firewyrm_duel.0001.roar_challenge:0 "Qu'elle sache que nous ne sommes pas une proie."
  lv_firewyrm_duel.0001.tt.roar_challenge:0 "Votre dragon libère un rugissement assourdissant, tentant de déstabiliser ou provoquer le veur de feu dans une agression téméraire."
  lv_firewyrm_duel.0001.desc.roar_challenge:0 "\n\n#medium Vous poussez votre dragon à beugler, un son profond et ébranlant l'âme qui répond à la propre folie du veur de feu par la fureur draconique. La réponse est immédiate — la bête charge, enragée et irréfléchie. Vous avez attiré son ire. Maintenant survivez-y.#!"

  lv_firewyrm_duel.0001.dive_strike:0 "Entrée et sortie — assez rapide pour le saigner sans être brûlé."
  lv_firewyrm_duel.0001.tt.dive_strike:0 "Une passe rapide à travers la portée du veur, visant à laisser une blessure et disparaître avant que les représailles ne puissent atterrir."
  lv_firewyrm_duel.0001.desc.dive_strike:0 "\n\n#medium Vous repérez une ouverture — brève, incertaine — et plongez à travers comme un éclair. Votre dragon ratisse son flanc au passage, ne s'arrêtant pas pour affronter mais traversant l'espace de la bête tout droit, transformant le ciel même en arme.#!"

  lv_firewyrm_duel.0001.tailspin_slam:0 "Tourne et brise-lui les côtes !"
  lv_firewyrm_duel.0001.tt.tailspin_slam:0 "Votre dragon se fouette dans un tourbillon frappant, tentant de fracasser l'os par force pure."
  lv_firewyrm_duel.0001.desc.tailspin_slam:0 "\n\n#medium Vous ordonnez un roulement et une torsion, votre dragon tournoyant avec une grâce violente. Le veur est lent à réagir — étourdi ou léthargique — et la queue de votre dragon s'abat comme un marteau sur son flanc. L'os craque. L'air lui-même tressaille.#!"

  lv_firewyrm_duel.0001.wound_exploit:0 "Cette entaille n'a pas guéri. Nous ferons en sorte qu'elle ne le fasse jamais."
  lv_firewyrm_duel.0001.tt.wound_exploit:0 "Vous exploitez une blessure antérieure, espérant l'élargir et drainer les dernières forces du veur de feu."
  lv_firewyrm_duel.0001.desc.wound_exploit:0 "\n\n#medium Vous la voyez : une zone brûlée nue d'écailles, luisant de sang et de chaleur. Un ordre précis, et votre dragon plonge vers elle. Les serres trouvent la chair. Le veur hurle en agonie tandis que la plaie est déchirée plus large, sa force s'écoulant à chaque battement.#!"

  lv_firewyrm_duel.0001.vipers_feint:0 "Glisse à gauche. Frappe à droite."
  lv_firewyrm_duel.0001.tt.vipers_feint:0 "Un faux mouvement éblouissant — seul un cavalier de ruse peut l'exécuter proprement."
  lv_firewyrm_duel.0001.desc.vipers_feint:0 "\n\n#medium Tel un serpent en vol, vous changez d'angles en plein air — une feinte, puis une frappe depuis un chemin impossible. Votre dragon se tord à travers un souffle de flamme et délivre un ratissage punissant avant que le veur ne réalise même où vous êtes passé.#!"

  lv_firewyrm_duel.0001.dragonflame_barrage:0 "Brûle-le — encore et encore !"
  lv_firewyrm_duel.0001.tt.dragonflame_barrage:0 "Votre dragon déchaîne un barrage complet de flammes, visant à submerger le veur par pure puissance de feu."
  lv_firewyrm_duel.0001.desc.dragonflame_barrage:0 "\n\n#medium Vous ne vous retenez pas. Avec un rugissement, votre dragon libère un torrent de feu en vagues balayantes. Le veur gronde et recule sous la chaleur, sa peau s'embrasant. Ce n'est pas un massacre, mais c'est un message gravé dans les flammes.#!"

  lv_firewyrm_duel.0001.chomp:0 "#bold MORDS#!"
  lv_firewyrm_duel.0001.tt.chomp:0 "Vous #bold MORDEZ#!"

  lv_firewyrm_duel.0001.commanding_cry:0 "Concentre-toi, mon ami ! Nous respirons ensemble !"
  lv_firewyrm_duel.0001.tt.commanding_cry:0 "Un cri de ralliement à votre dragon, le poussant à se concentrer et synchroniser ses attaques avec les vôtres."
  lv_firewyrm_duel.0001.desc.commanding_cry:0 "\n\n#medium D'un mot — ancien, puissant — vous apaisez le souffle de votre dragon. Vous murmurez force dans ses oreilles. Son battement d'aile se stabilise, son sang ralentit. Les blessures se recousent juste assez pour le vol. Vous achetez un autre round... peut-être plus.#!"

  lv_firewyrm_duel.0001.hidden_knowledge:0 "Je me souviens des textes anciens. [dragon.GetName], fais exactement comme je l'ordonne !"
  lv_firewyrm_duel.0001.tt.hidden_knowledge:0 "Vous vous rappelez une tactique spécifique des anciens textes valyriens, espérant qu'elle renversera le cours de la bataille."
  lv_firewyrm_duel.0001.desc.hidden_knowledge:0 "\n\n#medium Vous vous souvenez des récits. Les tactiques que les Valyriens utilisaient autrefois quand les dragons n'étaient pas des bêtes mais des armes de guerre. Votre dragon bouge avec ce même rythme maintenant — transformant la sagesse antique en mort aérienne. Le veur ne s'y attend pas.#!"

  lv_firewyrm_duel.0001.risk_it_all:0 "Ceci se termine d'une seule façon — sang et cendres."
  lv_firewyrm_duel.0001.tt.risk_it_all:0 "Vous pariez tout sur une charge désespérée. Si ça fonctionne, le duel s'achève. Sinon... vous aussi."
  lv_firewyrm_duel.0001.desc.risk_it_all:0 "\n\n#medium Vous donnez l'ordre impensable. Votre dragon tombe du ciel comme une pierre, griffes exposées, flamme montante. Le veur se dresse pour vous affronter. Deux monstres, un affrontement final. Il n'y aura pas de seconde frappe.#!"

  lv_firewyrm_duel.0001.collapse_ground:0 "Fais tomber le sol sur elle ! Que la terre engloutisse ce monstre !"
  lv_firewyrm_duel.0001.tt.collapse_ground:0 "Vous ordonnez à votre dragon de déchaîner un torrent de feu sur le sol, le déstabilisant et espérant ensevelir le veur de feu dans la terre qui s'effondre."
  lv_firewyrm_duel.0001.desc.collapse_ground:0 "\n\n#medium Vous repoussez le veur de feu plus bas, toujours plus bas — puis signalez l'attaque. La pierre craque sous ses membres. La terre gémit. Un effondrement soudain, un panache de poussière — et la bête disparaît dans un hurlement sous le plancher de ruine brisé.#!"

  # Firewyrm Moves
  lv_firewyrm_duel.0001.fume_burst:0 "Calcine l'air, [fd_round_me_dragon.GetName] ! Emplis ses poumons de feu !"
  lv_firewyrm_duel.0001.tt.fume_burst:0 "[fd_round_me_dragon.GetName] libère un nuage de gaz surchauffé, visant à échauder et désorienter [fd_round_opponent_dragon.GetName]."
  lv_firewyrm_duel.0001.desc.fume_burst.firewyrm_vs_firewyrm:0 "\n\n#medium À votre ordre, votre veur beugle et se soulève, fendant l'air d'un rugissement né de fournaise. Il expulse un nuage de fumées bouillantes, vapeur fondue sifflant depuis les évents le long de son échine. Le veur ennemi se débat contre la brume échaudante, sa peau se couvrant d'ampoules là où la brume brûlante adhère. Deux fournaises vivantes s'affrontent, mais en cet instant, la vôtre brûle plus chaud.#!"
  lv_firewyrm_duel.0001.desc.fume_burst:0 "\n\n#medium Votre veur arque son corps fondu, fissures le long de sa peau brillant plus fort tandis qu'il libère un torrent de fumées échaudantes. La brume étouffante engloutit le dragon, ailes faiblissant tandis que la bête recule devant la chaleur suffocante. Le feu-fait-chair lutte contre le feu-fait-mal, l'air même se transformant en votre arme tandis que le dragon hurle de rage et de douleur.#!"
  lv_firewyrm_duel.0001.desc.counter.fume_burst.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur de feu inspire profondément, puis déchaîne un nuage de fumées échaudantes. Votre dragon recule, ailes se déployant tandis qu'il tente d'échapper à la brume brûlante. Vous sentez la chaleur même d'ici — un rappel que cette bête n'est pas seulement flamme, mais une fournaise vivante.#!"
  lv_firewyrm_duel.0001.desc.counter.fume_burst:0 "\n\n#medium Le veur de feu inspire profondément, puis déchaîne un nuage de fumées échaudantes. Votre dragon recule, ailes se déployant tandis qu'il tente d'échapper à la brume brûlante. Vous sentez la chaleur même d'ici — un rappel que cette bête n'est pas seulement flamme, mais une fournaise vivante.#!"

  lv_firewyrm_duel.0001.boneshattering_screech:0 "Hurle jusqu'à ce que la pierre même se brise !"
  lv_firewyrm_duel.0001.tt.boneshattering_screech:0 "[fd_round_me_dragon.GetName] émet un cri assourdissant, visant à désorienter et déséquilibrer [fd_round_opponent_dragon.GetName]."
  lv_firewyrm_duel.0001.tt.boneshattering_screech.effect:0 "[fd_round_opponent_dragon.GetName] est étourdi par ce hurlement fracassant d'os"
  lv_firewyrm_duel.0001.desc.boneshattering_screech.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur se cabre, fissures flambant, avant de déchaîner un cri arraché du cœur fondu de la terre. Le son est un pur tourment, fendant pierre et ciel. De l'autre côté du champ de bataille, l'autre veur s'effondre dans un spasme de fureur et de douleur, ses membres se bloquant tandis qu'il trébuche. Deux fournaises vivantes s'entrechoquent, mais la vôtre a volé la voix du gouffre — et elle laisse le rival brisé, étourdi dans la poussière.#!"
  lv_firewyrm_duel.0001.desc.boneshattering_screech:0 "\n\n#medium Votre veur se cabre, évents flamboyants, et lâche un cri qui fracasse l'air même. Le dragon se raidit à mi-rugissement, yeux écarquillés tandis que le son le percute avec la force d'un marteau. Les ailes faiblissent, la flamme vacille, et la créature chancelle, étourdie et chancelante. Le feu-fait-chair, défait non par griffe ou flamme, mais par un son assez tranchant pour fendre son esprit même.#!"
  lv_firewyrm_duel.0001.desc.counter.boneshattering_screech.firewyrm_vs_firewyrm:0 "\n\n#medium Le monde se déchire en son. Votre veur convulse, peau fondue frémissant tandis que le cri déchire écailles et tendons ensemble. Il se débat, frappant la terre de griffes qui creusent la pierre, ses évents vomissant de la fumée en agonie. Vous sentez la force vibrer à travers son corps dans vos propres os, vous laissant tous deux chancelants, titubants, impuissants un battement de cœur trop long.#!"
  lv_firewyrm_duel.0001.desc.counter.boneshattering_screech:0 "\n\n#medium L'air se fend d'un hurlement si perçant qu'on croirait votre crâne sur le point de se fissurer. Votre dragon chancelle en plein air, ailes faiblissant, yeux écarquillés de douleur et désorientation. Le cri du veur de feu résonne contre la pierre brisée et les falaises fondues, une arme de son plus sauvage que l'acier. Vous tentez de stabiliser la bête sous vous, mais pour l'instant, tout ce que vous pouvez faire est vous accrocher. Il n'y aura nulle manœuvre cette fois — seulement la survie.#!"

  lv_firewyrm_duel.0001.cone_of_flame:0 "Brûle-le en cendres ! Que le feu soit ta réponse !"
  lv_firewyrm_duel.0001.tt.cone_of_flame:0 "[fd_round_me_dragon.GetName] déchaîne un large cône de flammes, tentant d'engloutir votre dragon dans une vague de chaleur."
  lv_firewyrm_duel.0001.tt.cone_of_flame.effect:0 "Le feu du veur de feu se referme sur l'ennemi, menaçant d'incinérer dans un enfer courroucé."
  lv_firewyrm_duel.0001.desc.cone_of_flame.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur rugit — non de son, mais de feu. Il vomit un cône de flamme brûlante, une fournaise déchaînée en un unique souffle. L'autre veur hurle, peau fondue se couvrant d'ampoules sous le torrent, ses mouvements réduits à une défiance chancelante et torse. La fumée s'enroule depuis ses évents, pourtant le feu s'accroche, se nourrissant plus profond, se repaissant de chaque souffle qu'il ose prendre.#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame:0 "\n\n#medium La gorge de votre veur enfle, fissures flamboyant, avant qu'il ne vomisse une tempête de feu qui dévore l'air. Le dragon hurle tandis que le cône l'engloutit, ailes se repliant vers l'intérieur, écailles noircissant sous la fournaise implacable. Même tandis qu'il vire, le feu ne relâche pas — il persiste comme une malédiction, rongeant peau et tendons, transformant la grâce en agonie.#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur beugle, expulsant du feu jusqu'à ce que le champ de bataille soit noyé dans une vague de flamme brûlante. L'espace d'un battement de cœur, il semble que rien ne pourrait survivre à l'enfer — jusqu'à ce que la fournaise se brise contre l'autre veur de feu. Sa peau brille comme du minerai vivant, canaux fondus buvant le feu comme si c'était souffle, non fléau. Les flammes se brisent inutilement, s'enroulant en fumée autour d'une bête rendue immune à son propre élément.#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame.miss:0 "\n\n#medium Votre veur se soulève, évents fondus luisant tandis qu'il beugle une tempête de feu qui déchire le champ de bataille. Mais le dragon est déjà dans les airs, ailes battant un coup de vent furieux tandis qu'il grimpe au-dessus du torrent. Le cône de flamme calcine pierre et ciel ensemble, mais ne trouve nulle cible — seulement une traînée de fumée évanescente sous la forme fuyante.#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur rival se soulève, fissures luisant d'un blanc fondu, avant de dégorger un torrent de flamme qui roule sur le champ de bataille telle une marée vivante. Votre propre bête se débat tandis que le feu échauffe sa peau, évents hurlant de fumée tandis qu'ampoule rencontre ampoule. La chaleur persiste, adhérant à ses écailles, brûlant même après que la fournaise soit passée. Chaque souffle est douleur, et encore le feu vous dévore tous deux.#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame:0 "\n\n#medium Avec un hurlement arraché de quelque gouffre fondu, le veur de feu se cabre — sa gorge gonflant de feu — et déchaîne un cône brûlant de flamme à travers le champ de bataille. L'air se transforme en fumée et fureur tandis que la fournaise s'évase vers l'extérieur, engloutissant pierre fracassée et ciel ensemble. Vous sentez la chaleur avant qu'elle ne frappe, comme un marteau fait de lumière. Votre dragon hurle, ailes se déployant contre l'enfer, tandis que le monde se brouille en rouge bouillant.#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur de feu ennemi convulse, gorge enflant de chaleur, avant de cracher un torrent né de fournaise à travers le champ. Il frappe avec la force d'une tempête de soleils — pourtant votre veur demeure intact. Sa peau flamboie plus brillante, évents flambant comme des fissures dans le cœur de la terre. Les flammes se déversent sur lui, réclamées et consumées, ne laissant que fumée dérivant dans leur sillage. Pour l'instant, le feu ne peut blesser le feu.#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss:0 "\n\n#medium Le veur de feu lâche un rugissement guttural, sa poitrine pulsant de lumière de braise avant qu'il ne crache un cône roulant de feu. L'enfer lèche vers le haut, chassant les ombres et transformant la terre brisée en contrebas en mer mouvante de flammes. Mais votre dragon est déjà en altitude, ailes battant dur contre la chaleur montante. Vous grimpez plus haut dans le ciel chargé de cendres, sentant la brûlure du courant ascendant mais non la morsure de la fournaise. En contrebas, le feu se déverse inutilement sur pierre noircie, et le veur de feu gronde, mâchoires fumant de frustration.#!"
  
  lv_firewyrm_duel.0001.frenzied_lunge:0 "Frappe maintenant — folie et fureur ensemble !"
  lv_firewyrm_duel.0001.tt.frenzied_lunge:0 "[fd_round_me_dragon.GetName] charge en avant dans un bond sauvage et incontrôlé, tentant de combler la distance et d'atterrir un coup."
  lv_firewyrm_duel.0001.desc.frenzied_lunge.firewyrm_vs_firewyrm:0 "\n\n#medium Avec un beuglement qui secoue les cendres des falaises, votre veur surgit en avant dans une frénésie de muscle et de fumée. Les griffes déchirent à travers peau calcinée tandis que les deux bêtes se heurtent, fureur contre fureur. Le sol tremble sous la violence, et l'espace d'un instant cela ressemble moins à une frappe qu'à un tremblement de terre fait forme.#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge:0 "\n\n#medium Votre veur se lance avec une vitesse téméraire, un flou de griffes et de crocs dentelés. Il s'écrase dans le flanc du dragon, déchirant écailles et tendons avec une force sauvage. Le dragon se débat, ailes battant contre la vague de douleur, mais votre bête ne relâche pas — sa frénésie ne laissant que ruine dans son sillage.#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur se projette en avant, frappant la bête luisante dans une tempête de griffes et mâchoires claquantes. Mais au lieu de chair, il rencontre feu fait sans chair — la peau fondue brûlant à travers ses serres. L'impact déchire les deux créatures, votre monture reculant avec un cri de douleur tandis que son propre assaut se retourne contre elle. La fureur se transforme en agonie en un battement de cœur, fumée et étincelles traînant de l'affrontement.#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge.miss:0 "\n\n#medium Avec un cri qui fend la pierre, votre veur bondit, griffes ratissant vers le haut à travers fumée et cendres. Mais le dragon est déjà dans les cieux, ses ailes déchirant l'air au-dessus du champ de bataille. La frappe n'atterrit que sur ruine et poussière, l'élan projetant votre monture sur le sol craquelé. Il s'écrase durement, se tordant en arrière avec des yeux fondus verrouillés sur sa proie, fureur inassouvie.#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur ennemi explose des cendres, son corps une tempête d'écailles et de rage. Il heurte votre monture dans un fracas ébranlant d'os, crocs taillant profond tandis que griffes lacèrent feu dans chair. Le sol frémit avec l'impact, votre veur hurlant sous la force écrasante de la frénésie débridée de son congénère.#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge:0 "\n\n#medium Sans avertissement, le veur bondit en avant dans une frénésie, traînant griffe et croc à travers l'air saturé de cendres. Il s'écrase sur votre dragon avec une fureur téméraire, arrachant écailles d'os. Vous sentez le choc courir à travers la selle, à travers tendons, dans vos propres os. Il ne reste nulle raison en elle — seulement la haine.#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium La bête se projette en avant, hurlant, griffes et crocs frappant comme une avalanche. Mais quand elle s'écrase sur la peau fondue de votre veur, l'attaque devient sa propre perte. Feu éclate contre feu, brûlant l'attaquant tandis qu'il ratisse inutilement contre l'armure luisante. Votre veur gronde à travers la tempête, inébranlé, tandis que son adversaire recule couvert d'ampoules et hurlant.#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss:0 "\n\n#medium Avec un cri dément, le veur de feu bondit, gueule large et griffes ratissant l'air. Il s'écrase en avant à travers fumée et ruine, mais votre dragon est déjà dans les cieux — ailes battant contre la chaleur et cendres montantes. Le bond ne frappe que poussière et pierre fracassée, et l'élan du veur l'envoie glissant sur la terre craquelée. En contrebas, il se tord en arrière avec un sifflement, yeux fondus vous traquant en hauteur, rage cuisinant plus chaude à chaque souffle.#!"

  lv_firewyrm_duel.0001.rockfall_roar:0 "Rugis, [fd_round_me_dragon.GetName] ! Arrache le ciel de ses piliers !"
  lv_firewyrm_duel.0001.tt.rockfall_roar:0 "[fd_round_me_dragon.GetName] lâche un rugissement qui fait trembler le sol même, délodgeant rochers et débris."
  lv_firewyrm_duel.0001.desc.rockfall_roar.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur se cabre, poitrine se soulevant, et déchaîne un rugissement qui fait vibrer la pierre même. La caverne tremble tandis que les murs se fendent et que des rochers dégringolent. Une grêle de roc s'abat sur le veur ennemi, sa peau fondue brillant tandis qu'il se débat sous le poids qui s'effondre. Des nuages de poussière bourgeonnent dans la lumière du feu, étouffant l'air jusqu'à ce que tout ce que vous entendiez soit le gémissement de la pierre et la fureur étouffée de l'ennemi dessous.#!"
  lv_firewyrm_duel.0001.desc.rockfall_roar:0 "\n\n#medium Le rugissement que donne votre veur est moins un son qu'une convulsion du monde même. La caverne frémit, stalactites se brisant comme des dents depuis le plafond, murs se fendant avec des craquements tonitruants. Le dragon virevolte vers le haut en panique, ailes griffant l'air tandis que la roche cisaille en lames mortelles. La lueur du feu peint le chaos en rouge et or — votre adversaire piégé entre pierre et flamme, luttant pour survivre dans un tombeau qui s'effondre.#!"
  lv_firewyrm_duel.0001.desc.counter.rockfall_roar.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur ennemi beugle, et le monde s'effondre. La pierre se détache du plafond en grandes dalles, le plancher convulsant sous les griffes de votre bête. Vous vous agrippez à la selle tandis que les gravats pleuvent autour de vous, assourdi par le rugissement tant de terre que de monstre. Votre veur chancelle, pris dans l'étreinte claustrophobe, ses yeux fondus écarquillés tandis qu'il lutte non contre un rival — mais contre la montagne même abattue sur vous.#!"
  lv_firewyrm_duel.0001.desc.counter.rockfall_roar:0 "\n\n#medium Le veur lâche un rugissement guttural qui résonne à travers les parois de la caverne — ou ruines, ou quel que soit le cimetière où vous combattez. Avec lui vient un tremblement. Les pierres craquent et les plafonds gémissent. Une section de la terre même cède, s'effondrant en poussière et gravats. Vous êtes forcé de fuir vers le haut ou d'être enseveli.#!"

  lv_firewyrm_duel.0001.molten_slough:0 "Laisse ta peau, brûle plus brillant ! Que rien ne te perce !"
  lv_firewyrm_duel.0001.tt.molten_slough:0 "[fd_round_me_dragon.GetName] perd ses écailles fondues, se recouvrant d'une couche fraîche d'armure brûlante et cautérisant toutes ses blessures dans le processus."
  lv_firewyrm_duel.0001.tt.molten_slough.effect:0 "Une armure fondue enveloppe le veur de feu, neutralisant toutes les attaques de feu et infligeant d'importants dégâts de brûlure pour tout contact rendu."
  lv_firewyrm_duel.0001.desc.molten_slough:0 "\n\n#medium Votre veur convulse sous vous avec un son comme des montagnes se brisant. Son dos s'arque, écailles craquant et pelant en plaques de chair brûlante. Des morceaux de peau fumante se détachent, s'écrasant au sol en tas luisants. De la ruine émerge une bête renaissante — rutilante de lumière fondue, blessures scellées par brûlure, chaque souffle une explosion de fournaise. La chaleur montant de son corps calcine votre peau même à travers la selle, comme si vous chevauchiez maintenant non une créature, mais le cœur vivant de la terre même.#!"
  lv_firewyrm_duel.0001.desc.counter.molten_slough:0 "\n\n#medium D'un soulèvement guttural, le veur de feu arque son dos — et se fend. Chair croûtée et écailles calcinées se déchirent libres, tombant au sol comme une armure fondue. Il rugit, nouvellement rutilant, à moitié brûlé et plus redoutable qu'avant. Ses blessures fument en se fermant, et le feu dans sa gorge brûle encore plus brillant.#!"

  lv_firewyrm_duel.0001.berserk_charge:0 "Toute ta force, [fd_round_me_dragon.GetName] ! Brise-le ou brise-toi !"
  lv_firewyrm_duel.0001.tt.berserk_charge:0 "[fd_round_me_dragon.GetName] charge en avant dans une attaque aveugle et furieuse, tentant de piétiner [fd_round_opponent_dragon.GetName]."
  lv_firewyrm_duel.0001.desc.berserk_charge.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur éclate en avant avec un hurlement qui fait tomber de la pierre des falaises, son corps un mastodonte de muscle et de rage fondue. Il s'écrase sur l'autre veur avec une telle force que la terre même se craquelle, griffes et crocs déchirant sans pensée pour sa propre peau. Les deux bêtes se tordent dans une tempête de violence, l'air empli de fumée, de sang et de fureur débridée.#!"
  lv_firewyrm_duel.0001.desc.berserk_charge:0 "\n\n#medium Votre monture explose en mouvement, n'étant plus une bête mais une avalanche vivante de fureur. Elle s'écrase dans le flanc du dragon avec une force brisant les os, écailles et tendons se fracassant sous la charge. Le dragon hurle, chancelant sous l'assaut, tandis que votre veur griffe et lacère comme s'il voulait traîner le ciel vers le bas avec lui.#!"
  lv_firewyrm_duel.0001.desc.berserk_charge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur se projette tête première sur la bête luisante, frappant avec tout le poids imprudent de sa fureur. Mais chair fondue n'est nulle chair du tout. L'instant de l'impact devient un cataclysme : les griffes de votre veur se brûlent, sa peau se couvrant d'ampoules contre la fournaise qu'il croyait écraser. Les deux bêtes chancellent, hurlant, le champ de bataille embrasé dans une tempête de flamme et d'agonie née de rage heurtant le feu incarné.#!"
  lv_firewyrm_duel.0001.desc.berserk_charge.miss:0 "\n\n#medium Avec un rugissement qui pourrait renverser des montagnes, votre veur charge, yeux fondus verrouillés sur le dragon au-dessus. Il s'écrase à travers fumée et pierre fracassée, griffes ratissant vers le ciel — mais le dragon est déjà en altitude, ailes le portant juste hors de portée. La charge se termine en ruine : votre bête laboure la terre, soulevant une tempête de poussière et de cendres, sa fureur inébranlée, sa proie intouchée.#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge.firewyrm_vs_firewyrm:0 "\n\n#medium Un rugissement fend la brume, et avant que vous ne puissiez vous préparer, l'autre veur est sur vous — une force imparable de sang et de haine. Il s'écrase sur votre monture avec un impact dévastateur, griffes déchirant, mâchoires lacérant avec un abandon suicidaire. Le choc vous arrache presque de la selle tandis que les deux bêtes se débattent dans un maelström de rage et de ruine.#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge:0 "\n\n#medium Ensanglanté, à moitié fou et hurlant, le veur charge — rien de calculé, rien de sain. Ses yeux luisent comme des braises fissurées. Il lance tout son corps monstrueux dans le combat, ignorant flamme et griffe. Vous voyez venir un coup que vous ne pouvez éviter. Le seul réconfort est celui-ci : il pourrait se détruire en tentant de vous détruire.#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium La bête chargeante s'écrase de plein fouet sur la forme fondue de votre veur, sa fureur heurtant le feu vivant. L'impact rebondit instantanément, brûlant à travers sa propre chair tandis que griffes et crocs ne trouvent nulle prise que flamme. Votre veur tient son terrain, luisant comme une fournaise, tandis que son attaquant hurle en agonie — couvert d'ampoules, brûlé, défait par sa propre fureur berserk.#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss:0 "\n\n#medium Avec un beuglement qui fend l'air épais de cendres, le veur de feu charge — aveugle de fureur, indifférent à la douleur. Il barèle à travers pierre brisée et ruine fumante, yeux fondus fixés où vous étiez quelques instants plus tôt. Mais vous êtes déjà en altitude, votre dragon cerclant haut au-dessus. La bête s'écrase en avant sous vous, ses griffes creusant des tranchées dans la terre tandis qu'elle rage vers le ciel. Il n'y a plus de pensée en elle maintenant — seulement la ruine laissée par une frappe qui n'atterrit jamais.#!"


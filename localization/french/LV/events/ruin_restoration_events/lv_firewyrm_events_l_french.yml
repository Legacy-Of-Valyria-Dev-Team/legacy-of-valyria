l_french:
  trait_firewyrm:0 "Vouivre de Feu"
  trait_firewyrm_desc:0 "Parente tordue des dragons véritables, la vouivre de feu n'est nulle créature de grâce ou de ciel. Elle rampe depuis les profondeurs de la terre, née de la pierre en fusion et de la folie pure, façonnée par la chaleur et le temps en une abomination crachant le feu. Là où les dragons inspirent la crainte respectueuse, les vouivres de feu ne laissent que ruines calcinées et mort empoisonnée par la fumée."

  # GUI
  HOLDING_VIEW_FIREWYRM:0 "Vouivre de Feu"

  # Firewyrm Events
  lv_firewyrm_event.0001.t:0 "La Chose qui Brûle"
  lv_firewyrm_event.0001.desc:0 "Les ruines gémissent sous le poids des âges, pourtant ce n'est ni le temps ni les tremblements qui font vibrer le sol sous vos pieds. Un cri perçant, non, un hurlement, déchire l'air étouffé de cendres comme une lame. Et puis elle arrive. Rampant hors d'un gouffre de pierre fissurée et de souffle en fusion, la vouivre de feu descend sur la ruine comme un démon sorti des anciens parchemins valyriens.\n\nCe n'est point un dragon véritable. Ses écailles sont déchiquetées, couvertes d'ampoules et à demi fondues. La fumée siffle depuis les évents le long de son épine dorsale serpentine, son souffle une flamme caustique qui noircit les pierres mêmes qu'elle foule. Ses yeux, par tous les dieux, ses yeux sont en fusion, comme des blessures ouvertes, et elle se meut avec une faim qui n'a rien de l'instinct et tout de la malice pure.\n\nMême les dragons craignaient les vouivres de feu, dit-on. Et ce qui vous fait face maintenant n'est nulle relique apprivoisée. C'est un vestige tordu de la folie de Valyria, une créature née non seulement du feu, mais de la démence elle-même.\n\nVous n'avez que quelques instants pour choisir : combattre la bête, et peut-être devenir légende... ou fuir, et espérer que les ruines soient clémentes."
  lv_firewyrm_event.0001.duel.dragon:0 "[dragon.GetName] ! Aderī !"
  lv_firewyrm_event.0001.duel.dragon.tt:0 "Vous appelez rapidement votre dragon et vous préparez à affronter la bête."
  lv_firewyrm_event.0001.duel:0 "L'acier et le feu, alors. Que les dieux en soient témoins."
  lv_firewyrm_event.0001.duel.tt:0 "Vous tenez votre position et tentez d'abattre la vouivre de feu."
  lv_firewyrm_event.0001.flee:0 "Ce n'est point un ennemi fait pour les vivants. Nous fuyons."
  lv_firewyrm_event.0001.flee.tt:0 "Vous décidez de fuir, laissant la vouivre de feu à son repaire."

  lv_firewyrm_spawned_tooltip:0 "Une vouivre de feu a établi son repaire dans la région."
  lv_firewyrm_cleared_tooltip:0 "Le repaire de [lair_location.GetName] est désormais déblayé."

  lv_firewyrm_event.0100.t:0 "Une Ombre Levée sur [former_lair.GetNameNoTooltip]"
  lv_firewyrm_event.0100.desc:0 "L'ombre qui pesait jadis sur ce lieu a disparu pour toujours. La vouivre de feu qui tenait ces terres sous sa coupe terrifiante, bête, terreur et flamme vivante, n'est plus là pour régner dans la terreur ardente. L'air lui-même semble plus léger sans sa chaleur et sa haine qui pesaient sur tout. Qu'elle ait été tuée au combat, brisée à votre volonté, ou attirée ailleurs par les appétits qui poussent de tels monstres, le résultat demeure le même : le chemin vers l'avenir s'ouvre libre, débarrassé de sa domination."
  lv_firewyrm_event.0100.a:0 "[former_lair.GetNameNoTooltip] repose enfin en paix."

  ## Firewyrm Duel Events
  lv_firewyrm_duel.0001.t.firewyrm_vs_firewyrm:0 "Braises contre Braises"
  lv_firewyrm_duel.0001.t:0 "Quand la Cendre Rencontre la Flamme"
  lv_firewyrm_duel.0001.desc.firewyrm_vs_firewyrm:0 "#medium La terre tremble sous les griffes de votre monture, chaque pas fendillant la pierre et projetant des spirales de poussière vers les cieux. Par-delà ce terrain brisé, l'autre ver de feu se dresse pour vous affronter — son regard de lave fondue se verrouillant sur celui de votre propre bête. Il n'y a ici nulle parenté, seulement la faim, seulement la rage, tandis que l'air s'alourdit de la promesse du feu et de la ruine.\n\nIl s'extrait des ruines tel un éclat de terre arraché aux entrailles du monde, sa peau en fusion dégoulinant de chaleur à chaque mouvement. Nulle aile. Nulle majesté. Seulement une fournaise de rage enveloppée d'écailles craquelées et de fumée. Là où votre ver est chair liée au feu, celui-ci est flamme déchaînée, inferno rival luttant contre les liens de son propre corps.\n\nVotre ver de feu gronde profondément, un son roulant comme l'effondrement de pierres dans les ténèbres d'une caverne. L'autre lui répond — non par un rugissement, mais par un cri strident comme le métal qui se déchire, fou et indomptable."#!"
  lv_firewyrm_duel.0001.desc.firewyrm_duel:0 "#medium Votre bête se love et martèle le paysage, son corps en fusion sifflant par des évents de fumée et de cendres. Nulles ailes pour commander les airs — seulement des griffes pour dominer le sol, seulement le feu pour anéantir ce qui se dresse devant elle. Là où le dragon au-dessus est le feu fait forme et vol, votre ver est le feu enchaîné à la terre, une bête de pure destruction qui ne ploiera jamais. Votre ver de feu beugle, tonnerre roulant qui ébranle la pierre craquelée. Au-dessus, le dragon répond, son rugissement vaste comme le ciel, défi lancé depuis les cieux eux-mêmes.#!"
  lv_firewyrm_duel.0001.desc:0 "#medium Le sol crépite sous les serres de votre monture tandis que votre dragon atterrit, ses ailes se repliant comme des nuages d'orage sur le ciel fracassé. Devant vous gît le ver de feu — ni intimidé, ni curieux, mais affamé.\n\nIl ondule hors du puits en ruine tel un être né de fumée et de tourment, sa peau de lave fumant à chaque mouvement. Nulle aile. Nulle grâce. Seulement une fureur déchiquetée et des écailles boursouflées, suintant la fumée par des évents et fissures le long de son échine. Là où un dragon est le feu fait chair, cette créature est le feu fait mal.\n\nVotre dragon gronde sourdement, un son qui fait trembler la pierre noircie. Le ver répond — non par un rugissement, mais par un cri qui glace le sang, défiant et dément.#!"
  lv_firewyrm_duel.0001.desc.valyria:0 "#medium Ici, dans le cœur fumant de Valyria, deux monstres se rencontrent.#!\n\n"
  lv_firewyrm_duel.0001.desc.lyria:0 "#medium Ici, sur les falaises croulantes d'Epaekros, où la terre s'effrite et le ciel brûle, deux monstres vont danser.#!\n\n"
  lv_firewyrm_duel.0001.desc.lokiria:0 "#medium Ici, sous l'ombre étouffante de Gaelithox, deux monstres se rencontrent dans un voile de flamme et de fureur.#!\n\n"
  lv_firewyrm_duel.0001.desc.lands_of_the_long_summer:0 "#medium Ici, où la chaleur de l'été ne faiblit jamais et où le souffle de l'ancienne Valyria demeure, deux monstres se croisent dans une défiance calcinée.#!\n\n"
  lv_firewyrm_duel.0001.desc.elsewhere:0 "#medium Ici, loin des ossements de Valyria, deux terreurs ancestrales se rencontrent comme attirées par le seul destin.#!\n\n"
  lv_firewyrm_duel.0001.desc.final:0 "#medium Vos mains se crispent sur les rênes. Un souffle, un mot, et le ciel s'embrase.#!"
  lv_firewyrm_duel.0001.a:0 "[dragon.GetName], dracarys !"
  lv_firewyrm_duel.0001.b:0 "Sōvēs, [dragon.GetName] !"

  # Defeat
  lv_firewyrm_duel.0003.t:0 "Calciné depuis les Cieux"
  lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLa vouivre en face de vous était devenue immobile, ses yeux en fusion se plissant, sa poitrine se contractant. La vôtre bougea sous vous, agitée, incertaine. Et puis l'ennemie frappa.\n\nElle bondit non avec avertissement, non avec bruit, mais avec le feu fait chair. Un jet de souffle brûlant déchira l'air entre vous, plus rapide que la pensée. Votre monture rugit en défiance, mais la flamme attrapa sa tête et ses épaules, faisant éclater écaille et chair de même.\n\nVous sentîtes la chaleur avant de sentir la douleur : le cuir se transformant en liquide, la peau en cendre. La vouivre de feu sous vous s'effondra dans la ruine d'elle-même, et vous avec elle, disparue dans l'instant où les flammes touchèrent l'os."#!"
  lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe dragon tourna haut au-dessus, silencieux sauf pour le souffle des ailes. Votre vouivre de feu se cabra, mâchoires s'ouvrant, mais l'ombre au-dessus tombait déjà.\n\nLe ciel se fissura avec sa frappe : des serres comme des faux, des dents comme des lances. L'impact conduisit votre monture à la terre, un coup trop soudain, trop précis pour résister. Les écailles se brisèrent. L'os s'effrita. Le sol se fendit sous le poids du dragon et de la vouivre de même.\n\nVous tentâtes de vous lever, mais il n'y avait point de lever. La fureur du dragon vous cloua où vous étiez assis, votre vouivre de feu brisée sous vous. La dernière chose que vous vîtes fut ses ailes occultant la lumière du feu, avant que les ténèbres ne vous réclament entièrement."#!"
  lv_firewyrm_duel.0003.desc.sudden_strike:0 "#medium Il n'y eut nul avertissement, seulement le mouvement.\n\nUn moment, votre dragon cerclait dans l'air épais de cendres, lisant les mouvements étranges et bouillonnants de la créature. Le suivant, la vouivre de feu surgit vers le haut avec une vitesse impossible, un flou d'écailles cramoisies et de fumée braisée. Un rugissement fendit le ciel, non, pas un rugissement, un hurlement, un cri perçant, une chose sans origine, et puis le monde bascula.\n\nLe coup frappa sous l'aile de votre dragon, un choc sauvage qui brisa rythme et équilibre. Le ciel chavira de côté. Vous vous souvenez du silence soudain de la chute, de la ruée brûlante de l'air, de l'éclair de douleur blanc et chaud.\n\nVous et votre dragon ne touchâtes même jamais le sol."#!"

  lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLa vouivre de feu en face de vous se souleva, la poitrine gonflant comme une fournaise au point de rupture. Pour un instant, l'air s'épaissit : la chaleur montant, la cendre dérivant immobile. Puis elle lâcha tout.\n\nLe souffle qu'elle libéra n'était nulle flamme commune, mais une cataracte de ruine blanc-chaud, assez en fusion pour brûler l'air même. Votre vouivre de feu rugit en retour, mâchoires larges, mais l'explosion écrasa sa défiance, dévorant le son avant qu'il ne naisse.\n\nVous et votre monture étiez un en ce moment, pris dans une seule poussée de feu qui défit tout ce qu'elle toucha. Il n'y eut nulle chute, nulle lutte. Seulement la flamme se refermant sur vous, absolue et finale."#!"
  lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe dragon au-dessus ne rugit point, ne tourna point. Il ouvrit seulement ses mâchoires, et le monde se transforma en lumière.\n\nLe premier souffle l'aveugla : une brillance brûlante qui engloutit terre et ciel de même. Votre vouivre de feu se cabra en défiance, les écailles en fusion brûlant plus brillantes, mais rien ne résiste au feu de dragon. Le torrent se déversa comme un jugement, calcinant pierre et chair, acier et os.\n\nVotre monture se débattit une fois sous vous avant de s'effondrer en braises. Les rênes se consumèrent dans vos mains. Le cri dans votre gorge ne quitta jamais vos lèvres. Il n'y eut nulle échappatoire, nulle pitié. Seulement le feu, et le silence après."#!"
  lv_firewyrm_duel.0003.desc.dragonfire:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLa vouivre de feu avait été immobile, trop immobile. Ses yeux en fusion vous suivirent comme en attente, calculant. Et puis elle ouvrit ses mâchoires, larges et déchiquetées comme une caverne brisée, et le monde devint flamme.\n\nUn torrent de feu surgit vers le haut en un geyser de colère blanc-chaud. Votre dragon tenta de virer, tenta de s'élever, mais l'enfer l'attrapa en plein vol, engloutissant aile, écaille et cavalier en une seule flamme hurlante. Le ciel bouillonna autour de vous. Les sangles de selle brûlèrent en cendres. L'air même se retourna contre vous, un vent de braises et de cendres.\n\nVous ne tombâtes point. Vous disparûtes, consumé avant même de pouvoir crier."#!"
  
  lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_firewyrm:0 "#medium Vous vîtes le moment où elle bondit.\n\nLa vouivre rivale ne brûla ni ne rugit, elle se jeta en avant, une montagne de muscle et de peau en fusion. Votre propre monture beugla, se préparant, mais l'impact vous conduisit toutes les deux dans la pierre.\n\nLe sol se brisa sous le poids. La roche déchiquetée se déchira contre l'écaille. Votre vouivre de feu se débattit, l'armure en fusion flamboyant, mais l'autre pressa plus dur, plus lourd, une avalanche de chair et de fureur. Ses mâchoires se refermèrent autour du cou de votre bête, la forçant vers le bas, broyant jusqu'à ce que l'air quitte sa poitrine.\n\nVous criâtes des ordres, mais votre vouivre ne put se lever. Son battement de cœur hésita sous vous, plus lent, plus faible, jusqu'à ce qu'il s'arrête. La pression écrasa aussi le souffle de vos poumons. Les ténèbres vinrent alors que la terre se refermait."#!"
  lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_dragon:0 "#medium Vous vîtes l'ombre occulter le ciel.\n\nLe dragon plongea comme une lance de flamme vivante, ailes repliées, yeux fixés. Votre vouivre de feu se cabra pour le rencontrer, mais la frappe fut plus rapide, plus lourde, imparable. Les deux se heurtèrent avec un coup de tonnerre, et vous fûtes arraché de l'équilibre alors que votre monture fut projetée au sol.\n\nLa terre se fendit sous l'impact du dragon. Les serres clouèrent la chair en fusion, les griffes s'enfonçant à travers l'armure jusqu'à l'os. Votre vouivre se tordit, les écailles en fusion luisant plus chaud, mais chaque poussée ne rencontra que plus de poids, plus de puissance.\n\nLe rugissement du dragon noya le monde alors qu'il pressa vers le bas, les os craquant sous sa prise. Les luttes de votre monture faillirent... et s'arrêtèrent. Vous sentîtes le dernier tremblement sous vous avant que la lumière ne quitte ses yeux. Puis le regard du dragon se tourna vers vous, et il n'y avait nulle part où aller."#!"
  lv_firewyrm_duel.0003.desc.driven_to_ground:0 "#medium Vous vîtes le moment où elle tourna.\n\nLa vouivre de feu se lova, non pour battre en retraite, mais pour s'élever, impossiblement rapide pour quelque chose de sa taille. Puis vint le bond, toute fureur et masse, et avant que votre dragon puisse dégager l'air, elle fut sur vous.\n\nLe monde claqua de côté. Griffes et cendres et douleur. Le poids complet de la bête s'écrasa comme une montagne qui tombe, et votre dragon cria, un cri terrible et gargouillis qui ébranla vos os même alors qu'ils se brisaient avec [fd_loser_dragon.Custom('GetDragonHerHim')]. Les ailes se tordirent. Les côtes se brisèrent. Le sol se creusa.\n\nClouée sous la masse de la vouivre de feu, votre dragon se tordit une fois... puis plus. Vous sentîtes tout : le dernier battement de cœur, le dernier tressaillement de résistance, avant que la pierre ne vienne rencontrer votre crâne."#!"

  lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_firewyrm:0 "#medium Vous donnâtes l'ordre. Votre vouivre bondit, l'armure en fusion flamboyant, chaque muscle tendu pour le meurtre.\n\nMais l'autre fut plus rapide.\n\nElle se tordit sous le poids de votre bête, se lovant avec une précision non naturelle, et ses griffes frappèrent vers le haut : longues, noircies, brûlantes. Une balafra la poitrine de votre vouivre. La seconde déchira plus profond, tranchant à travers chair et tendon rouge-fournaise.\n\nLe son fut humide, déchirant, insupportable. Votre vouivre de feu hurla, le sang en fusion se déversant en torrent qui fumait contre la pierre. La lueur dans son corps vacilla comme une forge mourante.\n\nVous vous accrochâtes un battement de cœur, refusant d'y croire, mais votre monture s'affaissa sous vous, les entrailles se déversant à travers la terre en brins luisants. Son dernier rugissement ébranla vos os avant qu'elle ne s'effondre, vous laissant brisé au sommet d'un cadavre qui fut jadis le feu incarné."#!"
  lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_dragon:0 "#medium Vous donnâtes l'ordre. Votre vouivre obéit, se cabrant avec fureur en fusion, mais le dragon la rencontra de front.\n\nLe ciel se fendit avec la collision, et puis les griffes vinrent : des serres rasoir, conduites avec une précision infaillible. Elles tranchèrent à travers la peau en fusion, séparant écaille et cicatrice comme si elles n'étaient rien.\n\nUn seul cri perçant se déchira de votre monture alors que le dragon tira vers le bas. La chair céda. Les entrailles éclatèrent en un déluge fumant et fumant, se déversant à travers le champ de bataille. La puanteur de fer et de feu submergea l'air.\n\nVotre vouivre chancela, la poitrine creusée, son grand corps se soulevant une fois avant que la lumière dans ses yeux en fusion ne s'atténue en cendres. Vous fûtes projeté en avant dans la ruine de cela, dans les débris fumants de ce qui avait été votre seul bouclier."#!"
  lv_firewyrm_duel.0003.desc.disemboweled:0 "#medium Vous donnâtes l'ordre. Vous vous penchâtes en avant dans la selle, et votre dragon obéit, brave, rapide, loyal.\n\nMais ce ne fut point assez.\n\nLa vouivre de feu surgit avec une vitesse non naturelle, plongeant sous votre frappe et vous rencontrant non avec la flamme mais avec les griffes : longues, noircies et brûlantes. Une déchira à travers les écailles de votre dragon comme parchemin. La seconde trouva prise plus profond encore.\n\nUn son horrible suivit : un cri perçant humide et déchirant qui ne fut ni le cri de votre dragon ni le vôtre. Les entrailles se déversèrent dans le ciel étouffé de cendres comme vapeur d'une forge rompue. L'odeur de sang, en fusion et épais, submergea même le soufre et la fumée.\n\nVous vous accrochâtes un battement de cœur de plus, regardant les yeux de votre dragon s'assombrir alors qu'elle s'effondrait en plein air : une créature de majesté, défaite non par le feu, mais par la sauvagerie brute d'une bête qui ne devrait point être."#!"

  lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_firewyrm:0 "#medium Le ciel brûla de lumière en fusion.\n\nVotre ordre fut tranchant, votre vouivre bondissant en avant avec fureur de fournaise, mais l'autre bougea comme un prédateur né pour rien sinon le massacre. Ses griffes frappèrent en un flou, acier noirci contre magma vivant.\n\nUne fois. Deux fois. Encore. Une frénésie de coups qui déchiquetèrent à travers chair et tendon luisant. Votre vouivre de feu convulsa, le sang en fusion aspergeant le sol en rivières qui sifflèrent et fumèrent.\n\nVous criâtes l'ordre, la suppliant de combattre, mais la balafre mortelle était déjà venue : les entrailles mises à nu, les entrailles luisantes se déversant comme scories d'un creuset brisé. Le cri de la bête faiblit, s'atténuant en grondement creux alors qu'elle s'effondrait sous vous.\n\nLa vouivre rivale ne s'arrêta point. Elle déchira et arracha avec malice implacable, jusqu'à ce que tout ce que vous sentiez soit la ruine tremblante de votre monture se défaire sous votre selle. Le dernier son fut son cri perçant triomphant, résonnant à travers un champ de bataille jonché de cendres et de gore."#!"
  lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_dragon:0 "#medium Le ciel fut rouge de feu et de ruine.\n\nVotre ordre retentit, votre vouivre surgissant en avant, écailles en fusion flamboyant, mais le dragon frappa avec fureur chirurgicale. Ses serres sculptèrent à travers la poitrine blindée de votre bête, déchirant chair et écaille avec précision horrifiante.\n\nUne griffe. Deux. Un râteau sauvage à travers le ventre. Le rugissement de votre vouivre devint un gargouillis étouffé, sang en fusion et entrailles éclatant vers l'extérieur en torrent qui enflamma le sol en feu fumant.\n\nVous criâtes, vous tirâtes, vous combattîtes pour tenir la selle, mais votre monture était déjà brisée. Ailes brisées, côtes fracassées, son corps convulsa en spasmes d'agonie en fusion.\n\nLe dragon ne renonça point. Il déchiqueta ce qui restait, arrachant poitrine de gorge, tendon d'os, jusqu'à ce que votre vouivre de feu gise en ruine, organes luisants éparpillés à travers le champ de bataille. Vous n'eûtes point le temps de tomber. Vous fûtes simplement enterré dans la ruine de cela."#!"
  lv_firewyrm_duel.0003.desc.eviscerated:0 "#medium Le ciel est rouge de feu et de sang.\n\nVotre ordre fut audacieux, mais la bête fut plus audacieuse. La vouivre de feu bondit avec un cri perçant comme acier qui se fend, frappant non avec fureur mais avec dessein. Ses serres s'enfoncèrent profond : une fois, deux fois, une volée de coups sauvages qui séparèrent écaille, peau et chair de même.\n\nVotre dragon se débattit en agonie, ailes faiblissant, souffle se saisissant à mi-rugissement. Vous tîntes bon, criant, pressant, mais il était déjà trop tard. Une balafre finale et brutale fendit son ventre ouvert, et son cri fut coupé court alors que sang et feu jaillirent dans l'air.\n\nLa vouivre ne s'arrêta point.\n\nElle griffa et déchira et déchira encore, une frénésie de haine faite chair. Vous ne vîtes que des éclairs : le claquement d'une aile, le déchirement d'une gorge, votre selle se bouclant sous vous alors que le corps brisé de votre dragon spirala dans la ruine.\n\nLa dernière chose que vous voyez est la vouivre de feu, luisante de gore, criant triomphe à un ciel qui n'oubliera jamais cette boucherie."#!"

  lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_firewyrm:0 "#medium Certains monstres ne devraient jamais naître.\n\nLa vouivre devant vous éclipse même votre propre monture : une fournaise colossale de chair et de fureur, écailles fissurées comme pierre volcanique, yeux brûlant de lumière impie. Votre vouivre de feu, fière et en fusion, tremble en sa présence. L'instinct parle plus fort que l'ordre : ce n'est point proie, point rivale, mais extinction qui a pris forme.\n\nPuis elle bouge.\n\nLe monde tremble alors que la vouivre géante s'abat, griffes clouant votre bête comme si elle n'était rien de plus que charogne. Vous criez, votre monture se débat, mais la lutte ne dure que battements de cœur.\n\nLes mâchoires descendent : vastes, fumantes, terribles. Avec un seul craquement, la moitié de votre vouivre de feu disparaît, cisaillée dans la ruine qui brise les os. Son cri est réduit au silence dans un jet de sang en fusion, et avant que vous puissiez reprendre souffle, le reste de votre monture est traîné hurlant dans l'abîme de sa gorge.\n\nVous êtes encore sanglé.\n\nLa chaleur vous engloutit entièrement. Ténèbres, feu, sang, et puis l'oubli."#!"
  lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_dragon:0 "#medium Certaines batailles ne sont jamais destinées à être gagnées.\n\nLe dragon se dresse au-dessus, titanesque en taille : une légende de croc et d'aile, ombre occultant le ciel même. Comparée à lui, votre vouivre de feu est une torche vacillante devant un soleil furieux. Même votre bête le sait, tremblant sous votre prise alors que l'air même tremble avec le souffle du léviathan.\n\nPuis il frappe.\n\nLe dragon descend comme une montagne qui tombe, griffes fendant la chair de votre vouivre avec aisance cruelle. Vous criez l'ordre, mais ce n'est rien : votre monture est clouée, écrasée, sans défense sous un prédateur plus ancien et plus grand que tout cauchemar.\n\nLa gueule s'ouvre, large comme une caverne, bordée de dents faites pour les dieux, non les bêtes. Et d'une seule morsure, votre vouivre de feu est prise entière, arrachée de sous vous dans un jet de gore en fusion.\n\nVous êtes encore sanglé.\n\nLes mâchoires se ferment. Ténèbres. Sang. Chaleur. La dernière chose que vous sentez est le craquement : la fin de vous, et la fin de votre vouivre, consumés dans le silence."#!"
  lv_firewyrm_duel.0003.desc.chomp:0 "#medium Certains monstres n'étaient point faits pour être affrontés.\n\nLa vouivre de feu s'élève : une chose montagneuse de peau calcinée et de souffle en fusion, bien plus grande que toute bête que vous avez combattue ou rêvée. Votre dragon cercle prudemment, flamme léchant ses mâchoires, mais il y a hésitation maintenant. Une pause. Une terreur instinctive qui parle à une vérité plus profonde : cette chose n'est point parent. Elle est ruine faite chair.\n\nPuis elle bondit.\n\nIl n'y a nul cri perçant, nul rugissement, seulement impact. En un instant, votre dragon est arraché du ciel, cloué et écrasé sous le poids de la vouivre. Vous criez, tirant votre lame, mais c'est inutile. Vous êtes inutile.\n\nLa gueule s'ouvre, vaste et fumante, et avec un craquement écœurant d'os et d'écaille, votre dragon disparaît dans sa gorge.\n\nVous êtes encore sanglé.\n\nLa chaleur est insupportable. Tout est sang, feu, ténèbres.\n\nEt puis rien."#!"

  lv_firewyrm_duel.0003.a.sudden_strike:0 "Nous... n'avons jamais eu la moindre chance."
  lv_firewyrm_duel.0003.a.tt.sudden_strike:0 "Votre bête est abattue en un seul coup inattendu."

  lv_firewyrm_duel.0003.a.dragonfire:0 "La lumière vint trop vite... trop brillante."
  lv_firewyrm_duel.0003.a.tt.dragonfire:0 "Vous et votre bête êtes engloutis dans les flammes, incapables d'échapper à l'enfer."

  lv_firewyrm_duel.0003.a.driven_to_ground:0 "Vole ! Non... non, non, non..."
  lv_firewyrm_duel.0003.a.tt.driven_to_ground:0 "Vous et votre bête êtes conduits au sol, écrasés par l'impact brutal."

  lv_firewyrm_duel.0003.a.disemboweled:0 "Non, [fd_loser_dragon.GetName] ! Tiens bon ! TIENS BON ! Je t'en prie..."
  lv_firewyrm_duel.0003.a.tt.disemboweled:0 "Votre bête est éventrée par les griffes de l'ennemi, et vous regardez impuissant alors que vous tombez tous les deux."

  lv_firewyrm_duel.0003.a.eviscerated:0 "Déchire-nous donc, si tu le dois."
  lv_firewyrm_duel.0003.a.tt.eviscerated:0 "Votre bête est éviscérée, et bientôt vous suivez."

  lv_firewyrm_duel.0003.a.chomp:0 "Argh ! Non, non..."
  lv_firewyrm_duel.0003.a.tt.chomp:0 "Vous et votre bête êtes dévorés en une seule morsure brutale."

  # Victory
  lv_firewyrm_duel.0004.t:0 "Dans le Sillage de l'Enfer"

  lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_firewyrm:0 "#medium L'air est épais de cendres, mais seulement pour un battement de cœur.\n\nVotre vouivre de feu se love, puis se lance avec vitesse impossible. La vouivre rivale n'a point le temps de se cabrer ou de vomir son souffle de fournaise avant que votre bête ne soit sur elle.\n\nLa frappe est impitoyable. Les serres s'enfoncent dans crâne et épine, mâchoires claquant avec force volcanique. La rivale s'effrite à mi-rugissement, son feu mourant dans sa gorge.\n\nElle tombe en silence, une montagne de chair brisée en un instant.\n\nLa victoire ne vint point d'endurance, mais de précision."#!"
  lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_dragon:0 "#medium La tempête d'ailes du dragon s'arrête, mais seulement pour un battement de cœur.\n\nVotre vouivre de feu fonce, plus rapide qu'aucun œil de dragon ne peut suivre, et bondit assez haut dans l'air pour intercepter la créature aérienne. Un instant la bête se cabre, mâchoires luisant de flamme ; le suivant, elle est abattue.\n\nLes griffes déchirent à travers sa gorge, dents écrasant l'os avant qu'un seul souffle ne puisse quitter sa poitrine. Le dragon convulse une fois, deux fois, puis s'effondre, son feu éteint avant qu'il ne puisse brûler.\n\nIl meurt en silence, volé de gloire, sa majesté terminée en un seul coup parfait.\n\nLa victoire fut plus rapide que la pensée, plus tranchante que la flamme."#!"
  lv_firewyrm_duel.0004.desc.sudden_strike:0 "#medium Le vent s'immobilise, mais seulement pour un battement de cœur.\n\nVotre dragon bouge en premier. Un virage brusque des ailes, une spirale descendante, et puis une poussée impossible de vitesse. Avant que la vouivre de feu ne puisse crier, se lover ou vomir son feu infernal, votre dragon est déjà sur elle.\n\nLes griffes frappent juste : un coup sauvage au crâne, ou la gorge, ou la base de l'épine, et la vouivre s'effrite comme scories versées sur pierre froide.\n\nElle meurt sans gloire, sans rugissement, sans flamme de fureur. Juste un effondrement. Un souffle volé. Et puis l'immobilité.\n\nLa victoire ne vint point avec lutte, mais avec précision."#!"

  lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_firewyrm:0 "#medium Le ciel tremble alors que votre vouivre de feu exhale la ruine.\n\nUn torrent de souffle en fusion éclate, blanc-chaud et brûlant, inondant l'air de brillance aveuglante. Il s'abat dans la vouivre rivale avec le poids d'une étoile qui tombe, noyant écaille et chair de même dans un enfer qui s'accroche comme goudron.\n\nLa bête crie perçant : un son déchiqueté, mi-fureur, mi-terreur, alors que son corps noircit et se fend, fissures luisantes courant à travers sa charpente. Encore elle se débat, bondissant en avant, mais le feu consume plus vite qu'elle ne peut bouger.\n\nLe sol couve sous sa chute, pierre coulant comme cire.\n\nQuand les flammes meurent, rien ne demeure qu'une coque calcinée, fumant dans l'air cendré. Le feu d'un monstre a terminé un autre."#!"
  lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_dragon:0 "#medium Les cieux s'enflamment alors que votre vouivre de feu respire profond et libère l'enfer.\n\nL'explosion rugit en avant dans un déluge de flamme en fusion, rouge-or et aveuglante, engloutissant le dragon avant qu'il ne puisse virer. Ses ailes fières flamboient, mais le feu s'accroche à chaque veine emplumée, chaque écaille, chaque souffle.\n\nIl crie : un cri terrible et tonnant, mais le feu ne cède point. La flamme mange à travers peau, muscle et os, ne laissant que silhouette contre un ciel de fournaise.\n\nEnfin, le cri se brise, ailes se repliant alors que le dragon s'écrase vers la terre, traînant feu comme un soleil qui tombe.\n\nCe qui s'élève après n'est que fumée et silence. Le dragon gît immobile, cendre et braise où majesté planait jadis."#!"
  lv_firewyrm_duel.0004.desc.dragonfire:0 "#medium L'air brûle alors que [fd_attacker_dragon.GetName] exhale la fureur.\n\nLe feu éclate de ses mâchoires en torrent de chaleur et lumière, or-rouge et aveuglant contre le ciel cendré. Il s'écrase dans la vouivre de feu comme marée de jugement, engloutissant sa charpente tordue dans un enfer plus ancien que les rois. La créature hurle : un cri perçant qui sonne moins comme douleur et plus comme rage refusée, alors que sa peau commence à boursoufler, noircir, peler.\n\nLa bête se débat sauvagement, flammes s'accrochant à sa forme comme malédiction. Pour un battement de cœur, elle charge en avant : brûlante, à demi aveugle, défiant jusqu'au bout, mais la flamme ne faiblit point. La chaleur fond la pierre sous elle.\n\nEt puis, silence.\n\nSeuls fumée et puanteur de viande calcinée demeurent. La vouivre de feu tombe immobile : une coque fumante parmi les os du vieil empire."#!"

  lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_firewyrm:0 "#medium Le monde bascule alors que votre vouivre de feu bondit avec force effrayante.\n\nAvec un rugissement qui fend l'air même, elle s'écrase dans la vouivre rivale, tout muscle et fureur en fusion s'abattant comme marteau. La terre se soulève sous l'impact, cendre et roche éclatant vers l'extérieur en tempête étouffante.\n\nL'ennemie crie perçant, non en triomphe, mais en choc, alors qu'elle est écrasée dans le sol, membres se brisant, spires battant inutilement contre le poids. La terre même se fend sous ses convulsions, entaillée et cicatrisée par ses affres de mort.\n\nIl n'y a rien de gracieux ici. Seulement sauvagerie. Votre vouivre de feu presse plus dur, fumée se déversant de ses mâchoires, puis frappe : dents fendant profond, jusqu'à ce que les cris de la vouivre rivale se brisent en silence et poussière."#!"
  lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_dragon:0 "#medium Votre bête ramène le combat au sol.\n\nVotre vouivre de feu se précipite en avant dans tempête de fureur, saisissant la queue du dragon à mi-virage et le traînant hors de l'air comme proie arrachée du vol. Le sol monte vite, et puis le monde explose en poussière et feu alors que les deux bêtes s'abattent dans la terre.\n\nLe dragon crie, ailes se brisant sous le poids qui le cloue. Ses serres grattent et griffent, creusant sillons dans pierre, mais rien ne trouve prise. La vouivre de feu se love plus serré, pressant avec force brute et brutale, jusqu'à ce que l'os se brise et la terre coule rouge.\n\nIl n'y a nulle cérémonie dans le meurtre. Nulle gloire. Seulement domination. Une plongée finale de crocs réduit le dragon au silence pour toujours, ne laissant que sa forme brisée dans les cendres."#!"
  lv_firewyrm_duel.0004.desc.driven_to_ground:0 "#medium Le ciel se rétrécit alors que nous descendons.\n\nAvec un rugissement qui ébranle les os du monde, [fd_attacker_dragon.GetName] s'abat dans la vouivre de feu d'en haut : force d'ailes, serres et fureur rencontrant chair brûlante et haine. Le sol tremble alors que nous nous écrasons dans la terre calcinée, cendre volcanique éclatant vers l'extérieur comme vague noire.\n\nLa vouivre de feu crie perçant, non de douleur, mais d'incrédulité, alors qu'elle est conduite sous notre poids, clouée contre pierre fissurée comme bête chassée. Une de ses pattes se tord avec pop écœurant, et son corps serpentin se débat, entaillant profondes ornières dans sol taché de fusion.\n\nIl n'y a nulle élégance au meurtre. Seulement domination brute. [fd_attacker_dragon.GetName] gronde, fumée se déversant de ses narines, et se penche. Dents rencontrent os. Le cri final de la vouivre de feu s'estompe dans vent étouffé de cendres."#!"

  lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_firewyrm:0 "#medium Deux titans se tordent et s'écrasent ensemble, spires frappant comme tours qui tombent. Avec rugissement qui ébranle os, votre vouivre de feu fouette de côté, griffes entaillant dans ventre de sa rivale. Une fois, deux fois, puis plus profond, déchirant au-delà écaille et peau.\n\nSang éclate, en fusion et noir-rouge, éclaboussant à travers pierre brisée. La vouivre blessée convulse, corps serpentin se tordant violemment, entaillant tranchées dans cendre. Mais elle ne peut se libérer.\n\nVotre vouivre de feu pousse plus dur, serres accrochées, et déchire la bête large. Vapeur s'élève du torrent d'entrailles se déversant dans terre. La rivale donne sifflement étranglé, puis tombe immobile : sa ruine étalée sur sol calciné."#!"
  lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_dragon:0 "#medium Acier rencontre chair-feu alors que dragon bondit, ailes battant furieusement pour s'élever au-dessus. Mais vouivre de feu est plus rapide au sol : spire soudaine, frappe, griffes déchirant dans son ventre.\n\nSang jaillit en jets de chaleur en fusion, ailes du dragon faiblissant alors qu'il chancelle sous coup. Il crie perçant, tranchant sauvagement, mais vouivre ne renonce point. Autre râteau de griffes, sauvage et précis, et son ventre se fend large.\n\nEntrailles cascadent vers pierre, fumantes et répugnantes. Dragon s'effondre en tas brisé, son feu se consumant avec dernier rugissement gémissant. Vouivre de feu se love au-dessus, victorieuse, alors que champ de bataille coule rouge."#!"
  lv_firewyrm_duel.0004.desc.disemboweled:0 "#medium Acier, écaille et fureur s'entrechoquent. Avec cri perçant furieux, votre dragon râcle ses griffes à travers flanc de vouivre de feu : une fois, deux fois, puis pousse pour meurtre. Sang comme métal en fusion jaillit des blessures de bête, sifflant en frappant pierre calcinée.\n\nVouivre de feu se débat, charpente tendineuse se tordant comme serpent en flamme. Mais votre dragon ne renonce point. Coup final et brutal fend ventre de vouivre ouvert. Ses entrailles se déversent à travers terre brisée : vapeur s'élevant de ruine de ce qui fut jadis prédateur de cauchemars.\n\nVouivre de feu ne fait nul son en mourant, seulement grand exhale frissonnant qui sent soufre et pourriture ancienne."#!"

  lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_firewyrm:0 "#medium Leurs corps s'entrechoquent avec son comme pierre qui craque. Griffes brillent, dents claquent, puis votre vouivre de feu trouve sa marque. Elle râcle vers bas, fendant à travers écailles en fusion, déchirant au-delà muscle et tendon jusqu'à ce que ventre rivale béant large.\n\nBête blessée convulse, vomissant feu et bile de ruine dans ses entrailles. Elle se tord, sifflant en fureur et douleur, mais ne peut se libérer. Votre vouivre de feu creuse plus profond, traînant serres à travers fournaise de son ennemi.\n\nDernière traction : chair et organe se déversent fumant à travers sol. Rivale frissonne une fois, puis s'effondre en silence, sang vital calcinant terre où elle tombe."#!"
  lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_dragon:0 "#medium Dragon plonge, ailes battant ciel étouffé de cendres, mais vouivre de feu se tord sous lui, flou de muscle écaillé. Avec frappe soudaine elle s'accroche, griffes s'enfonçant profond dans ventre mou.\n\nUne traction sauvage, et peau dragon se fend comme tissu. Rugissement d'agonie se déchire de sa gorge alors que feu et sang jaillissent, pleuvant en arcs en fusion. Il se débat, tentant de se hisser vers ciel, mais vouivre tient ferme, déchirant plus profond.\n\nAvec déchirement brutal entrailles dragon se libèrent, fumant dans cendre. Ses ailes faiblissent, corps s'écrasant dans terre calcinée en-dessous. Vouivre de feu se dresse au-dessus ruine qui tressaille, victorieuse, alors que silence noie champ bataille."#!"
  lv_firewyrm_duel.0004.desc.eviscerated:0 "#medium Écailles rouge-acier se déchirent comme toile pourrie.\n\nGriffes de votre dragon râclent profond, au-delà peau en fusion et muscle fumant, jusqu'à ce que ventre vouivre de feu soit mis à nu. Bête crie perçant, non en défiance, mais en agonie, alors que flamme et bile se déversent de entaille, cœur-fournaise exposé à air frais étouffé de cendres.\n\nElle se tord, battant contre mort, mais votre dragon tient ferme. Autre déchirement sauvage, autre panache de gore, jusqu'à ce que luttes créature deviennent tremblements... et puis, rien du tout.\n\nSes entrailles fument sur terre brisée. Terreur des profondeurs, défaite par croc et fureur."#!"

  lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_firewyrm:0 "#medium Il n'y a nul duel, nulle contestation. Seulement faim.\n\nVouivre rivale se love pour frapper : trop lente. Votre vouivre de feu bondit, mâchoires béant larges, et les claque autour section médiane de son ennemi. Os craque. Écailles se fissurent. Cri perçant serpent est coupé court, étouffé par prison de dents.\n\nElle se débat, à demi avalée, queue fouettant en fureur. Mais votre vouivre de feu ne fait que mordre plus profond, gueule travaillant avec finalité obscène. En moments rivale disparaît, traînée vers bas en gorgées humides, luttes s'estompant en silence.\n\nCe qui demeure est immobilité et relent lourd de sang dans air. Une terreur a consumé autre."#!"
  lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_dragon:0 "#medium Dragon tourne au-dessus, ailes coupant ciel épais de cendres, mais il plonge trop bas. Vouivre de feu surgit vers haut, gueule béant, et le saisit avec claquement tonnant. Serres battent sauvagement, écailles grincent contre dents, mais morsure vouivre tient ferme.\n\nOs gémit. Ailes se déchirent. Rugissement étranglé résonne alors que dragon est secoué comme proie, claqué dans terre, puis soulevé encore en jet de cendre et sang. Mâchoires vouivre de feu travaillent affamées, écrasant et avalant, insoucieuses des cris s'estompant de bête.\n\nEnfin dragon est brisé : ruine traînée vers bas dans gosier vouivre. Silence suit, brisé seulement par sifflement écailles contre pierre. Ciel est vide. Vouivre de feu endure."#!"
  lv_firewyrm_duel.0004.desc.chomp:0 "#medium Il n'y a nulle élégance en ceci, seulement domination faite chair.\n\nVouivre de feu se cabre pour frapper, mais votre dragon bondit avec finalité terrifiante. Mâchoires comme portes château claquent autour bête, écrasant écaille volcanique et tendon avec craquement humide et broyant. Cri étouffé se perd dans gorge de votre dragon alors qu'il lance vouivre de feu comme charogne, gueule travaillant affamée, gorge bombant.\n\nEn secondes, horreur des ruines est réduite à forme avalée, tressaillant une fois alors qu'elle glisse vers néant.\n\nAir s'immobilise. Terre, jadis terrorisée, va silencieuse sous ombre vrai prédateur au sommet."#!"

  lv_firewyrm_duel.0004.a.sudden_strike:0 "Rapide. Propre. Fini."
  lv_firewyrm_duel.0004.a.tt.sudden_strike:0 "Votre monture frappe avec force soudaine et brutale, terminant vie de bête en seul coup."

  lv_firewyrm_duel.0004.a.dragonfire:0 "Brûle, chose misérable !"
  lv_firewyrm_duel.0004.a.tt.dragonfire:0 "Votre monture libère torrent de feu, engloutissant bête en flammes."
  
  lv_firewyrm_duel.0004.a.driven_to_ground:0 "C'est ça, [fd_victor_dragon.GetName] ! Achève-la !"
  lv_firewyrm_duel.0004.a.tt.driven_to_ground:0 "La bête est dévorée parmi morsures déchaînées de [fd_victor_dragon.GetNameNoTooltip]"

  lv_firewyrm_duel.0004.a.disemboweled:0 "Déchire ! Arrache ! Qu'elle saigne !"
  lv_firewyrm_duel.0004.a.tt.disemboweled:0 "La bête est mise en pièces par [fd_victor_dragon.GetNameNoTooltip], ses entrailles se déversant sur sol."

  lv_firewyrm_duel.0004.a.eviscerated:0 "Qu'elle brûle de l'intérieur !"
  lv_firewyrm_duel.0004.a.tt.eviscerated:0 "Votre monture fend ventre de bête, exposant entrailles à air."

  lv_firewyrm_duel.0004.a.chomp:0 "Et cela... c'est fini."
  lv_firewyrm_duel.0004.a.tt.chomp:0 "Votre monture dévore bête en seule morsure brutale."
  lv_firewyrm_duel.0004.chomp.t:0 "[fd_victor_dragon.GetNameNoTooltip] Apprécie le Goût"

  # Post-Round 1 Text
  lv_firewyrm_duel.0001.desc.succeeding:0 "#medium Le ciel bouillonne de chaleur et cendres alors que bataille ne montre nul signe de faiblir. Fumée se love comme doigts qui saisissent, et flamme zèbre nuages en éclats de fureur. Chaque battement d'ailes de votre dragon remue braises de terre noircie en-dessous. Vouivre de feu, rendue folle et implacable, cercle en son propre rythme brutal. Ce n'est nul simple choc : c'est guerre de volontés écrite à travers cieux."#!"
  lv_firewyrm_duel.0001.desc.succeeding.final:0 "#medium \n\nLe rythme de bataille continue, feu et fureur battant comme second cœur dans votre poitrine. Autre mouvement doit être fait."#!"

  # Post-Special States
  lv_firewyrm_duel.0001.stunned:0 "Tiens bon... respire juste..."
  lv_firewyrm_duel.0001.tt.stunned.firewyrm:0 "Votre vouivre de feu chancelle de dernière attaque de bête, incapable d'agir ce tour."
  lv_firewyrm_duel.0001.tt.stunned:0 "Votre dragon chancelle de dernière attaque de bête, incapable d'agir ce tour."
  lv_firewyrm_duel.0001.desc.stunned.firewyrm_vs_firewyrm:0 "\n\n#medium La brume se lève. Votre vouivre se débat de tête, crachat en fusion sifflant où il tombe, alors que étourdissement frissonne hors de son corps. Faiblesse passe, mais non sans coût. Pierre calcinée et silhouette imposante autre vouivre se dressent devant, ses évents fumant encore de cri perçant. Votre bête beugle, rugissement guttural plus fournaise que voix. Quel que soit emprise ce cri eut... elle est brisée maintenant."#!"
  lv_firewyrm_duel.0001.desc.stunned.firewyrm_duel:0 "\n\n#medium La brume se lève. Votre vouivre se soulève, peau en fusion ondulant alors qu'elle griffe retour contrôle. Moment d'immobilité est parti, mais piqûre de cela demeure. Au-dessus, dragon tourne dans ciel, ailes coupant à travers fumée comme lames, son cavalier pressant déjà attaque. Votre bête laisse échapper cri perçant qui ébranle air, évents flamboyant de chaleur. Quelle que soit force qui l'a clouée... elle ne durera point."#!"
  lv_firewyrm_duel.0001.desc.stunned:0 "\n\n#medium La brume se lève. Votre dragon cligne, muscles tendant alors que clarté retourne à ses yeux. Moment de faiblesse est passé, mais non sans coût. Terre calcinée et forme imposante vouivre de feu vous accueillent alors que bataille reprend. Vous sentez votre monture respirer profond, grondement bas se construisant dans sa poitrine. Quel que soit emprise ce cri perçant eut... elle est brisée maintenant."#!"

  lv_firewyrm_duel.0001.takeoff:0 "Nous avons besoin d'altitude ! Sortez-nous d'ici !"
  lv_firewyrm_duel.0001.tt.takeoff:0 "Votre dragon tente de gagner altitude, essayant d'échapper à portée de vouivre de feu."
  lv_firewyrm_duel.0001.desc.takeoff:0 "\n\n#medium Vous pressez votre dragon vers haut, ailes tendant contre poids de cendres et fumée. Yeux en fusion de vouivre de feu suivent, mais elle ne peut égaler votre ascension. Pour moment, vous êtes libre : sol s'éloigne, ciel s'ouvre, et vous pouvez respirer encore. Mais bête est implacable. Elle ne vous laissera point échapper si facilement."#!"

  lv_firewyrm_duel.0001.land:0 "Nous devons atterrir ! Maintenant !"
  lv_firewyrm_duel.0001.tt.land:0 "Votre dragon tente d'atterrir, essayant de reprendre contrôle de situation."
  lv_firewyrm_duel.0001.desc.land:0 "\n\n#medium Avec traction brusque sur rênes et ordre crié, vous guidez votre dragon vers bas à travers ciel étouffé de cendres. Vent calciné fouette à votre visage alors que serres s'écrasent contre terre brisée. Sol gémit sous poids de votre monture alors qu'ailes se replient, fumée se lovant entre pierre fissurée et évents en fusion. Vous plissez yeux à travers brume : vouivre de feu rôde devant, ses yeux charbons brûlants dans pénombre. Cieux sont derrière vous maintenant. Reste de cette bataille se combattra où légendes tombent : sur sol, parmi ruine et flamme."#!"

  lv_firewyrm_duel.0001.warning.force_land:0 "@warning_icon! #X Votre dragon sera forcé d'atterrir en exécutant ce mouvement !#!"
  lv_firewyrm_duel.0001.warning.burn_contact:0 "@warning_icon! #X Tout mouvement impliquant contact avec vouivre de feu pendant qu'elle est en état en fusion brûlera ou blessera davantage votre dragon !#!"
  lv_firewyrm_duel.0001.warning.burn_incoming:0 "@warning_icon! #X La flamme de vouivre de feu se rapproche ! Votre dragon sera brûlé ou davantage blessé si vous ne réagissez point à temps !#!"
  lv_firewyrm_duel.0001.warning.nullified:0 "@warning_icon! #X Ce mouvement n'infligera nuls dégâts dans état actuel de vouivre de feu !#!"

  # Dragon Moves
  lv_firewyrm_duel.0001.circle_beast:0 "Continue de bouger. Laisse-la deviner où prochain coup atterrit."
  lv_firewyrm_duel.0001.tt.circle_beast:0 "Votre dragon garde ses distances, cerclant vouivre de feu pour provoquer confusion ou attirer ouverture."
  lv_firewyrm_duel.0001.desc.circle_beast:0 "\n\n#medium Votre dragon bat large arc à travers ciel étouffé de fumée, gardant juste au-delà portée de vouivre. Bête gronde et se tord, vous traquant avec yeux luisants. Vous n'offrez nulle ouverture, pourtant vous apprenez comment elle bouge, comment elle se love avant frappe."#!"

  lv_firewyrm_duel.0001.flame_test:0 "Voyons combien de feu elle peut avaler."
  lv_firewyrm_duel.0001.tt.flame_test:0 "Votre dragon respire jet mesuré de flamme, non pour blesser, mais pour tester propre résistance de vouivre de feu."
  lv_firewyrm_duel.0001.desc.flame_test:0 "\n\n#medium Vous signalez éclat contrôlé de flamme de dragon, non destiné à tuer, mais à provoquer. Vouivre de feu surgit à travers avec aisance troublante... ou frissonne, reculant alors que flamme se love le long de ses écailles. Maintenant, du moins, vous comprenez ce qu'elle peut endurer."#!"
  
  lv_firewyrm_duel.0001.claws_out:0 "Vise les membres ! Emmêle-la avant qu'elle ne frappe encore !"
  lv_firewyrm_duel.0001.tt.claws_out:0 "Bondissement basique mais direct visant à griffer pattes ou flancs de vouivre de feu."
  lv_firewyrm_duel.0001.desc.claws_out:0 "\n\n#medium Nulle finesse, nulle stratégie, juste dents et serres. Votre dragon s'écrase vers vouivre en contestation primale de force. Air chante avec violence alors que deux monstres râclent et fouettent l'un l'autre, écaille et tendon déchirés en passant."#!"

  lv_firewyrm_duel.0001.reckless_dive:0 "Au diable les risques, nous y allons maintenant !"
  lv_firewyrm_duel.0001.tt.reckless_dive:0 "Plongée haute vitesse en portée mêlée. Dangereux pour cavalier et bête, mais pourrait terminer choses rapidement."
  lv_firewyrm_duel.0001.desc.reckless_dive:0 "\n\n#medium Vous vous penchez bas dans vent et conduisez votre dragon en plongée brutale. Vous déchirez à travers feu et cendres comme lance vivante, mais vitesse imprudente est pari. Frapper ou manquer, vous payez en sang ou souffle."#!"

  lv_firewyrm_duel.0001.guard_skies:0 "Garde formation. Protège ailes et gorge."
  lv_firewyrm_duel.0001.tt.guard_skies:0 "Votre dragon protège ses parties vulnérables et cercle à altitude, minimisant ouvertures pour frappes de vouivre de feu."
  lv_firewyrm_duel.0001.desc.guard_skies:0 "\n\n#medium Vous appelez votre dragon plus haut, ses ailes balayant halo protecteur à travers air lacé de ruine. Nulles brèches, nulles poussées sauvages. Vous chevauchez vent comme lame sur tranchant, prêt à parer tout ce que bête hurle votre voie."#!"

  lv_firewyrm_duel.0001.rip_joints:0 "Ses genoux fléchissent comme toute bête. Frappe juste !"
  lv_firewyrm_duel.0001.tt.rip_joints:0 "Frappe précise visant articulations ou plaques exposées de vouivre. Risqué, mais potentiellement fin de combat."
  lv_firewyrm_duel.0001.desc.rip_joints:0 "\n\n#medium Non la tête. Non le ventre. Vous signalez vers coutures de son corps : où écaille rencontre muscle, où elle doit bouger pour frapper. Votre dragon griffe juste, et vouivre de feu hurle alors qu'une patte spasme sous son poids."#!"

  lv_firewyrm_duel.0001.roar_challenge:0 "Qu'elle sache que nous ne sommes point proie."
  lv_firewyrm_duel.0001.tt.roar_challenge:0 "Votre dragon libère rugissement assourdissant, tentant d'énerver ou provoquer vouivre de feu en agression précipitée."
  lv_firewyrm_duel.0001.desc.roar_challenge:0 "\n\n#medium Vous pressez votre dragon à beugler, son profond qui ébranle âme répondant à propre folie de vouivre de feu avec fureur draconique. Réponse est immédiate : bête charge, enragée et irréfléchie. Vous avez attiré son ire. Maintenant survivez-y."#!"

  lv_firewyrm_duel.0001.dive_strike:0 "Entrer et sortir, assez rapide pour la saigner sans être brûlé."
  lv_firewyrm_duel.0001.tt.dive_strike:0 "Passe rapide à travers portée de vouivre, visant à laisser blessure et disparaître avant que représailles ne puissent atterrir."
  lv_firewyrm_duel.0001.desc.dive_strike:0 "\n\n#medium Vous repérez ouverture : brève, incertaine, et plongez à travers elle comme coup de foudre. Votre dragon râcle son flanc en passant, ne s'arrêtant point pour choquer mais bougeant droit à travers espace de bête, transformant ciel même en arme."#!"

  lv_firewyrm_duel.0001.tailspin_slam:0 "Tourne-toi et brise-lui les côtes !"
  lv_firewyrm_duel.0001.tt.tailspin_slam:0 "Votre dragon se fouette en choc tourbillonnant, tentant de briser os avec force pure."
  lv_firewyrm_duel.0001.desc.tailspin_slam:0 "\n\n#medium Vous commandez roulement et torsion, votre dragon tournant avec grâce violente. Vouivre est lente à réagir : étourdie ou lente, et queue de votre dragon descend comme marteau sur son côté. Os craque. Air même sursaute."#!"

  lv_firewyrm_duel.0001.wound_exploit:0 "Cette entaille n'a point guéri. Nous nous assurerons qu'elle ne le fera jamais."
  lv_firewyrm_duel.0001.tt.wound_exploit:0 "Vous exploitez blessure antérieure, espérant l'élargir et drainer dernier de force de vouivre de feu."
  lv_firewyrm_duel.0001.desc.wound_exploit:0 "\n\n#medium Vous le voyez : endroit brûlé nu d'écailles, luisant de sang et chaleur. Un ordre précis, et votre dragon plonge vers lui. Serres trouvent chair. Vouivre crie en agonie alors que blessure est déchirée plus large, sa force fuyant avec chaque battement."#!"

  lv_firewyrm_duel.0001.vipers_feint:0 "Glisse gauche. Frappe droite."
  lv_firewyrm_duel.0001.tt.vipers_feint:0 "Faux mouvement éblouissant : seul cavalier de ruse peut l'exécuter proprement."
  lv_firewyrm_duel.0001.desc.vipers_feint:0 "\n\n#medium Comme serpent en vol, vous changez angles mi-air : feinte, puis frappe d'un chemin impossible. Votre dragon se tord à travers souffle de flamme et livre râteau punissant avant que vouivre ne réalise même où vous êtes allé."#!"

  lv_firewyrm_duel.0001.dragonflame_barrage:0 "Brûle-la, encore et encore !"
  lv_firewyrm_duel.0001.tt.dragonflame_barrage:0 "Votre dragon lâche barrage complet de flamme, visant à submerger vouivre avec puissance de feu brute."
  lv_firewyrm_duel.0001.desc.dragonflame_barrage:0 "\n\n#medium Vous ne retenez point. Avec rugissement, votre dragon libère torrent de feu en vagues balayantes. Vouivre gronde et recule sous chaleur, sa peau s'allumant. Ce n'est point meurtre, mais c'est message sculpté en flamme."#!"

  lv_firewyrm_duel.0001.chomp:0 "#bold CROQUE #!"
  lv_firewyrm_duel.0001.tt.chomp:0 "Vous #bold CROQUEZ #!"

  lv_firewyrm_duel.0001.commanding_cry:0 "Concentre-toi, mon ami ! Nous respirons ensemble !"
  lv_firewyrm_duel.0001.tt.commanding_cry:0 "Cri de ralliement à votre dragon, le pressant à se concentrer et synchroniser ses attaques avec vôtres."
  lv_firewyrm_duel.0001.desc.commanding_cry:0 "\n\n#medium Avec mot : ancien, puissant, vous calmez souffle de votre dragon. Vous murmurez force dans ses oreilles. Son battement d'aile se stabilise, son sang ralentit. Blessures se raccommodent juste assez pour vol. Vous achetez autre tour... peut-être plus."#!"

  lv_firewyrm_duel.0001.hidden_knowledge:0 "Je me souviens des anciens textes. [dragon.GetName], fais exactement comme je commande !"
  lv_firewyrm_duel.0001.tt.hidden_knowledge:0 "Vous rappelez tactique spécifique des anciens textes valyriens, espérant qu'elle tournera marée de bataille."
  lv_firewyrm_duel.0001.desc.hidden_knowledge:0 "\n\n#medium Vous rappelez récits. Tactiques que Valyriens utilisaient jadis quand dragons n'étaient point bêtes mais armes de guerre. Votre dragon bouge avec même rythme maintenant : transformant sagesse ancienne en mort aérienne. Vouivre ne s'y attend point."#!"

  lv_firewyrm_duel.0001.risk_it_all:0 "Ceci se termine d'une façon : sang et cendres."
  lv_firewyrm_duel.0001.tt.risk_it_all:0 "Vous misez tout sur une charge désespérée. Si ça marche, duel se termine. Sinon... vous aussi."
  lv_firewyrm_duel.0001.desc.risk_it_all:0 "\n\n#medium Vous donnez ordre impensable. Votre dragon tombe du ciel comme pierre, griffes nues, flamme montant. Vouivre s'élève pour vous rencontrer. Deux monstres, un choc final. Il n'y aura nulle seconde frappe."#!"

  lv_firewyrm_duel.0001.collapse_ground:0 "Fais s'effondrer le sol sur elle ! Que terre avale ce monstre !"
  lv_firewyrm_duel.0001.tt.collapse_ground:0 "Vous commandez votre dragon de libérer torrent de feu au sol, le déstabilisant et espérant enterrer vouivre de feu dans terre qui s'effondre."
  lv_firewyrm_duel.0001.desc.collapse_ground:0 "\n\n#medium Vous conduisez vouivre de feu en arrière, plus bas et plus bas, et puis signalez attaque. Pierre craque sous ses membres. Terre gémit. Effondrement soudain, panache de poussière, et bête disparaît en hurlement sous plancher de ruine brisé."#!"

  # Firewyrm Moves
  lv_firewyrm_duel.0001.fume_burst:0 "Calcine l'air, [fd_round_me_dragon.GetName] ! Emplis ses poumons de feu !"
  lv_firewyrm_duel.0001.tt.fume_burst:0 "[fd_round_me_dragon.GetName] libère nuage de gaz surchauffé, visant à ébouillanter et désorienter [fd_round_opponent_dragon.GetName]."
  lv_firewyrm_duel.0001.desc.fume_burst.firewyrm_vs_firewyrm:0 "\n\n#medium À votre ordre, votre vouivre beugle et se soulève, fendant air avec rugissement né de fournaise. Elle évente nuage de vapeurs bouillantes, vapeur en fusion sifflant des évents le long de son épine dorsale. Vouivre ennemie se débat contre brume ébouillantante, sa peau boursoufflant où brume brûlante s'accroche. Deux fournaises vivantes s'affrontent, mais en ce moment, vôtre brûle plus chaud."#!"
  lv_firewyrm_duel.0001.desc.fume_burst:0 "\n\n#medium Votre vouivre arque son corps en fusion, fissures le long de sa peau luisant plus brillant alors qu'elle libère torrent de vapeurs ébouillantantes. Brume étouffante engloutit dragon, ailes faiblissant alors que bête recule de chaleur suffocante. Feu-fait-chair lutte contre feu-fait-faux, air même se transformant en votre arme alors que dragon crie perçant en rage et douleur."#!"
  lv_firewyrm_duel.0001.desc.counter.fume_burst.firewyrm_vs_firewyrm:0 "\n\n#medium Vouivre de feu inhale profondément, puis libère nuage de vapeurs ébouillantantes. Votre dragon recule, ailes flamboyant alors qu'il tente d'échapper à brume brûlante. Vous sentez chaleur même d'ici : rappel que cette bête n'est point juste flamme, mais fournaise vivante."#!"
  lv_firewyrm_duel.0001.desc.counter.fume_burst:0 "\n\n#medium Vouivre de feu inhale profondément, puis libère nuage de vapeurs ébouillantantes. Votre dragon recule, ailes flamboyant alors qu'il tente d'échapper à brume brûlante. Vous sentez chaleur même d'ici : rappel que cette bête n'est point juste flamme, mais fournaise vivante."#!"

  lv_firewyrm_duel.0001.boneshattering_screech:0 "Crie jusqu'à ce que pierre même se brise !"
  lv_firewyrm_duel.0001.tt.boneshattering_screech:0 "[fd_round_me_dragon.GetName] émet cri perçant assourdissant, visant à désorienter et déséquilibrer [fd_round_opponent_dragon.GetName]."
  lv_firewyrm_duel.0001.tt.boneshattering_screech.effect:0 "[fd_round_opponent_dragon.GetName] est étourdi par ce cri perçant qui brise os"
  lv_firewyrm_duel.0001.desc.boneshattering_screech.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre s'arque, fissures flamboyant, avant de libérer cri tiré du cœur en fusion de terre. Son est tourment brut, fendant pierre et ciel. À travers champ de bataille, autre vouivre s'effondre en spasme de fureur et douleur, ses membres se verrouillant alors qu'elle trébuche. Deux fournaises vivantes s'entrechoquent, mais vôtre a volé voix de gouffre, et elle laisse rivale brisée, étourdie dans poussière."#!"
  lv_firewyrm_duel.0001.desc.boneshattering_screech:0 "\n\n#medium Votre vouivre se cabre, évents flamboyant, et lâche cri perçant qui brise air même. Dragon se raidit mi-rugissement, yeux larges alors que son s'abat en lui avec force de marteau. Ailes faiblissent, flamme vacille, et créature chancelle, étourdie et titubante. Feu-fait-chair, défait non par griffe ou flamme, mais par son assez tranchant pour fendre son esprit même."#!"
  lv_firewyrm_duel.0001.desc.counter.boneshattering_screech.firewyrm_vs_firewyrm:0 "\n\n#medium Monde se déchire en son. Votre vouivre convulse, peau en fusion frissonnant alors que cri perçant déchire à travers écaille et tendon de même. Elle se débat, frappant terre avec griffes qui entaillent pierre, ses évents vomissant fumée en agonie. Vous sentez force ébranler à travers son corps dans vos propres os, vous laissant tous deux chancelants, titubants, sans défense pour battement de cœur trop long."#!"
  lv_firewyrm_duel.0001.desc.counter.boneshattering_screech:0 "\n\n#medium Air se fend avec cri perçant si perçant qu'on sent que votre crâne pourrait craquer. Votre dragon chancelle mi-air, ailes faiblissant, yeux larges de douleur et désorientation. Cri perçant de vouivre de feu résonne des pierres brisées et falaises en fusion, arme de son plus sauvage qu'acier. Vous tentez de stabiliser bête sous vous, mais pour maintenant, tout ce que vous pouvez faire est tenir bon. Il n'y aura nulle manœuvre cette fois : seulement survie."#!"

  lv_firewyrm_duel.0001.cone_of_flame:0 "Brûle-la ! réduis-la en cendres ! Que feu soit ta réponse !"
  lv_firewyrm_duel.0001.tt.cone_of_flame:0 "[fd_round_me_dragon.GetName] libère large cône de flamme, tentant d'engloutir votre dragon en vague de chaleur."
  lv_firewyrm_duel.0001.tt.cone_of_flame.effect:0 "Feu de vouivre de feu se rapproche d'ennemi, menaçant d'incinérer avec enfer courroucé."
  lv_firewyrm_duel.0001.desc.cone_of_flame.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre rugit, non avec son, mais avec feu. Elle vomit cône de flamme brûlante, fournaise libérée en seul souffle. Autre vouivre crie perçant, peau en fusion boursoufflant sous torrent, ses mouvements réduits à défiance chancelante et tordante. Fumée se love de ses évents, pourtant feu s'accroche, mangeant plus profond, se nourrissant de chaque souffle qu'elle ose prendre."#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame:0 "\n\n#medium Gorge de votre vouivre gonfle, fissures flamboyant, avant qu'elle ne vomisse tempête de feu qui dévore air. Dragon crie alors que cône l'engloutit, ailes se recourbant vers intérieur, écailles noircissant sous flamme implacable. Même alors qu'il tourne, feu ne se libère point : il s'attarde comme malédiction, rongeant à travers peau et tendon, transformant grâce en agonie."#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre beugle, ventant feu jusqu'à ce que champ de bataille soit noyé en vague de flamme brûlante. Pour battement de cœur, il semble rien ne pourrait survivre à enfer, jusqu'à ce que flamme se sépare contre autre vouivre de feu. Sa peau luit comme minerai vivant, canaux en fusion buvant feu comme si c'était souffle, non fléau. Flammes se brisent inutilement, se lovant en fumée autour bête rendue immune à son propre élément."#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame.miss:0 "\n\n#medium Votre vouivre se soulève, évents en fusion luisant alors qu'elle beugle tempête de feu qui déchire à travers champ de bataille. Mais dragon est déjà en air, ailes battant coup de vent furieux alors qu'il grimpe au-dessus torrent. Cône de flamme calcine pierre et ciel de même, mais ne trouve nulle marque : seulement traînée de fumée s'estompant sous forme qui fuit."#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame.firewyrm_vs_firewyrm:0 "\n\n#medium Vouivre rivale se soulève, fissures luisant blanc en fusion, avant de dégorger torrent de flamme qui roule à travers champ de bataille comme marée vivante. Votre propre bête se débat alors que feu calcine sa peau, évents hurlant fumée alors qu'ampoule rencontre ampoule. Chaleur s'attarde, s'accrochant à ses écailles, brûlant même après que flamme soit passée. Chaque souffle est douleur, et encore feu mange à vous deux."#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame:0 "\n\n#medium Avec hurlement qui se déchire de quelque gouffre en fusion, vouivre de feu se cabre : sa gorge bombant de feu, et libère cône brûlant de flamme à travers champ de bataille. Air se transforme en fumée et fureur alors que flamme s'évente vers extérieur, engloutissant pierre brisée et ciel de même. Vous sentez chaleur avant qu'elle frappe, comme marteau fait de lumière. Votre dragon crie perçant, ailes flamboyant contre enfer, alors que monde se brouille en rouge boursoufflant."#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Vouivre de feu ennemie convulse, gorge gonflant de chaleur, avant de cracher torrent né de fournaise à travers champ. Elle frappe avec force de tempête de soleils, pourtant votre vouivre se dresse intacte. Sa peau flamboie plus brillant, évents flamboyant comme fissures dans cœur de terre. Flammes se lavent sur elle, réclamées et consumées, ne laissant que fumée dérivant dans leur sillage. Pour maintenant, feu ne peut blesser feu."#!"
  lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss:0 "\n\n#medium Vouivre de feu lâche rugissement guttural, sa poitrine pulsant avec lumière de braise avant qu'elle ne crache cône roulant de feu. Enfer lèche vers haut, chassant ombres et transformant terre brisée en-dessous en mer changeante de flamme. Mais votre dragon est déjà en haut, ailes battant dur contre chaleur montante. Vous grimpez plus haut dans ciel chargé de cendres, sentant roussi de courant ascendant mais non morsure de flamme. En-dessous, feu se lave inoffensivement à travers pierre noircie, et vouivre de feu gronde, mâchoires fumant en frustration."#!"
  
  lv_firewyrm_duel.0001.frenzied_lunge:0 "Frappe maintenant : folie et fureur toutes deux !"
  lv_firewyrm_duel.0001.tt.frenzied_lunge:0 "[fd_round_me_dragon.GetName] charge en avant en bondissement sauvage et incontrôlé, tentant de fermer distance et atterrir coup."
  lv_firewyrm_duel.0001.desc.frenzied_lunge.firewyrm_vs_firewyrm:0 "\n\n#medium Avec beuglement qui ébranle cendres des falaises, votre vouivre surgit en avant en frénésie de muscle et fumée. Griffes déchirent à travers peau calcinée alors que deux bêtes s'entrechoquent, fureur contre fureur. Sol tremble sous violence, et pour instant cela sent moins comme frappe qu'un tremblement de terre qui a pris forme."#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge:0 "\n\n#medium Votre vouivre se lance avec vitesse imprudente, flou de griffes et crocs déchiquetés. Elle s'écrase dans flanc de dragon, fendant écaille et tendon avec force sauvage. Dragon se débat, ailes battant contre poussée de douleur, mais votre bête ne renonce point : sa frénésie ne laissant que ruine dans son sillage."#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre se hurle en avant, frappant bête luisante en tempête de griffes et mâchoires claquantes. Mais au lieu de chair, elle rencontre feu fait sans chair : peau en fusion brûlant à travers ses serres. Impact déchire deux créatures, votre monture reculant avec cri de douleur alors que son propre assaut se retourne contre elle. Fureur se transforme en agonie en battement de cœur, fumée et étincelles traînant de choc."#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge.miss:0 "\n\n#medium Avec cri perçant qui fend pierre, votre vouivre bondit, griffes râclant vers haut à travers fumée et cendres. Mais dragon est déjà vers ciel, ses ailes déchirant air au-dessus champ de bataille. Frappe n'atterrit que sur ruine et poussière, élan hurlant votre monture à travers sol fissuré. Elle s'abat dur, se tordant en arrière avec yeux en fusion verrouillés sur sa proie, fureur inéteinte."#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.firewyrm_vs_firewyrm:0 "\n\n#medium Vouivre ennemie explose des cendres, son corps tempête d'écailles et rage. Elle s'entrechoque avec votre monture en choc qui ébranle os, crocs sculptant profond tandis que griffes râclent feu dans chair. Sol frissonne avec impact, votre vouivre hurlant sous force écrasante de frénésie déchaînée de sa parente."#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge:0 "\n\n#medium Sans avertissement, vouivre bondit en avant en frénésie, traînant griffe et croc à travers air étouffé de cendres. Elle s'abat dans votre dragon avec fureur imprudente, déchirant écaille d'os. Vous sentez choc courir à travers selle, à travers tendon, dans vos propres os. Il n'y a nul esprit qui reste en elle : seulement haine."#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Bête se hurle en avant, criant perçant, griffes et crocs frappant comme avalanche. Mais quand elle s'écrase dans peau en fusion de votre vouivre, attaque devient sa propre perte. Feu éclate contre feu, calcinant attaquant alors qu'elle râcle inutilement contre armure luisante. Votre vouivre gronde à travers tempête, ininterrompue, tandis que son ennemi chancelle en arrière boursoufflée et criant."#!"
  lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss:0 "\n\n#medium Avec cri perçant insensé, vouivre de feu bondit, gueule large et griffes râclant air. Elle s'écrase en avant à travers fumée et ruine, mais votre dragon est déjà vers ciel : ailes battant contre chaleur montante et cendres. Bondissement ne frappe rien que poussière et pierre brisée, et élan de vouivre l'envoie glissant à travers terre fissurée. En-dessous, elle se tord en arrière avec sifflement, yeux en fusion vous traquant au-dessus, rage mijotant plus chaud avec chaque souffle."#!"

  lv_firewyrm_duel.0001.rockfall_roar:0 "Rugis, [fd_round_me_dragon.GetName] ! Déchire le ciel de ses piliers !"
  lv_firewyrm_duel.0001.tt.rockfall_roar:0 "[fd_round_me_dragon.GetName] lâche un rugissement qui fait trembler le sol lui-même, délogeant roches et débris."
  lv_firewyrm_duel.0001.desc.rockfall_roar.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre se cabre en arrière, la poitrine se soulevant, et libère un rugissement qui ébranle la pierre elle-même. La caverne tremble alors que les murs se fendent et que les rochers dégringolent. Une grêle de roches s'écrase sur la vouivre ennemie, sa peau en fusion brillant alors qu'elle se débat sous le poids qui s'effondre. Des nuages de poussière fleurissent dans la lumière du feu, étouffant l'air jusqu'à ce que tout ce que vous entendez soit le gémissement de la pierre et la fureur étouffée de l'ennemi sous elle."#!"
  lv_firewyrm_duel.0001.desc.rockfall_roar:0 "\n\n#medium Le rugissement que votre vouivre lâche est moins un son qu'une convulsion du monde lui-même. La caverne frissonne, les stalactites se brisant comme des dents du plafond, les murs se fendant avec des craquements tonnants. Le dragon tourne vers le haut en panique, ses ailes griffant l'air alors que la roche cisaille en feuilles létales. La lumière du feu peint le chaos en rouge et or : votre ennemi pris entre pierre et flamme, se débattant pour sa survie dans une tombe qui s'effondre."#!"
  lv_firewyrm_duel.0001.desc.counter.rockfall_roar.firewyrm_vs_firewyrm:0 "\n\n#medium La vouivre ennemie beugle, et le monde s'effondre. La pierre se déchire du plafond en grandes dalles, le plancher convulsant sous les griffes de votre bête. Vous vous accrochez à la selle alors que les gravats pleuvent autour de vous, assourdi par le rugissement de la terre et du monstre. Votre vouivre chancelle, prise dans un écrasement claustrophobe, ses yeux en fusion écarquillés alors qu'elle lutte non contre une rivale, mais contre la montagne elle-même abattue sur vous."#!"
  lv_firewyrm_duel.0001.desc.counter.rockfall_roar:0 "\n\n#medium La vouivre lâche un rugissement guttural qui résonne à travers les murs de la caverne, ou des ruines, ou de quelque cimetière où vous combattez. Avec lui vient un tremblement. Les pierres craquent et les plafonds gémissent. Une section de la terre elle-même cède, s'effondrant en poussière et gravats. Vous êtes forcé de fuir vers le haut ou d'être enterré."#!"

  lv_firewyrm_duel.0001.molten_slough:0 "Mue et flamboie ! Que rien ne puisse te percer !"
  lv_firewyrm_duel.0001.tt.molten_slough:0 "[fd_round_me_dragon.GetName] fait tomber ses écailles en fusion, se couvrant d'une couche fraîche d'armure brûlante et cautérisant toutes les blessures qu'elle portait."
  lv_firewyrm_duel.0001.tt.molten_slough.effect:0 "Une armure en fusion enveloppe la vouivre de feu, annulant toutes les attaques enflammées et infligeant des dégâts de brûlure significatifs pour tout contact."
  lv_firewyrm_duel.0001.desc.molten_slough:0 "\n\n#medium Votre vouivre convulse sous vous avec un son comme celui de montagnes qui se brisent. Son dos s'arque, les écailles craquant et pelant en lambeaux de chair brûlante. Des morceaux de peau fumante se détachent, s'écrasant au sol en amas luisants. De cette ruine émerge une bête renaissante : luisante d'une lumière en fusion, les blessures cautérisées et refermées, chaque souffle étant une explosion de fournaise. La chaleur s'élevant de son corps calcine votre peau même à travers la selle, comme si vous chevauchiez désormais non plus une créature, mais le noyau vivant de la terre elle-même."#!"
  lv_firewyrm_duel.0001.desc.counter.molten_slough:0 "\n\n#medium Avec un soubresaut guttural, la vouivre de feu arque son dos et se fend. La chair croûtée et les écailles calcinées se détachent, tombant au sol telle une armure en fusion. Elle rugit, nouvellement luisante, à demi calcinée et plus effrayante qu'auparavant. Ses blessures se referment dans un sifflement de vapeur, et le feu dans sa gorge brûle d'un éclat encore plus intense."#!"

  lv_firewyrm_duel.0001.berserk_charge:0 "Toute ta force, [fd_round_me_dragon.GetName] ! Brise-la ou brise-toi !"
  lv_firewyrm_duel.0001.tt.berserk_charge:0 "[fd_round_me_dragon.GetName] charge en avant en attaque aveugle et furieuse, tentant de piétiner [fd_round_opponent_dragon.GetName]."
  lv_firewyrm_duel.0001.desc.berserk_charge.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre éclate en avant avec hurlement qui ébranle pierre libre des falaises, son corps mastodonte de muscle et rage en fusion. Elle s'abat dans autre vouivre avec telle force que terre même se fissure, griffes et dents déchirant sans pensée pour sa propre peau. Deux bêtes se tordent en tempête de violence, air empli de fumée, sang et fureur déchaînée."#!"
  lv_firewyrm_duel.0001.desc.berserk_charge:0 "\n\n#medium Votre monture explose en mouvement, plus bête mais avalanche vivante de fureur. Elle s'écrase dans flanc de dragon avec force qui brise os, écaille et tendon se brisant sous charge. Dragon crie perçant, chancelant sous assaut, alors que votre vouivre griffe et déchire comme si elle voulait tirer ciel vers bas avec lui."#!"
  lv_firewyrm_duel.0001.desc.berserk_charge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre vouivre se hurle tête première dans bête luisante, frappant avec poids complet et imprudent de sa fureur. Mais chair en fusion n'est nulle chair du tout. Moment d'impact devient cataclysme : griffes de votre vouivre calcinent, sa peau boursoufflant contre fournaise qu'elle pensa écraser. Deux bêtes chancellent, criant perçant, champ de bataille éclairé en tempête de flamme et agonie née de rage s'entrechoquant avec feu incarné."#!"
  lv_firewyrm_duel.0001.desc.berserk_charge.miss:0 "\n\n#medium Avec rugissement qui pourrait renverser montagnes, votre vouivre charge, yeux en fusion verrouillés sur dragon au-dessus. Elle s'écrase à travers fumée et pierre brisée, griffes râclant vers ciel, mais dragon est déjà en haut, ailes le portant juste au-delà portée. Charge se termine en ruine : votre bête laboure dans terre, envoyant tempête de poussière et cendres, sa fureur incontrolée, sa proie intacte."#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge.firewyrm_vs_firewyrm:0 "\n\n#medium Rugissement coupe à travers brume, et avant que vous puissiez vous préparer, autre vouivre est sur vous : force imparable de sang et haine. Elle s'écrase dans votre monture avec impact dévastateur, griffes déchirant, mâchoires fendant avec abandon suicidaire. Choc vous arrache presque de selle alors que deux bêtes se débattent en maelstrom de rage et ruine."#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge:0 "\n\n#medium Ensanglantée, à demi folle et hurlante, vouivre charge : rien de calculé, rien de sain. Ses yeux luisent comme charbons fissurés ouverts. Elle jette tout son corps monstrueux dans combat, haussant épaules flamme et griffe. Vous voyez coup venir que vous ne pouvez éviter. Seul réconfort est ceci : elle pourrait se détruire tentant de vous détruire."#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Bête chargeante s'abat tête première dans forme en fusion de votre vouivre, sa fureur s'entrechoquant avec feu vivant. Impact se retourne instantanément, calcinant à travers sa propre chair alors que griffes et crocs ne trouvent nulle prise que flamme. Votre vouivre tient son terrain, luisant comme fournaise, tandis que son attaquant crie perçant en agonie : boursoufflée, brûlée, défaite par sa propre colère berserk."#!"
  lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss:0 "\n\n#medium Avec beuglement qui fend air épais de cendres, vouivre de feu charge : aveugle de fureur, insoucieuse de douleur. Elle fonce à travers pierre brisée et ruine fumante, yeux en fusion fixés où vous étiez moments auparavant. Mais vous êtes déjà en haut, votre dragon cerclant haut au-dessus. Bête s'écrase en avant sous vous, ses griffes déchirant tranchées dans terre alors qu'elle rage vers ciel. Il n'y a nulle pensée en elle maintenant : seulement ruine laissée par frappe qui n'atterrit jamais."#!"


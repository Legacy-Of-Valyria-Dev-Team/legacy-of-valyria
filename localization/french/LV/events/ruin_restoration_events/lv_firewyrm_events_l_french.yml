l_french:
 trait_firewyrm:0 "Veur de Feu"
 trait_firewyrm_desc:0 "Parent dénaturé des dragons, le veur de feu n'a rien de la grâce ni du ciel. Il rampe depuis les profondeurs de la terre, né de la pierre en fusion et de la folie, façonné par la chaleur et le temps en une abomination cracheuse de feu. Là où les dragons inspirent l'émerveillement, les veurs de feu ne laissent derrière eux que ruine calcinée et mort empoisonnée par la fumée."

 # GUI
 HOLDING_VIEW_FIREWYRM:0 "Veur de Feu"

 # Firewyrm Events
 lv_firewyrm_event.0001.t:0 "La Chose qui Brûle"
 lv_firewyrm_event.0001.desc:0 "Les ruines gémissent sous le poids des âges, mais ce n'est ni le temps ni un tremblement qui secoue le sol sous vos pieds. Un cri strident — non, un hurlement — fend l'air chargé de cendres comme une lame. Et puis elle vient. Rampant hors d'un gouffre de pierre fissurée et de souffle en fusion, le veur de feu s'abat sur la ruine tel un démon échappé des vieux parchemins valyriens.\n\nCe n'est pas un dragon. Ses écailles sont déchiquetées, boursouflées, à demi fondues. La fumée siffle par des évents le long de son échine serpentine, son souffle un brasier corrosif qui noircit les pierres mêmes qu'il foule. Ses yeux — dieux, ses yeux — sont en fusion, comme des plaies ouvertes, et il se meut avec une faim qui ne doit rien à l'instinct et tout à la malveillance.\n\nMême les dragons craignaient les veurs de feu, dit-on. Et ce qui vous fait face à présent n'est pas une relique apprivoisée. C'est un vestige tordu de la folie de Valyria, une créature née non seulement du feu, mais de la démence.\n\nVous n'avez que quelques instants pour choisir : combattre la bête, et peut-être devenir légende... ou fuir, et espérer que les ruines se montrent clémentes."
 lv_firewyrm_event.0001.duel.dragon:0 "[dragon.GetName] ! Aderī !"
 lv_firewyrm_event.0001.duel.dragon.tt:0 "Vous appelez rapidement votre dragon et vous préparez à affronter la bête."
 lv_firewyrm_event.0001.duel:0 "Acier et feu, alors. Que les dieux en soient témoins."
 lv_firewyrm_event.0001.duel.tt:0 "Vous tenez votre position et tentez d'abattre le veur de feu."
 lv_firewyrm_event.0001.flee:0 "Ceci n'est pas un ennemi fait pour les vivants. Nous fuyons."
 lv_firewyrm_event.0001.flee.tt:0 "Vous décidez de fuir, laissant le veur de feu à son antre."

 lv_firewyrm_spawned_tooltip:0 "Un veur de feu a établi son antre dans la région."
 lv_firewyrm_cleared_tooltip:0 "[lair_location.GetName] est désormais libéré du veur de feu [firewyrm.GetName]."

 lv_firewyrm_event.0100.t:0 "Une Ombre Levée sur [former_lair.GetNameNoTooltip]"
 lv_firewyrm_event.0100.desc:0 "L'ombre qui planait autrefois sur ce lieu s'est dissipée. Le veur de feu qui tenait ces terres sous son emprise — bête, terreur, flamme vivante — n'est plus là pour y régner par la terreur ardente. L'air lui-même semble plus léger, débarrassé de sa chaleur et de sa haine oppressantes. Qu'il ait été terrassé au combat, soumis à votre volonté, ou attiré ailleurs par quelque faim qui pousse de tels monstres, le résultat est le même : la voie s'ouvre devant vous, libre de sa domination."
 lv_firewyrm_event.0100.a:0 "[former_lair.GetNameNoTooltip] repose en paix à nouveau."

 lv_firewyrm_event.1000.t:0 "Rampage du Veur de Feu"
 lv_firewyrm_event.1000.desc:0 "Un rugissement fend l'air, un son qui ébranle la pierre autant que l'âme. Des profondeurs de son antre, le veur de feu surgit — sa peau en fusion luisant d'un feu intérieur, ses yeux flamboyant de fureur. Il se meut avec une vitesse terrifiante, un enfer vivant qui laisse derrière lui terre calcinée et os brisés. Dans sa rampage, les bâtiments et tout être vivant à [firewyrm_location.GetName] brûlent, les récoltes se flétrissent, et le sol lui-même semble bouillonner sous son passage. La rage de la créature est aveugle, une force de la nature déchaînée sur tous ceux qui vivent alentour."
 lv_firewyrm_event.1000.a:0 "Maudite bête !"

 lv_firewyrm_event.1010.t:0 "Veur de Feu Agité"
 lv_firewyrm_event.1010.desc:0 "Des rapports sont parvenus de [firewyrm_location.GetName] signalant une activité inhabituelle autour de l'antre du veur de feu. La créature, jusqu'alors recluse et endormie, a été vue se débattant, ses yeux en fusion luisant plus vivement qu'à l'accoutumée. Les gens du cru parlent de tremblements ressentis sous leurs pieds et de bouffées de chaleur qui font onduler l'air. Le veur de feu semble agité, ses mouvements plus erratiques et agressifs qu'auparavant, suggérant que quelque chose trouble son repos.\n\nLa bête pourrait représenter une menace considérable pour [firewyrm_location.GetName] si son agitation n'est pas contenue."
 lv_firewyrm_event.1010.a:0 "Ceci n'augure rien de bon."
 lv_firewyrm_event.1010.a.tt:0 "Le veur de feu s'est agité, augmentant considérablement la menace qu'il représente pour [firewyrm_location.GetName]. Bien qu'il ne soit pas encore enragé, vous devez traiter avec la bête, ou du moins l'apaiser, avant qu'elle ne cause du tort à [firewyrm_location.GetName]."
 lv_firewyrm_event.1010.a.tt.interaction:0 "Tant que [firewyrm.GetName] est agité, l'interaction #V $lv_placate_firewyrm$#! est disponible."

 lv_firewyrm_event.1011.t_hash:0 "Apaiser le Veur de Feu"
 lv_firewyrm_event.1011.desc:0 "Vous pesez vos options avec soin. L'agitation du veur de feu représente une menace réelle pour [firewyrm_location.GetName], mais une confrontation directe pourrait s'avérer périlleuse. Offrir un tribut pourrait apaiser la bête, en faisant appel à quelque instinct primal qui gouverne son comportement.\n\nNul ne peut dire avec certitude ce qu'un veur de feu apprécie, mais du bétail, des métaux précieux, ou même un sacrifice conséquent pourraient servir d'offrandes. L'espoir est qu'en présentant un don, vous puissiez calmer la fureur de la créature et l'empêcher de semer le chaos dans [firewyrm_location.GetName] et les colonies environnantes."
 lv_firewyrm_event.1011.tt.critical_success:0 "Le veur de feu est pleinement apaisé par votre offrande et se retire dans les feux de Valyria."
 lv_firewyrm_event.1011.tt.success:0 "Le veur de feu est apaisé avec succès et retourne à son antre, réduisant la menace qu'il représente pour [firewyrm_location.GetName]."
 lv_firewyrm_event.1011.tt.failure:0 "Le veur de feu demeure agité malgré vos efforts, et la menace qu'il représente pour [firewyrm_location.GetName] persiste."
 lv_firewyrm_event.1011.tt.critical_failure:0 "Votre tentative d'apaiser le veur de feu échoue de façon spectaculaire, enrageant la bête."
 lv_firewyrm_event.1011.sacrifice:0 "Seul le sang saura assouvir une telle créature."
 lv_firewyrm_event.1011.sacrifice.tt:0 "Vous offrirez un sacrifice vivant en tribut au veur de feu. Des options vous seront présentées quant à qui — ou quoi — sacrifier."
 lv_firewyrm_event.1011.precious_metals:0 "Même les bêtes ne sont pas insensibles à l'attrait des métaux précieux."
 lv_firewyrm_event.1011.precious_metals.tt:0 "Vous offrirez des métaux précieux en tribut au veur de feu. Le succès dépendra grandement de la richesse mensuelle totale du comté."
 lv_firewyrm_event.1011.livestock:0 "Le bétail de la région devrait, espérons-le, suffire."
 lv_firewyrm_event.1011.livestock.tt:0 "Vous offrirez du bétail des environs en tribut au veur de feu. Le succès dépendra grandement du niveau de développement du comté."
 lv_firewyrm_event.1011.nevermind:0 "À la réflexion, cela pourrait être trop risqué."

 lv_firewyrm_event.1012.t:0 "Veur de Feu Satisfait"
 lv_firewyrm_event.1012.desc:0 "Votre offrande semble avoir produit l'effet escompté. L'agitation du veur de feu s'apaise, et il se retire dans les feux de Valyria. L'air autour de [firewyrm_location.GetName] semble à nouveau sûr, et la menace de destruction s'est dissipée.\n\nLe peuple de [firewyrm_location.GetName] se réjouit, sachant que le veur de feu ne menacera plus ses terres."
 lv_firewyrm_event.1012.a:0 "La bête a été calmée."
 lv_firewyrm_event.1012.a.tt:0 "Le veur de feu retourne à la montagne de feu d'où il est venu."

 lv_firewyrm_event.1013.t:0 "Veur de Feu Apaisé"
 lv_firewyrm_event.1013.desc:0 "Votre offrande semble avoir produit l'effet escompté. L'agitation du veur de feu s'apaise, et il se retire dans son antre à [firewyrm_location.GetName], ses yeux en fusion s'assombrissant à mesure qu'il regagne son repaire. L'air autour de [firewyrm_location.GetName] semble moins suffocant, et la menace de destruction s'est réduite, pour l'instant.\n\nLe peuple de [firewyrm_location.GetName] peut respirer plus librement, sachant que le veur de feu a été apaisé, pour l'instant."
 lv_firewyrm_event.1013.a:0 "La bête a été calmée."
 lv_firewyrm_event.1013.a.tt:0 "Le veur de feu retourne à son antre à [firewyrm_location.GetName], la menace qu'il représente pour la région étant réduite."

 lv_firewyrm_event.1014.t:0 "Le Veur de Feu Demeure Agité"
 lv_firewyrm_event.1014.desc:0 "Malgré vos efforts, le veur de feu demeure agité. Ses yeux en fusion brûlent avec la même intensité, et ses mouvements restent erratiques et agressifs. L'air autour de [firewyrm_location.GetName] est lourd de chaleur et de tension, et la menace de destruction plane toujours.\n\nLe peuple de [firewyrm_location.GetName] devient de plus en plus anxieux, craignant que le veur de feu ne finisse par s'enrager."
 lv_firewyrm_event.1014.a:0 "La bête demeure agitée."
 lv_firewyrm_event.1014.a.tt:0 "Le veur de feu demeure agité, et la menace qu'il représente pour [firewyrm_location.GetName] persiste."

 lv_firewyrm_event.1015.t:0 "Veur de Feu Enragé"
 lv_firewyrm_event.1015.desc:0 "Votre tentative d'apaiser le veur de feu a échoué de façon spectaculaire. Les yeux en fusion de la créature s'embrasent de fureur, et elle pousse un rugissement assourdissant qui ébranle la terre même. L'air autour de [firewyrm_location.GetName] devient étouffant de chaleur, et la menace de destruction est imminente.\n\nLe peuple de [firewyrm_location.GetName] se prépare au pire, sachant que le veur de feu est désormais pleinement enragé et prêt à déchaîner sa fureur sur la région."
 lv_firewyrm_event.1015.a:0 "La bête est furieuse !"
 lv_firewyrm_event.1015.a.tt:0 "Le veur de feu est désormais enragé."

 lv_firewyrm_event.1016.t:0 "Un Sacrifice Vivant"
 lv_firewyrm_event.1016.desc:0 "Vous avez choisi d'offrir un sacrifice vivant au veur de feu, espérant apaiser sa rage. Quel que soit celui que vous choisirez de sacrifier, son sort sera scellé face au veur de feu vorace. Nul ne peut dire ce que le veur de feu fera de l'offrande, ni s'il en sera satisfait.\n\nQuel que soit votre choix, sachez que cette mort ne garantit pas la sécurité de [firewyrm_location.GetName]. La fureur du veur de feu est imprévisible, et il pourrait encore semer le chaos malgré votre offrande."
 lv_firewyrm_event.1016.dragon:0 "Que les dieux me pardonnent ce que je dois faire."
 lv_firewyrm_event.1016.dragon.flavor:0 "Cette option est disponible car vous possédez au moins un [owned_dragon|E]"
 lv_firewyrm_event.1016.dragon.tt:0 "Vous sacrifierez personnellement l'un de vos dragons au veur de feu."
 lv_firewyrm_event.1016.county:0 "C'est pour le bien du royaume."
 lv_firewyrm_event.1016.county.tt:0 "Vous sacrifierez la population locale de l'endroit où se trouve le veur de feu."
 lv_firewyrm_event.1016.vassal:0 "Mes vassaux connaissent leur devoir."
 lv_firewyrm_event.1016.vassal.tt:0 "Vous choisirez l'un de vos vassaux à sacrifier au veur de feu."
 lv_firewyrm_event.1016.courtier:0 "Ma cour comprendra."
 lv_firewyrm_event.1016.courtier.tt:0 "Vous choisirez l'un de vos courtisans à sacrifier au veur de feu."
 lv_firewyrm_event.1016.nevermind:0 "Je ne sacrifierai pas le sang de mes sujets à une bête."

 lv_firewyrm_event.1017.t:0 "Un Sacrifice Vivant"
 lv_firewyrm_event.1017.desc.dragon:0 "Dans un acte de désespoir ou un accès de folie, vous avez envisagé d'offrir l'un de vos dragons en sacrifice vivant au veur de feu. Vous espérez qu'en offrant un dragon dans toute sa chair, le veur de feu sera apaisé et sa rage éteinte.\n\nLa perte d'une telle créature sera un coup terrible, mais vous espérez qu'elle apportera la sécurité à [firewyrm_location.GetName]."
 lv_firewyrm_event.1017.desc.vassal:0 "Dans un acte de désespoir ou un sombre sens du devoir, vous avez envisagé d'offrir l'un de vos vassaux en sacrifice vivant au veur de feu. Vous espérez qu'en abandonnant l'un des vôtres, le veur de feu sera apaisé et sa rage éteinte.\n\nLa perte d'un vassal loyal sera un coup dur pour votre royaume et ébranlera sans doute votre autorité, mais vous espérez qu'elle apportera la sécurité à [firewyrm_location.GetName]."
 lv_firewyrm_event.1017.desc.courtier:0 "Dans un acte de désespoir ou un sombre sens du devoir, vous avez envisagé d'offrir l'un de vos courtisans en sacrifice vivant au veur de feu. Vous espérez qu'en abandonnant l'un des vôtres, le veur de feu sera apaisé et sa rage éteinte.\n\nLa perte d'un courtisan de confiance frappera la peur dans toute votre cour, mais vous espérez qu'elle apportera la sécurité à [firewyrm_location.GetName]."
 lv_firewyrm_event.1017.a:0 "Que les dieux me pardonnent ce que je dois faire."
 lv_firewyrm_event.1017.a.tt:0 "Vous offrirez le sacrifice au veur de feu."
 lv_firewyrm_event.1017.b:0 "Non, c'est trop demander."

 lv_firewyrm_event.1020.t:0 "Veur de Feu Enragé"
 lv_firewyrm_event.1020.desc:0 "Vous avez reçu des rapports selon lesquels le veur de feu [firewyrm.GetName] aurait commencé à se débattre activement hors de son antre, poussé par une colère insatiable et menaçant de tout consumer sur son passage. Les gardes veillant à [firewyrm_location.GetName] rapportent des tremblements et des jaillissements de flammes surgissant de la terre, signes que la fureur de la créature ne cesse de croître en dangerosité.\n\nSi rien n'est fait rapidement, la rage du veur de feu pourrait mener à une destruction généralisée à travers [firewyrm_location.GetName] et au-delà."
 lv_firewyrm_event.1020.a:0 "Voilà une nouvelle troublante."
 lv_firewyrm_event.1020.a.tt:0 "Vous aurez un mois pour vous préparer ou traiter avec le veur de feu enragé avant qu'il ne cause des dommages considérables à [firewyrm_location.GetName]."

 ## Firewyrm Duel Events
 lv_firewyrm_duel.0001.t.firewyrm_vs_firewyrm:0 "Braises Contre Braises"
 lv_firewyrm_duel.0001.t:0 "La Cendre Rencontre la Flamme"
 lv_firewyrm_duel.0001.desc.firewyrm_vs_firewyrm:0 "#medium La terre tremble sous les griffes de votre monture, chaque pas fissurant la pierre et faisant tourbillonner la poussière vers le ciel. De l'autre côté du sol brisé, l'autre veur de feu se dresse pour vous affronter — son regard en fusion croisant celui de votre propre bête. Il n'y a nulle parenté ici, seulement la faim, seulement la rage, tandis que l'air s'alourdit de la promesse du feu et de la ruine.\n\nIl se traîne hors de la ruine comme un éclat de terre arraché, sa peau en fusion suintant la chaleur à chaque mouvement. Pas d'ailes. Pas de majesté. Seulement une fournaise de rage enveloppée d'écailles fissurées et de fumée. Là où votre veur est chair liée à la flamme, celui-ci est flamme délivrée, un enfer rival tirant contre la laisse de son propre corps.\n\nVotre veur de feu gronde profondément, le son roulant comme la pierre s'effondrant dans l'obscurité d'une caverne. L'autre répond en écho — non par un rugissement, mais par un cri strident comme du fer déchiré, fou et inébranlable."#!"
 lv_firewyrm_duel.0001.desc.firewyrm_duel:0 "#medium Votre bête se love et martèle le sol, son corps en fusion sifflant par des évents de fumée et de cendres. Pas d'ailes pour commander l'air — seulement des griffes pour commander le sol, seulement le feu pour défaire ce qui se dresse devant elle. Là où le dragon au-dessus est le feu devenu forme et vol, votre veur est le feu enchaîné à la terre, une bête de ruine brute qui ne s'inclinera pas. Votre veur de feu beugle, un tonnerre roulant qui ébranle la pierre fissurée. Au-dessus, le dragon répond, son rugissement aussi vaste que le ciel, un défi lancé depuis les cieux mêmes.#!"
 lv_firewyrm_duel.0001.desc:0 "#medium Le sol crépite sous les serres de votre monture tandis que votre dragon atterrit, ses ailes se repliant comme des nuages d'orage à travers le ciel brisé. Devant vous se trouve le veur de feu — ni intimidé, ni curieux, mais affamé.\n\nIl se tord hors du puits en ruine comme une chose née de fumée et de tourment, sa peau en fusion fumant à chaque mouvement. Pas d'ailes. Pas de grâce. Seulement une fureur déchiquetée et des écailles boursouflées, laissant échapper de la fumée par des évents et fissures le long de son échine. Là où un dragon est le feu fait chair, cette créature est le feu fait mal.\n\nVotre dragon grogne sourdement, un son qui fait trembler la pierre noircie. Le veur répond — non par un rugissement, mais par un cri qui glace le sang, défiant et fou.#!"
 lv_firewyrm_duel.0001.desc.valyria:0 "#medium Ici, au cœur fumant de Valyria, deux monstres se rencontrent.#!\n\n"
 lv_firewyrm_duel.0001.desc.lyria:0 "#medium Ici, sur les falaises croulantes d'Epaekros, où la terre glisse et le ciel brûle, deux monstres vont danser.#!\n\n"
 lv_firewyrm_duel.0001.desc.lokiria:0 "#medium Ici, sous l'ombre étouffante de Gaelithox, deux monstres se rencontrent dans une brume de flamme et de fureur.#!\n\n"
 lv_firewyrm_duel.0001.desc.lands_of_the_long_summer:0 "#medium Ici, où la chaleur de l'été ne s'estompe jamais et où le souffle de l'antique Valyria persiste encore, deux monstres croisent leur route dans un défi calciné.#!\n\n"
 lv_firewyrm_duel.0001.desc.elsewhere:0 "#medium Ici, loin des ossements de Valyria, deux terreurs anciennes se rencontrent comme réunies par le seul destin.#!\n\n"
 lv_firewyrm_duel.0001.desc.final:0 "#medium Vos mains se resserrent sur les rênes. Un souffle, un mot, et le ciel s'embrase.#!"
 lv_firewyrm_duel.0001.a:0 "[dragon.GetName], dracarys !"
 lv_firewyrm_duel.0001.b:0 "Sōvēs, [dragon.GetName] !"

 # Defeat
 lv_firewyrm_duel.0003.t:0 "Calciné du Ciel"
 lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe veur qui vous faisait face s'était figé — ses yeux en fusion se plissant, sa poitrine se contractant. Le vôtre s'agitait sous vous, nerveux, incertain. Et alors l'ennemi frappa.\n\nIl bondit sans avertissement, sans bruit, mais avec du feu fait chair. Un jet de souffle brûlant déchira l'air entre vous, plus vite que la pensée. Votre monture rugit de défi, mais le brasier saisit sa tête et ses épaules, faisant éclater écaille et chair confondues.\n\nVous avez senti la chaleur avant de sentir la douleur — le cuir se changeant en liquide, la peau en cendre. Le veur de feu sous vous s'effondra dans la ruine de lui-même, et vous avec lui, disparus à l'instant où les flammes touchèrent l'os.#!"
 lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe dragon virait haut au-dessus, silencieux hormis le froissement des ailes. Votre veur de feu se cabra, mâchoires ouvertes, mais l'ombre au-dessus tombait déjà.\n\nLe ciel se fendit sous sa frappe — des serres comme des faux, des dents comme des lances. L'impact plaqua votre monture au sol, un coup trop soudain, trop précis pour y résister. Les écailles se brisèrent. Les os se froissèrent. Le sol se fendit sous le poids du dragon et du veur confondus.\n\nVous avez tenté de vous relever, mais il n'y avait pas de relèvement possible. La fureur du dragon vous cloua sur place, votre veur de feu brisé sous vous. La dernière chose que vous ayez vue fut ses ailes obscurcissant la lueur du feu — avant que les ténèbres ne vous emportent tout entier.#!"
 lv_firewyrm_duel.0003.desc.sudden_strike:0 "#medium Il n'y eut aucun avertissement — seulement le mouvement.\n\nUn instant, votre dragon décrivait des cercles dans l'air épais de cendres, lisant les mouvements étranges et frémissants de la créature. L'instant d'après, le veur de feu surgit vers le haut avec une vitesse impossible, un flou d'écailles pourpres et de fumée embrasée. Un rugissement fendit le ciel — non, pas un rugissement, un hurlement, un cri, une chose sans origine — et alors le monde bascula.\n\nLe coup frappa sous l'aile de votre dragon, une gifle sauvage qui brisa rythme et équilibre. Le ciel se souleva de côté. Vous vous souvenez du silence soudain de la chute, de la ruée brûlante de l'air, de l'éclair de douleur incandescente.\n\nVous et votre dragon n'avez même jamais touché le sol.#!"

 lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe veur de feu en face de vous se souleva, sa poitrine se gonflant comme une fournaise à son point de rupture. L'espace d'un instant, l'air s'épaissit — la chaleur montant, la cendre immobile en suspension. Puis il lâcha prise.\n\nLe souffle qu'il libéra n'était pas un brasier ordinaire, mais un déluge de ruine incandescente, assez brûlant pour embraser l'air même. Votre veur de feu rugit en réponse, mâchoires grandes ouvertes, mais l'explosion écrasa son défi, dévorant le son avant même qu'il naisse.\n\nVous et votre monture ne faisiez plus qu'un en cet instant — pris dans une seule vague de feu qui défaisait tout ce qu'elle touchait. Il n'y eut ni chute, ni lutte. Seulement la flamme se refermant sur vous, absolue et définitive.#!"
 lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe dragon au-dessus ne rugit pas, ne vira pas. Il ouvrit simplement ses mâchoires, et le monde se changea en lumière.\n\nLe premier souffle vous aveugla — un éclat cuisant qui engloutit la terre et le ciel confondus. Votre veur de feu se cabra en défi, ses écailles en fusion brûlant plus vif encore, mais rien ne résiste au feu de dragon. Le torrent se déversa comme un jugement, calcinant pierre et chair, acier et os.\n\nVotre monture se débattit une fois sous vous avant de s'effondrer en braises. Les rênes se consumèrent entre vos mains. Le cri dans votre gorge ne franchit jamais vos lèvres. Il n'y avait ni échappatoire, ni pitié. Seulement le feu, et le silence après.#!"
 lv_firewyrm_duel.0003.desc.dragonfire:0 "#medium Vous avez donné l'ordre un battement de cœur trop tard.\n\nLe veur de feu était resté immobile — trop immobile. Ses yeux en fusion vous suivaient comme s'ils attendaient, calculaient. Et puis il ouvrit ses mâchoires, larges et déchiquetées comme une caverne brisée, et le monde devint flamme.\n\nUn torrent de feu jaillit vers le haut en un geyser de fureur incandescente. Votre dragon tenta de virer, tenta de s'élever — mais l'enfer le saisit en plein vol, engloutissant aile, écaille et cavalier en un seul brasier hurlant. Le ciel bouillonna autour de vous. Les sangles de la selle se consumèrent en cendres. L'air lui-même se retourna contre vous, un vent de braises et de cendre.\n\nVous n'êtes pas tombé. Vous avez disparu — consumé avant même de pouvoir crier.#!"

 lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_firewyrm:0 "#medium Vous avez vu l'instant où il bondit.\n\nLe veur rival ne brûla ni ne rugit — il se jeta en avant, une montagne de muscle et de peau en fusion. Votre propre monture beugla, se raidissant, mais l'impact vous projeta tous deux dans la pierre.\n\nLe sol se brisa sous le poids. La roche déchiquetée déchira l'écaille. Votre veur de feu se débattit, son armure en fusion flamboyante, mais l'autre pressa plus fort, plus lourd, une avalanche de chair et de fureur. Ses mâchoires se refermèrent autour du cou de votre bête, la forçant à terre, broyant jusqu'à ce que l'air quitte sa poitrine.\n\nVous avez hurlé des ordres, mais votre veur ne pouvait plus se relever. Son cœur battait de manière saccadée sous vous, plus lentement, plus faiblement — jusqu'à s'arrêter. La pression écrasa le souffle de vos propres poumons également. Les ténèbres vinrent tandis que la terre se refermait.#!"
 lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_dragon:0 "#medium Vous avez vu l'ombre obscurcir le ciel.\n\nLe dragon plongea comme une lance de flamme vivante, ailes repliées, yeux fixés. Votre veur de feu se cabra pour l'affronter, mais le coup fut plus rapide, plus lourd — implacable. Les deux entités se heurtèrent dans un coup de tonnerre, et vous fûtes arraché à votre équilibre tandis que votre monture était projetée au sol.\n\nLa terre se fendit sous l'impact du dragon. Ses serres clouèrent la chair en fusion, ses griffes s'enfonçant à travers l'armure jusqu'à l'os. Votre veur se tordait, ses écailles en fusion luisant plus fort, mais chaque sursaut ne rencontrait que davantage de poids, davantage de puissance.\n\nLe rugissement du dragon noya le monde tandis qu'il pesait de tout son poids, brisant les os sous sa poigne. Les luttes de votre monture faiblirent... puis cessèrent. Vous avez senti le dernier tremblement sous vous avant que la lumière ne quitte ses yeux. Puis le regard du dragon se tourna vers vous — et il n'y avait plus nulle part où aller.#!"
 lv_firewyrm_duel.0003.desc.driven_to_ground:0 "#medium Vous avez vu l'instant où il pivota.\n\nLe veur de feu se lova, non pour battre en retraite, mais pour se dresser — d'une rapidité impossible pour une créature de sa taille. Puis vint le bond, tout de fureur et de masse, et avant que votre dragon ne puisse dégager l'air, il était sur vous.\n\nLe monde bascula sur le côté. Griffes, cendre et douleur. Le poids entier de la bête s'abattit comme une montagne qui tombe, et votre dragon hurla — un cri terrible, gargouillant, qui ébranla vos os alors même qu'ils se brisaient avec [fd_loser_dragon.Custom('GetDragonHerHim')]. Les ailes se tordirent. Les côtes se brisèrent. Le sol se cratérisa.\n\nCloué sous la masse du veur de feu, votre dragon se tordit une fois... puis plus rien. Vous avez tout senti — le dernier battement de cœur, le dernier soubresaut de résistance — avant que la pierre ne vienne à la rencontre de votre crâne.#!"

 lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_firewyrm:0 "#medium Vous avez donné l'ordre. Votre veur bondit, son armure en fusion flamboyante, chaque muscle tendu vers la mise à mort.\n\nMais l'autre fut plus rapide.\n\nIl se tordit sous le poids de votre bête, s'enroulant avec une précision contre nature, et ses griffes frappèrent vers le haut — longues, noircies, brûlantes. L'une lacéra la poitrine de votre veur. La seconde déchira plus profond encore, tranchant chair et tendon rouge de fournaise.\n\nLe son fut humide, déchirant, insupportable. Votre veur de feu hurla, son sang en fusion se déversant en un torrent fumant contre la pierre. La lueur dans son corps vacilla comme une forge mourante.\n\nVous vous êtes cramponné un battement de cœur, refusant d'y croire — mais votre monture s'affaissa sous vous, ses entrailles se répandant sur la terre en filaments incandescents. Son dernier rugissement ébranla vos os avant qu'elle ne s'effondre, vous laissant brisé sur un cadavre qui fut autrefois le feu incarné.#!"
 lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_dragon:0 "#medium Vous avez donné l'ordre. Votre veur obéit, se cabrant avec une fureur en fusion, mais le dragon l'affronta de front.\n\nLe ciel se fendit sous la collision, et alors vinrent les griffes — des serres tranchantes, guidées avec une précision infaillible. Elles tranchèrent la peau en fusion, ouvrant écaille et cicatrice comme si elles n'étaient rien.\n\nUn seul cri strident jaillit de votre monture tandis que le dragon arrachait vers le bas. La chair céda. Les entrailles jaillirent en un flot fumant et bouillonnant, se répandant sur le champ de bataille. La puanteur du fer et du feu envahit l'air.\n\nVotre veur chancela, la poitrine vidée, son grand corps se soulevant une fois avant que la lumière dans ses yeux en fusion ne s'éteigne en cendre. Vous fûtes projeté en avant dans sa ruine — dans les décombres fumants de ce qui avait été votre seul bouclier.#!"
 lv_firewyrm_duel.0003.desc.disemboweled:0 "#medium Vous avez donné l'ordre. Vous vous êtes penché en avant sur la selle, et votre dragon obéit — brave, rapide, loyal.\n\nMais cela ne suffit pas.\n\nLe veur de feu surgit avec une vitesse contre nature, se dérobant sous votre frappe et vous accueillant non par la flamme mais par les griffes — longues, noircies, brûlantes. L'une déchira les écailles de votre dragon comme du parchemin. La seconde trouva prise plus profondément encore.\n\nUn son horrible suivit — un cri humide et déchirant qui n'était ni celui de votre dragon, ni le vôtre. Les entrailles se déversèrent dans le ciel étouffé de cendres comme la vapeur d'une forge éventrée. L'odeur du sang, en fusion et épais, submergea même le soufre et la fumée.\n\nVous vous êtes cramponné un battement de cœur encore, regardant les yeux de votre dragon s'éteindre alors qu'elle vacillait en plein vol — une créature de majesté, défaite non par le feu, mais par la sauvagerie brute d'une bête qui n'aurait pas dû exister.#!"

 lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_firewyrm:0 "#medium Le ciel brûlait d'une lumière en fusion.\n\nVotre ordre fut net, votre veur bondissant en avant avec une fureur de fournaise — mais l'autre se mouvait comme un prédateur né pour rien d'autre que le massacre. Ses griffes frappèrent en un éclair, acier noirci contre magma vivant.\n\nUne fois. Deux fois. Encore. Une frénésie de coups qui déchira chair et tendon luisant à la fois. Votre veur de feu convulsa, son sang en fusion giclant sur le sol en rivières sifflantes et fumantes.\n\nVous avez hurlé l'ordre, l'avez supplié de se battre, mais l'estafilade fatale était déjà venue — le ventre ouvert, les entrailles luisantes se répandant comme du laitier d'un creuset brisé. Le hurlement de la bête faiblit, s'assourdissant en un grondement creux tandis qu'elle s'effondrait sous vous.\n\nLe veur rival ne s'arrêta pas. Il déchira et lacéra avec une malveillance implacable, jusqu'à ce que vous ne sentiez plus que la ruine tremblante de votre monture se désagrégeant sous votre selle. Le dernier son fut son cri triomphant, résonnant à travers un champ de bataille jonché de cendre et de viscères.#!"
 lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_dragon:0 "#medium Le ciel était rouge de feu et de ruine.\n\nVotre ordre retentit, votre veur surgissant en avant — écailles en fusion flamboyantes — mais le dragon frappa avec une fureur chirurgicale. Ses serres taillèrent à travers la poitrine cuirassée de votre bête, déchirant chair et écaille avec une précision effroyable.\n\nUne griffe. Deux. Une lacération sauvage à travers le ventre. Le rugissement de votre veur devint un gargouillis étranglé, sang en fusion et entrailles jaillissant en un torrent qui embrasa le sol de feu fumant.\n\nVous avez crié, vous avez tiré, vous vous êtes battu pour tenir la selle — mais votre monture était déjà brisée. Les ailes se rompirent, les côtes s'écrasèrent, son corps convulsa en spasmes d'agonie en fusion.\n\nLe dragon ne relâcha pas. Il déchiqueta ce qui restait — arrachant poitrine de gorge, tendon d'os — jusqu'à ce que votre veur de feu gise en ruine, ses organes luisants éparpillés à travers le champ de bataille. Vous n'eûtes pas le temps de tomber. Vous fûtes simplement enseveli dans sa ruine.#!"
 lv_firewyrm_duel.0003.desc.eviscerated:0 "#medium Le ciel est rouge de feu et de sang.\n\nVotre ordre fut audacieux, mais la bête le fut davantage. Le veur de feu bondit avec un cri strident comme du fer déchiré, frappant non par fureur mais par dessein. Ses serres s'enfoncèrent profondément — une fois, deux fois, une rafale de coups sauvages qui rompirent écaille, peau et chair confondues.\n\nVotre dragon se débattait dans l'agonie, ailes vacillantes, souffle se figeant en plein rugissement. Vous avez tenu bon, criant, exhortant — mais il était déjà trop tard. Une dernière estafilade brutale fendit son ventre, et son cri fut interrompu tandis que sang et feu jaillissaient dans l'air.\n\nLe veur ne s'arrêta pas.\n\nIl griffa et déchira encore et encore, une frénésie de haine faite chair. Vous n'avez vu que des éclairs — le claquement d'une aile, la déchirure d'une gorge, votre selle cédant sous vous tandis que le corps brisé de votre dragon plongeait en ruine dans une spirale.\n\nLa dernière chose que vous voyez est le veur de feu, luisant de viscères, hurlant son triomphe vers un ciel qui n'oubliera jamais ce carnage.#!"

 lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_firewyrm:0 "#medium Certains monstres ne devraient jamais naître.\n\nLe veur qui vous fait face éclipse même votre propre monture — une colossale fournaise de chair et de fureur, ses écailles fissurées comme la pierre volcanique, ses yeux brûlant d'une lumière impie. Votre veur de feu, fier et en fusion, tremble en sa présence. L'instinct parle plus fort que l'ordre : ceci n'est pas une proie, ni un rival, mais l'extinction prenant forme.\n\nAlors il bouge.\n\nLe monde tremble tandis que le veur géant s'abat, ses griffes clouant votre bête comme si elle n'était que charogne. Vous criez, votre monture se débat, mais la lutte ne dure que quelques battements de cœur.\n\nLes mâchoires descendent — vastes, fumantes, terribles. D'un seul craquement, la moitié de votre veur de feu disparaît, arraché dans une ruine qui broie les os. Son cri est réduit au silence dans une giclée de sang en fusion, et avant que vous ne puissiez reprendre votre souffle, le reste de votre monture est entraîné hurlant dans l'abîme de sa gorge.\n\nVous êtes toujours sanglé dessus.\n\nLa chaleur vous engloutit tout entier. Ténèbres, feu, sang — puis l'oubli.#!"
 lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_dragon:0 "#medium Certains combats ne sont jamais destinés à être gagnés.\n\nLe dragon se dresse au-dessus, titanesque en taille — une légende de croc et d'aile, son ombre obscurcissant le ciel même. Comparé à lui, votre veur de feu est une torche vacillante devant un soleil déchaîné. Même votre bête le sait, tremblant sous votre prise tandis que l'air même frémit sous le souffle du léviathan.\n\nAlors il frappe.\n\nLe dragon s'abat comme une montagne qui tombe, ses griffes lacérant la chair de votre veur avec une cruelle aisance. Vous criez l'ordre, mais c'est vain — votre monture est clouée, écrasée, impuissante sous un prédateur plus ancien et plus grand que tout cauchemar.\n\nLa gueule s'ouvre, vaste comme une caverne, bordée de dents faites pour des dieux, non pour des bêtes. Et d'une seule morsure, votre veur de feu est saisi tout entier, arraché de dessous vous en une giclée de viscères en fusion.\n\nVous êtes toujours sanglé dessus.\n\nLes mâchoires se referment. Ténèbres. Sang. Chaleur. La dernière chose que vous sentez est le craquement — la fin de vous, et la fin de votre veur, consumés dans le silence.#!"
 lv_firewyrm_duel.0003.desc.chomp:0 "#medium Certains monstres n'étaient pas destinés à être affrontés.\n\nLe veur de feu se dresse — une chose montagneuse de peau calcinée et de souffle en fusion, bien plus vaste que toute bête que vous ayez combattue ou rêvée. Votre dragon décrit des cercles avec prudence, la flamme léchant ses mâchoires [fd_loser_dragon.Custom('GetDragonHerHis')], mais il y a de l'hésitation à présent. Une pause. Une crainte instinctive qui révèle une vérité plus profonde : cette chose n'est pas de la même espèce. C'est la ruine faite chair.\n\nAlors il bondit.\n\nIl n'y a ni cri strident, ni rugissement — seulement l'impact. En un instant, votre dragon est arraché du ciel, cloué et écrasé sous le poids du veur. Vous criez, dégainant votre lame, mais c'est inutile. Vous êtes inutile.\n\nLa gueule s'ouvre, vaste et fumante — et dans un craquement écœurant d'os et d'écaille, votre dragon disparaît dans sa gorge.\n\nVous êtes toujours sanglé dessus.\n\nLa chaleur est insoutenable. Tout n'est que sang, feu, ténèbres.\n\nEt puis plus rien.#!"

 lv_firewyrm_duel.0003.a.sudden_strike:0 "Nous... n'avions aucune chance."
 lv_firewyrm_duel.0003.a.tt.sudden_strike:0 "Votre bête est terrassée d'un seul coup inattendu."

 lv_firewyrm_duel.0003.a.dragonfire:0 "La lumière est venue trop vite... trop vive."
 lv_firewyrm_duel.0003.a.tt.dragonfire:0 "Vous et votre bête êtes engloutis par les flammes, incapables d'échapper à l'enfer."

 lv_firewyrm_duel.0003.a.driven_to_ground:0 "Vole—! Non... non, non, non—"
 lv_firewyrm_duel.0003.a.tt.driven_to_ground:0 "Vous et votre bête êtes plaqués au sol, écrasés par l'impact brutal."

 lv_firewyrm_duel.0003.a.disemboweled:0 "Non, [fd_loser_dragon.GetName] ! Tiens bon—TIENS BON ! Je t'en prie—!"
 lv_firewyrm_duel.0003.a.tt.disemboweled:0 "Votre bête est éventrée par les griffes de l'ennemi, et vous regardez, impuissant, tandis que vous tombez tous deux."

 lv_firewyrm_duel.0003.a.eviscerated:0 "Déchirez-nous, alors — s'il le faut."
 lv_firewyrm_duel.0003.a.tt.eviscerated:0 "Votre bête est éviscérée, et bientôt vous la suivez."

 lv_firewyrm_duel.0003.a.chomp:0 "Argh ! Non, non—"
 lv_firewyrm_duel.0003.a.tt.chomp:0 "Vous et votre bête êtes dévorés en une seule bouchée brutale."

 # Victory
 lv_firewyrm_duel.0004.t:0 "Dans le Sillage de l'Enfer"

 lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_firewyrm:0 "#medium L'air est chargé de cendre — mais seulement pour un battement de cœur.\n\nVotre veur de feu se love, puis se lance avec une vitesse impossible. Le veur rival n'a pas le temps de se cabrer ni de cracher son souffle de fournaise avant que votre bête ne soit sur lui.\n\nLa frappe est sans merci. Les serres s'enfoncent dans le crâne et l'échine, les mâchoires se refermant avec une force volcanique. Le rival s'effondre en plein rugissement, son feu s'éteignant dans sa gorge.\n\nIl tombe dans le silence, une montagne de chair brisée en un instant.\n\nLa victoire n'est pas venue de l'endurance, mais de la précision.#!"
 lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_dragon:0 "#medium La tempête d'ailes du dragon s'interrompt — mais seulement pour un battement de cœur.\n\nVotre veur de feu bondit, plus vite que l'œil d'un dragon ne saurait suivre, et s'élève assez haut dans les airs pour intercepter la créature volante. Un instant la bête se cabre, mâchoires luisant de flamme ; l'instant suivant, elle est terrassée.\n\nLes griffes lacèrent sa gorge, les dents broyant l'os avant même qu'un seul souffle ne quitte sa poitrine. Le dragon convulse une fois, deux fois, puis s'effondre — son feu éteint avant même de pouvoir brûler.\n\nIl meurt dans le silence, dépouillé de gloire, sa majesté achevée en un unique coup parfait.\n\nLa victoire fut plus rapide que la pensée, plus tranchante que la flamme.#!"
 lv_firewyrm_duel.0004.desc.sudden_strike:0 "#medium Le vent se tait — mais seulement pour un battement de cœur.\n\nVotre dragon bouge en premier. Un virage brusque des ailes, une spirale descendante — puis un jaillissement de vitesse impossible. Avant que le veur de feu ne puisse crier, se lover, ou cracher son enfer, votre dragon est déjà sur lui.\n\nLes griffes frappent juste — un coup sauvage au crâne, ou à la gorge, ou à la base de l'échine — et le veur s'effondre comme du laitier versé sur pierre froide.\n\nIl meurt sans gloire, sans rugissement, sans embrasement de fureur. Juste un effondrement. Un souffle volé. Puis l'immobilité.\n\nLa victoire n'est pas venue avec la lutte, mais avec la précision.#!"

 lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_firewyrm:0 "#medium Le ciel tremble tandis que votre veur de feu exhale la ruine.\n\nUn torrent de souffle en fusion jaillit, incandescent et brûlant, inondant l'air d'un éclat aveuglant. Il s'abat sur le veur rival avec le poids d'une étoile qui tombe, noyant écaille et chair confondues dans un enfer qui s'accroche comme du goudron.\n\nLa bête hurle — un son déchiqueté, moitié fureur, moitié terreur — tandis que son corps noircit et se fend, des fissures luisantes courant sur sa carcasse. Elle se débat encore, bondissant en avant, mais le feu la consume plus vite qu'elle ne peut se mouvoir.\n\nLe sol fume sous sa chute, la pierre coulant comme de la cire.\n\nQuand les flammes s'éteignent, il ne reste qu'une carcasse calcinée, fumant dans l'air cendreux. Le feu d'un monstre a mis fin à un autre.#!"
 lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_dragon:0 "#medium Les cieux s'embrasent tandis que votre veur de feu inspire profondément et déchaîne l'enfer.\n\nLe souffle rugit en un flot de flamme en fusion, rouge et or, aveuglant, engloutissant le dragon avant qu'il ne puisse virer. Ses ailes fières se déploient, mais le feu s'accroche à chaque veine emplumée, chaque écaille, chaque souffle.\n\nIl hurle — un cri terrible, tonitruant — mais le feu ne cède pas. Le brasier ronge la peau, le muscle, l'os, ne laissant qu'une silhouette contre un ciel de fournaise.\n\nEnfin, le cri se brise, les ailes se replient tandis que le dragon s'écrase vers la terre, traînant le feu comme un soleil qui tombe.\n\nCe qui s'élève ensuite n'est que fumée, et silence. Le dragon gît immobile, cendre et braise là où la majesté planait jadis.#!"
 lv_firewyrm_duel.0004.desc.dragonfire:0 "#medium L'air brûle tandis que [fd_attacker_dragon.GetName] exhale sa fureur.\n\nLe feu jaillit de ses mâchoires en un torrent de chaleur et de lumière, doré et rouge, aveuglant contre le ciel cendreux. Il s'abat sur le veur de feu comme une marée de jugement, engloutissant sa forme tordue dans un enfer plus ancien que les rois. La créature hurle — un cri qui ressemble moins à la douleur qu'à une rage refusée — tandis que sa peau commence à cloquer, noircir, se peler.\n\nLa bête se débat sauvagement, les flammes s'accrochant à sa forme comme une malédiction. L'espace d'un battement de cœur, elle charge en avant — brûlante, à demi aveugle, défiante jusqu'au bout — mais la flamme ne faiblit pas. La chaleur fait fondre la pierre sous elle.\n\nEt puis, le silence.\n\nSeules restent la fumée et la puanteur de chair calcinée. Le veur de feu s'effondre, immobile — une carcasse fumante parmi les ossements de l'ancien empire.#!"

 lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_firewyrm:0 "#medium Le monde bascule tandis que votre veur de feu bondit avec une force effrayante.\n\nDans un rugissement qui fend l'air même, il percute le veur rival, tout de muscle et de fureur en fusion s'abattant comme un marteau. La terre se soulève sous l'impact, cendre et roche jaillissant en une tempête étouffante.\n\nL'ennemi pousse un cri strident — non de triomphe, mais de choc — tandis qu'il est écrasé contre le sol, ses membres se brisant, ses anneaux se débattant vainement contre le poids. La terre même se fend sous ses convulsions, creusée et balafrée par son agonie.\n\nIl n'y a rien de gracieux ici. Seulement la sauvagerie. Votre veur de feu presse davantage, la fumée jaillissant de ses mâchoires, puis frappe — les dents déchirant profondément, jusqu'à ce que les cris du veur rival se brisent en silence et poussière.#!"
 lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_dragon:0 "#medium Votre bête ramène le combat au sol.\n\nVotre veur de feu se précipite en avant dans une tempête de fureur, saisissant la queue du dragon en plein virage et l'arrachant du ciel comme une proie déchirée en plein vol. Le sol se rapproche rapidement — puis le monde explose en poussière et en feu tandis que les deux bêtes s'écrasent contre la terre.\n\nLe dragon crie, ses ailes se brisant sous le poids qui le cloue au sol. Ses serres griffent et déchirent, creusant des sillons dans la pierre, mais rien ne trouve prise. Le veur de feu se resserre, pesant de sa force brute et brutale, jusqu'à ce que l'os craque et que la terre coule rouge.\n\nIl n'y a nulle cérémonie dans la mise à mort. Nulle gloire. Seulement la domination. Un dernier plongeon de crocs réduit le dragon au silence pour toujours, ne laissant que sa forme brisée dans la cendre.#!"
 lv_firewyrm_duel.0004.desc.driven_to_ground:0 "#medium Le ciel rétrécit tandis que nous descendons.\n\nDans un rugissement qui ébranle les os du monde, [fd_attacker_dragon.GetName] s'abat sur le veur de feu depuis les hauteurs — une force d'ailes, de serres et de fureur rencontrant la chair brûlante et la haine. Le sol tremble tandis que nous nous écrasons sur la terre calcinée, la cendre volcanique jaillissant comme une vague noire.\n\nLe veur de feu pousse un cri strident — non de douleur, mais d'incrédulité — tandis qu'il est plaqué sous notre poids, cloué contre la pierre fissurée comme une bête traquée. L'une de ses pattes se tord avec un craquement écœurant, et son corps serpentin se débat, creusant de profonds sillons dans le sol taché de fusion.\n\nIl n'y a nulle élégance dans la mise à mort. Seulement la domination brute. [fd_attacker_dragon.GetName] gronde, la fumée jaillissant de ses naseaux, et se penche. Les dents rencontrent l'os. Le dernier cri du veur de feu s'évanouit dans le vent chargé de cendres.#!"

 lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_firewyrm:0 "#medium Deux titans se débattent et s'entrechoquent, leurs anneaux frappant comme des tours qui tombent. Dans un rugissement à faire trembler les os, votre veur de feu frappe de côté, ses griffes s'enfonçant dans le ventre de son rival. Une fois, deux fois — puis plus profond, déchirant écaille et peau.\n\nLe sang jaillit, en fusion et rouge-noir, éclaboussant la pierre brisée. Le veur blessé convulse, son corps serpentin se tordant violemment, creusant des tranchées dans la cendre. Mais il ne peut se dégager.\n\nVotre veur de feu presse davantage, ses serres crochues, et déchire la bête grande ouverte. La vapeur s'élève du torrent d'entrailles se déversant dans la terre. Le rival pousse un sifflement étranglé, puis s'immobilise — sa ruine étalée à nu sur le sol calciné.#!"
 lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_dragon:0 "#medium L'acier rencontre la chair de feu tandis que le dragon bondit, ses ailes battant furieusement pour s'élever. Mais le veur de feu est plus rapide au sol — un enroulement soudain, une frappe, des griffes déchirant son bas-ventre.\n\nLe sang jaillit en geysers de chaleur en fusion, les ailes du dragon vacillant tandis qu'il chancelle sous le coup. Il pousse un cri strident, frappant sauvagement, mais le veur ne relâche pas. Une autre estafilade de griffes, sauvage et précise, et son ventre se fend grand ouvert.\n\nLes viscères se déversent sur la pierre, fumantes et fétides. Le dragon s'effondre en un tas brisé, son feu s'éteignant dans un dernier rugissement rauque. Le veur de feu se love au-dessus, victorieux, tandis que le champ de bataille rougit.#!"
 lv_firewyrm_duel.0004.desc.disemboweled:0 "#medium Acier, écaille et fureur s'entrechoquent. Dans un cri strident et furieux, votre dragon lacère le flanc du veur de feu — une fois, deux fois — puis se jette pour la mise à mort. Le sang, tel un métal en fusion, gicle des blessures de la bête, sifflant en heurtant la pierre calcinée.\n\nLe veur de feu se débat, sa carcasse tendineuse se tordant comme un serpent en flammes. Mais votre dragon ne relâche pas. Un dernier coup brutal fend le ventre du veur grand ouvert. Ses entrailles se déversent sur la terre brisée — la vapeur s'élevant de la ruine de ce qui fut jadis un prédateur de cauchemars.\n\nLe veur de feu ne fait aucun bruit en mourant, seulement une grande exhalation frémissante qui sent le soufre et la vieille pourriture.#!"

 lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_firewyrm:0 "#medium Leurs corps s'entrechoquent avec un son comme de la pierre qui craque. Les griffes brillent, les dents claquent — puis votre veur de feu trouve sa cible. Il déchire vers le bas, fendant les écailles en fusion, arrachant muscle et tendon jusqu'à ce que le ventre du rival s'ouvre grand.\n\nLa bête blessée convulse, crachant feu et bile depuis la ruine de son ventre. Elle se débat, sifflant de fureur et de douleur, mais ne peut se libérer. Votre veur de feu creuse plus profond, tirant ses serres à travers la fournaise de son ennemi.\n\nUn dernier arrachement — chair et organe se déversent, fumants, sur le sol. Le rival frémit une fois, puis s'effondre en silence, son sang vital calcinant la terre où il tombe.#!"
 lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_dragon:0 "#medium Le dragon plonge, ses ailes fouettant le ciel étouffé de cendres — mais le veur de feu se tord en dessous, un flou de muscle écaillé. D'une frappe soudaine il s'accroche, ses griffes s'enfonçant profondément dans le ventre tendre.\n\nUne traction sauvage, et la peau du dragon se fend comme du tissu. Un rugissement d'agonie jaillit de sa gorge tandis que feu et sang giclent, pleuvant en arcs en fusion. Il se débat, tentant de se hisser vers le ciel, mais le veur tient bon, déchirant plus profondément.\n\nDans un arrachement brutal, les entrailles du dragon se déversent, fumantes dans la cendre. Ses ailes faiblissent, son corps s'écrasant sur la terre calcinée en contrebas. Le veur de feu se dresse au-dessus de la ruine frémissante, victorieux, tandis que le silence noie le champ de bataille.#!"
 lv_firewyrm_duel.0004.desc.eviscerated:0 "#medium Les écailles rouge-acier se déchirent comme une toile de voile pourrie.\n\nLes griffes de votre dragon lacèrent profondément, au-delà de la peau en fusion et du muscle fumant, jusqu'à ce que le bas-ventre du veur de feu s'ouvre. La bête hurle — non de défi, mais d'agonie — tandis que flamme et bile se déversent de la plaie, son cœur de fournaise exposé à l'air frais chargé de cendres.\n\nElle se débat, luttant contre la mort, mais votre dragon tient bon. Un autre arrachement sauvage, un autre panache de viscères, jusqu'à ce que les convulsions de la créature deviennent des tremblements... puis plus rien du tout.\n\nSes entrailles fument sur la terre brisée. Une terreur des profondeurs, défaite par le croc et la fureur.#!"

 lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_firewyrm:0 "#medium Il n'y a nul duel, nulle joute. Seulement la faim.\n\nLe veur rival se love pour frapper — trop lent. Votre veur de feu bondit, mâchoires béantes, et les referme autour du flanc de son adversaire. L'os craque. Les écailles se brisent. Le cri strident du serpent est coupé net, étouffé par la prison de dents.\n\nIl se débat, à demi avalé, la queue battant de fureur. Mais votre veur de feu mord plus profond encore, la gueule œuvrant avec une finalité obscène. En quelques instants, le rival a disparu, traîné vers le bas en de lourdes gorgées, ses luttes s'évanouissant en silence.\n\nCe qui reste est l'immobilité — et la lourde odeur de sang dans l'air. Une terreur en a consumé une autre.#!"
 lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_dragon:0 "#medium Le dragon vire au-dessus, ses ailes tranchant le ciel épais de cendres — mais il plonge trop bas. Le veur de feu surgit vers le haut, gueule béante, et le saisit dans un claquement tonitruant. Les serres battent sauvagement, les écailles crissent contre les dents — mais la morsure du veur tient bon.\n\nLes os grognent. Les ailes se déchirent. Un rugissement étranglé résonne tandis que le dragon est secoué comme une proie, écrasé contre la terre, puis soulevé de nouveau dans une giclée de cendre et de sang. Les mâchoires du veur de feu œuvrent avidement, broyant et avalant, indifférentes aux cris déclinants de la bête.\n\nEnfin le dragon est brisé — une ruine entraînée dans le gosier du veur. Le silence suit, brisé seulement par le sifflement des écailles contre la pierre. Le ciel est vide. Le veur de feu perdure.#!"
 lv_firewyrm_duel.0004.desc.chomp:0 "#medium Il n'y a nulle élégance ici — seulement la domination faite chair.\n\nLe veur de feu se cabre pour frapper, mais votre dragon bondit avec une finalité terrifiante. Des mâchoires comme des portes de château se referment autour de la bête, broyant écaille volcanique et tendon dans un craquement humide et grinçant. Un cri étouffé se perd dans la gorge de votre dragon tandis qu'il jette le veur de feu comme une charogne, sa gueule œuvrant avidement, sa gorge se gonflant.\n\nEn quelques secondes, l'horreur des ruines est réduite à une forme avalée, tressaillant une fois avant de glisser vers le néant.\n\nL'air se fige. La terre — jadis terrorisée — sombre dans le silence sous l'ombre d'un véritable prédateur suprême.#!"

 lv_firewyrm_duel.0004.a.sudden_strike:0 "Rapide. Net. Terminé."
 lv_firewyrm_duel.0004.a.tt.sudden_strike:0 "Votre monture frappe avec une force soudaine et brutale, mettant fin à la vie de la bête en un seul coup."

 lv_firewyrm_duel.0004.a.dragonfire:0 "Brûle, misérable créature !"
 lv_firewyrm_duel.0004.a.tt.dragonfire:0 "Votre monture déchaîne un torrent de feu, engloutissant la bête dans les flammes."

 lv_firewyrm_duel.0004.a.driven_to_ground:0 "C'est ça, [fd_victor_dragon.GetName] ! Achève-le !"
 lv_firewyrm_duel.0004.a.tt.driven_to_ground:0 "La bête est dévorée sous les morsures acharnées de [fd_victor_dragon.GetNameNoTooltip]"

 lv_firewyrm_duel.0004.a.disemboweled:0 "Déchire ! Lacère ! Qu'elle saigne !"
 lv_firewyrm_duel.0004.a.tt.disemboweled:0 "La bête est déchirée par [fd_victor_dragon.GetNameNoTooltip], ses entrailles se déversant sur le sol."

 lv_firewyrm_duel.0004.a.eviscerated:0 "Qu'elle brûle de l'intérieur !"
 lv_firewyrm_duel.0004.a.tt.eviscerated:0 "Votre monture fend le ventre de la bête, exposant ses entrailles à l'air."

 lv_firewyrm_duel.0004.a.chomp:0 "Et voilà... c'est fait."
 lv_firewyrm_duel.0004.a.tt.chomp:0 "Votre monture dévore la bête en une seule bouchée brutale."
 lv_firewyrm_duel.0004.chomp.t:0 "[fd_victor_dragon.GetNameNoTooltip] Apprécie la Saveur"

 # Post-Round 1 Text
 lv_firewyrm_duel.0001.desc.succeeding:0 "#medium Le ciel bouillonne de chaleur et de cendre tandis que la bataille ne montre aucun signe de faiblir. La fumée s'enroule comme des doigts qui agrippent, et la flamme strie les nuages en éclats de fureur. Chaque battement des ailes de votre dragon soulève des cendres depuis la terre noircie en contrebas. Le veur de feu, rendu fou et implacable, décrit des cercles selon son propre rythme brutal. Ceci n'est pas un simple affrontement — c'est une guerre de volontés inscrite à travers les cieux.#!"
 lv_firewyrm_duel.0001.desc.succeeding.final:0 "#medium \n\nLe rythme de la bataille se poursuit, feu et fureur battant comme un second cœur dans votre poitrine. Un autre geste doit être fait.#!"

 # Post-Special States
 lv_firewyrm_duel.0001.stunned:0 "Tiens bon... respire simplement..."
 lv_firewyrm_duel.0001.tt.stunned.firewyrm:0 "Votre veur de feu vacille sous la dernière attaque de la bête, incapable d'agir ce tour-ci."
 lv_firewyrm_duel.0001.tt.stunned:0 "Votre dragon vacille sous la dernière attaque de la bête, incapable d'agir ce tour-ci."
 lv_firewyrm_duel.0001.desc.stunned.firewyrm_vs_firewyrm:0 "\n\n#medium La brume se dissipe. Votre veur secoue la tête, la salive en fusion sifflant là où elle tombe, tandis que l'étourdissement quitte son corps en frémissant. La faiblesse passe — mais non sans coût. La pierre calcinée et la silhouette massive de l'autre veur se dressent devant vous, ses évents fumant encore du cri strident. Votre bête beugle, un son guttural plus proche de la fournaise que de la voix. Quelle que soit l'emprise que ce cri avait... elle est brisée à présent.#!"
 lv_firewyrm_duel.0001.desc.stunned.firewyrm_duel:0 "\n\n#medium La brume se dissipe. Votre veur se soulève, sa peau en fusion ondulant tandis qu'il reprend le contrôle. L'instant d'immobilité est passé — mais la brûlure demeure. Au-dessus, le dragon vire dans le ciel, ses ailes tranchant la fumée comme des lames, son cavalier pressant déjà l'attaque. Votre bête pousse un cri strident qui fait vibrer l'air, ses évents flamboyant de chaleur. Quelle que soit la force qui l'avait clouée au sol... elle ne durera pas.#!"
 lv_firewyrm_duel.0001.desc.stunned:0 "\n\n#medium La brume se dissipe. Votre dragon cligne des yeux, ses muscles se tendant tandis que la clarté revient dans son regard. L'instant de faiblesse est passé — mais non sans coût. La terre calcinée et la silhouette imposante du veur de feu vous accueillent tandis que la bataille reprend. Vous sentez votre monture respirer profondément, un grondement sourd naissant dans sa poitrine. Quelle que soit l'emprise que ce cri strident avait... elle est brisée à présent.#!"

 lv_firewyrm_duel.0001.takeoff:0 "Il nous faut de l'altitude ! Sortez-nous de là !"
 lv_firewyrm_duel.0001.tt.takeoff:0 "Votre dragon tente de prendre de l'altitude, cherchant à échapper à la portée du veur de feu."
 lv_firewyrm_duel.0001.desc.takeoff:0 "\n\n#medium Vous poussez votre dragon vers le haut, ses ailes tendues contre le poids de la cendre et de la fumée. Les yeux en fusion du veur de feu suivent, mais il ne peut égaler votre ascension. Pour un instant, vous êtes libre — le sol s'éloigne, le ciel s'ouvre, et vous pouvez respirer de nouveau. Mais la bête est implacable. Elle ne vous laissera pas échapper si facilement.#!"

 lv_firewyrm_duel.0001.land:0 "Il faut atterrir ! Maintenant !"
 lv_firewyrm_duel.0001.tt.land:0 "Votre dragon tente d'atterrir, cherchant à reprendre le contrôle de la situation."
 lv_firewyrm_duel.0001.desc.land:0 "\n\n#medium D'une secousse ferme sur les rênes et d'un ordre crié, vous guidez votre dragon vers le bas à travers le ciel étouffé de cendres. Le vent calciné vous fouette le visage tandis que les serres s'écrasent contre la terre brisée. Le sol gémit sous le poids de votre monture tandis que les ailes se replient, la fumée s'enroulant entre la pierre fissurée et les évents en fusion. Vous plissez les yeux à travers la brume — le veur de feu rôde devant, ses yeux tels des braises ardentes dans la pénombre. Les cieux sont derrière vous à présent. Le reste de cette bataille se livrera là où les légendes tombent — sur le sol, parmi la ruine et la flamme.#!"

 lv_firewyrm_duel.0001.warning.force_land:0 "@warning_icon! #X Votre dragon sera contraint d'atterrir en exécutant ce geste !#!"
 lv_firewyrm_duel.0001.warning.burn_contact:0 "@warning_icon! #X Tout geste impliquant un contact avec le veur de feu tant qu'il est en fusion brûlera ou blessera davantage votre dragon !#!"
 lv_firewyrm_duel.0001.warning.burn_incoming:0 "@warning_icon! #X La flamme du veur de feu se rapproche ! Votre dragon sera brûlé ou davantage blessé si vous ne réagissez pas à temps !#!"
 lv_firewyrm_duel.0001.warning.nullified:0 "@warning_icon! #X Ce geste n'infligera aucun dégât dans l'état actuel du veur de feu !#!"

 # Dragon Moves
 lv_firewyrm_duel.0001.circle_beast:0 "Continue de bouger. Qu'il devine où portera le prochain coup."
 lv_firewyrm_duel.0001.tt.circle_beast:0 "Votre dragon garde ses distances, décrivant des cercles autour du veur de feu pour provoquer la confusion ou ouvrir une brèche."
 lv_firewyrm_duel.0001.desc.circle_beast:0 "\n\n#medium Votre dragon décrit un large arc à travers le ciel étouffé de fumée, restant juste hors de portée du veur. La bête gronde et se tord, vous suivant de ses yeux luisants. Vous n'offrez nulle ouverture — mais vous apprenez comment elle se meut, comment elle se love avant de frapper.#!"

 lv_firewyrm_duel.0001.flame_test:0 "Voyons combien de feu il peut supporter."
 lv_firewyrm_duel.0001.tt.flame_test:0 "Votre dragon souffle un jet de flamme mesuré — non pour blesser, mais pour tester la propre résistance du veur de feu."
 lv_firewyrm_duel.0001.desc.flame_test:0 "\n\n#medium Vous signalez une brève salve contrôlée de feu de dragon — non destinée à tuer, mais à provoquer. Le veur de feu la traverse avec une aisance troublante... ou frémit, reculant tandis que la flamme s'enroule sur ses écailles. Vous savez à présent, du moins, ce qu'il peut endurer.#!"

 lv_firewyrm_duel.0001.claws_out:0 "Vise les membres ! Empêtre-le avant qu'il ne frappe encore !"
 lv_firewyrm_duel.0001.tt.claws_out:0 "Une charge basique mais directe visant à lacérer les pattes ou les flancs du veur de feu."
 lv_firewyrm_duel.0001.desc.claws_out:0 "\n\n#medium Nulle finesse, nulle stratégie — seulement dents et serres. Votre dragon s'écrase vers le veur dans une joute primale de force. L'air chante de violence tandis que les deux monstres se griffent et se lacèrent, écaille et tendon déchirés en passant.#!"

 lv_firewyrm_duel.0001.reckless_dive:0 "Au diable les risques — on y va maintenant !"
 lv_firewyrm_duel.0001.tt.reckless_dive:0 "Un plongeon à haute vitesse vers la portée de mêlée. Dangereux pour le cavalier comme pour la bête, mais cela pourrait mettre fin rapidement au combat."
 lv_firewyrm_duel.0001.desc.reckless_dive:0 "\n\n#medium Vous vous penchez bas dans le vent et lancez votre dragon dans un plongeon brutal. Vous déchirez le feu et la cendre comme une lance vivante — mais la vitesse téméraire est un pari. Réussite ou échec, vous en payez le prix en sang ou en souffle.#!"

 lv_firewyrm_duel.0001.guard_skies:0 "Tenez formation. Protégez les ailes et la gorge."
 lv_firewyrm_duel.0001.tt.guard_skies:0 "Votre dragon protège ses parties vulnérables et décrit des cercles en altitude, minimisant les ouvertures pour les frappes du veur de feu."
 lv_firewyrm_duel.0001.desc.guard_skies:0 "\n\n#medium Vous rappelez votre dragon plus haut, ses ailes balayant un halo protecteur à travers l'air chargé de ruine. Nulle brèche, nul bond sauvage. Vous chevauchez le vent comme une lame sur le fil, prêt à parer tout ce que la bête vous lancera.#!"

 lv_firewyrm_duel.0001.rip_joints:0 "Ses genoux plient comme ceux de toute bête. Frappe juste !"
 lv_firewyrm_duel.0001.tt.rip_joints:0 "Une frappe précise visant les articulations ou les sous-plaques exposées du veur. Risquée, mais potentiellement décisive."
 lv_firewyrm_duel.0001.desc.rip_joints:0 "\n\n#medium Pas la tête. Pas le ventre. Vous signalez vers les coutures de son corps — là où l'écaille rencontre le muscle, là où il doit bouger pour frapper. Votre dragon griffe juste, et le veur de feu hurle tandis qu'une de ses pattes se contracte sous son poids.#!"

 lv_firewyrm_duel.0001.roar_challenge:0 "Qu'il sache que nous ne sommes pas des proies."
 lv_firewyrm_duel.0001.tt.roar_challenge:0 "Votre dragon libère un rugissement assourdissant, tentant de déstabiliser ou de provoquer le veur de feu vers une agression irréfléchie."
 lv_firewyrm_duel.0001.desc.roar_challenge:0 "\n\n#medium Vous exhortez votre dragon à beugler, un son profond, ébranlant l'âme, qui répond à la propre folie du veur de feu par la fureur draconique. La réponse est immédiate — la bête charge, enragée et irréfléchie. Vous avez attisé sa colère. Reste maintenant à y survivre.#!"

 lv_firewyrm_duel.0001.dive_strike:0 "Entre et sors — assez vite pour le faire saigner sans se brûler."
 lv_firewyrm_duel.0001.tt.dive_strike:0 "Une passe rapide à travers la portée du veur, visant à laisser une blessure et à disparaître avant que la riposte ne porte."
 lv_firewyrm_duel.0001.desc.dive_strike:0 "\n\n#medium Vous repérez une ouverture — brève, incertaine — et plongez à travers elle comme un éclair. Votre dragon lacère son flanc en passant, ne s'arrêtant pas pour l'affrontement mais traversant droit à travers l'espace de la bête, transformant le ciel même en une arme.#!"

 lv_firewyrm_duel.0001.tailspin_slam:0 "Tourne et brise-lui les côtes !"
 lv_firewyrm_duel.0001.tt.tailspin_slam:0 "Votre dragon se lance dans une frappe tournoyante, tentant de fracasser les os par la pure force."
 lv_firewyrm_duel.0001.desc.tailspin_slam:0 "\n\n#medium Vous commandez une roulade et une torsion, votre dragon tournoyant avec une grâce violente. Le veur est lent à réagir — étourdi ou apathique — et la queue de votre dragon s'abat comme un marteau sur son flanc. L'os craque. L'air lui-même tressaille.#!"

 lv_firewyrm_duel.0001.wound_exploit:0 "Cette entaille ne s'est pas refermée. Assurons-nous qu'elle ne se referme jamais."
 lv_firewyrm_duel.0001.tt.wound_exploit:0 "Vous exploitez une blessure antérieure, espérant l'élargir et drainer les dernières forces du veur de feu."
 lv_firewyrm_duel.0001.desc.wound_exploit:0 "\n\n#medium Vous la voyez : une zone dépouillée d'écailles, luisante de sang et de chaleur. Un ordre précis, et votre dragon plonge vers elle. Les serres trouvent la chair. Le veur hurle d'agonie tandis que la blessure s'élargit encore, sa force s'échappant à chaque battement.#!"

 lv_firewyrm_duel.0001.vipers_feint:0 "Glisse à gauche. Frappe à droite."
 lv_firewyrm_duel.0001.tt.vipers_feint:0 "Une feinte éblouissante — seul un cavalier rusé peut l'exécuter proprement."
 lv_firewyrm_duel.0001.desc.vipers_feint:0 "\n\n#medium Comme un serpent en plein vol, vous changez d'angle en plein air — une feinte, puis une frappe depuis une trajectoire impossible. Votre dragon se tord à travers un souffle de flamme et assène une lacération punissante avant même que le veur ne réalise où vous êtes passé.#!"

 lv_firewyrm_duel.0001.dragonflame_barrage:0 "Brûlez-le — encore et encore !"
 lv_firewyrm_duel.0001.tt.dragonflame_barrage:0 "Votre dragon libère une salve complète de flamme, cherchant à submerger le veur sous une puissance de feu brute."
 lv_firewyrm_duel.0001.desc.dragonflame_barrage:0 "\n\n#medium Vous ne retenez rien. Dans un rugissement, votre dragon libère un torrent de feu en vagues déferlantes. Le veur gronde et recule sous la chaleur, sa peau embrasée. Ce n'est pas une mise à mort, mais c'est un message gravé dans la flamme.#!"

 lv_firewyrm_duel.0001.chomp:0 "#bold CROC#!"
 lv_firewyrm_duel.0001.tt.chomp:0 "Vous #bold CROC#!"

 lv_firewyrm_duel.0001.commanding_cry:0 "Concentre-toi, mon ami ! Respirons ensemble !"
 lv_firewyrm_duel.0001.tt.commanding_cry:0 "Un cri de ralliement à votre dragon, l'exhortant à se concentrer et à synchroniser ses attaques avec les vôtres."
 lv_firewyrm_duel.0001.desc.commanding_cry:0 "\n\n#medium D'un mot — ancien, puissant — vous apaisez le souffle de votre dragon. Vous murmurez la force à son oreille. Son battement d'ailes s'affermit, son sang ralentit. Les blessures se referment juste assez pour le vol. Vous gagnez un autre tour... peut-être plus.#!"

 lv_firewyrm_duel.0001.hidden_knowledge:0 "Je me souviens des vieux textes. [dragon.GetName], fais exactement ce que je t'ordonne !"
 lv_firewyrm_duel.0001.tt.hidden_knowledge:0 "Vous vous rappelez une tactique précise tirée d'anciens textes valyriens, espérant qu'elle fera basculer l'issue du combat."
 lv_firewyrm_duel.0001.desc.hidden_knowledge:0 "\n\n#medium Vous vous souvenez des récits. Des tactiques que les Valyriens employaient jadis quand les dragons n'étaient pas des bêtes, mais des armes de guerre. Votre dragon se meut à présent selon ce même rythme — transformant la sagesse ancienne en mort venue du ciel. Le veur ne s'y attend pas.#!"

 lv_firewyrm_duel.0001.risk_it_all:0 "Ceci se termine d'une manière — sang et cendre."
 lv_firewyrm_duel.0001.tt.risk_it_all:0 "Vous misez tout sur une charge désespérée. Si cela fonctionne, le duel s'achève. Sinon... vous aussi."
 lv_firewyrm_duel.0001.desc.risk_it_all:0 "\n\n#medium Vous donnez l'ordre impensable. Votre dragon tombe du ciel comme une pierre, griffes dénudées, flamme montante. Le veur se dresse pour vous affronter. Deux monstres, un ultime affrontement. Il n'y aura nulle seconde frappe.#!"

 lv_firewyrm_duel.0001.collapse_ground:0 "Fais s'écrouler le sol sur lui ! Que la terre engloutisse ce monstre !"
 lv_firewyrm_duel.0001.tt.collapse_ground:0 "Vous ordonnez à votre dragon de déchaîner un torrent de feu sur le sol, le déstabilisant dans l'espoir d'ensevelir le veur de feu sous la terre effondrée."
 lv_firewyrm_duel.0001.desc.collapse_ground:0 "\n\n#medium Vous repoussez le veur de feu, plus bas, encore plus bas — puis signalez l'attaque. La pierre se fend sous ses membres. La terre gémit. Un effondrement soudain, un panache de poussière — et la bête disparaît dans un hurlement sous le sol brisé de la ruine.#!"

 # Firewyrm Moves
 lv_firewyrm_duel.0001.fume_burst:0 "Embrase l'air, [fd_round_me_dragon.GetName] ! Emplis ses poumons de feu !"
 lv_firewyrm_duel.0001.tt.fume_burst:0 "[fd_round_me_dragon.GetName] libère un nuage de gaz surchauffé, cherchant à échauder et désorienter [fd_round_opponent_dragon.GetName]."
 lv_firewyrm_duel.0001.desc.fume_burst.firewyrm_vs_firewyrm:0 "\n\n#medium Sur votre ordre, votre veur beugle et se soulève, fendant l'air d'un rugissement né de la fournaise. Il libère un nuage de fumées cuisantes, la vapeur en fusion sifflant des évents le long de son échine. Le veur ennemi se débat contre la brume brûlante, sa peau se boursouflant là où la brume ardente s'accroche. Deux fournaises vivantes s'affrontent, mais en cet instant, la vôtre brûle plus fort.#!"
 lv_firewyrm_duel.0001.desc.fume_burst:0 "\n\n#medium Votre veur cambre son corps en fusion, les fissures le long de sa peau luisant plus vives tandis qu'il libère un torrent de fumées cuisantes. La brume étouffante engloutit le dragon, ses ailes vacillant tandis que la bête recule devant la chaleur suffocante. Le feu-fait-chair lutte contre le feu-fait-mal, l'air lui-même devenant votre arme tandis que le dragon hurle de rage et de douleur.#!"
 lv_firewyrm_duel.0001.desc.counter.fume_burst.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur de feu inspire profondément, puis libère un nuage de fumées cuisantes. Votre dragon recule, ses ailes se déployant tandis qu'il tente d'échapper à la brume brûlante. Vous sentez la chaleur même d'ici — un rappel que cette bête n'est pas simple flamme, mais fournaise vivante.#!"
 lv_firewyrm_duel.0001.desc.counter.fume_burst:0 "\n\n#medium Le veur de feu inspire profondément, puis libère un nuage de fumées cuisantes. Votre dragon recule, ses ailes se déployant tandis qu'il tente d'échapper à la brume brûlante. Vous sentez la chaleur même d'ici — un rappel que cette bête n'est pas simple flamme, mais fournaise vivante.#!"

 lv_firewyrm_duel.0001.boneshattering_screech:0 "Crie jusqu'à ce que la pierre elle-même se brise !"
 lv_firewyrm_duel.0001.tt.boneshattering_screech:0 "[fd_round_me_dragon.GetName] émet un cri strident assourdissant, cherchant à désorienter et déséquilibrer [fd_round_opponent_dragon.GetName]."
 lv_firewyrm_duel.0001.tt.boneshattering_screech.effect:0 "[fd_round_opponent_dragon.GetName] est étourdi par ce cri à briser les os"
 lv_firewyrm_duel.0001.desc.boneshattering_screech.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur se cambre, les fissures flamboyantes, avant de déchaîner un cri arraché du cœur en fusion de la terre. Le son est un tourment brut, fendant pierre et ciel. À travers le champ de bataille, l'autre veur s'effondre dans un spasme de fureur et de douleur, ses membres se bloquant tandis qu'il trébuche. Deux fournaises vivantes se heurtent, mais la vôtre a volé la voix du gouffre — et laisse le rival brisé, étourdi dans la poussière.#!"
 lv_firewyrm_duel.0001.desc.boneshattering_screech:0 "\n\n#medium Votre veur se cabre, les évents flamboyants, et libère un cri strident qui fend l'air même. Le dragon se raidit en plein rugissement, les yeux écarquillés tandis que le son le frappe avec la force d'un marteau. Les ailes vacillent, la flamme s'éteint, et la créature chancelle, étourdie et titubante. Le feu-fait-chair, défait non par la griffe ou la flamme, mais par un son assez tranchant pour fendre son esprit même.#!"
 lv_firewyrm_duel.0001.desc.counter.boneshattering_screech.firewyrm_vs_firewyrm:0 "\n\n#medium Le monde se déchire en un son. Votre veur convulse, sa peau en fusion frémissant tandis que le cri déchire écaille et tendon confondus. Il se débat, frappant le sol de ses griffes qui creusent la pierre, ses évents crachant la fumée d'agonie. Vous sentez la force résonner à travers son corps jusque dans vos propres os, vous laissant tous deux chancelants, vacillants, impuissants pour un battement de cœur de trop.#!"
 lv_firewyrm_duel.0001.desc.counter.boneshattering_screech:0 "\n\n#medium L'air se fend d'un cri si perçant qu'on croirait votre crâne prêt à se briser. Votre dragon chancelle en plein vol, ses ailes vacillant, ses yeux écarquillés de douleur et de désorientation. Le cri strident du veur de feu résonne contre la pierre brisée et les falaises en fusion, une arme sonore plus sauvage que l'acier. Vous tentez de stabiliser la bête sous vous, mais pour l'instant, tout ce que vous pouvez faire est de tenir bon. Nulle manœuvre cette fois-ci — seulement la survie.#!"

 lv_firewyrm_duel.0001.cone_of_flame:0 "Réduis-le en cendres ! Que le feu soit ta réponse !"
 lv_firewyrm_duel.0001.tt.cone_of_flame:0 "[fd_round_me_dragon.GetName] déchaîne un large cône de flamme, tentant d'engloutir votre dragon dans une vague de chaleur."
 lv_firewyrm_duel.0001.tt.cone_of_flame.effect:0 "Le feu du veur de feu se rapproche de l'ennemi, menaçant de l'incinérer dans un enfer vengeur."
 lv_firewyrm_duel.0001.desc.cone_of_flame.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur rugit — non par le son, mais par le feu. Il crache un cône de flamme cuisante, une fournaise libérée en un seul souffle. L'autre veur pousse un cri strident, sa peau en fusion se boursouflant sous le torrent, ses mouvements réduits à un défi chancelant et tordu. La fumée s'enroule depuis ses évents, pourtant le feu s'accroche, rongeant plus profond, se nourrissant de chaque souffle qu'il ose prendre.#!"
 lv_firewyrm_duel.0001.desc.cone_of_flame:0 "\n\n#medium La gorge de votre veur se gonfle, les fissures flamboyantes, avant qu'il ne vomisse une tempête de feu qui dévore l'air. Le dragon hurle tandis que le cône l'engloutit, ses ailes se recroquevillant, ses écailles noircissant sous le brasier implacable. Même tandis qu'il vire pour s'éloigner, le feu ne relâche pas — il persiste comme une malédiction, rongeant peau et tendon, transformant la grâce en agonie.#!"
 lv_firewyrm_duel.0001.desc.cone_of_flame.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur beugle, crachant du feu jusqu'à ce que le champ de bataille soit noyé sous une vague de flamme cuisante. Pour un battement de cœur, il semble que rien ne pourrait survivre à l'enfer — jusqu'à ce que le brasier se divise contre l'autre veur de feu. Sa peau luit comme du minerai vivant, des canaux en fusion buvant le feu comme un souffle, non comme un fléau. Les flammes se brisent inutilement, s'enroulant en fumée autour d'une bête rendue immunisée à son propre élément.#!"
 lv_firewyrm_duel.0001.desc.cone_of_flame.miss:0 "\n\n#medium Votre veur se soulève, ses évents en fusion luisants tandis qu'il beugle une tempête de feu qui déchire le champ de bataille. Mais le dragon est déjà dans les airs, ses ailes battant une bourrasque furieuse tandis qu'il grimpe au-dessus du torrent. Le cône de flamme calcine pierre et ciel confondus, mais ne trouve nulle cible — seulement une traînée de fumée qui s'estompe sous la forme fuyante.#!"
 lv_firewyrm_duel.0001.desc.counter.cone_of_flame.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur rival se soulève, ses fissures luisant d'un blanc en fusion, avant de vomir un torrent de flamme qui roule à travers le champ de bataille comme une marée vivante. Votre propre bête se débat tandis que le feu échaude sa peau, ses évents hurlant de fumée tandis que boursouflure rencontre boursouflure. La chaleur persiste, s'accrochant à ses écailles, brûlant même après que le brasier s'est éteint. Chaque souffle est douleur, et le feu vous ronge tous deux encore.#!"
 lv_firewyrm_duel.0001.desc.counter.cone_of_flame:0 "\n\n#medium Dans un hurlement arraché de quelque gouffre en fusion, le veur de feu se cabre — sa gorge gonflée de feu — et déchaîne un cône de flamme cuisante à travers le champ de bataille. L'air se change en fumée et fureur tandis que le brasier s'étend, engloutissant pierre brisée et ciel confondus. Vous sentez la chaleur avant qu'elle ne vous frappe, comme un marteau fait de lumière. Votre dragon hurle, ses ailes se déployant contre l'enfer, tandis que le monde s'estompe en un rouge cuisant.#!"
 lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur de feu ennemi convulse, la gorge gonflée de chaleur, avant de cracher un torrent né de la fournaise à travers le champ. Il frappe avec la force d'une tempête de soleils — pourtant votre veur reste intact. Sa peau flamboie plus vive encore, ses évents s'ouvrant comme des fissures dans le cœur de la terre. Les flammes se déversent sur lui, revendiquées et consumées, ne laissant que la fumée dériver dans leur sillage. Pour l'instant, le feu ne peut nuire au feu.#!"
 lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss:0 "\n\n#medium Le veur de feu pousse un rugissement guttural, sa poitrine pulsant d'une lueur de braise avant de cracher un cône de feu tourbillonnant. L'enfer lèche vers le haut, poursuivant les ombres et transformant la terre brisée en dessous en une mer de flamme mouvante. Mais votre dragon est déjà dans les airs, ses ailes battant dur contre la chaleur montante. Vous grimpez plus haut dans le ciel chargé de cendres, sentant le brûlement du courant ascendant mais non la morsure du brasier. En contrebas, le feu se déverse inoffensivement sur la pierre noircie, et le veur de feu gronde, ses mâchoires fumant de frustration.#!"

 lv_firewyrm_duel.0001.frenzied_lunge:0 "Frappe maintenant — folie et fureur confondues !"
 lv_firewyrm_duel.0001.tt.frenzied_lunge:0 "[fd_round_me_dragon.GetName] charge en avant dans un bond sauvage et incontrôlé, tentant de fermer la distance et de porter un coup."
 lv_firewyrm_duel.0001.desc.frenzied_lunge.firewyrm_vs_firewyrm:0 "\n\n#medium Dans un beuglement qui secoue la cendre des falaises, votre veur surgit en avant dans une frénésie de muscle et de fumée. Les griffes déchirent la peau calcinée tandis que les deux bêtes s'entrechoquent, fureur contre fureur. Le sol tremble sous la violence, et pour un instant cela ressemble moins à une frappe qu'à un séisme prenant forme.#!"
 lv_firewyrm_duel.0001.desc.frenzied_lunge:0 "\n\n#medium Votre veur se lance avec une vitesse téméraire, un flou de griffes et de crocs déchiquetés. Il s'écrase contre le flanc du dragon, déchirant écaille et tendon avec une force sauvage. Le dragon se débat, ses ailes battant contre la vague de douleur, mais votre bête ne relâche pas — sa frénésie ne laissant que ruine dans son sillage.#!"
 lv_firewyrm_duel.0001.desc.frenzied_lunge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur se jette en avant, frappant la bête luisante dans une tempête de griffes et de mâchoires claquantes. Mais au lieu de chair, il rencontre du feu sans chair — la peau en fusion brûlant à travers ses serres. L'impact déchire les deux créatures, votre monture reculant avec un cri de douleur tandis que son propre assaut se retourne contre elle. La fureur se change en agonie en un battement de cœur, fumée et étincelles traînant du choc.#!"
 lv_firewyrm_duel.0001.desc.frenzied_lunge.miss:0 "\n\n#medium Dans un cri strident qui fend la pierre, votre veur bondit, ses griffes déchirant vers le haut à travers fumée et cendre. Mais le dragon est déjà dans les airs, ses ailes déchirant le ciel au-dessus du champ de bataille. La frappe ne trouve que ruine et poussière, l'élan projetant votre monture à travers le sol fissuré. Elle s'écrase durement, se retournant, ses yeux en fusion fixés sur sa proie, sa fureur intacte.#!"
 lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur ennemi explose hors de la cendre, son corps une tempête d'écailles et de rage. Il percute votre monture dans un choc à ébranler les os, ses crocs creusant profond tandis que ses griffes déchirent le feu dans la chair. Le sol tremble sous l'impact, votre veur hurlant sous la force écrasante de la frénésie déchaînée de son semblable.#!"
 lv_firewyrm_duel.0001.desc.counter.frenzied_lunge:0 "\n\n#medium Sans avertissement, le veur bondit en avant dans une frénésie, traînant griffe et croc à travers l'air chargé de cendres. Il s'écrase contre votre dragon avec une fureur téméraire, arrachant écaille de l'os. Vous sentez le choc traverser la selle, à travers les tendons, jusque dans vos propres os. Il ne reste plus rien d'un esprit dans cette chose — seulement la haine.#!"
 lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium La bête se jette en avant, hurlant, griffes et crocs frappant comme une avalanche. Mais lorsqu'elle s'écrase contre la peau en fusion de votre veur, l'attaque devient sa propre perte. Le feu jaillit contre le feu, brûlant l'assaillant tandis qu'il griffe en vain une armure luisante. Votre veur gronde à travers la tempête, inébranlable, tandis que son adversaire recule, boursouflé et hurlant.#!"
 lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss:0 "\n\n#medium Dans un cri strident et insensé, le veur de feu bondit, gueule grande ouverte et griffes déchirant l'air. Il s'écrase en avant à travers la fumée et la ruine, mais votre dragon est déjà dans les airs — ailes battant contre la chaleur et la cendre montantes. Le bond ne frappe que poussière et pierre brisée, et l'élan du veur l'envoie déraper à travers la terre fissurée. En contrebas, il se retourne avec un sifflement, ses yeux en fusion vous traquant en altitude, sa rage se réchauffant à chaque souffle.#!"

 lv_firewyrm_duel.0001.rockfall_roar:0 "Rugis, [fd_round_me_dragon.GetName] ! Arrache le ciel de ses piliers !"
 lv_firewyrm_duel.0001.tt.rockfall_roar:0 "[fd_round_me_dragon.GetName] pousse un rugissement qui fait trembler le sol même, délogeant roches et débris."
 lv_firewyrm_duel.0001.desc.rockfall_roar.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur se cabre, la poitrine se soulevant, et déchaîne un rugissement qui ébranle la pierre elle-même. La caverne tremble tandis que les murs se fendent et que les rochers s'effondrent. Une grêle de pierre s'abat sur le veur ennemi, sa peau en fusion s'illuminant tandis qu'il se débat sous le poids qui s'écroule. Des nuages de poussière fleurissent dans la lueur du feu, étouffant l'air jusqu'à ce que vous n'entendiez plus que le gémissement de la pierre et la fureur étouffée de l'ennemi en dessous.#!"
 lv_firewyrm_duel.0001.desc.rockfall_roar:0 "\n\n#medium Le rugissement que pousse votre veur est moins un son qu'une convulsion du monde même. La caverne frémit, les stalactites se brisant comme des dents depuis le plafond, les murs se fendant dans des craquements tonitruants. Le dragon vire vers le haut en panique, ses ailes griffant l'air tandis que la roche fend en nappes mortelles. La lueur du feu peint le chaos de rouge et d'or — votre ennemi pris entre pierre et flamme, se débattant pour survivre dans une tombe qui s'effondre.#!"
 lv_firewyrm_duel.0001.desc.counter.rockfall_roar.firewyrm_vs_firewyrm:0 "\n\n#medium Le veur ennemi beugle, et le monde s'écroule. La pierre se déchire du plafond en grandes dalles, le sol convulsant sous les griffes de votre bête. Vous vous cramponnez à la selle tandis que les gravats pleuvent autour de vous, assourdi par le rugissement de la terre et du monstre confondus. Votre veur chancelle, pris dans l'écrasement claustrophobe, ses yeux en fusion écarquillés tandis qu'il lutte non contre un rival — mais contre la montagne elle-même s'abattant sur vous.#!"
 lv_firewyrm_duel.0001.desc.counter.rockfall_roar:0 "\n\n#medium Le veur pousse un rugissement guttural qui résonne à travers les parois de la caverne — ou des ruines, ou quel que soit le cimetière où vous vous battez. Avec lui vient un tremblement. Les pierres se fendent et les plafonds gémissent. Une portion de la terre même cède, s'effondrant en poussière et gravats. Vous êtes contraint de fuir vers le haut ou d'être enseveli.#!"

 lv_firewyrm_duel.0001.molten_slough:0 "Mue ta peau, brûle plus fort ! Que rien ne te perce !"
 lv_firewyrm_duel.0001.tt.molten_slough:0 "[fd_round_me_dragon.GetName] mue ses écailles en fusion, se couvrant d'une nouvelle couche d'armure ardente et cautérisant au passage toute blessure qu'il avait."
 lv_firewyrm_duel.0001.tt.molten_slough.effect:0 "Une armure en fusion enveloppe le veur de feu, annulant toutes les attaques enflammées et infligeant des dégâts de brûlure considérables à tout contact rendu."
 lv_firewyrm_duel.0001.desc.molten_slough:0 "\n\n#medium Votre veur convulse sous vous avec un son comme des montagnes qui se brisent. Son dos se cambre, les écailles craquant et se détachant en nappes de chair brûlante. Des morceaux de peau fumante se détachent, s'écrasant sur le sol en amas luisants. De la ruine émerge une bête renée — luisante d'une lumière en fusion, ses blessures cautérisées, chaque souffle un jet de fournaise. La chaleur montant de son corps vous brûle la peau même à travers la selle, comme si vous ne chevauchiez plus une créature, mais le cœur vivant de la terre même.#!"
 lv_firewyrm_duel.0001.desc.counter.molten_slough:0 "\n\n#medium Dans un soulèvement guttural, le veur de feu cambre son dos — et se fend. Chair croûteuse et écaille calcinée se détachent, tombant au sol comme une armure en fusion. Il rugit, nouvellement luisant, à demi calciné et plus redoutable qu'avant. Ses blessures se cautérisent en fumant, et le feu dans sa gorge brûle plus vif encore.#!"

 lv_firewyrm_duel.0001.berserk_charge:0 "Toute ta force, [fd_round_me_dragon.GetName] ! Brise-le ou brise-toi !"
 lv_firewyrm_duel.0001.tt.berserk_charge:0 "[fd_round_me_dragon.GetName] charge en avant dans une attaque aveugle et furieuse, tentant de piétiner [fd_round_opponent_dragon.GetName]."
 lv_firewyrm_duel.0001.desc.berserk_charge.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur explose en avant dans un hurlement qui déloge la pierre des falaises, son corps un mastodonte de muscle et de rage en fusion. Il percute l'autre veur avec une telle force que la terre même se fend, griffes et dents déchirant sans nul souci de sa propre peau. Les deux bêtes se débattent dans une tempête de violence, l'air empli de fumée, de sang et de fureur sans retenue.#!"
 lv_firewyrm_duel.0001.desc.berserk_charge:0 "\n\n#medium Votre monture explose en mouvement, n'étant plus une bête mais une avalanche vivante de fureur. Elle s'écrase contre le flanc du dragon avec une force à briser les os, écaille et tendon se fracassant sous la charge. Le dragon hurle, chancelant sous l'assaut, tandis que votre veur griffe et déchire comme s'il voulait entraîner le ciel avec lui.#!"
 lv_firewyrm_duel.0001.desc.berserk_charge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium Votre veur se jette tête baissée contre la bête luisante, frappant du poids plein et téméraire de sa fureur. Mais la chair en fusion n'est nulle chair du tout. L'instant de l'impact devient un cataclysme : les griffes de votre veur brûlent, sa peau se boursouflant contre la fournaise qu'il pensait écraser. Les deux bêtes reculent, hurlant, le champ de bataille embrasé dans une tempête de flamme et d'agonie née de la rage se heurtant au feu incarné.#!"
 lv_firewyrm_duel.0001.desc.berserk_charge.miss:0 "\n\n#medium Dans un rugissement à faire chanceler des montagnes, votre veur charge, ses yeux en fusion fixés sur le dragon au-dessus. Il traverse fumée et pierre brisée, ses griffes déchirant vers le ciel — mais le dragon est déjà en vol, ses ailes le portant juste hors de portée. La charge s'achève en ruine : votre bête laboure la terre, soulevant une tempête de poussière et de cendre, sa fureur intacte, sa proie intouchée.#!"
 lv_firewyrm_duel.0001.desc.counter.berserk_charge.firewyrm_vs_firewyrm:0 "\n\n#medium Un rugissement fend la brume, et avant que vous ne puissiez vous cramponner, l'autre veur est sur vous — une force implacable de sang et de haine. Il percute votre monture avec un impact dévastateur, ses griffes déchirant, ses mâchoires broyant avec un abandon suicidaire. Le choc manque de vous arracher à la selle tandis que les deux bêtes se débattent dans un maelström de rage et de ruine.#!"
 lv_firewyrm_duel.0001.desc.counter.berserk_charge:0 "\n\n#medium Ensanglanté, à demi fou, hurlant, le veur charge — nul calcul, nulle raison. Ses yeux luisent comme des braises fendues. Il jette tout son corps monstrueux dans le combat, ignorant flamme et griffe. Vous voyez venir un coup que vous ne pouvez éviter. Le seul réconfort est celui-ci : il pourrait se détruire lui-même en tentant de vous détruire.#!"
 lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss.firewyrm_vs_firewyrm:0 "\n\n#medium La bête chargeante s'écrase de front contre la forme en fusion de votre veur, sa fureur se heurtant au feu vivant. L'impact se retourne instantanément, brûlant sa propre chair tandis que griffes et crocs ne trouvent nulle prise que la flamme. Votre veur tient bon, luisant comme une fournaise, tandis que son assaillant hurle d'agonie — boursouflé, brûlé, défait par sa propre rage déchaînée.#!"
 lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss:0 "\n\n#medium Dans un beuglement qui fend l'air épais de cendres, le veur de feu charge — aveuglé par la fureur, indifférent à la douleur. Il fonce à travers pierre brisée et ruine fumante, ses yeux en fusion fixés là où vous étiez un instant plus tôt. Mais vous êtes déjà dans les airs, votre dragon décrivant des cercles bien au-dessus. La bête s'écrase en dessous de vous, ses griffes déchirant des tranchées dans la terre tandis qu'elle rage contre le ciel. Il n'y a plus nulle pensée en elle à présent — seulement la ruine laissée par une frappe qui ne porte jamais.#!"


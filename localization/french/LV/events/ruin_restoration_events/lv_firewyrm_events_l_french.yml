l_french:
  trait_firewyrm:0 "Vouivre de feu"
  trait_firewyrm_desc:0 "Parente dégénérée des dragons, la vouivre de feu n'est point une créature de grâce ou de ciel. Elle rampe depuis les profondeurs de la terre, née de la pierre en fusion et de la folie, façonnée par la chaleur et le temps en une abomination crachant le feu. Là où les dragons inspirent la crainte respectueuse, les vouivres de feu ne laissent que des ruines calcinées et une mort empoisonnée par la fumée."

  # GUI
  HOLDING_VIEW_FIREWYRM:0 "Vouivre de feu"

  # Firewyrm Events
  lv_firewyrm_event.0001.t:0 "La chose qui brûle"
  lv_firewyrm_event.0001.desc:0 "Les ruines gémissent sous le poids des âges, pourtant ce ne sont ni le temps ni les tremblements qui ébranlent le sol sous vos pieds. Un cri strident - non, un hurlement - déchire l'air chargé de cendres comme une lame. Et puis elle arrive. Rampant hors d'un gouffre de pierre fissurée et de souffle incandescent, la vouivre de feu s'abat sur la ruine comme un démon surgi des anciens parchemins valyriens.\n\nCe n'est point un dragon. Ses écailles sont dentelées, couvertes d'ampoules et à demi fondues. La fumée siffle depuis les évents le long de son échine serpentine, son souffle une fournaise caustique qui noircit les pierres mêmes qu'elle foule. Ses yeux - dieux nous gardent - ses yeux sont en fusion, comme des plaies béantes, et elle se meut avec une faim qui ne doit rien à l'instinct et tout à la malveillance.\n\nMême les dragons craignaient les vouivres de feu, dit-on. Et ce qui vous fait face maintenant n'est nulle relique apprivoisée. C'est un vestige tordu de la folie de Valyria, une créature née non seulement du feu, mais de la démence même.\n\nVous n'avez que quelques instants pour choisir : combattre la bête, et peut-être devenir légende... ou fuir, et espérer que les ruines vous soient clémentes."
  lv_firewyrm_event.0001.duel.dragon:0 "[dragon.GetName] ! Aderī !"
  lv_firewyrm_event.0001.duel.dragon.tt:0 "Vous appelez rapidement votre dragon et vous préparez à affronter la bête."
  lv_firewyrm_event.0001.duel:0 "Acier et feu, donc. Que les dieux en soient témoins."
  lv_firewyrm_event.0001.duel.tt:0 "Vous tenez bon et tentez d'abattre la vouivre de feu."
  lv_firewyrm_event.0001.flee:0 "Ce n'est point un ennemi fait pour les vivants. Nous fuyons."
  lv_firewyrm_event.0001.flee.tt:0 "Vous décidez de fuir, abandonnant la vouivre de feu à son antre."

  lv_firewyrm_spawned_tooltip:0 "Une vouivre de feu a établi son antre dans la région."
  lv_firewyrm_cleared_tooltip:0 "L'antre de [lair_location.GetName] est maintenant déblayé."

  ## Firewyrm Duel Events
  lv_firewyrm_duel.0001.t:0 "Cendre contre flamme"
  lv_firewyrm_duel.0001.desc:0 "#medium Le sol crépite sous les serres de votre monture tandis que votre dragon atterrit, repliant ses ailes comme des nuages d'orage dans le ciel fracturé. Devant vous se trouve la vouivre de feu : ni couchée, ni curieuse, mais affamée.\n\nElle se tortille hors du puits en ruine comme une chose née de la fumée et du tourment, sa peau fondue fumant à chaque mouvement. Nulles ailes. Nulle grâce. Seulement la fureur dentelée et les écailles couvertes d'ampoules, suintant la fumée depuis les évents et les fissures le long de son échine. Là où un dragon est le feu fait chair, cette créature est le feu mal fait.\n\nVotre dragon gronde sourdement, un son qui fait trembler la pierre noircie. La vouivre répond, non par un rugissement, mais par un cri strident qui glace le sang : défiant et fou.#!"
  lv_firewyrm_duel.0001.desc.valyria:0 "#medium Ici, dans le cœur fumant de Valyria, deux monstres se rencontrent.#!\n\n"
  lv_firewyrm_duel.0001.desc.lyria:0 "#medium Ici, sur les falaises croulantes d'Epaekros, où la terre glisse et le ciel brûle, deux monstres vont danser.#!\n\n"
  lv_firewyrm_duel.0001.desc.lokiria:0 "#medium Ici, sous l'ombre suffocante de Gaelithox, deux monstres se rencontrent dans une brume de flamme et de fureur.#!\n\n"
  lv_firewyrm_duel.0001.desc.lands_of_the_long_summer:0 "#medium Ici, où la chaleur de l'été ne s'estompe jamais et où le souffle de l'ancienne Valyria s'attarde encore, deux monstres se croisent dans une défiance calcinée.#!\n\n"
  lv_firewyrm_duel.0001.desc.elsewhere:0 "#medium Ici, loin des ossements de Valyria, deux terreurs antiques se rencontrent comme attirées par le seul destin.#!\n\n"
  lv_firewyrm_duel.0001.desc.final:0 "#medium Vos mains se resserrent sur les rênes. Un souffle, un mot, et le ciel s'embrase.#!"
  lv_firewyrm_duel.0001.a:0 "[dragon.GetName], dracarys !"
  lv_firewyrm_duel.0001.b:0 "Sōvēs, [dragon.GetName] !"

  # Defeat
  lv_firewyrm_duel.0003.t:0 "Calcinés depuis les cieux"
  lv_firewyrm_duel.0003.desc.sudden_strike:0 "#medium Il n'y eut nul avertissement - seulement le mouvement.\n\nUn instant, votre dragon tournoyait dans l'air épais de cendres, scrutant les étranges mouvements bouillonnants de la créature. L'instant suivant, la vouivre de feu jaillit vers le haut avec une vitesse impossible, flou d'écailles cramoisies et de fumée rougeoyante. Un rugissement fendit le ciel - non, pas un rugissement, un hurlement, un cri strident, une chose sans origine - et puis le monde bascula.\n\nLe coup frappa sous l'aile de votre dragon, choc sauvage qui brisa le rythme et l'équilibre. Le ciel se pencha de côté. Vous vous souvenez du silence soudain de la chute, de la ruée brûlante de l'air, de l'éclair de douleur blanche et chaude.\n\nVous et votre dragon ne touchâtes même jamais le sol.#!"
  lv_firewyrm_duel.0003.desc.dragonfire:0 "#medium Vous donnâtes l'ordre un battement de cœur trop tard.\n\nLa vouivre de feu était demeurée immobile - trop immobile. Ses yeux fondus vous suivaient comme si elle attendait, calculait. Et puis elle ouvrit ses mâchoires, larges et dentelées comme une caverne brisée, et le monde devint flamme.\n\nUn torrent de feu jaillit vers le haut en geyser de colère blanc-chaud. Votre dragon tenta de virer, tenta de s'élever, mais l'enfer la rattrapa en plein vol, engloutissant l'aile, l'écaille et le cavalier en une seule fournaise hurlante. Le ciel bouillonna autour de vous. Les sangles de la selle brûlèrent jusqu'aux cendres. L'air même se retourna contre vous, vent de braises et de cendres.\n\nVous ne tombâtes point. Vous disparûtes - consumés avant même de pouvoir crier.#!"
  lv_firewyrm_duel.0003.desc.driven_to_ground:0 "#medium Vous vîtes l'instant où elle changea de direction.\n\nLa vouivre de feu se replia, non pour battre en retraite, mais pour s'élever - impossiblement rapide pour quelque chose de cette taille. Puis vint le bond, toute fureur et masse, et avant que votre dragon puisse dégager l'air, elle était sur vous.\n\nLe monde bascula de côté. Des griffes et des cendres et de la douleur. Le poids entier de la bête s'abattit comme une montagne qui s'effondre, et votre dragon cria - cri terrible et gargouillant qui ébranla vos os même tandis qu'ils se brisaient avec [fd_attacker_dragon.Custom('GetDragonHerHim')]. Les ailes se tordirent. Les côtes craquèrent. Le sol forma un cratère.\n\nCoinçé sous la masse de la vouivre de feu, votre dragon se débattit une fois... puis plus. Vous ressentîtes tout : le dernier battement de cœur, le dernier soubresaut de résistance, avant que la pierre ne monte à la rencontre de votre crâne.#!"
  lv_firewyrm_duel.0003.desc.disemboweled:0 "#medium Vous donnâtes l'ordre. Vous vous penchâtes en avant sur la selle, et votre dragon obéit - brave, rapide, loyal.\n\nMais ce ne fut point assez.\n\nLa vouivre de feu jaillit avec une vitesse surnaturelle, esquivant votre frappe et vous accueillant non avec la flamme mais avec les griffes - longues, noircies et brûlantes. L'une transperça les écailles de votre dragon comme du parchemin. La seconde trouva prise plus profond encore.\n\nUn son horrifiant suivit - cri humide et déchirant qui n'était ni celui de votre dragon ni le vôtre. Les entrailles se répandirent dans le ciel chargé de cendres comme de la vapeur d'une forge rompue. L'odeur du sang, fondu et épais, submergea même le soufre et la fumée.\n\nVous vous accrochâtes un battement de cœur de plus, regardant les yeux de votre dragon s'obscurcir tandis qu'elle s'affaissait en plein air - créature de majesté, défaite non par le feu, mais par la sauvagerie brute d'une bête qui ne devrait point être.#!"
  lv_firewyrm_duel.0003.desc.eviscerated:0 "#medium Le ciel est rouge de feu et de sang.\n\nVotre commandement était audacieux, mais la bête fut plus audacieuse. La vouivre de feu bondit avec un cri comme l'acier qui se déchire, frappant non avec fureur mais avec dessein. Ses serres s'enfoncèrent profond - une fois, deux fois - flot de coups sauvages qui fendirent l'écaille, le cuir et la chair pareillement.\n\nVotre dragon se débattit dans l'agonie, les ailes faillissant, le souffle se saisissant à mi-rugissement. Vous vous accrochiez, criant, l'exhortant, mais il était déjà trop tard. Une ultime entaille brutale fendit son ventre en deux, et son cri fut coupé net tandis que le sang et le feu jaillirent dans l'air.\n\nLa vouivre ne s'arrêta point.\n\nElle griffa et déchira et déchira encore - frénésie de haine faite chair. Vous ne vîtes que des éclairs : le bris d'une aile, la déchirure d'une gorge, votre selle qui craquait sous vous tandis que le corps brisé de votre dragon spiralait vers la ruine.\n\nLa dernière chose que vous voyez est la vouivre de feu, luisante de sang, criant triomphe à un ciel qui n'oubliera jamais cette boucherie.#!"
  lv_firewyrm_duel.0003.desc.chomp:0 "#medium Certains monstres n'étaient point faits pour être affrontés.\n\nLa vouivre de feu se dresse - chose montagneuse de cuir calciné et de souffle fondu, bien plus grande que toute bête que vous ayez combattue ou rêvée. Votre dragon tourne avec prudence, la flamme léchant les mâchoires de [fd_attacker_dragon.Custom('GetDragonHerHis')], mais il y a une hésitation maintenant. Une pause. Une terreur instinctive qui parle d'une vérité plus profonde : cette chose n'est point parente. Elle est la ruine faite chair.\n\nPuis elle bondit.\n\nIl n'y a nul cri strident, nul rugissement - seulement l'impact. En un instant, votre dragon est arraché du ciel, cloué et écrasé sous le poids de la vouivre. Vous criez, tirant votre lame, mais elle est inutile. Vous êtes inutile.\n\nLa gueule s'ouvre, vaste et fumante, et avec un craquement écœurant d'os et d'écaille, votre dragon disparaît dans sa gorge.\n\nVous êtes toujours sanglé.\n\nLa chaleur est insupportable. Tout n'est que sang, feu, ténèbres.\n\nEt puis plus rien.#!"

  lv_firewyrm_duel.0003.a.sudden_strike:0 "Nous... n'avons jamais eu la moindre chance."
  lv_firewyrm_duel.0003.a.tt.sudden_strike:0 "Votre dragon est abattu d'un seul coup inattendu de la vouivre de feu."

  lv_firewyrm_duel.0003.a.dragonfire:0 "La lumière vint trop vite... trop brillante."
  lv_firewyrm_duel.0003.a.tt.dragonfire:0 "Vous et votre dragon êtes engloutis dans les flammes de la vouivre de feu, incapables d'échapper à l'enfer."

  lv_firewyrm_duel.0003.a.driven_to_ground:0 "Vole ! Non... non, non, non..."
  lv_firewyrm_duel.0003.a.tt.driven_to_ground:0 "Vous et votre dragon êtes précipités au sol par la vouivre de feu, écrasés par l'impact brutal."

  lv_firewyrm_duel.0003.a.disemboweled:0 "Non, [fd_attacker_dragon.GetName] ! Tiens bon - TIENS BON ! Je t'en prie..."
  lv_firewyrm_duel.0003.a.tt.disemboweled:0 "Votre dragon est éventré par les griffes de la vouivre de feu, et vous regardez impuissant tandis que vous chutez tous deux."

  lv_firewyrm_duel.0003.a.eviscerated:0 "Déchire-nous donc, si tu le dois."
  lv_firewyrm_duel.0003.a.tt.eviscerated:0 "Votre dragon est éviscéré par la vouivre de feu, et bientôt vous suivez."

  lv_firewyrm_duel.0003.a.chomp:0 "Argh ! Non, non..."
  lv_firewyrm_duel.0003.a.tt.chomp:0 "Vous et votre dragon êtes dévorés par la vouivre de feu d'une seule morsure brutale."

  # Victory
  lv_firewyrm_duel.0004.t:0 "Dans le sillage de l'enfer"
  lv_firewyrm_duel.0004.desc.sudden_strike:0 "#medium Le vent s'apaise - mais seulement un battement de cœur.\n\nVotre dragon bouge en premier. Un virage sec des ailes, une spirale descendante, et puis soudain d'impossible vitesse. Avant que la vouivre de feu puisse crier, se replier, ou vomir son feu infernal, votre dragon est déjà sur elle.\n\nLes griffes frappent juste - coup sauvage au crâne, ou à la gorge, ou à la base de l'échine - et la vouivre s'effondre comme des scories versées sur de la pierre froide.\n\nElle meurt sans gloire, sans rugissement, sans brasier de fureur. Juste un effondrement. Un souffle volé. Et puis l'immobilité.\n\nLa victoire ne vint point avec la lutte, mais avec la précision.#!"
  lv_firewyrm_duel.0004.desc.dragonfire:0 "#medium L'air brûle tandis que [fd_attacker_dragon.GetName] exhale la fureur.\n\nLe feu jaillit de ses mâchoires en torrent de chaleur et de lumière, rouge-doré et aveuglant contre le ciel cendré. Il s'abat sur la vouivre de feu comme une marée du jugement, engloutissant sa forme tordue dans un enfer plus ancien que les rois. La créature hurle - cri strident qui sonne moins comme de la douleur que comme une rage niée - tandis que sa peau commence à se couvrir d'ampoules, noircir, se détacher.\n\nLa bête se débat sauvagement, les flammes s'accrochant à sa forme comme une malédiction. Un battement de cœur, elle charge en avant - brûlante, à demi aveugle, défiant jusqu'au bout - mais la flamme ne faiblit point. La chaleur fait fondre la pierre sous elle.\n\nEt puis, le silence.\n\nSeules la fumée et la puanteur de chair grillée demeurent. La vouivre de feu gît immobile - coque fumante parmi les ossements de l'ancien empire.#!"
  lv_firewyrm_duel.0004.desc.driven_to_ground:0 "#medium Le ciel rétrécit tandis que nous descendons.\n\nAvec un rugissement qui fait trembler les os du monde, [fd_attacker_dragon.GetName] s'abat sur la vouivre de feu d'en haut - force d'ailes, de serres et de fureur rencontrant la chair brûlante et la haine. Le sol tremble tandis que nous nous écrasons dans la terre calcinée, les cendres volcaniques jaillissant vers l'extérieur comme une vague noire.\n\nLa vouivre de feu crie - non de douleur, mais d'incrédulité - tandis qu'elle est enfoncée sous notre poids, clouée contre la pierre fissurée comme une bête traquée. Une de ses pattes se tord avec un pop écœurant, et son corps serpentin se débat, creusant de profondes ornières dans le sol taché de lave.\n\nIl n'y a nulle élégance à la mise à mort. Seulement la domination brutale. [fd_attacker_dragon.GetName] gronde, la fumée coulant de ses narines, et se penche. Les dents rencontrent l'os. Le dernier cri de la vouivre de feu s'évanouit dans le vent chargé de cendres.#!"
  lv_firewyrm_duel.0004.desc.disemboweled:0 "#medium L'acier, l'écaille et la fureur s'entrechoquent. Avec un cri strident et furieux, votre dragon griffe le flanc de la vouivre de feu - une fois, deux fois - puis plonge pour la mise à mort. Du sang comme du métal en fusion gicle des blessures de la bête, sifflant tandis qu'il frappe la pierre calcinée.\n\nLa vouivre de feu se débat, sa carcasse nerveuse se tordant comme un serpent dans les flammes. Mais votre dragon ne relâche point. Un dernier coup brutal fend le ventre de la vouivre en deux. Ses entrailles se répandent sur la terre brisée, la vapeur s'élevant de la ruine de ce qui fut jadis un prédateur de cauchemars.\n\nLa vouivre de feu ne fait nul son en mourant - seulement une grande expiration frissonnante qui sent le soufre et la pourriture ancienne.#!"
  lv_firewyrm_duel.0004.desc.eviscerated:0 "#medium Les écailles rouge-acier se déchirent comme de la toile pourrie.\n\nLes griffes de votre dragon griffent profond, au-delà de la peau fondue et du muscle fumant, jusqu'à ce que le ventre de la vouivre de feu soit ouvert. La bête crie - non en défiance, mais en agonie - tandis que la flamme et la bile se répandent de la déchirure, son cœur-fournaise exposé à l'air frais chargé de cendres.\n\nElle se tord, se débattant contre la mort, mais votre dragon tient bon. Autre déchirure sauvage, autre panache de sang, jusqu'à ce que les luttes de la créature deviennent des tremblements... et puis, plus rien du tout.\n\nSes entrailles fument sur la terre brisée. Terreur des profondeurs, défaite par le croc et la fureur.#!"
  lv_firewyrm_duel.0004.desc.chomp:0 "#medium Il n'y a nulle élégance en ceci - seulement la domination faite chair.\n\nLa vouivre de feu se dresse pour frapper, mais votre dragon bondit avec une finalité terrifiante. Des mâchoires comme des portes de château claquent autour de la bête, écrasant l'écaille volcanique et les tendons avec un craquement humide et grinçant. Un cri étouffé se perd dans la gorge de votre dragon tandis qu'il lance la vouivre de feu comme de la charogne, la gueule travaillant avec faim, la gorge se gonflant.\n\nEn quelques secondes, l'horreur des ruines est réduite à une forme avalée, tressaillant une fois tandis qu'elle glisse vers le néant.\n\nL'air s'apaise. La terre, jadis terrorisée, se tait sous l'ombre d'un vrai prédateur suprême.#!"

  lv_firewyrm_duel.0004.a.sudden_strike:0 "Rapide. Net. Fait."
  lv_firewyrm_duel.0004.a.tt.sudden_strike:0 "Votre dragon frappe avec une force soudaine et brutale, mettant fin à la vie de la vouivre de feu d'un seul coup."

  lv_firewyrm_duel.0004.a.dragonfire:0 "Brûle, chose misérable !"
  lv_firewyrm_duel.0004.a.tt.dragonfire:0 "Votre dragon déchaîne un torrent de feu, engloutissant la vouivre de feu dans les flammes."
  
  lv_firewyrm_duel.0004.a.driven_to_ground:0 "C'est cela, [fd_attacker_dragon.GetName] ! Achève-la !"
  lv_firewyrm_duel.0004.a.tt.driven_to_ground:0 "La vouivre de feu est dévorée parmi les morsures effrénées de [fd_attacker_dragon.GetNameNoTooltip]"

  lv_firewyrm_duel.0004.a.disemboweled:0 "Déchire ! Lacère ! Qu'elle saigne !"
  lv_firewyrm_duel.0004.a.tt.disemboweled:0 "La vouivre de feu est mise en pièces par [fd_attacker_dragon.GetNameNoTooltip], ses entrailles se répandant sur le sol."

  lv_firewyrm_duel.0004.a.eviscerated:0 "Qu'elle brûle de l'intérieur !"
  lv_firewyrm_duel.0004.a.tt.eviscerated:0 "Votre dragon fend le ventre de la vouivre de feu, exposant ses entrailles à l'air."

  lv_firewyrm_duel.0004.a.chomp:0 "Et voilà... c'est fait."
  lv_firewyrm_duel.0004.a.tt.chomp:0 "Votre dragon dévore la vouivre de feu d'une seule morsure brutale."
  lv_firewyrm_duel.0004.chomp.t:0 "[fd_attacker_dragon.GetNameNoTooltip] apprécie le goût"

  # Post-Round 1 Text
  lv_firewyrm_duel.0001.desc.succeeding:0 "#medium Le ciel bouillonne de chaleur et de cendres tandis que la bataille ne montre nul signe de faiblir. La fumée s'enroule comme des doigts qui agrippent, et la flamme zèbre les nuages par sursauts de fureur. Chaque battement des ailes de votre dragon remue les escarbilles de la terre noircie en contrebas. La vouivre de feu, rendue folle et implacable, tourne selon son propre rythme brutal. Ce n'est point un simple choc - c'est une guerre de volontés écrite dans les cieux.#!"
  lv_firewyrm_duel.0001.desc.succeeding.final:0 "#medium \n\nLe rythme de la bataille continue, le feu et la fureur battant comme un second cœur dans votre poitrine. Un autre mouvement doit être fait.#!"

  # Post-Special States
  lv_firewyrm_duel.0001.stunned:0 "Tenez bon... respirez juste..."
  lv_firewyrm_duel.0001.tt.stunned:0 "Votre dragon chancelle sous la dernière attaque de la vouivre de feu, incapable d'agir ce tour."
  lv_firewyrm_duel.0001.desc.stunned:0 "\n\n#medium La brume se lève. Votre dragon cligne des yeux, les muscles se tendant tandis que la clarté revient à ses yeux. Le moment de faiblesse est passé, mais non sans coût. La terre calcinée et la forme menaçante de la vouivre de feu vous accueillent tandis que la bataille reprend. Vous sentez votre monture respirer profondément, un grondement sourd se formant dans sa poitrine. Quelle que fût l'emprise de ce cri strident... elle est brisée maintenant.#!"

  lv_firewyrm_duel.0001.takeoff:0 "Il nous faut de l'altitude ! Sortons-nous de là !"
  lv_firewyrm_duel.0001.tt.takeoff:0 "Votre dragon tente de prendre de l'altitude, essayant d'échapper à la portée de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.takeoff:0 "\n\n#medium Vous poussez votre dragon vers le haut, les ailes luttant contre le poids des cendres et de la fumée. Les yeux fondus de la vouivre de feu suivent, mais elle ne peut égaler votre ascension. Un moment, vous êtes libre : le sol s'éloigne, le ciel s'ouvre, et vous pouvez respirer de nouveau. Mais la bête est implacable. Elle ne vous laissera point échapper si aisément.#!"

  lv_firewyrm_duel.0001.land:0 "Il nous faut atterrir ! Maintenant !"
  lv_firewyrm_duel.0001.tt.land:0 "Votre dragon tente d'atterrir, essayant de reprendre le contrôle de la situation."
  lv_firewyrm_duel.0001.desc.land:0 "\n\n#medium Avec une tirée brusque sur les rênes et un commandement crié, vous guidez votre dragon vers le bas à travers le ciel chargé de cendres. Le vent calciné fouette votre visage tandis que les serres s'écrasent contre la terre brisée. Le sol gémit sous le poids de votre monture tandis que les ailes se replient, la fumée s'enroulant entre la pierre fissurée et les évents fondus. Vous plissez les yeux à travers la brume : la vouivre de feu rôde en avant, ses yeux comme des charbons ardents dans la pénombre. Les cieux sont derrière vous maintenant. Le reste de cette bataille sera livré là où les légendes tombent - sur le sol, parmi la ruine et la flamme.#!"

  lv_firewyrm_duel.0001.warning.force_land:0 "@warning_icon! #X Votre dragon sera forcé d'atterrir en effectuant ce mouvement !#!"
  lv_firewyrm_duel.0001.warning.burn_contact:0 "@warning_icon! #X Tout mouvement impliquant un contact avec la vouivre de feu dans son état fondu brûlera ou blessera davantage votre dragon !#!"
  lv_firewyrm_duel.0001.warning.burn_incoming:0 "@warning_icon! #X La flamme de la vouivre de feu approche ! Votre dragon sera brûlé ou davantage blessé si vous ne réagissez pas à temps !#!"
  lv_firewyrm_duel.0001.warning.nullified:0 "@warning_icon! #X Ce mouvement ne causera aucun dégât dans l'état actuel de la vouivre de feu !#!"

  # Dragon Moves
  lv_firewyrm_duel.0001.circle_beast:0 "Continuez à bouger. Laissez-la deviner où tombera le prochain coup."
  lv_firewyrm_duel.0001.tt.circle_beast:0 "Votre dragon garde ses distances, tournoyant autour de la vouivre de feu pour provoquer la confusion ou attirer une ouverture."
  lv_firewyrm_duel.0001.desc.circle_beast:0 "\n\n#medium Votre dragon bat un large arc à travers le ciel chargé de fumée, se tenant juste au-delà de la portée de la vouivre. La bête gronde et se tord, vous traquant d'yeux luisants. Vous n'offrez nulle ouverture, pourtant vous apprenez comment elle bouge, comment elle se replie avant une frappe.#!"

  lv_firewyrm_duel.0001.flame_test:0 "Voyons combien de feu elle peut supporter."
  lv_firewyrm_duel.0001.tt.flame_test:0 "Votre dragon crache un jet mesuré de flamme - non pour nuire, mais pour tester la résistance propre de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.flame_test:0 "\n\n#medium Vous signalez un sursaut contrôlé de flamme draconique - non destiné à tuer, mais à provoquer. La vouivre de feu surgit à travers avec une aisance troublante... ou frissonne, reculant tandis que la flamme s'enroule le long de ses écailles. Maintenant, du moins, vous comprenez ce qu'elle peut endurer.#!"
  
  lv_firewyrm_duel.0001.claws_out:0 "Visez les membres ! Entravez-la avant qu'elle ne frappe encore !"
  lv_firewyrm_duel.0001.tt.claws_out:0 "Un bond basique mais direct visant à griffer les pattes ou les flancs de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.claws_out:0 "\n\n#medium Nulle finesse, nulle stratégie - juste les dents et les serres. Votre dragon s'écrase vers la vouivre dans une lutte primitive de force. L'air chante de violence tandis que les deux monstres se griffent et se fouettent l'un l'autre, l'écaille et le tendon déchirés au passage.#!"

  lv_firewyrm_duel.0001.reckless_dive:0 "Au diable les risques - nous y allons maintenant !"
  lv_firewyrm_duel.0001.tt.reckless_dive:0 "Une plongée à haute vitesse en portée de mêlée. Dangereux pour le cavalier et la bête, mais pourrait finir les choses rapidement."
  lv_firewyrm_duel.0001.desc.reckless_dive:0 "\n\n#medium Vous vous penchez bas dans le vent et poussez votre dragon dans une plongée brutale. Vous déchirez le feu et les cendres comme une lance vivante, mais la vitesse imprudente est un pari. Touché ou manqué, vous payez en sang ou en souffle.#!"

  lv_firewyrm_duel.0001.guard_skies:0 "Maintenez la formation. Gardez les ailes et la gorge."
  lv_firewyrm_duel.0001.tt.guard_skies:0 "Votre dragon protège ses parties vulnérables et tourne en altitude, minimisant les ouvertures pour les frappes de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.guard_skies:0 "\n\n#medium Vous appelez votre dragon plus haut, ses ailes balayant un halo protecteur à travers l'air lacé de ruines. Nulles failles, nuls bonds sauvages. Vous chevauchez le vent comme une lame sur le fil, prêt à parer tout ce que la bête hurle sur votre chemin.#!"

  lv_firewyrm_duel.0001.rip_joints:0 "Ses genoux fléchissent comme toute bête. Frappez juste !"
  lv_firewyrm_duel.0001.tt.rip_joints:0 "Une frappe précise visant les articulations ou les plaques exposées de la vouivre. Risqué, mais potentiellement décisif."
  lv_firewyrm_duel.0001.desc.rip_joints:0 "\n\n#medium Pas la tête. Pas le ventre. Vous signalez vers les jointures de son corps - là où l'écaille rencontre le muscle, là où elle doit bouger pour frapper. Votre dragon griffe juste, et la vouivre de feu hurle tandis qu'une patte convulse sous son poids.#!"

  lv_firewyrm_duel.0001.roar_challenge:0 "Qu'elle sache que nous ne sommes point une proie."
  lv_firewyrm_duel.0001.tt.roar_challenge:0 "Votre dragon lâche un rugissement assourdissant, essayant d'énerver ou de provoquer la vouivre de feu vers une agression imprudente."
  lv_firewyrm_duel.0001.desc.roar_challenge:0 "\n\n#medium Vous poussez votre dragon à beugler - un son profond qui ébranle l'âme, répondant à la folie propre de la vouivre de feu avec la fureur draconique. La réponse est immédiate : la bête charge, enragée et irréfléchie. Vous avez attiré son ire. Maintenant survivez-y.#!"

  lv_firewyrm_duel.0001.dive_strike:0 "Dedans et dehors - assez vite pour la saigner sans être brûlé."
  lv_firewyrm_duel.0001.tt.dive_strike:0 "Un passage rapide à travers la portée de la vouivre, visant à laisser une blessure et disparaître avant que les représailles puissent atterrir."
  lv_firewyrm_duel.0001.desc.dive_strike:0 "\n\n#medium Vous repérez une ouverture - brève, incertaine - et plongez à travers comme la foudre. Votre dragon griffe son flanc au passage, ne s'arrêtant point pour s'entrechoquer mais bougeant droit à travers l'espace de la bête, transformant le ciel même en arme.#!"

  lv_firewyrm_duel.0001.tailspin_slam:0 "Tournoyez et brisez-lui les côtes !"
  lv_firewyrm_duel.0001.tt.tailspin_slam:0 "Votre dragon se fouette en un choc tournoyant, tentant de briser l'os par la force pure."
  lv_firewyrm_duel.0001.desc.tailspin_slam:0 "\n\n#medium Vous commandez une roulade et une torsion, votre dragon tournoyant avec une grâce violente. La vouivre est lente à réagir - étourdie ou engourdie - et la queue de votre dragon s'abat comme un marteau sur son flanc. L'os craque. L'air même tressaille.#!"

  lv_firewyrm_duel.0001.wound_exploit:0 "Cette entaille n'a point guéri. Nous nous assurerons qu'elle ne le fera jamais."
  lv_firewyrm_duel.0001.tt.wound_exploit:0 "Vous exploitez une blessure antérieure, espérant l'élargir et drainer les dernières forces de la vouivre de feu."
  lv_firewyrm_duel.0001.desc.wound_exploit:0 "\n\n#medium Vous la voyez : une tache brûlée nue d'écailles, luisante de sang et de chaleur. Un commandement précis, et votre dragon plonge vers elle. Les serres trouvent la chair. La vouivre crie d'agonie tandis que la blessure est déchirée plus large, sa force fuyant à chaque battement.#!"

  lv_firewyrm_duel.0001.vipers_feint:0 "Glissez à gauche. Frappez à droite."
  lv_firewyrm_duel.0001.tt.vipers_feint:0 "Un mouvement faux éblouissant - seul un cavalier de ruse peut l'exécuter proprement."
  lv_firewyrm_duel.0001.desc.vipers_feint:0 "\n\n#medium Comme un serpent en vol, vous changez les angles en plein air : une feinte, puis une frappe depuis un sentier impossible. Votre dragon se tord à travers un souffle de flamme et livre un rake punissant avant que la vouivre ne réalise même où vous êtes allé.#!"

  lv_firewyrm_duel.0001.dragonflame_barrage:0 "Brûlez-la - encore et encore !"
  lv_firewyrm_duel.0001.tt.dragonflame_barrage:0 "Votre dragon lâche un barrage complet de flamme, visant à submerger la vouivre avec la puissance de feu brute."
  lv_firewyrm_duel.0001.desc.dragonflame_barrage:0 "\n\n#medium Vous ne vous retenez point. Avec un rugissement, votre dragon relâche un torrent de feu en vagues balayantes. La vouivre gronde et bat en retraite sous la chaleur, sa peau s'allumant. Ce n'est point une mise à mort, mais c'est un message gravé dans la flamme.#!"

  lv_firewyrm_duel.0001.chomp:0 "#bold MORDS !#!"
  lv_firewyrm_duel.0001.tt.chomp:0 "Vous #bold MORDEZ !#!"

  lv_firewyrm_duel.0001.commanding_cry:0 "Concentre-toi, mon ami ! Nous respirons ensemble !"
  lv_firewyrm_duel.0001.tt.commanding_cry:0 "Un cri de ralliement à votre dragon, l'exhortant à se concentrer et synchroniser ses attaques avec les vôtres."
  lv_firewyrm_duel.0001.desc.commanding_cry:0 "\n\n#medium Avec un mot - ancien, puissant - vous apaisez le souffle de votre dragon. Vous murmurez la force dans ses oreilles. Son battement d'aile se stabilise, son sang ralentit. Les blessures se referment juste assez pour le vol. Vous achetez un autre tour... peut-être plus.#!"

  lv_firewyrm_duel.0001.hidden_knowledge:0 "Je me souviens des anciens textes. [dragon.GetName], faites exactement ce que je commande !"
  lv_firewyrm_duel.0001.tt.hidden_knowledge:0 "Vous vous rappelez une tactique spécifique depuis les textes valyriens anciens, espérant qu'elle tournera la marée de la bataille."
  lv_firewyrm_duel.0001.desc.hidden_knowledge:0 "\n\n#medium Vous vous rappelez les contes. Les tactiques que les Valyriens utilisaient jadis quand les dragons n'étaient point des bêtes mais des armes de guerre. Votre dragon bouge avec ce même rythme maintenant - transformant la sagesse ancienne en mort aéroportée. La vouivre ne s'y attend point.#!"

  lv_firewyrm_duel.0001.risk_it_all:0 "Ceci finit d'une façon : sang et cendres."
  lv_firewyrm_duel.0001.tt.risk_it_all:0 "Vous misez tout sur une charge désespérée. Si cela marche, le duel finit. Sinon... vous aussi."
  lv_firewyrm_duel.0001.desc.risk_it_all:0 "\n\n#medium Vous donnez le commandement impensable. Votre dragon tombe du ciel comme une pierre, les griffes découvertes, la flamme montant. La vouivre se dresse pour vous rencontrer. Deux monstres, un choc final. Il n'y aura point de seconde frappe.#!"

  lv_firewyrm_duel.0001.collapse_ground:0 "Abattez le sol sur elle ! Que la terre avale ce monstre !"
  lv_firewyrm_duel.0001.tt.collapse_ground:0 "Vous commandez à votre dragon de déchaîner un torrent de feu sur le sol, le déstabilisant et espérant enterrer la vouivre de feu dans la terre qui s'effondre."
  lv_firewyrm_duel.0001.desc.collapse_ground:0 "\n\n#medium Vous repoussez la vouivre de feu, plus bas et plus bas, et puis signalez l'attaque. La pierre craque sous ses membres. La terre gémit. Un effondrement soudain, un panache de poussière, et la bête disparaît dans un hurlement sous le sol de ruine brisé.#!"

  # Firewyrm Moves
  lv_firewyrm_duel.0001.fume_burst:0 "Un sursaut de fumées brûlantes ! Cela brûlera vos poumons !"
  lv_firewyrm_duel.0001.tt.fume_burst:0 "La vouivre de feu relâche un nuage de gaz surchauffé, visant à ébouillanter et désorienter votre dragon."
  lv_firewyrm_duel.0001.desc.counter.fume_burst:0 "\n\n#medium La vouivre de feu inhale profondément, puis déchaîne un nuage de fumées brûlantes. Votre dragon recule, les ailes s'évasant tandis qu'il essaie d'échapper à la brume brûlante. Vous sentez la chaleur même d'ici - rappel que cette bête n'est point juste une flamme, mais une fournaise vivante.#!"

  lv_firewyrm_duel.0001.boneshattering_screech:0 "Un cri strident qui brise la pierre ! Couvrez vos oreilles !"
  lv_firewyrm_duel.0001.tt.boneshattering_screech:0 "La vouivre de feu émet un cri strident assourdissant, visant à désorienter et déséquilibrer votre dragon."
  lv_firewyrm_duel.0001.desc.boneshattering_screech:0 "\n\n#medium L'air se fend avec un cri strident si perçant qu'il semble que votre crâne pourrait se fissurer. Votre dragon chancelle en plein air, les ailes faiblissant, les yeux larges de douleur et de désorientation. Le cri strident de la vouivre de feu fait écho sur la pierre brisée et les falaises fondues - arme de son plus sauvage que l'acier. Vous essayez de stabiliser la bête sous vous, mais pour l'heure, tout ce que vous pouvez faire est tenir bon. Il n'y aura nulle manœuvre cette fois - seulement la survie.#!"

  lv_firewyrm_duel.0001.cone_of_flame:0 "Un cône de flamme ! Il calcinera tout sur son passage !"
  lv_firewyrm_duel.0001.tt.cone_of_flame:0 "La vouivre de feu déchaîne un large cône de flamme, essayant d'engloutir votre dragon dans une vague de chaleur."
  lv_firewyrm_duel.0001.desc.cone_of_flame:0 "\n\n#medium Avec un hurlement qui déchire depuis quelque fosse fondue, la vouivre de feu se dresse - sa gorge gonflant de feu - et déchaîne un cône brûlant de flamme à travers le champ de bataille. L'air se transforme en fumée et fureur tandis que le brasier s'évase vers l'extérieur, engloutissant la pierre brisée et le ciel pareillement. Vous sentez la chaleur avant qu'elle frappe, comme un marteau fait de lumière. Votre dragon crie, les ailes s'évasant contre l'enfer, tandis que le monde se brouille en rouge boursoufflant.#!"
  lv_firewyrm_duel.0001.desc.cone_of_flame.miss:0 "\n\n#medium La vouivre de feu lâche un rugissement guttural, sa poitrine pulsant de lueur de braise avant qu'elle crache un cône roulant de feu. L'enfer lèche vers le haut, chassant les ombres et transformant la terre brisée en dessous en une mer mouvante de flamme. Mais votre dragon est déjà en l'air, les ailes battant dur contre la chaleur montante. Vous grimpez plus haut dans le ciel chargé de cendres, sentant le roussi du courant ascendant mais point la morsure du brasier. En dessous, le feu se lave inoffensivement à travers la pierre noircie, et la vouivre de feu gronde, les mâchoires fumant de frustration.#!"
  
  lv_firewyrm_duel.0001.frenzied_lunge:0 "Elle bondit avec frénésie ! Ne la laissez point fermer la distance !"
  lv_firewyrm_duel.0001.tt.frenzied_lunge:0 "La vouivre de feu charge en avant dans un bond sauvage et incontrôlé, essayant de fermer la distance et porter un coup."
  lv_firewyrm_duel.0001.desc.frenzied_lunge:0 "\n\n#medium Sans avertissement, la vouivre bondit en avant dans une frénésie, traînant griffe et croc à travers l'air chargé de cendres. Elle s'abat sur votre dragon avec une fureur imprudente, déchirant l'écaille de l'os. Vous sentez le choc courir à travers la selle, à travers le tendon, dans vos propres os. Il n'y a plus d'esprit en elle - seulement la haine.#!"
  lv_firewyrm_duel.0001.desc.frenzied_lunge.miss:0 "\n\n#medium Avec un cri strident insensé, la vouivre de feu bondit, la gueule large et les griffes griffant l'air. Elle s'écrase en avant à travers la fumée et la ruine, mais votre dragon est déjà vers le ciel - les ailes battant contre la chaleur montante et les cendres. Le bond frappe rien que la poussière et la pierre brisée, et l'élan de la vouivre l'envoie dérapant à travers la terre fissurée. En dessous, elle se retord avec un sifflement, les yeux fondus vous traquant au-dessus, la rage mijotant plus chaud à chaque souffle.#!"

  lv_firewyrm_duel.0001.rockfall_roar:0 "Un rugissement qui fait tomber le ciel ! Préparez-vous !"
  lv_firewyrm_duel.0001.tt.rockfall_roar:0 "La vouivre de feu lâche un rugissement qui fait trembler la terre même, délogeant les roches et les débris."
  lv_firewyrm_duel.0001.desc.rockfall_roar:0 "\n\n#medium La vouivre lâche un rugissement guttural qui fait écho à travers les murs de caverne - ou les ruines, ou quel que soit le cimetière dans lequel vous combattez. Avec lui vient un tremblement. Les pierres se fissurent et les plafonds gémissent. Une section de la terre même cède, s'effondrant en poussière et gravats. Vous êtes forcé de fuir vers le haut ou d'être enterré.#!"

  lv_firewyrm_duel.0001.molten_slough:0 "Elle se débarrasse d'écailles fondues ! Attention à la chaleur !"
  lv_firewyrm_duel.0001.tt.molten_slough:0 "La vouivre de feu se défait d'écailles fondues, se couvrant d'une couche fraîche d'armure brûlante et cautérisant toutes les blessures qu'elle avait dans le processus."
  lv_firewyrm_duel.0001.desc.molten_slough:0 "\n\n#medium Avec un haut-le-cœur guttural, la vouivre de feu arque son dos - et se fend. La chair croûtée et l'écaille calcinée se déchirent libres, tombant au sol comme une armure fondue. Elle rugit, nouvellement luisante, à demi brûlée et plus redoutable qu'avant. Ses blessures se ferment en fumant, et le feu dans sa gorge brûle encore plus brillant.#!"

  lv_firewyrm_duel.0001.berserk_charge:0 "Elle charge avec une fureur berserk ! Ne la laissez point vous piétiner !"
  lv_firewyrm_duel.0001.tt.berserk_charge:0 "La vouivre de feu charge en avant dans une attaque aveugle et furieuse, essayant de piétiner votre dragon."
  lv_firewyrm_duel.0001.desc.berserk_charge:0 "\n\n#medium Ensanglantée, à demi folle et hurlante, la vouivre charge - rien de calculé, rien de sain. Ses yeux luisent comme des charbons fissurés ouverts. Elle lance tout son corps monstrueux dans le combat, haussant les épaules contre la flamme et la griffe. Vous voyez un coup venant que vous ne pouvez éviter. Le seul réconfort est ceci : elle peut se détruire essayant de vous détruire.#!"
  lv_firewyrm_duel.0001.desc.berserk_charge.miss:0 "\n\n#medium Avec un beuglement qui fend l'air épais de cendres, la vouivre de feu charge - aveugle de fureur, insouciante de la douleur. Elle fonce à travers la pierre brisée et la ruine fumante, les yeux fondus fixés où vous étiez moments auparavant. Mais vous êtes déjà en l'air, votre dragon tournoyant haut au-dessus. La bête s'écrase en avant sous vous, ses griffes déchirant des tranchées dans la terre tandis qu'elle rage au ciel. Il n'y a point de pensée en elle maintenant - seulement la ruine laissée derrière par une frappe qui n'atterrit jamais.#!"


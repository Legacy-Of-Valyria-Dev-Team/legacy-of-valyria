l_french:

 lv_colonisation_events.0001.t:0 "Voleurs dans le Fourré"
 lv_colonisation_events.0001.desc:0 "Alors que votre troupe s'enfonce plus profondément dans la nature sauvage, vous êtes soudain arrêtés. Un homme rude surgit des arbres — arc bandé, un sourire canaille aux lèvres. « On m'appelle Robin, dit-il, et cette terre me doit un péage. » À ses côtés se tient une brute silencieuse — son compagnon, John. La tension crépite comme un feu de camp par nuit d'orage."

 lv_colonisation_events.0001.a:0 "Déjouer Robin par un raisonnement habile."
 lv_colonisation_events.0001.b:0 "Négocier un passage sûr grâce à la logistique et aux provisions."
 lv_colonisation_events.0001.c:0 "Persuader John de vous rejoindre et d'abandonner Robin."
 lv_colonisation_events.0001.d:0 "Affronter Robin et le chasser par la force."
 lv_colonisation_events.0001.e:0 "Les intimider pour qu'ils reculent par la peur."
 lv_colonisation_events.0001.f:0 "Défier Robin en duel pour la suprématie."
 lv_colonisation_events.0001.z:0 "Offrir un pot-de-vin et espérer qu'ils l'acceptent..."

 lv_colonisation_events.0001.a.success:0 "Vous surpassez Robin en finesse, le laissant sans voix."
 lv_colonisation_events.0001.a.failure:0 "Votre logique échoue à convaincre le brigand."
 lv_colonisation_events.0001.b.success:0 "Votre offre de provisions les impressionne assez pour qu'ils reculent."
 lv_colonisation_events.0001.b.failure:0 "Robin rit de votre offre et se rapproche."
 lv_colonisation_events.0001.c.success:0 "John hoche lentement la tête — et passe à vos côtés."
 lv_colonisation_events.0001.c.failure:0 "John hésite, puis baisse les yeux. « Désolé. »"
 lv_colonisation_events.0001.d.success:0 "Votre prestance imposante met Robin en fuite."
 lv_colonisation_events.0001.d.failure:0 "Ils ne cèdent pas. Un combat semble inévitable."
 lv_colonisation_events.0001.e.success:0 "Vos menaces ébranlent leur assurance."
 lv_colonisation_events.0001.e.failure:0 "Ils appellent votre bluff. Cela pourrait mal tourner."
 lv_colonisation_events.0001.f.success:0 "Vous battez Robin en combat singulier — sa fierté brisée."
 lv_colonisation_events.0001.f.failure:0 "Robin vous domine. Vous restez meurtri et amer."
 lv_colonisation_events.0001.z.result:0 "Le pot-de-vin est accepté, mais à quel prix ?"
 lv_colonisation_events.0001.a.tip:0 "Tentez de déjouer Robin. La réussite octroie de l'[gold|E] et du [prestige|E], l'échec vous coûte stress et pièces."
 lv_colonisation_events.0001.b.tip:0 "Proposez une aide logistique. Le succès apporte des provisions, l'échec vide votre bourse."
 lv_colonisation_events.0001.c.tip:0 "Tentez de recruter John. Réussissez, et il rejoint votre cour. Échouez, et cela vous ronge l'esprit."
 lv_colonisation_events.0001.d.tip:0 "Forcez Robin à reculer. Une victoire rapporte du butin, une défaite laisse des bleus."
 lv_colonisation_events.0001.e.tip:0 "Semez la peur en eux. Ça marche ? Vous récoltez du butin. Ça échoue ? Vous en ressentez le poids."
 lv_colonisation_events.0001.f.tip:0 "Défiez Robin en duel comme un vrai caïd. Gagnez, et récoltez la gloire. Perdez, et goûtez au regret."
 lv_colonisation_events.0001.z.tip:0 "Soudoyez et priez. Le résultat ? Ce pourrait être une bénédiction... ou une malédiction."
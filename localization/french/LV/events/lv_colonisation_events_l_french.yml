l_french:

  lv_colonisation_events.0001.t:0 "Brigands dans les Fourrés"
  lv_colonisation_events.0001.desc:0 "Alors que votre groupe s'enfonce toujours plus profondément dans les terres sauvages, une silhouette surgit des taillis pour vous barrer la route. Un homme au visage buriné par les éléments émerge des arbres, arc bandé, sourire canaille aux lèvres. « On m'appelle Robin », lance-t-il d'une voix traînante, « et ces terres me doivent un tribut. » À ses côtés se tient une brute silencieuse au regard impénétrable : son compagnon, Jean. La tension qui s'installe crépite comme un feu de camp sous l'orage, lourde de menaces non formulées."
  
  lv_colonisation_events.0001.a:0 "Déjouer les plans de Robin par la ruse et l'éloquence."
  lv_colonisation_events.0001.b:0 "Négocier un passage sûr en offrant vivres et provisions."
  lv_colonisation_events.0001.c:0 "Convaincre Jean de rejoindre votre cause et d'abandonner Robin."
  lv_colonisation_events.0001.d:0 "Affronter Robin et le chasser par la force des armes."
  lv_colonisation_events.0001.e:0 "Les intimider jusqu'à ce qu'ils battent en retraite."
  lv_colonisation_events.0001.f:0 "Défier Robin en duel pour établir votre suprématie."
  lv_colonisation_events.0001.z:0 "Proposer un pot-de-vin et prier les dieux qu'ils l'acceptent..."

  lv_colonisation_events.0001.a.success:0 "Votre esprit vif laisse Robin bouche bée, sans voix ni réplique."
  lv_colonisation_events.0001.a.failure:0 "Votre logique se brise contre l'entêtement du brigand."
  lv_colonisation_events.0001.b.success:0 "Votre offre de ravitaillement les convainc de s'écarter du chemin."
  lv_colonisation_events.0001.b.failure:0 "Robin éclate d'un rire moqueur et s'avance d'un pas menaçant."
  lv_colonisation_events.0001.c.success:0 "Jean hoche lentement la tête, puis vient se ranger à vos côtés."
  lv_colonisation_events.0001.c.failure:0 "Jean hésite longuement, puis baisse les yeux. « Désolé. »"
  lv_colonisation_events.0001.d.success:0 "Votre prestance martiale fait décamper Robin sans demander son reste."
  lv_colonisation_events.0001.d.failure:0 "Ils ne reculent pas d'un pouce. L'affrontement semble inévitable."
  lv_colonisation_events.0001.e.success:0 "Vos menaces ébranlent leur assurance jusqu'aux os."
  lv_colonisation_events.0001.e.failure:0 "Ils percent votre bluff à jour. La situation pourrait mal tourner."
  lv_colonisation_events.0001.f.success:0 "Vous terrassez Robin en combat singulier ; son orgueil gît en miettes."
  lv_colonisation_events.0001.f.failure:0 "Robin prend le dessus. Vous restez meurtri dans votre chair et votre fierté."
  lv_colonisation_events.0001.z.result:0 "Le pot-de-vin est accepté, mais à quel prix pour votre honneur ?"
  lv_colonisation_events.0001.a.tip:0 "Tentez de surpasser Robin en ruse. Succès : [gold|E] et [prestige|E]. Échec : stress et perte de deniers."
  lv_colonisation_events.0001.b.tip:0 "Proposez une aide logistique. Succès : provisions gagnées. Échec : bourse allégée."
  lv_colonisation_events.0001.c.tip:0 "Essayez de recruter Jean. Succès : il rejoint votre cour. Échec : remords persistants."
  lv_colonisation_events.0001.d.tip:0 "Forcez Robin à reculer. Victoire : butin conquis. Défaite : contusions garanties."
  lv_colonisation_events.0001.e.tip:0 "Inspirez-leur la terreur. Réussite : dépouilles obtenues. Échec : tension accrue."
  lv_colonisation_events.0001.f.tip:0 "Défiez Robin comme un vrai guerrier. Victoire : gloire acquise. Défaite : amertume cuisante."
  lv_colonisation_events.0001.z.tip:0 "Corrompez et espérez. Le résultat ? Bénédiction... ou malédiction."
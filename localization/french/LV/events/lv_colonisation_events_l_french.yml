l_french:

  lv_colonisation_events.0001.t:0 "Larrons dans les Fourrés"
  lv_colonisation_events.0001.desc:0 "Alors que votre groupe s'enfonce plus profond dans les terres sauvages, vous êtes soudain contraints de faire halte. Un homme robuste et mal rasé sort des arbres, arc bandé, un sourire narquois aux lèvres. « Le nom, c'est Robin », déclare-t-il d'une voix rauque, « et ces terres me doivent un péage. » À ses côtés se dresse une brute silencieuse, son compagnon John, dont les muscles saillent sous sa tunique rapiécée. La tension crépite dans l'air comme un feu de camp par nuit d'orage, chacun jaugeant l'autre en silence."
  
  lv_colonisation_events.0001.a:0 "Surpasser Robin par la ruse et l'argumentation."
  lv_colonisation_events.0001.b:0 "Négocier un passage sûr avec des vivres et des fournitures."
  lv_colonisation_events.0001.c:0 "Persuader John de vous rejoindre et d'abandonner Robin."
  lv_colonisation_events.0001.d:0 "Affronter Robin et le chasser par la force."
  lv_colonisation_events.0001.e:0 "Les intimider pour qu'ils reculent par la peur."
  lv_colonisation_events.0001.f:0 "Défier Robin en duel pour établir votre domination."
  lv_colonisation_events.0001.z:0 "Offrir un pot-de-vin et espérer qu'ils l'acceptent..."

  lv_colonisation_events.0001.a.success:0 "Vous dupez Robin par votre esprit, le laissant sans voix."
  lv_colonisation_events.0001.a.failure:0 "Votre logique échoue à convaincre le brigand."
  lv_colonisation_events.0001.b.success:0 "Votre offre de provisions les impressionne assez pour qu'ils s'écartent."
  lv_colonisation_events.0001.b.failure:0 "Robin éclate de rire à votre proposition et s'avance plus près."
  lv_colonisation_events.0001.c.success:0 "John hoche lentement la tête et passe de votre côté."
  lv_colonisation_events.0001.c.failure:0 "John hésite, puis baisse les yeux. « Désolé. »"
  lv_colonisation_events.0001.d.success:0 "Votre présence autoritaire fait fuir Robin à toutes jambes."
  lv_colonisation_events.0001.d.failure:0 "Ils ne reculent point. Un combat semble inévitable."
  lv_colonisation_events.0001.e.success:0 "Vos menaces ébranlent leur assurance."
  lv_colonisation_events.0001.e.failure:0 "Ils déjouent votre bluff. Cela pourrait mal tourner."
  lv_colonisation_events.0001.f.success:0 "Vous battez Robin en combat singulier, brisant son orgueil."
  lv_colonisation_events.0001.f.failure:0 "Robin prend le dessus sur vous. Vous demeurez meurtri et amer."
  lv_colonisation_events.0001.z.result:0 "Le pot-de-vin est accepté, mais à quel prix ?"
  lv_colonisation_events.0001.a.tip:0 "Tentez de surpasser Robin en finesse. Le succès rapporte de l'[gold|E] et du [prestige|E], l'échec vous coûte stress et monnaie."
  lv_colonisation_events.0001.b.tip:0 "Offrez une aide logistique. Le succès apporte des provisions, l'échec vide votre bourse."
  lv_colonisation_events.0001.c.tip:0 "Essayez de recruter John. En cas de succès, il rejoint votre cour. En cas d'échec, cela vous ronge l'esprit."
  lv_colonisation_events.0001.d.tip:0 "Forcez Robin à reculer. Une victoire rapporte du butin, une défaite laisse des bleus."
  lv_colonisation_events.0001.e.tip:0 "Semez la peur en eux. Si cela fonctionne, vous obtenez des dépouilles. Si cela échoue, vous ressentez la tension."
  lv_colonisation_events.0001.f.tip:0 "Défiez Robin comme un vrai champion. Gagnez et obtenez la gloire. Perdez et goûtez au regret."
  lv_colonisation_events.0001.z.tip:0 "Corrompez et priez. Le résultat ? Cela pourrait être une bénédiction... ou une malédiction."
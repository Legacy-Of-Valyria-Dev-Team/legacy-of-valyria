l_french:
  agot_EE_reestablish_ghiscar_decision:0 "Restaurer L'Empire Ghiscari"
  agot_EE_reestablish_ghiscar_decision_desc:0 "Nous sommes sur le point de hisser l'étendard de la harpie et de rendre à l'Empire Ghiscari sa gloire d'antan. Des rivages de la Baie des Esclaves jusqu'au cœur de Ghis, notre ancien symbole flottera à nouveau.\nNos ancêtres gouvernaient avec force et sagesse jusqu'à ce que le feu draconique et l'acier valyrien mettent l'empire à genoux. Bien que l'Ancienne Ghis soit tombée, l'esprit ghiscari n'a jamais faibli, attendant patiemment que le prochain chef forge le peuple ghiscari dans un dessein unique. Nous sommes prêts à éveiller la harpie et à la laisser étendre son ombre sur les terres pour mille années encore."
  agot_EE_reestablish_ghiscar_decision_confirm:0 "La harpie s'envole à nouveau"
  agot_EE_reestablish_ghiscar_decision_tooltip:0 "Restaurez l'Empire Ghiscari, réclamant ses terres et la puissance de l'antique harpie"

  agot_EE_ghiscari_restoration.1.t:0 "La Harpie S'Envole À Nouveau"
  agot_EE_ghiscari_restoration.1.desc:0 "La harpie s'envole à nouveau ! Dans chaque cité et forteresse, des rivages de la Baie des Esclaves jusqu'au cœur de l'empire, l'antique étendard de Ghis se déploie. Jadis, nos ancêtres gouvernaient ces terres avec force et sagesse, avant que le feu draconique et l'acier valyrien ne mettent notre empire à genoux. Bien que les murailles de l'ancienne Ghis se soient réduites en cendres, l'esprit ghiscari n'est jamais mort.\n\nMaintenant, nous nous relevons, déterminés à reprendre notre place parmi les grands empires du monde. Notre harpie étend son ombre sur les terres, rappel que les Ghiscaris n'ont jamais été conquis, seulement retardés.\n\nL'Empire vit à nouveau, inflexible et inébranlable..."
  agot_EE_ghiscari_restoration.1.a:0 "Pour la nouvelle Ghis!"
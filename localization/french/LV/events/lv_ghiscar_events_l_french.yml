l_french:
  agot_EE_reestablish_ghiscar_decision:0 "Faire Renaître l'Empire Ghiscari"
  agot_EE_reestablish_ghiscar_decision_desc:0 "Nous sommes à l'aube de hisser à nouveau la bannière de la harpie et de restaurer l'Empire Ghiscari dans sa gloire d'antan. Des rivages de la Baie des Serfs jusqu'au cœur même de Ghis, notre symbole ancestral flottera une fois de plus dans les cieux, proclamant notre retour au monde.\n\nNos ancêtres régnèrent avec force et sagesse jusqu'à ce que le feu de dragon et l'acier valyrien mettent l'empire à genoux dans la cendre et le sang. Bien que l'Ancienne Ghis soit tombée sous les flammes, l'esprit ghiscari ne faiblit jamais, attendant patiemment le prochain dirigeant qui unirait le peuple ghiscari en un dessein unique et implacable. Nous sommes prêts à réveiller la harpie endormie et à laisser son ombre s'étendre sur ces terres pour mille années encore."
  agot_EE_reestablish_ghiscar_decision_confirm:0 "La harpie s'élève à nouveau vers les cieux"
  agot_EE_reestablish_ghiscar_decision_tooltip:0 "Faire renaître l'Empire Ghiscari, reconquérant ses terres ancestrales et la puissance de l'antique harpie"

  agot_EE_ghiscari_restoration.1.t:0 "La Harpie S'Élève à Nouveau"
  agot_EE_ghiscari_restoration.1.desc:0 "La harpie s'élève à nouveau dans toute sa majesté ! En chaque cité et forteresse, des rivages de la Baie des Serfs jusqu'au cœur battant de l'empire, l'antique bannière de Ghis se déploie avec fierté dans le vent. Jadis, nos ancêtres régnaient sur ces terres avec force et sagesse inébranlables, avant que le feu de dragon et l'acier valyrien ne mettent notre empire à genoux dans la poussière et les cendres. Bien que les murailles de l'ancienne Ghis se soient écroulées en ruines fumantes, l'esprit ghiscari ne mourut jamais dans le cœur de notre peuple.\n\nÀ présent, nous nous levons, déterminés à reconquérir notre place légitime parmi les grands empires de ce monde décadent. Notre harpie étend son ombre protectrice sur ces terres reconquises, rappel éternel que les Ghiscaris ne furent jamais véritablement conquis, seulement contraints d'attendre leur heure de gloire.\n\nL'Empire renaît dans le sang et la fureur, insoumis et inébranlable..."
  agot_EE_ghiscari_restoration.1.a:0 "Pour la Nouvelle Ghis et sa gloire éternelle !"
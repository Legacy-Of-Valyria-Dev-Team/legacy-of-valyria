l_french:
 agot_EE_reestablish_ghiscar_decision:0 "Faire Revivre l'Empire Ghiscari"
 agot_EE_reestablish_ghiscar_decision_desc:0 "Nous sommes au seuil de lever la bannière de la harpie et de restaurer l'Empire Ghiscari dans son ancienne gloire. Des rivages de la Baie des Serfs jusqu'au cœur de Ghis, notre symbole ancestral flottera de nouveau.\nNos ancêtres régnèrent avec force et sagesse jusqu'à ce que le feu de dragon et l'acier valyrien mettent l'empire à genoux. Bien que le Vieux Ghis soit tombé, l'esprit ghiscari n'a jamais vacillé, attendant patiemment le prochain chef capable de forger le peuple ghiscari vers un seul et même dessein. Nous sommes prêts à réveiller la harpie et à laisser son ombre s'étendre sur ces terres pour mille ans encore."
 agot_EE_reestablish_ghiscar_decision_confirm:0 "La harpie vole de nouveau"
 agot_EE_reestablish_ghiscar_decision_tooltip:0 "Faire revivre l'Empire Ghiscari, reconquérant ses terres et la puissance de l'antique harpie"

 agot_EE_ghiscari_restoration.1.t:0 "La Harpie Vole de Nouveau"
 agot_EE_ghiscari_restoration.1.desc:0 "La harpie vole de nouveau ! Dans chaque cité et chaque forteresse, des rivages de la Baie des Serfs jusqu'au cœur de l'empire, l'antique bannière de Ghis se déploie. Jadis, nos ancêtres régnèrent sur ces terres avec force et sagesse, avant que le feu de dragon et l'acier valyrien ne mettent notre empire à genoux. Bien que les murs du Vieux Ghis se soient effondrés en cendres, l'esprit ghiscari n'est jamais mort.\n\nÀ présent, nous nous relevons, déterminés à reconquérir notre place parmi les grands empires du monde. Notre harpie étend son ombre sur ces terres, rappelant que les Ghiscaris n'ont jamais été conquis, seulement retardés.\n\nL'Empire revit, indompté et inébranlable..."
 agot_EE_ghiscari_restoration.1.a:0 "Pour le nouveau Ghis !"
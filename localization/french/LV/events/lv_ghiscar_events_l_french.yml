l_french:
  agot_EE_reestablish_ghiscar_decision:0 "Ressusciter l'Empire Ghiscari"
  agot_EE_reestablish_ghiscar_decision_desc:0 "Nous sommes à l'aube d'un renouveau sans précédent : la bannière de la harpie s'apprête à s'élever de nouveau, restaurant l'Empire Ghiscari dans toute sa splendeur d'antan. Des rivages de la Baie des Serfs jusqu'au cœur même de Ghis, notre antique symbole flottera une fois encore sur les terres qui nous reviennent de droit.\nNos ancêtres régnèrent jadis avec force et sagesse, jusqu'à ce que le feu des dragons et l'acier valyrien mettent l'empire à genoux. Bien que l'Ancienne Ghis soit tombée, l'esprit ghiscari ne vacilla jamais, attendant patiemment dans l'ombre qu'un nouveau chef forge le peuple ghiscari en une volonté unique et inébranlable. L'heure est venue d'éveiller la harpie et de laisser son ombre s'étendre sur ces terres pour mille années encore."
  agot_EE_reestablish_ghiscar_decision_confirm:0 "La harpie prend son envol"
  agot_EE_reestablish_ghiscar_decision_tooltip:0 "Ressusciter l'Empire Ghiscari, reconquérir ses terres ancestrales et restaurer la puissance de l'antique harpie"

  agot_EE_ghiscari_restoration.1.t:0 "La Harpie Reprend Son Envol"
  agot_EE_ghiscari_restoration.1.desc:0 "La harpie s'envole de nouveau ! Dans chaque cité et chaque forteresse, des rivages de la Baie des Serfs jusqu'au cœur battant de l'empire, l'antique bannière de Ghis se déploie fièrement. Jadis, nos ancêtres régnaient sur ces terres avec force et sagesse, avant que le feu des dragons et l'acier valyrien ne mettent notre empire à genoux. Bien que les murailles de l'Ancienne Ghis se soient effondrées en cendres, l'esprit ghiscari ne périt jamais.\n\nAujourd'hui, nous nous relevons, déterminés à reconquérir notre place parmi les grands empires du monde connu. Notre harpie étend son ombre sur ces terres, rappel implacable que les Ghiscaris ne furent jamais conquis, seulement retardés dans leur destinée.\n\nL'Empire renaît de ses cendres, insoumis et invaincu..."
  agot_EE_ghiscari_restoration.1.a:0 "Pour la nouvelle Ghis !"
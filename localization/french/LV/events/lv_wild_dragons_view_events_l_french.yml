 lv_wild_dragons_view.0001.t:0 "Les Bêtes de [province.GetName]"
 lv_wild_dragons_view.0001.desc:0 "Des rapports nous sont parvenus concernant les divers dragons et autres bêtes draconiques errant dans les étendues sauvages de [province.GetName]. Ces créatures, indomptées et souvent dangereuses, représentent une menace considérable pour toute colonie ou tout voyageur dans la région. Il est impératif que nous comprenions la nature et l'étendue de ces bêtes afin d'assurer la sécurité de notre peuple et de nos terres.\n\nQuoi que vous fassiez, soyez prudents. Ces créatures ne sont pas à prendre à la légère."
 lv_wild_dragons_view.0001.a:0 "Ce sera tout."

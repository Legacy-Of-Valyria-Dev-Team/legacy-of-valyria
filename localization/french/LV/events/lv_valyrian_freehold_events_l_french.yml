 lv_valyrian_freehold.0001.t:0 "Le Dragon S'Éveille : les Possessions Renaissent"
 lv_valyrian_freehold.0001.desc:0 "Le cauchemar du Fléau est brisé. Valyria — berceau de la magie, siège des dragons, cœur du monde — est de nouveau entière.\n\nAujourd'hui, la terre fracturée de Valyria se dresse comme une seule entité, et les grandes cités, violemment réduites au silence par les Quatorze Flammes, résonnent de nouveau du rugissement de la vie. Les feux qui détruisirent cet empire ont été apaisés, et la véritable et brillante lumière des Possessions Valyriennes brille de nouveau à travers la Mer Fumante.\n\nVous vous tenez au nexus de l'histoire. Le peuple vous considère à présent comme l'architecte de l'impossible : celui qui a défié le Fléau et l'a vaincu. Chaque recoin des Possessions renaissantes palpite d'une vigueur renouvelée qu'aucun autre royaume ne saurait espérer égaler.\n\nQue les autres puissances du monde tremblent. L'ombre du Fléau est levée, et à sa place le feu de Valyria brûle plus vif qu'il ne l'a jamais fait. La puissance de l'Ancienne Valyria est vôtre à commander. L'Âge des Possessions commence maintenant."
 lv_valyrian_freehold.0001.a:0 "[Glossary( 'Valar dohaeris!', 'VALAR_DOHAERIS_GLOSS' )]"

 lv_valyrian_freehold.0001.tooltip.styling:0 "Vous serez titré #high [SelectLocalization( restorer.IsFemale, 'hegemon_valyria_female_imperial', 'hegemon_valyria_male_imperial' )]#!"

 lv_valyrian_freehold.0002.t:0 "Le Dragon S'Éveille : les Possessions Renaissent"
 lv_valyrian_freehold.0002.desc:0 "Une proclamation s'est élevée depuis le siège jadis cendreux de [restorer.GetCapitalLocation.GetBaronyNameExplicitly], signée dans le feu et le sang par [restorer.GetName]. L'impossible s'est accompli : le Fléau a été défié, et les Possessions Valyriennes ont été déclarées restaurées.\n\nLe silence qui tenait la péninsule captive depuis le Fléau est brisé. Là où il n'y avait autrefois que mort et ruine, se dresse à présent un pouvoir unifié, lié non seulement par la loi, mais par la volonté ardente du [restorer.GetTitleTierName]. Les Quatorze Flammes brûlent de nouveau pour un maître vivant.\n\nUne ombre colossale s'étend à présent sur le monde connu. Des Royaumes du Couchant jusqu'au Doré Empire d'Yi Ti, rois et empereurs lèvent les yeux vers le ciel avec une crainte nouvelle. Le monde des hommes est sur le point d'être mis à l'épreuve comme jamais auparavant, car l'Âge des Possessions est revenu.""
 lv_valyrian_freehold.0002.a:0 "Par [ROOT.Char.GetFaith.HighGodName]..."

 lv_valyrian_freehold.0002.tooltip:0 "[GetTitleByKey('h_valyrian_freehold').GetName] a été restauré"

 lv_valyrian_freehold.0100.t:0 "[county.GetNameNoTierNoTooltip] Reconquis"
 lv_valyrian_freehold.0100.t.newly_conquered:0 "[county.GetNameNoTierNoTooltip] Conquis"
 lv_valyrian_freehold.0100.desc.intro:0 "Les bannières des Possessions flottent de nouveau sur des terres qui se croyaient libres. Là où nos ancêtres régnaient jadis par droit du sang et du feu, nous revenons à présent réclamer notre héritage. Le long silence est achevé, et la gloire de cette reconquête m'appartient seul.\n\n"
 lv_valyrian_freehold.0100.desc.elyria:0 "[county.GetNameNoTier] se tenait au bord de l'apocalypse et y survécut, pour oublier ses maîtres dans la confusion qui suivit.\n\nJadis, cette île prospère ne connaissait nulle autonomie, gouvernée seulement par des hommes et des femmes envoyés depuis le cœur du royaume pour faire respecter notre volonté. En notre absence, ils tournèrent leur regard vers l'est, vers la Harpie et les Ghiscaris, préférant l'or à la loyauté. Cette ère d'indépendance est terminée. Les liens avec la Baie des Serfs sont tranchés, et [county.GetNameNoTier] servira de nouveau de porte d'entrée vers les Terres du Long Été, gouvernée comme elle fut toujours destinée à l'être : par Valyria."
 lv_valyrian_freehold.0100.desc.mantarys:0 "[county.GetNameNoTier], la prétendue cité des monstres, s'incline à présent devant les véritables maîtres de la Route des Démons.\n\nTandis que le Fléau engloutissait la péninsule, ses retombées ne firent que déformer cette cité, laissant ses habitants difformes et mal formés — une moquerie vivante de la beauté valyrienne. Durant des siècles, ils ont effrayé les voyageurs et gardé l'approche septentrionale d'une réputation sinistre.\n\nMais la peur n'a nulle emprise sur ceux qui ont vaincu le Fléau lui-même. Les seigneurs tordus de [county.GetNameNoTier] se sont rendus. Leur force monstrueuse ne servira plus leurs seuls desseins ; elle sera exploitée, comme aux jours anciens, pour servir la volonté des Possessions."
 lv_valyrian_freehold.0100.desc.tolos:0 "Les Falaises Noires de [county.GetNameNoTier] surplombent depuis longtemps la Baie des Serfs, détournant leur regard de l'ouest. Comme ses voisines, [county.GetNameNoTier] oublia ses origines dans les suites du Fléau, courtisant les faveurs des Ghiscaris et de la Harpie.\n\nMais le Dragon n'oublie pas ce qui lui appartient. Nous ne sommes pas venus pour leur commerce, mais pour leur adresse. Les célèbres frondeurs de [county.GetNameNoTier], dont les projectiles de plomb tendre peuvent briser les os à travers les mailles, sont une arme forgée sous notre ombre depuis longtemps. Ils ne serviront plus comme mercenaires au plus offrant de la Baie ; ils sont rendus à l'arsenal impérial, prêts à faire pleuvoir la mort sur les ennemis des Possessions."
 lv_valyrian_freehold.0100.desc.volantis:0 "[county.GetNameNoTier], la Première Fille, a enfin été soumise.\n\nDurant des siècles, le Vieux Sang habitant derrière les Murs Noirs s'est engraissé d'arrogance, se drapant du titre de successeur de notre gloire. Ils ont grandement contribué au chaos du Siècle de Sang, tentant de revêtir un manteau trop lourd pour eux, avant de se retirer dans la stagnation de leurs Éléphants.\n\nIls ont oublié qu'ils furent fondés non comme un empire, mais comme une garnison. Les Murs Noirs furent élevés pour protéger les frontières des Possessions, non pour dissimuler des prétendants. Aujourd'hui, l'ordre naturel est restauré. Les Tigres sont édentés, les Éléphants ont cédé, et le Dragon est revenu rappeler à la Première Fille que son seul véritable devoir est d'obéir."
 lv_valyrian_freehold.0100.desc.tyrosh:0 "[county.GetNameNoTier] est une cité de couleurs criardes, mais sous la teinture se cache une histoire de la plus noire des trahisons.\n\nElle commença comme un avant-poste austère pour tenir les Degrés de Pierre, s'élevant vers la richesse uniquement parce que nos ancêtres favorisaient leurs pigments singuliers. Pourtant, lorsque le Fléau s'abattit, les Tyroshis récompensèrent notre patronage par le meurtre. Ils massacrèrent les lords dragons survivants et leurs montures dans un accès de panique et de cupidité, espérant effacer leur servitude.\n\nNous n'avons pas oublié. La cité est reconquise, et la dette est réclamée. Les Degrés de Pierre sont de nouveau sous notre garde, et les teinturiers de [county.GetNameNoTier] ont appris que si la peinture peut recouvrir un mur, elle ne saurait les dissimuler de la justice du Dragon."
 lv_valyrian_freehold.0100.desc.lys:0 "[county.GetNameNoTier] est connue comme la Belle, et à juste titre. Ici, plus qu'ailleurs dans le monde, le sang des Possessions coule fort. Même les mendiants dans les rues portent les cheveux argentés et les yeux violets des lords dragons, spectres vivants de la gloire que nous avons perdue.\n\nMais un visage valyrien ne cache pas un cœur de traître. Lorsque le Fléau frappa, les Lysiens se retournèrent contre les dragons et leurs cavaliers venus chercher refuge dans leurs jardins ombragés de palmiers, les massacrant de panique pour assurer leur propre survie.\n\nNous sommes revenus corriger cette erreur. Les jardins de plaisir de l'empire sont de nouveau nôtres, et les Lysiens — beaux, traîtres et fiers — se sont vus rappeler que s'ils partagent notre sang, ils ne partagent point notre pouvoir."
 lv_valyrian_freehold.0100.desc.myr:0 "[county.GetNameNoTier], la cité fortifiée, se dresse là où les antiques routes-dragons rencontrent la mer, une cité bâtie par des aventuriers valyriens sur les pierres brisées des Andals.\n\nDurant des années, cette cité s'est définie par l'or et l'artisanat, se saignant à blanc dans les guerres interminables et mesquines pour les Terres Disputées. Ils croyaient que leurs murs, leur richesse, et leur Dieu Rouge pourraient les protéger du tournant de la roue. Ils avaient tort.\n\nLa dispute est achevée. Les artisans de [county.GetNameNoTier] — maîtres du verre limpide, de la dentelle complexe, et des mécanismes élaborés — sont les meilleurs du monde. Leurs talents sont trop précieux pour être gaspillés dans des querelles marchandes. Les ateliers de [county.GetNameNoTier] appartiennent désormais aux Possessions, et leurs feux brûlent pour nous."
 lv_valyrian_freehold.0100.desc.pentos:0 "[county.GetNameNoTier] a toujours été une cité de compromis, où le sang du Dragon fut autorisé à se diluer et à se mêler à celui des Andals. Trop longtemps, les Magisters ont régné depuis les ombres, se dissimulant derrière la cage dorée de leur Prince cérémoniel.\n\nSelon leurs propres lois, la gorge du Prince doit être tranchée lorsqu'une guerre est perdue pour apaiser les dieux. Mais les dieux de [county.GetNameNoTier] restent silencieux devant nous. Nous n'avons nul besoin du sang d'une marionnette. Ce sont les Magisters — ces marchands de fromage et négociants d'épices qui croyaient pouvoir acheter le monde — qui apprendront désormais le véritable prix du pouvoir. La mascarade du Prince est achevée, et la réalité du Dragon a commencé."
 lv_valyrian_freehold.0100.desc.chroyane:0 "[county.GetNameNoTier] repose enveloppée dans les brumes des Affres, monument à la dernière fois qu'une puissance osa véritablement défier les Possessions.\n\nC'est ici que le Prince Garin fut suspendu dans une cage dorée pour regarder brûler sa Cité des Festivals, et ici qu'il invoqua la Mère des Fleuves pour noyer nos ancêtres sous une malédiction de brume et de grisécaille. Durant mille ans, les Hommes de Pierre et leur Seigneur Enveloppé ont régné sur ces ruines, protégés par le souffle des morts.\n\nMais le Dragon ne craint pas l'humidité. Nous sommes revenus achever la guerre. La Grisécaille sera purgée par le feu de dragon, les brumes brûlées par la chaleur de notre retour. La Rhoyne nous appartient à présent, et [county.GetNameNoTier] sert de sinistre avertissement : l'eau peut noyer un homme, mais le feu consume une civilisation."
 lv_valyrian_freehold.0100.desc.ny_sar:0 "[county.GetNameNoTier] fut jadis une cité de fontaines et de chants, siège de la Princesse Guerrière Nymeria. Mais les chants meurent vite lorsque le ciel s'emplit de cendre.\n\nÀ la différence de l'insensé Garin, Nymeria savait mieux que d'affronter les Lords dragons à découvert. Elle dépouilla cette cité et s'enfuit avec ses Dix Mille Navires, refusant à nos ancêtres les esclaves qui leur étaient dus. Elle ne laissa derrière elle qu'une coquille — un palais colossal de marbre rose et vert, désormais brisé et silencieux.\n\nNous sommes revenus réclamer les ruines qu'elle abandonna. Les fontaines sont taries, les chanteurs disparus, et la Rhoyne s'écoule tranquillement devant l'épave. Que cette cité brisée serve de preuve : on peut fuir jusqu'aux confins du monde, mais on ne saurait jamais véritablement échapper au Dragon."
 lv_valyrian_freehold.0100.desc.meereen:0 "[county.GetNameNoTier], la plus grande des Cités des Serfs, s'est longtemps engraissée sur la présomption que le Vieil Empire de Ghis pourrait renaître. Les Grands Maîtres siègent au sommet de leurs pyramides, parlant un dialecte bâtard de notre propre langue, se croyant les seigneurs du monde.\n\nIls oublient leur histoire. Cinq fois la Harpie vola contre le Dragon, et cinq fois elle fut abattue. Nous avons appris l'art de la chaîne de leurs ancêtres, seulement pour les en enchaîner à notre tour.\n\nAujourd'hui, la Grande Pyramide est purifiée. La Harpie est renversée, ses ailes bronzées brisées sur les pierres. Les Maîtres ont appris la dernière leçon de leur commerce : il y a ceux qui tiennent le fouet, et ceux qui le ressentent. [county.GetNameNoTier] est de nouveau une colonie."
 lv_valyrian_freehold.0100.desc.yunkai:0 "[county.GetNameNoTier], la Cité Jaune, pue le parfum et la décadence. Les soi-disant « Sages Maîtres » se sont longtemps enrichis en formant des esclaves pour la chambre à coucher, se dissimulant derrière de hauts murs et parant leur foyer du titre de « Reine des Cités ».\n\nMais une reine s'incline devant un Dragon. La Harpie Ghiscarie de [county.GetNameNoTier] — avec sa queue de scorpion et son collier de fer — a été désarmée.\n\nLes Sages Maîtres ont enfin appris les limites de leur sagesse. Leurs fosses d'entraînement, leurs maisons de plaisir, et leur peuple ne leur appartiennent plus. Nous avons appris le commerce de la servitude humaine de leurs ancêtres, et nous revenons à présent leur rappeler que s'ils commercent en chair, nous commerçons en feu."
 lv_valyrian_freehold.0100.desc.astapor:0 "[county.GetNameNoTier], la Cité Rouge, est bâtie sur une vérité ancienne et sinistre : briques et sang. Durant de nombreuses années, les Bons Maîtres se sont enrichis en brisant des hommes pour en faire l'arme parfaite — les Immaculés.\n\nIls se vantent de la discipline absolue de leurs Immaculés, se prétendant les plus grands marchands d'esclaves du monde. Mais ils ne sont que les vestiges du Vieux Ghis, une civilisation que nous avons écrasée cinq fois.\n\nLes places d'entraînement sont silencieuses désormais, attendant de nouveaux ordres. La chaîne de la Harpie a été saisie. Les Immaculés ne seront plus vendus comme mercenaires au plus offrant ; la plus grande infanterie du monde a été réclamée pour l'armée impériale. Les Bons Maîtres se sont vus rappeler que s'ils brisent des hommes, seul le Dragon brise des empires."
 lv_valyrian_freehold.0100.desc.new_ghis:0 "[county.GetNameNoTier] s'élève depuis le Golfe du Chagrin, une tentative éhontée de ressusciter un cadavre que nous avons enterré il y a cinq mille ans.\n\nTandis que les autres Cités des Serfs pourrissaient dans la stagnation, [county.GetNameNoTier] chercha à recréer la puissance militaire du Vieil Empire. Ils entraînaient leurs Légions de Fer au pas cadencé du passé — des hommes libres, non des esclaves, combattant avec la discipline des anciens.\n\nMais si le véritable Vieil Empire ne put résister au Dragon à l'apogée de sa puissance, quel espoir cette pâle imitation pouvait-elle nourrir ? Leurs légions se sont brisées contre nos lignes. Nous avons éteint cette étincelle de renouveau ghiscari avant qu'elle ne devienne flamme. Il n'y aura nulle Sixième Guerre Ghiscarie ; [county.GetNameNoTier] est nôtre."
 lv_valyrian_freehold.0100.desc.old_ghis:0 "Le vent sur [county.GetNameNoTier] a le goût du sel, du soufre, et de la poussière ancienne. Ici gît le cadavre du Vieil Empire, la seule puissance ayant jamais véritablement défié le Dragon montant.\n\nCinq fois la Harpie vola contre nous, et cinq fois elle tomba. Il y a cinq mille ans, nos ancêtres brisèrent leurs légions au pas cadencé, abattirent leurs murs de brique, et semèrent leurs champs de crânes afin que rien n'y pousse plus jamais.\n\nIls réussirent. À la différence de Valyria, qui s'est relevée des cendres du Fléau, [county.GetNameNoTier] demeure en sa tombe. Nous élevons nos bannières sur ces ruines non pour honorer leur héritage, mais pour nous dresser sur le tombeau du Vieil Empire de Ghis et rappeler au monde : le Dragon vainc la mort ; la Harpie ne fait que s'en nourrir."
 lv_valyrian_freehold.0100.desc.gogossos:0 "[county.GetNameNoTier] se dresse sur l'Île des Larmes comme un monument aux plus sombres pulsions de nos ancêtres. Jadis avant-poste ghiscari, nous l'avons transformée en oubliette des Possessions — une fosse où étaient envoyés les pires criminels et les plus sombres sorciers pour y être oubliés.\n\nDans le silence qui suivit le Fléau, les prisonniers prirent le contrôle de l'asile. Ils pratiquèrent une magie du sang et un façonnage de chair qui défiaient la nature, croisant des bêtes avec des hommes et osant parer leur abomination du titre de « Dixième Cité Libre ».\n\nCette illusion est achevée. Une prison n'est pas une cité. Nous sommes revenus reprendre les clés. Les fosses de chair et les voûtes ensorcelées répondent désormais de nous, et les horreurs tordues de [county.GetNameNoTier] ne courront plus librement ; elles sont une sombre ressource, rendue à la serrure et à la clé du Dragon."
 lv_valyrian_freehold.0100.desc.braavos:0 "[county.GetNameNoTier], la Fille Bâtarde, la Cité Secrète. Durant des siècles, ils se sont terrés dans ce lagon, une civilisation bâtie par des biens volés sur un fondement de brume et de peur.\n\nLes Chantelunes leur promirent un sanctuaire où le Dragon ne pourrait les trouver. Ils mentirent. Le Titan de Braavos a beau se dresser fièrement, il est fait de pierre et de bronze ; il ne saurait résister à la chair et au feu.\n\nAujourd'hui, la Première Loi est abrogée. La Banque de Fer a été saisie, ses coffres forcés pour rembourser la dette des navires volés à nos ancêtres il y a mille ans. Les fuyards ont été retrouvés, la mascarade est terminée, et la Fille Bâtarde a été traînée hors de l'ombre pour s'agenouiller devant ses maîtres légitimes."

 lv_valyrian_freehold.0100.a:0 "Pour la Gloire de Valyria !"
l_french:
  lv_valyrian_freehold.0001.t:0 "Le Dragon S'Éveille : Les Possessions Renaissent de Leurs Cendres"
  lv_valyrian_freehold.0001.desc:0 "Le cauchemar millénaire du Fléau est enfin brisé. Valyria—berceau ancestral de toute magie, trône suprême des dragons, cœur battant du monde connu—est à nouveau entière et glorieuse.\n\nEn ce jour béni par le destin, les terres fracturées et maudites de Valyria se dressent unies, et les grandes cités, violemment réduites au silence par les Quatorze Flammes apocalyptiques, résonnent à nouveau du rugissement triomphant de la vie. Les feux infernaux qui consumèrent cet empire légendaire ont été domptés et vaincus, et la lumière éclatante et divine des Possessions Valyriennes illumine une fois de plus les eaux sombres de la Mer Fumante, chassant les ténèbres qui l'ont trop longtemps engloutie.\n\nVous vous tenez au carrefour de l'histoire, à l'épicentre d'une nouvelle ère. Les peuples ne vous regardent pas simplement comme leur souverain, mais comme l'architecte de l'impossible—celui qui a défié le Fléau lui-même et en est sorti victorieux, accomplissant ce que nul n'osait même rêver. Chaque recoin des Possessions renaissantes vibre d'une vigueur renouvelée et d'une puissance qu'aucun autre royaume ne peut espérer égaler.\n\nQue les autres puissances du monde tremblent devant votre gloire retrouvée. L'ombre maudite du Fléau est levée à jamais, et à sa place le feu sacré de Valyria brûle plus intensément qu'il ne l'a jamais fait dans toute son histoire millénaire. La puissance titanesque de l'Antique Valyria est vôtre à commander. L'Âge des Possessions commence maintenant, et le monde entier pliera le genou devant la renaissance du plus grand empire que l'humanité ait jamais connu."
  lv_valyrian_freehold.0001.a:0 "[Glossary( 'Valar dohaeris!', 'VALAR_DOHAERIS_GLOSS' )]"
  lv_valyrian_freehold.0001.t:0 "Le Dragon S'éveille : Les Possessions Renaissantes"
  lv_valyrian_freehold.0001.desc:0 "Le cauchemar du Fléau est brisé. Valyria, berceau de la magie, trône des dragons, cœur du monde, est de nouveau entière.\n\nAujourd'hui, les terres dévastées de Valyria se dressent unies, et les grandes cités, violemment réduites au silence par les Quatorze Flammes, résonnent une fois encore du rugissement de la vie. Les feux qui détruisirent cet empire ont été apaisés, et la lumière véritable et éclatante des Possessions Valyriennes brille de nouveau sur la Mer Fumante.\n\nVous vous tenez au nexus de l'histoire. Le peuple ne vous regarde pas comme son souverain, mais comme l'architecte de l'impossible : celui qui a défié le Fléau et a vaincu. Chaque recoin des Possessions renaissantes pulse d'une vigueur renouvelée qu'aucun autre royaume ne saurait espérer égaler.\n\nQue les autres puissances du monde tremblent. L'ombre du Fléau s'est levée, et à sa place le feu de Valyria brûle plus intensément que jamais. La puissance de l'Ancienne Valyria est vôtre à commander. L'Ère des Possessions commence maintenant."
  lv_valyrian_freehold.0001.a:0 "[Glossary( 'Valar dohaeris!', 'VALAR_DOHAERIS_GLOSS' )]"

  lv_valyrian_freehold.0001.tooltip.styling:0 "Vous porterez le titre de #high [SelectLocalization( restorer.IsFemale, 'hegemon_valyria_female_imperial', 'hegemon_valyria_male_imperial' )]#!"

  lv_valyrian_freehold.0002.t:0 "Le Dragon S'éveille : Les Possessions Renaissantes"
  lv_valyrian_freehold.0002.desc:0 "Une proclamation s'est élevée du siège autrefois cendreux de [restorer.GetCapitalLocation.GetBaronyNameExplicitly], signée dans le feu et le sang par [restorer.GetName]. L'impossible s'est accompli : le Fléau a été défié, et les Possessions Valyriennes ont été déclarées restaurées.\n\nLe silence qui régnait sur la péninsule depuis le Fléau est rompu. Là où il n'y avait que mort et ruines, se dresse désormais une puissance unifiée, liée non seulement par la loi, mais par la volonté ardente du [restorer.GetTitleTierName]. Les Quatorze Flammes brûlent une fois encore pour un maître vivant.\n\nUne ombre colossale s'étend désormais sur le monde connu. Des Royaumes du Couchant à l'Empire Doré de Yi Ti, rois et empereurs lèvent les yeux vers le ciel avec une terreur nouvelle. Le monde des hommes est sur le point d'être mis à l'épreuve comme jamais auparavant, car l'Ère des Possessions est revenue."
  lv_valyrian_freehold.0002.a:0 "Par [ROOT.Char.GetFaith.HighGodName]..."

  lv_valyrian_freehold.0002.tooltip:0 "Les [GetTitleByKey('h_valyrian_freehold').GetName] ont été restaurées"

  lv_valyrian_freehold.0100.t:0 "[county.GetNameNoTierNoTooltip] Reconquise"
  lv_valyrian_freehold.0100.t.newly_conquered:0 "[county.GetNameNoTierNoTooltip] Conquise"
  lv_valyrian_freehold.0100.desc.intro:0 "Les bannières des Possessions flottent une fois encore sur des terres qui se croyaient libres. Là où nos ancêtres régnaient jadis par droit du sang et du feu, nous revenons aujourd'hui réclamer notre héritage. Le long silence est révolu, et la gloire de cette reconquête m'appartient seul.\n\n"
  lv_valyrian_freehold.0100.desc.elyria:0 "[county.GetNameNoTier] se tenait au bord de l'apocalypse et survécut, pour ensuite oublier ses maîtres dans la confusion qui s'ensuivit.\n\nJadis, cette île prospère ne connaissait nulle autonomie, gouvernée uniquement par des hommes et des femmes envoyés depuis le cœur de l'empire pour imposer notre volonté. En notre absence, ils tournèrent leurs regards vers l'est, vers la Harpie et les Ghiscaris, préférant l'or à la loyauté. Cette ère d'indépendance est révolue. Les liens avec la Baie des Serfs sont tranchés, et [county.GetNameNoTier] servira de nouveau de porte vers les Terres du Long Été, gouvernée comme elle fut toujours destinée à l'être : par Valyria."
  lv_valyrian_freehold.0100.desc.mantarys:0 "[county.GetNameNoTier], la prétendue cité des monstres, se recroqueville désormais devant les véritables maîtres de la Route des Démons.\n\nTandis que le Fléau engloutissait la péninsule, ses retombées ne firent que tordre cette cité, laissant ses habitants difformes et contrefaits : une parodie vivante de la beauté valyrienne. Pendant des siècles, ils ont effrayé les voyageurs et gardé l'approche septentrionale avec une réputation sinistre.\n\nMais la peur n'a nulle emprise sur ceux qui ont conquis le Fléau lui-même. Les seigneurs difformes de [county.GetNameNoTier] se sont rendus. Leur force monstrueuse ne servira plus leurs seuls intérêts ; elle sera exploitée, comme aux jours anciens, pour servir la volonté des Possessions."
  lv_valyrian_freehold.0100.desc.tolos:0 "Les Falaises Noires de [county.GetNameNoTier] ont longtemps contemplé la Baie des Serfs, tournant un œil aveugle vers l'ouest. Comme ses voisines, [county.GetNameNoTier] oublia ses origines dans les suites du Fléau, courtisant la faveur des Ghiscaris et de la Harpie.\n\nMais le Dragon n'oublie pas ce qui lui appartient. Nous ne sommes pas venus pour leur commerce, mais pour leur adresse. Les célèbres frondeurs de [county.GetNameNoTier], dont les balles de plomb tendre peuvent briser les os à travers la maille, sont une arme forgée sous notre ombre il y a bien longtemps. Ils ne serviront plus de mercenaires au plus offrant de la Baie ; ils sont rendus à l'arsenal impérial, prêts à faire pleuvoir la mort sur les ennemis des Possessions."
  lv_valyrian_freehold.0100.desc.volantis:0 "[county.GetNameNoTier], la Première Fille, a enfin été ramenée à l'obéissance.\n\nPendant des siècles, le Sang Ancien demeurant derrière les Murs Noirs s'est engraissé d'arrogance, se proclamant successeur de notre gloire. Ils contribuèrent grandement au chaos du Siècle de Sang, tentant de revendiquer un manteau trop lourd pour leurs épaules, avant de se retirer dans la stagnation de leurs Éléphants.\n\nIls ont oublié qu'ils furent fondés non comme un empire, mais comme une garnison. Les Murs Noirs furent érigés pour protéger les frontières des Possessions, non pour abriter des prétendants. Aujourd'hui, l'ordre naturel est restauré. Les Tigres sont édentés, les Éléphants ont cédé, et le Dragon est revenu rappeler à la Première Fille que son seul véritable devoir est d'obéir."
  lv_valyrian_freehold.0100.desc.tyrosh:0 "[county.GetNameNoTier] est une cité aux couleurs criardes, mais sous la teinture se cache une histoire de la plus noire traîtrise.\n\nElle débuta comme un avant-poste morne pour tenir les Degrés de Pierre, ne s'élevant vers la richesse que parce que nos ancêtres prisaient leurs pigments uniques. Pourtant, quand le Fléau s'abattit, les Tyroshis repayèrent notre patronage par le meurtre. Ils massacrèrent les Seigneurs Dragons survivants et leurs montures dans un accès de panique et de cupidité, espérant effacer leur servitude.\n\nNous n'avons pas oublié. La cité est reconquise, et la dette est réclamée. Les Degrés de Pierre sont de nouveau sous notre garde, et les teinturiers de [county.GetNameNoTier] ont appris que si la peinture peut couvrir un mur, elle ne peut les cacher de la justice du Dragon."
  lv_valyrian_freehold.0100.desc.lys:0 "[county.GetNameNoTier] est connue comme la Ravissante, et pour cause. Ici, plus que nulle part ailleurs au monde, le sang des Possessions coule avec force. Même les mendiants dans les rues arborent les cheveux d'argent et les yeux violets des Seigneurs Dragons, fantômes vivants de la gloire que nous avons perdue.\n\nMais un visage valyrien ne dissimule pas un cœur de traître. Quand le Fléau frappa, les Lysiens se retournèrent contre les dragons et cavaliers qui cherchaient refuge dans leurs jardins ombragés de palmiers, les massacrant dans la panique pour assurer leur propre survie.\n\nNous sommes revenus corriger cette erreur. Les jardins de plaisance de l'empire sont nôtres une fois encore, et les Lysiens, beaux, perfides et fiers, ont été rappelés que s'ils peuvent partager notre sang, ils ne partagent pas notre pouvoir."
  lv_valyrian_freehold.0100.desc.myr:0 "[county.GetNameNoTier] aux hauts remparts se dresse là où les antiques Routes du Dragon rencontrent la mer, une cité bâtie par des aventuriers valyriens sur les pierres brisées des Andals.\n\nPendant des années, cette cité s'est définie par l'or et l'artisanat, se saignant à blanc dans les guerres sans fin et mesquines pour les Terres Disputées. Ils croyaient que leurs murs, leur richesse et leur Dieu Rouge pouvaient les protéger du tournant de la roue. Ils avaient tort.\n\nLe différend est clos. Les artisans de [county.GetNameNoTier], maîtres du verre clair, de la dentelle ouvragée et des mécanismes complexes, sont les plus fins du monde. Leurs talents sont trop précieux pour être gaspillés en querelles mercantiles. Les ateliers de [county.GetNameNoTier] appartiennent désormais aux Possessions, et leurs forges brûlent pour nous."
  lv_valyrian_freehold.0100.desc.pentos:0 "[county.GetNameNoTier] a toujours été une cité de compromis, où le sang du Dragon fut autorisé à s'affadir et se mêler aux Andals. Trop longtemps, les Magisters ont régné depuis les ombres, se cachant derrière la cage dorée de leur Prince cérémoniel.\n\nSelon leurs propres lois, la gorge du Prince doit être tranchée quand une guerre est perdue pour apaiser les dieux. Mais les dieux de [county.GetNameNoTier] sont muets devant nous. Nous n'avons nul besoin du sang d'une marionnette. Ce sont les Magisters, les marchands de fromage et négociants d'épices qui pensaient pouvoir acheter le monde, qui vont maintenant apprendre le véritable prix du pouvoir. La mascarade du Prince est terminée, et la réalité du Dragon a commencé."
  lv_valyrian_freehold.0100.desc.chroyane:0 "[county.GetNameNoTier] gît enveloppée dans les brumes des Chagrins, monument de la dernière fois qu'une puissance osa véritablement défier les Possessions.\n\nC'est ici que le Prince Garin fut suspendu dans une cage d'or pour regarder sa Cité des Festivals brûler, et c'est ici qu'il invoqua la Mère Rhoyne pour noyer nos ancêtres dans une malédiction de brume et de grisécaille. Pendant mille ans, les Hommes de Pierre et leur Seigneur Voilé ont régné sur ces ruines, protégés par le souffle des morts.\n\nMais le Dragon ne craint pas l'humidité. Nous sommes revenus achever la guerre. La Grisécaille sera purgée par le feu des dragons, les brumes consumées par la chaleur de notre retour. La Rhoyne nous appartient désormais, et [county.GetNameNoTier] sert de sinistre rappel : l'eau peut noyer un homme, mais le feu consume une civilisation."
  lv_valyrian_freehold.0100.desc.ny_sar:0 "[county.GetNameNoTier] fut jadis une cité de fontaines et de chants, le siège de la Princesse-Guerrière Nymeria. Mais les chants meurent vite quand le ciel s'emplit de cendres.\n\nContrairement à l'insensé Garin, Nymeria savait qu'il valait mieux ne pas affronter les Seigneurs Dragons à découvert. Elle dépouilla cette cité jusqu'à l'os et s'enfuit avec ses Dix Mille Navires, privant nos ancêtres des esclaves qui leur étaient dus. Elle ne laissa derrière elle qu'une coquille : un palais colossal de marbre rose et vert, désormais brisé et silencieux.\n\nNous sommes revenus réclamer les ruines qu'elle abandonna. Les fontaines sont taries, les chanteurs ont disparu, et la Rhoyne coule paisiblement devant les décombres. Que cette cité brisée serve de preuve : vous pouvez fuir jusqu'aux confins de la terre, mais vous ne pouvez jamais véritablement échapper au Dragon."
  lv_valyrian_freehold.0100.desc.meereen:0 "[county.GetNameNoTier], la plus grande des Cités Esclavagistes, s'est longtemps engraissée de la vanité que l'Ancien Empire de Ghis pourrait renaître. Les Grands Maîtres siègent au sommet de leurs pyramides, parlant un dialecte bâtard de notre propre langue, se croyant les seigneurs du monde.\n\nIls oublient leur histoire. Cinq fois la Harpie s'envola contre le Dragon, et cinq fois elle fut abattue. Nous avons appris l'art de la chaîne de leurs ancêtres, pour ensuite les enchaîner avec.\n\nAujourd'hui, la Grande Pyramide est purifiée. La Harpie est renversée, ses ailes de bronze fracassées sur les pierres. Les Maîtres ont appris la leçon ultime de leur métier : il y a ceux qui tiennent le fouet, et ceux qui le sentent. [county.GetNameNoTier] est de nouveau une colonie."
  lv_valyrian_freehold.0100.desc.yunkai:0 "[county.GetNameNoTier], la Cité Jaune, empeste le parfum et la décadence. Les soi-disant « Sages Maîtres » se sont longtemps enrichis en dressant des esclaves pour la couche, se cachant derrière de hauts murs et proclamant leur cité « Reine des Cités ».\n\nMais une reine s'incline devant un Dragon. La Harpie ghiscarie de [county.GetNameNoTier], avec sa queue de scorpion et son collier de fer, a été dégriffée.\n\nLes Sages Maîtres ont enfin appris les limites de leur sagesse. Leurs fosses de dressage, leurs maisons de plaisir et leur peuple ne leur appartiennent plus. Nous avons appris le commerce de la servitude humaine de leurs ancêtres, et nous revenons leur rappeler que s'ils font commerce de chair, nous faisons commerce de feu."
  lv_valyrian_freehold.0100.desc.astapor:0 "[county.GetNameNoTier], la Cité Rouge, est bâtie sur une vieille et sinistre vérité : briques et sang. Pendant des années, les Bons Maîtres se sont enrichis en brisant des hommes pour en faire l'arme parfaite : les Immaculés.\n\nIls se vantent de la discipline absolue de leurs Immaculés, se proclamant les plus grands esclavagistes du monde. Mais ils ne sont que les restes de l'Ancienne Ghis, une civilisation que nous avons écrasée cinq fois.\n\nLes places de dressage sont silencieuses désormais, attendant de nouveaux ordres. La chaîne de la Harpie a été saisie. Les Immaculés ne seront plus vendus comme mercenaires au plus offrant ; la plus grande infanterie du monde a été réclamée pour l'armée impériale. Les Bons Maîtres ont été rappelés que s'ils peuvent briser des hommes, seul le Dragon brise des empires."
  lv_valyrian_freehold.0100.desc.new_ghis:0 "[county.GetNameNoTier] s'élève du Golfe des Chagrins, tentative éhontée de ressusciter un cadavre que nous avons enterré il y a cinq mille ans.\n\nTandis que les autres Cités Esclavagistes pourrissaient dans la stagnation, [county.GetNameNoTier] chercha à recréer la puissance militaire de l'Ancien Empire. Ils formèrent leurs Légions de Fer dans le pas cadencé du passé, des hommes libres, non des esclaves, combattant avec la discipline des anciens.\n\nMais si le véritable Ancien Empire ne put résister au Dragon à l'apogée de sa puissance, quel espoir avait cette pâle imitation ? Leurs légions se sont brisées contre nos lignes. Nous avons éteint cette étincelle de renouveau ghiscari avant qu'elle ne devienne flamme. Il n'y aura pas de Sixième Guerre Ghiscarie ; [county.GetNameNoTier] est nôtre."
  lv_valyrian_freehold.0100.desc.old_ghis:0 "Le vent sur [county.GetNameNoTier] a le goût du sel, du soufre et de la poussière ancienne. Ici gît le cadavre de l'Ancien Empire, la seule puissance qui ait jamais véritablement défié le Dragon à son ascension.\n\nCinq fois la Harpie s'envola contre nous, et cinq fois elle tomba. Il y a cinq mille ans, nos ancêtres brisèrent leurs légions au pas cadencé, abattirent leurs murs de briques, et ensemencèrent leurs champs de crânes pour que plus rien n'y pousse jamais.\n\nIls réussirent. Contrairement à Valyria, qui s'est relevée des cendres du Fléau, [county.GetNameNoTier] demeure dans sa tombe. Nous hissons nos bannières sur ces ruines non pour honorer leur héritage, mais pour nous tenir sur le tombeau de l'Ancien Empire de Ghis et rappeler au monde : le Dragon conquiert la mort ; la Harpie ne fait que s'en repaître."
  lv_valyrian_freehold.0100.desc.gogossos:0 "[county.GetNameNoTier] se dresse sur l'Île des Larmes comme un monument aux plus sombres pulsions de nos ancêtres. Jadis avant-poste ghiscari, nous la transformâmes en oubliettes des Possessions : une fosse où les pires criminels et les plus ténébreux sorciers étaient envoyés pour être oubliés.\n\nDans le silence qui suivit le Fléau, les détenus prirent le contrôle de l'asile. Ils pratiquèrent la magie du sang et le façonnage de chair qui défiaient la nature, croisant des bêtes avec des hommes et osant nommer leur abomination la « Dixième Cité Libre ».\n\nCette illusion est terminée. Une prison n'est pas une cité. Nous sommes revenus reprendre les clés. Les fosses de chair et les cryptes de sorcellerie répondent désormais à nous, et les horreurs torturées de [county.GetNameNoTier] ne courront plus en liberté ; elles sont une sombre ressource, rendue au verrou et à la clé du Dragon."
  lv_valyrian_freehold.0100.desc.braavos:0 "[county.GetNameNoTier], la Fille Bâtarde, la Cité Secrète. Pendant des siècles, ils se sont terrés dans cette lagune, une civilisation bâtie par des biens volés sur des fondations de brume et de peur.\n\nLes Chantelunes leur promirent un sanctuaire où le Dragon ne pourrait les trouver. Elles mentirent. Le Titan de Braavos peut se dresser haut, mais il est fait de pierre et de bronze ; il ne peut résister contre la chair et le feu.\n\nAujourd'hui, la Première Loi est abrogée. La Banque de Fer a été saisie, ses coffres forcés pour rembourser la dette des navires volés à nos ancêtres il y a mille ans. Les fuyards ont été retrouvés, la mascarade est terminée, et la Fille Bâtarde a été traînée hors des ombres pour s'agenouiller devant ses maîtres légitimes."

  lv_valyrian_freehold.0100.a:0 "Pour la Gloire de Valyria !"
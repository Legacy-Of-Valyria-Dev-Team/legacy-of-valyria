l_french:
 decision_cook_dragon_egg.t:0 "Cuisinez votre Œuf de Dragon"
 decision_cook_dragon_egg_desc:0 "Personne n'a jamais cuisiné d'œuf de dragon auparavant, je me demande quel goût cela pourrait avoir..."
 decision_cook_dragon_egg_confirm:0 "Cet œuf aura un goût divin !"
 decision_cook_dragon_egg_tooltip:0 "Cuisinez votre œuf de dragon et préparez la meilleure omelette du monde !"

 cook_egg_decision_tt:0 "Vous allumerez un immense feu de joie pour cuire votre œuf"
 character_is_a_lunatic:0 "Vous êtes un fou furieux"
 character_has_a_dragon_egg_to_cook:0 "Vous avez un œuf de [dragon|E] à cuisiner"

 lunatic_cook_dragon_egg.001.t:0 "Cuisiner l'Œuf !"

 lunatic_cook_dragon_egg.001.intro:0 "Votre œuf de dragon repose là, invitant. Nul homme n'a jamais goûté à un œuf de dragon auparavant. Vous vous demandez quel goût il pourrait avoir tandis que vous saisissez votre œuf et le portez jusque dans la cour. Un chaudron d'huile chaude repose prêt et bouillonnant. Alors que vous saisissez votre œuf de dragon pour la dernière fois, une pensée surgit dans votre esprit :\n\n"
 lunatic_cook_dragon_egg.001.gluttonous.desc:0 "Quel goût aura-t-il ?"
 lunatic_cook_dragon_egg.001.dragonslayer.desc:0 "J'ai terrassé un dragon, à présent j'en goûterai un."
 lunatic_cook_dragon_egg.001.just_lunatic.desc:0 "Je serai le premier à goûter un œuf de dragon !"
 lunatic_cook_dragon_egg.001.end:0 "\n\nAvant que vous ne puissiez plonger l'œuf dans le chaudron bouillonnant, une voix s'élève derrière vous : « [ROOT.Char.GetFirstName], cessez cela immédiatement ! C'est un œuf de [dragon|E] ! ». Vous vous retournez, pour ne voir que [protesting_courtier.GetFirstName] se précipitant vers vous, [protesting_courtier.GetHerHisMy] yeux implorants."

 lunatic_cook_dragon_egg.001.a:0 "Laisser tomber l'Œuf dans le chaudron"
 lunatic_cook_dragon_egg.001.b:0 "Reculer devant le chaudron"

 lunatic_cook_dragon_egg.002.t:0 "L'Œuf Explose !"
 lunatic_cook_dragon_egg.002.intro:0 "[protesting_courtier.GetFirstName] regarde avec horreur tandis que vous laissez tomber l'œuf dans le chaudron. L'huile bouillonnante semble brûler plus violemment et l'œuf commence à se fissurer. Vous souriez, anticipant un délicieux repas.\n\nAu lieu de cela, tandis que l'œuf se fissure, une immense boule de feu verte surgit vers vous avec une vitesse incroyable..."

 lunatic_cook_dragon_egg.0002.a:0 "Aaaargh !"

 mass_coutier_death:0 "Chaque courtisan et invité périt tandis que la colonie est anéantie"

 lunatic_cook_dragon_egg.003.t:0 "Un Dragon Éclot"
 lunatic_cook_dragon_egg.003.desc:0 "[protesting_courtier.GetFirstName] regarde avec horreur tandis que vous laissez tomber l'œuf dans le chaudron. L'huile bouillonnante semble brûler plus violemment et l'œuf commence à se fissurer. Vous souriez, anticipant un délicieux repas. Mais alors, vos attentes s'effondrent tandis que vous apercevez de minuscules ailes qui battent. Un dragon entre dans le monde !"
 lunatic_cook_dragon_egg.0003.a:0 "Mon délicieux repas..."

 hatched_dragon_via_cooking_notification:0 "[ROOT.Char.GetName] a fait éclore [dragon.GetName] en tentant de le cuisiner !"

 lunatic_cook_dragon_egg.0004.t:0 "L'Œuf Éclot !"
 lunatic_cook_dragon_egg.0004.desc:0 "Je me sens étrange tandis que la scène se déroule devant moi. Mon œuf a éclos et un dragon a rampé hors des ruines de sa coquille.\n\nQu'est-ce qui a bien pu me pousser à vouloir tuer une créature aussi magnifique ? Je peux déjà sentir le lien qui nous unit m'envahir, et combien il restera à mes côtés jusqu'à la fin de mes jours. Bien que je ne puisse encore dire quel est son sexe, il a néanmoins besoin d'un nom que l'histoire n'oubliera jamais.\n\nComment devrais-je l'appeler ?"
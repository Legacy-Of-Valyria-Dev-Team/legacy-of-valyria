l_french:
decision_cook_dragon_egg.t:0 "Cuisiner votre Œuf de Dragon"
decision_cook_dragon_egg_desc:0 "Nul n'a jamais cuisiné un œuf de dragon auparavant, je me demande quel goût cela aurait..."
decision_cook_dragon_egg_confirm:0 "Cet œuf aura un goût divin!"
decision_cook_dragon_egg_tooltip:0 "Cuisinez votre œuf de dragon et préparez la meilleure omelette du monde!"

cook_egg_decision_tt:0 "Vous allumerez un immense bûcher pour cuire votre œuf"
character_is_a_lunatic:0 "Vous êtes un lunatique"
character_has_a_dragon_egg_to_cook:0 "Vous possédez un œuf de [dragon|E] à cuisiner"

lunatic_cook_dragon_egg.001.t:0 "Cuisson de l'Œuf!"

lunatic_cook_dragon_egg.001.intro:0 "Votre œuf de dragon repose là, de façon invitante. Nul homme n'a jamais goûté un œuf de dragon auparavant. Vous vous demandez quel goût il peut avoir tandis que vous le saisissez et l'emportez dans la cour. Un chaudron d'huile bouillante vous attend, frémissant. Alors que vous prenez votre œuf de dragon pour la dernière fois, une pensée traverse votre esprit:\n\n"
lunatic_cook_dragon_egg.001.gluttonous.desc:0 "Quel goût aura-t-il?"
lunatic_cook_dragon_egg.001.dragonslayer.desc:0 "J'ai occis un dragon, maintenant j'en goûterai un"
lunatic_cook_dragon_egg.001.just_lunatic.desc:0 "Je serai le premier à goûter un œuf de dragon!"
lunatic_cook_dragon_egg.001.end:0 "\n\nAvant que vous ne puissiez placer l'œuf dans le chaudron bouillant, une voix s'élève derrière vous '[ROOT.Char.GetFirstName], cessez cela sur-le-champ ! C'est un œuf de [dragon|E] !'. Vous vous retournez, pour découvrir [protesting_courtier.GetFirstName] qui se précipite vers vous, [protesting_courtier.GetHerHisMy] regard suppliant"

lunatic_cook_dragon_egg.001.a:0 "Laisser tomber l'Œuf dans le chaudron"
lunatic_cook_dragon_egg.001.b:0 "S'éloigner du chaudron"

lunatic_cook_dragon_egg.002.t:0 "L'Œuf Explose!"
lunatic_cook_dragon_egg.002.intro:0 "[protesting_courtier.GetFirstName] observe avec horreur tandis que vous laissez tomber l'œuf dans le chaudron. L'huile bouillante semble brûler plus violemment et l'œuf commence à se fissurer. Vous souriez, anticipant un repas délicieux.\n\nAu lieu de cela, tandis que l'œuf se brise, une gigantesque boule de feu verte surgit vers vous à une vitesse incroyable..."

lunatic_cook_dragon_egg.0002.a:0 "Aaaargh!"

mass_coutier_death:0 "Chaque courtisan et invité périt tandis que la colonie est anéantie"

lunatic_cook_dragon_egg.003.t:0 "Un Dragon éclot"
lunatic_cook_dragon_egg.003.desc:0 "[protesting_courtier.GetFirstName] observe avec horreur tandis que vous laissez tomber l'œuf dans le chaudron. L'huile bouillante semble brûler plus violemment et l'œuf commence à se fissurer. Vous souriez, anticipant un repas délicieux. Mais alors, vos attentes sont brisées lorsque vous apercevez de minuscules ailes battantes. Un dragon vient au monde!"
lunatic_cook_dragon_egg.0003.a:0 "Mon délicieux repas..."

hatched_dragon_via_cooking_notification:0 "[ROOT.Char.GetName] a fait éclore [dragon.GetName] en tentant de le cuisiner!"

lunatic_cook_dragon_egg.0004.t:0 "L'Œuf Éclot!"
lunatic_cook_dragon_egg.0004.desc:0 "J'éprouve une étrange sensation tandis que la scène se déroule devant moi. Mon œuf a éclos et un dragon est sorti des ruines de sa coquille.\n\nQuelle folie m'a donc poussé à vouloir occire une bête si magnifique ? Je peux déjà ressentir le lien écrasant que nous partageons, et comment il demeurera avec moi jusqu'à la fin de mes jours. Bien que je ne puisse encore dire quel est son sexe, cette créature a besoin d'un nom que l'histoire n'oubliera jamais.\n\nComment devrais-je le nommer?"
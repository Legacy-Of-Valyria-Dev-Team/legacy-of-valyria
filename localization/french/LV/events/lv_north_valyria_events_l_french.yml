l_french:
  agot_EE_establish_north_valyria_decision:0 "Établir la Valyria Septentrionale"
  agot_EE_establish_north_valyria_decision_desc:0 "Forger le royaume de Valyria Septentrionale à partir des diverses principautés querelleuses qui parsèment le nord de la péninsule jadis glorieuse, les unissant en un puissant domaine avec lequel nul n'osera badiner."
  agot_EE_establish_north_valyria_decision_tooltip:0 "Établir le Royaume de Valyria Septentrionale"
  agot_EE_establish_north_valyria_decision_confirm:0 "Rassembler le royaume"
  agot_EE_establish_north_valyria_tooltip_dejure:0 "Tous les territoires sous [GetTitleByKey('k_mantarys').GetName], [GetTitleByKey('k_tolos').GetName], [GetTitleByKey('k_elyria_and_velos').GetName] et [GetTitleByKey('k_draconys').GetName] deviennent suzerains [de_jure|E] de [GetTitleByKey('e_north_valyria').GetName]"

  agot_EE_north_valyria.1.t:0 "La Valyria Septentrionale S'élève"
  agot_EE_north_valyria.1.desc:0 "Du temps des [valyrian_freehold|E], leurs cités septentrionales le long des Montagnes Peintes prospéraient. Bien qu'elles n'eussent point le privilège de l'autonomie, elles étaient opulentes. Après le Fléau, nous avons chu de cette gloire passée, abandonnés dans les cendres à notre propre sort. Le monde verra que tel n'est plus le cas, car j'ai uni ces petits seigneurs querelleurs sous ma bannière, que ce soit par la diplomatie ou par la force.\n\nAujourd'hui, un phénix renaît des cendres des [valyrian_freehold_short|E]."
  agot_EE_north_valyria.1.a:0 "Un roi murmure et un dragon incline la tête"

  agot_EE_reestablish_old_valyria_decision:0 "Restaurer l'Ancien Empire"
  agot_EE_reestablish_old_valyria_decision_desc:0 "Depuis le trône de mon royaume florissant, je me tiens prêt à ressusciter l'ancien empire, insufflant la vie à ce que l'on croyait perdu à jamais. Les ruines de mes ancêtres murmurent des récits de puissance oubliée, de terres unies sous une force indomptable, et je suis prêt à restaurer cet héritage."
  agot_EE_reestablish_old_valyria_decision_tooltip:0 "Rétablir l'Empire de l'[old_valyria|E]"
  agot_EE_reestablish_old_valyria_decision_confirm:0 "Rétablir l'Ancien Empire"

  agot_EE_old_valyria.1.t:0 "L'Ancien Empire Renaît"
  agot_EE_old_valyria.1.desc:0 "Tel un dragon s'éveillant de son antique sommeil, l'[old_valyria|E] s'élève une fois encore ! Notre bannière plane haut sur chaque recoin de notre empire jadis glorieux, portée par des vents aussi indomptés que l'esprit de notre peuple. Les anciennes [valyrian_freehold_short|E], autrefois phare resplendissant contre les ténèbres, sombrèrent dans un brasier de ruines. Bien que nous ne puissions jamais reconquérir leur grandeur inégalée, nous honorons nos ancêtres en nous élevant toujours plus haut. Ensemble, nous marchons vers l'avenir tandis que les flammes d'antan vacillent à nouveau. Cette fois, [valyria|E] résistera à l'épreuve des âges."
  agot_EE_old_valyria.1.a:0 "Enfin Restauré !"
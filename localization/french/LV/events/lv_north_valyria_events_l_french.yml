l_french:
 agot_EE_establish_north_valyria_decision:0 "Établir la Valyria du Nord"
 agot_EE_establish_north_valyria_decision_desc:0 "Établissez le royaume de la Valyria du Nord à partir des diverses principautés querelleuses qui existent au nord de l'ancienne grande péninsule, pour en faire un royaume puissant que nul n'osera défier."
 agot_EE_establish_north_valyria_decision_tooltip:0 "Établir le Royaume de la Valyria du Nord"
 agot_EE_establish_north_valyria_decision_confirm:0 "Rassembler le royaume"
 agot_EE_establish_north_valyria_tooltip_dejure:0 "Tous les territoires sous [GetTitleByKey('k_mantarys').GetName], [GetTitleByKey('k_tolos').GetName], [GetTitleByKey('k_elyria_and_velos').GetName], et [GetTitleByKey('k_draconys').GetName] deviennent suzerain [de_jure|E] de [GetTitleByKey('e_north_valyria').GetName]"

 agot_EE_north_valyria.1.t:0 "La Valyria du Nord S'Élève"
 agot_EE_north_valyria.1.desc:0 "Depuis l'époque des [valyrian_freehold|E], ses cités du nord le long des Montagnes Peintes prospéraient. Bien qu'elles ne jouissaient pas du privilège de l'autonomie, elles étaient riches. Après le Fléau, nous sommes déchus de cette gloire passée, abandonnés dans les cendres pour subvenir à nos propres besoins. Le monde verra qu'il n'en est plus ainsi, car j'ai uni ces petits seigneurs querelleurs sous ma bannière, que ce soit par la diplomatie ou par la force.\n\nAujourd'hui, un phénix renaît des cendres des [valyrian_freehold_short|E]."
 agot_EE_north_valyria.1.a:0 "Un roi murmure et un dragon incline la tête"

 agot_EE_reestablish_old_valyria_decision:0 "Restaurer l'Ancien Empire"
 agot_EE_reestablish_old_valyria_decision_desc:0 "Depuis le siège de mon royaume florissant, je me tiens prêt à raviver l'ancien empire, insufflant vie à ce que l'on croyait jadis perdu. Les ruines de mes aïeux murmurent une puissance oubliée, des terres unies sous une force indomptable, et je suis prêt à restaurer cet héritage."
 agot_EE_reestablish_old_valyria_decision_tooltip:0 "Rétablir l'Empire de [old_valyria|E]"
 agot_EE_reestablish_old_valyria_decision_confirm:0 "Rétablir l'Ancien Empire"

 agot_EE_old_valyria.1.t:0 "L'Ancien Empire S'Élève"
 agot_EE_old_valyria.1.desc:0 "Tel un dragon s'éveillant de son antique sommeil, [old_valyria|E] s'élève de nouveau ! Notre bannière plane haut sur chaque recoin de notre jadis grand empire, portée par des vents aussi indomptés que l'esprit de notre peuple. Les antiques [valyrian_freehold_short|E], jadis une lumière imposante contre les ténèbres, sont tombées dans un embrasement de ruine. Bien que nous ne puissions jamais reconquérir sa grandeur inégalée, nous honorons nos ancêtres en visant toujours plus haut. Ensemble, nous marchons de l'avant tandis que le feu antique vacille de nouveau. Cette fois, [valyria|E] résistera à l'épreuve des âges."
 agot_EE_old_valyria.1.a:0 "Restaurée Enfin !"
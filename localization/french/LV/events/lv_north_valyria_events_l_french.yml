l_french:
  agot_EE_establish_north_valyria_decision:0 "Établir la Valyria du Nord"
  agot_EE_establish_north_valyria_decision_desc:0 "Établir le royaume de Valyria du Nord à partir des diverses principautés querellantes qui existent au nord de la jadis grande péninsule, en un puissant domaine avec lequel il ne faut point badiner"
  agot_EE_establish_north_valyria_decision_tooltip:0 "Établir le Royaume de Valyria du Nord"
  agot_EE_establish_north_valyria_decision_confirm:0 "Rassembler le royaume"
  agot_EE_establish_north_valyria_tooltip_dejure:0 "Tous les territoires sous [GetTitleByKey('k_mantarys').GetName], [GetTitleByKey('k_tolos').GetName], [GetTitleByKey('k_elyria_and_velos').GetName], et [GetTitleByKey('k_draconys').GetName] deviennent vassaux [de_jure|E] de [GetTitleByKey('k_north_valyria').GetName]"
  
  agot_EE_north_valyria.1.t:0 "La Valyria du Nord S'élève"
  agot_EE_north_valyria.1.desc:0 "Depuis l'époque des [valyrian_freehold|E], ses cités septentrionales le long des Montagnes Peintes prospéraient. Bien qu'elles n'eussent point le privilège de l'autonomie, elles étaient opulentes. Après le Fléau, nous sommes déchus de cette gloire passée, abandonnés dans les cendres pour nous débrouiller seuls. Le monde verra que ce n'est plus le cas, car j'ai uni ces mesquins seigneurs querelleurs sous ma bannière, soit par diplomatie, soit par la force.\n\nAujourd'hui, un phénix s'élève des cendres des [valyrian_freehold_short|E]"
  agot_EE_north_valyria.1.a:0 "Un roi murmure et un dragon incline la tête"

  agot_EE_reestablish_old_valyria_decision:0 "Restaurer l'Ancien Empire"
  agot_EE_reestablish_old_valyria_decision_desc:0 "Depuis le siège de mon royaume florissant, je me tiens prêt à raviver l'ancien empire, insufflant vie à ce que l'on croyait jadis perdu. Les ruines de mes ancêtres murmurent d'un pouvoir oublié, de terres unies sous une force indomptable, et je suis prêt à restaurer cet héritage"
  agot_EE_reestablish_old_valyria_decision_tooltip:0 "Rétablir l'Empire de l'Ancienne Valyria"
  agot_EE_reestablish_old_valyria_decision_confirm:0 "Rétablir l'Ancien Empire"

  agot_EE_old_valyria.1.t:0 "L'Ancien Empire S'élève"
  agot_EE_old_valyria.1.desc:0 "Tel un dragon s'éveillant de son antique sommeil, l'Ancienne Valyria s'élève à nouveau ! Notre étendard plane haut au-dessus de chaque recoin de notre empire jadis glorieux, porté par des vents aussi indomptés que l'esprit de notre peuple. Les antiques [valyrian_freehold_short|E], autrefois lumière imposante contre les ténèbres, tombèrent dans un brasier de ruine. Bien que nous ne puissions jamais retrouver leur incomparable splendeur, nous honorons nos ancêtres en nous élevant toujours plus haut. Ensemble, nous marchons en avant avec l'ancien feu qui vacille à nouveau. Cette fois, Valyria résistera à l'épreuve des âges"
  agot_EE_old_valyria.1.a:0 "Restaurée Enfin!"
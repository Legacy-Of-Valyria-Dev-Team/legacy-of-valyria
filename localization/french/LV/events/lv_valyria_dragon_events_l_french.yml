l_french:
  agot_dragon_personality.0015.warning.desc:0 "Depuis des semaines, vous visitez votre fosse draconique pour observer vos dragons grandissants. Tout semble normal. Sauf le comportement de [growing_dragon.GetFirstName].\n\n"
  agot_dragon_personality.0015.aggressive.desc:0 "Les Gardiens des Dragons rapportent une extrême agressivité envers les congénères de [growing_dragon.Custom('GetDragonHerHis')] et, en conséquence, [growing_dragon.GetSheHe] est devenu paria, les dragons proches semblant percevoir le danger ou l'agressivité de [growing_dragon.Custom('GetDragonHerHis')]. Durant un affrontement, [growing_dragon.GetSheHe] a tenté de déchirer la chair de [growing_dragon_victim.GetFirstName].\n\n"
  agot_dragon_personality.0015.voracious.desc:0 "[growing_dragon.GetFirstName] a normalement un intérêt insatiable pour la chair vive, mais cela semble s'être atténué récemment tandis que [growing_dragon.GetSheHe] observe désormais [growing_dragon_victim.GetFirstName] d'un regard prédateur durant les séances de nourrissage.\n\n"
  agot_dragon_personality.0015.voracious_aggressive_bloodthirsty.desc:0 "[growing_dragon.GetFirstName] a également un intérêt normalement insatiable pour la chair vive, mais cela semble s'être atténué récemment tandis que [growing_dragon.GetSheHe] observe désormais [growing_dragon_victim.GetFirstName] d'un regard prédateur durant les séances de nourrissage.\n\n"
  agot_dragon_personality.0015.warning.end:0 "En observant [growing_dragon.GetFirstName], vous réalisez que [growing_dragon.GetSheHe] a des pulsions cannibales. Heureusement, [growing_dragon.GetSheHe] ne s'est pas encore repu de chair draconique, mais vous devez agir pour séparer [growing_dragon.GetHerHim] et corriger ce comportement"
  agot_dragon_personality.0015.d:0 "C'est inacceptable ! J'éduquerai ce dragon!"

  agot_dragon_personality.0015.d.f:0 "Vous séparez [growing_dragon.GetFirstName] des autres dragons et commencez à éduquer [growing_dragon.GetHerHim]"
  agot_dragon_personality.0015.d.success:0 "Votre dragon n'est plus un cannibale"
  agot_dragon_personality.0015.d.success.tt:0 "Cannibalisme corrigé"
  agot_dragon_personality.0015.d.failure:0 "Votre dragon persiste dans son cannibalisme"
  agot_dragon_personality.0015.d.failure.tt:0 "Correction du cannibalisme échouée"
l_french:
  agot_dragon_personality.0015.warning.desc:0 "Depuis des semaines, vous vous rendez à votre dragonière pour observer vos dragons en pleine croissance. Tout semble normal. Sauf le comportement de [growing_dragon.GetFirstName].\n\n"
  agot_dragon_personality.0015.aggressive.desc:0 "Les Gardiens des Dragons rapportent une agressivité extrême envers [growing_dragon.Custom('GetDragonHerHis')] pairs et par conséquent, [growing_dragon.GetSheHe] est devenu un paria, les dragons voisins semblant percevoir le danger ou [growing_dragon.Custom('GetDragonHerHis')] agressivité. Durant un affrontement, [growing_dragon.GetSheHe] a tenté de lacérer la chair de [growing_dragon_victim.GetFirstName].\n\n"
  agot_dragon_personality.0015.voracious.desc:0 "[growing_dragon.GetFirstName] manifeste habituellement un intérêt insatiable pour la viande vive, mais celui-ci semble s'être atténué récemment car [growing_dragon.GetSheHe] observe désormais [growing_dragon_victim.GetFirstName] avec des yeux de prédateur durant les séances de nourrissage.\n\n"
  agot_dragon_personality.0015.voracious_aggressive_bloodthirsty.desc:0 "[growing_dragon.GetFirstName] manifeste également un intérêt habituellement insatiable pour la viande vive, mais celui-ci semble s'être atténué récemment car [growing_dragon.GetSheHe] observe désormais [growing_dragon_victim.GetFirstName] avec des yeux de prédateur durant les séances de nourrissage.\n\n"
  agot_dragon_personality.0015.warning.end:0 "En observant [growing_dragon.GetFirstName], vous réalisez qu'[growing_dragon.GetSheHe] éprouve des pulsions cannibales. Fort heureusement, [growing_dragon.GetSheHe] ne s'est pas encore repu de chair de dragon, mais vous devez agir pour [growing_dragon.GetHerHim] séparer des autres et corriger ce comportement."
  agot_dragon_personality.0015.d:0 "C'est inacceptable ! Je vais éduquer ce dragon !"

  agot_dragon_personality.0015.d.f:0 "Vous séparez [growing_dragon.GetFirstName] des autres dragons et commencez à [growing_dragon.GetHerHim] éduquer"
  agot_dragon_personality.0015.d.success:0 "Votre dragon n'est plus cannibale"
  agot_dragon_personality.0015.d.success.tt:0 "Cannibalisme corrigé"
  agot_dragon_personality.0015.d.failure:0 "Votre dragon demeure cannibale"
  agot_dragon_personality.0015.d.failure.tt:0 "Échec de la correction du cannibalisme"
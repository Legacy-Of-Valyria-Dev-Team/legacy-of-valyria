l_french:
 agot_dragon_personality.0015.warning.desc:0 "Depuis des semaines à présent, vous rendez visite à votre fossedragon pour observer vos dragons en pleine croissance. Tout paraît normal. Sauf le comportement de [growing_dragon.GetFirstName].\n\n"
 agot_dragon_personality.0015.aggressive.desc:0 "Les gardedragons rapportent une agressivité extrême envers [growing_dragon.Custom('GetDragonHerHis')] semblables, et par conséquent, [growing_dragon.GetSheHe] a fini par être ostracisé, les dragons proches semblant percevoir le danger ou [growing_dragon.Custom('GetDragonHerHis')] agressivité. Lors d'une bagarre, [growing_dragon.GetSheHe] a tenté de lacérer la chair de [growing_dragon_victim.GetFirstName].\n\n"
 agot_dragon_personality.0015.voracious.desc:0 "[growing_dragon.GetFirstName] éprouve normalement un intérêt insatiable pour la viande crue, mais celui-ci semble s'être atténué récemment, car [growing_dragon.GetSheHe] observe désormais [growing_dragon_victim.GetFirstName] d'un regard prédateur durant les repas.\n\n"
 agot_dragon_personality.0015.voracious_aggressive_bloodthirsty.desc:0 "[growing_dragon.GetFirstName] éprouve également normalement un intérêt insatiable pour la viande crue, mais celui-ci semble s'être atténué récemment, car [growing_dragon.GetSheHe] observe désormais [growing_dragon_victim.GetFirstName] d'un regard prédateur durant les repas.\n\n"
 agot_dragon_personality.0015.warning.end:0 "En observant [growing_dragon.GetFirstName], vous réalisez que [growing_dragon.GetSheHe] éprouve des pulsions cannibales. Heureusement, [growing_dragon.GetSheHe] ne s'est pas encore repu de chair de dragon, mais vous devez agir pour le séparer et corriger ce comportement."
 agot_dragon_personality.0015.d:0 "Ceci est inacceptable ! J'éduquerai ce dragon !"

 agot_dragon_personality.0015.d.f:0 "Vous séparez [growing_dragon.GetFirstName] des autres dragons et entreprenez son éducation"
 agot_dragon_personality.0015.d.success:0 "Votre dragon n'est plus un cannibale"
 agot_dragon_personality.0015.d.success.tt:0 "Cannibalisme corrigé"
 agot_dragon_personality.0015.d.failure:0 "Votre dragon demeure un cannibale"
 agot_dragon_personality.0015.d.failure.tt:0 "Échec de la correction du cannibalisme"
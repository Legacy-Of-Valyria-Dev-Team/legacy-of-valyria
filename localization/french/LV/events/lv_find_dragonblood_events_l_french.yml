 lv_find_the_dragonblood_decision.0001.t:0 "Le Sang de l'Ancienne Valyria"
 lv_find_the_dragonblood_decision.0001.desc:0 "Vous parcourez la liste que vous avez demandée, recensant toutes les dynasties vivantes connues portant le Sang du Dragon dans leurs veines."
 lv_find_the_dragonblood_decision.0001.a:0 "Ce sera tout."


 lv_find_the_dragonblood_decision.0002.a:0 "Ce sera tout."

 lv_find_the_dragonblood_decision.0003.t:0 "Les Dragonniers du Monde"
 lv_find_the_dragonblood_decision.0003.desc:0 "Vous parcourez la liste que vous avez demandée, recensant toutes les dynasties vivantes connues comptant actuellement des dragonniers en leur sein."
 lv_find_the_dragonblood_decision.0003.a:0 "Ce sera tout."

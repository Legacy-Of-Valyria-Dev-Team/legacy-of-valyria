#Colony
 #Colony Buildings
  building_type_local_markets_01:0 "Marchés Locaux"
  building_local_markets_01:0 "Marchés Locaux"
  building_local_markets_01_desc:0 "Un réseau de places marchandes grouillantes où colporteurs vendent leurs denrées, fermiers écoulent leurs récoltes et artisans proposent leurs ouvrages. Ces marchés forment le cœur battant de l'économie de la colonie, assurant un flux constant de marchandises, de pièces sonnantes et de prospérité pour tous."

  building_type_colony_quarries_01:0 "Carrières"
  building_colony_quarries_01:0 "Carrières de Pierre Simples"
  building_colony_quarries_01_desc:0 "Des gisements de pierre aisément accessibles fournissent les matériaux nécessaires aux constructions environnantes."

  building_type_colony_forestry_01:0 "Exploitations Forestières"
  building_colony_forestry_01:0 "Camps de Bûcherons"
  building_colony_forestry_01_desc:0 "Des bûcherons ont établi leur campement à l'orée de la forêt, garantissant une production régulière de rondins pour les chantiers de la région."

  building_type_colony_port_01:0 "Ports"
  building_colony_port_01:0 "Havre Colonial"
  building_colony_port_01_desc:0 "Un port dédié qui facilite le commerce et le transport maritime, stimulant l'économie de la colonie et renforçant ses liens avec le monde extérieur."

  #Blockers
	lv_wilderness_blocker_effect:0 "@warning_icon! #X Ce bâtiment constitue un obstacle qui doit être éliminé en l'améliorant totalement avant que la colonie ne puisse être transformée en domaine permanent#!"
  lv_wilderness_blocker_effect_mines:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Des veurs de feu peuvent émerger chaque année et ravageront alors la colonie#!"
  lv_wilderness_blocker_effect_plague:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Risque de déclencher une épidémie de peste chaque année#!"
  lv_wilderness_blocker_effect_raid:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Risque d'incursions de pillards contre la colonie chaque année#!"
  lv_firewyrm_blocker_effect:0 "@warning_icon! #X Ce bâtiment constitue un obstacle qui doit être éliminé en tuant le veur de feu présent dans cette province avant que la colonie ne puisse être transformée en domaine permanent#!"

  #Caves
  building_type_unexplored_caves_01:0 "Cavernes Inexplorées"
  building_unexplored_caves_01:0 "Profondeurs Inconnues"
  building_unexplored_caves_01_desc:0 "Des galeries sombres et sinueuses s'enfoncent sous la surface, vierges de toute lumière comme de toute carte. Des murmures résonnent à travers la pierre, et chaque pas risque d'éveiller ce qui gît tapi dans les ténèbres. L'inconnu règne ici en maître, et le danger guette à chaque tournant."
  building_unexplored_caves_02:0 "Tunnels Balisés"
  building_unexplored_caves_02_desc:0 "Des explorateurs ont commencé à tracer des chemins à travers l'obscurité. Marques grossières et campements de fortune jalonnent les confins de notre connaissance, mais l'ombre dissimule encore bien des secrets. La menace s'est atténuée — mais demeure présente."
  building_unexplored_caves_03:0 "Cavernes Cartographiées"
  building_unexplored_caves_03_desc:0 "Les grottes ont livré leurs secrets. Les passages sont cartographiés, les dangers répertoriés, et la stabilité assurée. Bien que la prudence garde sa place, les entrailles sauvages de la terre ont été domptées."

  #Firewyrms
  building_type_firewyrm_lair:0 "Repaire de Veur de Feu"
  building_firewyrm_lair:0 "Repaire de Veur de Feu"
  building_firewyrm_lair_desc:0 "La terre est criblée de tunnels noircis et d'évents fumants. Un veur de feu s'est manifesté — bétail calciné, sols effondrés et chaleur montante témoignent de sa présence menaçante. Rares sont ceux qui osent s'en approcher."

  building_type_firewyrms_01:0 "Veurs de Feu"
  building_firewyrms_01:0 "Terriers Calcinés"
  building_firewyrms_01_desc:0 "La terre est criblée de tunnels noircis et d'évents fumants. Des veurs de feu ont été aperçus ou ressentis — bétail calciné, sols effondrés et chaleur montante témoignent de leur présence. Rares sont ceux qui osent pénétrer ces lieux maudits."
  building_firewyrms_02:0 "Tunnels Effondrés"
  building_firewyrms_02_desc:0 "Les créatures ont été repoussées plus profondément ou exterminées, et nombre de leurs galeries ont été scellées ou effondrées. Des tremblements occasionnels ou des bouffées de chaleur subsistent, mais le pire est passé."
  building_firewyrms_03:0 "Terre Refroidie"
  building_firewyrms_03_desc:0 "Le sol s'est stabilisé, les feux se sont éteints. Les veurs de feu ont été éradiqués ou ont fui hors de portée. Bien que la terre porte encore leurs cicatrices, on peut désormais y marcher en sécurité."

  #Hostile Swamp
  building_type_swamp:0 "Marécage Hostile"

  building_type_swamp_01_01:0 "$building_type_swamp$"
  building_swamp_01_01:0 "Terrain Bourbeux"
  building_swamp_01_01_desc:0 "Un sol mou et spongieux qui agrippe bottes et charrettes avec la même obstination. La progression ralentit, les structures s'enfoncent, et l'humidité s'infiltre partout. Une barrière naturelle à toute expansion."
  building_swamp_01_02:0 "Terres Drainées"
  building_swamp_01_02_desc:0 "Des canaux ont été creusés, des passerelles établies, et la terre gorgée d'eau commence à sécher. Le sol reste instable, mais cède peu à peu face à la persévérance et à la planification."
  building_swamp_01_03:0 "Marais Assainis"
  building_swamp_01_03_desc:0 "Jadis un obstacle, désormais une fondation. Le marécage a été drainé et remodelé en terrain exploitable, prêt à accueillir colonies et routes commerciales."

  building_type_swamp_02_01:0 "$building_type_swamp$"
  building_swamp_02_01:0 "Fondrière Engloutie"
  building_swamp_02_01_desc:0 "Une étendue traîtresse de vase et d'eaux stagnantes où chaque pas risque de vous entraîner dans la fange. Les fondations pourrissent, la maladie prolifère, et tout mouvement devient une lutte lente contre l'enlisement."
  building_swamp_02_02:0 "Fondrière Consolidée"
  building_swamp_02_02_desc:0 "Des passerelles surélevées et des supports de fortune contiennent la boue. La terre résiste encore au progrès, mais des efforts déterminés tracent peu à peu un chemin à travers la fange."
  building_swamp_02_03:0 "Fondrière Stabilisée"
  building_swamp_02_03_desc:0 "Le sol a été affermi et les eaux domptées. La fondrière ne menace plus d'engloutir quiconque s'y aventure. Elle garde les cicatrices du passé, mais se révèle désormais assez solide pour permettre la croissance."

  #Floods
  building_type_lv_floods_01:0 "Inondations"
  building_lv_floods_01:0 "Terres Submergées"
  building_lv_floods_01_desc:0 "Pluies diluviennes ou crues ont noyé la région, transformant routes en torrents et champs en bourbiers. Les colonies se retrouvent isolées, et le danger se tapit sous la surface des eaux."
  building_lv_floods_02:0 "Eaux en Retrait"
  building_lv_floods_02_desc:0 "Les eaux de crue ont commencé à refluer, bien que la terre demeure instable et périlleuse. Le nettoyage a débuté, mais les déplacements et la reconstruction restent limités."
  building_lv_floods_03:0 "Terrain Asséché"
  building_lv_floods_03_desc:0 "Les dernières eaux ont été détournées ou absorbées. Bien que la terre soit marquée et détrempée, elle redevient praticable, cultivable et propice à la construction."

  #Noxious Gases
  building_type_noxious_gases:0 "Vapeurs Nocives"

  building_type_noxious_gases_01_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_01_01:0 "Brume Épaisse"
  building_noxious_gases_01_01_desc:0 "Loin du cœur de l'éruption, les brumes volcaniques persistent. Ces vapeurs rampent au ras du sol, s'infiltrant dans fissures et creux, affaiblissant les imprudents et étouffant les négligents. C'est une menace plus discrète — mais non moins réelle."
  building_noxious_gases_01_02:0 "Brume Dissipée"
  building_noxious_gases_01_02_desc:0 "Les brumes vacillent, n'étant plus un mur mais un voile. Respirer devient plus aisé, bien que des bouffées occasionnelles de gaz rappellent encore les dangers passés. La guérison est en cours, mais la prudence doit guider chaque pas."
  building_noxious_gases_01_03:0 "Air Purifié"
  building_noxious_gases_01_03_desc:0 "Le temps et le vent ont accompli leur œuvre. La brume s'est levée, la terre respire à nouveau librement. Des traces du passé subsistent dans la cendre et les odeurs, mais le brouillard toxique qui hantait ces contrées s'est évanoui dans la mémoire."

  building_type_noxious_gases_02_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_02_01:0 "Fumées Asphyxiantes"
  building_noxious_gases_02_01_desc:0 "D'épaisses vapeurs âcres jaillissent des terres volcaniques, enveloppant tout d'une brume mortelle. Respirer devient un supplice, la visibilité est quasi nulle, et la vie se flétrit sous cet assaut impitoyable. Seuls les plus fous osent s'aventurer dans cette zone étouffée."
  building_noxious_gases_02_02:0 "Fumées Persistantes"
  building_noxious_gases_02_02_desc:0 "L'air demeure vicié, mais par quelque miracle le pire est passé. Le soufre imprègne chaque souffle, piquant yeux et poumons. Le danger subsiste — insidieux et tenace — mais ce n'est plus une condamnation immédiate."
  building_noxious_gases_02_03:0 "Air Purifié"
  building_noxious_gases_02_03_desc:0 "Les cieux ont commencé à s'éclaircir. Une légère trace de soufre persiste dans le vent, mais l'air redevient respirable. La vigilance reste nécessaire, mais le pire a été surmonté."

  #Stonemen Encampment
  building_type_stonemen_encampment_01:0 "Campement d'Hommes de Pierre"
  building_stonemen_encampment_01:0 "Campement Infesté"
  building_stonemen_encampment_01_desc:0 "Un amas de structures en ruines ou de cavernes est devenu le refuge d'hommes de pierre — créatures tordues, contagieuses et hostiles. Nul voyageur sensé n'ose s'en approcher sans protection."
  building_stonemen_encampment_02:0 "Zone en Quarantaine"
  building_stonemen_encampment_02_desc:0 "La plupart des affligés ont été chassés ou confinés. La zone demeure dangereuse et les récits de malédictions persistent, mais la menace principale a été maîtrisée."
  building_stonemen_encampment_03:0 "Terres Purifiées"
  building_stonemen_encampment_03_desc:0 "Le campement a été entièrement vidé. Par le feu, l'acier et une détermination sinistre, les hommes de pierre ont été chassés ou détruits. La terre n'est plus maudite — du moins, pas ouvertement."

  #Bandit Camp
  building_type_bandit_camps_01:0 "Camps de Bandits"
  building_bandit_camps_01:0 "Campement Sans Loi"
  building_bandit_camps_01_desc:0 "Un refuge notoire pour bandits, contrebandiers et déserteurs. Les routes commerciales sont périlleuses et les gens du coin vivent dans la terreur. Le camp doit être démantelé avant que la paix ne puisse revenir."
  building_bandit_camps_02:0 "Pillards Dispersés"
  building_bandit_camps_02_desc:0 "Le camp a été partiellement démantelé. Quelques hors-la-loi subsistent, frappant de manière opportuniste, mais leur pouvoir décline. Un dernier assaut les déracinera définitivement."
  building_bandit_camps_03:0 "Territoire Sécurisé"
  building_bandit_camps_03_desc:0 "Les derniers bandits ont été mis en déroute. Des patrouilles tiennent désormais la zone et l'ordre a été rétabli. Là où régnaient les lames, flottent maintenant des bannières."

  #Ruined/Abandoned holding
  building_type_ruined_holding:0 "Domaine en Ruines"

  building_type_small_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_small_ruined_holding_01:0 "Vestiges Écroulés"
  building_small_ruined_holding_01_desc:0 "Jadis un avant-poste mineur ou un petit domaine, désormais guère plus que gravats et végétation envahissante. Les ruines sont instables, sans défense, et d'usage limité jusqu'à ce qu'elles soient nettoyées et sécurisées."
  building_small_ruined_holding_02:0 "Fondations Consolidées"
  building_small_ruined_holding_02_desc:0 "Des efforts ont été déployés pour étayer les murs effondrés et dégager les décombres. Bien qu'encore loin d'être restaurée, la structure présente désormais moins de dangers et pourra bientôt être récupérée."
  building_small_ruined_holding_03:0 "Coque Restaurée"
  building_small_ruined_holding_03_desc:0 "Le domaine a été nettoyé en toute sécurité et les réparations de base achevées. Il redevient fonctionnel comme bastion mineur ou petite colonie — humble, mais non plus abandonné."

  building_type_medium_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_medium_ruined_holding_01:0 "Forteresse Brisée"
  building_medium_ruined_holding_01_desc:0 "Ce fort ou domaine autrefois modeste est tombé en décrépitude. Ses tours penchent, ses salles gisent silencieuses, et des dangers se tapissent dans la décomposition."
  building_medium_ruined_holding_02:0 "Terres Sécurisées"
  building_medium_ruined_holding_02_desc:0 "Les pires menaces ont été éliminées, et le site peut désormais être habité ou reconstruit. Bien que la gloire soit perdue, l'ossature demeure solide."
  building_medium_ruined_holding_03:0 "Domaine Reconquis"
  building_medium_ruined_holding_03_desc:0 "Grâce à un travail constant et à la patience, la ruine a été stabilisée et remise en fonction. Elle se dresse prête à servir à nouveau, même si ses bannières sont nouvelles."

  building_type_large_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_large_ruined_holding_01:0 "Héritage Déchu"
  building_large_ruined_holding_01_desc:0 "Le site porte les cicatrices d'un passé grandiose — une cité antique ou une forteresse désormais perdue dans les brumes du temps. Son immensité n'a d'égale que les dangers dissimulés en son sein."
  building_large_ruined_holding_02:0 "Ruine Domptée"
  building_large_ruined_holding_02_desc:0 "Les efforts de déblaiement ont imposé l'ordre au chaos. Les grandes salles ne sont plus périlleuses, et des chemins à travers l'épave ont été sécurisés. La ruine respire à nouveau, fût-ce faiblement."
  building_large_ruined_holding_03:0 "Siège Ressuscité"
  building_large_ruined_holding_03_desc:0 "Le site n'est plus une ruine, mais une fondation. Bien que des échos de sa grandeur perdue subsistent, il sert désormais un nouveau dessein — rené à votre image, prêt à façonner le monde une fois encore."
  
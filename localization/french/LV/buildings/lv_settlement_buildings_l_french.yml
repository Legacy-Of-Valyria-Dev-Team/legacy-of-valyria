 #Caves
 building_type_unexplored_caves_01:0 "Grottes Inexplorées"
 building_unexplored_caves_01:0 "Profondeurs Inconnues"
 building_unexplored_caves_01_desc:0 "De sombres tunnels sinueux s'enfoncent sous la surface, jamais touchés par la lumière ni par la carte. Des murmures résonnent à travers la pierre, et chaque pas risque de réveiller ce qui s'y dissimule. L'inconnu y règne, et le danger y est une certitude."
 building_unexplored_caves_02:0 "Tunnels Balisés"
 building_unexplored_caves_02_desc:0 "Des explorateurs ont commencé à tracer des chemins à travers l'obscurité. Marquages grossiers et campements de fortune jalonnent les limites de ce qui est connu, mais l'essentiel demeure enveloppé d'ombre. La menace s'est atténuée, sans avoir disparu."
 building_unexplored_caves_03:0 "Cavernes Cartographiées"
 building_unexplored_caves_03_desc:0 "Les grottes ont livré leurs secrets. Les chemins sont cartographiés, les dangers répertoriés, la stabilité assurée. La prudence garde sa place, mais les entrailles sauvages de la terre ont été domptées."

 #Firewyrms
 building_type_firewyrm_lair:0 "Tanière du Veur de Feu"
 building_firewyrm_lair:0 "Tanière du Veur de Feu"
 building_firewyrm_lair_desc:0 "La terre est constellée de tunnels calcinés et d'évents fumants. Un veur de feu s'est fait sentir ou apercevoir — bétail carbonisé, sol effondré et chaleur montante trahissent sa présence. Bien peu osent s'y aventurer."

 building_type_firewyrms_01:0 "Veurs de Feu"
 building_firewyrms_01:0 "Repaires Calcinés"
 building_firewyrms_01_desc:0 "La terre est constellée de tunnels calcinés et d'évents fumants. Des veurs de feu ont été aperçus ou ressentis — bétail carbonisé, sol effondré et chaleur montante trahissent leur présence. Bien peu osent s'y aventurer."
 building_firewyrms_02:0 "Tunnels Effondrés"
 building_firewyrms_02_desc:0 "Les créatures ont été repoussées vers les profondeurs ou abattues, et nombre de leurs tunnels ont été scellés ou se sont effondrés. Quelques tremblements ou bouffées de chaleur subsistent encore, mais le pire est passé."
 building_firewyrms_03:0 "Terre Refroidie"
 building_firewyrms_03_desc:0 "Le sol s'est stabilisé, les feux se sont éteints. Les veurs de feu ont été exterminés ou ont fui hors de portée. Bien que la terre porte encore leurs cicatrices, on peut à nouveau la fouler sans crainte."

 #Hostile Swamp
 building_type_swamp:0 "Marécage Hostile"

 building_type_swamp_01_01:0 "$building_type_swamp$"
 building_swamp_01_01:0 "Terrain Embourbé"
 building_swamp_01_01_desc:0 "Un sol mou et spongieux happe bottes et charrettes. La progression ralentit, les structures s'enfoncent, et l'humidité s'infiltre partout. Un obstacle naturel à l'expansion."
 building_swamp_01_02:0 "Terrains Drainés"
 building_swamp_01_02_desc:0 "Des canaux ont été creusés, des passerelles posées, et la terre humide commence à sécher. Le sol demeure instable, mais il cède peu à peu devant la persévérance et la planification."
 building_swamp_01_03:0 "Zones Humides Récupérées"
 building_swamp_01_03_desc:0 "Jadis un obstacle, désormais une fondation. Le marécage a été asséché et remodelé en un terrain exploitable, prêt à soutenir colonies et voies d'approvisionnement."

 building_type_swamp_02_01:0 "$building_type_swamp$"
 building_swamp_02_01:0 "Fondrière Engloutie"
 building_swamp_02_01_desc:0 "Une étendue périlleuse de vase et d'eau stagnante où chaque pas risque une chute dans le bourbier. Les fondations pourrissent, la maladie couve, et se déplacer relève d'une lutte lente et étouffante."
 building_swamp_02_02:0 "Fondrière Renforcée"
 building_swamp_02_02_desc:0 "Des chemins surélevés et des étais de fortune contiennent la vase. Le terrain résiste encore, mais un effort déterminé y taille peu à peu un passage."
 building_swamp_02_03:0 "Fondrière Stabilisée"
 building_swamp_02_03_desc:0 "Le sol s'est raffermi et l'eau a été maîtrisée. La fondrière ne menace plus d'engloutir quiconque s'y aventure. Elle porte peut-être encore les cicatrices du passé, mais elle est désormais assez solide pour permettre le développement."

 #Floods
 building_type_lv_floods_01:0 "Inondations"
 building_lv_floods_01:0 "Terres Submergées"
 building_lv_floods_01_desc:0 "De fortes pluies ou des eaux montantes ont submergé la région, changeant les routes en rivières et les champs en bourbiers. Les colonies sont coupées du monde, et le danger guette sous la surface."
 building_lv_floods_02:0 "Eaux en Retrait"
 building_lv_floods_02_desc:0 "Les eaux de crue commencent à se retirer, bien que le terrain demeure instable et périlleux. Le nettoyage a débuté, mais déplacements et reconstruction restent limités."
 building_lv_floods_03:0 "Terrain Asséché"
 building_lv_floods_03_desc:0 "Les dernières eaux ont été détournées ou absorbées. Bien que la terre reste marquée et détrempée, elle est de nouveau praticable, cultivable, et prête à accueillir de nouvelles constructions."

 #Noxious Gases
 building_type_noxious_gases:0 "Gaz Toxiques"

 building_type_noxious_gases_01_01:0 "$building_type_noxious_gases$"
 building_noxious_gases_01_01:0 "Brume Dense"
 building_noxious_gases_01_01_desc:0 "Loin du cœur de l'éruption, les brumes volcaniques s'attardent encore. Ces vapeurs rampent au ras du sol, s'infiltrant dans les fissures et les creux, affaiblissant les imprudents et étouffant les négligents. Une menace plus discrète, mais tout aussi réelle."
 building_noxious_gases_01_02:0 "Brume qui S'amenuise"
 building_noxious_gases_01_02_desc:0 "Les brumes vacillent, réduites à présent à un voile ténu. Respirer devient plus aisé, bien qu'une bourrasque de gaz occasionnelle provoque encore une brûlure et une toux. Le rétablissement est en cours, mais la prudence reste de mise."
 building_noxious_gases_01_03:0 "Air Apaisé"
 building_noxious_gases_01_03_desc:0 "Le temps et le vent ont fait leur œuvre. La brume s'est dissipée, la terre respire à nouveau librement. Des traces du passé subsistent dans la cendre et l'odeur, mais le brouillard nocif qui affligeait ces terres s'est estompé dans les mémoires."

 building_type_noxious_gases_02_01:0 "$building_type_noxious_gases$"
 building_noxious_gases_02_01:0 "Fumées Suffocantes"
 building_noxious_gases_02_01_desc:0 "D'épais gaz âcres jaillissent de la terre volcanique, enveloppant tout d'une brume mortelle. Respirer devient un combat, la visibilité frôle le néant, et la vie se flétrit sous cet assaut incessant. Seuls les plus fous des hommes osent s'aventurer dans la zone étouffée."
 building_noxious_gases_02_02:0 "Fumées Persistantes"
 building_noxious_gases_02_02_desc:0 "L'air demeure vicié, mais par quelque miracle le pire est passé. Le soufre imprègne chaque souffle, brûlant les yeux et les poumons. Le danger persiste — insidieux et tenace — mais il n'est plus une sentence de mort immédiate."
 building_noxious_gases_02_03:0 "Air Apaisé"
 building_noxious_gases_02_03_desc:0 "Le ciel commence à se dégager. Une faible trace de soufre subsiste dans le vent, mais l'air redevient propice à la vie. La vigilance reste de mise, mais le pire a été surmonté."

 #Stonemen Encampment
 building_type_stonemen_encampment_01:0 "Campement des Hommes de Pierre"
 building_stonemen_encampment_01:0 "Campement Infesté"
 building_stonemen_encampment_01_desc:0 "Un amas de structures en ruine ou de grottes est devenu le repaire des hommes de pierre : difformes, contagieux et hostiles. Nul voyageur sain d'esprit n'ose en approcher sans protection."
 building_stonemen_encampment_02:0 "Zone en Quarantaine"
 building_stonemen_encampment_02_desc:0 "La plupart des affligés ont été chassés ou confinés. La zone demeure dangereuse, et les récits de malédiction persistent, mais la pire des menaces a été maîtrisée."
 building_stonemen_encampment_03:0 "Terrain Purgé"
 building_stonemen_encampment_03_desc:0 "Le campement a été entièrement débarrassé de ses occupants. Par le feu, l'acier et une résolution sans faille, les hommes de pierre ont été chassés ou anéantis. La terre n'est plus maudite. Du moins, plus ouvertement."

 #Bandit Camp
 building_type_bandit_camps_01:0 "Camps de Bandits"
 building_bandit_camps_01:0 "Campement Hors-la-Loi"
 building_bandit_camps_01_desc:0 "Un refuge connu pour bandits, contrebandiers et déserteurs. Les routes commerciales n'y sont pas sûres, et les habitants vivent dans la peur. Le camp doit être démantelé avant que la paix ne puisse revenir."
 building_bandit_camps_02:0 "Pillards Dispersés"
 building_bandit_camps_02_desc:0 "Le camp a été en partie démantelé. Quelques hors-la-loi subsistent, frappant à l'occasion, mais leur puissance décline. Un dernier effort suffira à les déraciner."
 building_bandit_camps_03:0 "Territoire Sécurisé"
 building_bandit_camps_03_desc:0 "Les derniers bandits ont été mis en déroute. Des patrouilles tiennent désormais la région, et l'ordre a été rétabli. Là où les lames régnaient jadis, des bannières flottent à présent."

 #Ruined/Abandoned holding
 building_type_ruined_holding:0 "Possession en Ruines"

 building_type_small_ruined_holding_01:0 "$building_type_ruined_holding$"
 building_small_ruined_holding_01:0 "Vestiges Croulants"
 building_small_ruined_holding_01_desc:0 "Jadis un modeste avant-poste ou domaine, aujourd'hui à peine plus que gravats et broussailles. Les ruines sont instables, sans garde, et d'une utilité limitée tant qu'elles n'auront pas été dégagées et sécurisées."
 building_small_ruined_holding_02:0 "Fondations Stabilisées"
 building_small_ruined_holding_02_desc:0 "Des efforts ont été entrepris pour étayer les murs brisés et dégager les décombres. Bien que loin d'être restaurée, la structure présente désormais moins de dangers et pourrait bientôt être remise en usage."
 building_small_ruined_holding_03:0 "Coquille Restaurée"
 building_small_ruined_holding_03_desc:0 "La possession a été dégagée en toute sécurité et les réparations essentielles achevées. Elle redevient utilisable comme modeste bastion ou colonie : humble, mais plus délaissée."

 building_type_medium_ruined_holding_01:0 "$building_type_ruined_holding$"
 building_medium_ruined_holding_01:0 "Forteresse Brisée"
 building_medium_ruined_holding_01_desc:0 "Ce fort ou domaine jadis modeste est tombé en décrépitude. Ses tours penchent, ses halls demeurent silencieux, et des dangers rôdent dans la décrépitude."
 building_medium_ruined_holding_02:0 "Terrain Sécurisé"
 building_medium_ruined_holding_02_desc:0 "Les pires menaces ont été écartées, et le site peut désormais être habité ou reconstruit en toute sécurité. La gloire a disparu, mais l'ossature de sa force demeure."
 building_medium_ruined_holding_03:0 "Possession Récupérée"
 building_medium_ruined_holding_03_desc:0 "Grâce à un travail constant et à la patience, la ruine a été stabilisée et rendue à son utilité. Elle se tient prête à servir à nouveau, même sous de nouvelles bannières."

 building_type_large_ruined_holding_01:0 "$building_type_ruined_holding$"
 building_large_ruined_holding_01:0 "Héritage Déchu"
 building_large_ruined_holding_01_desc:0 "Ce site porte les cicatrices d'un passé grandiose : une cité ou une forteresse antique désormais engloutie par le temps. Son immensité n'a d'égal que les dangers qui s'y dissimulent."
 building_large_ruined_holding_02:0 "Ruine Domptée"
 building_large_ruined_holding_02_desc:0 "Les efforts de déblaiement ont taillé l'ordre dans le chaos. Les grandes salles ne sont plus périlleuses, et des chemins ont été sécurisés à travers les décombres. La ruine respire à nouveau, ne serait-ce que faiblement."
 building_large_ruined_holding_03:0 "Siège Ranimé"
 building_large_ruined_holding_03_desc:0 "Le site constitue désormais une fondation sur laquelle une puissance perdue a été reconquise. Bien que des échos de sa grandeur passée subsistent, il sert à présent un nouveau dessein : un symbole renaissant à votre image, prêt à façonner le monde une fois encore."

#Colony
 #Colony Buildings
  building_type_local_markets_01:0 "Marchés Locaux"
  building_local_markets_01:0 "Marchés Locaux"
  building_local_markets_01_desc:0 "Un réseau de places marchandes animées où les négociants vantent leurs marchandises, les fermiers échangent leurs récoltes et les artisans vendent leurs ouvrages. Ces marchés forment le cœur économique de la colonie, assurant un flux constant de biens, de pièces et de prospérité."

  building_type_colony_quarries_01:0 "Carrières"
  building_colony_quarries_01:0 "Carrières de Pierre Rudimentaires"
  building_colony_quarries_01_desc:0 "Des carrières de pierre aisément accessibles fournissent les matériaux de construction nécessaires aux édifices environnants."

  building_type_colony_forestry_01:0 "Exploitations Forestières"
  building_colony_forestry_01:0 "Camps de Bûcherons"
  building_colony_forestry_01_desc:0 "Des bûcherons ont établi leur campement aux abords de la forêt, assurant une production régulière de grumes."

  building_type_colony_port_01:0 "Ports"
  building_colony_port_01:0 "Port Colonial"
  building_colony_port_01_desc:0 "Un port dédié qui facilite le commerce et le transport, stimulant l'économie et la connectivité de la colonie."

  #Blockers
	lv_wilderness_blocker_effect:0 "@warning_icon! #X Ce bâtiment est un obstacle qui doit être éliminé en l'améliorant entièrement avant que la colonie puisse devenir un domaine à part entière#!"
  lv_wilderness_blocker_effect_mines:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Des Vouivres de Feu risquent d'émerger chaque année et ravageront la colonie#!"
  lv_wilderness_blocker_effect_plague:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Risque de déclencher une épidémie chaque année#!"
  lv_wilderness_blocker_effect_raid:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Risque de raids sur la colonie chaque année#!"
  lv_firewyrm_blocker_effect:0 "@warning_icon! #X Ce bâtiment est un obstacle qui doit être éliminé en tuant la vouivre de feu de cette province avant que la colonie puisse devenir un domaine à part entière#!"

  #Caves
  building_type_unexplored_caves_01:0 "Grottes Inexplorées"
  building_unexplored_caves_01:0 "Profondeurs Inconnues"
  building_unexplored_caves_01_desc:0 "De sombres tunnels sinueux s'étendent sous la surface, jamais effleurés par la lumière ni cartographiés. Des murmures résonnent à travers la pierre, et chaque pas risque d'éveiller ce qui se cache dans les ténèbres. L'inconnu règne ici, et le danger est une certitude."
  building_unexplored_caves_02:0 "Tunnels Balisés"
  building_unexplored_caves_02_desc:0 "Des explorateurs ont commencé à tracer des chemins à travers les ténèbres. Des marques grossières et des campements de fortune jalonnent les limites de notre connaissance, mais bien des mystères demeurent voilés d'ombre. La menace s'est atténuée — sans pour autant disparaître."
  building_unexplored_caves_03:0 "Cavernes Arpentées"
  building_unexplored_caves_03_desc:0 "Les grottes ont livré leurs secrets. Les passages sont cartographiés, les dangers répertoriés, et la stabilité acquise. Bien que la prudence reste de mise, ces étendues souterraines sauvages ont été maîtrisées."

  #Firewyrms
  building_type_firewyrm_lair:0 "Repaire de Vouivre de Feu"
  building_firewyrm_lair:0 "Repaire de Vouivre de Feu"
  building_firewyrm_lair_desc:0 "La terre est criblée de tunnels noircis et de fumerolles incandescentes. Une vouivre de feu a été aperçue ou ressentie — bétail calciné, sol effondré et chaleur montante témoignent de sa présence. Rares sont ceux qui osent s'y aventurer."

  building_type_firewyrms_01:0 "Vouivres de Feu"
  building_firewyrms_01:0 "Terriers Calcinés"
  building_firewyrms_01_desc:0 "La terre est criblée de tunnels noircis et de fumerolles incandescentes. Des vouivres de feu ont été aperçues ou ressenties — bétail calciné, sol effondré et chaleur montante témoignent de leur présence. Rares sont ceux qui osent s'y aventurer."
  building_firewyrms_02:0 "Tunnels Effondrés"
  building_firewyrms_02_desc:0 "Les créatures ont été repoussées dans les profondeurs ou exterminées, et nombre de leurs tunnels ont été scellés ou effondrés. Des tremblements occasionnels ou des bouffées de chaleur persistent, mais le pire est passé."
  building_firewyrms_03:0 "Terre Refroidie"
  building_firewyrms_03_desc:0 "Le sol s'est stabilisé, les feux se sont éteints. Les vouivres de feu ont été éradiquées ou ont fui hors de portée. Bien que la terre porte encore leurs cicatrices, on peut désormais y marcher sans crainte."

  #Hostile Swamp
  building_type_swamp:0 "Marécage Hostile"

  building_type_swamp_01_01:0 "$building_type_swamp$"
  building_swamp_01_01:0 "Terrain Embourbé"
  building_swamp_01_01_desc:0 "Un sol mou et spongieux qui engloutit bottes et chariots sans distinction. La progression ralentit, les structures s'enfoncent, et l'humidité s'infiltre partout. Une barrière naturelle à toute expansion."
  building_swamp_01_02:0 "Terres Drainées"
  building_swamp_01_02_desc:0 "Des canaux ont été creusés, des passerelles posées, et la terre gorgée d'eau commence à s'assécher. Le terrain reste instable, mais il cède face à la persévérance et la planification."
  building_swamp_01_03:0 "Zones Humides Reconquises"
  building_swamp_01_03_desc:0 "Jadis obstacle, désormais fondation. Le marécage a été drainé et remodelé en terrain exploitable, prêt à accueillir colonies et voies d'approvisionnement."

  building_type_swamp_02_01:0 "$building_type_swamp$"
  building_swamp_02_01:0 "Fondrière Engloutissante"
  building_swamp_02_02_desc:0 "Une étendue traîtresse de fange et d'eaux stagnantes où chaque pas risque de vous précipiter dans la tourbe. Les fondations pourrissent, les maladies prolifèrent, et tout déplacement devient une lente noyade."
  building_swamp_02_02:0 "Fondrière Renforcée"
  building_swamp_02_02_desc:0 "Des chemins surélevés et des supports de fortune tiennent la boue à distance. La terre résiste au progrès, mais des efforts déterminés tracent un passage à travers la vase."
  building_swamp_02_03:0 "Fondrière Stabilisée"
  building_swamp_02_03_desc:0 "Le sol a été raffermi et les eaux domptées. La fondrière ne menace plus d'engloutir tous ceux qui s'y aventurent. Elle porte encore les stigmates du passé, mais elle est désormais assez solide pour permettre le développement."

  #Floods
  building_type_lv_floods_01:0 "Inondations"
  building_lv_floods_01:0 "Terres Submergées"
  building_lv_floods_01_desc:0 "De fortes pluies ou la montée des eaux ont submergé la région, transformant les routes en rivières et les champs en bourbiers. Les colonies sont isolées, et le danger guette sous la surface."
  building_lv_floods_02:0 "Eaux en Retrait"
  building_lv_floods_02_desc:0 "Les eaux de crue ont commencé à se retirer, bien que la terre reste instable et traîtresse. Le nettoyage a commencé, mais les déplacements et la reconstruction demeurent limités."
  building_lv_floods_03:0 "Terrain Asséché"
  building_lv_floods_03_desc:0 "Les dernières eaux ont été détournées ou absorbées. Bien que la terre soit marquée et détrempée, elle est de nouveau praticable, cultivable et propice à de nouvelles constructions."

  #Noxious Gases
  building_type_noxious_gases:0 "Gaz Nocifs"

  building_type_noxious_gases_01_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_01_01:0 "Brume Épaisse"
  building_noxious_gases_01_01_desc:0 "Loin du cœur de l'éruption, les brumes volcaniques s'accumulent encore. Ces vapeurs rampent au ras du sol, s'infiltrant dans les fissures et les creux, affaiblissant les imprudents et asphyxiant les négligents. Une menace plus discrète — mais tout aussi réelle."
  building_noxious_gases_01_02:0 "Brume Déclinante"
  building_noxious_gases_01_02_desc:0 "Les brumes vacillent, n'étant plus un mur mais un voile. La respiration est plus aisée, bien que des bouffées de gaz occasionnelles rappellent encore les dangers passés. La récupération est en cours, mais la prudence doit guider chaque pas."
  building_noxious_gases_01_03:0 "Air Assaini"
  building_noxious_gases_01_03_desc:0 "Le temps et le vent ont fait leur œuvre. La brume s'est levée, la terre respire librement à nouveau. Des traces du passé demeurent dans les cendres et les effluves, mais le brouillard nocif qui accablait ces terres s'est dissipé dans la mémoire."

  building_type_noxious_gases_02_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_02_01:0 "Fumées Suffocantes"
  building_noxious_gases_02_01_desc:0 "D'épais gaz âcres s'échappent de la terre volcanique, recouvrant tout d'une brume mortelle. Respirer est un combat, la visibilité est quasi nulle, et toute vie dépérit sous cet assaut implacable. Seuls les plus fous osent pénétrer dans cette zone asphyxiée."
  building_noxious_gases_02_02:0 "Fumées Persistantes"
  building_noxious_gases_02_02_desc:0 "L'air reste vicié, mais par quelque miracle, le pire est passé. Le soufre imprègne chaque souffle, brûlant les yeux et les poumons. Le danger est toujours présent — insidieux et tenace — mais ce n'est plus une condamnation à mort immédiate."
  building_noxious_gases_02_03:0 "Air Assaini"
  building_noxious_gases_02_03_desc:0 "Les cieux ont commencé à s'éclaircir. Une légère trace de soufre persiste dans le vent, mais l'air est à nouveau propice à la vie. La vigilance reste de mise, mais le pire a été surmonté."

  #Stonemen Encampment
  building_type_stonemen_encampment_01:0 "Campement d'Hommes de Pierre"
  building_stonemen_encampment_01:0 "Campement Infesté"
  building_stonemen_encampment_01_desc:0 "Un amas de structures en ruine ou de grottes est devenu le refuge d'hommes de pierre — difformes, contagieux et hostiles. Aucun voyageur sensé n'ose s'en approcher sans protection."
  building_stonemen_encampment_02:0 "Zone de Quarantaine"
  building_stonemen_encampment_02_desc:0 "La plupart des affligés ont été chassés ou contenus. La zone reste dangereuse, et les récits de malédiction persistent, mais la pire menace a été maîtrisée."
  building_stonemen_encampment_03:0 "Terres Purgées"
  building_stonemen_encampment_03_desc:0 "Le campement a été entièrement nettoyé. Par le feu, l'acier et une sinistre détermination, les hommes de pierre ont été chassés ou anéantis. La terre n'est plus maudite — du moins, pas ouvertement."

  #Bandit Camp
  building_type_bandit_camps_01:0 "Camps de Bandits"
  building_bandit_camps_01:0 "Repaire de Hors-la-loi"
  building_bandit_camps_01_desc:0 "Un refuge notoire pour bandits, contrebandiers et déserteurs. Les routes commerciales sont dangereuses, et les habitants vivent dans la peur. Le camp doit être détruit avant que la paix ne puisse revenir."
  building_bandit_camps_02:0 "Pillards Dispersés"
  building_bandit_camps_02_desc:0 "Le camp a été partiellement démantelé. Quelques hors-la-loi subsistent, frappant de façon opportuniste, mais leur pouvoir décline. Un dernier assaut les délogera définitivement."
  building_bandit_camps_03:0 "Territoire Sécurisé"
  building_bandit_camps_03_desc:0 "Les derniers bandits ont été mis en déroute. Des patrouilles tiennent désormais la zone, et l'ordre a été restauré. Là où régnaient les lames, flottent maintenant les bannières."

  #Ruined/Abandoned holding
  building_type_ruined_holding:0 "Domaine en Ruines"

  building_type_small_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_small_ruined_holding_01:0 "Vestiges Croulants"
  building_small_ruined_holding_01_desc:0 "Jadis avant-poste mineur ou petit domaine, ce n'est plus qu'un amas de gravats envahi par la végétation. Les ruines sont instables, sans défense, et d'utilité limitée tant qu'elles n'auront pas été déblayées et sécurisées."
  building_small_ruined_holding_02:0 "Fondations Stabilisées"
  building_small_ruined_holding_02_desc:0 "Des efforts ont été entrepris pour étayer les murs effondrés et déblayer les débris. Bien qu'encore loin d'être restaurée, la structure présente désormais moins de dangers et pourra bientôt être récupérée."
  building_small_ruined_holding_03:0 "Carcasse Restaurée"
  building_small_ruined_holding_03_desc:0 "Le domaine a été sécurisé et les réparations de base achevées. Il est à nouveau utilisable comme bastion mineur ou colonie — humble, mais plus abandonné."

  building_type_medium_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_medium_ruined_holding_01:0 "Forteresse Brisée"
  building_medium_ruined_holding_01_desc:0 "Ce fort ou domaine jadis modeste est tombé en décrépitude. Ses tours penchent, ses salles gisent dans le silence, et des périls rôdent au cœur de la désolation."
  building_medium_ruined_holding_02:0 "Enceinte Sécurisée"
  building_medium_ruined_holding_02_desc:0 "Les pires menaces ont été éliminées, et le site est désormais sûr pour l'habitation ou la reconstruction. La gloire s'en est allée, mais l'ossature de sa puissance demeure."
  building_medium_ruined_holding_03:0 "Domaine Reconquis"
  building_medium_ruined_holding_03_desc:0 "Par un labeur constant et de la patience, la ruine a été stabilisée et remise en service. Elle se tient prête à servir à nouveau, même si ses bannières sont nouvelles."

  building_type_large_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_large_ruined_holding_01:0 "Héritage Déchu"
  building_large_ruined_holding_01_desc:0 "Ce site porte les cicatrices d'un passé grandiose — une cité antique ou une forteresse perdue dans les brumes du temps. Son immensité n'a d'égale que les périls qui s'y dissimulent."
  building_large_ruined_holding_02:0 "Ruine Domptée"
  building_large_ruined_holding_02_desc:0 "Les travaux de déblaiement ont forgé l'ordre à partir du chaos. Les grandes salles ne sont plus périlleuses, et des chemins à travers les décombres ont été sécurisés. La ruine respire à nouveau, même si c'est faiblement."
  building_large_ruined_holding_03:0 "Siège Ressuscité"
  building_large_ruined_holding_03_desc:0 "Le site n'est plus une ruine, mais une fondation. Bien que les échos de sa grandeur perdue persistent, il sert désormais un nouveau dessein — renaissant à votre image, prêt à façonner le monde une fois encore."

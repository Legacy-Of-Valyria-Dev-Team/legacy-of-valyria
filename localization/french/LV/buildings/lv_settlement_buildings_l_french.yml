 #Colony
 #Colony Buildings
 building_type_local_markets_01:0 "Marchés Locaux"
 building_local_markets_01:0 "Marchés Locaux"
 building_local_markets_01_desc:0 "Un réseau de places de marché animées où marchands proposent leurs marchandises, fermiers échangent leurs récoltes et artisans vendent leurs ouvrages. Ces marchés forment le cœur économique de la colonie, garantissant un flux constant de biens, de monnaie et de prospérité."

 building_type_colony_quarries_01:0 "Carrières"
 building_type_colony_quarries_01_desc:0 "Une pierre de taille aisément accessible fournit des matériaux de construction pour les bâtisses avoisinantes."
 building_colony_quarries_01:0 "Carrières de Pierre Simples "
 building_colony_quarries_01_desc:0 "Une pierre de taille aisément accessible fournit des matériaux de construction pour les bâtisses avoisinantes."

 building_type_colony_forestry_01:0 "Exploitations Forestières"
 building_colony_forestry_01:0 "Camps de Bûcherons"
 building_colony_forestry_01_desc:0 "Des bûcherons ont établi leur campement à l'orée de la forêt, assurant une production constante de bois."

 building_type_colony_port_01:0 "Ports"
 building_colony_port_01:0 "Port de la Colonie"
 building_colony_port_01_desc:0 "Un port dédié qui facilite le commerce et le transport, stimulant l'économie et la connectivité de la colonie."
 building_type_colony_port_01_desc:0 "Un port dédié qui facilite le commerce et le transport, stimulant l'économie et la connectivité de la colonie."

 #Blockers
 lv_wilderness_blocker_effect:0 "@warning_icon! #X Ce bâtiment est un obstacle qui doit être entièrement amélioré avant que la colonie ne puisse devenir une possession à part entière#!"

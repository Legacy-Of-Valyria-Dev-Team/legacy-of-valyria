#Colony
 #Colony Buildings
  building_type_local_markets_01:0 "Marchés Locaux"
  building_type_local_markets_01_desc:0 "Un entrelacs de places marchandes où les négociants étalent leurs denrées exotiques, les fermiers troquent leurs moissons, et les artisans proposent leurs ouvrages. Ces marchés forment le cœur battant de la colonie, garantissant le flux vital des marchandises, de l'or et de la prospérité."
  building_local_markets_01:0 "Marchés Locaux"
  building_local_markets_01_desc:0 "Un entrelacs de places marchandes où les négociants étalent leurs denrées exotiques, les fermiers troquent leurs moissons, et les artisans proposent leurs ouvrages. Ces marchés forment le cœur battant de la colonie, garantissant le flux vital des marchandises, de l'or et de la prospérité."

  #building_type_local_militia_01:0 "Local Militia"
  #building_type_local_militia_01_desc:0 "A loosely trained force of able-bodied townsfolk, armed with whatever weapons can be mustered. Though no match for professional soldiers, these militia serve as the first line of defense against raiders, bandits, and other threats to the settlement."
  #building_local_militia_01:0 "Local Militia"
  #building_local_militia_01_desc:0 "A loosely trained force of able-bodied townsfolk, armed with whatever weapons can be mustered. Though no match for professional soldiers, these militia serve as the first line of defense against raiders, bandits, and other threats to the settlement."

  #building_type_stockades_01:0 "Stockades"
  #building_type_stockades_01_desc:0 "A simple but effective fortification, consisting of wooden palisades. While not impervious to a determined assault, stockades provide much needed security against sudden attacks and help maintain order within the settlement."
  #building_stockades_01:0 "Stockades"
  #building_stockades_01_desc:0 "A simple but effective fortification, consisting of wooden palisades. While not impervious to a determined assault, stockades provide much needed security against sudden attacks and help maintain order within the settlement."

  #building_type_construction_guilds_01:0 "Construction Guilds"
  #building_type_construction_guilds_01_desc:0 "A coalition of skilled masons, carpenters, and engineers dedicated to improving the settlement’s infrastructure. With their expertise, buildings rise faster, stronger, and more efficiently, shaping the foundation of future growth."
  #building_construction_guilds_01:0 "Construction Guilds"
  #building_construction_guilds_01_desc:0 "A coalition of skilled masons, carpenters, and engineers dedicated to improving the settlement’s infrastructure. With their expertise, buildings rise faster, stronger, and more efficiently, shaping the foundation of future growth."

  building_type_colony_quarries_01:0 "Carrières"
  building_type_colony_quarries_01_desc:0 "La pierre arrachée aux entrailles de la terre fournit les matériaux essentiels aux constructions environnantes."
  building_colony_quarries_01:0 "Carrières de Pierre Rudimentaires"
  building_colony_quarries_01_desc:0 "La pierre arrachée aux entrailles de la terre fournit les matériaux essentiels aux constructions environnantes."

  building_type_colony_forestry_01:0 "Exploitations Forestières"
  building_type_colony_forestry_01_desc:0 "D'immenses quantités de bois d'œuvre, de résine, de charbon et d'autres ressources vitales sont extraites de ces forêts ancestrales, fournissant les matériaux indispensables aux bourgades environnantes."
  building_colony_forestry_01:0 "Camps de Bûcherons"
  building_colony_forestry_01_desc:0 "Les bûcherons ont établi leurs campements aux lisières de la forêt, garantissant un approvisionnement constant en bois de construction."

  #Blockers
	lv_wilderness_blocker_effect:0 "@warning_icon! #X Ce bâtiment est un obstacle qui doit être éliminé en l'améliorant complètement avant que la colonie puisse devenir une possession légitime#!"
  lv_wilderness_blocker_effect_mines:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Des vouivres de feu peuvent émerger chaque année et ravageront la colonie#!"
  lv_wilderness_blocker_effect_plague:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Risque de déclencher une épidémie de peste chaque année#!"
  lv_wilderness_blocker_effect_raid:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Risque de déclencher des raids sur la colonie chaque année#!"
  lv_firewyrm_blocker_effect:0 "@warning_icon! #X Ce bâtiment est un obstacle qui doit être éliminé en tuant la vouivre de feu de cette province avant que la colonie puisse devenir une possession légitime#!"

  #Caves
  building_type_unexplored_caves_01:0 "Cavernes Inexplorées"
  building_unexplored_caves_01:0 "Profondeurs Inconnues"
  building_unexplored_caves_01_desc:0 "Des tunnels sombres et sinueux s'étendent sous la surface, vierges de toute lumière ou carte. Des murmures résonnent dans la pierre, et chaque pas risque de réveiller ce qui sommeille dans l'ombre. L'inconnu règne ici en maître, et le danger est une certitude absolue."
  building_unexplored_caves_02:0 "Galeries Balisées"
  building_unexplored_caves_02_desc:0 "Des explorateurs téméraires ont commencé à tracer des chemins dans les ténèbres. Des marques rudimentaires et des campements de fortune délimitent les frontières du connu, mais beaucoup reste voilé dans l'ombre. La menace s'est atténuée—mais elle n'a pas disparu."
  building_unexplored_caves_03:0 "Cavernes Cartographiées"
  building_unexplored_caves_03_desc:0 "Les grottes ont livré leurs secrets ancestraux. Les chemins sont tracés, les dangers répertoriés, et une stabilité précaire a été établie. Bien que la prudence reste de mise, les profondeurs sauvages ont été domptées."

  #Firewyrms
  building_type_firewyrm_lair:0 "Antre de Vouivre de Feu"
  building_firewyrm_lair:0 "Antre de Vouivre de Feu"
  building_firewyrm_lair_desc:0 "La terre est criblée de tunnels noircis et de cheminées fumantes. Une vouivre de feu a laissé sa marque—bétail carbonisé, sol effondré, et chaleur montante avertissent de sa présence maudite. Rares sont ceux qui osent s'aventurer dans son domaine."

  building_type_firewyrms_01:0 "Vouivres de Feu"
  building_firewyrms_01:0 "Terriers Calcinés"
  building_firewyrms_01_desc:0 "La terre est criblée de galeries noircies et de cheminées fumantes. Les vouivres de feu ont laissé leur marque—bétail carbonisé, sol effondré, et chaleur infernale avertissent de leur présence. Rares sont ceux qui osent pénétrer ces terres maudites."
  building_firewyrms_02:0 "Tunnels Effondrés"
  building_firewyrms_02_desc:0 "Les créatures ont été repoussées dans les profondeurs ou massacrées, et nombre de leurs tunnels ont été scellés ou effondrés. Des tremblements occasionnels ou des bouffées de chaleur subsistent, mais le pire est passé."
  building_firewyrms_03:0 "Terre Refroidie"
  building_firewyrms_03_desc:0 "Le sol s'est apaisé, les feux se sont éteints. Les vouivres de feu ont été éradiquées ou ont fui au-delà de toute atteinte. Bien que la terre porte encore leurs cicatrices, il est à nouveau sûr de la fouler."

  #Hostile Swamp
  building_type_swamp:0 "Marais Hostile"

  building_type_swamp_01_01:0 "$building_type_swamp$"
  building_swamp_01_01:0 "Terrain Marécageux"
  building_swamp_01_01_desc:0 "Un sol mou et spongieux qui engloutit bottes et charrettes avec la même avidité. Le progrès ralentit, les structures s'enfoncent, et l'humidité s'infiltre dans tout. Une barrière naturelle à toute expansion."
  building_swamp_01_02:0 "Terres Drainées"
  building_swamp_01_02_desc:0 "Des canaux ont été creusés, des passerelles posées, et la terre gorgée d'eau commence à sécher. Le sol reste instable, mais il cède devant la persévérance et la planification."
  building_swamp_01_03:0 "Marécages Reconquis"
  building_swamp_01_03_desc:0 "Jadis barrière infranchissable, maintenant fondation solide. Le marais a été drainé et transformé en terrain exploitable, prêt à soutenir colonies et lignes d'approvisionnement."

  building_type_swamp_02_01:0 "$building_type_swamp$"
  building_swamp_02_01:0 "Bourbier Englouti"
  building_swamp_02_01_desc:0 "Une étendue traîtresse de vase et d'eau stagnante où chaque pas risque une chute dans la tourbière. Les fondations pourrissent, les maladies festoient, et le mouvement n'est qu'une lutte lente et étouffante."
  building_swamp_02_02:0 "Bourbier Renforcé"
  building_swamp_02_02_desc:0 "Des chemins surélevés et des supports improvisés tiennent la boue à distance. La terre résiste au progrès, mais l'effort déterminé trace un chemin à travers la fange."
  building_swamp_02_03:0 "Bourbier Stabilisé"
  building_swamp_02_03_desc:0 "Le sol a été raffermi et l'eau domptée. Le bourbier ne menace plus d'engloutir tous ceux qui y pénètrent. Il peut encore porter les cicatrices du passé, mais il est maintenant assez solide pour la croissance."

  #Floods
  building_type_lv_floods_01:0 "Inondations"
  building_lv_floods_01:0 "Terres Submergées"
  building_lv_floods_01_desc:0 "Des pluies diluviennes ou des eaux montantes ont englouti la région, transformant les routes en rivières et les champs en marécages. Les colonies sont isolées, et le danger rôde sous la surface trouble."
  building_lv_floods_02:0 "Eaux en Décrue"
  building_lv_floods_02_desc:0 "Les eaux de crue ont commencé leur lente retraite, bien que la terre reste instable et traîtresse. Le nettoyage a commencé, mais les déplacements et la reconstruction restent périlleux."
  building_lv_floods_03:0 "Terrain Asséché"
  building_lv_floods_03_desc:0 "Les dernières eaux ont été détournées ou absorbées. Bien que la terre soit scarifiée et gorgée d'eau, elle est à nouveau praticable, cultivable et prête à bâtir."

  #Noxious Gases
  building_type_noxious_gases:0 "Gaz Nocifs"

  building_type_noxious_gases_01_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_01_01:0 "Brume Épaisse"
  building_noxious_gases_01_01_desc:0 "Loin du cœur de l'éruption, les brumes volcaniques s'accumulent encore. Ces vapeurs mortelles rampent au ras du sol, s'infiltrant dans les fissures et les creux, affaiblissant les imprudents et étouffant les négligents. C'est une menace plus silencieuse—mais non moins réelle."
  building_noxious_gases_01_02:0 "Brume Dissipée"
  building_noxious_gases_01_02_desc:0 "Les brumes vacillent, non plus un mur mais un voile ténu. Respirer est plus facile, bien que les rafales occasionnelles de gaz rappellent encore les dangers passés. La guérison est en cours, mais la prudence doit guider chaque pas."
  building_noxious_gases_01_03:0 "Air Purifié"
  building_noxious_gases_01_03_desc:0 "Le temps et le vent ont fait leur œuvre. La brume s'est levée, la terre respire à nouveau librement. Des traces du passé subsistent dans les cendres et les odeurs, mais le brouillard nocif qui tourmentait ces terres s'est évanoui dans la mémoire."

  building_type_noxious_gases_02_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_02_01:0 "Fumées Suffocantes"
  building_noxious_gases_02_01_desc:0 "D'épais gaz âcres s'échappent de la terre volcanique, enveloppant tout dans une brume mortelle. Respirer est un combat, la visibilité est nulle, et la vie se flétrit sous l'assaut implacable. Seuls les plus fous osent pénétrer dans cette zone étouffée."
  building_noxious_gases_02_02:0 "Fumées Persistantes"
  building_noxious_gases_02_02_desc:0 "L'air reste empoisonné, mais par miracle le pire est passé. Le soufre s'accroche à chaque souffle, brûlant les yeux et les poumons. Le danger est toujours présent—insidieux et tenace—mais ce n'est plus une sentence de mort immédiate."
  building_noxious_gases_02_03:0 "Air Apaisé"
  building_noxious_gases_02_03_desc:0 "Les cieux ont commencé à s'éclaircir. Une trace ténue de soufre demeure dans le vent, mais l'air est à nouveau respirable. La vigilance reste requise, mais le pire a été surmonté."

  #Stonemen Encampment
  building_type_stonemen_encampment_01:0 "Campement d'Hommes de Pierre"
  building_stonemen_encampment_01:0 "Campement Infesté"
  building_stonemen_encampment_01_desc:0 "Un amas de structures en ruines ou de grottes est devenu le refuge des hommes de pierre—difformes, contagieux et hostiles. Aucun voyageur sensé n'ose approcher sans protection contre la grisécaille."
  building_stonemen_encampment_02:0 "Zone de Quarantaine"
  building_stonemen_encampment_02_desc:0 "La plupart des affligés ont été chassés ou confinés. La zone reste dangereuse, et les contes de malédictions persistent, mais la menace principale a été maîtrisée."
  building_stonemen_encampment_03:0 "Terres Purgées"
  building_stonemen_encampment_03_desc:0 "Le campement a été entièrement nettoyé. Par le feu, l'acier et une résolution sinistre, les hommes de pierre ont été chassés ou détruits. La terre n'est plus maudite—du moins, pas ouvertement."

  #Bandit Camp
  building_type_bandit_camps_01:0 "Camps de Brigands"
  building_bandit_camps_01:0 "Repaire Sans-Loi"
  building_bandit_camps_01_desc:0 "Un refuge notoire pour brigands, contrebandiers et déserteurs. Les routes commerciales sont dangereuses, et les habitants vivent dans la terreur. Le camp doit être brisé avant que la paix ne revienne."
  building_bandit_camps_02:0 "Pillards Dispersés"
  building_bandit_camps_02_desc:0 "Le camp a été partiellement démantelé. Quelques hors-la-loi demeurent, frappant opportunément, mais leur pouvoir s'effrite. Un dernier assaut les déracinera."
  building_bandit_camps_03:0 "Territoire Sécurisé"
  building_bandit_camps_03_desc:0 "Les derniers brigands ont été mis en déroute. Des patrouilles tiennent maintenant la zone, et l'ordre a été restauré. Là où les lames régnaient jadis, les bannières flottent désormais."

  #Ruined/Abandoned holding
  building_type_ruined_holding:0 "Possession en Ruines"

  building_type_small_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_small_ruined_holding_01:0 "Vestiges Croulants"
  building_small_ruined_holding_01_desc:0 "Jadis un avant-poste mineur ou un domaine, maintenant guère plus que décombres et végétation envahissante. Les ruines sont instables, sans garde, et d'usage limité jusqu'à ce qu'elles soient déblayées et sécurisées."
  building_small_ruined_holding_02:0 "Fondations Consolidées"
  building_small_ruined_holding_02_desc:0 "Des efforts ont été déployés pour étayer les murs brisés et déblayer les gravats. Bien que loin d'être restaurée, la structure présente maintenant moins de dangers et pourrait bientôt être réclamée."
  building_small_ruined_holding_03:0 "Coquille Restaurée"
  building_small_ruined_holding_03_desc:0 "La possession a été déblayée en sécurité et les réparations de base achevées. Elle est à nouveau utilisable comme bastion mineur ou colonie—humble, mais non plus abandonnée."

  building_type_medium_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_medium_ruined_holding_01:0 "Forteresse Brisée"
  building_medium_ruined_holding_01_desc:0 "Ce fort ou domaine autrefois modeste est tombé en délabrement. Ses tours penchent, ses salles sont silencieuses, et des dangers rôdent dans la décrépitude."
  building_medium_ruined_holding_02:0 "Terres Sécurisées"
  building_medium_ruined_holding_02_desc:0 "Les pires menaces ont été éliminées, et le site est maintenant sûr à habiter ou reconstruire. Bien que la gloire soit partie, les fondements de la force demeurent."
  building_medium_ruined_holding_03:0 "Possession Reconquise"
  building_medium_ruined_holding_03_desc:0 "Par un travail constant et de la patience, la ruine a été stabilisée et remise en fonction. Elle est prête à servir à nouveau, même si ses bannières sont nouvelles."

  building_type_large_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_large_ruined_holding_01:0 "Héritage Déchu"
  building_large_ruined_holding_01_desc:0 "Le site porte les cicatrices d'un passé grandiose—une cité antique ou une forteresse maintenant perdue dans les âges. Son immensité n'a d'égale que les dangers tapis dans ses entrailles."
  building_large_ruined_holding_02:0 "Ruine Domptée"
  building_large_ruined_holding_02_desc:0 "Les efforts de déblaiement ont arraché l'ordre au chaos. Les grandes salles ne sont plus périlleuses, et des chemins à travers les décombres ont été sécurisés. La ruine respire à nouveau, quoique faiblement."
  building_large_ruined_holding_03:0 "Siège Ressuscité"
  building_large_ruined_holding_03_desc:0 "Le site n'est plus une ruine, mais une fondation. Bien que les échos de sa grandeur perdue demeurent, il sert maintenant un nouveau dessein—renaissant à votre image, prêt à façonner le monde une fois encore."

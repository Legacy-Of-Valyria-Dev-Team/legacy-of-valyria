l_french:
 wilderness_holding:0 "Contrées sauvages"
 wilderness_holding_concept_key:0 "[wilderness_holding|E]"
 
 building_type_wilderness_01:0 "Terres indomptées"
 building_wilderness_01:0 "Contrées sauvages"
 wilderness_01_desc:0 "Le temps et la négligence ont laissé ces terres dans l'ombre de leur gloire passée. Ce qui subsiste encore se dresse fissuré et brisé, témoignage silencieux du passé et sombre avertissement pour l'avenir."
 
 this_building_desc:0 "#low Ce bâtiment :#!\n"
 TERRAIN_IS_URBAN:0 "Le terrain est $urban$"
 increased_plague_chance:0 "@warning_icon! #X Risque accru de pestes dans ce domaine !#!"
 increased_illness_chance:0 "@warning_icon! #X Risque accru de tomber malade !#!"
 increased_raid_chance:0 "@warning_icon! #X Des bandits peuvent piller ce domaine !#!"

#Colony
 #Colony Holding
  colony_holding:0 "Colonie"
  colony_holding_concept_key:0 "[colony_holding|E]"
  building_type_colony_01:0 "Colonie"
  building_colony_01: "Avant-poste de colons"
  building_colony_01_desc: "Un site fortifié où les colons ont commencé à ériger leurs demeures dans cette terre hostile."
  building_colony_02: "Hameau des pionniers"
  building_colony_02_desc: "Un petit établissement en croissance, taillant péniblement l'ordre dans la sauvagerie environnante."
  building_colony_03: "Bourg colonial"
  building_colony_03_desc: "Une communauté florissante, s'enorgueillissant de bâtisses solides et d'un commandement organisé."
 #Colony Buildings
  building_type_local_markets_01:0 "Marchés locaux"
  building_type_local_markets_01_desc:0 "Un réseau de places marchandes grouillantes où les marchands étalent leurs marchandises, où les fermiers troquent leurs récoltes, et où les artisans vendent leurs ouvrages. Ces marchés forment le cœur économique battant de l'établissement, assurant un flux constant de biens, de pièces d'or et de prospérité dans ces terres reculées."
  building_local_markets_01:0 "Marchés locaux"
  building_local_markets_01_desc:0 "Un réseau de places marchandes grouillantes où les marchands étalent leurs marchandises, où les fermiers troquent leurs récoltes, et où les artisans vendent leurs ouvrages. Ces marchés forment le cœur économique battant de l'établissement, assurant un flux constant de biens, de pièces d'or et de prospérité."

  building_type_local_militia_01:0 "Milice locale"
  building_type_local_militia_01_desc:0 "Une force grossièrement entraînée composée des habitants valides de la cité, armés des quelques armes qu'on a pu rassembler. Bien qu'aucunement à la mesure des soldats professionnels, ces miliciens servent de première ligne de défense contre les pillards, les bandits et les autres menaces pesant sur l'établissement."
  building_local_militia_01:0 "Milice locale"
  building_local_militia_01_desc:0 "Une force grossièrement entraînée composée des habitants valides de la cité, armés des quelques armes qu'on a pu rassembler. Bien qu'aucunement à la mesure des soldats professionnels, ces miliciens servent de première ligne de défense contre les pillards, les bandits et les autres menaces."

  building_type_stockades_01:0 "Palissades"
  building_type_stockades_01_desc:0 "Des fortifications simples mais efficaces, constituées de pieux de bois acérés. Bien qu'elles ne résistent point à un assaut déterminé, les palissades offrent la sécurité tant nécessaire contre les attaques soudaines et aident à maintenir l'ordre au sein de l'établissement."
  building_stockades_01:0 "Palissades"
  building_stockades_01_desc:0 "Des fortifications simples mais efficaces, constituées de pieux de bois acérés. Bien qu'elles ne résistent point à un assaut déterminé, les palissades offrent la sécurité tant nécessaire contre les attaques soudaines et aident à maintenir l'ordre."

  building_type_construction_guilds_01:0 "Guildes de construction"
  building_type_construction_guilds_01_desc:0 "Une coalition de maçons habiles, de charpentiers et d'ingénieurs dévoués à l'amélioration des infrastructures de l'établissement. Grâce à leur expertise, les bâtisses s'élèvent plus rapidement, plus solidement et plus efficacement, façonnant les fondations de la croissance future dans ces contrées reculées."
  building_construction_guilds_01:0 "Guildes de construction"
  building_construction_guilds_01_desc:0 "Une coalition de maçons habiles, de charpentiers et d'ingénieurs dévoués à l'amélioration des infrastructures de l'établissement. Grâce à leur expertise, les bâtisses s'élèvent plus rapidement, plus solidement et plus efficacement."

  building_type_colony_quarries_01:0 "Carrières"
  building_type_colony_quarries_01_desc:0 "La pierre facilement accessible de ces carrières fournit les matériaux de construction nécessaires aux édifications voisines."
  building_colony_quarries_01:0 "Carrières de pierre simples"
  building_colony_quarries_01_desc:0 "La pierre facilement accessible de ces carrières fournit les matériaux de construction nécessaires aux édifications voisines."

  building_type_colony_forestry_01:0 "Exploitations forestières"
  building_type_colony_forestry_01_desc:0 "De grandes quantités de bois d'œuvre, de résine, de charbon de bois et d'autres ressources sont récoltées dans ces forêts, fournissant une excellente source de matériaux de construction à proximité pour les bourgs environnants."
  building_colony_forestry_01:0 "Camps de bûcherons"
  building_colony_forestry_01_desc:0 "Les bûcherons ont établi leur camp aux abords de la forêt, assurant une production constante de troncs d'arbres."

  #Blockers
	lv_wilderness_blocker_effect:0 "@warning_icon! #X Ce bâtiment constitue un obstacle qui doit être déblayé en l'améliorant entièrement avant que l'établissement ne puisse être transformé en domaine convenable#!"
  lv_wilderness_blocker_effect_mines:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Des vouivres de feu ont une chance d'émerger chaque année et ravageront l'établissement#!"
  lv_wilderness_blocker_effect_plague:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X A une chance de déclencher une épidémie de peste chaque année#!"
  lv_wilderness_blocker_effect_raid:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X A une chance d'initier des raids sur l'établissement chaque année#!"
  lv_firewyrm_blocker_effect:0 "@warning_icon! #X Ce bâtiment constitue un obstacle qui doit être éliminé en abattant la vouivre de feu qui hante cette province avant que l'établissement ne puisse être transformé en domaine viable#!"

  #Caves
  building_type_unexplored_caves_01:0 "Grottes inexplorées"
  building_unexplored_caves_01:0 "Profondeurs inconnues"
  building_unexplored_caves_01_desc:0 "D'obscurs tunnels sinueux s'étendent sous la surface, vierges de toute lumière ou cartographie. Des murmures résonnent à travers la pierre, et chaque pas risque d'éveiller ce qui gît tapi dans l'ombre. L'inconnu règne ici en maître, et le péril demeure une certitude absolue."
  building_unexplored_caves_02:0 "Tunnels balisés"
  building_unexplored_caves_02_desc:0 "Les explorateurs ont commencé à tailler des sentiers dans les ténèbres. Des marques grossières et des camps de fortune tracent les limites de notre compréhension, mais les ombres recèlent encore bien des mystères. La menace s'amenuise - sans pour autant disparaître."
  building_unexplored_caves_03:0 "Cavernes arpentées"
  building_unexplored_caves_03_desc:0 "Les grottes ont livré leurs secrets les plus sombres. Les chemins sont cartographiés, les dangers répertoriés, et la stabilité assurée. Bien que la prudence garde encore sa place, ces contrées souterraines sauvages ont été domptées."

  #Firewyrms
  building_type_firewyrm_lair:0 "Antre de vouivre de feu"
  building_firewyrm_lair:0 "Antre de vouivre de feu"
  building_firewyrm_lair_desc:0 "La terre est criblée de galeries noircies et de cheminées fumantes. Une vouivre de feu a établi sa présence - du bétail carbonisé, un sol effondré et une chaleur montante trahissent son repaire. Rares sont ceux qui osent s'aventurer dans ces parages maudits."

  building_type_firewyrms_01:0 "Vouivres de feu"
  building_firewyrms_01:0 "Terriers calcinés"
  building_firewyrms_01_desc:0 "La terre est percée de tunnels noircis et de bouches fumantes. Les vouivres de feu ont laissé leur marque - des animaux réduits en cendres, un terrain qui s'effrite et une chaleur suffocante signalent leur présence. Seuls les plus téméraires ou les plus fous osent fouler ce sol maudit."
  building_firewyrms_02:0 "Galeries effondrées"
  building_firewyrms_02_desc:0 "Les créatures ont été repoussées dans les profondeurs ou mises à mort, et la plupart de leurs tunnels ont été scellés ou ensevelis. Des tremblements occasionnels et des bouffées de chaleur persistent, mais le pire danger est passé."
  building_firewyrms_03:0 "Terre refroidie"
  building_firewyrms_03_desc:0 "Le sol s'est stabilisé, les feux se sont éteints. Les vouivres de feu ont été exterminées ou ont fui vers des contrées inaccessibles. Bien que la terre porte encore les cicatrices de leur passage, il est désormais possible de la fouler sans crainte."

  #Hostile Swamp
  building_type_swamp:0 "Marécage hostile"

  building_type_swamp_01_01:0 "$building_type_swamp$"
  building_swamp_01_01:0 "Terrain marécageux"
  building_swamp_01_01_desc:0 "Un sol mou et spongieux qui happe les bottes et enlise les chariots. Les progrès ralentissent, les structures s'enfoncent, et l'humidité suinte en toute chose. Une barrière naturelle à l'expansion."
  building_swamp_01_02:0 "Terres drainées"
  building_swamp_01_02_desc:0 "Des canaux ont été creusés, des passerelles posées, et la terre humide commence à sécher. Le terrain demeure instable, mais cède à la persistance et à la planification."
  building_swamp_01_03:0 "Marais reconquis"
  building_swamp_01_03_desc:0 "Jadis obstacle, désormais fondation. Le marécage a été drainé et remodelé en terrain utilisable, prêt à soutenir des établissements et des voies d'approvisionnement."

  building_type_swamp_02_01:0 "$building_type_swamp$"
  building_swamp_02_01:0 "Bourbier englouti"
  building_swamp_02_01_desc:0 "Une étendue traîtresse de vase et d'eaux stagnantes où chaque pas risque une chute dans le bourbier. Les fondations pourrissent, la maladie couve, et tout mouvement devient une lente lutte contre la noyade."
  building_swamp_02_02:0 "Bourbier renforcé"
  building_swamp_02_02_desc:0 "Des passerelles surélevées et des supports de fortune tiennent la vase à distance. La terre résiste aux progrès, mais l'effort déterminé taille un chemin à travers la fange."
  building_swamp_02_03:0 "Bourbier stabilisé"
  building_swamp_02_03_desc:0 "Le sol a été affermi et l'eau domptée. Le bourbier ne menace plus d'engloutir tous ceux qui s'y aventurent. Il peut encore porter les cicatrices du passé, mais il est désormais assez ferme pour permettre la croissance."

  #Floods
  building_type_lv_floods_01:0 "Inondations"
  building_lv_floods_01:0 "Terres submergées"
  building_lv_floods_01_desc:0 "De lourdes pluies ou la montée des eaux ont submergé la région, transformant les routes en rivières et les champs en bourbiers. Les établissements sont coupés du monde, et le danger se tapit sous la surface."
  building_lv_floods_02:0 "Eaux décroissantes"
  building_lv_floods_02_desc:0 "Les eaux de crue ont commencé à se retirer, bien que la terre demeure instable et traîtresse. Le nettoyage a débuté, mais les déplacements et la reconstruction restent limités."
  building_lv_floods_03:0 "Terrain drainé"
  building_lv_floods_03_desc:0 "Les dernières eaux ont été détournées ou absorbées. Bien que la terre soit marquée de cicatrices et détrempée, elle est de nouveau praticable, labourable, et propice à de nouvelles constructions."

  #Noxious Gases
  building_type_noxious_gases:0 "Gaz nocifs"

  building_type_noxious_gases_01_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_01_01:0 "Brume dense"
  building_noxious_gases_01_01_desc:0 "Loin du cœur de l'éruption, les brumes volcaniques se rassemblent encore. Ces vapeurs dérivent bas, s'insinuant dans les fissures et les creux, affaiblissant les sans-défense et étouffant les imprudents. C'est une menace plus silencieuse - mais non moins réelle."
  building_noxious_gases_01_02:0 "Brume déclinante"
  building_noxious_gases_01_02_desc:0 "Les brumes vacillent, n'étant plus un mur mais un voile. Respirer devient plus aisé, bien que les occasionnelles bouffées de gaz apportent encore des rappels cuisants du péril passé. La guérison est en cours, mais la prudence doit guider chaque pas."
  building_noxious_gases_01_03:0 "Air apaisé"
  building_noxious_gases_01_03_desc:0 "Le temps et le vent ont accompli leur œuvre. La brume s'est levée, la terre respire librement une fois encore. Des traces du passé subsistent dans la cendre et les effluves, mais le brouillard nocif qui affligeait ces terres s'est évanoui dans les souvenirs."

  building_type_noxious_gases_02_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_02_01:0 "Vapeurs suffocantes"
  building_noxious_gases_02_01_desc:0 "D'épais gaz âcres s'élèvent de la terre volcanique, enveloppant tout d'une brume mortelle. Respirer devient un combat, la visibilité est quasi nulle, et la vie se flétrit sous l'assaut implacable. Seuls les plus fous des hommes osent pénétrer dans cette zone étouffée."
  building_noxious_gases_02_02:0 "Vapeurs persistantes"
  building_noxious_gases_02_02_desc:0 "L'air demeure souillé, mais par quelque miracle le pire est passé. Le soufre s'accroche à chaque souffle, piquant les yeux et les poumons. Le danger subsiste - insidieux et tenace - mais ce n'est plus une sentence de mort immédiate."
  building_noxious_gases_02_03:0 "Air apaisé"
  building_noxious_gases_02_03_desc:0 "Les cieux ont commencé à s'éclaircir. Une faible trace de soufre subsiste dans le vent, mais l'air redevient propice à la vie. La vigilance demeure requise, mais le pire a été surmonté."

  #Stonemen Encampment
  building_type_stonemen_encampment_01:0 "Campement d'hommes de pierre"
  building_stonemen_encampment_01:0 "Campement infesté"
  building_stonemen_encampment_01_desc:0 "Un amas de structures en ruines ou de grottes est devenu le foyer d'hommes de pierre - difformes, contagieux, et hostiles. Aucun voyageur sensé n'ose approcher sans protection."
  building_stonemen_encampment_02:0 "Zone en quarantaine"
  building_stonemen_encampment_02_desc:0 "La plupart des affligés ont été chassés ou contenus. La zone demeure hasardeuse, et les contes de malédictions persistent, mais la pire menace a été maîtrisée."
  building_stonemen_encampment_03:0 "Terres purifiées"
  building_stonemen_encampment_03_desc:0 "Le campement a été entièrement nettoyé. Par le feu, l'acier et une résolution sinistre, les hommes de pierre ont été chassés ou détruits. La terre n'est plus maudite - du moins, pas ouvertement."

  #Bandit Camp
  building_type_bandit_camps_01:0 "Camps de bandits"
  building_bandit_camps_01:0 "Campement sans-loi"
  building_bandit_camps_01_desc:0 "Un refuge notoire pour les bandits, les contrebandiers et les déserteurs. Les routes commerciales sont dangereuses, et les gens du cru vivent dans la peur. Le camp doit être brisé avant que la paix ne puisse revenir."
  building_bandit_camps_02:0 "Pillards dispersés"
  building_bandit_camps_02_desc:0 "Le camp a été partiellement démantelé. Quelques hors-la-loi subsistent, frappant opportunément, mais leur pouvoir s'amenuise. Un dernier effort les déracinera."
  building_bandit_camps_03:0 "Territoire sécurisé"
  building_bandit_camps_03_desc:0 "Les derniers bandits ont été mis en déroute. Des patrouilles tiennent désormais la zone, et l'ordre a été restauré. Là où les lames régnaient jadis, les bannières flottent maintenant."

  #Ruined/Abandoned holding
  building_type_ruined_holding:0 "Domaine en ruines"

  building_type_small_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_small_ruined_holding_01:0 "Vestiges croulants"
  building_small_ruined_holding_01_desc:0 "Jadis avant-poste mineur ou domaine modeste, désormais guère plus que des gravats et de la végétation sauvage. Les ruines sont instables, sans garde, et d'usage limité jusqu'à être déblayées et sécurisées."
  building_small_ruined_holding_02:0 "Fondations stabilisées"
  building_small_ruined_holding_02_desc:0 "Des efforts ont été consentis pour étayer les murs brisés et déblayer les débris. Bien qu'encore loin d'être restaurée, la structure présente désormais moins de dangers et pourrait bientôt être récupérée pour usage."
  building_small_ruined_holding_03:0 "Coquille restaurée"
  building_small_ruined_holding_03_desc:0 "Le domaine a été déblayé en sécurité et les réparations de base achevées. Il redevient utilisable comme bastion mineur ou établissement - humble, mais non plus abandonné."

  building_type_medium_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_medium_ruined_holding_01:0 "Forteresse brisée"
  building_medium_ruined_holding_01_desc:0 "Ce fort jadis modeste ou ce domaine est tombé en décrépitude. Ses tours penchent, ses halls gisent silencieux, et des dangers se tapissent dans la décomposition."
  building_medium_ruined_holding_02:0 "Terres sécurisées"
  building_medium_ruined_holding_02_desc:0 "Les pires menaces ont été éliminées, et le site est désormais sûr pour être habité ou reconstruit. Bien que la gloire soit partie, les os de la force demeurent."
  building_medium_ruined_holding_03:0 "Domaine reconquis"
  building_medium_ruined_holding_03_desc:0 "Par un travail constant et la patience, la ruine a été stabilisée et rendue à sa vocation. Elle se dresse prête à servir de nouveau, même si ses bannières sont nouvelles."

  building_type_large_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_large_ruined_holding_01:0 "Héritage déchu"
  building_large_ruined_holding_01_desc:0 "Le site porte les cicatrices d'un passé grandiose - cité antique ou forteresse désormais perdue dans le temps. Son immensité n'a d'égale que les dangers tapis en son sein."
  building_large_ruined_holding_02:0 "Ruine domptée"
  building_large_ruined_holding_02_desc:0 "Les efforts de déblaiement ont taillé l'ordre dans le chaos. Les grandes salles ne sont plus périlleuses, et des chemins à travers les décombres ont été sécurisés. La ruine respire de nouveau, si faiblement soit-il."
  building_large_ruined_holding_03:0 "Siège ressuscité"
  building_large_ruined_holding_03_desc:0 "Le site n'est plus une ruine, mais une fondation. Bien que les échos de sa grandeur perdue subsistent, il sert désormais un nouveau dessein - renaissant à votre image, prêt à façonner le monde une fois encore."

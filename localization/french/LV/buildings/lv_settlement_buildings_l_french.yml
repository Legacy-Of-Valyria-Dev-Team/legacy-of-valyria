#Colony
 #Colony Buildings
  building_type_local_markets_01:0 "Marchés Locaux"
  building_type_local_markets_01_desc:0 "Un réseau florissant de places marchandes où les négociants étalent leurs marchandises, les fermiers échangent leurs récoltes, et les artisans vendent leurs ouvrages. Ces marchés constituent le cœur économique de la colonie, assurant un flux constant de biens, de pièces d'or et de prospérité."
  building_local_markets_01:0 "Marchés Locaux"
  building_local_markets_01_desc:0 "Un réseau florissant de places marchandes où les négociants étalent leurs marchandises, les fermiers échangent leurs récoltes, et les artisans vendent leurs ouvrages. Ces marchés constituent le cœur économique de la colonie, assurant un flux constant de biens, de pièces d'or et de prospérité."

  #building_type_local_militia_01:0 "Milice Locale"
  #building_type_local_militia_01_desc:0 "Une force sommairement entraînée composée de bourgeois valides, armés de tout ce qui peut servir d'arme. Bien qu'incapables de rivaliser avec des soldats professionnels, ces miliciens constituent la première ligne de défense contre les pillards, les brigands et autres menaces pesant sur la colonie."
  #building_local_militia_01:0 "Milice Locale"
  #building_local_militia_01_desc:0 "Une force sommairement entraînée composée de bourgeois valides, armés de tout ce qui peut servir d'arme. Bien qu'incapables de rivaliser avec des soldats professionnels, ces miliciens constituent la première ligne de défense contre les pillards, les brigands et autres menaces pesant sur la colonie."

  #building_type_stockades_01:0 "Palissades"
  #building_type_stockades_01_desc:0 "Une fortification simple mais efficace, constituée de pieux de bois dressés. Bien que vulnérables face à un assaut déterminé, les palissades offrent une sécurité indispensable contre les attaques soudaines et contribuent à maintenir l'ordre au sein de la colonie."
  #building_stockades_01:0 "Palissades"
  #building_stockades_01_desc:0 "Une fortification simple mais efficace, constituée de pieux de bois dressés. Bien que vulnérables face à un assaut déterminé, les palissades offrent une sécurité indispensable contre les attaques soudaines et contribuent à maintenir l'ordre au sein de la colonie."

  #building_type_construction_guilds_01:0 "Guildes de Construction"
  #building_type_construction_guilds_01_desc:0 "Une coalition d'habiles maçons, charpentiers et ingénieurs consacrés à l'amélioration des infrastructures de la colonie. Grâce à leur expertise, les bâtiments s'élèvent plus rapidement, plus solidement et plus efficacement, façonnant les fondations d'une croissance future."
  #building_construction_guilds_01:0 "Guildes de Construction"
  #building_construction_guilds_01_desc:0 "Une coalition d'habiles maçons, charpentiers et ingénieurs consacrés à l'amélioration des infrastructures de la colonie. Grâce à leur expertise, les bâtiments s'élèvent plus rapidement, plus solidement et plus efficacement, façonnant les fondations d'une croissance future."

  building_type_colony_quarries_01:0 "Carrières"
  building_type_colony_quarries_01_desc:0 "La pierre extraite de ces carrières facilement accessibles fournit les matériaux de construction pour les édifications avoisinantes."
  building_colony_quarries_01:0 "Carrières de Pierre Simples"
  building_colony_quarries_01_desc:0 "La pierre extraite de ces carrières facilement accessibles fournit les matériaux de construction pour les édifications avoisinantes."

  building_type_colony_forestry_01:0 "Exploitations Forestières"
  building_type_colony_forestry_01_desc:0 "D'importantes quantités de bois d'œuvre, de résine, de charbon de bois et autres ressources sont récoltées dans ces forêts, offrant une excellente source de matériaux de construction pour les agglomérations environnantes."
  building_colony_forestry_01:0 "Camps de Bûcherons"
  building_colony_forestry_01_desc:0 "Les bûcherons ont établi leur campement en lisière de forêt, assurant une production constante de grumes."

  #Blockers
	lv_wilderness_blocker_effect:0 "@warning_icon! #X Ce bâtiment constitue un obstacle qui doit être supprimé en l'améliorant complètement avant que la colonie puisse être transformée en véritable domaine#!"
  lv_wilderness_blocker_effect_mines:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X Des vouivres de feu ont une chance d'émerger chaque année et ravageront la colonie#!"
  lv_wilderness_blocker_effect_plague:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X A une chance de déclencher une épidémie de peste chaque année#!"
  lv_wilderness_blocker_effect_raid:0 "$lv_wilderness_blocker_effect$\n@warning_icon! #X A une chance de provoquer des raids contre la colonie chaque année#!"
  lv_firewyrm_blocker_effect:0 "@warning_icon! #X Ce bâtiment constitue un obstacle qui doit être supprimé en tuant la vouivre de feu dans cette province avant que la colonie puisse être transformée en véritable domaine#!"

  #Caves
  building_type_unexplored_caves_01:0 "Grottes Inexplorées"
  building_unexplored_caves_01:0 "Profondeurs Inconnues"
  building_unexplored_caves_01_desc:0 "D'obscurs tunnels serpentins s'étendent sous la surface, intacts de toute lumière ou carte. Des murmures résonnent à travers la pierre, et chaque pas risque de réveiller ce qui git tapi dans l'ombre. L'inconnu règne ici en maître, et le danger demeure une certitude absolue."
  building_unexplored_caves_02:0 "Tunnels Balisés"
  building_unexplored_caves_02_desc:0 "Les explorateurs ont commencé à tracer des chemins à travers les ténèbres. Des marques grossières et des campements de fortune jalonnent les confins de la connaissance, mais bien des mystères demeurent enveloppés d'ombre. La menace s'amenuise — sans pour autant disparaître."
  building_unexplored_caves_03:0 "Cavernes Arpentées"
  building_unexplored_caves_03_desc:0 "Les grottes ont livré leurs secrets. Les sentiers sont cartographiés, les dangers répertoriés et la stabilité établie. Bien que la prudence garde sa place, les terres souterraines sauvages ont été domptées."

  #Firewyrms
  building_type_firewyrm_lair:0 "Repaire de Vouivre de Feu"
  building_firewyrm_lair:0 "Repaire de Vouivre de Feu"
  building_firewyrm_lair_desc:0 "La terre est criblée de tunnels noircis et d'évents fumants. Une vouivre de feu s'est manifestée — bétail carbonisé, sol effondré et chaleur montante témoignent de sa présence menaçante. Rares sont ceux qui osent s'aventurer en ces lieux maudits."

  building_type_firewyrms_01:0 "Vouivres de Feu"
  building_firewyrms_01:0 "Terriers Calcinés"
  building_firewyrms_01_desc:0 "La terre est criblée de tunnels noircis et d'évents fumants. Des vouivres de feu ont été aperçues ou ressenties — bétail carbonisé, sol effondré et chaleur montante témoignent de leur présence redoutable. Rares sont ceux qui osent s'aventurer en ces lieux."
  building_firewyrms_02:0 "Tunnels Effondrés"
  building_firewyrms_02_desc:0 "Les créatures ont été repoussées vers les profondeurs ou abattues, et nombre de leurs tunnels ont été scellés ou effondrés. Des tremblements occasionnels ou des bouffées de chaleur persistent, mais le pire est passé."
  building_firewyrms_03:0 "Terre Refroidie"
  building_firewyrms_03_desc:0 "Le sol s'est stabilisé, les feux se sont éteints. Les vouivres de feu ont été éradiquées ou ont fui hors d'atteinte. Bien que la terre porte encore leurs cicatrices, elle peut désormais être foulée en sécurité."

  #Hostile Swamp
  building_type_swamp:0 "Marécage Hostile"

  building_type_swamp_01_01:0 "$building_type_swamp$"
  building_swamp_01_01:0 "Terrain Marécageux"
  building_swamp_01_01_desc:0 "Un sol mou et spongieux qui happe les bottes et les chariots. Les progrès ralentissent, les structures s'enlisent et l'humidité s'infiltre partout. Un obstacle naturel à l'expansion."
  building_swamp_01_02:0 "Terres Drainées"
  building_swamp_01_02_desc:0 "Des canaux ont été creusés, des passerelles établies, et la terre humide commence à s'assécher. Le sol demeure instable, mais il cède face à la persévérance et à la planification."
  building_swamp_01_03:0 "Zones Humides Assainies"
  building_swamp_01_03_desc:0 "Jadis obstacle, désormais fondation. Le marécage a été drainé et remodelé en terrain utilisable, prêt à soutenir colonies et voies d'approvisionnement."

  building_type_swamp_02_01:0 "$building_type_swamp$"
  building_swamp_02_01:0 "Fondrière Engloutie"
  building_swamp_02_01_desc:0 "Une étendue perfide de vase et d'eau stagnante où chaque pas risque une chute dans la tourbière. Les fondations pourrissent, la maladie prolifère, et le déplacement devient une lente agonie d'enlisement."
  building_swamp_02_02:0 "Fondrière Renforcée"
  building_swamp_02_02_desc:0 "Des passerelles surélevées et des supports de fortune maintiennent la boue à distance. La terre résiste aux progrès, mais un effort déterminé trace un chemin à travers la fange."
  building_swamp_02_03:0 "Fondrière Stabilisée"
  building_swamp_02_03_desc:0 "Le sol a été affermi et l'eau maîtrisée. La fondrière ne menace plus d'engloutir tous ceux qui y pénètrent. Elle peut encore porter les cicatrices du passé, mais elle est désormais assez solide pour la croissance."

  #Floods
  building_type_lv_floods_01:0 "Inondations"
  building_lv_floods_01:0 "Terres Submergées"
  building_lv_floods_01_desc:0 "De fortes pluies ou la montée des eaux ont submergé la région, transformant les routes en rivières et les champs en bourbiers. Les colonies sont isolées, et le danger guette sous la surface."
  building_lv_floods_02:0 "Eaux qui se Retirent"
  building_lv_floods_02_desc:0 "Les eaux de crue ont commencé à refluer, bien que la terre demeure instable et périlleuse. Le nettoyage a débuté, mais les déplacements et la reconstruction restent limités."
  building_lv_floods_03:0 "Terrain Asséché"
  building_lv_floods_03_desc:0 "Les dernières eaux ont été détournées ou absorbées. Bien que la terre soit balafree et détrempée, elle redevient praticable, cultivable et propice à de nouvelles constructions."

  #Noxious Gases
  building_type_noxious_gases:0 "Gaz Toxiques"

  building_type_noxious_gases_01_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_01_01:0 "Brume Épaisse"
  building_noxious_gases_01_01_desc:0 "Loin du cœur de l'éruption, les brumes volcaniques persistent néanmoins. Ces vapeurs dérivent à ras de terre, s'infiltrant dans les fissures et les creux, affaiblissant les non-protégés et étouffant les imprudents. C'est une menace plus silencieuse — mais non moins réelle."
  building_noxious_gases_01_02:0 "Brume qui s'Amenuise"
  building_noxious_gases_01_02_desc:0 "Les brumes vacillent, n'étant plus un mur mais un voile. Respirer devient plus aisé, bien que des rafales occasionnelles de gaz apportent encore de cuisants rappels du danger passé. Le rétablissement est en cours, mais la prudence doit guider chaque pas."
  building_noxious_gases_01_03:0 "Air Apaisé"
  building_noxious_gases_01_03_desc:0 "Le temps et le vent ont accompli leur œuvre. La brume s'est levée, la terre respire à nouveau librement. Des traces du passé subsistent dans la cendre et l'odeur, mais le brouillard toxique qui tourmentait ces terres s'est estompé dans les mémoires."

  building_type_noxious_gases_02_01:0 "$building_type_noxious_gases$"
  building_noxious_gases_02_01:0 "Fumées Suffocantes"
  building_noxious_gases_02_01_desc:0 "D'épaisses vapeurs âcres jaillissent de la terre volcanique, enveloppant tout d'un voile mortel. Respirer devient un supplice, la visibilité est quasi nulle, et la vie se flétrit sous l'assaut impitoyable. Seuls les plus fous osent pénétrer cette zone étouffée."
  building_noxious_gases_02_02:0 "Fumées Persistantes"
  building_noxious_gases_02_02_desc:0 "L'air demeure souillé, mais par quelque miracle le pire est passé. Le soufre s'accroche à chaque souffle, piquant les yeux et les poumons. Le danger est toujours présent — insidieux et persistant — mais ce n'est plus un arrêt de mort immédiat."
  building_noxious_gases_02_03:0 "Air Apaisé"
  building_noxious_gases_02_03_desc:0 "Les cieux ont commencé à s'éclaircir. Une faible trace de soufre persiste dans le vent, mais l'air redevient propice à la vie. La vigilance demeure requise, mais le pire a été surmonté."

  #Stonemen Encampment
  building_type_stonemen_encampment_01:0 "Campement d'Hommes de Pierre"
  building_stonemen_encampment_01:0 "Campement Infesté"
  building_stonemen_encampment_01_desc:0 "Un amas de structures en ruines ou de grottes est devenu le refuge d'hommes de pierre — tordus, contagieux et hostiles. Aucun voyageur sensé n'ose approcher sans protection."
  building_stonemen_encampment_02:0 "Zone de Quarantaine"
  building_stonemen_encampment_02_desc:0 "La plupart des affligés ont été chassés ou confinés. La région demeure périlleuse, et les récits de malédictions persistent, mais la menace principale a été maîtrisée."
  building_stonemen_encampment_03:0 "Terres Purifiées"
  building_stonemen_encampment_03_desc:0 "Le campement a été entièrement nettoyé. Par le feu, l'acier et une résolution implacable, les hommes de pierre ont été chassés ou détruits. La terre n'est plus maudite — du moins, pas ouvertement."

  #Bandit Camp
  building_type_bandit_camps_01:0 "Camps de Brigands"
  building_bandit_camps_01:0 "Campement Hors-la-Loi"
  building_bandit_camps_01_desc:0 "Un refuge connu des brigands, contrebandiers et déserteurs. Les routes commerciales sont dangereuses, et les habitants vivent dans la terreur. Le camp doit être détruit avant que la paix puisse revenir."
  building_bandit_camps_02:0 "Pillards Dispersés"
  building_bandit_camps_02_desc:0 "Le camp a été partiellement démantelé. Quelques hors-la-loi subsistent, frappant par opportunisme, mais leur pouvoir décline. Une poussée finale les déracinera."
  building_bandit_camps_03:0 "Territoire Sécurisé"
  building_bandit_camps_03_desc:0 "Les derniers brigands ont été mis en déroute. Des patrouilles tiennent désormais la région, et l'ordre a été restauré. Là où les lames régnaient jadis, les bannières flottent aujourd'hui."

  #Ruined/Abandoned holding
  building_type_ruined_holding:0 "Domaine en Ruines"

  building_type_small_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_small_ruined_holding_01:0 "Vestiges Croulants"
  building_small_ruined_holding_01_desc:0 "Jadis un avant-poste mineur ou un domaine, désormais guère plus que gravats et végétation envahissante. Les ruines sont instables, sans garde, et d'usage limité jusqu'à leur déblaiement et sécurisation."
  building_small_ruined_holding_02:0 "Fondations Stabilisées"
  building_small_ruined_holding_02_desc:0 "Des efforts ont été faits pour étayer les murs brisés et dégager les débris. Bien que loin d'être restaurée, la structure présente désormais moins de dangers et pourrait bientôt être récupérée pour usage."
  building_small_ruined_holding_03:0 "Coque Restaurée"
  building_small_ruined_holding_03_desc:0 "Le domaine a été déblayé en sécurité et les réparations de base achevées. Il redevient utilisable comme bastion mineur ou colonie — humble, mais non plus abandonné."

  building_type_medium_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_medium_ruined_holding_01:0 "Forteresse Brisée"
  building_medium_ruined_holding_01_desc:0 "Ce fort ou domaine jadis modeste est tombé en décrépitude. Ses tours penchent, ses salles gisent silencieuses, et des dangers rôdent dans la décadence."
  building_medium_ruined_holding_02:0 "Terres Sécurisées"
  building_medium_ruined_holding_02_desc:0 "Les pires menaces ont été éliminées, et le site est désormais sûr pour l'habitation ou la reconstruction. Bien que la gloire soit partie, l'ossature de la force demeure."
  building_medium_ruined_holding_03:0 "Domaine Reconquis"
  building_medium_ruined_holding_03_desc:0 "Par un labeur constant et la patience, la ruine a été stabilisée et rendue à son usage. Elle se dresse prête à servir à nouveau, même si ses bannières sont nouvelles."

  building_type_large_ruined_holding_01:0 "$building_type_ruined_holding$"
  building_large_ruined_holding_01:0 "Héritage Déchu"
  building_large_ruined_holding_01_desc:0 "Le site porte les cicatrices d'un passé grandiose — une ancienne cité ou forteresse désormais perdue dans le temps. Son immensité n'a d'égale que les dangers cachés en ses murs."
  building_large_ruined_holding_02:0 "Ruine Domptée"
  building_large_ruined_holding_02_desc:0 "Les efforts de déblaiement ont taillé l'ordre dans le chaos. Les grandes salles ne sont plus périlleuses, et des chemins à travers les décombres ont été sécurisés. La ruine respire à nouveau, faiblement certes."
  building_large_ruined_holding_03:0 "Siège Ressuscité"
  building_large_ruined_holding_03_desc:0 "Le site n'est plus une ruine, mais une fondation. Bien que les échos de sa grandeur perdue subsistent, il sert désormais un nouveau dessein — renaissant à votre image, prêt à façonner le monde une fois encore."

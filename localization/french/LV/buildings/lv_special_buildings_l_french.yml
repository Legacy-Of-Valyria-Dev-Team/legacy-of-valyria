l_french:
  # Braavos
  building_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_type_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_agot_EE_titan_of_braavos_desc:0 "Recensé par l'illustre chroniqueur ouestien Lomas Longstrider parmi les Merveilles Façonnées par l'Homme, le Titan de Braavos se dresse comme la première ligne de défense de la [free_city|E] de Braavos, gardant la périlleuse entrée du lagon où réside la cité. Cette statue colossale de granit et de bronze prend la forme d'un guerrier titanesque, servant à la fois de forteresse imprenable et de phare majestueux. Les assommoirs dissimulés sous la jupe blindée de la statue et les meurtrières parsemant sa cuirasse offrent une défense quasi impénétrable contre les navires ennemis tentant de pénétrer dans le lagon."

  building_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_type_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_agot_EE_sealords_palace_desc:0 "Le Palais du Seigneur de la Mer constitue la demeure fastueuse du Seigneur de la Mer de Braavos. Sous les dômes dorés et les tours élancées de ce vaste palais, une ménagerie exotique d'oiseaux rares et de bêtes sauvages venues des quatre coins du monde peut être admirée dans toute sa splendeur."

  # Volantis
  building_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_type_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_agot_EE_black_walls_of_old_volantis_desc:0 "Le cœur véritable de Volantis. Bâti par l'antique [valyrian_freehold|E], ce mur gigantesque de pierre noire fusionnée protège une succession de palais somptueux, de cours majestueuses, de tours élancées et de temples sacrés. Seuls ceux dont le sang remonte à l'ascendance valyrienne, le Sang Ancien, sont autorisés à demeurer entre ses murs inviolables."
  building_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_type_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_agot_EE_volantis_harbor_desc:0 "La puissance de Volantis tire partiellement son origine de son immense port, particulièrement grâce à sa position géographique extraordinairement favorable. Cette vaste étendue en forme de croissant est édifiée directement à l'embouchure de la Rhoyne et serait, dit-on, capable de contenir l'intégralité de Braavos en son sein."

  building_agot_EE_the_long_bridge:0 "Le Long Pont"
  building_type_agot_EE_the_long_bridge:0 "Le Long Pont"
  building_agot_EE_the_long_bridge_desc:0 "Le Long Pont unit les deux moitiés de Volantis et constitue le plus long pont du monde connu. Bâti par l'[old_valyria|E] à l'apogée de sa puissance en pierre fusionnée, il serait, affirme-t-on, capable de supporter le poids de mille éléphants."

  building_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_type_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_agot_EE_temple_of_the_lord_of_light_desc:0 "Cet énorme temple s'élève bien au-dessus de tous les autres édifices de la cité. Ses couleurs éblouissantes d'or, de rouge et d'orange en font un véritable spectacle à contempler. Protégé par la Main Ardente, ce temple sert R'hllor, le Maître de la Lumière, et pourrait bien constituer l'un des plus grands témoignages de sa puissance en existence."

  building_agot_EE_volantis_walls:0 "Les Murs de Volantis"
  building_type_agot_EE_volantis_walls:0 "Les Murs de Volantis"
  building_agot_EE_volantis_walls_desc:0 "Bien que moins impressionnants que ceux de l'Ancienne Volantis, les murs de Volantis feront réfléchir à deux fois tout assaillant songeant à prendre la cité d'assaut."

  # Rhoyne
  building_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
  building_agot_EE_nymeria_palace_01_desc:0 "Au cœur de Ny Sar gisent les ruines du Palais de Nymeria, abandonné depuis que la [valyrian_freehold|E] vainquit le Prince Garin lors de la Seconde Guerre des Épices. Ses murs de marbre rose et vert, ses dômes imposants et ses hautes flèches se dressent désormais comme une coquille hantée de ce qu'ils furent jadis. Toute vie quitta ce lieu lorsque Nymeria s'enfuit vers Dorne, laissant ces salles autrefois orgueilleuses se décomposer dans l'oubli."

  building_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
  building_agot_EE_nymeria_palace_02_desc:0 "Se dressant à nouveau fièrement au cœur de Ny Sar, le Palais de Nymeria a été méticuleusement restauré, témoignage vivant de la résilience et du patrimoine rhoynar. Le marbre vert et rose vibrant luit sous le soleil, tandis que les grands dômes et les flèches élancées dominent désormais l'horizon, effaçant presque les souvenirs de son passé tragique."

  building_agot_EE_palace_of_love_01:0 "Le Palais des Chagrins"
  building_type_agot_EE_palace_of_love_01:0 "Le Palais des Chagrins"
  building_agot_EE_palace_of_love_01_desc:0 "Le Palais des Chagrins se dresse comme un sombre rappel du destin qui frappa Chroyane, la Cité des Festivités. Ses tours croulantes, couvertes de mousse et de lianes sombres, ne révèlent rien de la beauté que le Palais d'Amour incarnait jadis. Des statues englouties et les hommes de pierre hantent désormais ses salles brumeuses et ruinées."

  building_agot_EE_palace_of_love_02:0 "Le Palais d'Amour"
  building_type_agot_EE_palace_of_love_02:0 "Le Palais d'Amour"
  building_agot_EE_palace_of_love_02_desc:0 "Le Palais d'Amour orne à nouveau les rives de la Rhoyne, renaissance époustouflante de l'ancienne gloire de Chroyane. Ses tours s'élancent vers les cieux, parées de mosaïques vibrantes et de sculptures délicates célébrant la vie, la beauté et l'amour. La lumière du soleil scintille sur des fontaines étincelantes qui alimentent les jardins luxuriants, déversant des fleurs sur chaque terrasse. Sous ses grands dômes majestueux, les mariages sont à nouveau bénis, emplissant Chroyane de la promesse de nouveaux commencements."

  building_agot_EE_bridge_of_dream_01:0 "Le Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_01:0 "Le Pont des Rêves"
  building_agot_EE_bridge_of_dream_01_desc:0 "Rivalisant jadis avec le Long Pont de Volantis, le Pont des Rêves surplombe désormais la Rhoyne dans un épais brouillard. Ses arches de pierre s'élevaient autrefois à quarante pieds au-dessus du fleuve, mais se sont écroulées sous la mousse dense et les lianes noires. Désormais lieu de refuge des hommes de pierre, il se dresse comme un monument silencieux et pourrissant de l'orgueil perdu des Rhoynars."

  building_agot_EE_bridge_of_dream_02:0 "Le Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_02:0 "Le Pont des Rêves"
  building_agot_EE_bridge_of_dream_02_desc:0 "Le Pont des Rêves enjambe à nouveau la Rhoyne dans toute sa gloire. S'élevant à quarante pieds au-dessus du fleuve, ses arches de pierre pâle se dressent solides et défiant le temps. Des jardins luxuriants bordent l'envergure de bois du pont, fleurissant de fleurs de toutes les couleurs. Ce pont grandiose, jadis perdu dans le temps et la ruine, est né à nouveau. Un symbole de l'orgueil et de la résilience rhoynars au-dessus des eaux fluides de la Rhoyne une fois de plus !"

  # Meereen
  building_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_type_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_agot_EE_great_pyramid_of_meereen_desc:0 "De loin le plus grand édifice de la cité, la Grande Pyramide de Meereen fut bâtie par une petite armée d'esclaves, dont un millier périrent durant sa construction. La pyramide sert de centre administratif de Meereen et les dirigeants de la cité ont utilisé la grande salle pour recevoir leurs sujets pendant des siècles."

  # Asshai
  building_stygai_01:0 "La Cité Hantée de Stygai"
  building_type_stygai_01:0 "Stygai"
  building_stygai_01_desc:0 "Stygai, la cité énigmatique et antique enveloppée dans le cœur ténébreux des Contrées de l'Ombre, demeure l'un des mystères les plus terrifiants du monde. D'une ancienneté insondable et drapée dans les ténèbres éternelles, la cité se dresse comme un monument à une ère oubliée. Pas même les ombromanciens les plus audacieux n'osent s'aventurer dans ses rues maudites. Les flèches imposantes et les ruelles labyrinthiques seraient, dit-on, parcourues par des démons et des créatures semblables. Voilée de secret, ses véritables origines et l'étendue de ses sombres pouvoirs demeurent inconnus."

  # Gogossos
  building_red_citadel_01:0 "La Tour Rouge"
  building_type_red_citadel_01:0 "La Tour Rouge"
  building_red_citadel_01_desc:0 "Une imposante tour côtière, supposée être le dernier vestige d'une forteresse jadis puissante, sert désormais de bastion principal de la cité. Bien qu'une grande partie de la structure originelle ait été perdue dans le temps, ce bastion solitaire endure — petit mais incroyablement robuste et hautement défendable. D'épais murs de pierre patinée résistent fermement aux éléments et aux sièges potentiels, en faisant un siège d'autorité fiable à Gogossos. Bien qu'elle ne soit pas encore une grande citadelle, elle demeure un donjon formidable, une fondation sur laquelle de plus grandes fortifications pourraient un jour s'élever."

  building_red_citadel_02:0 "La Redoute Rouge"
  building_type_red_citadel_02:0 "La Redoute Rouge"
  building_red_citadel_02_desc:0 "Désormais renforcée d'une palissade de bois robuste et de tours de guet au sommet des anciens Vestiges Cramoisis, cette redoute s'est muée en une forteresse plus formidable, capable de résister aux menaces prolongées. N'étant plus seulement une tour côtière isolée, les défenses étendues lui permettent désormais d'abriter une garnison décente, fournissant une position forte à Gogossos. Avec d'amples provisions et des positions renforcées, elle pourrait même soutenir une armée pendant des mois si nécessaire, marquant sa transformation d'une simple relique du passé en un véritable bastion de pouvoir au sein de la cité."

  building_red_citadel_03:0 "La Citadelle Rouge"
  building_type_red_citadel_03:0 "La Citadelle Rouge"
  building_red_citadel_03_desc:0 "Jadis simple vestige du passé, la Citadelle Rouge a été rebâtie en une forteresse vaste et inébranlable, dominant Gogossos comme le siège ultime du pouvoir de la cité. N'étant plus seulement une tour solitaire, elle se dresse désormais comme un donjon et une forteresse entièrement restaurés, ses murs colossaux de Pierre Noire Valyrienne s'étendant hauts et épais, monument à la domination et à l'effroi.\n\nComme la Porte Cramoisi, les murs de la Citadelle Rouge furent jadis imprégnés des rituels de magie de sang pratiqués par les anciens Valyriens, leur sorcellerie tachant à jamais la pierre d'un cramoisi profond et contre-nature. Bien que les rituels se soient depuis longtemps estompés dans l'histoire, leur sombre héritage perdure, faisant de la citadelle non seulement une forteresse quasi impénétrable, mais aussi un symbole hanté du pouvoir absolu.\n\nEn son cœur, la Tour Rouge perce le ciel, sa présence projetant une longue ombre sur la cité, rappel constant de l'autorité de l'archonte. Les murs inférieurs et la cour demeurent glissants de sang, non seulement des rituels du passé mais des innombrables exécutions, trahisons et conflits brutaux qui se sont joués sur ses pierres. Le sang des rebelles, des conspirateurs et des ennemis de l'État a suinté dans ses fondations, s'assurant que la peur soit tissée dans le tissu même de la forteresse.\n\nOn murmure qu'entre ces murs, la Mort Rouge prit racine pour la première fois, une malédiction qui ravagea jadis Gogossos, laissant des quartiers entiers se noyer dans le sang et la souffrance. Bien que la maladie se soit depuis longtemps estompée dans l'histoire, certains disent que la citadelle s'en souvient encore, que les fantômes des mourants s'attardent dans ses chambres les plus profondes, murmurant à ceux qui les écoutent.\n\nLieu de règne de fer et de légende, la Citadelle Rouge est plus qu'une simple forteresse — elle est le cœur inébranlable de Gogossos, un lieu où le pouvoir est absolu, la pitié rare, et la rébellion écrasée avant qu'elle ne puisse commencer."

  building_pit_of_sorrows_01:0 "Le Donjon Envahi et les Ruines"
  building_type_pit_of_sorrows_01:0 "Le Donjon Envahi et les Ruines"
  building_pit_of_sorrows_01_desc:0 "Un donjon en ruines, ses murs jadis puissants désormais drapés de lianes rampantes et engloutis par l'étreinte impitoyable de la nature, se dresse dans un silence sinistre. Les arbres ont pris racine dans ses cours, leurs branches tordues griffant le ciel, comme s'ils témoignaient d'horreurs oubliées.\n\nMalgré la décrépitude, le donjon demeure étrangement défendable — ses tours, bien que patinées, se dressent encore avec une présence imposante. Sa porte, à demi ensevelie dans la mousse et les gravats, suggère une forteresse qui refuse de céder entièrement au temps.\n\nPourtant, quelque chose semble profondément mal dans ce lieu. L'air est épais d'une immobilité contre-nature, le genre qui fait frissonner la peau et trouble l'esprit. Les ombres s'attardent là où elles ne devraient pas, et des murmures — trop faibles pour être le vent — semblent dériver à travers les ruines, suggérant des secrets qu'il vaut mieux laisser intacts."

  building_pit_of_sorrows_02:0 "Le Donjon et les Excavations de la Fosse"
  building_type_pit_of_sorrows_02:0 "Le Donjon et les Excavations de la Fosse"
  building_pit_of_sorrows_02_desc:0 "Alors que nous étendions nos efforts et dégagions l'épaisse végétation emmêlée, nous fîmes une découverte saisissante — le sol sous nos pieds semblait descendre à l'infini, peu importe la quantité de boue et de débris que nous retirions. Ce qui semblait d'abord n'être qu'une végétation excessive dissimulant les ruines se révéla bientôt comme une vaste descente stratifiée, chaque niveau inférieur exposant des vestiges du passé.\n\nParmi la maçonnerie croulante et la terre humide, nous déterrâmes d'innombrables ossements — leurs origines inconnues, leurs histoires perdues depuis longtemps dans le temps. À chaque pas vers le bas, une certitude grandissante s'installait : ceci pourrait effectivement être la légendaire Fosse des Chagrins, un lieu murmuré dans les légendes effrayantes, ses profondeurs intactes et ses mystères attendant encore d'être dévoilés."

  building_pit_of_sorrows_03:0 "La Fosse des Chagrins"
  building_type_pit_of_sorrows_03:0 "La Fosse des Chagrins"
  building_pit_of_sorrows_03_desc:0 "L'antique Fosse des Chagrins, jadis ruine croulante, a été minutieusement rebâtie et restaurée dans sa grandeur sinistre d'antan. Pourtant, malgré tous les efforts pour reconquérir ses hauteurs, les véritables profondeurs demeurent un abîme insondable. L'obscurité inférieure s'étend à l'infini, engloutissant lumière et son de même, une gueule béante vers l'inconnu. Nombreux sont ceux qui ont osé descendre en quête de secrets perdus dans le temps, mais aucun n'est jamais revenu pour parler de ce qui gît au fond — si, effectivement, un fond existe."

  building_the_toad:0 "Le Crapaud Noir"
  building_type_the_toad:0 "Le Crapaud Noir"
  building_the_toad_desc:0 "La plus grande statue jamais construite sur l'Île des Crapauds domine le paysage, une relique monolithique d'une civilisation depuis longtemps disparue. Sculptée dans une pierre noire huileuse inconnue qui semble luire même en l'absence de lumière, elle prend la forme d'un grand crapaud — trapu, grotesque et troublant de réalisme. Nul ne sait qui la construisit, ni dans quel but, et toute signification qu'elle porta jadis s'est perdue dans le temps. Pour la plupart, ce n'est rien de plus qu'une effigie grossière et sinistre, une bizarre curiosité dans une terre déjà trempée de mystère. Pourtant, il y a des murmures — prononcés à voix basse par les habitants locaux — d'étranges rêves qui viennent à ceux qui dorment trop près, d'une chaleur troublante dans la pierre au toucher, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait de l'intérieur."
  building_type_the_toad_desc:0 "La plus grande statue jamais construite sur l'Île des Crapauds domine le paysage, une relique monolithique d'une civilisation depuis longtemps disparue. Sculptée dans une pierre noire huileuse inconnue qui semble luire même en l'absence de lumière, elle prend la forme d'un grand crapaud — trapu, grotesque et troublant de réalisme. Nul ne sait qui la construisit, ni dans quel but, et toute signification qu'elle porta jadis s'est perdue dans le temps. Pour la plupart, ce n'est rien de plus qu'une effigie grossière et sinistre, une bizarre curiosité dans une terre déjà trempée de mystère. Pourtant, il y a des murmures — prononcés à voix basse par les habitants locaux — d'étranges rêves qui viennent à ceux qui dorment trop près, d'une chaleur troublante dans la pierre au toucher, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait de l'intérieur."

  building_ax_hold:0 "Le Fort de la Hache"
  building_type_ax_hold:0 "Le Fort de la Hache"
  building_ax_hold_desc:0 "La forteresse de la Maison Xhore se dresse à la fois comme un sanctuaire et une forteresse, un bastion de pierre et d'acier bâti pour endurer les tempêtes des Îles du Basilic. Nichée au sommet de falaises déchiquetées et entourée d'eaux perfides, elle fut conçue non seulement comme une demeure, mais comme une forteresse inébranlable d'où les pirates qarthiens des Îles de l'Ouest pouvaient lancer leurs raids infâmes. Ses murs, patinés mais formidables, portent les cicatrices d'innombrables batailles, tandis que ses tours de guet imposantes offrent une vue ininterrompue sur la mer environnante, toujours vigilantes face aux proies et aux poursuivants."

  building_garden_of_malice_01:0 "Un Grand Fort Envahi"
  building_type_garden_of_malice_01:0 "Un Grand Fort Envahi"
  building_garden_of_malice_01_desc:0 "Un vaste rempart circulaire envahi entoure les ruines, ses pierres antiques à peine visibles sous les couches de lianes rampantes et de mousse épaisse. En son cœur se dresse un donjon croulant, ses tours brisées et à demi engloutis par l'étreinte impitoyable de la nature. Le temps a effacé toute l'histoire que ce lieu détint jadis, ne laissant qu'un silence sinistre et suffocant dans son sillage.\n\nPourtant, ceux qui osent franchir les portes brisées réalisent rapidement pourquoi personne n'a réclamé ces ruines — ce lieu est un piège mortel. Des haies tortueuses, devenues sauvages et contre-nature, forment un labyrinthe complexe, leurs sentiers se déplaçant et se fermant comme des êtres vivants, menant les imprudents plus profondément dans la confusion. Parmi la verdure emmêlée se tapissent des plantes aux couleurs impossibles et aux formes contre-nature, leur beauté masquant une intention mortelle. Certaines libèrent des spores qui étouffent les poumons, d'autres sécrètent des toxines qui font cloquer la peau, et quelques-unes bougent avec un dessein troublant, attendant que les proies s'approchent trop près.\n\nLes légendes murmurent que quelque chose — peut-être les vestiges d'une sorcellerie oubliée, ou la présence persistante de toute force qui régna jadis ici — maintient la flore prospérant de manières qui défient la nature. Les ruines demeurent intactes, non parce qu'elles sont oubliées, mais parce qu'elles sont craintes. Même les pillards et chercheurs de trésors les plus audacieux savent qu'il vaut mieux ne pas tenter la colère d'un lieu où les plantes elles-mêmes semblent avoir soif de sang."

  building_garden_of_malice_02:0 "Le Jardin de Malice"
  building_type_garden_of_malice_02:0 "Le Jardin de Malice"
  building_garden_of_malice_02_desc:0 "Le Jardin de Malice est une forteresse de mort stratifiée, bâtie en pierre noire huilée et encerclée de défenses mortelles. Un vaste labyrinthe mouvant de lianes épineuses, de fleurs toxiques et de haies tortueuses l'entoure, où la lumière pénètre à peine et où des prédateurs invisibles rôdent. Au-delà du labyrinthe gît une douve noire remplie d'horreurs et des murs imposants gardés par des sentinelles silencieuses. En son cœur se dresse un donjon valyrien, intact dans le temps, couronné d'un arbre pétrifié dont les racines semblent se nourrir de la forteresse elle-même. Plus qu'une forteresse, le Jardin est un lieu où la terre elle-même cherche à détruire les intrus."

  building_sapphire_quarter:0 "Le Quartier du Saphir"
  building_type_sapphire_quarter:0 "Le Quartier du Saphir"
  building_sapphire_quarter_desc:0 "Le Quartier du Saphir est un vaste district fortifié perché au sommet de la plus haute colline de Gogossos. Jadis le domaine des [dragonlords|El] d'antan, il sert désormais d'enclave exclusive des maîtres d'esclaves et princes marchands les plus illustres de la cité. Seuls les élites peuvent résider entre ses murs, car ici, seuls se dressent de grands manoirs et des palais — construits en marbre luisant et ornés d'or. Ses marchés privés sont drapés des plus fines soies, réservés à ceux qui peuvent s'offrir des luxes hors de portée des hommes moindres."

  building_crimson_gate:0 "La Porte Cramoisi"
  building_type_crimson_gate:0 "La Porte Cramoisi"
  building_crimson_gate_desc:0 "La Porte Cramoisi est la seule entrée terrestre vers Gogossos, un bastion imposant de Pierre Noire Valyrienne qui domine le pont perfide menant à la cité. Sa surface absorbe la lumière, imprégnée de sombre sorcellerie et tachée de cramoisi par d'anciens rituels de sang. Se dressant à 140 pieds de haut, le châtelet rayonne d'admiration et d'effroi, ses murs couronnés de statues de dragons aux yeux de gemmes qui semblent presque vivants. Plus qu'une barrière, la Porte Cramoisi est un monument à la puissance oubliée de Gogossos et à l'héritage sombre de Valyria."

  building_glittering_pits_01:0 "Les Fosses Scintillantes"
  building_type_glittering_pits_01:0 "Les Fosses Scintillantes"
  building_glittering_pits_01_desc:0 "Les jungles de Gogossos et l'infâme Île des Larmes sont une vaste nature sauvage indomptée — une terre grouillant à la fois de périls et de richesses inimaginables. Un véritable trésor de ressources naturelles, le feuillage dense et ombragé dissimule des merveilles au-delà de toute mesure pour ceux assez audacieux pour braver ses dangers.\n\nParmi les plus convoités de ses trésors se trouvent les diamants et les saphirs, scintillant profondément dans la terre comme l'essence piégée des étoiles. Ces gemmes précieuses, rares et d'une qualité inégalée, ont fait de la région une légende murmurée parmi les négociants et les chercheurs de fortune. Bien que les mines ici demeurent petites mais puissantes, leurs rendements sont stupéfiants, chaque excavation déterrant des pierres d'un éclat à couper le souffle."

  building_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_type_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_glittering_pits_02_desc:0 "Alors que les mines grandissent, elles s'étendent en un réseau tentaculaire de tunnels souterrains, serpentant sous le sol de la jungle comme les racines des arbres antiques au-dessus. Les murs scintillent de gemmes, leurs couleurs se reflétant dans la faible lueur des torches, et des chambres cachées sont découvertes, révélant de riches veines attendant d'être récoltées. Cependant, alors que les mineurs creusent plus profond, la jungle commence à riposter — les racines percent les murs, des spores toxiques s'attardent dans l'air, et d'étranges créatures invisibles s'agitent dans l'obscurité."

  building_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_type_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_glittering_pits_03_desc:0 "Les Profondeurs Étoilées constituent la partie la plus riche et la plus dangereuse des mines de Gogossos — un vaste labyrinthe de tunnels et de cavernes scintillantes où des saphirs sans défaut et des diamants massifs captent même la plus faible lumière, ressemblant à un ciel étoilé souterrain. Les mineurs travaillent sans relâche pour extraire ces trésors, bien que plus ils descendent, plus cela devient périlleux. Dans les chambres les plus basses, d'étranges tremblements, une chaleur oppressante et des observations murmurées de choses contre-nature ont rendu certaines zones interdites. C'est un lieu de grande richesse et de plus grand risque — où creuser trop profond pourrait réveiller quelque chose qu'il vaut mieux laisser enfoui."

  building_darkreach_quay_01:0 "Le Quai d'Obscurité"
  building_type_darkreach_quay_01:0 "Le Quai d'Obscurité"
  building_darkreach_quay_01_desc:0 "Le Quai d'Obscurité est le cœur humble mais vital du commerce de Gogossos, la première étape de la grande infrastructure portuaire de la cité. Un modeste port de pierre et de bois, il s'étend dans les eaux sombres de la baie, ses quais patinés grinçant sous le poids des navires qui arrivent. Bien que petit, il est stratégiquement positionné pour servir de point d'entrée principal aux marchands, contrebandiers et aventuriers cherchant fortune à Gogossos."

  building_darkreach_quay_02:0 "Le Port d'Obscurité"
  building_type_darkreach_quay_02:0 "Le Port d'Obscurité"
  building_darkreach_quay_02_desc:0 "Avec l'expansion de l'empire commercial de Gogossos, le Port d'Obscurité s'est mué en un hub commercial florissant, bien au-delà de ses humbles débuts. Les quais ont été renforcés de pierre et de bois robuste, permettant aux plus grands navires marchands d'ancrer en sécurité et de décharger leur cargaison exotique. De nouvelles jetées s'étendent plus loin dans les eaux sombres, accommodant un flux croissant de navires de terres lointaines, attirés par les richesses des saphirs, diamants et rares marchandises de jungle de Gogossos."

  building_darkreach_quay_03:0 "Le Port de la Marée Noire"
  building_type_darkreach_quay_03:0 "Le Port de la Marée Noire"
  building_darkreach_quay_03_desc:0 "Avec la renaissance de Gogossos, son humble port commercial d'antan a évolué en Le Port de la Marée Noire, une forteresse colossale du commerce et de la puissance navale. N'étant plus seulement un point de passage pour les négociants, il est devenu un épicentre florissant du commerce international, attirant marchands, mercenaires et chercheurs de fortune des quatre coins du monde connu.\n\nLe port est désormais fortifié de Pierre Noire Valyrienne antique, ses murs puissants encerclant les quais animés, offrant une défense inégalée contre les raids et les sièges. Ces remparts imposants, reforgés des ruines du passé, se dressent comme un témoignage de la résurgence de la cité, s'assurant que la richesse et l'influence de Gogossos demeurent intouchables."

  building_last_dragon_tower_01:0 "La Dernière Tour Dragon"
  building_type_last_dragon_tower_01:0 "La Dernière Tour Dragon"
  building_last_dragon_tower_01_desc:0 "La dernière Tour Dragon survivante en dehors de [valyria|E], bâtie dans les derniers jours avant le [doom|E], se dresse comme un monument à la fois au pouvoir et à la tragédie. Originellement construite pour abriter la famille [dragonlord|E] dirigeante de Gogossos, ses salles étaient destinées à être un symbole de leur règne éternel — pourtant le destin en prouva le contraire. Quand la famille périt dans le [doom_of_valyria|E], la tour devint une relique silencieuse d'un empire perdu, sa présence projetant une longue ombre sur la cité.\n\nDésormais, elle sert un nouveau maître — l'Archonte le plus puissant de Gogossos et sa famille, qui règnent depuis ses hauteurs altières. N'étant plus seulement un symbole de la grandeur valyrienne, la Tour Dragon est un rappel aux classes inférieures, aux esclaves et aux rebelles potentiels de la hiérarchie brutale de la cité. Elle se dresse comme un témoignage inébranlable de domination, un avertissement toujours présent que les élites de Gogossos écraseront quiconque ose se dresser contre elles."

  # Valyria
  building_type_valyria_volcano:0 "L'une des Quatorze Flammes"
  building_valyria_volcano_01:0 "Le Mont Gaelithox"
  building_type_valyria_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_01_desc:0 "Gaelithox est l'un des volcans les plus formidables parmi les légendaires Quatorze Flammes de [valyria|E]. Dominant le paysage environnant, son sommet est perpétuellement enveloppé d'un épais voile de fumée et de cendres. Les pentes du volcan sont marquées par d'anciennes coulées de lave, désormais solidifiées en formations rocheuses noires et déchiquetées, vestiges du [doom|E]."

  building_valyria_volcano_02:0 "Rhazalhar"
  building_type_valyria_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_02_desc:0 "Rhazalhar est le plus grand des Quatorze Flammes, un colosse de fureur en fusion et de puissance antique. Son sommet, constamment voilé de fumée et de cendres, perce les cieux et projette son ombre sur le paysage environnant. Des rivières de lave coulent de son cœur ardent, traçant des chemins lumineux à travers la roche volcanique sombre. À cause des températures extrêmes autour du volcan, l'extraction minière est impossible."

  building_valyria_volcano_03:0 "Epaekros"
  building_type_valyria_volcano_03:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_03_desc:0 "Epaekros est plus dangereux que les autres volcans, une beauté sauvage aux falaises instables qui font chuter des rochers sur les randonneurs et aux terrains glissants qui causent des chutes mortelles. Ceux qui atteignent son sommet rencontrent souvent une fin tragique à cause d'une vouivre de feu nichée ou d'un [dragon|El]. Pourtant, pour ceux qui parviennent à plonger dans le volcan, les richesses, l'or et les métaux précieux abondent."

  building_valyria_volcano_04:0 "Tartarax"
  building_type_valyria_volcano_04:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_desc:0 "S'élevant haut dans le ciel, bien que pas aussi haut que Rhazalhar, Tartarax est un volcan plus mince mais plus profond dont le sommet curieusement formé offre un terrain de nidification idéal pour toute créature aimant le feu. Ses cavernes profondes et ses tunnels offrent d'amples opportunités minières mais aussi la mort. La lave et les créatures hostiles abondent dans ce donjon sombre et profond. Pourtant l'éclat de sa lave majestueuse, visible de loin dans l'obscurité de la nuit, demeure inoubliable."

  building_valyria_volcano_05:0 "Yontaryos"
  building_type_valyria_volcano_05:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_05_desc:0 "Quand Yontaryos fut d'abord découvert par les anciens Valyriens, il différait des autres volcans de la région. Il était petit et relativement bas, avec peu de magma et un espace limité pour les dragons de nicher. Cependant, il avait ses utilités. Des minéraux précieux pouvaient encore être extraits de lui, et sa petite taille le rendait idéal pour les rituels et les sacrifices, bien que ses flammes ne brûlent pas aussi intensément que les autres."

  building_type_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01_desc:0 "Le Grand Port d'Elyria est un immense chantier naval bâti durant les jours de la [valyrian_freehold_short|E]. La position stratégique d'Elyria dans la Baie des Serfs fournit à cette petite île un trafic significatif de navires, de commerce et d'esclaves, que ce port massif peut accommoder. Après l'effondrement de la [valyrian_freehold_short|E], ce port captura une portion significative du commerce de la Baie des Serfs, devenant l'envie de la région et de ses environs."

  building_type_elyria_dragon_palace_01:0 "Le Palais Dragon d'Elyria"
  building_elyria_dragon_palace_01:0 "Le Palais Dragon d'Elyria"
  building_elyria_dragon_palace_01_desc:0 "Le Palais Dragon est une demeure luxueuse et grandiose offrant tout ce qu'un seigneur pourrait désirer : de grandes chambres, d'immenses salles de banquet, des bassins, des caves à vin, et bien plus encore. Bâti durant l'ère de la [valyrian_freehold_short|E] pour abriter le gouverneur d'Elyria, aucune dépense ne fut épargnée. Aujourd'hui, il abrite le Duc d'Elyria, lui accordant splendeur et renommée."

  building_valyria_dead_volcano_01:0 "Syrabelos"
  building_type_valyria_dead_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_desc:0 "Syrabelos est un volcan éteint, la lave qui coulait jadis à travers lui s'est depuis longtemps asséchée. Cela ne signifie pas qu'il soit inutile, car il demeure riche en minéraux et métaux précieux à exploiter et peut encore servir de refuge durant les raids ou les tempêtes."

  building_valyria_dead_volcano_01_02:0 "Les Mines de Syrabelos"
  building_type_valyria_dead_volcano_01_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_02_desc:0 "Les opérations minières ont été restaurées à Syrabelos. Les esclaves descendent quotidiennement dans les fosses pour extraire les métaux précieux et autres matériaux de valeur pour leurs oppresseurs."

  building_valyria_dead_volcano_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_desc:0 "Qazdarsos fut jadis un volcan actif mais ne l'est plus. Désormais dormant mais pas silencieux, les cris des vouivres de feu et, selon certains, même des fantômes peuvent encore être entendus de ses profondeurs. Certains ont osé s'y aventurer sans un groupe assez grand et ne furent jamais revus."

  building_valyria_dead_volcano_02_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_02_desc:0 "Les mines de Qazdarsos sont à nouveau pleinement opérationnelles. Les esclaves extraient quotidiennement richesse et or pour leurs maîtres. Cependant, les récits d'êtres surnaturels et de créatures maudites persistent concernant l'intérieur du volcan. Que ceux-ci soient vrais ou juste les divagations d'esclaves est une autre question..."

  building_royal_barracks_of_valyria_01:0 "Les Casernes Royales Ruinées de Valyria"
  building_type_royal_barracks_of_valyria_01:0 "Les Casernes Royales Ruinées de Valyria"
  building_royal_barracks_of_valyria_01_desc:0 "Jadis de grandes casernes de la [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont désormais qu'en ruines et guère plus qu'un tas de gravats."
  building_type_royal_barracks_of_valyria_01_desc:0 "Jadis de grandes casernes de la [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont désormais qu'en ruines et guère plus qu'un tas de gravats."

  building_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_type_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_royal_barracks_of_valyria_02_desc:0 "Les Casernes Royales restaurées de Valyria, bâties sur les anciennes ruines, voient désormais les gardes et soldats aller et venir pour assurer la sécurité des voyageurs et citoyens."

  building_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_type_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_great_arena_of_valyria_01_desc:0 "Jadis une grande arène remplie de gladiateurs et de spectateurs, elle n'est désormais qu'en ruines. La restaurer sera coûteux, mais cela pourrait ramener la joie au peuple."

  building_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_type_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_great_arena_of_valyria_02_desc:0 "Désormais reconstruite, la Grande Arène attire des milliers de spectateurs pour assister aux tournois et jeux sanglants où professionnels et esclaves meurent dans le sable pour le divertissement du peuple."

  building_great_library_of_valyria_01:0 "Les Ruines Décrépites de la Bibliothèque"
  building_type_great_library_of_valyria_01:0 "Les Ruines Décrépites de la Bibliothèque"
  building_great_library_of_valyria_01_desc:0 "Les vestiges en ruines de la grande bibliothèque pourraient être restaurés pour abriter de grandes œuvres d'art et de littérature."

  building_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_type_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_great_library_of_valyria_02_desc:0 "La Grande Bibliothèque restaurée de Valyria, remplie de grandes œuvres d'art, de littérature et de philosophie. Les érudits et académiques étudient les textes antiques et les rouleaux ici."

  building_valyria_veilspire_peak:0 "Le Pic de Veilspire"
  building_type_valyria_veilspire_peak:0 "Le Pic de Veilspire"
  building_valyria_veilspire_peak_desc:0 "Le Pic de Veilspire est le sommet de montagne le plus haut de toute la péninsule valyrienne, même avant le [doom|E]. Jadis utilisé comme pèlerinage sacré pour les plus braves et les plus forts, ce grand sommet représente une épreuve divine. On dit que ceux qui parviennent à grimper jusqu'au sommet reviennent plus sages et plus savants."

  building_velakar_resort_01:0 "Un Ancien Resort en Ruines"
  building_type_velakar_resort_01:0 "Un Ancien Resort en Ruines"
  building_velakar_resort_01_desc:0 "Jadis un Grand Resort pour les [dragonlords|El] et riches marchands, ce resort n'est désormais qu'en ruines, guère mieux qu'un tas de briques."

  building_velakar_resort_02:0 "L'Illustre Resort de Velakar"
  building_type_velakar_resort_02:0 "L'Illustre Resort de Velakar"
  building_velakar_resort_02_desc:0 "L'Illustre Resort de Velakar, désormais restauré, accueille les gens de richesse et de statut pour se baigner et se détendre dans ce resort majestueux digne d'un empereur. Utilisant la chaleur volcanique pour réchauffer les bains et avec des milliers de servants à leur service, c'est véritablement un spectacle à contempler."

  building_aurions_lost_expedition:0 "L'Expédition Perdue d'Aurion"
  building_type_aurions_lost_expedition:0 "L'Expédition Perdue d'Aurion"
  building_aurions_lost_expedition_desc:0 "Voici l'expédition perdue de l'autoproclamé Empereur de Valyria, Aurion Varezys. Cette plaine stérile est désormais le site d'inhumation de 30 000 hommes, réduits à de simples tas de métal et d'ossements, souillés par les radiations et les gaz toxiques des geysers de soufre. C'est véritablement un paysage infernal."

  building_type_lokirian_barracks_01:0 "Les Casernes de Lokiria"
  building_type_lokirian_barracks_01_desc:0 "Les puissantes Casernes de Lokiria, fameuses pour la qualité de leurs armes."
  building_lokirian_barracks_01:0 "Les Vestiges d'une Caserne"
  building_lokirian_barracks_01_desc:0 "Jadis les puissantes casernes de Lokiria, désormais réduites à rien d'autre qu'un tas de gravats."
  building_lokirian_barracks_02:0 "Les Casernes Partiellement Restaurées"
  building_lokirian_barracks_02_desc:0 "Bien qu'une grande partie de leur grandeur d'antan soit perdue, les casernes ont été rendues opérationnelles. Les soldats s'entraînent à l'intérieur, leurs voix résonnant à travers les salles à demi finies."
  building_lokirian_barracks_03:0 "Les Puissantes Casernes de Lokiria"
  building_lokirian_barracks_03_desc:0 "Les casernes de Lokiria, désormais reconstruites et fortifiées avec la pierre-dragon et l'acier valyrien. Les soldats marchent jour et nuit, présentant un spectacle imposant et un cauchemar pour quiconque ose assiéger."


  building_redwyrms_wrath_01:0 "La Forteresse en Ruines"
  building_type_redwyrms_wrath_01:0 "La Forteresse en Ruines"
  building_redwyrms_wrath_01_desc:0 "La Fureur du Wyrm Rouge était une forteresse redoutable faite de murs de pierre-dragon et de flèches élancées, jadis ornée des crânes de dragons abattus comme sinistres trophées de ses conquêtes. Gouvernée par le Seigneur Protecteur Taurion de Lokiria, elle était un bastion de guerre et de domination, ses bannières cramoisis inspirant la peur à travers les terres. Désormais en ruines, la Fureur du Wyrm Rouge n'est que l'ombre de sa gloire passée, ses murs brisés et bannières fanées se dressant comme reliques du règne violent de Lokiria."

  building_redwyrms_wrath_02:0 "La Fureur du Wyrm Rouge"
  building_type_redwyrms_wrath_02:0 "La Forteresse en Ruines"
  building_redwyrms_wrath_02_desc:0 "La Fureur du Wyrm Rouge s'est relevée à nouveau, ses murs de pierre-dragon restaurés dans leur gloire sinistre, dominant à nouveau le paysage comme un symbole de terreur et de pouvoir. Une fois de plus ornée de crânes de [dragon|El] et de bannières cramoisis portant le blason du Dragon Rouge de Lokiria, la forteresse exsude une détermination sombre. Reconstruite à la fois comme monument à la guerre et déclaration de domination, la Fureur du Wyrm Rouge inspire à la fois peur et respect, sa renaissance témoignage d'un héritage durable de conquête."

  building_valyrian_gate_01:0 "Les Ruines de la Porte"
  building_type_valyrian_gate_01:0 "Les Ruines de la Porte"
  building_valyrian_gate_01_desc:0 "Les ruines de la jadis grande Porte de Valyria, un puissant symbole de richesse et de pouvoir désormais rien de plus qu'un tas de briques."

  building_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_type_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_valyrian_gate_02_desc:0 "La Grande Porte de Valyria, sept portes et sept herses faites et renforcées d'Acier Valyrien. Des milliers de marchands et voyageurs passent par ces portes. D'immenses statues de héros jadis grands peuvent être vues au sommet de l'entrée."

  building_great_harbor_of_valyria_01:0 "La Baie pour un Port"
  building_type_great_harbor_of_valyria_01:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_01_desc:0 "Cette baie est assez large et profonde pour y construire un grand port. Pour l'instant, il n'y a pas grand-chose ici, excepté du poisson."

  building_great_harbor_of_valyria_02:0 "Les Quais et Ateliers de Réparation"
  building_type_great_harbor_of_valyria_02:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_02_desc:0 "Pour faciliter le commerce et la construction navale, et pour établir un riche hub commercial et le contrôle maritime, nous devons construire un grand port. Pour l'instant, nous construirons de longs quais et des ateliers de réparation pour la production navale. Nous ajouterons aussi une cabine d'intendant pour le commerce et un bureau d'inspection pour taxer et nous assurer qu'aucune marchandise de contrebande n'entre dans notre cité."

  building_great_harbor_of_valyria_03:0 "Les Jetées"
  building_type_great_harbor_of_valyria_03:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_03_desc:0 "Construire des jetées et étendre l'infrastructure actuelle nous permettra d'accommoder plus de navires et d'augmenter le commerce entrant. Ces extensions seront aussi utilisées pour amarrer les vaisseaux militaires servant notre flotte."

  building_great_harbor_of_valyria_04:0 "Les Grues et Fournitures de Construction Navale"
  building_type_great_harbor_of_valyria_04:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_04_desc:0 "En construisant de grandes grues, nous pouvons grandement augmenter l'efficacité de notre port et permettre à plus de navires d'arriver et de partir. Nous construirons aussi une zone de fournitures de construction navale près du port pour améliorer l'efficacité de construction de nos navires de guerre. Avec ce Grand Port, personne ne pourra nous défier en mer."

  building_great_temple_of_valyria_01:0 "La Colline pour un Temple"
  building_type_great_temple_of_valyria_01:0 "Le Temple Dragon de Valyria"
  building_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il y a une colline près du Mont Tartarax que nous pourrions utiliser pour construire un Temple Magnifique et Illustre pour nos Dieux Dragons. Le fait qu'elle soit proche d'un volcan convient encore mieux à nos besoins."
  building_type_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il y a une colline près du Mont Tartarax que nous pourrions utiliser pour construire un Temple Magnifique et Illustre pour nos Dieux Dragons. Le fait qu'elle soit proche d'un volcan convient encore mieux à nos besoins."

  building_great_temple_of_valyria_02:0 "La Salle de Prière et Lieu de Rassemblement"
  building_type_great_temple_of_valyria_02:0 "Le Temple Dragon de Valyria"
  building_great_temple_of_valyria_02_desc:0 "Nous commencerons avec une salle de prière richement décorée remplie d'artefacts coûteux — des sculptures de dragons et de feu, des tapisseries dépeignant des dragons, des braseros, et le plus beau marbre que nous puissions trouver. Nous créerons aussi une salle ouverte séparée pour les sacrifices humains."

  building_great_temple_of_valyria_03:0 "L'Arène Ardente"
  building_type_great_temple_of_valyria_03:0 "Le Temple Dragon de Valyria"
  building_great_temple_of_valyria_03_desc:0 "Les Valyriens ont toujours brûlé leurs morts. Brûler nos morts dans un Temple près de notre volcan est une bien meilleure façon d'honorer ceux qui ont quitté ce monde. Nous étendrons la salle ouverte que nous avons déjà construite à cette fin. Des colonnes sculptées, des fleurs exotiques, et un autel de pierre noire pour remplacer les bûchers de bois utilisés pour les sacrifices humains et la crémation des morts seront construits."

  building_great_temple_of_valyria_04:0 "Les Statues de Dragons"
  building_type_great_temple_of_valyria_04:0 "Le Temple Dragon de Valyria"
  building_great_temple_of_valyria_04_desc:0 "Aucun bâtiment en Valyria n'est véritablement complet sans des statues de dragons. Nous construirons 14 statues, une pour chaque Dieu. Chaque statue sera unique et majestueuse pour honorer proprement nos Dieux."

  building_great_walls_of_valyria_01:0 "Les Vestiges Insignifiants du Mur"
  building_type_great_walls_of_valyria_01:0 "Les Grands Murs de Pierre Noire de Valyria"
  building_great_walls_of_valyria_01_desc:0 "Cette zone est où se trouvent les vestiges des Grands Murs de Valyria. Il ne reste presque rien, car les murs furent détruits durant le [doom|E]. Les quelques vestiges qui ont survécu sont si endommagés qu'ils sont inutilisables. Bien sûr, nous pourrions restaurer ces murs à leur grandeur passée, et nous devrions le faire. Inutile de dire que ce sera une entreprise très coûteuse."

  building_great_walls_of_valyria_02:0 "Les Grands Murs de Pierre Noire de Valyria"
  building_type_great_walls_of_valyria_02:0 "Les Grands Murs de Pierre Noire de Valyria"
  building_great_walls_of_valyria_02_desc:0 "Les murs de Valyria ont été entièrement restaurés, imposants et vastes, encerclant toute la cité. Ces fortifications massives sont si larges que douze chars pourraient courir côte à côte (prenez ça, Volantis !). Les tours de guet et les douves bordent désormais le périmètre, offrant des couches supplémentaires de défense. Les entrées sont renforcées de herses et de zones de tir, rendant toute tentative d'envahir la cité par la force presque impossible pour tout assaillant."

  building_great_dragonkeep_of_valyria_01:0 "Le Site du Palais"
  building_type_great_dragonkeep_of_valyria_01:0 "Le Grand Donjon Dragon de Valyria"
  building_great_dragonkeep_of_valyria_01_desc:0 "Nous avons localisé un site potentiel pour un grand palais. À l'avenir, il deviendra le lieu de grandeur. Mais pour l'instant, il n'y a pas grand-chose de notable ici."

  building_great_dragonkeep_of_valyria_02:0 "Poser les Fondations"
  building_type_great_dragonkeep_of_valyria_02:0 "Le Grand Donjon Dragon de Valyria"
  building_great_dragonkeep_of_valyria_02_desc:0 "Pour abriter les dirigeants de cette grande cité, nous aurons besoin d'un palais imposant. Non, le plus grand palais que le monde ait jamais vu. Cela nécessitera, bien sûr, beaucoup d'esclaves et d'or, mais ces ressources peuvent être acquises. Ce palais sera un témoignage de la grandeur valyrienne. Nous commencerons avec un donjon et continuerons notre expansion à partir de là."

  building_great_dragonkeep_of_valyria_03:0 "Les Murs Extérieurs"
  building_type_great_dragonkeep_of_valyria_03:0 "Le Grand Donjon Dragon de Valyria"
  building_great_dragonkeep_of_valyria_03_desc:0 "Pour nous assurer que ce donjon sera imprenable, nous construirons nos murs exclusivement en pierre noire. Ces murs hauts et épais repousseront tous les ennemis et individus indésirables. Construire des murs épais et hauts seulement avec de la pierre noire sera, bien sûr, très coûteux."

  building_great_dragonkeep_of_valyria_04:0 "Les Murs Intérieurs et la Décoration"
  building_type_great_dragonkeep_of_valyria_04:0 "Le Grand Donjon Dragon de Valyria"
  building_great_dragonkeep_of_valyria_04_desc:0 "Maintenant que nous avons construit les murs extérieurs, nous devons ériger des murs intérieurs pour améliorer la sécurité et améliorer l'efficacité de nos fortifications. Des portes, herses et créneaux seront construits. De plus, nous décorerons le grand donjon avec des soies, tapisseries, trophées, et beaucoup d'autres choses pour afficher notre splendeur."

  building_procrazion_01:0 "Le Grand Château Abandonné"
  building_type_procrazion_01:0 "Procrazion"
  building_procrazion_01_desc:0 "Procrazion fut jadis un bastion du pouvoir valyrien, siégeant au sommet de la montagne centrale au cœur de la cité. Avant le [doom|E], ce grand château servait de hub militaire et politique, agissant comme un centre de défense pour toute la région. Bien qu'une grande partie de sa structure demeure intacte, le temps n'a pas été clément avec ses salles jadis glorieuses. Les ponts de pierre qui le reliaient jadis à la cité environnante sont désormais détruits, et l'intérieur montre des signes clairs de décomposition. Les Tours Dragon imposantes se dressent encore, mais leurs chambres sont vides, et la forge jadis active est désormais dormante. Malgré cela, sa position élevée et ses points d'entrée limités offrent encore un avantage stratégique. Bien qu'encore imposant, Procrazion n'est que l'ombre de lui-même, attendant d'être restauré à sa gloire passée."

  building_procrazion_02:0 "Procrazion"
  building_type_procrazion_02:0 "Procrazion"
  building_procrazion_02_desc:0 "Procrazion a été restauré à sa gloire passée, se dressant fièrement au sommet de la montagne au cœur de la cité. Ce grand château est à nouveau relié à la cité en dessous par des ponts reconstruits, offrant l'accès sans besoin de dragons. Les Tours Dragon ont aussi été restaurées, fournissant entrée et sortie pour les créatures majestueuses, tandis que les tours à dôme brillent comme elles le faisaient avant le [doom|E]. À l'intérieur, il est équipé de toutes les commodités attendues pour un seigneur de la région, offrant confort et luxe même durant un siège. La forge unique d'un côté de la montagne a été réactivée, canalisant à nouveau la lave pour créer des armes puissantes. Sa position élevée, combinée à sa restauration et ses points d'entrée limités, s'assure qu'il demeure presque imprenable, capable de résister à toute menace. Désormais entièrement restauré, Procrazion sert non seulement de forteresse défensive mais aussi de symbole de la résurgence de la cité."

  building_eternal_flame_temple_01:0 "Le Temple Abandonné"
  building_type_eternal_flame_temple_01:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_01_desc:0 "Le Temple de la Flamme Éternelle était présumément le point de connexion entre les Anciens Dieux de Valyria et les guerriers valyriens. Outre être le centre religieux pour le peuple commun, le temple s'élevait jadis haut comme un symbole de la puissance religieuse de Valyria ; désormais il gît poussiéreux et abandonné. Aujourd'hui, il demeure un vague souvenir de ce qui fut jadis un Haut Temple vénéré de la cosmogonie valyrienne."

  building_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_type_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_02_desc:0 "Le Temple de la Flamme Éternelle a désormais été renouvelé et se dresse comme un symbole de puissance, de religion et de pouvoir. Ses murs restaurés racontent les histoires des anciens dieux et sont remplis de légendes jadis connues seulement des anciens Valyriens. Le peuple commun peut désormais jouir du luxe et rêver de ce que les dragons et la magie purent être avant le [doom|E]. Les guerriers viennent et prient pour être remplis de la rage et de la puissance des dragons qui les précédèrent. Le temple brille vivement comme un phare de foi religieuse, d'espoir et de puissance valyrienne ancienne et nouvelle."

  building_red_guard_barracks_01:0 "Les Casernes Abandonnées"
  building_type_red_guard_barracks_01:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_01_desc:0 "Le quartier général jadis fier de l'élite Garde Rouge de la cité, gît désormais abandonné et attaché aux anciens murs de la cité. Le temps tout-puissant a érodé ses environs et son intérieur, où les créneaux brisés et la structure rouillée parlent d'abandon post-[doom|E]. À l'arrière, deux tours Dragon ne sont désormais que réminiscence de ce qui fut jadis la puissance militaire. Les chambres ne sont désormais remplies que des fantômes du temps passé et de la force désormais perdue. Malgré sa décomposition, ces casernes aspirent à la restauration pour redevenir à nouveau le bouclier formidable de la cité."

  building_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_type_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_02_desc:0 "Complètement restaurées à près de leur puissance valyrienne, les Casernes de la Garde Rouge sont la demeure renouvelée des défenseurs de la cité, gisant près des glorieux murs de la cité. La structure de pierre rappelle sa gloire passée, renforcée, puissante et remplie d'histoires et de cicatrices. Les Tours Dragon respirent la vie et la vitalité, dans la probabilité de quand de vrais dragons rugissaient dans les hauts cieux. Les casernes ne sont plus accueillies par des fantômes, mais par la Garde Rouge élite récemment restaurée, remplie de discipline énergisante, d'excellence et de gloire inégalée. Dans un mélange complexe d'ancienne et nouvelle technologie, le bâtiment protège à nouveau la cité et protège tous ceux qui sont à l'intérieur."

  building_red_guard_training_compound_01:0 "Le Complexe d'Entraînement Abandonné"
  building_type_red_guard_training_compound_01:0 "Le Complexe d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_01_desc:0 "Les murs en décomposition échouent à raconter les histoires des Gardes Rouges désormais partis qui s'entraînaient ici. Ce Complexe d'Entraînement fut jadis un bâtiment respecté et admiré rempli de dragons, guerriers et dirigeants qui gît désormais abandonné et vide, incapable de portrayer son énergie et sa gloire longuement oubliées. Les armes, donjons et équipement rouillé peuvent encore être trouvés ici, mais on se demande comment cela put être durant sa gloire."

  building_red_guard_training_compound_02:0 "Le Complexe d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_02_desc:0 "La force, l'honneur et le pouvoir sont ce qu'on peut trouver en regardant le Complexe d'Entraînement de la Garde Rouge restauré. Rempli d'hommes tentant de leur mieux de s'honorer en devenant partie de l'Élite Garde Rouge, le complexe héberge des stratèges, dirigeants et guerriers, tous visant à être les meilleurs. Avec de glorieux piliers l'entourant avec grâce, et un toit tenu haut avec des fenêtres rouges pour montrer que le ciel est la seule limite, ce bâtiment entraîne désormais les plus grands guerriers et les plus fins dirigeants."

  building_type_zanpur_volcano_01:0 "Le Mont Zanpur"
  building_zanpur_volcano_01:0 "Le Mont Zanpur"
  building_zanpur_volcano_01_desc:0 "Zanpur est le volcan jumeau le plus occidental des îles Marahai."

  building_type_yovesh_volcano_01:0 "Le Mont Yovesh"
  building_yovesh_volcano_01:0 "Le Mont Yovesh"
  building_yovesh_volcano_01_desc:0 "Yovesh est le volcan jumeau le plus oriental des îles Marahai."

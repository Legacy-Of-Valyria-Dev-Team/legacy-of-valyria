  building_valyria_dead_volcano_02_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_02_desc:0 "Les mines de Qazdarsos sont à nouveau pleinement opérationnelles. Les esclaves extraient quotidiennement richesses et or pour leurs maîtres. Toutefois, les récits d'êtres surnaturels et de créatures maudites hantant l'intérieur du volcan persistent. Que ces histoires soient véridiques ou non reste une autre question..."

  building_royal_barracks_of_valyria_01:0 "La Caserne en Ruines de Valyria"
  building_type_royal_barracks_of_valyria_01:0 "La Caserne en Ruines de Valyria"
  building_royal_barracks_of_valyria_01_desc:0 "Autrefois une grande caserne du Détroit destinée à défendre la cité, elle n'est aujourd'hui plus qu'un tas de gravats."
  building_type_royal_barracks_of_valyria_01_desc:0 "Autrefois une grande caserne du Détroit destinée à défendre la cité, elle n'est aujourd'hui plus qu'un tas de gravats."

  building_royal_barracks_of_valyria_02:0 "La Caserne Royale de Valyria"
  building_type_royal_barracks_of_valyria_02:0 "La Caserne Royale de Valyria"
  building_royal_barracks_of_valyria_02_desc:0 "La Caserne Royale de Valyria, restaurée sur les anciennes ruines, voit désormais gardes et soldats aller et venir pour assurer la sécurité des voyageurs et des citoyens."

  building_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_type_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_great_arena_of_valyria_01_desc:0 "Autrefois une grande arène remplie de gladiateurs et de spectateurs, elle est désormais en ruines. La restaurer serait coûteux, mais elle pourrait redonner de la joie au peuple."

  building_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_type_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_great_arena_of_valyria_02_desc:0 "Désormais reconstruite, la Grande Arène attire des milliers de spectateurs pour assister à des tournois et des jeux sanglants où professionnels et esclaves meurent dans le sable pour divertir le peuple."

  building_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_type_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_great_library_of_valyria_01_desc:0 "Les ruines de la grande bibliothèque pourraient être restaurées pour accueillir de grands chefs-d’œuvre d'art et de littérature."

  building_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_type_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_great_library_of_valyria_02_desc:0 "La Grande Bibliothèque de Valyria restaurée, remplie de chefs-d'œuvre artistiques, littéraires et philosophiques. Des érudits et des académiciens y étudient d'anciens textes et parchemins."

  building_valyria_veilspire_peak:0 "Le Pic de Voilepic"
  building_type_valyria_veilspire_peak:0 "Le Pic de Voilepic"
  building_valyria_veilspire_peak_desc:0 "Le Pic de Voilepic est le sommet le plus élevé de toute la péninsule valyrienne, même avant le Fléau. Jadis utilisé comme pèlerinage sacré pour les plus courageux et forts, ce grand sommet représente une épreuve divine. On dit que ceux qui parviennent à en atteindre le sommet reviennent plus sages et plus instruits."

  building_velakar_resort_01:0 "Un Ancien Complexe en Ruines"
  building_type_velakar_resort_01:0 "Un Ancien Complexe en Ruines"
  building_velakar_resort_01_desc:0 "Autrefois un grand complexe de villégiature pour les Dragonlords et les riches marchands, ce complexe est aujourd'hui en ruines, guère mieux qu'un tas de briques."

  building_velakar_resort_02:0 "Le Prestigieux Complexe de Velakar"
  building_type_velakar_resort_02:0 "Le Prestigieux Complexe de Velakar"
  building_velakar_resort_02_desc:0 "Le Prestigieux Complexe de Velakar, désormais restauré, accueille les personnes de richesse et de statut pour se baigner et se détendre dans ce majestueux complexe digne d'un empereur. Utilisant la chaleur volcanique pour chauffer les bains et avec des milliers de serviteurs à leur service, c'est véritablement un spectacle à contempler."

  building_aurions_lost_expidition:0 "L'Expédition Perdue d'Aurion"
  building_type_aurions_lost_expidition:0 "L'Expédition Perdue d'Aurion"
  building_aurions_lost_expidition_desc:0 "Voici l'expédition perdue de l'autoproclamé Empereur de Valyria, Aurion Varezys. Cette plaine désolée est désormais le lieu de sépulture de 30 000 hommes, réduits à de simples amas de métal et d'os, souillés par la radiation et les gaz toxiques provenant des geysers sulfureux. C'est véritablement un paysage infernal."

  building_lokirian_barracks_01:0 "Les Vestiges d'une Caserne"
  building_lokirian_barracks_01_desc:0 "Autrefois les puissantes casernes de Lokiria, aujourd'hui réduites à un simple tas de décombres."

  building_lokirian_barracks_02:0 "Les Puissantes Casernes de Lokiria"
  building_lokirian_barracks_02_desc:0 "Les casernes de Lokiria, désormais reconstruites et fortifiées avec de la pierre-dragon et de l'acier valyrien. Des soldats y défilent jour et nuit, offrant un spectacle imposant et un cauchemar pour quiconque oserait entreprendre un siège."

  building_redwyrms_wrath_01:0 "Forteresse en Ruines"
  building_type_redwyrms_wrath_01:0 "Forteresse en Ruines"
  building_redwyrms_wrath_01_desc:0 "La Fureur du Ver Rouge était une forteresse redoutable faite de murs de pierre-dragon et de hautes flèches, autrefois ornée des crânes de dragons abattus comme trophées de ses conquêtes. Gouvernée par le Seigneur Protecteur Taurion de Lokiria, elle était un bastion de guerre et de domination, ses bannières cramoisies inspirant la peur à travers tout le territoire. Aujourd'hui en ruines, la Fureur du Ver Rouge n'est plus qu'une ombre de sa gloire passée, ses murs brisés et ses bannières fanées témoignant des anciens jours de règne violent de Lokiria."

  building_redwyrms_wrath_02:0 "La Fureur du Ver Rouge"
  building_type_redwyrms_wrath_02:0 "Forteresse en Ruines"
  building_redwyrms_wrath_02_desc:0 "La Fureur du Ver Rouge s'est relevée, ses murs de pierre-dragon restaurés dans toute leur sombre splendeur, dominant à nouveau le paysage comme symbole de terreur et de pouvoir. De nouveau ornée de crânes de dragons et de bannières cramoisies arborant le sigil du Dragon Rouge de Lokiria, la forteresse exhale une sombre détermination. Rebâtie à la fois comme monument de guerre et déclaration de domination, la Fureur du Ver Rouge inspire à la fois crainte et respect, sa renaissance témoignant d'un legs durable de conquête."

  building_valyrian_gate_01:0 "Ruines de la Porte"
  building_type_valyrian_gate_01:0 "Ruines de la Porte"
  building_valyrian_gate_01_desc:0 "Ruines de l'ancienne grande Porte de Valyria, autrefois puissant symbole de richesse et de pouvoir, désormais réduit à un simple amas de briques."

  building_valyrian_gate_02:0 "La Grande Porte de Valyria"
  building_type_valyrian_gate_02:0 "La Grande Porte de Valyria"
  building_valyrian_gate_02_desc:0 "La Grande Porte de Valyria, composée de sept portes et de sept herses, a été forgée et renforcée avec de l'Acier Valyrien. Des milliers de marchands et de voyageurs traversent ces immenses portails. D'énormes statues de héros d'antan peuvent être vues au sommet de l'entrée."

  building_great_harbor_of_valyria_01:0 "Baie pour un Port"
  building_type_great_harbor_of_valyria_01:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_01_desc:0 "Cette baie est suffisamment grande et profonde pour qu'un grand port puisse y être construit. Pour l'instant, il n'y a pas grand-chose ici, si ce n'est des poissons."

  building_great_harbor_of_valyria_02:0 "Quais et Ateliers de Réparation"
  building_type_great_harbor_of_valyria_02:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_02_desc:0 "Pour faciliter le commerce et la construction navale, et établir un riche carrefour commercial et une suprématie maritime, nous devons construire un grand port. Pour commencer, nous érigerons de longs quais et des ateliers de réparation pour la production de navires. Nous ajouterons également une cabane d'intendance pour le commerce ainsi qu'un bureau d'inspection pour taxer et vérifier que nulle marchandise de contrebande n'entre dans notre cité."

  building_great_harbor_of_valyria_03:0 "Quais"
  building_type_great_harbor_of_valyria_03:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_03_desc:0 "Construire des quais supplémentaires et étendre les infrastructures existantes nous permettra d'accueillir davantage de navires et d'augmenter les flux commerciaux entrants. Ces expansions permettront également d'amarrer les vaisseaux militaires au service de notre flotte."

  building_great_harbor_of_valyria_04:0 "Grues et Dépôts de Construction Navale"
  building_type_great_harbor_of_valyria_04:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_04_desc:0 "En érigeant de grandes grues, nous augmenterons considérablement l'efficacité de notre port et faciliterons l'arrivée et le départ de nombreux navires. Nous construirons également un dépôt de construction navale près du port afin d'améliorer la production de nos navires de guerre. Avec ce Grand Port, nul ne pourra plus contester notre suprématie maritime."

  building_great_temple_of_valyria_01:0 "Colline pour un Temple"
  building_type_great_temple_of_valyria_01:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il existe une colline près du Mont Tartarax que nous pourrions utiliser pour ériger un Temple Magnifique et Illustre dédié à nos Dieux Dragons. Le fait qu'elle soit proche d'un volcan rend ce site encore plus propice."
  building_type_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il existe une colline près du Mont Tartarax que nous pourrions utiliser pour ériger un Temple Magnifique et Illustre dédié à nos Dieux Dragons. Le fait qu'elle soit proche d'un volcan rend ce site encore plus propice."

  building_great_temple_of_valyria_02:0 "Salle de Prière et Lieu de Rassemblement"
  building_type_great_temple_of_valyria_02:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_02_desc:0 "Nous commencerons par une salle de prière richement décorée, remplie d'artefacts précieux — sculptures de dragons et de flammes, tapisseries représentant des dragons, braseros, et les plus beaux marbres que nous pourrons trouver. Nous créerons également une grande salle ouverte dédiée aux sacrifices humains."

  building_great_temple_of_valyria_03:0 "Arène de Crémation"
  building_type_great_temple_of_valyria_03:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_03_desc:0 "Les Valyriens ont toujours brûlé leurs morts. Incinérer nos défunts dans un Temple proche de notre volcan est une manière plus noble de leur rendre hommage. Nous agrandirons la salle ouverte existante pour cet usage. Nous érigerons des colonnes sculptées, planterons des fleurs exotiques et construirons un autel de pierre noire pour remplacer les bûchers de bois utilisés pour les sacrifices humains et les crémations."

  building_great_temple_of_valyria_04:0 "Statues de Dragons"
  building_type_great_temple_of_valyria_04:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_04_desc:0 "Aucun édifice à Valyria n'est véritablement complet sans statues de dragons. Nous érigerons quatorze statues, une pour chacun de nos Dieux. Chaque statue sera unique et majestueuse pour honorer dignement nos Divinités."

  building_great_walls_of_valyria_01:0 "Vestiges Insignifiants du Mur"
  building_type_great_walls_of_valyria_01:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_great_walls_of_valyria_01_desc:0 "C'est ici que se trouvent les vestiges des Grandes Murailles de Valyria. Il ne reste presque rien, car les murs furent détruits durant le Fléau. Les rares fragments ayant survécu sont si endommagés qu'ils sont inutilisables. Bien sûr, nous pourrions restaurer ces murailles pour leur redonner leur splendeur d'antan, et nous devrions le faire. Mais ce sera une entreprise extrêmement coûteuse."

  building_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_type_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_great_walls_of_valyria_02_desc:0 "Les murailles de Valyria sont pleinement restaurées, imposantes et vastes, encerclant toute la cité. Ces fortifications massives sont si larges que douze chars pourraient y courir côte à côte (prenez cela, Volantis !). Des tours de guet et des douves bordent désormais le périmètre, offrant des couches supplémentaires de défense. Les entrées sont renforcées par des herses et des zones de tir, rendant toute tentative d'invasion pratiquement impossible."

  building_great_dragonkeep_of_valyria_01:0 "Site pour un Palais"
  building_type_great_dragonkeep_of_valyria_01:0 "Le Grand Donjon du Dragon de Valyria"
  building_great_dragonkeep_of_valyria_01_desc:0 "Nous avons trouvé un emplacement idéal pour construire un grand palais. À l'avenir, ce lieu deviendra un symbole de grandeur. Mais pour l'instant, il n'y a guère à y voir."

  building_great_dragonkeep_of_valyria_02:0 "Pose des Fondations"
  building_type_great_dragonkeep_of_valyria_02:0 "Le Grand Donjon du Dragon de Valyria"
  building_great_dragonkeep_of_valyria_02_desc:0 "Pour abriter les souverains de cette grande cité, nous avons besoin d'un palais imposant. Non, du plus grand palais que le monde ait jamais vu. Cela exigera bien sûr beaucoup d'esclaves et d'or, mais ces ressources peuvent être acquises. Ce palais sera un témoignage éclatant de la grandeur valyrienne. Nous commencerons par un donjon avant d'étendre notre projet."

  building_great_dragonkeep_of_valyria_03:0 "Murailles Extérieures"
  building_type_great_dragonkeep_of_valyria_03:0 "Le Grand Donjon du Dragon de Valyria"
  building_great_dragonkeep_of_valyria_03_desc:0 "Pour assurer l'invincibilité de notre forteresse, nous érigerons nos murailles exclusivement en pierre noire. Ces murs hauts et épais repousseront tous les ennemis et intrus. Construire de telles murailles exclusivement en pierre noire sera, bien entendu, très onéreux."

  building_great_dragonkeep_of_valyria_04:0 "Murailles Intérieures et Décorations"
  building_type_great_dragonkeep_of_valyria_04:0 "Le Grand Donjon du Dragon de Valyria"
  building_great_dragonkeep_of_valyria_04_desc:0 "À présent que nous avons bâti les murailles extérieures, nous devons ériger des murailles intérieures pour améliorer la sécurité et renforcer l'efficacité de nos défenses. Nous installerons des portes, herses et créneaux. Par ailleurs, nous ornerons le Grand Donjon de soieries, tapisseries, trophées et bien d'autres merveilles pour afficher notre splendeur."

  building_procrazion_01:0 "Grand Château Abandonné"
  building_type_procrazion_01:0 "Procrazion"
  building_procrazion_01_desc:0 "Procrazion fut autrefois un bastion de la puissance valyrienne, juché au sommet de la montagne centrale au cœur de la cité. Avant le Fléau, ce grand château servait de centre militaire et politique, agissant comme un pivot de défense pour toute la région. Bien qu'une grande partie de sa structure demeure intacte, le temps n'a pas épargné ses glorieuses salles d'antan. Les ponts de pierre qui le reliaient à la ville environnante sont désormais détruits, et l'intérieur porte les marques évidentes de la décadence. Les hautes Tours de Dragons se dressent encore, mais leurs chambres sont vides, et la forge autrefois animée est aujourd'hui silencieuse. Malgré tout, sa position élevée et ses accès limités offrent encore un avantage stratégique. Toujours imposant, Procrazion n'est plus qu'une ombre de lui-même, attendant d'être restauré à sa gloire passée."

  building_procrazion_02:0 "Procrazion"
  building_type_procrazion_02:0 "Procrazion"
  building_procrazion_02_desc:0 "Procrazion a été restauré dans toute sa splendeur, dominant fièrement la montagne au cœur de la cité. Ce grand château est de nouveau relié à la ville par des ponts reconstruits, offrant un accès sans nécessiter de dragons. Les Tours de Dragons ont été remises en état, permettant aux majestueuses créatures d'entrer et de sortir, tandis que les tours à dôme brillent comme avant le Fléau. L'intérieur est doté de tous les aménagements dignes d'un seigneur de la région, offrant confort et luxe même en temps de siège. La forge unique, située sur un flanc de la montagne, a été ranimée, canalisant à nouveau la lave pour forger de puissantes armes. Sa position élevée, alliée à sa restauration et à ses points d'entrée limités, garantit qu'il demeure presque imprenable. Désormais pleinement restauré, Procrazion sert non seulement de forteresse défensive mais aussi de symbole de la résurgence de la cité."

  building_eternal_flame_temple_01:0 "Temple Abandonné"
  building_type_eternal_flame_temple_01:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_01_desc:0 "Le Temple de la Flamme Éternelle était vraisemblablement le lieu de connexion entre les Anciens Dieux de Valyria et les guerriers valyriens. En plus d’être un centre religieux pour le peuple, il s’élevait autrefois haut dans le ciel comme un symbole de la puissance religieuse de Valyria ; désormais, il repose poussiéreux et abandonné. Aujourd'hui, il demeure une vague réminiscence de ce qui fut autrefois un Haut Temple vénéré de la cosmogonie valyrienne."

  building_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_type_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_02_desc:0 "Le Temple de la Flamme Éternelle a été restauré et se dresse désormais comme un symbole de puissance, de religion et de gloire. Ses murs rénovés racontent les histoires des anciens dieux et regorgent de légendes autrefois connues uniquement des anciens Valyriens. Le peuple peut désormais admirer ses luxes et rêver de ce que furent les dragons et la magie avant le Fléau. Les guerriers viennent prier pour être emplis de la rage et de la force des dragons d'autrefois. Le temple brille désormais tel un phare de foi religieuse, d'espoir et de puissance, tant ancienne que nouvelle."

  building_red_guard_barracks_01:0 "Caserne Abandonnée"
  building_type_red_guard_barracks_01:0 "La Caserne de la Garde Rouge"
  building_red_guard_barracks_01_desc:0 "L'ancien quartier général de la prestigieuse Garde Rouge de la cité gît désormais à l'abandon, adossé aux antiques murailles. Le temps, maître impitoyable, a érodé ses alentours et son intérieur, où les créneaux brisés et les structures rouillées témoignent de l'abandon après le Fléau. À l'arrière, deux Tours de Dragons ne sont plus que vestiges de ce qui fut autrefois une grande puissance militaire. Les chambres sont désormais peuplées des fantômes du passé et de forces disparues. Malgré sa décadence, cette caserne aspire encore à renaître pour redevenir l'invincible bouclier de la cité."

  building_red_guard_barracks_02:0 "La Caserne de la Garde Rouge"
  building_type_red_guard_barracks_02:0 "La Caserne de la Garde Rouge"
  building_red_guard_barracks_02_desc:0 "Restaurée presque à la hauteur de sa splendeur valyrienne, la Caserne de la Garde Rouge est à nouveau le refuge des défenseurs de la cité, accolée aux majestueuses murailles. La structure de pierre rappelle sa gloire d'antan, renforcée, puissante et marquée par l'histoire. Les Tours de Dragons vibrent à nouveau de vie et de vigueur, évoquant l'époque où de véritables dragons régnaient dans les cieux. La caserne n'accueille plus les fantômes, mais la Garde Rouge restaurée, imprégnée de discipline, d'excellence et de gloire sans pareilles. Dans une harmonieuse fusion d'ancienneté et de technologies nouvelles, ce bâtiment protège désormais la cité et abrite tous ceux qui s'y réfugient."

  building_red_guard_training_compound_01:0 "Camp d'Entraînement Abandonné"
  building_type_red_guard_training_compound_01:0 "Le Camp d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_01_desc:0 "Des murs en ruine peinent à raconter les histoires des Gardes Rouges disparus qui s’entraînaient ici. Ce Camp d'Entraînement fut jadis un bâtiment respecté et admiré, empli de dragons, de guerriers et de chefs. Désormais abandonné et vide, il n'arrive plus à retranscrire l’énergie et la gloire oubliées de ses jours passés. Armes rouillées, geôles délabrées et équipements antiques témoignent silencieusement de ce qui fut."

  building_red_guard_training_compound_02:0 "Le Camp d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_02_desc:0 "Force, honneur et puissance sont les valeurs que l’on perçoit aujourd'hui en contemplant le Camp d'Entraînement restauré de la Garde Rouge. Rempli d'hommes aspirant à rejoindre l'élite, le camp accueille stratèges, chefs et guerriers déterminés à devenir les meilleurs. Entouré de splendides piliers et surmonté d’un toit orné de vitraux rouges symbolisant que seul le ciel est la limite, cet édifice forme désormais les plus grands des guerriers et les plus fins des leaders."

  building_type_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01_desc:0 "Zanpur est le volcan jumeau le plus occidental des îles Marahai."

  building_type_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01_desc:0 "Yovesh est le volcan jumeau le plus oriental des îles Marahai."

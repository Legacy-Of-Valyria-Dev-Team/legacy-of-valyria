l_french:
  # Braavos
  building_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_type_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_agot_EE_titan_of_braavos_desc:0 "Compté par le célèbre scribe westerosi Lomas Longstrider parmi les Merveilles Façonnées par l'Homme, le Titan de Braavos se dresse tel le premier rempart de la Cité Libre de Braavos, gardien de l'étroit passage vers la lagune où repose la cité. Cette colossale statue de granit et de bronze, sculptée à l'image d'un guerrier farouche, sert à la fois de forteresse imprenable et de phare pour les navires égarés. Les meurtrières dissimulées sous sa jupe d'airain et les fentes pour archers parsemant sa cuirasse offrent une défense quasi impénétrable contre toute flotte ennemie osant s'aventurer dans ses eaux sacrées"

  building_agot_EE_sealords_palace:0 "Le Palais du Seigneur des Mers"
  building_type_agot_EE_sealords_palace:0 "Le Palais du Seigneur des Mers"
  building_agot_EE_sealords_palace_desc:0 "Le Palais du Seigneur des Mers est la demeure du souverain de Braavos. Sous les dômes miroitants et les tours élancées de ce vaste palais, se trouve une ménagerie fabuleuse où s'ébattent des créatures exotiques venues des quatre coins du monde connu, témoignage vivant de la puissance et de l'influence du maître de ces lieux"

  # Volantis
  building_agot_EE_black_walls_of_old_volantis:0 "Les Murailles Noires"
  building_type_agot_EE_black_walls_of_old_volantis:0 "Les Murailles Noires"
  building_agot_EE_black_walls_of_old_volantis_desc:0 "Le cœur battant de Volantis. Érigée par l'antique [valyrian_freehold|E], cette imposante muraille de pierre noire fusionnée protège un dédale de palais, cours intérieures, tours altières et temples mystérieux. Seuls ceux dont le sang remonte aux ancêtres valyriens, le Sang Ancien, sont autorisés à demeurer en son sein impénétrable"

  building_agot_EE_volantis_harbor:0 "Port de Volantis"
  building_type_agot_EE_volantis_harbor:0 "Port de Volantis"
  building_agot_EE_volantis_harbor_desc:0 "La puissance de Volantis provient en partie de son vaste havre, favorisé par sa position géographique exceptionnelle. Cette immense étendue en forme de croissant, construite à l'embouchure même du Risou, pourrait, dit-on, contenir l'entièreté de Braavos en son sein. Telle est la grandeur de ce port où convergent les richesses du monde entier"

  building_agot_EE_the_long_bridge:0 "Le Pont Long"
  building_type_agot_EE_the_long_bridge:0 "Le Pont Long"
  building_agot_EE_the_long_bridge_desc:0 "Le Pont Long relie les deux moitiés de Volantis et demeure le plus long ouvrage d'art du monde connu. Édifié par l'ancienne Valyria en son apogée de pierre fusionnée par les flammes draconiques, la légende prétend qu'il pourrait supporter le poids de mille éléphants de guerre sans fléchir sous leur charge formidable"

  building_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_type_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_agot_EE_temple_of_the_lord_of_light_desc:0 "Ce temple colossal s'élève bien au-delà de toute autre construction de la cité. Ses couleurs éblouissantes d'or, de rouge et d'orange en font un spectacle véritablement saisissant pour les yeux mortels. Gardé par la Main Ardente, ce sanctuaire est consacré à R'hllor, le Maître de la Lumière, et constitue probablement l'un des plus grands témoignages de sa puissance divine encore existant en ce monde troublé"

  building_agot_EE_volantis_walls:0 "Les Remparts de Volantis"
  building_type_agot_EE_volantis_walls:0 "Les Remparts de Volantis"
  building_agot_EE_volantis_walls_desc:0 "Bien que moins impressionnants que ceux de la Vieille Volantis, les remparts de Volantis feront réfléchir à deux fois tout assaillant téméraire qui songerait à prendre d'assaut la cité des marchands et des esclaves"

  # Rhoyne
  building_agot_EE_nymeria_palace_01:0 "Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_01:0 "Palais de Nymeria"
  building_agot_EE_nymeria_palace_01_desc:0 "Au cœur de Ny Sar gisent les ruines du Palais de Nymeria, abandonné depuis que le [valyrian_freehold|E] vainquit le Prince Garin lors de la Seconde Guerre des Épices. Ses murailles de marbre rose et vert, ses dômes vertigineux et ses flèches majestueuses ne sont plus désormais qu'une coquille vide et hantée de sa splendeur d'antan. Toute vie quitta ces lieux lorsque Nymeria s'enfuit vers Dorne, laissant ces salles jadis si fières se déliter au fil des âges"

  building_agot_EE_nymeria_palace_02:0 "Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_02:0 "Palais de Nymeria"
  building_agot_EE_nymeria_palace_02_desc:0 "Se dressant à nouveau fièrement au cœur de Ny Sar, le Palais de Nymeria a été méticuleusement restauré, témoignage de la résilience et du patrimoine rhoynar. Le marbre aux teintes vives de vert et de rose miroite sous le soleil, tandis que de grands dômes et des flèches élancées dominent désormais l'horizon, effaçant presque les souvenirs de son passé tragique et oublié"

  building_agot_EE_palace_of_love_01:0 "Palais du Chagrin"
  building_type_agot_EE_palace_of_love_01:0 "Palais du Chagrin" 
  building_agot_EE_palace_of_love_01_desc:0 "Le Palais du Chagrin se dresse tel un rappel funeste du destin qui s'abattit sur Chroyane, la Cité des Festivals. Ses tours délabrées, recouvertes de mousse et de lianes ténébreuses, ne révèlent plus rien de la beauté que le Palais de l'Amour incarnait jadis. Des statues à demi-immergées et les hommes de pierre hantent désormais ses salles brumeuses et dévastées par le temps"

  building_agot_EE_palace_of_love_02:0 "Palais de l'Amour"
  building_type_agot_EE_palace_of_love_02:0 "Palais de l'Amour"
  building_agot_EE_palace_of_love_02_desc:0 "Le Palais de l'Amour orne à nouveau les rives du Risou, renaissance époustouflante de l'ancienne gloire de Chroyane. Ses tours s'élèvent vers les cieux, parées de mosaïques chatoyantes et de sculptures délicates célébrant la vie, la beauté et l'amour éternel. La lumière du soleil se réfléchit sur les fontaines cristallines qui alimentent les jardins luxuriants, déversant des cascades de fleurs sur chaque terrasse. Sous ses dômes majestueux, les unions sont à nouveau bénies, emplissant Chroyane de la promesse de nouveaux commencements"

  building_agot_EE_bridge_of_dream_01:0 "Pont du Songe"
  building_type_agot_EE_bridge_of_dream_01:0 "Pont du Songe"
  building_agot_EE_bridge_of_dream_01_desc:0 "Autrefois rival du Pont Long de Volantis, le Pont du Songe surplombe désormais le Risou dans une brume épaisse et inquiétante. Ses arches de pierre s'élevaient jadis à quarante pieds au-dessus du fleuve, mais se sont effondrées sous le poids de la mousse dense et des lianes noires qui les étreignent. Devenu repaire des hommes de pierre, il se dresse tel un monument silencieux et pourrissant de l'orgueil perdu des Rhoynar"

  building_agot_EE_bridge_of_dream_02:0 "Pont du Songe"
  building_type_agot_EE_bridge_of_dream_02:0 "Pont du Songe"
  building_agot_EE_bridge_of_dream_02_desc:0 "Le Pont du Songe enjambe à nouveau le Risou dans toute sa magnificence retrouvée. S'élevant à quarante pieds au-dessus du fleuve impétueux, ses arches de pierre pâle se dressent, puissantes et défiant le temps. Des jardins luxuriants bordent la travée de bois du pont, fleurissant de mille couleurs envoûtantes. Ce pont grandiose, jadis perdu dans les méandres du temps et de la ruine, a ressuscité des cendres de l'histoire. Un symbole de la fierté et de la résilience rhoynar qui règne à nouveau sur les eaux vives du Risou!"

  # Meereen
  building_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_type_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_agot_EE_great_pyramid_of_meereen_desc:0 "De loin le plus imposant édifice de la cité, la Grande Pyramide de Meereen fut érigée par une véritable armée d'esclaves, dont un millier périrent durant sa construction titanesque. La pyramide sert de centre administratif de Meereen, et sa Grande Salle accueille depuis des siècles les souverains qui y reçoivent leurs sujets dans une démonstration éclatante de leur pouvoir absolu"

  # Asshaï
  building_stygai_01:0 "Cité Hantée de Stygai"
  building_type_stygai_01:0 "Stygai"
  building_stygai_01_desc:0 "Stygai, l'énigmatique et antique cité voilée au cœur ténébreux des Contrées de l'Ombre, demeure l'un des mystères les plus terrifiants du monde connu. D'un âge insondable et drapée d'éternelles ténèbres, la cité se dresse tel un monument d'une ère oubliée des mortels. Même les plus audacieux des conjurateurs d'ombres n'osent s'aventurer dans ses rues maudites. Ses flèches vertigineuses et ses venelles labyrinthiques seraient, dit-on, parcourues par des démons et créatures innommables. Enveloppée de secrets, ses véritables origines et l'étendue de ses sombres pouvoirs demeurent un mystère impénétrable"

  # Gogossos
  building_red_citadel_01:0 "La Tour Rouge"
  building_type_red_citadel_01:0 "La Tour Rouge"
  building_red_citadel_01_desc:0 "Une imposante tour côtière, considérée comme l'ultime vestige d'une forteresse jadis puissante, sert désormais de principal bastion à la cité. Bien que la majeure partie de l'édifice originel ait été engloutie par les âges, ce dernier rempart perdure—modeste mais d'une robustesse extraordinaire et hautement défendable. D'épaisses murailles de pierre érodée résistent fermement tant aux éléments qu'aux potentiels sièges, faisant de ce lieu un siège d'autorité inébranlable au sein de Gogossos. Sans être encore une citadelle majestueuse, elle demeure un fief redoutable, fondation sur laquelle de plus grandes fortifications pourront un jour s'élever"

  building_red_citadel_02:0 "La Redoute Rouge"
  building_type_red_citadel_02:0 "La Redoute Rouge"
  building_red_citadel_02_desc:0 "Désormais renforcée d'une robuste palissade de bois et de tours de guet surplombant les anciennes Reliques Cramoisies, cette redoute s'est muée en une place forte plus redoutable, capable de résister à des menaces prolongées. N'étant plus une simple tour côtière isolée, les défenses élargies permettent dorénavant d'accueillir une garnison conséquente, offrant un solide point d'ancrage au sein de Gogossos. Avec d'amples provisions et des positions fortifiées, elle pourrait même soutenir une armée durant des lunes entières si nécessaire, marquant ainsi sa transformation d'une simple relique du passé en un véritable bastion de puissance au cœur de la cité"

  building_red_citadel_03:0 "La Citadelle Rouge"
  building_type_red_citadel_03:0 "La Citadelle Rouge"
  building_red_citadel_03_desc:0 "Jadis simple vestige du passé, la Citadelle Rouge a été reconstruite en une vaste et inébranlable forteresse, dominant Gogossos telle le siège suprême du pouvoir de la cité. N'étant plus une simple tour solitaire, elle se dresse désormais comme un donjon et bastion entièrement restauré, ses colossales murailles de pierre noire valyrienne s'élevant hautes et épaisses, monument de domination et d'effroi.\n\nÀ l'instar de la Porte Pourpre, les murs de la Citadelle Rouge furent autrefois imprégnés de rituels de magie du sang pratiqués par les anciens Valyriens, leur sorcellerie teignant à jamais la pierre d'un cramoisi profond et surnaturel. Bien que les rituels se soient évanouis dans les brumes de l'histoire, leur sombre héritage perdure, faisant de la citadelle non seulement un bastion quasi impénétrable, mais aussi un symbole funeste de pouvoir absolu.\n\nEn son cœur, la Tour Rouge transperce le firmament, sa présence projetant une ombre démesurée sur la cité, rappel constant de l'autorité de l'archonte. Les murs inférieurs et la cour demeurent luisants de sang, non seulement des rituels d'antan mais des innombrables exécutions, trahisons et conflits brutaux qui se sont déroulés sur ses pierres. Le sang des rebelles, conspirateurs et ennemis de l'État a imprégné ses fondations, assurant que la terreur soit tissée dans la trame même de la forteresse.\n\nOn murmure qu'entre ces murs, la Mort Rouge prit jadis racine, malédiction qui ravagea autrefois Gogossos, laissant des quartiers entiers noyés dans le sang et la souffrance. Bien que cette affliction se soit depuis longtemps évanouie dans les annales, d'aucuns prétendent que la citadelle s'en souvient encore, que les spectres des mourants s'attardent dans ses chambres les plus profondes, chuchotant à ceux qui prêtent l'oreille.\n\nLieu de règne inflexible et de légende, la Citadelle Rouge est bien plus qu'une simple forteresse—elle est le cœur indomptable de Gogossos, un lieu où le pouvoir est absolu, la clémence rare, et la rébellion écrasée avant même de naître"

  building_pit_of_sorrows_01:0 "Donjon et Ruines Envahis"
  building_type_pit_of_sorrows_01:0 "Donjon et Ruines Envahis"
  building_pit_of_sorrows_01_desc:0 "Un donjon en ruines, ses murailles jadis puissantes désormais drapées de lianes rampantes et englouties par l'étreinte implacable de la nature, se dresse dans un silence lugubre. Des arbres ont pris racine dans ses cours, leurs branches tortueuses griffant le ciel, comme pour témoigner d'horreurs oubliées.\n\nMalgré la décrépitude, le donjon demeure étrangement défendable—ses tours, bien qu'érodées, se dressent encore avec une présence imposante. Sa porte, à demi enfouie sous la mousse et les décombres, suggère une forteresse qui refuse de céder entièrement au temps.\n\nPourtant, quelque chose semble profondément dérangeant en ce lieu. L'air est chargé d'une immobilité contre nature, de celles qui font frissonner la peau et troublent l'esprit. Des ombres s'attardent là où elles ne devraient point être, et des murmures—trop ténus pour n'être que le vent—semblent flotter à travers les ruines, évoquant des secrets qu'il vaudrait mieux laisser en paix"

  building_pit_of_sorrows_02:0 "Donjon et Excavations de la Fosse"
  building_type_pit_of_sorrows_02:0 "Donjon et Excavations de la Fosse"
  building_pit_of_sorrows_02_desc:0 "À mesure que nous intensifions nos efforts et dégageons l'épais enchevêtrement de végétation, nous fîmes une découverte saisissante—le sol sous nos pieds semblait descendre sans fin, peu importe la quantité de boue et de débris que nous retirions. Ce qui paraissait d'abord être une simple végétation dissimulant les ruines se révéla être une vaste descente stratifiée, chaque niveau inférieur exposant des vestiges du passé.\n\nParmi les pierres croulantes et la terre humide, nous déterrâmes d'innombrables ossements—leurs origines inconnues, leurs histoires depuis longtemps perdues. À chaque pas vers les profondeurs, une certitude grandissante s'empara de nous: ceci pourrait bien être la légendaire Fosse du Chagrin, un lieu murmuré dans de craintives légendes, ses profondeurs inviolées et ses mystères attendant encore d'être dévoilés"

  building_pit_of_sorrows_03:0 "La Fosse du Chagrin"
  building_type_pit_of_sorrows_03:0 "La Fosse du Chagrin"
  building_pit_of_sorrows_03_desc:0 "L'antique Fosse du Chagrin, jadis ruine croulante, a été méticuleusement reconstruite et restaurée dans sa sinistre splendeur d'antan. Pourtant, malgré tous les efforts pour reconquérir ses hauteurs, les véritables profondeurs demeurent un abîme insondable. Les ténèbres inférieures s'étendent à l'infini, engloutissant lumière et son, telle une gueule béante vers l'inconnu. Nombreux sont ceux qui ont osé descendre en quête de secrets perdus dans les méandres du temps, mais nul n'est jamais revenu conter ce qui gît au fond—si tant est qu'un fond existe vraiment"

  building_the_toad:0 "Le Crapaud Noir"
  building_type_the_toad:0 "Le Crapaud Noir"
  building_the_toad_desc:0 "La plus imposante statue jamais érigée sur l'Île des Crapauds domine le paysage, relique monolithique d'une civilisation depuis longtemps évanouie. Sculptée dans une pierre noire inconnue, huileuse, qui semble miroiter même en l'absence de lumière, elle prend la forme d'un immense crapaud—trapu, grotesque et d'une ressemblance troublante. Nul ne sait qui l'édifia, ni dans quel dessein, et quelle que fût sa signification jadis, elle s'est depuis longtemps perdue dans les brumes du temps. Pour la plupart, ce n'est rien de plus qu'une effigie grossière et sinistre, une étrange curiosité dans une contrée déjà imprégnée de mystère. Pourtant, on murmure—en des chuchotements étouffés parmi les autochtones, d'étranges songes qui visitent ceux qui dorment trop près, d'une chaleur inquiétante émanant de la pierre lorsqu'on la touche, et d'yeux qui semblent luire juste sous sa surface, comme si quelque chose observait depuis ses profondeurs"
  building_type_the_toad_desc:0 "La plus imposante statue jamais érigée sur l'Île des Crapauds domine le paysage, relique monolithique d'une civilisation depuis longtemps évanouie. Sculptée dans une pierre noire inconnue, huileuse, qui semble miroiter même en l'absence de lumière, elle prend la forme d'un immense crapaud—trapu, grotesque et d'une ressemblance troublante. Nul ne sait qui l'édifia, ni dans quel dessein, et quelle que fût sa signification jadis, elle s'est depuis longtemps perdue dans les brumes du temps. Pour la plupart, ce n'est rien de plus qu'une effigie grossière et sinistre, une étrange curiosité dans une contrée déjà imprégnée de mystère. Pourtant, on murmure—en des chuchotements étouffés parmi les autochtones, d'étranges songes qui visitent ceux qui dorment trop près, d'une chaleur inquiétante émanant de la pierre lorsqu'on la touche, et d'yeux qui semblent luire juste sous sa surface, comme si quelque chose observait depuis ses profondeurs"

  building_ax_hold:0 "Le Bastion de la Hache"
  building_type_ax_hold:0 "Le Bastion de la Hache"
  building_ax_hold_desc:0 "Le fief de la Maison Xhore se dresse à la fois comme sanctuaire et forteresse, bastion de pierre et d'acier érigé pour endurer les tempêtes des Îles du Basilic. Niché au sommet de falaises déchiquetées et cerné d'eaux traîtresses, il fut conçu non point comme simple demeure, mais comme place forte inébranlable d'où les pirates qarthiens des Îles Occidentales pouvaient lancer leurs raids infâmes. Ses murailles, érodées mais formidables, portent les cicatrices d'innombrables batailles, tandis que ses tours de guet élancées offrent une vue imprenable sur la mer environnante, toujours aux aguets tant pour les proies que pour les poursuivants"

  building_garden_of_malice_01:0 "Un Vaste Fort Envahi par la Végétation"
  building_type_garden_of_malice_01:0 "Un Vaste Fort Envahi par la Végétation"
  building_garden_of_malice_01_desc:0 "Une enceinte gigantesque et envahie par la végétation encercle les ruines, ses anciennes pierres à peine visibles sous les couches de lianes rampantes et d'épaisse mousse. En son cœur se dresse un donjon croulant, ses tours brisées et à demi englouties par l'étreinte implacable de la nature. Le temps a effacé quelle que fût l'histoire que ce lieu renfermait jadis, ne laissant qu'un silence lugubre et suffocant dans son sillage.\n\nPourtant, ceux qui osent franchir les portes fracassées réalisent rapidement pourquoi nul n'a reconquis ces ruines—ce lieu est un piège mortel. Des haies tortueuses, devenues sauvages et contre nature, forment un labyrinthe complexe, leurs chemins se déplaçant et se refermant comme des êtres vivants, entraînant les imprudents toujours plus profondément dans la confusion. Parmi la verdure enchevêtrée s'embusquent des plantes aux couleurs impossibles et aux formes surnaturelles, leur beauté masquant des intentions meurtrières. Certaines libèrent des spores qui étouffent les poumons, d'autres sécrètent des toxines qui brûlent la peau, et quelques-unes se meuvent avec une détermination inquiétante, attendant qu'une proie s'approche trop près.\n\nLes légendes murmurent que quelque chose—peut-être les vestiges d'une sorcellerie oubliée, ou la présence persistante de la force qui régnait ici—maintient la flore florissante d'une manière qui défie la nature. Les ruines demeurent intactes, non parce qu'elles sont oubliées, mais parce qu'elles sont craintes. Même les plus hardis pillards et chercheurs de trésors savent qu'il ne faut point tenter le courroux d'un lieu où les plantes elles-mêmes semblent assoiffées de sang"

  building_garden_of_malice_02:0 "Le Jardin de Malveillance"
  building_type_garden_of_malice_02:0 "Le Jardin de Malveillance"
  building_garden_of_malice_02_desc:0 "Le Jardin de Malveillance est une forteresse aux strates mortelles, érigée en pierre noire huilée et ceinte de défenses létales. Un vaste dédale mouvant de lianes épineuses, de floraisons vénéneuses et de haies tortueuses l'entoure, où la lumière ne perce guère et où rôdent des prédateurs invisibles. Par-delà ce labyrinthe s'étend une douve noire grouillante d'horreurs et des remparts imposants gardés par des sentinelles taciturnes. En son cœur se dresse un donjon valyrien, que le temps n'a point altéré, couronné d'un arbre pétrifié dont les racines semblent se repaître de la forteresse elle-même. Plus qu'une simple citadelle, le Jardin est un lieu où la terre elle-même cherche à anéantir les intrus"

  building_sapphire_quarter:0 "Le Quartier des Saphirs"
  building_type_sapphire_quarter:0 "Le Quartier des Saphirs"
  building_sapphire_quarter_desc:0 "Le Quartier des Saphirs est un vaste district fortifié perché sur la plus haute colline de Gogossos. Jadis domaine des anciens Seigneurs-Dragons, il sert désormais d'enclave exclusive aux plus illustres maîtres d'esclaves et princes marchands de la cité. Seule l'élite peut résider derrière ses murs, car ici ne s'élèvent que manoirs grandioses et palais somptueux—érigés de marbre étincelant et parés d'or fin. Ses marchés privés sont drapés des plus fines soieries, réservés à ceux qui peuvent s'offrir des luxes hors de portée du commun des mortels"

  building_crimson_gate:0 "La Porte Cramoisie"
  building_type_crimson_gate:0 "La Porte Cramoisie"
  building_crimson_gate_desc:0 "La Porte Cramoisie est l'unique accès terrestre à Gogossos, un imposant bastion de pierre noire valyrienne qui surplombe le pont perfide menant à la cité. Sa surface avale la lumière, imprégnée de sorcellerie obscure et maculée de pourpre par d'antiques rituels de sang. S'élevant à cent quarante pieds, le corps de garde irradie crainte et effroi, ses murailles couronnées de statues de dragons dont les yeux de gemme semblent presque vivants. Plus qu'une simple barrière, la Porte Cramoisie est un monument à la puissance oubliée de Gogossos et au sombre héritage de Valyria"

  building_glittering_pits_01:0 "Les Fosses Miroitantes"
  building_type_glittering_pits_01:0 "Les Fosses Miroitantes"
  building_glittering_pits_01_desc:0 "Les jungles de Gogossos et la tristement célèbre Île des Larmes forment une vaste étendue sauvage indomptée—terre foisonnant de périls et de richesses inimaginables. Véritable trésor de ressources naturelles, le feuillage dense et ombragé dissimule des merveilles sans pareilles pour ceux assez hardis pour braver ses dangers.\n\nParmi les plus convoités de ses trésors se trouvent les diamants et saphirs, scintillant au plus profond de la terre telle l'essence emprisonnée des étoiles. Ces gemmes précieuses, rares et d'une qualité inégalée, ont fait de la région une légende chuchotée parmi les marchands et les chercheurs de fortune. Bien que les mines demeurent modestes mais puissantes, leurs rendements sont stupéfiants, chaque excavation dévoilant des pierres d'une brillance époustouflante"

  building_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_type_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_glittering_pits_02_desc:0 "À mesure que les mines s'agrandissent, elles s'étendent en un réseau tentaculaire de tunnels souterrains, serpentant sous le sol de la jungle telles les racines des arbres anciens qui les surplombent. Les parois scintillent de gemmes, leurs couleurs se reflétant dans la faible lueur des torches, et des chambres secrètes sont découvertes, révélant de riches filons attendant d'être exploités. Cependant, à mesure que les mineurs creusent plus profond, la jungle commence à se rebeller—des racines jaillissent à travers les murs, des spores toxiques flottent dans l'air, et d'étranges créatures invisibles s'agitent dans les ténèbres"

  building_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_type_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_glittering_pits_03_desc:0 "Les Profondeurs Étoilées sont la partie la plus riche et la plus périlleuse des mines de Gogossos — un vaste labyrinthe de tunnels et de cavernes scintillantes où des saphirs sans défaut et d'immenses diamants captent la moindre lueur, évoquant un ciel étoilé sous terre. Les mineurs œuvrent sans relâche pour extraire ces trésors, mais plus ils s'enfoncent, plus le danger s'accroît. Dans les chambres les plus profondes, d'étranges tremblements, une chaleur oppressante et des murmures sur l'apparition de créatures contre nature ont rendu certaines zones interdites. C'est un lieu de grande richesse et de périls plus grands encore, où creuser trop profondément pourrait éveiller quelque chose qui aurait dû rester enseveli"

  building_darkreach_quay_01:0 "Quai de Sombreval"
  building_type_darkreach_quay_01:0 "Quai de Sombreval"
  building_darkreach_quay_01_desc:0 "Le Quai de Sombreval est le cœur humble mais vital du commerce de Gogossos, première étape de la grandiose infrastructure portuaire de la cité. Modeste havre de pierre et de bois, il s'étend dans les eaux sombres de la baie, ses appontements usés gémissant sous le poids des navires arrivants. Bien que petit, il est stratégiquement positionné pour servir de point d'entrée principal aux marchands, contrebandiers et aventuriers en quête de fortune à Gogossos"

  building_darkreach_quay_02:0 "Havre de Sombreval"
  building_type_darkreach_quay_02:0 "Havre de Sombreval"
  building_darkreach_quay_02_desc:0 "Avec l'expansion de l'empire commercial de Gogossos, le Havre de Sombreval s'est mué en un centre florissant de négoce, bien au-delà de ses humbles débuts. Les quais ont été renforcés de pierre et de robuste bois d'œuvre, permettant à de plus grands vaisseaux marchands de jeter l'ancre en toute sécurité et de décharger leurs cargaisons exotiques. De nouvelles jetées s'étendent plus avant dans les eaux ténébreuses, accueillant un flux croissant de navires venus de contrées lointaines, attirés par les richesses des saphirs, diamants et rares produits de la jungle de Gogossos"

  building_darkreach_quay_03:0 "Le Port de la Marée Noire"
  building_type_darkreach_quay_03:0 "Le Port de la Marée Noire"
  building_darkreach_quay_03_desc:0 "Avec la renaissance de Gogossos, son port commercial jadis modeste s'est métamorphosé en Port de la Marée Noire, forteresse colossale de commerce et de puissance navale. N'étant plus un simple point de passage pour les marchands, il est devenu l'épicentre florissant du négoce international, attirant commerçants, mercenaires et chercheurs de fortune des quatre coins du monde connu.\n\nLe port est désormais fortifié de pierre noire valyrienne, ses puissantes murailles encerclant les quais animés, offrant une défense inégalée contre razzias et sièges. Ces imposants remparts, reforgés des ruines du passé, se dressent en témoignage de la résurgence de la cité, garantissant que la richesse et l'influence de Gogossos demeurent intouchables"

  building_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
  building_type_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
  building_last_dragon_tower_01_desc:0 "La dernière Tour du Dragon subsistant hors de Valyria, érigée aux derniers jours avant le Fléau, se dresse tel un monument à la fois de puissance et de tragédie. Originellement construite pour abriter la famille régnante des Seigneurs-Dragons de Gogossos, ses salles devaient symboliser leur règne éternel — mais le destin en décida autrement. Lorsque la famille périt dans l'anéantissement de Valyria, la tour devint une relique silencieuse d'un empire perdu, sa présence projetant une longue ombre sur la cité.\n\nDésormais, elle sert un nouveau maître — l'Archonte de Gogossos et sa lignée, qui règnent depuis ses hauteurs vertigineuses. N'étant plus seulement symbole de la grandeur valyrienne, la Tour du Dragon rappelle aux basses classes, aux esclaves et aux rebelles potentiels la brutale hiérarchie de la cité. Elle se dresse comme un témoignage inébranlable de domination, avertissement perpétuel que l'élite de Gogossos écrasera quiconque osera se dresser contre elle"

  # Valyria
  building_type_valyria_volcano:0 "L'une des Quatorze Flammes"

  building_valyria_volcano_01:0 "Mont Gaelithox"
  building_type_valyria_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_01_desc:0 "Gaelithox compte parmi les volcans les plus redoutables des légendaires Quatorze Flammes de Valyria. Dominant le paysage environnant de sa stature colossale, son sommet demeure perpétuellement voilé d'un épais linceul de fumée et de cendres. Les flancs du titan sont marqués par d'antiques coulées de lave, désormais solidifiées en formations rocheuses noires et acérées, vestiges silencieux du Fléau qui emporta jadis la gloire de Valyria"

  building_valyria_volcano_02:0 "Rhazalhar"
  building_type_valyria_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_02_desc:0 "Rhazalhar est le plus imposant des Quatorze Flammes, colosse de fureur incandescente et de puissance ancestrale. Sa cime, éternellement voilée de fumée et de cendres, transperce les cieux et projette son ombre sur les terres qui l'entourent. Des rivières de lave s'écoulent de son cœur embrasé, traçant des sillons lumineux à travers la roche volcanique ténébreuse. En raison des températures extrêmes qui règnent autour du volcan, toute tentative d'exploitation minière se révèle impossible"

  building_valyria_volcano_03:0 "Epaekros"
  building_type_valyria_volcano_03:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_03_desc:0 "Epaekros se montre plus périlleux que ses frères volcaniques, beauté sauvage aux falaises instables qui précipitent des rochers sur les téméraires randonneurs et aux sols traîtres qui provoquent des chutes mortelles. Ceux qui atteignent son sommet connaissent souvent une fin tragique due à quelque vouivre de feu ou dragon nichant en ces lieux. Pourtant, pour les rares qui parviennent à plonger dans les entrailles du volcan, richesses, or et métaux précieux abondent au-delà de toute mesure"

  building_valyria_volcano_04_01:0 "Tartarax"
  building_type_valyria_volcano_04_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_01_desc:0 "S'élevant haut dans les cieux, quoique moins vertigineusement que Rhazalhar, Tartarax est un volcan plus élancé mais plus profond, dont le sommet curieusement façonné offre un refuge idéal à toute créature éprise de flammes. Ses profondes cavernes et tunnels recèlent d'amples opportunités de prospection minière, mais aussi la mort. Lave et créatures hostiles pullulent en ce donjon obscur et abyssal. Pourtant, la lueur de sa lave majestueuse, visible de loin dans les ténèbres nocturnes, demeure à jamais gravée dans la mémoire de quiconque la contemple"

  building_valyria_volcano_04_02:0 "Tartarax"
  building_type_valyria_volcano_04_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_02_desc:0 "S'élevant haut dans les cieux, quoique moins vertigineusement que Rhazalhar, Tartarax est un volcan plus élancé mais plus profond, dont le sommet curieusement façonné offre un refuge idéal à toute créature éprise de flammes. Ses profondes cavernes et tunnels recèlent d'amples opportunités de prospection minière, mais aussi la mort. Lave et créatures hostiles pullulent en ce donjon obscur et abyssal. Pourtant, la lueur de sa lave majestueuse, visible de loin dans les ténèbres nocturnes, demeure à jamais gravée dans la mémoire de quiconque la contemple"

  building_valyria_volcano_05:0 "Yontaryos"
  building_type_valyria_volcano_05:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_05_desc:0 "Lorsque Yontaryos fut découvert par les anciens Valyriens, il se distinguait des autres volcans de la région. De taille modeste et relativement peu élevé, avec un magma parcimonieux et un espace limité pour les nids draconiques. Néanmoins, il offrait ses propres avantages. Des minéraux précieux pouvaient encore être extraits de ses entrailles, et sa petite taille le rendait idéal pour les rituels et sacrifices, bien que ses flammes ne brûlassent point avec l'intensité de ses frères titanesques"

  building_type_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01_desc:0 "Le Grand Port d'Elyria est un chantier naval immense édifié au temps des [valyrian_freehold_short|E]. La position stratégique d'Elyria dans la Baie des Serfs offre à cette petite île un trafic considérable de navires, de commerce et d'esclaves, que ce port colossal peut accueillir en son sein. Après l'effondrement des [valyrian_freehold_short|E], ce havre captiva une part significative du négoce de la Baie des Serfs, devenant l'objet d'envie de toute la région et de ses alentours"

  building_type_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
  building_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
  building_elyria_dragon_palace_01_desc:0 "Le Palais du Dragon est une résidence luxueuse et grandiose offrant tout ce qu'un seigneur pourrait désirer: appartements somptueux, salles de banquet démesurées, bassins, caves à vin et bien plus encore. Édifié durant l'ère des [valyrian_freehold_short|E] pour loger le gouverneur d'Elyria, nulle dépense ne fut épargnée. Aujourd'hui, il abrite le Duc d'Elyria, lui conférant splendeur et renommée par-delà les mers"

  building_valyria_dead_volcano_01_01:0 "Syrabelos"
  building_type_valyria_dead_volcano_01_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_01_desc:0 "Syrabelos est un volcan éteint, la lave qui jadis coulait en ses veines s'est depuis longtemps tarie. Cela ne signifie point qu'il soit inutile, car il demeure riche en minéraux et métaux précieux à exploiter, et peut encore servir de refuge lors des razzias ou des tempêtes qui balaient ces terres maudites"

  building_valyria_dead_volcano_01_02:0 "Mines de Syrabelos"
  building_type_valyria_dead_volcano_01_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_02_desc:0 "Les opérations minières ont été restaurées à Syrabelos. Des esclaves descendent quotidiennement dans les fosses pour extraire métaux précieux et autres matériaux de valeur pour leurs oppresseurs insatiables"

  building_valyria_dead_volcano_02_01:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_01_desc:0 "Qazdarsos fut jadis un volcan actif, mais ne l'est plus. Désormais assoupi mais non silencieux, les cris des vouivres de feu et, selon certains, même des spectres peuvent encore être entendus depuis ses profondeurs. D'aucuns ont osé s'y aventurer sans une escorte suffisante et ne furent jamais revus"

  building_valyria_dead_volcano_02_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_02_desc:0 "Les mines de Qazdarsos sont à nouveau pleinement opérationnelles. Les esclaves extraient richesses et or quotidiennement pour leurs maîtres. Cependant, les récits d'êtres surnaturels et de créatures maudites persistent concernant l'intérieur du volcan. Que ces histoires soient véridiques ou simples divagations d'esclaves épuisés est une tout autre question."

  building_royal_barracks_of_valyria_01:0 "Les Casernes en Ruine de Valyria"
  building_type_royal_barracks_of_valyria_01:0 "Les Casernes en Ruine de Valyria"
  building_royal_barracks_of_valyria_01_desc:0 "Jadis grandioses casernes des [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont désormais que ruines et guère plus qu'un amas de décombres"
  building_type_royal_barracks_of_valyria_01_desc:0 "Jadis grandioses casernes des [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont désormais que ruines et guère plus qu'un amas de décombres"

  building_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_type_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_royal_barracks_of_valyria_02_desc:0 "Les Casernes Royales de Valyria restaurées, érigées sur les anciennes ruines, voient désormais gardes et soldats aller et venir pour assurer la sécurité des voyageurs et citoyens en ces terres autrefois maudites"

  building_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_type_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_great_arena_of_valyria_01_desc:0 "Jadis grandiose arène emplie de gladiateurs et de spectateurs, elle n'est désormais plus que ruines. Sa restauration sera coûteuse, mais pourrait rendre la joie aux gens du peuple en ces terres désolées"

  building_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_type_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_great_arena_of_valyria_02_desc:0 "Désormais reconstruite, la Grande Arène attire des milliers de spectateurs venus assister aux tournois et jeux sanglants où professionnels et esclaves périssent dans le sable pour le divertissement du peuple, rappelant l'ancienne gloire et la cruauté de Valyria"

  building_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_type_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_great_library_of_valyria_01_desc:0 "Les vestiges ruinés de la grande bibliothèque pourraient être restaurés pour abriter de grandes œuvres d'art et de littérature, préservant ainsi la sagesse des âges révolus"

  building_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_type_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_great_library_of_valyria_02_desc:0 "La Grande Bibliothèque de Valyria restaurée, emplie de magnifiques œuvres d'art, de littérature et de philosophie. Érudits et académiciens y étudient textes anciens et parchemins, redécouvrant les secrets d'une civilisation jadis sans égale"

  building_valyria_veilspire_peak:0 "Pic de Veilspire"
  building_type_valyria_veilspire_peak:0 "Pic de Veilspire"
  building_valyria_veilspire_peak_desc:0 "Le Pic de Veilspire est le plus haut sommet montagneux de toute la péninsule valyrienne, et ce, même avant le Fléau. Jadis utilisé comme lieu de pèlerinage sacré pour les plus braves et les plus forts, ce majestueux sommet représente une épreuve divine. On raconte que ceux qui parviennent à gravir jusqu'à sa cime reviennent plus sages et plus instruits, comme touchés par quelque sagesse primordiale"

  building_velakar_resort_01:0 "Un Vieux Lieu de Villégiature en Ruine"
  building_type_velakar_resort_01:0 "Un Vieux Lieu de Villégiature en Ruine"
  building_velakar_resort_01_desc:0 "Autrefois Grandiose Villégiature pour Seigneurs-Dragons et riches marchands, ce complexe n'est plus que ruines, guère mieux qu'un amas de briques et de souvenirs évanescents"

  building_velakar_resort_02:0 "L'Illustre Villégiature de Velakar"
  building_type_velakar_resort_02:0 "L'Illustre Villégiature de Velakar"
  building_velakar_resort_02_desc:0 "L'Illustre Villégiature de Velakar, désormais restaurée, accueille les gens de fortune et de lignage pour se baigner et se délasser en ce majestueux havre digne d'un archonte. Utilisant la chaleur volcanique pour réchauffer les bains et disposant de milliers de serviteurs à leur service, c'est véritablement un spectacle à contempler, rappelant la splendeur perdue de l'ancienne Valyria"

  building_aurions_lost_expidition:0 "L'Expédition Perdue d'Aurion"
  building_type_aurions_lost_expidition:0 "L'Expédition Perdue d'Aurion"
  building_aurions_lost_expidition_desc:0 "Voici l'expédition perdue de l'autoproclamé Empereur de Valyria, Aurion Varezys. Cette plaine stérile est désormais le site funéraire de 30 000 hommes, réduits à de simples amas de métal et d'ossements, souillés par les radiations et les gaz toxiques émanant des geysers sulfureux. C'est véritablement un paysage infernal, témoignage de la folie des hommes face à la puissance du Fléau"

  building_lokirian_barracks_01:0 "Les Vestiges d'une Caserne"
  building_lokirian_barracks_01_desc:0 "Jadis puissantes casernes de Lokiria, désormais réduites à un simple amoncellement de décombres et de souvenirs brisés"

  building_lokirian_barracks_02:0 "Les Puissantes Casernes de Lokiria"
  building_lokirian_barracks_02_desc:0 "Les casernes de Lokiria, désormais reconstruites et fortifiées de pierre draconique et d'acier valyrien. Soldats y marchent jour et nuit, présentant un spectacle imposant et un cauchemar pour quiconque oserait en faire le siège. Leurs pas résonnent comme le battement du cœur d'une bête guerrière ressuscitée des cendres"

  building_redwyrms_wrath_01:0 "Forteresse en Ruine"
  building_type_redwyrms_wrath_01:0 "Forteresse en Ruine"
  building_redwyrms_wrath_01_desc:0 "Le Courroux du Wyrm Rouge fut jadis une redoutable forteresse aux murailles de pierre draconique et aux flèches vertigineuses, autrefois ornée des crânes de dragons occis, sinistres trophées de ses conquêtes. Gouvernée par le Seigneur Protecteur Taurion de Lokiria, elle constituait un bastion de guerre et de domination, ses bannières cramoisies inspirant la terreur à travers les terres. Désormais en ruines, le Courroux du Wyrm Rouge n'est plus que l'ombre de sa gloire passée, ses murs brisés et ses étendards fanés se dressant tels des reliques du règne violent de Lokiria"

  building_redwyrms_wrath_02:0 "Le Courroux du Wyrm Rouge"
  building_type_redwyrms_wrath_02:0 "Forteresse en Ruine"
  building_redwyrms_wrath_02_desc:0 "Le Courroux du Wyrm Rouge s'est relevé, ses murailles de pierre draconique restaurées dans leur sinistre splendeur, dominant à nouveau le paysage tel un symbole de terreur et de puissance. De nouveau orné de crânes draconiques et de bannières cramoisies arborant le sigil du Dragon Rouge de Lokiria, la forteresse exhale une sombre détermination. Reconstruite à la fois comme monument à la guerre et déclaration de domination, le Courroux du Wyrm Rouge inspire crainte et respect, sa renaissance témoignant d'un héritage persistant de conquête"

  building_valyrian_gate_01:0 "Ruines de la Porte"
  building_type_valyrian_gate_01:0 "Ruines de la Porte"
  building_valyrian_gate_01_desc:0 "Vestiges de la jadis majestueuse Porte de Valyria, puissant Symbole de richesse et de pouvoir désormais réduit à un simple amas de pierres, témoins muets d'une gloire depuis longtemps évanouie"

  building_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_type_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_valyrian_gate_02_desc:0 "La Grande Porte de Valyria, sept portails et sept herses façonnés et renforcés d'acier valyrien. Des milliers de marchands et voyageurs vont et viennent à travers ces portes colossales. D'imposantes statues de héros d'antan peuvent être aperçues surplombant l'entrée, veillant sur ceux qui franchissent ce seuil entre deux mondes"

  building_great_harbor_of_valyria_01:0 "Baie pour un Havre"
  building_type_great_harbor_of_valyria_01:0 "Le Grand Havre de Valyria"
  building_great_harbor_of_valyria_01_desc:0 "Cette baie est suffisamment vaste et profonde pour y édifier un grand havre. Pour l'heure, il n'y a guère plus que des poissons qui y trouvent refuge, attendant que la main de l'homme forge à nouveau la grandeur en ces eaux"

  building_great_harbor_of_valyria_02:0 "Quais et Ateliers de Réparation"
  building_type_great_harbor_of_valyria_02:0 "Le Grand Havre de Valyria"
  building_great_harbor_of_valyria_02_desc:0 "Afin de faciliter le négoce et la construction navale, et d'établir un riche carrefour commercial et une maîtrise maritime, nous devons bâtir un grand havre. Pour l'heure, nous érigerons de longs quais et des ateliers de réparation pour la production de navires. Nous ajouterons également une cabine d'intendance pour le commerce et un bureau d'inspection pour taxer et assurer qu'aucune marchandise de contrebande n'entre dans notre cité"

  building_great_harbor_of_valyria_03:0 "Môles"
  building_type_great_harbor_of_valyria_03:0 "Le Grand Havre de Valyria"
  building_great_harbor_of_valyria_03_desc:0 "L'édification de môles et l'extension de l'infrastructure actuelle nous permettront d'accueillir davantage de navires et d'accroître le négoce entrant. Ces expansions serviront également à amarrer les vaisseaux militaires constituant notre flotte, protectrice de notre puissance renaissante"

  building_great_harbor_of_valyria_04:0 "Grues et Fournitures de Construction Navale"
  building_type_great_harbor_of_valyria_04:0 "Le Grand Havre de Valyria"
  building_great_harbor_of_valyria_04_desc:0 "En érigeant de grandes grues, nous pourrons grandement accroître l'efficacité de notre havre et permettre à davantage de navires d'arriver et de partir. Nous construirons également une zone de fournitures pour la construction navale près du havre afin d'améliorer l'efficacité de la construction de nos vaisseaux de guerre. Avec ce Grand Havre, nul ne pourra nous défier sur les mers, et Valyria règnera à nouveau sur les flots"

  building_great_temple_of_valyria_01:0 "Colline pour un Temple"
  building_type_great_temple_of_valyria_01:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_01_desc:0 "Pour vénérer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Fort heureusement, il existe une colline près du Mont Tartarax que nous pourrions utiliser pour édifier un Temple Magnifique et Illustre pour nos Dieux Dragons. Le fait qu'il soit proche d'un volcan convient encore mieux à nos desseins sacrés"
  building_type_great_temple_of_valyria_01_desc:0 "Pour vénérer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Fort heureusement, il existe une colline près du Mont Tartarax que nous pourrions utiliser pour édifier un Temple Magnifique et Illustre pour nos Dieux Dragons. Le fait qu'il soit proche d'un volcan convient encore mieux à nos desseins sacrés"

  building_great_temple_of_valyria_02:0 "Salle de Prière et Lieu de Rassemblement"
  building_type_great_temple_of_valyria_02:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_02_desc:0 "Nous commencerons par une salle de prière richement décorée, emplie d'artefacts précieux—sculptures de dragons et de feu, tapisseries dépeignant des dragons, braseros, et le plus fin marbre que nous puissions trouver. Nous créerons également une salle ouverte séparée pour les sacrifices humains, où le sang des mortels apaisera la soif des Dieux"

  building_great_temple_of_valyria_03:0 "Arène Ardente"
  building_type_great_temple_of_valyria_03:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_03_desc:0 "Les Valyriens ont toujours brûlé leurs morts. Incinérer nos défunts dans un Temple adjacent à notre volcan est une bien meilleure façon d'honorer ceux qui ont quitté ce monde. Nous agrandirons la salle ouverte que nous avons déjà édifiée à cette fin. Des colonnes sculptées, des fleurs exotiques et un autel de pierre noire pour remplacer les bûchers de bois utilisés pour les sacrifices humains et la crémation des défunts seront érigés"

  building_great_temple_of_valyria_04:0 "Statues de Dragons"
  building_type_great_temple_of_valyria_04:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_04_desc:0 "Nul édifice à Valyria n'est véritablement achevé sans statues draconiques. Nous érigerons 14 statues, une pour chaque Dieu. Chaque statue sera unique et majestueuse pour honorer dignement nos Dieux et leur manifester notre dévotion éternelle"

  building_great_walls_of_valyria_01:0 "Vestiges Insignifiants de la Muraille"
  building_type_great_walls_of_valyria_01:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_great_walls_of_valyria_01_desc:0 "Cette zone abrite les vestiges des Grandes Murailles de Valyria. Il ne reste presque rien, car les murailles furent détruites durant le Fléau. Les rares vestiges qui ont survécu sont si endommagés qu'ils sont inutilisables. Bien entendu, nous pourrions restaurer ces murailles dans leur ancienne grandeur, et nous devrions le faire. Inutile de préciser que ce sera une entreprise fort coûteuse"

  building_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_type_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_great_walls_of_valyria_02_desc:0 "Les murailles de Valyria ont été entièrement restaurées, imposantes et vastes, ceinturant la cité entière. Ces fortifications massives sont si larges que douze chars pourraient courir côte à côte (prenez cela, Volantis !). Tours de guet et douves bordent désormais le périmètre, offrant des couches supplémentaires de défense. Les entrées sont renforcées de herses et de zones de tir, rendant presque impossible toute tentative d'invasion de la cité par la force pour n'importe quel assaillant"

  building_great_dragonkeep_of_valyria_01:0 "Site du Palais"
  building_type_great_dragonkeep_of_valyria_01:0 "Le Grand Donjon Dragon de Valyria"
  building_great_dragonkeep_of_valyria_01_desc:0 "Nous avons localisé un site potentiel pour un grand palais. À l'avenir, il deviendra un lieu de splendeur incomparable. Mais pour l'heure, il n'y a guère à signaler en ces lieux prometteurs"

  building_great_dragonkeep_of_valyria_02:0 "Pose des Fondations"
  building_type_great_dragonkeep_of_valyria_02:0 "Le Grand Donjon Dragon de Valyria"
  building_great_dragonkeep_of_valyria_02_desc:0 "Pour abriter les souverains de cette grande cité, nous aurons besoin d'un palais imposant. Non, du plus grandiose palais que le monde ait jamais contemplé. Ceci nécessitera, bien entendu, de nombreux esclaves et quantité d'or, mais ces ressources peuvent être acquises. Ce palais sera un témoignage de la grandeur valyrienne. Nous commencerons par un donjon et poursuivrons notre expansion à partir de là"

  building_great_dragonkeep_of_valyria_03:0 "Murailles Extérieures"
  building_type_great_dragonkeep_of_valyria_03:0 "Le Grand Donjon Dragon de Valyria"
  building_great_dragonkeep_of_valyria_03_desc:0 "Pour garantir que ce donjon sera imprenable, nous érigeons nos murailles exclusivement en pierre noire. Ces remparts hauts et épais repousseront tous les ennemis et individus indésirables. Édifier des murailles épaisses et hautes uniquement en pierre noire sera, bien sûr, fort coûteux, mais aucun prix n'est trop élevé pour la gloire de Valyria"

  building_great_dragonkeep_of_valyria_04:0 "Murailles Intérieures et Décor"
  building_type_great_dragonkeep_of_valyria_04:0 "Le Grand Donjon Dragon de Valyria"
  building_great_dragonkeep_of_valyria_04_desc:0 "Maintenant que nous avons érigé les murailles extérieures, nous devons dresser des murailles intérieures pour renforcer la sécurité et améliorer l'efficacité de nos fortifications. Portes, herses et créneaux seront construits. En outre, nous décorerons le grand donjon de soieries, tapisseries, trophées et maintes autres choses pour exhiber notre splendeur aux yeux du monde"

  building_procrazion_01:0 "Grand Château Abandonné"
  building_type_procrazion_01:0 "Procrazion"
  building_procrazion_01_desc:0 "Procrazion fut jadis un bastion de la puissance valyrienne, trônant au sommet de la montagne centrale au cœur de la cité. Avant le Fléau, ce château grandiose servait de plaque tournante militaire et politique, agissant comme centre de défense pour toute la région. Bien qu'une grande partie de sa structure demeure intacte, le temps n'a point été clément envers ses salles autrefois glorieuses. Les ponts de pierre qui le reliaient jadis à la cité environnante sont désormais détruits, et l'intérieur montre des signes manifestes de décrépitude. Les imposantes Tours du Dragon se dressent encore, mais leurs chambres sont vides, et la forge jadis active est désormais assoupie. Malgré cela, sa position élevée et ses points d'entrée limités offrent toujours un avantage stratégique. Bien qu'encore imposant, Procrazion n'est plus que l'ombre de sa gloire passée, attendant d'être restauré dans sa splendeur d'antan"

  building_procrazion_02:0 "Procrazion"
  building_type_procrazion_02:0 "Procrazion"
  building_procrazion_02_desc:0 "Procrazion a été restauré dans toute sa gloire passée, se dressant fièrement au sommet de la montagne au cœur de la cité. Ce grand château est à nouveau relié à la cité en contrebas par des ponts reconstruits, offrant un accès sans nécessiter de dragons. Les Tours du Dragon ont également été restaurées, permettant l'entrée et la sortie des majestueuses créatures, tandis que les tours à dôme resplendissent comme avant le Fléau. À l'intérieur, il est doté de tous les agréments attendus pour un seigneur de la région, offrant confort et luxe même durant un siège. La forge unique sur un côté de la montagne a été réactivée, canalisant à nouveau la lave pour créer de puissantes armes. Sa position élevée, combinée à sa restauration et ses points d'entrée limités, garantit qu'il demeure quasi imprenable, capable de résister à toute menace. Désormais pleinement restauré, Procrazion sert non seulement de forteresse défensive, mais aussi de symbole de la résurgence de la cité"

  building_eternal_flame_temple_01:0 "Temple Abandonné"
  building_type_eternal_flame_temple_01:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_01_desc:0 "Le Temple de la Flamme Éternelle était vraisemblablement le point de connexion entre les Dieux Anciens de Valyria et les guerriers valyriens. Outre son rôle de centre religieux pour le commun des mortels, le temple s'élevait jadis haut comme symbole de la puissance religieuse de Valyria ; il gît désormais poussiéreux et abandonné. Aujourd'hui, il demeure un vague souvenir de ce qui fut autrefois un Temple Élevé vénéré de la cosmogonie valyrienne"

  building_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_type_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_02_desc:0 "Le Temple de la Flamme Éternelle a désormais été rénové et se dresse tel un symbole de puissance, religion et pouvoir. Ses murs restaurés content les récits des dieux anciens et sont emplis de légendes jadis connues des seuls anciens Valyriens. Le peuple peut maintenant jouir du luxe et rêver de ce que dragons et magie pouvaient être avant le Fléau. Les guerriers viennent et prient pour être emplis de la rage et de la puissance des dragons qui les ont précédés. Le temple resplendit tel un phare de foi religieuse, d'espoir et de puissance valyrienne tant ancienne que nouvelle"

  building_red_guard_barracks_01:0 "Casernes Abandonnées"
  building_type_red_guard_barracks_01:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_01_desc:0 "Le siège jadis fier de la Garde Rouge d'élite de la cité gît désormais abandonné et attaché aux antiques murailles de la ville. Le Temps tout-puissant a érodé ses environs et son intérieur, où les créneaux brisés et la structure rouillée évoquent l'abandon postérieur au Fléau. À l'arrière, deux Tours du Dragon ne sont plus que réminiscence de ce qui fut jadis la puissance militaire. Les chambres ne sont désormais emplies que de fantômes du temps passé et d'une force à présent perdue. Malgré sa décrépitude, ces casernes aspirent à la restauration pour redevenir le bouclier formidable de la cité"

  building_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_type_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_02_desc:0 "Minutieusement restaurées presque à leur puissance valyrienne, les Casernes de la Garde Rouge sont le foyer renouvelé des défenseurs de la cité, sises près des glorieuses murailles de la ville. La structure de pierre rappelle sa gloire d'antan, fortifiée, puissante et emplie d'histoires et de cicatrices. Les Tours du Dragon exhalent vie et vitalité, à l'image du temps où de véritables dragons rugissaient dans les hauts cieux. Les casernes ne sont plus accueillies par des spectres, mais par l'élite récemment restaurée de la Garde Rouge, emplie d'une discipline énergisante, d'excellence et d'une gloire inégalée. Dans un mélange complexe d'ancien et de nouvelle technologie, le bâtiment protège à nouveau la cité et abrite tous ceux qui s'y trouvent"

  building_red_guard_training_compound_01:0 "Complexe d'Entraînement Abandonné"
  building_type_red_guard_training_compound_01:0 "Le Complexe d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_01_desc:0 "Des murs délabrés échouent à conter les récits des Gardes Rouges désormais disparus qui s'y entraînaient. Ce Complexe d'Entraînement fut jadis un bâtiment respecté et admiré empli de dragons, guerriers et chefs qui gît désormais abandonné et vide, incapable de dépeindre son énergie et sa gloire depuis longtemps oubliées. Armement, oubliettes et équipement rouillé peuvent encore y être trouvés, mais on se demande comment cela pouvait être durant sa gloire"

  building_red_guard_training_compound_02:0 "Le Complexe d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_02_desc:0 "Force, honneur et puissance sont ce que l'on peut trouver en contemplant le Complexe d'Entraînement de la Garde Rouge restauré. Empli d'hommes tentant de leur mieux de s'honorer en devenant membres de la Garde Rouge d'Élite, le complexe accueille stratèges, chefs et guerriers, tous visant à être les meilleurs. Avec de glorieux piliers l'entourant avec grâce, et un toit soutenu haut avec des fenêtres rouges pour montrer que le ciel est la seule limite, ce bâtiment forme désormais les plus grands des guerriers et les plus fins des chefs, portant la flamme de la gloire valyrienne vers un nouvel âge"

  building_type_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01_desc:0 "Zanpur est le volcan jumeau le plus occidental des îles Marahai, dressant sa silhouette fumante tel un gardien des rivages occidentaux"

  building_type_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01_desc:0 "Yovesh est le volcan jumeau le plus oriental des îles Marahai, veillant de ses feux ancestraux sur les eaux qui s'étendent vers le levant"

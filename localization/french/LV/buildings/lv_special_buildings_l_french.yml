l_french:
  # Braavos
  building_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_type_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_agot_EE_titan_of_braavos_desc:0 "Inscrit par l'illustre chroniqueur westerosi Lomas Longstrider parmi les Merveilles Façonnées par l'Homme, le Titan de Braavos se dresse tel un gardien immuable, première ligne de défense de la [free_city|E] de Braavos, veillant sur l'étroit passage menant au lagon où s'étend la cité. Cette colossale statue de granit et de bronze, forgée à l'effigie d'un guerrier titanesque, fait office à la fois de forteresse inexpugnable et de phare salvateur. Des meurtrières dissimulées sous la jupe d'armure de la statue et des archères parsemant son plastron offrent une défense quasi impénétrable contre tout navire ennemi osant s'aventurer dans le lagon."

  building_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_type_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_agot_EE_sealords_palace_desc:0 "Le Palais du Seigneur de la Mer est la demeure du maître incontesté de Braavos. Sous les dômes chatoyants et les tours élancées de ce vaste palais, une ménagerie exotique rassemble oiseaux multicolores et bêtes extraordinaires provenant des quatre coins du monde connu."

  # Volantis
  building_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_type_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_agot_EE_black_walls_of_old_volantis_desc:0 "Le cœur battant de Volantis. Érigée par les [valyrian_freehold|E] aux temps anciens, cette muraille titanesque de pierre noire fusionnée protège un dédale de palais somptueux, de cours intérieures, de tours altières et de temples sacrés. Seuls ceux dont le sang remonte aux ancêtres valyriens, le Sang Ancien, sont autorisés à fouler son sol sacré."
  building_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_type_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_agot_EE_volantis_harbor_desc:0 "La puissance de Volantis tire en partie sa source de son immense port, particulièrement grâce à sa position géographique privilégiée. Cette vaste étendue en forme de croissant de lune est bâtie à l'embouchure même de la Rhoyne, et l'on prétend qu'elle pourrait contenir l'intégralité de Braavos en son sein."

  building_agot_EE_the_long_bridge:0 "Le Pont Long"
  building_type_agot_EE_the_long_bridge:0 "Le Pont Long"
  building_agot_EE_the_long_bridge_desc:0 "Le Pont Long unit les deux moitiés de Volantis et demeure le plus long pont du monde connu. Bâti par l'[old_valyria|E] à l'apogée de sa gloire en pierre fusionnée, on dit qu'il pourrait supporter le poids de mille éléphants."

  building_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_type_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_agot_EE_temple_of_the_lord_of_light_desc:0 "Cet immense temple s'élève bien au-dessus de tout autre édifice de la cité. Ses couleurs éblouissantes d'or, de rouge et d'orange en font un spectacle véritablement saisissant. Protégé par la Main Ardente, ce sanctuaire est dédié à R'hllor, le Maître de la Lumière, et constitue peut-être l'un des plus grandioses témoignages de sa puissance en ce monde."

  building_agot_EE_volantis_walls:0 "Les Murailles de Volantis"
  building_type_agot_EE_volantis_walls:0 "Les Murailles de Volantis"
  building_agot_EE_volantis_walls_desc:0 "Bien que moins impressionnantes que celles de la Vieille Volantis, les murailles de la cité feront réfléchir à deux fois tout assaillant envisageant de prendre la ville d'assaut."

  # Rhoyne
  building_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
  building_agot_EE_nymeria_palace_01_desc:0 "Au cœur de Ny Sar gisent les ruines du Palais de Nymeria, abandonné depuis que les [valyrian_freehold|E] vainquirent le Prince Garin lors de la Seconde Guerre des Épices. Ses murs de marbre rose et vert, ses dômes vertigineux et ses flèches majestueuses ne sont plus que la coquille fantomatique de leur splendeur passée. Toute vie quitta ces lieux lorsque Nymeria s'enfuit vers Dorne, abandonnant ces halls jadis glorieux à la décrépitude."

  building_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
  building_agot_EE_nymeria_palace_02_desc:0 "Se dressant fièrement à nouveau au cœur de Ny Sar, le Palais de Nymeria a été méticuleusement restauré, témoignage éclatant de la résilience et de l'héritage rhoynars. Le marbre vert et rose chatoyant scintille sous le soleil, tandis que les grands dômes et les flèches élancées dominent à nouveau l'horizon, effaçant presque les souvenirs de son tragique passé."

  building_agot_EE_palace_of_love_01:0 "Le Palais des Chagrins"
  building_type_agot_EE_palace_of_love_01:0 "Le Palais des Chagrins"
  building_agot_EE_palace_of_love_01_desc:0 "Le Palais des Chagrins se dresse tel un sombre rappel du destin qui frappa Chroyane, la Cité des Festivals. Ses tours croulantes, recouvertes de mousse et de lianes ténébreuses, ne révèlent rien de la beauté que le Palais de l'Amour incarnait jadis. Des statues englouties et les hommes de pierre hantent désormais ses halls brumeux et dévastés."

  building_agot_EE_palace_of_love_02:0 "Le Palais de l'Amour"
  building_type_agot_EE_palace_of_love_02:0 "Le Palais de l'Amour"
  building_agot_EE_palace_of_love_02_desc:0 "Le Palais de l'Amour orne à nouveau les rives de la Rhoyne, résurrection à couper le souffle de l'ancienne gloire de Chroyane. Ses tours s'élancent vers les cieux, parées de mosaïques éclatantes et de sculptures délicates célébrant la vie, la beauté et l'amour. La lumière du soleil se reflète sur des fontaines scintillantes qui alimentent les jardins luxuriants, déversant des cascades de fleurs sur chaque terrasse. Sous ses grands dômes, les mariages sont à nouveau bénis, emplissant Chroyane de la promesse de nouveaux commencements."

  building_agot_EE_bridge_of_dream_01:0 "Le Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_01:0 "Le Pont des Rêves"
  building_agot_EE_bridge_of_dream_01_desc:0 "Rivalisant autrefois avec le Pont Long de Volantis, le Pont des Rêves surplombe désormais la Rhoyne dans un épais brouillard. Ses arches de pierre s'élevaient jadis à quarante pieds au-dessus du fleuve, mais se sont effondrées sous une mousse dense et des lianes noires. Devenu le repaire des hommes de pierre, il se dresse tel un monument silencieux et pourrissant à l'orgueil perdu des Rhoynars."

  building_agot_EE_bridge_of_dream_02:0 "Le Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_02:0 "Le Pont des Rêves"
  building_agot_EE_bridge_of_dream_02_desc:0 "Le Pont des Rêves enjambe à nouveau la Rhoyne dans toute sa splendeur. S'élevant à quarante pieds au-dessus du fleuve, ses arches de pierre pâle se dressent, solides et altières. Des jardins luxuriants bordent sa travée de bois, éclatant de fleurs de toutes les couleurs. Ce pont majestueux, autrefois perdu dans le temps et la ruine, est rené. Un symbole de la fierté et de la résilience rhoynars dominant à nouveau les eaux vives de la Rhoyne !"

  # Meereen
  building_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_type_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_agot_EE_great_pyramid_of_meereen_desc:0 "De loin le plus imposant édifice de la cité, la Grande Pyramide de Meereen fut bâtie par une petite armée d'esclaves, dont un millier périt durant sa construction. Cette pyramide sert de centre administratif de Meereen, et les souverains de la cité ont reçu leurs sujets dans la grande salle pendant des siècles."

  # Asshai
  building_stygai_01:0 "La Cité Hantée de Stygai"
  building_type_stygai_01:0 "Stygai"
  building_stygai_01_desc:0 "Stygai, la cité énigmatique et antique enveloppée au cœur ténébreux des Contrées de l'Ombre, demeure l'un des mystères les plus terrifiants du monde. D'une ancienneté insondable et drapée de ténèbres éternelles, la cité se dresse tel un monument à une ère oubliée. Même les ombromanciens les plus audacieux n'osent s'aventurer dans ses rues maudites. Les flèches vertigineuses et les ruelles labyrinthiques seraient, dit-on, parcourues par des démons et des créatures innommables. Voilée de secrets, ses véritables origines et l'étendue de ses sombres pouvoirs demeurent inconnus."

  # Gogossos
  building_red_citadel_01:0 "La Tour Rouge"
  building_type_red_citadel_01:0 "La Tour Rouge"
  building_red_citadel_01_desc:0 "Une imposante tour côtière, considérée comme le dernier vestige d'une forteresse jadis puissante, sert aujourd'hui de bastion principal à la cité. Bien qu'une grande partie de la structure originelle ait été perdue au fil du temps, ce bastion solitaire perdure — modeste mais incroyablement robuste et hautement défendable. D'épaisses murailles de pierre patinée résistent fermement aux éléments comme aux sièges potentiels, en faisant un siège d'autorité fiable au sein de Gogossos. Bien qu'il ne soit pas encore une grande citadelle, il demeure un fort redoutable, fondation sur laquelle de plus grandes fortifications pourraient un jour s'élever."

  building_red_citadel_02:0 "La Redoute Rouge"
  building_type_red_citadel_02:0 "La Redoute Rouge"
  building_red_citadel_02_desc:0 "Désormais renforcée par une solide palissade de bois et des tours de guet au sommet des anciens Vestiges Cramoisis, cette redoute s'est transformée en un bastion plus formidable, capable de résister aux menaces prolongées. N'étant plus une simple tour côtière solitaire, les défenses étendues permettent maintenant d'accueillir une garnison décente, offrant un point d'ancrage solide au sein de Gogossos. Avec des provisions suffisantes et des positions renforcées, elle pourrait même soutenir une armée pendant des mois si nécessaire, marquant sa transformation d'une simple relique du passé en un véritable bastion de pouvoir au sein de la cité."

  building_red_citadel_03:0 "La Citadelle Rouge"
  building_type_red_citadel_03:0 "La Citadelle Rouge"
  building_red_citadel_03_desc:0 "Jadis relique déclinante, la Citadelle Rouge a été reconstruite en une forteresse massive qui domine Gogossos, ses murailles titanesques de Pierre Noire Valyrienne se dressant tel un sinistre monument à la puissance. Comme la Porte Cramoisie, ses pierres furent teintes de vermeil par d'antiques rituels de magie de sang, dont l'héritage perdure bien après que la sorcellerie elle-même eut disparu. Les murmures prétendent que la Mort Rouge prit naissance ici, la mémoire de la malédiction résonnant encore dans les chambres cachées où les mourants poussaient jadis leurs derniers cris. Plus qu'une forteresse, la Citadelle Rouge demeure le cœur impitoyable de Gogossos — un lieu où l'autorité est absolue et où la rébellion meurt avant même de prendre forme."

  building_pit_of_sorrows_01:0 "Fort Envahi et Ruines"
  building_type_pit_of_sorrows_01:0 "Fort Envahi et Ruines"
  building_pit_of_sorrows_01_desc:0 "Un fort en ruines, dont les murailles jadis puissantes sont maintenant drapées de lianes rampantes et englouties par l'étreinte implacable de la nature, se dresse dans un silence inquiétant. Des arbres ont pris racine dans ses cours, leurs branches tordues griffant le ciel, comme témoins d'horreurs oubliées.\n\nMalgré le délabrement, le fort reste étrangement défendable — ses tours, bien qu'érodées, se dressent encore avec une présence imposante. Son portail, à moitié enseveli sous la mousse et les gravats, suggère une forteresse qui refuse de céder entièrement au temps.\n\nPourtant, quelque chose semble profondément malsain en ce lieu. L'air est chargé d'une immobilité contre nature, de celle qui fait frissonner la peau et met l'esprit mal à l'aise. Des ombres s'attardent là où elles ne devraient pas, et des murmures — trop faibles pour être le vent — semblent dériver à travers les ruines, suggérant des secrets qu'il vaudrait mieux laisser enfouis."

  building_pit_of_sorrows_02:0 "Fort et Excavations de la Fosse"
  building_type_pit_of_sorrows_02:0 "Fort et Excavations de la Fosse"
  building_pit_of_sorrows_02_desc:0 "Alors que nous étendions nos efforts et dégagions l'enchevêtrement épais de végétation, nous fîmes une découverte stupéfiante — le sol sous nos pieds semblait descendre sans fin, peu importe la quantité de boue et de débris que nous retirions. Ce qui apparaissait d'abord comme de simples broussailles dissimulant les ruines se révéla être une vaste descente stratifiée, chaque niveau inférieur exposant des vestiges du passé.\n\nParmi la maçonnerie croulante et la terre humide, nous exhumâmes d'innombrables ossements — leurs origines inconnues, leurs histoires depuis longtemps perdues dans le temps. À chaque pas vers le bas, une certitude grandissante s'imposait : il pourrait bien s'agir de la légendaire Fosse des Chagrins, un lieu murmuré dans les légendes terrifiantes, dont les profondeurs demeurent intactes et les mystères attendent encore d'être percés."

  building_pit_of_sorrows_03:0 "La Fosse des Chagrins"
  building_type_pit_of_sorrows_03:0 "La Fosse des Chagrins"
  building_pit_of_sorrows_03_desc:0 "L'antique Fosse des Chagrins, autrefois ruine croulante, a été minutieusement reconstruite et restaurée dans sa sinistre grandeur d'antan. Pourtant, malgré tous les efforts pour réhabiliter ses niveaux supérieurs, les véritables profondeurs demeurent un abîme insondable. Les ténèbres inférieures s'étendent à l'infini, engloutissant lumière et son, une gueule béante vers l'inconnu. Beaucoup ont osé descendre en quête de secrets perdus dans le temps, mais aucun n'est jamais revenu pour témoigner de ce qui gît au fond — si tant est qu'un fond existe."

  building_the_toad:0 "Le Crapaud Noir"
  building_type_the_toad:0 "Le Crapaud Noir"
  building_the_toad_desc:0 "La plus grande statue jamais construite sur l'Île des Crapauds domine le paysage, relique monolithique d'une civilisation depuis longtemps disparue. Sculptée dans une pierre noire huileuse et inconnue qui semble luire même en l'absence de lumière, elle prend la forme d'un grand crapaud — trapu, grotesque et étrangement réaliste. Nul ne sait qui l'a bâtie, ni dans quel but, et toute signification qu'elle a pu avoir s'est depuis longtemps perdue dans le temps. Pour la plupart, ce n'est qu'une effigie grossière et sinistre, une curiosité bizarre dans une terre déjà baignée de mystère. Pourtant, il y a des murmures — prononcés à voix basse par les locaux — d'étranges rêves qui viennent à ceux qui dorment trop près, d'une chaleur troublante dans la pierre au toucher, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait de l'intérieur."
  building_type_the_toad_desc:0 "La plus grande statue jamais construite sur l'Île des Crapauds domine le paysage, relique monolithique d'une civilisation depuis longtemps disparue. Sculptée dans une pierre noire huileuse et inconnue qui semble luire même en l'absence de lumière, elle prend la forme d'un grand crapaud — trapu, grotesque et étrangement réaliste. Nul ne sait qui l'a bâtie, ni dans quel but, et toute signification qu'elle a pu avoir s'est depuis longtemps perdue dans le temps. Pour la plupart, ce n'est qu'une effigie grossière et sinistre, une curiosité bizarre dans une terre déjà baignée de mystère. Pourtant, il y a des murmures — prononcés à voix basse par les locaux — d'étranges rêves qui viennent à ceux qui dorment trop près, d'une chaleur troublante dans la pierre au toucher, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait de l'intérieur."

  building_ax_hold:0 "Le Fort de la Hache"
  building_type_ax_hold:0 "Le Fort de la Hache"
  building_ax_hold_desc:0 "La forteresse de la Maison Xhore se dresse à la fois comme sanctuaire et bastion, un rempart de pierre et d'acier bâti pour endurer les tempêtes des Îles du Basilic. Nichée au sommet de falaises escarpées et entourée d'eaux traîtresses, elle fut conçue non seulement comme une demeure, mais comme un bastion inébranlable d'où les pirates qartheens des Îles Occidentales pouvaient lancer leurs raids infâmes. Ses murs, érodés mais formidables, portent les cicatrices d'innombrables batailles, tandis que ses tours de guet vertigineuses offrent une vue dégagée sur la mer environnante, toujours à l'affût de proies comme de poursuivants."

  building_garden_of_malice_01:0 "Un Grand Fort Envahi"
  building_type_garden_of_malice_01:0 "Un Grand Fort Envahi"
  building_garden_of_malice_01_desc:0 "Une vaste enceinte circulaire envahie par la végétation encercle les ruines, ses pierres antiques à peine visibles sous les couches de lianes rampantes et de mousse épaisse. En son cœur se dresse un donjon croulant, ses tours brisées et à moitié englouties par l'étreinte implacable de la nature. Le temps a effacé toute l'histoire que ce lieu a pu receler, ne laissant qu'un silence oppressant et inquiétant dans son sillage.\n\nPourtant, ceux qui osent franchir les portes fracassées comprennent vite pourquoi nul n'a réclamé ces ruines — cet endroit est un piège mortel. Des haies sinueuses, poussant de manière sauvage et contre nature, forment un labyrinthe complexe, leurs chemins se déplaçant et se fermant comme des êtres vivants, entraînant les imprudents toujours plus profondément dans la confusion. Parmi la verdure enchevêtrée se tapissent des plantes aux couleurs impossibles et aux formes contre nature, leur beauté masquant une intention meurtrière. Certaines libèrent des spores qui étouffent les poumons, d'autres sécrètent des toxines qui font cloquer la peau, et quelques-unes se meuvent avec un dessein inquiétant, attendant que leur proie s'approche trop près.\n\nLes légendes murmurent que quelque chose — peut-être les vestiges d'une sorcellerie oubliée, ou la présence persistante de quelque force qui régnait ici jadis — maintient la flore florissante de manières défiant la nature. Les ruines demeurent intactes, non parce qu'elles sont oubliées, mais parce qu'elles sont redoutées. Même les pillards et chasseurs de trésors les plus téméraires savent qu'il vaut mieux ne pas tenter la colère d'un lieu où les plantes elles-mêmes semblent assoiffées de sang."

  building_garden_of_malice_02:0 "Le Jardin de la Malice"
  building_type_garden_of_malice_02:0 "Le Jardin de la Malice"
  building_garden_of_malice_02_desc:0 "Le Jardin de la Malice est une forteresse de mort stratifiée, bâtie en pierre noire huilée et ceinte de défenses mortelles. Un vaste labyrinthe mouvant de lianes épineuses, de fleurs toxiques et de haies sinueuses l'entoure, où la lumière pénètre à peine et où des prédateurs invisibles se tapissent. Au-delà du labyrinthe s'étendent des douves noires grouillant d'horreurs et des murailles imposantes gardées par des sentinelles silencieuses. En son cœur se dresse un donjon valyrien, intact par le temps, couronné d'un arbre pétrifié dont les racines semblent se nourrir de la forteresse elle-même. Plus qu'un bastion, le Jardin est un lieu où la terre elle-même cherche à détruire les intrus."

  building_sapphire_quarter:0 "Le Quartier de Saphir"
  building_type_sapphire_quarter:0 "Le Quartier de Saphir"
  building_sapphire_quarter_desc:0 "Le Quartier de Saphir est un vaste district fortifié perché au sommet de la plus haute colline de Gogossos. Autrefois domaine des [dragonlords|El] d'antan, il sert désormais d'enclave exclusive aux plus illustres maîtres d'esclaves et princes marchands de la cité. Seule l'élite peut résider dans ses murs, car ici, seuls se dressent de grands manoirs et des palais — construits en marbre étincelant et ornés d'or. Ses marchés privés sont drapés des plus fines soieries, réservés à ceux qui peuvent s'offrir des luxes hors de portée des hommes de moindre condition."

  building_crimson_gate:0 "La Porte Cramoisie"
  building_type_crimson_gate:0 "La Porte Cramoisie"
  building_crimson_gate_desc:0 "La Porte Cramoisie est l'unique entrée terrestre vers Gogossos, un bastion imposant de Pierre Noire Valyrienne qui domine le pont traître menant à la cité. Sa surface absorbe la lumière, imprégnée de sombre sorcellerie et teinte de cramoisi par d'antiques rituels de sang. S'élevant à 140 pieds de haut, le corps de garde irradie émerveillement et terreur, ses murs couronnés de statues de dragons dont les yeux de gemmes semblent presque vivants. Plus qu'une barrière, la Porte Cramoisie est un monument à la puissance oubliée de Gogossos et à l'héritage ténébreux de Valyria."

  building_glittering_pits_01:0 "Les Fosses Scintillantes"
  building_type_glittering_pits_01:0 "Les Fosses Scintillantes"
  building_glittering_pits_01_desc:0 "Les jungles de Gogossos et de la tristement célèbre Île des Larmes forment une vaste étendue sauvage indomptée — une terre regorgeant à la fois de périls et de richesses inimaginables. Véritable trésor de ressources naturelles, le feuillage dense et ombragé dissimule des merveilles sans nombre pour ceux assez audacieux pour en braver les dangers.\n\nParmi les trésors les plus convoités se trouvent les diamants et les saphirs, scintillant au plus profond de la terre comme l'essence captive des étoiles. Ces gemmes précieuses, rares et d'une qualité inégalée, ont fait de la région une légende murmurée parmi les marchands et les chercheurs de fortune. Bien que les mines ici demeurent modestes mais puissantes, leurs rendements sont stupéfiants, chaque excavation exhumant des pierres d'un éclat à couper le souffle."

  building_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_type_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_glittering_pits_02_desc:0 "À mesure que les mines s'étendent, elles se transforment en un vaste réseau de tunnels souterrains, serpentant sous le sol de la jungle comme les racines des arbres antiques au-dessus. Les parois scintillent de gemmes, leurs couleurs se reflétant dans la faible lueur des torches, et des chambres cachées sont découvertes, révélant de riches veines attendant d'être exploitées. Cependant, plus les mineurs creusent profondément, plus la jungle riposte — des racines percent les murs, des spores toxiques flottent dans l'air, et d'étranges créatures invisibles s'agitent dans les ténèbres."

  building_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_type_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_glittering_pits_03_desc:0 "Les Profondeurs Étoilées constituent la partie la plus riche et la plus dangereuse des mines de Gogossos — un vaste labyrinthe de tunnels et de cavernes scintillantes où des saphirs sans défaut et des diamants massifs captent la moindre lueur, évoquant un ciel étoilé souterrain. Les mineurs travaillent sans relâche pour extraire ces trésors, bien que plus ils descendent, plus le péril s'accroît. Dans les chambres les plus basses, d'étranges tremblements, une chaleur oppressante et des témoignages murmurés de choses contre nature ont rendu certaines zones interdites. C'est un lieu de grande richesse et de risque plus grand encore — où creuser trop profondément pourrait éveiller quelque chose qu'il vaudrait mieux laisser enseveli."

  building_darkreach_quay_01:0 "Le Quai de Portombre"
  building_type_darkreach_quay_01:0 "Le Quai de Portombre"
  building_darkreach_quay_01_desc:0 "Le Quai de Portombre est le cœur humble mais vital du commerce de Gogossos, première étape de la grande infrastructure portuaire de la cité. Un modeste port de pierre et de bois s'étend dans les eaux sombres de la baie, ses docks usés grinçant sous le poids des navires arrivants. Bien que de taille réduite, il est stratégiquement positionné pour servir de point d'entrée principal aux marchands, contrebandiers et aventuriers cherchant fortune à Gogossos."

  building_darkreach_quay_02:0 "Le Port de Portombre"
  building_type_darkreach_quay_02:0 "Le Port de Portombre"
  building_darkreach_quay_02_desc:0 "Avec l'expansion de l'empire commercial de Gogossos, le Port de Portombre s'est transformé en un centre commercial animé, bien au-delà de ses humbles débuts. Les docks ont été renforcés de pierre et de bois robuste, permettant à de plus grands navires marchands d'accoster en sécurité et de décharger leur cargaison exotique. De nouvelles jetées s'étendent plus loin dans les eaux sombres, accueillant un flux croissant de navires venus de terres lointaines, attirés par les richesses des saphirs, diamants et marchandises rares de la jungle de Gogossos."

  building_darkreach_quay_03:0 "Le Port de la Marée Noire"
  building_type_darkreach_quay_03:0 "Le Port de la Marée Noire"
  building_darkreach_quay_03_desc:0 "Avec la renaissance de Gogossos, son port commercial autrefois modeste s'est métamorphosé en Port de la Marée Noire, un colossal bastion de commerce et de puissance navale. N'étant plus un simple point de passage pour les marchands, il est devenu un épicentre florissant du commerce international, attirant marchands, mercenaires et chercheurs de fortune des quatre coins du monde connu.\n\nLe port est désormais fortifié de Pierre Noire Valyrienne ancienne, ses puissantes murailles encerclant les docks grouillants d'activité, offrant une défense inégalée contre les raids et les sièges. Ces remparts imposants, reforgés à partir des ruines du passé, se dressent comme un témoignage de la résurgence de la cité, garantissant que la richesse et l'influence de Gogossos demeurent intouchables."

  building_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
  building_type_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
  building_last_dragon_tower_01_desc:0 "La dernière Tour du Dragon survivante hors de [valyria|E], bâtie dans les derniers jours avant [doom|E], se dresse tel un monument à la puissance et à la tragédie. Originellement construite pour abriter la famille de [dragonlord|E] régnant sur Gogossos, ses halls devaient être un symbole de leur règne éternel — pourtant le destin en décida autrement. Quand la famille périt lors du [doom_of_valyria|E], la tour devint une relique silencieuse d'un empire perdu, sa présence projetant une longue ombre sur la cité.\n\nDésormais, elle sert un nouveau maître — le plus puissant Archonte de Gogossos et sa famille, qui règnent depuis ses hauteurs altières. N'étant plus simplement un symbole de la grandeur valyrienne, la Tour du Dragon rappelle aux classes inférieures, aux esclaves et aux rebelles potentiels la brutale hiérarchie de la cité. Elle se dresse comme un témoignage inébranlable de domination, un avertissement omniprésent que l'élite de Gogossos écrasera quiconque oserait se dresser contre elle."

  # Valyria
  building_type_valyria_volcano:0 "L'une des Quatorze Flammes"
  building_valyria_volcano_01:0 "Mont Gaelithox"
  building_type_valyria_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_01_desc:0 "Gaelithox est l'un des volcans les plus redoutables parmi les légendaires Quatorze Flammes de [valyria|E]. Dominant le paysage environnant, son sommet est perpétuellement enveloppé d'un épais voile de fumée et de cendres. Les pentes du volcan sont marquées par d'anciennes coulées de lave, désormais solidifiées en formations de roche noire déchiquetée, vestiges du [doom|E]."

  building_valyria_volcano_02:0 "Rhazalhar"
  building_type_valyria_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_02_desc:0 "Rhazalhar est le plus grand des Quatorze Flammes, un colosse de furie en fusion et de puissance ancestrale. Son sommet, constamment voilé de fumée et de cendres, perce les cieux et projette son ombre sur le paysage environnant. Des rivières de lave s'écoulent de son cœur ardent, traçant des chemins lumineux à travers la roche volcanique sombre. En raison des températures extrêmes autour du volcan, l'exploitation minière est impossible."

  building_valyria_volcano_03:0 "Epaekros"
  building_type_valyria_volcano_03:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_03_desc:0 "Epaekros est plus dangereux que les autres volcans, une beauté sauvage aux falaises instables qui font pleuvoir des rochers sur les randonneurs et aux sols glissants qui causent des chutes mortelles. Ceux qui atteignent son sommet trouvent souvent une fin tragique à cause d'un vouivre de feu ou d'un [dragon|El] qui y niche. Pourtant, pour ceux qui parviennent à s'aventurer dans le volcan, les richesses, l'or et les métaux précieux abondent."

  building_valyria_volcano_04:0 "Tartarax"
  building_type_valyria_volcano_04:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_desc:0 "S'élevant haut dans le ciel, bien que moins haut que Rhazalhar, Tartarax est un volcan plus élancé mais plus profond dont le sommet aux formes curieuses offre un terrain de nidification idéal pour toute créature aimant le feu. Ses cavernes profondes et ses tunnels offrent d'amples opportunités minières mais aussi la mort. La lave et les créatures hostiles abondent dans ce donjon sombre et profond. Pourtant, la lueur de sa lave majestueuse, visible de loin dans l'obscurité de la nuit, demeure inoubliable."

  building_valyria_volcano_05:0 "Yontaryos"
  building_type_valyria_volcano_05:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_05_desc:0 "Lorsque Yontaryos fut découvert pour la première fois par les anciens Valyriens, il différait des autres volcans de la région. Il était petit et relativement bas, avec peu de magma et un espace limité pour que les dragons puissent nicher. Cependant, il avait ses utilités. Des minéraux précieux pouvaient encore en être extraits, et sa petite taille le rendait idéal pour les rituels et les sacrifices, même si ses flammes ne brûlaient pas aussi intensément que les autres."

  building_type_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01_desc:0 "Le Grand Port d'Elyria est un immense chantier naval construit du temps des [valyrian_freehold_short|E]. La position stratégique d'Elyria dans la Baie des Serfs procure à cette petite île un trafic significatif de navires, de commerce et d'esclaves, que ce port massif peut accueillir. Après l'effondrement des [valyrian_freehold_short|E], ce port captura une part significative du commerce de la Baie des Serfs, devenant l'envie de toute la région et de ses environs."

  building_type_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
  building_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
  building_elyria_dragon_palace_01_desc:0 "Le Palais du Dragon est une station luxueuse et grandiose offrant tout ce qu'un seigneur pourrait désirer : grandes chambres, immenses salles de banquet, bassins, caves à vin et bien plus encore. Bâti à l'ère des [valyrian_freehold_short|E] pour abriter le gouverneur d'Elyria, aucune dépense ne fut épargnée. Aujourd'hui, il abrite le Duc d'Elyria, lui conférant splendeur et renommée."

  building_valyria_dead_volcano_01:0 "Syrabelos"
  building_type_valyria_dead_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_desc:0 "Syrabelos est un volcan éteint, la lave qui s'y écoulait jadis s'est depuis longtemps tarie. Cela ne signifie pas qu'il est inutile, car il demeure riche en minéraux et métaux précieux à exploiter et peut encore servir de refuge lors de raids ou de tempêtes."

  building_valyria_dead_volcano_01_02:0 "Mines de Syrabelos"
  building_type_valyria_dead_volcano_01_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_02_desc:0 "Les opérations minières ont été restaurées à Syrabelos. Des esclaves descendent quotidiennement dans les puits pour extraire métaux précieux et autres matériaux de valeur pour leurs oppresseurs."

  building_valyria_dead_volcano_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_desc:0 "Qazdarsos était autrefois un volcan actif mais ne l'est plus. Désormais dormant mais non silencieux, les cris des vouivres de feu et, selon certains, même des fantômes peuvent encore être entendus depuis ses profondeurs. Certains ont osé s'y aventurer sans un groupe assez nombreux et ne furent jamais revus."

  building_valyria_dead_volcano_02_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_02_desc:0 "Les mines de Qazdarsos sont à nouveau pleinement opérationnelles. Des esclaves extraient quotidiennement richesses et or pour leurs maîtres. Cependant, les récits d'êtres surnaturels et de créatures maudites persistent concernant l'intérieur du volcan. Que ces histoires soient vraies ou simplement les divagations d'esclaves est une autre question..."

  building_royal_barracks_of_valyria_01:0 "Les Casernes Ruinées de Valyria"
  building_type_royal_barracks_of_valyria_01:0 "Les Casernes Ruinées de Valyria"
  building_royal_barracks_of_valyria_01_desc:0 "Autrefois de grandes casernes des [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont plus que ruines et guère plus qu'un tas de gravats."
  building_type_royal_barracks_of_valyria_01_desc:0 "Autrefois de grandes casernes des [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont plus que ruines et guère plus qu'un tas de gravats."

  building_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_type_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_royal_barracks_of_valyria_02_desc:0 "Les Casernes Royales de Valyria restaurées, bâties sur les anciennes ruines, voient désormais gardes et soldats aller et venir pour assurer la sécurité des voyageurs et des citoyens."

  building_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_type_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_great_arena_of_valyria_01_desc:0 "Autrefois une grande arène emplie de gladiateurs et de spectateurs, elle n'est plus que ruines. La restaurer sera coûteux, mais pourrait ramener la joie au peuple."
  building_type_great_arena_of_valyria_01_desc:0 "Autrefois une grande arène emplie de gladiateurs et de spectateurs, elle n'est plus que ruines. La restaurer sera coûteux, mais pourrait ramener la joie au peuple."

  building_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_type_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_great_arena_of_valyria_02_desc:0 "Désormais reconstruite, la Grande Arène attire des milliers de spectateurs venus assister aux tournois et aux jeux du sang où professionnels et esclaves meurent sur le sable pour le divertissement du peuple."

  building_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_type_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_great_library_of_valyria_01_desc:0 "Les vestiges ruinés de la grande bibliothèque pourraient être restaurés pour abriter de grandes œuvres d'art et de littérature."
  building_type_great_library_of_valyria_01_desc:0 "Les vestiges ruinés de la grande bibliothèque pourraient être restaurés pour abriter de grandes œuvres d'art et de littérature."

  building_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_type_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_great_library_of_valyria_02_desc:0 "La Grande Bibliothèque de Valyria restaurée, emplie de grandes œuvres d'art, de littérature et de philosophie. Érudits et académiciens étudient ici textes et parchemins anciens."

  building_valyria_veilspire_peak:0 "Le Pic du Voile"
  building_type_valyria_veilspire_peak:0 "Le Pic du Voile"
  building_valyria_veilspire_peak_desc:0 "Le Pic du Voile est le plus haut sommet de toute la péninsule valyrienne, même avant [doom|E]. Autrefois utilisé comme pèlerinage sacré pour les plus braves et les plus forts, ce grand sommet représente une épreuve divine. On dit que ceux qui parviennent à gravir son faîte reviennent plus sages et plus savants."

  building_velakar_resort_01:0 "Un Ancien Complexe en Ruines"
  building_type_velakar_resort_01:0 "Un Ancien Complexe en Ruines"
  building_velakar_resort_01_desc:0 "Autrefois un Grand Complexe pour [dragonlords|El] et riches marchands, ce lieu de villégiature n'est plus que ruines, guère mieux qu'un tas de briques."

  building_velakar_resort_02:0 "L'Illustre Complexe de Velakar"
  building_type_velakar_resort_02:0 "L'Illustre Complexe de Velakar"
  building_velakar_resort_02_desc:0 "L'Illustre Complexe de Velakar, désormais restauré, accueille les personnes fortunées et de haut rang pour se baigner et se détendre dans ce majestueux lieu de villégiature digne d'un empereur. Utilisant la chaleur volcanique pour chauffer les bains et avec des milliers de serviteurs à leur service, c'est véritablement un spectacle à contempler."

  building_lv_aurions_lost_expedition_01:0 "L'Expédition Perdue d'Aurion"
  building_type_lv_aurions_lost_expedition_01:0 "L'Expédition Perdue d'Aurion"
  building_lv_aurions_lost_expedition_01_desc:0 "Voici l'expédition perdue de l'autoproclamé Empereur de Valyria, Aurion Varezys. Cette plaine désolée est désormais le lieu de sépulture de 30 000 hommes, réduits à de simples tas de métal et d'ossements, souillés par les radiations et les gaz toxiques des geysers de soufre. C'est véritablement un paysage infernal."

  building_type_lokirian_barracks_01:0 "Casernes Lokiriennes"
  building_type_lokirian_barracks_01_desc:0 "Les puissantes Casernes Lokiriennes, célèbres pour la qualité de leurs armes."
  building_lokirian_barracks_01:0 "Les Vestiges d'une Caserne"
  building_lokirian_barracks_01_desc:0 "Autrefois les puissantes casernes de Lokiria, désormais réduites à un simple tas de gravats."
  building_lokirian_barracks_02:0 "Casernes Partiellement Restaurées"
  building_lokirian_barracks_02_desc:0 "Bien qu'une grande partie de leur ancienne grandeur soit perdue, les casernes ont été rendues fonctionnelles. Des soldats s'y entraînent, leurs voix résonnant à travers les halls à moitié achevés."
  building_lokirian_barracks_03:0 "Les Puissantes Casernes de Lokiria"
  building_lokirian_barracks_03_desc:0 "Les casernes de Lokiria, désormais reconstruites et fortifiées de pierre-dragon et d'acier valyrien. Des soldats marchent jour et nuit, présentant un spectacle imposant et un cauchemar pour quiconque oserait les assiéger."


  building_redwyrms_wrath_01:0 "Forteresse en Ruines"
  building_type_redwyrms_wrath_01:0 "Forteresse en Ruines"
  building_redwyrms_wrath_01_desc:0 "La Fureur du Vouivre Rouge était une forteresse redoutable faite de murailles de pierre-dragon et de flèches imposantes, autrefois ornée des crânes de dragons abattus comme sinistres trophées de ses conquêtes. Gouvernée par le Seigneur Protecteur Taurion de Lokiria, c'était un bastion de guerre et de domination, ses bannières cramoisies inspirant la terreur à travers tout le pays. Désormais en ruines, la Fureur du Vouivre Rouge n'est plus que l'ombre de sa gloire passée, ses murailles brisées et ses bannières fanées se dressant comme les reliques du règne violent de Lokiria."

  building_redwyrms_wrath_02:0 "La Fureur du Vouivre Rouge"
  building_type_redwyrms_wrath_02:0 "Forteresse en Ruines"
  building_redwyrms_wrath_02_desc:0 "La Fureur du Vouivre Rouge s'est relevée, ses murailles de pierre-dragon restaurées dans leur sinistre splendeur, dominant à nouveau le paysage comme un symbole de terreur et de puissance. À nouveau ornée de crânes de [dragon|El] et de bannières cramoisies arborant le sceau du Dragon Rouge de Lokiria, la forteresse exsude une détermination sombre. Reconstruite à la fois comme monument à la guerre et déclaration de domination, la Fureur du Vouivre Rouge inspire crainte et respect, sa renaissance témoignant d'un héritage durable de conquête."

  building_valyrian_gate_01:0 "Ruines de la Porte"
  building_type_valyrian_gate_01:0 "Ruines de la Porte"
  building_valyrian_gate_01_desc:0 "Ruines de l'autrefois grande Porte de Valyria, puissant symbole de richesse et de pouvoir désormais réduit à un simple tas de briques."
  building_type_valyrian_gate_01_desc:0 "Ruines de l'autrefois grande Porte de Valyria, puissant symbole de richesse et de pouvoir désormais réduit à un simple tas de briques."

  building_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_type_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_valyrian_gate_02_desc:0 "La Grande Porte de Valyria, sept portes et sept herses fabriquées et renforcées d'Acier Valyrien. Des milliers de marchands et de voyageurs franchissent ces portes. Des statues géantes de héros d'antan peuvent être vues au sommet de l'entrée."

  building_great_harbor_of_valyria_01:0 "Baie pour un Port"
  building_type_great_harbor_of_valyria_01:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_01_desc:0 "Cette baie est suffisamment large et profonde pour y construire un grand port. Pour l'instant, il n'y a pas grand-chose ici, à part du poisson."
  building_type_great_harbor_of_valyria_01_desc:0 "Cette baie est suffisamment large et profonde pour y construire un grand port. Pour l'instant, il n'y a pas grand-chose ici, à part du poisson."

  building_great_harbor_of_valyria_02:0 "Docks et Ateliers de Réparation"
  building_type_great_harbor_of_valyria_02:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_02_desc:0 "Pour faciliter le commerce et la construction navale, et pour établir un riche centre commercial et un contrôle maritime, nous devons construire un grand port. Pour l'instant, nous construirons de longs docks et des ateliers de réparation pour la production navale. Nous ajouterons également une cabine de quartier-maître pour le commerce et un bureau d'inspection pour taxer et s'assurer qu'aucune marchandise de contrebande n'entre dans notre cité."

  building_great_harbor_of_valyria_03:0 "Quais"
  building_type_great_harbor_of_valyria_03:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_03_desc:0 "Construire des quais et étendre l'infrastructure actuelle nous permettra d'accueillir plus de navires et d'augmenter le commerce entrant. Ces extensions serviront également à amarrer les vaisseaux militaires servant notre flotte."

  building_great_harbor_of_valyria_04:0 "Grues et Fournitures de Construction Navale"
  building_type_great_harbor_of_valyria_04:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_04_desc:0 "En construisant de grandes grues, nous pouvons grandement augmenter l'efficacité de notre port et permettre à plus de navires d'arriver et de partir. Nous construirons également une zone de fournitures de construction navale près du port pour améliorer l'efficacité de la construction de nos navires de guerre. Avec ce Grand Port, nul ne pourra nous défier sur mer."

  building_great_temple_of_valyria_01:0 "Colline pour un Temple"
  building_type_great_temple_of_valyria_01:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il y a une colline près du Mont Tartarax que nous pourrions utiliser pour bâtir un Temple Magnifique et Illustre pour nos Dieux Dragons. Le fait qu'elle soit proche d'un volcan convient encore mieux à nos besoins."
  building_type_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il y a une colline près du Mont Tartarax que nous pourrions utiliser pour bâtir un Temple Magnifique et Illustre pour nos Dieux Dragons. Le fait qu'elle soit proche d'un volcan convient encore mieux à nos besoins."

  building_great_temple_of_valyria_02:0 "Salle de Prière et Lieu de Rassemblement"
  building_type_great_temple_of_valyria_02:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_02_desc:0 "Nous commencerons par une salle de prière richement décorée emplie d'artefacts précieux — sculptures de dragons et de feu, tapisseries représentant des dragons, braseros et le plus fin marbre que nous puissions trouver. Nous créerons également un hall ouvert séparé pour les sacrifices humains."

  building_great_temple_of_valyria_03:0 "Arène du Bûcher"
  building_type_great_temple_of_valyria_03:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_03_desc:0 "Les Valyriens ont toujours brûlé leurs morts. Brûler nos défunts dans un Temple près de notre volcan est une bien meilleure façon d'honorer ceux qui ont quitté ce monde. Nous agrandirons le hall ouvert que nous avons déjà construit à cette fin. Des colonnes sculptées, des fleurs exotiques et un autel de pierre noire pour remplacer les bûchers de bois utilisés pour les sacrifices humains et la crémation des morts seront construits."

  building_great_temple_of_valyria_04:0 "Statues de Dragons"
  building_type_great_temple_of_valyria_04:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_04_desc:0 "Aucun bâtiment à Valyria n'est véritablement achevé sans statues de dragons. Nous construirons 14 statues, une pour chaque Dieu. Chaque statue sera unique et majestueuse pour honorer dignement nos Dieux."

  building_great_walls_of_valyria_01:0 "Vestiges Insignifiants des Murailles"
  building_type_great_walls_of_valyria_01:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_great_walls_of_valyria_01_desc:0 "Cette zone abrite les vestiges des Grandes Murailles de Valyria. Il ne reste presque rien, car les murailles furent détruites lors du [doom|E]. Les rares vestiges ayant survécu sont si endommagés qu'ils sont inutilisables. Bien sûr, nous pourrions restaurer ces murailles dans leur grandeur d'antan, et nous devrions le faire. Inutile de dire que ce sera une entreprise très coûteuse."

  building_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_type_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_great_walls_of_valyria_02_desc:0 "Les murailles de Valyria ont été entièrement restaurées, imposantes et vastes, encerclant la cité tout entière. Ces fortifications massives sont si larges que douze chars pourraient y faire la course côte à côte (prends ça, Volantis !). Des tours de guet et des douves bordent désormais le périmètre, offrant des couches supplémentaires de défense. Les entrées sont renforcées par des herses et des zones de tir, rendant toute tentative d'invasion de la cité par la force presque impossible pour tout assaillant."

  building_great_dragonkeep_of_valyria_01:0 "Site du Palais"
  building_type_great_dragonkeep_of_valyria_01:0 "Le Grand Donjon du Dragon de Valyria"
  building_great_dragonkeep_of_valyria_01_desc:0 "Nous avons localisé un site potentiel pour un grand palais. À l'avenir, il deviendra un lieu de grandeur. Mais pour l'instant, il n'y a pas grand-chose de notable ici."
  building_type_great_dragonkeep_of_valyria_01_desc:0 "Nous avons localisé un site potentiel pour un grand palais. À l'avenir, il deviendra un lieu de grandeur. Mais pour l'instant, il n'y a pas grand-chose de notable ici."

  building_great_dragonkeep_of_valyria_02:0 "Pose des Fondations"
  building_type_great_dragonkeep_of_valyria_02:0 "Le Grand Donjon du Dragon de Valyria"
  building_great_dragonkeep_of_valyria_02_desc:0 "Pour abriter les souverains de cette grande cité, nous aurons besoin d'un palais imposant. Non, le plus grand palais que le monde ait jamais vu. Cela nécessitera bien sûr de nombreux esclaves et beaucoup d'or, mais ces ressources peuvent être acquises. Ce palais sera un témoignage de la grandeur valyrienne. Nous commencerons par un donjon et poursuivrons notre expansion à partir de là."

  building_great_dragonkeep_of_valyria_03:0 "Murailles Extérieures"
  building_type_great_dragonkeep_of_valyria_03:0 "Le Grand Donjon du Dragon de Valyria"
  building_great_dragonkeep_of_valyria_03_desc:0 "Pour garantir que ce donjon sera imprenable, nous construirons nos murailles exclusivement en pierre noire. Ces murailles hautes et épaisses repousseront tous les ennemis et individus indésirables. Construire des murailles épaisses et hautes uniquement en pierre noire sera bien sûr très coûteux."

  building_great_dragonkeep_of_valyria_04:0 "Murailles Intérieures et Décoration"
  building_type_great_dragonkeep_of_valyria_04:0 "Le Grand Donjon du Dragon de Valyria"
  building_great_dragonkeep_of_valyria_04_desc:0 "Maintenant que nous avons construit les murailles extérieures, nous devons ériger des murailles intérieures pour renforcer la sécurité et améliorer l'efficacité de nos fortifications. Des portes, des herses et des créneaux seront construits. De plus, nous décorerons le grand donjon de soieries, tapisseries, trophées et bien d'autres choses pour afficher notre splendeur."

  building_procrazion_01:0 "Grand Château Abandonné"
  building_type_procrazion_01:0 "Procrazion"
  building_procrazion_01_desc:0 "Procrazion était autrefois un bastion de la puissance valyrienne, trônant au sommet de la montagne centrale au cœur de la cité. Avant [doom|E], ce grand château servait de centre militaire et politique, agissant comme centre de défense pour toute la région. Bien qu'une grande partie de sa structure demeure intacte, le temps n'a pas été clément envers ses halls autrefois glorieux. Les ponts de pierre qui le reliaient jadis à la cité environnante sont désormais détruits, et l'intérieur montre des signes évidents de délabrement. Les Tours du Dragon se dressent toujours, mais leurs chambres sont vides, et la forge autrefois active est désormais dormante. Malgré cela, sa position élevée et ses points d'entrée limités offrent encore un avantage stratégique. Bien qu'encore imposant, Procrazion n'est plus que l'ombre de lui-même, attendant d'être restauré dans sa gloire d'antan."

  building_procrazion_02:0 "Procrazion"
  building_type_procrazion_02:0 "Procrazion"
  building_procrazion_02_desc:0 "Procrazion a été restauré dans sa gloire d'antan, se dressant fièrement au sommet de la montagne au cœur de la cité. Ce grand château est à nouveau relié à la cité en contrebas par des ponts reconstruits, offrant un accès sans avoir besoin de dragons. Les Tours du Dragon ont également été restaurées, permettant l'entrée et la sortie des majestueuses créatures, tandis que les tours à dômes resplendissent comme avant [doom|E]. À l'intérieur, il est équipé de toutes les commodités attendues pour un seigneur de la région, offrant confort et luxe même pendant un siège. La forge unique d'un côté de la montagne a été réactivée, canalisant à nouveau la lave pour créer des armes puissantes. Sa position élevée, combinée à sa restauration et ses points d'entrée limités, garantit qu'il reste quasi imprenable, capable de résister à toute menace. Désormais entièrement restauré, Procrazion sert non seulement de bastion défensif mais aussi de symbole de la résurgence de la cité."

  building_eternal_flame_temple_01:0 "Temple Abandonné"
  building_type_eternal_flame_temple_01:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_01_desc:0 "Le Temple de la Flamme Éternelle était vraisemblablement le lieu de connexion entre les Dieux Anciens de Valyria et les guerriers valyriens. Outre son rôle de centre religieux pour le peuple, le temple s'élevait jadis en symbole de la puissance religieuse de Valyria ; il gît désormais poussiéreux et abandonné. Aujourd'hui, il ne reste qu'un vague souvenir de ce qui fut autrefois un Grand Temple révéré de la cosmogonie valyrienne."

  building_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_type_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_02_desc:0 "Le Temple de la Flamme Éternelle a été renouvelé et se dresse comme un symbole de puissance, de religion et de pouvoir. Ses murs restaurés racontent les histoires des dieux anciens et sont emplis de légendes autrefois connues des seuls anciens Valyriens. Le peuple peut désormais profiter du luxe et rêver de ce que les dragons et la magie ont pu être avant [doom|E]. Les guerriers viennent prier pour être emplis de la rage et de la puissance des dragons qui les ont précédés. Le temple brille de tout son éclat tel un phare de foi religieuse, d'espoir et de la puissance valyrienne ancienne comme nouvelle."

  building_red_guard_barracks_01:0 "Casernes Abandonnées"
  building_type_red_guard_barracks_01:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_01_desc:0 "Le quartier général autrefois fier de l'élite de la Garde Rouge de la cité gît désormais abandonné et attaché aux murailles antiques de la cité. Le temps tout-puissant a érodé ses environs et son intérieur, où les créneaux brisés et la structure rouillée parlent d'abandon après [doom|E]. À l'arrière, deux Tours du Dragon ne sont plus que la réminiscence de ce qui fut autrefois la puissance militaire. Les chambres ne sont désormais remplies que de fantômes du temps passé et d'une force aujourd'hui perdue. Malgré leur délabrement, ces casernes aspirent à être restaurées pour redevenir le formidable bouclier de la cité."

  building_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_type_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_02_desc:0 "Entièrement restaurées dans leur puissance valyrienne d'antan, les Casernes de la Garde Rouge sont le foyer renouvelé des défenseurs de la cité, jouxtant les glorieuses murailles de la cité. La structure de pierre rappelle sa gloire passée, renforcée, puissante et emplie d'histoires et de cicatrices. Les Tours du Dragon exhalent vie et vitalité, à l'image de l'époque où de vrais dragons rugissaient dans les cieux. Les casernes ne sont plus saluées par des fantômes, mais par la Garde Rouge d'élite récemment restaurée, emplie d'une discipline énergisante, d'excellence et d'une gloire inégalée. Dans un mélange complexe d'ancienne et de nouvelle technologie, le bâtiment protège à nouveau la cité et abrite tous ceux qui s'y trouvent."

  building_red_guard_training_compound_01:0 "Complexe d'Entraînement Abandonné"
  building_type_red_guard_training_compound_01:0 "Le Complexe d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_01_desc:0 "Des murs décrépits qui ne parviennent plus à raconter les histoires des Gardes Rouges désormais disparus qui s'entraînaient ici. Ce Complexe d'Entraînement était autrefois un bâtiment respecté et admiré empli de dragons, de guerriers et de chefs, qui gît désormais abandonné et vide, incapable de refléter son énergie et sa gloire depuis longtemps oubliées. Armement, cachots et équipements rouillés peuvent encore être trouvés ici, mais on ne peut que se demander ce que cela a pu être durant son apogée."

  building_red_guard_training_compound_02:0 "Le Complexe d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_02_desc:0 "Force, honneur et puissance sont ce que l'on découvre en contemplant le Complexe d'Entraînement de la Garde Rouge restauré. Empli d'hommes donnant le meilleur d'eux-mêmes pour s'honorer en intégrant l'élite de la Garde Rouge, le complexe accueille stratèges, chefs et guerriers, tous visant l'excellence. Avec de glorieux piliers l'entourant avec grâce, et un toit élevé aux fenêtres rouges montrant que le ciel est la seule limite, ce bâtiment forme désormais les plus grands guerriers et les plus fins chefs."

  building_type_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01_desc:0 "Zanpur est le volcan jumeau occidental des îles de Marahaï."

  building_type_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01_desc:0 "Yovesh est le volcan jumeau oriental des îles de Marahaï."

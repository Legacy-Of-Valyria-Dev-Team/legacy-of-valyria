  building_valyria_volcano_05:0 "Yontaryos"
  building_type_valyria_volcano_05:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_05_desc:0 "Lorsque Yontaryos fut découvert par les anciens Valyriens, il différait des autres volcans de la région. Petit et relativement bas, il possédait peu de magma et offrait peu d’espace pour que les dragons puissent nicher. Cependant, il avait ses usages. Des minéraux précieux pouvaient encore y être extraits, et sa taille modeste en faisait un lieu idéal pour les rituels et les sacrifices, bien que ses flammes ne brûlassent pas aussi intensément que celles des autres."

  building_type_elyria_great_port_01:0 "Le Grand Port d’Elyria"
  building_elyria_great_port_01:0 "Le Grand Port d’Elyria"
  building_elyria_great_port_01_desc:0 "Le Grand Port d’Elyria est un immense chantier naval construit à l’époque du Détroit. La position stratégique d’Elyria dans la Baie des Esclaves assure à cette petite île un trafic maritime important de navires, de commerce et d'esclaves, que ce port massif peut accueillir. Après l’effondrement du Détroit, ce port s’empara d’une grande partie du commerce de la Baie des Esclaves, devenant l’envie de la région et de ses alentours."

  building_type_elyria_dragon_palace_01:0 "Le Palais du Dragon d’Elyria"
  building_elyria_dragon_palace_01:0 "Le Palais du Dragon d’Elyria"
  building_elyria_dragon_palace_01_desc:0 "Le Palais du Dragon est une station luxueuse et grandiose offrant tout ce qu’un seigneur pourrait désirer : vastes chambres, immenses salles de banquet, bassins, caves à vin et bien plus encore. Construit sous l’ère du Détroit pour héberger le gouverneur d’Elyria, aucune dépense n’a été épargnée. Aujourd’hui, il abrite le duc d’Elyria, lui conférant splendeur et renommée."


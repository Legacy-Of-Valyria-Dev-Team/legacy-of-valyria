l_french:
  # Braavos
  building_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_type_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_agot_EE_titan_of_braavos_desc:0 "Inclus par le célèbre scribe westerosi Lomas Longstrider parmi les Merveilles créées par l’homme, le Titan de Braavos constitue la première ligne de défense de la Cité Libre de Braavos. Il garde l’étroit passage menant à la lagune où la cité est installée. Cette statue monumentale de granite et de bronze représente un guerrier agissant à la fois comme forteresse et phare. Des meurtrières sous la jupe blindée de la statue et des fentes pour flèches sur toute sa cuirasse offrent une défense quasiment impénétrable contre les navires ennemis entrant dans la lagune"

  building_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_type_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_agot_EE_sealords_palace_desc:0 "Le Palais du Seigneur de la Mer est la résidence du dirigeant de Braavos. Sous les dômes et les tours de ce vaste palais se trouve une ménagerie exotique d’oiseaux et de bêtes venues du monde entier"

  # Volantis
  building_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_type_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_agot_EE_black_walls_of_old_volantis_desc:0 "Le cœur de Volantis. Construit par les anciennes possessions valyriennes, ce mur géant de pierre noire fusionnée protège une série de palais, cours, tours et temples. Seuls ceux dont le sang remonte à l'ascendance valyrienne, le Vieux Sang, sont autorisés à y habiter."

  building_agot_EE_volantis_harbor:0 "Port de Volantis"
  building_type_agot_EE_volantis_harbor:0 "Port de Volantis"
  building_agot_EE_volantis_harbor_desc:0 "La puissance de Volantis provient en partie de son grand port, notamment grâce à sa situation géographique avantageuse. Ce vaste port en forme de croissant est construit directement à l'embouchure de la Rhoyne et on dit qu'il est capable de contenir la totalité de Braavos."

  building_agot_EE_the_long_bridge:0 "Le Long Pont"
  building_type_agot_EE_the_long_bridge:0 "Le Long Pont"
  building_agot_EE_the_long_bridge_desc:0 "Le Long Pont relie les deux moitiés de Volantis et est le pont le plus long du monde connu. Construit par l'Ancienne Valyria à son apogée en pierre fusionnée, on dit qu'il est capable de supporter le poids d'un millier d'éléphants."

  building_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Seigneur de la Lumière"
  building_type_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Seigneur de la Lumière"
  building_agot_EE_temple_of_the_lord_of_light_desc:0 "Ce temple énorme s'élève bien au-dessus de tout autre bâtiment de la ville. Ses couleurs éblouissantes d'or, de rouge et d'orange en font un spectacle véritablement remarquable. Protégé par la Main de Feu, ce temple sert R’hllor, le Seigneur de la Lumière, et il pourrait être l'un des plus grands témoignages de sa puissance existante."

  building_agot_EE_volantis_walls:0 "Les Murs de Volantis"
  building_type_agot_EE_volantis_walls:0 "Les Murs de Volantis"
  building_agot_EE_volantis_walls_desc:0 "Bien qu'ils ne soient pas aussi impressionnants que ceux de l'Ancienne Volantis, les murs de Volantis feront réfléchir tout attaquant à deux fois avant de tenter de prendre d'assaut la ville."

  # Rhoyne
  building_agot_EE_nymeria_palace_01:0 "Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_01:0 "Palais de Nymeria"
  building_agot_EE_nymeria_palace_01_desc:0 "Au cœur de Ny Sar se trouvent les ruines du Palais de Nymeria abandonné depuis que l’ancien Freehold valyrien a vaincu le prince Garin lors de la Seconde Guerre des Épices, ses murs de marbre rose et vert, ses dômes imposants et ses hautes flèches demeurent la coquille hantée de sa splendeur passée, toute vie a déserté cet endroit lorsque Nymeria s’est réfugiée en Dorne"

  building_agot_EE_nymeria_palace_02:0 "Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_02:0 "Palais de Nymeria"
  building_agot_EE_nymeria_palace_02_desc:0 "Érigé de nouveau au cœur de Ny Sar, le Palais de Nymeria a été restauré avec minutie, témoignage de la résilience et de l’héritage rhoynar, le marbre vert et rose resplendit sous le soleil et ses dômes et flèches dominent l’horizon, effaçant presque les souvenirs de son passé tragique"

  building_agot_EE_palace_of_love_01:0 "Palais du Chagrin"
  building_type_agot_EE_palace_of_love_01:0 "Palais du Chagrin"
  building_agot_EE_palace_of_love_01_desc:0 "Le Palais du Chagrin se dresse comme un sombre rappel du destin qui a frappé Chroyane la Cité des Festivals, ses tours effondrées couvertes de mousse et de vignes sombres ne révèlent rien de la beauté qu’incarnait autrefois le Palais de l’Amour, statues enfoncées et hommes de pierre hantent ses salles brumeuses et en ruines"

  building_agot_EE_palace_of_love_02:0 "Palais de l’Amour"
  building_type_agot_EE_palace_of_love_02:0 "Palais de l’Amour"
  building_agot_EE_palace_of_love_02_desc:0 "Le Palais de l’Amour retrouve les rives du Rhoyne dans une renaissance éblouissante, ses tours élancées ornées de mosaïques colorées et de sculptures délicates célèbrent la vie et l’amour, les fontaines étincelantes alimentent de luxuriants jardins débordant de fleurs sur chaque terrasse, sous ses grands dômes les mariages sont de nouveau bénis, insufflant à Chroyane la promesse de nouveaux commencements"

  building_agot_EE_bridge_of_dream_01:0 "Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_01:0 "Pont des Rêves"
  building_agot_EE_bridge_of_dream_01_desc:0 "Autrefois rival du Long Pont de Volantis, le Pont des Rêves se dresse maintenant au‑dessus du Rhoyne dans une épaisse brume, ses arches de pierre qui s’élevaient à douze mètres au‑dessus de la rivière se sont effondrées sous la mousse dense et les vignes noires, désormais lieu des hommes de pierre, il demeure un monument silencieux et pourrissant à la fierté perdue des Rhoynars"

  building_agot_EE_bridge_of_dream_02:0 "Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_02:0 "Pont des Rêves"
  building_agot_EE_bridge_of_dream_02_desc:0 "Le Pont des Rêves s'étend de nouveau sur le Rhoyne dans toute sa splendeur. S'élevant à quarante pieds au-dessus du fleuve, ses arches de pierre pâle se dressent avec force et fierté. De somptueux jardins bordent la travée de bois du pont, éclatants de fleurs aux mille couleurs. Ce grand pont, jadis perdu dans l'oubli et les ruines, renaît aujourd'hui. Symbole de la fierté et de la résilience rhoynaise, il domine une fois de plus les flots du Rhoyne"

  # Meereen
  building_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_type_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_agot_EE_great_pyramid_of_meereen_desc:0 "De loin le plus grand bâtiment de la ville, la Grande Pyramide de Meereen a été construite par une petite armée d’esclaves, dont mille sont morts pendant sa construction, la pyramide sert de centre administratif à Meereen et les dirigeants de la ville utilisent la Grande Salle pour recevoir leurs sujets depuis des siècles"

  # Asshai
  building_stygai_01:0 "Cité Hantée de Stygai"
  building_type_stygai_01:0 "Stygai"
  building_stygai_01_desc:0 "Stygai, cité énigmatique et antique drapée dans le cœur obscur des Terres de l'Ombre, demeure l'un des mystères les plus terrifiants du monde. D'une ancienneté insondable et enveloppée d'une obscurité éternelle, elle s'élève en monument d'une ère oubliée et mystérieuse. Même les plus audacieux des liants de l'ombre n'osent s'aventurer dans ses rues abandonnées. Ses flèches de pierre et ses ruelles labyrinthiques résonnent des murmures des défunts dont les esprits torturés sont liés à jamais à ce sol maudit. Voilée de secrets, ses véritables origines et l'étendue de ses sombres pouvoirs demeurent inconnues"

  # Gogossos
  building_red_citadel_01:0 "La Tour Rouge"
  building_type_red_citadel_01:0 "La Tour Rouge"
  building_red_citadel_01_desc:0 "Une grande tour côtière, que l'on croit être le dernier vestige d'une forteresse jadis puissante, sert aujourd'hui de principal bastion de la ville. Bien que l'essentiel de la structure d'origine ait été effacé par le temps, ce bastion solitaire perdure — modeste, mais incroyablement robuste et hautement défendable. D'épais murs de pierre altérée résistent aux éléments comme aux sièges éventuels, en faisant un siège d'autorité fiable à Gogossos. Ce n'est pas encore une grande citadelle, mais c'est déjà un bastion redoutable, une base solide sur laquelle de plus grandes fortifications pourront peut-être un jour s'élever"

  building_red_citadel_02:0 "Le Redoute Rouge"
  building_type_red_citadel_02:0 "Le Redoute Rouge"
  building_red_citadel_02_desc:0 "Désormais renforcée par une solide palissade de bois et des tours de guet érigées sur les vestiges cramoisis, cette redoute s'est transformée en un bastion plus redoutable, capable de résister à des menaces prolongées. Ce n'est plus une simple tour côtière solitaire : les défenses élargies lui permettent désormais d'abriter une garnison décente, offrant une forte emprise sur Gogossos. Avec des provisions abondantes et des positions renforcées, elle pourrait même soutenir une armée pendant des mois si nécessaire, marquant sa transformation d'une simple relique du passé en véritable bastion de pouvoir au cœur de la cité."

  building_red_citadel_03:0 "La Citadelle Rouge"
  building_type_red_citadel_03:0 "La Citadelle Rouge"
  building_red_citadel_03_desc:0 "Autrefois simple vestige du passé, la Citadelle Rouge a été reconstruite en une forteresse vaste et inébranlable, dominant Gogossos comme le siège suprême du pouvoir de la cité. Ce n’est plus une tour isolée, mais un donjon pleinement restauré, ses colossaux murs de Pierre Noire valyrienne s’élèvent haut et épais, monument de domination et d’effroi.\n\nComme pour la Porte Cramoisie, les murs de la Citadelle Rouge furent jadis imprégnés de rituels de magie du sang accomplis par les anciens Valyriens, leur sorcellerie teintant à jamais la pierre d’un cramoisi profond et surnaturel. Bien que ces rituels appartiennent désormais à l’histoire, leur sombre héritage perdure, faisant de la citadelle non seulement un bastion quasi-impénétrable, mais aussi un symbole obsédant de pouvoir absolu.\n\nEn son cœur, la Tour Rouge transperce le ciel, sa présence projetant une longue ombre sur la ville, rappel constant de l'autorité de l'archonte. Les murs inférieurs et la cour demeurent luisants de sang, non seulement par les rituels d’antan, mais aussi des innombrables exécutions, trahisons et conflits brutaux qui s’y sont déroulés. Le sang des rebelles, des conspirateurs et des ennemis de l'État a imprégné ses fondations, ancrant la peur dans les moindres pierres de la forteresse.\n\nOn murmure qu’entre ces murs, la Mort Rouge prit naissance pour la première fois — une malédiction qui ravagea autrefois Gogossos, noyant des quartiers entiers sous le sang et la souffrance. Bien que le fléau ait disparu depuis longtemps, certains prétendent que la citadelle s’en souvient encore, que les fantômes des mourants hantent ses chambres les plus profondes, murmurant à qui veut les entendre.\n\nLieu de règne de fer et de légende, la Citadelle Rouge est bien plus qu’une forteresse — elle est le noyau inflexible de Gogossos, un endroit où le pouvoir est absolu, la clémence rare, et la rébellion écrasée avant même d’éclore."

  building_pit_of_sorrows_01:0 "Donjon Envahi et Ruines"
  building_type_pit_of_sorrows_01:0 "Donjon Envahi et Ruines"
  building_pit_of_sorrows_01_desc:0 "Un donjon en ruine, dont les murs jadis imposants sont aujourd’hui enveloppés de lianes rampantes et engloutis par l’étreinte tenace de la nature, se dresse dans un silence lugubre. Des arbres ont pris racine dans ses cours, leurs branches tordues griffant le ciel, comme pour témoigner d’horreurs oubliées.\n\nMalgré la décrépitude, le donjon demeure étrangement défendable — ses tours, bien que ravagées, conservent une présence imposante. Son portail, à moitié enseveli sous la mousse et les décombres, évoque une forteresse refusant de céder entièrement au temps.\n\nPourtant, quelque chose ne va pas. L’air y est chargé d’une quiétude contre-nature, celle qui fait frissonner la peau et titille l’esprit. Les ombres y persistent sans raison, et des murmures — trop ténus pour n’être que le vent — glissent parmi les ruines, évoquant des secrets qu’il vaudrait mieux ne jamais réveiller."

  building_pit_of_sorrows_02:0 "Fouilles du Donjon et de la Fosse"
  building_type_pit_of_sorrows_02:0 "Fouilles du Donjon et de la Fosse"
  building_pit_of_sorrows_02_desc:0 "En élargissant nos efforts et en dégageant le fouillis végétal, nous avons fait une découverte stupéfiante — le sol semblait s’enfoncer à l’infini, peu importe combien de boue ou de débris nous retirions. Ce qui semblait n’être qu’un simple enchevêtrement dissimulant des ruines se révéla être une vaste descente stratifiée, chaque niveau inférieur dévoilant les vestiges d’un passé oublié.\n\nParmi les pierres effondrées et la terre détrempée, nous avons déterré d’innombrables ossements — leur origine inconnue, leurs histoires perdues à jamais. À chaque pas, un sentiment croissant s’imposait : il s’agit peut-être bien de la fameuse Fosse des Soupirs, un lieu évoqué dans les légendes les plus craintes, dont les profondeurs, intactes, n’attendent qu’à livrer leurs mystères."

  building_pit_of_sorrows_03:0 "La Fosse des Soupirs"
  building_type_pit_of_sorrows_03:0 "La Fosse des Soupirs"
  building_pit_of_sorrows_03_desc:0 "L’ancienne Fosse des Soupirs, autrefois ruine croulante, a été patiemment reconstruite et restaurée dans sa sinistre splendeur d’antan. Pourtant, malgré tous les efforts pour reconquérir ses hauteurs, ses profondeurs véritables demeurent un abîme insondable. Les ténèbres en bas s’étendent sans fin, avalant lumière et son, une gueule béante vers l’inconnu. Nombreux sont ceux qui ont osé descendre pour percer ses secrets oubliés, mais aucun n’est jamais revenu pour raconter ce qu’ils ont vu — s’il y a un fond, nul ne le sait."

  building_the_toad:0 "Le Crapaud Noir"
  building_type_the_toad:0 "Le Crapaud Noir"
  building_the_toad_desc:0 "La plus grande statue jamais érigée sur l’Île des Crapauds domine le paysage, relique monolithique d’une civilisation disparue. Taillée dans une pierre noire huileuse d’origine inconnue qui semble luire même dans l’obscurité, elle prend la forme d’un immense crapaud — trapu, grotesque, et d’un réalisme troublant. Nul ne sait qui l’a construite, ni dans quel but, et le sens qu’elle portait autrefois s’est perdu dans les âges. Pour la plupart, ce n’est rien d’autre qu’une effigie sinistre, une curiosité grotesque dans un lieu déjà chargé de mystères. Pourtant, les habitants murmurent — à voix basse — des rêves étranges que font ceux qui dorment trop près, une chaleur anormale qui émane de la pierre lorsqu’on la touche, et des yeux qui semblent luire juste sous la surface, comme si quelque chose observait de l’intérieur."
  building_type_the_toad_desc:0 "La plus grande statue jamais érigée sur l’Île aux Crapauds domine le paysage, relique monolithique d’une civilisation depuis longtemps disparue. Sculptée dans une pierre noire inconnue, luisante comme de l’huile même dans l’obscurité la plus totale, elle représente un gigantesque crapaud — trapu, grotesque et troublant de réalisme. Nul ne sait qui l’a bâtie, ni dans quel but, et le sens qu’elle pouvait autrefois revêtir s’est depuis longtemps perdu dans les brumes du temps. Pour la plupart, ce n’est qu’un effigie grossière et funeste, une curiosité étrange dans une contrée déjà saturée de mystères. Pourtant, certains murmurent — à voix basse, entre habitants — des rumeurs de songes étranges qui hantent ceux qui dorment trop près, de la chaleur troublante que dégage la pierre lorsqu’on la touche, et d’yeux semblant luire sous sa surface, comme si quelque chose observait depuis l’intérieur."

  building_ax_hold:0 "La Forteresse de la Hache"
  building_type_ax_hold:0 "La Forteresse de la Hache"
  building_ax_hold_desc:0 "La forteresse de la Maison Xhore se dresse à la fois comme un sanctuaire et une citadelle, bastion de pierre et d’acier construit pour endurer les tempêtes des Îles Basilisques. Nichée au sommet de falaises dentelées et entourée de flots traîtres, elle fut conçue non pas seulement comme un foyer, mais comme un bastion inébranlable d’où les pirates qarthéens des Îles de l’Ouest lançaient leurs infâmes raids. Ses murs, usés mais robustes, portent les cicatrices d’innombrables batailles, tandis que ses tours de guet surplombent les flots, toujours aux aguets des proies comme des poursuivants."

  building_garden_of_malice_01:0 "Un Grand Fort Envahi"
  building_type_garden_of_malice_01:0 "Un Grand Fort Envahi"
  building_garden_of_malice_01_desc:0 "Un vaste mur d’enceinte envahi entoure les ruines, ses pierres anciennes à peine visibles sous les couches de lianes et de mousse épaisse. En son cœur se dresse un donjon en ruine, ses tours brisées à moitié englouties par l’étreinte implacable de la nature. Le temps a effacé toute l’histoire de ce lieu, ne laissant derrière qu’un silence étouffant et inquiétant.\n\nCeux qui osent franchir les portes brisées comprennent vite pourquoi nul n’a tenté de le reprendre — cet endroit est un piège mortel. Des haies torsadées, poussées de manière sauvage et anormale, forment un labyrinthe mouvant, ses chemins changeant comme des choses vivantes, menant les imprudents vers la perdition. Parmi cette végétation foisonnante, se cachent des plantes aux couleurs impossibles et aux formes contre nature, dont la beauté dissimule des intentions mortelles. Certaines libèrent des spores qui étouffent, d’autres suintent des toxines qui brûlent la peau, et quelques-unes bougent... attendant que la proie s’approche trop près.\n\nLes légendes murmurent qu’une chose — peut-être les vestiges d’une ancienne sorcellerie, ou la présence persistante de quelque force oubliée — maintient cette flore dans une prospérité qui défie la nature. Les ruines demeurent intactes, non parce qu’elles sont oubliées, mais parce qu’elles sont redoutées. Même les pillards les plus hardis savent qu’il vaut mieux ne pas provoquer un lieu où les plantes elles-mêmes semblent assoiffées de sang."

  building_the_garden_of_malice_2:0 "Le Jardin de Malice"
  building_type_the_garden_of_malice_2:0 "Le Jardin de Malice"
  building_the_garden_of_malice_2_desc:0 "Le Jardin de Malice est une forteresse aux multiples strates mortelles, construite en pierre noire huilée et entourée de défenses létales. Le mur d'enceinte extérieur enferme un vaste labyrinthe de jardin en perpétuel mouvement, un piège mortel vivant où des vignes épineuses fouettent tel des fouets, où des fleurs exhalent des spores toxiques, et où même les haies se tordent pour tromper et capturer les intrus. Aucune lumière ne parvient sous son dense couvert, où des choses invisibles se faufilent à travers le sous-bois, et l'air est épais de l'odeur de la décomposition. Au-delà du labyrinthe, les murs intérieurs et le fossé forment une seconde ligne de défense, les eaux noires grouillant d'horreurs invisibles qui entraînent les imprudents vers les profondeurs. De hautes remparts, occupés par des sentinelles silencieuses, surveillent la seule entrée : un pont-levis renforcé qui se baisse rarement. Au cœur de tout cela se dresse le donjon, une structure massive et intacte de Valyrie, dont les salles en pierre noire résonnent d'un silence étrange. Sa plus haute tour abrite un arbre mort ancien, pétrifié et squelettique, dont les racines sont fusionnées à la pierre comme s'il se nourrissait de quelque chose de profond. On dit qu'il est antérieur au Fléau lui-même, une relique de la vieille Valyrie imprégnée d'une sorcellerie depuis longtemps oubliée. Prendre le Jardin de Malice n'est pas simplement une bataille : c'est une descente dans quelque chose de bien plus sinistre, où même la terre conspire pour tuer"

  building_sapphire_quarter:0 "Le Quartier Saphir"
  building_type_sapphire_quarter:0 "Le Quartier Saphir"
  building_sapphire_quarter_desc:0 "Le Quartier Saphir est un vaste district fortifié, perché au sommet de la plus haute colline de Gogossos. Autrefois domaine des anciens Seigneurs Dragons, il sert désormais d’enclave exclusive aux maîtres esclavagistes et princes marchands les plus illustres de la ville. Seuls les plus riches peuvent y résider, car ici, seules des demeures et palais somptueux se dressent—construits en marbre étincelant et ornés d’or. Ses marchés privés sont drapés des plus fines soies, réservés à ceux qui peuvent s’offrir des luxes hors de portée des hommes ordinaires."

  building_crimson_gate:0 "La Porte Cramoisie"
  building_type_crimson_gate:0 "La Porte Cramoisie"
  building_crimson_gate_desc:0 "La Porte Cramoisie se dresse comme une sentinelle imposante et redoutable, la première ligne de défense de la légendaire ville de Gogossos. Dominant le paysage, elle constitue le seul passage terrestre permettant d’entrer dans la cité, gardant le long et traître pont qui enjambe le grand fleuve. Forgée dans la Pierre Noire Valyrienne, sa surface sombre et surnaturelle semble absorber la lumière, sa structure lisse mais impénétrable imprégnée de la puissance d’une sorcellerie oubliée. Ses pierres sont chargées d’histoire—teintées d’un rouge profond par les anciens rituels de sang valyriens qui y furent pratiqués, laissant une marque sinistre et indélébile des arts obscurs ayant renforcé ses défenses. La massive bastide qui la surplombe, haute de 140 pieds, se dresse comme un titan face à ceux qui approchent, sa simple présence inspirant à la fois crainte et admiration. Perchées au sommet de ses murs colossaux, des statues de dragons veillent en silence, leurs immenses yeux incrustés de gemmes scintillant d’un éclat irréel—observant, attendant, comme si les âmes des bêtes qu’elles représentent persistaient encore dans la pierre.\n Peu ont osé forcer la Porte Cramoisie, et encore moins ont survécu pour raconter leur histoire. Ce n’est pas une simple barrière—c’est un monument à la puissance inébranlable de Gogossos, un témoignage éternel du pouvoir oublié de la cité et de l’héritage sombre de Valyria."

  building_glittering_pits_01:0 "Les Fosses Étincelantes"
  building_type_glittering_pits_01:0 "Les Fosses Étincelantes"
  building_glittering_pits_01_desc:0 "Les jungles de Gogossos et l’infâme Île des Larmes forment une étendue sauvage et indomptée, une terre regorgeant à la fois de dangers et de richesses inimaginables Un véritable trésor de ressources naturelles, où le dense feuillage obscur dissimule des merveilles insoupçonnées pour ceux assez audacieux pour en braver les périls Parmi les trésors les plus convoités se trouvent les diamants et les saphirs, scintillant dans les profondeurs de la terre comme l’essence capturée des étoiles Ces pierres précieuses, rares et d’une qualité inégalée, ont fait de cette région une légende murmurée parmi les marchands et les chasseurs de fortune Bien que les mines restent modestes mais puissantes, leurs rendements sont stupéfiants, chaque excavation révélant des gemmes d’une brillance à couper le souffle"

  building_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_type_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_glittering_pits_02_desc:0 "À mesure que les mines s’agrandissent, elles se transforment en un vaste réseau de tunnels souterrains, s’étendant sous la jungle tel un enchevêtrement de racines Les parois scintillent de pierres précieuses, reflétant la lumière vacillante des torches, et des chambres cachées sont découvertes, révélant des veines riches prêtes à être exploitées Cependant, plus les mineurs creusent, plus la jungle semble riposter Les racines percent les murs, des spores toxiques flottent dans l’air, et d’étranges créatures invisibles s’agitent dans l’obscurité"

  building_glittering_pits_03:0 "Les Profondeurs Stellaires"
  building_type_glittering_pits_03:0 "Les Profondeurs Stellaires"
  building_glittering_pits_03_desc:0 "À son stade le plus profond et le plus développé, la mine est connue sous le nom de Profondeurs Stellaires Un vaste réseau de tunnels et d’immenses chambres souterraines où sont extraits les plus riches gisements de saphirs et de diamants Les parois de ces cavernes scintillent de veines intactes d’un bleu profond et d’un blanc éclatant, captant la moindre lueur et créant l’illusion d’un ciel étoilé sous terre Ici, les gemmes sont plus grandes, plus pures et plus précieuses que partout ailleurs dans la jungle Des saphirs sans défaut, aussi profonds que l’océan, attendent en amas denses, tandis que des diamants d’une taille impressionnante restent incrustés dans la roche la plus dure, nécessitant habileté et précision pour être extraits Des équipes entières de mineurs travaillent sans relâche, leurs outils résonnant à travers les vastes salles souterraines tandis qu’ils arrachent la fortune à la pierre brute Mais avec la profondeur vient le danger Les tunnels s’enfoncent dans une obscurité plus profonde que ne le signalent les cartes, et dans les chambres les plus basses, où l’air est épais et pesant, il y a des endroits où les mineurs refusent d’aller Certains affirment avoir découvert bien plus que des gemmes dans ces profondeurs Des choses ensevelies depuis bien avant que les hommes ne prennent leurs outils On murmure que des ombres se déplacent là où aucune lumière ne devrait exister, que de lointres tremblements rythmiques résonnent sans qu’aucun éboulement ne soit détecté, et qu’une chaleur sourde et persistante émane de fissures où il ne devrait y en avoir aucune Malgré les risques, les Profondeurs Stellaires restent le joyau des mines de Gogossos, un lieu où les fortunes se forgent et où des vies se perdent seuls les plus habiles et les plus déterminés osent y travailler, sachant qu’entre ces murs se trouvent certains des joyaux les plus précieux jamais extraits mais aussi le danger de creuser trop profondément... et d’éveiller quelque chose qui aurait dû rester oublié"

  building_darkreach_quay_01:0 "Quai de Sombreport"
  building_type_darkreach_quay_01:0 "Quai de Sombreport"
  building_darkreach_quay_01_desc:0 "Le Quai de Sombreport est le cœur humble mais essentiel du commerce de Gogossos, la première étape de l'infrastructure portuaire grandiose de la cité Un port modeste en pierre et en bois, il s'avance dans les eaux sombres de la baie, ses quais usés gémissant sous le poids des navires accostant Bien que petit, il est stratégiquement placé pour servir de principal point d’entrée aux marchands, contrebandiers et aventuriers en quête de fortune à Gogossos"

  building_darkreach_quay_02:0 "Port de Sombreport"
  building_type_darkreach_quay_02:0 "Port de Sombreport"
  building_darkreach_quay_02_desc:0 "Avec l’expansion de l’empire commercial de Gogossos, le Port de Sombreport est devenu un centre florissant du commerce, bien loin de ses modestes débuts Les quais ont été renforcés avec de la pierre et du bois robuste, permettant aux plus grands navires marchands d’y accoster et de décharger leurs cargaisons exotiques De nouvelles jetées s’étendent plus loin dans les eaux sombres, accueillant un flot croissant de navires venus de terres lointaines, attirés par les richesses des saphirs, diamants et autres ressources rares de la jungle de Gogossos"

  building_darkreach_quay_03:0 "Port de la Marée Noire"
  building_type_darkreach_quay_03:0 "Port de la Marée Noire"
  building_darkreach_quay_03_desc:0 "Avec la renaissance de Gogossos, son port commercial autrefois modeste s’est transformé en Port de la Marée Noire, une forteresse colossale du commerce et du pouvoir naval Il ne s’agit plus seulement d’une escale pour les marchands, mais d’un épicentre florissant du commerce international, attirant marchands, mercenaires et chasseurs de fortune du monde entier Le port est désormais fortifié avec la Pierre Noire Valyrienne ancestrale, ses murs imposants encerclant les quais animés et offrant une défense inégalée contre les raids et les sièges Ces remparts imposants, reforgés à partir des ruines du passé, témoignent de la résurgence de la cité, garantissant que la richesse et l’influence de Gogossos restent inébranlables"

  building_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
  building_type_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
  building_last_dragon_tower_01_desc:0 "La dernière Tour du Dragon encore debout hors de Valyria, bâtie dans les derniers jours avant le Fléau, demeure un monument à la fois de pouvoir et de tragédie À l’origine construite pour abriter la famille de lords Dragon régnant sur Gogossos, ses couloirs étaient censés être un symbole de leur règne éternel, mais le destin en a décidé autrement Lorsque la famille périt dans l’anéantissement de Valyria, la tour devint une relique silencieuse d’un empire perdu, projetant une ombre oppressante sur la cité Aujourd’hui, elle sert un nouveau maître, l’Archonte le plus puissant de Gogossos et sa famille, qui gouvernent depuis ses hauteurs vertigineuses Ce n’est plus seulement un symbole de la grandeur valyrienne, mais un rappel brutal à la classe inférieure, aux esclaves et aux rebelles potentiels de la hiérarchie impitoyable de la cité Elle se dresse comme un témoignage inébranlable de domination, un avertissement permanent que l’élite de Gogossos écrasera quiconque ose se dresser contre elle"

  # Valyria
  building_type_valyria_volcano:0 "Une des Quatorze Flammes"

  building_valyria_volcano_01:0 "Mont Gaelithox"
  building_type_valyria_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_01_desc:0 "Gaelithox est l’un des volcans les plus redoutables parmi les légendaires Quatorze Flammes de Valyria, dominant le paysage alentour, son sommet est perpétuellement enveloppé d’un épais voile de fumée et de cendres, les flancs du volcan sont marqués par d’anciens flux de lave, désormais solidifiés en formations rocheuses noires et dentelées, vestiges de la Ruine"

  building_valyria_volcano_02:0 "Rhazalhar"
  building_type_valyria_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_02_desc:0 "Rhazalhar est la plus grande des Quatorze Flammes, un colosse de fureur en fusion et de puissance ancestrale, son sommet, constamment voilé de fumée et de cendres, perce les cieux et projette son ombre sur le paysage environnant, des rivières de lave s’écoulent de son cœur incandescent, traçant des chemins lumineux à travers la roche volcanique sombre, en raison des températures extrêmes autour du volcan, l’extraction minière y est impossible"

  building_valyria_volcano_03:0 "Epaekros"
  building_type_valyria_volcano_03:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_03_desc:0 "Epaekros est plus dangereux que les autres volcans, d’une beauté sauvage aux falaises instables qui font tomber des rochers sur les randonneurs et aux sols glissants provoquant des chutes mortelles, ceux qui atteignent son sommet rencontrent souvent une fin tragique, victime d’un firewyrm ou d’un dragon nichant là, pourtant, pour ceux qui parviennent à explorer le volcan, richesses, or et métaux précieux abondent"

  building_valyria_volcano_04:0 "Tartarax"
  building_type_valyria_volcano_04:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_desc:0 "S’élevant haut dans le ciel, bien que moins que Rhazalhar, Tartarax est un volcan plus élancé mais plus profond dont le sommet curieusement façonné constitue un nid idéal pour toute créature avide de feu, ses cavernes et tunnels profonds offrent de vastes opportunités minières mais aussi la mort, lave et créatures hostiles abondent dans ce donjon sombre et profond, pourtant la lueur de sa lave majestueuse, visible de loin dans l’obscurité de la nuit, reste inoubliable"

  building_valyria_volcano_05:0 "Yontaryos"
  building_type_valyria_volcano_05:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_05_desc:0 "Lors de sa découverte par les anciens Valyriens, Yontaryos différait des autres volcans de la région, il était petit et relativement bas, avec peu de magma et un espace limité pour la nidification des dragons, cependant, il avait ses usages, des minéraux précieux pouvaient encore y être extraits et sa petite taille le rendait idéal pour les rituels et sacrifices, bien que ses flammes ne brûlât pas aussi intensément que celles des autres"

  building_type_elyria_great_port_01:0 "Le Grand Port d’Elyria"
  building_elyria_great_port_01:0 "Le Grand Port d’Elyria"
  building_elyria_great_port_01_desc:0 "Le Grand Port d’Elyria est un immense chantier naval construit à l’époque du Freehold, la position stratégique d’Elyria dans la Baie des Esclaves offre à cette petite île un trafic important de navires, de commerce et d’esclaves que ce port massif peut accueillir, après l’effondrement du Freehold, ce port a capturé une part significative du commerce de la Baie des Esclaves, devenant l’envie de la région et de ses environs"

  building_type_elyria_dragon_palace_01:0 "Le Palais du Dragon d’Elyria"
  building_elyria_dragon_palace_01:0 "Le Palais du Dragon d’Elyria"
  building_elyria_dragon_palace_01_desc:0 "Le Palais du Dragon est une résidence luxueuse et grandiose offrant tout ce qu’un seigneur pourrait désirer, vastes pièces, immenses salles de banquet, piscines, caves à vin et bien plus encore, construit à l’époque du Freehold pour loger le gouverneur d’Elyria, aucun coût n’a été épargné, aujourd’hui, il abrite le duc d’Elyria, lui conférant splendeur et renommée"

  building_valyria_dead_volcano_01_01:0 "Syrabelos"
  building_type_valyria_dead_volcano_01_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_01_desc:0 "Syrabelos est un volcan éteint, la lave qui autrefois s’y écoulait est depuis longtemps solidifiée. Cela ne le rend pas inutile, car il reste riche en minéraux et métaux précieux à exploiter et peut toujours servir de refuge lors de raids ou tempêtes"

  building_valyria_dead_volcano_01_02:0 "Mines de Syrabelos"
  building_type_valyria_dead_volcano_01_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_02_desc:0 "Les opérations minières ont repris à Syrabelos, des esclaves descendent chaque jour dans les puits pour extraire des métaux précieux et autres matériaux de valeur pour leurs oppresseurs"

  building_valyria_dead_volcano_02_01:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_01_desc:0 "Qazdarsos était autrefois un volcan actif mais ne l’est plus, désormais dormant mais non silencieux. Les cris de firewyrms et, selon certains, même de fantômes se font encore entendre depuis ses profondeurs. Certains ont osé s’y aventurer sans être assez nombreux et n’ont jamais été revus"

  building_valyria_dead_volcano_02_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_02_desc:0 "Les mines de Qazdarsos sont de nouveau pleinement opérationnelles, des esclaves extraient quotidiennement richesses et or pour leurs maîtres. Cependant, les récits de créatures surnaturelles et de malédictions persistent à propos de l’intérieur du volcan, vérités ou élucubrations d’esclaves reste à déterminer..."

  building_royal_barracks_of_valyria_01:0 "Caserne en ruines de Valyria"
  building_type_royal_barracks_of_valyria_01:0 "Caserne en ruines de Valyria"
  building_royal_barracks_of_valyria_01_desc:0 "Autrefois grande caserne du Freehold destinée à défendre la cité, elle est aujourd’hui réduite à un amas de décombres"
  building_type_royal_barracks_of_valyria_01_desc:0 "Autrefois grande caserne du Freehold destinée à défendre la cité, elle est aujourd’hui réduite à un amas de décombres"

  building_royal_barracks_of_valyria_02:0 "La Caserne Royale de Valyria"
  building_type_royal_barracks_of_valyria_02:0 "La Caserne Royale de Valyria"
  building_royal_barracks_of_valyria_02_desc:0 "La Caserne Royale de Valyria restaurée, rebâtie sur les anciennes ruines, voit désormais gardes et soldats aller et venir pour assurer la sécurité des voyageurs et des citoyens"

  building_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_type_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_great_arena_of_valyria_01_desc:0 "Autrefois une grande arène remplie de gladiateurs et de spectateurs, elle n’est plus aujourd’hui qu’un champ de ruines. Sa restauration sera coûteuse, mais pourrait ramener la joie au peuple"

  building_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_type_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_great_arena_of_valyria_02_desc:0 "Désormais reconstruite, la Grande Arène attire des milliers de spectateurs venus assister à des tournois et jeux de sang où professionnels et esclaves meurent dans le sable pour divertir le peuple"

  building_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_type_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_great_library_of_valyria_01_desc:0 "Les vestiges en ruine de la grande bibliothèque pourraient être restaurés pour accueillir de grandes œuvres d’art et de littérature"

  building_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_type_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_great_library_of_valyria_02_desc:0 "La Grande Bibliothèque de Valyria restaurée, emplie de grandes œuvres d’art, de littérature et de philosophie. Les érudits et les académiciens y étudient d’anciens textes et parchemins"

  building_valyria_veilspire_peak:0 "Pic de Veilspire"
  building_type_valyria_veilspire_peak:0 "Pic de Veilspire"
  building_valyria_veilspire_peak_desc:0 "Le Pic de Veilspire est le sommet le plus élevé de toute la péninsule valyrienne même avant la Ruine. Autrefois lieu de pèlerinage sacré réservé aux plus courageux et aux plus forts, ce grand sommet représente une épreuve divine. On dit que ceux qui parviennent à atteindre son sommet reviennent plus sages et plus érudits"

  building_velakar_resort_01:0 "Ancienne station en ruines"
  building_type_velakar_resort_01:0 "Ancienne station en ruines"
  building_velakar_resort_01_desc:0 "Autrefois un grand complexe de villégiature pour seigneurs dragons et marchands fortunés, cette station est aujourd’hui en ruines et guère plus qu’un tas de briques"

  building_velakar_resort_02:0 "La Station Illustre de Velakar"
  building_type_velakar_resort_02:0 "La Station Illustre de Velakar"
  building_velakar_resort_02_desc:0 "La Station Illustre de Velakar, désormais restaurée, accueille les gens de richesse et de prestige pour se baigner et se détendre dans ce majestueux complexe digne d’un empereur. Utilisant la chaleur volcanique pour réchauffer les bains, et servie par des milliers de domestiques, elle est véritablement un spectacle à contempler"

  building_aurions_lost_expidition:0 "Expédition perdue d’Aurion"
  building_type_aurions_lost_expidition:0 "Expédition perdue d’Aurion"
  building_aurions_lost_expidition_desc:0 "Voici l’expédition perdue de l’auto‑proclamé Empereur de Valyria Aurion Varezys. Cette plaine désolée est désormais le site funéraire de 30.000 hommes réduits à de simples amas de métal et d’os, souillée par les radiations et les gaz toxiques des geysers de soufre. C’est un paysage véritablement infernal"

  building_lokirian_barracks_01:0 "Vestiges d’une caserne"
  building_lokirian_barracks_01_desc:0 "Autrefois puissante caserne de Lokiria, elle n’est aujourd’hui plus qu’un tas de décombres"

  building_lokirian_barracks_02:0 "Puissante caserne de Lokiria"
  building_lokirian_barracks_02_desc:0 "La caserne de Lokiria, désormais reconstruite et renforcée de pierre de dragon et d’acier valyrien. Des soldats y marchent jour et nuit offrant un spectacle imposant et un cauchemar pour quiconque oserait assiéger"

  building_redwyrms_wrath_01:0 "Forteresse en Ruines"
  building_type_redwyrms_wrath_01:0 "Forteresse en Ruines"
  building_redwyrms_wrath_01_desc:0 "La Fureur de la Vouivre Rouge fut autrefois une forteresse redoutable, érigée en pierre de dragon, flanquée de hautes flèches et ornée des crânes des dragons abattus, sinistres trophées de ses conquêtes. Gouvernée par le Lord Protecteur Taurion de Lokiria, elle fut un bastion de guerre et de domination, ses bannières cramoisies inspirant la terreur à travers le pays. Aujourd’hui en ruines, la Fureur de la Vouivre Rouge n’est plus que l’ombre de sa gloire passée, ses murs brisés et ses étendards fanés ne subsistant que comme des reliques du règne violent de Lokiria"

  building_redwyrms_wrath_02:0 "La Fureur de la Vouivre Rouge"
  building_type_redwyrms_wrath_02:0 "Forteresse en Ruines"
  building_redwyrms_wrath_02_desc:0 "La Fureur de la Vouivre Rouge s’élève de nouveau, ses murs de pierre de dragon restaurés dans toute leur sombre splendeur, dominant une fois encore le paysage comme symbole de terreur et de puissance. À nouveau ornée de crânes de dragons et de bannières cramoisies arborant le blason du Dragon Rouge de Lokiria, la forteresse dégage une détermination obscure. Reconstruite à la fois comme monument de guerre et déclaration de suprématie, la Fureur de la Vouivre Rouge inspire autant la crainte que le respect, sa renaissance témoignant d’un legs impérissable de conquête"

  building_valyrian_gate_01:0 "Ruines de la Porte"
  building_type_valyrian_gate_01:0 "Ruines de la Porte"
  building_valyrian_gate_01_desc:0 "Ruines de la grande Porte de Valyria autrefois majestueuse, ancien symbole de richesse et de puissance, réduite aujourd’hui à un simple tas de pierres"

  building_valyrian_gate_02:0 "La Grande Porte de Valyria"
  building_type_valyrian_gate_02:0 "La Grande Porte de Valyria"
  building_valyrian_gate_02_desc:0 "La Grande Porte de Valyria, composée de sept portails et de sept herses, est forgée et renforcée en acier valyrien. Des milliers de marchands et de voyageurs traversent ces portes chaque jour. De gigantesques statues de héros d’antan veillent au sommet de l’entrée"

  building_great_harbor_of_valyria_01:0 "Baie pour un Port"
  building_type_great_harbor_of_valyria_01:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_01_desc:0 "Cette baie est vaste et profonde, suffisamment pour y établir un grand port. Pour l’instant, il n’y a pas grand-chose ici, à part des poissons"

  building_great_harbor_of_valyria_02:0 "Docks et Ateliers de Réparation"
  building_type_great_harbor_of_valyria_02:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_02_desc:0 "Afin de favoriser le commerce, la construction navale, et de poser les bases d’un riche carrefour maritime, nous devons bâtir un grand port. Pour l’instant, nous construirons de longs quais et des ateliers de réparation pour la production navale. Nous ajouterons aussi une cabane de quartier-maître pour le commerce, et un bureau d’inspection pour taxer et empêcher l’entrée de marchandises illicites dans notre cité"

  building_great_harbor_of_valyria_03:0 "Quais"
  building_type_great_harbor_of_valyria_03:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_03_desc:0 "Construire des quais et étendre l’infrastructure existante nous permettra d’accueillir plus de navires et d’augmenter les échanges entrants. Ces extensions serviront aussi à amarrer les navires militaires de notre flotte"

  building_great_harbor_of_valyria_04:0 "Grues et Dépôts de Construction Navale"
  building_type_great_harbor_of_valyria_04:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_04_desc:0 "En construisant de grandes grues, nous pourrons augmenter considérablement l’efficacité du port et permettre à davantage de navires d’accoster et de repartir. Nous érigerons aussi un dépôt de matériaux de construction navale près du port pour améliorer la production de nos navires de guerre. Avec ce Grand Port, nul ne pourra plus nous défier sur mer"

  building_great_temple_of_valyria_01:0 "Colline pour un Temple"
  building_type_great_temple_of_valyria_01:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux, nous aurons besoin d’un Grand Temple. Heureusement, une colline proche du Mont Tartarax pourrait être utilisée pour ériger un Temple Magnifique et Illustre dédié à nos Dieux-Dragons. Le fait qu’elle soit proche d’un volcan convient d’autant mieux à nos besoins"
  building_type_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux, nous aurons besoin d’un Grand Temple. Heureusement, une colline proche du Mont Tartarax pourrait être utilisée pour ériger un Temple Magnifique et Illustre dédié à nos Dieux-Dragons. Le fait qu’elle soit proche d’un volcan convient d’autant mieux à nos besoins"

  building_great_temple_of_valyria_02:0 "Salle de Prière et Lieu de Rassemblement"
  building_type_great_temple_of_valyria_02:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_02_desc:0 "Nous commencerons par une salle de prière richement décorée, remplie d’objets précieux : sculptures de dragons et de flammes, tapisseries draconiques, braseros, et les plus beaux marbres que nous puissions trouver. Nous créerons aussi une salle ouverte distincte pour les sacrifices humains"

  building_great_temple_of_valyria_03:0 "Arène de l’Incinération"
  building_type_great_temple_of_valyria_03:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_03_desc:0 "Les Valyriens ont toujours brûlé leurs morts. Incinérer les nôtres dans un Temple, à côté de notre volcan, est un moyen bien plus noble de rendre hommage à ceux qui nous quittent. Nous agrandirons la salle ouverte déjà construite à cet effet. Nous érigerons des colonnes sculptées, y planterons des fleurs exotiques, et remplacerons les bûchers de bois par un autel de pierre noire, dédié aux sacrifices humains et aux crémations funéraires"

  building_great_temple_of_valyria_04:0 "Statues de Dragons"
  building_type_great_temple_of_valyria_04:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_04_desc:0 "Aucun bâtiment de Valyria n’est véritablement achevé sans statues de dragons. Nous érigerons quatorze statues, une pour chaque Dieu. Chaque statue sera unique et majestueuse afin de rendre hommage dignement à nos Divinités"

  building_great_walls_of_valyria_01:0 "Vestiges Insignifiants du Mur"
  building_type_great_walls_of_valyria_01:0 "Les Grands Murs de Pierre Noire de Valyria"
  building_great_walls_of_valyria_01_desc:0 "C’est ici que se trouvent les vestiges des Grands Murs de Valyria. Il n’en reste presque rien, car les murs furent détruits lors du Fléau. Les rares portions qui ont survécu sont si endommagées qu’elles sont inutilisables. Bien sûr, nous pourrions restaurer ces murs dans toute leur splendeur d’antan, et nous devrions le faire. Inutile de dire que ce projet sera extrêmement coûteux"

  building_great_walls_of_valyria_02:0 "Les Grands Murs de Pierre Noire de Valyria"
  building_type_great_walls_of_valyria_02:0 "Les Grands Murs de Pierre Noire de Valyria"
  building_great_walls_of_valyria_02_desc:0 "Les murs de Valyria ont été entièrement restaurés, imposants et immenses, encerclant toute la cité. Ces fortifications colossales sont si larges que douze chars peuvent y courir de front (à bon entendeur, Volantis !). Des tours de guet et des douves longent désormais le périmètre, offrant des couches supplémentaires de défense. Les entrées sont renforcées de herses et de zones de tir, rendant toute tentative d’invasion presque impossible pour un ennemi"

  building_great_dragonkeep_of_valyria_01:0 "Emplacement pour le Palais"
  building_type_great_dragonkeep_of_valyria_01:0 "La Grande Forteresse Draconique de Valyria"
  building_great_dragonkeep_of_valyria_01_desc:0 "Nous avons trouvé un site prometteur pour édifier un grand palais. Un jour, il deviendra un lieu de splendeur. Pour l'heure, il n'y a ici rien de notable"

  building_great_dragonkeep_of_valyria_02:0 "Pose des Fondations"
  building_type_great_dragonkeep_of_valyria_02:0 "La Grande Forteresse Draconique de Valyria"
  building_great_dragonkeep_of_valyria_02_desc:0 "Pour abriter les souverains de cette grande cité, il nous faudra un palais imposant. Non, le plus grand palais que le monde ait jamais connu. Cela nécessitera bien sûr quantité d’esclaves et d’or, mais ces ressources peuvent être acquises. Ce palais sera un témoignage de la grandeur valyrienne. Nous commencerons par un donjon, que nous agrandirons ensuite"

  building_great_dragonkeep_of_valyria_03:0 "Murailles Extérieures"
  building_type_great_dragonkeep_of_valyria_03:0 "La Grande Forteresse Draconique de Valyria"
  building_great_dragonkeep_of_valyria_03_desc:0 "Afin de rendre cette forteresse imprenable, nous bâtirons nos murs exclusivement en pierre noire. Ces murs hauts et épais repousseront tous les ennemis et indésirables. Construire de telles fortifications en pure pierre noire aura bien sûr un coût très élevé"

  building_great_dragonkeep_of_valyria_04:0 "Murs Intérieurs et Décoration"
  building_type_great_dragonkeep_of_valyria_04:0 "La Grande Forteresse Draconique de Valyria"
  building_great_dragonkeep_of_valyria_04_desc:0 "Maintenant que les murs extérieurs sont achevés, il nous faut ériger des murs intérieurs pour renforcer la sécurité et améliorer l'efficacité de nos fortifications. Portes, herses et créneaux seront construits. De plus, nous décorerons la grande forteresse de soies, tapisseries, trophées et bien d'autres choses pour exposer notre splendeur"

  building_procrazion_01:0 "Grand Château Abandonné"
  building_type_procrazion_01:0 "Procrazion"
  building_procrazion_01_desc:0 "Procrazion fut autrefois un bastion du pouvoir valyrien, perché au sommet de la montagne centrale au cœur de la cité. Avant le Fléau, ce grand château servait de centre militaire et politique, assurant la défense de toute la région. Bien qu'une grande partie de sa structure soit encore debout, le temps n’a pas été clément avec ses salles autrefois glorieuses. Les ponts de pierre qui le reliaient à la cité environnante sont aujourd’hui détruits, et l’intérieur montre les signes évidents de la décrépitude. Les hautes Tours Draconiques sont toujours là, mais leurs chambres sont vides, et la forge autrefois active est désormais silencieuse. Pourtant, sa position élevée et ses points d’accès limités lui confèrent encore un avantage stratégique. Imposant, malgré tout, Procrazion n’est plus qu’une ombre de ce qu’il fut, attendant d’être restauré"

  building_procrazion_02:0 "Procrazion"
  building_type_procrazion_02:0 "Procrazion"
  building_procrazion_02_desc:0 "Procrazion a retrouvé sa gloire d’antan, dressé fièrement au sommet de la montagne au cœur de la cité. Ce grand château est de nouveau relié à la ville par des ponts reconstruits, permettant l’accès sans dragons. Les Tours Draconiques ont aussi été restaurées, permettant à nouveau l’envol et l’atterrissage des créatures majestueuses, tandis que les dômes brillent comme avant le Fléau. L’intérieur est doté de tout le confort attendu d’un seigneur, même en temps de siège. La forge unique, située sur un versant de la montagne, a été ranimée, canalisant de nouveau la lave pour forger des armes puissantes. Sa position élevée, sa restauration complète et ses points d’entrée limités assurent à Procrazion une quasi-impregnabilité. Il est désormais à la fois bastion défensif et symbole du renouveau de la cité"

  building_eternal_flame_temple_01:0 "Temple Abandonné"
  building_type_eternal_flame_temple_01:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_01_desc:0 "Le Temple de la Flamme Éternelle était autrefois le lien entre les Dieux Anciens de Valyria et les guerriers valyriens. En plus d’être le centre religieux du peuple, il s’élevait autrefois comme un symbole de puissance religieuse valyrienne ; aujourd’hui, il gît dans la poussière, abandonné. Il ne subsiste plus que comme un vague souvenir d’un Haut Temple jadis vénéré au sein de la cosmogonie valyrienne"

  building_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_type_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_02_desc:0 "Le Temple de la Flamme Éternelle a été restauré et s’élève désormais comme un symbole de puissance, de foi et de gloire. Ses murs rénovés racontent les histoires des anciens dieux et sont emplis de légendes autrefois connues seulement des anciens valyriens. Le peuple peut à présent profiter du luxe et rêver à ce que furent les dragons et la magie avant le Fléau. Les guerriers viennent y prier pour recevoir la rage et la puissance des dragons d’autrefois. Le temple brille comme un phare de foi religieuse, d’espoir, et de grandeur valyrienne, ancienne comme nouvelle"

  building_red_guard_barracks_01:0 "Caserne Abandonnée"
  building_type_red_guard_barracks_01:0 "La Caserne de la Garde Rouge"
  building_red_guard_barracks_01_desc:0 "Autrefois quartier général de la fière Garde Rouge, l’élite défensive de la cité, cette caserne repose désormais abandonnée contre les antiques murailles de la ville. Le temps a tout ravagé, ses créneaux brisés et sa structure rouillée témoignent de l’abandon consécutif au Fléau. À l’arrière, deux Tours Draconiques ne sont plus que les vestiges d’une puissance militaire révolue. Les chambres n’abritent plus que des fantômes du passé et d’une force oubliée. Malgré la décrépitude, ces casernes aspirent à être restaurées pour redevenir le bouclier redoutable de la cité"

  building_red_guard_barracks_02:0 "La Caserne de la Garde Rouge"
  building_type_red_guard_barracks_02:0 "La Caserne de la Garde Rouge"
  building_red_guard_barracks_02_desc:0 "Entièrement restaurée, presque à la hauteur de sa puissance valyrienne d’antan, la Caserne de la Garde Rouge est redevenue le foyer des défenseurs de la cité, adossée aux glorieuses murailles. Sa structure de pierre évoque sa grandeur passée, renforcée, majestueuse, empreinte d’histoire et de cicatrices. Les Tours Draconiques vibrent à nouveau de vie, rappelant l’époque où les dragons rugissaient dans les cieux. Les fantômes ont cédé leur place aux membres fraîchement restaurés de la Garde Rouge, nourris de discipline, d’excellence et de gloire sans égale. Alliant architecture ancienne et technologie moderne, l’édifice protège de nouveau la cité et tous ceux qui s’y trouvent"

  building_red_guard_training_compound_01:0 "Complexe d’Entraînement Abandonné"
  building_type_red_guard_training_compound_01:0 "Le Complexe d’Entraînement de la Garde Rouge"
  building_red_guard_training_compound_01_desc:0 "Des murs délabrés ne peuvent plus conter les histoires des Gardes Rouges autrefois entraînés ici. Ce complexe d’entraînement était jadis un lieu respecté et admiré, empli de dragons, de guerriers et de chefs. Aujourd’hui, il gît à l’abandon, incapable de restituer l’énergie et la gloire oubliées. Armes, donjons et équipements rouillés subsistent encore, mais on ne peut que se demander à quoi il ressemblait dans sa splendeur passée"

  building_red_guard_training_compound_02:0 "Le Complexe d’Entraînement de la Garde Rouge"
  building_red_guard_training_compound_02_desc:0 "Force, honneur et puissance s’imposent désormais dans le Complexe d’Entraînement restauré de la Garde Rouge. Rempli d’hommes aspirant à l’excellence pour rejoindre l’élite, le complexe accueille stratèges, chefs et guerriers, tous résolus à devenir les meilleurs. De majestueuses colonnes l’entourent avec grâce, et un toit élevé aux vitraux rouges indique que seul le ciel est la limite. Ce bâtiment forme désormais les plus grands guerriers et les plus nobles des meneurs"

  building_type_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01_desc:0 "Zanpur est le volcan jumeau occidental des îles Marahai"

  building_type_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01_desc:0 "Yovesh est le volcan jumeau oriental des îles Marahai"

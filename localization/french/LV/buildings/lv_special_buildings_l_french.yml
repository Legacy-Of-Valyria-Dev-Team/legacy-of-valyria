l_french:
  # Braavos
  building_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_type_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_agot_EE_titan_of_braavos_desc:0 "Inclus par le célèbre scribe ouestrien Lomas Granpas parmi les Merveilles Façonnées par l'Homme, le Titan de Braavos se dresse comme la première ligne de défense de la Cité Libre de Braavos, gardant l'étroite entrée de la lagune où réside la cité. C'est une statue colossale de granit et de bronze en forme de guerrier, servant à la fois de forteresse et de phare. Les meurtrières sous la jupe blindée de la statue et les archères sur toute sa cuirasse offrent une défense quasi impénétrable contre les navires ennemis pénétrant dans la lagune."

  building_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_type_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_agot_EE_sealords_palace_desc:0 "Le Palais du Seigneur de la Mer est la demeure du Seigneur de la Mer de Braavos. Sous les dômes et les tours du vaste palais, on peut trouver une ménagerie exotique d'oiseaux et de bêtes venus du monde entier."

  # Volantis
  building_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_type_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_agot_EE_black_walls_of_old_volantis_desc:0 "Le cœur de Volantis. Bâti par les anciens [valyrian_freehold|E], ce mur géant de pierre noire fusionnée protège une série de palais, de cours, de tours et de temples. Seuls ceux dont le sang remonte à l'ascendance valyrienne, le Sang Ancien, sont autorisés à y demeurer."
  building_agot_EE_volantis_harbor:0 "Port de Volantis"
  building_type_agot_EE_volantis_harbor:0 "Port de Volantis"
  building_agot_EE_volantis_harbor_desc:0 "La puissance de Volantis provient en partie de son vaste port, notamment grâce à sa position géographique favorable. Ce vaste emplacement en forme de croissant est construit directement à l'embouchure de la Rhoyne et on dit qu'il pourrait contenir l'intégralité de Braavos en son sein."

  building_agot_EE_the_long_bridge:0 "Le Long Pont"
  building_type_agot_EE_the_long_bridge:0 "Le Long Pont"
  building_agot_EE_the_long_bridge_desc:0 "Le Long Pont relie les deux moitiés de Volantis et est le pont le plus long du monde connu. Construit par l'Ancienne Valyria à son apogée en pierre fusionnée, on dit qu'il peut supporter le poids de mille éléphants."

  building_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_type_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_agot_EE_temple_of_the_lord_of_light_desc:0 "Cet énorme temple s'élève bien au-dessus de tout autre bâtiment de la cité. Ses couleurs éblouissantes dorées, rouges et orangées en font un spectacle véritablement saisissant. Protégé par la Main Ardente, ce temple sert R'hllor, le Maître de la Lumière et pourrait être l'un des plus grands témoignages de sa puissance en existence."

  building_agot_EE_volantis_walls:0 "Les Murs de Volantis"
  building_type_agot_EE_volantis_walls:0 "Les Murs de Volantis"
  building_agot_EE_volantis_walls_desc:0 "Bien que moins impressionnants que ceux de la Vieille Volantis, les murs de Volantis feront réfléchir à deux fois tout attaquant avant de prendre d'assaut la cité."

  # Rhoyne
  building_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
  building_agot_EE_nymeria_palace_01_desc:0 "Au cœur de Ny Sar gisent les ruines du Palais de Nymeria, abandonné depuis que les [valyrian_freehold|E] ont vaincu le Prince Garin lors de la Seconde Guerre des Épices. Ses murs de marbre rose et vert, ses dômes imposants et ses grandes flèches ne sont plus qu'une coquille hantée de leur splendeur passée. Toute vie a quitté ce lieu quand Nymeria s'est enfuie vers Dorne, laissant ces salles jadis orgueilleuses à la décrépitude."

  building_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
  building_agot_EE_nymeria_palace_02_desc:0 "Se dressant à nouveau fièrement au cœur de Ny Sar, le Palais de Nymeria a été méticuleusement restauré, témoignage de la résilience et de l'héritage rhoynars. Le marbre vert et rose vibrant scintille sous le soleil, tandis que les grands dômes et les flèches élancées dominent désormais l'horizon, effaçant presque les souvenirs de son passé tragique."

  building_agot_EE_palace_of_love_01:0 "Palais des Chagrins"
  building_type_agot_EE_palace_of_love_01:0 "Palais des Chagrins"
  building_agot_EE_palace_of_love_01_desc:0 "Le Palais des Chagrins se dresse comme un rappel sombre du sort qui s'abattit sur Chroyane, la Cité des Festivals. Ses tours en ruine, couvertes de mousse et de vignes sombres, ne révèlent rien de la beauté que le Palais de l'Amour incarnait autrefois. Des statues englouties et les hommes de pierre hantent désormais ses salles brumeuses et ruinées."

  building_agot_EE_palace_of_love_02:0 "Palais de l'Amour"
  building_type_agot_EE_palace_of_love_02:0 "Palais de l'Amour"
  building_agot_EE_palace_of_love_02_desc:0 "Le Palais de l'Amour orne à nouveau les rives de la Rhoyne, une renaissance époustouflante de l'ancienne gloire de Chroyane. Ses tours s'élèvent haut, ornées de mosaïques vibrantes et de sculptures délicates qui célèbrent la vie, la beauté et l'amour. La lumière du soleil brille sur les fontaines étincelantes qui alimentent les jardins luxuriants, répandant des fleurs sur chaque terrasse. Sous ses grands dômes, les mariages sont à nouveau bénis, emplissant Chroyane de la promesse de nouveaux commencements."

  building_agot_EE_bridge_of_dream_01:0 "Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_01:0 "Pont des Rêves"
  building_agot_EE_bridge_of_dream_01_desc:0 "Rivalisant autrefois avec le Long Pont de Volantis, le Pont des Rêves surplombe maintenant la Rhoyne dans un épais brouillard. Ses arches de pierre s'élevaient à quarante pieds au-dessus de la rivière, mais se sont effondrées sous la mousse dense et les vignes noires. Désormais lieu de prédilection des hommes de pierre, il se dresse comme un monument silencieux et pourrissant à la fierté perdue des Rhoynars."

  building_agot_EE_bridge_of_dream_02:0 "Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_02:0 "Pont des Rêves"
  building_agot_EE_bridge_of_dream_02_desc:0 "Le Pont des Rêves enjambe à nouveau la Rhoyne dans toute sa gloire. S'élevant à quarante pieds au-dessus de la rivière, ses arches de pierre pâle se dressent, fortes et défiantes. Des jardins luxuriants bordent la travée en bois du pont, fleurissant de fleurs de toutes les couleurs. Ce grand pont, autrefois perdu dans le temps et les ruines, est rené. Un symbole de la fierté et de la résilience rhoynares au-dessus des eaux courantes de la Rhoyne une fois de plus !"

  # Meereen
  building_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_type_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_agot_EE_great_pyramid_of_meereen_desc:0 "De loin le plus grand bâtiment de la cité, la Grande Pyramide de Meereen fut construite par une petite armée d'esclaves, dont un millier périrent durant sa construction. La pyramide sert de centre administratif de Meereen et les dirigeants de la cité ont utilisé la grande Salle pour recevoir leurs sujets pendant des siècles."

  # Asshai
  building_stygai_01:0 "Cité Hantée de Stygai"
  building_type_stygai_01:0 "Stygai"
  building_stygai_01_desc:0 "Stygai, la cité énigmatique et antique voilée dans le cœur sombre des Contrées de l'Ombre, demeure l'un des mystères les plus terrifiants du monde. Incroyablement ancienne et enveloppée dans des ténèbres éternelles, la cité se dresse comme un monument à une ère oubliée. Même les plus audacieux conjurateurs de l'ombre n'osent s'aventurer dans ses rues maudites. Les flèches imposantes et les ruelles labyrinthiques seraient parcourues par des démons et des créatures semblables. Voilée de secret, ses véritables origines et l'étendue de ses pouvoirs sombres demeurent inconnus."

  # Gogossos
  building_red_citadel_01:0 "La Tour Rouge"
  building_type_red_citadel_01:0 "La Tour Rouge"
  building_red_citadel_01_desc:0 "Une grande tour côtière, que l'on croit être le dernier vestige d'une forteresse autrefois puissante, sert maintenant de bastion principal de la cité. Bien qu'une grande partie de la structure originale ait été perdue dans le temps, ce bastion solitaire perdure — petit mais incroyablement robuste et hautement défendable. Des murs épais de pierre patinée tiennent fermement contre les éléments et les sièges potentiels, en faisant un siège d'autorité fiable au sein de Gogossos. Bien qu'elle ne soit pas encore une grande citadelle, elle reste un donjon formidable, une fondation sur laquelle de plus grandes fortifications pourraient un jour s'élever."

  building_red_citadel_02:0 "La Redoute Rouge"
  building_type_red_citadel_02:0 "La Redoute Rouge"
  building_red_citadel_02_desc:0 "Désormais renforcée d'une solide palissade de bois et de tours de guet sur les anciens Vestiges Cramoisis, cette redoute s'est transformée en une forteresse plus redoutable, capable de résister aux menaces prolongées. Plus seulement une tour côtière solitaire, les défenses étendues lui permettent maintenant d'accueillir une garnison décente, offrant un point d'appui solide au sein de Gogossos. Avec d'amples provisions et des positions renforcées, elle pourrait même soutenir une armée pendant des mois si nécessaire, marquant sa transformation d'une simple relique du passé en un véritable bastion de pouvoir au sein de la cité."

  building_red_citadel_03:0 "La Citadelle Rouge"
  building_type_red_citadel_03:0 "La Citadelle Rouge"
  building_red_citadel_03_desc:0 "Autrefois simple vestige du passé, la Citadelle Rouge a été reconstruite en une forteresse vaste et inflexible, dominant Gogossos comme le siège ultime du pouvoir de la cité. Ce n'est plus seulement une tour solitaire, elle se dresse maintenant comme un donjon et une forteresse entièrement restaurés, ses murs colossaux de Pierre Noire Valyrienne s'élevant hauts et épais, un monument à la domination et à l'effroi.\n\nComme la Porte Cramoisie, les murs de la Citadelle Rouge furent autrefois imprégnés de rituels de magie du sang accomplis par les anciens Valyriens, leur sorcellerie tachant à jamais la pierre d'un cramoisi profond et surnaturel. Bien que les rituels se soient depuis longtemps estompés dans l'histoire, leur sombre héritage perdure, faisant de la citadelle non seulement une forteresse quasi impénétrable, mais aussi un symbole obsédant de pouvoir absolu.\n\nEn son cœur, La Tour Rouge perce le ciel, sa présence projetant une longue ombre sur la cité, rappel constant de l'autorité de l'archonte. Les murs inférieurs et la cour restent glissants de sang, non seulement des rituels du passé mais des innombrables exécutions, trahisons et conflits brutaux qui se sont joués sur ses pierres. Le sang des rebelles, des conspirateurs et des ennemis de l'État s'est infiltré dans ses fondations, assurant que la peur est tissée dans le tissu même de la forteresse.\n\nOn murmure qu'entre ces murs, la Mort Rouge prit racine pour la première fois, une malédiction qui ravagea autrefois Gogossos, laissant des quartiers entiers se noyer dans le sang et la souffrance. Bien que la maladie se soit depuis longtemps estompée dans l'histoire, certains disent que la citadelle se souvient encore, que les fantômes des mourants persistent dans ses chambres les plus profondes, murmurant à ceux qui écoutent.\n\nLieu de règne de fer et de légende, la Citadelle Rouge est plus qu'une simple forteresse — c'est le cœur inflexible de Gogossos, un lieu où le pouvoir est absolu, la pitié est rare et la rébellion est écrasée avant qu'elle ne puisse commencer."

  building_pit_of_sorrows_01:0 "Donjon Envahi et Ruines"
  building_type_pit_of_sorrows_01:0 "Donjon Envahi et Ruines"
  building_pit_of_sorrows_01_desc:0 "Un donjon en ruine, ses murs autrefois puissants maintenant drapés de vignes rampantes et engloutis par l'étreinte implacable de la nature, se dresse dans un silence étrange. Des arbres ont pris racine dans ses cours, leurs branches tordues griffant le ciel, comme témoignant d'horreurs oubliées.\n\nMalgré la décrépitude, le donjon reste étrangement défendable — ses tours, bien que patinées, dominent toujours avec une présence imposante. Sa porte, à moitié enfouie dans la mousse et les décombres, suggère une forteresse qui refuse de céder entièrement au temps.\n\nPourtant, quelque chose semble profondément dérangé dans ce lieu. L'air est épais d'une immobilité surnaturelle, le genre qui fait frissonner la peau et met l'esprit mal à l'aise. Les ombres persistent là où elles ne devraient pas, et des murmures — trop faibles pour être le vent — semblent dériver à travers les ruines, suggérant des secrets qu'il vaut mieux laisser intacts."

  building_pit_of_sorrows_02:0 "Donjon et Excavations du Puits"
  building_type_pit_of_sorrows_02:0 "Donjon et Excavations du Puits"
  building_pit_of_sorrows_02_desc:0 "Alors que nous étendions nos efforts et dégagions l'enchevêtrement épais de végétation, nous avons fait une découverte saisissante — le sol sous nous semblait descendre sans fin, peu importe la quantité de boue et de débris que nous retirions. Ce qui semblait d'abord n'être qu'une prolifération dissimulant les ruines s'est bientôt révélé être une descente vaste et stratifiée, chaque niveau inférieur exposant des vestiges du passé.\n\nParmi les pierres en ruine et la terre humide, nous avons déterré d'innombrables os — leurs origines inconnues, leurs histoires perdues depuis longtemps dans le temps. À chaque pas vers le bas, une certitude grandissante s'est installée : ceci pourrait bien être le légendaire Puits des Chagrins, un lieu murmuré dans les légendes effrayantes, ses profondeurs intactes et ses mystères attendant encore d'être dévoilés."

  building_pit_of_sorrows_03:0 "Le Puits des Chagrins"
  building_type_pit_of_sorrows_03:0 "Le Puits des Chagrins"
  building_pit_of_sorrows_03_desc:0 "L'ancien Puits des Chagrins, autrefois une ruine en décomposition, a été minutieusement reconstruit et restauré dans sa grandeur sinistre d'antan. Pourtant, malgré tous les efforts pour récupérer ses niveaux supérieurs, les véritables profondeurs restent un abîme insondable. Les ténèbres inférieures s'étendent sans fin, avalant la lumière et le son, une gueule béante vers l'inconnu. Beaucoup ont osé descendre à la recherche de secrets perdus dans le temps, mais aucun n'est jamais revenu pour parler de ce qui se trouve au fond — si, en effet, un fond existe."

  building_the_toad:0 "Le Crapaud Noir"
  building_type_the_toad:0 "le Crapaud Noir"
  building_the_toad_desc:0 "La plus grande statue jamais construite sur l'Île des Crapauds domine le paysage, une relique monolithique d'une civilisation depuis longtemps disparue. Sculptée dans une pierre noire inconnue et huileuse qui semble briller même en l'absence de lumière, elle prend la forme d'un grand crapaud — trapu, grotesque et étrangement réaliste. Personne ne sait qui l'a construite, ni dans quel but, et quelle que soit la signification qu'elle avait autrefois, elle s'est depuis longtemps perdue dans le temps. Pour la plupart, ce n'est rien de plus qu'une effigie grossière et sinistre, une curiosité bizarre dans une terre déjà imprégnée de mystère. Pourtant, il y a des murmures — prononcés à voix basse par les habitants — de rêves étranges qui viennent à ceux qui dorment trop près, d'une chaleur troublante dans la pierre quand on la touche, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose regardait de l'intérieur."
  building_type_the_toad_desc:0 "La plus grande statue jamais construite sur l'Île des Crapauds domine le paysage, une relique monolithique d'une civilisation depuis longtemps disparue. Sculptée dans une pierre noire inconnue et huileuse qui semble briller même en l'absence de lumière, elle prend la forme d'un grand crapaud — trapu, grotesque et étrangement réaliste. Personne ne sait qui l'a construite, ni dans quel but, et quelle que soit la signification qu'elle avait autrefois, elle s'est depuis longtemps perdue dans le temps. Pour la plupart, ce n'est rien de plus qu'une effigie grossière et sinistre, une curiosité bizarre dans une terre déjà imprégnée de mystère. Pourtant, il y a des murmures — prononcés à voix basse par les habitants — de rêves étranges qui viennent à ceux qui dorment trop près, d'une chaleur troublante dans la pierre quand on la touche, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose regardait de l'intérieur."

  building_ax_hold:0 "Le Fort de la Hache"
  building_type_ax_hold:0 "Le Fort de la Hache"
  building_ax_hold_desc:0 "La forteresse de la maison Xhore se dresse à la fois comme sanctuaire et forteresse, un bastion de pierre et d'acier construit pour endurer les tempêtes des Îles du Basilic. Nichée au sommet de falaises déchiquetées et entourée d'eaux traîtresses, elle fut conçue non seulement comme une demeure, mais comme une forteresse inflexible d'où les pirates qarthiens des Îles Occidentales pouvaient lancer leurs raids infâmes. Ses murs, patinés mais redoutables, portent les cicatrices d'innombrables batailles, tandis que ses tours de guet imposantes offrent une vue ininterrompue sur la mer environnante, toujours vigilantes pour les proies et les poursuivants."

  building_garden_of_malice_01:0 "Un Grand Fort Envahi"
  building_type_garden_of_malice_01:0 "Un Grand Fort Envahi"
  building_garden_of_malice_01_desc:0 "Un vaste mur d'enceinte envahi encercle les ruines, ses pierres anciennes à peine visibles sous les couches de vignes rampantes et de mousse épaisse. En son cœur se dresse un donjon en ruine, ses tours brisées et à moitié englouties par l'étreinte implacable de la nature. Le temps a effacé toute l'histoire que ce lieu détenait autrefois, ne laissant qu'un silence étrange et étouffant dans son sillage.\n\nPourtant, ceux qui osent franchir les portes brisées réalisent rapidement pourquoi personne n'a réclamé ces ruines — ce lieu est un piège mortel. Des haies tordues, devenues sauvages et surnaturelles, forment un labyrinthe complexe, leurs chemins changeant et se fermant comme des choses vivantes, menant les imprudents plus profondément dans la confusion. Parmi la verdure enchevêtrée se cachent des plantes aux couleurs impossibles et aux formes surnaturelles, leur beauté masquant une intention mortelle. Certaines libèrent des spores qui étouffent les poumons, d'autres sécrètent des toxines qui font des cloques sur la peau, et quelques-unes bougent avec un but troublant, attendant que la proie s'approche trop près.\n\nLes légendes murmurent que quelque chose — peut-être les vestiges d'une sorcellerie oubliée, ou la présence persistante de toute force qui régnait autrefois ici — maintient la flore prospère d'une manière qui défie la nature. Les ruines restent intactes, non pas parce qu'elles sont oubliées, mais parce qu'elles sont craintes. Même les pillards et les chasseurs de trésors les plus audacieux savent qu'il vaut mieux ne pas tenter la colère d'un endroit où les plantes elles-mêmes semblent avoir soif de sang."

  building_garden_of_malice_02:0 "Le Jardin de Malice"
  building_type_garden_of_malice_02:0 "Le Jardin de Malice"
  building_garden_of_malice_02_desc:0 "Le Jardin de Malice est une forteresse de mort stratifiée, construite en pierre noire huilée et entourée de défenses mortelles. Un vaste labyrinthe changeant de vignes épineuses, de fleurs toxiques et de haies tordues l'entoure, où la lumière pénètre à peine et où des prédateurs invisibles se cachent. Au-delà du labyrinthe se trouve un fossé noir rempli d'horreurs et des murs imposants gardés par des sentinelles silencieuses. En son cœur se dresse un donjon valyrien, intact par le temps, couronné par un arbre pétrifié dont les racines semblent se nourrir de la forteresse elle-même. Plus qu'une forteresse, le Jardin est un lieu où la terre elle-même cherche à détruire les intrus."

  building_sapphire_quarter:0 "Le Quartier Saphir"
  building_type_sapphire_quarter:0 "Le Quartier Saphir"
  building_sapphire_quarter_desc:0 "Le Quartier Saphir est un vaste district fortifié perché au sommet de la plus haute colline de Gogossos. Autrefois domaine des Seigneurs Dragons d'antan, il sert maintenant d'enclave exclusive aux plus illustres maîtres esclavagistes et princes marchands de la cité. Seule l'élite peut résider dans ses murs, car ici, seuls se dressent de grands manoirs et palais — construits en marbre scintillant et ornés d'or. Ses marchés privés sont drapés des soies les plus fines, réservés à ceux qui peuvent se permettre des luxes hors de portée des hommes moindres."

  building_crimson_gate:0 "La Porte Cramoisie"
  building_type_crimson_gate:0 "La Porte Cramoisie"
  building_crimson_gate_desc:0 "La Porte Cramoisie est la seule entrée terrestre de Gogossos, un bastion imposant de Pierre Noire Valyrienne qui domine le pont traître menant à la cité. Sa surface absorbe la lumière, imprégnée de sorcellerie sombre et tachée de cramoisi par d'anciens rituels de sang. S'élevant à 140 pieds de haut, la porte rayonne de crainte et d'effroi, ses murs couronnés de statues de dragons dont les yeux de pierres précieuses semblent presque vivants. Plus qu'une barrière, la Porte Cramoisie est un monument à la puissance oubliée de Gogossos et à l'héritage sombre de Valyria."

  building_glittering_pits_01:0 "Les Fosses Scintillantes"
  building_type_glittering_pits_01:0 "Les Fosses Scintillantes"
  building_glittering_pits_01_desc:0 "Les jungles de Gogossos et la tristement célèbre Île des Larmes sont une nature sauvage vaste et indomptée — une terre grouillant à la fois de périls et de richesses inimaginables. Un véritable trésor de ressources naturelles, le feuillage dense et ombragé dissimule des merveilles au-delà de toute mesure pour ceux assez audacieux pour braver ses dangers.\n\nParmi les plus convoités de ses trésors se trouvent les diamants et les saphirs, scintillant au plus profond de la terre comme l'essence emprisonnée des étoiles. Ces pierres précieuses, rares et d'une qualité sans égale, ont fait de la région une légende murmurée parmi les commerçants et les chercheurs de fortune. Bien que les mines ici restent petites mais puissantes, leurs rendements sont étonnants, chaque excavation déterrant des pierres d'un éclat époustouflant."

  building_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_type_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_glittering_pits_02_desc:0 "À mesure que les mines grandissent, elles s'étendent en un réseau tentaculaire de tunnels souterrains, tissant à travers le sol de la jungle comme les racines des arbres anciens au-dessus. Les murs scintillent de pierres précieuses, leurs couleurs se reflétant dans la faible lumière des torches, et des chambres cachées sont découvertes, révélant de riches veines attendant d'être récoltées. Cependant, à mesure que les mineurs creusent plus profondément, la jungle commence à riposter — les racines éclatent à travers les murs, des spores toxiques persistent dans l'air, et d'étranges créatures invisibles s'agitent dans l'obscurité."

  building_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_type_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_glittering_pits_03_desc:0 "Les Profondeurs Étoilées constituent la partie la plus riche et la plus dangereuse des mines de Gogossos — un vaste labyrinthe de tunnels et de cavernes scintillantes où des saphirs sans défaut et des diamants massifs captent même la plus faible lumière, ressemblant à un ciel étoilé souterrain. Les mineurs travaillent sans relâche pour extraire ces trésors, bien que plus ils descendent profondément, plus cela devient périlleux. Dans les chambres les plus basses, d'étranges tremblements, une chaleur oppressante et des observations murmurées de choses surnaturelles ont rendu certaines zones interdites. C'est un lieu de grande richesse et de plus grand risque — où creuser trop profondément pourrait réveiller quelque chose qu'il vaut mieux laisser enterré."

  building_darkreach_quay_01:0 "Quai de Sombrivage"
  building_type_darkreach_quay_01:0 "Quai de Sombrivage"
  building_darkreach_quay_01_desc:0 "Le Quai de Sombrivage est le cœur humble mais vital du commerce de Gogossos, la première étape de l'infrastructure portuaire grandiose de la cité. Un modeste port de pierre et de bois, il s'étend dans les eaux sombres de la baie, ses quais patinés grinçant sous le poids des navires qui arrivent. Bien que petit, il est stratégiquement positionné pour servir de point d'entrée principal pour les marchands, les contrebandiers et les aventuriers cherchant fortune à Gogossos."

  building_darkreach_quay_02:0 "Port de Sombrivage"
  building_type_darkreach_quay_02:0 "Port de Sombrivage"
  building_darkreach_quay_02_desc:0 "Avec l'expansion de l'empire commercial de Gogossos, le Port de Sombrivage s'est développé en un centre commercial animé, bien au-delà de ses humbles débuts. Les quais ont été renforcés de pierre et de bois robuste, permettant aux plus grands navires marchands d'ancrer et de décharger leur cargaison exotique en toute sécurité. De nouvelles jetées s'étendent plus loin dans les eaux sombres, accueillant un flux croissant de navires venus de terres lointaines, attirés par les richesses des saphirs, des diamants et des biens rares de la jungle de Gogossos."

  building_darkreach_quay_03:0 "Le Port de Marée Noire"
  building_type_darkreach_quay_03:0 "Le Port de Marée Noire"
  building_darkreach_quay_03_desc:0 "Avec la renaissance de Gogossos, son port commercial autrefois humble a évolué en Port de Marée Noire, une forteresse colossale de commerce et de puissance navale. N'étant plus seulement un point de passage pour les commerçants, il est devenu un épicentre florissant du commerce international, attirant des marchands, des mercenaires et des chercheurs de fortune du monde connu.\n\nLe port est maintenant fortifié avec de l'ancienne Pierre Noire Valyrienne, ses murs puissants encerclant les quais animés, offrant une défense inégalée contre les raids et les sièges. Ces remparts imposants, reforgés à partir des ruines du passé, se dressent comme un témoignage de la résurgence de la cité, assurant que la richesse et l'influence de Gogossos restent intouchables."

  building_last_dragon_tower_01:0 "La Dernière Tour Draconique"
  building_type_last_dragon_tower_01:0 "La Dernière Tour Draconique"
  building_last_dragon_tower_01_desc:0 "La dernière Tour Draconique survivante hors de Valyria, construite dans les derniers jours avant le Fléau, se dresse comme un monument à la fois au pouvoir et à la tragédie. Construite à l'origine pour abriter la famille du Seigneur Dragon régnant de Gogossos, ses salles devaient être un symbole de leur règne éternel — mais le destin en a décidé autrement. Quand la famille a péri dans l'anéantissement de Valyria, la tour est devenue une relique silencieuse d'un empire perdu, sa présence projetant une longue ombre sur la cité.\n\nMaintenant, elle sert un nouveau maître — l'Archonte de Gogossos et sa famille, qui règnent depuis ses hauteurs élevées. N'étant plus seulement un symbole de grandeur valyrienne, la Tour Draconique est un rappel aux classes inférieures, aux esclaves et aux rebelles potentiels de la hiérarchie brutale de la cité. Elle se dresse comme un témoignage inébranlable de domination, un avertissement omniprésent que l'élite de Gogossos écrasera tous ceux qui osent s'élever contre eux."

  # Valyria
building_type_valyria_volcano:0 "L'une des Quatorze Flammes"
  building_valyria_volcano_01:0 "Mont Gaelithox"
  building_type_valyria_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_01_desc:0 "Gaelithox compte parmi les volcans les plus redoutables des légendaires Quatorze Flammes de [valyria|E]. Dominant le paysage environnant de sa masse imposante, son sommet demeure perpétuellement voilé d'un épais manteau de fumée et de cendres. Les flancs du volcan portent les cicatrices d'anciennes coulées de lave, désormais solidifiées en formations rocheuses noires et déchiquetées, vestiges silencieux [doom|E] qui emporta la gloire valyrienne."

  building_valyria_volcano_02:0 "Rhazalhar"
  building_type_valyria_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_02_desc:0 "Rhazalhar est le plus imposant des Quatorze Flammes, un colosse de fureur en fusion et de puissance antique. Son sommet, constamment voilé de fumée et de cendres, perce les cieux et projette son ombre sur le paysage alentour. Des rivières de lave s'écoulent de son cœur ardent, traçant des chemins lumineux à travers la roche volcanique noire. En raison des températures extrêmes qui règnent autour du volcan, toute exploitation minière demeure impossible."

  building_valyria_volcano_03:0 "Epaekros"
  building_type_valyria_volcano_03:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_03_desc:0 "Epaekros se révèle plus dangereux que ses frères volcaniques, beauté sauvage aux falaises instables qui projettent leurs pierres sur les randonneurs téméraires et aux sols glissants qui causent des chutes mortelles. Ceux qui atteignent son sommet rencontrent souvent une fin tragique, qu'elle vienne d'une vouivre de feu nichée dans ses entrailles ou d'un [dragon|El] revendiquant son territoire. Pourtant, pour ceux qui parviennent à sonder les profondeurs du volcan, richesses, or et métaux précieux abondent dans ses veines ardentes."

  building_valyria_volcano_04:0 "Tartarax"
  building_type_valyria_volcano_04:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_desc:0 "S'élançant vers les cieux, bien que moins haut que Rhazalhar, Tartarax est un volcan plus élancé mais plus profond dont le sommet aux formes curieuses offre un refuge idéal à toute créature éprise de feu. Ses cavernes profondes et ses tunnels labyrinthiques recèlent d'amples opportunités minières, mais aussi la mort. Lave et créatures hostiles pullulent dans ce donjon sombre et abyssal. Pourtant, l'éclat de sa lave majestueuse, visible de loin dans l'obscurité nocturne, demeure inoubliable."

  building_valyria_volcano_05:0 "Yontaryos"
  building_type_valyria_volcano_05:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_05_desc:0 "Lorsque Yontaryos fut découvert pour la première fois par les anciens Valyriens, il différait des autres volcans de la région. Petit et relativement bas, avec peu de magma et un espace limité pour la nidification des dragons. Cependant, il avait ses usages. Des minéraux précieux pouvaient encore être extraits de ses entrailles, et sa taille modeste en faisait un lieu idéal pour les rituels et sacrifices, bien que ses flammes ne brûlent pas avec l'intensité de ses frères géants."

  building_type_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01_desc:0 "Le Grand Port d'Elyria constitue un chantier naval immense bâti durant l'apogée des [valyrian_freehold_short|E]. La position stratégique d'Elyria dans la baie des Serfs offre à cette petite île un trafic considérable de navires, de commerce et d'esclaves, que ce port massif peut accueillir. Après l'effondrement des [valyrian_freehold_short|E], ce havre a capturé une part significative du commerce de la baie des Serfs, devenant l'envie de la région et de ses alentours."

  building_type_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
  building_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
  building_elyria_dragon_palace_01_desc:0 "Le Palais du Dragon est une demeure luxueuse et grandiose offrant tout ce qu'un seigneur pourrait désirer : chambres majestueuses, salles de banquet immenses, bassins, caves à vin, et bien plus encore. Bâti durant l'ère des [valyrian_freehold_short|E] pour abriter le gouverneur d'Elyria, nulle dépense ne fut épargnée. Aujourd'hui, il loge le Duc d'Elyria, lui conférant splendeur et renommée."

  building_valyria_dead_volcano_01:0 "Syrabelos"
  building_type_valyria_dead_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_desc:0 "Syrabelos est un volcan éteint, la lave qui coulait jadis dans ses veines s'est tarie depuis longtemps. Cela ne signifie pas qu'il soit inutile, car il demeure riche en minéraux et métaux précieux à exploiter et peut encore servir de refuge durant les raids ou les tempêtes."

  building_valyria_dead_volcano_01_02:0 "Mines de Syrabelos"
  building_type_valyria_dead_volcano_01_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_02_desc:0 "Les opérations minières ont été restaurées à Syrabelos. Des esclaves descendent quotidiennement dans les puits pour extraire métaux précieux et autres matériaux de valeur au profit de leurs oppresseurs."

  building_valyria_dead_volcano_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_desc:0 "Qazdarsos fut jadis un volcan actif mais ne l'est plus. Désormais dormant mais non silencieux, les cris de vouivres de feu et, selon certains, même d'esprits peuvent encore être entendus depuis ses profondeurs. Quelques-uns ont osé s'y aventurer sans groupe suffisamment nombreux et ne furent jamais revus."

  building_valyria_dead_volcano_02_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_02_desc:0 "Les mines de Qazdarsos sont pleinement opérationnelles à nouveau. Les esclaves extraient richesses et or quotidiennement pour leurs maîtres. Cependant, les récits d'êtres surnaturels et de créatures maudites persistent concernant l'intérieur du volcan. Que ces histoires soient véridiques ou simple divagation d'esclaves est une autre question..."

  building_royal_barracks_of_valyria_01:0 "Les Casernes Ruinées de Valyria"
  building_type_royal_barracks_of_valyria_01:0 "Les Casernes Ruinées de Valyria"
  building_royal_barracks_of_valyria_01_desc:0 "Jadis de grandioses casernes des [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont plus qu'ruines et guère plus qu'un amas de gravats."
  building_type_royal_barracks_of_valyria_01_desc:0 "Jadis de grandioses casernes des [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont plus qu'ruines et guère plus qu'un amas de gravats."

  building_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_type_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_royal_barracks_of_valyria_02_desc:0 "Les Casernes Royales restaurées de Valyria, bâties sur les anciennes ruines, voient désormais gardes et soldats aller et venir pour assurer la sécurité des voyageurs et citoyens."

  building_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_type_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_great_arena_of_valyria_01_desc:0 "Jadis une grande arène emplie de gladiateurs et de spectateurs, elle gît désormais en ruines. Sa restauration sera coûteuse, mais elle pourrait ramener la joie parmi le peuple."

  building_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_type_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_great_arena_of_valyria_02_desc:0 "Désormais reconstruite, la Grande Arène attire des milliers de spectateurs venus assister aux tournois et jeux sanglants où professionnels et esclaves périssent dans le sable pour le divertissement du peuple."

  building_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_type_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_great_library_of_valyria_01_desc:0 "Les vestiges en ruine de la grande bibliothèque pourraient être restaurés pour abriter de grandes œuvres d'art et de littérature."

  building_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_type_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_great_library_of_valyria_02_desc:0 "La Grande Bibliothèque restaurée de Valyria, emplie de grandes œuvres d'art, de littérature et de philosophie. Érudits et académiciens y étudient textes antiques et parchemins séculaires."

  building_valyria_veilspire_peak:0 "Pic du Voilespire"
  building_type_valyria_veilspire_peak:0 "Pic du Voilespire"
  building_valyria_veilspire_peak_desc:0 "Le Pic du Voilespire constitue le sommet montagneux le plus élevé de toute la péninsule valyrienne, même avant [doom|E]. Jadis utilisé comme pèlerinage sacré pour les plus braves et les plus forts, ce grand sommet représente une épreuve divine. On dit que ceux qui parviennent à grimper jusqu'au faîte reviennent plus sages et plus savants."

  building_velakar_resort_01:0 "Un Ancien Resort en Ruines"
  building_type_velakar_resort_01:0 "Un Ancien Resort en Ruines"
  building_velakar_resort_01_desc:0 "Jadis un Grand Resort pour [dragonlords|El] et riches marchands, ce complexe gît désormais en ruines, guère mieux qu'un tas de briques."

  building_velakar_resort_02:0 "L'Illustre Resort de Velakar"
  building_type_velakar_resort_02:0 "L'Illustre Resort de Velakar"
  building_velakar_resort_02_desc:0 "L'Illustre Resort de Velakar, désormais restauré, accueille les gens de richesse et de statut pour se baigner et se détendre dans ce complexe majestueux digne d'un empereur. Utilisant la chaleur volcanique pour réchauffer les bains et avec des milliers de serviteurs à leur service, c'est véritablement un spectacle à contempler."

  building_aurions_lost_expidition:0 "L'Expédition Perdue d'Aurion"
  building_type_aurions_lost_expidition:0 "L'Expédition Perdue d'Aurion"
  building_aurions_lost_expidition_desc:0 "Voici l'expédition perdue de l'autoproclamé Empereur de Valyria, Aurion Varezys. Cette plaine désolée constitue désormais le site funéraire de 30 000 hommes, réduits à de simples amas de métal et d'os, souillés par les radiations et gaz toxiques des geysers sulfureux. C'est véritablement un paysage infernal."

  building_type_lokirian_barracks_01:0 "Casernes Lokirrienness"
  building_type_lokirian_barracks_01_desc:0 "Les puissantes Casernes Lokirriennes, réputées pour la qualité de leurs armes."
  building_lokirian_barracks_01:0 "Les Vestiges d'une Caserne"
  building_lokirian_barracks_01_desc:0 "Jadis les puissantes casernes de Lokiria, désormais réduites à rien d'autre qu'un amas de gravats."
  building_lokirian_barracks_02:0 "Casernes Partiellement Restaurées"
  building_lokirian_barracks_02_desc:0 "Bien qu'une grande part de leur grandeur passée soit perdue, les casernes ont été rendues fonctionnelles. Les soldats s'y entraînent, leurs voix résonnant dans les salles à demi-achevées."
  building_lokirian_barracks_03:0 "Les Puissantes Casernes de Lokiria"
  building_lokirian_barracks_03_desc:0 "Les casernes de Lokiria, désormais reconstruites et fortifiées avec de la pierre de dragon et de l'acier valyrien. Les soldats marchent jour et nuit, présentant un spectacle imposant et un cauchemar pour quiconque oserait mettre le siège."


  building_redwyrms_wrath_01:0 "Forteresse en Ruine"
  building_type_redwyrms_wrath_01:0 "Forteresse en Ruine"
  building_redwyrms_wrath_01_desc:0 "La Colère du Wyrm Rouge était une forteresse redoutable faite de murs de pierre de dragon et de flèches élancées, jadis ornée des crânes de dragons abattus comme sinistres trophées de ses conquêtes. Gouvernée par le Seigneur Protecteur Taurion de Lokiria, elle constituait un bastion de guerre et de domination, ses bannières cramoisies inspirant la terreur à travers le pays. Désormais en ruines, la Colère du Wyrm Rouge n'est plus que l'ombre de sa gloire passée, ses murs brisés et bannières fanées demeurant comme reliques du règne violent de Lokiria."

  building_redwyrms_wrath_02:0 "La Colère du Wyrm Rouge"
  building_type_redwyrms_wrath_02:0 "Forteresse Ruinée"
  building_redwyrms_wrath_02_desc:0 "La Colère du Wyrm Rouge s'est dressée à nouveau, ses murs de pierre de dragon restaurés à leur gloire sinistre, dominant une fois de plus le paysage comme symbole de terreur et de puissance. De nouveau ornée de crânes de [dragon|El] et de bannières cramoisies portant le blason du Dragon Rouge de Lokiria, la forteresse exhale une détermination sombre. Reconstruite à la fois comme monument à la guerre et déclaration de domination, la Colère du Wyrm Rouge inspire terreur et respect, sa renaissance témoignant d'un héritage durable de conquête."

  building_valyrian_gate_01:0 "Ruines de la Porte"
  building_type_valyrian_gate_01:0 "Ruines de la Porte"
  building_valyrian_gate_01_desc:0 "Ruines de l'autrefois grande Porte de Valyria, un puissant Symbole de richesse et de pouvoir maintenant rien d'autre qu'un tas de briques."

  building_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_type_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_valyrian_gate_02_desc:0 "La Grande Porte de Valyria, sept portes et sept herses faites et renforcées par l'Acier Valyrien. Des milliers de marchands et de voyageurs passent par ces portes. Des Statues Géantes de héros autrefois grands peuvent être vues au sommet de l'entrée."

  building_great_harbor_of_valyria_01:0 "Baie pour un Port"
  building_type_great_harbor_of_valyria_01:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_01_desc:0 "Cette baie est suffisamment grande et profonde pour construire un grand port ici. Pour l'instant, il n'y a pas grand-chose ici, sauf des poissons."

  building_great_harbor_of_valyria_02:0 "Quais et Ateliers de Réparation"
  building_type_great_harbor_of_valyria_02:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_02_desc:0 "Pour faciliter le commerce et la construction navale, et pour établir un riche centre commercial et un contrôle maritime, nous devons construire un grand port. Pour l'instant, nous construirons de longs quais et des ateliers de réparation pour la production de navires. Nous ajouterons également une cabine de quartier-maître pour le commerce et un bureau d'inspection pour taxer et nous assurer qu'aucune marchandise de contrebande n'entre dans notre cité."

  building_great_harbor_of_valyria_03:0 "Appontements"
  building_type_great_harbor_of_valyria_03:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_03_desc:0 "Construire des appontements et étendre l'infrastructure actuelle nous permettra d'accueillir plus de navires et d'augmenter le commerce entrant. Ces expansions seront également utilisées pour amarrer les navires militaires servant notre flotte."

  building_great_harbor_of_valyria_04:0 "Grues et Approvisionnements de Construction Navale"
  building_type_great_harbor_of_valyria_04:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_04_desc:0 "En construisant de grandes grues, nous pouvons grandement augmenter l'efficacité de notre port et permettre à plus de navires d'arriver et de partir. Nous construirons également une zone d'approvisionnement de construction navale près du port pour améliorer l'efficacité de la construction de nos navires de guerre. Avec ce Grand Port, personne ne pourra nous défier en mer."

  building_great_temple_of_valyria_01:0 "Colline pour un Temple"
  building_type_great_temple_of_valyria_01:0 "Le Temple Draconique de Valyria"
  building_great_temple_of_valyria_01_desc:0 "Pour vénérer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il y a une colline près du Mont Tartarax que nous pourrions utiliser pour construire un Temple Magnifique et Illustre pour nos Dieux Dragons. Le fait qu'elle soit proche d'un volcan convient encore mieux à nos besoins."
  building_type_great_temple_of_valyria_01_desc:0 "Pour vénérer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il y a une colline près du Mont Tartarax que nous pourrions utiliser pour construire un Temple Magnifique et Illustre pour nos Dieux Dragons. Le fait qu'elle soit proche d'un volcan convient encore mieux à nos besoins."

  building_great_temple_of_valyria_02:0 "Salle de Prière et Lieu de Rassemblement"
  building_type_great_temple_of_valyria_02:0 "Le Temple Draconique de Valyria"
  building_great_temple_of_valyria_02_desc:0 "Nous commencerons par une salle de prière richement décorée remplie d'artefacts coûteux — sculptures de dragons et de feu, tapisseries représentant des dragons, braseros et le plus beau marbre que nous puissions trouver. Nous créerons également une salle ouverte séparée pour les sacrifices humains."

  building_great_temple_of_valyria_03:0 'Arène Ardente"
  building_type_great_temple_of_valyria_03:0 "Le Temple Draconique de Valyria"
  building_great_temple_of_valyria_03_desc:0 "Les Valyriens ont toujours brûlé leurs morts. Brûler nos morts dans un Temple à côté de notre volcan est une bien meilleure façon d'honorer ceux qui ont quitté ce monde. Nous étendrons la salle ouverte que nous avons déjà construite à cette fin. Des colonnes sculptées, des fleurs exotiques et un autel de pierre noire pour remplacer les bûchers de bois utilisés pour les sacrifices humains et la crémation des morts seront construits."

  building_great_temple_of_valyria_04:0 "Statues de Dragons"
  building_type_great_temple_of_valyria_04:0 "Le Temple Draconique de Valyria"
  building_great_temple_of_valyria_04_desc:0 "Aucun bâtiment à Valyria n'est vraiment complet sans statues de dragons. Nous construirons 14 statues, une pour chaque Dieu. Chaque statue sera unique et majestueuse pour honorer correctement nos Dieux."

  building_great_walls_of_valyria_01:0 "Vestiges Insignifiants du Mur"
  building_type_great_walls_of_valyria_01:0 "Les Grands Murs de Pierre Noire de Valyria"
  building_great_walls_of_valyria_01_desc:0 "Cette zone est l'endroit où se trouvent les vestiges des Grands Murs de Valyria. Il ne reste presque rien, car les murs ont été détruits pendant le Fléau. Les quelques vestiges qui ont survécu sont si endommagés qu'ils sont inutilisables. Bien sûr, nous pourrions restaurer ces murs dans leur grandeur d'antan, et nous devrions le faire. Inutile de dire que ce sera une entreprise très coûteuse."

  building_great_walls_of_valyria_02:0 "Les Grands Murs de Pierre Noire de Valyria"
  building_type_great_walls_of_valyria_02:0 "Les Grands Murs de Pierre Noire de Valyria"
  building_great_walls_of_valyria_02_desc:0 "Les murs de Valyria ont été entièrement restaurés, imposants et vastes, encerclant toute la cité. Ces fortifications massives sont si larges que douze chars pourraient courir côte à côte (prends ça, Volantis !). Des tours de guet et des douves bordent maintenant le périmètre, offrant des couches supplémentaires de défense. Les entrées sont renforcées avec des herses et des zones de tir, rendant toute tentative d'envahir la cité par la force presque impossible pour tout attaquant."

  building_great_dragonkeep_of_valyria_01:0 "Site du Palais"
  building_type_great_dragonkeep_of_valyria_01:0 "Le Grand Donjon Draconique de Valyria"
  building_great_dragonkeep_of_valyria_01_desc:0 "Nous avons localisé un site potentiel pour un grand palais. À l'avenir, il deviendra le lieu de grandeur. Mais pour l'instant, il n'y a pas grand-chose de notable ici."

  building_great_dragonkeep_of_valyria_02:0 "Poser les Fondations"
  building_type_great_dragonkeep_of_valyria_02:0 "Le Grand Donjon Draconique de Valyria"
  building_great_dragonkeep_of_valyria_02_desc:0 "Pour loger les dirigeants de cette grande cité, nous aurons besoin d'un palais imposant. Non, le plus grand palais que le monde ait jamais vu. Cela nécessitera, bien sûr, de nombreux esclaves et de l'or, mais ces ressources peuvent être acquises. Ce palais sera un témoignage de la grandeur valyrienne. Nous commencerons par un donjon et continuerons notre expansion à partir de là."

  building_great_dragonkeep_of_valyria_03:0 "Murs Extérieurs"
  building_type_great_dragonkeep_of_valyria_03:0 "Le Grand Donjon Draconique de Valyria"
  building_great_dragonkeep_of_valyria_03_desc:0 "Pour nous assurer que ce donjon sera imprenable, nous construirons nos murs exclusivement en pierre noire. Ces murs hauts et épais repousseront tous les ennemis et les individus indésirables. Construire des murs épais et hauts uniquement avec de la pierre noire sera, bien sûr, très coûteux."

  building_great_dragonkeep_of_valyria_04:0 "Murs Intérieurs et Décor"
  building_type_great_dragonkeep_of_valyria_04:0 "Le Grand Donjon Draconique de Valyria"
  building_great_dragonkeep_of_valyria_04_desc:0 "Maintenant que nous avons construit les murs extérieurs, nous devons ériger des murs intérieurs pour améliorer la sécurité et améliorer l'efficacité de nos fortifications. Des portes, des herses et des créneaux seront construits. De plus, nous décorerons le grand donjon avec des soies, des tapisseries, des trophées et bien d'autres choses pour afficher notre splendeur."

  building_procrazion_01:0 "Grand Château Abandonné"
  building_type_procrazion_01:0 "Procrazion"
  building_procrazion_01_desc:0 "Procrazion était autrefois un bastion du pouvoir valyrien, siégeant au sommet de la montagne centrale au cœur de la cité. Avant le Fléau, ce grand château servait de centre militaire et politique, agissant comme centre de défense pour toute la région. Bien qu'une grande partie de sa structure reste intacte, le temps n'a pas été clément envers ses salles autrefois glorieuses. Les ponts de pierre qui le reliaient autrefois à la cité environnante sont maintenant détruits, et l'intérieur montre des signes évidents de décrépitude. Les imposantes Tours Draconiques se dressent toujours, mais leurs chambres sont vides, et la forge autrefois active est maintenant dormante. Malgré cela, sa position élevée et ses points d'entrée limités offrent toujours un avantage stratégique. Bien qu'encore imposant, Procrazion n'est que l'ombre de lui-même, attendant d'être restauré dans son ancienne gloire."

  building_procrazion_02:0 "Procrazion"
  building_type_procrazion_02:0 "Procrazion"
  building_procrazion_02_desc:0 "Procrazion a été restauré dans son ancienne gloire, se dressant fièrement au sommet de la montagne au cœur de la cité. Ce grand château est à nouveau relié à la cité en contrebas par des ponts reconstruits, offrant un accès sans avoir besoin de dragons. Les Tours Draconiques ont également été restaurées, offrant entrée et sortie pour les créatures majestueuses, tandis que les tours à dôme brillent comme elles le faisaient avant le Fléau. À l'intérieur, il est équipé de toutes les commodités attendues pour un seigneur de la région, offrant confort et luxe même pendant un siège. La forge unique sur un côté de la montagne a été réactivée, canalisant à nouveau la lave pour créer des armes puissantes. Sa position élevée, combinée à sa restauration et à ses points d'entrée limités, garantit qu'il reste presque imprenable, capable de résister à toute menace. Maintenant entièrement restauré, Procrazion sert non seulement de forteresse défensive mais aussi de symbole de la résurgence de la cité."

  building_eternal_flame_temple_01:0 "Temple Abandonné"
  building_type_eternal_flame_temple_01:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_01_desc:0 "Le Temple de la Flamme Éternelle était vraisemblablement le point de connexion entre les Dieux Anciens de Valyria et les guerriers valyriens. En plus d'être le centre religieux pour le peuple commun, le temple s'élevait autrefois haut comme un symbole de la puissance religieuse de Valyria ; maintenant il gît poussiéreux et abandonné. Aujourd'hui, il reste un vague souvenir de ce qui était autrefois un Haut Temple vénéré de la cosmogonie valyrienne."

  building_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_type_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_02_desc:0 "Le Temple de la Flamme Éternelle a maintenant été rénové et se dresse comme un symbole de puissance, de religion et de pouvoir. Ses murs restaurés racontent les histoires des anciens dieux et sont remplis de légendes autrefois connues seulement des anciens Valyriens. Le peuple commun peut maintenant profiter du luxe et rêver de ce que les dragons et la magie auraient pu être avant le Fléau. Les guerriers viennent prier pour être remplis de la rage et de la puissance des dragons qui les ont précédés. Le temple brille vivement comme un phare de foi religieuse, d'espoir et de la puissance valyrienne ancienne et nouvelle."

  building_red_guard_barracks_01:0 "Casernes Abandonnées"
  building_type_red_guard_barracks_01:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_01_desc:0 "L'autrefois fier quartier général de l'élite Garde Rouge de la cité, gît maintenant abandonné et attaché aux anciens murs de la cité. Le temps tout-puissant a érodé ses environs et son intérieur, où les créneaux brisés et la structure rouillée parlent d'abandon post-Fléau. À l'arrière, deux tours Draconiques ne sont plus que réminiscence de ce qui était autrefois la puissance militaire. Les chambres ne sont maintenant remplies que de fantômes du temps passé et de la force maintenant perdue. Malgré sa décrépitude, ces casernes aspirent à la restauration pour redevenir le formidable bouclier de la cité."

  building_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_type_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_02_desc:0 "Minutieusement restaurées à leur puissance valyrienne proche, les Casernes de la Garde Rouge sont le foyer renouvelé pour les défenseurs de la cité, se trouvant à côté des glorieux murs de la cité. La structure de pierre rappelle son ancienne gloire, renforcée, puissante et remplie d'histoires et de cicatrices. Les Tours Draconiques respirent la vie et la vitalité, comme lorsque de vrais dragons rugissaient dans les hauts cieux. Les casernes ne sont plus accueillies par des fantômes, mais par la Garde Rouge d'élite récemment restaurée, remplie de discipline énergisante, d'excellence et de gloire inégalée. Dans un mélange complexe d'ancien avec la nouvelle technologie, le bâtiment protège maintenant à nouveau la cité et protège tous ceux qui sont à l'intérieur."

  building_red_guard_training_compound_01:0 "Terrain d'Entraînement Abandonné"
  building_type_red_guard_training_compound_01:0 "Le Terrain d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_01_desc:0 "Les murs décrépis échouent à raconter les histoires des Gardes Rouges maintenant disparus qui s'entraînaient ici. Ce Terrain d'Entraînement était autrefois un bâtiment respecté et admiré rempli de dragons, de guerriers et de dirigeants qui gît maintenant abandonné et vide, incapable de dépeindre son énergie et sa gloire depuis longtemps oubliées. Des armes, des donjons et de l'équipement rouillé peuvent encore être trouvés ici, mais on se demande comment cela aurait pu être pendant sa gloire."

  building_red_guard_training_compound_02:0 "Le Terrain d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_02_desc:0 "Force, honneur et puissance sont ce que l'on pourrait trouver en regardant le Terrain d'Entraînement de la Garde Rouge restauré. Rempli d'hommes tentant de leur mieux de s'honorer en devenant partie de l'Élite Garde Rouge, le terrain accueille des stratèges, des dirigeants et des guerriers, tous visant à être les meilleurs. Avec de glorieux piliers l'entourant avec grâce, et un toit tenu haut avec des fenêtres rouges pour montrer que le ciel est la seule limite, ce bâtiment forme maintenant les plus grands guerriers et les plus fins dirigeants."

  building_type_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01_desc:0 "Zanpur est le volcan jumeau le plus occidental des îles Marahai."

  building_type_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01_desc:0 "Yovesh est le volcan jumeau le plus oriental des îles Marahai."

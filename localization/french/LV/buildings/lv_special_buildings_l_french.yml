l_french:
 # Braavos
 building_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
 building_type_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
 building_agot_EE_titan_of_braavos_desc:0 "Répertorié par le célèbre chroniqueur ouestrien Lomas Longstrider comme l'une des Merveilles façonnées par la main de l'Homme, le Titan de Braavos constitue la principale ligne de défense de la [free_city|E] de Braavos, gardant l'étroite entrée du lagon où repose la cité. C'est une statue colossale de granit et de bronze figurant un guerrier, faisant à la fois office de forteresse et de phare. Des meurtrières dissimulées sous le pagne blindé de la statue, ainsi que des archères parsemant sa cuirasse, offrent une défense quasi impénétrable contre tout navire ennemi cherchant à pénétrer dans le lagon."

 building_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
 building_type_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
 building_agot_EE_sealords_palace_desc:0 "Le Palais du Seigneur de la Mer est la demeure du Seigneur de la Mer de Braavos. Sous les dômes et les tours de ce vaste palais s'étend une ménagerie exotique, peuplée d'oiseaux et de bêtes venus des quatre coins du monde."

 # Volantis
 building_agot_EE_black_walls_of_old_volantis:0 "Les Murailles Noires"
 building_type_agot_EE_black_walls_of_old_volantis:0 "Les Murailles Noires"
 building_agot_EE_black_walls_of_old_volantis_desc:0 "Le cœur de Volantis. Bâtie par les antiques [valyrian_freehold|E], cette gigantesque muraille de pierre noire fusionnée protège un ensemble de palais, de cours, de tours et de temples. Seuls ceux dont le sang remonte à l'ascendance valyrienne, le Sang Ancien, ont le droit d'y résider."
 building_agot_EE_volantis_harbor:0 "Le Port de Volantis"
 building_type_agot_EE_volantis_harbor:0 "Le Port de Volantis"
 building_agot_EE_volantis_harbor_desc:0 "La puissance de Volantis tient en partie à son vaste port, dont la position géographique s'avère particulièrement favorable. Cette immense baie en forme de croissant, bâtie à l'embouchure même de la Rhoyne, serait, dit-on, assez vaste pour contenir la totalité de Braavos en son sein."

 building_agot_EE_the_long_bridge:0 "Le Long Pont"
 building_type_agot_EE_the_long_bridge:0 "Le Long Pont"
 building_agot_EE_the_long_bridge_desc:0 "Le Long Pont relie les deux moitiés de Volantis et constitue le plus long pont du monde connu. Bâti par [old_valyria|E] en son âge d'or, dans une pierre fusionnée, il serait capable, dit-on, de supporter le poids de mille éléphants."

 building_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
 building_type_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
 building_agot_EE_temple_of_the_lord_of_light_desc:0 "Cet immense temple s'élève bien au-dessus de tous les autres édifices de la cité. Ses éblouissantes couleurs d'or, de rouge et d'orange en font un spectacle à couper le souffle. Protégé par la Main Ardente, ce temple sert R'hllor, le Maître de la Lumière, et pourrait bien constituer l'un des plus grands témoignages de sa puissance qui soit."

 building_agot_EE_volantis_walls:0 "Les Murailles de Volantis"
 building_type_agot_EE_volantis_walls:0 "Les Murailles de Volantis"
 building_agot_EE_volantis_walls_desc:0 "Bien que moins imposantes que celles du Vieux Volantis, les murailles de Volantis suffisent à faire réfléchir à deux fois quiconque envisagerait de prendre la cité d'assaut."

 # Rhoyne
 building_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
 building_type_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
 building_agot_EE_nymeria_palace_01_desc:0 "Au cœur de Ny Sar gisent les ruines du Palais de Nymeria, abandonné depuis que les [valyrian_freehold|E] vainquirent le Prince Garin lors de la Deuxième Guerre des Épices. Ses murs de marbre rose et vert, ses dômes altiers et ses grandes flèches ne sont plus que la carcasse hantée de leur splendeur passée. Toute vie déserta ce lieu lorsque Nymeria s'enfuit vers Dorne, abandonnant ces halls jadis fiers à la décrépitude."

 building_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
 building_type_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
 building_agot_EE_nymeria_palace_02_desc:0 "Se dressant fièrement une fois de plus au cœur de Ny Sar, le Palais de Nymeria a été méticuleusement restauré, témoignage vivant de la résilience et de l'héritage rhoynar. Le marbre vert et rose, éclatant de vie, scintille sous le soleil, tandis que d'immenses dômes et de hautes flèches dominent désormais l'horizon, effaçant presque le souvenir de son passé tragique."

 building_agot_EE_palace_of_love_01:0 "Le Palais du Chagrin"
 building_type_agot_EE_palace_of_love_01:0 "Le Palais du Chagrin"
 building_agot_EE_palace_of_love_01_desc:0 "Le Palais du Chagrin se dresse comme un sombre rappel du destin qui frappa Chroyane, la Cité de la Fête. Ses tours croulantes, couvertes de mousse et de lierre sombre, ne révèlent plus rien de la beauté qu'incarnait jadis le Palais de l'Amour. Statues englouties et hommes de pierre hantent désormais ses halls en ruine, noyés dans la brume."

 building_agot_EE_palace_of_love_02:0 "Le Palais de l'Amour"
 building_type_agot_EE_palace_of_love_02:0 "Le Palais de l'Amour"
 building_agot_EE_palace_of_love_02_desc:0 "Le Palais de l'Amour orne à nouveau les rives de la Rhoyne, renaissance éblouissante de la gloire passée de Chroyane. Ses tours s'élancent vers le ciel, parées de mosaïques éclatantes et de sculptures délicates célébrant la vie, la beauté et l'amour. Le soleil scintille sur des fontaines étincelantes qui alimentent de luxuriants jardins, déversant des fleurs sur chaque terrasse. Sous ses grands dômes, les mariages sont à nouveau bénis, emplissant Chroyane de la promesse de nouveaux commencements."

 building_agot_EE_bridge_of_dream_01:0 "Le Pont du Rêve"
 building_type_agot_EE_bridge_of_dream_01:0 "Le Pont du Rêve"
 building_agot_EE_bridge_of_dream_01_desc:0 "Jadis rival du Long Pont de Volantis, le Pont du Rêve surplombe aujourd'hui la Rhoyne, enveloppé d'un épais brouillard. Ses arches de pierre, qui s'élevaient autrefois à quarante pieds au-dessus du fleuve, se sont effondrées sous une mousse dense et un lierre noir. Repaire des hommes de pierre, il se dresse désormais comme un monument silencieux et pourrissant, vestige de la fierté perdue des Rhoynars."

 building_agot_EE_bridge_of_dream_02:0 "Le Pont du Rêve"
 building_type_agot_EE_bridge_of_dream_02:0 "Le Pont du Rêve"
 building_agot_EE_bridge_of_dream_02_desc:0 "Le Pont du Rêve enjambe à nouveau la Rhoyne dans toute sa gloire. S'élevant à quarante pieds au-dessus du fleuve, ses arches de pierre pâle se dressent, solides et fières. De luxuriants jardins bordent le tablier de bois du pont, en fleurs de toutes les couleurs. Ce grand pont, jadis perdu au temps et à la ruine, a été ressuscité. Symbole de la fierté et de la résilience rhoynar, il domine à nouveau les eaux vives de la Rhoyne !"

 # Meereen
 building_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
 building_type_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
 building_agot_EE_great_pyramid_of_meereen_desc:0 "De loin le plus grand édifice de la cité, la Grande Pyramide de Meereen fut bâtie par une petite armée d'esclaves, dont un millier périt durant sa construction. La pyramide sert de centre administratif à Meereen, et les dirigeants de la cité utilisent depuis des siècles sa grande salle pour recevoir leurs sujets."

 # Asshai
 building_stygai_01:0 "La Cité Hantée de Stygaï"
 building_type_stygai_01:0 "Stygaï"
 building_stygai_01_desc:0 "Stygaï, cité antique et énigmatique dissimulée au cœur ténébreux des Contrées de l'Ombre, demeure l'un des mystères les plus effrayants de ce monde. D'un âge insondable et drapée d'obscurité éternelle, la cité se dresse comme un monument à une ère oubliée. Pas même les plus audacieux des lieurs d'ombre n'osent s'aventurer dans ses rues maudites. Ses flèches vertigineuses et ses ruelles labyrinthiques seraient, dit-on, parcourues aussi bien par des démons que par des créatures innommables. Voilées de secret, ses véritables origines et l'étendue de ses sombres pouvoirs demeurent inconnues."

 # Gogossos
 building_red_citadel_01:0 "La Tour Rouge"
 building_type_red_citadel_01:0 "La Tour Rouge"
 building_red_citadel_01_desc:0 "Une vaste tour côtière, que l'on croit être le dernier vestige d'une forteresse jadis puissante, sert aujourd'hui de principal bastion à la cité. Bien qu'une grande partie de la structure originelle se soit perdue au fil du temps, ce bastion solitaire perdure — modeste, mais d'une robustesse remarquable et hautement défendable. D'épais murs de pierre patinée résistent aussi bien aux éléments qu'aux sièges éventuels, en faisant un siège d'autorité fiable au sein de Gogossos. Bien qu'elle ne soit pas encore une grande citadelle, elle demeure un donjon redoutable, fondation sur laquelle de plus grandes fortifications pourraient un jour s'élever"

 building_red_citadel_02:0 "Le Réduit Rouge"
 building_type_red_citadel_02:0 "Le Réduit Rouge"
 building_red_citadel_02_desc:0 "Désormais renforcé d'une solide palissade de bois et de tours de guet érigées au sommet des anciens Vestiges Cramoisis, ce réduit s'est mué en un bastion plus redoutable, capable de résister à des menaces prolongées. N'étant plus une simple tour côtière isolée, ses défenses élargies lui permettent désormais d'accueillir une garnison respectable, offrant à Gogossos un solide point d'ancrage. Avec des réserves abondantes et des positions renforcées, il pourrait même soutenir une armée durant des mois si nécessaire, marquant sa transformation d'une simple relique du passé en un véritable bastion de pouvoir au sein de la cité."

 building_red_citadel_03:0 "La Citadelle Rouge"
 building_type_red_citadel_03:0 "La Citadelle Rouge"
 building_red_citadel_03_desc:0 "Jadis une relique déclinante, la Citadelle Rouge a été rebâtie en une gigantesque forteresse qui domine Gogossos, ses murailles vertigineuses de Pierre Noire Valyrienne se dressant comme un sinistre monument au pouvoir. Comme la Porte Cramoisie, ses pierres furent teintées de cramoisi par d'antiques rituels de magie du sang, dont l'empreinte perdure longtemps après la disparition de la sorcellerie elle-même. On murmure que la Mort Rouge naquit en ces lieux, le souvenir de la malédiction résonnant encore dans des chambres cachées où jadis les mourants poussaient leurs cris. Plus qu'une forteresse, la Citadelle Rouge demeure le cœur impitoyable de Gogossos — un lieu où l'autorité est absolue et où la rébellion meurt avant même de prendre forme."

 building_pit_of_sorrows_01:0 "Donjon Envahi par la Végétation et Ruines"
 building_type_pit_of_sorrows_01:0 "Donjon Envahi par la Végétation et Ruines"
 building_pit_of_sorrows_01_desc:0 "Un donjon en ruine, ses murs jadis puissants désormais drapés de lierre rampant et engloutis par l'étreinte implacable de la nature, se dresse dans un silence inquiétant. Des arbres ont pris racine dans ses cours, leurs branches tordues griffant le ciel, comme pour témoigner d'horreurs oubliées.\n\nMalgré sa décrépitude, le donjon demeure étrangement défendable — ses tours, bien qu'usées par les âges, imposent toujours leur présence menaçante. Sa porte, à moitié ensevelie sous la mousse et les gravats, laisse deviner une forteresse qui refuse de céder entièrement au temps.\n\nPourtant, quelque chose semble profondément déplacé en ce lieu. L'air est chargé d'un calme contre nature, du genre qui hérisse la peau et trouble l'esprit. Des ombres s'attardent là où elles ne devraient pas, et des murmures — trop ténus pour n'être que le vent — semblent flotter à travers les ruines, laissant entendre des secrets qu'il vaudrait mieux ne jamais troubler."

 building_pit_of_sorrows_02:0 "Donjon et Fouilles de la Fosse"
 building_type_pit_of_sorrows_02:0 "Donjon et Fouilles de la Fosse"
 building_pit_of_sorrows_02_desc:0 "Alors que nous étendions nos efforts et dégagions l'épais enchevêtrement de végétation, nous fîmes une découverte stupéfiante — le sol sous nos pieds semblait descendre sans fin, peu importe la quantité de boue et de débris que nous retirions. Ce qui semblait d'abord n'être qu'une simple végétation dissimulant les ruines se révéla bientôt être une vaste descente en strates, chaque niveau inférieur mettant au jour des vestiges du passé.\n\nParmi les pierres croulantes et la terre humide, nous exhumâmes d'innombrables ossements — leur origine inconnue, leur histoire depuis longtemps perdue dans le temps. À chaque pas vers les profondeurs, une certitude grandissante s'imposait : il pourrait bien s'agir de la légendaire Fosse aux Chagrins, un lieu chuchoté dans des légendes effrayantes, ses profondeurs intactes et ses mystères encore à percer."

 building_pit_of_sorrows_03:0 "La Fosse aux Chagrins"
 building_type_pit_of_sorrows_03:0 "La Fosse aux Chagrins"
 building_pit_of_sorrows_03_desc:0 "L'antique Fosse aux Chagrins, jadis une ruine croulante, a été méticuleusement rebâtie et restaurée dans sa sinistre grandeur d'antan. Pourtant, malgré tous les efforts déployés pour reconquérir ses hauteurs, ses véritables profondeurs demeurent un abîme insondable. Les ténèbres inférieures s'étendent à l'infini, engloutissant lumière et son à la fois, telle une gueule béante ouverte sur l'inconnu. Nombreux sont ceux qui ont osé descendre en quête de secrets perdus dans le temps, mais nul n'est jamais revenu dire ce qui repose au fond — si tant est qu'un fond existe."

 building_the_toad:0 "Le Crapaud Noir"
 building_type_the_toad:0 "le Crapaud Noir"
 building_the_toad_desc:0 "La plus grande statue jamais érigée sur l'Île aux Crapauds domine le paysage, relique monolithique d'une civilisation depuis longtemps disparue. Taillée dans une pierre noire huileuse et inconnue, qui semble luire même en l'absence de lumière, elle prend la forme d'un immense crapaud — trapu, grotesque et d'un réalisme troublant. Nul ne sait qui l'a bâtie, ni dans quel dessein, et le sens qu'elle portait jadis s'est depuis longtemps perdu dans le temps. Pour la plupart, elle n'est rien de plus qu'une effigie grossière et sinistre, une curiosité étrange dans une terre déjà baignée de mystère. Pourtant, les habitants murmurent, à voix basse, d'étranges rêves qui visitent ceux qui dorment trop près, d'une chaleur troublante dans la pierre au toucher, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait depuis l'intérieur."
 building_type_the_toad_desc:0 "La plus grande statue jamais érigée sur l'Île aux Crapauds domine le paysage, relique monolithique d'une civilisation depuis longtemps disparue. Taillée dans une pierre noire huileuse et inconnue, qui semble luire même en l'absence de lumière, elle prend la forme d'un immense crapaud — trapu, grotesque et d'un réalisme troublant. Nul ne sait qui l'a bâtie, ni dans quel dessein, et le sens qu'elle portait jadis s'est depuis longtemps perdu dans le temps. Pour la plupart, elle n'est rien de plus qu'une effigie grossière et sinistre, une curiosité étrange dans une terre déjà baignée de mystère. Pourtant, les habitants murmurent, à voix basse, d'étranges rêves qui visitent ceux qui dorment trop près, d'une chaleur troublante dans la pierre au toucher, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait depuis l'intérieur."

 building_ax_hold:0 "Le Fort de la Hache"
 building_type_ax_hold:0 "Le Fort de la Hache"
 building_ax_hold_desc:0 "Le bastion de la Maison Xhore se dresse à la fois comme sanctuaire et forteresse, rempart de pierre et d'acier bâti pour endurer les tempêtes des Îles du Basilic. Niché au sommet de falaises déchiquetées et cerné d'eaux traîtresses, il fut conçu non seulement comme demeure, mais comme une place forte inébranlable d'où les pirates qarthiens des Îles Occidentales pouvaient lancer leurs raids tristement célèbres. Ses murs, usés mais redoutables, portent les cicatrices d'innombrables batailles, tandis que ses tours de guet vertigineuses offrent une vue ininterrompue sur la mer environnante, toujours à l'affût, tant des proies que des poursuivants"

 building_garden_of_malice_01:0 "Un Vaste Fort Envahi par la Végétation"
 building_type_garden_of_malice_01:0 "Un Vaste Fort Envahi par la Végétation"
 building_garden_of_malice_01_desc:0 "Une vaste enceinte envahie par la végétation encercle les ruines, ses pierres antiques à peine visibles sous des couches de lierre rampant et de mousse épaisse. En son cœur se dresse un donjon croulant, ses tours brisées et à moitié englouties par l'étreinte implacable de la nature. Le temps a effacé toute trace de l'histoire que ce lieu porta jadis, ne laissant derrière lui qu'un silence inquiétant et étouffant.\n\nPourtant, ceux qui osent franchir les portes brisées comprennent vite pourquoi nul n'a jamais reconquis ces ruines — cet endroit est un piège mortel. Des haies tortueuses, poussées à l'état sauvage et contre nature, forment un labyrinthe complexe, leurs chemins se déplaçant et se refermant comme des êtres vivants, entraînant les imprudents toujours plus profondément dans la confusion. Parmi cette verdure enchevêtrée se dissimulent des plantes aux couleurs impossibles et aux formes contre nature, leur beauté masquant des intentions mortelles. Certaines libèrent des spores qui étouffent les poumons, d'autres sécrètent des toxines qui font cloquer la peau, et quelques-unes se meuvent avec une intention troublante, guettant leurs proies pour fondre sur elles dès qu'elles s'approchent trop.\n\nLes légendes murmurent que quelque chose — peut-être les vestiges d'une sorcellerie oubliée, ou la présence persistante de quelque force qui régna jadis en ces lieux — maintient cette flore florissante d'une manière contraire à toute nature. Les ruines demeurent intactes, non parce qu'on les a oubliées, mais parce qu'on les redoute. Même les pillards les plus audacieux et les chasseurs de trésors les plus téméraires savent qu'il vaut mieux ne pas tenter la colère d'un lieu où les plantes elles-mêmes semblent avoir soif de sang."

 building_garden_of_malice_02:0 "Le Jardin de Malice"
 building_type_garden_of_malice_02:0 "Le Jardin de Malice"
 building_garden_of_malice_02_desc:0 "Le Jardin de Malice est une forteresse de mort superposée, bâtie de pierre noire huilée et ceinte de défenses mortelles. Un vaste labyrinthe mouvant de lianes épineuses, de fleurs toxiques et de haies tortueuses l'entoure, où la lumière pénètre à peine et où rôdent des prédateurs invisibles. Au-delà du labyrinthe s'étend une douve noire grouillante d'horreurs, cernée de murailles vertigineuses gardées par de silencieuses sentinelles. En son cœur se dresse un donjon valyrien, intact malgré le temps, couronné d'un arbre pétrifié dont les racines semblent se nourrir de la forteresse elle-même. Plus qu'une place forte, le Jardin est un lieu où la terre elle-même cherche à anéantir les intrus."

 building_sapphire_quarter:0 "Le Quartier des Saphirs"
 building_type_sapphire_quarter:0 "Le Quartier des Saphirs"
 building_sapphire_quarter_desc:0 "Le Quartier des Saphirs est un vaste district fortifié, perché au sommet de la plus haute colline de Gogossos. Jadis domaine des [dragonlords|El] d'antan, il sert désormais d'enclave exclusive aux plus illustres maîtres d'esclaves et princes marchands de la cité. Seule l'élite peut résider entre ses murs, car ici ne se dressent que de grands manoirs et palais — bâtis dans un marbre étincelant et parés d'or. Ses marchés privés se drapent des soieries les plus fines, réservées à ceux qui peuvent s'offrir des luxes hors de portée du commun des hommes."

 building_crimson_gate:0 "La Porte Cramoisie"
 building_type_crimson_gate:0 "La Porte Cramoisie"
 building_crimson_gate_desc:0 "La Porte Cramoisie constitue l'unique accès terrestre à Gogossos, un bastion vertigineux de Pierre Noire Valyrienne qui surplombe le pont périlleux menant à la cité. Sa surface absorbe la lumière, imprégnée de sombre sorcellerie et teintée de cramoisi par d'antiques rituels de sang. S'élevant à cent quarante pieds de hauteur, ce corps de garde inspire à la fois émerveillement et effroi, ses murs couronnés de statues de dragons dont les yeux de pierres précieuses semblent presque vivants. Plus qu'une simple barrière, la Porte Cramoisie est un monument à la puissance oubliée de Gogossos et au sombre héritage de Valyria."

 building_glittering_pits_01:0 "Les Puits Scintillants"
 building_type_glittering_pits_01:0 "Les Puits Scintillants"
 building_glittering_pits_01_desc:0 "Les jungles de Gogossos et l'infâme Île des Larmes forment une vaste étendue sauvage et indomptée — une terre grouillant à la fois de périls et de richesses inimaginables. Véritable trésor de ressources naturelles, son feuillage dense et ombragé dissimule des merveilles sans mesure pour quiconque ose braver ses dangers.\n\nParmi ses trésors les plus convoités figurent diamants et saphirs, qui scintillent au plus profond de la terre comme l'essence même des étoiles emprisonnée. Ces gemmes précieuses, rares et d'une qualité sans égale, ont fait de la région une légende chuchotée parmi marchands et chercheurs de fortune. Bien que les mines y demeurent modestes, leur rendement est prodigieux, chaque excavation mettant au jour des pierres d'une brillance à couper le souffle."

 building_glittering_pits_02:0 "Les Cavernes Chatoyantes"
 building_type_glittering_pits_02:0 "Les Cavernes Chatoyantes"
 building_glittering_pits_02_desc:0 "À mesure que les mines s'étendent, elles se déploient en un vaste réseau de tunnels souterrains, serpentant sous le sol de la jungle à l'image des racines des arbres antiques qui le surplombent. Les parois scintillent de pierres précieuses, leurs couleurs se reflétant dans la faible lueur des torches, tandis que des chambres cachées sont découvertes, révélant de riches veines attendant d'être exploitées. Cependant, à mesure que les mineurs creusent plus profondément, la jungle commence à résister — des racines percent les murs, des spores toxiques persistent dans l'air, et d'étranges créatures invisibles s'agitent dans l'obscurité."

 building_glittering_pits_03:0 "Les Profondeurs Étoilées"
 building_type_glittering_pits_03:0 "Les Profondeurs Étoilées"
 building_glittering_pits_03_desc:0 "Les Profondeurs Étoilées constituent la partie la plus riche et la plus périlleuse des mines gogossiennes — un vaste labyrinthe de tunnels et de cavernes scintillantes où saphirs sans défaut et diamants massifs captent la moindre lueur, évoquant un ciel étoilé sous terre. Les mineurs s'échinent sans relâche à en extraire les trésors, bien que le danger croisse à mesure qu'ils s'enfoncent. Dans les chambres les plus basses, d'étranges tremblements, une chaleur oppressante et des rumeurs de choses contre nature ont rendu certaines zones interdites. C'est un lieu de grande richesse et de plus grand péril encore — où creuser trop profond pourrait réveiller quelque chose qu'il valait mieux laisser enseveli."

 building_darkreach_quay_01:0 "Le Quai de Sombre-Rive"
 building_type_darkreach_quay_01:0 "Le Quai de Sombre-Rive"
 building_darkreach_quay_01_desc:0 "Le Quai de Sombre-Rive est le cœur humble mais vital du commerce de Gogossos, première étape de la grande infrastructure portuaire de la cité. Port modeste de pierre et de bois, il s'avance dans les eaux sombres de la baie, ses quais usés grinçant sous le poids des navires à l'arrivée. Bien que modeste, il occupe une position stratégique qui en fait le principal point d'entrée pour marchands, contrebandiers et aventuriers en quête de fortune à Gogossos"

 building_darkreach_quay_02:0 "Le Port de Sombre-Rive"
 building_type_darkreach_quay_02:0 "Le Port de Sombre-Rive"
 building_darkreach_quay_02_desc:0 "Avec l'expansion de l'empire commercial de Gogossos, le Port de Sombre-Rive s'est mué en un carrefour commercial animé, bien loin de ses modestes débuts. Les quais ont été renforcés de pierre et de bois robuste, permettant à de plus grands navires marchands de mouiller en sécurité et de décharger leurs cargaisons exotiques. De nouvelles jetées s'avancent plus loin dans les eaux sombres, accueillant un flot croissant de navires venus de terres lointaines, attirés par les richesses des saphirs, des diamants et des denrées rares de la jungle de Gogossos."

 building_darkreach_quay_03:0 "Le Port de Marée-Noire"
 building_type_darkreach_quay_03:0 "Le Port de Marée-Noire"
 building_darkreach_quay_03_desc:0 "Avec la renaissance de Gogossos, son port marchand jadis modeste s'est transformé en Port de Marée-Noire, colossal bastion de commerce et de puissance navale. N'étant plus une simple étape pour les marchands, il est devenu un épicentre florissant du commerce international, attirant marchands, mercenaires et chercheurs de fortune venus de tout le monde connu.\n\nLe port est désormais fortifié de Pierre Noire Valyrienne antique, ses puissantes murailles ceignant les quais animés, offrant une défense inégalée contre raids et sièges. Ces imposants remparts, reforgés à partir des ruines du passé, témoignent de la résurgence de la cité, garantissant que la richesse et l'influence de Gogossos demeurent intouchables."

 building_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
 building_type_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
 building_last_dragon_tower_01_desc:0 "La dernière Tour du Dragon subsistant hors de [valyria|E], bâtie dans les derniers jours avant le [doom|E], se dresse comme un monument à la fois à la puissance et à la tragédie. Conçue à l'origine pour abriter la famille [dragonlord|E] régnante de Gogossos, ses halls devaient symboliser leur règne éternel — mais le destin en décida autrement. Lorsque la famille périt dans le [doom_of_valyria|E], la tour devint la relique silencieuse d'un empire perdu, sa présence projetant une ombre immense sur la cité.\n\nAujourd'hui, elle sert un nouveau maître — l'Archonte le plus puissant de Gogossos et sa famille, qui règnent depuis ses hauteurs vertigineuses. N'étant plus seulement un symbole de la grandeur valyrienne, la Tour du Dragon rappelle aux classes inférieures, aux esclaves et aux rebelles en puissance la brutale hiérarchie de la cité. Elle se dresse comme un témoignage inébranlable de domination, un avertissement permanent que l'élite de Gogossos écrasera quiconque osera se soulever contre elle."

 # Valyria
 building_type_valyria_volcano:0 "L'une des Quatorze Flammes"
 building_valyria_volcano_01:0 "Mont Gaelithox"
 building_type_valyria_volcano_01:0 "$building_type_valyria_volcano$"
 building_valyria_volcano_01_desc:0 "Gaelithox est l'un des plus redoutables volcans parmi les légendaires Quatorze Flammes de [valyria|E]. Dominant le paysage environnant, son sommet demeure perpétuellement enveloppé d'un épais voile de fumée et de cendres. Les flancs du volcan portent la marque d'anciennes coulées de lave, désormais solidifiées en formations rocheuses noires et déchiquetées, vestiges du [doom|E]."

 building_valyria_volcano_02:0 "Rhazalhar"
 building_type_valyria_volcano_02:0 "$building_type_valyria_volcano$"
 building_valyria_volcano_02_desc:0 "Rhazalhar est le plus vaste des Quatorze Flammes, colosse de fureur en fusion et de puissance ancestrale. Son sommet, constamment voilé de fumée et de cendres, perce les cieux et projette son ombre sur le paysage environnant. Des fleuves de lave s'écoulent depuis son cœur ardent, traçant des sentiers lumineux à travers la roche volcanique sombre. En raison des températures extrêmes qui règnent autour du volcan, toute exploitation minière y est impossible."

 building_valyria_volcano_03:0 "Epaekros"
 building_type_valyria_volcano_03:0 "$building_type_valyria_volcano$"
 building_valyria_volcano_03_desc:0 "Epaekros est plus dangereux que les autres volcans, une beauté sauvage aux falaises instables qui font pleuvoir des roches sur les randonneurs, et aux sols glissants qui provoquent des chutes mortelles. Ceux qui atteignent son sommet connaissent souvent une fin tragique, victimes d'un veur de feu ou d'un [dragon|El] ayant fait de ces lieux son nid. Pourtant, pour ceux qui parviennent à s'enfoncer dans le volcan, richesses, or et métaux précieux abondent."

 building_valyria_volcano_04:0 "Tartarax"
 building_type_valyria_volcano_04:0 "$building_type_valyria_volcano$"
 building_valyria_volcano_04_desc:0 "S'élevant haut dans le ciel, bien que moins haut que Rhazalhar, Tartarax est un volcan plus effilé mais plus profond, dont le sommet à la forme singulière offre un site de nidification idéal pour toute créature éprise de feu. Ses cavernes et tunnels profonds offrent d'abondantes opportunités minières, mais aussi la mort. Lave et créatures hostiles abondent dans ce sombre et profond gouffre. Pourtant, la lueur de sa lave majestueuse, visible de loin dans l'obscurité de la nuit, demeure inoubliable."

 building_valyria_volcano_05:0 "Yontaryos"
 building_type_valyria_volcano_05:0 "$building_type_valyria_volcano$"
 building_valyria_volcano_05_desc:0 "Lorsque les anciens Valyriens découvrirent Yontaryos pour la première fois, il différait des autres volcans de la région. Petit et relativement bas, il ne renfermait que peu de magma et offrait un espace restreint pour la nidification des dragons. Il n'en demeurait pas moins utile : on pouvait encore y extraire des minéraux précieux, et sa taille modeste en faisait un lieu idéal pour les rituels et les sacrifices, bien que ses flammes ne brûlassent pas avec autant d'intensité que celles des autres."

 building_type_elyria_great_port_01:0 "Le Grand Port d'Elyria"
 building_elyria_great_port_01:0 "Le Grand Port d'Elyria"
 building_elyria_great_port_01_desc:0 "Le Grand Port d'Elyria est un immense chantier naval bâti à l'époque des [valyrian_freehold_short|E]. La position stratégique d'Elyria dans la Baie des Serfs procure à cette petite île un trafic considérable de navires, de marchandises et d'esclaves, que ce port colossal peut accueillir. Après l'effondrement des [valyrian_freehold_short|E], ce port s'est accaparé une part importante du commerce de la Baie des Serfs, devenant l'objet de l'envie de toute la région et de ses alentours."

 building_type_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
 building_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
 building_elyria_dragon_palace_01_desc:0 "Le Palais du Dragon est une somptueuse et grandiose résidence offrant tout ce qu'un lord pourrait désirer : de vastes salles, d'immenses halls de banquet, des bassins, des caves à vin, et bien davantage. Bâti à l'époque des [valyrian_freehold_short|E] pour loger le gouverneur d'Elyria, aucune dépense n'y fut épargnée. Aujourd'hui, il abrite le Duc d'Elyria, lui conférant splendeur et renommée."

 building_valyria_dead_volcano_01:0 "Syrabelos"
 building_type_valyria_dead_volcano_01:0 "$building_type_valyria_volcano$"
 building_valyria_dead_volcano_01_desc:0 "Syrabelos est un volcan éteint, la lave qui coulait jadis en son sein s'est tarie depuis longtemps. Cela ne signifie pas pour autant qu'il soit inutile, car il demeure riche en minéraux et en métaux précieux à exploiter, et peut encore servir de refuge lors de raids ou de tempêtes."

 building_valyria_dead_volcano_01_02:0 "Mines de Syrabelos"
 building_type_valyria_dead_volcano_01_02:0 "$building_type_valyria_volcano$"
 building_valyria_dead_volcano_01_02_desc:0 "Les opérations minières ont repris à Syrabelos. Chaque jour, des esclaves descendent dans les puits pour extraire métaux précieux et autres matériaux de valeur au profit de leurs oppresseurs."

 building_valyria_dead_volcano_02:0 "Qazdarsos"
 building_type_valyria_dead_volcano_02:0 "$building_type_valyria_volcano$"
 building_valyria_dead_volcano_02_desc:0 "Qazdarsos fut jadis un volcan actif, mais ne l'est plus. Désormais endormi mais non silencieux, les cris des veurs de feu et, selon certains, même des fantômes, résonnent encore depuis ses profondeurs. Certains ont osé s'y aventurer sans être assez nombreux, et l'on ne les a jamais revus."

 building_valyria_dead_volcano_02_02:0 "Qazdarsos"
 building_type_valyria_dead_volcano_02_02:0 "$building_type_valyria_volcano$"
 building_valyria_dead_volcano_02_02_desc:0 "Les mines de Qazdarsos sont de nouveau pleinement opérationnelles. Chaque jour, des esclaves en extraient richesses et or pour leurs maîtres. Pourtant, des récits d'êtres surnaturels et de créatures maudites persistent quant à l'intérieur du volcan. Faut-il y voir la vérité, ou seulement les élucubrations d'esclaves ? Voilà une autre question..."

 building_royal_barracks_of_valyria_01:0 "Les Baraquements en Ruines de Valyria"
 building_type_royal_barracks_of_valyria_01:0 "Les Baraquements en Ruines de Valyria"
 building_royal_barracks_of_valyria_01_desc:0 "Jadis de grands baraquements des [valyrian_freehold_short|E] destinés à défendre la cité, ils ne sont désormais plus qu'un amas de gravats."
 building_type_royal_barracks_of_valyria_01_desc:0 "Jadis de grands baraquements des [valyrian_freehold_short|E] destinés à défendre la cité, ils ne sont désormais plus qu'un amas de gravats."

 building_royal_barracks_of_valyria_02:0 "Les Baraquements Royaux de Valyria"
 building_type_royal_barracks_of_valyria_02:0 "Les Baraquements Royaux de Valyria"
 building_royal_barracks_of_valyria_02_desc:0 "Les Baraquements Royaux de Valyria, restaurés et bâtis sur les anciennes ruines, voient désormais gardes et soldats aller et venir pour assurer la sécurité des voyageurs et des citoyens."

 building_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
 building_type_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
 building_great_arena_of_valyria_01_desc:0 "Jadis une grande arène emplie de gladiateurs et de spectateurs, elle n'est plus aujourd'hui que ruines. La restaurer coûtera cher, mais elle pourrait redonner la joie au peuple."
 building_type_great_arena_of_valyria_01_desc:0 "Jadis une grande arène emplie de gladiateurs et de spectateurs, elle n'est plus aujourd'hui que ruines. La restaurer coûtera cher, mais elle pourrait redonner la joie au peuple."

 building_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
 building_type_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
 building_great_arena_of_valyria_02_desc:0 "Désormais reconstruite, la Grande Arène attire des milliers de spectateurs venus assister à des tournois et des jeux sanglants où professionnels et esclaves meurent dans le sable pour le divertissement du peuple."

 building_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
 building_type_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
 building_great_library_of_valyria_01_desc:0 "Les vestiges en ruine de la grande bibliothèque pourraient être restaurés afin d'abriter à nouveau de grandes œuvres d'art et de littérature."
 building_type_great_library_of_valyria_01_desc:0 "Les vestiges en ruine de la grande bibliothèque pourraient être restaurés afin d'abriter à nouveau de grandes œuvres d'art et de littérature."

 building_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
 building_type_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
 building_great_library_of_valyria_02_desc:0 "La Grande Bibliothèque de Valyria, restaurée, renferme de grandes œuvres d'art, de littérature et de philosophie. Érudits et académiciens y étudient textes anciens et parchemins."

 building_valyria_veilspire_peak:0 "Le Pic du Voile"
 building_type_valyria_veilspire_peak:0 "Le Pic du Voile"
 building_valyria_veilspire_peak_desc:0 "Le Pic du Voile est le plus haut sommet montagneux de toute la péninsule valyrienne, et ce, même avant le [doom|E]. Jadis destination d'un pèlerinage sacré réservé aux plus braves et aux plus forts, ce grand sommet représente une épreuve divine. On raconte que ceux qui parviennent à en atteindre le sommet en reviennent plus sages et plus savants."

 building_velakar_resort_01:0 "Un Ancien Établissement en Ruines"
 building_type_velakar_resort_01:0 "Un Ancien Établissement en Ruines"
 building_velakar_resort_01_desc:0 "Jadis un grand établissement thermal réservé aux [dragonlords|El] et aux riches marchands, cet établissement n'est plus aujourd'hui qu'un amas de briques."

 building_velakar_resort_02:0 "L'Illustre Établissement de Velakar"
 building_type_velakar_resort_02:0 "L'Illustre Établissement de Velakar"
 building_velakar_resort_02_desc:0 "L'Illustre Établissement de Velakar, désormais restauré, accueille gens de fortune et de rang venus se baigner et se délasser dans cet établissement majestueux, digne d'un archonte. Exploitant la chaleur volcanique pour réchauffer ses bains, et servi par des milliers de domestiques, c'est un spectacle qui mérite assurément d'être contemplé."

 building_lv_aurions_lost_expedition_01:0 "L'Expédition Perdue d'Aurion"
 building_type_lv_aurions_lost_expedition_01:0 "L'Expédition Perdue d'Aurion"
 building_lv_aurions_lost_expedition_01_desc:0 "Voici l'expédition perdue de l'Archonte autoproclamé de Valyria, Aurion Varezys. Cette plaine désolée est désormais le lieu de sépulture de trente mille hommes, réduits à de simples amas de métal et d'ossements, souillés par les radiations et les gaz toxiques des geysers de soufre. C'est en vérité un paysage infernal."

 building_type_lokirian_barracks_01:0 "Baraquements Lokiriens"
 building_type_lokirian_barracks_01_desc:0 "Les puissants Baraquements Lokiriens, réputés pour la qualité de leurs armes."
 building_lokirian_barracks_01:0 "Les Vestiges d'un Baraquement"
 building_lokirian_barracks_01_desc:0 "Jadis les puissants baraquements de Lokiria, aujourd'hui réduits à un simple amas de gravats."
 building_lokirian_barracks_02:0 "Baraquements Partiellement Restaurés"
 building_lokirian_barracks_02_desc:0 "Bien qu'une grande partie de sa splendeur passée soit perdue, ce baraquement a été rendu fonctionnel. Des soldats s'y entraînent, leurs voix résonnant à travers des halls encore inachevés."
 building_lokirian_barracks_03:0 "Les Puissants Baraquements de Lokiria"
 building_lokirian_barracks_03_desc:0 "Les baraquements de Lokiria, désormais reconstruits et fortifiés de pierre-dragon et d'acier valyrien. Des soldats y défilent jour et nuit, offrant un spectacle imposant et un cauchemar pour quiconque oserait en faire le siège."


 building_redwyrms_wrath_01:0 "Forteresse en Ruines"
 building_type_redwyrms_wrath_01:0 "Forteresse en Ruines"
 building_redwyrms_wrath_01_desc:0 "La Colère de la Guivre Rouge était une redoutable forteresse aux murs de pierre-dragon et aux flèches vertigineuses, jadis parée des crânes de dragons abattus, sinistres trophées de ses conquêtes. Gouvernée par le Lord Protecteur Taurion de Lokiria, elle fut un bastion de guerre et de domination, ses bannières cramoisies semant la terreur à travers le pays. Aujourd'hui en ruines, la Colère de la Guivre Rouge n'est plus que l'ombre de sa gloire passée, ses murs brisés et ses bannières fanées se dressant comme les reliques du règne violent de Lokiria."

 building_redwyrms_wrath_02:0 "La Colère de la Guivre Rouge"
 building_type_redwyrms_wrath_02:0 "Forteresse en Ruines"
 building_redwyrms_wrath_02_desc:0 "La Colère de la Guivre Rouge s'est relevée, ses murs de pierre-dragon restaurés dans leur sinistre gloire, dominant à nouveau le paysage comme symbole de terreur et de puissance. Parée une fois encore de crânes de [dragon|El] et de bannières cramoisies arborant le sceau du Dragon Rouge de Lokiria, la forteresse dégage une sombre détermination. Reconstruite à la fois comme monument à la guerre et déclaration de domination, la Colère de la Guivre Rouge inspire tout autant la crainte que le respect, sa renaissance témoignant d'un héritage durable de conquête."

 building_valyrian_gate_01:0 "Ruines de la Porte"
 building_type_valyrian_gate_01:0 "Ruines de la Porte"
 building_valyrian_gate_01_desc:0 "Ruines de la jadis grande Porte de Valyria, puissant symbole de richesse et de pouvoir, aujourd'hui réduite à un simple amas de briques."
 building_type_valyrian_gate_01_desc:0 "Ruines de la jadis grande Porte de Valyria, puissant symbole de richesse et de pouvoir, aujourd'hui réduite à un simple amas de briques."

 building_valyrian_gate_02:0 "La Grande Porte Valyrienne"
 building_type_valyrian_gate_02:0 "La Grande Porte Valyrienne"
 building_valyrian_gate_02_desc:0 "La Grande Porte de Valyria : sept portes et sept herses, façonnées et renforcées d'acier valyrien. Des milliers de marchands et de voyageurs franchissent chaque jour ces portes. D'immenses statues d'anciens héros se dressent au sommet de l'entrée."

 building_great_harbor_of_valyria_01:0 "Baie Propice à un Port"
 building_type_great_harbor_of_valyria_01:0 "Le Grand Port de Valyria"
 building_great_harbor_of_valyria_01_desc:0 "Cette baie est assez vaste et profonde pour y bâtir un grand port. Pour l'heure, il n'y a guère à y trouver, hormis du poisson."
 building_type_great_harbor_of_valyria_01_desc:0 "Cette baie est assez vaste et profonde pour y bâtir un grand port. Pour l'heure, il n'y a guère à y trouver, hormis du poisson."

 building_great_harbor_of_valyria_02:0 "Quais et Ateliers de Réparation"
 building_type_great_harbor_of_valyria_02:0 "Le Grand Port de Valyria"
 building_great_harbor_of_valyria_02_desc:0 "Pour faciliter le commerce et la construction navale, et établir un riche carrefour commercial ainsi qu'un contrôle maritime, nous devons bâtir un grand port. Pour l'heure, nous construirons de longs quais et des ateliers de réparation destinés à la production navale. Nous ajouterons également un bureau d'intendance pour le commerce et un bureau d'inspection chargé de taxer les marchandises et de veiller à ce qu'aucune contrebande n'entre dans notre cité."

 building_great_harbor_of_valyria_03:0 "Quais"
 building_type_great_harbor_of_valyria_03:0 "Le Grand Port de Valyria"
 building_great_harbor_of_valyria_03_desc:0 "La construction de quais et l'extension de l'infrastructure actuelle nous permettront d'accueillir davantage de navires et d'accroître le commerce entrant. Ces extensions serviront également à amarrer les navires militaires au service de notre flotte."

 building_great_harbor_of_valyria_04:0 "Grues et Fournitures Navales"
 building_type_great_harbor_of_valyria_04:0 "Le Grand Port de Valyria"
 building_great_harbor_of_valyria_04_desc:0 "En bâtissant de grandes grues, nous pourrons considérablement accroître l'efficacité de notre port et permettre à un plus grand nombre de navires d'arriver et de repartir. Nous édifierons également une zone d'approvisionnement naval près du port afin d'améliorer l'efficacité de la construction de nos navires de guerre. Grâce à ce Grand Port, nul ne pourra plus nous défier en mer."

 building_great_temple_of_valyria_01:0 "Colline Propice à un Temple"
 building_type_great_temple_of_valyria_01:0 "Le Temple du Dragon de Valyria"
 building_great_temple_of_valyria_01_desc:0 "Pour honorer et satisfaire les Dieux, il nous faudra un Grand Temple. Fort heureusement, il existe une colline près du Mont Tartarax que nous pourrions utiliser pour bâtir un Temple Magnifique et Illustre en l'honneur de nos Dieux Dragons. Sa proximité avec un volcan ne fait que mieux répondre à nos besoins."
 building_type_great_temple_of_valyria_01_desc:0 "Pour honorer et satisfaire les Dieux, il nous faudra un Grand Temple. Fort heureusement, il existe une colline près du Mont Tartarax que nous pourrions utiliser pour bâtir un Temple Magnifique et Illustre en l'honneur de nos Dieux Dragons. Sa proximité avec un volcan ne fait que mieux répondre à nos besoins."

 building_great_temple_of_valyria_02:0 "Salle de Prière et Lieu de Rassemblement"
 building_type_great_temple_of_valyria_02:0 "Le Temple du Dragon de Valyria"
 building_great_temple_of_valyria_02_desc:0 "Nous commencerons par une salle de prière richement décorée, emplie d'artefacts précieux — sculptures de dragons et de flammes, tapisseries représentant des dragons, braseros, et le plus fin marbre que nous puissions trouver. Nous édifierons également une salle ouverte distincte, destinée aux sacrifices humains."

 building_great_temple_of_valyria_03:0 "Arène des Bûchers"
 building_type_great_temple_of_valyria_03:0 "Le Temple du Dragon de Valyria"
 building_great_temple_of_valyria_03_desc:0 "Les Valyriens ont toujours brûlé leurs morts. Brûler nos défunts dans un Temple jouxtant notre volcan est une bien meilleure façon d'honorer ceux qui ont quitté ce monde. Nous agrandirons la salle ouverte déjà bâtie à cette fin. Des colonnes sculptées, des fleurs exotiques, ainsi qu'un autel de pierre noire destiné à remplacer les bûchers de bois utilisés pour les sacrifices humains et l'incinération des morts, y seront édifiés."

 building_great_temple_of_valyria_04:0 "Statues de Dragons"
 building_type_great_temple_of_valyria_04:0 "Le Temple du Dragon de Valyria"
 building_great_temple_of_valyria_04_desc:0 "Nul édifice de Valyria n'est véritablement achevé sans ses statues de dragons. Nous en bâtirons quatorze, une pour chaque Dieu. Chaque statue sera unique et majestueuse, afin d'honorer dignement nos Dieux."

 building_great_walls_of_valyria_01:0 "Vestiges Insignifiants de la Muraille"
 building_type_great_walls_of_valyria_01:0 "Les Grandes Murailles de Pierre Noire de Valyria"
 building_great_walls_of_valyria_01_desc:0 "C'est ici que se trouvent les vestiges des Grandes Murailles de Valyria. Il n'en reste presque rien, ces murailles ayant été détruites durant le [doom|E]. Les rares vestiges qui subsistent sont si endommagés qu'ils en sont inutilisables. Nous pourrions certes restaurer ces murailles dans leur ancienne grandeur, et nous devrions le faire. Il va sans dire qu'il s'agira là d'une entreprise fort coûteuse."

 building_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
 building_type_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
 building_great_walls_of_valyria_02_desc:0 "Les murailles de Valyria ont été entièrement restaurées, imposantes et vastes, encerclant la cité tout entière. Ces fortifications colossales sont si larges que douze chars pourraient y courir de front (et voilà pour toi, Volantis !). Tours de guet et douves bordent désormais leur périmètre, offrant des strates de défense supplémentaires. Les entrées sont renforcées de herses et de zones de tir, rendant presque impossible toute tentative d'envahir la cité par la force."

 building_great_dragonkeep_of_valyria_01:0 "Site du Palais"
 building_type_great_dragonkeep_of_valyria_01:0 "Le Grand Donjon du Dragon de Valyria"
 building_great_dragonkeep_of_valyria_01_desc:0 "Nous avons repéré un site propice à l'édification d'un grand palais. Il deviendra, à terme, un lieu de grandeur. Mais pour l'heure, il n'y a guère à y remarquer."
 building_type_great_dragonkeep_of_valyria_01_desc:0 "Nous avons repéré un site propice à l'édification d'un grand palais. Il deviendra, à terme, un lieu de grandeur. Mais pour l'heure, il n'y a guère à y remarquer."

 building_great_dragonkeep_of_valyria_02:0 "Pose des Fondations"
 building_type_great_dragonkeep_of_valyria_02:0 "Le Grand Donjon du Dragon de Valyria"
 building_great_dragonkeep_of_valyria_02_desc:0 "Pour loger les souverains de cette grande cité, il nous faudra un palais imposant. Non, le plus grand palais que le monde ait jamais vu. Cela exigera, bien entendu, quantité d'esclaves et d'or, mais ces ressources peuvent être acquises. Ce palais témoignera de la grandeur valyrienne. Nous commencerons par un donjon, et poursuivrons notre expansion à partir de là."

 building_great_dragonkeep_of_valyria_03:0 "Murailles Extérieures"
 building_type_great_dragonkeep_of_valyria_03:0 "Le Grand Donjon du Dragon de Valyria"
 building_great_dragonkeep_of_valyria_03_desc:0 "Pour garantir que ce donjon soit imprenable, nous bâtirons nos murailles exclusivement en pierre noire. Ces murs hauts et épais repousseront tous les ennemis et les indésirables. Édifier des murailles aussi hautes et épaisses, uniquement en pierre noire, sera bien entendu fort coûteux."

 building_great_dragonkeep_of_valyria_04:0 "Murailles Intérieures et Ornements"
 building_type_great_dragonkeep_of_valyria_04:0 "Le Grand Donjon du Dragon de Valyria"
 building_great_dragonkeep_of_valyria_04_desc:0 "Maintenant que nos murailles extérieures sont bâties, il nous faut ériger des murailles intérieures afin de renforcer la sécurité et l'efficacité de nos fortifications. Portes, herses et créneaux y seront construits. Par ailleurs, nous parerons le grand donjon de soieries, de tapisseries, de trophées et de bien d'autres ornements pour afficher notre splendeur."

 building_procrazion_01:0 "Grand Château Abandonné"
 building_type_procrazion_01:0 "Procrazion"
 building_procrazion_01_desc:0 "Procrazion fut jadis un bastion de la puissance valyrienne, dressé au sommet de la montagne centrale, au cœur de la cité. Avant le [doom|E], ce grand château servait de carrefour militaire et politique, agissant comme centre de défense pour toute la région. Bien qu'une grande partie de sa structure demeure intacte, le temps n'a guère épargné ses halls jadis glorieux. Les ponts de pierre qui le reliaient autrefois à la cité environnante sont aujourd'hui détruits, et l'intérieur porte les marques évidentes de la décrépitude. Les vertigineuses Tours du Dragon se dressent encore, mais leurs chambres sont vides, et la forge autrefois active sommeille désormais. Malgré cela, sa position surélevée et ses points d'accès limités continuent d'offrir un avantage stratégique. Bien qu'encore imposant, Procrazion n'est plus que l'ombre de lui-même, attendant d'être restauré dans sa gloire d'antan."

 building_procrazion_02:0 "Procrazion"
 building_type_procrazion_02:0 "Procrazion"
 building_procrazion_02_desc:0 "Procrazion a retrouvé sa gloire d'antan, se dressant fièrement au sommet de la montagne, au cœur de la cité. Ce grand château est de nouveau relié à la ville en contrebas par des ponts reconstruits, offrant un accès sans recourir aux dragons. Les Tours du Dragon ont elles aussi été restaurées, offrant entrée et sortie aux majestueuses créatures, tandis que les tours à dôme brillent comme avant le [doom|E]. À l'intérieur, le château est équipé de toutes les commodités dignes d'un lord de la région, offrant confort et luxe même en cas de siège. L'unique forge située sur un flanc de la montagne a été réactivée, canalisant à nouveau la lave pour forger de puissantes armes. Sa position surélevée, conjuguée à sa restauration et à ses points d'accès limités, garantit qu'il demeure presque imprenable, capable de résister à toute menace. Désormais pleinement restauré, Procrazion sert non seulement de bastion défensif, mais aussi de symbole de la résurgence de la cité."

 building_eternal_flame_temple_01:0 "Temple Abandonné"
 building_type_eternal_flame_temple_01:0 "Le Temple de la Flamme Éternelle"
 building_eternal_flame_temple_01_desc:0 "Le Temple de la Flamme Éternelle était présumément le point de jonction entre les Anciens Dieux de Valyria et les guerriers valyriens. Outre son rôle de centre religieux pour le commun du peuple, le temple s'élevait jadis fièrement comme symbole de la puissance religieuse de Valyria ; il ne reste aujourd'hui que poussière et abandon. De nos jours, il ne subsiste qu'un vague souvenir de ce qui fut jadis un vénéré Haut Temple de la cosmogonie valyrienne."

 building_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
 building_type_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
 building_eternal_flame_temple_02_desc:0 "Le Temple de la Flamme Éternelle a désormais été renouvelé et se dresse comme symbole de puissance, de religion et de pouvoir. Ses murs restaurés racontent les récits des anciens dieux et regorgent de légendes jadis connues des seuls anciens Valyriens. Le commun du peuple peut désormais goûter au luxe et rêver de ce qu'étaient dragons et magie avant le [doom|E]. Des guerriers viennent y prier, en quête de la rage et de la puissance des dragons qui les précédèrent. Le temple brille avec éclat, tel un phare de foi religieuse, d'espoir, et de la puissance valyrienne, ancienne comme nouvelle."

 building_red_guard_barracks_01:0 "Baraquements Abandonnés"
 building_type_red_guard_barracks_01:0 "Les Baraquements de la Garde Rouge"
 building_red_guard_barracks_01_desc:0 "Jadis fier quartier général de la Garde Rouge d'élite de la cité, il gît aujourd'hui abandonné, adossé aux antiques murailles de la ville. Le temps tout-puissant a rongé ses abords comme son intérieur, où créneaux brisés et charpente rouillée témoignent de son abandon depuis le [doom|E]. À l'arrière, deux Tours du Dragon ne sont plus que le souvenir de ce qui fut jadis une puissance militaire. Les chambres ne sont désormais hantées que par les fantômes du temps révolu et d'une force perdue. Malgré sa décrépitude, ces baraquements aspirent à leur restauration, pour redevenir le formidable bouclier de la cité."

 building_red_guard_barracks_02:0 "Les Baraquements de la Garde Rouge"
 building_type_red_guard_barracks_02:0 "Les Baraquements de la Garde Rouge"
 building_red_guard_barracks_02_desc:0 "Minutieusement restaurés dans une puissance presque égale à celle d'antan, les Baraquements de la Garde Rouge constituent le nouveau foyer des défenseurs de la cité, jouxtant les glorieuses murailles de la ville. La structure de pierre rappelle sa gloire passée, renforcée, puissante, et emplie de récits et de cicatrices. Les Tours du Dragon exhalent vie et vitalité, à l'image des jours où de véritables dragons rugissaient dans les hauts cieux. Les baraquements ne sont plus hantés par des fantômes, mais habités par la Garde Rouge d'élite récemment restaurée, animée d'une discipline vivifiante, d'une excellence et d'une gloire sans égales. Mêlant subtilement l'ancien et le nouveau, l'édifice protège désormais de nouveau la cité et abrite tous ceux qui s'y trouvent."

 building_red_guard_training_compound_01:0 "Complexe d'Entraînement Abandonné"
 building_type_red_guard_training_compound_01:0 "Le Complexe d'Entraînement de la Garde Rouge"
 building_red_guard_training_compound_01_desc:0 "Des murs décrépits ne racontent plus les récits des Gardes Rouges disparus qui s'entraînaient ici. Ce Complexe d'Entraînement fut jadis un édifice respecté et admiré, empli de dragons, de guerriers et de chefs, mais il gît aujourd'hui abandonné et vide, incapable de rendre compte de son énergie et de sa gloire depuis longtemps oubliées. Armes, cachots et équipements rouillés s'y trouvent encore, laissant chacun s'interroger sur ce qu'il put être en son temps de gloire."

 building_red_guard_training_compound_02:0 "Le Complexe d'Entraînement de la Garde Rouge"
 building_red_guard_training_compound_02_desc:0 "Force, honneur et puissance : voilà ce que l'on découvre en contemplant le Complexe d'Entraînement de la Garde Rouge restauré. Empli d'hommes s'efforçant de s'honorer en rejoignant la Garde Rouge d'élite, le complexe accueille stratèges, chefs et guerriers, tous animés du désir d'exceller. Ceint de piliers glorieux qui l'entourent avec grâce, et surmonté d'un toit percé de fenêtres rouges rappelant que seul le ciel en est la limite, cet édifice forme désormais les plus grands guerriers et les plus fins chefs."

 building_type_zanpur_volcano_01:0 "Mont Zanpur"
 building_zanpur_volcano_01:0 "Mont Zanpur"
 building_zanpur_volcano_01_desc:0 "Zanpur est le plus occidental des deux volcans jumeaux des îles Marahai."

 building_type_yovesh_volcano_01:0 "Mont Yovesh"
 building_yovesh_volcano_01:0 "Mont Yovesh"
 building_yovesh_volcano_01_desc:0 "Yovesh est le plus oriental des deux volcans jumeaux des îles Marahai."


 building_the_veiled_fortress_01:0 "Les Ruines d'une Forteresse"
 building_type_the_veiled_fortress_01:0 "Les Ruines d'une Forteresse"
 building_type_the_veiled_fortress_01_desc:0 "Nichées au plus profond des montagnes escarpées du nord valyrien, en Anogaria, gisent les ruines croulantes d'une forteresse jadis puissante. On la croit avoir été, il y a fort longtemps, la formidable gardienne des confins septentrionaux de Valyria, ses murailles vertigineuses et ses créneaux protégeant le royaume des menaces lointaines."
 building_the_veiled_fortress_01_desc:0 "Nichées au plus profond des montagnes escarpées du nord valyrien, en Anogaria, gisent les ruines croulantes d'une forteresse jadis puissante. On la croit avoir été, il y a fort longtemps, la formidable gardienne des confins septentrionaux de Valyria, ses murailles vertigineuses et ses créneaux protégeant le royaume des menaces lointaines."

 building_the_veiled_fortress_02:0 "La Forteresse Renaissante"
 building_type_the_veiled_fortress_02:0 "La Forteresse Renaissante"
 building_the_veiled_fortress_02_desc:0 "Les ruines commencent à frémir d'une vie nouvelle. Parmi la pierre brisée et les vestiges couverts de lierre, des échafaudages s'accrochent désormais aux murs antiques, tandis qu'ouvriers et tailleurs de pierre s'échinent à ressusciter la forteresse jadis fière. Les échos des coups de marteau résonnent dans l'air montagnard, se mêlant aux hurlements du vent qui se souvient encore des jours de gloire valyrienne. Bien qu'il ne subsiste que des fragments de sa grandeur d'antan, les fondations se raffermissent chaque jour, pierre après pierre ; la forteresse renaît, reconquérant sa place de phare de puissance dans les étendues sauvages du nord d'Anogaria."

 building_type_the_veiled_fortress_02_desc:0 "Les ruines commencent à frémir d'une vie nouvelle. Parmi la pierre brisée et les vestiges couverts de lierre, des échafaudages s'accrochent désormais aux murs antiques, tandis qu'ouvriers et tailleurs de pierre s'échinent à ressusciter la forteresse jadis fière. Les échos des coups de marteau résonnent dans l'air montagnard, se mêlant aux hurlements du vent qui se souvient encore des jours de gloire valyrienne. Bien qu'il ne subsiste que des fragments de sa grandeur d'antan, les fondations se raffermissent chaque jour, pierre après pierre ; la forteresse renaît, reconquérant sa place de phare de puissance dans les étendues sauvages du nord d'Anogaria."

 building_the_veiled_fortress_03:0 "La Forteresse Voilée"
 building_type_the_veiled_fortress_03:0 "La Forteresse Voilée"
 building_the_veiled_fortress_03_desc:0 "Restaurée dans sa gloire d'antan, la forteresse se dresse désormais comme un monument de puissance et d'autorité au sein des cimes du nord — non plus une ruine, mais un centre de commandement pour la résurgence de la puissance valyrienne. Connue sous le nom de Forteresse Voilée, ses murailles vertigineuses et ses créneaux d'obsidienne acérés ne sont pas voilés par le secret, mais par l'omniprésente brume montagnarde qui roule sur elle comme un manteau de domination. En son cœur repose une fosse à dragons nouvellement forgée — vaste, renforcée, et couronnée d'un dôme ouvert d'acier noir, conçu pour abriter les puissants Lords dragons revenus reconquérir leur place dans l'histoire. La forteresse n'est plus une simple relique ; elle est désormais un siège de force, d'ambition et de feu. Depuis ses hauteurs, les cieux appartiennent à ceux qui chevauchent la tempête."

 building_type_the_veiled_fortress_03_desc:0 "Restaurée dans sa gloire d'antan, la forteresse se dresse désormais comme un monument de puissance et d'autorité au sein des cimes du nord — non plus une ruine, mais un centre de commandement pour la résurgence de la puissance valyrienne. Connue sous le nom de Forteresse Voilée, ses murailles vertigineuses et ses créneaux d'obsidienne acérés ne sont pas voilés par le secret, mais par l'omniprésente brume montagnarde qui roule sur elle comme un manteau de domination. En son cœur repose une fosse à dragons nouvellement forgée — vaste, renforcée, et couronnée d'un dôme ouvert d'acier noir, conçu pour abriter les puissants Lords dragons revenus reconquérir leur place dans l'histoire. La forteresse n'est plus une simple relique ; elle est désormais un siège de force, d'ambition et de feu. Depuis ses hauteurs, les cieux appartiennent à ceux qui chevauchent la tempête."
l_french:
  # Braavos
  building_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_type_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_agot_EE_titan_of_braavos_desc:0 "Inclus par le célèbre scribe westerosi Lomas Longstrider parmi les Merveilles créées par l’homme, le Titan de Braavos constitue la première ligne de défense de la Cité Libre de Braavos. Il garde l’étroit passage menant à la lagune où la cité est installée. Cette statue monumentale de granite et de bronze représente un guerrier agissant à la fois comme forteresse et phare. Des meurtrières sous la jupe blindée de la statue et des fentes pour flèches sur toute sa cuirasse offrent une défense quasiment impénétrable contre les navires ennemis entrant dans la lagune"

  building_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_type_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_agot_EE_sealords_palace_desc:0 "Le Palais du Seigneur de la Mer est la résidence du dirigeant de Braavos. Sous les dômes et les tours de ce vaste palais se trouve une ménagerie exotique d’oiseaux et de bêtes venues du monde entier"

  # Volantis
  building_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_type_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_agot_EE_black_walls_of_old_volantis_desc:0 "Au cœur de Volantis. Érigés par l’ancien Freehold valyrien, ces immenses murs de pierre noire fusionnée protègent une série de palais, de cours, de tours et de temples. Seules les personnes dont le sang remonte à l’ancienne lignée valyrienne, le Vieux Sang, sont autorisées à y demeurer"

  building_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_type_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_agot_EE_volantis_harbor_desc:0 "La puissance de Volantis provient en partie de son grand port, grâce à sa position géographique privilégiée. Cet immense emplacement en forme de croissant est construit à l’embouchure du Rhoyne et pourrait contenir la totalité de Braavos en son sein."

  building_agot_EE_the_long_bridge:0 "Long Pont"
  building_type_agot_EE_the_long_bridge:0 "Long Pont"
  building_agot_EE_the_long_bridge_desc:0 "Le Long Pont relie les deux moitiés de Volantis et est le plus long pont du monde connu. Construit par l’ancienne Valyria à son apogée en pierre fusionnée, on dit qu’il peut supporter le poids de mille éléphants"

  building_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Seigneur de la Lumière"
  building_type_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Seigneur de la Lumière"
  building_agot_EE_temple_of_the_lord_of_light_desc:0 "Cet immense temple s’élève bien au‑dessus de tous les autres bâtiments de la ville. Ses couleurs dorées, rouges et orangées éblouissantes en font un spectacle inoubliable. Protégé par la Main de Feu, ce temple sert R’hllor, le Seigneur de la Lumière, et constitue peut‑être l’un des plus grands témoignages de sa puissance"

  building_agot_EE_volantis_walls:0 "Les Murs de Volantis"
  building_type_agot_EE_volantis_walls:0 "Les Murs de Volantis"
  building_agot_EE_volantis_walls_desc:0 "Bien qu’ils ne soient pas aussi impressionnants que ceux de l’Ancienne Volantis, les murs de Volantis feront réfléchir tout assaillant à deux fois avant d’assaillir la ville"

  # Rhoyne
  building_agot_EE_nymeria_palace_01:0 "Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_01:0 "Palais de Nymeria"
  building_agot_EE_nymeria_palace_01_desc:0 "Au cœur de Ny Sar se trouvent les ruines du Palais de Nymeria abandonné depuis que l’ancien Freehold valyrien a vaincu le prince Garin lors de la Seconde Guerre des Épices, ses murs de marbre rose et vert, ses dômes imposants et ses hautes flèches demeurent la coquille hantée de sa splendeur passée, toute vie a déserté cet endroit lorsque Nymeria s’est réfugiée en Dorne"

  building_agot_EE_nymeria_palace_02:0 "Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_02:0 "Palais de Nymeria"
  building_agot_EE_nymeria_palace_02_desc:0 "Érigé de nouveau au cœur de Ny Sar, le Palais de Nymeria a été restauré avec minutie, témoignage de la résilience et de l’héritage rhoynar, le marbre vert et rose resplendit sous le soleil et ses dômes et flèches dominent l’horizon, effaçant presque les souvenirs de son passé tragique"

  building_agot_EE_palace_of_love_01:0 "Palais du Chagrin"
  building_type_agot_EE_palace_of_love_01:0 "Palais du Chagrin"
  building_agot_EE_palace_of_love_01_desc:0 "Le Palais du Chagrin se dresse comme un sombre rappel du destin qui a frappé Chroyane la Cité des Festivals, ses tours effondrées couvertes de mousse et de vignes sombres ne révèlent rien de la beauté qu’incarnait autrefois le Palais de l’Amour, statues enfoncées et hommes de pierre hantent ses salles brumeuses et en ruines"

  building_agot_EE_palace_of_love_02:0 "Palais de l’Amour"
  building_type_agot_EE_palace_of_love_02:0 "Palais de l’Amour"
  building_agot_EE_palace_of_love_02_desc:0 "Le Palais de l’Amour retrouve les rives du Rhoyne dans une renaissance éblouissante, ses tours élancées ornées de mosaïques colorées et de sculptures délicates célèbrent la vie et l’amour, les fontaines étincelantes alimentent de luxuriants jardins débordant de fleurs sur chaque terrasse, sous ses grands dômes les mariages sont de nouveau bénis, insufflant à Chroyane la promesse de nouveaux commencements"

  building_agot_EE_bridge_of_dream_01:0 "Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_01:0 "Pont des Rêves"
  building_agot_EE_bridge_of_dream_01_desc:0 "Autrefois rival du Long Pont de Volantis, le Pont des Rêves se dresse maintenant au‑dessus du Rhoyne dans une épaisse brume, ses arches de pierre qui s’élevaient à douze mètres au‑dessus de la rivière se sont effondrées sous la mousse dense et les vignes noires, désormais lieu des hommes de pierre, il demeure un monument silencieux et pourrissant à la fierté perdue des Rhoynars"

  building_agot_EE_bridge_of_dream_02:0 "Pont des Rêves"
  building_type_agot_EE_bridge_of_dream_02:0 "Pont des Rêves"
  building_agot_EE_bridge_of_dream_02_desc:0 "Le Pont des Rêves s'étend de nouveau sur le Rhoyne dans toute sa splendeur. S'élevant à quarante pieds au-dessus du fleuve, ses arches de pierre pâle se dressent avec force et fierté. De somptueux jardins bordent la travée de bois du pont, éclatants de fleurs aux mille couleurs. Ce grand pont, jadis perdu dans l'oubli et les ruines, renaît aujourd'hui. Symbole de la fierté et de la résilience rhoynaise, il domine une fois de plus les flots du Rhoyne"

  # Meereen
  building_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_type_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_agot_EE_great_pyramid_of_meereen_desc:0 "De loin le plus grand bâtiment de la ville, la Grande Pyramide de Meereen a été construite par une petite armée d’esclaves, dont mille sont morts pendant sa construction, la pyramide sert de centre administratif à Meereen et les dirigeants de la ville utilisent la Grande Salle pour recevoir leurs sujets depuis des siècles"

  # Asshai
  building_stygai_01:0 "Cité Hantée de Stygai"
  building_type_stygai_01:0 "Stygai"
  building_stygai_01_desc:0 "Stygai, cité énigmatique et antique drapée dans le cœur obscur des Terres de l'Ombre, demeure l'un des mystères les plus terrifiants du monde. D'une ancienneté insondable et enveloppée d'une obscurité éternelle, elle s'élève en monument d'une ère oubliée et mystérieuse. Même les plus audacieux des liants de l'ombre n'osent s'aventurer dans ses rues abandonnées. Ses flèches de pierre et ses ruelles labyrinthiques résonnent des murmures des défunts dont les esprits torturés sont liés à jamais à ce sol maudit. Voilée de secrets, ses véritables origines et l'étendue de ses sombres pouvoirs demeurent inconnues"

  # Gogossos
  building_red_citadel_01:0 "La Tour Rouge"
  building_type_red_citadel_01:0 "La Tour Rouge"
  building_red_citadel_01_desc:0 "Une grande tour côtière, considérée comme le dernier vestige d'une forteresse jadis imposante, sert désormais de principale place forte de la ville. Bien que la majeure partie de la structure d'origine ait été perdue au fil du temps, ce bastion solitaire perdure petit, mais incroyablement robuste et hautement défendable. De solides murs de pierre usée résistent aux éléments ainsi qu'aux sièges potentiels, en faisant un siège d'autorité fiable au sein de Gogossos. Bien qu'il ne soit pas encore une grande citadelle, il reste un donjon redoutable, une fondation sur laquelle de plus grandes fortifications pourraient un jour s'élever"
  building_type_red_citadel_01_desc:0 "Une grande tour côtière, considérée comme le dernier vestige d'une forteresse jadis imposante, sert désormais de principale place forte de la ville. Bien que la majeure partie de la structure d'origine ait été perdue au fil du temps, ce bastion solitaire perdure petit, mais incroyablement robuste et hautement défendable. De solides murs de pierre usée résistent aux éléments ainsi qu'aux sièges potentiels, en faisant un siège d'autorité fiable au sein de Gogossos. Bien qu'il ne soit pas encore une grande citadelle, il reste un donjon redoutable, une fondation sur laquelle de plus grandes fortifications pourraient un jour s'élever"

  building_red_citadel_02:0 "La Redoute Rouge"
  building_type_red_citadel_02:0 "La Redoute Rouge"
  building_red_citadel_02_desc:0 "Désormais renforcée par une palissade en bois robuste et des tours de guet sur les anciennes Ruines Cramoisies, cette redoute est devenue une place forte plus redoutable, capable de résister à des menaces prolongées. N'étant plus seulement une tour côtière isolée, les défenses étendues lui permettent maintenant d'abriter une garnison décente, offrant un point d'ancrage solide au sein de Gogossos. Avec des réserves abondantes et des positions renforcées, elle pourrait même soutenir une armée pendant des mois si nécessaire, marquant ainsi sa transformation d'une simple relique du passé en un véritable bastion de pouvoir au sein de la ville"
  building_type_red_citadel_02_desc:0 "Désormais renforcée par une palissade en bois robuste et des tours de guet, cette redoute est devenue une place forte plus redoutable, capable de résister à des menaces prolongées. N'étant plus seulement une tour côtière isolée, les défenses étendues lui permettent maintenant d'abriter une garnison décente, offrant un point d'ancrage solide au sein de Gogossos. Avec des réserves abondantes et des positions renforcées, elle pourrait même soutenir une armée pendant des mois si nécessaire, marquant ainsi sa transformation d'une simple relique du passé en un véritable bastion de pouvoir au sein de la ville"

  building_red_citadel_03:0 "La Citadelle Rouge"
  building_type_red_citadel_03:0 "La Citadelle Rouge"
  building_red_citadel_03_desc:0 "Autrefois simple vestige du passé, la Citadelle Rouge a été reconstruite en une forteresse immense et impitoyable, dominant Gogossos en tant que siège suprême du pouvoir de la ville. N'étant plus seulement une tour solitaire, elle se dresse désormais comme un donjon entièrement restauré et une place forte, ses colossaux murs de Pierre Noire valyrienne s'élevant haut et épais, un monument à la domination et à la terreur.\nTout comme la Porte Cramoisie, les murs de la Citadelle Rouge furent jadis imprégnés des rituels de magie du sang exécutés par les Anciens Valyriens, leur sorcellerie teintant à jamais la pierre d'un cramoisi profond et surnaturel. Bien que ces rituels aient depuis longtemps sombré dans l'oubli, leur sombre héritage perdure, faisant de la citadelle non seulement une forteresse presque impénétrable, mais aussi un symbole hanté de pouvoir absolu. \n En son cœur, la Tour Rouge perce le ciel, projetant son ombre menaçante sur la ville, un rappel constant de l'autorité de l'Archonte. Les murs inférieurs et la cour restent imprégnés de sang, non seulement des rituels passés, mais aussi des innombrables exécutions, trahisons et conflits brutaux qui s'y sont déroulés. Le sang des rebelles, conspirateurs et ennemis de l'État a imprégné ses fondations, s'assurant que la peur soit tissée dans la structure même de la forteresse. \n On murmure que c'est entre ces murs que la Peste Rouge prit naissance, une malédiction qui ravagea autrefois Gogossos, laissant des quartiers entiers noyés dans le sang et la souffrance. Bien que la maladie ait disparu dans les brumes du passé, certains prétendent que la citadelle s'en souvient encore, que les fantômes des mourants hantent ses chambres les plus profondes, murmurant à ceux qui écoutent. \n Lieu de pouvoir de fer et de légendes, la Citadelle Rouge est bien plus qu'une forteresse—elle est le cœur inébranlable de Gogossos, un lieu où le pouvoir est absolu, la clémence rare et la rébellion écrasée avant même de pouvoir naître"

  building_type_red_citadel_03_desc:0 "Autrefois un simple vestige du passé, la Citadelle Rouge a été reconstruite en une forteresse immense et inébranlable, dominant Gogossos en tant que siège suprême du pouvoir de la ville. Ce n'est plus seulement une tour isolée, mais un donjon et une place forte entièrement restaurés, ses gigantesques murs de Pierre Noire valyrienne s'élevant haut et épais, un monument à la domination et à la crainte.\nComme la Porte Pourpre, les murs de la Citadelle Rouge ont été imprégnés des rituels de magie du sang des Anciens Valyriens, leur sorcellerie ayant à jamais teinté la pierre d'un rouge profond et surnaturel. Bien que ces rituels se soient effacés dans l'histoire, leur sombre héritage perdure, faisant de la citadelle non seulement une forteresse quasi impénétrable, mais aussi un symbole terrifiant de pouvoir absolu. \n En son cœur, la Tour Rouge perce le ciel, sa présence projetant une ombre oppressante sur la ville, un rappel constant de l'autorité de l'Archonte. Les murs inférieurs et la cour restent maculés de sang, non seulement à cause des rituels du passé, mais aussi des innombrables exécutions, trahisons et conflits brutaux qui ont eu lieu sur ces pierres. Le sang des rebelles, conspirateurs et ennemis de l'État s'est infiltré dans ses fondations, garantissant que la peur est tissée dans la structure même de la forteresse. \n On murmure que derrière ces murs, la Peste Rouge a vu le jour, une malédiction qui ravagea autrefois Gogossos, laissant des quartiers entiers noyés dans le sang et la souffrance. Bien que la maladie soit depuis longtemps entrée dans l'histoire, certains prétendent que la citadelle s'en souvient encore, que les fantômes des mourants hantent toujours ses chambres les plus profondes, murmurant à ceux qui osent écouter. \n Lieu de domination de fer et de légende, la Citadelle Rouge est bien plus qu'une simple forteresse—c'est le cœur inébranlable de Gogossos, un endroit où le pouvoir est absolu, où la clémence est rare et où la rébellion est écrasée avant même de commencer"

  building_pit_of_sorrows_01:0 "Donjon en ruines envahi par la végétation"
  building_type_pit_of_sorrows_01:0 "Donjon en ruines envahi par la végétation"
  building_pit_of_sorrows_01_desc:0 "Un donjon en ruines, dont les murs jadis imposants sont maintenant recouverts de lianes rampantes et avalés par l'étreinte implacable de la nature, se dresse dans un silence inquiétant. Des arbres ont pris racine dans ses cours, leurs branches tordues griffant le ciel, comme pour témoigner d'horreurs oubliées. Malgré la décrépitude, le donjon demeure étrangement défendable—ses tours, bien qu'érodées, imposent toujours leur présence, et son portail, à moitié enseveli sous la mousse et les gravats, laisse entrevoir une forteresse qui refuse de céder entièrement au temps. Pourtant, quelque chose semble profondément anormal en ce lieu. L'air y est lourd d'un silence surnaturel, du genre qui fait frissonner la peau et trouble l'esprit. Des ombres s'attardent là où elles ne devraient pas, et des murmures—trop faibles pour être simplement le vent—semblent flotter à travers les ruines, suggérant des secrets qui auraient mieux fait de rester enfouis"

  building_type_pit_of_sorrows_01_desc:0 "Un donjon en ruines, dont les murs jadis imposants sont maintenant recouverts de lianes rampantes et avalés par l'étreinte implacable de la nature, se dresse dans un silence inquiétant. Des arbres ont pris racine dans ses cours, leurs branches tordues griffant le ciel, comme pour témoigner d'horreurs oubliées. Malgré la décrépitude, le donjon demeure étrangement défendable—ses tours, bien qu'érodées, imposent toujours leur présence, et son portail, à moitié enseveli sous la mousse et les gravats, laisse entrevoir une forteresse qui refuse de céder entièrement au temps. Pourtant, quelque chose semble profondément anormal en ce lieu. L'air y est lourd d'un silence surnaturel, du genre qui fait frissonner la peau et trouble l'esprit. Des ombres s'attardent là où elles ne devraient pas, et des murmures—trop faibles pour être simplement le vent—semblent flotter à travers les ruines, suggérant des secrets qui auraient mieux fait de rester enfouis"

  building_pit_of_sorrows_02:0 "Fouilles du Donjon et du Gouffre"
  building_type_pit_of_sorrows_02:0 "Fouilles du Donjon et du Gouffre"
  building_pit_of_sorrows_02_desc:0 "Alors que nous avons étendu nos efforts et dégagé l'épaisse végétation, nous avons fait une découverte stupéfiante—le sol sous nos pieds semblait s'enfoncer sans fin, peu importe la quantité de boue et de débris que nous retirions. Ce qui apparaissait d'abord comme un simple couvert végétal dissimulant des ruines s'est vite révélé être une descente vaste et stratifiée, chaque niveau inférieur exposant des vestiges du passé. Parmi les pierres effondrées et la terre humide, nous avons exhumé d'innombrables ossements, d'origine inconnue, leurs histoires perdues depuis longtemps. À chaque pas vers le bas, une certitude grandissante nous gagnait—ce pourrait bien être le légendaire Gouffre des Lamentations, un lieu murmuré avec effroi dans les légendes, dont les profondeurs sont encore intactes et dont les mystères restent à percer"

  building_type_pit_of_sorrows_02_desc:0 "Alors que nous avons étendu nos efforts et dégagé l'épaisse végétation, nous avons fait une découverte stupéfiante—le sol sous nos pieds semblait s'enfoncer sans fin, peu importe la quantité de boue et de débris que nous retirions. Ce qui apparaissait d'abord comme un simple couvert végétal dissimulant des ruines s'est vite révélé être une descente vaste et stratifiée, chaque niveau inférieur exposant des vestiges du passé. Parmi les pierres effondrées et la terre humide, nous avons exhumé d'innombrables ossements, d'origine inconnue, leurs histoires perdues depuis longtemps. À chaque pas vers le bas, une certitude grandissante nous gagnait—ce pourrait bien être le légendaire Gouffre des Lamentations, un lieu murmuré avec effroi dans les légendes, dont les profondeurs sont encore intactes et dont les mystères restent à percer"

  building_pit_of_sorrows_03:0 "Le Gouffre des Lamentations"
  building_type_pit_of_sorrows_03:0 "Le Gouffre des Lamentations"
  building_pit_of_sorrows_03_desc:0 "L'Ancien Gouffre des Lamentations, autrefois une ruine croulante, a été méticuleusement restauré et reconstruit pour retrouver sa sombre grandeur passée. Pourtant, malgré tous les efforts pour récupérer ses niveaux supérieurs, ses véritables profondeurs demeurent un abîme insondable. L'obscurité inférieure s'étend à l'infini, engloutissant la lumière et le son, une gueule béante vers l'inconnu. Nombreux sont ceux qui ont osé descendre à la recherche de secrets perdus dans le temps, mais aucun n'est jamais remonté pour raconter ce qui repose au fond—si fond il y a."

  building_type_pit_of_sorrows_03_desc:0 "L'Ancien Gouffre des Lamentations, autrefois une ruine croulante, a été méticuleusement restauré et reconstruit pour retrouver sa sombre grandeur passée. Pourtant, malgré tous les efforts pour récupérer ses niveaux supérieurs, ses véritables profondeurs demeurent un abîme insondable. L'obscurité inférieure s'étend à l'infini, engloutissant la lumière et le son, une gueule béante vers l'inconnu. Nombreux sont ceux qui ont osé descendre à la recherche de secrets perdus dans le temps, mais aucun n'est jamais remonté pour raconter ce qui repose au fond—si fond il y a."

  building_the_toad:0 "Le Crapaud Noir"
  building_type_the_toad:0 "Le Crapaud Noir"
  building_the_toad_desc:0 "La plus grande statue jamais construite sur l’Île des Crapauds domine le paysage, une relique monolithique d’une civilisation depuis longtemps disparue. Sculptée dans une pierre noire huileuse inconnue, qui semble luire même en l’absence de lumière, elle prend la forme d’un immense crapaud—trapu, grotesque et troublant de réalisme. Personne ne sait qui l’a érigée, ni dans quel but, et la signification qu’elle pouvait autrefois avoir s’est perdue avec le temps. Pour la plupart, ce n’est rien de plus qu’une effigie grossière et inquiétante, une curiosité étrange dans une terre déjà empreinte de mystère. Pourtant, des murmures—chuchotés à voix basse par les habitants—parlent de rêves étranges hantant ceux qui dorment trop près, d’une chaleur anormale émanant de la pierre lorsqu’on la touche, et d’yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait depuis l’intérieur"
  building_type_the_toad_desc:0 "La plus grande statue jamais construite sur l’Île des Crapauds domine le paysage, une relique monolithique d’une civilisation depuis longtemps disparue. Sculptée dans une pierre noire huileuse inconnue, qui semble luire même en l’absence de lumière, elle prend la forme d’un immense crapaud—trapu, grotesque et troublant de réalisme. Personne ne sait qui l’a érigée, ni dans quel but, et la signification qu’elle pouvait autrefois avoir s’est perdue avec le temps. Pour la plupart, ce n’est rien de plus qu’une effigie grossière et inquiétante, une curiosité étrange dans une terre déjà empreinte de mystère. Pourtant, des murmures—chuchotés à voix basse par les habitants—parlent de rêves étranges hantant ceux qui dorment trop près, d’une chaleur anormale émanant de la pierre lorsqu’on la touche, et d’yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait depuis l’intérieur"

  building_ax_hold:0 "Le Bastion de la Hache"
  building_type_ax_hold:0 "Le Bastion de la Hache"
  building_ax_hold_desc:0 "La forteresse de la Maison Xhore se dresse à la fois comme un sanctuaire et un bastion, une citadelle de pierre et d’acier construite pour résister aux tempêtes des Îles du Basilic. Perchée au sommet de falaises déchiquetées et entourée d’eaux traîtresses, elle n’a pas été conçue seulement comme une demeure, mais comme une forteresse imprenable d’où les pirates qartheens des Îles Occidentales lancent leurs célèbres raids. Ses murs, usés par le temps mais toujours redoutables, portent les cicatrices de nombreuses batailles, tandis que ses tours de guet offrent une vue dégagée sur la mer environnante, toujours à l’affût des proies comme des poursuivants."

  building_type_ax_hold_desc:0 "La forteresse de la Maison Xhore se dresse à la fois comme un sanctuaire et un bastion, une citadelle de pierre et d’acier construite pour résister aux tempêtes des Îles du Basilic. Perchée au sommet de falaises déchiquetées et entourée d’eaux traîtresses, elle n’a pas été conçue seulement comme une demeure, mais comme une forteresse imprenable d’où les pirates qartheens des Îles Occidentales lancent leurs célèbres raids. Ses murs, usés par le temps mais toujours redoutables, portent les cicatrices de nombreuses batailles, tandis que ses tours de guet offrent une vue dégagée sur la mer environnante, toujours à l’affût des proies comme des poursuivants."

  building_garden_of_malice_01:0 "Un Grand Fort Envahi par la Végétation"
  building_type_garden_of_malice_01:0 "Un Grand Fort Envahi par la Végétation"
  building_garden_of_malice_01_desc:0 "Un vaste rempart envahi par la végétation encercle ces ruines, ses pierres antiques à peine visibles sous des couches de vignes rampantes et de mousse épaisse. En son cœur se dresse un donjon en ruine, ses tours brisées et à moitié avalées par l’étreinte impitoyable de la nature. Le temps a effacé l’histoire de ce lieu, ne laissant qu’un silence pesant et oppressant. \nPourtant, ceux qui osent franchir les portes brisées comprennent rapidement pourquoi ces ruines n’ont jamais été revendiquées—cet endroit est un piège mortel. Des haies tortueuses, sauvages et surnaturelles, forment un labyrinthe dont les chemins se déplacent et se referment comme des choses vivantes, poussant les imprudents toujours plus profondément dans la confusion. Parmi la végétation enchevêtrée se cachent des plantes aux couleurs impossibles et aux formes étranges, leur beauté masquant des intentions funestes. Certaines libèrent des spores qui étouffent les poumons, d’autres sécrètent des toxines qui brûlent la peau, et certaines semblent même se mouvoir d’elles-mêmes, attendant que leur proie s’approche trop près. \nLes légendes murmurent qu’une force—peut-être les vestiges d’une sorcellerie oubliée, ou la présence persistante de ce qui régnait ici autrefois—permet à la flore de prospérer d’une manière qui défie la nature. Ces ruines n’ont pas été oubliées, elles sont craintes. Même les pillards et les chasseurs de trésors les plus audacieux savent qu’il ne faut pas tenter le sort dans un lieu où la terre elle-même semble avide de sang."

  building_type_garden_of_malice_01_desc:0 "Un vaste rempart envahi par la végétation encercle ces ruines, ses pierres antiques à peine visibles sous des couches de vignes rampantes et de mousse épaisse. En son cœur se dresse un donjon en ruine, ses tours brisées et à moitié avalées par l’étreinte impitoyable de la nature. Le temps a effacé l’histoire de ce lieu, ne laissant qu’un silence pesant et oppressant. \nPourtant, ceux qui osent franchir les portes brisées comprennent rapidement pourquoi ces ruines n’ont jamais été revendiquées—cet endroit est un piège mortel. Des haies tortueuses, sauvages et surnaturelles, forment un labyrinthe dont les chemins se déplacent et se referment comme des choses vivantes, poussant les imprudents toujours plus profondément dans la confusion. Parmi la végétation enchevêtrée se cachent des plantes aux couleurs impossibles et aux formes étranges, leur beauté masquant des intentions funestes. Certaines libèrent des spores qui étouffent les poumons, d’autres sécrètent des toxines qui brûlent la peau, et certaines semblent même se mouvoir d’elles-mêmes, attendant que leur proie s’approche trop près. \nLes légendes murmurent qu’une force—peut-être les vestiges d’une sorcellerie oubliée, ou la présence persistante de ce qui régnait ici autrefois—permet à la flore de prospérer d’une manière qui défie la nature. Ces ruines n’ont pas été oubliées, elles sont craintes. Même les pillards et les chasseurs de trésors les plus audacieux savent qu’il ne faut pas tenter le sort dans un lieu où la terre elle-même semble avide de sang."


  building_garden_of_malice_02:0 "Le Jardin du Mal"
  building_type_garden_of_malice_02:0 "Le Jardin du Mal"
  building_garden_of_malice_02_desc:0 "Le Jardin du Mal est une forteresse de mort, construite en pierre noire huilée et protégée par des défenses létales. Son enceinte extérieure entoure un immense labyrinthe végétal en perpétuel mouvement, un piège vivant où des lianes épineuses fouettent comme des flagelles, où des fleurs exhalent des spores toxiques, et où les haies elles-mêmes se referment pour induire en erreur et piéger les intrus. Aucune lumière ne parvient à pénétrer les profondeurs de cette jungle oppressante, où des formes invisibles s'agitent dans l'obscurité et où l'air est chargé de l'odeur de la décomposition. Au-delà du labyrinthe, des remparts intérieurs et un fossé forment une seconde ligne de défense, où des eaux noires grouillent d’horreurs invisibles prêtes à happer les imprudents. Des remparts imposants, gardés par des sentinelles silencieuses, surveillent l’unique entrée—un pont-levis renforcé qui ne s’abaisse que rarement. \nEn son centre se dresse le donjon, une structure massive et intacte de Valyria, dont les couloirs de pierre noire résonnent d’un silence inquiétant. Au sommet de sa plus haute tour repose un arbre mort et pétrifié, ses racines fusionnées à la pierre comme s’il se nourrissait de quelque chose caché dans les profondeurs. On dit qu’il précède même le Fléau de Valyria, un vestige de l’ancienne sorcellerie dont la signification s’est perdue dans l’oubli. Prendre le Jardin du Mal n’est pas une simple bataille—c’est une descente vers quelque chose de bien plus sinistre, un endroit où même la terre semble conspirer pour tuer."

  building_type_garden_of_malice_02_desc:0 "Le Jardin du Mal est une forteresse de mort, construite en pierre noire huilée et protégée par des défenses létales. Son enceinte extérieure entoure un immense labyrinthe végétal en perpétuel mouvement, un piège vivant où des lianes épineuses fouettent comme des flagelles, où des fleurs exhalent des spores toxiques, et où les haies elles-mêmes se referment pour induire en erreur et piéger les intrus. Aucune lumière ne parvient à pénétrer les profondeurs de cette jungle oppressante, où des formes invisibles s'agitent dans l'obscurité et où l'air est chargé de l'odeur de la décomposition. Au-delà du labyrinthe, des remparts intérieurs et un fossé forment une seconde ligne de défense, où des eaux noires grouillent d’horreurs invisibles prêtes à happer les imprudents. Des remparts imposants, gardés par des sentinelles silencieuses, surveillent l’unique entrée—un pont-levis renforcé qui ne s’abaisse que rarement. \nEn son centre se dresse le donjon, une structure massive et intacte de Valyria, dont les couloirs de pierre noire résonnent d’un silence inquiétant. Au sommet de sa plus haute tour repose un arbre mort et pétrifié, ses racines fusionnées à la pierre comme s’il se nourrissait de quelque chose caché dans les profondeurs. On dit qu’il précède même le Fléau de Valyria, un vestige de l’ancienne sorcellerie dont la signification s’est perdue dans l’oubli. Prendre le Jardin du Mal n’est pas une simple bataille—c’est une descente vers quelque chose de bien plus sinistre, un endroit où même la terre semble conspirer pour tuer."


  building_sapphire_quarter:0 "Le Quartier Saphir"
  building_type_sapphire_quarter:0 "Le Quartier Saphir"
  building_sapphire_quarter_desc:0 "Le Quartier Saphir est un vaste district fortifié, perché au sommet de la plus haute colline de Gogossos. Autrefois domaine des anciens Seigneurs Dragons, il sert désormais d’enclave exclusive aux maîtres esclavagistes et princes marchands les plus illustres de la ville. Seuls les plus riches peuvent y résider, car ici, seules des demeures et palais somptueux se dressent—construits en marbre étincelant et ornés d’or. Ses marchés privés sont drapés des plus fines soies, réservés à ceux qui peuvent s’offrir des luxes hors de portée des hommes ordinaires."
  building_type_sapphire_quarter_desc:0 "Le Quartier Saphir est un vaste district fortifié, perché au sommet de la plus haute colline de Gogossos. Autrefois domaine des anciens Seigneurs Dragons, il sert désormais d’enclave exclusive aux maîtres esclavagistes et princes marchands les plus illustres de la ville. Seuls les plus riches peuvent y résider, car ici, seules des demeures et palais somptueux se dressent—construits en marbre étincelant et ornés d’or. Ses marchés privés sont drapés des plus fines soies, réservés à ceux qui peuvent s’offrir des luxes hors de portée des hommes ordinaires."

  building_crimson_gate:0 "La Porte Cramoisie"
  building_type_crimson_gate:0 "La Porte Cramoisie"
  building_crimson_gate_desc:0 "La Porte Cramoisie se dresse comme une sentinelle imposante et redoutable, la première ligne de défense de la légendaire ville de Gogossos. Dominant le paysage, elle constitue le seul passage terrestre permettant d’entrer dans la cité, gardant le long et traître pont qui enjambe le grand fleuve. Forgée dans la Pierre Noire Valyrienne, sa surface sombre et surnaturelle semble absorber la lumière, sa structure lisse mais impénétrable imprégnée de la puissance d’une sorcellerie oubliée. Ses pierres sont chargées d’histoire—teintées d’un rouge profond par les anciens rituels de sang valyriens qui y furent pratiqués, laissant une marque sinistre et indélébile des arts obscurs ayant renforcé ses défenses. La massive bastide qui la surplombe, haute de 140 pieds, se dresse comme un titan face à ceux qui approchent, sa simple présence inspirant à la fois crainte et admiration. Perchées au sommet de ses murs colossaux, des statues de dragons veillent en silence, leurs immenses yeux incrustés de gemmes scintillant d’un éclat irréel—observant, attendant, comme si les âmes des bêtes qu’elles représentent persistaient encore dans la pierre.\n Peu ont osé forcer la Porte Cramoisie, et encore moins ont survécu pour raconter leur histoire. Ce n’est pas une simple barrière—c’est un monument à la puissance inébranlable de Gogossos, un témoignage éternel du pouvoir oublié de la cité et de l’héritage sombre de Valyria."

  building_type_crimson_gate_desc:0 "La Porte Cramoisie se dresse comme une sentinelle imposante et redoutable, la première ligne de défense de la légendaire ville de Gogossos. Dominant le paysage, elle constitue le seul passage terrestre permettant d’entrer dans la cité, gardant le long et traître pont qui enjambe le grand fleuve. Forgée dans la Pierre Noire Valyrienne, sa surface sombre et surnaturelle semble absorber la lumière, sa structure lisse mais impénétrable imprégnée de la puissance d’une sorcellerie oubliée. Ses pierres sont chargées d’histoire—teintées d’un rouge profond par les anciens rituels de sang valyriens qui y furent pratiqués, laissant une marque sinistre et indélébile des arts obscurs ayant renforcé ses défenses. La massive bastide qui la surplombe, haute de 140 pieds, se dresse comme un titan face à ceux qui approchent, sa simple présence inspirant à la fois crainte et admiration. Perchées au sommet de ses murs colossaux, des statues de dragons veillent en silence, leurs immenses yeux incrustés de gemmes scintillant d’un éclat irréel—observant, attendant, comme si les âmes des bêtes qu’elles représentent persistaient encore dans la pierre.\n Peu ont osé forcer la Porte Cramoisie, et encore moins ont survécu pour raconter leur histoire. Ce n’est pas une simple barrière—c’est un monument à la puissance inébranlable de Gogossos, un témoignage éternel du pouvoir oublié de la cité et de l’héritage sombre de Valyria."

  building_glittering_pits_01:0 "Les Fosses Étincelantes"
  building_type_glittering_pits_01:0 "Les Fosses Étincelantes"
  building_glittering_pits_01_desc:0 "Les jungles de Gogossos et l’infâme Île des Larmes forment une étendue sauvage et indomptée, une terre regorgeant à la fois de dangers et de richesses inimaginables Un véritable trésor de ressources naturelles, où le dense feuillage obscur dissimule des merveilles insoupçonnées pour ceux assez audacieux pour en braver les périls Parmi les trésors les plus convoités se trouvent les diamants et les saphirs, scintillant dans les profondeurs de la terre comme l’essence capturée des étoiles Ces pierres précieuses, rares et d’une qualité inégalée, ont fait de cette région une légende murmurée parmi les marchands et les chasseurs de fortune Bien que les mines restent modestes mais puissantes, leurs rendements sont stupéfiants, chaque excavation révélant des gemmes d’une brillance à couper le souffle"

  building_type_glittering_pits_01_desc:0 "Les jungles de Gogossos et l’infâme Île des Larmes forment une étendue sauvage et indomptée, une terre regorgeant à la fois de dangers et de richesses inimaginables Un véritable trésor de ressources naturelles, où le dense feuillage obscur dissimule des merveilles insoupçonnées pour ceux assez audacieux pour en braver les périls Parmi les trésors les plus convoités se trouvent les diamants et les saphirs, scintillant dans les profondeurs de la terre comme l’essence capturée des étoiles Ces pierres précieuses, rares et d’une qualité inégalée, ont fait de cette région une légende murmurée parmi les marchands et les chasseurs de fortune Bien que les mines restent modestes mais puissantes, leurs rendements sont stupéfiants, chaque excavation révélant des gemmes d’une brillance à couper le souffle"

  building_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_type_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_glittering_pits_02_desc:0 "À mesure que les mines s’agrandissent, elles se transforment en un vaste réseau de tunnels souterrains, s’étendant sous la jungle tel un enchevêtrement de racines Les parois scintillent de pierres précieuses, reflétant la lumière vacillante des torches, et des chambres cachées sont découvertes, révélant des veines riches prêtes à être exploitées Cependant, plus les mineurs creusent, plus la jungle semble riposter Les racines percent les murs, des spores toxiques flottent dans l’air, et d’étranges créatures invisibles s’agitent dans l’obscurité"

  building_glittering_pits_03:0 "Les Profondeurs Stellaires"
  building_type_glittering_pits_03:0 "Les Profondeurs Stellaires"
  building_glittering_pits_03_desc:0 "À son stade le plus profond et le plus développé, la mine est connue sous le nom de Profondeurs Stellaires Un vaste réseau de tunnels et d’immenses chambres souterraines où sont extraits les plus riches gisements de saphirs et de diamants Les parois de ces cavernes scintillent de veines intactes d’un bleu profond et d’un blanc éclatant, captant la moindre lueur et créant l’illusion d’un ciel étoilé sous terre Ici, les gemmes sont plus grandes, plus pures et plus précieuses que partout ailleurs dans la jungle Des saphirs sans défaut, aussi profonds que l’océan, attendent en amas denses, tandis que des diamants d’une taille impressionnante restent incrustés dans la roche la plus dure, nécessitant habileté et précision pour être extraits Des équipes entières de mineurs travaillent sans relâche, leurs outils résonnant à travers les vastes salles souterraines tandis qu’ils arrachent la fortune à la pierre brute Mais avec la profondeur vient le danger Les tunnels s’enfoncent dans une obscurité plus profonde que ne le signalent les cartes, et dans les chambres les plus basses, où l’air est épais et pesant, il y a des endroits où les mineurs refusent d’aller Certains affirment avoir découvert bien plus que des gemmes dans ces profondeurs Des choses ensevelies depuis bien avant que les hommes ne prennent leurs outils On murmure que des ombres se déplacent là où aucune lumière ne devrait exister, que de lointres tremblements rythmiques résonnent sans qu’aucun éboulement ne soit détecté, et qu’une chaleur sourde et persistante émane de fissures où il ne devrait y en avoir aucune Malgré les risques, les Profondeurs Stellaires restent le joyau des mines de Gogossos, un lieu où les fortunes se forgent et où des vies se perdent seuls les plus habiles et les plus déterminés osent y travailler, sachant qu’entre ces murs se trouvent certains des joyaux les plus précieux jamais extraits mais aussi le danger de creuser trop profondément... et d’éveiller quelque chose qui aurait dû rester oublié"

  building_type_glittering_pits_03_desc:0 "À son stade le plus profond et le plus développé, la mine est connue sous le nom de Profondeurs Stellaires Un vaste réseau de tunnels et d’immenses chambres souterraines où sont extraits les plus riches gisements de saphirs et de diamants Les parois de ces cavernes scintillent de veines intactes d’un bleu profond et d’un blanc éclatant, captant la moindre lueur et créant l’illusion d’un ciel étoilé sous terre Ici, les gemmes sont plus grandes, plus pures et plus précieuses que partout ailleurs dans la jungle Des saphirs sans défaut, aussi profonds que l’océan, attendent en amas denses, tandis que des diamants d’une taille impressionnante restent incrustés dans la roche la plus dure, nécessitant habileté et précision pour être extraits Des équipes entières de mineurs travaillent sans relâche, leurs outils résonnant à travers les vastes salles souterraines tandis qu’ils arrachent la fortune à la pierre brute Mais avec la profondeur vient le danger Les tunnels s’enfoncent dans une obscurité plus profonde que ne le signalent les cartes, et dans les chambres les plus basses, où l’air est épais et pesant, il y a des endroits où les mineurs refusent d’aller Certains affirment avoir découvert bien plus que des gemmes dans ces profondeurs Des choses ensevelies depuis bien avant que les hommes ne prennent leurs outils On murmure que des ombres se déplacent là où aucune lumière ne devrait exister, que de lointres tremblements rythmiques résonnent sans qu’aucun éboulement ne soit détecté, et qu’une chaleur sourde et persistante émane de fissures où il ne devrait y en avoir aucune Malgré les risques, les Profondeurs Stellaires restent le joyau des mines de Gogossos, un lieu où les fortunes se forgent et où des vies se perdent seuls les plus habiles et les plus déterminés osent y travailler, sachant qu’entre ces murs se trouvent certains des joyaux les plus précieux jamais extraits mais aussi le danger de creuser trop profondément... et d’éveiller quelque chose qui aurait dû rester oublié"

  building_darkreach_quay_1:0 "Quai de Sombreport"
  building_type_darkreach_quay_1:0 "Quai de Sombreport"
  building_darkreach_quay_1_desc:0 "Le Quai de Sombreport est le cœur humble mais essentiel du commerce de Gogossos, la première étape de l'infrastructure portuaire grandiose de la cité Un port modeste en pierre et en bois, il s'avance dans les eaux sombres de la baie, ses quais usés gémissant sous le poids des navires accostant Bien que petit, il est stratégiquement placé pour servir de principal point d’entrée aux marchands, contrebandiers et aventuriers en quête de fortune à Gogossos"

  building_darkreach_quay_2:0 "Port de Sombreport"
  building_type_darkreach_quay_2:0 "Port de Sombreport"
  building_darkreach_quay_2_desc:0 "Avec l’expansion de l’empire commercial de Gogossos, le Port de Sombreport est devenu un centre florissant du commerce, bien loin de ses modestes débuts Les quais ont été renforcés avec de la pierre et du bois robuste, permettant aux plus grands navires marchands d’y accoster et de décharger leurs cargaisons exotiques De nouvelles jetées s’étendent plus loin dans les eaux sombres, accueillant un flot croissant de navires venus de terres lointaines, attirés par les richesses des saphirs, diamants et autres ressources rares de la jungle de Gogossos"

  building_type_darkreach_quay_2_desc:0 "Avec l’expansion de l’empire commercial de Gogossos, le Port de Sombreport est devenu un centre florissant du commerce, bien loin de ses modestes débuts Les quais ont été renforcés avec de la pierre et du bois robuste, permettant aux plus grands navires marchands d’y accoster et de décharger leurs cargaisons exotiques De nouvelles jetées s’étendent plus loin dans les eaux sombres, accueillant un flot croissant de navires venus de terres lointaines, attirés par les richesses des saphirs, diamants et autres ressources rares de la jungle de Gogossos"

  building_darkreach_quay_3:0 "Port de la Marée Noire"
  building_type_darkreach_quay_3:0 "Port de la Marée Noire"
  building_darkreach_quay_3_desc:0 "Avec la renaissance de Gogossos, son port commercial autrefois modeste s’est transformé en Port de la Marée Noire, une forteresse colossale du commerce et du pouvoir naval Il ne s’agit plus seulement d’une escale pour les marchands, mais d’un épicentre florissant du commerce international, attirant marchands, mercenaires et chasseurs de fortune du monde entier Le port est désormais fortifié avec la Pierre Noire Valyrienne ancestrale, ses murs imposants encerclant les quais animés et offrant une défense inégalée contre les raids et les sièges Ces remparts imposants, reforgés à partir des ruines du passé, témoignent de la résurgence de la cité, garantissant que la richesse et l’influence de Gogossos restent inébranlables"

  building_type_darkreach_quay_3_desc:0 "Avec la renaissance de Gogossos, son port commercial autrefois modeste s’est transformé en Port de la Marée Noire, une forteresse colossale du commerce et du pouvoir naval Il ne s’agit plus seulement d’une escale pour les marchands, mais d’un épicentre florissant du commerce international, attirant marchands, mercenaires et chasseurs de fortune du monde entier Le port est désormais fortifié avec la Pierre Noire Valyrienne ancestrale, ses murs imposants encerclant les quais animés et offrant une défense inégalée contre les raids et les sièges Ces remparts imposants, reforgés à partir des ruines du passé, témoignent de la résurgence de la cité, garantissant que la richesse et l’influence de Gogossos restent inébranlables"

  building_last_dragon_tower_1:0 "La Dernière Tour du Dragon"
  building_type_last_dragon_tower_1:0 "La Dernière Tour du Dragon"
  building_last_dragon_tower_1_desc:0 "La dernière Tour du Dragon encore debout hors de Valyria, bâtie dans les derniers jours avant le Fléau, demeure un monument à la fois de pouvoir et de tragédie À l’origine construite pour abriter la famille de lords Dragon régnant sur Gogossos, ses couloirs étaient censés être un symbole de leur règne éternel, mais le destin en a décidé autrement Lorsque la famille périt dans l’anéantissement de Valyria, la tour devint une relique silencieuse d’un empire perdu, projetant une ombre oppressante sur la cité Aujourd’hui, elle sert un nouveau maître, l’Archonte le plus puissant de Gogossos et sa famille, qui gouvernent depuis ses hauteurs vertigineuses Ce n’est plus seulement un symbole de la grandeur valyrienne, mais un rappel brutal à la classe inférieure, aux esclaves et aux rebelles potentiels de la hiérarchie impitoyable de la cité Elle se dresse comme un témoignage inébranlable de domination, un avertissement permanent que l’élite de Gogossos écrasera quiconque ose se dresser contre elle"

  building_type_last_dragon_tower_1_desc:0 "La dernière Tour du Dragon encore debout hors de Valyria, bâtie dans les derniers jours avant le Fléau, demeure un monument à la fois de pouvoir et de tragédie À l’origine construite pour abriter la famille de lords Dragon  régnant sur Gogossos, ses couloirs étaient censés être un symbole de leur règne éternel, mais le destin en a décidé autrement Lorsque la famille périt dans l’anéantissement de Valyria, la tour devint une relique silencieuse d’un empire perdu, projetant une ombre oppressante sur la cité Aujourd’hui, elle sert un nouveau maître, l’Archonte le plus puissant de Gogossos et sa famille, qui gouvernent depuis ses hauteurs vertigineuses Ce n’est plus seulement un symbole de la grandeur valyrienne, mais un rappel brutal à la classe inférieure, aux esclaves et aux rebelles potentiels de la hiérarchie impitoyable de la cité Elle se dresse comme un témoignage inébranlable de domination, un avertissement permanent que l’élite de Gogossos écrasera quiconque ose se dresser contre elle"

  # Valyria
  building_type_valyria_volcano:0 "Une des Quatorze Flammes"

  building_type_valyria_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_01:0 "Mont Gaelithox"
  building_valyria_volcano_01_desc:0 "Gaelithox est l’un des volcans les plus redoutables parmi les légendaires Quatorze Flammes de Valyria, dominant le paysage alentour, son sommet est perpétuellement enveloppé d’un épais voile de fumée et de cendres, les flancs du volcan sont marqués par d’anciens flux de lave, désormais solidifiés en formations rocheuses noires et dentelées, vestiges de la Ruine"

  building_type_valyria_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_02:0 "Rhazalhar"
  building_valyria_volcano_02_desc:0 "Rhazalhar est la plus grande des Quatorze Flammes, un colosse de fureur en fusion et de puissance ancestrale, son sommet, constamment voilé de fumée et de cendres, perce les cieux et projette son ombre sur le paysage environnant, des rivières de lave s’écoulent de son cœur incandescent, traçant des chemins lumineux à travers la roche volcanique sombre, en raison des températures extrêmes autour du volcan, l’extraction minière y est impossible"

  building_type_valyria_volcano_03:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_03:0 "Epaekros"
  building_valyria_volcano_03_desc:0 "Epaekros est plus dangereux que les autres volcans, d’une beauté sauvage aux falaises instables qui font tomber des rochers sur les randonneurs et aux sols glissants provoquant des chutes mortelles, ceux qui atteignent son sommet rencontrent souvent une fin tragique, victime d’un firewyrm ou d’un dragon nichant là, pourtant, pour ceux qui parviennent à explorer le volcan, richesses, or et métaux précieux abondent"

  building_type_valyria_volcano_04_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_01:0 "Tartarax"
  building_valyria_volcano_04_01_desc:0 "S’élevant haut dans le ciel, bien que moins que Rhazalhar, Tartarax est un volcan plus élancé mais plus profond dont le sommet curieusement façonné constitue un nid idéal pour toute créature avide de feu, ses cavernes et tunnels profonds offrent de vastes opportunités minières mais aussi la mort, lave et créatures hostiles abondent dans ce donjon sombre et profond, pourtant la lueur de sa lave majestueuse, visible de loin dans l’obscurité de la nuit, reste inoubliable"

  building_valyria_volcano_04_02:0 "Tartarax"
  building_valyria_volcano_04_02_desc:0 "S’élevant haut dans le ciel, bien que moins que Rhazalhar, Tartarax est un volcan plus élancé mais plus profond dont le sommet curieusement façonné constitue un nid idéal pour toute créature avide de feu, ses cavernes et tunnels profonds offrent de vastes opportunités minières mais aussi la mort, lave et créatures hostiles abondent dans ce donjon sombre et profond, pourtant la lueur de sa lave majestueuse, visible de loin dans l’obscurité de la nuit, reste inoubliable"

  building_type_valyria_volcano_05:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_05:0 "Yontaryos"
  building_valyria_volcano_05_desc:0 "Lors de sa découverte par les anciens Valyriens, Yontaryos différait des autres volcans de la région, il était petit et relativement bas, avec peu de magma et un espace limité pour la nidification des dragons, cependant, il avait ses usages, des minéraux précieux pouvaient encore y être extraits et sa petite taille le rendait idéal pour les rituels et sacrifices, bien que ses flammes ne brûlât pas aussi intensément que celles des autres"

  building_type_elyria_great_port_01:0 "Le Grand Port d’Elyria"
  building_elyria_great_port_01:0 "Le Grand Port d’Elyria"
  building_elyria_great_port_01_desc:0 "Le Grand Port d’Elyria est un immense chantier naval construit à l’époque du Freehold, la position stratégique d’Elyria dans la Baie des Esclaves offre à cette petite île un trafic important de navires, de commerce et d’esclaves que ce port massif peut accueillir, après l’effondrement du Freehold, ce port a capturé une part significative du commerce de la Baie des Esclaves, devenant l’envie de la région et de ses environs"

  building_type_elyria_dragon_palace_01:0 "Le Palais du Dragon d’Elyria"
  building_elyria_dragon_palace_01:0 "Le Palais du Dragon d’Elyria"
  building_elyria_dragon_palace_01_desc:0 "Le Palais du Dragon est une résidence luxueuse et grandiose offrant tout ce qu’un seigneur pourrait désirer, vastes pièces, immenses salles de banquet, piscines, caves à vin et bien plus encore, construit à l’époque du Freehold pour loger le gouverneur d’Elyria, aucun coût n’a été épargné, aujourd’hui, il abrite le duc d’Elyria, lui conférant splendeur et renommée"

  building_type_valyria_volcano_04:0 "$building_type_valyria_volcano$"

  building_type_valyria_dead_volcano_01_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_01:0 "Syrabelos"
  building_valyria_dead_volcano_01_01_desc:0 "Syrabelos est un volcan éteint, la lave qui autrefois s’y écoulait est depuis longtemps solidifiée. Cela ne le rend pas inutile, car il reste riche en minéraux et métaux précieux à exploiter et peut toujours servir de refuge lors de raids ou tempêtes"

  building_valyria_dead_volcano_01_02:0 "Mines de Syrabelos"
  building_valyria_dead_volcano_01_02_desc:0 "Les opérations minières ont repris à Syrabelos, des esclaves descendent chaque jour dans les puits pour extraire des métaux précieux et autres matériaux de valeur pour leurs oppresseurs"

  building_type_valyria_dead_volcano_02_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_01:0 "Qazdarsos"
  building_valyria_dead_volcano_02_01_desc:0 "Qazdarsos était autrefois un volcan actif mais ne l’est plus, désormais dormant mais non silencieux. Les cris de firewyrms et, selon certains, même de fantômes se font encore entendre depuis ses profondeurs. Certains ont osé s’y aventurer sans être assez nombreux et n’ont jamais été revus"

  building_valyria_dead_volcano_02_02:0 "Qazdarsos"
  building_valyria_dead_volcano_02_02_desc:0 "Les mines de Qazdarsos sont de nouveau pleinement opérationnelles, des esclaves extraient quotidiennement richesses et or pour leurs maîtres. Cependant, les récits de créatures surnaturelles et de malédictions persistent à propos de l’intérieur du volcan, vérités ou élucubrations d’esclaves reste à déterminer..."

  building_the_royal_barracks_of_valyria_1:0 "Caserne en ruines de Valyria"
  building_type_the_royal_barracks_of_valyria_1:0 "Caserne en ruines de Valyria"
  building_the_royal_barracks_of_valyria_1_desc:0 "Autrefois grande caserne du Freehold destinée à défendre la cité, elle est aujourd’hui réduite à un amas de décombres"
  building_type_the_royal_barracks_of_valyria_1_desc:0 "Autrefois grande caserne du Freehold destinée à défendre la cité, elle est aujourd’hui réduite à un amas de décombres"

  building_the_royal_barracks_of_valyria_2:0 "Caserne royale de Valyria"
  building_the_royal_barracks_of_valyria_2_desc:0 "La Caserne royale de Valyria restaurée, construite sur les anciennes ruines, voit gardes et soldats aller et venir pour assurer la sécurité des voyageurs et citoyens"

  building_the_great_arena_of_valyria_1:0 "Vestiges de la Grande Arène"
  building_type_the_great_arena_of_valyria_1:0 "Vestiges de la Grande Arène"
  building_the_great_arena_of_valyria_1_desc:0 "Autrefois grande arène remplie de gladiateurs et de spectateurs, elle est désormais en ruines. La restaurer serait coûteux mais pourrait redonner de la joie au peuple"
  building_type_the_great_arena_of_valyria_1_desc:0 "Autrefois grande arène remplie de gladiateurs et de spectateurs, elle est désormais en ruines. La restaurer serait coûteux mais pourrait redonner de la joie au peuple"

  building_the_great_arena_of_valyria_2:0 "Grande Arène de Valyria"
  building_the_great_arena_of_valyria_2_desc:0 "Maintenant reconstruite, la Grande Arène attire des milliers de spectateurs venus assister à tournois et jeux sanglants où professionnels et esclaves meurent dans le sable pour divertir le public"

  building_type_the_great_library_of_valyria_1:0 "Ruines décrépites de la Bibliothèque"
  building_the_great_library_of_valyria_1:0 "Ruines décrépites de la Bibliothèque"
  building_type_the_great_library_of_valyria_1_desc:0 "Les restes en ruine de la grande bibliothèque pourraient être restaurés pour abriter d’importantes œuvres d’art et de littérature"
  building_the_great_library_of_valyria_1_desc:0 "Les restes en ruine de la grande bibliothèque pourraient être restaurés pour abriter d’importantes œuvres d’art et de littérature"

  building_the_great_library_of_valyria_2:0 "Grande Bibliothèque de Valyria"
  building_the_great_library_of_valyria_2_desc:0 "La Grande Bibliothèque de Valyria restaurée, remplie d’importantes œuvres d’art, de littérature et de philosophie, accueille chercheurs et universitaires qui étudient textes anciens et parchemins"

  building_valyria_veilspire_peak:0 "Pic de Veilspire"
  building_type_valyria_veilspire_peak:0 "Pic de Veilspire"
  building_valyria_veilspire_peak_desc:0 "Le Pic de Veilspire est le sommet le plus élevé de toute la péninsule valyrienne même avant la Ruine. Autrefois lieu de pèlerinage sacré réservé aux plus courageux et aux plus forts, ce grand sommet représente une épreuve divine. On dit que ceux qui parviennent à atteindre son sommet reviennent plus sages et plus érudits"

  building_the_velakar_resort_1:0 "Ancienne station en ruines"
  building_type_the_velakar_resort_1:0 "Ancienne station en ruines"
  building_the_velakar_resort_1_desc:0 "Autrefois un grand complexe de villégiature pour seigneurs dragons et marchands fortunés, cette station est aujourd’hui en ruines et guère plus qu’un tas de briques"

  building_the_velakar_resort_2:0 "Illustre station de Velakar"
  building_the_velakar_resort_2_desc:0 "L’Illustre station de Velakar désormais restaurée accueille personnes de richesse et de haut rang pour se baigner et se détendre dans ce complexe majestueux digne d’un empereur. Tirant parti de la chaleur volcanique pour chauffer les bains et disposant de milliers de serviteurs à leur service, elle offre un spectacle à couper le souffle"

  building_aurions_lost_expidition:0 "Expédition perdue d’Aurion"
  building_type_aurions_lost_expidition:0 "Expédition perdue d’Aurion"
  building_aurions_lost_expidition_desc:0 "Voici l’expédition perdue de l’auto‑proclamé Empereur de Valyria Aurion Varezys. Cette plaine désolée est désormais le site funéraire de 30.000 hommes réduits à de simples amas de métal et d’os, souillée par les radiations et les gaz toxiques des geysers de soufre. C’est un paysage véritablement infernal"

  building_the_lokirian_barracks_1:0 "Vestiges d’une caserne"
  building_the_lokirian_barracks_1_desc:0 "Autrefois puissante caserne de Lokiria, elle n’est aujourd’hui plus qu’un tas de décombres"

  building_the_lokirian_barracks_2:0 "Puissante caserne de Lokiria"
  building_the_lokirian_barracks_2_desc:0 "La caserne de Lokiria, désormais reconstruite et renforcée de pierre de dragon et d’acier valyrien. Des soldats y marchent jour et nuit offrant un spectacle imposant et un cauchemar pour quiconque oserait assiéger"

  building_redwyrms_wrath_1:0 "Forteresse en ruines"
  building_type_redwyrms_wrath_1:0 "Forteresse en ruines"
  building_type_redwyrms_wrath_1_desc:0 "La Fureur de la Vouivre Rouge était une forteresse redoutable faite de murs en pierre de dragon et de hautes flèches, autrefois ornée des crânes de dragons vaincus comme trophées sinistres. Gouvernée par le Seigneur Protecteur Taurion de Lokiria, elle était un bastion de guerre et de domination, ses bannières cramoisies inspirant la peur à travers les terres. Aujourd’hui en ruines, elle n’est plus qu’une ombre de sa gloire passée"
  building_redwyrms_wrath_1_desc:0 "La Fureur de la Vouivre Rouge était une forteresse redoutable faite de murs en pierre de dragon et de hautes flèches, autrefois ornée des crânes de dragons vaincus comme trophées sinistres. Gouvernée par le Seigneur Protecteur Taurion de Lokiria, elle était un bastion de guerre et de domination, ses bannières cramoisies inspirant la peur à travers les terres. Aujourd’hui en ruines, elle n’est plus qu’une ombre de sa gloire passée"

  building_redwyrms_wrath_2:0 "Fureur de la Vouivre Rouge"
  building_redwyrms_wrath_2_desc:0 "La Fureur de la Vouivre Rouge a ressurgi, ses murs en pierre de dragon restaurés dans leur sombre gloire dominant de nouveau le paysage comme symbole de terreur et de puissance. À nouveau ornée de crânes de dragons et de bannières cramoisies arborant le sigil du Dragon Rouge de Lokiria, elle incarne une détermination sombre. Reconstruite à la fois comme monument de guerre et déclaration de domination, elle inspire peur et respect témoignant d’un héritage de conquête durable"

  building_the_valyrian_gate_1:0 "Ruines de la Porte"
  building_type_the_valyrian_gate_1:0 "Ruines de la Porte"
  building_the_valyrian_gate_1_desc:0 "Ruines de l’ancienne Grande Porte de Valyria, puissant symbole de richesse et de pouvoir aujourd’hui réduit à un tas de briques"
  building_type_the_valyrian_gate_1_desc:0 "Ruines de l’ancienne Grande Porte de Valyria, puissant symbole de richesse et de pouvoir aujourd’hui réduit à un tas de briques"

  building_the_valyrian_gate_2:0 "Grande Porte de Valyria"
  building_type_the_valyrian_gate_2:0 "Grande Porte de Valyria"
  building_the_valyrian_gate_2_desc:0 "La Grande Porte de Valyria, sept portes et sept herses fabriquées et renforcées en acier valyrien, voit des milliers de marchands et voyageurs passer sans cesse. D’immenses statues d’anciens héros se dressent au sommet de l’entrée"
  building_type_the_valyrian_gate_2_desc:0 "La Grande Porte de Valyria, sept portes et sept herses fabriquées et renforcées en acier valyrien, voit des milliers de marchands et voyageurs passer sans cesse. D’immenses statues d’anciens héros se dressent au sommet de l’entrée"

  building_type_the_great_harbor_of_valyria_01:0 "Grand Port de Valyria"
  building_the_great_harbor_of_valyria_01:0 "Baie propice à un port"
  building_the_great_harbor_of_valyria_01_desc:0 "Cette baie est assez grande et profonde pour accueillir un grand port, pour l’instant il n’y a guère plus que du poisson"
  building_type_the_great_harbor_of_valyria_01_desc:0 "Cette baie est assez grande et profonde pour accueillir un grand port, pour l’instant il n’y a guère plus que du poisson"

  building_the_great_harbor_of_valyria_02:0 "Quais et ateliers de réparation"
  building_the_great_harbor_of_valyria_02_desc:0 "Pour faciliter le commerce et la construction navale et établir un important centre commercial et contrôle maritime, nous devons construire un grand port. Pour l’instant nous érigerons de longs quais et des ateliers de réparation pour la production navale. Nous ajouterons également une cabine de maître de quart pour le commerce et un bureau d’inspection afin de taxer et empêcher l’entrée de marchandises de contrebande"

  building_the_great_harbor_of_valyria_03:0 "Quais"
  building_the_great_harbor_of_valyria_03_desc:0 "Construire des quais et étendre l’infrastructure actuelle permettra d’accueillir plus de navires et d’augmenter le commerce entrant. Ces extensions serviront également à amarrer les navires militaires au service de notre flotte"

  building_the_great_harbor_of_valyria_04:0 "Grues et fournitures navales"
  building_the_great_harbor_of_valyria_04_desc:0 "En construisant de grandes grues nous pouvons accroître considérablement l’efficacité de notre port et permettre à plus de navires d’arriver et de partir. Nous établirons également une zone de fournitures navales près du port pour améliorer la construction de nos navires de guerre. Avec ce Grand Port personne ne pourra nous défier en mer"

  building_type_the_great_temple_of_valyria_01:0 "Temple du Dragon de Valyria"
  building_the_great_temple_of_valyria_01:0 "Colline pour un temple"
  building_the_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux nous aurons besoin d’un Grand Temple. Heureusement une colline près du Mont Tartarax peut servir à ériger un temple magnifique et illustre dédié à nos Dieux Dragons. Le fait qu’elle soit proche d’un volcan répond encore mieux à nos besoins"
  building_type_the_great_temple_of_valyria_01_desc:0 "Pour adorer et satisfaire les Dieux nous aurons besoin d’un Grand Temple. Heureusement une colline près du Mont Tartarax peut servir à ériger un temple magnifique et illustre dédié à nos Dieux Dragons. Le fait qu’elle soit proche d’un volcan répond encore mieux à nos besoins"

  building_the_great_temple_of_valyria_02:0 "Salle de prière et lieu de rassemblement"
  building_the_great_temple_of_valyria_02_desc:0 "Nous commencerons par une salle de prière richement décorée remplie d’artefacts précieux — sculptures de dragons et de feu, tapisseries représentant des dragons, braseros et marbre de la plus haute qualité. Nous créerons également une salle ouverte séparée destinée aux sacrifices humains"

  building_the_great_temple_of_valyria_03:0 "Arène de combustion"
  building_the_great_temple_of_valyria_03_desc:0 "Les Valyriens ont toujours brûlé leurs morts. Brûler nos défunts dans un temple près de notre volcan est une façon supérieure d’honorer ceux qui ont quitté ce monde. Nous agrandirons la salle ouverte déjà construite pour cet usage. Des colonnes sculptées, des fleurs exotiques et un autel en pierre noire remplaceront les bûchers en bois utilisés pour les sacrifices humains et la crémation des morts"

  building_the_great_temple_of_valyria_04:0 "Statues de dragons"
  building_the_great_temple_of_valyria_04_desc:0 "Aucun bâtiment à Valyria n’est vraiment complet sans statues de dragons. Nous érigerons quatorze statues, une pour chaque Dieu. Chacune sera unique et majestueuse afin de rendre un hommage digne à nos Dieux"

  building_type_the_great_walls_of_valyria_01:0 "Grands Murs de Pierre Noire de Valyria"
  building_the_great_walls_of_valyria_01:0 "Vestiges insignifiants du mur"
  building_the_great_walls_of_valyria_01_desc:0 "Cette zone abrite les vestiges des Grands Murs de Valyria. Il ne reste presque rien car ils ont été détruits lors de la Ruine. Les rares fragments survivants sont trop endommagés pour être utilisés. Bien sûr nous pourrions restaurer ces murs à leur ancienne grandeur mais cela sera extrêmement coûteux"

  building_the_great_walls_of_valyria_02:0 "Grands Murs de Pierre Noire de Valyria"
  building_the_great_walls_of_valyria_02_desc:0 "Les murs de Valyria ont été entièrement restaurés, imposants et vastes, entourant toute la cité. Ces fortifications massives sont si larges que douze chars pourraient circuler côte à côte. Tours de guet et douves bordent désormais le périmètre offrant des couches supplémentaires de défense. Les entrées sont renforcées par des herses et des zones de tir rendant toute tentative d’invasion presque impossible"

  building_type_the_great_dragonkeep_of_valyria_01:0 "Grande Dragonkeep de Valyria"
  building_the_great_dragonkeep_of_valyria_01:0 "Site du palais"
  building_type_the_great_dragonkeep_of_valyria_01_desc:0 "Nous avons identifié un site potentiel pour un grand palais. À l’avenir il deviendra un lieu de grandeur mais pour l’instant il n’y a rien de remarquable ici"
  building_the_great_dragonkeep_of_valyria_01_desc:0 "Nous avons identifié un site potentiel pour un grand palais. À l’avenir il deviendra un lieu de grandeur mais pour l’instant il n’y a rien de remarquable ici"

  building_the_great_dragonkeep_of_valyria_02:0 "Pose des fondations"
  building_the_great_dragonkeep_of_valyria_02_desc:0 "Pour abriter les dirigeants de cette grande cité nous aurons besoin d’un palais imposant, non, du plus grand palais que le monde ait jamais vu. Cela exigera de nombreux esclaves et de l’or, mais ces ressources peuvent être acquises. Ce palais sera un testament à la grandeur valyrienne. Nous commencerons par une keep et poursuivrons notre expansion"

  building_the_great_dragonkeep_of_valyria_03:0 "Murs extérieurs"
  building_the_great_dragonkeep_of_valyria_03_desc:0 "Pour garantir que cette keep soit imprenable nous construirons nos murs exclusivement en pierre noire. Ces murs hauts et épais repousseront tous ennemis et individus indésirables. Construire de tels murs sera bien entendu très coûteux"

  building_the_great_dragonkeep_of_valyria_04:0 "Murs intérieurs et décor"
  building_the_great_dragonkeep_of_valyria_04_desc:0 "Maintenant que les murs extérieurs sont érigés nous devons ériger des murs intérieurs pour renforcer la sécurité et l’efficacité de nos fortifications. Portes, herses et créneaux seront construits. De plus nous décorerons la grande keep avec des soies, tapisseries, trophées et autres éléments pour afficher notre splendeur"

  building_procrazion_1:0 "Grand château abandonné"
  building_type_procrazion_1:0 "Procrazion"
  building_type_procrazion_1_desc:0 "Procrazion était autrefois un bastion du pouvoir valyrien perché au sommet de la montagne centrale au cœur de la cité. Avant la Ruine ce grand château servait de centre militaire et politique défendant toute la région. Bien que sa structure reste partiellement intacte le temps a terni ses salles jadis glorieuses. Les ponts de pierre qui le reliaient à la ville sont détruits et l’intérieur montre des signes évidents de délabrement. Les hautes tours de dragon subsistent mais leurs chambres sont vides et la forge autrefois active est désormais inerte. Malgré tout sa position élevée et ses points d’entrée limités offrent encore un avantage stratégique. Bien qu’imposant Procrazion n’est plus qu’une ombre de sa splendeur passée attendant d’être restauré"
  building_procrazion_1_desc:0 "Procrazion était autrefois un bastion du pouvoir valyrien perché au sommet de la montagne centrale au cœur de la cité. Avant la Ruine ce grand château servait de centre militaire et politique défendant toute la région. Bien que sa structure reste partiellement intacte le temps a terni ses salles jadis glorieuses. Les ponts de pierre qui le reliaient à la ville sont détruits et l’intérieur montre des signes évidents de délabrement. Les hautes tours de dragon subsistent mais leurs chambres sont vides et la forge autrefois active est désormais inerte. Malgré tout sa position élevée et ses points d’entrée limités offrent encore un avantage stratégique. Bien qu’imposant Procrazion n’est plus qu’une ombre de sa splendeur passée attendant d’être restauré"

  building_procrazion_2:0 "Procrazion"
  building_procrazion_2_desc:0 "Procrazion a été restauré dans sa splendeur d’antan, se dressant fièrement au sommet de la montagne au cœur de la cité. Ce grand château est de nouveau relié à la ville par des ponts reconstruits offrant un accès sans dragon. Les tours de dragon ont également été restaurées fournissant entrée et sortie pour ces créatures majestueuses tandis que les tours à dôme brillent comme avant la Ruine. À l’intérieur tout est équipé pour offrir confort et luxe même en cas de siège. La forge unique sur le flanc de la montagne a repris vie canalisant de nouveau la lave pour forger des armes puissantes. Sa position élevée combinée à sa restauration et à ses points d’entrée limités garantit une défense presque imprenable. Désormais pleinement restauré Procrazion sert non seulement de bastion défensif mais aussi_

  building_eternal_flame_temple_1:0 "Temple abandonné"
  building_type_eternal_flame_temple_1:0 "Temple de la Flamme Éternelle"
  building_type_eternal_flame_temple_1_desc:0 "Le Temple de la Flamme Éternelle était vraisemblablement le point de connexion entre les Dieux Anciens de Valyria et les guerriers valyriens, en plus d’être le centre religieux du peuple. Autrefois élevé comme symbole de la puissance religieuse de Valyria, il est aujourd’hui poussiéreux et abandonné. Il demeure le vague souvenir de ce qui fut jadis un Haut Temple vénéré dans la cosmogonie valyrienne"
  building_eternal_flame_temple_1_desc:0 "Le Temple de la Flamme Éternelle était vraisemblablement le point de connexion entre les Dieux Anciens de Valyria et les guerriers valyriens, en plus d’être le centre religieux du peuple. Autrefois élevé comme symbole de la puissance religieuse de Valyria, il est aujourd’hui poussiéreux et abandonné. Il demeure le vague souvenir de ce qui fut jadis un Haut Temple vénéré dans la cosmogonie valyrienne"

  building_eternal_flame_temple_2:0 "Temple de la Flamme Éternelle"
  building_eternal_flame_temple_2_desc:0 "Le Temple de la Flamme Éternelle a été restauré et se dresse désormais comme symbole de puissance, de foi et d’autorité. Ses murs rénovés racontent les légendes des anciens dieux et renferment des récits connus autrefois seulement des Valyriens antiques. Le peuple peut désormais admirer le luxe et imaginer ce que dragons et magie furent avant la Ruine. Les guerriers viennent prier pour être imprégnés de la rage et de la force des dragons d’antan. Le temple brille comme un phare de foi, d’espoir et de puissance valyrienne, ancienne et nouvelle"

  building_red_guard_barracks_1:0 "Caserne abandonnée"
  building_type_red_guard_barracks_1:0 "Caserne de la Garde Rouge"
  building_red_guard_barracks_1_desc:0 "L’ancienne demeure fière de la Garde Rouge d’élite, adossée aux murs antiques de la cité, est aujourd’hui abandonnée. Le temps a érodé ses remparts brisés et sa structure rouillée témoignant de l’abandon post‑Ruine. À l’arrière, deux tours de dragon ne sont plus que vestiges de la puissance militaire passée. Les salles ne contiennent plus que les fantômes du temps révolu et de la force perdue. Malgré sa décrépitude, cette caserne attend d’être restaurée pour redevenir le bouclier redoutable de la cité"
  building_type_red_guard_barracks_1_desc:0 "L’ancienne demeure fière de la Garde Rouge d’élite, adossée aux murs antiques de la cité, est aujourd’hui abandonnée. Le temps a érodé ses remparts brisés et sa structure rouillée témoignant de l’abandon post‑Ruine. À l’arrière, deux tours de dragon ne sont plus que vestiges de la puissance militaire passée. Les salles ne contiennent plus que les fantômes du temps révolu et de la force perdue. Malgré sa décrépitude, cette caserne attend d’être restaurée pour redevenir le bouclier redoutable de la cité"

  building_red_guard_barracks_2:0 "Caserne de la Garde Rouge"
  building_red_guard_barracks_2_desc:0 "Entièrement restaurée à sa puissance valyrienne, la Caserne de la Garde Rouge est le nouveau foyer des défenseurs de la cité, adossée aux murs glorieux. La structure de pierre évoque sa gloire passée, renforcée et puissante, couverte d’histoires et de cicatrices. Les tours de dragon regorgent de vie et rappellent l’époque où de véritables dragons rugissaient dans les cieux. Les casernes ne sont plus hantées par des fantômes mais par la Garde Rouge restaurée, emplie de discipline, d’excellence et de gloire inégalée. Alliant technologie ancienne et moderne, le bâtiment protège à nouveau la cité et tous ceux qui s’y trouvent"

  building_red_guard_training_compound_1:0 "Centre d’entraînement abandonné"
  building_type_red_guard_training_compound_1:0 "Centre d’entraînement de la Garde Rouge"
  building_red_guard_training_compound_1_desc:0 "Les murs délabrés ne racontent plus les exploits des Gardiens Rouges qui s’y entraînaient. Ce centre d’entraînement autrefois respecté et admiré, rempli de dragons, guerriers et leaders, est aujourd’hui abandonné et vide, incapable de refléter son énergie et sa gloire passées. On y trouve encore armes, donjons et équipements rouillés, laissant imaginer sa splendeur d’antan"
  building_type_red_guard_training_compound_1_desc:0 "Les murs délabrés ne racontent plus les exploits des Gardiens Rouges qui s’y entraînaient. Ce centre d’entraînement autrefois respecté et admiré, rempli de dragons, guerriers et leaders, est aujourd’hui abandonné et vide, incapable de refléter son énergie et sa gloire passées. On y trouve encore armes, donjons et équipements rouillés, laissant imaginer sa splendeur d’antan"

  building_red_guard_training_compound_2:0 "Le Complexe d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_2_desc:0 "Force, honneur et puissance, voilà ce que l'on perçoit en contemplant le Complexe d'Entraînement restauré de la Garde Rouge. Rempli d'hommes aspirant à se couvrir de gloire en rejoignant l'élite de la Garde Rouge, le complexe abrite stratèges, meneurs et guerriers, tous tendant vers l'excellence. Entouré de colonnes majestueuses, couronné d’un toit surélevé percé de fenêtres rouges vers le ciel — seule véritable limite — cet édifice forme désormais les plus grands guerriers et les meilleurs chefs"


l_french:
  # Braavos
  building_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_type_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_agot_EE_titan_of_braavos_desc:0 "Inclus par le célèbre scribe westerosi Lomas Longstrider parmi les Merveilles Faites par l'Homme, le Titan de Braavos constitue la principale ligne de défense de la Cité Libre de Braavos, gardant l'étroite entrée de la lagune où réside la cité. C'est une statue colossale de granit et de bronze à l'effigie d'un guerrier, servant à la fois de forteresse et de phare. Des meurtrières sous la jupe armurée de la statue et des fentes pour flèches sur toute sa cuirasse offrent une défense quasi impénétrable contre les navires ennemis pénétrant dans la lagune."

  building_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_type_agot_EE_sealords_palace:0 "Le Palais du Seigneur de la Mer"
  building_agot_EE_sealords_palace_desc:0 "Le Palais du Seigneur de la Mer est la demeure du Seigneur de la Mer de Braavos. Sous les dômes et les tours de ce vaste palais se trouve une ménagerie exotique d'oiseaux et de bêtes venus des quatre coins du monde."

  # Volantis
  building_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_type_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_agot_EE_black_walls_of_old_volantis_desc:0 "Le cœur de Volantis. Construite par l'ancien [valyrian_freehold|E], cette gigantesque muraille de pierre noire fusionnée protège une série de palais, de cours, de tours et de temples. Seuls ceux dont le sang remonte aux ancêtres valyriens, le Sang Ancien, sont autorisés à y demeurer."

  building_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_type_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_agot_EE_volantis_harbor_desc:0 "La puissance de Volantis provient en partie de son vaste port, notamment en raison de sa situation géographique favorable. Ce vaste lieu en forme de croissant est bâti directement à l'embouchure du Rhoyne et pourrait, dit-on, contenir la totalité de Braavos."

  building_agot_EE_the_long_bridge:0 "Le Long Pont"
  building_type_agot_EE_the_long_bridge:0 "Le Long Pont"
  building_agot_EE_the_long_bridge_desc:0 "Le Long Pont relie les deux moitiés de Volantis et est le plus long pont du monde connu. Construit par l'Ancienne Valyria à son apogée en pierre fusionnée, il pourrait, dit-on, supporter le poids de mille éléphants."

  building_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_type_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Maître de la Lumière"
  building_agot_EE_temple_of_the_lord_of_light_desc:0 "Cet énorme temple s'élève bien au-dessus de tout autre bâtiment de la cité. Ses couleurs éblouissantes d'or, de rouge et d'orange en font un véritable spectacle à contempler. Protégé par la Main Ardente, ce temple sert R'hllor, le Maître de la Lumière, et pourrait être l'un des plus grands témoignages de sa puissance existant."

  building_agot_EE_volantis_walls:0 "Les Murailles de Volantis"
  building_type_agot_EE_volantis_walls:0 "Les Murailles de Volantis"
  building_agot_EE_volantis_walls_desc:0 "Bien que moins impressionnantes que celles de l'Ancienne Volantis, les murailles de Volantis feront réfléchir à deux fois tout attaquant envisageant de prendre la cité d'assaut."

  # Rhoyne
  building_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_01:0 "Le Palais de Nymeria"
  building_agot_EE_nymeria_palace_01_desc:0 "Au cœur de Ny Sar se trouvent les ruines du Palais de Nymeria, abandonné depuis que le [valyrian_freehold|E] a vaincu le Prince Garin lors de la Seconde Guerre des Épices. Ses murs de marbre rose et vert, ses dômes imposants et ses grandes flèches ne sont plus qu'une coquille fantomatique de sa splendeur passée. Toute vie a quitté ce lieu lorsque Nymeria s'est enfuie vers Dorne, laissant ces salles autrefois fières se délabrer."

  building_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_02:0 "Le Palais de Nymeria"
  building_agot_EE_nymeria_palace_02_desc:0 "Se dressant fièrement une fois de plus au cœur de Ny Sar, le Palais de Nymeria a été méticuleusement restauré, témoignage de la résilience et du patrimoine rhoynar. Le marbre vert et rose vibrant brille sous le soleil, tandis que de grands dômes et des flèches vertigineuses dominent désormais le paysage, effaçant presque les souvenirs de son passé tragique."

  building_agot_EE_palace_of_love_01:0 "Palais du Chagrin"
  building_type_agot_EE_palace_of_love_01:0 "Palais du Chagrin"
  building_agot_EE_palace_of_love_01_desc:0 "Le Palais du Chagrin se dresse comme un sombre rappel du destin qui a frappé Chroyane, la Cité des Festivals. Ses tours en ruines, couvertes de mousse et de lianes sombres, ne révèlent rien de la beauté que le Palais de l'Amour incarnait autrefois. Des statues engloutis et les hommes de pierre hantent désormais ses salles brumeuses et en ruine."

  building_agot_EE_palace_of_love_02:0 "Palais de l'Amour"
  building_type_agot_EE_palace_of_love_02:0 "Palais de l'Amour"
  building_agot_EE_palace_of_love_02_desc:0 "Le Palais de l'Amour orne à nouveau les rives du Rhoyne, renaissance époustouflante de l'ancienne gloire de Chroyane. Ses tours s'élèvent haut, ornées de mosaïques vibrantes et de délicates sculptures célébrant la vie, la beauté et l'amour. La lumière du soleil miroite sur des fontaines étincelantes qui alimentent les jardins luxuriants, déversant des fleurs sur chaque terrasse. Sous ses grands dômes, les mariages sont à nouveau bénis, remplissant Chroyane de la promesse de nouveaux commencements."

  building_agot_EE_bridge_of_dream_01:0 "Pont du Rêve"
  building_type_agot_EE_bridge_of_dream_01:0 "Pont du Rêve"
  building_agot_EE_bridge_of_dream_01_desc:0 "Rivalisant autrefois avec le Long Pont de Volantis, le Pont du Rêve surplombe désormais le Rhoyne dans un épais brouillard. Ses arches de pierre s'élevaient autrefois à quarante pieds au-dessus de la rivière, mais se sont effondrées sous une mousse dense et des lianes noires. Devenu lieu de refuge pour les hommes de pierre, il se dresse comme un monument silencieux et pourrissant de l'orgueil perdu des Rhoynar."

  building_agot_EE_bridge_of_dream_02:0 "Pont du Rêve"
  building_type_agot_EE_bridge_of_dream_02:0 "Pont du Rêve"
  building_agot_EE_bridge_of_dream_02_desc:0 "Le Pont du Rêve enjambe à nouveau le Rhoyne dans toute sa gloire. S'élevant à quarante pieds au-dessus de la rivière, ses arches de pierre pâle se tiennent fortes et défiant. Des jardins luxuriants bordent la travée en bois du pont, fleurissant de fleurs de toutes couleurs. Ce grand pont, autrefois perdu dans le temps et les ruines, est rené. Un symbole de la fierté et de la résilience rhoynar au-dessus des eaux coulantes du Rhoyne une fois de plus !"

  # Meereen
  building_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_type_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_agot_EE_great_pyramid_of_meereen_desc:0 "De loin le plus grand bâtiment de la cité, la Grande Pyramide de Meereen fut construite par une petite armée d'esclaves, dont un millier périrent pendant sa construction. La pyramide sert de centre administratif de Meereen et les dirigeants de la cité utilisent la Grande Salle pour recevoir leurs sujets depuis des siècles."

  # Asshai
  building_stygai_01:0 "Cité Hantée de Stygai"
  building_type_stygai_01:0 "Stygai"
  building_stygai_01_desc:0 "Stygai, la cité énigmatique et ancienne enveloppée dans le cœur obscur des Terres de l'Ombre, demeure l'un des mystères les plus terrifiants du monde. D'une ancienneté insondable et drapée dans une obscurité éternelle, la cité se dresse comme un monument d'une ère oubliée. Même les plus audacieux des lieurombres n'osent s'aventurer dans ses rues abandonnées. On dit que les flèches imposantes et les ruelles labyrinthiques sont parcourues par des démons et autres créatures. Voilée de secret, ses véritables origines et l'étendue de ses pouvoirs obscurs restent inconnues."

  # Gogossos
  building_red_citadel_01:0 "La Tour Rouge"
  building_type_red_citadel_01:0 "La Tour Rouge"
  building_red_citadel_01_desc:0 "Une grande tour côtière, considérée comme le dernier vestige d'une forteresse autrefois puissante, sert désormais de principal bastion de la cité. Bien qu'une grande partie de la structure originale ait été perdue avec le temps, ce bastion solitaire perdure—petit mais incroyablement robuste et hautement défendable. D'épais murs de pierre altérée résistent fermement tant aux éléments qu'aux sièges potentiels, en faisant un siège d'autorité fiable au sein de Gogossos. Bien que ce ne soit pas encore une grande citadelle, elle reste un donjon formidable, une fondation sur laquelle de plus grandes fortifications pourront un jour s'élever."

  building_red_citadel_02:0 "La Redoute Rouge"
  building_type_red_citadel_02:0 "La Redoute Rouge"
  building_red_citadel_02_desc:0 "Désormais renforcée par une solide palissade en bois et des tours de guet au sommet des anciennes Vestiges Cramoisis, cette redoute est devenue une forteresse plus formidable, capable de résister à des menaces prolongées. N'étant plus simplement une tour côtière solitaire, les défenses élargies lui permettent maintenant d'abriter une garnison décente, offrant un solide point d'appui dans Gogossos. Avec des provisions abondantes et des positions renforcées, elle pourrait même soutenir une armée pendant des mois si nécessaire, marquant sa transformation d'une simple relique du passé en un véritable bastion de pouvoir au sein de la cité."

  building_red_citadel_03:0 "La Citadelle Rouge"
  building_type_red_citadel_03:0 "La Citadelle Rouge"
  building_red_citadel_03_desc:0 "Jadis simple vestige du passé, la Citadelle Rouge a été reconstruite en une vaste et inflexible forteresse, surplombant Gogossos comme le siège ultime du pouvoir de la cité. N'étant plus une simple tour solitaire, elle se dresse maintenant comme un donjon et une forteresse entièrement restaurés, ses murailles colossales de Pierre Noire Valyrienne s'élevant hautes et épaisses, monument de domination et d'effroi.\n\nComme la Porte Cramoisie, les murs de la Citadelle Rouge furent autrefois imprégnés de rituels de magie du sang pratiqués par les anciens Valyriens, leur sorcellerie tachant à jamais la pierre d'un cramoisi profond et contre-nature. Bien que les rituels aient depuis longtemps sombré dans l'histoire, leur sombre héritage perdure, faisant de la citadelle non seulement une forteresse quasi impénétrable, mais aussi un symbole inquiétant de pouvoir absolu.\n\nEn son cœur, La Tour Rouge perce le ciel, sa présence projetant une longue ombre sur la cité, un rappel constant de l'autorité de l'archonte. Les murs inférieurs et la cour restent luisants de sang, non seulement à cause des rituels du passé, mais aussi des innombrables exécutions, trahisons et conflits brutaux qui se sont déroulés sur ses pierres. Le sang des rebelles, des conspirateurs et des ennemis de l'État a imprégné ses fondations, garantissant que la peur soit tissée dans la structure même de la forteresse.\n\nOn murmure qu'à l'intérieur de ces murs, la Mort Rouge a pris racine, une malédiction qui a jadis ravagé Gogossos, laissant des quartiers entiers noyés dans le sang et la souffrance. Bien que la maladie ait depuis longtemps disparu de l'histoire, certains disent que la citadelle s'en souvient encore, que les fantômes des mourants persistent dans ses chambres les plus profondes, murmurant à ceux qui écoutent.\n\nLieu de règne de fer et de légende, la Citadelle Rouge est plus qu'une simple forteresse—c'est le cœur inflexible de Gogossos, un lieu où le pouvoir est absolu, la miséricorde rare, et la rébellion écrasée avant même qu'elle ne commence."

  building_pit_of_sorrows_01:0 "Donjon et Ruines Envahis"
  building_type_pit_of_sorrows_01:0 "Donjon et Ruines Envahis"
  building_pit_of_sorrows_01_desc:0 "Un donjon en ruine, ses murs jadis puissants maintenant drapés de vignes rampantes et engloutis par l'étreinte implacable de la nature, se dresse dans un silence inquiétant. Des arbres ont pris racine dans ses cours, leurs branches tordues griffant le ciel, comme s'ils témoignaient d'horreurs oubliées.\n\nMalgré la décrépitude, le donjon reste étrangement défendable—ses tours, bien qu'altérées, se dressent encore avec une présence imposante. Sa porte, à moitié ensevelie sous la mousse et les décombres, suggère une forteresse qui refuse de céder entièrement au temps.\n\nPourtant, quelque chose semble profondément dérangeant dans cet endroit. L'air est épais d'une immobilité contre-nature, celle qui fait frissonner la peau et rend l'esprit mal à l'aise. Des ombres s'attardent là où elles ne devraient pas, et des murmures—trop faibles pour être le vent—semblent dériver à travers les ruines, évoquant des secrets qu'il vaudrait mieux ne pas perturber."

  building_pit_of_sorrows_02:0 "Donjon et Fouilles de la Fosse"
  building_type_pit_of_sorrows_02:0 "Donjon et Fouilles de la Fosse"
  building_pit_of_sorrows_02_desc:0 "En élargissant nos efforts et en dégageant l'épais enchevêtrement de végétation, nous avons fait une découverte surprenante : le sol sous nos pieds semblait descendre sans fin, peu importe la quantité de boue et de débris que nous retirions. Ce qui semblait d'abord n'être qu'une simple surcroissance dissimulant les ruines s'est révélé être une vaste descente en couches, chaque niveau inférieur exposant des vestiges du passé.\n\nParmi les pierres émiettées et la terre humide, nous avons déterré d'innombrables ossements—leurs origines inconnues, leurs histoires depuis longtemps perdues. À chaque pas vers le bas, une certitude grandissante s'imposait : ceci pourrait bien être la légendaire Fosse des Chagrins, un lieu murmuré dans les légendes craintives, ses profondeurs intactes et ses mystères attendant encore d'être dévoilés."

  building_pit_of_sorrows_03:0 "La Fosse des Chagrins"
  building_type_pit_of_sorrows_03:0 "La Fosse des Chagrins"
  building_pit_of_sorrows_03_desc:0 "L'ancienne Fosse des Chagrins, autrefois une ruine croulante, a été méticuleusement reconstruite et restaurée dans sa sinistre grandeur d'antan. Pourtant, malgré tous les efforts pour reconquérir ses hauteurs, les véritables profondeurs demeurent un abîme insondable. L'obscurité inférieure s'étend à l'infini, engloutissant aussi bien la lumière que le son, une gueule béante vers l'inconnu. Nombreux sont ceux qui ont osé descendre à la recherche de secrets perdus dans le temps, mais aucun n'est jamais revenu parler de ce qui se trouve au fond—si, en effet, un fond existe."

  building_the_toad:0 "Le Crapaud Noir"
  building_type_the_toad:0 "Le Crapaud Noir"
  building_the_toad_desc:0 "La plus grande statue jamais construite sur l'Île des Crapauds domine le paysage, une relique monolithique d'une civilisation depuis longtemps disparue. Sculptée dans une pierre noire inconnue et huileuse qui semble luire même en l'absence de lumière, elle prend la forme d'un grand crapaud—trapu, grotesque et d'un réalisme inquiétant. Personne ne sait qui l'a construite, ni dans quel but, et quelle que soit la signification qu'elle avait autrefois, elle s'est perdue depuis longtemps. Pour la plupart, ce n'est rien de plus qu'une effigie grossière et sinistre, une curiosité bizarre dans une terre déjà imprégnée de mystère. Pourtant, il y a des murmures—parlés à voix basse par les locaux—d'étranges rêves qui viennent à ceux qui dorment trop près, d'une chaleur troublante dans la pierre lorsqu'on la touche, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait de l'intérieur."
  building_type_the_toad_desc:0 "La plus grande statue jamais construite sur l'Île des Crapauds domine le paysage, une relique monolithique d'une civilisation depuis longtemps disparue. Sculptée dans une pierre noire inconnue et huileuse qui semble luire même en l'absence de lumière, elle prend la forme d'un grand crapaud—trapu, grotesque et d'un réalisme inquiétant. Personne ne sait qui l'a construite, ni dans quel but, et quelle que soit la signification qu'elle avait autrefois, elle s'est perdue depuis longtemps. Pour la plupart, ce n'est rien de plus qu'une effigie grossière et sinistre, une curiosité bizarre dans une terre déjà imprégnée de mystère. Pourtant, il y a des murmures—parlés à voix basse par les locaux—d'étranges rêves qui viennent à ceux qui dorment trop près, d'une chaleur troublante dans la pierre lorsqu'on la touche, et d'yeux qui semblent scintiller juste sous sa surface, comme si quelque chose observait de l'intérieur."

  building_ax_hold:0 "La Forteresse de la Hache"
  building_type_ax_hold:0 "La Forteresse de la Hache"
  building_ax_hold_desc:0 "La forteresse de la Maison Xhore se dresse à la fois comme un sanctuaire et une forteresse, un bastion de pierre et d'acier construit pour endurer les tempêtes des Îles du Basilic. Nichée au sommet de falaises déchiquetées et entourée d'eaux perfides, elle fut conçue non seulement comme une demeure, mais comme un bastion inébranlable d'où les pirates qarthiens des Îles Occidentales pouvaient lancer leurs infâmes raids. Ses murs, altérés mais formidables, portent les cicatrices d'innombrables batailles, tandis que ses tours de guet imposantes offrent une vue imprenable sur la mer environnante, toujours à l'affût des proies comme des poursuivants."

  building_garden_of_malice_01:0 "Un Grand Fort Envahi par la Végétation"
  building_type_garden_of_malice_01:0 "Un Grand Fort Envahi par la Végétation"
  building_garden_of_malice_01_desc:0 "Une vaste enceinte circulaire envahie par la végétation encercle les ruines, ses pierres anciennes à peine visibles sous des couches de vignes rampantes et d'épaisse mousse. En son cœur se dresse un donjon en ruine, ses tours brisées et à demi-englouties par l'étreinte implacable de la nature. Le temps a effacé toute l'histoire que ce lieu possédait autrefois, ne laissant qu'un silence inquiétant et suffocant dans son sillage.\n\nPourtant, ceux qui osent franchir les portes fracassées réalisent rapidement pourquoi personne n'a réclamé ces ruines—cet endroit est un piège mortel. Des haies tortueuses, devenues sauvages et contre-nature, forment un labyrinthe complexe, leurs chemins se déplaçant et se refermant comme des êtres vivants, entraînant les imprudents plus profondément dans la confusion. Parmi la verdure enchevêtrée se cachent des plantes aux couleurs impossibles et aux formes anormales, leur beauté masquant une intention mortelle. Certaines libèrent des spores qui étouffent les poumons, d'autres sécrètent des toxines qui boursouflent la peau, et quelques-unes se déplacent avec un dessein inquiétant, attendant qu'une proie s'approche trop près.\n\nLes légendes murmurent que quelque chose—peut-être les vestiges d'une sorcellerie oubliée, ou la présence persistante de la force qui régnait autrefois ici—maintient la flore prospère d'une manière qui défie la nature. Les ruines restent intactes, non parce qu'elles sont oubliées, mais parce qu'elles sont craintes. Même les pillards et les chercheurs de trésors les plus hardis savent qu'il ne faut pas tenter la colère d'un lieu où les plantes elles-mêmes semblent avoir soif de sang."

  building_garden_of_malice_02:0 "Le Jardin de la Malice"
  building_type_garden_of_malice_02:0 "Le Jardin de la Malice"
  building_garden_of_malice_02_desc:0 "Le Jardin de la Malice est une forteresse de mort stratifiée, construite de pierre noire huilée et cernée de défenses mortelles. Un vaste labyrinthe mouvant de vignes épineuses, de floraisons toxiques et de haies tortueuses l'entoure, où la lumière pénètre à peine et où rôdent des prédateurs invisibles. Au-delà du labyrinthe s'étend un fossé noir rempli d'horreurs et de murailles imposantes gardées par des sentinelles silencieuses. En son cœur se dresse un donjon valyrien, intact malgré le temps, couronné par un arbre pétrifié dont les racines semblent se nourrir de la forteresse elle-même. Plus qu'un bastion, le Jardin est un lieu où la terre elle-même cherche à détruire les intrus."

  building_sapphire_quarter:0 "Le Quartier Saphir"
  building_type_sapphire_quarter:0 "Le Quartier Saphir"
  building_sapphire_quarter_desc:0 "Le Quartier Saphir est un vaste district fortifié perché au sommet de la plus haute colline de Gogossos. Jadis domaine des Seigneurs Dragons d'antan, il sert désormais d'enclave exclusive aux plus illustres maîtres d'esclaves et princes marchands de la cité. Seule l'élite peut résider à l'intérieur de ses murs, car ici, ne se dressent que de grands manoirs et des palais—construits de marbre étincelant et ornés d'or. Ses marchés privés sont drapés des plus fines soies, réservés à ceux qui peuvent s'offrir des luxes hors de portée des hommes de moindre rang."

  building_crimson_gate:0 "La Porte Cramoisie"
  building_type_crimson_gate:0 "La Porte Cramoisie"
  building_crimson_gate_desc:0 "La Porte Cramoisie est l'unique entrée terrestre de Gogossos, un bastion imposant de Pierre Noire Valyrienne qui surplombe le pont périlleux menant à la cité. Sa surface absorbe la lumière, imprégnée de sombre sorcellerie et tachée de rouge par d'anciens rituels sanglants. S'élevant à 140 pieds de haut, la porte impose crainte et effroi, ses murs couronnés de statues de dragons dont les yeux de gemmes semblent presque vivants. Plus qu'une barrière, la Porte Cramoisie est un monument à la puissance oubliée de Gogossos et à l'héritage sombre de Valyria."

  building_glittering_pits_01:0 "Les Fosses Scintillantes"
  building_type_glittering_pits_01:0 "Les Fosses Scintillantes"
  building_glittering_pits_01_desc:0 "Les jungles de Gogossos et la tristement célèbre Île des Larmes sont une vaste étendue sauvage indomptée—une terre grouillant de périls et de richesses inimaginables. Véritable trésor de ressources naturelles, le feuillage dense et ombragé dissimule des merveilles au-delà de toute mesure pour ceux assez audacieux pour braver ses dangers.\n\nParmi les plus convoités de ses trésors se trouvent les diamants et les saphirs, étincelant profondément dans la terre comme l'essence emprisonnée des étoiles. Ces pierres précieuses, rares et d'une qualité sans pareille, ont fait de la région une légende murmurée parmi les négociants et les chercheurs de fortune. Bien que les mines ici restent modestes mais puissantes, leurs rendements sont étonnants, chaque excavation déterrant des pierres d'une brillance époustouflante."

  building_glittering_pits_02:0 "Les Cavernes Miroitantes"
  building_type_glittering_pits_02:0 "Les Cavernes Miroitantes"
  building_glittering_pits_02_desc:0 "À mesure que les mines s'agrandissent, elles s'étendent en un vaste réseau de tunnels souterrains, serpentant à travers le sol de la jungle comme les racines des arbres anciens au-dessus. Les parois scintillent de pierres précieuses, leurs couleurs se reflétant dans la faible lumière des torches, et des chambres cachées sont découvertes, révélant de riches veines attendant d'être exploitées. Cependant, plus les mineurs creusent profondément, plus la jungle commence à riposter—des racines jaillissent à travers les murs, des spores toxiques s'attardent dans l'air, et d'étranges créatures invisibles s'agitent dans l'obscurité."

  building_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_type_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_glittering_pits_03_desc:0 "Les Profondeurs Étoilées constituent la partie la plus riche et la plus dangereuse des mines de Gogossos—un vaste labyrinthe de tunnels et de cavernes scintillantes où des saphirs sans défaut et d'immenses diamants captent même la plus faible lumière, ressemblant à un ciel étoilé souterrain. Les mineurs travaillent sans relâche pour extraire ces trésors, bien que plus ils s'enfoncent, plus cela devient périlleux. Dans les chambres les plus profondes, d'étranges tremblements, une chaleur oppressante et des murmures d'aperçus de choses contre-nature ont rendu certaines zones interdites. C'est un lieu de grande richesse et de risque plus grand encore—où creuser trop profondément pourrait réveiller quelque chose qu'il vaudrait mieux laisser enfoui."

  building_darkreach_quay_01:0 "Quai de Sombreporte"
  building_type_darkreach_quay_01:0 "Quai de Sombreporte"
  building_darkreach_quay_01_desc:0 "Le Quai de Sombreporte est le cœur humble mais vital du commerce de Gogossos, première étape de l'infrastructure portuaire grandiose de la cité. Modeste port de pierre et de bois, il s'étend dans les eaux sombres de la baie, ses quais usés gémissant sous le poids des navires arrivants. Bien que petit, il est stratégiquement positionné pour servir de point d'entrée principal aux marchands, contrebandiers et aventuriers cherchant fortune à Gogossos."

  building_darkreach_quay_02:0 "Port de Sombreporte"
  building_type_darkreach_quay_02:0 "Port de Sombreporte"
  building_darkreach_quay_02_desc:0 "Avec l'expansion de l'empire commercial de Gogossos, le Port de Sombreporte s'est transformé en un centre commercial animé, bien au-delà de ses humbles débuts. Les quais ont été renforcés de pierre et de bois solide, permettant aux plus grands navires marchands d'ancrer en toute sécurité et de décharger leurs cargaisons exotiques. De nouvelles jetées s'étendent plus loin dans les eaux sombres, accueillant un flux croissant de navires venus de terres lointaines, attirés par les richesses des saphirs, des diamants et des rares produits de la jungle de Gogossos."

  building_darkreach_quay_03:0 "Le Port de Marée Noire"
  building_type_darkreach_quay_03:0 "Le Port de Marée Noire"
  building_darkreach_quay_03_desc:0 "Avec la renaissance de Gogossos, son port commercial autrefois modeste s'est transformé en Port de Marée Noire, colossal bastion du commerce et de la puissance navale. Non plus simple étape pour les commerçants, il est devenu un épicentre florissant du commerce international, attirant marchands, mercenaires et chercheurs de fortune des quatre coins du monde connu.\n\nLe port est désormais fortifié de Pierre Noire Valyrienne, ses puissantes murailles encerclant les quais animés, offrant une défense inégalée contre les raids et les sièges. Ces remparts imposants, reforgés des ruines du passé, témoignent de la résurgence de la cité, garantissant que la richesse et l'influence de Gogossos demeurent intouchables."

  building_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
  building_type_last_dragon_tower_01:0 "La Dernière Tour du Dragon"
  building_last_dragon_tower_01_desc:0 "La dernière Tour du Dragon survivante hors de Valyria, construite dans les derniers jours avant le Fléau, se dresse comme un monument à la fois de puissance et de tragédie. Originellement construite pour abriter la famille régnante des Seigneurs Dragons de Gogossos, ses salles devaient être un symbole de leur règne éternel — mais le destin en a décidé autrement. Lorsque la famille périt dans l'anéantissement de Valyria, la tour devint une relique silencieuse d'un empire perdu, sa présence projetant une longue ombre sur la cité.\n\nMaintenant, elle sert un nouveau maître — l'Archonte de Gogossos et sa famille, qui règnent depuis ses hauteurs élevées. Plus uniquement symbole de la grandeur valyrienne, la Tour du Dragon est un rappel aux classes inférieures, aux esclaves et aux potentiels rebelles de la hiérarchie brutale de la cité. Elle se dresse comme un témoignage inébranlable de domination, un avertissement permanent que l'élite de Gogossos écrasera quiconque oserait se dresser contre elle."

  # Valyria
  building_type_valyria_volcano:0 "L'une des Quatorze Flammes"

  building_valyria_volcano_01:0 "Mont Gaelithox"
  building_type_valyria_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_01_desc:0 "Gaelithox est l'un des volcans les plus redoutables parmi les légendaires Quatorze Flammes de Valyria. Dominant le paysage environnant, son sommet est perpétuellement voilé d'un épais manteau de fumée et de cendres. Les pentes du volcan sont marquées par d'anciennes coulées de lave, désormais solidifiées en formations rocheuses noires et acérées, vestiges du Fléau."

  building_valyria_volcano_02:0 "Rhazalhar"
  building_type_valyria_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_02_desc:0 "Rhazalhar est le plus grand des Quatorze Flammes, un colosse de fureur incandescente et de puissance ancienne. Son sommet, constamment voilé de fumée et de cendres, perce les cieux et projette son ombre sur le paysage environnant. Des rivières de lave s'écoulent de son cœur ardent, traçant des chemins lumineux à travers la roche volcanique sombre. En raison des températures extrêmes autour du volcan, l'exploitation minière y est impossible."

  building_valyria_volcano_03:0 "Epaekros"
  building_type_valyria_volcano_03:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_03_desc:0 "Epaekros est plus dangereux que les autres volcans, une beauté sauvage aux falaises instables qui font tomber des rochers sur les randonneurs et aux sols glissants causant des chutes mortelles. Ceux qui atteignent son sommet rencontrent souvent une fin tragique à cause d'une vouivre ou d'un dragon nichant. Pourtant, pour ceux qui parviennent à s'enfoncer dans le volcan, richesses, or et métaux précieux abondent."

  building_valyria_volcano_04:0 "Tartarax"
  building_type_valyria_volcano_04:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_desc:0 "S’élevant haut dans le ciel, bien que moins que Rhazalhar, Tartarax est un volcan plus élancé mais plus profond dont le sommet curieusement façonné constitue un nid idéal pour toute créature avide de feu, ses cavernes et tunnels profonds offrent de vastes opportunités minières mais aussi la mort, lave et créatures hostiles abondent dans ce donjon sombre et profond, pourtant la lueur de sa lave majestueuse, visible de loin dans l’obscurité de la nuit, reste inoubliable"
  building_valyria_volcano_04_01:0 "Tartarax"
  building_type_valyria_volcano_04_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_01_desc:0 "S'élevant haut dans le ciel, bien que pas aussi haut que Rhazalhar, Tartarax est un volcan plus mince mais plus profond dont le sommet curieusement façonné offre un terrain de nidification idéal pour toute créature aimant le feu. Ses profondes cavernes et tunnels offrent d'amples opportunités minières mais aussi la mort. Lave et créatures hostiles abondent dans ce donjon sombre et profond. Pourtant, l'éclat de sa lave majestueuse, visible de loin dans l'obscurité de la nuit, reste inoubliable."

  building_valyria_volcano_04_02:0 "Tartarax"
  building_type_valyria_volcano_04_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_04_02_desc:0 "S'élevant haut dans le ciel, bien que moins haut que Rhazalhar, Tartarax est un volcan plus mince mais plus profond, dont le sommet de forme curieuse constitue un terrain idéal pour toute créature amante du feu. Ses profonds tunnels et cavernes offrent de nombreuses possibilités d’exploitation minière, mais aussi la mort. La lave et les créatures hostiles y abondent. Pourtant, la lueur majestueuse de sa lave, visible de loin dans l’obscurité de la nuit, reste inoubliable."

  building_valyria_volcano_05:0 "Yontaryos"
  building_type_valyria_volcano_05:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_05_desc:0 "Lorsque Yontaryos fut découvert pour la première fois par les anciens Valyriens, il différait des autres volcans de la région. Il était petit et relativement bas, avec peu de magma et un espace limité pour que les dragons y nichent. Cependant, il avait ses utilités. Des minéraux précieux pouvaient toujours en être extraits, et sa petite taille le rendait idéal pour les rituels et les sacrifices, même si ses flammes ne brûlaient pas aussi intensément que les autres."

  building_type_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01:0 "Le Grand Port d'Elyria"
  building_elyria_great_port_01_desc:0 "Le Grand Port d'Elyria est un immense chantier naval construit durant les jours du [valyrian_freehold_short|E]. La position stratégique d'Elyria dans la Baie des Esclaves offre à cette petite île un important trafic de navires, de commerce et d'esclaves, que ce port massif peut accueillir. Après l'effondrement du [valyrian_freehold_short|E], ce port a capturé une part significative du commerce de la Baie des Esclaves, devenant l'envie de la région et de ses environs."

  building_type_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
  building_elyria_dragon_palace_01:0 "Le Palais du Dragon d'Elyria"
  building_elyria_dragon_palace_01_desc:0 "Le Palais du Dragon est une station luxueuse et grandiose offrant tout ce qu'un seigneur pourrait désirer : grandes salles, immenses salles de banquet, piscines, caves à vin, et bien plus encore. Construit durant l'ère du [valyrian_freehold_short|E] pour abriter le gouverneur d'Elyria, aucune dépense ne fut épargnée. Aujourd'hui, il abrite le Duc d'Elyria, lui conférant splendeur et renommée."

  building_type_valyria_volcano_04:0 "$building_type_valyria_volcano$"

  building_type_valyria_dead_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01:0 "Syrabelos"
  building_valyria_dead_volcano_01_desc:0 "Syrabelos est un volcan éteint, la lave qui autrefois s’y écoulait est depuis longtemps solidifiée. Cela ne le rend pas inutile, car il reste riche en minéraux et métaux précieux à exploiter et peut toujours servir de refuge lors de raids ou tempêtes"

  building_valyria_dead_volcano_01_01:0 "Syrabelos"
  building_type_valyria_dead_volcano_01_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_01_desc:0 "Syrabelos est un volcan éteint, la lave qui y coulait autrefois s'est depuis longtemps tarie. Cela ne signifie pas qu'il soit inutile, car il reste riche en minéraux et métaux précieux à exploiter et peut encore servir de refuge lors de raids ou de tempêtes."


  building_valyria_dead_volcano_01_02:0 "Mines de Syrabelos"
  building_type_valyria_dead_volcano_01_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_01_02_desc:0 "Les opérations minières ont été restaurées à Syrabelos. Des esclaves descendent quotidiennement dans les fosses pour extraire des métaux précieux et d'autres matériaux de valeur pour leurs oppresseurs."

  building_type_valyria_dead_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02:0 "Qazdarsos"
  building_valyria_dead_volcano_02_desc:0 "Qazdarsos était autrefois un volcan actif mais ne l’est plus, désormais dormant mais non silencieux. Les cris de firewyrms et, selon certains, même de fantômes se font encore entendre depuis ses profondeurs. Certains ont osé s’y aventurer sans être assez nombreux et n’ont jamais été revus"

  building_valyria_dead_volcano_02_01:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_01:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_01_desc:0 "Qazdarsos était autrefois un volcan actif mais ne l'est plus. Désormais dormant mais pas silencieux, les cris des vouivres de feu et, selon certains, même des fantômes peuvent encore être entendus depuis ses profondeurs. Certains ont osé s'y aventurer sans un groupe suffisamment important et n'ont jamais été revus."


  building_valyria_dead_volcano_02_02:0 "Qazdarsos"
  building_type_valyria_dead_volcano_02_02:0 "$building_type_valyria_volcano$"
  building_valyria_dead_volcano_02_02_desc:0 "Les mines de Qazdarsos sont à nouveau pleinement opérationnelles. Les esclaves extraient quotidiennement richesses et or pour leurs maîtres. Cependant, les récits d'êtres surnaturels et de créatures maudites persistent à propos de l'intérieur du volcan. Que ceux-ci soient vrais ou simplement les divagations d'esclaves est une autre question..."

  building_royal_barracks_of_valyria_01:0 "Les Casernes en Ruine de Valyria"
  building_type_royal_barracks_of_valyria_01:0 "Les Casernes en Ruine de Valyria"
  building_royal_barracks_of_valyria_01_desc:0 "Autrefois grandioses casernes du [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont maintenant que ruines et guère plus qu'un tas de décombres."
  building_type_royal_barracks_of_valyria_01_desc:0 "Autrefois grandioses casernes du [valyrian_freehold_short|E] destinées à défendre la cité, elles ne sont maintenant que ruines et guère plus qu'un tas de décombres."

  building_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_type_royal_barracks_of_valyria_02:0 "Les Casernes Royales de Valyria"
  building_royal_barracks_of_valyria_02_desc:0 "Les Casernes Royales restaurées de Valyria, bâties sur les anciennes ruines, voient désormais gardes et soldats aller et venir pour assurer la sécurité des voyageurs et des citoyens."

  building_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_type_great_arena_of_valyria_01:0 "Les Vestiges de la Grande Arène"
  building_great_arena_of_valyria_01_desc:0 "Autrefois une grande arène remplie de gladiateurs et de spectateurs, elle n'est maintenant qu'en ruines. Sa restauration sera coûteuse, mais elle pourrait ramener la joie au peuple."

  building_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_type_great_arena_of_valyria_02:0 "La Grande Arène de Valyria"
  building_great_arena_of_valyria_02_desc:0 "Désormais reconstruite, la Grande Arène attire des milliers de spectateurs pour assister à des tournois et des jeux sanglants où professionnels et esclaves meurent dans le sable pour le divertissement du peuple."

  building_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_type_great_library_of_valyria_01:0 "Ruines Décrépites de la Bibliothèque"
  building_great_library_of_valyria_01_desc:0 "Les restes en ruine de la grande bibliothèque pourraient être restaurés pour abriter de grandes œuvres d'art et de littérature."

  building_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_type_great_library_of_valyria_02:0 "La Grande Bibliothèque de Valyria"
  building_great_library_of_valyria_02_desc:0 "La Grande Bibliothèque restaurée de Valyria, remplie de grandes œuvres d'art, de littérature et de philosophie. Érudits et universitaires y étudient textes et parchemins anciens."

  building_valyria_veilspire_peak:0 "Pic de Voileflèche"
  building_type_valyria_veilspire_peak:0 "Pic de Voileflèche"
  building_valyria_veilspire_peak_desc:0 "Le Pic de Voileflèche est le plus haut sommet montagneux de toute la péninsule valyrienne, même avant le Fléau. Jadis utilisé comme lieu de pèlerinage sacré pour les plus braves et les plus forts, ce grand sommet représente une épreuve divine. On dit que ceux qui parviennent à grimper jusqu'au sommet en reviennent plus sages et plus savants."

  building_velakar_resort_01:0 "Un Ancien Lieu de Villégiature en Ruines"
  building_type_velakar_resort_01:0 "Un Ancien Lieu de Villégiature en Ruines"
  building_velakar_resort_01_desc:0 "Autrefois un Grand Lieu de Villégiature pour les Seigneurs Dragons et les riches marchands, ce domaine est maintenant en ruines, à peine mieux qu'un tas de briques."

  building_velakar_resort_02:0 "L'Illustre Villégiature de Velakar"
  building_type_velakar_resort_02:0 "L'Illustre Villégiature de Velakar"
  building_velakar_resort_02_desc:0 "L'Illustre Villégiature de Velakar, désormais restaurée, accueille les personnes fortunées et de haut rang pour se baigner et se détendre dans ce domaine majestueux digne d'un empereur. Utilisant la chaleur volcanique pour réchauffer les bains et avec des milliers de serviteurs à leur service, c'est véritablement un spectacle à contempler."

  building_aurions_lost_expidition:0 "L'Expédition Perdue d'Aurion"
  building_type_aurions_lost_expidition:0 "L'Expédition Perdue d'Aurion"
  building_aurions_lost_expidition_desc:0 "Voici l'expédition perdue d'Aurion Varezys, autoproclamé Empereur de Valyria. Cette plaine aride est maintenant le lieu de sépulture de 30 000 hommes, réduits à de simples amas de métal et d'os, souillés par la radiation et les gaz toxiques des geysers de soufre. C'est véritablement un paysage infernal."

  building_lokirian_barracks_01:0 "Les Vestiges d'une Caserne"
  building_lokirian_barracks_01_desc:0 "Autrefois les puissantes casernes de Lokiria, maintenant réduites à rien d'autre qu'un tas de décombres."

  building_lokirian_barracks_02:0 "Les Puissantes Casernes de Lokiria"
  building_lokirian_barracks_02_desc:0 "Les casernes de Lokiria, maintenant reconstruites et fortifiées avec de la pierre de dragon et de l'acier valyrien. Des soldats marchent jour et nuit, présentant un spectacle imposant et un cauchemar pour quiconque oserait en faire le siège."

  building_redwyrms_wrath_01:0 "Forteresse en Ruines"
  building_type_redwyrms_wrath_01:0 "Forteresse en Ruines"
  building_redwyrms_wrath_01_desc:0 "La Colère du Wyrm Rouge était une redoutable forteresse faite de murs en pierre de dragon et de flèches imposantes, autrefois ornée des crânes de dragons abattus comme sinistres trophées de ses conquêtes. Gouvernée par le Seigneur Protecteur Taurion de Lokiria, c'était un bastion de guerre et de domination, ses bannières cramoisies inspirant la peur à travers le pays. Maintenant en ruines, la Colère du Wyrm Rouge n'est plus que l'ombre de sa gloire d'antan, ses murs brisés et ses bannières fanées se dressant comme des reliques du règne violent de Lokiria."

  building_redwyrms_wrath_02:0 "La Colère du Wyrm Rouge"
  building_type_redwyrms_wrath_02:0 "Forteresse en Ruines"
  building_redwyrms_wrath_02_desc:0 "La Colère du Wyrm Rouge s'est relevée, ses murs de pierre de dragon restaurés dans leur sinistre gloire, dominant à nouveau le paysage comme un symbole de terreur et de puissance. De nouveau ornée de crânes de dragons et de bannières cramoisies portant le sigle du Dragon Rouge de Lokiria, la forteresse exhale une sombre détermination. Reconstruite à la fois comme monument à la guerre et déclaration de domination, la Colère du Wyrm Rouge inspire tant la peur que le respect, sa renaissance témoignant d'un héritage durable de conquête."

  building_valyrian_gate_01:0 "Ruines de la Porte"
  building_type_valyrian_gate_01:0 "Ruines de la Porte"
  building_valyrian_gate_01_desc:0 "Ruines de la jadis grande Porte de Valyria, puissant symbole de richesse et de pouvoir désormais réduit à un tas de briques."

  building_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_type_valyrian_gate_02:0 "La Grande Porte Valyrienne"
  building_valyrian_gate_02_desc:0 "La Grande Porte de Valyria, sept portes et sept herses faites et renforcées d'acier valyrien. Des milliers de marchands et de voyageurs passent par ces portes. D'immenses statues de héros autrefois glorieux peuvent être vues au sommet de l'entrée."

  building_great_harbor_of_valyria_01:0 "Baie pour un Port"
  building_type_great_harbor_of_valyria_01:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_01_desc:0 "Cette baie est suffisamment grande et profonde pour y construire un grand port. Pour l'instant, il n'y a pas grand-chose ici, à part du poisson."

  building_great_harbor_of_valyria_02:0 "Quais et Ateliers de Réparation"
  building_type_great_harbor_of_valyria_02:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_02_desc:0 "Pour faciliter le commerce et la construction navale, et pour établir un riche centre commercial et un contrôle maritime, nous devons construire un grand port. Pour l'instant, nous construirons de longs quais et des ateliers de réparation pour la production de navires. Nous ajouterons également une cabine d'intendance pour le commerce et un bureau d'inspection pour taxer et garantir qu'aucune marchandise de contrebande n'entre dans notre cité."

  building_great_harbor_of_valyria_03:0 "Quais"
  building_type_great_harbor_of_valyria_03:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_03_desc:0 "La construction de quais et l'extension de l'infrastructure actuelle nous permettront d'accueillir plus de navires et d'augmenter le commerce entrant. Ces extensions seront également utilisées pour amarrer les vaisseaux militaires servant notre flotte."

  building_great_harbor_of_valyria_04:0 "Grues et Fournitures de Construction Navale"
  building_type_great_harbor_of_valyria_04:0 "Le Grand Port de Valyria"
  building_great_harbor_of_valyria_04_desc:0 "En construisant de grandes grues, nous pouvons grandement augmenter l'efficacité de notre port et permettre à plus de navires d'arriver et de partir. Nous construirons également une zone d'approvisionnement pour la construction navale près du port pour améliorer l'efficacité de la construction de nos navires de guerre. Avec ce Grand Port, personne ne pourra nous défier en mer."

  building_great_temple_of_valyria_01:0 "Colline pour un Temple"
  building_type_great_temple_of_valyria_01:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_01_desc:0 "Pour vénérer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il y a une colline près du Mont Tartarax que nous pourrions utiliser pour construire un Magnifique et Illustre Temple pour nos Dieux Dragons. Le fait qu'il soit proche d'un volcan convient encore mieux à nos besoins."
  building_type_great_temple_of_valyria_01_desc:0 "Pour vénérer et satisfaire les Dieux, nous aurons besoin d'un Grand Temple. Heureusement, il y a une colline près du Mont Tartarax que nous pourrions utiliser pour construire un Magnifique et Illustre Temple pour nos Dieux Dragons. Le fait qu'il soit proche d'un volcan convient encore mieux à nos besoins."

  building_great_temple_of_valyria_02:0 "Salle de Prière et Lieu de Rassemblement"
  building_type_great_temple_of_valyria_02:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_02_desc:0 "Nous commencerons par une salle de prière richement décorée remplie d'artefacts coûteux—sculptures de dragons et de feu, tapisseries représentant des dragons, braseros, et le plus fin marbre que nous puissions trouver. Nous créerons également une salle ouverte séparée pour les sacrifices humains."

  building_great_temple_of_valyria_03:0 "Arène Ardente"
  building_type_great_temple_of_valyria_03:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_03_desc:0 "Les Valyriens ont toujours brûlé leurs morts. Brûler nos morts dans un Temple à côté de notre volcan est une bien meilleure façon d'honorer ceux qui ont quitté ce monde. Nous agrandirons la salle ouverte que nous avons déjà construite à cette fin. Des colonnes sculptées, des fleurs exotiques et un autel de pierre noire pour remplacer les bûchers en bois utilisés pour les sacrifices humains et la crémation des morts seront construits."

  building_great_temple_of_valyria_04:0 "Statues de Dragons"
  building_type_great_temple_of_valyria_04:0 "Le Temple du Dragon de Valyria"
  building_great_temple_of_valyria_04_desc:0 "Aucun bâtiment à Valyria n'est vraiment complet sans statues de dragons. Nous construirons 14 statues, une pour chaque Dieu. Chaque statue sera unique et majestueuse pour honorer convenablement nos Dieux."

  building_great_walls_of_valyria_01:0 "Vestiges Insignifiants du Mur"
  building_type_great_walls_of_valyria_01:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_great_walls_of_valyria_01_desc:0 "Cette zone est où se trouvent les vestiges des Grandes Murailles de Valyria. Il ne reste presque rien, car les murs ont été détruits pendant le Fléau. Les quelques vestiges qui ont survécu sont si endommagés qu'ils sont inutilisables. Bien sûr, nous pourrions restaurer ces murs à leur ancienne grandeur, et nous devrions le faire. Inutile de dire que ce sera une entreprise très coûteuse."

  building_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_type_great_walls_of_valyria_02:0 "Les Grandes Murailles de Pierre Noire de Valyria"
  building_great_walls_of_valyria_02_desc:0 "Les murailles de Valyria ont été entièrement restaurées, imposantes et vastes, encerclant toute la cité. Ces fortifications massives sont si larges que douze chars pourraient y courir côte à côte (prends ça, Volantis !). Des tours de guet et des douves bordent maintenant le périmètre, offrant des couches supplémentaires de défense. Les entrées sont renforcées par des herses et des zones de tir, rendant presque impossible toute tentative d'invasion de la cité par la force pour n'importe quel attaquant."

  building_great_dragonkeep_of_valyria_01:0 "Site du Palais"
  building_type_great_dragonkeep_of_valyria_01:0 "La Grande Forteresse des Dragons de Valyria"
  building_great_dragonkeep_of_valyria_01_desc:0 "Nous avons localisé un site potentiel pour un grand palais. À l'avenir, il deviendra un lieu de grandeur. Mais pour l'instant, il n'y a pas grand-chose de remarquable ici."

  building_great_dragonkeep_of_valyria_02:0 "Pose des Fondations"
  building_type_great_dragonkeep_of_valyria_02:0 "La Grande Forteresse des Dragons de Valyria"
  building_great_dragonkeep_of_valyria_02_desc:0 "Pour abriter les dirigeants de cette grande cité, nous aurons besoin d'un palais imposant. Non, le plus grand palais que le monde ait jamais vu. Cela nécessitera, bien sûr, de nombreux esclaves et de l'or, mais ces ressources peuvent être acquises. Ce palais sera un témoignage de la grandeur valyrienne. Nous commencerons par un donjon et continuerons notre expansion à partir de là."

  building_great_dragonkeep_of_valyria_03:0 "Murs Extérieurs"
  building_type_great_dragonkeep_of_valyria_03:0 "La Grande Forteresse des Dragons de Valyria"
  building_great_dragonkeep_of_valyria_03_desc:0 "Pour garantir que ce donjon sera imprenable, nous construirons nos murs exclusivement en pierre noire. Ces murs hauts et épais repousseront tous les ennemis et individus indésirables. Construire des murs épais et hauts uniquement avec de la pierre noire sera, bien sûr, très coûteux."

  building_great_dragonkeep_of_valyria_04:0 "Murs Intérieurs et Décoration"
  building_type_great_dragonkeep_of_valyria_04:0 "La Grande Forteresse des Dragons de Valyria"
  building_great_dragonkeep_of_valyria_04_desc:0 "Maintenant que nous avons construit les murs extérieurs, nous devons ériger des murs intérieurs pour améliorer la sécurité et l'efficacité de nos fortifications. Portes, herses et créneaux seront construits. De plus, nous décorerons le grand donjon de soies, tapisseries, trophées et de nombreuses autres choses pour afficher notre splendeur."

  building_procrazion_01:0 "Grand Château Abandonné"
  building_type_procrazion_01:0 "Procrazion"
  building_procrazion_01_desc:0 "Procrazion était autrefois un bastion du pouvoir valyrien, situé au sommet de la montagne centrale au cœur de la cité. Avant le Fléau, ce grand château servait de centre militaire et politique, agissant comme un centre de défense pour toute la région. Bien qu'une grande partie de sa structure reste intacte, le temps n'a pas été clément envers ses salles autrefois glorieuses. Les ponts de pierre qui le reliaient autrefois à la cité environnante sont maintenant détruits, et l'intérieur montre des signes clairs de décomposition. Les imposantes Tours des Dragons sont toujours debout, mais leurs chambres sont vides, et la forge autrefois active est maintenant en sommeil. Malgré cela, sa position élevée et ses points d'entrée limités offrent toujours un avantage stratégique. Bien qu'encore imposant, Procrazion n'est plus que l'ombre de ce qu'il était, attendant d'être restauré à son ancienne gloire."

  building_procrazion_02:0 "Procrazion"
  building_type_procrazion_02:0 "Procrazion"
  building_procrazion_02_desc:0 "Procrazion a été restauré dans toute sa gloire d'antan, se dressant fièrement au sommet de la montagne au cœur de la cité. Ce grand château est de nouveau relié à la cité en contrebas par des ponts reconstruits, offrant un accès sans nécessiter de dragons. Les Tours des Dragons ont également été restaurées, permettant l'entrée et la sortie des majestueuses créatures, tandis que les tours à dôme brillent comme avant le Fléau. À l'intérieur, il est équipé de tous les agréments attendus pour un seigneur de la région, offrant confort et luxe même pendant un siège. La forge unique sur un côté de la montagne a été réactivée, canalisant à nouveau la lave pour créer de puissantes armes. Sa position élevée, combinée à sa restauration et ses points d'entrée limités, garantit qu'il reste presque imprenable, capable de résister à toute menace. Maintenant entièrement restauré, Procrazion sert non seulement de forteresse défensive mais aussi de symbole de la résurgence de la cité."

  building_eternal_flame_temple_01:0 "Temple Abandonné"
  building_type_eternal_flame_temple_01:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_01_desc:0 "Le Temple de la Flamme Éternelle était vraisemblablement le point de connexion entre les Anciens Dieux de Valyria et les guerriers valyriens. Outre le fait d'être le centre religieux pour le peuple commun, le temple s'élevait autrefois comme un symbole de la puissance religieuse de Valyria ; maintenant il gît poussiéreux et abandonné. Aujourd'hui, il reste un vague souvenir de ce qui était autrefois un révéré Grand Temple de la cosmogonie valyrienne."

  building_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_type_eternal_flame_temple_02:0 "Le Temple de la Flamme Éternelle"
  building_eternal_flame_temple_02_desc:0 "Le Temple de la Flamme Éternelle a maintenant été renouvelé et se dresse comme un symbole de puissance, de religion et de pouvoir. Ses murs restaurés racontent les histoires des anciens dieux et sont remplis de légendes autrefois connues uniquement des anciens Valyriens. Le peuple commun peut maintenant profiter du luxe et rêver de ce que les dragons et la magie ont pu être avant le Fléau. Les guerriers viennent et prient pour être emplis de la rage et de la puissance des dragons qui les ont précédés. Le temple brille intensément comme un phare de foi religieuse, d'espoir et de puissance valyrienne tant ancienne que nouvelle."

  building_red_guard_barracks_01:0 "Casernes Abandonnées"
  building_type_red_guard_barracks_01:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_01_desc:0 "Le quartier général autrefois fier de la Garde Rouge d'élite de la cité, gît maintenant abandonné et attaché aux anciennes murailles de la cité. Le temps tout-puissant a érodé ses environs et son intérieur, où les créneaux brisés et la structure rouillée parlent d'abandon post-Fléau. À l'arrière, deux tours de Dragons ne sont plus que des réminiscences de ce qui était autrefois la puissance militaire. Les chambres ne sont maintenant remplies que de fantômes du temps passé et de force désormais perdue. Malgré sa décrépitude, ces casernes aspirent à être restaurées pour redevenir le bouclier formidable de la cité."

  building_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_type_red_guard_barracks_02:0 "Les Casernes de la Garde Rouge"
  building_red_guard_barracks_02_desc:0 "Entièrement restaurées presque à leur puissance valyrienne, les Casernes de la Garde Rouge sont le foyer renouvelé des défenseurs de la cité, situées à côté des glorieuses murailles de la cité. La structure de pierre rappelle sa gloire d'antan, renforcée, puissante et remplie d'histoires et de cicatrices. Les Tours des Dragons exhalent vie et vitalité, à la ressemblance de l'époque où de vrais dragons rugissaient dans les hauts cieux. Les casernes ne sont plus accueillies par des fantômes, mais par la récemment restaurée Garde Rouge d'élite, emplie d'une discipline énergisante, d'excellence et d'une gloire inégalée. Dans un mélange complexe d'ancien et de nouvelle technologie, le bâtiment protège désormais à nouveau la cité et abrite tous ceux qui sont à l'intérieur."

  building_red_guard_training_compound_01:0 "Complexe d'Entraînement Abandonné"
  building_type_red_guard_training_compound_01:0 "Le Complexe d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_01_desc:0 "Des murs délabrés ne racontent plus les histoires des Gardes Rouges disparus qui s'entraînaient ici. Ce Complexe d'Entraînement était autrefois un bâtiment respecté et admiré, rempli de dragons, de guerriers et de chefs qui gît maintenant abandonné et vide, incapable de dépeindre son énergie et sa gloire depuis longtemps oubliées. Des armes, des donjons et des équipements rouillés peuvent encore être trouvés ici, mais on se demande comment cela a pu être durant sa gloire."

  building_red_guard_training_compound_02:0 "Le Complexe d'Entraînement de la Garde Rouge"
  building_red_guard_training_compound_02_desc:0 "Force, honneur et puissance sont ce que l'on peut trouver en regardant le Complexe d'Entraînement de la Garde Rouge restauré. Rempli d'hommes tentant de leur mieux de s'honorer en devenant membres de l'Élite de la Garde Rouge, le complexe accueille stratèges, chefs et guerriers, tous visant à être les meilleurs. Avec de glorieux piliers l'entourant avec grâce, et un toit maintenu haut avec des fenêtres rouges pour montrer que le ciel est la seule limite, ce bâtiment entraîne maintenant les plus grands guerriers et les plus fins leaders."

  building_type_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01:0 "Mont Zanpur"
  building_zanpur_volcano_01_desc:0 "Zanpur est le volcan jumeau le plus occidental des îles Marahai."

  building_type_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01:0 "Mont Yovesh"
  building_yovesh_volcano_01_desc:0 "Yovesh est le volcan jumeau le plus oriental des îles Marahai."

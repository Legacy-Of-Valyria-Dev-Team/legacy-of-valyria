l_french:
  # Braavos
  building_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_type_agot_EE_titan_of_braavos:0 "Le Titan de Braavos"
  building_agot_EE_titan_of_braavos_desc:0 "Inclus par le célèbre scribe westrien Lomas Longstrider parmi les Merveilles Façonnées par l'Homme, le Titan de Braavos constitue la principale ligne de défense de la cité libre de Braavos, gardant l'étroit passage menant au lagon où se situe la ville. C'est une statue gigantesque de granit et de bronze en forme de guerrier, servant à la fois de forteresse et de phare. Des meurtrières sous l'armure de la statue ainsi que des archères réparties sur tout son plastron offrent une défense quasi impénétrable contre les navires ennemis entrant dans le lagon."

  building_agot_EE_sealords_palace:0 "Le Palais du Seigneur des Mers"
  building_type_agot_EE_sealords_palace:0 "Le Palais du Seigneur des Mers"
  building_agot_EE_sealords_palace_desc:0 "Le Palais du Seigneur des Mers est la demeure du Seigneur des Mers de Braavos. Sous les dômes et les tours de ce vaste palais, se trouve une ménagerie exotique d'oiseaux et de bêtes venus de toutes les régions du monde."

  # Volantis
  building_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_type_agot_EE_black_walls_of_old_volantis:0 "Les Murs Noirs"
  building_agot_EE_black_walls_of_old_volantis_desc:0 "Le cœur de Volantis. Érigé par l'antique possession valyrienne, ce gigantesque mur de pierre noire fusionnée protège une série de palais, de cours, de tours et de temples. Seuls ceux dont le sang remonte aux ancêtres valyriens, le Vieux Sang, sont autorisés à y demeurer."

  building_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_type_agot_EE_volantis_harbor:0 "Le Port de Volantis"
  building_agot_EE_volantis_harbor_desc:0 "La puissance de Volantis provient en partie de son vaste port, favorisé par sa situation géographique. Cet immense port en croissant est construit à l'embouchure du fleuve Rhoyne et il est dit qu'il pourrait contenir à lui seul toute la ville de Braavos."

  building_agot_EE_the_long_bridge:0 "Le Grand Pont"
  building_type_agot_EE_the_long_bridge:0 "Le Grand Pont"
  building_agot_EE_the_long_bridge_desc:0 "Le Grand Pont relie les deux moitiés de Volantis et est le plus long pont du monde connu. Construit par l'ancienne Valyria à son apogée à partir de pierre fusionnée, il est dit qu'il peut supporter le poids de mille éléphants."

  building_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Seigneur de la Lumière"
  building_type_agot_EE_temple_of_the_lord_of_light:0 "Le Temple du Seigneur de la Lumière"
  building_agot_EE_temple_of_the_lord_of_light_desc:0 "Cet immense temple s'élève bien au-dessus de tous les autres bâtiments de la ville. Ses couleurs éclatantes d'or, de rouge et d'orange en font un spectacle véritablement saisissant. Protégé par la Main Enflammée, ce temple sert R’hllor, le Seigneur de la Lumière, et représente probablement l'un des plus grands témoignages de sa puissance."

  building_agot_EE_volantis_walls:0 "Les Murailles de Volantis"
  building_type_agot_EE_volantis_walls:0 "Les Murailles de Volantis"
  building_agot_EE_volantis_walls_desc:0 "Bien qu'elles ne soient pas aussi impressionnantes que celles de l'Ancienne Volantis, les murailles de Volantis dissuaderont tout assaillant de tenter de prendre la ville d'assaut."

  # Rhoyne
  building_agot_EE_nymeria_palace_01:0 "Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_01:0 "Palais de Nymeria"
  building_agot_EE_nymeria_palace_01_desc:0 "Au cœur de Ny Sar se dressent les ruines du Palais de Nymeria, abandonné depuis que les Possessions valyriennes ont vaincu le prince Garin lors de la Deuxième Guerre des Épices. Ses murs de marbre rose et vert, ses dômes imposants et ses grandes flèches ne sont plus que l'ombre hantée de leur ancienne splendeur. Toute vie a quitté cet endroit lorsque Nymeria s'est enfuie vers Dorne, laissant ces fières salles à la décrépitude."

  building_agot_EE_nymeria_palace_02:0 "Palais de Nymeria"
  building_type_agot_EE_nymeria_palace_02:0 "Palais de Nymeria"
  building_agot_EE_nymeria_palace_02_desc:0 "Se dressant de nouveau fièrement au cœur de Ny Sar, le Palais de Nymeria a été méticuleusement restauré, témoignage de la résilience et du patrimoine rhoynars. Le marbre vert et rose brille sous le soleil, tandis que d'immenses dômes et flèches majestueuses dominent désormais la cité, effaçant presque les souvenirs de son passé tragique."

  building_agot_EE_palace_of_love_01:0 "Palais des Chagrins"
  building_type_agot_EE_palace_of_love_01:0 "Palais des Chagrins"
  building_agot_EE_palace_of_love_01_desc:0 "Le Palais des Chagrins demeure un sombre rappel du destin qui frappa Chroyane, la Cité des Fêtes. Ses tours croulantes, recouvertes de mousse et de vignes sombres, ne révèlent rien de la beauté que le Palais de l'Amour incarnait jadis. Les statues englouties et les hommes de pierre hantent désormais ses salles embrumées et en ruine."

  building_agot_EE_palace_of_love_02:0 "Palais de l'Amour"
  building_type_agot_EE_palace_of_love_02:0 "Palais de l'Amour"
  building_agot_EE_palace_of_love_02_desc:0 "Le Palais de l'Amour orne de nouveau les rives du Rhoyne, renaissance éblouissante de l'ancienne splendeur de Chroyane. Ses tours s'élèvent haut dans le ciel, ornées de mosaïques éclatantes et de délicates sculptures célébrant la vie, la beauté et l'amour. La lumière du soleil fait scintiller les fontaines qui alimentent les jardins luxuriants, des fleurs débordant de chaque terrasse. Sous ses vastes dômes, les mariages sont de nouveau bénis, emplissant Chroyane de promesses de renouveau."

  building_agot_EE_bridge_of_dream_01:0 "Pont du Rêve"
  building_type_agot_EE_bridge_of_dream_01:0 "Pont du Rêve"
  building_agot_EE_bridge_of_dream_01_desc:0 "Autrefois rival du Grand Pont de Volantis, le Pont du Rêve se dresse aujourd'hui dans la brume épaisse du Rhoyne. Ses arches de pierre, qui s'élevaient jadis à quarante pieds au-dessus du fleuve, se sont effondrées sous la mousse dense et les vignes noires. Désormais repaire des hommes de pierre, il reste un monument silencieux et pourrissant de la fierté perdue des Rhoynars."

  building_agot_EE_bridge_of_dream_02:0 "Pont du Rêve"
  building_type_agot_EE_bridge_of_dream_02:0 "Pont du Rêve"
  building_agot_EE_bridge_of_dream_02_desc:0 "Le Pont du Rêve enjambe à nouveau le Rhoyne dans toute sa splendeur. S'élevant à quarante pieds au-dessus du fleuve, ses arches de pierre pâle demeurent solides et défiantes. De luxuriants jardins bordent son tablier de bois, éclatants de fleurs multicolores. Ce pont majestueux, autrefois perdu au temps et à la ruine, renaît aujourd'hui en symbole de la fierté et de la résilience rhoynars sur les flots du Rhoyne."

  # Meereen
  building_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_type_agot_EE_great_pyramid_of_meereen:0 "La Grande Pyramide de Meereen"
  building_agot_EE_great_pyramid_of_meereen_desc:0 "De loin le plus grand édifice de la cité, la Grande Pyramide de Meereen fut érigée par une petite armée d'esclaves, dont un millier moururent lors de sa construction. La pyramide sert de centre administratif à Meereen, et les dirigeants de la cité y ont reçu leurs sujets pendant des siècles."

  # Asshaï
  building_stygai_01:0 "Cité Hantée de Stygai"
  building_type_stygai_01:0 "Stygai"
  building_stygai_01_desc:0 "Stygai, l'antique et énigmatique cité tapie dans le cœur obscur des Terres de l'Ombre, demeure l'un des mystères les plus effrayants du monde. Insondablement ancienne et plongée dans une obscurité éternelle, la ville subsiste comme un monument à une époque oubliée. Même les plus téméraires lieuses d'ombres n'osent s'aventurer dans ses rues abandonnées. Les hautes flèches et les ruelles labyrinthiques seraient hantées par des démons et autres créatures. Voilée de secrets, son origine véritable et l'étendue de ses pouvoirs obscurs restent inconnues."

  # Gogossos
  building_red_citadel_01:0 "La Tour Rouge"
  building_type_red_citadel_01:0 "La Tour Rouge"
  building_red_citadel_01_desc:0 "Une grande tour côtière, considérée comme le dernier vestige d'une forteresse autrefois puissante, sert aujourd'hui de principal bastion de la ville. Bien que l'essentiel de la structure originelle ait été perdu au fil du temps, ce bastion solitaire subsiste, petit mais incroyablement solide et hautement défendable. De solides murs de pierre usée résistent aux éléments comme aux sièges éventuels, faisant de cet édifice un siège fiable du pouvoir au sein de Gogossos. Bien qu'il ne soit pas encore une grande citadelle, il demeure un donjon redoutable, une base sur laquelle de plus vastes fortifications pourraient un jour s’élever."

  building_red_citadel_02:0 "La Redoute Rouge"
  building_type_red_citadel_02:0 "La Redoute Rouge"
  building_red_citadel_02_desc:0 "Désormais renforcée par une solide palissade de bois et des tours de guet érigées au sommet des anciennes Ruines Écarlates, cette redoute est devenue une forteresse bien plus redoutable, capable de résister à des menaces prolongées. Ce n’est plus seulement une tour côtière isolée, les défenses élargies permettent désormais d’accueillir une garnison respectable, offrant un solide point d’appui à Gogossos. Grâce à des provisions abondantes et à des positions fortifiées, elle pourrait même soutenir une armée pendant des mois, marquant sa transformation d'un simple vestige du passé en un véritable bastion de pouvoir."

  building_red_citadel_03:0 "La Citadelle Rouge"
  building_type_red_citadel_03:0 "La Citadelle Rouge"
  building_red_citadel_03_desc:0 "Autrefois simple vestige, la Citadelle Rouge a été reconstruite en une vaste forteresse inébranlable, dominant Gogossos comme siège ultime du pouvoir de la cité. Ce n’est plus une tour solitaire, mais un donjon pleinement restauré, aux immenses murs de Pierre Noire valyrienne, monument de domination et de crainte.\n\nComme pour la Porte Écarlate, les murs de la Citadelle Rouge furent imprégnés de rituels de magie sanguine par les anciens Valyriens, teintant à jamais la pierre d’un rouge profond et surnaturel. Bien que ces rituels soient depuis longtemps oubliés, leur héritage sombre perdure, faisant de la citadelle non seulement un bastion quasi imprenable, mais aussi un symbole inquiétant du pouvoir absolu.\n\nAu cœur de l’édifice, la Tour Rouge perce le ciel, projetant une ombre immense sur la ville, rappel constant de l'autorité de l'archonte. Les murs inférieurs et la cour demeurent maculés de sang, non seulement par les anciens rituels, mais aussi par les innombrables exécutions, trahisons et conflits sanglants qui s’y sont déroulés. Le sang des rebelles, conspirateurs et ennemis de l'État a imprégné ses fondations, inscrivant la peur dans la pierre même.\n\nOn murmure que c’est dans ces murs que la Peste Rouge prit racine, un fléau qui dévasta jadis Gogossos. Bien que la maladie ait disparu, certains affirment que la citadelle se souvient encore, que les fantômes des mourants errent dans ses profondeurs, murmurant à qui veut les entendre.\n\nPlus qu'une forteresse, la Citadelle Rouge est le noyau indomptable de Gogossos, un lieu où le pouvoir est absolu, la clémence rare, et où la rébellion est écrasée avant même de naître."

  building_pit_of_sorrows_01:0 "Fort envahi par la végétation et ruines"
  building_type_pit_of_sorrows_01:0 "Fort envahi par la végétation et ruines"
  building_pit_of_sorrows_01_desc:0 "Un fort en ruines, ses murs autrefois imposants désormais recouverts de vignes rampantes et engloutis par l’étreinte implacable de la nature, se dresse dans un silence inquiétant. Des arbres ont pris racine dans ses cours, leurs branches noueuses griffant le ciel, témoins muets d’horreurs oubliées.\n\nMalgré sa décrépitude, le fort conserve une défense surprenante — ses tours, bien que ravagées par le temps, restent imposantes. Sa porte, à moitié ensevelie sous la mousse et les gravats, laisse deviner une forteresse refusant de céder entièrement à l’oubli.\n\nPourtant, un malaise profond règne en ces lieux. L’air est épais d’une immobilité surnaturelle, faisant frissonner la peau et troubler l’esprit. Les ombres s’attardent là où elles ne devraient pas, et des murmures — trop faibles pour être le vent — semblent dériver à travers les ruines, évoquant des secrets qu’il vaudrait mieux ne pas déterrer."

  building_pit_of_sorrows_02:0 "Fouilles du Fort et du Gouffre"
  building_type_pit_of_sorrows_02:0 "Fouilles du Fort et du Gouffre"
  building_pit_of_sorrows_02_desc:0 "Alors que nos efforts d'expansion dégageaient l'épaisse végétation, une découverte stupéfiante fut faite — le sol semblait s’enfoncer sans fin, peu importe combien de boue et de débris nous ôtions. Ce qui paraissait être de simples ruines dissimulées sous la verdure s'est révélé être une vaste descente stratifiée, chaque niveau exposant des vestiges d'un passé enfoui.\n\nParmi les pierres effritées et la terre détrempée, nous avons déterré d'innombrables ossements — d’origines inconnues, leurs histoires perdues à jamais. À mesure que nous descendions, un sentiment de certitude s'installait : nous avions peut-être trouvé le légendaire Gouffre des Soupirs, un lieu chuchoté avec crainte dans les légendes, ses profondeurs encore inviolées et ses mystères attendant d’être dévoilés."

  building_pit_of_sorrows_03:0 "Le Gouffre des Soupirs"
  building_type_pit_of_sorrows_03:0 "Le Gouffre des Soupirs"
  building_pit_of_sorrows_03_desc:0 "Le légendaire Gouffre des Soupirs, autrefois ruine effondrée, a été méticuleusement reconstruit et restauré dans toute son ominieuse grandeur. Pourtant, malgré les efforts pour récupérer ses parties supérieures, ses véritables profondeurs demeurent un abîme insondable. Les ténèbres du fond avalent la lumière et le son, une gueule béante ouverte sur l’inconnu. Nombreux sont ceux qui ont osé descendre en quête de secrets oubliés, mais aucun n’est jamais revenu témoigner de ce qui pourrait se trouver au fond — si fond il y a."

  building_the_toad:0 "Le Crapaud Noir"
  building_type_the_toad:0 "Le Crapaud Noir"
  building_the_toad_desc:0 "La plus grande statue jamais construite sur l'Île aux Crapauds domine le paysage, vestige monolithique d’une civilisation disparue depuis longtemps. Sculptée dans une pierre noire huileuse inconnue, elle semble scintiller même en l'absence de lumière et prend la forme d’un crapaud immense, trapu, grotesque, et d’un réalisme troublant. Nul ne sait qui l’a érigée, ni dans quel but, et la signification qu’elle portait s’est perdue dans l’oubli.\n\nPour la plupart, elle n’est rien de plus qu’un sinistre vestige, une curiosité inquiétante dans une terre déjà baignée de mystères. Pourtant, certains murmurent que ceux qui dorment trop près de l'idole font d’étranges rêves, que la pierre semble émettre une chaleur troublante au toucher, et que des yeux scintillent parfois juste sous sa surface, comme si quelque chose veillait depuis l’intérieur."
  building_type_the_toad_desc:0 "La plus grande statue jamais érigée sur l’Île aux Crapauds domine le paysage, vestige monolithique d’une civilisation depuis longtemps disparue. Sculptée dans une pierre noire huileuse d’origine inconnue, qui semble scintiller même en l'absence de lumière, elle prend la forme d’un immense crapaud, trapu, grotesque et d’un réalisme troublant. Nul ne sait qui l’a construite, ni dans quel but, et toute signification qu’elle put avoir s’est perdue depuis longtemps. Pour la plupart, ce n’est rien de plus qu’un effigie grossière et sinistre, une curiosité étrange dans une terre déjà imprégnée de mystères. Pourtant, les murmures, prononcés à voix basse par les locaux, parlent de rêves étranges frappant ceux qui dorment trop près, d'une chaleur inquiétante émanant de la pierre au toucher, et d'yeux semblant luire juste sous sa surface, comme si quelque chose observait depuis l’intérieur."

  building_ax_hold:0 "Le Bastion de la Hache"
  building_type_ax_hold:0 "Le Bastion de la Hache"
  building_ax_hold_desc:0 "La forteresse de la Maison Xhore est à la fois un sanctuaire et une place forte, un bastion de pierre et d’acier bâti pour endurer les tempêtes des Îles Basilisk. Juchée au sommet de falaises déchiquetées et cernée par des eaux traîtresses, elle fut conçue non seulement comme une demeure, mais aussi comme un poste d’où les pirates qarthiens des Îles Occidentales pouvaient lancer leurs célèbres raids. Ses murs, bien qu’usés par le temps, conservent leur solidité, tandis que ses tours de guet offrent une vue imprenable sur les mers alentours, toujours prêtes à repérer proies et poursuivants."

  building_garden_of_malice_01:0 "Un grand fort envahi par la végétation"
  building_type_garden_of_malice_01:0 "Un grand fort envahi par la végétation"
  building_garden_of_malice_01_desc:0 "Un vaste mur d’enceinte recouvert de lierre et de mousse épaisse entoure les ruines, ses pierres antiques à peine visibles sous les couches rampantes. En son cœur se dresse un donjon en ruine, ses tours brisées et à demi englouties par l'étreinte impitoyable de la nature. Le temps a effacé toute l'histoire que ce lieu a pu porter, ne laissant derrière lui qu’un silence étouffant et inquiétant.\n\nPourtant, ceux qui osent franchir les portes brisées comprennent vite pourquoi ces ruines n'ont jamais été revendiquées : cet endroit est un piège mortel. Des haies tordues, devenues sauvages et contre-nature, forment un labyrinthe complexe, dont les sentiers se déplacent et se ferment comme des êtres vivants, égarant les imprudents dans les profondeurs. Parmi la végétation enchevêtrée rôdent des plantes aux couleurs impossibles et aux formes surnaturelles, dont la beauté cache une intention létale. Certaines libèrent des spores étouffant les poumons, d'autres sécrètent des toxines brûlant la peau, et quelques-unes se meuvent avec une inquiétante conscience, attendant que la proie s’approche de trop près.\n\nLes légendes murmurent qu’une chose — peut-être les vestiges d’une ancienne sorcellerie, ou la présence persistante d’une force oubliée — maintient cette flore dans une vitalité défiant les lois de la nature. Les ruines ne sont pas délaissées par oubli, mais par peur. Même les pillards et chasseurs de trésors les plus téméraires savent qu’il vaut mieux ne pas provoquer la colère d’un lieu où les plantes elles-mêmes semblent assoiffées de sang."

  building_garden_of_malice_02:0 "Le Jardin de Malice"
  building_type_garden_of_malice_02:0 "Le Jardin de Malice"
  building_garden_of_malice_02_desc:0 "Le Jardin de Malice est une forteresse de mort stratifiée, bâtie en pierre noire huilée et entourée de défenses mortelles. Le mur extérieur enferme un vaste labyrinthe végétal mouvant, un piège vivant où des lianes épineuses fouettent comme des fouets, où des fleurs exhalent des spores toxiques, et où les haies elles-mêmes se tordent pour tromper et piéger les intrus. Aucun rayon de lumière ne perce sous la dense canopée, où des créatures invisibles glissent dans l’ombre, et où l’air est lourd de la senteur de la pourriture. Au-delà du labyrinthe, un second rempart et des douves infestées d'horreurs dissimulées forment une nouvelle barrière. Les hautes murailles, gardées par des sentinelles silencieuses, surveillent l’unique entrée : un pont-levis renforcé rarement abaissé.\n\nAu cœur de l’ensemble se dresse le donjon, une immense structure valyrienne intacte, ses salles de pierre noire résonnant d’un silence étrange. Sa plus haute tour abrite un arbre mort antique, pétrifié et squelettique, ses racines fusionnées à la pierre comme pour s'abreuver de quelque chose enfoui en dessous. On dit qu’il prédate même le Fléau de Valyria, relique d’un savoir ancien oublié. Conquérir le Jardin de Malice n’est pas simplement une bataille : c’est une descente dans quelque chose de bien plus sinistre, où même la terre elle-même complote pour tuer."

  building_sapphire_quarter:0 "Le Quartier des Saphirs"
  building_type_sapphire_quarter:0 "Le Quartier des Saphirs"
  building_sapphire_quarter_desc:0 "Le Quartier des Saphirs est un vaste district fortifié perché au sommet de la plus haute colline de Gogossos. Jadis domaine des anciens Seigneurs-Dragons, il sert désormais d’enclave exclusive aux maîtres esclavagistes et princes marchands les plus illustres de la cité. Seuls les plus riches peuvent y résider, parmi des manoirs et des palais grandioses — construits en marbre étincelant et ornés d’or. Ses marchés privés, drapés des plus fines soieries, ne sont accessibles qu’à ceux qui peuvent s'offrir des luxes hors de portée des hommes ordinaires."

  building_crimson_gate:0 "La Porte Cramoisie"
  building_type_crimson_gate:0 "La Porte Cramoisie"
  building_crimson_gate_desc:0 "La Porte Cramoisie s’élève comme un sentinelle majestueux et redoutable, première ligne de défense de la légendaire cité de Gogossos. Dominant le paysage, elle constitue le seul accès terrestre vers la ville, gardant l’interminable pont qui enjambe le grand fleuve. Forgée en pierre noire valyrienne, sa surface sombre et surnaturelle semble absorber la lumière, sa structure lisse mais inébranlable imprégnée de sorcelleries oubliées. Les pierres sont marquées d’une teinte cramoisie profonde, résultat des anciens rituels de sang valyriens ayant renforcé ses défenses.\n\nLe bastion de la porte, colossal et s’élevant à 140 pieds, domine tout ce qui approche, imposant respect et crainte. Au sommet de ses murailles se tiennent une rangée de statues de dragons aux yeux de gemmes massives, luisant d’un éclat surnaturel — veillant, observant, comme si les âmes des bêtes qu’elles représentent y résidaient encore.\n\nPeu ont osé braver la Porte Cramoisie, et moins encore ont survécu pour en témoigner. Elle n’est pas seulement un obstacle : c’est un monument à la puissance implacable de Gogossos, un témoignage vivant de l’ancienne grandeur de Valyria."

  building_glittering_pits_01:0 "Les Fosses Étincelantes"
  building_type_glittering_pits_01:0 "Les Fosses Étincelantes"
  building_glittering_pits_01_desc:0 "Les jungles de Gogossos et la fameuse Île des Larmes forment une vaste étendue sauvage, regorgeant à la fois de périls et de richesses inimaginables. Véritable trésor naturel, la dense végétation dissimule des merveilles au-delà de toute mesure pour ceux assez hardis pour oser s’y aventurer.\n\nParmi les trésors les plus convoités se trouvent les diamants et les saphirs, scintillant dans les profondeurs de la terre tels des fragments d’étoiles piégés. Rares et d'une qualité sans pareille, ces gemmes ont fait de la région une légende chuchotée parmi marchands et chercheurs de fortune. Bien que les mines soient encore modestes, leur rendement est remarquable, chaque excavation révélant des pierres d’une éclatante beauté."

  building_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_type_glittering_pits_02:0 "Les Cavernes Chatoyantes"
  building_glittering_pits_02_desc:0 "À mesure que les mines s'étendent, elles deviennent un vaste réseau de tunnels souterrains, s’entrelacent sous la jungle comme les racines des arbres antiques. Les parois étincellent de gemmes, leurs couleurs dansant à la lumière des torches, et des chambres secrètes sont découvertes, révélant des veines riches prêtes à être exploitées. Cependant, à mesure que les mineurs creusent plus profondément, la jungle elle-même semble se rebeller — des racines percent les murs, des spores toxiques flottent dans l’air, et d’étranges créatures invisibles remuent dans l'obscurité."

  building_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_type_glittering_pits_03:0 "Les Profondeurs Étoilées"
  building_glittering_pits_03_desc:0 "À son stade le plus profond et développé, la mine devient connue sous le nom des Profondeurs Étoilées — un vaste réseau de tunnels et d’immenses cavernes souterraines où sont extraites les plus riches veines de saphirs et de diamants. Les parois scintillent de veines intactes, bleu profond et blanc éclatant, créant l’illusion d’un ciel étoilé sous la terre.\n\nIci, les gemmes sont plus grandes, plus pures et plus précieuses que partout ailleurs dans la jungle. Des saphirs parfaits, profonds comme l’océan, et des diamants d’une taille stupéfiante reposent encore dans la roche la plus dure, nécessitant une habileté et une précision extrêmes pour être extraits. Mais plus on descend, plus le danger grandit. Les tunnels s’enfoncent dans des ténèbres que nul plan ne recense, et dans les chambres les plus profondes, où l’air est lourd et étouffant, les mineurs refusent d'aller. Certains prétendent avoir découvert bien plus que des gemmes — des choses enfouies bien avant que les hommes ne prennent leurs outils.\n\nMalgré les risques, les Profondeurs Étoilées sont le joyau des mines de Gogossos, un lieu où se font et se perdent les fortunes, où seuls les plus habiles et les plus déterminés osent s’aventurer — sachant que sous ces murs dorment non seulement les gemmes les plus précieuses... mais aussi des dangers qu’il vaudrait mieux laisser endormis."

  building_darkreach_quay_01:0 "Quai de l’Obscure-Étendue"
  building_type_darkreach_quay_01:0 "Quai de l’Obscure-Étendue"
  building_darkreach_quay_01_desc:0 "Le Quai de l’Obscure-Étendue est le cœur humble mais vital du commerce de Gogossos, première étape de l’infrastructure portuaire de la cité. Modeste port de pierre et de bois, il s’étend dans les eaux sombres de la baie, ses quais usés grinçant sous le poids des navires accostant. Bien que petit, il est stratégiquement placé pour servir de principal point d'entrée aux marchands, contrebandiers et aventuriers en quête de fortune à Gogossos."

  building_darkreach_quay_02:0 "Port de l’Obscure-Étendue"
  building_type_darkreach_quay_02:0 "Port de l’Obscure-Étendue"
  building_darkreach_quay_02_desc:0 "Avec l’expansion de l’empire commercial de Gogossos, le Port de l’Obscure-Étendue s’est transformé en un centre animé de commerce, bien au-delà de ses modestes débuts. Les quais ont été renforcés avec de la pierre et du bois robuste, permettant à de plus grands navires marchands de jeter l’ancre en toute sécurité et de décharger leurs cargaisons exotiques. De nouvelles jetées s’étendent plus loin dans les eaux sombres, accueillant un flux croissant de navires venus de terres lointaines, attirés par les richesses des saphirs, diamants et produits rares de la jungle de Gogossos."

  building_darkreach_quay_03:0 "Port des Marées Noires"
  building_type_darkreach_quay_03:0 "Port des Marées Noires"
  building_darkreach_quay_03_desc:0 "Avec la renaissance de Gogossos, son ancien port de commerce modeste a évolué pour devenir le Port des Marées Noires, une immense forteresse du commerce et de la puissance navale. Il n’est plus seulement une escale pour les marchands, mais un épicentre florissant du commerce international, attirant marchands, mercenaires et chercheurs de fortune de tout le monde connu.\n\nLe port est désormais fortifié avec la pierre noire valyrienne antique, ses puissants remparts encerclant les docks animés, offrant une défense inégalée contre les raids et les sièges. Ces imposantes murailles, reforgées à partir des ruines du passé, sont un témoignage de la résurgence de la cité, garantissant que la richesse et l’influence de Gogossos demeurent inattaquables."

  building_last_dragon_tower_01:0 "La Dernière Tour-Dragon"
  building_type_last_dragon_tower_01:0 "La Dernière Tour-Dragon"
  building_last_dragon_tower_01_desc:0 "La dernière Tour-Dragon subsistant hors de Valyria, construite dans les derniers jours avant le Fléau, se dresse comme un monument à la fois à la puissance et à la tragédie. Originellement bâtie pour abriter la famille dirigeante des Seigneurs-Dragons de Gogossos, ses salles devaient symboliser leur règne éternel — mais le destin en décida autrement. Lorsque la famille périt lors de l'anéantissement de Valyria, la tour devint une relique silencieuse d’un empire perdu, projetant une longue ombre sur la cité.\n\nAujourd’hui, elle sert un nouveau maître — l’Archonte le plus puissant de Gogossos et sa famille, qui règnent depuis ses hauteurs vertigineuses. La Tour-Dragon n’est plus seulement un symbole de grandeur valyrienne, mais aussi un rappel brutal à toutes les classes inférieures, esclaves et rebelles potentiels de la dureté de la hiérarchie de la cité. Elle demeure un témoignage inébranlable de la domination, un avertissement permanent que l’élite de Gogossos écrasera quiconque oserait se soulever."

  # Valyria
  building_type_valyria_volcano:0 "L'un des Quatorze Feux"

  building_valyria_volcano_01:0 "Mont Gaelithox"
  building_type_valyria_volcano_01:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_01_desc:0 "Gaelithox est l'un des volcans les plus redoutables parmi les légendaires Quatorze Feux de Valyria. Dominant le paysage alentour, son sommet est perpétuellement enveloppé d'un épais voile de fumée et de cendres. Les pentes du volcan sont marquées par d'anciens flots de lave, désormais solidifiés en formations de roche noire déchiquetée, vestiges du Fléau."

  building_valyria_volcano_02:0 "Rhazalhar"
  building_type_valyria_volcano_02:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_02_desc:0 "Rhazalhar est le plus grand des Quatorze Feux, un colosse de fureur en fusion et de pouvoir ancestral. Son sommet, constamment voilé par la fumée et les cendres, perce les cieux et projette son ombre sur le paysage environnant. Des rivières de lave s’écoulent de son cœur en fusion, traçant des chemins lumineux à travers la roche volcanique sombre. En raison des températures extrêmes autour du volcan, toute tentative d’exploitation minière est impossible."

  building_valyria_volcano_03:0 "Epaekros"
  building_type_valyria_volcano_03:0 "$building_type_valyria_volcano$"
  building_valyria_volcano_03_desc:0 "Epaekros est plus dangereux que les autres volcans, une beauté sauvage aux falaises instables qui déversent des pierres sur les randonneurs et aux sols glissants causant des chutes mortelles. Ceux qui atteignent son sommet rencontrent souvent une fin tragique, dévorés par une vouivre de feu ou un dragon nichant là. Pourtant, pour ceux qui osent explorer ses entrailles, richesses, or et métaux précieux abondent."


l_french:
  great_project_type_lv_rehabilitate_valyria:0 "Réhabiliter Valyria"
  great_project_type_lv_rehabilitate_valyria_desc:0 "Valyria, autrefois le cœur ardent du monde, n'est plus qu'une terre maudite et empoisonnée. Les Quatorze Flammes brûlent encore, et l'air même est épais de cendres et de vapeurs toxiques. Pourtant, les fondations de la grandeur de Valyria demeurent, enfouies sous les ruines et la désolation laissées dans le sillage du Fléau. Restaurer ces terres peut sembler quasi impossible, mais avec un effort monumental et un dévouement sans faille, peut-être Valyria pourra-t-elle un jour renaître de ses cendres."

  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_fallback:0 "Les terres de la [region|E] sélectionnée en [valyria|E] seront réhabilitées"
  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated:0 "Les terres de la [region|E] de [sub_region.GetName] seront réhabilitées"
  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_stop_danger:0 "Traverser cette [region|E] ne présentera plus de dangers significatifs liés aux effets persistants du Fléau ou aux créatures telles que les vouivres de feu."

  LV_REHABILITATE_VALYRIA_MUST_BE_COUNTY_CAPITAL:0 "Les efforts de réhabilitation doivent être basés dans la capitale de comté de ce duché."
  LV_REHABILITATE_VALYRIA_CAN_PLAN_IN_LOCATION:0 "Il ne doit y avoir aucun autre grand projet en cours pour réhabiliter Valyria dans ce duché."
  LV_REHABILITATE_VALYRIA_MUST_OWN_SUBREGION:0 "Vous ou votre [liege|E] devez contrôler entièrement au moins une [region|E] restaurable de la taille d'un duché en [valyria|E] pour planifier un effort de réhabilitation."
  LV_REHABILITATE_VALYRIA_CAN_START_PLANNING:0 "Il existe des régions éligibles en [valyria|E] à réhabiliter qui n'ont pas d'efforts de réhabilitation en cours."

  great_project_type_lv_rehabilitate_valyria_contribution_discount_tooltip:0 "Grâce à vos précédents efforts de réhabilitation et vos succès passés à Valyria, les coûts de contribution pour ce projet sont réduits."


l_french:
 great_project_type_lv_rehabilitate_valyria:0 "Réhabiliter Valyria"
 great_project_type_lv_rehabilitate_valyria_desc:0 "Valyria, jadis le cœur ardent du monde, n'est plus à présent qu'une terre maudite et empoisonnée. Les Quatorze Flammes brûlent encore, et l'air même est chargé de cendre et de fumées toxiques. Pourtant, les fondations de la grandeur de Valyria demeurent, enfouies sous la ruine et la désolation laissées dans le sillage du Fléau. Restaurer cette terre relève peut-être de l'impossible, mais avec un effort et un dévouement monumentaux, peut-être Valyria pourra-t-elle un jour renaître de ses cendres."

 great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_fallback:0 "La terre de la [region|E] sélectionnée en [valyria|E] sera réhabilitée"
 great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated:0 "La terre de la [region|E] de [sub_region.GetName] sera réhabilitée"
 great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_stop_danger:0 "Traverser cette [region|E] ne présentera plus de dangers significatifs liés aux effets persistants du Fléau ou à des bêtes telles que les veurs de feu."

 LV_REHABILITATE_VALYRIA_MUST_BE_COUNTY_CAPITAL:0 "Les efforts de réhabilitation doivent être basés dans la capitale de comté de ce duché."
 LV_REHABILITATE_VALYRIA_CAN_PLAN_IN_LOCATION:0 "Il ne doit y avoir aucun autre grand projet en cours pour réhabiliter Valyria au sein de ce duché."
 LV_REHABILITATE_VALYRIA_MUST_OWN_SUBREGION:0 "Vous ou votre [liege|E] devez contrôler entièrement au moins une [region|E] restaurable de la taille d'un duché en [valyria|E] pour planifier un effort de réhabilitation."
 LV_REHABILITATE_VALYRIA_CAN_START_PLANNING:0 "Il existe des régions éligibles en [valyria|E] à réhabiliter, sans effort de réhabilitation en cours."

 great_project_type_lv_rehabilitate_valyria_contribution_discount_tooltip:0 "Grâce à vos efforts de réhabilitation antérieurs et à vos succès passés en Valyria, les coûts de contribution pour ce projet sont réduits."


l_french:
  great_project_type_lv_rehabilitate_valyria:0 "Réhabiliter Valyria"
  great_project_type_lv_rehabilitate_valyria_desc:0 "Valyria, autrefois le cœur ardent et la gloire du monde connu, n'est désormais qu'une terre maudite et empoisonnée, rongée par les miasmes toxiques et les cendres éternelles. Les Quatorze Flammes brûlent encore dans leurs fosses volcaniques, et l'air même est saturé de cendres mortelles et de vapeurs empoisonnées qui consument chair et métal. Pourtant, sous les décombres et la désolation laissés par le Fléau, subsistent les fondations de la grandeur valyrienne, ensevelies mais invaincues. Restaurer ces terres semble relever de l'impossible, mais avec un effort monumental, un dévouement absolu et peut-être une touche de folie divine, Valyria pourrait un jour renaître de ses cendres tel le dragon de légende."

  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_fallback:0 "La [region|E] sélectionnée en [valyria|E] sera réhabilitée et purifiée"
  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated:0 "La [region|E] de [sub_region.GetName] sera réhabilitée et rendue habitable"

  LV_REHABILITATE_VALYRIA_MUST_BE_COUNTY_CAPITAL:0 "Les efforts de réhabilitation doivent être établis et coordonnés depuis la capitale du comté de ce duché."
  LV_REHABILITATE_VALYRIA_CAN_PLAN_IN_LOCATION:0 "Aucun autre grand projet de réhabilitation de Valyria ne doit être en cours dans ce duché."
  LV_REHABILITATE_VALYRIA_MUST_OWN_SUBREGION:0 "Vous ou votre [liege|E] devez contrôler entièrement au moins une [region|E] restaurable de taille ducale en [valyria|E] pour planifier un effort de réhabilitation."
  LV_REHABILITATE_VALYRIA_CAN_START_PLANNING:0 "Des régions éligibles en [valyria|E] peuvent être réhabilitées sans qu'aucun effort de restauration n'y soit déjà entrepris."

  great_project_type_lv_rehabilitate_valyria_contribution_master_engineer:0 "Maître Ingénieur"
  great_project_type_lv_rehabilitate_valyria_contribution_master_engineer_desc:0 "La nature unique et cataclysmique du Fléau exige une expertise qui transcende la simple maçonnerie ou l'urbanisme conventionnel. Nous avons besoin d'un visionnaire maîtrisant à la fois l'ingénierie la plus avancée et les arts ésotériques pour naviguer en sécurité parmi les ruines maudites et stabiliser ces terres tourmentées."
  great_project_type_lv_rehabilitate_valyria_contribution_advanced_logistics:0 "Logistique Avancée"
  great_project_type_lv_rehabilitate_valyria_contribution_advanced_logistics_desc:0 "L'ampleur colossale de cette entreprise de réhabilitation défie tout précédent historique. Nous nécessitons des maîtres logisticiens et des experts en gestion des chaînes d'approvisionnement pour garantir que matériaux précieux, main-d'œuvre spécialisée et ressources vitales soient alloués avec une efficacité sans faille à travers les vastes étendues hostiles et mortelles de Valyria."
  great_project_type_lv_rehabilitate_valyria_contribution_valyrian_steel_tools:0 "Outils en Acier Valyrien"
  great_project_type_lv_rehabilitate_valyria_contribution_valyrian_steel_tools_desc:0 "Le fer commun et l'acier ordinaire se corrodent et se brisent en quelques jours sous l'effet des cendres volcaniques et de l'air empoisonné qui règne en ces lieux maudits. Seuls les outils forgés dans le légendaire Acier Valyrien peuvent résister aux rigueurs extrêmes de ce labeur titanesque."
  great_project_type_lv_rehabilitate_valyria_contribution_doom_driven_workforce:0 "Main-d'œuvre du Fléau"
  great_project_type_lv_rehabilitate_valyria_contribution_doom_driven_workforce_desc:0 "Rares sont ceux qui osent s'aventurer dans les ruines maudites où rôdent encore les spectres du passé. Cette contribution finance des salaires exorbitants et un équipement de protection spécialisé pour les mercenaires endurcis, les esclaves condamnés ou les fanatiques volontaires prêts à affronter les horreurs indicibles du Fléau."

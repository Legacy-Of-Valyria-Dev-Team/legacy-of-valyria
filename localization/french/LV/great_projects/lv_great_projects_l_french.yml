l_french:
  great_project_type_lv_rehabilitate_valyria:0 "Réhabiliter Valyria"
  great_project_type_lv_rehabilitate_valyria_desc:0 "Valyria, jadis le cœur ardent et glorieux du monde connu, n'est désormais qu'une terre maudite et empoisonnée où règnent la mort et la désolation. Les Quatorze Flammes brûlent encore dans leurs cratères infernaux, et l'air même est saturé de cendres mortelles et de vapeurs toxiques qui consument toute vie. Pourtant, sous les décombres et la ruine laissés dans le sillage apocalyptique du Fléau, les fondations de la grandeur valyrienne demeurent, enfouies mais indestructibles. Restaurer cette terre dévastée peut sembler une entreprise impossible, défiant les dieux eux-mêmes, mais avec un effort monumental, une détermination inébranlable et des sacrifices sans nombre, Valyria pourrait un jour renaître de ses cendres tel un phénix de légende pour reconquérir sa gloire d'antan."

  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_fallback:0 "Les terres désolées de la [region|E] sélectionnée en [valyria|E] seront purifiées et réhabilitées"
  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated:0 "Les terres maudites de la [region|E] de [sub_region.GetName] seront purifiées et réhabilitées"
  great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_stop_danger:0 "Traverser cette [region|E] ne présentera plus de dangers mortels liés aux séquelles persistantes du Fléau ou aux créatures infernales telles que les vouivres de feu qui hantent ces terres."

  LV_REHABILITATE_VALYRIA_MUST_BE_COUNTY_CAPITAL:0 "Les efforts de réhabilitation doivent être établis et coordonnés depuis la capitale du comté de ce duché."
  LV_REHABILITATE_VALYRIA_CAN_PLAN_IN_LOCATION:0 "Aucun autre grand projet de réhabilitation de Valyria ne doit être en cours dans les limites de ce duché."
  LV_REHABILITATE_VALYRIA_MUST_OWN_SUBREGION:0 "Vous ou votre [liege|E] devez contrôler entièrement au moins une [region|E] restaurable de la taille d'un duché en [valyria|E] pour planifier un effort de réhabilitation."
  LV_REHABILITATE_VALYRIA_CAN_START_PLANNING:0 "Il existe des régions éligibles en [valyria|E] qui peuvent être réhabilitées et qui ne font l'objet d'aucun effort de restauration en cours."

  great_project_type_lv_rehabilitate_valyria_contribution_discount_tooltip:0 "Grâce à vos efforts de réhabilitation antérieurs et vos succès passés dans la restauration de Valyria, les coûts de contribution pour ce projet titanesque sont significativement réduits."


l_french:
  # Volantis
  volantis_slaves:0 "Esclaves soldats"
  volantis_slaves_flavor:0 "Chaque personne réduite en esclavage doit obéir à ses Maîtres, quitte à risquer sa vie au combat. Combattant sans armure et avec des armes improvisées, ils doivent gagner du temps pour que le reste de l’armée accomplisse le véritable travail"
  free_riders:0 "Cavaliers Libres"
  free_riders_flavor:0 "Recrutés parmi les mercenaires et les fripons, ils constituent la grande majorité de la cavalerie de Volantis. Venues de tout Essos, ces troupes mènent à bien leurs missions avec efficacité"
  elephant_tusk:0 "Les Défenses d'Éléphant"
  elephant_tusk_flavor:0 "Les Défenses d'Éléphant sont membres de la faction politique connue sous le nom des « Éléphants ». Ils forment une phalange hautement organisée, maniant de longues pioches à effets dévastateurs. À l’image des éléphants, ils sont inébranlables et fidèles en défense: nul ennemi ne peut percer leur mur de lances. Même en retraite, ils restent disciplinés, offrant un couvert au reste de l’armée. Leurs adversaires ont l’impression qu’ils ne se fatiguent jamais, dressés comme un bouclier infranchissable"
  dragon_lords:0 "Seigneurs Tigres"
  dragon_lords_flavor:0 "Les Seigneurs Tigres appartiennent à la noblesse de Volantis et s’enorgueillissent de leur lignée remontant à la Valyria disparue. Leur ascendance est admirée, et leur prouesse martiale inégalée. Cataphractes lourdement cuirassés, ils chargent la lance haute, semant la terreur dans le cœur de leurs ennemis. Fier et arrogant, chaque galop de leurs montures fait trembler les lignes adverses, leur bravoure et leur détermination sont inégalables"
  citizen_guard:0 "Garde Citoyenne"
  citizen_guard_flavor:0 "La Garde Citoyenne est une milice civique formée des habitants de l’État de Volantis, notamment de Volantis, Volon Therys, Valysar et leurs environs. Seuls les hommes libres peuvent y entrer, et c’est pour eux un grand honneur. Infanterie disciplinée, ils portent armure lourde, boucliers imposants, épées, haches et marteaux. Ils forment l’épine dorsale de l’armée volantine et défendent les frontières avec courage"
  volantis_war_elephants:0 "Éléphants de Guerre de Volantis"
  volantis_war_elephants_flavor:0 "L’éléphant est le symbole de la Grande Cité de Volantis. Leur simple présence galvanise les citoyens et terrorise l’ennemi. La formation compte plusieurs dizaines de puissants éléphants de guerre, bardés d’armure, chacun guidé par un cornac et escorté par une tourelle d’archers. Terribles au combat, ils brisent souvent des formations entières d’un seul assaut"

  # Dothraki
  dothraki_riders:0 "Cavaliers Dothraki"
  dothraki_riders_flavor:0 "Les Dothraki ont appris à monter et à s’unir à leurs chevaux comme nul autre peuple, les utilisant pour tous les besoins militaires, estimant tout autre style de guerre indigne d’eux"

  # North Valyria
  elyrian_longbowmen:0 "Archers Élyriens au Long Arc"
  elyrian_longbowmen_flavor:0 "Les archers élyriens au long arc sont des tireurs d’élite réputés pour leur précision et leur portée mortelle, maniant de grands arcs finement ouvragés. Formés dès l’enfance, ils frappent rapidement à distance, alliant agilité et maîtrise inégalée de la guerre à longue portée"
  mantaryan_monsters:0 "Monstres Mantaryens"
  mantaryan_monsters_flavor:0 "Les Monstres Mantaryens forment une troupe d’élite déformée par le Fléau: corps disloqués, compétences mortelles. Leur transformation leur confère des pouvoirs surnaturels, mais leur apparence les rend aussi douloureusement vulnérables"

  # Gogossos
  gogossi_berserkers:0 "Berserkers Gogossites"
  gogossi_berserkers_flavor:0 "Les Berserkers Gogossites, hommes et femmes, aiment la fureur du combat et sont envoûtés par l’odeur et le goût du sang. Ils sombrent dans une frénésie meurtrière, indifférents à la provenance du flot de sang, pourvu qu’il coule"
  basilisk_riders:0 "Cavaliers Basilisques"
  basilisk_riders_flavor:0 "Les Cavaliers Basilisques sont vénérés dans la culture gogossite: après des années d’entraînement, ces montures féroces percent l’armure comme du beurre. Silencieux et rapides, ils sont souvent envoyés en missions d’assassinat… bonne chance pour leur échapper!"
  blood_mutants:0 "Mutants de Sang"
  blood_mutants_flavor:0 "Par essais et erreurs, les Gogossites, fascinés par la Magie du Sang valyrienne, ont appris à créer de nouvelles créatures implacables capables de renverser le cours des batailles sans lever le petit doigt, se rapprochant davantage de dieux que d’hommes"

  # Asshai
  esoteric_grenadiers:0 "Grenadiers Ésotériques"
  esoteric_grenadiers_flavor:0 "Les Grenadiers Ésotériques, en grande partie composés de sorciers novices, sont connus pour leur pratique de la religion du Shadowbinder. Dotés d’une force immense, ils changent le cours des batailles grâce à leurs capacités d’ensemencement de flammes enchantées"

  shadow_raiders:0 "Raiders de l’Ombre"
  shadow_raiders_flavor:0 "Les Raiders de l’Ombre n’ont rien d’étrangers au combat malgré leur discrétion: leurs ancêtres furent pirates et pillards, dérobant richesses et gloire aux navires des mers voisines"
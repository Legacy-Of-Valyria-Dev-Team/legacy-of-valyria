l_french:
  # Volantis
  volantis_slaves:0 "Esclaves-Soldats"
  volantis_slaves_flavor:0 "Tout esclave doit obéir à ses Maîtres, même au péril de sa vie sur le champ de bataille. Combattant sans armure et avec des armes de fortune, ils sont destinés à offrir au reste de l'armée le temps d'accomplir la véritable besogne"
  free_riders:0 "Chevaucheurs Libres"
  free_riders_flavor:0 "Recrutés parmi les mercenaires et épées à louer, ils constituent la majorité écrasante de la cavalerie volantaine. Bien qu'originaires de tous les recoins d'Essos, ils mènent leurs missions avec une redoutable efficacité"
  elephant_tusk:0 "Défenses d'Éléphant"
  elephant_tusk_flavor:0 "Les Défenses d'Éléphant appartiennent à la faction politique des « Éléphants ». Ils combattent en phalange rigoureusement ordonnée, maniant de longues piques aux effets dévastateurs. Tels les pachydermes, ils demeurent inflexibles et inébranlables en défense, et nul ennemi ne peut briser leur muraille indestructible de lances par l'avant. Même en retraite, ils ne cèdent point à la panique et se replient méthodiquement, couvrant le reste de l'armée. Leurs adversaires gardent l'impression qu'ils ne faiblissent jamais, dressés tels un bouclier impénétrable qui fracasse les charges ennemies"
  dragon_lords:0 "Seigneurs-Tigres"
  dragon_lords_flavor:0 "Les Seigneurs-Tigres sont des nobles volantains s'enorgueillissant de leur héritage aristocratique remontant à la Valyria d'antan. Leurs lignées sont vénérées et leur prouesse au combat demeure inégalée. En tant que cataphractes lourdement armés, ils chargent au combat lances dressées, semant l'effroi dans le cœur de leurs adversaires. Réputés pour leur agressivité et leur férocité, leurs ennemis tremblent au tonnerre de leurs sabots approchants. Race fière et arrogante, leur bravoure et leur détermination inébranlable sur le champ de bataille restent sans pareilles"
  citizen_guard:0 "Garde Citoyenne"
  citizen_guard_flavor:0 "La Garde Citoyenne est une milice formée des habitants de l'État volantain, particulièrement ceux des cités de Volantis, Volon Therys, Valysar et leurs alentours. Seuls les hommes libres peuvent rejoindre cette garde, ce qu'ils font avec fierté, car y combattre est un grand honneur. Cette infanterie disciplinée, équipée d'armures lourdes, larges boucliers, épées, haches et masses, constitue l'épine dorsale de l'armée volantaine et le principal rempart contre les ennemis frontaliers"
  volantis_war_elephants:0 "Éléphants de Guerre Volantains"
  volantis_war_elephants_flavor:0 "L'éléphant est l'emblème de la Grande Cité de Volantis. Leur simple présence exalte le moral des citoyens et instille la terreur chez leurs adversaires. Cette formation comprend plusieurs dizaines de puissants éléphants de guerre, bardés d'armures lourdes, chacun portant un cornac et une tourelle abritant plusieurs archers. Leur mortel impact au combat brise souvent des formations entières en une seule charge foudroyante"

  # DOTHRAKI
  dothraki_riders:0 "Cavaliers Dothraki"
  dothraki_riders_flavor:0 "Les Dothraki ont développé avec leurs montures un lien comme nulle autre culture, les employant pour toute entreprise guerrière et méprisant tout autre style de combat comme indigne d'eux"

  # North Valyria
  elyrian_longbowmen:0 "Archers à Arc Long d'Élyria"
  elyrian_longbowmen_flavor:0 "Les archers d'Élyria sont des tireurs d'élite renommés pour leur précision et leur portée meurtrière, maniant de grands arcs finement ciselés pour des tirs dévastateurs. Entraînés dès leur plus jeune âge, ils frappent promptement à distance, alliant agilité et maîtrise inégalée de la guerre à distance"
  mantaryan_monsters:0 "Monstres de Mantarys"
  mantaryan_monsters_flavor:0 "Les Monstres de Mantarys sont une élite de guerriers déformés par le Fléau, leurs corps défigurés mais leurs talents meurtriers. Bien que leur transformation leur confère des pouvoirs contre nature, leurs formes altérées les laissent terriblement vulnérables"

  # Gogossos
  gogossi_berserkers:0 "Berserkers de Gogossos"
  gogossi_berserkers_flavor:0 "Les Berserkers de Gogossos sont des hommes et femmes enivrés par le frisson du combat mais également envoûtés par l'odeur et le goût du sang. Ils plongent dans une frénésie meurtrière, fauchant tous ceux qui les entourent, car peu leur importe la source du sang, pourvu qu'il coule"
  basilisk_riders:0 "Chevaucheurs de Basilics"
  basilisk_riders_flavor:0 "Les Chevaucheurs de Basilics jouissent d'un immense prestige dans la culture de Gogossos. Après des années d'entraînement rigoureux, leurs montures féroces déchirent les armures comme du parchemin. Ces redoutables cavaliers sont généralement dépêchés pour des assassinats, leur silence et rapidité étant légendaires... que les dieux vous gardent si vous êtes leur proie"
  blood_mutants:0 "Mutants-de-Sang"
  blood_mutants_flavor:0 "Par essais et erreurs, les Gogossites, fascinés par le [valyrian_freehold|E], ses mages et leurs arcanes, ont appris à maîtriser les pouvoirs du sang pour créer de nouvelles créatures invincibles. Ces êtres peuvent changer le cours d'une bataille d'un simple geste, les rapprochant davantage des dieux que des mortels, à l'image même des Valyriens.."

  # Asshai
  esoteric_grenadiers:0 "Grenadiers Ésotériques"
  esoteric_grenadiers_flavor:0 "Les Grenadiers Ésotériques, principalement composés de sorciers novices dans les arts occultes, sont adeptes de la religion des Entrelieurs d'Ombres. Leur puissance colossale leur permet d'inverser aisément le cours d'une bataille grâce à leurs enchantements projeteurs de flammes"

  shadow_raiders:0 "Maraudeurs des Ombres"
  shadow_raiders_flavor:0 "Les Hommes des Ombres ne sont point étrangers au combat bien qu'ils l'évitent, car leurs ancêtres étaient jadis pirates et pillards, écumant les navires des mers avoisinantes dans leur quête de butin, gloire et infamie"
l_french:
  # Volantis
  volantis_slaves:0 "Esclaves Soldats"
  volantis_slaves_flavor:0 "Toute personne asservie doit obéir à ses Maîtres, même si cela signifie risquer sa vie sur le champ de bataille. Combattant sans armure et avec des armes de fortune, ils sont censés donner au reste de l'armée le temps d'accomplir le vrai travail."
  free_riders:0 "Cavaliers Libres"
  free_riders_flavor:0 "Recrutés parmi les mercenaires et épées-louées, ils constituent la grande majorité de la cavalerie volantaine. Bien qu'originaires de toutes les contrées d'Essos, ils parviennent à mener leurs missions avec efficacité."
  elephant_tusk:0 "Défenses d'Éléphant"
  elephant_tusk_flavor:0 "Les Défenses d'Éléphant sont membres de la faction politique connue sous le nom des 'Éléphants'. Ils combattent en formation de phalange hautement organisée, maniant de longues piques avec un effet dévastateur. Comme les éléphants, ils sont inflexibles et inébranlables dans leur défense, et nul ennemi ne peut surmonter leur mur infranchissable de lances par l'avant. Même en retraite, ils ne succombent pas à la panique et se retirent de manière ordonnée, fournissant une couverture au reste de l'armée. Leurs ennemis gardent l'impression qu'ils ne se fatiguent jamais, se dressant comme un bouclier impénétrable qui brise les charges ennemies."
  dragon_lords:0 "Seigneurs Tigres"
  dragon_lords_flavor:0 "Les Seigneurs Tigres sont membres de la noblesse volantaine qui tirent fierté de leur héritage aristocratique remontant à la Valyria perdue depuis longtemps. Leurs lignées sont vénérées et leur prouesse au combat inégalée. En tant que cataphractaires lourdement blindés, ils chargent au combat leurs lances dressées haut, prêts à semer la terreur dans le cœur de leurs ennemis. Les Seigneurs Tigres sont connus pour leur agressivité et leur férocité au combat, et leurs ennemis tremblent au son de leurs sabots qui approchent. C'est un groupe fier et arrogant, mais leur bravoure et leur détermination inébranlable sur le champ de bataille sont inégalées."
  citizen_guard:0 "Garde Citoyenne"
  citizen_guard_flavor:0 "La Garde Citoyenne est une milice civique composée des habitants de l'État volantain, particulièrement ceux des cités de Volantis, Volon Therys, Valysar et leurs environs. Seuls les hommes libres peuvent rejoindre la Garde Citoyenne, et ils le font avec grande fierté, car combattre dans cette formation est un grand honneur. Ils combattent comme infanterie disciplinée, équipés d'armures lourdes, de grands boucliers, d'épées, de haches et de marteaux. Ils forment l'épine dorsale de l'armée volantaine et constituent le moyen principal de défendre leurs frontières contre leurs ennemis voisins."
  volantis_war_elephants:0 "Éléphants de Guerre de Volantis"
  volantis_war_elephants_flavor:0 "L'éléphant est un symbole de la Grande Cité de Volantis. Leur simple présence élève le moral de tous ses citoyens et instille la peur chez leurs ennemis. La formation comprend plusieurs dizaines de grands éléphants de guerre, revêtus d'armures lourdes, chacun avec un cornac sur son dos et une petite tourelle avec plusieurs archers. Ils sont absolument mortels au combat, brisant souvent des formations entières d'une seule charge puissante."

  # Dothraki
  dothraki_riders:0 "Cavaliers Dothrakis"
  dothraki_riders_flavor:0 "Les Dothrakis ont appris à chevaucher et créer des liens avec leurs chevaux comme nulle autre culture, les utilisant pour tous les objectifs de guerre et considérant tout autre style de combat comme indigne d'eux."

  # Northern Valyria
  elyrian_longbowmen:0 "Archers Longs Élyréens"
  elyrian_longbowmen_flavor:0 "Les archers longs élyréens sont des tireurs d'élite renommés pour leur précision et leur portée mortelle, maniant des arcs hauts et finement ouvragés conçus pour des tirs puissants. Entraînés dès leur plus jeune âge, ils frappent rapidement de loin, alliant agilité et compétence inégalée dans la guerre à distance."
  mantaryan_monsters:0 "Monstres Mantaryens"
  mantaryan_monsters_flavor:0 "Les Monstres Mantaryens sont une bande d'élite de guerriers tordus par le Fléau, leurs corps défigurés mais leurs compétences mortelles. Bien que leur transformation leur confère des pouvoirs surnaturels, leurs formes altérées les rendent douloureusement vulnérables."

  # Gogossos
  gogossi_berserkers:0 "Berserkers Gogossites"
  gogossi_berserkers_flavor:0 "Les Berserkers Gogossites sont des hommes et femmes qui aiment l'excitation du combat mais sont aussi ensorcelés par le parfum et le goût du sang. Ils entrent dans une frénésie meurtrière, tuant tous ceux qui les entourent car ils ne se soucient pas d'où coule le sang, seulement qu'il coule."
  basilisk_riders:0 "Cavaliers de Basilic"
  basilisk_riders_flavor:0 "Les Cavaliers de Basilic sont extrêmement vénérés dans la culture gogossite. Ayant nécessité des années d'entraînement dévoué, ces montures vicieuses déchireront l'armure comme du beurre. Ces cavaliers redoutables sont habituellement envoyés en missions d'assassinat car ils sont extrêmement silencieux et rapides aussi... bonne chance pour vous cacher d'eux."
  blood_mutants:0 "Mutants du Sang"
  blood_mutants_flavor:0 "Par essais et erreurs, les Gogossites, du fait de leur fascination pour les [valyrian_freehold|E], ses mages et les magies qu'elles recèlent, ont appris à utiliser les pouvoirs du sang pour créer de nouvelles créatures imparables capables de changer le cours de la bataille en levant à peine le doigt, les rendant plus proches des dieux que des humains, tout comme les Valyriens..."

  # Asshai
  esoteric_grenadiers:0 "Grenadiers Ésotériques"
  esoteric_grenadiers_flavor:0 "Les Grenadiers Ésotériques, principalement composés de sorciers novices dans les arts magiques, sont communément connus pour leur pratique de la religion des Lieur d'Ombres. Ils possèdent une force immense et peuvent ainsi facilement changer le cours de la bataille grâce à leurs capacités enchantées de lance-flammes."

  shadow_raiders:0 "Raideurs d'Ombre"
  shadow_raiders_flavor:0 "Les Hommes de l'Ombre ne sont pas étrangers au combat malgré qu'ils l'évitent, car leurs ancêtres furent jadis des pirates et raideurs qui volaient les navires des mers voisines dans une tentative de chercher butin, gloire et infamie."
l_french:
  # Volantis
  volantis_slaves:0 "Esclaves-Soldats"
  volantis_slaves_flavor:0 "Chaque personne asservie doit obéir à ses Maîtres, même si cela signifie risquer sa vie sur le champ de bataille. Combattant sans armure et avec des armes de fortune, ils sont censés donner au reste de l'armée le temps d'accomplir le vrai travail de guerre."
  free_riders:0 "Cavaliers Libres"
  free_riders_flavor:0 "Recrutés parmi les mercenaires et épées-louées, ils constituent la grande majorité de la cavalerie de Volantis. Bien qu'ils viennent de toutes les régions d'Essos, ils sont capables de mener à bien leurs missions avec une efficacité redoutable."
  elephant_tusk:0 "Défenses d'Éléphant"
  elephant_tusk_flavor:0 "Les Défenses d'Éléphant sont membres de la faction politique connue sous le nom d'« Éléphants ». Ils combattent en formation de phalange hautement organisée, maniant de longues piques avec un effet dévastateur. Comme les éléphants, ils sont inflexibles et inébranlables dans leur défense, et nul ennemi ne peut surmonter leur mur de lances impénétrable par le front. Même en retraite, ils ne succombent point à la panique et se retirent de manière ordonnée, fournissant une couverture au reste de l'armée. Leurs ennemis gardent l'impression qu'ils ne se fatiguent jamais, se dressant comme un bouclier impénétrable qui brise les charges ennemies."
  dragon_lords:0 "Seigneurs Tigres"
  dragon_lords_flavor:0 "Les Seigneurs Tigres sont membres de la noblesse volantaine qui tirent fierté de leur héritage aristocratique remontant à la Valyria perdue depuis longtemps. Leurs lignées sont vénérées et leurs prouesses au combat sont inégalées. En tant que cataphractaires lourdement blindés, ils chargent au combat avec leurs lances brandies haut, prêts à semer la terreur dans le cœur de leurs ennemis. Les Seigneurs Tigres sont connus pour leur agressivité et leur férocité au combat, et leurs ennemis tremblent au son de leurs sabots qui approchent. Ils forment une bande fière et arrogante, mais leur bravoure et leur détermination inébranlable sur le champ de bataille demeurent inégalées."
  citizen_guard:0 "Garde Citoyenne"
  citizen_guard_flavor:0 "La Garde Citoyenne est une milice civique composée des habitants de l'État volantain, particulièrement ceux des cités de Volantis, Volon Therys, Valysar et de leurs régions environnantes. Seuls les hommes libres peuvent rejoindre la Garde Citoyenne, et ils le font avec grande fierté, car combattre dans cette formation constitue un grand honneur. Ils se battent comme infanterie disciplinée, équipés d'armures lourdes, de grands boucliers, d'épées, de haches et de marteaux. Ils forment l'épine dorsale de l'armée volantaine et constituent le moyen principal de défendre leurs frontières contre leurs ennemis voisins."
  volantis_war_elephants:0 "Éléphants de Guerre de Volantis"
  volantis_war_elephants_flavor:0 "L'éléphant est le symbole de la Grande Cité de Volantis. Leur simple présence élève le moral de tous ses citoyens et instille la peur chez leurs ennemis. La formation comprend plusieurs dizaines de grands éléphants de guerre, revêtus d'armures lourdes, chacun avec un dresseur sur son dos et une petite tourelle avec plusieurs archers. Ils sont absolument mortels au combat, brisant souvent des formations entières d'une seule charge puissante."

  # Dothraki
  dothraki_riders:0 "Cavaliers Dothrakis"
  dothraki_riders_flavor:0 "Les Dothrakis ont appris à monter et à créer des liens avec leurs chevaux comme nulle autre culture, les utilisant pour tous les usages de guerre et considérant tout autre style de combat comme indigne d'eux."

  # Northern Valyria
  elyrian_longbowmen:0 "Archers Longs d'Elyria"
  elyrian_longbowmen_flavor:0 "Les archers longs d'Elyria sont des archers d'élite renommés pour leur précision et leur portée mortelle, maniant de grands arcs aux ornements complexes conçus pour des tirs puissants. Entraînés dès leur plus jeune âge, ils frappent rapidement de loin, alliant agilité et compétence inégalée dans la guerre à distance."
  mantaryan_monsters:0 "Monstres de Mantarys"
  mantaryan_monsters_flavor:0 "Les Monstres de Mantarys sont une bande d'élite de guerriers déformés par le Fléau, leurs corps défigurés mais leurs compétences létales. Bien que leur transformation leur accorde des pouvoirs contre-nature, leurs formes altérées les laissent douloureusement vulnérables."

  # Gogossos
  gogossi_berserkers:0 "Berserkers Gogossiens"
  gogossi_berserkers_flavor:0 "Les Berserkers Gogossiens sont des hommes et femmes qui aiment les frissons du combat mais sont aussi ensorcelés par l'odeur et le goût du sang. Ils entrent dans une frénésie meurtrière, tuant tous ceux qui les entourent car peu leur importe d'où coule le sang, seulement qu'il coule."
  basilisk_riders:0 "Cavaliers de Basilic"
  basilisk_riders_flavor:0 "Les Cavaliers de Basilic sont extrêmement vénérés dans la culture gogossienne, ayant nécessité des années d'entraînement dévoué. Ces montures vicieuses déchireront les armures comme du beurre. Ces cavaliers redoutables sont généralement envoyés en missions d'assassinat car ils sont extrêmement silencieux et rapides... bonne chance pour leur échapper."
  blood_mutants:0 "Mutants de Sang"
  blood_mutants_flavor:0 "Par essais et erreurs, les Gogossiens, en raison de leur fascination pour les [valyrian_freehold|E], ses mages et les magies qu'elles contenaient, ont appris à utiliser les pouvoirs du sang pour créer de nouvelles créatures imparables capables de changer le cours de la bataille en levant à peine le doigt, les rendant plus proches des dieux que des humains, tout comme les Valyriens..."

  # Asshai
  esoteric_grenadiers:0 "Grenadiers Ésotériques"
  esoteric_grenadiers_flavor:0 "Les Grenadiers Ésotériques, composés principalement de sorciers novices dans les arts magiques, sont communément connus pour leur pratique de la religion des Ombromanciens. Ils possèdent une force immense et peuvent ainsi facilement changer le cours de la bataille grâce à leurs capacités enchantées de lance-flammes."

  shadow_raiders:0 "Raiders de l'Ombre"
  shadow_raiders_flavor:0 "Les Hommes de l'Ombre ne sont point étrangers au combat malgré qu'ils l'évitent, car leurs ancêtres furent jadis pirates et pillards qui volaient les navires des mers voisines dans une tentative de chercher butin, gloire et infamie."
l_french:
  # Volantis
  volantis_slaves:0 "Esclaves Soldats"
  volantis_slaves_flavor:0 "Chaque esclave doit obéir à ses Maîtres, même si cela signifie risquer sa vie sur le champ de bataille. Combattant sans armure et avec des armes improvisées, ils sont censés accorder au reste de l’armée le temps de faire le véritable travail"
  free_riders:0 "Cavaliers Libres"
  free_riders_flavor:0 "Recrutés parmi les mercenaires et les épéistes à louer, ils constituent la grande majorité de la cavalerie de Volantis. Bien qu’ils proviennent de toutes les régions d’Essos, ils parviennent à mener leurs missions efficacement"
  elephant_tusk:0 "Défenses d’Éléphants"
  elephant_tusk_flavor:0 "Les Défenses d’Éléphants sont des membres de la faction politique appelée « les Éléphants ». Ils combattent en formation de phalange hautement organisée, brandissant de longues piques avec un effet dévastateur. À l’image des éléphants, ils sont inflexibles et inébranlables dans leur défense, et aucun ennemi ne peut franchir leur mur de lances. Même en retraite, ils ne cèdent pas à la panique et se replient de manière ordonnée, couvrant le reste de l’armée. Leurs ennemis ont l’impression qu’ils ne se fatiguent jamais, formant un bouclier impénétrable qui brise les charges adverses"
  dragon_lords:0 "Seigneurs Tigres"
  dragon_lords_flavor:0 "Les Seigneurs Tigres sont des membres de la noblesse de Volantis, fiers de leur héritage aristocratique remontant à la Valyria perdue. Leurs lignées sont vénérées et leur prouesse au combat est inégalée. En tant que cataphractaires lourdement blindés, ils chargent au combat lances levées, prêts à semer la terreur dans le cœur de leurs ennemis. Les Seigneurs Tigres se distinguent par leur agressivité et leur férocité au combat, et leurs adversaires frémissent au son de leurs sabots. Ils sont fiers et arrogants, mais leur bravoure et leur détermination inébranlable sur le champ de bataille sont inégalées"
  citizen_guard:0 "Garde Citoyenne"
  citizen_guard_flavor:0 "La Garde Citoyenne est une milice civique composée des habitants de l’État de Volantis, en particulier de ceux des cités de Volantis, Volon Therys, Valysar et de leurs environs. Seuls des individus libres peuvent rejoindre la Garde Citoyenne, et ils le font avec grande fierté, car combattre dans cette formation est un grand honneur. Ils se battent comme une infanterie disciplinée, équipés d’armures lourdes, de grands boucliers, d’épées, de haches et de marteaux. Ils constituent l’ossature de l’armée de Volantis et représentent le principal moyen de défendre leurs frontières contre leurs ennemis voisins"
  volantis_war_elephants:0 "Éléphants de Guerre de Volantis"
  volantis_war_elephants_flavor:0 "L’éléphant est le symbole de la Grande Cité de Volantis. Sa simple présence galvanise le moral de ses habitants et inspire la crainte chez ses ennemis. Cette formation comprend plusieurs dizaines de grands éléphants de guerre, recouverts d’une lourde armure, chacun doté d’un cornac et d’une tourelle abritant plusieurs archers. Ils sont absolument redoutables au combat, perçant souvent des formations entières en une seule charge dévastatrice"

  # Dothraki
  dothraki_riders:0 "Cavaliers Dothrakis"
  dothraki_riders_flavor:0 "Les Dothrakis ont appris à monter et à s’attacher à leurs chevaux comme aucune autre culture, les utilisant pour toute forme de guerre et considérant tout autre style de combat comme inférieur"

  # North Valyria
  elyrian_longbowmen:0 "Archers Longs d’Elyria"
  elyrian_longbowmen_flavor:0 "Les Archers Longs d’Elyria sont des archers d’élite réputés pour leur précision et leur portée meurtrière, maniant de grands arcs finement ouvragés conçus pour des tirs puissants. Formés dès leur plus jeune âge, ils frappent rapidement de loin, alliant agilité et maîtrise inégalée du combat à distance"
  tolosi_slingers:0 "Frondeurs de Tolosi"
  tolosi_slingers_flavor:0 "Les Frondeurs de Tolosi sont des guerriers experts qui projettent de petits projectiles de plomb dense avec une grande vitesse et une précision remarquable, les rendant redoutables à longue portée. Leurs munitions en plomb procurent un impact plus grand que les pierres classiques, donnant à leurs attaques un atout redoutable"
  mantaryan_monsters:0 "Monstres de Mantarys"
  mantaryan_monsters_flavor:0 "Les Monstres de Mantarys sont un groupe d’élite de guerriers déformés par le Fléau, leurs corps altérés mais leurs compétences mortelles. Bien que leur transformation leur confère des pouvoirs surnaturels, leurs formes modifiées les rendent douloureusement vulnérables"

  # Gogossos
  gogossi_berserkers:0 "Berserkers Gogossis"
  gogossi_berserkers_flavor:0 "Les Berserkers Gogossis sont des hommes et des femmes qui adorent l’adrénaline du combat et sont ensorcelés par l’odeur et le goût du sang. Ils se jettent dans une frénésie meurtrière, éliminant tous ceux qui les entourent sans se soucier de l’origine du sang, seulement qu’il coule"
  basilisk_riders:0 "Cavaliers Basilics"
  basilisk_riders_flavor:0 "Les Cavaliers Basilics sont extrêmement vénérés dans la culture gogossite, après des années d’entraînement assidu ces montures féroces transpercent les armures comme du beurre. Ils sont souvent envoyés en mission d’assassinat, se déplaçant de façon silencieuse et rapide… bonne chance pour leur échapper"
  blood_mutants:0 "Mutants de Sang"
  blood_mutants_flavor:0 "À force d’expérimentations, les gogossites, fascinés par les anciennes Possessions, leurs mages et leurs magies, ont appris à manier le pouvoir du sang pour créer de nouvelles créatures imparables capables de changer le cours d’une bataille en bougeant à peine un doigt, les rapprochant davantage des dieux que des humains, à l’image des valyriens…"

  # Asshai
  esoteric_grenadiers:0 "Grenadiers Ésotériques"
  esoteric_grenadiers_flavor:0 "Les Grenadiers Ésotériques, majoritairement composés de sorciers novices en arts mag

  shadow_raiders:0 "Raiders de l’Ombre"
  shadow_raiders_flavor:0 "Les Hommes de l’Ombre ne sont pas étrangers au combat malgré leur tendance à l’éviter, car leurs ancêtres étaient autrefois des pirates et des pillards qui attaquaient les navires dans les mers voisines pour le butin, la gloire et la renommée"
l_french:
  # Volantis
  volantis_slaves:0 "Esclaves soldats"
  volantis_slaves_flavor:0 "Chaque personne asservie doit obéir à ses maîtres, quitte à risquer sa vie sur le champ de bataille. Sans armure et armés d’armes de fortune, ils doivent gagner du temps pour le reste de l’armée"
  free_riders:0 "Cavaliers libres"
  free_riders_flavor:0 "Recrutés parmi les mercenaires et soldats de fortune, ils constituent la majeure partie de la cavalerie de Volantis. Malgré leurs origines diverses à travers Essos, ils accomplissent leurs missions avec efficacité"
  elephant_tusk:0 "Défense des Éléphants"
  elephant_tusk_flavor:0 "Membres de la faction politique des «Éléphants», ils combattent en formation de phalange organisée, armés de longues piques dévastatrices. À l’image de leurs noms, ils sont inébranlables, formant un mur de lances impénétrable, et même en retraite, leur discipline maintient la cohésion de l’armée"
  dragon_lords:0 "Seigneurs du Tigre"
  dragon_lords_flavor:0 "Les Seigneurs du Tigre sont des nobles de Volantis, fiers de leur héritage valyrien. Cataphractaires lourdement blindés, lances hautes, ils inspirent la terreur au galop. Leur agressivité et leur férocité sont légendaires, et leurs ennemis tremblent à l’écho de leurs sabots"
  citizen_guard:0 "Garde citoyenne"
  citizen_guard_flavor:0 "Milice civique composée des habitants libres de Volantis, Volon Therys, Valysar et leurs environs. Seuls les citoyens peuvent y servir, avec fierté, en formation disciplinée, armure lourde, boucliers, épées, haches et marteaux, formant l’ossature défensive de la cité"
  volantis_war_elephants:0 "Éléphants de guerre de Volantis"
  volantis_war_elephants_flavor:0 "Symbole vivant de la Grande Cité, ces éléphants de guerre blindés, montés par un cornac et une tourelle d’archers, brisent les formations ennemies d’un seul élan, galvanisant leurs alliés et terrorisant leurs adversaires"

  # Dothraki
  dothraki_riders:0 "Cavaliers dothraki"
  dothraki_riders_flavor:0 "Les Dothraki ont forgé un lien unique avec leurs chevaux: ils les montent pour toutes les formes de guerre, considérant toute autre méthode comme indigne d’eux"

  # North Valyria
  elyrian_longbowmen:0 "Archers élyriens"
  elyrian_longbowmen_flavor:0 "Les archers élyriens sont des tireurs d’élite réputés pour leur précision mortelle et leur portée exceptionnelle. Formés dès leur plus jeune âge à manier de grands arcs longs finement ouvragés, ils frappent rapidement à distance, alliant agilité et maîtrise inégalée du combat à l’arc."
  tolosi_slingers:0 "Frondeurs tolosiens"
  tolosi_slingers_flavor:0 "Les frondeurs tolosiens sont de redoutables combattants, capables de lancer de petits projectiles de plomb dense avec une vitesse et une précision remarquables. Leurs munitions en plomb infligent un impact supérieur à la pierre classique, conférant à leurs attaques un effet terrifiant."
  mantaryan_monsters:0 "Monstres mantaryens"
  mantaryan_monsters_flavor:0 "Les Monstres mantaryens forment une troupe d’élite défigurée par la Catastrophe: leurs corps altérés restent pourtant d’une efficacité meurtrière. Leur transformation leur confère des pouvoirs surnaturels, mais leur forme modifiée les rend aussi fragiles."

  # Gogossos
  gogossi_berserkers:0 "Berserkers gogossites"
  gogossi_berserkers_flavor:0 "Les Berserkers gogossites, hommes et femmes, vivent pour l’ivresse du combat et le frisson du sang. En proie à une frénésie meurtrière, ils tuent sans distinction, se nourrissant uniquement du flot écarlate."
  basilisk_riders:0 "Cavaliers basilics"
  basilisk_riders_flavor:0 "Les Cavaliers basilics sont vénérés dans la culture gogossite. Montés sur des créatures féroces capables de percer n’importe quelle armure, ils opèrent en silence et à grande vitesse, parfaits pour les missions d’assassinat."
  blood_mutants:0 "Mutants de sang"
  blood_mutants_flavor:0 "Par leur fascination pour le sang valyrien et ses magies, les gogossites ont créé des Mutants de sang: des créatures supérieures, proches de dieux, capables de renverser le cours d’une bataille d’un simple geste."

  # Asshai
  esoteric_grenadiers:0 "Grenadiers ésotériques"
  esoteric_grenadiers_flavor:0 "Les Grenadiers ésotériques, principalement composés de sorciers novices dans les arts magiques, sont réputés pour pratiquer la religion des Lieurs d'Ombre. Ils possèdent une force immense et peuvent ainsi renverser facilement le cours des batailles grâce à leurs capacités d’envoi de flammes enchantées"

  shadow_raiders:0 "Raiders de l’ombre"
  shadow_raiders_flavor:0 "Les Raiders de l’ombre sont les descendants de pirates et de pillards: malgré leur héritage, ils maîtrisent l’art de la furtivité et du vol pour s’enrichir et gagner renommée et infamie."
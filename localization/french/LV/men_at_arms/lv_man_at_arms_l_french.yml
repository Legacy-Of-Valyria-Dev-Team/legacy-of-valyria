l_french:
 # Volantis
 volantis_slaves:0 "Esclaves Soldats"
 volantis_slaves_flavor:0 "Chaque personne asservie doit obéir à ses Maîtres, même si cela signifie risquer sa vie sur le champ de bataille. Combattant sans armure et avec des armes improvisées, ils sont censés donner au reste de l'armée le temps d'accomplir le véritable travail"
 free_riders:0 "Cavaliers Libres"
 free_riders_flavor:0 "Recrutés parmi les mercenaires et les épées-louées, ils constituent la grande majorité de la cavalerie de Volantis. Bien que venant de toutes les régions d'Essos, ils sont capables de mener à bien leurs missions avec efficacité"
 elephant_tusk:0 "Défenses d'Éléphant"
 elephant_tusk_flavor:0 "Les Défenses d'Éléphant sont des membres de la faction politique connue sous le nom des « Éléphants ». Ils combattent dans une formation en phalange hautement organisée, maniant de longues piques avec un effet dévastateur. Comme les éléphants, ils sont inflexibles et inébranlables dans leur défense, et nul ennemi ne peut surmonter leur mur infrangible de lances de front. Même en retraite, ils ne cèdent pas à la panique et se retirent de manière ordonnée, protégeant le reste de l'armée. Leurs ennemis gardent l'impression qu'ils ne se fatiguent jamais, se dressant comme un bouclier impénétrable qui brise les charges ennemies."
 dragon_lords:0 "Seigneurs Tigres"
 dragon_lords_flavor:0 "Les Seigneurs Tigres sont des membres de la noblesse volantène qui tirent fierté de leur héritage aristocratique remontant à la Valyria depuis longtemps disparue. Leurs lignées sont vénérées et leurs prouesses au combat sont sans égales. Cataphractaires lourdement blindés, ils chevauchent au combat, lances levées, prêts à semer la terreur dans le cœur de leurs ennemis. Les Seigneurs Tigres sont connus pour leur agressivité et leur férocité au combat, et leurs ennemis tremblent au son de leurs sabots qui approchent. Ce sont des gens fiers et arrogants, mais leur bravoure et leur détermination inébranlable sur le champ de bataille sont sans égales."
 citizen_guard:0 "Garde Citoyenne"
 citizen_guard_flavor:0 "La Garde Citoyenne est une milice civique composée des habitants de l'état de Volantis, particulièrement ceux des cités de Volantis, Volon Therys, Valysar, et leurs environs. Seuls les hommes libres peuvent rejoindre la Garde Citoyenne, et ils le font avec grande fierté, car combattre dans cette formation est un grand honneur. Ils combattent comme une infanterie disciplinée, équipée d'armures lourdes, de grands boucliers, d'épées, de haches et de marteaux. Ils forment l'épine dorsale de l'armée volantène et sont le principal moyen de défendre leurs frontières contre leurs ennemis voisins."
 volantis_war_elephants:0 "Éléphants de Guerre de Volantis"
 volantis_war_elephants_flavor:0 "L'éléphant est un symbole de la Grande Cité de Volantis. Leur seule présence relève le moral de tous ses citoyens et instille la crainte chez leurs ennemis. La formation se compose de plusieurs douzaines de grands éléphants de guerre, revêtus d'armures lourdes, chacun avec un cornac sur son dos et une petite tourelle abritant plusieurs archers. Ils sont absolument redoutables au combat, brisant souvent des formations entières d'une seule charge puissante."

 # Dothraki
 dothraki_riders:0 "Cavaliers Dothrakis"
 dothraki_riders_flavor:0 "Les Dothrakis ont appris à monter et à se lier à leurs chevaux comme nulle autre culture, les utilisant à toutes fins guerrières et considérant tout autre style de guerre comme indigne d'eux."

 # Northern Valyria
 elyrian_longbowmen:0 "Archers Longs Élyréens"
 elyrian_longbowmen_flavor:0 "Les archers longs élyréens sont des archers d'élite réputés pour leur précision et leur portée mortelle, maniant de hauts arcs finement ouvragés conçus pour des tirs puissants. Entraînés dès leur plus jeune âge, ils frappent rapidement à distance, alliant agilité et compétence inégalée dans la guerre à distance."
 mantaryan_monsters:0 "Monstres de Mantarys"
 mantaryan_monsters_flavor:0 "Les Monstres de Mantarys sont une bande de guerriers d'élite tordus par le Fléau, leurs corps difformes mais leurs compétences mortelles. Bien que leur transformation leur confère des pouvoirs contre nature, leurs formes altérées les laissent douloureusement vulnérables."

 # Gogossos
 gogossi_berserkers:0 "Berserkers Gogossites"
 gogossi_berserkers_flavor:0 "Les Berserkers Gogossites sont des hommes et des femmes qui aiment le frisson du combat mais sont également envoûtés par l'odeur et le goût du sang ; ils entrent dans une folle frénésie, tuant tous ceux qui les entourent, car peu leur importe d'où coule le sang, seulement qu'il coule."
 basilisk_riders:0 "Cavaliers de Basilic"
 basilisk_riders_flavor:0 "Les Cavaliers de Basilic sont extrêmement révérés dans la culture gogossite ; ayant subi des années d'entraînement dévoué, ces montures féroces déchirent l'armure comme du beurre. Ces cavaliers redoutables sont habituellement envoyés en missions d'assassinat, car ils sont extrêmement silencieux et rapides également... bonne chance pour se cacher d'eux"
 blood_mutants:0 "Mutants de Sang"
 blood_mutants_flavor:0 "Par tâtonnements successifs, les Gogossites, en raison de leur fascination pour les [valyrian_freehold|E], ses mages et les magies qu'ils recèlent, ont appris à utiliser les pouvoirs du sang pour créer de nouvelles créatures inarrêtables, capables de faire basculer le cours d'une bataille en levant à peine le doigt, les rapprochant davantage des dieux que des hommes, tout comme les Valyriens..."

 # Asshai
 esoteric_grenadiers:0 "Grenadiers Ésotériques"
 esoteric_grenadiers_flavor:0 "Les Grenadiers Ésotériques, majoritairement composés de sorciers novices dans les arts magiques, sont communément connus pour leur pratique de la religion des Lieurs d'Ombre. Ils possèdent une force immense et peuvent ainsi aisément faire basculer le cours d'une bataille grâce à leurs capacités enchantées de projection de flammes."

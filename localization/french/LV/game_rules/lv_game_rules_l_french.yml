  rule_lv_colonisation:0 "#Y $lv_prefix$#! Colonisation et Restauration des Ruines"
  setting_lv_colonisation_default:0 "Par défaut"
  setting_lv_colonisation_default_desc:0 "Les ruines à travers le monde utiliseront le système de restauration de ruines de Legacy of Valyria."
  setting_lv_colonisation_lite:0 "Allégé"
  setting_lv_colonisation_lite_desc:0 "Les ruines à travers le monde utiliseront une version simplifiée du système de restauration de Legacy of Valyria, avec des possessions coloniales mais peu ou pas d'obstacles."
  setting_lv_colonisation_agot:0 "AGOT"
  setting_lv_colonisation_agot_desc:0 "Les ruines à travers le monde utiliseront le système de colonisation AGOT, sans obstacles et avec des possessions coloniales."
  setting_lv_colonisation_instant:0 "Instantané"
  setting_lv_colonisation_instant_desc:0 "La restauration des ruines et l'amélioration des colonies sont instantanées."

  #rule_lv_green_valyria:0 "#Y $lv_prefix$#! Valyria Verdoyante"
  #setting_lv_green_valyria_gradual:0 "Progressive"
  #setting_lv_green_valyria_gradual_desc:0 "Valyria deviendra progressivement plus verte au fil du temps, le processus s'accélérant à mesure que la sous-région est restaurée."
  #setting_lv_green_valyria_instant:0 "Instantané"
  #setting_lv_green_valyria_instant_desc:0 "Valyria deviendra verte dès que les seuils de sous-région sont atteints."

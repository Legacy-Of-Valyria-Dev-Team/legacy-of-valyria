  rule_lv_colonisation:0 "#Y $lv_prefix$#! Restauration des Ruines"
  setting_lv_colonisation_default:0 "Par Défaut"
  setting_lv_colonisation_default_desc:0 "Les ruines à travers le monde utiliseront le système de restauration des ruines de l'Héritage de Valyria."
  setting_lv_colonisation_lite:0 "Allégé"
  setting_lv_colonisation_lite_desc:0 "Les ruines à travers le monde utiliseront une version simplifiée du système de restauration des ruines de l'Héritage de Valyria, avec des possessions coloniales mais peu ou pas d'obstacles dans l'ensemble."
  setting_lv_colonisation_agot:0 "AGOT"
  setting_lv_colonisation_agot_desc:0 "Les ruines à travers le monde utiliseront le système de colonisation AGOT, sans obstacles et avec des possessions coloniales."

  rule_lv_green_valyria:0 "#Y $lv_prefix$#! Valyria Verdoyante"
  setting_lv_green_valyria_gradual:0 "Graduel"
  setting_lv_green_valyria_gradual_desc:0 "Valyria deviendra progressivement plus verdoyante au fil du temps, le processus s'accélérant à mesure que davantage de la sous-région sera restaurée."
  setting_lv_green_valyria_instant:0 "Instantané"
  setting_lv_green_valyria_instant_desc:0 "Valyria deviendra plus verdoyante dès que les seuils de la sous-région seront atteints."
  setting_lv_green_valyria_disabled:0 "Désactivé"
  setting_lv_green_valyria_disabled_desc:0 "Valyria demeurera une terre désolée et calcinée, peu importe la portion qui sera restaurée."

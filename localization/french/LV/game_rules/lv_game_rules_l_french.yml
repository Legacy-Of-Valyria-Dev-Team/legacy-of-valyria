l_french:
 lv_prefix:0 "LoV :"
 lv_canonicity:0 "Canonicité LoV"
 game_rule_category_lv_canonicity:0 "$lv_canonicity$"

 #rule_lv_valyria_status:0 "#Y $lv_canonicity$:#! Valyria"
 #setting_lv_valyria_default:0 "Défaut"
 #setting_lv_valyria_default_desc:0 "[valyria|E] débute tel qu'elle était après le [doom|E] — un désert mortel englouti par les Quatorze Flammes."
 #setting_lv_valyria_blank_slate:0 "Ardoise Vierge"
 #setting_lv_valyria_blank_slate_desc:0 "Les provinces valyriennes débutent en ruines, mais sans autrement aucun des modificateurs mortels."

 rule_lv_colonisation:0 "#Y $lv_prefix$#! Colonisation et Restauration des Ruines"
 setting_lv_colonisation_default:0 "Défaut"
 setting_lv_colonisation_default_desc:0 "Les ruines à travers le monde utiliseront le système de restauration des ruines de Legacy of Valyria."
 setting_lv_colonisation_lite:0 "Allégé"
 setting_lv_colonisation_lite_desc:0 "Les ruines à travers le monde utiliseront une version simplifiée du système de restauration des ruines de Legacy of Valyria, avec des possessions coloniales mais peu ou pas de blocages dans l'ensemble."
 setting_lv_colonisation_agot:0 "AGOT"
 setting_lv_colonisation_agot_desc:0 "Les ruines à travers le monde utiliseront le système de colonisation AGOT, sans blocages et avec des possessions coloniales."
 setting_lv_colonisation_instant:0 "Instantané"
 setting_lv_colonisation_instant_desc:0 "La restauration des ruines et l'amélioration des colonies sont instantanées."

 #rule_lv_green_valyria:0 "#Y $lv_prefix$#! Valyria Verdoyante"
 #setting_lv_green_valyria_gradual:0 "Graduel"
 #setting_lv_green_valyria_gradual_desc:0 "Valyria deviendra graduellement plus verdoyante au fil du temps, le processus s'accélérant à mesure que davantage de la sous-région est restaurée."
 #setting_lv_green_valyria_instant:0 "Instantané"
 #setting_lv_green_valyria_instant_desc:0 "Valyria deviendra plus verdoyante dès que les seuils de la sous-région seront atteints."
 #setting_lv_green_valyria_disabled:0 "Désactivé"
 #setting_lv_green_valyria_disabled_desc:0 "Valyria demeurera un désert dévasté, quelle que soit l'étendue de sa restauration."

 rule_lv_rehabilitate_valyria_duration:0 "#Y $lv_prefix$#! Durée de la Réhabilitation de Valyria"
 setting_lv_rehabilitate_valyria_duration_instant:0 "Instantanée"
 setting_lv_rehabilitate_valyria_duration_instant_desc:0 "Les projets de réhabilitation en Valyria sont achevés instantanément."
 setting_lv_rehabilitate_valyria_duration_short:0 "Courte"
 setting_lv_rehabilitate_valyria_duration_short_desc:0 "Les projets de réhabilitation en Valyria prennent 5 ans pour être achevés."
 setting_lv_rehabilitate_valyria_duration_normal:0 "Normale"
 setting_lv_rehabilitate_valyria_duration_normal_desc:0 "Les projets de réhabilitation en Valyria prennent 25 ans pour être achevés."
 setting_lv_rehabilitate_valyria_duration_long:0 "Longue"
 setting_lv_rehabilitate_valyria_duration_long_desc:0 "Les projets de réhabilitation en Valyria prennent 75 ans pour être achevés."


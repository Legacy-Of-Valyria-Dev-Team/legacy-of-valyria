l_french:
  lv_prefix:0 "LoV:"
  lv_canonicity:0 "Canonicité LoV"
  game_rule_category_lv_canonicity:0 "$lv_canonicity$"

  #rule_lv_valyria_status:0 "#Y $lv_canonicity$:#! Valyria"
  #setting_lv_valyria_default:0 "Default"
  #setting_lv_valyria_default_desc:0 "[valyria|E] starts as it is after The [doom|E]—a deadly wasteland engulfed by the Fourteen Flames."
  #setting_lv_valyria_blank_slate:0 "Blank Slate"
  #setting_lv_valyria_blank_slate_desc:0 "Valyrian provinces start off as ruins, but otherwise have none of the deadly modifiers."

  rule_lv_colonisation:0 "#Y $lv_prefix$#! Colonisation et Restauration des Ruines"
  setting_lv_colonisation_default:0 "Par défaut"
  setting_lv_colonisation_default_desc:0 "Les ruines à travers le monde utiliseront le système de restauration des ruines de Legacy of Valyria."
  setting_lv_colonisation_lite:0 "Allégé"
  setting_lv_colonisation_lite_desc:0 "Les ruines à travers le monde utiliseront une version simplifiée du système de restauration des ruines de Legacy of Valyria, avec des domaines coloniaux mais peu ou pas d'obstacles globalement."
  setting_lv_colonisation_agot:0 "AGOT"
  setting_lv_colonisation_agot_desc:0 "Les ruines à travers le monde utiliseront le système de colonisation d'AGOT, sans obstacles et avec des domaines coloniaux."
  setting_lv_colonisation_instant:0 "Instantané"
  setting_lv_colonisation_instant_desc:0 "La restauration des ruines et l'amélioration des établissements sont instantanées."

  #rule_lv_green_valyria:0 "#Y $lv_prefix$#! Valyria Verte"
  #setting_lv_green_valyria_gradual:0 "Progressif"
  #setting_lv_green_valyria_gradual_desc:0 "Valyria deviendra progressivement plus verte au fil du temps, le processus s'accélérant à mesure que davantage de la sous-région sera restaurée."
  #setting_lv_green_valyria_instant:0 "Instantané"
  #setting_lv_green_valyria_instant_desc:0 "Valyria deviendra plus verte dès que les seuils de la sous-région seront atteints."
  #setting_lv_green_valyria_disabled:0 "Désactivé"
  #setting_lv_green_valyria_disabled_desc:0 "Valyria demeurera une terre désolée et brûlée, peu importe la quantité de territoire restauré."

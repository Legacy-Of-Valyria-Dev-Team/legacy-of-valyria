  # Tournament
  activity_tournament_province_lv_great_arena_of_valyria_02_desc:0 "#P +++ $building_type_great_arena_of_valyria_02$#!\n"

  # Expedition
  lv_activity_expedition:0 "Expédition"
  lv_activity_expedition_host_an_a:0 "une"
  lv_activity_expedition_desc:0 "S'aventurer au-delà du connu, c'est flirter à la fois avec la fortune et la ruine. Les expéditions promettent des découvertes — qu'il s'agisse de reliques perdues enfouies dans des ruines oubliées, ou de terres fertiles attendant la main de la colonisation.\n\nLes expéditions sont menées par un commandant choisi, que ce soit vous-même ou un agent de confiance, et leur succès dépend de la préparation, des compétences et d'une mesure de chance. Ce qui nous attend demeure incertain... mais la récompense l'est tout autant."
  lv_activity_expedition_host_desc:0 "$BULLET_WITH_TAB$Peut gagner des [artifacts|E]\n$BULLET_WITH_TAB$Peut gagner du [prestige_i] [prestige|E]\n$BULLET_WITH_TAB$Peut gagner de la [legitimacy_i] [legitimacy|E]"
  lv_activity_expedition_selection_tooltip:0 "Financez une expédition pour découvrir des trésors perdus ou explorer des terres en vue d'une future colonisation.\n\nRécompenses Anticipées :\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]"

  expedition_type_valyria:0 "Valyria"
  expedition_type_valyria_desc:0 "La Péninsule Valyrienne est une terre de mystère et de péril, où gisent les ruines des jadis glorieuses Possessions Valyriennes dans l'attente de téméraires explorateurs.\n\nCes contrées regorgent de créatures hostiles et de terrains traîtres, et l'expédition devra être parfaitement préparée pour survivre aux dangers qui l'attendent dans ces terres maudites."
  expedition_type_rhoyne:0 "Le Risou"
  expedition_type_rhoyne_desc:0 "Le Risou est un fleuve puissant qui serpente à travers le cœur de Volantis et les ruines des anciens Rhoynars, témoins d'une civilisation disparue.\n\nL'expédition devra naviguer les courants traîtres du fleuve et éviter les périls qui se tapissent dans ses profondeurs obscures, où les esprits des morts murmurent encore."
  expedition_type_asshai:0 "Asshaï"
  expedition_type_asshai_desc:0 "Asshaï est une cité mystérieuse et antique située sur les rivages des Contrées de l'Ombre, enveloppée dans les brumes de magie noire et de sorcellerie ancienne.\n\nL'expédition devra naviguer dans les ruelles sombres de la cité et éviter les dangers qui se tapissent dans ses ombres, car à Asshaï, même les pierres murmurent des secrets interdits."

  activity_expedition_province_desc:0 "Vous planifierez et financerez une expédition vers [ROOT.Province.GetName]\nDe nombreux facteurs influenceront les résultats"

  hunt_treasure_intent:0 "Chasse au Trésor"
  hunt_treasure_intent_desc:0 "Rechercher des artefacts perdus et des trésors dans les ruines oubliées par le temps."
  chart_area_intent:0 "Cartographier la Région"
  chart_area_intent_desc:0 "Dresser la carte du terrain et identifier des sites potentiels de colonisation."

  expedition_preparation:0 "Préparation de l'Expédition"
  expedition_preparation_minimal:0 "Équipement de Base"
  expedition_preparation_minimal_desc:0 "Une expédition légère, pauvre en équipement et en pièces d'or. La fortune sourit aux audacieux — ou aux chanceux."
  expedition_preparation_standard:0 "Provisions Appropriées"
  expedition_preparation_standard_desc:0 "Bien pourvue en cartes, provisions et hommes de main. L'expédition est prête pour la plupart des défis qui l'attendent."
  expedition_preparation_heavy:0 "Expédition Parfaitement Équipée"
  expedition_preparation_heavy_desc:0 "Aucune dépense épargnée — guides expérimentés, chariots fortifiés et spécialistes de tous métiers. Si le succès peut s'acheter, voici comment procéder."

  expedition_main_phase:0 "Expédition Proprement Dite"
  expedition_main_phase_desc: "Les jours se muent en semaines tandis que l'expédition arpente des routes oubliées, fouille des ruines anciennes et affronte l'inconnu. Chaque camp éclairé par les flammes et chaque écho lointain pourrait apporter la fortune — ou la folie."

  lv_apa_expedition_monument_title: "[first.GetShortUIName|U] a découvert un monument [second.GetCulture.GetCollectiveNoun] à demi-enterré"
  lv_apa_expedition_chart_terrain_title: "[first.GetShortUIName|U] a fait des progrès impressionnants dans la cartographie du terrain de [second.GetName]"
  lv_apa_expedition_ruined_roads_title: "[first.GetShortUIName|U] a découvert des routes en ruines, facilitant à la fois le voyage et la cartographie de la région"
  lv_apa_expedition_old_map_title: "[first.GetShortUIName|U] a trouvé une ancienne carte correspondant au terrain de la région, aidant votre expédition"
  lv_apa_expedition_optimal_conditions_title: "[first.GetShortUIName|U] a trouvé que les conditions pour l'expédition étaient optimales"

  lv_apa_expedition_mired_in_mud_title: "Une tempête transforme les routes voisines en bourbier, immobilisant toute l'expédition"
  lv_apa_expedition_missing_supplies_title: "De la nourriture et des outils ont disparu durant la nuit"
  lv_apa_expedition_heated_argument_title: "Une dispute éclate concernant les routes à emprunter"
  lv_apa_expedition_frightened_animals_title: "Quelque chose d'invisible a affolé les animaux de [first.GetShortUINamePossessive], les dispersant dans les ténèbres"

  lv_apa_expedition_night_shift_positive_title: "[first.GetShortUIName|U] s'est retrouvé(e) à travailler tard aux côtés de [second.GetShortUIName]"
  lv_apa_expedition_night_shift_positive.tt:0 "[first.GetShortUIName|U] s'est bien entendu(e) avec [second.GetShortUIName] durant le quart de nuit, partageant histoires et rires qui ont allégé la peine."
  lv_apa_expedition_night_shift_positive.reason: "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] ont apprécié la compagnie l'un de l'autre durant une expédition."

  lv_apa_expedition_campfire_positive_title: "[first.GetShortUIName|U] et [second.GetShortUIName] ont partagé un feu de camp"
  lv_apa_expedition_campfire_positive.tt:0 "[first.GetShortUIName|U] et [second.GetShortUIName] ont partagé histoires et rires autour d'un feu de camp, renforçant leurs liens durant l'expédition."
  lv_apa_expedition_campfire_positive.reason: "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] ont partagé un feu de camp durant une expédition."

  lv_apa_expedition_night_shift_negative_title: "[first.GetShortUIName|U] s'est retrouvé(e) à travailler tard aux côtés de [second.GetShortUIName]"
  lv_apa_expedition_night_shift_negative.tt:0 "[first.GetShortUIName|U] et [second.GetShortUIName] se sont affrontés durant le quart de nuit, menant à une dispute houleuse qui a empoisonné l'atmosphère."
  lv_apa_expedition_night_shift_negative.reason: "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] se sont affrontés durant une expédition."

  lv_apa_expedition_foul_weather_title: "Le mauvais temps ralentit les progrès de l'expédition de [first.GetShortUINamePossessive]"


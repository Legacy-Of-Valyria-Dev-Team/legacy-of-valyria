 # Tournament
 activity_tournament_province_lv_great_arena_of_valyria_02_desc:0 "#P +++ $building_type_great_arena_of_valyria_02$#!\n"
 tournament_cost_discount_valyria:0 "Le site possède $building_type_great_arena_of_valyria_02$"

 # Expedition
 lv_activity_expedition:0 "Expédition"
 lv_activity_expedition_host_an_a:0 "une"
 lv_activity_expedition_desc:0 "S'aventurer au-delà du connu, c'est courtiser à la fois la fortune et la ruine. Les expéditions promettent la découverte — qu'il s'agisse de reliques perdues enfouies dans des ruines oubliées, ou de terres fertiles n'attendant que la main du colon.\n\nLes expéditions sont menées par un commandant choisi, que ce soit vous-même ou un agent de confiance, et leur succès dépend de la préparation, du talent et d'une part de chance. Ce qui vous attend demeure incertain... tout comme la récompense."
 lv_activity_expedition_host_desc:0 "$BULLET_WITH_TAB$Peut obtenir des [artifacts|E]\n$BULLET_WITH_TAB$Peut obtenir du [prestige_i] [prestige|E]\n$BULLET_WITH_TAB$Peut obtenir de la [legitimacy_i] [legitimacy|E]"
 lv_activity_expedition_selection_tooltip:0 "Financez une expédition pour mettre au jour des trésors perdus ou explorer des terres en vue d'une future colonisation.\n\nRécompenses attendues :\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]"

 expedition_type_valyria:0 "Valyria"
 expedition_type_valyria_desc:0 "La péninsule valyrienne est une terre de mystère et de danger, où gisent les ruines des jadis-glorieuses Possessions Valyriennes.\n\nCette terre grouille de créatures hostiles et de terrains périlleux ; l'expédition devra être minutieusement préparée pour survivre."
 expedition_type_rhoyne:0 "La Rhoyne"
 expedition_type_rhoyne_desc:0 "La Rhoyne est un puissant fleuve qui traverse le cœur de Volantis et les ruines de l'antique peuple Rhoynar.\n\nL'expédition devra naviguer les courants traîtres du fleuve et éviter les dangers tapis dans ses profondeurs."
 expedition_type_asshai:0 "Asshaï"
 expedition_type_asshai_desc:0 "Asshaï est une cité mystérieuse et antique, nichée sur les rives des Contrées de l'Ombre.\n\nL'expédition devra se frayer un chemin dans les ruelles obscures de la cité et éviter les dangers tapis dans ses ombres."

 activity_expedition_province_desc:0 "Vous planifierez et financerez une expédition vers [ROOT.Province.GetName]\nDe nombreux facteurs influenceront les résultats"

 hunt_treasure_intent:0 "Chasse au Trésor"
 hunt_treasure_intent_desc:0 "Rechercher des artefacts et trésors perdus dans les ruines."
 chart_area_intent:0 "Cartographier la Zone"
 chart_area_intent_desc:0 "Cartographier le terrain et repérer d'éventuels sites de colonisation."

 expedition_preparation:0 "Préparation de l'Expédition"
 expedition_preparation_minimal:0 "Strict Nécessaire"
 expedition_preparation_minimal_desc:0 "Une expédition légère, économe en équipement comme en or. La fortune sourit aux audacieux — ou aux chanceux."
 expedition_preparation_standard:0 "Provisions Adéquates"
 expedition_preparation_standard_desc:0 "Bien pourvue en cartes, en provisions et en bras engagés, cette expédition est prête à affronter la plupart des épreuves à venir."
 expedition_preparation_heavy:0 "Expédition Parfaitement Équipée"
 expedition_preparation_heavy_desc:0 "Aucune dépense n'a été épargnée — guides chevronnés, chariots renforcés et spécialistes en tout métier. Si le succès peut s'acheter, c'est bien ainsi."

 expedition_main_phase:0 "Expédition en Cours"
 expedition_main_phase_desc: "Les jours se muent en semaines tandis que l'expédition trace des routes oubliées, s'enfonce dans les ruines et affronte l'inconnu. Chaque campement éclairé par les flammes, chaque écho lointain, pourrait apporter fortune — ou folie."

 lv_apa_expedition_monument_title: "[first.GetShortUIName|U] a découvert un monument [second.GetCulture.GetCollectiveNoun] à demi enseveli"
 lv_apa_expedition_chart_terrain_title: "[first.GetShortUIName|U] a accompli des progrès remarquables dans la cartographie du terrain de [second.GetName]"
 lv_apa_expedition_ruined_roads_title: "[first.GetShortUIName|U] a découvert d'anciennes routes en ruine, facilitant à la fois les déplacements et la cartographie de la zone"
 lv_apa_expedition_old_map_title: "[first.GetShortUIName|U] a trouvé une vieille carte correspondant au terrain de la zone, ce qui vient en aide à votre expédition"
 lv_apa_expedition_optimal_conditions_title: "[first.GetShortUIName|U] a jugé les conditions optimales pour l'expédition"


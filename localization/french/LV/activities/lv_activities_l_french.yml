l_french:
  # Tournament
  activity_tournament_province_lv_great_arena_of_valyria_02_desc:0 "#P +++ $building_type_great_arena_of_valyria_02$#!\n"

  # Expedition
  lv_activity_expedition:0 "Expédition"
  lv_activity_expedition_host_an_a:0 "une"
  lv_activity_expedition_desc:0 "S'aventurer au-delà des terres connues, c'est flirter avec la fortune comme avec la ruine. Les expéditions promettent la découverte, qu'il s'agisse de reliques perdues enfouies dans des ruines oubliées, ou de terres fertiles n'attendant que la main du colon.\n\nLes expéditions sont menées par un commandant choisi, que ce soit vous-même ou un agent de confiance, et leur succès dépend de la préparation, du talent et d'une part de chance. Ce qui nous attend demeure incertain... mais la récompense l'est tout autant."
  lv_activity_expedition_host_desc:0 "$BULLET_WITH_TAB$Peut octroyer des [artifacts|E]\n$BULLET_WITH_TAB$Peut octroyer du [prestige_i] [prestige|E]\n$BULLET_WITH_TAB$Peut octroyer de la [legitimacy_i] [legitimacy|E]"
  lv_activity_expedition_selection_tooltip:0 "Financez une expédition pour découvrir des trésors perdus ou repérer des terres propices à une future colonisation.\n\nRécompenses Anticipées :\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]"

  expedition_type_valyria:0 "Valyria"
  expedition_type_valyria_desc:0 "La Péninsule Valyrienne est une terre de mystère et de danger, où les ruines des autrefois glorieuses Possessions Valyriennes gisent dans l'attente.\n\nCette terre regorge de créatures hostiles et de terrains traîtres, et l'expédition devra être bien préparée pour survivre."
  expedition_type_rhoyne:0 "La Rhoyne"
  expedition_type_rhoyne_desc:0 "La Rhoyne est un fleuve puissant qui s'écoule au cœur de Volantis et à travers les ruines de l'antique civilisation rhoynare.\n\nL'expédition devra naviguer sur les courants traîtres du fleuve et éviter les dangers qui se tapissent dans ses profondeurs."
  expedition_type_asshai:0 "Asshaï"
  expedition_type_asshai_desc:0 "Asshaï est une cité mystérieuse et antique située sur les rivages des Contrées de l'Ombre.\n\nL'expédition devra naviguer dans les sombres ruelles de la cité et éviter les dangers qui se tapissent dans ses ombres."

  activity_expedition_province_desc:0 "Vous planifierez et financerez une expédition vers [ROOT.Province.GetName]\nDe nombreux facteurs influenceront les résultats"

  hunt_treasure_intent:0 "Chasse au Trésor"
  hunt_treasure_intent_desc:0 "Recherchez des artefacts perdus et des trésors enfouis dans les ruines."
  chart_area_intent:0 "Cartographier la Zone"
  chart_area_intent_desc:0 "Cartographiez le terrain et identifiez les sites potentiels de colonisation."

  expedition_preparation:0 "Préparation de l'Expédition"
  expedition_preparation_minimal:0 "Le Strict Nécessaire"
  expedition_preparation_minimal_desc:0 "Une expédition légère, pauvre en équipement et en deniers. La fortune sourit aux audacieux, ou aux chanceux."
  expedition_preparation_standard:0 "Provisions Adéquates"
  expedition_preparation_standard_desc:0 "Bien approvisionnée en cartes, vivres et main-d'œuvre engagée. L'expédition est prête pour la plupart des défis à venir."
  expedition_preparation_heavy:0 "Expédition Pleinement Équipée"
  expedition_preparation_heavy_desc:0 "Aucune dépense n'a été épargnée : guides chevronnés, chariots fortifiés et spécialistes en chaque domaine. Si le succès peut s'acheter, voici comment procéder."

  expedition_main_phase:0 "L'Expédition Proprement Dite"
  expedition_main_phase_desc: "Les jours se muent en semaines tandis que l'expédition trace des routes oubliées, explore des ruines et affronte l'inconnu. Chaque campement éclairé par le feu et chaque écho lointain peut apporter fortune, ou folie."

  lv_apa_expedition_monument_title: "[first.GetShortUIName|U] a découvert un monument [second.GetCulture.GetCollectiveNoun] à moitié enseveli"
  lv_apa_expedition_chart_terrain_title: "[first.GetShortUIName|U] a accompli des progrès remarquables dans la cartographie du terrain de [second.GetName]"
  lv_apa_expedition_ruined_roads_title: "[first.GetShortUIName|U] a découvert d'anciennes routes en ruines, facilitant le voyage et la cartographie de la zone"
  lv_apa_expedition_old_map_title: "[first.GetShortUIName|U] a trouvé une vieille carte correspondant au terrain de la région, aidant votre expédition"
  lv_apa_expedition_optimal_conditions_title: "[first.GetShortUIName|U] a constaté que les conditions de l'expédition étaient optimales"

  lv_apa_expedition_mired_in_mud_title: "Une tempête transforme les routes avoisinantes en bourbier, paralysant toute l'expédition"
  lv_apa_expedition_missing_supplies_title: "De la nourriture et des outils ont disparu durant la nuit"
  lv_apa_expedition_heated_argument_title: "Une querelle éclate concernant les routes à emprunter"
  lv_apa_expedition_frightened_animals_title: "Quelque chose d'invisible a effrayé les animaux [first.GetShortUINamePossessive], les dispersant dans les ténèbres"

  lv_apa_expedition_night_shift_positive_title: "[first.GetShortUIName|U] vous êtes retrouvé à travailler tard aux côtés de [second.GetShortUIName]"
  lv_apa_expedition_night_shift_positive.tt:0 "[first.GetShortUIName|U] s'est bien entendu avec [second.GetShortUIName] durant le tour de garde nocturne, partageant récits et rires qui ont allégé la peine."
  lv_apa_expedition_night_shift_positive.reason: "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] ont apprécié leur compagnie mutuelle durant une expédition."

  lv_apa_expedition_campfire_positive_title: "[first.GetShortUIName|U] et [second.GetShortUIName] ont partagé un feu de camp"
  lv_apa_expedition_campfire_positive.tt:0 "[first.GetShortUIName|U] et [second.GetShortUIName] ont partagé récits et rires autour d'un feu de camp, renforçant leur lien durant l'expédition."
  lv_apa_expedition_campfire_positive.reason: "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] ont partagé un feu de camp durant une expédition."

  lv_apa_expedition_night_shift_negative_title: "[first.GetShortUIName|U] vous êtes retrouvé à travailler tard aux côtés de [second.GetShortUIName]"
  lv_apa_expedition_night_shift_negative.tt:0 "[first.GetShortUIName|U] et [second.GetShortUIName] se sont affrontés durant le tour de garde nocturne, menant à une dispute houleuse qui a empoisonné l'atmosphère."
  lv_apa_expedition_night_shift_negative.reason: "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] se sont affrontés durant une expédition."

  lv_apa_expedition_foul_weather_title: "Le mauvais temps ralentit la progression de l'expédition [first.GetShortUINamePossessive]"

  lv_expedition.tt.positive.tiny:0 "Votre [GetActivityType('lv_activity_expedition').GetName] progresse #P légèrement#!"
  lv_expedition.tt.negative: "La progression de votre [GetActivityType('lv_activity_expedition').GetName] est #N affectée négativement#!"

  activity_window_character_travel_expedition_leader: "Chef d'Expédition\n[Character.GetShortUINameNoTooltip|U]\n[traveling|E] à [Character.GetCurrentLocation.GetName]\n ~[Character.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate.GetStringLong|V]"
  activity_window_character_expedition_leader: "Chef d'Expédition\n[Character.GetShortUINameNoTooltip|U]"


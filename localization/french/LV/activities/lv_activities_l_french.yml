l_french:
  # Tournament
  activity_tournament_province_lv_great_arena_of_valyria_02_desc:0 "#P +++ $building_type_great_arena_of_valyria_02$#!\n"

  # Expedition
  lv_activity_expedition:0 "Expédition"
  lv_activity_expedition_host_an_a:0 "une"
  lv_activity_expedition_desc:0 "S'aventurer au-delà du connu, c'est courtiser à la fois la fortune et la ruine. Les expéditions promettent la découverte — qu'il s'agisse de reliques perdues enfouies dans des ruines oubliées, ou de terres fertiles attendant la main de la colonisation.\n\nLes expéditions sont menées par un commandant choisi, que ce soit vous-même ou un agent de confiance, et leur succès dépend de la préparation, du savoir-faire et d'une part de chance. Ce qui nous attend demeure incertain... mais la récompense l'est tout autant."
  lv_activity_expedition_host_desc:0 "$BULLET_WITH_TAB$Peut gagner des [artifacts|E]\n$BULLET_WITH_TAB$Peut gagner du [prestige_i] [prestige|E]\n$BULLET_WITH_TAB$Peut gagner de la [legitimacy_i] [legitimacy|E]"
  lv_activity_expedition_selection_tooltip:0 "Financez une expédition pour découvrir des trésors perdus ou explorer des terres en vue d'une future colonisation.\n\nRécompenses anticipées :\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]"

  expedition_type_valyria:0 "Valyria"
  expedition_type_valyria_desc:0 "La Péninsule Valyrienne est une terre de mystère et de danger, où gisent les ruines de l'autrefois glorieuse Possession Franche de Valyria.\n\nLa terre grouille de créatures hostiles et de terrains perfides, et l'expédition devra être parfaitement préparée pour survivre aux périls qui l'attendent."
  expedition_type_rhoyne:0 "La Rhoyne"
  expedition_type_rhoyne_desc:0 "La Rhoyne est un fleuve puissant qui traverse le cœur de Volantis et les ruines des anciens Rhoynars.\n\nL'expédition devra naviguer les courants traîtres du fleuve et éviter les dangers tapis dans ses profondeurs obscures."
  expedition_type_asshai:0 "Asshaï"
  expedition_type_asshai_desc:0 "Asshaï est une cité mystérieuse et antique située sur les rivages des Contrées de l'Ombre.\n\nL'expédition devra se frayer un chemin dans les ruelles sombres de la cité et éviter les dangers qui rôdent dans ses ombres menaçantes."

  activity_expedition_province_desc:0 "Vous allez planifier et financer une expédition vers [ROOT.Province.GetName]\nDe nombreux facteurs influenceront les résultats"

  hunt_treasure_intent:0 "Chasse au Trésor"
  hunt_treasure_intent_desc:0 "Fouiller les ruines à la recherche d'artefacts perdus et de trésors anciens."
  chart_area_intent:0 "Cartographier la Région"
  chart_area_intent_desc:0 "Dresser la carte du terrain et identifier les sites potentiels de colonisation."

  expedition_preparation:0 "Préparation de l'Expédition"
  expedition_preparation_minimal:0 "Nécessaire de Base"
  expedition_preparation_minimal_desc:0 "Une expédition légère, pauvre en équipement et en pièces d'or. La fortune sourit aux audacieux — ou aux chanceux."
  expedition_preparation_standard:0 "Provisions Appropriées"
  expedition_preparation_standard_desc:0 "Bien pourvue en cartes, vivres et hommes de main. L'expédition est prête à affronter la plupart des défis à venir."
  expedition_preparation_heavy:0 "Expédition Parfaitement Équipée"
  expedition_preparation_heavy_desc:0 "Aucune dépense n'a été épargnée — guides expérimentés, chariots fortifiés et spécialistes en tous métiers. Si le succès peut s'acheter, voici comment procéder."

  expedition_main_phase:0 "Expédition Proprement Dite"
  expedition_main_phase_desc: "Les jours se transforment en semaines tandis que l'expédition trace des routes oubliées, explore les ruines et affronte l'inconnu. Chaque campement éclairé au feu et chaque écho lointain pourrait apporter la fortune — ou la folie."

  lv_apa_expedition_monument_title: "[first.GetShortUIName|U] a découvert un monument [second.GetCulture.GetCollectiveNoun] à demi enseveli"
  lv_apa_expedition_chart_terrain_title: "[first.GetShortUIName|U] a fait des progrès impressionnants dans la cartographie du terrain de [second.GetName]"
  lv_apa_expedition_ruined_roads_title: "[first.GetShortUIName|U] a découvert quelques routes en ruines, facilitant les déplacements et la cartographie de la région"
  lv_apa_expedition_old_map_title: "[first.GetShortUIName|U] a trouvé une ancienne carte correspondant au terrain de la région, aidant votre expédition"
  lv_apa_expedition_optimal_conditions_title: "[first.GetShortUIName|U] a trouvé que les conditions pour l'expédition étaient optimales"

  lv_apa_expedition_mired_in_mud_title: "Une tempête transforme les routes avoisinantes en bourbier, paralysant toute l'expédition"
  lv_apa_expedition_missing_supplies_title: "De la nourriture et des outils ont disparu pendant la nuit"
  lv_apa_expedition_heated_argument_title: "Une dispute éclate concernant les routes à emprunter"
  lv_apa_expedition_frightened_animals_title: "Quelque chose d'invisible a affolé les animaux de [first.GetShortUINamePossessive], les dispersant dans l'obscurité"

  lv_apa_expedition_night_shift_positive_title: "[first.GetShortUIName|U] s'est retrouvé à travailler tard aux côtés de [second.GetShortUIName]"
  lv_apa_expedition_night_shift_positive.tt:0 "[first.GetShortUIName|U] s'est bien entendu avec [second.GetShortUIName] durant le quart de nuit, partageant histoires et rires qui ont allégé la peine."
  lv_apa_expedition_night_shift_positive.reason: "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] ont apprécié la compagnie l'un de l'autre durant une expédition."

  lv_apa_expedition_campfire_positive_title: "[first.GetShortUIName|U] et [second.GetShortUIName] ont partagé un feu de camp"
  lv_apa_expedition_campfire_positive.tt:0 "[first.GetShortUIName|U] et [second.GetShortUIName] ont partagé histoires et rires autour d'un feu de camp, renforçant leurs liens durant l'expédition."
  lv_apa_expedition_campfire_positive.reason: "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] ont partagé un feu de camp durant une expédition."

  lv_apa_expedition_night_shift_negative_title: "[first.GetShortUIName|U] s'est retrouvé à travailler tard aux côtés de [second.GetShortUIName]"
  lv_apa_expedition_night_shift_negative.tt:0 "[first.GetShortUIName|U] et [second.GetShortUIName] se sont affrontés durant le quart de nuit, menant à une dispute enflammée qui a empoisonné l'atmosphère."
  lv_apa_expedition_night_shift_negative.reason: "[CHARACTER.GetShortUIName|U] et [TARGET_CHARACTER.GetShortUIName] se sont affrontés durant une expédition."

  lv_apa_expedition_foul_weather_title: "Un temps épouvantable ralentit les progrès de l'expédition de [first.GetShortUINamePossessive]"

  lv_expedition.tt.positive.tiny:0 "Votre [GetActivityType('lv_activity_expedition').GetName] fait #P de légers progrès#!"
  lv_expedition.tt.negative: "Les progrès de votre [GetActivityType('lv_activity_expedition').GetName] sont #N négativement affectés#!"

  activity_window_character_travel_expedition_leader: "Chef d'Expédition\n[Character.GetShortUINameNoTooltip|U]\n[traveling|E] dans [Character.GetCurrentLocation.GetName]\n ~[Character.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate.GetStringLong|V]"

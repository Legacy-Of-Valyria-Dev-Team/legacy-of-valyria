l_french:
  # Incompatibility Window
  INCOMPATIBILITY_WINDOW_HEADER:0 "Conflits de Mods Legacy of Valyria"
  INCOMPATIBILITY_WINDOW_TEXT:0 "Des sous-mods conflictuels ont été détectés dans votre ordre de chargement et affecteront les mécaniques suivantes de Legacy of Valyria :"

  INCOMPATIBILITY_WINDOW_COLONISATION_TYPE:0 "Colonies et Restauration des Ruines"
  INCOMPATIBILITY_WINDOW_COLONISATION_TEXT:0 "$INCOMPATIBILITY_WINDOW_COLONISATION_TEXT_BODY$\n\n$INCOMPATIBILITY_WINDOW_COLONISATION_TEXT_FILES$"
  INCOMPATIBILITY_WINDOW_COLONISATION_TEXT_BODY:0 "L'un de vos mods empêche les mécaniques de restauration des ruines et de colonies de Legacy of Valyria de fonctionner correctement. Veuillez désactiver tous les mods qui modifient directement l'interface des comtés, par exemple les mods qui étendent les emplacements de bâtiments ou ajoutent de nouveaux boutons à l'interface comté/domaine."
  INCOMPATIBILITY_WINDOW_COLONISATION_TEXT_FILES:0 "Fichiers affectés :\n#high $EFFECT_LIST_BULLET$ gui/window_county_view.gui#!"

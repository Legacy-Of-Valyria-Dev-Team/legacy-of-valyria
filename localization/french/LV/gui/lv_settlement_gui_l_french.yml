l_french:
  lv_ruins_reconstruct_tooltip:0 "Ce domaine gît en ruines, mais nous pouvons le restaurer en une colonie autonome et prospère. Vous entamerez les préparatifs d'une expédition pour reconquérir ces terres.\n"
  lv_ruins_reconstruct_tooltip_cost:0 "Coûts estimés :"
  lv_ruins_reconstruct_tooltip_cost_value:0 "@gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost')|0]"
  lv_ruins_reconstruct_tooltip_cost_insufficient:0 "[AddLocalizationIf( Not(GetScriptedGui('lv_ruin_can_afford').IsShown( GuiScope.SetRoot( GetPlayer.MakeScope ).End)), 'lv_ruins_reconstruct_tooltip_cost_insufficient_text' )]"
  lv_ruins_reconstruct_tooltip_cost_insufficient_text:0 "\n#X @warning_icon! Vous ne disposez #bold pas#! de @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_difference')|0]#!"

  # Cost Breakdown
  lv_ruins_reconstruct_tooltip_breakdown_title:0 "Restauration des Ruines"
  lv_ruins_reconstruct_tooltip_breakdown_subheading:0 "Détail des Coûts"

  # Settlement Cost and Breakdown
  lv_ruins_reconstruct_tooltip_breakdown_settlement:0 "Taille et État des Ruines #V @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_settlement_base:0 "$BULLET$[HoldingView.GetProvince.Custom('LV_RuinsReconstructTooltip_RuinType')] : #N [GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement_base')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_settlement_valyrian_architecture:0 "$BULLET$La culture utilise l'architecture valyrienne : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement_valyrian_architecture')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_settlement_hard_working:0 "$BULLET$La culture possède la tradition $tradition_hard_working_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement_hard_working')|0]#!"

  # Expedition Cost and Breakdown
  lv_ruins_reconstruct_tooltip_breakdown_expedition:0 "Préparation et Logistique #V @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition')|0]#! #weak (Minimum : 30)#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_base:0 "$BULLET$Coût de l'Expédition : #N [GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_base')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_isolationist:0 "$BULLET$La culture possède la tradition $tradition_isolationist_name$ : #N +[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_isolationist')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_republican_legacy:0 "$BULLET$La culture possède la tradition $tradition_republican_legacy_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_republican_legacy')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_valyrian:0 "$BULLET$La culture possède la tradition $tradition_agot_high_valyrian_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_valyrian')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_north_valyrian_1:0 "$BULLET$La culture possède la tradition $lv_tradition_north_valyrian_1_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_north_valyrian_1')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_north_valyrian_2:0 "$BULLET$La culture possède la tradition $lv_tradition_north_valyrian_2_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_north_valyrian_2')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_doom:0 "$BULLET$La culture possède la tradition $tradition_agot_doom_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_doom')|0]#!"

  lv_begin_expedition:0 "Lancer l'Expédition"
  lv_begin_expedition_desc:0 "Nous disposons des ressources et de la main-d'œuvre nécessaires pour organiser une expédition visant à reconquérir cette colonie sur les terres sauvages."
  lv_begin_expedition_effect_tooltip:0 "Vous entamerez les préparatifs d'une expédition pour restaurer cette colonie. Cela coûtera @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost')|0] et nécessitera un certain temps de préparation."

  lv_abandon_settlement:0 "Abandonner la Colonie"
  lv_abandon_settlement_desc:0 "Cesser tous les efforts de restauration de cette colonie, abandonnant ces ruines à la nature sauvage."

  lv_upgrade_settlement:0 "Établir un Domaine"
  lv_upgrade_settlement_desc:0 "Nos efforts dans cette province ont porté leurs fruits : une colonie prospère et autonome s'y est établie. Il serait désormais judicieux d'y fonder un domaine permanent."

  HAS_SETTLEMENT_BLOCKERS:0 "Des obstacles à la colonisation doivent être présents dans la colonie."
  HAS_NO_SETTLEMENT_BLOCKERS:0 "Aucun obstacle à la colonisation ne doit être présent dans la colonie."

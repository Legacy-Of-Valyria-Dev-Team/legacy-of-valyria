l_french:
 lv_begin_expedition_cost:0 "Ceci coûtera #V @gold_icon![target.MakeScope.ScriptValue('lv_expedition_cost')|0]#! rien que pour établir initialement la colonie. Attendez-vous à des coûts significativement plus élevés à mesure que l'on s'éloigne de nos possessions et colonies actuelles."

 lv_begin_expedition_desc_lands_of_the_long_summer_wilderness:0 "#BOL Terres du Long Été#!\n\nCes terres font partie des Terres du Long Été, directement au nord de Valyria. Bien qu'elles n'aient pas subi toute la fureur cataclysmique qui s'abattit sur Valyria, le Fléau n'a pas non plus épargné ces terres. Tout aussi maudit que le cœur de Valyria lui-même, ceux qui traversèrent jadis ces terres ont depuis longtemps péri ou subi des sorts pires que la mort.\n\nNéanmoins, nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de la coloniser, si nous osons tenter l'aventure."
 lv_begin_expedition_desc_valyria_ruin:0 "#BOL Ruines de Valyria#!\n\nAu sein de ces ruines vivaient jadis les lords dragons de Valyria, ainsi que leurs grands trésors et leurs arts sorciers. Certains disent que le Fléau de Valyria fut l'œuvre des dieux en punition des péchés des Valyriens dans les arts obscurs, tandis que d'autres spéculent que les Valyriens perdirent le contrôle des Quatorze Flammes. Quoi qu'il en soit, le Fléau brisa la terre, et ces cités jadis grandioses gisent désormais en ruine — maudites et hantées pour l'éternité.\n\nÀ ce jour, elle demeure cendreuse et fumante, ses tours décapitées brisées et déchirées. Ceux qui traversèrent jadis ces terres ont depuis longtemps péri ou subi des sorts pires que la mort.\n\nNéanmoins, nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de la restaurer, si nous osons tenter l'aventure."
 lv_begin_expedition_desc_valyria_wilderness:0 "#BOL Valyria#!\n\nCes terres font partie des ruines de Valyria elle-même, là où le Fléau frappa de toute sa force. Jadis cœur du plus puissant empire de l'histoire récente, elle n'est désormais plus qu'une terre maudite abritant les horreurs du Fléau.\n\nÀ ce jour, elle demeure cendreuse et fumante, son sol même encore marqué par les événements cataclysmiques qui détruisirent les Possessions. Ceux qui traversèrent jadis ces terres ont depuis longtemps péri ou subi des sorts pires que la mort.\n\nNéanmoins, nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de la coloniser, si nous osons tenter l'aventure."
 lv_begin_expedition_desc_sothoryos_yeen:0 "#BOL Yeen#!\n\n#F « Une cité si maléfique que même la jungle refuse d'y pénétrer »\n— paroles présumées de la Princesse Nymeria en posant les yeux sur Yeen#!\n\nVoici la cité en ruine de Yeen, l'un des plus grands mystères de Sothoryos. Située le long de la rivière Zamoyos, au plus profond des jungles de Sothoryos, elle est bâtie entièrement de pierre noire huileuse et demeure une ruine désolée depuis des milliers d'années. Malgré cela, même la jungle qui l'entoure l'a à peine touchée.\n\nOn dit que chaque tentative de la rebâtir ou de la recoloniser s'est achevée dans l'horreur. Néanmoins, nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de la restaurer."
 lv_begin_expedition_desc_sothoryos_zamettar:0 "#BOL Zamettar#!\n\nÀ l'embouchure de la rivière Zamoyos se trouve la colonie en ruine de Zamettar. Jadis cité fortifiée érigée par le Vieil Empire de Ghis, elle fut par la suite conquise par les lords dragons des Possessions Valyriennes avant d'être abandonnée à la jungle.\n\nMille ans plus tard, durant la fuite des Rhoynars, la Princesse Nymeria et son peuple auraient, dit-on, colonisé Zamettar avant de finalement l'abandonner de nouveau après avoir trouvé l'antique cité de Yeen, en amont, soudainement désertée.\n\nSeuls des murs en ruine et la jungle envahissante subsistent à présent, mais nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de la restaurer."
 lv_begin_expedition_desc_sothoryos_gorosh:0 "#BOL Gorosh#!\n\nL'avant-poste en ruine de Gorosh fut une colonie pénitentiaire du Vieil Empire de Ghis, situé le long de la côte orientale de Sothoryos, sur la Pointe de la Guivre. On disait que les colonies plantées à Sothoryos étaient vouées à l'échec, et Gorosh ne fit pas exception. L'avant-poste en ruine a depuis longtemps été repris par la jungle, pas même une génération après sa fondation, ayant passé plus de temps abandonné qu'habité.\n\nNéanmoins, nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de le restaurer."
 lv_begin_expedition_desc_sothoryos_wilderness:0 "#BOL Sothoryos#!\n\nCette zone fait partie des étendues sauvages de Sothoryos même, l'un des trois continents connus du monde connu. Les jungles de Sothoryos comptent parmi les lieux les plus dangereux du monde connu, abritant des maladies et des créatures que l'on ne trouve nulle part ailleurs.\n\nNéanmoins, nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de la coloniser, si nous osons tenter l'aventure."
 lv_begin_expedition_desc_ruin:0 "Cette colonie gît en ruine, mais nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de la restaurer."
 lv_begin_expedition_desc_wilderness:0 "Cette zone est sauvage et indomptée, mais nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de la coloniser."
 lv_begin_expedition_desc_fallback:0 "Nous disposons des ressources et de la main-d'œuvre nécessaires pour commencer à planifier une expédition afin de reconquérir cette colonie."

 HAS_SETTLEMENT_BLOCKERS:0 "Il doit y avoir des blocages de colonisation présents dans la colonie."
 HAS_NO_SETTLEMENT_BLOCKERS:0 "Il ne doit y avoir aucun blocage de colonisation présent dans la colonie."

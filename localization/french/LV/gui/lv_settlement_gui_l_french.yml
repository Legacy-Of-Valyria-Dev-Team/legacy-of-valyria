l_french:
  lv_ruins_reconstruct_tooltip:0 "Cette possession est en ruines, mais nous pouvons la restaurer en une colonie autonome. Vous commencerez à planifier une expédition pour reconquérir ces terres.\n"
  lv_ruins_reconstruct_tooltip_cost:0 "Coûts estimés :"
  lv_ruins_reconstruct_tooltip_cost_value:0 "@gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost')|0]"
  lv_ruins_reconstruct_tooltip_cost_insufficient:0 "[AddLocalizationIf( Not(GetScriptedGui('lv_ruin_can_afford').IsShown( GuiScope.SetRoot( GetPlayer.MakeScope ).End)), 'lv_ruins_reconstruct_tooltip_cost_insufficient_text' )]"
  lv_ruins_reconstruct_tooltip_cost_insufficient_text:0 "\n#X @warning_icon! Vous n'avez #bold pas#! @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_difference')|0] de plus#!"

  # Cost Breakdown
  lv_ruins_reconstruct_tooltip_breakdown_title:0 "Restauration des Ruines"
  lv_ruins_reconstruct_tooltip_breakdown_subheading:0 "Détail des Coûts"

  # Settlement Cost and Breakdown
  lv_ruins_reconstruct_tooltip_breakdown_settlement:0 "Taille des Ruines et Progression #V @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_settlement_base:0 "$BULLET$[HoldingView.GetProvince.Custom('LV_RuinsReconstructTooltip_RuinType')] : #N [GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement_base')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_settlement_valyrian_architecture:0 "$BULLET$La culture utilise l'architecture valyrienne : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement_valyrian_architecture')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_settlement_hard_working:0 "$BULLET$La culture possède la tradition $tradition_hard_working_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement_hard_working')|0]#!"

  # Expedition Cost and Breakdown
  lv_ruins_reconstruct_tooltip_breakdown_expedition:0 "Préparation et Logistique #V @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition')|0]#! #weak (Minimum : 30)#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_base:0 "$BULLET$Coût d'expédition : #N [GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_base')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_isolationist:0 "$BULLET$La culture possède la tradition $tradition_isolationist_name$ : #N +[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_isolationist')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_republican_legacy:0 "$BULLET$La culture possède la tradition $tradition_republican_legacy_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_republican_legacy')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_valyrian:0 "$BULLET$La culture possède la tradition $agot_tradition_valyrian_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_valyrian')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_north_valyrian_1:0 "$BULLET$La culture possède la tradition $agot_tradition_north_valyrian_1_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_north_valyrian_1')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_north_valyrian_2:0 "$BULLET$La culture possède la tradition $agot_tradition_north_valyrian_2_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_north_valyrian_2')|0]#!"
  lv_ruins_reconstruct_tooltip_breakdown_expedition_doom:0 "$BULLET$La culture possède la tradition $agot_tradition_doom_name$ : #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_doom')|0]#!"

  lv_abandon_settlement:0 "Abandonner l'Établissement"
  lv_abandon_settlement_desc:0 "Abandonner tous les efforts de restauration de cet établissement, rendant les ruines à la nature sauvage."

  lv_upgrade_settlement:0 "Établir une Possession"
  lv_upgrade_settlement_desc:0 "Nos efforts dans cette province nous ont donné une colonie importante et autonome. À ce stade, il ne serait pas incorrect d'établir une possession permanente ici."

  HAS_SETTLEMENT_BLOCKERS:0 "Il doit y avoir des obstacles d'établissement présents dans la colonie."
  HAS_NO_SETTLEMENT_BLOCKERS:0 "Il ne doit y avoir aucun obstacle d'établissement présent dans la colonie."
  
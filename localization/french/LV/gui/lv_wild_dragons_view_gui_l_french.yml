l_french:
 # Incompatibility Window
 LV_VIEW_WILD_DRAGONS_TT:0 "#I Voir tous les dragons et bêtes sauvages de cette province#!"
 lv_wild_dragons_view_name:0 "[Character.GetUINameNotMeNoTooltip] [Character.Custom('LV_WildDragonsView_Name')]\n$lv_wild_dragons_view_attributes$"
 lv_wild_dragons_view_name_firewyrm_enraged:0 "#weak (Veur de Feu Enragé)#!"
 lv_wild_dragons_view_name_firewyrm_agitated:0 "#weak (Veur de Feu Agité)#!"
 lv_wild_dragons_view_name_firewyrm:0 "#weak (Veur de Feu)#!"
 lv_wild_dragons_view_name_dragon:0 "#weak (Dragon)#!"
 lv_wild_dragons_view_attributes:0 "$lv_wild_dragons_view_attributes_dragon_size$ | $lv_wild_dragons_view_attributes_combat_effectiveness$ | $lv_wild_dragons_view_attributes_draconic_dread$ | $lv_wild_dragons_view_attributes_temperament$"
 lv_wild_dragons_view_attributes_dragon_size:0 "@dragon_size_icon! [Character.MakeScope.ScriptValue('dragon_size')|0]"
 lv_wild_dragons_view_attributes_combat_effectiveness:0 "@dragon_combat_effectiveness_icon! [Character.MakeScope.ScriptValue('dragon_combat_effectiveness')|0]"
 lv_wild_dragons_view_attributes_draconic_dread:0 "@draconic_dread_icon! [Character.MakeScope.ScriptValue('draconic_dread')|0]"
 lv_wild_dragons_view_attributes_temperament:0 "@temperament_icon! [Character.MakeScope.ScriptValue('temperament')|0]"
building_type_valyria_mines_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_01_desc:0 "Ces mines s'enfoncent dans les profondeurs des Quatorze Flammes, gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur terrestre. Les minéraux précieux abondent en quantité égale aux dangers mortels, rendant la vie de ceux qui s'y trouvent à la fois profitable et brève."
# building_type_valyria_mines_01_desc:0 "L'abîme apparemment sans fin des mines de l'Ancienne Valyria sous les Quatorze Flammes recèle des richesses inouïes. Malheureusement, la prolifération de vouivres de feu et diverses monstruosités innommables empêche actuellement leur extraction."
# building_type_valyria_mines_02:0 ""
# building_type_valyria_mines_02_desc:0 ""
# building_type_valyria_mines_03:0 "Mines des Quatorze Flammes"
# building_type_valyria_mines_03_desc:0 "Ces mines s'enfoncent dans les profondeurs des Quatorze Flammes, gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur terrestre. Les minéraux précieux abondent en quantité égale aux dangers mortels, rendant la vie de ceux qui s'y trouvent à la fois profitable et brève."

building_valyria_mines_01:0 "Mine Volcanique Infestée de Vouivres"
building_valyria_mines_01_desc:0 "Les mines qui sondaient jadis les profondeurs de ce volcan gisent vides, ce qui reste de leur charpentage détruit par les vouivres de feu et autres bêtes. Néanmoins, leurs richesses pourraient encore être extraites."
building_valyria_mines_02:0 "Veines Calcinées"
building_valyria_mines_02_desc:0 "Les tunnels les plus profonds demeurent traîtres, mais des mineurs déterminés ont commencé à extraire du minerai des sections les moins volatiles. Des puits renforcés produisent maintenant des traces d'or et de fer, bien que la présence de vouivres de feu persistantes maintienne les opérations prudentes et coûteuses."
building_valyria_mines_03:0 "Mine Volcanique"
#building_valyria_mines_03_desc:0 "Cette mine périlleuse est renommée pour ses riches veines d'or et d'argent, entremêlées de gisements de fer. L'intense activité géothermique a également créé des poches de pierres précieuses, incluant rubis et saphirs, forgés dans le creuset en fusion de la terre."
building_valyria_mines_03_desc:0 "Cette mine plonge profondément dans les gouffres du volcan, où des milliers peinent dans une chaleur étouffante, leurs vies consumées à extraire les richesses terrestres. De riches veines d'or et d'argent serpentent à travers la pierre volcanique, entremêlées de gisements de fer. L'intense activité géothermique a également forgé des poches de rubis et saphirs, leur beauté formant un contraste cruel avec les dangers mortels qui fauchent les mineurs en égale mesure."

building_type_valyria_mines_dormant_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_dormant_01_desc:0 "Autrefois source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'endormit. La terre mouvante a laissé certains passages instables, et d'aucuns prétendent que les sons de Vouivres de Feu résonnent encore dans les galeries."
building_valyria_mines_dormant_01:0 "Mine Scellée"
building_valyria_mines_dormant_01_desc:0 "Autrefois source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'endormit. La terre mouvante a laissé certains passages instables, et d'aucuns prétendent que les sons de Vouivres de Feu résonnent encore dans les galeries."
building_valyria_mines_dormant_02:0 "Mine Exhumée"
building_valyria_mines_dormant_02_desc:0 "Les efforts de récupération ont commencé, tandis que les prospecteurs retournent dans les tunnels oubliés en quête de richesses. Des renforts ont été érigés contre la pierre affaiblie par le temps, et les premiers chariots de fer et d'or ont recommencé à émerger des profondeurs."
building_valyria_mines_dormant_03:0 "Mine Volcanique Dormante"
building_valyria_mines_dormant_03_desc:0 "Bien que le feu du volcan se soit depuis longtemps éteint, ses richesses demeurent immenses, n'attendant que ceux prêts à les revendiquer. Des dangers persistent dans les tunnels plus profonds où de riches veines d'argent, de fer et d'or sont extraites."


building_type_zz_valyria_steel_forge_03_desc:0 "Les maîtres d'ateliers jadis indépendants forment désormais une association regroupant tous les forgerons d'acier de la ville. Des foules de clients et de marchands négocient dans leurs marchés, créant une demande insatiable pour toujours plus d'acier."

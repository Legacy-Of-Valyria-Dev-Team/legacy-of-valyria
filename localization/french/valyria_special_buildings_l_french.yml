building_type_zz_valyria_iron_mine_03:0 "Complexe Minier de Fer"
building_type_zz_valyria_iron_mine_03_desc:0 "Un complexe tentaculaire de puits, de terrils et de fourneaux, entouré par les villages des déshérités qui vivront et mourront dans et autour de ses gouffres béants."

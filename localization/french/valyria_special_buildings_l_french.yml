building_type_tower_of_lyria_01:0 "La Tour de Lyria"
building_type_tower_of_lyria_01_desc:0 "La tour d'un ancien mage des [valyrian_freehold_short|E] disparus. Nul ne comprend vraiment comment elle a pu perdurer, mais des magies des plus ésotériques se tordent et s'écoulent dans cette tour."
building_tower_of_lyria_01:0 "La Tour de Lyria"
building_tower_of_lyria_01_desc:0 "Un haut point focal de pouvoir mystique. On ignore pourquoi, mais les énergies magiques deviennent considérablement plus accessibles à celui qui peut conceptuellement revendiquer cette tour comme sienne."

building_type_tower_of_lyria_02:0 "La Tour de Lyria"
building_type_tower_of_lyria_02_desc:0 "La tour d'un ancien mage des [valyrian_freehold_short|E] disparus. Nul ne comprend vraiment comment elle a pu perdurer, mais des magies des plus ésotériques se tordent et s'écoulent dans cette tour."

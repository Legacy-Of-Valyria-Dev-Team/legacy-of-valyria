building_type_tower_of_lyria_01:0 "La Tour de Lyria"
building_type_tower_of_lyria_01_desc:0 "La tour d'un ancien mage du défunt [valyrian_freehold_short|E]. Nul ne comprend vraiment comment elle a pu subsister, mais des magies des plus obscures ondulent et se tordent en cette tour."
building_tower_of_lyria_01:0 "La Tour de Lyria"
building_tower_of_lyria_01_desc:0 "Un haut point focal de puissance mystique. Nul ne sait pourquoi, mais les énergies magiques deviennent considérablement plus accessibles à celui qui peut conceptuellement revendiquer cette tour comme sienne."

building_type_tower_of_lyria_02:0 "La Tour de Lyria"
building_type_tower_of_lyria_02_desc:0 "La tour d'un ancien mage du défunt [valyrian_freehold_short|E]. Nul ne comprend vraiment comment elle a pu subsister, mais des magies des plus obscures ondulent et se tordent en cette tour."

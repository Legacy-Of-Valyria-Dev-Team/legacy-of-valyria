building_type_zz_valyria_iron_mine_02:0 "Mine de Fer"
building_type_zz_valyria_iron_mine_02_desc:0 "Une opération minière de fer substantielle, comprenant plusieurs puits renforcés avec l'équivalent d'une demi-forêt d'étais. Les travailleurs des villages voisins peinent jour et nuit dans les nombreux tunnels de la mine."

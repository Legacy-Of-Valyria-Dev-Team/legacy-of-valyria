tournament_cost_discount_cv_arena:0 "La Grande Arène de Valyria est quasi perpétuelle dans ses activités, et point ne manquent personnel ni approvisionnements pour en assurer le fonctionnement. Leur fourniture est désormais routinière et avantageuse."
activity_tournament_province_cv_the_great_arena_of_valyria:0 "Tant que la Grande Arène demeurera, Valyria demeurera ; lorsque la Grande Arène tombera, le monde entier s'effondrera avec elle."


tournament_cost_discount_cv_arena:0 "La Grande Arène de Valyria est presque perpétuelle dans ses activités, et il n'y a pas de pénurie de personnel et de fournitures à utiliser. Leur approvisionnement est désormais à la fois routinier et économique."
activity_tournament_province_cv_the_great_arena_of_valyria:0 "Tant que la Grande Arène se dressera, Valyria se tiendra ; quand la Grande Arène tombera, le monde entier s'effondrera."


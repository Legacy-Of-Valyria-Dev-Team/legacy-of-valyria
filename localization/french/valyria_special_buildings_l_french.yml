building_type_zz_valyria_steel_forge_02:0 "Ateliers de Forge d'Acier"
building_type_zz_valyria_steel_forge_02_desc:0 "Les artisans indépendants ont cédé la place à des ateliers de plus grande envergure, satisfaisant aux besoins en acier forgé tant de la cité que de ses terres environnantes, alimentant commerce et guerres avec une production accrue."

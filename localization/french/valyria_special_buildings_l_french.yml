building_type_tower_of_lyria_01:0 "La Tour de Lyria"
building_type_tower_of_lyria_01_desc:0 "La tour d'un mage antique des [valyrian_freehold_short|E] perdues. Nul ne comprend vraiment comment elle a pu subsister, mais des magies des plus occultes se courbent et ondulent dans cette tour mystérieuse."
building_tower_of_lyria_01:0 "La Tour de Lyria"
building_tower_of_lyria_01_desc:0 "Un haut foyer de puissance mystique. Nul ne sait pourquoi, mais les énergies de la magie deviennent considérablement plus accessibles à celui qui parvient à revendiquer conceptuellement cette tour comme sienne."

building_type_tower_of_lyria_02:0 "La Tour de Lyria"

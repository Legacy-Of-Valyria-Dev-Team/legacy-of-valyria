building_type_valyria_mines_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_01_desc:0 "Ces mines s'enfoncent dans les profondeurs des Quatorze Flammes, gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur tellurique. Les minerais précieux abondent en quantité égale aux périls mortels, rendant la vie de ceux qui y œuvrent à la fois profitable et brève."
building_valyria_mines_01:0 "Mine Volcanique Infestée de Vouivres"
building_valyria_mines_01_desc:0 "Les mines qui sondaient jadis les profondeurs de ce volcan gisent désormais vides, leurs boisages détruits par les vouivres de feu et autres créatures. Néanmoins, leurs richesses pourraient encore être extraites."
building_valyria_mines_02:0 "Filons Calcinés"
building_valyria_mines_02_desc:0 "Les tunnels les plus profonds demeurent périlleux, mais des mineurs déterminés ont commencé à extraire le minerai des sections moins instables. Des puits renforcés livrent désormais des traces d'or et de fer, bien que la présence persistante de vouivres de feu maintienne les opérations prudentes et coûteuses."
building_valyria_mines_03:0 "Mine Volcanique"
#building_valyria_mines_03_desc:0 "This perilous mine is renowned for its rich veins of gold and silver, interspersed with deposits of iron. The intense geothermal activity has also created pockets of valuable gemstones, including rubies and sapphires, forged in the molten crucible of the earth."
building_valyria_mines_03_desc:0 "Cette mine plonge profondément dans les gouffres du volcan, où des milliers peinent dans une chaleur étouffante, leurs vies consumées à extraire les richesses de la terre. De riches filons d'or et d'argent serpentent à travers la roche volcanique, entremêlés de gisements de fer. L'intense activité géothermique a également forgé des poches de rubis et de saphirs, dont la beauté contraste cruellement avec les périls mortels qui fauchent les mineurs en égale mesure."

building_type_valyria_mines_dormant_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_dormant_01_desc:0 "Jadis source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'est tu. Les mouvements de la terre ont rendu certains passages instables ; l'on dit que les sons des Vouivres de Feu résonnent encore dans les galeries."
building_valyria_mines_dormant_01:0 "Mine Scellée"
building_valyria_mines_dormant_01_desc:0 "Jadis source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'est tu. Les mouvements de la terre ont rendu certains passages instables ; l'on dit que les sons des Vouivres de Feu résonnent encore dans les galeries."
building_valyria_mines_dormant_02:0 "Mine Dégagée"
building_valyria_mines_dormant_02_desc:0 "Les efforts de réhabilitation ont commencé, tandis que des prospecteurs retournent dans les tunnels oubliés en quête de richesses. Des renforts ont été érigés contre la pierre affaiblie par le temps, et les premiers chariots de fer et d'or ont recommencé à émerger des profondeurs."
building_valyria_mines_dormant_03:0 "Mine Volcanique Dormante"
building_valyria_mines_dormant_03_desc:0 "Bien que le feu du volcan se soit éteint depuis longtemps, ses richesses demeurent vastes, n'attendant que ceux prêts à les revendiquer. Des dangers persistent encore dans les tunnels les plus profonds où de riches filons d'argent, de fer et d'or sont extraits."
building_type_zz_valyria_iron_mine_01:0 "Fosse de Fer à Ciel Ouvert"
building_type_zz_valyria_iron_mine_01_desc:0 "Guère plus qu'un trou dans la terre, peuplé d'une poignée de mineurs piochant les veines de fer qui s'y trouvent."
building_zz_valyria_iron_mine_01:0 "Fosse de Fer à Ciel Ouvert"
building_zz_valyria_iron_mine_01_desc:0 "Guère plus qu'un trou dans la terre, peuplé d'une poignée de mineurs piochant les veines de fer qui s'y trouvent."
iron_mine_01_effect:0 "$this_building_desc$[resources|E] : [iron_tooltip|E]#P +3#!/an"

building_type_zz_valyria_iron_mine_02:0 "Mine de Fer"
building_type_zz_valyria_iron_mine_02_desc:0 "Une exploitation minière de fer conséquente, comprenant plusieurs puits renforcés par l'équivalent d'une demi-forêt de boisage. Des ouvriers des villages alentour peinent jour et nuit dans les nombreux tunnels de la mine."

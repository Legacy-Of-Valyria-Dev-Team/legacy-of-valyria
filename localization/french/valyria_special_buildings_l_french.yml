building_type_zz_valyria_steel_forge_03:0 "Guilde des Maîtres Forgerons"
building_type_zz_valyria_steel_forge_03_desc:0 "Les maîtres des ateliers jadis indépendants ont formé une association regroupant tous les forgerons d'acier de la cité. Des hordes de clients et de marchands s'affairent dans leurs marchés, nourrissant un appétit insatiable pour toujours plus d'acier, faisant prospérer la guilde au rythme du fracas incessant des marteaux."

tournament_cost_discount_cv_arena:0 "La Grande Arène de Valyria est quasi perpétuelle dans ses activités, et le personnel et les provisions ne manquent point. Leur approvisionnement est désormais à la fois routinier et à prix réduit."
activity_tournament_province_cv_the_great_arena_of_valyria:0 "Tant que la Grande Arène se dresse, Valyria se dressera ; quand la Grande Arène s'effondrera, le monde entier s'effondrera."


building_type_zz_valyria_iron_mine_02:0 "Mine de Fer"
building_type_zz_valyria_iron_mine_02_desc:0 "Une exploitation minière de fer substantielle, comprenant plusieurs puits renforcés par l'équivalent en bois de la moitié d'une forêt. Des ouvriers des villages voisins peinent jour et nuit dans les nombreux tunnels de la mine."

building_type_zz_valyria_valyrian_steel_forge_03:0 "Haut-Fourneau Draconique"
building_type_zz_valyria_valyrian_steel_forge_03_desc:0 "L'atmosphère d'un quartier entier est saturée de soufre et de cendres, tandis que des dizaines de pratiquants d'un art ésotérique consacrent leur vie entière entre les murs de leur forge sanctifiée, vouant corps et âme à la création d'Acier Valyrien dans un labeur mystique qui consume autant les hommes que les matériaux."

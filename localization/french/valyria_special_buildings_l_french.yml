building_type_zz_valyria_valyrian_steel_forge_02_desc:0 "Les efforts solitaires d'un unique artisan se sont métamorphosés en véritable entreprise de maîtres et d'apprentis, où plusieurs forgerons consacrent leur existence entière au service de l'art ancestral de la forge d'Acier Valyrien, perpétuant les rituels ésotériques dans les flammes sacrées."

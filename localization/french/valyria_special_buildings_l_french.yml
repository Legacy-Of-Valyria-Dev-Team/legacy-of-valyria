building_zz_valyria_iron_mine_02_desc:0 "Une exploitation minière de fer conséquente, comprenant plusieurs puits renforcés par l'équivalent d'une demi-forêt de boisage. Des ouvriers des villages alentour peinent jour et nuit dans les nombreux tunnels de la mine."

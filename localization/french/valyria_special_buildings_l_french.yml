building_type_valyria_mines_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_01_desc:0 "Ces mines plongent dans les entrailles des Quatorze Flammes, gouffres sans fond où périssent des milliers de mineurs baignés par la chaleur des profondeurs. Les filons de minerais précieux y abondent en proportion égale aux périls mortels, offrant à ceux qui y travaillent une existence à la fois lucrative et terriblement brève."
building_valyria_mines_01:0 "Mine Volcanique Infestée de Veurs"
building_valyria_mines_01_desc:0 "Les galeries qui sondaient jadis les profondeurs de ce volcan gisent abandonnées, leurs étais ravagés par les veurs de feu et autres créatures des flammes. Néanmoins, les richesses enfouies demeurent, attendant que des âmes assez téméraires osent les extraire à nouveau."
building_valyria_mines_02:0 "Veines Calcinées"
building_valyria_mines_02_desc:0 "Les tunnels les plus profonds demeurent périlleux, mais des mineurs déterminés ont entrepris d'extraire le minerai des sections les moins volatiles. Les puits renforcés livrent désormais de l'or et du fer en quantités modestes, bien que la présence persistante de veurs de feu impose prudence et coûts considérables aux opérations minières."
building_valyria_mines_03:0 "Mine Volcanique"
#building_valyria_mines_03_desc:0 "This perilous mine is renowned for its rich veins of gold and silver, interspersed with deposits of iron. The intense geothermal activity has also created pockets of valuable gemstones, including rubies and sapphires, forged in the molten crucible of the earth."
building_valyria_mines_03_desc:0 "Cette mine plonge dans les gouffres du volcan, où des milliers d'âmes peinent sous une chaleur suffocante, consumant leur existence à arracher les richesses des entrailles de la terre. De riches veines d'or et d'argent serpentent dans la roche volcanique, entremêlées de filons de fer. L'intense activité géothermique a forgé des poches de rubis et de saphirs dans le creuset en fusion, leur beauté éclatante formant un contraste cruel avec les dangers mortels qui fauchent les mineurs en nombre égal à celui des trésors extraits."

building_type_valyria_mines_dormant_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_dormant_01_desc:0 "Jadis source féconde de métaux précieux, ces tunnels furent scellés par des couches de roche solidifiée lorsque le volcan sombra dans le silence. Les mouvements telluriques ont fragilisé certains passages ; d'aucuns prétendent que les échos des veurs de feu résonnent encore dans les profondeurs oubliées."
building_valyria_mines_dormant_01:0 "Mine Scellée"
building_valyria_mines_dormant_01_desc:0 "Jadis source féconde de métaux précieux, ces tunnels furent scellés par des couches de roche solidifiée lorsque le volcan sombra dans le silence. Les mouvements telluriques ont fragilisé certains passages ; d'aucuns prétendent que les échos des veurs de feu résonnent encore dans les profondeurs oubliées."
building_valyria_mines_dormant_02:0 "Mine Exhumée"
building_valyria_mines_dormant_02_desc:0 "Les efforts de restauration ont débuté, tandis que des prospecteurs reviennent dans les galeries oubliées en quête de fortune. Des étayages ont été érigés pour contrer la roche affaiblie par le temps, et les premiers chariots de fer et d'or ont recommencé à émerger des profondeurs après des décennies d'abandon."
building_valyria_mines_dormant_03:0 "Mine Volcanique Endormie"
building_valyria_mines_dormant_03_desc:0 "Bien que les feux du volcan se soient éteints depuis longtemps, ses richesses demeurent vastes, n'attendant que ceux assez audacieux pour les revendiquer. Les dangers persistent dans les tunnels les plus profonds, où d'opulents filons d'argent, de fer et d'or sont encore exploités avec précaution."
building_type_zz_valyria_iron_mine_01:0 "Carrière de Fer à Ciel Ouvert"
building_type_zz_valyria_iron_mine_01_desc:0 "Guère plus qu'un trou béant dans la terre, où une poignée de mineurs grattent laborieusement les veines de fer affleurantes, arrachant le métal à la roche une pioche après l'autre."
building_zz_valyria_iron_mine_01:0 "Carrière de Fer à Ciel Ouvert"
building_zz_valyria_iron_mine_01_desc:0 "Guère plus qu'un trou béant dans la terre, où une poignée de mineurs grattent laborieusement les veines de fer affleurantes, arrachant le métal à la roche une pioche après l'autre."
iron_mine_01_effect:0 "$this_building_desc$[resources|E] : [iron_tooltip|E]#P +3#!/an"

building_type_zz_valyria_iron_mine_02:0 "Mine de Fer"
building_type_zz_valyria_iron_mine_02_desc:0 "Une exploitation minière d'envergure, constituée de plusieurs puits étayés par ce qui équivaut à une demi-forêt de bois d'œuvre. Des ouvriers venus des villages alentour peinent jour et nuit dans les nombreux boyaux qui percent la montagne."

building_type_zz_valyria_steel_forge_03_desc:0 "Les maîtres des ateliers jadis indépendants forment désormais une association regroupant tous les forgerons d'acier de la ville. Des foules de clients et de marchands commercent sur leurs marchés, créant une impulsion insatiable pour toujours plus d'acier."

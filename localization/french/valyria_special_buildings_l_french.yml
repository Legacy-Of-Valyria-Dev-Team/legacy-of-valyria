building_type_zz_valyria_iron_mine_03:0 "Complexe Minier de Fer"
building_type_zz_valyria_iron_mine_03_desc:0 "Un vaste complexe de puits, de terrils et de fourneaux, entouré des villages des miséreux qui vivront et mourront dans et autour de ses gouffres."

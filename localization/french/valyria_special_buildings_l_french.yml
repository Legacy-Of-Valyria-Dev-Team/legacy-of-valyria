building_type_valyria_mines_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_01_desc:0 "Ces mines s'étendent dans les profondeurs des Quatorze Flammes, des gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur terrestre. Les minéraux précieux abondent en quantité égale aux dangers mortels, rendant la vie de ceux qui s'y trouvent à la fois profitable et brève."
# building_type_valyria_mines_01_desc:0 "L'abîme apparemment sans fin des mines de l'Ancienne Valyria sous les Quatorze Flammes recèle des richesses inestimables ; malheureusement, la prolifération de vouivres de feu et diverses monstruosités innommables empêche actuellement leur extraction."
# building_type_valyria_mines_02:0 ""
# building_type_valyria_mines_02_desc:0 ""
# building_type_valyria_mines_03:0 "Mines des Quatorze Flammes"
# building_type_valyria_mines_03_desc:0 "Ces mines s'étendent dans les profondeurs des Quatorze Flammes, des gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur terrestre. Les minéraux précieux abondent en quantité égale aux dangers mortels, rendant la vie de ceux qui s'y trouvent à la fois profitable et brève."

building_valyria_mines_01:0 "Mine Volcanique Infestée de Vouivres"
building_valyria_mines_01_desc:0 "Les mines qui sondaient autrefois les profondeurs de ce volcan gisent vides, ce qui reste de leurs étais détruit par les vouivres de feu et autres bêtes. Néanmoins, leur richesse pourrait encore être extraite."
building_valyria_mines_02:0 "Veines Calcinées"
building_valyria_mines_02_desc:0 "Les tunnels les plus profonds demeurent traîtres, mais des mineurs déterminés ont commencé à extraire du minerai des sections moins volatiles. Des puits renforcés livrent désormais des traces d'or et de fer, bien que la présence persistante de vouivres de feu maintienne les opérations prudentes et coûteuses."
building_valyria_mines_03:0 "Mine Volcanique"
#building_valyria_mines_03_desc:0 "Cette mine périlleuse est renommée pour ses riches veines d'or et d'argent, entrecoupées de dépôts de fer. L'intense activité géothermique a également créé des poches de pierres précieuses, notamment des rubis et des saphirs, forgés dans le creuset en fusion de la terre."
building_valyria_mines_03_desc:0 "Cette mine plonge profondément dans les crevasses du volcan, où des milliers peinent dans une chaleur étouffante, leur vie dépensée à extraire la richesse de la terre. De riches veines d'or et d'argent serpentent à travers la pierre volcanique, entrecoupées de dépôts de fer. L'intense activité géothermique a également forgé des poches de rubis et de saphirs, leur beauté un cruel contraste avec les dangers mortels qui fauchent les mineurs en nombre égal."

building_type_valyria_mines_dormant_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_dormant_01_desc:0 "Autrefois source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'est tu. Les mouvements telluriques ont laissé certains passages instables, d'aucuns prétendent que les sons des Vouivres de Feu résonnent encore dans les galeries."
building_valyria_mines_dormant_01:0 "Mine Scellée"
building_valyria_mines_dormant_01_desc:0 "Autrefois source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'est tu. Les mouvements telluriques ont laissé certains passages instables, d'aucuns prétendent que les sons des Vouivres de Feu résonnent encore dans les galeries."
building_valyria_mines_dormant_02:0 "Mine Déterrée"
building_valyria_mines_dormant_02_desc:0 "Les efforts de récupération ont commencé, tandis que les prospecteurs retournent dans les tunnels oubliés en quête de richesses. Des renforts ont été érigés contre la pierre affaiblie par le temps, et les premiers charriots de fer et d'or ont à nouveau commencé à émerger des profondeurs."
building_valyria_mines_dormant_03:0 "Mine Volcanique Dormante"
building_valyria_mines_dormant_03_desc:0 "Bien que le feu du volcan se soit éteint depuis longtemps, sa richesse demeure vaste, n'attendant que ceux qui osent la revendiquer. Des dangers persistent encore dans les tunnels profonds où de riches veines d'argent, de fer et d'or sont exploitées."


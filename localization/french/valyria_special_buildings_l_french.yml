building_type_valyria_mines_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_01_desc:0 "Ces mines s'enfoncent dans les profondeurs des Quatorze Flammes, gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur terrestre. Les minéraux précieux y abondent en quantité égale aux périls mortels, rendant la vie de ceux qui y travaillent à la fois lucrative et brève."
# building_type_valyria_mines_01_desc:0 "L'abîme apparemment sans fin des mines de l'Ancienne Valyria sous les Quatorze Flammes recèle d'incalculables richesses ; malheureusement, la prolifération des vouivres de feu et de diverses monstruosités innommables empêche actuellement leur extraction."
# building_type_valyria_mines_02:0 ""
# building_type_valyria_mines_02_desc:0 ""
# building_type_valyria_mines_03:0 "Mines des Quatorze Flammes"
# building_type_valyria_mines_03_desc:0 "Ces mines s'étendent dans les profondeurs des Quatorze Flammes, gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur terrestre. Les minéraux précieux y abondent en quantité égale aux dangers mortels, rendant la vie de ceux qui s'y trouvent à la fois profitable et courte."

building_valyria_mines_01:0 "Mine Volcanique Infestée de Vouivres"
building_valyria_mines_01_desc:0 "Les mines qui sondaient autrefois les profondeurs de ce volcan sont désormais vides, ce qui reste de leurs charpentes ayant été détruit par des vouivres de feu et autres bêtes. Néanmoins, leurs richesses pourraient encore être extraites."
building_valyria_mines_02:0 "Veines Calcinées"
building_valyria_mines_02_desc:0 "Les tunnels les plus profonds demeurent périlleux, mais des mineurs déterminés ont commencé à extraire du minerai des sections moins volatiles. Des puits renforcés produisent désormais des traces d'or et de fer, bien que la présence persistante de vouivres de feu maintienne les opérations prudentes et coûteuses."
building_valyria_mines_03:0 "Mine Volcanique"
#building_valyria_mines_03_desc:0 "Cette mine périlleuse est renommée pour ses riches veines d'or et d'argent, entremêlées de gisements de fer. L'intense activité géothermique a également créé des poches de pierres précieuses, notamment des rubis et des saphirs, forgés dans le creuset en fusion de la terre."
building_valyria_mines_03_desc:0 "Cette mine plonge profondément dans les abîmes du volcan, où des milliers d'hommes peinent dans une chaleur étouffante, leurs vies consumées à extraire les richesses de la terre. De riches veines d'or et d'argent serpentent à travers la pierre volcanique, entremêlées de gisements de fer. L'intense activité géothermique a également forgé des poches de rubis et de saphirs, leur beauté contrastant cruellement avec les dangers mortels qui fauchent les mineurs en nombre égal."

building_type_valyria_mines_dormant_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_dormant_01_desc:0 "Jadis source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'est tu. Le déplacement de la terre a rendu certains passages instables, certains disent que les sons des Vouivres de feu peuvent encore être entendus en écho dans les galeries."
building_valyria_mines_dormant_01:0 "Mine Scellée"
building_valyria_mines_dormant_01_desc:0 "Jadis source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'est tu. Le déplacement de la terre a rendu certains passages instables, certains disent que les sons des Vouivres de feu peuvent encore être entendus en écho dans les galeries."
building_valyria_mines_dormant_02:0 "Mine Déterrée"
building_valyria_mines_dormant_02_desc:0 "Les efforts de récupération ont commencé, alors que les prospecteurs reviennent dans des tunnels oubliés à la recherche de richesses. Des renforts ont été érigés contre la pierre affaiblie par le temps, et les premiers chariots de fer et d'or ont de nouveau commencé à émerger des profondeurs."
building_valyria_mines_dormant_03:0 "Mine Volcanique Dormante"
building_valyria_mines_dormant_03_desc:0 "Bien que le feu du volcan se soit éteint depuis longtemps, sa richesse demeure vaste, n'attendant que ceux qui sont prêts à la réclamer. Les dangers persistent encore dans les tunnels plus profonds où l'on extrait de riches veines d'argent, de fer et d'or."


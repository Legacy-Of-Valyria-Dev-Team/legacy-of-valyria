building_type_zz_valyria_tower_of_lyria_01:0 "La Tour de Lyria"
building_type_zz_valyria_tower_of_lyria_01_desc:0 "La tour d’un ancien mage de l’ancienne Possession. Personne ne comprend vraiment comment elle a pu subsister, mais elle recèle les magies les plus arcanes qui y circulent et s’y déploient"
building_zz_valyria_tower_of_lyria_01:0 "La Tour de Lyria"
building_zz_valyria_tower_of_lyria_01_desc:0 "Un point focal élevé de puissance mystique. On ignore pourquoi, mais les énergies magiques deviennent nettement plus accessibles pour celui qui peut concevoir mentalement la possession de cette tour"


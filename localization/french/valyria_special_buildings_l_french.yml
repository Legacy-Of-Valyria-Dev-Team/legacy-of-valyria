building_type_zz_valyria_iron_mine_02_desc:0 "Une exploitation minière de fer substantielle, comprenant plusieurs puits renforcés avec le bois d'une demi-forêt. Les ouvriers des villages voisins peinent jour et nuit dans les nombreux tunnels de la mine."

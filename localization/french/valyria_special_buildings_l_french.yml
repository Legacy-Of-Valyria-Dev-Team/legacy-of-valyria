building_type_tower_of_lyria_01:0 "La Tour de Lyria"
building_type_tower_of_lyria_01_desc:0 "La tour d'un ancien mage des [valyrian_freehold_short|E] perdues. Nul ne comprend vraiment comment elle parvint à subsister, mais des magies des plus arcanes ondoient et palpitent en cette tour."
building_tower_of_lyria_01:0 "La Tour de Lyria"
building_tower_of_lyria_01_desc:0 "Un haut point focal de puissance mystique. On ignore pourquoi, mais les énergies de la magie deviennent considérablement plus accessibles à celui qui peut conceptuellement appeler cette tour sienne."

building_type_tower_of_lyria_02:0 "La Tour de Lyria"

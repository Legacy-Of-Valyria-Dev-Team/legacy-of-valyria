building_type_tower_of_lyria_01:0 "La Tour de Lyria"
building_type_tower_of_lyria_01_desc:0 "La tour d'un ancien mage des [valyrian_freehold_short|E] perdues. Nul ne comprend vraiment comment elle a réussi à demeurer, mais des magies des plus arcanes se gondolent et coulent dans cette tour, murmurant des secrets oubliés depuis le Fléau."
building_tower_of_lyria_01:0 "La Tour de Lyria"
building_tower_of_lyria_01_desc:0 "Un haut point focal de pouvoir mystique dressé vers les cieux comme un doigt accusateur. On ne sait pourquoi, mais les énergies de la magie deviennent considérablement plus accessibles à celui qui est capable de revendiquer conceptuellement cette tour comme sienne, comme si les pierres elles-mêmes se souvenaient des anciens sortilèges."

building_type_tower_of_lyria_02:0 "La Tour de Lyria"
building_type_tower_of_lyria_02_desc:0 "La tour d'un ancien mage des [valyrian_freehold_short|E] perdues. Nul ne comprend vraiment comment elle a réussi à demeurer, mais des magies des plus arcanes se gondolent et coulent dans cette tour, murmurant des secrets oubliés depuis le Fléau."
building_tower_of_lyria_02:0 "La Tour de Lyria"
building_tower_of_lyria_02_desc:0 "Un haut point focal de pouvoir mystique dressé vers les cieux comme un doigt accusateur. On ne sait pourquoi, mais les énergies de la magie deviennent considérablement plus accessibles à celui qui est capable de revendiquer conceptuellement cette tour comme sienne, comme si les pierres elles-mêmes se souvenaient des anciens sortilèges."

building_type_valyria_mines_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_01_desc:0 "Ces mines s'étendent dans les profondeurs des Quatorze Flammes, gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur de la terre. Les minéraux précieux abondent en quantité égale aux dangers mortels, rendant les vies de ceux qui s'y trouvent à la fois profitables et brèves, un prix sanglant payé pour les trésors des entrailles volcaniques."
building_valyria_mines_01:0 "Mine Volcanique Infestée de Vers"
building_valyria_mines_01_desc:0 "Les mines qui sondaient autrefois les profondeurs de ce volcan gisent vides, ce qui reste de leur charpentage détruit par les vers de feu et autres bêtes des profondeurs ardentes. Néanmoins, leur butin pourrait encore être extrait par les plus téméraires."
building_valyria_mines_02:0 "Veines Calcinées"
building_valyria_mines_02_desc:0 "Les tunnels les plus profonds demeurent traîtres, mais des mineurs déterminés ont commencé à extraire le minerai des sections les moins volatiles. Des puits renforcés produisent maintenant des traces d'or et de fer, bien que la présence de vers de feu persistants maintienne les opérations prudentes et coûteuses."
building_valyria_mines_03:0 "Mine Volcanique"
#building_valyria_mines_03_desc:0 "This perilous mine is renowned for its rich veins of gold and silver, interspersed with deposits of iron. The intense geothermal activity has also created pockets of valuable gemstones, including rubies and sapphires, forged in the molten crucible of the earth."
building_valyria_mines_03_desc:0 "Cette mine périlleuse plonge profondément dans les gouffres du volcan, où des milliers peinent dans une chaleur étouffante, leurs vies consumées à extraire les richesses de la terre. De riches veines d'or et d'argent serpentent à travers la pierre volcanique, entrelacées de gisements de fer. L'intense activité géothermique a également forgé des poches de rubis et de saphirs, leur beauté formant un contraste cruel avec les dangers mortels qui fauchent les mineurs en nombre égal, tribut sanglant versé aux entrailles fumantes de Valyria."

building_type_valyria_mines_dormant_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_dormant_01_desc:0 "Autrefois source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie quand le volcan s'endormit. La terre mouvante a laissé certains passages instables, certains disent que les sons des Vers de Feu peuvent encore être entendus résonnant dans les galeries, échos fantomatiques d'un passé incandescent."
building_valyria_mines_dormant_01:0 "Mine Scellée"
building_valyria_mines_dormant_01_desc:0 "Autrefois source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie quand le volcan s'endormit. La terre mouvante a laissé certains passages instables, certains disent que les sons des Vers de Feu peuvent encore être entendus résonnant dans les galeries, échos fantomatiques d'un passé incandescent."
building_valyria_mines_dormant_02:0 "Mine Exhumée"
building_valyria_mines_dormant_02_desc:0 "Les efforts de récupération ont commencé, tandis que les prospecteurs retournent vers des tunnels oubliés en quête de richesses enfouies. Des renforts ont été érigés contre la pierre affaiblie par le temps, et les premiers chariots de fer et d'or ont une fois de plus commencé à émerger des profondeurs."
building_valyria_mines_dormant_03:0 "Mine Volcanique Dormante"
building_valyria_mines_dormant_03_desc:0 "Bien que le feu du volcan se soit depuis longtemps éteint, son butin demeure vaste, n'attendant que ceux disposés à le revendiquer. Des dangers persistent encore dans les tunnels plus profonds où de riches veines d'argent, de fer et d'or sont extraites des entrailles refroidies de la montagne endormie."
building_type_zz_valyria_iron_mine_01:0 "Fosse de Fer à Ciel Ouvert"
building_type_zz_valyria_iron_mine_01_desc:0 "Guère plus qu'un trou dans la terre, peuplé par un petit nombre de mineurs piochant les veines de fer qui s'y trouvent."
building_zz_valyria_iron_mine_01:0 "Fosse de Fer à Ciel Ouvert"
building_zz_valyria_iron_mine_01_desc:0 "Guère plus qu'un trou dans la terre, peuplé par un petit nombre de mineurs piochant les veines de fer qui s'y trouvent."
iron_mine_01_effect:0 "$this_building_desc$[resources|E] : [iron_tooltip|E]#P +3#!/an"

building_type_zz_valyria_iron_mine_02:0 "Mine de Fer"
building_type_zz_valyria_iron_mine_02_desc:0 "Une opération minière de fer substantielle, comprenant plusieurs puits renforcés avec la moitié d'une forêt de charpentage. Les ouvriers des villages voisins peinent jour et nuit dans les nombreux tunnels de la mine."
building_zz_valyria_iron_mine_02:0 "Mine de Fer"
building_zz_valyria_iron_mine_02_desc:0 "Une opération minière de fer substantielle, comprenant plusieurs puits renforcés avec la moitié d'une forêt de charpentage. Les ouvriers des villages voisins peinent jour et nuit dans les nombreux tunnels de la mine."

tournament_cost_discount_cv_arena:0 "La Grande Arène de Valyria est quasi perpétuelle dans ses activités, et ne manque ni de personnel ni de provisions. Leur approvisionnement est désormais routinier et à prix réduit."
activity_tournament_province_cv_the_great_arena_of_valyria:0 "Tant que la Grande Arène se dressera, Valyria se dressera ; quand la Grande Arène tombera, le monde entier s'effondrera."


building_type_zz_valyria_iron_mine_02:0 "Mine de Fer"
building_type_zz_valyria_iron_mine_02_desc:0 "Une substantielle opération minière de fer, comprenant plusieurs puits renforcés avec l'équivalent d'une demi-forêt de boisage. Les ouvriers des villages avoisinants peinent jour et nuit dans les nombreux tunnels de la mine."

building_type_tower_of_lyria_01:0 "La Tour de Lyria"
building_type_tower_of_lyria_01_desc:0 "La tour d'un mage antique des [valyrian_freehold_short|E] perdues. Nul ne comprend vraiment comment elle a pu subsister, mais des magies des plus arcaniques ondulent et pulsent dans cette tour, défiant le temps et la ruine qui ont tout englouti alentour."
building_tower_of_lyria_01:0 "La Tour de Lyria"
building_tower_of_lyria_01_desc:0 "Un haut lieu de puissance mystique et un point focal des énergies occultes. Nul ne sait pourquoi, mais les flux de magie deviennent considérablement plus accessibles à quiconque peut conceptuellement revendiquer cette tour comme sienne, comme si la pierre même était imprégnée de sorcellerie ancienne."

building_type_tower_of_lyria_02:0 "La Tour de Lyria"
building_type_tower_of_lyria_02_desc:0 "La tour d'un mage antique des [valyrian_freehold_short|E] perdues. Nul ne comprend vraiment comment elle a pu subsister, mais des magies des plus arcaniques ondulent et pulsent dans cette tour, défiant le temps et la ruine qui ont tout englouti alentour."
building_tower_of_lyria_02:0 "La Tour de Lyria"
building_tower_of_lyria_02_desc:0 "Un haut lieu de puissance mystique et un point focal des énergies occultes. Nul ne sait pourquoi, mais les flux de magie deviennent considérablement plus accessibles à quiconque peut conceptuellement revendiquer cette tour comme sienne, comme si la pierre même était imprégnée de sorcellerie ancienne."

building_type_valyria_mines_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_01_desc:0 "Ces mines s'enfoncent dans les profondeurs des Quatorze Flammes, gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur des entrailles de la terre. Les minerais précieux abondent en quantité égale aux dangers mortels, rendant la vie de ceux qui y travaillent à la fois profitable et brève."
building_valyria_mines_01:0 "Mine Volcanique Infestée de Veurs"
building_valyria_mines_01_desc:0 "Les mines qui sondaient jadis les profondeurs de ce volcan gisent vides, ce qui subsiste de leurs étais détruit par les veurs de feu et autres monstres des profondeurs. Néanmoins, leurs richesses pourraient encore être arrachées à la terre embrasée, pour peu qu'on ose affronter ce qui rôde dans l'obscurité."
building_valyria_mines_02:0 "Veines Calcinées"
building_valyria_mines_02_desc:0 "Les tunnels les plus profonds demeurent périlleux, mais des mineurs déterminés ont commencé à extraire du minerai des sections les moins volatiles. Des puits renforcés livrent désormais des traces d'or et de fer, bien que la présence persistante de veurs de feu maintienne les opérations prudentes et coûteuses en vies humaines."
building_valyria_mines_03:0 "Mine Volcanique"
building_valyria_mines_03_desc:0 "Cette mine plonge profondément dans les chasmes du volcan, où des milliers peinent dans une chaleur étouffante, leurs vies consumées à arracher les richesses des entrailles de la terre. De riches veines d'or et d'argent serpentent à travers la pierre volcanique, entremêlées de gisements de fer. L'intense activité géothermique a également forgé des poches de rubis et de saphirs, leur beauté formant un cruel contraste avec les dangers mortels qui fauchent les mineurs en nombre égal."

building_type_valyria_mines_dormant_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_dormant_01_desc:0 "Jadis une source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'éteignit. La terre mouvante a laissé certains passages instables, et l'on dit que les sons de veurs de feu résonnent encore en écho dans les galeries abandonnées."
building_valyria_mines_dormant_01:0 "Mine Scellée"
building_valyria_mines_dormant_01_desc:0 "Jadis une source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan s'éteignit. La terre mouvante a laissé certains passages instables, et l'on dit que les sons de veurs de feu résonnent encore en écho dans les galeries abandonnées, rappelant que même endormi, le danger persiste."
building_valyria_mines_dormant_02:0 "Mine Exhumée"
building_valyria_mines_dormant_02_desc:0 "Les efforts de récupération ont débuté, tandis que prospecteurs et aventuriers retournent vers des tunnels oubliés en quête de richesses. Des renforts ont été érigés contre la pierre affaiblie par le temps, et les premiers chariots de fer et d'or ont recommencé à émerger des profondeurs, arrachant à nouveau les trésors à l'obscurité."
building_valyria_mines_dormant_03:0 "Mine Volcanique Endormie"
building_valyria_mines_dormant_03_desc:0 "Bien que le feu du volcan se soit éteint depuis longtemps, ses richesses demeurent vastes, n'attendant que ceux assez audacieux pour les réclamer. Des dangers persistent encore dans les tunnels les plus profonds où de riches veines d'argent, de fer et d'or sont extraites des ténèbres souterraines."

building_type_zz_valyria_iron_mine_01:0 "Fosse de Fer à Ciel Ouvert"
building_type_zz_valyria_iron_mine_01_desc:0 "Guère plus qu'un trou dans la terre, peuplé d'un petit nombre de mineurs grattant les veines de fer qui s'y trouvent."
building_zz_valyria_iron_mine_01:0 "Fosse de Fer à Ciel Ouvert"

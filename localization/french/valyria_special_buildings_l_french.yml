building_type_valyria_mines_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_01_desc:0 "Ces mines s'enfoncent dans les profondeurs des Quatorze Flammes, gouffres sans fin engloutissant des milliers de mineurs baignés dans la chaleur des entrailles de la terre. Les minerais précieux abondent en quantité égale aux périls mortels, rendant la vie de ceux qui s'y aventurent à la fois profitable et brève."
building_valyria_mines_01:0 "Mine Volcanique Infestée de Vouivres"
building_valyria_mines_01_desc:0 "Les mines qui sondaient jadis les profondeurs de ce volcan gisent vides, ce qui reste de leur charpentage détruit par les vouivres de feu et autres créatures. Néanmoins, leurs richesses pourraient encore être extraites."
building_valyria_mines_02:0 "Veines Calcinées"
building_valyria_mines_02_desc:0 "Les tunnels les plus profonds demeurent traîtres, mais des mineurs déterminés ont commencé à extraire le minerai des sections les moins volatiles. Des puits renforcés donnent désormais des traces d'or et de fer, bien que la présence persistante de vouivres de feu maintienne les opérations prudentes et coûteuses."
building_valyria_mines_03:0 "Mine Volcanique"
#building_valyria_mines_03_desc:0 "Cette mine périlleuse est réputée pour ses riches veines d'or et d'argent, entremêlées de gisements de fer. L'intense activité géothermique a également créé des poches de pierres précieuses, rubis et saphirs notamment, forgées dans le creuset en fusion de la terre."
building_valyria_mines_03_desc:0 "Cette mine plonge profondément dans les abîmes du volcan, où des milliers peinent dans une chaleur étouffante, leurs vies consumées à extraire les richesses terrestres. De riches veines d'or et d'argent serpentent à travers la pierre volcanique, entremêlées de gisements de fer. L'intense activité géothermique a également forgé des poches de rubis et de saphirs, leur beauté formant un contraste cruel avec les périls mortels qui fauchent les mineurs en nombre égal."

building_type_valyria_mines_dormant_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_dormant_01_desc:0 "Jadis source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan tomba dans le silence. Les mouvements de la terre ont rendu certains passages instables, et l'on dit que les sons des Vouivres de Feu résonnent encore dans les galeries."
building_valyria_mines_dormant_01:0 "Mine Scellée"
building_valyria_mines_dormant_01_desc:0 "Jadis source active de métaux précieux, ces tunnels furent scellés par des couches de roche durcie lorsque le volcan tomba dans le silence. Les mouvements de la terre ont rendu certains passages instables, et l'on dit que les sons des Vouivres de Feu résonnent encore dans les galeries."
building_valyria_mines_dormant_02:0 "Mine Déterrée"
building_valyria_mines_dormant_02_desc:0 "Les efforts de récupération ont commencé, tandis que les prospecteurs retournent dans les tunnels oubliés en quête de richesses. Des renforts ont été érigés contre la pierre affaiblie par le temps, et les premiers chariots de fer et d'or ont recommencé à émerger des profondeurs."
building_valyria_mines_dormant_03:0 "Mine Volcanique Dormante"
building_valyria_mines_dormant_03_desc:0 "Bien que le feu du volcan se soit depuis longtemps éteint, ses richesses demeurent vastes, n'attendant que ceux assez téméraires pour les revendiquer. Des dangers subsistent encore dans les tunnels les plus profonds où de riches veines d'argent, de fer et d'or sont extraites."
building_type_zz_valyria_iron_mine_01:0 "Fosse de Fer à Ciel Ouvert"
building_type_zz_valyria_iron_mine_01_desc:0 "Guère plus qu'un trou dans la terre, peuplé d'un petit nombre de mineurs piochant les veines de fer qui s'y trouvent."
building_zz_valyria_iron_mine_01:0 "Fosse de Fer à Ciel Ouvert"
building_zz_valyria_iron_mine_01_desc:0 "Guère plus qu'un trou dans la terre, peuplé d'un petit nombre de mineurs piochant les veines de fer qui s'y trouvent."
iron_mine_01_effect:0 "$this_building_desc$[resources|E] : [iron_tooltip|E]#P +3#!/an"

building_type_zz_valyria_iron_mine_02:0 "Mine de Fer"
building_type_zz_valyria_iron_mine_02_desc:0 "Une exploitation minière de fer substantielle, comprenant plusieurs puits renforcés avec le bois d'une demi-forêt. Les ouvriers des villages voisins peinent jour et nuit dans les nombreux tunnels de la mine."

building_type_zz_valyria_valyrian_steel_forge_01_desc:0 "Le foyer autarcique d'un artisan local, pourvu des matériaux requis et des techniques alchimiques ancestrales nécessaires à la production d'Acier Valyrien, secret jalousement gardé transmis de maître à apprenti depuis les temps immémoriaux."

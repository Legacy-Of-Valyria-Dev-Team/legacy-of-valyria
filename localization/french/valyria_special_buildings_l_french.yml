tournament_cost_discount_cv_arena:0 "La Grande Arène de Valyria est quasi perpétuelle dans ses activités, et il ne manque ni personnel ni approvisionnements à utiliser. Leur fourniture est désormais à la fois routinière et à prix réduit."
activity_tournament_province_cv_the_great_arena_of_valyria:0 "Tant que la Grande Arène se dresse, Valyria se dressera. Quand la Grande Arène tombera, le monde entier s'écroulera."


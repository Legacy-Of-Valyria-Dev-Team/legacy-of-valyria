building_type_zz_valyria_iron_mine_03:0 "Complexe Minier de Fer"
building_type_zz_valyria_iron_mine_03_desc:0 "Un vaste complexe de puits, de terrils et de fourneaux, cerné par les masures des déshérités qui naîtront, vivront et mourront dans l'ombre de ses gouffres, condamnés à gratter la terre jusqu'à leur dernier souffle pour enrichir des maîtres qu'ils ne verront jamais."

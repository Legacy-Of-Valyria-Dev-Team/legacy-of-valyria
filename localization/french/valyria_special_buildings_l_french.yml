building_type_zz_valyria_steel_forge_01:0 "Artisans de l'Acier"
building_type_zz_valyria_steel_forge_01_desc:0 "Une collectivité d'artisans indépendants a établi ses ateliers dans la cité, forgeant divers ouvrages d'acier sur commande pour répondre aux besoins de la noblesse comme du peuple."

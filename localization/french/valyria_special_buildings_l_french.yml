building_type_valyria_mines_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_01_desc:0 "Ces mines s’enfoncent dans les profondeurs des Quatorze Flammes, d’innombrables gouffres engloutissant des milliers de mineurs exposés à la chaleur de la terre. Les minéraux précieux y abondent autant que les dangers mortels, rendant la vie de ceux qui y travaillent à la fois rentable et brève"
# building_type_valyria_mines_01_desc:0 "L’abîme apparemment sans fin des mines de l’Ancienne Valyria, sous les Quatorze Flammes, recèle d’innombrables richesses. Malheureusement, la prolifération de vouivres de feu et de diverses monstruosités indicibles empêche pour l’instant toute extraction"
# building_type_valyria_mines_02:0 ""
# building_type_valyria_mines_02_desc:0 ""
# building_type_valyria_mines_03:0 "Mines of the Fourteen Flames"
# building_type_valyria_mines_03_desc:0 "Ces mines s’enfoncent dans les profondeurs des Quatorze Flammes, d’innombrables gouffres engloutissant des milliers de mineurs exposés à la chaleur de la terre. Les minéraux précieux y abondent autant que les dangers mortels, rendant la vie de ceux qui y travaillent à la fois rentable et brève"

building_valyria_mines_01:0 "Mine Volcanique Infestée de Vouivres"
building_valyria_mines_01_desc:0 "Les mines qui autrefois exploraient les profondeurs de ce volcan sont désormais désertées, leurs structures de bois ayant été détruites par des vouivres de feu et d’autres bêtes. Néanmoins, on pourrait encore en extraire leurs richesses"
building_valyria_mines_02:0 "building_valyria_mines_02"
building_valyria_mines_02_desc:0 "building_valyria_mines_02_desc"
building_valyria_mines_03:0 "Mine Volcanique"
#building_valyria_mines_03_desc:0 "Cette mine périlleuse est réputée pour ses riches veines d’or et d’argent, ponctuées de dépôts de fer. L’intense activité géothermique a aussi créé des poches de gemmes précieuses, comme des rubis et des saphirs, forgés dans le creuset en fusion de la terre"
building_valyria_mines_03_desc:0 "Cette mine plonge profondément dans les abîmes du volcan, où des milliers peinent sous une chaleur étouffante, consacrant leur vie à extraire les richesses de la terre. De riches veines d'or et d'argent serpentent à travers la pierre volcanique, entrecoupées de dépôts de fer. Une intense activité géothermique a également forgé des poches de rubis et de saphirs, dont la beauté contraste cruellement avec les dangers mortels qui déciment les mineurs à parts égales."

building_type_valyria_mines_dormant_01:0 "Mine des Quatorze Flammes"
building_type_valyria_mines_dormant_01_desc:0 "building_type_valyria_mines_dormant_01_desc"
building_valyria_mines_dormant_01:0 "Mine scellée"
building_valyria_mines_dormant_01_desc:0 "Autrefois source active de métaux précieux, ces tunnels ont été scellés par des couches de roche durcie lorsque le volcan s'est tu. La terre mouvante a laissé certaines voies instables, et certains disent que l'on peut encore entendre les sons des vouivres résonner dans les galeries."
building_valyria_mines_dormant_02:0 "Mine déterrée"
building_valyria_mines_dormant_02_desc:0 "Les efforts de récupération ont commencé, les prospecteurs retournant dans des tunnels oubliés en quête de richesses. Des renforts ont été érigés contre la pierre affaiblie par le temps, et les premiers chariots de fer et d'or ont de nouveau commencé à émerger des profondeurs."
building_valyria_mines_dormant_03:0 "Mine volcanique en sommeil"
building_valyria_mines_dormant_03_desc:0 "Bien que le feu du volcan se soit longtemps éteint, sa richesse demeure immense, attendant seulement ceux qui sont prêts à la réclamer. Des dangers subsistent dans les tunnels les plus profonds, où d'importantes veines d'argent, de fer et d'or sont exploitées."


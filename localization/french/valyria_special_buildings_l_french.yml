building_type_tower_of_lyria_01:0 "La Tour de Lyria"
building_type_tower_of_lyria_01_desc:0 "Vestige d'un mage antique des [valyrian_freehold_short|E] perdues, cette tour défie toute compréhension. Nul ne saurait expliquer comment elle survécut au Fléau, mais les énergies arcaniques les plus primordiales ondulent et palpitent entre ses murs millénaires, témoignage vivant d'une maîtrise oubliée des arts mystiques."
building_tower_of_lyria_01:0 "La Tour de Lyria"
building_tower_of_lyria_01_desc:0 "Point focal d'un pouvoir mystique incommensurable. Par quelque mystère que la raison peine à saisir, les courants de la magie elle-même affluent vers celui qui peut légitimement revendiquer la possession conceptuelle de cette tour, amplifiant considérablement sa maîtrise des arts occultes."

building_type_tower_of_lyria_02:0 "La Tour de Lyria"
building_type_tower_of_lyria_02_desc:0 "Vestige d'un mage antique des [valyrian_freehold_short|E] perdues, cette tour défie toute compréhension. Nul ne saurait expliquer comment elle survécut au Fléau, mais les énergies arcaniques les plus primordiales ondulent et palpitent entre ses murs millénaires, témoignage vivant d'une maîtrise oubliée des arts mystiques."

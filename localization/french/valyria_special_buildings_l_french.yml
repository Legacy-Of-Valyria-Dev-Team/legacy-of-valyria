tournament_cost_discount_cv_arena:0 "La Grande Arène de Valyria est presque perpétuelle dans ses activités, et il ne manque pas de personnel ni de fournitures à mobiliser. Leur provision est désormais à la fois routinière et à prix réduit."
activity_tournament_province_cv_the_great_arena_of_valyria:0 "Tant que la Grande Arène tiendra, Valyria tiendra ; quand la Grande Arène tombera, le monde entier s'effondrera avec elle."


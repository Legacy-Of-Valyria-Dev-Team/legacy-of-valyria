l_spanish:
   #VS Weapons 
 vs_torment_name: "Tormento" #NT!
 vs_torment_description: "Torment es una legendaria espada de acero valyrio forjada por Daemon Volar en el corazón de [GetTitleByKey('k_lokiria').GetNameNoTier], mucho antes de [doom|E]. Su primer propietario, Taurin, el gobernante fundador del reino, lo reclamó durante el nacimiento del reino y lo utilizó para unir tierras fracturadas bajo su gobierno. Fabricado con el más raro acero valyrio, y su pomo tiene la forma de un dragón feroz, que simboliza el poder y la voluntad inquebrantable.\n\n'Nunca conquistado, siempre temido'" #NT!
  
 vs_dragon_halberd_name: "Alabarda Dragón" #NT!
 vs_dragon_halberd_description: "Una antigua alabarda de acero valyrio soldada por los guardias del dragón en la antigua Valyria." #NT!
  
 vs_abyss_name: "Abismo" #NT!
 vs_abyss_description: "Un hacha de guerra de acero valyrio con mango de madera flotante negra. La cabeza y los tentáculos de un kraken están tallados en la cabeza del hacha con piedras preciosas de rubí engastadas en los ojos." #NT!
  
 dothraki_arakh_name: "Dothraki Arakh" #NT!
 dothraki_arakh_description: "Arma tradicional de los Dothraki." #NT!
  
 vs_frostbite_hammer_name: "Congelación" #NT!
 vs_frostbite_hammer_description: "Frostbite es un arma legendaria, forjada con acero valyrio de color azul pálido, un testimonio del poder de la Casa Frost. Su enorme cabeza, con forma de pico de cuervo, es tan temible como los vientos del norte que azotan su helada tierra natal.\n\nUna vez empuñada por el último de los reyes Frost, se mantuvo como el símbolo de una dinastía que gobernó desde el corazón de Frostguard. Después de la caída del rey, fue exiliado al [nw_govt|E], y finalmente desertó para huir hacia los Colmillos de Hielo.\n\nPerdido en el tiempo, el paradero de Frostbite sigue siendo desconocido; sin embargo, su leyenda perdura, y se susurra que el arma yace escondida en algún lugar de los páramos helados, esperando la mano de alguien digno de su poder." #NT!
  
 dragon_tail_name: "Cola de dragón" #NT!
 dragon_tail_description: "None" #NT!
 vs_mages_fire_name: "Fuego del mago" #NT!
 vs_mages_fire_desc: "Un estoque de una mano con una hoja delgada de doble filo diseñada para atravesar las defensas del oponente. El metal de su guardia tiene un acabado en un color descolorido que va del blanco al azul, a juego con el azul de su empuñadura y pomo. Es un arma de precisión y está más cerca de una obra de arte que de un instrumento de guerra." #NT!

 trait_silly_bear: "Oso" #NT!
 trait_silly_bear_desc: "Sí, eres un oso real con todo el pelaje, los dientes y el amor por el salmón...\n\n#weak No me comas, por favor#!" #NT!
  
 trait_silent_monster: "Monstruo silencioso" #NT!
 trait_silent_monster_desc: "Un monstruo nacido de magia corrupta, estas viles criaturas son meras sombras de lo que alguna vez fueron, si es que alguna vez fueron verdaderamente humanos. Retorcidas más allá del reconocimiento, sus formas están deformadas por una oscura hechicería, sus mentes perdidas en la locura que las alimenta.\n\nAhora no son más que bestias, impulsadas por un hambre insaciable de destrucción. Sus cuerpos se niegan a marchitarse, su carne ya no está sujeta a las leyes de la vida y la muerte. Inmortales, implacables y terriblemente letales en combate, son una pesadilla con forma: imparables a menos que se enfrenten a fuerzas tan poderosas como la magia oscura que los creó." #NT!
  
 trait_demon_trait: "Demonio" #NT!
 trait_demon_trait_desc: "Estos miserables seres, un demonio de lo más repugnante, nacen de las mismas profundidades de la tierra, donde el fuego y la magia se fusionan en una mezcla caótica de poder puro e impío. Forjados en la oscuridad, surgen de cavernas fundidas, con sus formas retorcidas esculpidas por el odio y las llamas malditas.\n\nDesprecian a todos los seres vivos, considerándolos nada más que presas que deben ser despedazadas en su ira eterna. Una vez despertados de su antiguo letargo, no hay razonamiento ni piedad: sólo matanza. No pararán, no se cansarán, hasta que su sed de sangre sea saciada y el mundo quede en ruinas." #NT!

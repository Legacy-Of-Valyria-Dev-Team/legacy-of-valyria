l_spanish:
   # Volantis 
 volantis_slaves: "Esclavos soldados" #NT!
 volantis_slaves_flavor: "Cada persona esclavizada debe obedecer a sus Amos, incluso si eso significa arriesgar su vida en el campo de batalla. Al luchar sin armadura y con armas improvisadas, se supone que deben darle tiempo al resto del ejército para hacer el verdadero trabajo." #NT!
 free_riders: "Jinetes libres" #NT!
 free_riders_flavor: "Reclutados entre mercenarios y mercenarios, constituyen la gran mayoría de la caballería Volantis. A pesar de provenir de todas partes de Essos, pueden llevar a cabo sus misiones de manera efectiva." #NT!
 elephant_tusk: "colmillos de elefante" #NT!
 elephant_tusk_flavor: "Los Colmillos de Elefante son miembros de la facción política conocida como los "Elefantes". Luchan en una formación de falange altamente organizada, empuñando largas picas con efectos devastadores. Como elefantes, son inflexibles y firmes en su defensa, y ningún enemigo puede superar su irrompible muro de lanzas desde el frente. Incluso en retirada, no sucumben al pánico y se retiran de forma ordenada, proporcionando cobertura al resto del ejército. Sus enemigos tienen la impresión de que nunca se cansan y se erigen como un escudo impenetrable que destroza las cargas enemigas." #NT!
 dragon_lords: "Señores del tigre" #NT!
 dragon_lords_flavor: "Los Tiger Lords son miembros de la nobleza Volantene que se enorgullecen de su herencia aristocrática que se remonta a la desaparecida Valyria. Sus líneas de sangre son veneradas y su destreza en combate es incomparable. Como catafractos con armadura pesada, cabalgan hacia la batalla con sus lanzas en alto, listos para infundir miedo en los corazones de sus enemigos. Los Tiger Lords son conocidos por su agresión y ferocidad en la batalla, y sus enemigos tiemblan ante el sonido de sus cascos que se acercan. Son un grupo orgulloso y arrogante, pero su valentía y determinación inquebrantable en el campo de batalla son incomparables." #NT!
 citizen_guard: "Guardia Ciudadana" #NT!
 citizen_guard_flavor: "La Guardia Ciudadana es una milicia cívica formada por los habitantes del estado de Volantis, particularmente los de las ciudades de Volantis, Volon Therys, Valysar y sus alrededores. Sólo las personas libres pueden incorporarse a la Guardia Ciudadana, y lo hacen con mucho orgullo, ya que luchar en esta formación es un gran honor. Luchan como infantería disciplinada, equipada con armaduras pesadas, grandes escudos, espadas, hachas y martillos. Forman la columna vertebral del ejército volanteno y son el principal medio para defender sus fronteras contra sus enemigos vecinos." #NT!
 volantis_war_elephants: "Elefantes de guerra de Volantis" #NT!
 volantis_war_elephants_flavor: "El elefante es un símbolo de la Gran Ciudad de Volantis. Su mera presencia eleva la moral de todos sus ciudadanos e infunde miedo a sus enemigos. La formación se compone de varias docenas de grandes elefantes de guerra, vestidos con armaduras pesadas, cada uno con un guía en la espalda y una pequeña torreta con varios arqueros. Son absolutamente letales en batalla y a menudo atraviesan formaciones enteras con una poderosa carga." #NT!
  
   # Dothraki 
 dothraki_riders: "Jinetes Dothraki" #NT!
 dothraki_riders_flavor: "Los Dothraki han aprendido a montar y vincularse con sus caballos como ninguna otra cultura, usándolos para todos y cada uno de los fines bélicos y considerando cualquier otro estilo de guerra como inferior a ellos." #NT!
  
   # Northern Valyria 
 elyrian_longbowmen: "Arqueros largos de Elyria" #NT!
   elyrian_longbowmen_flavor:0 "Elyrian longbowmen are elite archers renowned for their precision and deadly range, wielding tall, intricately crafted bows designed for powerful shots. Trained from a young age, they strike swiftly from afar, blending agility with unmatched skill in ranged warfare. 
 mantaryan_monsters: "Monstruos mantarios" #NT!
 mantaryan_monsters_flavor: "Los Monstruos Mantaryan son un grupo de guerreros de élite retorcidos por Doom, con sus cuerpos desfigurados pero sus habilidades letales. Aunque su transformación les otorga poderes antinaturales, sus formas alteradas los dejan dolorosamente vulnerables." #NT!
  
   # Gogossos 
 gogossi_berserkers: "Berserkers Gogossi" #NT!
 gogossi_berserkers_flavor: "Los Gogossi Berserkers son hombres y mujeres que aman la emoción de una pelea pero también están hechizados por el olor y el sabor de la sangre, entran en un frenesí loco matando a todos los que los rodean porque no les importa de dónde fluye la sangre, sólo que fluya." #NT!
 basilisk_riders: "Jinetes de Basilisco" #NT!
 basilisk_riders_flavor: "Los Jinetes Basiliscos son extremadamente venerados en la cultura gogosita, ya que han recibido años de entrenamiento dedicado, estas feroces monturas destrozarán armaduras como si fueran mantequilla. Estos temibles jinetes generalmente son enviados a misiones de asesinato, ya que también son extremadamente silenciosos y se mueven rápido... buena suerte escondiéndose de ellos." #NT!
 blood_mutants: "Mutantes de sangre" #NT!
 blood_mutants_flavor: "A través de prueba y error, los gogositas debido a su fascinación por el [valyrian_freehold|E], sus magos y la magia que contiene, han aprendido a usar los poderes de la sangre para crear nuevas criaturas imparables que son capaces de cambiar el rumbo de la batalla con apenas levantar un dedo, acercándolos más a los dioses que a los humanos, muy parecido a los valyrios..." #NT!
  
   # Asshai 
 esoteric_grenadiers: "Granaderos esotéricos" #NT!
 esoteric_grenadiers_flavor: "Los Granaderos Esotéricos, en su mayoría compuestos por hechiceros nuevos en los oficios mágicos, son comúnmente conocidos por su práctica de la religión Shadowbinder. Poseen una fuerza inmensa y, por lo tanto, pueden cambiar fácilmente el rumbo de la batalla con sus encantadas capacidades de lanzar llamas." #NT!

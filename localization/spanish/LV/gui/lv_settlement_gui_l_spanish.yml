l_spanish:
 lv_ruins_reconstruct_tooltip: "Este holding está en ruinas, pero podemos restaurarlo y convertirlo en una colonia autosuficiente. Comenzarás a planificar una expedición para recuperar esta tierra.\n" #NT!
 lv_ruins_reconstruct_tooltip_cost: "Costos estimados:" #NT!
 lv_ruins_reconstruct_tooltip_cost_value: "@gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost')|0]" #NT!
 lv_ruins_reconstruct_tooltip_cost_insufficient: "[AddLocalizationIf( Not(GetScriptedGui('lv_ruin_can_afford').IsShown( GuiScope.SetRoot( GetPlayer.MakeScope ).End)), 'lv_ruins_reconstruct_tooltip_cost_insufficient_text' )]" #NT!
 lv_ruins_reconstruct_tooltip_cost_insufficient_text: "\n#X @warning_icon! ¡Tú #bold no#! tienes @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_difference')|0]#!" #NT!
  
   # Cost Breakdown 
 lv_ruins_reconstruct_tooltip_breakdown_title: "Restauración de ruinas" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_subheading: "Desglose de costos" #NT!
  
   # Settlement Cost and Breakdown 
 lv_ruins_reconstruct_tooltip_breakdown_settlement: "Tamaño de la ruina y progreso #V @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement')|0]#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_settlement_base: "$BULLET$[HoldingView.GetProvince.Custom('LV_RuinsReconstructTooltip_RuinType')]: #N [GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement_base')|0]#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_settlement_valyrian_architecture: "$BULLET$La cultura utiliza la arquitectura valyria: #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement_valyrian_architecture')|0]#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_settlement_hard_working: "$BULLET$La cultura tiene $tradition_hard_working_name$ tradición: #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_settlement_hard_working')|0]#!" #NT!
  
   # Expedition Cost and Breakdown 
 lv_ruins_reconstruct_tooltip_breakdown_expedition: "Preparación y Logística #V @gold_icon![GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition')|0]#! #weak (Mínimo: 30)#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_expedition_base: "$BULLET$Costo de expedición: #N [GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_base')|0]#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_expedition_isolationist: "$BULLET$La cultura tiene $tradition_isolationist_name$ tradición: #N +[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_isolationist')|0]#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_expedition_republican_legacy: "$BULLET$La cultura tiene $tradition_republican_legacy_name$ tradición: #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_republican_legacy')|0]#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_expedition_valyrian: "$BULLET$La cultura tiene $tradition_agot_high_valyrian_name$ tradición: #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_valyrian')|0]#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_expedition_north_valyrian_1: "$BULLET$La cultura tiene $lv_tradition_north_valyrian_1_name$ tradición: #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_north_valyrian_1')|0]#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_expedition_north_valyrian_2: "$BULLET$La cultura tiene $lv_tradition_north_valyrian_2_name$ tradición: #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_north_valyrian_2')|0]#!" #NT!
 lv_ruins_reconstruct_tooltip_breakdown_expedition_doom: "$BULLET$La cultura tiene $tradition_agot_doom_name$ tradición: #P -[GetPlayer.MakeScope.ScriptValue('lv_settlement_cost_expedition_doom')|0]#!" #NT!
  
 lv_begin_expedition: "Comenzar la expedición" #NT!
 lv_begin_expedition_desc: "Tenemos los recursos y la mano de obra para comenzar a planificar una expedición para recuperar este asentamiento del desierto." #NT!
 lv_begin_expedition_effect_tooltip: "Comenzarás a planificar una expedición para recuperar este asentamiento. ¡Esto costará @gold_icon! [GetPlayer.MakeScope.ScriptValue('lv_settlement_cost')|0] y llevará algo de tiempo prepararlo." #NT!
  
 lv_abandon_settlement: "Abandonar el acuerdo" #NT!
 lv_abandon_settlement_desc: "Abandona todos los esfuerzos por restaurar este asentamiento y devuelve las ruinas a la naturaleza." #NT!
  
 lv_upgrade_settlement: "Establecer tenencia" #NT!
 lv_upgrade_settlement_desc: "Nuestros esfuerzos en esta provincia nos han dado una colonia considerable y autosuficiente. En este punto, no estaría mal establecer aquí una explotación permanente." #NT!
  
 HAS_SETTLEMENT_BLOCKERS: "Debe haber bloqueadores de asentamientos presentes en la colonia." #NT!
 HAS_NO_SETTLEMENT_BLOCKERS: "No debe haber ningún bloqueador de asentamientos presente en la colonia." #NT!
  

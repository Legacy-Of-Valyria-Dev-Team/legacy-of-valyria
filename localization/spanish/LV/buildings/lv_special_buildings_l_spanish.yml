l_spanish:
   # Braavos 
 building_agot_EE_titan_of_braavos: "El titán de Braavos" #NT!
 building_type_agot_EE_titan_of_braavos: "El titán de Braavos" #NT!
 building_agot_EE_titan_of_braavos_desc: "Incluido por el famoso escriba de Westerosi Lomas Longstrider como una de las maravillas hechas por el hombre, el Titán de Braavos se erige como la principal línea de defensa del [free_city|E] de Braavos, protegiendo la estrecha entrada a la laguna en la que reside la ciudad. Es una enorme estatua de granito y bronce con forma de guerrero, que actúa como fortaleza y faro. Los agujeros asesinos debajo del faldón blindado de la estatua y las saeteras por todo su peto proporcionan una defensa casi impenetrable contra los barcos enemigos que ingresan a la laguna." #NT!
  
 building_agot_EE_sealords_palace: "El Palacio del Señor del Mar" #NT!
 building_type_agot_EE_sealords_palace: "El Palacio del Señor del Mar" #NT!
 building_agot_EE_sealords_palace_desc: "El Palacio del Señor del Mar es el hogar del Señor del Mar de Braavos. Debajo de las cúpulas y torres del gran palacio se puede encontrar una exótica colección de aves y bestias de todo el mundo." #NT!
  
   # Volantis 
 building_agot_EE_black_walls_of_old_volantis: "Las paredes negras" #NT!
 building_type_agot_EE_black_walls_of_old_volantis: "Las paredes negras" #NT!
 building_agot_EE_black_walls_of_old_volantis_desc: "El corazón de Volantis. Construido por el antiguo [valyrian_freehold|E], este muro gigante de piedra negra fundida protege una serie de palacios, patios, torres y templos. Sólo aquellos cuya sangre se remonta a ascendencia valyria, la Sangre Antigua, pueden habitar en ella." #NT!
 building_agot_EE_volantis_harbor: "Puerto de Volantis" #NT!
 building_type_agot_EE_volantis_harbor: "Puerto de Volantis" #NT!
 building_agot_EE_volantis_harbor_desc: "El poder de Volantis se debe en parte a su gran puerto, especialmente debido a su favorable ubicación geográfica. Este vasto lugar en forma de media luna está construido justo en la desembocadura del Rhoyne y se dice que puede contener la totalidad de Braavos en su interior." #NT!
  
 building_agot_EE_the_long_bridge: "El puente largo" #NT!
 building_type_agot_EE_the_long_bridge: "El puente largo" #NT!
 building_agot_EE_the_long_bridge_desc: "El Puente Largo une las dos mitades de Volantis y es el puente más largo del mundo conocido. Construido por [old_valyria|E] en su mejor momento con piedra fundida, se dice que es capaz de soportar el peso de mil elefantes." #NT!
  
 building_agot_EE_temple_of_the_lord_of_light: "El Templo del Señor de la Luz" #NT!
 building_type_agot_EE_temple_of_the_lord_of_light: "El Templo del Señor de la Luz" #NT!
 building_agot_EE_temple_of_the_lord_of_light_desc: "Este enorme templo se eleva muy por encima de cualquier otro edificio de la ciudad. Sus deslumbrantes colores dorado, rojo y naranja lo convierten en un verdadero espectáculo digno de contemplar. Protegido por la Mano Ardiente, este templo sirve a R'hllor, el Señor de la Luz, y podría ser uno de los mayores testimonios de su poder que existen." #NT!
  
 building_agot_EE_volantis_walls: "Las murallas de Volantis" #NT!
 building_type_agot_EE_volantis_walls: "Las murallas de Volantis" #NT!
 building_agot_EE_volantis_walls_desc: "Aunque no son tan impresionantes como los de Old Volantis, los muros de Volantis harán que cualquier atacante se lo piense dos veces antes de asaltar la ciudad." #NT!
  
   # Rhoyne 
 building_agot_EE_nymeria_palace_01: "Palacio de Nymeria" #NT!
 building_type_agot_EE_nymeria_palace_01: "Palacio de Nymeria" #NT!
 building_agot_EE_nymeria_palace_01_desc: "En el corazón de Ny Sar se encuentran las ruinas del Palacio de Nymeria, abandonado desde que [valyrian_freehold|E] derrotó al Príncipe Garin en la Segunda Guerra de las Especias. Sus paredes de mármol rosa y verde, sus imponentes cúpulas y sus grandes agujas se erigen ahora como un inquietante caparazón de lo que fue antes. Toda la vida abandonó este lugar cuando Nymeria huyó a Dorne, dejando en decadencia estos salones que alguna vez fueron orgullosos." #NT!
  
 building_agot_EE_nymeria_palace_02: "Palacio de Nymeria" #NT!
 building_type_agot_EE_nymeria_palace_02: "Palacio de Nymeria" #NT!
 building_agot_EE_nymeria_palace_02_desc: "El Palacio de Nymeria, que se alza una vez más con orgullo en el corazón de Ny Sar, ha sido meticulosamente restaurado, un testimonio de la resistencia y el patrimonio de Rhoynish. El vibrante mármol verde y rosa brilla bajo el sol, mientras que grandes cúpulas y altísimas agujas ahora dominan el horizonte, casi borrando los recuerdos de su trágico pasado." #NT!
  
 building_agot_EE_palace_of_love_01: "Palacio del dolor" #NT!
 building_type_agot_EE_palace_of_love_01: "Palacio del dolor" #NT!
 building_agot_EE_palace_of_love_01_desc: "El Palacio de los Dolores es un sombrío recordatorio del destino que corrió Chroyane, la Ciudad Festiva. Sus torres en ruinas, cubiertas de musgo y enredaderas oscuras, no revelan nada de la belleza que alguna vez encarnó el Palacio del Amor. Estatuas hundidas y hombres de piedra ahora rondan por sus brumosos y arruinados pasillos." #NT!
  
 building_agot_EE_palace_of_love_02: "Palacio del Amor" #NT!
 building_type_agot_EE_palace_of_love_02: "Palacio del Amor" #NT!
 building_agot_EE_palace_of_love_02_desc: "El Palacio del Amor adorna una vez más las orillas del Rhoyne, un impresionante renacimiento de la antigua gloria de Chroyane. Sus torres se elevan alto, adornadas con vibrantes mosaicos y delicadas tallas que celebran la vida, la belleza y el amor. La luz del sol brilla en las resplandecientes fuentes que alimentan los exuberantes jardines, derramando flores sobre cada terraza. Bajo sus grandes cúpulas se vuelven a bendecir los matrimonios; llenando a Chroyane con la promesa de nuevos comienzos." #NT!
  
 building_agot_EE_bridge_of_dream_01: "Puente del sueño" #NT!
 building_type_agot_EE_bridge_of_dream_01: "Puente del sueño" #NT!
 building_agot_EE_bridge_of_dream_01_desc: "El Puente del Sueño, que alguna vez rivalizó con el Puente Largo de Volantis, ahora se cierne sobre el Rhoyne envuelto en una espesa niebla. Sus arcos de piedra solían elevarse doce metros sobre el río, pero se han derrumbado bajo el denso musgo y las enredaderas negras. Ahora es un lugar para los hombres de piedra y se erige como un monumento silencioso y podrido al orgullo perdido de Rhoynar." #NT!
  
 building_agot_EE_bridge_of_dream_02: "Puente del sueño" #NT!
 building_type_agot_EE_bridge_of_dream_02: "Puente del sueño" #NT!
 building_agot_EE_bridge_of_dream_02_desc: "El Puente del Sueño una vez más cruza el Rhoyne en todo su esplendor. Sus arcos de piedra pálida, que se elevan doce metros sobre el río, se alzan fuertes y desafiantes. Exuberantes jardines se alinean en el tramo de madera del puente, llenos de flores de todos los colores. Este gran puente, una vez perdido por el tiempo y la ruina; ha renacido. ¡Un símbolo del orgullo y la resistencia de Rhoynish sobre las aguas que fluyen del Rhoyne una vez más!" #NT!
  
   # Meereen 
 building_agot_EE_great_pyramid_of_meereen: "La Gran Pirámide de Meereen" #NT!
 building_type_agot_EE_great_pyramid_of_meereen: "La Gran Pirámide de Meereen" #NT!
 building_agot_EE_great_pyramid_of_meereen_desc: "Con diferencia, el edificio más grande de la ciudad, la Gran Pirámide de Meereen, fue construida por un pequeño ejército de esclavos, mil de los cuales murieron durante su construcción. La pirámide sirve como centro administrativo de Meereen y los gobernantes de la ciudad han utilizado el gran Salón para recibir a sus súbditos durante siglos." #NT!
  
   # Asshai 
 building_stygai_01: "Ciudad encantada de Stygai" #NT!
 building_type_stygai_01: "Stygai" #NT!
 building_stygai_01_desc: "Stygai, la enigmática y antigua ciudad envuelta en el oscuro corazón de las Tierras Sombrías, sigue siendo uno de los misterios del mundo que más miedo provoca. Insondablemente antigua y envuelta en una oscuridad eterna, la ciudad se erige como un monumento a una época olvidada. Ni siquiera los vinculadores de sombras más atrevidos se atreven a aventurarse en sus calles abandonadas. Se dice que las imponentes agujas y los callejones laberínticos son recorridos tanto por demonios como por criaturas. Velado en secreto, sus verdaderos orígenes y el alcance de sus oscuros poderes siguen siendo desconocidos." #NT!
  
   # Gogossos 
 building_red_citadel_01: "La Torre Roja" #NT!
 building_type_red_citadel_01: "La Torre Roja" #NT!
 building_red_citadel_01_desc: "Una gran torre costera, que se cree que es el último vestigio de una otrora poderosa fortaleza, ahora sirve como el principal bastión de la ciudad. Aunque gran parte de la estructura original se ha perdido en el tiempo, este bastión solitario perdura: pequeño pero increíblemente resistente y altamente defendible. Gruesos muros de piedra erosionada se mantienen firmes tanto contra los elementos como contra posibles asedios, lo que lo convierte en una sede confiable de autoridad dentro de Gogossos. Si bien aún no es una gran ciudadela, sigue siendo una fortaleza formidable, una base sobre la cual algún día podrían levantarse fortificaciones mayores." #NT!
  
 building_red_citadel_02: "El Reducto Rojo" #NT!
 building_type_red_citadel_02: "El Reducto Rojo" #NT!
 building_red_citadel_02_desc: "Ahora reforzado con una resistente empalizada de madera y torres de vigilancia sobre los antiguos Restos Carmesí, este reducto se ha convertido en una fortaleza más formidable, capaz de resistir amenazas prolongadas. Ya no es solo una torre costera solitaria, las defensas ampliadas ahora le permiten mantener una guarnición decente, proporcionando un fuerte punto de apoyo dentro de Gogossos. Con amplios suministros y posiciones reforzadas, podría incluso sostener un ejército durante meses si fuera necesario, marcando su transformación de una mera reliquia del pasado a un verdadero bastión de poder dentro de la ciudad." #NT!
  
 building_red_citadel_03: "La ciudadela roja" #NT!
 building_type_red_citadel_03: "La ciudadela roja" #NT!
 building_red_citadel_03_desc: "La Ciudadela Roja, que alguna vez fue una reliquia en decadencia, ha sido reconstruida para convertirse en una enorme fortaleza que domina Gogossos, con sus imponentes muros de piedra negra valyria que se erigen como un sombrío monumento al poder. Al igual que la Puerta Carmesí, sus piedras estaban teñidas de carmesí por antiguos rituales de magia de sangre, y su legado perduró mucho después de que la hechicería desapareciera. Los susurros afirman que la Muerte Roja comenzó aquí, y el recuerdo de la maldición aún resuena en cámaras ocultas donde una vez los moribundos gritaron. Más que una fortaleza, la Ciudadela Roja sigue siendo el corazón despiadado de Gogossos: un lugar donde la autoridad es absoluta y la rebelión muere antes de que pueda tomar forma." #NT!
  
 building_pit_of_sorrows_01: "Fortaleza y ruinas cubiertas de maleza" #NT!
 building_type_pit_of_sorrows_01: "Fortaleza y ruinas cubiertas de maleza" #NT!
 building_pit_of_sorrows_01_desc: "Una torre del homenaje en ruinas, cuyos alguna vez poderosos muros ahora están cubiertos de enredaderas y tragados por el implacable abrazo de la naturaleza, se encuentra en un silencio inquietante. Los árboles han echado raíces en sus patios, y sus ramas retorcidas arañan el cielo, como si fueran testigos de horrores olvidados.\n\nA pesar del deterioro, la torre del homenaje sigue siendo extrañamente defendible: sus torres, aunque desgastadas, todavía se alzan con una presencia imponente. Su puerta, medio enterrada en musgo y escombros, sugiere una fortaleza que se niega a ceder por completo al tiempo.\n\nSin embargo, algo parece profundamente mal en este lugar. El aire está cargado de una quietud antinatural, de ésas que hacen que la piel se eriza y la mente se inquieta. Las sombras permanecen donde no deberían, y los susurros, demasiado débiles para ser el viento, parecen flotar entre las ruinas, insinuando secretos que es mejor no tocar." #NT!
  
 building_pit_of_sorrows_02: "Excavaciones de torres y pozos" #NT!
 building_type_pit_of_sorrows_02: "Excavaciones de torres y pozos" #NT!
 building_pit_of_sorrows_02_desc: "A medida que ampliamos nuestros esfuerzos y despejamos la espesa maraña de vegetación, hicimos un descubrimiento sorprendente: el suelo debajo de nosotros parecía descender sin fin, sin importar cuánto barro y escombros quitáramos. Lo que al principio parecía ser una simple maleza que ocultaba las ruinas pronto se reveló como un vasto descenso en capas, cada nivel inferior exponía restos del pasado.\n\nEntre la mampostería desmoronada y la tierra húmeda, desenterramos innumerables huesos, sus orígenes desconocidos, sus historias perdidas hace mucho tiempo. Con cada paso hacia abajo, una certeza creciente se apoderó de él: este puede ser, de hecho, el legendario Pozo de las Penas, un lugar del que se susurra una leyenda aterradora, con sus profundidades intactas y sus misterios aún esperando ser desvelados." #NT!
  
 building_pit_of_sorrows_03: "El pozo de las penas" #NT!
 building_type_pit_of_sorrows_03: "El pozo de las penas" #NT!
 building_pit_of_sorrows_03_desc: "El antiguo Pozo de las Penas, que alguna vez fue una ruina en ruinas, ha sido reconstruido minuciosamente y restaurado para recuperar su antigua y siniestra grandeza. Sin embargo, a pesar de todos los esfuerzos por recuperar sus zonas superiores, las verdaderas profundidades siguen siendo un abismo insondable. La oscuridad inferior se extiende infinitamente, tragándose luz y sonido por igual, unas fauces abiertas hacia lo desconocido. Muchos se han atrevido a descender en busca de secretos perdidos en el tiempo, pero ninguno ha regresado para hablar de lo que hay en el fondo, si es que realmente existe un fondo." #NT!
  
 building_the_toad: "El sapo negro" #NT!
 building_type_the_toad: "el sapo negro" #NT!
 building_the_toad_desc: "La estatua más grande jamás construida en la Isla de los Sapos se alza sobre el paisaje, una reliquia monolítica de una civilización desaparecida hace mucho tiempo. Tallado en una piedra negra aceitosa desconocida que parece brillar incluso en ausencia de luz, toma la forma de un gran sapo: achaparrado, grotesco e inquietantemente realista. Nadie sabe quién lo construyó, ni con qué propósito, y cualquier significado que alguna vez tuvo se ha perdido en el tiempo. Para la mayoría, no es más que una efigie tosca y siniestra, una extraña curiosidad en una tierra ya llena de misterio. Sin embargo, hay susurros, hablados en voz baja por los lugareños, sobre sueños extraños que tienen quienes duermen demasiado cerca, sobre un calor inquietante en la piedra cuando se toca y sobre ojos que parecen brillar justo debajo de su superficie, como si algo observara desde dentro." #NT!
 building_type_the_toad_desc: "La estatua más grande jamás construida en la Isla de los Sapos se alza sobre el paisaje, una reliquia monolítica de una civilización desaparecida hace mucho tiempo. Tallado en una piedra negra aceitosa desconocida que parece brillar incluso en ausencia de luz, toma la forma de un gran sapo: achaparrado, grotesco e inquietantemente realista. Nadie sabe quién lo construyó, ni con qué propósito, y cualquier significado que alguna vez tuvo se ha perdido en el tiempo. Para la mayoría, no es más que una efigie tosca y siniestra, una extraña curiosidad en una tierra ya llena de misterio. Sin embargo, hay susurros, hablados en voz baja por los lugareños, sobre sueños extraños que tienen quienes duermen demasiado cerca, sobre un calor inquietante en la piedra cuando se toca y sobre ojos que parecen brillar justo debajo de su superficie, como si algo observara desde dentro." #NT!
  
 building_ax_hold: "El hacha" #NT!
 building_type_ax_hold: "El hacha" #NT!
 building_ax_hold_desc: "La fortaleza de la Casa Xhore es a la vez un santuario y una fortaleza, un bastión de piedra y acero construido para soportar las tempestades de las Islas Basilisco. Ubicado sobre acantilados escarpados y rodeado de aguas traicioneras, fue diseñado no sólo como un hogar, sino también como una fortaleza inquebrantable desde la cual los piratas Qartheen de las Islas Occidentales podían lanzar sus infames incursiones. Sus murallas, erosionadas pero formidables, muestran las cicatrices de innumerables batallas, mientras que sus imponentes torres de vigilancia ofrecen una vista ininterrumpida del mar circundante, siempre atento tanto a sus presas como a sus perseguidores." #NT!
  
 building_garden_of_malice_01: "Un gran fuerte cubierto de maleza" #NT!
 building_type_garden_of_malice_01: "Un gran fuerte cubierto de maleza" #NT!
 building_garden_of_malice_01_desc: "Un vasto muro circular cubierto de maleza rodea las ruinas, sus piedras antiguas apenas visibles debajo de capas de enredaderas trepadoras y musgo espeso. En su corazón se alza una torre del homenaje en ruinas, con sus torres rotas y medio devoradas por el implacable abrazo de la naturaleza. El tiempo ha borrado cualquier historia que alguna vez haya tenido este lugar, dejando solo un silencio inquietante y asfixiante a su paso.\n\nSin embargo, aquellos que se atreven a traspasar las puertas destrozadas rápidamente se dan cuenta de por qué nadie ha reclamado estas ruinas: este lugar es una trampa mortal. Los setos retorcidos, que se han vuelto salvajes y antinaturales, forman un intrincado laberinto, cuyos caminos se mueven y se cierran como seres vivos, llevando a los incautos a una confusión aún mayor. Entre la enmarañada vegetación se esconden plantas de colores imposibles y formas antinaturales, cuya belleza enmascara una intención mortal. Algunas liberan esporas que asfixian los pulmones, otras secretan toxinas que ampollan la piel y algunas se mueven con un propósito inquietante, esperando que su presa se acerque demasiado.\n\nLas leyendas susurran que algo (tal vez los restos de una hechicería olvidada o la presencia persistente de cualquier fuerza que alguna vez gobernó aquí) mantiene la flora prosperando de maneras que desafían a la naturaleza. Las ruinas permanecen intactas, no porque hayan sido olvidadas, sino porque se les teme. Incluso los asaltantes y buscadores de tesoros más audaces saben que no deben tentar la ira de un lugar donde las mismas plantas parecen tener hambre de sangre." #NT!
  
 building_garden_of_malice_02: "El jardín de la malicia" #NT!
 building_type_garden_of_malice_02: "El jardín de la malicia" #NT!
 building_garden_of_malice_02_desc: "El Jardín de la Malicia es una fortaleza de muerte en capas, construida con piedra negra aceitada y rodeada de defensas mortales. Lo rodea un vasto y cambiante laberinto de enredaderas espinosas, flores tóxicas y setos retorcidos, donde la luz apenas penetra y acechan depredadores invisibles. Más allá del laberinto se encuentra un foso negro lleno de horrores y muros imponentes custodiados por centinelas silenciosos. En su centro se alza una torre del homenaje valyria, intacta por el tiempo, coronada por un árbol petrificado cuyas raíces parecen alimentarse de la propia fortaleza. Más que una fortaleza, el Jardín es un lugar donde la propia tierra busca destruir a los intrusos." #NT!
  
 building_sapphire_quarter: "El barrio del zafiro" #NT!
 building_type_sapphire_quarter: "El barrio del zafiro" #NT!
 building_sapphire_quarter_desc: "El Barrio Zafiro es un vasto distrito amurallado situado en lo alto de la colina más alta de Gogossos. Lo que alguna vez fue dominio del [dragonlords|El] en la antigüedad, ahora sirve como enclave exclusivo de los amos de esclavos y príncipes comerciantes más ilustres de la ciudad. Sólo la élite puede residir dentro de sus muros, ya que aquí sólo se alzan grandes mansiones y palacios, construidos con mármol reluciente y adornados con oro. Sus mercados privados están cubiertos de las mejores sedas, reservados para aquellos que pueden permitirse lujos fuera del alcance de los hombres inferiores." #NT!
  
 building_crimson_gate: "La puerta carmesí" #NT!
 building_type_crimson_gate: "La puerta carmesí" #NT!
 building_crimson_gate_desc: "La Puerta Carmesí es la única entrada terrestre a Gogossos, un imponente bastión de Valyrian Blackstone que se cierne sobre el traicionero puente que conduce a la ciudad. Su superficie bebe luz, impregnada de oscura hechicería y teñida de carmesí por antiguos rituales de sangre. Con una altura de 140 pies, la puerta de entrada irradia asombro y pavor, sus paredes están coronadas con estatuas de dragones cuyos ojos de piedras preciosas parecen casi vivos. Más que una barrera, la Puerta Carmesí es un monumento al poder olvidado de Gogossos y al oscuro legado de Valyria." #NT!
  
 building_glittering_pits_01: "Los pozos brillantes" #NT!
 building_type_glittering_pits_01: "Los pozos brillantes" #NT!
 building_glittering_pits_01_desc: "Las selvas de Gogossos y la infame Isla de las Lágrimas son un desierto vasto e indómito, una tierra repleta de peligros y riquezas inimaginables. Un verdadero tesoro de recursos naturales, el denso y sombreado follaje esconde maravillas sin medida para aquellos lo suficientemente audaces como para enfrentar sus peligros.\n\nEntre los tesoros más codiciados se encuentran los diamantes y zafiros, que brillan en lo profundo de la tierra como la esencia atrapada de las estrellas. Estas gemas preciosas, raras y de una calidad incomparable, han convertido a la región en una leyenda susurrada entre comerciantes y buscadores de fortuna. Aunque las minas aquí siguen siendo pequeñas pero poderosas, sus rendimientos son asombrosos y cada excavación descubre piedras de un brillo impresionante." #NT!
  
 building_glittering_pits_02: "Las cavernas relucientes" #NT!
 building_type_glittering_pits_02: "Las cavernas relucientes" #NT!
 building_glittering_pits_02_desc: "A medida que las minas crecen, se expanden hasta convertirse en una extensa red de túneles subterráneos, que se abren paso a través del suelo de la jungla como las raíces de los árboles centenarios de arriba. Las paredes brillan con piedras preciosas, sus colores se reflejan en la tenue luz de las antorchas, y se descubren cámaras ocultas que revelan ricas vetas esperando ser cosechadas. Sin embargo, a medida que los mineros excavan más profundamente, la jungla comienza a retroceder: las raíces atraviesan las paredes, las esporas tóxicas permanecen en el aire y extrañas criaturas invisibles se mueven en la oscuridad." #NT!
  
 building_glittering_pits_03: "Las profundidades iluminadas por las estrellas" #NT!
 building_type_glittering_pits_03: "Las profundidades iluminadas por las estrellas" #NT!
 building_glittering_pits_03_desc: "Starlit Depths es la parte más rica y peligrosa de las minas de Gogosita: un vasto laberinto de túneles y cavernas relucientes donde zafiros impecables y diamantes enormes captan incluso la luz más tenue, asemejándose a un cielo estrellado bajo tierra. Los mineros trabajan incansablemente para extraer estos tesoros, aunque cuanto más profundizan, más peligroso se vuelve. En las cámaras más bajas, extraños temblores, calor opresivo y avistamientos susurrados de cosas antinaturales han hecho que algunas áreas estén prohibidas. Es un lugar de gran riqueza y mayor riesgo, donde cavar demasiado profundo puede despertar algo que es mejor dejar enterrado." #NT!
  
 building_darkreach_quay_01: "Muelle Darkreach" #NT!
 building_type_darkreach_quay_01: "Muelle Darkreach" #NT!
 building_darkreach_quay_01_desc: "Darkreach Quay es el humilde pero vital corazón del comercio de Gogossos, la primera etapa de la gran infraestructura portuaria de la ciudad. Un modesto puerto de piedra y madera, se extiende hasta las oscuras aguas de la bahía, y sus desgastados muelles crujen bajo el peso de los barcos que llegan. Aunque es pequeño, está estratégicamente ubicado para servir como principal punto de entrada para comerciantes, contrabandistas y aventureros que buscan fortuna en Gogossos." #NT!
  
 building_darkreach_quay_02: "Puerto de alcance oscuro" #NT!
 building_type_darkreach_quay_02: "Puerto de alcance oscuro" #NT!
 building_darkreach_quay_02_desc: "Con la expansión del imperio comercial de Gogossos, Darkreach Harbour se ha convertido en un bullicioso centro de comercio, mucho más allá de sus humildes comienzos. Los muelles han sido reforzados con piedra y madera resistente, lo que permite a los buques mercantes más grandes anclar y descargar de forma segura su carga exótica. Nuevos muelles se adentran más en las aguas oscuras y dan cabida a un flujo cada vez mayor de barcos procedentes de tierras lejanas, atraídos por las riquezas de los zafiros, los diamantes y los raros bienes de la jungla de Gogossos." #NT!
  
 building_darkreach_quay_03: "El puerto de marea negra" #NT!
 building_type_darkreach_quay_03: "El puerto de marea negra" #NT!
 building_darkreach_quay_03_desc: "Con el renacimiento de Gogossos, su otrora humilde puerto comercial se ha convertido en el Puerto de Marea Negra, un colosal bastión de comercio y poder naval. Ya no es solo un punto de referencia para los comerciantes, sino que se ha convertido en un próspero epicentro del comercio internacional, que atrae a comerciantes, mercenarios y buscadores de fortuna de todo el mundo conocido.\n\nEl puerto ahora está fortificado con la antigua Piedra Negra Valyria, y sus poderosos muros rodean los bulliciosos muelles y ofrecen una defensa inigualable contra incursiones y asedios. Estas imponentes almenas, reconstruidas a partir de las ruinas del pasado, son un testimonio del resurgimiento de la ciudad, lo que garantiza que la riqueza y la influencia de Gogossos sigan siendo intocables." #NT!
  
 building_last_dragon_tower_01: "La última torre del dragón" #NT!
 building_type_last_dragon_tower_01: "La última torre del dragón" #NT!
 building_last_dragon_tower_01_desc: "La última Torre del Dragón superviviente fuera de [valyria|E], construida en los últimos días antes del [doom|E], se erige como un monumento tanto al poder como a la tragedia. Originalmente construido para albergar a la familia gobernante [dragonlord|E] de Gogossos, sus salones estaban destinados a ser un símbolo de su reinado eterno, pero el destino demostró lo contrario. Cuando la familia murió en el [doom_of_valyria|E], la torre se convirtió en una reliquia silenciosa de un imperio perdido, y su presencia proyecta una larga sombra sobre la ciudad.\n\nAhora, sirve a un nuevo maestro: el arconte más poderoso de Gogossos y su familia, que gobiernan desde sus elevadas alturas. La Torre del Dragón ya no es sólo un símbolo de la grandeza valyria, sino que es un recordatorio para las clases inferiores, los esclavos y los aspirantes a rebeldes de la brutal jerarquía de la ciudad. Se erige como un testimonio inquebrantable de dominio, una advertencia siempre presente de que la élite de Gogossos aplastará a cualquiera que se atreva a levantarse contra ellos." #NT!
  
   # Valyria 
 building_type_valyria_volcano: "Una de las catorce llamas" #NT!
 building_valyria_volcano_01: "Monte Gaelitox" #NT!
 building_type_valyria_volcano_01: "$building_type_valyria_volcano$" #NT!
 building_valyria_volcano_01_desc: "Gaelithox es uno de los volcanes más formidables entre las legendarias Catorce Llamas de [valyria|E]. Elevándose sobre el paisaje circundante, su cima está perpetuamente envuelta en un espeso velo de humo y cenizas. Las laderas del volcán están marcadas por antiguos flujos de lava, ahora solidificados en formaciones rocosas negras irregulares, restos del [doom|E]." #NT!
  
 building_valyria_volcano_02: "Rhazalhar" #NT!
 building_type_valyria_volcano_02: "$building_type_valyria_volcano$" #NT!
 building_valyria_volcano_02_desc: "Rhazalhar es la más grande de las Catorce Llamas, un coloso de furia fundida y poder antiguo. Su cima, constantemente velada por el humo y las cenizas, perfora el cielo y proyecta su sombra sobre el paisaje circundante. Ríos de lava fluyen desde su núcleo ardiente, trazando senderos luminosos a través de la oscura roca volcánica. Debido a las temperaturas extremas alrededor del volcán, la minería es imposible." #NT!
  
 building_valyria_volcano_03: "Epaekros" #NT!
 building_type_valyria_volcano_03: "$building_type_valyria_volcano$" #NT!
 building_valyria_volcano_03_desc: "Epaekros es más peligroso que otros volcanes, una belleza salvaje con acantilados inestables que arrojan rocas sobre los excursionistas y terrenos resbaladizos que provocan caídas mortales. Aquellos que alcanzan su cima a menudo encuentran un final trágico debido a un gusano de fuego anidando o [dragon|El]. Sin embargo, para quienes logran adentrarse en el volcán, abundan las riquezas, el oro y los metales preciosos." #NT!
  
 building_valyria_volcano_04: "tártaro" #NT!
 building_type_valyria_volcano_04: "$building_type_valyria_volcano$" #NT!
 building_valyria_volcano_04_desc: "Elevándose hacia el cielo, aunque no tan alto como Rhazalhar, Tartarax es un volcán más delgado pero más profundo cuya cumbre de forma curiosa proporciona un lugar de anidación ideal para cualquier criatura amante del fuego. Sus profundas cavernas y túneles ofrecen amplias oportunidades mineras pero también muerte. En esta oscura y profunda mazmorra abundan la lava y las criaturas hostiles. Sin embargo, el brillo de su majestuosa lava, visible desde lejos en la oscuridad de la noche, sigue siendo inolvidable." #NT!
  
 building_valyria_volcano_05: "Yontaryos" #NT!
 building_type_valyria_volcano_05: "$building_type_valyria_volcano$" #NT!
 building_valyria_volcano_05_desc: "Cuando Yontaryos fue descubierto por primera vez por los antiguos valyrios, se diferenciaba de los demás volcanes de la región. Era pequeño y relativamente bajo, con poco magma y espacio limitado para que anidaran los dragones. Sin embargo, tenía sus usos. Aún se podían extraer minerales preciosos de él, y su pequeño tamaño lo hacía ideal para rituales y sacrificios, aunque sus llamas no ardían con tanta intensidad como las demás." #NT!
  
 building_type_elyria_great_port_01: "El gran puerto de Elyria" #NT!
 building_elyria_great_port_01: "El gran puerto de Elyria" #NT!
 building_elyria_great_port_01_desc: "El Gran Puerto de Elyria es un inmenso astillero construido durante los días del [valyrian_freehold_short|E]. La posición estratégica de Elyria en la Bahía de los Esclavos proporciona a esta pequeña isla un importante tráfico de barcos, comercio y esclavos, que este enorme puerto puede albergar. Tras el colapso del [valyrian_freehold_short|E], este puerto captó una parte importante del comercio de la Bahía de los Esclavos, convirtiéndose en la envidia de la región y sus alrededores." #NT!
  
 building_type_elyria_dragon_palace_01: "El Palacio del Dragón de Elyria" #NT!
 building_elyria_dragon_palace_01: "El Palacio del Dragón de Elyria" #NT!
 building_elyria_dragon_palace_01_desc: "El Palacio del Dragón es una estación grandiosa y lujosa que ofrece todo lo que un señor podría desear: grandes salas, inmensos salones de banquetes, piscinas, bodegas y mucho más. Construido durante la era del [valyrian_freehold_short|E] para albergar al gobernador de Elyria, no se repararon en gastos. Hoy alberga al duque de Elyria, otorgándole esplendor y renombre." #NT!
  
 building_valyria_dead_volcano_01: "Sirabelos" #NT!
 building_type_valyria_dead_volcano_01: "$building_type_valyria_volcano$" #NT!
 building_valyria_dead_volcano_01_desc: "Syrabelos es un volcán extinto, la lava que una vez fluyó a través de él hace tiempo que se secó. Esto no significa que sea inútil, ya que sigue siendo rico en minerales y metales preciosos para explotar y aún puede servir como refugio durante incursiones o tormentas." #NT!
  
 building_valyria_dead_volcano_01_02: "Minas de Syrabelos" #NT!
 building_type_valyria_dead_volcano_01_02: "$building_type_valyria_volcano$" #NT!
 building_valyria_dead_volcano_01_02_desc: "Se han restablecido las operaciones mineras en Syrabelos. Los esclavos descienden diariamente a los pozos para extraer metales preciosos y otros materiales valiosos para sus opresores." #NT!
  
 building_valyria_dead_volcano_02: "Qazdarsos" #NT!
 building_type_valyria_dead_volcano_02: "$building_type_valyria_volcano$" #NT!
 building_valyria_dead_volcano_02_desc: "Qazdarsos alguna vez fue un volcán activo, pero ya no lo es. Ahora inactivo pero no silencioso, todavía se pueden escuchar desde sus profundidades los gritos de los vermis de fuego y, según algunos, incluso los fantasmas. Algunos se han atrevido a aventurarse allí sin un grupo lo suficientemente numeroso y nunca más fueron vistos." #NT!
  
 building_valyria_dead_volcano_02_02: "Qazdarsos" #NT!
 building_type_valyria_dead_volcano_02_02: "$building_type_valyria_volcano$" #NT!
 building_valyria_dead_volcano_02_02_desc: "Las minas de Qazdarsos vuelven a estar en pleno funcionamiento. Los esclavos extraen riqueza y oro diariamente para sus amos. Sin embargo, persisten historias de seres sobrenaturales y criaturas malditas en el interior del volcán. Si esto es cierto o simplemente divagaciones de esclavos es otra cuestión..." #NT!
  
 building_royal_barracks_of_valyria_01: "El cuartel en ruinas de Valyria" #NT!
 building_type_royal_barracks_of_valyria_01: "El cuartel en ruinas de Valyria" #NT!
 building_royal_barracks_of_valyria_01_desc: "Lo que alguna vez fue un gran cuartel [valyrian_freehold_short|E] destinado a defender la ciudad, ahora está en ruinas y es poco más que un montón de escombros." #NT!
 building_type_royal_barracks_of_valyria_01_desc: "Lo que alguna vez fue un gran cuartel [valyrian_freehold_short|E] destinado a defender la ciudad, ahora está en ruinas y es poco más que un montón de escombros." #NT!
  
 building_royal_barracks_of_valyria_02: "El Cuartel Real de Valyria" #NT!
 building_type_royal_barracks_of_valyria_02: "El Cuartel Real de Valyria" #NT!
 building_royal_barracks_of_valyria_02_desc: "El restaurado Cuartel Real de Valyria, construido sobre las antiguas ruinas, ahora ve guardias y soldados yendo y viniendo para garantizar la seguridad de viajeros y ciudadanos." #NT!
  
 building_great_arena_of_valyria_01: "Los restos de la Gran Arena" #NT!
 building_type_great_arena_of_valyria_01: "Los restos de la Gran Arena" #NT!
 building_great_arena_of_valyria_01_desc: "Lo que alguna vez fue una gran arena llena de gladiadores y espectadores, ahora está en ruinas. Restaurarlo será costoso, pero podría devolver la alegría a la gente." #NT!
 building_type_great_arena_of_valyria_01_desc: "Lo que alguna vez fue una gran arena llena de gladiadores y espectadores, ahora está en ruinas. Restaurarlo será costoso, pero podría devolver la alegría a la gente." #NT!
  
 building_great_arena_of_valyria_02: "La Gran Arena de Valyria" #NT!
 building_type_great_arena_of_valyria_02: "La Gran Arena de Valyria" #NT!
 building_great_arena_of_valyria_02_desc: "Ahora reconstruida, la Gran Arena atrae a miles de espectadores para presenciar torneos y juegos sangrientos donde profesionales y esclavos mueren en la arena para entretener al pueblo." #NT!
  
 building_great_library_of_valyria_01: "Ruinas decrépitas de la biblioteca" #NT!
 building_type_great_library_of_valyria_01: "Ruinas decrépitas de la biblioteca" #NT!
 building_great_library_of_valyria_01_desc: "Los restos en ruinas de la gran biblioteca podrían restaurarse para albergar grandes obras de arte y literatura." #NT!
 building_type_great_library_of_valyria_01_desc: "Los restos en ruinas de la gran biblioteca podrían restaurarse para albergar grandes obras de arte y literatura." #NT!
  
 building_great_library_of_valyria_02: "La Gran Biblioteca de Valyria" #NT!
 building_type_great_library_of_valyria_02: "La Gran Biblioteca de Valyria" #NT!
 building_great_library_of_valyria_02_desc: "La restaurada Gran Biblioteca de Valyria, llena de grandes obras de arte, literatura y filosofía. Eruditos y académicos estudian aquí textos y pergaminos antiguos." #NT!
  
 building_valyria_veilspire_peak: "Pico Aguja del Velo" #NT!
 building_type_valyria_veilspire_peak: "Pico Aguja del Velo" #NT!
 building_valyria_veilspire_peak_desc: "Veilspire Peak es la cumbre montañosa más alta de toda la península Valyria, incluso antes del [doom|E]. Esta gran cumbre, que alguna vez fue utilizada como peregrinación sagrada para los más valientes y fuertes, representa una prueba divina. Se dice que aquellos que logran subir a la cima regresan más sabios y con más conocimientos." #NT!
  
 building_velakar_resort_01: "Un antiguo complejo en ruinas" #NT!
 building_type_velakar_resort_01: "Un antiguo complejo en ruinas" #NT!
 building_velakar_resort_01_desc: "Este complejo, que alguna vez fue un gran centro turístico para [dragonlords|El] y comerciantes ricos, ahora está en ruinas, poco mejor que un montón de ladrillos." #NT!
  
 building_velakar_resort_02: "El Ilustre Resort de Velakar" #NT!
 building_type_velakar_resort_02: "El Ilustre Resort de Velakar" #NT!
 building_velakar_resort_02_desc: "El ilustre resort de Velakar, ahora restaurado, da la bienvenida a personas adineradas y de estatus para bañarse y relajarse en este majestuoso resort digno de un emperador. Utilizando calor volcánico para calentar los baños y con miles de sirvientes a su servicio, es realmente un espectáculo digno de contemplar." #NT!
  
 building_aurions_lost_expedition: "La expedición perdida de Aurion" #NT!
 building_type_aurions_lost_expedition: "La expedición perdida de Aurion" #NT!
 building_aurions_lost_expedition_desc: "Se trata de la expedición perdida del autoproclamado Emperador de Valyria, Aurion Varezys. Esta llanura árida es ahora el lugar de enterramiento de 30.000 hombres, reducidos a meros montones de metal y huesos, contaminados por la radiación y los gases tóxicos de los géiseres de azufre. Es verdaderamente un paisaje infernal." #NT!
  
 building_type_lokirian_barracks_01: "Cuartel Lokiriano" #NT!
 building_type_lokirian_barracks_01_desc: "Los poderosos cuarteles de Lokirian, famosos por la calidad de sus armas." #NT!
 building_lokirian_barracks_01: "Los restos de un cuartel" #NT!
 building_lokirian_barracks_01_desc: "Una vez fueron los poderosos cuarteles de Lokiria, ahora reducidos a nada más que un montón de escombros." #NT!
 building_lokirian_barracks_02: "Cuartel parcialmente restaurado" #NT!
 building_lokirian_barracks_02_desc: "Aunque gran parte de su antigua grandeza se ha perdido, los cuarteles se han adaptado a su propósito. Los soldados entrenan en el interior y sus voces resuenan en los pasillos a medio terminar." #NT!
 building_lokirian_barracks_03: "Los poderosos cuarteles de Lokiria" #NT!
 building_lokirian_barracks_03_desc: "Los cuarteles de Lokiria, ahora reconstruidos y fortificados con piedra de dragón y acero valyrio. Los soldados marchan día y noche, presentando una vista imponente y una pesadilla para cualquiera que se atreva a sitiarlo." #NT!
  
  
 building_redwyrms_wrath_01: "Fortaleza en ruinas" #NT!
 building_type_redwyrms_wrath_01: "Fortaleza en ruinas" #NT!
 building_redwyrms_wrath_01_desc: "La Ira del Wyrm Rojo era una temible fortaleza hecha de muros de piedra de dragón y agujas imponentes, una vez adornada con cráneos de dragones asesinados como sombríos trofeos de sus conquistas. Gobernado por el Señor Protector Taurion de Lokiria, era un bastión de guerra y dominación, y sus estandartes carmesí inspiraban miedo en toda la tierra. Ahora en ruinas, la Ira del Wyrm Rojo no es más que una sombra de su antigua gloria, con sus muros rotos y sus estandartes descoloridos como reliquias del violento reinado de Lokiria." #NT!
  
 building_redwyrms_wrath_02: "La ira del Wyrm Rojo" #NT!
 building_type_redwyrms_wrath_02: "Fortaleza en ruinas" #NT!
 building_redwyrms_wrath_02_desc: "La Ira del Wyrm Rojo ha resurgido de nuevo, sus muros de piedra de dragón han sido restaurados a su sombría gloria, dominando el paisaje una vez más como un símbolo de terror y poder. Una vez más adornada con calaveras [dragon|El] y estandartes carmesí con el sello del Dragón Rojo de Lokiria, la fortaleza exuda una oscura determinación. Reconstruido como un monumento a la guerra y una declaración de dominio, la Ira del Wyrm Rojo inspira miedo y respeto, y su renacimiento es un testimonio de un legado duradero de conquista." #NT!
  
 building_valyrian_gate_01: "Ruinas de la puerta" #NT!
 building_type_valyrian_gate_01: "Ruinas de la puerta" #NT!
 building_valyrian_gate_01_desc: "Ruinas de la otrora gran Puerta de Valyria, un poderoso símbolo de riqueza y poder, ahora nada más que un montón de ladrillos." #NT!
 building_type_valyrian_gate_01_desc: "Ruinas de la otrora gran Puerta de Valyria, un poderoso símbolo de riqueza y poder, ahora nada más que un montón de ladrillos." #NT!
  
 building_valyrian_gate_02: "La Gran Puerta Valyria" #NT!
 building_type_valyrian_gate_02: "La Gran Puerta Valyria" #NT!
 building_valyrian_gate_02_desc: "La Gran Puerta de Valyria, siete puertas y siete rastrillos fabricados y reforzados con Valyrian Steel. Miles de comerciantes y viajeros pasan por estas puertas. Encima de la entrada se pueden ver estatuas gigantes de héroes que alguna vez fueron grandes." #NT!
  
 building_great_harbor_of_valyria_01: "Bahía por puerto" #NT!
 building_type_great_harbor_of_valyria_01: "El gran puerto de Valyria" #NT!
 building_great_harbor_of_valyria_01_desc: "Esta bahía es lo suficientemente grande y profunda como para construir aquí un gran puerto. Por ahora no hay mucho aquí, excepto pescado." #NT!
 building_type_great_harbor_of_valyria_01_desc: "Esta bahía es lo suficientemente grande y profunda como para construir aquí un gran puerto. Por ahora no hay mucho aquí, excepto pescado." #NT!
  
 building_great_harbor_of_valyria_02: "Muelles y Talleres de Reparación" #NT!
 building_type_great_harbor_of_valyria_02: "El gran puerto de Valyria" #NT!
 building_great_harbor_of_valyria_02_desc: "Para facilitar el comercio y la construcción naval, y establecer un rico centro comercial y control marítimo, necesitamos construir un gran puerto. Por ahora construiremos muelles largos y talleres de reparación para la producción de barcos. También agregaremos una cabina de intendencia para el comercio y una oficina de inspección para gravar y garantizar que ningún producto de contrabando ingrese a nuestra ciudad." #NT!
  
 building_great_harbor_of_valyria_03: "Muelles" #NT!
 building_type_great_harbor_of_valyria_03: "El gran puerto de Valyria" #NT!
 building_great_harbor_of_valyria_03_desc: "La construcción de muelles y la ampliación de la infraestructura actual nos permitirán dar cabida a más barcos y aumentar el comercio entrante. Estas ampliaciones también se utilizarán para atracar buques militares que presten servicio a nuestra flota." #NT!
  
 building_great_harbor_of_valyria_04: "Grúas y suministros para la construcción naval" #NT!
 building_type_great_harbor_of_valyria_04: "El gran puerto de Valyria" #NT!
 building_great_harbor_of_valyria_04_desc: "Al construir grúas grandes, podemos aumentar en gran medida la eficiencia de nuestro puerto y permitir que lleguen y partan más barcos. También construiremos un área de suministro para la construcción naval cerca del puerto para mejorar la eficiencia de la construcción de nuestros buques de guerra. Con este Gran Puerto nadie podrá desafiarnos en el mar." #NT!
  
 building_great_temple_of_valyria_01: "Colina para un templo" #NT!
 building_type_great_temple_of_valyria_01: "El Templo del Dragón de Valyria" #NT!
 building_great_temple_of_valyria_01_desc: "Para adorar y satisfacer a los Dioses, necesitaremos un Gran Templo. Afortunadamente, hay una colina cerca del Monte Tartarax que podríamos utilizar para construir un Magnífico e Ilustre Templo para nuestros Dioses Dragón. El hecho de que esté cerca de un volcán se adapta aún mejor a nuestras necesidades." #NT!
 building_type_great_temple_of_valyria_01_desc: "Para adorar y satisfacer a los Dioses, necesitaremos un Gran Templo. Afortunadamente, hay una colina cerca del Monte Tartarax que podríamos utilizar para construir un Magnífico e Ilustre Templo para nuestros Dioses Dragón. El hecho de que esté cerca de un volcán se adapta aún mejor a nuestras necesidades." #NT!
  
 building_great_temple_of_valyria_02: "Salón de oración y lugar de reunión" #NT!
 building_type_great_temple_of_valyria_02: "El Templo del Dragón de Valyria" #NT!
 building_great_temple_of_valyria_02_desc: "Comenzaremos con una sala de oración ricamente decorada y llena de costosos artefactos: esculturas de dragones y fuego, tapices que representan dragones, braseros y el mármol más fino que podamos encontrar. También crearemos una sala abierta separada para sacrificios humanos." #NT!
  
 building_great_temple_of_valyria_03: "Arena en llamas" #NT!
 building_type_great_temple_of_valyria_03: "El Templo del Dragón de Valyria" #NT!
 building_great_temple_of_valyria_03_desc: "Los valyrios siempre han quemado a sus muertos. Quemar a nuestros muertos en un Templo al lado de nuestro volcán es una manera mucho mejor de honrar a quienes han dejado este mundo. Ampliaremos la sala abierta que ya hemos construido para este fin. Se construirán columnas esculpidas, flores exóticas y un altar de piedra negra para reemplazar las piras de madera utilizadas para los sacrificios humanos y la cremación de los muertos." #NT!
  
 building_great_temple_of_valyria_04: "Estatuas de dragones" #NT!
 building_type_great_temple_of_valyria_04: "El Templo del Dragón de Valyria" #NT!
 building_great_temple_of_valyria_04_desc: "Ningún edificio en Valyria está realmente completo sin estatuas de dragones. Construiremos 14 estatuas, una por cada Dios. Cada estatua será única y majestuosa para honrar adecuadamente a nuestros Dioses." #NT!
  
 building_great_walls_of_valyria_01: "Restos insignificantes del muro" #NT!
 building_type_great_walls_of_valyria_01: "Los grandes muros de piedra negra de Valyria" #NT!
 building_great_walls_of_valyria_01_desc: "Esta zona es donde se encuentran los restos de las Grandes Murallas de Valyria. Ya no queda casi nada, ya que los muros fueron destruidos durante el [doom|E]. Los pocos restos que sobrevivieron están tan dañados que son inutilizables. Por supuesto, podríamos restaurar estos muros a su antigua grandeza, y deberíamos hacerlo. No hace falta decir que será una tarea muy costosa." #NT!
  
 building_great_walls_of_valyria_02: "Los grandes muros de piedra negra de Valyria" #NT!
 building_type_great_walls_of_valyria_02: "Los grandes muros de piedra negra de Valyria" #NT!
 building_great_walls_of_valyria_02_desc: "Las murallas de Valyria han sido completamente restauradas, imponentes y vastas, rodeando toda la ciudad. Estas enormes fortificaciones son tan anchas que doce carros podrían correr uno al lado del otro (¡toma eso, Volantis!). Torres de vigilancia y fosos ahora bordean el perímetro, ofreciendo capas adicionales de defensa. Las entradas están reforzadas con rastrillos y zonas de tiro, lo que hace que cualquier intento de invadir la ciudad por la fuerza sea casi imposible para cualquier atacante." #NT!
  
 building_great_dragonkeep_of_valyria_01: "Sitio del palacio" #NT!
 building_type_great_dragonkeep_of_valyria_01: "La Gran Fortaleza del Dragón de Valyria" #NT!
 building_great_dragonkeep_of_valyria_01_desc: "Hemos localizado un sitio potencial para un gran palacio. En el futuro, se convertirá en un lugar de grandeza. Pero por ahora, no hay mucho que destacar aquí." #NT!
 building_type_great_dragonkeep_of_valyria_01_desc: "Hemos localizado un sitio potencial para un gran palacio. En el futuro, se convertirá en un lugar de grandeza. Pero por ahora, no hay mucho que destacar aquí." #NT!
  
 building_great_dragonkeep_of_valyria_02: "Sentando las bases" #NT!
 building_type_great_dragonkeep_of_valyria_02: "La Gran Fortaleza del Dragón de Valyria" #NT!
 building_great_dragonkeep_of_valyria_02_desc: "Para albergar a los gobernantes de esta gran ciudad, necesitaremos un palacio imponente. No, el palacio más grande que el mundo haya visto jamás. Por supuesto, esto requerirá muchos esclavos y oro, pero estos recursos se pueden adquirir. Este palacio será un testimonio de la grandeza valyria. Comenzaremos con una torre del homenaje y continuaremos nuestra expansión desde allí." #NT!
  
 building_great_dragonkeep_of_valyria_03: "Paredes exteriores" #NT!
 building_type_great_dragonkeep_of_valyria_03: "La Gran Fortaleza del Dragón de Valyria" #NT!
 building_great_dragonkeep_of_valyria_03_desc: "Para garantizar que esta fortaleza sea inexpugnable, construiremos nuestros muros exclusivamente con piedra negra. Estos muros altos y gruesos repelerán a todos los enemigos e individuos no deseados. Construir muros gruesos y altos sólo con piedra negra será, por supuesto, muy costoso." #NT!
  
 building_great_dragonkeep_of_valyria_04: "Paredes interiores y decoración." #NT!
 building_type_great_dragonkeep_of_valyria_04: "La Gran Fortaleza del Dragón de Valyria" #NT!
 building_great_dragonkeep_of_valyria_04_desc: "Ahora que hemos construido los muros exteriores, necesitamos erigir muros interiores para aumentar la seguridad y mejorar la eficacia de nuestras fortificaciones. Se construirán puertas, rastrillos y almenas. Además, decoraremos la gran torre del homenaje con sedas, tapices, trofeos y muchas otras cosas para mostrar nuestro esplendor." #NT!
  
 building_procrazion_01: "Gran Castillo abandonado" #NT!
 building_type_procrazion_01: "procrasión" #NT!
 building_procrazion_01_desc: "Procrazion fue una vez un bastión del poder valyrio, ubicado en la cima de la montaña central en el corazón de la ciudad. Antes del [doom|E], este gran castillo sirvió como centro militar y político, actuando como centro de defensa para toda la región. Si bien gran parte de su estructura permanece intacta, el tiempo no ha sido amable con sus otrora gloriosos salones. Los puentes de piedra que alguna vez lo conectaron con la ciudad circundante ahora están destruidos y el interior muestra claros signos de deterioro. Las imponentes Torres del Dragón siguen en pie, pero sus cámaras están vacías y la forja que alguna vez estuvo activa ahora está inactiva. A pesar de esto, su posición elevada y sus limitados puntos de entrada aún brindan una ventaja estratégica. Aunque sigue siendo imponente, Procrazion no es más que una sombra de lo que era antes, esperando ser restaurada a su antigua gloria." #NT!
  
 building_procrazion_02: "procrasión" #NT!
 building_type_procrazion_02: "procrasión" #NT!
 building_procrazion_02_desc: "Procrazion ha sido restaurada a su antigua gloria, ubicándose orgullosamente en lo alto de la montaña en el corazón de la ciudad. Este gran castillo está nuevamente conectado a la ciudad mediante puentes reconstruidos, que ofrecen acceso sin necesidad de dragones. Las Torres del Dragón también han sido restauradas, proporcionando entrada y salida a las majestuosas criaturas, mientras que las torres en forma de cúpula brillan como lo hacían antes del [doom|E]. En su interior, está equipado con todas las comodidades que se esperan de un señor de la región, ofreciendo comodidad y lujo incluso durante un asedio. Se ha reactivado la forja única en un lado de la montaña, canalizando una vez más lava para crear armamento poderoso. Su posición elevada, combinada con su restauración y sus limitados puntos de entrada, garantiza que siga siendo casi inexpugnable, capaz de resistir cualquier amenaza. Ahora completamente restaurada, Procrazion sirve no sólo como fortaleza defensiva sino también como símbolo del resurgimiento de la ciudad." #NT!
  
 building_eternal_flame_temple_01: "Templo abandonado" #NT!
 building_type_eternal_flame_temple_01: "El Templo de la Llama Eterna" #NT!
 building_eternal_flame_temple_01_desc: "El Templo de la Llama Eterna era presumiblemente el lugar de conexión entre los Dioses Antiguos de Valyria y los guerreros Valyrios. Además de ser el centro religioso de la gente común, el templo alguna vez se levantó como símbolo del poder religioso de Valyria; ahora yace polvoriento y abandonado. Hoy en día, sigue siendo un vago recuerdo de lo que una vez fue un venerado Alto Templo de la cosmogonía valyria." #NT!
  
 building_eternal_flame_temple_02: "El Templo de la Llama Eterna" #NT!
 building_type_eternal_flame_temple_02: "El Templo de la Llama Eterna" #NT!
 building_eternal_flame_temple_02_desc: "El Templo de la Llama Eterna ahora ha sido renovado y es un símbolo de poder, religión y poder. Sus paredes restauradas cuentan las historias de los antiguos dioses y están llenas de leyendas que alguna vez sólo conocían los antiguos valyrios. La gente común ahora puede disfrutar del lujo y soñar con lo que podrían haber sido los dragones y la magia antes del [doom|E]. Los guerreros vienen y rezan para ser llenados con la ira y el poder de los dragones que los precedieron. El templo brilla intensamente como un faro de fe religiosa, esperanza y poder valyrio tanto antiguo como nuevo." #NT!
  
 building_red_guard_barracks_01: "Cuarteles abandonados" #NT!
 building_type_red_guard_barracks_01: "El cuartel de la Guardia Roja" #NT!
 building_red_guard_barracks_01_desc: "El alguna vez orgulloso cuartel general de la Guardia Roja de élite de la ciudad, ahora se encuentra abandonado y pegado a las antiguas murallas de la ciudad. El tiempo erosionó con todas sus fuerzas su entorno y su interior, donde las almenas rotas y la estructura oxidada hablan del abandono post-[doom|E]. En la parte trasera, dos torres Dragón ahora no son más que una reminiscencia de lo que alguna vez fue el poder militar. Las cámaras recién ahora están llenas de fantasmas del tiempo pasado y de la fuerza perdida. A pesar de su decadencia, estos cuarteles añoran una restauración para volver a convertirse en el formidable escudo de la ciudad." #NT!
  
 building_red_guard_barracks_02: "El cuartel de la Guardia Roja" #NT!
 building_type_red_guard_barracks_02: "El cuartel de la Guardia Roja" #NT!
 building_red_guard_barracks_02_desc: "Completamente restaurados hasta casi su poder valyrio, los Cuarteles de la Guardia Roja son el hogar renovado para los defensores de la ciudad, ubicados junto a las gloriosas murallas de la ciudad. La estructura de piedra recuerda su antigua gloria, fortalecida, poderosa y llena de historias y cicatrices. Las Dragon Towers apestan a vida y vitalidad, en la probabilidad de que dragones reales rugieran en las alturas. Los cuarteles ya no son recibidos por fantasmas, sino por la Guardia Roja de élite recientemente restaurada, llena de disciplina energizante, excelencia y gloria inigualables. En una compleja mezcla de tecnología antigua y nueva, el edificio ahora protege nuevamente la ciudad y protege a todos los que se encuentran en su interior." #NT!
  
 building_red_guard_training_compound_01: "Complejo de entrenamiento abandonado" #NT!
 building_type_red_guard_training_compound_01: "El complejo de entrenamiento de la Guardia Roja" #NT!
 building_red_guard_training_compound_01_desc: "Las paredes deterioradas no cuentan las historias de los ahora desaparecidos Guardias Rojos que entrenaban aquí. Este complejo de entrenamiento fue una vez un edificio respetado y admirado lleno de dragones, guerreros y líderes que ahora yace abandonado y vacío, incapaz de representar su energía y gloria olvidadas hace mucho tiempo. Aquí todavía se pueden encontrar armas, mazmorras y equipos oxidados, pero uno se pregunta cómo pudo haber sido durante su gloria." #NT!
  
 building_red_guard_training_compound_02: "El complejo de entrenamiento de la Guardia Roja" #NT!
 building_red_guard_training_compound_02_desc: "Fuerza, honor y poder es lo que uno puede encontrar al mirar el restaurado Complejo de Entrenamiento de la Guardia Roja. Lleno de hombres que hacen todo lo posible por honrarse a sí mismos al convertirse en parte de la Guardia Roja de Élite, el complejo alberga a estrategas, líderes y guerreros, todos con el objetivo de ser los mejores. Con gloriosos pilares que lo rodean con gracia y un tejado en alto con ventanas rojas para mostrar que el cielo es el único límite, este edificio ahora entrena a los más grandes guerreros y a los mejores líderes." #NT!
  
 building_type_zanpur_volcano_01: "Monte Zanpur" #NT!
 building_zanpur_volcano_01: "Monte Zanpur" #NT!
 building_zanpur_volcano_01_desc: "Zanpur es el volcán gemelo más occidental de las islas Marahai." #NT!
  
 building_type_yovesh_volcano_01: "Monte Yovesh" #NT!
 building_yovesh_volcano_01: "Monte Yovesh" #NT!
 building_yovesh_volcano_01_desc: "Yovesh es el volcán gemelo más oriental de las islas Marahai." #NT!

 #Colony 
  #Colony Buildings 
 building_type_local_markets_01: "Mercados Locales" #NT!
 building_local_markets_01: "Mercados Locales" #NT!
 building_local_markets_01_desc: "Una red de bulliciosos mercados donde los comerciantes venden sus productos, los agricultores comercializan sus cosechas y los artesanos venden sus artesanías. Estos mercados forman el corazón económico del asentamiento y garantizan un flujo constante de bienes, monedas y prosperidad." #NT!
  
 building_type_colony_quarries_01: "Canteras" #NT!
 building_colony_quarries_01: "canteras de piedra simples" #NT!
 building_colony_quarries_01_desc: "La piedra de cantera, de fácil acceso, proporciona materiales de construcción para las construcciones cercanas." #NT!
  
 building_type_colony_forestry_01: "Silvicultura" #NT!
 building_colony_forestry_01: "Campamentos madereros" #NT!
 building_colony_forestry_01_desc: "Los leñadores han instalado campamentos a lo largo de las afueras del bosque, asegurando una producción constante de troncos." #NT!
  
 building_type_colony_port_01: "Puertos" #NT!
 building_colony_port_01: "Puerto de la colonia" #NT!
 building_colony_port_01_desc: "Un puerto exclusivo que facilita el comercio y el transporte, impulsando la economía y la conectividad del asentamiento." #NT!
 building_type_colony_port_01_desc: "Un puerto exclusivo que facilita el comercio y el transporte, impulsando la economía y la conectividad del asentamiento." #NT!
  
   #Blockers 
 lv_wilderness_blocker_effect: "@warning_icon! #X Este edificio es un obstáculo que debe eliminarse actualizándolo por completo antes de que el asentamiento pueda convertirse en una propiedad adecuada#!" #NT!
 lv_wilderness_blocker_effect_mines: "$lv_wilderness_blocker_effect$\n@warning_icon! #X Los vermis de fuego tienen la posibilidad de surgir cada año y devastarán el asentamiento#!" #NT!
 lv_wilderness_blocker_effect_plague: "$lv_wilderness_blocker_effect$\n@warning_icon! #X Tiene posibilidades de iniciar un brote de peste cada año#!" #NT!
 lv_wilderness_blocker_effect_raid: "$lv_wilderness_blocker_effect$\n@warning_icon! #X Tiene posibilidades de iniciar redadas en el asentamiento cada año#!" #NT!
 lv_firewyrm_blocker_effect: "@warning_icon! #X Este edificio es un bloqueador que debe eliminarse matando al vermis de fuego en esta provincia antes de que el asentamiento pueda convertirse en una posesión adecuada #!" #NT!
  
   #Caves 
 building_type_unexplored_caves_01: "Cuevas inexploradas" #NT!
 building_unexplored_caves_01: "Profundidades inexploradas" #NT!
 building_unexplored_caves_01_desc: "Túneles oscuros y sinuosos se extienden bajo la superficie, intactos por la luz o el mapa. Los susurros resuenan a través de la piedra y cada paso corre el riesgo de despertar lo que yace oculto. Aquí reina lo desconocido y el peligro es una certeza." #NT!
 building_unexplored_caves_02: "Túneles marcados" #NT!
 building_unexplored_caves_02_desc: "Los exploradores han comenzado a abrir caminos en la oscuridad. Las marcas toscas y los campamentos improvisados ​​trazan los límites del entendimiento, pero mucho permanece envuelto en sombras. La amenaza disminuye, pero no desaparece." #NT!
 building_unexplored_caves_03: "Cavernas encuestadas" #NT!
 building_unexplored_caves_03_desc: "Las cuevas han revelado sus secretos. Se mapean los caminos, se catalogan los peligros y se logra la estabilidad. Aunque la precaución todavía tiene su lugar, las tierras salvajes subterráneas han sido controladas." #NT!
  
   #Firewyrms 
 building_type_firewyrm_lair: "Guarida de vermis de fuego" #NT!
 building_firewyrm_lair: "Guarida de vermis de fuego" #NT!
 building_firewyrm_lair_desc: "La tierra está plagada de túneles ennegrecidos y respiraderos humeantes. Un vermis de fuego se ha dejado ver o sentir: el ganado carbonizado, el suelo derrumbado y el calor creciente advierten de su presencia. Pocos se atreven a entrar." #NT!
  
 building_type_firewyrms_01: "Vermis de fuego" #NT!
 building_firewyrms_01: "Madrigueras chamuscadas" #NT!
 building_firewyrms_01_desc: "La tierra está plagada de túneles ennegrecidos y respiraderos humeantes. Se han visto o sentido serpientes de fuego: ganado carbonizado, suelo derrumbado y calor creciente advierten de su presencia. Pocos se atreven a entrar." #NT!
 building_firewyrms_02: "Túneles colapsados" #NT!
 building_firewyrms_02_desc: "Las criaturas han sido empujadas más profundamente o asesinadas, y muchos de sus túneles han sido sellados o colapsados. Persisten temblores ocasionales o ráfagas de calor, pero lo peor ya ha pasado." #NT!
 building_firewyrms_03: "Tierra enfriada" #NT!
 building_firewyrms_03_desc: "El terreno se ha asentado y los fuegos se han apagado. Los vermis de fuego han sido erradicados o han huido fuera de su alcance. Aunque la tierra todavía muestra sus cicatrices, es seguro pisarla una vez más." #NT!
  
   #Hostile Swamp 
 building_type_swamp: "Pantano hostil" #NT!
  
 building_type_swamp_01_01: "$building_type_swamp$" #NT!
 building_swamp_01_01: "Terreno empantanado" #NT!
 building_swamp_01_01_desc: "El suelo blando y esponjoso atrae tanto las botas como los carros. El progreso se ralentiza, las estructuras se hunden y la humedad se filtra en todo. Una barrera natural a la expansión." #NT!
 building_swamp_01_02: "Terrenos drenados" #NT!
 building_swamp_01_02_desc: "Se cavaron canales, se colocaron pasarelas y la tierra húmeda comienza a secarse. El terreno aún es inestable, pero cede ante la perseverancia y la planificación." #NT!
 building_swamp_01_03: "Humedales recuperados" #NT!
 building_swamp_01_03_desc: "Lo que alguna vez fue una barrera, ahora es una base. El pantano ha sido drenado y remodelado para convertirlo en terreno utilizable, listo para albergar asentamientos y líneas de suministro." #NT!
  
 building_type_swamp_02_01: "$building_type_swamp$" #NT!
 building_swamp_02_01: "Lodo hundido" #NT!
 building_swamp_02_01_desc: "Una traicionera extensión de lodo y agua estancada donde cada paso corre el riesgo de caer al pantano. Los cimientos se pudren, las enfermedades se pudren y el movimiento es una lucha lenta y ahogadora." #NT!
 building_swamp_02_02: "Lodo reforzado" #NT!
 building_swamp_02_02_desc: "Los caminos elevados y los soportes improvisados ​​mantienen a raya la suciedad. La tierra se resiste al progreso, pero un esfuerzo decidido está abriendo camino a través del lodo." #NT!
 building_swamp_02_03: "Lodo estabilizado" #NT!
 building_swamp_02_03_desc: "El suelo ha sido firme y el agua domesticada. El fango ya no amenaza con tragarse a todos los que entran. Puede que aún tenga cicatrices del pasado, pero ahora es lo suficientemente sólido como para crecer." #NT!
  
   #Floods 
 building_type_lv_floods_01: "Inundaciones" #NT!
 building_lv_floods_01: "Tierra inundada" #NT!
 building_lv_floods_01_desc: "Las fuertes lluvias o el aumento del nivel del agua han sumergido la zona, convirtiendo las carreteras en ríos y los campos en lodazal. Los asentamientos están aislados y el peligro se esconde bajo la superficie." #NT!
 building_lv_floods_02: "Aguas en retroceso" #NT!
 building_lv_floods_02_desc: "Las aguas de las inundaciones han comenzado a retroceder, aunque la tierra sigue siendo inestable y traicionera. La limpieza ha comenzado, pero el movimiento y la reconstrucción aún son limitados." #NT!
 building_lv_floods_03: "Terreno drenado" #NT!
 building_lv_floods_03_desc: "Las últimas aguas han sido desviadas o absorbidas. Aunque la tierra está llena de cicatrices y empapada, una vez más es transitable, cultivable y apta para construir de nuevo." #NT!
  
   #Noxious Gases 
 building_type_noxious_gases: "Gases nocivos" #NT!
  
 building_type_noxious_gases_01_01: "$building_type_noxious_gases$" #NT!
 building_noxious_gases_01_01: "Neblina densa" #NT!
 building_noxious_gases_01_01_desc: "Lejos del centro de la erupción, las nieblas volcánicas todavía se acumulan. Estos vapores flotan bajo, filtrándose en grietas y huecos, debilitando a los desprotegidos y asfixiando a los descuidados. Es una amenaza más silenciosa, pero no menos real." #NT!
 building_noxious_gases_01_02: "Neblina adelgazante" #NT!
 building_noxious_gases_01_02_desc: "Las nieblas oscilan, ya no son un muro sino un velo. Respirar es más fácil, aunque la ocasional ráfaga de gas todavía trae dolorosos recordatorios de peligros pasados. La recuperación está en marcha, pero la precaución debe guiar cada paso." #NT!
 building_noxious_gases_01_03: "Aire sedimentado" #NT!
 building_noxious_gases_01_03_desc: "El tiempo y el viento han hecho su trabajo. La bruma se ha disipado y la tierra vuelve a respirar libremente. Las huellas del pasado permanecen en las cenizas y el aroma, pero la niebla nociva que asolaba estas tierras se ha desvanecido en la memoria." #NT!
  
 building_type_noxious_gases_02_01: "$building_type_noxious_gases$" #NT!
 building_noxious_gases_02_01: "Humos asfixiantes" #NT!
 building_noxious_gases_02_01_desc: "Gases espesos y acres surgen de la tierra volcánica, cubriendo todo con una neblina mortal. Respirar es una lucha, la visibilidad es casi nula y la vida se marchita bajo el ataque implacable. Sólo los hombres más locos se atreven a entrar en la zona asfixiada." #NT!
 building_noxious_gases_02_02: "Humos persistentes" #NT!
 building_noxious_gases_02_02_desc: "El aire sigue contaminado, pero por algún milagro lo peor ha pasado. El azufre se adhiere a cada respiración, picando ojos y pulmones. El peligro sigue presente (insidioso y persistente), pero ya no es una sentencia de muerte inmediata." #NT!
 building_noxious_gases_02_03: "Aire sedimentado" #NT!
 building_noxious_gases_02_03_desc: "Los cielos han comenzado a despejarse. En el viento queda un ligero rastro de azufre, pero el aire vuelve a ser apto para la vida. Aún es necesaria vigilancia, pero lo peor ya ha quedado superado." #NT!
  
   #Stonemen Encampment 
 building_type_stonemen_encampment_01: "Campamento de hombres de piedra" #NT!
 building_stonemen_encampment_01: "Campamento infestado" #NT!
 building_stonemen_encampment_01_desc: "Un grupo de estructuras en ruinas o cuevas se ha convertido en el hogar de hombres de piedra: retorcidos, contagiosos y hostiles. Ningún viajero en su sano juicio se atreve a acercarse sin protección." #NT!
 building_stonemen_encampment_02: "Zona en cuarentena" #NT!
 building_stonemen_encampment_02_desc: "La mayoría de los afectados han sido expulsados ​​o contenidos. La zona sigue siendo peligrosa y persisten las historias de maldiciones, pero la peor amenaza ha sido atenuada." #NT!
 building_stonemen_encampment_03: "Terrenos purgados" #NT!
 building_stonemen_encampment_03_desc: "El campamento ha sido desalojado por completo. Con fuego, acero y una resolución sombría, los canteros han sido expulsados ​​o destruidos. La tierra ya no está maldita, al menos no abiertamente." #NT!
  
   #Bandit Camp 
 building_type_bandit_camps_01: "Campamentos de bandidos" #NT!
 building_bandit_camps_01: "Campamento sin ley" #NT!
 building_bandit_camps_01_desc: "Un conocido refugio para bandidos, contrabandistas y desertores. Las rutas comerciales no son seguras y los lugareños viven con miedo. El campamento debe ser desmantelado antes de que pueda regresar la paz." #NT!
 building_bandit_camps_02: "Asaltantes dispersos" #NT!
 building_bandit_camps_02_desc: "El campo ha sido parcialmente desmantelado. Quedan algunos forajidos que atacan de manera oportunista, pero su poder se está desvaneciendo. Un empujón final los erradicará." #NT!
 building_bandit_camps_03: "Territorio seguro" #NT!
 building_bandit_camps_03_desc: "Los últimos bandidos han sido derrotados. Las patrullas controlan ahora la zona y se ha restablecido el orden. Donde antes dominaban las espadas, ahora ondean estandartes." #NT!
  
   #Ruined/Abandoned holding 
 building_type_ruined_holding: "explotación arruinada" #NT!
  
 building_type_small_ruined_holding_01: "$building_type_ruined_holding$" #NT!
 building_small_ruined_holding_01: "Restos desmoronados" #NT!
 building_small_ruined_holding_01_desc: "Lo que alguna vez fue un puesto de avanzada o una propiedad menor, ahora es poco más que escombros y maleza. Las ruinas son inestables, no están vigiladas y tienen un uso limitado hasta que sean limpiadas y aseguradas." #NT!
 building_small_ruined_holding_02: "Cimentaciones estabilizadas" #NT!
 building_small_ruined_holding_02_desc: "Se han hecho esfuerzos para apuntalar las paredes rotas y limpiar los escombros. Si bien aún está lejos de ser restaurada, la estructura ahora presenta menos peligros y pronto podrá ser recuperada para su uso." #NT!
 building_small_ruined_holding_03: "Carcasa restaurada" #NT!
 building_small_ruined_holding_03_desc: "La explotación ha sido despejada de forma segura y se han completado las reparaciones básicas. Una vez más resulta útil como bastión o asentamiento menor: humilde, pero ya no abandonado." #NT!
  
 building_type_medium_ruined_holding_01: "$building_type_ruined_holding$" #NT!
 building_medium_ruined_holding_01: "Fortaleza rota" #NT!
 building_medium_ruined_holding_01_desc: "Este fuerte o finca que alguna vez fue modesto ha caído en mal estado. Sus torres se inclinan, sus pasillos permanecen en silencio y los peligros acechan en medio de su decadencia." #NT!
 building_medium_ruined_holding_02: "Terrenos asegurados" #NT!
 building_medium_ruined_holding_02_desc: "Las peores amenazas han sido eliminadas y el sitio ahora es seguro para habitarlo o reconstruirlo. Aunque la gloria se ha ido, los huesos de la fuerza permanecen." #NT!
 building_medium_ruined_holding_03: "Participación recuperada" #NT!
 building_medium_ruined_holding_03_desc: "A través de trabajo constante y paciencia, la ruina se ha estabilizado y devuelto a su propósito. Está listo para servir nuevamente, incluso si sus pancartas son nuevas." #NT!
  
 building_type_large_ruined_holding_01: "$building_type_ruined_holding$" #NT!
 building_large_ruined_holding_01: "Legado caído" #NT!
 building_large_ruined_holding_01_desc: "El sitio muestra las cicatrices de un gran pasado: una antigua ciudad o fortaleza ahora perdida en el tiempo. Su inmensidad sólo es comparable a los peligros que se esconden en su interior." #NT!
 building_large_ruined_holding_02: "Ruina domesticada" #NT!
 building_large_ruined_holding_02_desc: "Los esfuerzos de limpieza han logrado poner orden en el caos. Los grandes salones ya no son peligrosos y se han asegurado caminos a través de los escombros. La ruina vuelve a respirar, aunque débilmente." #NT!
 building_large_ruined_holding_03: "Asiento revivido" #NT!
 building_large_ruined_holding_03_desc: "El sitio ya no es una ruina, sino una base. Aunque quedan ecos de su grandeza perdida, ahora cumple un nuevo propósito: renacer a tu imagen, listo para moldear el mundo una vez más." #NT!

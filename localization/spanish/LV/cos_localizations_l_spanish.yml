     # Culture Locals # 
 name_list_sothori_high: "bajo sothori" #NT!
 name_list_sothori_low: "bajo sothori" #NT!
  
 brindled_man_high: "Alto Sothoryi" #NT!
 brindled_man_high_collective_noun: "Alto Sothoryi" #NT!
 brindled_man_high_prefix: "Alto Sothoryi" #NT!
  
 brindled_ghoul: "Hombres atigrados" #NT!
 brindled_ghoul_collective_noun: "Hombres atigrados" #NT!
 brindled_ghoul_prefix: "Hombres atigrados" #NT!
  
 language_sothori_name: "sothoryish" #NT!
  
 lv_tradition_brindled_man_name: "Piel atigrada" #NT!
 lv_tradition_brindled_man_desc: "Los maestres de Poniente escriben que los Sothoryi no son verdaderos hombres en absoluto, sino criaturas brutales: miembros enormes, piel salpicada, más cerdos que humanos. Sus relatos hablan de salvajismo, dioses oscuros, fiestas caníbales y ritos obscenos. Eso dicen los eruditos, y así lo repiten los comerciantes y piratas de las costas del sur, que tratan a los pueblos atigrados como menos que personas. Sin embargo, tales historias están hechas más de rumores y calumnias que de verdades, porque los Sothoryi son realmente humanos, aunque extraños para los extranjeros. Lo que se llama salvajismo muchas veces no es más que la costumbre de un pueblo poco conocido y rara vez comprendido." #NT!
  
  
  
  
     # Faiths Locals # 
  
 sothoryos_religion: "Religiones del infierno verde" #NT!
 sothoryos_religion_adj: "Religiones del infierno verde" #NT!
 sothoryos_religion_desc: "Dado su aislamiento y entorno único, las religiones de Sothoryos han sido moldeadas por la supervivencia, el mundo natural y los horrores sobrenaturales que se rumorea que existen allí." #NT!
  
 the_eternal_maw: "Las fauces eternas" #NT!
 the_eternal_maw_adj: "Las fauces eternas" #NT!
 the_eternal_maw_desc: "Las Fauces Eternas es una religión centrada en la idea de que el mundo es una gran fuerza devoradora y que toda vida existe para ser consumida. Sus seguidores creen que el sacrificio y el canibalismo fortalecen el alma, permitiéndole regresar a la próxima vida como un depredador más fuerte que una presa." #NT!
  
 the_green_mother: "La madre verde" #NT!
 the_green_mother_adj: "La madre verde" #NT!
 the_green_mother_desc: "Esta fe que adora la naturaleza sostiene que la jungla misma es una diosa viviente, a la vez protectora y despiadada. La Madre Verde provee a quienes la respetan pero devora a quienes toman demasiado." #NT!
  
 the_thirst: "la sed" #NT!
 the_thirst_adj: "la sed" #NT!
 the_thirst_desc: "El culto regional de los Hombres Brindled, que reside sobre los Árboles Sin Sangre. The Thirst es una extensión de su simbiosis con los murciélagos vampiros de color blanco pálido de la región. Aunque más exactamente, el culto gira en torno a los caprichos de un líder con toda autoridad conocido como 'El Deleador de Sangre'.\n\nA pocos se les permite ingresar a los salones más privados del Deletador de Sangre, pero aquellos que lo hacen reportan un único recipiente de piedra negra aceitosa en su centro; alguna vez 'lleno'." #NT!
 holy_site_thirsty_hall_name: "El salón del derramador de sangre" #NT!
 the_thirst_adherent_plural: "Atado a la sangre" #NT!
  
 serpents_grasp: "Agarre de la serpiente" #NT!
 serpents_grasp_adj: "Agarre de la serpiente" #NT!
 serpents_grasp_desc: "El culto regional o" #NT!
  
  

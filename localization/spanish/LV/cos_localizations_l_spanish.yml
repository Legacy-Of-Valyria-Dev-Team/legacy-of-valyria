 building_jungle_ruin_04_desc: "Una porción de relativa calma ha sido labrada en la jungla a través del sudor, las lágrimas y mucha, mucha sangre." #NT!
  
  
 jungle_ruin_deep_01: "Selva profunda" #NT!
 building_jungle_ruin_deep_01: "Selva profunda" #NT!
 building_type_jungle_ruin_deep_01: "Infierno verde" #NT!
 building_jungle_ruin_deep_01_desc: "Aunque está completamente consumida por la profunda jungla, esta provincia está llena de lo peor que Sothoryos tiene para ofrecer." #NT!
  

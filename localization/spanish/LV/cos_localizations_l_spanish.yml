      # Starting Quests # 
  
  #The Maw 
 cos_start_quests.1000.t: "A través de los campos del hambre" #NT!
 cos_start_quests.1000.d: "Durante mil años el equilibrio de poder estuvo cambiando constantemente en el caldero que son las Llanuras Yeenish... este equilibrio ahora está roto. Con la aplastante derrota de los nobles y su Madre Verde, las Fauces Eternas resuena como la única verdad en las llanuras. Las verdaderas tribus ahora están unidas en la fe, mientras que los nobles han regresado a las Llanuras Menores, meditando sobre su "gloria" perdida.\n\nLos nobles son vulnerables, los Balami han sido azotados de sus nieblas y nadie ahora es igual a nosotros, los devoradores. Las Fauces todavía tienen hambre... y la pregunta sigue siendo: ¿dónde atacaremos ahora?" #NT!
 cos_start_quests.1000.a: "... ¡al este hasta Balam Glades!" #NT!
 cos_start_quests.1000.b: "... ¡al norte hasta la costa pirata!" #NT!
 cos_start_quests.1000.c: "... al sur, los Qhori no pueden ser invencibles..." #NT!
  
  #The Lesser Plain 
 cos_start_quests.1001.t: "Glorias perdidas" #NT!
 cos_start_quests.1001.d: "Nos dijeron que el culto marginal pronto desaparecería o seguiría siendo poco numeroso; parias de nuestra noble sociedad. Estas mentiras las dijimos hasta el mismo momento en que nuestros grupos de guerra se enfrentaron a los suyos. Ahora, después de una serie de aplastantes derrotas a manos de los cultistas de Fauces, nuestra forma de vida está al borde del abismo. Si las Fauces actúan unidos contra nosotros ahora, somos muy pocos para tener alguna posibilidad.\n\n¿Qué nos queda ahora?" #NT!
 cos_start_quests.1001.a: "¡No podemos permitirnos que nos aniquilen!" #NT!
 cos_start_quests.1001.b: "Nuestro tiempo ha terminado, debemos abrazar las Fauces Eternas..." #NT!
 cos_start_quests.1001.c: "MARCADOR DE LUGAR" #NT!
  

     # Special Buildings And Ruins # 
  
 building_bloodstone_mines_1: "Minas de hematites sin explotar" #NT!
 building_type_bloodstone_mines_1: "Minas de piedra de sangre" #NT!
 building_bloodstone_mines_1_desc: "Una extensión de escarpados acantilados que separan la selva del mar. Esta formación rocosa parece ser rica en hierro y un mineral verde-rojo conocido como piedra de sangre.\n\nEsta piedra preciosa semipreciosa parece tener un significado cultural para los nativos de la región, quienes la recolectan a mano, sin herramientas ni técnicas de minería. La minería de estos acantilados sería muy rentable, aunque un sacrilegio para los nativos." #NT!
  
 building_bloodstone_mines_2: "Minas de piedra de sangre" #NT!
 building_type_bloodstone_mines_2: "Minas de piedra de sangre" #NT!
 building_bloodstone_mines_2_desc: "Una extensión de escarpados acantilados que separan la selva del mar. Esta formación rocosa parece ser rica en hierro y un mineral verde-rojo conocido como hematites.\n\nAhora aprovechados en todo su potencial, los pozos de minas y las herramientas extraen hierro y piedras preciosas a un ritmo muy eficiente." #NT!
  
  
 building_green_gate_1: "La puerta verde" #NT!
 building_type_green_gate_1: "La puerta verde" #NT!
 building_green_gate_1_desc: "Un impresionante entramado de escarpadas formaciones rocosas en forma de lanza en el punto de convergencia de las paredes de hematites de este a oeste. Las lanzas de roca forman un dosel casi completo sobre la entrada al valle sombreado interior. Esta "puerta" aparentemente natural es el único camino por tierra hacia las Llanuras Centrales de Sothoryos.\n\nLas numerosas cavidades y rincones en este entramado de roca *también* albergan una colonia de wyverns verdaderamente masiva. Los barcos no pueden acercarse demasiado a esta zona, para no quedarse sin toda su tripulación. Si se pudiera hacer frente a la amenaza de los wyvern, esta puerta sería la clave para defender las vastas y fértiles llanuras del sur contra cualquier invasor marítimo." #NT!
  
 building_green_gate_2: "Puerta Verde Fortificada" #NT!
 building_type_green_gate_2: "Minas de piedra de sangre" #NT!
 building_green_gate_2_desc: "Un impresionante entramado de escarpadas formaciones rocosas en forma de lanza en el punto de convergencia de las paredes de hematites de este a oeste. Las lanzas de roca forman un dosel casi completo sobre la entrada al valle sombreado interior. Esta "puerta" aparentemente natural es el único camino por tierra hacia las Llanuras Centrales de Sothoryos.\n\nUna vez eliminados los wyverns, el paso ha sido fortificado y se ha erigido un puerto en el profundo puerto que se encuentra en su desembocadura." #NT!
  
  
 building_cos_corpse_mound_1: "Vastos montículos de cadáveres" #NT!
 building_type_cos_corpse_mound_1: "Montículos de cadáveres" #NT!
 building_cos_corpse_mound_1_desc: "Amontonados en un claro de la jungla hay montículos formados por miles de cuerpos y artefactos en ruinas, tal vez de magnitudes mayores. Los nativos de esta región se llevan a todos los "invasores" derrotados desde la costa, junto con todas sus posesiones extranjeras para apilarlas aquí; la creencia local es que todas las artesanías extranjeras son malas y, por lo tanto, deben dejarse en manos de "los dioses". En este caso, los dioses son los cientos de basiliscos que convergen aquí para atiborrarse de los cuerpos abandonados.\n\nAunque gran parte de este montón desecado por el sol no tiene ningún valor en tiempos pasados, recuperar su contenido sería extremadamente lucrativo; aunque sacrílego para los nativos." #NT!
  
 building_cos_corpse_mound_2: "Perímetros del cadáver encuestados" #NT!
 building_type_cos_corpse_mound_2: "Montículos de cadáveres" #NT!
 building_cos_corpse_mound_2_trigger: "Sólo los gobernantes que no practican [GetFaithByKey('shanty_black').GetName] pueden tomar la decisión de empezar a limpiar los montículos de cadáveres." #NT!
 building_cos_corpse_mound_2_desc: "Se ha dado la orden de recuperar los montículos, pero la jungla no entrega sus premios fácilmente. Un perímetro de guardias armados rodea ahora el claro, con sus picas apuntando hacia adentro, no contra los hombres, sino contra el ganado venenoso y sibilante de las Profundidades de Basilisco.\n\nLos topógrafos y los valientes trabajadores trabajan bajo la constante amenaza de romperse las mandíbulas, intentando mapear la escala del tesoro mientras luchan contra las náuseas inducidas por la putrescencia quemada por el sol. Los basiliscos, enfurecidos por la interrupción de su alimentación, se lanzan contra las barricadas, poniendo a prueba la determinación de quienes buscan el oro enterrado bajo la sangre." #NT!
  
 building_cos_corpse_mound_3: "Trincheras de podredumbre excavadas" #NT!
 building_type_cos_corpse_mound_3: "Montículos de cadáveres" #NT!
 building_cos_corpse_mound_3_desc: "La magnitud de la muerte aquí ha requerido medidas industriales. Se han cavado profundas trincheras a través de los montículos, cortando capas de historia y huesos como los anillos de un árbol mórbido. El aire está cargado del humo de las piras a medida que las capas más frescas y cubiertas de carne se queman para llegar a los antiguos depósitos que se encuentran debajo.\n\nEs un trabajo sombrío y sudoroso. A medida que los montículos se reducen, los basiliscos se han vuelto desesperados y agresivos, aunque muchos han sido sacrificados o rechazados. Destellos de acero valyrio, jade de Yi Ti y oro de las Islas del Verano asoman ahora entre las cenizas y el barro grises, animando a los trabajadores a pesar del riesgo de plaga." #NT!
  
 building_cos_corpse_mound_4: "Campamento de catalogación de campo" #NT!
 building_type_cos_corpse_mound_4: "Montículos de cadáveres" #NT!
 building_cos_corpse_mound_4_desc: "Las montañas de cadáveres han sido niveladas, dejando sólo por hacer la clasificación. Tiendas de campaña y mesas improvisadas ocupan ahora la tierra empapada de sangre, donde escribas y esclavos separan cuidadosamente los desechos de las riquezas. La mayor parte de los basiliscos, privados de sus comidas fáciles y cansados ​​de las antorchas, se han retirado hacia el dosel más profundo, dejando sólo un silencio inquietante a su paso.\n\nMontones de hierro oxidado y huesos rotos son empujados hacia la periferia, mientras los artefactos recuperados son limpiados de siglos de suciedad. La riqueza es asombrosa, pero cada moneda y cada coraza lleva el olor pesado y empalagoso de la tumba que ningún fregado puede eliminar por completo." #NT!
  
 building_cos_corpse_mound_5: "Montículos de cadáveres despejados" #NT!
 building_type_cos_corpse_mound_5: "Montículos de cadáveres" #NT!
 building_cos_corpse_mound_5_desc: "Este claro de la jungla alguna vez fue el hogar de los infames Montículos de Cadáveres de las Profundidades del Basilisco. Los nativos de esta región se llevarían a todos los "invasores" derrotados desde la costa, junto con todas sus posesiones extranjeras para apilarlas aquí; la creencia local es que todas las artesanías extranjeras son malas y, por lo tanto, deben dejarse en manos de "los dioses". En este caso, los dioses son los cientos de basiliscos que convergieron aquí para atiborrarse de los cuerpos que quedaron atrás.\n\nCon los cuerpos y los artefactos eliminados, los basiliscos se han dispersado una vez más en las profundidades de la jungla. El claro todavía posee un olor fétido y un aura de desesperación." #NT!
  
  
 building_basilisk_point_ruins_1: "Ruinas de Punta Basilisco" #NT!
 building_type_basilisk_point_ruins_1: "Punta Basilisco" #NT!
 building_basilisk_point_ruins_1_desc: "Las antiguas ruinas de varias colonizaciones de Ghiscari, Valyrian y mucho más tarde de Rhoynish. Aunque los diferentes estilos de arquitectura chocan constantemente en las ruinas, una torre del homenaje de piedra permanece intacta y desafiante, aparentemente protegiéndose de la invasión de la jungla. Una única columna de piedra negra aceitosa sobresale del centro del patio del torreón.\n\nAunque actualmente se encuentran en mal estado, los edificios y fosas que quedan aquí todavía ofrecen una importante posición defensiva contra cualquier posible atacante." #NT!
  
 building_basilisk_point_ruins_2: "Punta Basilisco restaurada" #NT!
 building_type_basilisk_point_ruins_2: "Punta Basilisco" #NT!
 building_basilisk_point_ruins_2_desc: "Las ruinas ahora restauradas de Basilisk Point. Los estilos arquitectónicos en conflicto han sido parcialmente demolidos en algunos lugares para concentrarlos y crear un efecto de movimiento en el tiempo mientras caminas por los caminos adoquinados. Grandes incendios han hecho retroceder la jungla y se ha erigido una empalizada defensiva como defensa secundaria a los muros de piedra ahora restaurados. Con el faro de la torre del homenaje brillando intensamente, los viciosos habitantes nativos de Sothoryos, tanto sensibles como no, ahora temerán este lugar como un faro de poder." #NT!
  
  
 building_zamettar_ruins_1: "Ruinas de Zamettar" #NT!
 building_type_zamettar_ruins_1: "Zamettar" #NT!
 building_zamettar_ruins_1_desc: "Las antiguas ruinas de Zamettar, originalmente fundadas por los Ghiscari y luego capturadas por los señores dragón de Valyrian Freehold, durante la Cuarta Guerra Ghiscari. Finalmente, el entorno hostil de Sothoryos expulsó a los colonos valyrios. Pasaron varios cientos de años antes de que los Rhoynish intentaran colonizar la ciudad, solo para fracasar por la misma razón que los valyrios.\n\nLa jungla se ha abierto camino a través de la ciudad, las enredaderas escalan cada muro y enormes raíces asientan edificios de piedra a sus costados. Sin embargo, la jungla todavía tiene que recuperar algunos distritos de la ciudad; aquellos que llevan columnas de una aceitosa piedra negra en sus centros.\n\nRestaurar Zamettar sería una tarea excepcionalmente difícil, pero con suficiente tiempo, esfuerzo y oro, esta ciudad podría volver a extenderse hasta el mismo Delta de Zamoyos." #NT!
  
 building_zamettar_ruins_2: "Zamettar restaurado" #NT!
 building_type_zamettar_ruins_2: "Zamettar" #NT!
 building_zamettar_ruins_2_desc: "Finalmente restaurado a su máximo esplendor por primera vez desde la época del Viejo Ghis, Zamettar está repleto de nuevos colonos y barcos de comercio extranjero. Los muros de piedra protegen ahora de forma segura a los numerosos habitantes de la ciudad de lo peor del medio ambiente y las quemas periódicas en los bordes del bosque repelen a los peores insectos que pican. La selva profunda ha sido empujada hasta los mismos límites del delta y se han erigido empalizadas en sus fronteras.\n\nCon agua dulce que se extrae y se hierve de los Zamoyos, los barcos frecuentan los puertos de Zamettari tanto para reabastecimiento como para alojamiento." #NT!
  
  
 building_balam_glade_1: "Claros azotados de Balam" #NT!
 building_type_balam_glade_1: "Claros de Balam" #NT!
 building_balam_glade_1_desc: "Los claros escondidos de Balam eran un lugar altamente espiritual para aquellos de la fe de la Madre Verde. La historia oral habla de que fue aquí donde la propia Madre Verde descendió al suelo de la jungla para salvar a los Hombres Brindled de las plagas que los acosaban. El poder de sus hechizos divinos fue tal que la propia jungla fue purgada de esta pequeña área, dejando atrás un claro fértil para sus seguidores.\n\nLos claros fueron considerados el lugar sagrado más importante de la Madre Verde y muchos de sus seguidores juraron defenderlo con sus vidas... fracasaron.\n\nDesde entonces, los claros han sido incendiados y la jungla ha presionado ante su ausencia. Queda muy poco de la vida vegetal y fauna original del claro; pero un fanático o erudito decidido aún podría salvar o incluso restaurar los claros a su antiguo esplendor." #NT!
  
 building_balam_glade_2: "Claros florecientes de Balam" #NT!
 building_type_balam_glade_2: "Claros de Balam" #NT!
 building_balam_glade_2_desc: "Estos claros escondidos son un lugar altamente espiritual para aquellos de la fe de la Madre Verde. La historia oral habla de que fue aquí donde la propia Madre Verde descendió al suelo de la jungla para salvar a los Hombres Brindled de las plagas que los acosaban. El poder de sus hechizos divinos era tal que la propia jungla fue eliminada de esta pequeña área, dejando tras de sí un claro fértil para sus seguidores.\n\nLos claros se consideran el principal lugar sagrado de la Madre Verde y muchos de sus seguidores prometen defenderlo con sus vidas." #NT!
  
  
 building_the_maw_1: "colina de las fauces" #NT!
 building_type_the_maw_1: "colina de las fauces" #NT!
 building_the_maw_1_desc: "A partir de este sistema de cuevas colapsado, la cueva genera las cabeceras del río afluente Yeenos. Más que eso, sin embargo, anteriormente fue el punto central de la religión de las Fauces Eternas. Sus seguidores creen que el mundo entero, o al menos Sothoryos, es una entidad única que devora a los débiles y nutre a los fuertes en un ciclo continuo que genera criaturas más grandes y más fuertes.\n\nLos seguidores de esta religión trajeron sus presas más atrevidas o impresionantes (animales o no) y las colocaron dentro de las cámaras más exteriores de la cueva para ser "devoradas"; supuestamente apaciguando las fauces y dándoles poder. Cualquiera que sea la verdad del asunto, el río Yeenos que fluye a través de las grietas de la boca de la cueva sellada mantiene la región bastante fértil hasta el día de hoy.\n\nAlgunos seguidores más entusiastas pueden incluso desear limpiar la boca de la cueva y reanudar sus espantosas prácticas." #NT!
  
 building_the_maw_2: "Las fauces devoradoras" #NT!
 building_type_the_maw_2: "colina de las fauces" #NT!
 building_the_maw_2_desc: "Desde este enorme sistema de cuevas, la cueva genera las cabeceras del río afluente Yeenos. Más que eso, sin embargo, es el punto central y un lugar sagrado de la religión de las Fauces Eternas. Sus seguidores creen que el mundo entero, o al menos Sothoryos, es una entidad única que devora a los débiles y nutre a los fuertes en un ciclo continuo que genera criaturas más grandes y más fuertes.\n\nLos seguidores de esta religión presentan sus presas más atrevidas o impresionantes (animales o no) y las colocan dentro de las cámaras más exteriores de la cueva para ser "devoradas"; apaciguando así las fauces y dándoles poder. Cualquiera que sea la verdad del asunto, el río Yeenos que fluye desde aquí parece hacer que las regiones sean extremadamente fértiles." #NT!
  
  
 building_yeen_ruins_1: "Ciudad en ruinas de Yeen" #NT!
 building_type_yeen_ruins_1: "ciudad de yen" #NT!
 building_yeen_ruins_1_desc: "Una gran ciudad en ruinas que se extiende más allá de lo que se puede ver. Yeen es una de las ciudades más antiguas del mundo conocido, construida casi exclusivamente con piedra negra aceitosa, algunas de las cuales son lo suficientemente grandes como para que se necesitarían varios elefantes para mover cada una de ellas.\n\nParece que la jungla no puede entrar en Yeen. Las calles permanecen libres de todo excepto de las plantas más larguiruchas y delicadas. No hay enredaderas ni raíces que obstruyan, sólo mucha tierra suelta; una ciudad desgastada por el clima, espeluznante, silenciosa y aburrida.\n\nAunque todos los intentos anteriores de habitar este lugar han terminado en horror... Seguramente algo así no puede volver a suceder. Después de todo, en comparación con las crueles junglas del profundo Sothoryos, Yeen parece un refugio notablemente seguro." #NT!
  
 building_yeen_ruins_2: "Ocupación inicial (Yeen)" #NT!
 building_type_yeen_ruins_2: "ciudad de yen" #NT!
 building_yeen_ruins_2_desc: "Siguiendo los pasos de innumerables expediciones condenadas al fracaso que nos precedieron, se ha establecido un campamento base en una de las partes más defendibles de la ciudad; cerca de los barcos, en caso de que fuera necesaria una retirada apresurada.\n\nLas afueras ya han sido exploradas en su mayor parte. Huesos dispersos, cadáveres disecados de ganado y bestias sothori por igual, armas y armaduras de diversas edades y orígenes... ¿es una espada de poniente? No importa. Los distritos del centro de la ciudad han resultado difíciles. Todos nuestros equipos enviados hasta ahora no han regresado. Dada la telaraña anormalmente grande que cruza las calles... al menos tenemos una idea de por qué.\n\nLos colonos gritan en sueños, una cantidad anormalmente alta de pesadillas los atormenta, aunque esto es comprensible dada la historia de la zona. Aún así, con al menos los distritos exteriores cartografiados deberíamos tener una ventaja considerable sobre cualquier invasor. Además, llevará años catalogar las reliquias recuperadas aquí y tal vez venderlas, lo que generará una buena cantidad de oro." #NT!
  
 building_yeen_ruins_3: "Restauración exterior (Yeen)" #NT!
 building_type_yeen_ruins_3: "ciudad de yen" #NT!
 building_yeen_ruins_3_desc: "Los distritos exteriores han sido fortificados y restaurados siempre que fue posible. Cualquier invasor ahora se enfrenta a un laberinto de caminos y callejones bloqueados... aunque siguen desapareciendo más colonos, sin que los vigías los vean salir. Por supuesto, los distritos interiores fueron bloqueados, aunque eso no ayudó en lo más mínimo. Sin temor a amenazas externas por ahora, tal vez se podría planificar una expedición más militarizada a las profundidades de la ciudad.\n\nMás informes de pesadillas y falta de sueño molestan a los ya finitos curanderos de la zona..." #NT!
  
 building_yeen_ruins_4: "Distritos interiores retomados (Yeen)" #NT!
 building_type_yeen_ruins_4: "ciudad de yen" #NT!
 building_yeen_ruins_4_desc: "Gracias a grandes esfuerzos y pérdidas de vidas, se han recuperado los distritos interiores, menos algunas zonas rebeldes. Las viles y quitinosas cáscaras de los attercops han sido eliminadas y algunas de las ruinas más majestuosas de la zona ya han sido reclamadas por aquellos de mayor rango.\n\nLos attercops restantes han sido confinados en su mayor parte en un único templo enorme en el corazón de Yeen. Los preparativos para combatir esto adecuadamente llevarán mucho tiempo y probablemente serán extremadamente peligrosos. Las partes se niegan rotundamente, incluso bajo pena de muerte, a entrar a menos que su propio señor los acompañe para compartir el riesgo.\n\nLas pesadillas están empeorando y la falta de sueño parece haber inducido alucinaciones en algunos." #NT!
  
 building_yeen_ruins_5: "Distritos interiores restaurados (Yeen)" #NT!
 building_type_yeen_ruins_5: "ciudad de yen" #NT!
 building_yeen_ruins_5_desc: "Los distritos interiores de Yeen ahora han sido restaurados a un estado verdaderamente habitable. Se han despejado las carreteras, se han abastecido los almacenes y se han ocupado las mansiones. Parece que las calles necesitan una cantidad considerable de faroles para mantenerse encendidas. Aunque los templos y palacios están cerrados por ahora, tras la última flagelación... Yeen se ha convertido, no obstante, en un centro comercial central para cualquiera que viaje por el río Zamoyos.\n\nLas pesadillas son una ocurrencia nocturna para aquellos en el distrito interior... Es una realidad ineludible y muchos recurren a la dulce liberación de drogas del sueño sin sueños. Aquellos que no pueden permitirse tales lujos sufren en silencio, excepto por los gritos del sueño intermitente." #NT!
  
 building_yeen_ruins_6: "Gran ciudad de Yeen" #NT!
 building_type_yeen_ruins_6: "ciudad de yen" #NT!
 building_yeen_ruins_6_desc: "La ciudad ha sido restaurada y el mal que habita este lugar ha sido desterrado... con suerte para siempre. Yeen es ahora el refugio seguro en el corazón de la jungla que siempre pareció ser... por ahora." #NT!
  
  
 building_gold_mine_1: "Depósito de oro" #NT!
 building_type_gold_mine_1: "mina de oro" #NT!
 building_gold_mine_1_desc: "Siempre se ha dicho que a Sothoryos posee una gran riqueza en minerales y menas. Los buscadores han determinado que esta zona es rica en cuarzo y oro." #NT!
  
 building_gold_mine_2: "Mina de oro rica" #NT!
 building_type_gold_mine_2: "mina de oro" #NT!
 building_gold_mine_2_desc: "Insatisfechos con las vetas superficiales, se han cavado túneles profundos para acceder a los depósitos de cuarzo y oro en esta área. Con turnos de 12 horas por parte de los trabajadores y la adición periódica de nuevos túneles, este depósito ahora está desenterrando oro a un ritmo asombroso." #NT!
  
  
 building_bloodletters_hall_1: "Salón del Desangrador abandonado" #NT!
 building_type_bloodletters_hall_1: "Salón del derramador de sangre" #NT!
 building_bloodletters_hall_1_desc: "Dado que se decía que la sala del Deletreador estaba compuesta de enredaderas y huesos, no es de extrañar que quede poco después de que grandes incendios la arrasaran.\n\nSólo queda un altar de piedra negra aceitosa donde una vez estuvo la cámara central. De manera fascinante, y sin una fuente real visible, la palangana tiene una pequeña cantidad de sangre fresca en su interior.\n\nEs aquí donde el líder Bloodletter vivió y llevó a cabo sus viles prácticas. Si sus jerarcas u otros seguidores de su dios oscuro retoman el altar, pueden intentar volver a hacer crecer el Salón del Deletreador." #NT!
  
 building_bloodletters_hall_2: "Salón del derramador de sangre" #NT!
 building_type_bloodletters_hall_2: "Salón del derramador de sangre" #NT!
 building_bloodletters_hall_2_desc: "Las paredes de la sala del Bloodletter en realidad están compuestas de enredaderas entrelazadas del alto dosel de los Árboles Sin Sangre. Estas enredaderas están tensas entre sí con una variedad de huesos de aspecto muy humano, lo que hace que se fusionen con el tiempo debido a la tensión.\n\nEs aquí donde reside el líder Bloodletter y lleva a cabo sus viles prácticas." #NT!
  
  
 building_gimlet_watch_1: "Ruinas de Gimlet Watch" #NT!
 building_type_gimlet_watch_1: "Reloj Gimlet" #NT!
 building_gimlet_watch_1_desc: "Gimlet Watch, que alguna vez fue el segundo refugio pirata más importante de la costa este, ha sido saqueado y arruinado por los nativos. La jungla ha comenzado a crecer y, aunque no es del todo habitable en este momento, todavía tiene cierto valor defensivo." #NT!
  
 building_gimlet_watch_2: "Reloj Gimlet" #NT!
 building_type_gimlet_watch_2: "Reloj Gimlet" #NT!
 building_gimlet_watch_2_desc: "Gimlet Watch, el segundo puerto más importante de la costa este, es la hermana menor de Wyvern Watch.\n\nConstruida gracias a las fuertes inversiones de los señores piratas locales, esta fortaleza costera es un puesto de vigilancia contra los grupos más grandes de salvajes del sur." #NT!
  
  
 building_wyvern_watch_1: "Ruinas de Wyvern Watch" #NT!
 building_type_wyvern_watch_1: "Vigilancia de wyvern" #NT!
 building_wyvern_watch_1_desc: "Wyvern Watch, que alguna vez fue el puerto más importante de la costa este, era la hermana mayor de Gimlet Watch.\n\nAhora reducida a los cimientos de un antiguo faro de Ghiscari, la jungla ha reclamado grandes áreas de la torre del homenaje. Sin embargo, el lugar sigue siendo una posición muy defendible." #NT!
  
 building_wyvern_watch_2: "Vigilancia de wyvern" #NT!
 building_type_wyvern_watch_2: "Vigilancia de wyvern" #NT!
 building_wyvern_watch_2_desc: "Wyvern Watch, el puerto más destacado de la costa este, es la hermana mayor de Gimlet Watch.\n\nConstruida por señores piratas sobre los cimientos de un antiguo faro de Ghiscari, esta fortaleza costera es ahora el mayor centro de escoria y villanía en el continente de Sothori. Los barcos mercantes tienen cuidado con la luz mentirosa de Wyvern Point, cuya luz la mayoría de las veces los lleva a estrellarse en la costa y verse invadidos por piratas." #NT!
  
  
 building_maunga_pass_1: "Paso Maunga" #NT!
 building_type_maunga_pass_1: "Paso Maunga" #NT!
 building_maunga_pass_1_desc: "El paso de Maunga consiste en una serie de pasos de montaña extremadamente difíciles de recorrer. Cualquier grupo o residente del paso que conozca su paisaje en constante cambio puede volverse muy influyente o rico al guiar a otros a través del mismo." #NT!
  
 building_maunga_pass_2: "Paso de Maunga fortificado" #NT!
 building_type_maunga_pass_2: "Paso Maunga" #NT!
 building_maunga_pass_2_desc: "Ahora fortificado, el paso de Maunga es un pā casi intransitable que cualquier grupo de guerra dudaría en cruzar; sin pagar primero la tarifa requerida, por supuesto." #NT!
  
  
 building_fleshcarver_1: "Meseta rocosa" #NT!
 building_type_fleshcarver_1: "Meseta rocosa" #NT!
 building_fleshcarver_1_desc: "Una zona rocosa y árida de la costa, sostenida por un acantilado achaparrado. Si bien no es particularmente atractiva para los colonos, la formación terrestre al menos actúa como un punto de referencia para los marineros; y un punto de reunión defendible para aquellos que encallan." #NT!
  
 building_fleshcarver_2: "Naufragio del tallador de carne" #NT!
 building_type_fleshcarver_2: "Meseta rocosa" #NT!
 building_fleshcarver_2_desc: "Las historias dicen que una vez una ola colosal arrojó la galera de un traficante de esclavos en lo alto de una meseta rocosa en la costa, dejando a la tripulación a duras penas para ganarse la vida en la costa, sin medios de escape. Cualquiera sea el caso, el casco de este barco, colocado en lo alto de un acantilado achaparrado, es un refugio defendible para muchos de los pequeños municipios de la zona cuando grupos de guerra de hombres atigrados llaman a la puerta." #NT!
  
  
 building_gorosh_ruin_1: "Ruinas de Gorosh" #NT!
 building_type_gorosh_ruin_1: "Ruinas de Gorosh" #NT!
 building_gorosh_ruin_1_desc: "Gorosh, que alguna vez fue una colonia penal de Ghiscari, ha estado abandonada durante la mayor parte de su historia reciente. De vez en cuando, el antiguo puerto es utilizado por los capitanes de barco más desesperados, pero aquellos que intentan colonizar la zona sólo se han topado con mutaciones o desastres. Aunque la jungla se ha infiltrado en algunas áreas, las ruinas permanecen notablemente libres de todo tipo de vida vegetal excepto de las más pequeñas formas.\n\nEl patio central de la prisión parece tener un obilisk de piedra negra aceitosa." #NT!
  
 building_gorosh_ruin_2: "Colonia penal de Gorosh" #NT!
 building_type_gorosh_ruin_2: "Ruinas de Gorosh" #NT!
 building_gorosh_ruin_2_desc: "Ahora restaurada, esta antigua colonia penal de Ghiscari actúa como una ciudad portuaria bien defendida, capaz de albergar a miles de personas en poco tiempo. Aunque las habitaciones son quizás... indeseables. De hecho, aquellos que duermen en la prisión informan que tienen cada vez más pesadillas y alucinaciones mientras permanecen allí.\n\nEl patio central de la prisión todavía muestra un obilisk de piedra negra aceitosa." #NT!
  
  
 building_kahiwi_pa_1: "Colina Kahiwi" #NT!
 building_type_kahiwi_pa_1: "Colina Kahiwi" #NT!
 building_kahiwi_pa_1_desc: "Una colina con terraplenes altamente defendible que ha albergado una línea de tribus que cambia con frecuencia durante cientos de años. La tradición oral local afirma que la colina fue una vez la capital de un reino tribal altamente unificado que "expulsó a la gente del cielo". Si 'gente del cielo' se refiere a la arpía que adora a Ghiscari o a los valyrios voladores del dragón es un debate abierto.\n\nLas tribus de la región consideran que reclamar el histórico pā por la fuerza es algo muy prestigioso; de ahí la frecuencia con la que se pierde y se roba." #NT!
  
 building_kahiwi_pa_2: "Kahiwi Pa" #NT!
 building_type_kahiwi_pa_2: "Kahiwi Pa" #NT!
 building_kahiwi_pa_2_desc: "Una capital digna una vez más, este pā, o fuerte en la lengua común, es un hogar prestigioso y extremadamente defendible para cualquier tribu. Zanjas, túneles secretos, trincheras de terraplenes y empalizadas rodean la colina formando una docena de anillos de protección. Los almacenes subterráneos, enfriados en las profundidades de la tierra, contienen suministros suficientes para meses, si no años." #NT!
  
  
 building_serpents_lair_1: "Grieta de la serpiente" #NT!
 building_type_serpents_lair_1: "Grieta de la serpiente" #NT!
 building_serpents_lair_1_desc: "Dos grandes fisuras que atraviesan la costa de Wyvern y se encuentran mucho más hacia el interior. Esto formaría una isla, de no ser por un delgado puente terrestre natural donde la tierra aún no ha caído al abismo que se encuentra debajo. Debido a las fisuras, esta "isla" está casi completamente rodeada por acantilados, excepto por el puente de tierra natural que sirve de cuello de botella. Una formación rocosa impresionante para aquellos que tienen la suerte de verla.\n\nTambién se dice que los acantilados contienen numerosos túneles y cuevas que atraviesan el área y emergen como puntos oscuros en las paredes del acantilado." #NT!
  
 building_serpents_lair_2: "Guarida de la serpiente" #NT!
 building_type_serpents_lair_2: "Grieta de la serpiente" #NT!
 building_serpents_lair_2_desc: "Convertida en la fortaleza inexpugnable que estaba destinada a ser por el Culto de la Serpiente, esta formación es un bastión avanzado contra los piratas. Este lugar puede albergar a miles de personas, de forma segura en lo alto de sus altos acantilados, y los capitanes de barcos exploradores siempre temen golpearse contra las rocas irregulares de abajo." #NT!
  
  
 building_laanas_refuge_1: "Pueblo fantasma" #NT!
 building_type_laanas_refuge_1: "El refugio de Laana" #NT!
 building_laanas_refuge_1_desc: "Un pueblo fantasma abandonado de una ciudad. Casas, calles y torres de vigilancia vacías, todo parcialmente oculto por hojas y maleza. ¿A dónde fue toda la gente?" #NT!
  
 building_laanas_refuge_2: "El refugio de Laana" #NT!
 building_type_laanas_refuge_2: "El refugio de Laana" #NT!
 building_laanas_refuge_2_desc: "Un refugio seguro para que los barcos de las Islas del Verano comerciaran con algunos de los hombres atigrados menos salvajes y con la gente de Qhour. La jungla ha sido limpiada del área circundante y quienes viven aquí encontrarán innumerables innovaciones en la construcción que repelen o anulan gran parte de la naturaleza hostil de Sothoryos. Las colinas detrás del refugio están llenas de oro y otros metales preciosos; estos se extraen con cautela y se refinan en el lugar para el comercio.\n\nSe tiene cuidado de mantener la armonía con los lugareños, y aún más cuidado de permanecer ocultos tanto de los piratas como de los salvajes menos agradables." #NT!
  
  
  
  
  
  
  
  
  
     # Wildlife and Flora Blockers # 
  
 building_ravenous_basilisk_1: "Basiliscos voraces" #NT!
 building_type_ravenous_basilisk_1: "Basiliscos voraces" #NT!
 building_ravenous_basilisk_1_desc: "Basiliscos voraces han invadido esta zona. Su picadura transmite infecciones tan poderosas que necrotiza el tejido circundante en cuestión de horas. Extirpar las extremidades afectadas es la única manera de evitar una muerte excepcionalmente dolorosa.\n\nLa presencia de estas criaturas supone un riesgo enorme para los asentamientos de la zona y es esencial contar con puestos de guardia adicionales. El desarrollo de esta tierra será extremadamente difícil hasta que desaparezcan.\n\nEstos basiliscos en particular parecen ser más grandes y más agresivos que los vistos antes. Sospechamos que se sienten atraídos por algo cercano..." #NT!
  
 building_ravenous_basilisk_2: "Basiliscos superados" #NT!
 building_type_ravenous_basilisk_2: "Basiliscos superados" #NT!
 building_ravenous_basilisk_2_desc: "Esta región ha sido limpiada de su fauna dominante." #NT!
  
 building_ravenous_basilisk_tame: "Basiliscos domesticados" #NT!
 building_type_ravenous_basilisk_tame: "Basiliscos domesticados" #NT!
 building_ravenous_basilisk_tame_desc: "Los voraces basiliscos que residen aquí viven con nosotros simbióticamente. Estos grandes lagartos de seis patas pasaban gran parte de su tiempo cazando o tomando el sol sobre las ramas de árboles más resistentes. Su picadura transmite infecciones tan poderosas que necrotiza el tejido circundante en cuestión de horas, lo que hace que cazar sea una simple cuestión de dar un solo buen mordisco... y luego acechar a su víctima hasta que caiga.\n\nLa presencia de estas criaturas es una bendición para nuestros asentamientos, ya que reduce la necesidad de guardias.\n\nA través de nuestra relación, esta fauna nativa ha crecido mucho más de lo normal..." #NT!
  
 building_basilisk_1: "Basiliscos" #NT!
 building_type_basilisk_1: "Basiliscos" #NT!
 building_basilisk_1_desc: "Los basiliscos han invadido esta zona. Su picadura transmite infecciones tan poderosas que necrotiza el tejido circundante en cuestión de horas. Extirpar las extremidades afectadas es la única manera de evitar una muerte excepcionalmente dolorosa.\n\nLa presencia de estas criaturas supone un riesgo enorme para los asentamientos de la zona y es esencial contar con puestos de guardia adicionales. El desarrollo de esta tierra será extremadamente difícil hasta que desaparezcan." #NT!
  
 building_basilisk_2: "Basiliscos superados" #NT!
 building_type_basilisk_2: "Basiliscos superados" #NT!
 building_basilisk_2_desc: "Esta región ha sido limpiada de su fauna dominante." #NT!
  
  
 building_ghoulish_bat_1: "Murciélagos vampiros macabros" #NT!
 building_type_ghoulish_bat_1: "Murciélagos vampiros macabros" #NT!
 building_ghoulish_bat_1_desc: "Los macabros murciélagos vampiros han invadido esta zona. Estos murciélagos vampiros de color blanco pálido pasan gran parte de su tiempo arrastrándose casi imperceptiblemente por las copas de los árboles sin sangre. Descienden sobre presas dormidas y se atiborran de sangre vital de sus víctimas, drenándolas por completo en minutos, todo sin que ellas sientan nada. Los estómagos de los murciélagos completamente saciados se parecen a las garrapatas; monstruosamente hinchados de sangre.\n\nLa presencia de estas criaturas supone un riesgo enorme para los asentamientos de la zona y es esencial contar con puestos de guardia adicionales. El desarrollo de esta tierra será extremadamente difícil hasta que desaparezcan.\n\nEsta especie parece particularmente resistente a nuestros esfuerzos por expulsarlos. Algo, o alguien, debe estar manteniéndolos cerca..." #NT!
  
 building_ghoulish_bat_2: "Murciélagos vampiros superados" #NT!
 building_type_ghoulish_bat_2: "Murciélagos vampiros superados" #NT!
 building_ghoulish_bat_2_desc: "Esta región ha sido limpiada de su fauna dominante." #NT!
  
 building_ghoulish_bat_tame: "Murciélagos vampiros domesticados" #NT!
 building_type_ghoulish_bat_tame: "Murciélagos vampiros domesticados" #NT!
 building_ghoulish_bat_tame_desc: "Los Tahae-toto que residen aquí viven con nosotros simbióticamente. Estos murciélagos vampiros de color blanco pálido pasan gran parte de su tiempo arrastrándose casi imperceptiblemente por las copas de los árboles sin sangre. Descienden sobre presas dormidas y se atiborran de sangre vital de sus víctimas, drenándolas por completo en minutos, todo sin que ellas sientan nada. Los estómagos de los murciélagos completamente saciados se parecen a las garrapatas; monstruosamente hinchados de sangre.\n\nLa presencia de estas criaturas es una bendición para nuestros asentamientos, ya que reduce la necesidad de guardias.\n\nA través de nuestra relación, esta fauna nativa ha crecido mucho más de lo normal..." #NT!
  
 building_cos_bat_1: "Murciélagos vampiros" #NT!
 building_type_cos_bat_1: "Murciélagos vampiros" #NT!
 building_cos_bat_1_desc: "Los murciélagos vampiros han invadido esta zona. Estos murciélagos vampiros de color blanco pálido pasan gran parte de su tiempo arrastrándose casi imperceptiblemente por las copas de los árboles sin sangre. Descienden sobre presas dormidas y se atiborran de sangre vital de sus víctimas, drenándolas por completo en minutos, todo sin que ellas sientan nada. Los estómagos de los murciélagos completamente saciados se parecen a las garrapatas; monstruosamente hinchados de sangre.\n\nLa presencia de estas criaturas supone un riesgo enorme para los asentamientos de la zona y es esencial contar con puestos de guardia adicionales. El desarrollo de esta tierra será extremadamente difícil hasta que desaparezcan." #NT!
  
 building_cos_bat_2: "Murciélagos vampiros" #NT!
 building_type_cos_bat_2: "Murciélagos vampiros superados" #NT!
 building_cos_bat_2_desc: "Esta región ha sido limpiada de su fauna dominante." #NT!
  
  
 building_cos_wyvern_1: "Wyverns" #NT!
 building_type_cos_wyvern_1: "Wyverns" #NT!
 building_cos_wyvern_1_desc: "Aunque tienen una silueta similar con el sol a sus espaldas, los wyverns de Sothoryos están más estrechamente relacionados con los lagartos terrestres que con los dragones. Sin embargo, no son menos mortíferos cuando caen sobre sus presas desde el cielo abierto; el más grande siendo capaz de llevarse hombres e incluso caballos sin esfuerzo. Los esfuerzos para eliminar a estas bestias de la zona no serán tarea fácil, ya que anidan casi exclusivamente en lugares rocosos y de difícil acceso.\n\nLa presencia de estas criaturas supone un riesgo enorme para los asentamientos de la zona y es esencial contar con guardias adicionales mirando al cielo. El desarrollo de esta tierra será extremadamente difícil hasta que desaparezcan; aunque al menos no hay ningún wyvern alfa presente en esta área..." #NT!
  
 building_cos_wyvern_2: "Wyverns superados" #NT!
 building_type_cos_wyvern_2: "Wyverns superados" #NT!
 building_cos_wyvern_2_desc: "Esta región ha sido limpiada de su fauna dominante." #NT!
  
 building_cos_wyvern_alpha_1: "Wyverns liderados por alfa" #NT!
 building_type_cos_wyvern_alpha_1: "Wyverns liderados por alfa" #NT!
 building_cos_wyvern_alpha_1_desc: "Aunque tienen una silueta similar con el sol a sus espaldas, los wyverns de Sothoryos están más estrechamente relacionados con los lagartos terrestres que con los dragones. Esto es doblemente cierto en el caso de los Alpha Wyverns, criaturas ancianas que se han establecido como líderes de criaturas que de otro modo serían solitarias. En presencia de un alfa, los wyverns se posan en una densa colonia, lo que significa que desalojarlos requerirá no sólo una gran cantidad de esfuerzo, sino también matar al alfa mismo; no sea que simplemente traslade su colonia a otra parte.\n\nLa presencia de estas criaturas es un riesgo enorme para los asentamientos en el área y es esencial que haya guardias adicionales mirando al cielo. El desarrollo de esta tierra será extremadamente difícil hasta que desaparezcan; la presencia de un wyvern alfa presagia perdición..." #NT!
  
 building_cos_wyvern_alpha_2: "Wyverns liderados por Alfa asesinados" #NT!
 building_type_cos_wyvern_alpha_2: "Wyverns liderados por Alfa asesinados" #NT!
 building_cos_wyvern_alpha_2_desc: "Esta región ha sido limpiada de su fauna dominante." #NT!
  
  
 building_cos_carn_plant_1: "Plantas carnívoras" #NT!
 building_type_cos_carn_plant_1: "Plantas carnívoras" #NT!
 building_cos_carn_plant_1_desc: "Quizás el grupo de vida natural más distintivo dentro del Infierno Verde sea su vida vegetal carnívora. Aunque aquí todavía existen variedades más pequeñas que atrapan moscas, éstas son obscenamente eclipsadas por sus primas Sothori.\n\nLas plantas carnívoras Sothori pueden crecer hasta 15 pies de ancho y sus zarcillos sensibles al tacto son capaces de encadenar las extremidades de cualquier criatura, incluidos los humanos, que desencadene una respuesta de ellas. La planta utiliza el propio movimiento de lucha de sus víctimas como catalizador energético para levantarlas y moverlas hacia su cámara de digestión central llena de ácido.\n\nUna vez bañados en estos fluidos digestivos... los supervivientes afirman que hubieran preferido que los dejaran morir, ya que las erupciones y quemaduras persisten durante años." #NT!
  
 building_cos_carn_plant_2: "Plantas carnívoras podadas" #NT!
 building_type_cos_carn_plant_2: "Plantas carnívoras" #NT!
 building_cos_carn_plant_2_desc: "Esta región ha sido limpiada de su fauno dominante... quiero decir, flora." #NT!
  
  
 building_cos_spider_yeen_1: "Atterpolicías yeenistas" #NT!
 building_type_cos_spider_yeen_1: "Atterpolicías" #NT!
 building_cos_spider_yeen_1_desc: "MARCADOR DE LUGAR" #NT!
  
 building_cos_spider_yeen_2: "Attercops eliminados" #NT!
 building_type_cos_spider_yeen_2: "Atterpolicías" #NT!
 building_cos_spider_yeen_2_desc: "Esta región ha sido limpiada de su fauna dominante." #NT!
  
  

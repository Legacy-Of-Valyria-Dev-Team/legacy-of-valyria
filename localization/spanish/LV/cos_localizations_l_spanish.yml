 building_jungle_ruin_03_desc: "Las últimas quemas están casi terminadas y la prospección en el terreno despejado ha comenzado." #NT!
  
 jungle_ruin_04: "Infierno verde" #NT!
 building_jungle_ruin_04: "Infierno verde" #NT!

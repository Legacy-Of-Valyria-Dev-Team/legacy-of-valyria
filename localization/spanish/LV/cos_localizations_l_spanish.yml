 building_jungle_ruin_01_desc: "Aunque está completamente consumida por la jungla, al menos esta provincia no es tan densa como la jungla profunda." #NT!
  
 jungle_ruin_02: "Infierno verde" #NT!
 building_jungle_ruin_02: "Infierno verde" #NT!
 building_type_jungle_ruin_02: "Infierno verde" #NT!
 building_jungle_ruin_02_desc: "Se ha creado un claro y se están llevando a cabo quemas masivas para hacer retroceder tanto a la jungla como a sus ocupantes." #NT!
  
 jungle_ruin_03: "Infierno verde" #NT!

 cos_ambush_events.1000.title: "Marcha silenciosa - Expediciones de Yeen" #NT!
 cos_ambush_events.1000.desc: "Se ha invertido mucho tiempo y recursos en reunir esta expedición armada en los distritos interiores de Yeen. Hay un miedo silencioso en los rostros de aquellos que perforan en formaciones delante de ti, mientras los mariscales intentan no pensar en la ciudad. Sin embargo, todavía hay una determinación sombría en muchos. La voluntad de recuperar o al menos encontrar los cuerpos de aquellos capturados en las noches posteriores a su llegada aquí.\n\nEl patio está inquietante mientras las barricadas son derribadas y no hay gritos que animen a la expedición mientras avanzan... no se oye ni un susurro ni un crujido; como si la propia jungla contuviera la respiración." #NT!
 cos_ambush_events.1000.attack: "Ahora esperamos..." #NT!
  
 cos_ambush_events.1001.title: "Un mar de miembros - Expediciones de Yeen" #NT!
 cos_ambush_events.1001.desc: "No es a la mañana siguiente cuando se ven las primeras señales de la expedición. Docenas de fogatas ardían sobre las paredes interiores. Mis asesores parecen considerar esto como una buena señal... hasta que el humo suba más rápido y en muchos más lugares. Es evidente que algo anda muy mal.\n\nLos gritos ahora resuenan desde el otro lado de las barricadas reemplazadas. Gritos de miedo y advertencia. Apenas pasa un momento antes de que suenen las primeras llamadas de mis propios hombres:\n\n"¡Miren! ¡Están cruzando los muros!"\n\nEl hielo recorre mi corazón mientras todos los ojos se centran en el cuerpo gordo y obsceno de una araña gigante, que se arrastra desde las paredes interiores; seguido poco después por muchas docenas más. Quizás cientos..." #NT!
 cos_ambush_events.1001.attack: "T-¡A las armas! ¡Lanza hacia adelante!" #NT!
  
  
  
     # Decisions # 
  
  
 sack_the_maw: "Saquear las fauces devoradoras" #NT!
 sack_the_maw_decision_desc: "Durante demasiado tiempo los salvajes seguidores de las Fauces Eternas nos han atacado. Pero ahora su fuente de fanatismo está bajo nuestro control...\n\nSimplemente abandonar Las Fauces, ya que correría el riesgo de que sus seguidores retomaran el control. Con sólo un puñado de máquinas de asedio, podríamos mostrarles que su religión pertenece al pasado, junto con sus malas prácticas." #NT!
 sack_the_maw_decision_tooltip: "Saquear las fauces devoradoras" #NT!
 sack_the_maw_decision_confirm_text_desc: "¡Bajen el techo!" #NT!
 sack_the_maw_custom: "Los hombres Brindled de esta región perderán gran parte de su poder antinatural... a menos que se abran las fauces una vez más." #NT!
  
 sack_the_glade: "Arrasar los claros de Balam" #NT!
 sack_the_glade_decision_desc: "Los llamados 'hijos e hijas' han huido una y otra vez de nosotros, retirándose cada vez más hacia las nieblas, pero ahora hemos encontrado su lugar de adoración más sagrado.\n\nQuizás sus voluntades finalmente puedan ser quebrantadas... ¡destruyendo su conexión con su 'Madre' de una vez por todas!" #NT!
 sack_the_glade_decision_tooltip: "Arrasar los claros de Balam" #NT!
 sack_the_glade_decision_confirm_text_desc: "¡Destrúyelos a todos!" #NT!
  sack_the_glade_custom:0 "The followers of the Green Mother will lose much of their resilience... unless the glade is painstakingly regrown over many years. 
  
 empower_the_maw: "Sacrificio a las Grandes Fauces" #NT!
 empower_the_maw_decision_desc: "Las Fauces tienen hambre, anhelan, de alguna manera nos lo hace saber y responderemos a sus llamadas." #NT!
 empower_the_maw_decision_tooltip: "Sacrificio a las Grandes Fauces" #NT!
 empower_the_maw_decision_confirm_text_desc: "Saciar el hambre" #NT!
 empower_the_maw_custom: "Gasta más piedad para recibir mayores regalos." #NT!
  
 empower_the_mother: "Homenaje a la Madre Verde" #NT!
 empower_the_mother_decision_desc: "Hace mucho que no damos gracias a nuestra Madre. De alguna manera, sentimos como uno solo, que Ella está lista para bendecirnos una vez más." #NT!
 empower_the_mother_decision_tooltip: "Homenaje a la Madre Verde (Traducción- ¿Lo hice bien mami?)" #NT!
 empower_the_mother_decision_confirm_text_desc: "Trae las ofrendas" #NT!
 empower_the_mother_custom: "Gasta piedad para recibir mayores poderes." #NT!
  
 sack_the_bloodletters_hall: "Arrasar el Salón del Desangrador" #NT!
 sack_the_bloodletters_hall_decision_desc: "Los árboles sin sangre reciben su nombre por el predominio de una especie de murciélago vampiro de color blanco pálido que vive allí. Que los murciélagos son anormalmente grandes y pueden matar a un hombre en unos minutos sin siquiera perturbar su sueño. Esta amenaza ha dado origen de forma inquietante a un culto de adoración a la sangre en las profundidades de esta zona; sus seguidores son conocidos simplemente como 'Blooodletters'\n\nEstos viles cultistas deben y serán desarraigados de su fuente misma. Ahora que huyen de su salón presas del pánico, lo arrasaremos hasta los cimientos." #NT!
 sack_the_bloodletters_hall_decision_tooltip: "Arrasar el Salón del Desangrador" #NT!
 sack_the_bloodletters_hall_decision_confirm_text_desc: "¡Ponlo a la antorcha!" #NT!
 sack_the_bloodletters_hall_custom: "Los bloqueadores de murciélagos vampiros macabros finalmente podrán eliminarse, sin sus cuasi-pastores que nos detengan." #NT!
  
 cos_tame_bats: "Pacificar a los murciélagos vampiros locales" #NT!
 cos_tame_bats_decision_desc: "Los Tahae-toto, o murciélagos vampiros como los llaman los forasteros, son espíritus afines a nosotros. Sienten la sed, tal como la sentimos nosotros. Aunque se aprovechan de los forasteros, la savia que cubre nuestros cuerpos desde una edad temprana les hace saber que no queremos hacerles daño. Ya es hora de que trabajemos con ellos y no contra ellos." #NT!
 cos_tame_bats_decision_tooltip: "Pacificar a los murciélagos vampiros locales" #NT!
 cos_tame_bats_decision_confirm_text_desc: "Como uno" #NT!
 cos_tame_bats_custom: "Es posible que tengamos que tomar esta decisión varias veces si hay muchos que domesticar..." #NT!
  
 treat_with_feeders: "Domar a Tahae-toto" #NT!
 treat_with_feeders_decision_desc: "Dada la interacción constante con las manadas locales de 'murciélagos vampiros', no sorprende que un alfa ocasionalmente busque un suministro constante de alimento con sus pastores.\n\nLos macabros murciélagos vampiros siempre están hambrientos de sangre fresca, aunque no les gusta alejarse demasiado de su hábitat natural. Sin embargo, con suficiente incentivo y entrenamiento, podemos guiar a nuestros vecinos hacia los enemigos, propagando así la sed a todos.\n\nRecordarán la sangre de su amo y probablemente se dispersarán de regreso a su hogar original si este amo muere." #NT!
 treat_with_feeders_decision_tooltip: "Pastorea una manada de murciélagos vampiros locales más cerca de casa. Recordarán la sangre de su maestro y probablemente se dispersarán de regreso a su hogar original si este maestro muere." #NT!
 treat_with_feeders_decision_confirm_text_desc: "¡Prepara un festín sangriento!" #NT!
 treat_with_feeders_custom: "Nuestros espíritus parientes estarán listos cerca de nuestra capital hasta que estemos listos para desatarlos contra enemigos desprevenidos." #NT!
  
 treat_with_devourers: "Domesticar basiliscos voraces" #NT!
 treat_with_devourers_decision_desc: "MARCADOR DE LUGAR" #NT!
 treat_with_devourers_decision_tooltip: "MARCADOR DE LUGAR" #NT!
 treat_with_devourers_decision_confirm_text_desc: "MARCADOR DE LUGAR" #NT!
 treat_with_devourers_custom: "MARCADOR DE LUGAR" #NT!
  
 cos_ruin_completion_fallback: "Reserva de finalización de ruina de depuración" #NT!
 cos_debug_trigger_decision_desc: "MARCADOR DE LUGAR" #NT!
 cos_debug_trigger_decision_tooltip: "MARCADOR DE LUGAR" #NT!
 cos_debug_trigger_decision_confirm_text_desc: "MARCADOR DE LUGAR" #NT!
  
 cos_debug_trigger_dont_touch: "Depurar No tocar" #NT!
  
 sack_the_corpse_mounds: "Desmantelar los montículos de cadáveres" #NT!
 sack_the_corpse_mounds_decision_desc: "Amontonados en un claro de la jungla hay montículos formados por miles de cuerpos y artefactos en ruinas, tal vez de magnitudes mayores. Los nativos de esta región se llevan a todos los "invasores" derrotados desde la costa, junto con todas sus posesiones extranjeras para apilarlas aquí.\n\nLos basiliscos son atraídos por cientos, tal vez incluso miles, a estas colinas apestosas y podridas. Si alguna vez esperamos hacer uso de este raro claro natural en la jungla, estos montículos tienen que desaparecer.\n\nAparte del área en sí, examinar los desechos podría ser muy rentable." #NT!
 sack_the_corpse_mounds_decision_tooltip: "Desmantelar los montículos de cadáveres" #NT!
 sack_the_corpse_mounds_decision_confirm_text_desc: "Hasta las rodillas en huesos viejos..." #NT!
 sack_the_corpse_mounds_custom_1: "Los bloqueadores de Basilisco voraz finalmente podrán eliminarse, sin que su apestosa fuente de alimento los mantenga cerca." #NT!
 sack_the_corpse_mounds_custom_2: "Durante las operaciones de limpieza, es posible que te encuentres con un puñado de artefactos antiguos. Han estado trabajando en estos montículos durante cientos, si no miles, de años." #NT!
  
 cos_tame_basilisks: "Pacificar a los basiliscos locales" #NT!
 cos_tame_basilisks_decision_desc: "Los Raksasa, o basiliscos gigantes como los llaman los forasteros, son mensajeros de los propios dioses. Ellos sienten la gran hambre, al igual que nosotros. Aunque se aprovechan de los forasteros, nuestro cuidado de los Montículos de Cadáveres los ha hecho casi accesibles hacia nosotros como sus cuidadores. Ya es hora de que trabajemos con ellos y no contra ellos." #NT!
 cos_tame_basilisks_decision_tooltip: "Pacificar a los basiliscos locales" #NT!
 cos_tame_basilisks_decision_confirm_text_desc: "Como uno" #NT!
 cos_tame_basilisks_custom: "Es posible que tengamos que tomar esta decisión varias veces si hay muchos que domesticar..." #NT!
  
  
 cos_swamp_wyvern_bonding_decision: "Búsqueda de venerables wyverns de pantano" #NT!
 cos_swamp_wyvern_bonding_decision_desc: "Aunque los wyverns de pantano más jóvenes se enojan rápidamente y son muy territoriales, los de edad venerable son mucho más abiertos a la manipulación.\n\nAl enviar exploradores para encontrar, alimentar y dirigir a estos pocos elegidos, podemos obtener una ventaja excepcionalmente aguda contra nuestros enemigos." #NT!
 cos_swamp_wyvern_bonding_decision_decision_tooltip: ""
 cos_swamp_wyvern_bonding_decision_decision_confirm_text_desc: "Envía a los exploradores" #NT!
 cos_wyvern_decision_tooltip: "El tiempo dirá si algún wyvern adecuado se posa cerca..." #NT!
  
  
  
     # Events # 
  
  
 cos_swamp_wyvern_bonding: "Atrayendo a un Leviatán - El Gran Pantano" #NT!
 cos_swamp_wyvern_bonding_title: "Atrayendo a un Leviatán - El Gran Pantano" #NT!
 cos_swamp_wyvern_bonding_desc:0 "The wyverns that call the Great Swamp their home are extremely territorial creatures. Constantly vying against their neighbors for greater swathes of the sodden ground to call their own. Approaching the territory of one such beast will almost certainly end in disaster, as their lethal beaks and tails make short work of any non-wyvern foe.\n\nHowever, as they grow into a more venerable age, the swamp wyverns become lazier and more docile; more accepting to offerings from man. If done well, the beast can grow dependant on their providers, eventually becoming willing to follow direction towards new sources of 'food'. Whether or not that food happens to be other, more hostile tribespeople is irrelevant to the beast.\n\nSeveral scouts have returned and one steps forward to speak: "Los wyverns que tienen su hogar en el Gran Pantano son criaturas extremadamente territoriales. Compitiendo constantemente contra sus vecinos por mayores extensiones de suelo empapado que puedan llamar suyas. Acercarse al territorio de una de esas bestias casi seguramente terminará en desastre, ya que sus letales picos y colas eliminan rápidamente a cualquier enemigo que no sea un wyvern.\n\nSin embargo, a medida que crecen hasta una edad más venerable, los wyverns de pantano se vuelven más perezosos y dóciles; Aceptando más las ofrendas del hombre. Si se hace bien, la bestia puede volverse dependiente de sus proveedores y eventualmente estar dispuesta a seguir instrucciones hacia nuevas fuentes de "alimento". Si esa comida proviene o no de otras tribus más hostiles es irrelevante para la bestia.\n\nVarios exploradores han regresado y uno se adelanta para hablar: "Se han encontrado tres. ¿A cuántos podemos darnos el lujo de alimentar?"" #NT!
 cos_swamp_wyvern_bonding.opt1: "solo el uno" #NT!
 cos_swamp_wyvern_bonding.opt2: "Dos serán más que suficientes" #NT!
 cos_swamp_wyvern_bonding.opt3: "Tres y que tiemblen nuestros enemigos..." #NT!
 cos_swamp_wyvern_bonding.opt4: "Ninguno... esto fue una pérdida de tiempo." #NT!
  
  
 cos_empower.1001.t: "Alimentando a las fauces devoradoras" #NT!
 cos_empower.1001.a: "Bagres gigantes siempre hambrientos en las orillas del Zamoyos" #NT!
 cos_empower.1001.b: "Un gran simio talador de árboles del sur" #NT!
 cos_empower.1001.c: "¡Un wyvern astuto y monstruoso del Paso Verde!" #NT!
 cos_empower.1001.desc: "El año gira y con su paso debemos decidir cuál será nuestro principal homenaje a las Fauces Devoradoras de este año. Como hemos hecho en años más escasos, los tributos más pequeños no ofenderán a los dioses. Pero para conseguir mayores poderes para nuestro pueblo, debemos considerar precios más altos.\n\nLos dioses TENDRÁN su tributo, independientemente de si pretendemos retenerlo o no... ¿Qué será devorado este año, para que su poder pueda ser transferido a nosotros?" #NT!
  
  
 cos_empower.1002.t: "Petición a la Madre Verde" #NT!
 cos_empower.1002.a: "Cestas de forraje fresco" #NT!
 cos_empower.1002.b: "Adornos de hematites tallados en los acantilados." #NT!
 cos_empower.1002.c: "Una rara orquídea nocturna del lago Zamoyos." #NT!
 cos_empower.1002.desc: "El año gira y con su paso debemos decidir cuál será nuestro principal homenaje a la Madre Verde de este año. Como hemos hecho en años más escasos, los tributos más pequeños no ofenderán a nuestro dios. Pero para conseguir mayores poderes para nuestro pueblo, debemos considerar precios más altos.\n\nComo verdaderos hijos e hijas, nos avergonzaríamos terriblemente si no agradeciéramos a nuestra propia madre. La pregunta sigue siendo: ¿qué regalo le presentaremos este año?" #NT!
  
  
 cos_blocker.1001.t: "El wyvern alfa" #NT!
 cos_blocker.1001.a: "Combate singular tal como los dioses lo concibieron" #NT!
 wyvern_duel_tooltip_1: "Te enfrentas al alfa en un duelo solo." #NT!
 cos_blocker.1001.b: "Rodea a la bestia y no te arriesgues." #NT!
 cos_blocker.1001.b.success.desc: "Rodeamos y matamos a la bestia." #NT!
 cos_blocker.1001.b.failure.desc: "Somos repelidos por la bestia, pero yo escapo entre la multitud que huye." #NT!
 cos_blocker.1001.c: "Algo encubierto... veneno tal vez..." #NT!
 cos_blocker.1001.c.success.desc: "La bestia está muerta, la colonia se dispersa." #NT!
 cos_blocker.1001.c.failure.desc: "Parece que no pasa nada... que pérdida de tiempo." #NT!
 cos_blocker.1001.d: "Esta provincia no vale mi vida." #NT!
 cos_blocker.1001.desc: "Esta provincia ha tenido un importante problema con los wyverns desde que pusimos un pie aquí. Aunque los colonos han estado trabajando diligentemente para eliminarlos, y a costa de muchas vidas, ha quedado claro que no podemos avanzar.\n\nLa presencia de un wyvern alfa complica las cosas. Si continuamos ahora, esta bestia simplemente trasladará su colonia a otra parte, potencialmente a un área más poblada. Con esto en mente...\n\n¿Cómo debería enfrentarme a esta bestia?" #NT!
  
 cos_blocker.1002.t: "El wyvern alfa" #NT!
 cos_blocker.1002.a: "No más dudas..." #NT!
 cos_blocker.1002.a.success.desc: "Estoy por encima de los enemigos más poderosos de Sothoryos..." #NT!
 cos_blocker.1002.a.failure.desc: "Soy repelido por la bestia y sufro heridas graves..." #NT!
 cos_blocker.1002.a.critical.desc: "Que pico tan afilado..." #NT!
  
 cos_blocker.1002.b: "¡Quizás todavía pueda escapar!" #NT!
 cos_blocker.1002.b.success.desc: "Sufro algunas heridas leves, pero escapo..." #NT!
 cos_blocker.1002.b.failure.desc: "Sufro heridas graves, pero escapo..." #NT!
  
 cos_blocker.1002.desc: "Aunque me advirtieron contra tal temeridad... nada en retrospectiva cambia el hecho de que ahora me enfrento a un wyvern alfa en combate singular.\n\nLa bestia se alza ante mí, con las alas extendidas a ambos lados en un desafío. En este estado, el alfa parece tener casi 20 metros (~60 pies) de ancho y su silueta contra el cielo me provoca un escalofrío. Sus garras son afiladas, su pico más afilado. Ahora sólo tengo un momento para hacer mi movimiento..." #NT!
  
 ################## 
  
 cos_yeen_ruins.1000.t: "El vestíbulo - Expediciones de Yeen" #NT!
 cos_yeen_ruins.1000.desc: "El palacio es viejo, muy viejo. Lleno de recuerdos y rabia. Telarañas tejidas formando gruesas cuerdas, aunque no menos pegajosas, se extienden formando grandes redes a lo largo de los numerosos pasillos y pasillos. Tal como están las cosas, la entrada es completamente intransitable y sólo una hoja bien afilada es capaz de atravesarla.\n\nAún no hay señales de que las criaturas tejen estas redes, aunque la sensación de ser observado se hace más fuerte cuanto más nos quedamos en el vestíbulo..." #NT!
  
 cos_yeen_ruins.1000.a: "¡Nos abriremos camino a través de ellos!" #NT!
 cos_yeen_ruins.1000.a.success.desc: "¡Hacemos buen tiempo hacia el gran salón!" #NT!
 cos_yeen_ruins.1000.a.failure.desc: "Avanzamos lentamente..." #NT!
 cos_yeen_ruins.1000.a.critical.desc: "Avanzamos lentamente... y muchos hombres han desaparecido sin dejar rastro." #NT!
  
 cos_yeen_ruins.1000.b: "¡Maldita sea, quémalo hasta los cimientos!" #NT!
 cos_yeen_ruins.1000.b.success.desc: "Los daños a los edificios circundantes se mantienen al mínimo." #NT!
 cos_yeen_ruins.1000.b.failure.desc: "Los edificios circundantes están arrasados." #NT!
 cos_yeen_ruins.1000.b.critical.desc: "El distrito circundante está devastado... espera, ¿qué es eso que sale volando del tejado?" #NT!
  
 cos_yeen_ruins.1000.c: "No es el momento adecuado... cierra las puertas y disuelve la expedición." #NT!
  
  
 cos_yeen_ruins.1001.t: "Salas centrales - Expediciones de Yeen" #NT!
 cos_yeen_ruins.1001.desc: "Ante nosotros se extiende un vasto laberinto orgánico de telarañas, sacos de huevos y restos disecados. Estamos en lo que alguna vez debió ser el gran salón del palacio, ahora parece ser el corazón de la temida plaga de arañas de Yeen." #NT!
  
 cos_yeen_ruins.1001.a: "¡Lanzas al frente! ¡Hachas a los flancos! ¡Adelante!" #NT!
 cos_yeen_ruins.1001.a.success.desc: "Esas criaturas sin sentido nunca tuvieron una oportunidad..." #NT!
 cos_yeen_ruins.1001.a.failure.desc: "Estamos derrotados y sufrimos grandes pérdidas." #NT!
 cos_yeen_ruins.1001.a.critical.desc: "Me encuentro solo en los pasillos." #NT!
  
 cos_yeen_ruins.1001.b: "¡Maldita sea, quémalo hasta los cimientos!" #NT!
 cos_yeen_ruins.1001.b.success.desc: "Los daños a los edificios circundantes se mantienen al mínimo." #NT!
 cos_yeen_ruins.1001.b.failure.desc: "Los edificios circundantes están arrasados." #NT!
 cos_yeen_ruins.1001.b.critical.desc: "El distrito circundante está devastado... espera, ¿qué es eso que sale volando del tejado?" #NT!
  
 cos_yeen_ruins.1001.c: "No es el momento adecuado... cierra las puertas y disuelve la expedición." #NT!
  
 cos_yeen_ruins.1002.t: "Rodeado - Expediciones de Yeen" #NT!
 cos_yeen_ruins.1002.desc: "Yo y los que permanecen a mi lado nos encontramos ahora rodeados por estas abominaciones arácnidas en los pasillos centrales. Los cuerpos paralizados de los caídos ya están siendo envueltos y encerrados. Veo miedo en los rostros de mis compañeros. Sus ojos se dirigen hacia la entrada, todavía parcialmente libre de arañas...\n\nSin embargo, los muertos o moribundos nos presentan una oportunidad única. Las arañas que ya han comenzado a comer osos pardos parecen especialmente concentradas en ellos. ¡Esta podría ser una oportunidad para tomar ventaja!\n\nO una forma más rápida de morir..." #NT!
  
 cos_yeen_ruins.1002.a: "Listo conmigo! ¡Vengamos a los caídos!" #NT!
 cos_yeen_ruins.1002.a.success.desc: "Traemos un poco de paz a los caídos..." #NT!
 cos_yeen_ruins.1002.a.failure.desc: "Estamos derrotados y sufrimos grandes pérdidas." #NT!
 cos_yeen_ruins.1002.a.critical.desc: "Me encuentro solo en los pasillos..." #NT!
 cos_yeen_ruins.1002.b: "¡Retiro! ¡Nos abriremos camino!" #NT!
 cos_yeen_ruins.1002.b.success.desc: "Al menos salimos con vida. Bueno... la mayoría de nosotros." #NT!
 cos_yeen_ruins.1002.b.failure.desc: "Al menos salimos con vida. Bueno... algunos de nosotros." #NT!
 cos_yeen_ruins.1002.b.critical.desc: "Me veo obligado a huir más adentro... solo." #NT!
  
 cos_yeen_ruins.1002.c: "Es hora de retroceder... cerrar las puertas y disolver la expedición." #NT!
  
 cos_yeen_ruins.1003.t: "Los salones del llanto" #NT!
 cos_yeen_ruins.1003.desc: "Más allá del nido propiamente dicho hay una extraña sala completamente desprovista de redes. De hecho, esta zona está desprovista de cualquier signo de criaturas vivientes. El pasaje desemboca en una enorme cámara, abierta al aire libre a través de un balcón lateral, que domina el barrio noble. Las paredes, el suelo y el techo están tallados con algún tipo de lenguaje, con colores oscuros arremolinándose en las letras. Por el rabillo del ojo casi puedes verlos palpitar, pero siempre permanecen aparentemente inertes una vez que vuelves a concentrarte en ellos.\n\nLas tallas están impecables y no pasa mucho tiempo antes de que te des cuenta de cómo es posible. Las paredes rezuman constantemente una especie de fluido aceitoso a una velocidad extremadamente lenta; casi imperceptible. Este 'icor' fluye hacia abajo a través de pequeños espacios entre las baldosas del piso hacia un destino desconocido, evitándonos su acumulación.\n\nAparte de las fascinantes paredes, la habitación no tiene nada especial y está desnuda. Pasan unos minutos más antes de que se encuentre algo más de importancia mientras se registra la vasta cámara. Marcas de garras... enormes e inconfundiblemente las de un dragón. También hay marcas de quemaduras, una región de las tallas arrasada por la llama del dragón; Habías oído que el fuego del dragón, especialmente de un espécimen de este tamaño, habría convertido la piedra fría en mantequilla en unos instantes, pero esta piedra negra aceitosa parece haber resistido el efecto, aunque sólo sea un poco...\n\nUna última llamada de atención resuena en toda la cámara de eco. Los antiguos restos decadentes de un camping cerca del balcón. Parece que su dueño se fue a toda prisa, dejando atrás gran parte de su campamento, en particular #bold un baúl de equipaje con pequeños artefactos valyrios #! Más emocionante aún, escondido en un paquete en el fondo de un baúl hay un huevo de escamas grandes. ¡Este debe ser el campamento de Jaenara Belaerys, por lo que este huevo es el del dragón Terrax! Rezas para que los años en este lugar malvado no hayan afectado al huevo de alguna manera..." #NT!
  
 cos_yeen_ruins.1003.a: "¡Hemos tenido éxito donde los señores dragón fracasaron!" #NT!
 cos_yeen_ruins.1003.a.success.desc: "Esas criaturas sin sentido nunca tuvieron una oportunidad..." #NT!
 cos_yeen_ruins.1003.a.failure.desc: "Estamos derrotados y sufrimos grandes pérdidas." #NT!
 cos_yeen_ruins.1003.a.critical.desc: "Me encuentro solo en los pasillos. Escucho sonidos a mi alrededor...\n\nDe repente, esos sonidos de chirridos y chasquidos se callan y soy tirado hacia arriba por mi hombro. Siento un dolor repentino y punzante en el muslo, antes de que el dolor... todo dolor me abandone. Así termino." #NT!
  
 cos_yeen_ruins.9999.t: "Solo en la oscuridad - Expediciones de Yeen" #NT!
 cos_yeen_ruins.9999.desc: "Me encuentro solo en los pasillos. Escucho sonidos a mi alrededor...\n\nDe repente, esos sonidos de chirridos y chasquidos se callan y soy tirado hacia arriba por mi hombro. Siento un dolor repentino y punzante en el muslo, antes de que el dolor... todo dolor me abandone. Así termino." #NT!
 cos_yeen_ruins.9999.a: "Así termina mi historia..." #NT!
  
     # Custom Tooltips # 
  
 yeen_burn_it_down: "Queme cualquier rastro de vida del edificio... junto con cualquier cosa de valor o interés que haya dentro." #NT!
 yeen_partial_refund: "Se recupera gran parte del patrimonio invertido en la expedición." #NT!
 yeen_death: "No hay segundas oportunidades. Mueres solo." #NT!
 yeen_advance: "Avanzas hacia adelante..." #NT!
 yeen_no_retreat: "Aún tienes la opción de forzar otro ataque..." #NT!
  

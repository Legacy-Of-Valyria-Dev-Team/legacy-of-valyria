l_spanish:
   # Northern Valyria 
 lv_tradition_north_valyrian_1_name: "Ecos del [valyrian_freehold_short|E]" #NT!
 lv_tradition_north_valyrian_1_desc: "Puede que la Perdición se haya apoderado de Valyria en llamas y ruinas, pero su eco persiste en estas ciudades: descolorido, retorcido y medio olvidado. Aquí, las antiguas tradiciones se siguen sin comprenderlas y las leyendas de un pasado glorioso acechan en las sombras. Esta cultura es el legado de un imperio perdido, un tapiz tejido con restos de un poder que una vez tocó el cielo pero que ahora yace en el polvo, incapaz de desvanecerse por completo o regresar." #NT!
  
 lv_tradition_north_valyrian_2_name: "Renacimiento del [valyrian_freehold_short|E]" #NT!
 lv_tradition_north_valyrian_2_desc: "El [valyrian_freehold_short|E] nunca estuvo realmente perdido, solo inactivo, esperando que las cenizas se enfriaran y las brasas chispearan una vez más. Ahora, después de siglos de letargo, la sangre de la antigua Valyria se agita y el fuego que una vez talló su legado en piedra y acero está surgiendo. Este renacimiento no es un eco sombrío sino un resurgimiento de poder y ambición puros, guiados por la sabiduría antigua y atenuados por los errores de un pasado fracturado. Las tradiciones que alguna vez se siguieron ciegamente ahora se renuevan con un propósito, mientras que las leyendas cobran vida, no como mitos sino como planos para un imperio restaurado." #NT!
  
 lv_tradition_mantaryan_name: "Monstruosidades mantarias" #NT!
 lv_tradition_mantaryan_desc: "Provenientes de la misteriosa ciudad de Mantarys en las ruinas de la península de Valyria, son conocidos por su aislamiento y extrañas costumbres. Se rumorea que tienen distintas deformidades físicas y que practican magia oscura, probablemente restos de la influencia de Valyria. Los mantarios son solitarios y temidos, su ciudad rara vez se visita debido a su peligrosa reputación y a las siniestras criaturas que se dice que acechan en las cercanías." #NT!
 culture_parameter_mantaryan_mutation_trait_bonuses: "La línea de rasgos de mutación mantaria que incluye [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )]0, [GetTrait('scaly').GetName( GetNullCharacter )]1 y [GetTrait('scaly').GetName( GetNullCharacter )]2 tiene bonificaciones adicionales" #NT!
 culture_parameter_mantaryan_mutation_trait_more_common: "La línea de rasgos de mutación mantaria que incluye [GetTrait('doomsurvivors').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )], [GetTrait('scarred').GetName( GetNullCharacter )], [GetTrait('burned').GetName( GetNullCharacter )], [GetTrait('hunchbacked').GetName( GetNullCharacter )], [GetTrait('clubfooted').GetName( GetNullCharacter )], [GetTrait('stuttering').GetName( GetNullCharacter )], [GetTrait('lisping').GetName( GetNullCharacter )], [GetTrait('wheezing').GetName( GetNullCharacter )], [GetTrait('spindly').GetName( GetNullCharacter )], [GetTrait('scaly').GetName( GetNullCharacter )]0, [GetTrait('scaly').GetName( GetNullCharacter )]1 y [GetTrait('scaly').GetName( GetNullCharacter )]2 son más comunes" #NT!
 culture_parameter_unlock_maa_mantaryan_monsters: "Puede reclutar a [GetMaA('mantaryan_monsters').GetName] como [men_at_arms|E]" #NT!
  
 lv_tradition_tolosi_name: "Tentaciones tortuosas" #NT!
 lv_tradition_tolosi_desc: "Los Tolosi son un pueblo endurecido y temible, famoso en todo Essos por su trato brutal a los cautivos y su inflexible persecución a los pueblos involucrados en el comercio de esclavos. Empuñan hondas de plomo con una precisión mortal y prefieren este método de guerra por su capacidad para mutilar y aterrorizar a distancia. Sin inmutarse por el sufrimiento de los demás, los Tolosi ven la insensibilidad como una fortaleza, dando forma a una sociedad donde la crueldad es una parte tan importante de su identidad como su famosa habilidad con la honda." #NT!
 culture_parameter_unlock_maa_tolosi_slingers: "Puede reclutar a [GetMaA('tolosi_slingers').GetName] como [men_at_arms|E]" #NT!
  
 lv_tradition_elyrian_name: "El camino esencial" #NT!
 lv_tradition_elyrian_desc: "Este camino da forma al pueblo de Elyria, combinando sabiduría espiritual con una burocracia sofisticada y una próspera economía mercantil, que incluye la polémica práctica del comercio de esclavos. Si bien su sociedad se centra en el comercio y el poder, también son conocidos por su hospitalidad y se enorgullecen de sus arqueros de élite, cuyas excepcionales habilidades de tiro con arco son una señal de fuerza y ​​precisión." #NT!
 culture_parameter_unlock_maa_elyrian_longbowmen: "Puede reclutar a [GetMaA('elyrian_longbowmen').GetName] como [men_at_arms|E]" #NT!
  
   # Dothraki 
 culture_parameter_unlock_maa_dothraki_riders: "Los [GetMaA('dothraki_riders').GetName] [men_at_arms|E] son reclutables." #NT!
 culture_parameter_physique_good_3_trait_more_common: "Los [GetTrait('physique_good_3').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )] y [GetTrait('physique_good_1').GetName( GetNullCharacter )] [trait|E] son más comunes." #NT!
 culture_parameter_lifestyle_voyager_trait_more_common: "El [GetTrait('lifestyle_voyager').GetName( GetNullCharacter )] [trait|E] es más común." #NT!
 culture_parameter_lifestyle_wayfarer_trait_more_common: "El [GetTrait('lifestyle_wayfarer').GetName( GetNullCharacter )] [trait|E] es más común." #NT!
  
   # Gogossos 
 lv_tradition_blood_cultists_name: "Cultistas de sangre" #NT!
 lv_tradition_blood_cultists_desc: "Esta cultura se enorgullece de su fascinación por la magia de sangre y su capacidad de controlarla, aunque sus poderes se han debilitado enormemente después de la caída de Valyria, todavía siguen siendo uno de los últimos pueblos en la tierra en poder hacer algo similar a las artes místicas, lo que les otorga una inmensa influencia para disgusto de todos..." #NT!
 culture_parameter_unlock_maa_berserkers: "Puede reclutar a [GetMaA('gogossi_berserkers').GetName] como [men_at_arms|E]" #NT!
 culture_parameter_unlock_maa_blood_mutants: "Los [GetMaA('blood_mutants').GetName] [men_at_arms|E] son reclutables." #NT!
 culture_parameter_sadistic_trait_more_common: "El [GetTrait('sadistic').GetName( GetNullCharacter )] [trait|E] es más común." #NT!
  
   # Asshai 
 lv_tradition_sorcerers_name: "Hechiceros" #NT!
 lv_tradition_sorcerers_desc: "Los miembros de esta cultura son conocidos por su fascinación, estudios y práctica de lo arcano. Fuerzas sombrías y místicas conocidas como magia los hacen increíblemente poderosos." #NT!
 culture_parameter_witch_trait_more_common: "El [GetTrait('witch').GetName( GetNullCharacter )] [trait|E] es más común." #NT!
 culture_parameter_unlock_maa_esoteric_grenadiers: "Los [GetMaA('esoteric_grenadiers').GetName] [men_at_arms|E] son reclutables." #NT!
  
 lv_tradition_mountain_diviners_name: "Adivinos de la montaña" #NT!
 lv_tradition_mountain_diviners_desc: "Esta Cultura ha perdido gradualmente sus rasgos hechiceros debido a su migración a las montañas y la consiguiente separación de la principal sociedad hechicera, convirtiéndose así en adivinos de las montañas y perdiendo la mayor parte de todos los poderes y ventajas que los acompañan. También han adquirido la capacidad de descubrir secretos mediante trucos y pruebas, y pueden dar y utilizar información por la causa o el precio correcto." #NT!
 culture_parameter_unlock_maa_shadow_raiders: "Los [GetMaA('shadow_raiders').GetName] [men_at_arms|E] son reclutables." #NT!

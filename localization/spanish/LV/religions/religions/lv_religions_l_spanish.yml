   ## Asshai Religion 
 shadowbinders: "Vinculadores de sombras" #NT!
 shadowbinders_religion: "Vinculadores de sombras" #NT!
 shadowbinders_adj: "Vinculadores de sombras" #NT!
 shadowbinders_religion_adj: "Lejano Oriente Essosi" #NT!
 shadowbinders_adherent: "Carpeta de sombras" #NT!
 shadowbinders_adherent_plural: "Vinculadores de sombras" #NT!
 shadowbinders_religion_desc: "La fe Shadowbinder se practica principalmente en las tierras sombrías de Asshai y las regiones circundantes, es una religión misteriosa y esotérica centrada en la manipulación de las sombras y la magia oscura. Los seguidores veneran la sombra y la magia como herramienta y esencia divina, creyendo que contienen los secretos del poder y el conocimiento ocultos a la luz. Los Vinculadores de Sombras realizan intrincados rituales para aprovechar este poder, que a menudo involucran magia de sangre y símbolos arcanos, buscando controlar la oscuridad y comunicarse con las enigmáticas fuerzas que habitan en su interior." #NT!
  
   # Doctrines 
 doctrine_asshaii_pantheon_name: "Los dioses de la sombra" #NT!
 doctrine_asshaii_pantheon_desc: "Esta fe sigue a los misteriosos dioses de la sombra." #NT!
 doctrine_asshaii_syncreticism_name: "Sincretismo ashai'i" #NT!
 doctrine_asshaii_syncreticism_desc: "Los dioses de la sombra, por enigmáticos que sean, han llegado a ser considerados dignos de nuestro respeto y adoración, y por lo tanto honraremos los derechos y tradiciones de sus devotos." #NT!
  
 tenet_magicae_cultus_name: "Culto mágico" #NT!
 tenet_magicae_cultus_desc: "Magicae Cultus, como su nombre lo indica, es una tradición mística dedicada al estudio y veneración de fuerzas misteriosas arcanas. Las culturas con esta tradición buscan iluminación y poder a través de antiguos rituales, hechizos y comunión con energías mágicas invisibles que dan forma al mundo." #NT!
  
   ## Stonemen 
 stonemen_religion: "Hombres de piedra" #NT!
 stonemen_religion_adj: "Hombres de piedra" #NT!
 shrouded_lord: "Señor envuelto" #NT!
 shrouded_lord_adj: "Muerte posterior a Valyria" #NT!
 shrouded_lord_adherent: "Vasija envuelta" #NT!
 shrouded_lord_adherent_plural: "Vasos envueltos" #NT!
 shrouded_lord_desc: "Los seguidores del Señor Cubierto veneran a una figura misteriosa y sombría que se cree que gobierna la muerte y el más allá. Arraigada en las oscuras leyendas de Valyria, esta fe entrelaza la muerte con el poder y el dolor. Los seguidores del Señor Cubierto abrazan el sufrimiento, creyendo que a través de la exaltación del dolor, pueden trascender los límites mortales y ganarse el favor en la otra vida. El sacrificio humano es fundamental para sus ritos, una sombría ofrenda para apaciguar al Señor Envuelto y asegurar su guía en el oscuro dominio de la muerte." #NT!
  
   ## Gogossi Heresies 
 green_wyrm_religion_adj: "valyrio" #NT!
 green_wyrm_religion: "Culto del Wyrm Verde" #NT!
 green_wyrm: "Culto del Wyrm Verde" #NT!
 green_wyrm_adj: "Culto del Wyrm Verde" #NT!
 green_wyrm_adherent: "Wyrmitas" #NT!
 green_wyrm_adherent_plural: "Wyrmitas" #NT!
 green_wyrm_religion_desc: "El culto a la religión del Wyrm Verde es un descendiente de los Dioses de Valyria que comenzó en las costas de gogossi, al igual que el Señor envuelto, esta cultura venera la muerte y la sangre y las ve como una forma de comunicarse con los dioses y asegurar su lugar en el más allá, además, la santidad de la naturaleza es una de sus creencias centrales, dando su propio toque de luz a una religión generalmente oscura." #NT!
  
   # Doctrines 
 tenet_junglecaster_name: "Oráculos de la selva" #NT!
 tenet_junglecaster_desc: "Esta religión valora la magia y su práctica, entiende y respeta su crucial e innegable conexión con la naturaleza, conciliandola con sus sangrientas tradiciones." #NT!

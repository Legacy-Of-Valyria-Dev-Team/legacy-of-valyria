   # Expedition 
 lv_activity_expedition: "Expedición" #NT!
 lv_activity_expedition_host_an_a: "un" #NT!
 lv_activity_expedition_desc: "Aventurarse más allá de lo conocido es coquetear tanto con la fortuna como con la ruina. Las expediciones prometen descubrimientos, ya sean reliquias perdidas enterradas en ruinas olvidadas o tierras fértiles esperando la mano de un asentamiento.\n\nLas expediciones están dirigidas por un comandante elegido, ya sea usted mismo o un agente de confianza, y su éxito depende de la preparación, la habilidad y un poco de suerte. Lo que nos espera es incierto... pero también lo es la recompensa." #NT!
 lv_activity_expedition_host_desc: "$BULLET_WITH_TAB$Puede ganar [artifacts|E]\n$BULLET_WITH_TAB$Puede ganar [prestige_i] [prestige|E]\n$BULLET_WITH_TAB$Puede ganar [legitimacy_i] [legitimacy|E]" #NT!
 lv_activity_expedition_selection_tooltip: "Financia una expedición para descubrir tesoros perdidos o explorar tierras para futuros asentamientos.\n\nRecompensas previstas:\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[legitimacy_i] [legitimacy|E]" #NT!
  
 expedition_type_valyria: "Valyria" #NT!
 expedition_type_valyria_desc: "La Península Valyria es una tierra de misterio y peligro, donde las ruinas del otrora gran Feudo Valyrio acechan.\n\nLa tierra está llena de criaturas hostiles y terreno traicionero, y la expedición deberá estar bien preparada para sobrevivir." #NT!
 expedition_type_rhoyne: "El Rhoyne" #NT!
 expedition_type_rhoyne_desc: "El Rhoyne es un río caudaloso que fluye a través del corazón de Volantis y las ruinas del antiguo Rhoynar.\n\nLa expedición tendrá que navegar por las traicioneras corrientes del río y evitar los peligros que acechan en sus profundidades." #NT!
 expedition_type_asshai: "Ashai" #NT!
 expedition_type_asshai_desc: "Asshai es una ciudad antigua y misteriosa ubicada en las costas de las Tierras Sombrías.\n\nLa expedición tendrá que recorrer los callejones oscuros de la ciudad y evitar los peligros que acechan en sus sombras." #NT!
  
 activity_expedition_province_desc: "Planificarás y financiarás una expedición a [ROOT.Province.GetName]\nNumerosos factores influirán en los resultados" #NT!
  
 hunt_treasure_intent: "Caza del tesoro" #NT!
 hunt_treasure_intent_desc: "Busca artefactos perdidos y tesoros en las ruinas." #NT!
 chart_area_intent: "Área del gráfico" #NT!
 chart_area_intent_desc: "Mapee el terreno e identifique posibles sitios de asentamiento." #NT!
  
 expedition_preparation: "Preparación de la expedición" #NT!
 expedition_preparation_minimal: "Lo esencial" #NT!
 expedition_preparation_minimal_desc: "Una expedición ágil, ligera en equipo y dinero. La fortuna favorece a los audaces o a los afortunados." #NT!
 expedition_preparation_standard: "Disposiciones adecuadas" #NT!
 expedition_preparation_standard_desc: "Bien abastecido de mapas, suministros y mano de obra contratada. La expedición está lista para la mayoría de los desafíos que se avecinan." #NT!
 expedition_preparation_heavy: "Expedición completamente equipada" #NT!
 expedition_preparation_heavy_desc: "No se repara en gastos: guías experimentados, carros fortificados y especialistas en todos los oficios. Si se puede comprar el éxito, así es como se hace." #NT!
  
 expedition_main_phase: "Expedición propiamente dicha" #NT!
 expedition_main_phase_desc: "Los días se convierten en semanas a medida que la expedición recorre caminos olvidados, se adentra en ruinas y se enfrenta a lo desconocido. Cada campamento iluminado por el fuego y cada eco distante pueden traer fortuna... o locura." #NT!
  
 lv_apa_expedition_monument_title: "[first.GetShortUIName|U] descubrió un monumento [second.GetCulture.GetCollectiveNoun] medio enterrado" #NT!
 lv_apa_expedition_chart_terrain_title: "[first.GetShortUIName|U] hizo un progreso impresionante al trazar el terreno de [second.GetName]" #NT!
 lv_apa_expedition_ruined_roads_title: "[first.GetShortUIName|U] descubrió algunas carreteras en ruinas, lo que facilita tanto el viaje como el mapeo del área." #NT!
 lv_apa_expedition_old_map_title: "[first.GetShortUIName|U] encontró un mapa antiguo que coincide con el terreno del área, lo que le ayudará en su expedición" #NT!
 lv_apa_expedition_optimal_conditions_title: "[first.GetShortUIName|U] encontró que las condiciones para la expedición eran óptimas" #NT!
  
 lv_apa_expedition_mired_in_mud_title: "Una tormenta ensucia las carreteras cercanas y paraliza toda la expedición." #NT!
 lv_apa_expedition_missing_supplies_title: "Algunos alimentos y herramientas desaparecieron durante la noche." #NT!
 lv_apa_expedition_heated_argument_title: "Estalla una discusión sobre las rutas a seguir" #NT!
 lv_apa_expedition_frightened_animals_title: "Algo invisible aterrorizó a [first.GetShortUINamePossessive] animales y los dispersó en la oscuridad." #NT!
  
 lv_apa_expedition_night_shift_positive_title: "[first.GetShortUIName|U] se encontró trabajando hasta tarde al lado de [second.GetShortUIName]" #NT!
 lv_apa_expedition_night_shift_positive.tt: "[first.GetShortUIName|U] se llevaba bien con [second.GetShortUIName] durante el turno nocturno, compartiendo historias y risas que aliviaron el trabajo." #NT!
 lv_apa_expedition_night_shift_positive.reason: "[CHARACTER.GetShortUIName|U] y [TARGET_CHARACTER.GetShortUIName] disfrutaron de la compañía del otro durante una expedición." #NT!
  
 lv_apa_expedition_campfire_positive_title: "[first.GetShortUIName|U] y [second.GetShortUIName] compartieron una fogata" #NT!
 lv_apa_expedition_campfire_positive.tt: "[first.GetShortUIName|U] y [second.GetShortUIName] compartieron historias y risas junto a una fogata, fortaleciendo su vínculo durante la expedición." #NT!
 lv_apa_expedition_campfire_positive.reason: "[CHARACTER.GetShortUIName|U] y [TARGET_CHARACTER.GetShortUIName] compartieron una fogata durante una expedición." #NT!
  
 lv_apa_expedition_night_shift_negative_title: "[first.GetShortUIName|U] se encontró trabajando hasta tarde al lado de [second.GetShortUIName]" #NT!
 lv_apa_expedition_night_shift_negative.tt: "[first.GetShortUIName|U] y [second.GetShortUIName] se enfrentaron durante el turno nocturno, lo que provocó una acalorada discusión que agrió el ambiente." #NT!
 lv_apa_expedition_night_shift_negative.reason: "[CHARACTER.GetShortUIName|U] y [TARGET_CHARACTER.GetShortUIName] se enfrentaron durante una expedición." #NT!
  
 lv_apa_expedition_foul_weather_title: "El mal tiempo ralentiza el progreso de la expedición [first.GetShortUINamePossessive]" #NT!
  

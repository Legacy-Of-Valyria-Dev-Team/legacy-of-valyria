l_spanish:
 lv_prefix: "LV:" #NT!
 lv_canonicity: "Canonicidad LoV" #NT!
 game_rule_category_lv_canonicity: "$lv_canonicity$" #NT!
  
 #rule_lv_valyria_status: "#Y $lv_canonicity$:#! Valyria" #NT!
 #setting_lv_valyria_default: "Por defecto" #NT!
 #setting_lv_valyria_default_desc: "[valyria|E] comienza como está después de The [doom|E]: un páramo mortal engullido por las Catorce Llamas." #NT!
 #setting_lv_valyria_blank_slate: "Pizarra en blanco" #NT!
 #setting_lv_valyria_blank_slate_desc: "Las provincias valyrias comienzan como ruinas, pero por lo demás no tienen ninguno de los modificadores mortales." #NT!
  
 rule_lv_colonisation: "#Y $lv_prefix$#! Restauración de asentamientos y ruinas" #NT!
 setting_lv_colonisation_default: "Por defecto" #NT!
 setting_lv_colonisation_default_desc: "Las ruinas de todo el mundo utilizarán el sistema de restauración de ruinas de Legacy of Valyria." #NT!
 setting_lv_colonisation_lite: "ligero" #NT!
 setting_lv_colonisation_lite_desc: "Las ruinas de todo el mundo utilizarán una versión simplificada del sistema de restauración de ruinas de Legacy of Valyria, con propiedades de colonias pero pocos o ningún bloqueador en general." #NT!
 setting_lv_colonisation_agot: "AGOT" #NT!
 setting_lv_colonisation_agot_desc: "Las ruinas de todo el mundo utilizarán el sistema de colonización AGOT, sin bloqueadores ni propiedades de colonias." #NT!
 setting_lv_colonisation_instant: "Instante" #NT!
 setting_lv_colonisation_instant_desc: "La restauración de ruinas y la mejora de asentamientos son instantáneas." #NT!
  
 #rule_lv_green_valyria: "#Y $lv_prefix$#! Valyria Verde" #NT!
 #setting_lv_green_valyria_gradual: "Gradual" #NT!
 #setting_lv_green_valyria_gradual_desc: "Valyria se volverá gradualmente más verde con el tiempo, y el proceso se acelerará a medida que se restablezca una mayor parte de la subregión." #NT!
 #setting_lv_green_valyria_instant: "Instante" #NT!
 #setting_lv_green_valyria_instant_desc: "Valyria se volverá más verde tan pronto como se alcancen los umbrales de la subregión." #NT!
 #setting_lv_green_valyria_disabled: "Desactivado" #NT!
 #setting_lv_green_valyria_disabled_desc: "Valyria seguirá siendo un páramo devastado, sin importar cuánto se restaure." #NT!
  

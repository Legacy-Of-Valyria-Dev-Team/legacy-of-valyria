   # Decision group 
 decision_group_type_valyria: "Decisiones valyrias" #NT!
  
 lv_restore_valyrian_freehold_decision: "Restaurar el dominio valyrio" #NT!
 lv_restore_valyrian_freehold_decision_desc: "En su apogeo, Valyrian Freehold se mantuvo sin oposición como la civilización más grande y dominante de su tiempo, mejor conocida por su capacidad de comandar innumerables dragones en su nombre durante tiempos de guerra. Tan grande era este poder militar y cultural que sólo el cataclismo del Destino fue suficiente para poner fin a su dominio de cinco mil años sobre Essos. Lo único que quedó de esta gran civilización fueron las agujas humeantes de los grandes señores dragón y las tierras embrujadas y cubiertas de cenizas parcialmente devoradas por el Mar Humeante.\n\nSi se pudiera recuperar el corazón de Valyria, junto con una buena cantidad de sus antiguos territorios, nadie podrá cuestionar mi reclamo y autoridad como verdadero y legítimo gobernante del Feudo Valyrio." #NT!
 lv_restore_valyrian_freehold_decision_tooltip: "[GetTitleByKey('h_valyrian_freehold').GetName] será restaurado." #NT!
 lv_restore_valyrian_freehold_decision_confirm: "Nuestro tiempo es ahora" #NT!
 lv_restore_valyrian_freehold_decision_effect_tooltip: "[GetTitleByKey('h_valyrian_freehold').GetName] será restaurado y adquirirá el [de_jure|E] de todos los [empires|E] actualmente en poder de Essos." #NT!
  
 lv_restore_valyrian_freehold_valyria_requirement_tooltip: "Debes [completely_control|E] la península Valyria." #NT!
 lv_restore_valyrian_freehold_former_colonies_requirement_tooltip: "Debes [completely_control|E] al menos tres territorios de [empire|E] nivel que fueron antiguas colonias del Feudo Valyrio." #NT!
  
 decision_study_dragonlore.t: "Estudiar Dragonlore" #NT!

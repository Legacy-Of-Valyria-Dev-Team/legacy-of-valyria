l_spanish:
 restore_gogossos: "Proclamar la Décima Ciudad" #NT!
 restore_gogossos_tooltip: "Restaurar Gogossos" #NT!
 restore_gogossos_desc: "Habían pasado cientos de años desde Doom, y Gogossos finalmente regresa al redil bajo mi liderazgo, digno una vez más de ser llamado un contendiente por el legado de [valyrian_freehold_short|E]." #NT!
 restore_gogossos_choice: "Se le presentará una lista de opciones sobre cómo desea restaurar Gogossos" #NT!
 restore_gogossos_confirm: "¡La Décima Ciudad se levantará de nuevo!" #NT!
  
 gogossos_restoration.0001.t: "La Décima Ciudad Renacida" #NT!
 gogossos_restoration.0001.desc: "Después de muchos años y oro gastado en reconstruir y restaurar no solo la ciudad, sino todas las islas que rodean Gogossos, he traído riqueza y prosperidad a esta región. Con los señores piratas expulsados ​​y mi dominio sobre la antigua colonia de los [valyrian_freehold_short|E] indiscutible, proclamo que Gogossos es digno una vez más de la gloria que alcanzó. La joya de la corona de Sothoryos es más hermosa que todos sus estados rivales." #NT!
 gogossos_restoration.0001.a: "¡Gogossos volverá a convertirse en la Décima Ciudad Libre!" #NT!
 gogossos_restoration.0001.b: "¡Sólo a través de la influencia y el poder Gogossos prosperará!" #NT!
 gogossos_restoration.0001.c: "Se necesita el fuerte gobierno de un monarca para no repetir los errores de los esclavistas." #NT!
 gogossos_restoration.0001.d: "Esta ciudad prosperará bajo mi gobierno." #NT!
 gogossos_restoration.0001.d.tooltip: "Conservará su actual forma de gobierno." #NT!
  
 gogossos_restoration.0002.t: "La Décima Ciudad Libre Renace" #NT!
 gogossos_restoration.0002.desc: "Gogossos, una vez arruinado y devastado por la Muerte Roja, se mantiene erguido. El comercio fluye una vez más hacia la ciudad, y la restauración de la antigua colonia valyria se contará en los años venideros." #NT!
 gogossos_restoration.0002.a: "Sólo el tiempo dirá qué será de esto..." #NT!
  
 expedition_quest: "Financiar una expedición" #NT!
 expedition_quest_tooltip: "Financiar una expedición para explorar las antiguas ruinas a lo largo de las Islas Basilisco" #NT!
 expedition_quest_desc: "La llamada a la aventura se agita dentro de mí, una atracción irresistible hacia las ruinas olvidadas de las que se habla en los viejos cuentos de marineros: los restos perdidos de Sothoryos y Gogossos. Lugares de leyenda, envueltos en misterio y pavor, donde civilizaciones antiguas alguna vez prosperaron y cayeron en ruinas.\n\nCasi puedo escuchar los susurros de secretos incalculables escondidos bajo sus piedras desmoronadas, la promesa de reliquias perdidas esperando a ser desenterradas. Sólo pensarlo hace que mi corazón se acelere.\n\nDebo actuar con rapidez. Necesitaré mapas, suministros y una tripulación dispuesta a enfrentar lo desconocido. No hay tiempo que perder: hay que planificar una expedición de inmediato." #NT!
 expedition_quest_effect: "Financias una expedición a Gogossos" #NT!
 expedition_quest_confirm: "Tesoros y peligros por delante: qué atractivo..." #NT!
  
 gobshite.1: "¿Por qué estás mirando? Dije que no funciona... Gobshite" #NT!

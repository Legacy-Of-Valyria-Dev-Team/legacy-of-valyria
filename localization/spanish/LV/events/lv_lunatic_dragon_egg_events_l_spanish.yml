l_spanish:
 decision_cook_dragon_egg.t: "Cocina tu huevo de dragón" #NT!
 decision_cook_dragon_egg_desc: "Nadie ha cocinado nunca un huevo de dragón antes, me pregunto a qué sabrá..." #NT!
 decision_cook_dragon_egg_confirm: "¡Este huevo tendrá un sabor divino!" #NT!
 decision_cook_dragon_egg_tooltip: "¡Cocina tu huevo de dragón y haz la mejor tortilla del mundo!" #NT!
  
 cook_egg_decision_tt: "Encenderás una gran hoguera para cocinar tu huevo." #NT!
 character_is_a_lunatic: "eres un lunático" #NT!
 character_has_a_dragon_egg_to_cook: "Tienes un huevo [dragon|E] para cocinar" #NT!
  
 lunatic_cook_dragon_egg.001.t: "¡Cocinando el huevo!" #NT!
  
 lunatic_cook_dragon_egg.001.intro: "Tu huevo de dragón yace allí, tentadoramente. Ningún hombre había probado nunca antes un huevo de dragón. Te preguntas a qué sabe mientras recoges el huevo y lo sacas al patio. Una olla con aceite caliente está lista y hirviendo. Mientras recoges tu huevo de dragón por última vez, un pensamiento surge en tu mente:\n\n" #NT!
 lunatic_cook_dragon_egg.001.gluttonous.desc: "¿A qué sabrá?" #NT!
 lunatic_cook_dragon_egg.001.dragonslayer.desc: "Maté un dragón, ahora probaré uno." #NT!
 lunatic_cook_dragon_egg.001.just_lunatic.desc: "¡Seré el primero en probar un huevo de dragón!" #NT!
 lunatic_cook_dragon_egg.001.end: "\n\nAntes de que puedas colocar el huevo en la olla hirviendo, surge una voz detrás de ti '[ROOT.Char.GetFirstName], ¡detén esto de inmediato! ¡Ese es un [dragon|E] huevo!'. Te das la vuelta y ves a [protesting_courtier.GetFirstName] corriendo hacia ti, [protesting_courtier.GetHerHisMy] ojos suplicantes." #NT!
  
 lunatic_cook_dragon_egg.001.a: "Deja caer el huevo en la olla." #NT!
 lunatic_cook_dragon_egg.001.b: "Aléjate de la olla" #NT!
  
 lunatic_cook_dragon_egg.002.t: "¡El huevo explota!" #NT!
 lunatic_cook_dragon_egg.002.intro: "[protesting_courtier.GetFirstName] observa con horror cómo dejas caer el huevo en la olla. El aceite hirviendo parece arder con más violencia y el huevo comienza a romperse. Sonríes, anticipando una comida deliciosa.\n\nEn cambio, cuando el huevo se rompe, una enorme bola de fuego verde surge hacia ti a una velocidad increíble..." #NT!
  
 lunatic_cook_dragon_egg.0002.a: "¡Aaaargh!" #NT!
  
 mass_coutier_death: "Todos los cortesanos e invitados mueren cuando el asentamiento es destruido." #NT!
  
 lunatic_cook_dragon_egg.003.t: "Un dragón nace" #NT!
 lunatic_cook_dragon_egg.003.desc: "[protesting_courtier.GetFirstName] observa con horror cómo dejas caer el huevo en la olla. El aceite hirviendo parece arder con más violencia y el huevo comienza a romperse. Sonríes, anticipando una comida deliciosa. Pero entonces, tus expectativas se hacen añicos cuando ves pequeñas alas batiendo. ¡Un dragón entra al mundo!" #NT!
 lunatic_cook_dragon_egg.0003.a: "Mi comida deliciosa..." #NT!
  
 hatched_dragon_via_cooking_notification: "¡[ROOT.Char.GetName] nació [dragon.GetName] al intentar cocinarlo!" #NT!
  
 lunatic_cook_dragon_egg.0004.t: "¡El huevo eclosiona!" #NT!
 lunatic_cook_dragon_egg.0004.desc: "Me siento extraño mientras la escena se desarrolla ante mí. Mi huevo ha eclosionado y un dragón ha salido de las ruinas de su caparazón.\n\n¿Qué me poseyó para querer matar a una bestia magnífica? Ya puedo sentir abrumador el vínculo que compartimos y cómo estarán conmigo hasta el final de mis días. Aunque todavía no puedo decir cuál es su sexo, todavía necesitan un nombre que la historia nunca olvidará.\n\n¿Cómo debería llamarlos?" #NT!

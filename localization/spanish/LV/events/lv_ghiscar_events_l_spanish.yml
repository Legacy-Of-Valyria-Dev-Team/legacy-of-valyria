l_spanish:
 agot_EE_reestablish_ghiscar_decision: "Revivir el imperio Ghiscari" #NT!
 agot_EE_reestablish_ghiscar_decision_desc: "Estamos a punto de izar el estandarte de la arpía y restaurar el Imperio Ghiscari a su antigua gloria. Desde las costas de Slaver's Bay hasta el corazón de Ghis, nuestro antiguo símbolo volará una vez más.\nNuestros antepasados ​​gobernaron con fuerza y ​​sabiduría hasta que el fuego de dragón y el acero valyrio pusieron al imperio de rodillas. Aunque el Viejo Ghis cayó, el espíritu Ghiscari nunca flaqueó, esperando pacientemente que el próximo líder perfeccionara al pueblo Ghiscari con un propósito singular. Estamos listos para despertar a la arpía y dejar que proyecte su sombra sobre la tierra durante mil años más." #NT!
 agot_EE_reestablish_ghiscar_decision_confirm: "La arpía vuela una vez más" #NT!
 agot_EE_reestablish_ghiscar_decision_tooltip: "Revive el Imperio Ghiscari, recuperando sus tierras y el poder de la antigua arpía." #NT!
  
 agot_EE_ghiscari_restoration.1.t: "La arpía vuelve a volar" #NT!
 agot_EE_ghiscari_restoration.1.desc: "¡La arpía vuela una vez más! En cada ciudad y fortaleza, desde las costas de la Bahía de los Esclavos hasta el corazón del imperio, se despliega el antiguo estandarte de Ghis. Antaño, nuestros antepasados ​​gobernaron estas tierras con fuerza y ​​sabiduría, antes de que el fuego de dragón y el acero valyrio pusieran a nuestro imperio de rodillas. Aunque los muros del viejo Ghis se desmoronaron hasta convertirse en cenizas, el espíritu de Ghiscari nunca murió.\n\nAhora nos levantamos, decididos a reclamar nuestro lugar entre los grandes imperios del mundo. Nuestra arpía proyecta su sombra sobre la tierra, un recordatorio de que los Ghiscari nunca fueron conquistados, sólo retrasados.\n\nEl Imperio vuelve a vivir, imperturbable e intacto..." #NT!
 agot_EE_ghiscari_restoration.1.a: "¡Para nuevos Ghis!" #NT!

l_spanish:
  
 lv_travel_danger.0001.t: "La niebla vive" #NT!
 lv_travel_danger.0001.desc: "La niebla se eleva en el horizonte como un muro: densa, inmóvil y equivocada. Espera. Cuando tu barco entra, la niebla se lo traga todo: el mar, el cielo, el sonido del viento. El mundo detrás de ti se desvanece.\n\nEl aire se vuelve más espeso. Las velas desaparecen en gris. No puedes ver tus manos. Las voces de la tripulación resuenan de forma extraña, como bajo el agua. El barco gime, pero incluso eso suena lejano. El tiempo da vueltas. Los minutos se alargan. Pasan las horas, o ninguna.\n\nEntonces un marinero emerge de la bruma, descalzo y temblando. Su piel es pálida. Su cabello se ha vuelto blanco.\n\n“Encontré el barco”, murmura. "Nuestro barco. Justo así. Sólo que... todos estábamos muertos. Flotando. Mirando fijamente. Y yo... creo que me vi mirándome a mí mismo"." #NT!
 lv_travel_danger.0001.a: "La niebla miente. Mantén el rumbo." #NT!
 lv_travel_danger.0001.a.tt.trait: "Cada miembro de tu séquito tendrá un 50 % de posibilidades de obtener [trait|E] [GetTrait('lunatic_1').GetName( GetNullCharacter )] o [GetTrait('paranoid').GetName( GetNullCharacter )]." #NT!
 lv_travel_danger.0001.a.tt.opinion: "Cada miembro de tu séquito pierde #N 30#! [opinion|E] de #V tú#! #weak (Se burló de mí en mi momento de necesidad)#!" #NT!
 lv_travel_danger.0001.b: "Gira el barco. Volvemos a casa." #NT!
 lv_travel_danger.0001.b.tt.opinion: "Cada miembro de tu séquito gana #P 20#! [opinion|E] de #V tú#! durante #V 10 años#! #weak (Cuidé mi salud)#!" #NT!
 lv_travel_danger.0001.c: "Déjame caminar hacia la niebla." #NT!
 lv_travel_danger.0001.c.tt: "Entras en la niebla" #NT!
 lv_travel_danger.0001.c.tt.trait: "Sales de la niebla, no eres la misma persona que eras antes" #NT!
  
 lv_travel_danger.0002.t: "Sangre en la cubierta" #NT!
 lv_travel_danger.0002.desc: "Hay sangre en las tablas. Un marinero yace muerto, con un cuchillo todavía enterrado en [victim.GetHerHis] costillas. Otro se encuentra junto a [victim.GetHerHim], temblando, con el rostro pálido y salpicado de rojo.\n\n[victim.GetSheHe|U] no era real", murmura el asesino, con los ojos muy abiertos. "La niebla envió a [victim.GetHerHim]. Vi lo que realmente era [victim.GetSheHe]".\n\nLa tripulación se reúne en un silencio incómodo. Nadie se mueve. Nadie habla. El aire está cargado de miedo y de la certeza de que la cordura se está desgastando." #NT!
 lv_travel_danger.0002.a: "Ejecute [killer.GetHerHim] de una vez." #NT!
 lv_travel_danger.0002.b: "Tira [killer.GetHerHim] por la borda." #NT!
 lv_travel_danger.0002.c: "Pon [killer.GetHerHim] en una celda." #NT!
 lv_travel_danger.0002.d: "[victim.GetSheHe|U] vio la verdad! ¡Debemos prestarle atención!" #NT!

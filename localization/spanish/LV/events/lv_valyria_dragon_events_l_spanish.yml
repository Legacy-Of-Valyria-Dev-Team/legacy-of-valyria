l_spanish:
 agot_dragon_personality.0015.warning.desc: "Desde hace semanas, has estado visitando tu dragonpit para observar a tus dragones en crecimiento. Todo parece normal. Excepto por el comportamiento de [growing_dragon.GetFirstName].\n\n" #NT!
 agot_dragon_personality.0015.aggressive.desc: "Los cuidadores de dragones informan de una agresión extrema hacia [growing_dragon.Custom('GetDragonHerHis')] compañeros y, como resultado, [growing_dragon.GetSheHe] ha sido rechazado ya que los dragones cercanos aparentemente sienten el peligro o la agresión de [growing_dragon.Custom('GetDragonHerHis')]. Durante una pelea, [growing_dragon.GetSheHe] intentó atacar la carne de [growing_dragon_victim.GetFirstName].\n\n" #NT!
 agot_dragon_personality.0015.voracious.desc: "[growing_dragon.GetFirstName] tiene un interés normalmente insaciable por la carne viva, pero parece que se ha reducido recientemente ya que [growing_dragon.GetSheHe] ahora observa a [growing_dragon_victim.GetFirstName] con ojos depredadores durante las sesiones de alimentación.\n\n" #NT!
 agot_dragon_personality.0015.voracious_aggressive_bloodthirsty.desc: "[growing_dragon.GetFirstName] también tiene un interés normalmente insaciable por la carne viva, pero eso parece reducirse recientemente ya que [growing_dragon.GetSheHe] ahora observa a [growing_dragon_victim.GetFirstName] con ojos depredadores durante las sesiones de alimentación.\n\n" #NT!
 agot_dragon_personality.0015.warning.end: "Al observar a [growing_dragon.GetFirstName], te das cuenta de que [growing_dragon.GetSheHe] tiene impulsos caníbales. Afortunadamente, [growing_dragon.GetSheHe] aún no se ha deleitado con carne de dragón, pero debes actuar para separar a [growing_dragon.GetHerHim] y corregir este comportamiento." #NT!
 agot_dragon_personality.0015.d: "¡Esto es inaceptable! ¡Educaré a este dragón!" #NT!
  
 agot_dragon_personality.0015.d.f: "Separas a [growing_dragon.GetFirstName] de otros dragones y comienzas a educar a [growing_dragon.GetHerHim]" #NT!
 agot_dragon_personality.0015.d.success: "Tu dragón ya no es un caníbal" #NT!
 agot_dragon_personality.0015.d.success.tt: "Canibalismo corregido" #NT!
 agot_dragon_personality.0015.d.failure: "Tu dragón sigue siendo caníbal." #NT!
 agot_dragon_personality.0015.d.failure.tt: "La corrección de canibalismo falló" #NT!

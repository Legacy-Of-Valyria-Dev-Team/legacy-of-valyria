 lv_great_project.0001.t: "Rompiendo el silencio: [sub_region.GetName]" #NT!
 lv_great_project.0001.desc: "El primer golpe de la pala es un sonido que no debía escucharse en este lugar desolado. Los esfuerzos de rehabilitación en [sub_region.GetName] han comenzado, un acto de blasfemia contra la Perdición y el silencio que impone.\n\nHas elegido tu punto de apoyo para este proyecto monumental: un trozo de tierra negra en ruinas junto a un muro medio derrumbado, que quizás alguna vez fue una villa o una torre menor. A medida que sus trabajadores comienzan a limpiar lo peor de las cenizas y los escombros retorcidos, la tierra misma parece suspirar en señal de rechazo. El aire se vuelve más pesado, el calor más intenso.\n\nLa magia, antigua e indómita, duerme justo debajo de la superficie. No es una fuerza que puedas comandar todavía, sino un veneno que resiste el concepto mismo de orden. Las semillas que intentas sembrar se arrugan y se convierten en hojuelas de carbón. El agua que extraes de un manantial cercano y tibio sabe a azufre y a hechizos olvidados. Cada hora de trabajo sólo logra unos momentos de progreso inestable. La Perdición no se ha ido; simplemente se ha quedado quieto, esperando que un advenedizo le recuerde que todavía reina." #NT!
 lv_great_project.0001.desc.attempted: "El segundo, o quizás el centésimo, golpe de pala no es un sonido nuevo aquí: es un grito de desafío contra la Perdición. La rehabilitación de [sub_region.GetName] no es un comienzo, sino una continuación agotadora de lo que ya se había hecho.\n\nObservas el punto de apoyo actual. Otros antes que tú, o tus propios esfuerzos anteriores, ya han dejado cicatrices de esfuerzo en Valyria: líneas de ceniza limpia que ya han comenzado a desdibujarse, pilas de piedra recuperada y restos fantasmales de jardines fallidos o cimientos derrumbados.\n\nTus trabajadores se mueven con endurecida precaución. Conocen el ritmo de este trabajo: el ciclo de comienzos en falso y retrocesos repentinos y violentos. La tierra ya no suspira ante su sorprendida negativa; Ahora parece que se burla de tu persistencia. La magia antigua e indómita de aquí ha aprendido a esperar una intrusión. Ha desarrollado inmunidad a intentos menores de ordenar. El leve sabor a azufre en el agua y la forma en que el aire presiona el lugar son peligros familiares, no sorpresas.\n\nEchoes of the Doom te recuerdan que no estás luchando contra una secuela, sino contra una cicatriz viva. Este intento, sin embargo, lleva el peso de todo lo anterior. Si puedes construir sobre esos frágiles y fallidos cimientos, finalmente podrías demostrar que Doom no tiene la última palabra sobre [sub_region.GetName]." #NT!
 lv_great_project.0001.desc.succeeded: "Este golpe de pala resuena con el peso tanto de la ruina como de la resurrección. El suelo debajo de [sub_region.GetName] todavía está envenenado, pero ahora sabes que el veneno puede contrarrestarse. La fórmula ya se ha descifrado antes; ahora debes seguirlo una vez más.\n\nHas elegido tu punto de apoyo, no del todo en la oscuridad, sino a la sombra de un milagro. Tus trabajadores pueden mirar hacia el horizonte de Valyria y saber que hay pruebas en algún lugar dentro de estas tierras embrujadas: la visión distante y reluciente de una región recuperada con éxito donde las paredes se mantienen rectas, donde el humo se eleva de las fogatas en lugar de las chimeneas de azufre, y donde la vida verde se afirma. Ese conocimiento es la verdadera base de este nuevo esfuerzo.\n\nPero la inspiración ofrece poco consuelo frente a la realidad inmediata. A medida que tu tripulación comienza a limpiar las conocidas piedras retorcidas y las cenizas asfixiantes, el aire sigue siendo denso y hostil. La resistencia mágica aquí es tenaz, quizás exclusiva de [sub_region.GetName], y lucha contra el patrón de curación establecido. Las primeras semillas todavía luchan y el agua local sigue siendo dura, como si el propio Doom se negara a admitir la derrota en este territorio específico.\n\nEsta es una prueba monumental. El camino está mostrado, pero no es fácil. No estáis luchando contra la desesperación universal, sino contra la obstinada y definitiva resistencia de la aniquilación. Cada gramo de progreso que obtienes aquí es una victoria ganada con esfuerzo que expande el milagro, empujando las fronteras de la vida hacia el corazón del imperio muerto." #NT!
 lv_great_project.0001.a: "La lucha por Valyria realmente comienza." #NT!
 lv_great_project.0001.a.attempted: "La lucha por Valyria continúa." #NT!
 lv_great_project.0001.a.succeeded: "La resurrección de Valyria está en marcha." #NT!
  
 lv_great_project.0003.t: "Un nuevo amanecer para [sub_region.GetName]" #NT!
 lv_great_project.0003.desc: "Las generaciones hablarán de este día. La larga noche de Doom tiene un nuevo amanecer y comienza de nuevo en [sub_region.GetName].\n\nTe paras en el punto más alto de la región recién rehabilitada y contemplas los nuevos muros y los primeros caminos estables. Esta es la primera verdadera ciudad de vida que se levanta en el corazón de Valyria desde que fue destrozada por Doom. El costo fue alto, los reveses aplastantes, pero el resultado es un triunfo que desafía la historia.\n\nEl sonido del martillo del herrero, los gritos de los comerciantes locales, el murmullo de una conversación estable. Todos estos son los nuevos sonidos que ahogan los susurros de los muertos. Los maestres de la Ciudadela hablarán de este día a los hechiceros de Asshai hasta posiblemente el final de todos los días.\n\nSin embargo, cuando miras hacia la humeante y caótica naturaleza más allá de tus fronteras, sientes una profunda sensación de aislamiento. Has ganado una batalla, pero la guerra por Valyria (la lucha por recuperar cada centímetro arruinado) apenas ha comenzado. El legado de Valyria ahora descansa sobre los hombros de los vivos." #NT!
 lv_great_project.0003.desc.subsequent: "La larga noche de Doom continúa destrozándose. Una nueva y brillante franja de cielo despejado se abre ahora sobre [sub_region.GetName].\n\nTe encuentras en el punto más alto de la región recientemente rehabilitada y contemplas los nuevos muros y los caminos estables. Esta región es una nueva y poderosa ancla en el corazón muerto de Valyria, añadiendo su fuerza al reino de los vivos. El costo fue aplastante, los reveses legión, pero el resultado es un triunfo que expande exponencialmente la gran obra.\n\nEl sonido del martillo del herrero, los gritos de los comerciantes locales, el murmullo de una conversación estable. Todos estos son los sonidos triunfantes que ahora engrosan el coro de la vida.\n\nSin embargo, cuando miras hacia la humeante y caótica naturaleza más allá de tus fronteras, sientes el profundo peso de la tarea que tienes por delante. No has terminado la guerra, pero has logrado arrebatar otro premio irremplazable de las garras de la aniquilación. La lucha por Valyria continúa, pero con la obtención de [sub_region.GetName], la victoria definitiva de los vivos parece más cercana que nunca. El legado de Valyria descansa, más firmemente que antes, sobre los hombros de los vivos." #NT!
 lv_great_project.0003.a: "Un nuevo faro de vida brilla en Valyria." #NT!
  
 lv_great_project.0004.t: "Valyria: una tierra renacida" #NT!
 lv_great_project.0004.desc: "En todo el mundo conocido, desde las costas de Poniente hasta los mercados de especias de Qarth, desde las torres de la Ciudadela hasta los templos de Yi Ti, se susurra, grita y escribe una única y asombrosa verdad: Valyria vuelve a vivir.\n\nDespués de la destrucción provocada por la Perdición, se ha logrado lo imposible. La región de [sub_region.GetName] ha sido recuperada, estabilizada y asegurada por la voluntad inquebrantable de [founder.GetName] y los trabajadores que desafiaron la Perdición. El aire aquí, que alguna vez fue venenoso, ahora lo respiran los vivos. El suelo, una vez maldito, ahora responde al arado.\n\nLa tierra de [sub_region.GetName], una vez envenenada y perseguida por los fantasmas del sofocado Freehold, ahora es una prueba del máximo potencial de restauración. [founder.GetName] ha desafiado la maldición que consumió el mayor imperio de la historia y ha obtenido la primera y vital victoria.\n\nQue todas las ciudades y reinos sepan: el terror persiste, los peligros siguen siendo enormes y la sombra humeante de la Perdición aún abarca el continente. Pero se ha encendido una luz que ninguna ceniza puede apagar. El camino de regreso a Valyria ya no está bloqueado por un silencio total y desolado. El viejo mundo está temblando y ha comenzado la era del largo y lento retorno." #NT!
 lv_great_project.0004.a: "Que el mundo lo sepa: Valyria vuelve a vivir." #NT!
 lv_great_project.0004.a.other: "Interesante..." #NT!
  
 lv_great_project.0006.t: "Tesoros valyrios" #NT!
 lv_great_project.0006.t.major: "Los tesoros de los señores dragón" #NT!
 lv_great_project.0006.desc: "La tierra produjo un tesoro sin medida. El equipo de investigación ha abierto una tumba (o tal vez una bóveda subterránea olvidada) intacta desde que la Perdición cayó sobre Valyria.\n\nEl avance se produjo debajo de la capa más profunda de ceniza solidificada: una cámara perfectamente sellada, con su entrada enmascarada por un techo derrumbado de piedra de dragón fundida. En el interior, el mundo de la Antigua Valyria seguía congelado. Grandes cofres con monedas de oro y plata, intactas por el tiempo, yacían apilados contra las paredes grabadas con texto valyrio.\n\nPero el verdadero significado del hallazgo es más profundo. Más allá de la sala principal del tesoro, el equipo de investigación encontró evidencia de un santuario interior separado y altamente seguro. Esta cámara más pequeña y herméticamente sellada fue claramente diseñada para albergar objetos de extrema rareza: objetos que podrían rivalizar con el valor de reinos enteros.\n\nTus arqueólogos ahora están trabajando para romper cuidadosamente los antiguos sellos que protegen esta habitación interior. El oro está asegurado, la bóveda está abierta y ahora esperas el informe final: ¿los siglos de silencio preservaron los artefactos en su interior... o la Perdición los reclamó, dejando solo el recuerdo de su poder?" #NT!
 lv_great_project.0006.a: "¡Se han desenterrado los tesoros de la antigua Valyria!" #NT!

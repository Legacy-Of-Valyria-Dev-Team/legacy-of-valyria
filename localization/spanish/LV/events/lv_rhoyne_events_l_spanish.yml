l_spanish:
 agot_EE_reestablish_rhoynar_decision: "Unir a los Rhoynar" #NT!
 agot_EE_reestablish_rhoynar_decision_desc: "El legado de Rhoyne está al borde de ser restaurado, uniendo a todo el pueblo Rhoynar en un gran imperio. Desde las orillas del caudaloso río hasta cada afluente distante, la vida y la prosperidad florecerán bajo una misma bandera. Los comerciantes llenan los canales de nuestro imperio renacido, fluyendo como sangre hacia cada rincón de nuestras fronteras. Nuestro pueblo ahora está seguro de que nunca más se verá obligado a exiliarse. El futuro de Rhoynar comienza aquí, con una promesa de fuerza y ​​unidad junto con la Madre Rhoyne." #NT!
 agot_EE_reestablish_rhoynar_decision_confirm: "Restaurar el Imperio Rhoynish" #NT!
 agot_EE_reestablish_rhoynar_decision_tooltip: "Une al pueblo Rhoynar y restaura la prosperidad a las tierras a lo largo de la Madre Rhoyne." #NT!
  
 agot_EE_rhoynar_restoration.1.t: "El Rhoyne restablecido" #NT!
 agot_EE_rhoynar_restoration.1.desc: "Hoy en día, la gente a lo largo de las orillas del poderoso Rhoyne despierta a un mundo transformado. Porque he hecho lo que nadie ha logrado desde los días de la leyenda: he unido al pueblo Rhoynar una vez más.\n\nAhora, mientras los comerciantes viajan a lo largo de la Madre Rhoyne y sus innumerables afluentes, la vida y la prosperidad fluyen una vez más a cada rincón de nuestro imperio renacido. Queda mucho trabajo por delante, pero una cosa es segura: nunca más nuestro pueblo se verá obligado a huir como lo hizo la princesa Nymeria.\n\nEl futuro es nuestro, aquí en las orillas del Rhoyne." #NT!
 agot_EE_rhoynar_restoration.1.a: "¡La Madre Rhoyne vuelve a sonreír!" #NT!

l_spanish:
   # Mines Pulse 
 lv_mines_pulse.0001.t: "Susurros debajo [mines_province.GetNameNoTooltip]" #NT!
 lv_mines_pulse.0001.desc: "Por la noche, los vientos traen sonidos extraños de las antiguas minas valyrias: retumbos bajos, como piedra rozando contra piedra, seguidos de un silbido que quema el oído. Los lugareños afirman que es solo el aire que se desplaza a través de túneles rotos, pero tus exploradores hablan de cosas peores.\n\nUno juró haber visto marcas de garras fundidas grabadas a lo largo de un pozo colapsado. Otro, pálido de miedo, juró haber oído algo respirando en la oscuridad. Los mineros se niegan a regresar. Ni siquiera las bestias se acercarán a la boca del pozo.\n\nAlgo se mueve debajo [mines_province.GetName]. Y sea lo que sea, recuerda el sabor del fuego y de la carne." #NT!
 lv_mines_pulse.0001.a: "Seguiremos vigilantes... y rezaremos para que los wyrms sigan enterrados." #NT!
 lv_mines_pulse.0001.a.tt: "Los sonidos finalmente se silencian y las minas no se tocan por ahora." #NT!
 lv_mines_pulse.0001.a.tt.firewyrm: "Algo emerge de las minas." #NT!
  
   # Noxious Gases Pulse 
 lv_noxious_gases_pulse.0001.t: "Cuando el aire se vuelve pesado" #NT!
 lv_noxious_gases_pulse.0001.desc: "Los vientos han cambiado. Lo que alguna vez fue una neblina a la deriva se ha espesado hasta convertirse en una niebla pálida y asfixiante que se adhiere a cada piedra y hoja. En las marcadas tierras bajas de [noxious_gases_province.GetName], el aire se vuelve pesado con el olor acre del azufre y el hedor lento de la ruina.\n\nLos animales huyen de los valles. Los hombres tosen sangre antes de caer de rodillas. Incluso el fuego arde pálido en la niebla, como si tuviera miedo de respirar. Aquellos que habitan cerca de las vetas volcánicas dicen que esto siempre sucede cuando la tierra gime: una estación desagradable, cuando la tierra exhala veneno en lugar de aliento.\n\nAlgunos susurros sobre la propagación de enfermedades. Otros hablan de presagios. Pero la mayoría simplemente se envuelve la boca con un paño y espera ver otro amanecer." #NT!
 lv_noxious_gases_pulse.0001.a: "Sólo podemos aguantar y rezar para que pase rápidamente." #NT!
  
 lv_noxious_gases_pulse.0002.t: "Un respiro entre tormentas" #NT!
 lv_noxious_gases_pulse.0002.desc: "Por primera vez en semanas, el viento sopla limpio desde el mar. La niebla acre se diluye y se retira de las tierras bajas como una marea sombría. Los pájaros regresan a los árboles. Un niño ríe sin toser. Los fuegos arden verdaderos y brillantes una vez más.\n\nEl veneno no ha desaparecido, solo ha retrocedido, como una bestia que regresa sigilosamente a su guarida. Sin embargo, en este momento hay claridad. Las montañas todavía humean a lo lejos, pero los cielos están lo suficientemente despejados como para ver las estrellas.\n\nNo es curativo. No es salvación. Pero es un respiro, por breve que sea." #NT!
 lv_noxious_gases_pulse.0002.a: "Tomaremos la misericordia que la tierra permita." #NT!
 lv_noxious_gases_pulse.0002.a.tt: "Los vapores tóxicos en [noxious_gases_province.GetName] se dispersan y la tierra vuelve a respirar." #NT!
  
 lv_noxious_gases_pulse.0002.t.normal_1: "Los vientos giran amablemente" #NT!
 lv_noxious_gases_pulse.0002.desc.normal_1: "Un raro cambio en el viento arrastra los humos asfixiantes hacia el mar. Aunque el aire todavía huele levemente a azufre y la ceniza continúa cayendo como polvo de un brasero olvidado, la neblina sofocante se ha disipado.\n\nEn los restos esqueléticos de las calles de piedra, las voces llegan más lejos. Las hogueras arden sin ataques de tos. Por primera vez en semanas, no parece que la tierra esté intentando matarte." #NT!
 lv_noxious_gases_pulse.0002.a.normal_1: "Tomaremos toda la misericordia que podamos, incluso aquí." #NT!
 lv_noxious_gases_pulse.0002.a.tt.normal_1: "El aire en [noxious_gases_province.GetName] se vuelve un poco más tolerable." #NT!
  
 lv_noxious_gases_pulse.0002.t.normal_2: "Cielos despejados, por ahora" #NT!
 lv_noxious_gases_pulse.0002.desc.normal_2: "Los cielos sobre [noxious_gases_province.GetName] permanecen grises, no con nubes, sino con cenizas suspendidas eternamente en el aire. Sin embargo, hoy en día, los humos bajos se han disipado y uno puede caminar por las avenidas agrietadas de las ruinas sin quemarse los pulmones ni llorar los ojos.\n\nNo está limpio, al menos no. Pero se puede sobrevivir. Y eso por sí solo es suficiente para despertar un optimismo cauteloso." #NT!
 lv_noxious_gases_pulse.0002.a.normal_2: "Un aliento amargo es mejor que nada." #NT!
 lv_noxious_gases_pulse.0002.a.tt.normal_2: "El trabajo continúa mientras los colonos de [noxious_gases_province.GetName] pueden volver a respirar un poco mejor." #NT!
  
 lv_noxious_gases_pulse.0002.t.normal_3: "Un momento para respirar" #NT!
 lv_noxious_gases_pulse.0002.desc.normal_3: "Las nieblas que alguna vez se enroscaron alrededor de cada columna rota y cresta de obsidiana han retrocedido. La pálida luz del sol se cuela a través de un techo de hollín volcánico, proyectando una pálida luz sobre la piedra ennegrecida.\n\nSenderos perdidos por el humo y las sombras ahora se revelan brevemente. El aire todavía es cálido, todavía acre, pero uno puede caminar sin náuseas, y eso es suficiente para importar." #NT!
 lv_noxious_gases_pulse.0002.a.normal_3: "Incluso entre cenizas se puede abrir un camino." #NT!
 lv_noxious_gases_pulse.0002.a.tt.normal_3: "[noxious_gases_province.GetName] da un suspiro de alivio que extrañaba hace mucho tiempo." #NT!
  
 lv_noxious_gases_pulse.0002.t.normal_4: "Arrasado por la lluvia" #NT!
 lv_noxious_gases_pulse.0002.desc.normal_4: "El cielo cargado de cenizas de [noxious_gases_province.GetName] lloró durante días: una lluvia espesa y arenosa que convirtió las carreteras en lodo negro y empapó incluso las capas más desgastadas. Pero cuando pasó la tormenta, se llevó lo peor del veneno que flotaba en el aire.\n\nLos vapores se han diluido, aunque el olor a azufre y humo permanece entretejido en cada piedra. Aún así, por una vez, el aliento no arde." #NT!
 lv_noxious_gases_pulse.0002.a.normal_4: "La lluvia no limpia nada, pero concede un respiro." #NT!
 lv_noxious_gases_pulse.0002.a.tt.normal_4: "Los vapores han sido eliminados por un tiempo." #NT!
  
 lv_noxious_gases_pulse.0002.t.normal_5: "La ceniza se asienta" #NT!
 lv_noxious_gases_pulse.0002.desc.normal_5: "Durante un tiempo, los vientos ahogados por el humo se calman. El aire sigue siendo pesado y impregnado del amargo olor del fuego antiguo, pero las ondulantes nubes de humo han disminuido. A lo largo de las colinas en ruinas y las torres rotas, la ceniza yace imperturbable: espesa como la nieve, silenciosa como una cripta.\n\nNo es paz, sólo pausa. Pero bajo el cielo magullado de [noxious_gases_province.GetName], eso es lo más cerca que uno puede esperar." #NT!
 lv_noxious_gases_pulse.0002.a.normal_5: "La tierra exhala, pero no duerme." #NT!
 lv_noxious_gases_pulse.0002.a.tt.normal_5: "Al disminuir los humos, se salvó el asentamiento de [noxious_gases_province.GetName]." #NT!
  
 lv_noxious_gases_pulse.0002.t.spooky_1: "Algo en la niebla" #NT!
 lv_noxious_gases_pulse.0002.desc.spooky_1: "Los vapores no sólo se hicieron más espesos: cambiaron. No en color ni en olor, sino en presencia. La niebla se aferra más de lo que debería, rizándose de maneras extrañas y deliberadas. Un explorador jura que vio sombras moviéndose en su interior: ni hombres ni bestias, sino algo que observaba.\n\nAl anochecer, la niebla zumba con un sonido parecido a un susurro. Dispara canalón cuando se coloca cerca de él. Viejas runas, que durante mucho tiempo se creyeron sin significado, comienzan a brillar débilmente en piedras hundidas.\n\nAlgunos dicen que los gases reavivan viejas magias enterradas en lo profundo de Valyria: poderes ligados al humo y los huesos. Otros dicen que es simplemente la tierra que recuerda lo que alguna vez fue: no solo un reino de fuego, sino de hechicería.\n\nPocos duermen tranquilos. Son pocos los que se atreven a hablar de lo que vieron." #NT!
 lv_noxious_gases_pulse.0002.a.spooky_1: "Lo mejor es no insistir en lo que no se puede explicar." #NT!
 lv_noxious_gases_pulse.0002.a.tt.spooky_1: "Los vapores tóxicos en [noxious_gases_province.GetName] se dispersan independientemente." #NT!
  
 lv_noxious_gases_pulse.0002.t.spooky_2: "Ecos en el viento" #NT!
 lv_noxious_gases_pulse.0002.desc.spooky_2: "La niebla se vuelve más espesa que antes, y con ella llegan sonidos que ninguna garganta viva debería emitir: gemidos bajos, aullidos distantes, el ruido de cascos invisibles sobre la piedra. Algunos afirman que es el viento que sopla entre los pasillos en ruinas, pero otros juran que escucharon voces que hablaban en una lengua muerta hace mucho tiempo.\n\nCada noche, los sonidos se vuelven más atrevidos. No más cerca, sólo más fuerte. Como si lo que los motiva quisiera ser escuchado." #NT!
 lv_noxious_gases_pulse.0002.a.spooky_2: "La tierra recuerda cosas que no debíamos saber." #NT!
 lv_noxious_gases_pulse.0002.a.tt.spooky_2: "[noxious_gases_province.GetName] permaneció inquieto por un tiempo, pero los vapores finalmente se dispersaron." #NT!
  
 lv_noxious_gases_pulse.0002.t.spooky_3: "Hombres muertos respirando" #NT!
 lv_noxious_gases_pulse.0002.desc.spooky_3: "Un grupo de viajeros atraviesa la niebla y emerge pálido, tembloroso... y extrañamente silencioso. Su piel no tiene heridas, pero sus ojos están vidriosos y desenfocados, y sus bocas se contraen con palabras que no pueden pronunciar.\n\nNo responden cuando se les habla. Simplemente respiran: inhalaciones lentas y roncas, una y otra vez. Ordenas que los vigilen, pero algunos guardias se niegan a acercarse a ellos.\n\nLo que sea que pasó en esa niebla, una parte se quedó con ellos." #NT!
 lv_noxious_gases_pulse.0002.a.spooky_3: "Mantenlos cómodos... y contenidos." #NT!
 lv_noxious_gases_pulse.0002.a.tt.spooky_3: "Lo que les pasó a estos hombres siguió siendo un misterio, pero finalmente la niebla sobre [noxious_gases_province.GetName] se diluyó hasta convertirse en lo que era antes." #NT!
  
 lv_noxious_gases_pulse.0002.t.spooky_4: "El color debajo" #NT!
 lv_noxious_gases_pulse.0002.desc.spooky_4: "Durante una sola hora, la niebla brilla levemente de color verde, no vibrante, pero lo suficiente como para arrojar una luz fantasmal sobre el suelo destrozado. Debajo de su brillo, emergen antiguos glifos en antiguas piedras, patrones que no se han visto durante siglos.\n\nAlgunos afirman que es una reacción natural. Otros no hablan de ello en absoluto. El resplandor se desvanece antes del amanecer, dejando sólo silencio y humo." #NT!
 lv_noxious_gases_pulse.0002.a.spooky_4: "Quizás nunca estuvo destinado a ser visto por la luz del sol." #NT!
 lv_noxious_gases_pulse.0002.a.tt.spooky_4: "Muy pronto, el aire en [noxious_gases_province.GetName] volvió a ser como solía ser." #NT!
  
 lv_noxious_gases_pulse.0002.t.spooky_5: "Ceniza en la sangre" #NT!
 lv_noxious_gases_pulse.0002.desc.spooky_5: "Varios trabajadores que trabajan cerca de los vapores desarrollan extrañas aflicciones: piel grisácea y escamosa como pergamino chamuscado, y venas que palpitan débilmente como si brillaran debajo. Ninguno muestra signos de enfermedad o dolor, pero ninguno parece ya humano.\n\nUn curandero insiste en que se trata simplemente de una exposición química. Otro afirma que es una maldición. Y una anciana, medio loca, jura que vio esas marcas en los viejos señores dragón, justo antes de la Perdición." #NT!
 lv_noxious_gases_pulse.0002.a.spooky_5: "Quemar los cuerpos. Quema las herramientas. No hables de esto con nadie." #NT!
 lv_noxious_gases_pulse.0002.a.tt.spooky_5: "Al final, los vapores salen [noxious_gases_province.GetName]." #NT!

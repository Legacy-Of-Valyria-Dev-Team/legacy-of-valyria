l_spanish:
   ## Expedition Events 
 lv_settlement_event.0001.t: "Para reclamar lo perdido" #NT!
 lv_settlement_event.0001.desc: "Ha llegado el momento de actuar según sus ambiciones. Se han inspeccionado las tierras devastadas y hay un plan en marcha; aunque es peligroso, la oportunidad de restaurar la vida en estos territorios abandonados está a nuestro alcance. Se deben trazar mapas de carreteras, reunir suministros, reclutar colonos y nombrar un líder. La pregunta sigue siendo: ¿quién guiará este esfuerzo fundacional?" #NT!
 lv_settlement_event.0001.a: "Reclamaré [ruin.GetNameNoTooltip] personalmente." #NT!
 lv_settlement_event.0001.b: "Un cortesano de confianza reclamará la tierra a mi nombre." #NT!
 lv_settlement_event.0001.c: "Enviaré un vasallo leal." #NT!
 lv_settlement_event.0001.d: "No es el momento adecuado para esto." #NT!
  
 lv_settlement_event.0002.t: "Para reclamar lo perdido" #NT!
 lv_settlement_event.0002.desc: "Ha llegado el momento de actuar según sus ambiciones. Se han inspeccionado las tierras devastadas y hay un plan en marcha; aunque es peligroso, la oportunidad de restaurar la vida en estos territorios abandonados está a nuestro alcance. Se deben trazar mapas de carreteras, reunir suministros, reclutar colonos y nombrar un líder. La pregunta sigue siendo: ¿quién guiará este esfuerzo fundacional?" #NT!
 lv_settlement_event.0002.a: "Espléndido." #NT!
 lv_settlement_event.0002.b: "He cambiado de opinión." #NT!
  
 lv_settlement_event.0003.t: "Una orden desde lo alto" #NT!
 lv_settlement_event.0003.desc: "Llega un mensajero con el sello de su señor y una citación llena de implicaciones. Debes liderar una expedición para recuperar y establecer [ruin.GetName]: arruinado, salvaje y medio tragado por el tiempo. No es una tarea fácil: el viaje es largo, el resultado incierto y la carga del mando pesada.\n\nPero el riesgo conlleva la recompensa. Si el acuerdo echa raíces, puede traer gloria, riqueza y un legado duradero. Y si falla... la historia será tuya.\n\nSoldados y colonos esperan tu palabra. El estandarte aún no se iza, pero todos los ojos se vuelven hacia ti." #NT!
 lv_settlement_event.0003.a: "Lo veré hecho. Que digan que esculpí mi nombre de la ruina." #NT!
 lv_settlement_event.0003.a.tt: "Aceptas el mando y te preparas para liderar la expedición en nombre de tu señor." #NT!
 lv_settlement_event.0003.b: "Que otro persiga sombras y polvo." #NT!
 lv_settlement_event.0003.b.tt: "Rechazas respetuosamente la tarea, dejando que tu señor busque a otra persona." #NT!
  
 lv_settlement_accepted: "El sujeto acepta el liderazgo de la expedición." #NT!
 lv_settlement_accepted_desc: "[settler.GetName] ha aceptado liderar la expedición a [ruin.GetName]." #NT!
  
 lv_settlement_event.0004.t: "Una negativa devuelta" #NT!
 lv_settlement_event.0004.desc: "La palabra regresa no con la trompeta del asentimiento, sino con silencio y una carta sellada. Su vasallo designado, por razones propias, ha declinado el honor (y la carga) de liderar la expedición. Ya sea por precaución, desprecio o simplemente por cuestiones prácticas, la tarea ha sido rechazada.\n\nLos colonos todavía esperan. Los vagones siguen cargados. El camino sigue sinuoso, pero parece que debes nombrar a otro para recorrerlo... o esperar hasta que el momento sea más adecuado para tal ambición." #NT!
 lv_settlement_event.0004.tt: "[rejector.GetName] se ha negado a liderar la expedición a [ruin.GetName]. No podrás volver a solicitarlas durante 6 meses." #NT!
 lv_settlement_event.0004.a: "Entonces encontraré a alguien con mayor determinación." #NT!
 lv_settlement_event.0004.a.tt: "Buscarás a otro que esté dispuesto a asumir el desafío." #NT!
 lv_settlement_event.0004.b: "Los vientos no son los adecuados para esto. Aún no." #NT!
 lv_settlement_event.0004.b.tt: "Decides esperar un momento más oportuno para emprender la expedición." #NT!
  
 lv_settlement_event.0010.t: "En ruta a [ruin.GetNameNoTooltip]" #NT!
 lv_settlement_event.0010.desc.self: "Se hacen los preparativos finales. Se miden las provisiones, se inspeccionan las herramientas y se amarran los últimos carros bajo el cielo gris de la mañana. Tu montura espera a la cabeza de la caravana, su aliento empañado en el aire frío. Detrás de ti yacen las comodidades de la corte, el murmullo de los sirvientes y mayordomos, el fácil peso del mando. Más adelante: caminos accidentados, días largos y una tierra que solo recuerda el fuego y el silencio.\n\nAhora no eres un simple viajero, sino un portador de un legado. Con cada golpe de casco y ruido de carreta, llevas el peso de tu nombre hacia un lugar que podría, si los dioses son amables, resurgir de la ruina.\n\nMientras las puertas se abren y el viento agita tu capa, tus cortesanos se inclinan en silencio, algunos cruzan el corazón, otros observan con gravedad. El camino está marcado. La tierra no esperará para siempre." #NT!
 lv_settlement_event.0010.desc.other: "Tu líder elegido está sentado a horcajadas sobre su caballo, con la armadura pulida y los estandartes enrollados para el largo camino que tenemos por delante. Detrás de ellos se reúne la caravana de la expedición: artesanos y guardias, carros tirados por bueyes y gente ruda con manos callosas y ojos cautelosos. El capitán designado te saluda una vez más desde la silla y ambos hacen un voto silencioso. No van simplemente a domar el desierto, sino a elevar vuestro estandarte por encima de los huesos de lo que fue.\n\nEl viaje será largo y no todos los que partieron podrán regresar. Pero con suerte y un liderazgo fuerte, el asentamiento se levantará, piedra sobre piedra, bajo tu nombre.\n\nLas puertas ya se abren con un chirrido. El polvo ya comienza a levantarse." #NT!
 lv_settlement_event.0010.a: "Hacia la promesa de un nuevo comienzo." #NT!
  
 lv_settlement_event.0011.t.self_liege: "Por mi propia mano" #NT!
 lv_settlement_event.0011.t.self_non_liege: "En nombre de mi señor" #NT!
 lv_settlement_event.0011.t.other_liege: "Se levanta la pancarta" #NT!
 lv_settlement_event.0011.t.other_non_liege: "Una llama reavivada" #NT!
 lv_settlement_event.0011.desc.self_liege: "Se rompe el suelo, se levantan los muros y se encienden los fuegos. Lo que una vez estuvo ahogado por las cenizas y la maleza ahora resuena con el ritmo de los martillos y la esperanza. No estuviste detrás de salas de mando o pergaminos, sino bajo el cielo abierto, guiando cada piedra, cada alma.\n\nLa gente pronuncia tu nombre no sólo como señor o señora, sino como fundador. Un reclamo ganado con valentía, tallado con sudor y hierro. Este lugar respira porque te atreviste a liderar." #NT!
 lv_settlement_event.0011.desc.self_non_liege: "Tus botas fueron las primeras en pisar las viejas piedras. Fue gracias a ti que se levantaron las tiendas, se colocaron las defensas y los colonos se prepararon para la tarea. Lo que surge aquí puede pertenecer a tu señor, pero permanece porque tú lo deseaste.\n\nAlgunos lo olvidarán. Los nobles de la corte pueden brindar por tu éxito con palabras huecas. Pero los colonos no lo olvidarán. Tampoco lo hará la tierra." #NT!
 lv_settlement_event.0011.desc.other_liege: "La expedición que comandaste ha dado sus frutos. Su líder designado informa que se han colocado las primeras piedras y que ahora las hogueras calientan los vientres de los colonos. Es un comienzo, quizás humilde, pero que se lleva en el fondo de tu visión.\n\nLa naturaleza es derrotada (aunque sólo sea por centímetros) y la tierra se agita una vez más ante el llamado de los estandartes y la ley. Con el tiempo, prosperará. Con el tiempo, recordará quién fue el estandarte que lo hizo posible." #NT!
 lv_settlement_event.0011.desc.other_non_liege: "Los cuervos hablan de renovación. Lejos de vuestras propias tierras, una provincia olvidada cobra ahora vida: sus ruinas han sido limpiadas y sus murallas se levantan de nuevo bajo el mando de un señor lejano. Ya sea impulsados ​​por la ambición, el deber o la locura, lo han logrado.\n\nSe dice que el viejo mundo duerme bajo las cenizas. Quizás ahora empiece a despertar." #NT!
 lv_settlement_event.0011.a.self_liege: "Que esta tierra recuerde quién le dio vida." #NT!
 lv_settlement_event.0011.a.self_non_liege: "No era gloria lo que buscaba, pero de todos modos la gané." #NT!
 lv_settlement_event.0011.a.other_liege: "Que el reino sepa que esta tierra fue reclamada por mi palabra." #NT!
 lv_settlement_event.0011.a.other_non_liege: "Lo mejor es estar atento a esas cosas." #NT!

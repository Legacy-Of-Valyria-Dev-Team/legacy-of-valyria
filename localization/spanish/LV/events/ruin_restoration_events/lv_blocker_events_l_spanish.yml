 special_blockers.0001.b: "Gran ciudad" #NT!
 special_blockers.0001.c: "Templo" #NT!
 special_blockers.0001.d: "Tribal" #NT!
 special_blockers.0001.e: "Pirata" #NT!
  
  #You find a Dragon Egg when clearing a mine 
 special_blockers.0002.t: "[valyria_mine_province.GetName]: Un hallazgo bajo las llamas" #NT!
 special_blockers.0002.desc: "La mina de [valyria_mine_province.GetName] se ha cobrado muchas vidas, pero hoy ofrece algo a cambio. En lo profundo de un pozo derrumbado, entre piedra chamuscada y restos esqueléticos de vermis de fuego, los mineros descubrieron un objeto curioso.\n\nSuave como ónix pulido, veteado de brasas brillantes, pulsa débilmente en el aire sofocante: cálido al tacto, casi vivo. No puede ser otra cosa.\n\nUn huevo de dragón.\n\nEl supervisor se estremece cuando me acerco y me lo ofrece con asombro y miedo. Mi sangre se acelera." #NT!
 special_blockers.0002.a: "El huevo ahora me pertenece." #NT!
  
  #You gain Torment 
 special_blockers.0003.t: "La espada en la oscuridad" #NT!
 #special_blockers.0003.desc: "Cuando se colocan las últimas piedras y los estandartes ondean una vez más, la Ira del Wyrm Rojo renace. Sus muros de piedra de dragón se alzan una vez más, intactos por el tiempo, proyectando largas sombras sobre la tierra como lo hicieron durante el reinado del rey Taurion.\nSin embargo, dentro de estos salones, el pasado perdura, no solo en ecos, sino en susurros que nunca se desvanecen del todo.\n\nSe ha descubierto una cámara sellada en lo profundo del gran salón, intacta desde la caída de [GetTitleByKey('k_lokiria').GetNameNoTier]. En el interior, entre polvo y reliquias olvidadas, se encuentra una hoja hecha de acero tan negra como una noche sin luna, cuyo filo brilla con un filo antinatural.\n\n[newly_created_artifact.GetName], la espada del mismísimo rey Taurin, perdida en la historia después de The Doom. Incluso ahora, su presencia está impregnada de un peso inquietante, como si la espada recordara cada batalla que ha probado.\n\nLa pregunta sigue siendo: ¿esta espada se alzará una vez más como símbolo de dominio? ¿Su regreso presagia una era de derramamiento de sangre aún por venir?" #NT!
 special_blockers.0003.desc: "Cuando se colocan las últimas piedras y los estandartes ondean una vez más, la Ira del Wyrm Rojo renace. Sus imponentes muros de piedra de dragón proyectan largas sombras como lo hicieron durante el reinado de Taurion.\n\nSin embargo, dentro de estos pasillos, el pasado perdura. Se descubre una cámara sellada en lo profundo del gran salón, intacta desde el [doom|E]. En el interior, el polvo se adhiere a las reliquias y a los estandartes descoloridos, pero en su corazón hay más que un botín olvidado.\n\nReposando sobre un trono, envuelto en una capa real ahora hecha jirones, hay una figura convertida en polvo hace mucho tiempo, junto a la figura yace una espada, hecha de acero tan negro como una noche sin luna.\n\n[newly_created_artifact.GetName], la espada sostenida por los gobernantes de [GetTitleByKey('k_lokiria').GetNameNoTier], que se supone se perdió en la historia después del [doom|E]. Incluso ahora, lleva un peso inquietante, como si recordara cada batalla que ha vivido.\n\nLa pregunta sigue siendo: ¿esta espada se alzará como símbolo de dominio o su regreso presagia una era de derramamiento de sangre?" #NT!
 special_blockers.0003.a: "La espada de un rey para un gobernante digno." #NT!
 gain_vs_artifact: "Obtienes el [artifact|E] [newly_created_artifact.GetName]" #NT!
  
  #You gain Mage's Fire 
 special_blockers.0004.t: "Un arma más arte que guerra" #NT!
 special_blockers.0004.desc: "La Torre de Lyria ha sido restaurada. Mientras camino por las secciones recién abiertas de la torre puedo sentir las energías mágicas únicas que fluyen a través de estas paredes con más fuerza que nunca. Era como si se hubiera desbloqueado algo completamente nuevo cuando la última de las piedras se volvió a colocar en su lugar.\n\nSubí la torre hacia lo que uno de mis trabajadores llamó una gran biblioteca; dijeron que cuando se retiraron los escombros y se abrieron las puertas, permaneció intacta como si el [doom|E] nunca hubiera ocurrido allí. Al cruzar la puerta, puedo ver que la habitación realmente parecía no haber sido tocada por el tiempo, estantes de libros que se elevaban hacia los techos abovedados de la habitación y contenían conocimientos que probablemente se creían perdidos en el tiempo.\n\nAlgo justo enfrente de la puerta me llamó la atención. Mientras caminaba por la habitación noté que había una vitrina, dentro del vidrio había un estoque de acero valyrio, su pomo azul pulido acentuado por el protector multicolor. Extendí la mano para encontrar el pestillo para abrir la caja, pero antes de que pudiera tocarla, la caja se abrió sola y la puerta se abrió lentamente hacia un lado. Mientras me acerco para reclamar [newly_created_artifact.GetName] puedo sentir una energía mágica fluyendo a través de mí..." #NT!
 special_blockers.0004.a: "Obtienes el [artifact|E] [newly_created_artifact.GetName]" #NT!
  
 #You find a dragon egg amidts the ruins 

   # Titles - Treasure 
 lv_blocker_clearance.0001.t.unexplored_caves.reward: "Destellos en las profundidades" #NT!
 lv_blocker_clearance.0001.t.swamp.reward: "La riqueza olvidada del fango" #NT!
 lv_blocker_clearance.0001.t.floods.reward: "Lo que el diluvio olvidó" #NT!
 lv_blocker_clearance.0001.t.noxious_gases.reward: "Riquezas en las cenizas" #NT!
 lv_blocker_clearance.0001.t.stonemen.reward: "El tesoro de los hombres de piedra" #NT!
 lv_blocker_clearance.0001.t.bandit_camps.reward: "La recompensa de los bandidos" #NT!
 lv_blocker_clearance.0001.t.small_ruined_holding.reward: "Botín entre las piedras" #NT!
 lv_blocker_clearance.0001.t.medium_ruined_holding.reward: "Riquezas debajo de las ruinas" #NT!
 lv_blocker_clearance.0001.t.large_ruined_holding.reward: "Fortuna de los señores olvidados" #NT!
  
   # Descriptions 
 lv_blocker_clearance.0001.desc.unexplored_caves: "Después de largas semanas bajo tierra, los últimos portadores de la antorcha han regresado. Se han mapeado los túneles, se han marcado los peligros y lo desconocido ha salido a la luz. Donde antes solo había oscuridad y pavor, ahora hay mapas, campamentos y el comienzo de caminos. Las cavernas ya no son un refugio de susurros y huesos rotos, ahora están domesticadas y reclamadas por aquellos con la voluntad de profundizar.\n\n" #NT!
 lv_blocker_clearance.0001.desc.swamp: "Lo que alguna vez fue un fango de podredumbre y ruina se ha vuelto transitable. El pantano, que durante mucho tiempo fue un refugio para los insectos que pican, los pies que se hunden y las desapariciones susurradas, ha sido drenado y domesticado, si es que tal cosa es posible. Los senderos elevados ahora serpentean a través de un terreno que alguna vez fue demasiado traicionero para pisar, y la niebla asfixiante se ha disipado con cada árbol talado y piedra torneada. Ya no es un lugar de muerte y decadencia, sino uno de orden ganado con esfuerzo. Una nueva base, tallada a partir del barro y la locura.\n\n" #NT!
 lv_blocker_clearance.0001.desc.floods: "Las aguas finalmente han bajado. Lo que una vez estuvo ahogado bajo las mareas agitadas y la tierra empapada ahora se revela: caminos en ruinas, muros rotos y campos empapados, sí, pero también tierra seca y la oportunidad de reconstruir. Se han tallado diques y canales de drenaje, se han levantado terraplenes y se han colocado piedras donde antes reinaba el barro. Todavía es un país húmedo, pero ya no está indefenso. La inundación ha retrocedido, aunque sólo sea por un tiempo.\n\n" #NT!
 lv_blocker_clearance.0001.desc.noxious_gases: "El aire por fin se ha despejado. Lo que antes estaba cargado de muerte (vapores asfixiantes y neblina amarga) ha comenzado a diluirse. Se han excavado pozos de ventilación, se han barrido las cenizas y se ha dado tiempo a la tierra para respirar. El hedor a azufre aún persiste, débil pero ya no fatal. La montaña todavía arde a lo lejos, una silenciosa advertencia, pero su veneno ya no se apodera de la tierra. Lo peor ya pasó... por ahora.\n\n" #NT!
 lv_blocker_clearance.0001.desc.stonemen: "Está hecho. Los hombres de piedra se han ido: expulsados, pasados ​​por la espada o abandonados a deslizarse silenciosamente bajo las aguas negras del río. No tenían esperanza, ni cura, ni futuro. Retorcidos por la escala de grises y medio locos de dolor y hambre, se habían convertido en un peligro para todos los que pasaban cerca. Aun así, no fue fácil. Algunos recordaron sus nombres. Otros rogaron por la muerte en una lengua demasiado quebrantada para comprenderla. Ahora, donde una vez se acurrucaron, sólo queda el silencio. La tierra es más segura. Pero algo más frío ha echado raíces en el aire.\n\n" #NT!
 lv_blocker_clearance.0001.desc.bandit_camps: "El campamento ha sido desmantelado. Tiendas de campaña derribadas, incendios sofocados y sangre empapada en el suelo. Los bandidos lucharon como los hombres desesperados que eran: andrajosos, brutales, sin ilusiones de piedad. Pero tus hombres se mantuvieron firmes. Los pocos forajidos que sobrevivieron huyeron a la selva, dispersos y heridos. Por ahora, las carreteras están más tranquilas y la gente puede respirar un poco más tranquila. Se ha hecho justicia, dura, sangrienta y tardía.\n\n" #NT!
 lv_blocker_clearance.0001.desc.small_ruined_holding: "Piedra y silencio: esto era todo lo que quedaba cuando llegaste por primera vez. Ahora se ha reducido la maleza, se han examinado los muros rotos y se han eliminado los últimos peligros. Lo que alguna vez fue una explotación vacía ahora está lista para servir nuevamente. Todavía queda mucho trabajo por hacer, pero sus huesos son fuertes. Ya sea olvidado por los señores o abandonado por el tiempo, este lugar no volverá a perderse.\n\n" #NT!
 lv_blocker_clearance.0001.desc.medium_ruined_holding: "Tomó tiempo (y sangre) pero las ruinas quedaron limpias. Se han inspeccionado torres en ruinas, se han apuntalado pasillos inestables y los peligros que aún persistían en su interior han sido eliminados o enterrados para siempre. La explotación, que alguna vez fue una cáscara de propósito perdido, ahora está lista para servir una vez más. Puede que nunca recupere todas sus glorias pasadas, pero la tierra ha sido recuperada y las viejas piedras se levantan con nuevas intenciones.\n\n" #NT!
 lv_blocker_clearance.0001.desc.large_ruined_holding: "Las ruinas se alzaban vastas y silenciosas, impregnadas de recuerdos más antiguos que los mapas. Sus muros, rotos pero aún desafiantes, llevaban las cicatrices de la conquista, el fuego y el tiempo mismo. Sin embargo, incluso estas piedras podrían ser domesticadas. Después de un largo trabajo y un esfuerzo cuidadoso, el sitio está asegurado: sus arcos desmoronados se estabilizan, sus profundidades olvidadas se limpian de peligros. Aunque los fantasmas de los imperios caídos todavía parecen susurrar a través de los pasillos desgastados por el viento, las ruinas ya no están abandonadas. Un nuevo capítulo comienza sobre estos viejos huesos.\n\n" #NT!
  
 lv_blocker_clearance.0001.desc.unexplored_caves.dragon_egg: "Sin embargo, en las profundidades de estas cuevas aguarda un descubrimiento. Entre los escombros y el polvo se encuentra un huevo [dragon|E], cuya cáscara brilla débilmente en la penumbra. Una reliquia de una época pasada, que encierra en su interior la promesa de renacimiento y poder." #NT!
 lv_blocker_clearance.0001.desc.swamp.dragon_egg: "Entre el lodo y la piedra, enterrado en raíces más antiguas que la memoria, se encontró algo: suave como piedra de río, pero cálido al tacto. Un huevo de [dragon|E], o eso dicen los susurros. Leyendas descifradas hablan de reliquias de este tipo que quedaron en los días de [valyria|E], perdidas en el fuego o tragadas por la tierra. Que uno debería emerger aquí, en el corazón de un pantano olvidado, es una historia que pocos creerán. Pero quienes lo han visto lo saben: el mundo simplemente cambió." #NT!
 lv_blocker_clearance.0001.desc.floods.dragon_egg: "Entre la suciedad y los escombros dejados por la inundación, se descubrió algo completamente inesperado: suave, escamoso y ligeramente cálido. Un huevo de [dragon|E]. Si se perdió en algún antiguo cataclismo o sepultó apresuradamente durante la caída de [old_valyria|E], nadie puede decirlo. Pero las historias son claras: esas cosas no son meras reliquias. Son promesa y peligro." #NT!
 lv_blocker_clearance.0001.desc.noxious_gases.dragon_egg: "En la cuenca agrietada de un barranco chamuscado, enterrado bajo capas de ceniza fría y piedra volcánica, se desenterró algo extraño: un huevo, oscuro y veteado, que palpitaba débilmente con calor. Un huevo de [dragon|E], según todas las cuentas. Nadie puede decir cómo llegó a descansar allí, pero a la sombra de las montañas de fuego, tales reliquias no son tan fáciles de descartar como mitos. La sangre del viejo mundo vuelve a agitarse." #NT!
 lv_blocker_clearance.0001.desc.stonemen.dragon_egg: "En el corazón del campamento de los canteros, donde se mezclaban cenizas y piedras, se descubrió una extraña reliquia. Un huevo, oscuro y veteado, que palpitaba débilmente con calor. Un huevo de [dragon|E], quizás dejado por un señor que huía o enterrado apresuradamente durante la caída de [valyria|E]. Su presencia aquí no es casualidad. Un resto de fuego, durmiendo bajo las cenizas." #NT!
 lv_blocker_clearance.0001.desc.bandit_camps.dragon_egg: "Debajo de la piedra derrumbada del antiguo gran salón, tus hombres descubrieron algo extraño: ovalado, parecido a una piedra y levemente cálido al tacto. Un huevo de [dragon|E]. Quizás abandonado por un noble valyrio que huía o enterrado en secreto durante la Perdición. Cualquiera que sea su origen, su presencia aquí no es casual. Un resto de fuego, durmiendo bajo las cenizas." #NT!
 lv_blocker_clearance.0001.desc.small_ruined_holding.dragon_egg: "En las ruinas de lo que alguna vez pudo haber sido una bóveda o un santuario, enterrada bajo escombros chamuscados y sellos desgastados por el tiempo, se descubrió una extraña reliquia: lisa, ovalada y que palpitaba débilmente con calor. Un huevo de [dragon|E], aunque nadie pudo decir cuántos años tenía ni por qué estaba escondido. Una reliquia de un linaje olvidado... o algo aún más antiguo. Las ruinas contenían más que piedra." #NT!
 lv_blocker_clearance.0001.desc.medium_ruined_holding.dragon_egg: "En las profundidades de la antigua torre del homenaje, detrás de unos muros que durante mucho tiempo se creyeron derrumbados, se encontró una extraña reliquia: un huevo, oscuro y veteado, que palpitaba débilmente con calor. Un huevo de [dragon|E], quizás dejado por un señor que huía o enterrado apresuradamente durante la caída de [valyria|E]. Su presencia aquí no es casualidad. Un resto de fuego, durmiendo bajo las cenizas." #NT!
 lv_blocker_clearance.0001.desc.large_ruined_holding.dragon_egg: "Muy por debajo de las agujas derrumbadas, tus hombres desenterraron una cámara a la que no llegaba la luz del sol. En su interior, rodeado de piedra chamuscada y glifos descoloridos, había un solo huevo: brillante, veteado y cálido al tacto. Ya sea que se haya dejado atrás apresuradamente o se haya sellado con un propósito, ha soportado la caída de imperios y el silencio de siglos. Ahora es tuyo. Una reliquia de [dragons_plural|E], durmiendo en la oscuridad." #NT!
  
 lv_blocker_clearance.0001.desc.unexplored_caves.gold_high: "Las cavernas, que alguna vez fueron un lugar de oscuridad y terror, han revelado sus secretos. Cuando los últimos portadores de la antorcha regresaron, trajeron consigo no sólo historias de peligros, sino también tesoros más allá de la imaginación. El oro y las gemas, ocultos incluso a la vista de [dragonlords|El]', ahora se encuentran a la luz del día. Una recompensa adecuada por limpiar las profundidades." #NT!
 lv_blocker_clearance.0001.desc.swamp.gold_high: "La obra estaba destinada únicamente a drenar la tierra y levantar caminos firmes, pero la fortuna tiene voluntad propia. Debajo de un altar de piedra derrumbado, en lo profundo del corazón del cieno, los excavadores encontraron oro. Cofres sellados herméticamente con hierro oxidado, monedas estampadas con viejos rostros valyrios y adornos perdidos por siglos de podredumbre y raíces. Nadie puede decir cómo llegó a ser enterrado en un lugar así: algunos susurran sobre la huida de [dragonlords|El], otros sobre bandidos que nunca escaparon de su propia trampa. Cualquiera que sea su origen, el tesoro es real. Y ahora es tuyo." #NT!
 lv_blocker_clearance.0001.desc.floods.gold_high: "A medida que las aguas se retiraron, dejaron tras de sí algo más que sedimentos y ruinas. Escondido en un sótano en ruinas o medio enterrado bajo piedras caídas, se descubrió un vasto tesoro: cientos de monedas de oro, joyas finas y artefactos de fabricación olvidada. Una fortuna, desde cualquier punto de vista. Suficiente para reconstruir, ampliar o tentar la envidia de señores lejanos." #NT!
 lv_blocker_clearance.0001.desc.noxious_gases.gold_high: "Entre las ruinas ennegrecidas y la piedra chamuscada, se encontró una bóveda: sus cerraduras deformadas por el calor pero intactas. En el interior, el oro brillaba sin que la ceniza ni el tiempo lo opacaran. Monedas, lingotes y adornos, más de lo que la mayoría de los señores podrían reclamar, intactos por el fuego pero escondidos durante generaciones. Ya sea que esté atesorado por [dragonlords|El] o enterrado a toda prisa ante la ira de la montaña, ahora te pertenece." #NT!
 lv_blocker_clearance.0001.desc.stonemen.gold_high: "En el corazón del campamento de los canteros, donde se mezclaban cenizas y piedras, se descubrió un escondite escondido. Monedas de oro, deslustradas pero intactas, y reliquias de artesanía perdidas hace mucho tiempo. Quizás dejado atrás por un señor que huía o enterrado apresuradamente durante la caída de [valyria|E]. Cualquiera que sea su origen, es un tesoro que vale la pena reclamar: una recompensa para quienes se atrevieron a enfrentar la maldición." #NT!
 lv_blocker_clearance.0001.desc.bandit_camps.gold_high: "Mientras tus hombres abrían la bóveda oculta debajo del campamento de los bandidos, el brillo del oro inundó la cámara: cofres repletos de monedas robadas, baratijas doradas y galas de comerciante. Pero la celebración llegó demasiado pronto. Los pasos resuenan en la oscuridad. Desde la línea de árboles, se acumulan sombras: bandidos aún no asesinados, impulsados ​​por la desesperación y la venganza. El oro está a nuestro alcance, pero queda una última pelea y será cruel." #NT!
 lv_blocker_clearance.0001.desc.small_ruined_holding.gold_high: "Oculta en un sótano sellado, detrás de paredes medio derrumbadas por el tiempo, se encontraba una bóveda olvidada. En el interior: monedas junto al cofre, viejos sellos con oro descoloridos por el polvo y reliquias de valor eliminadas de la memoria hace mucho tiempo. Quizás el tesoro de una casa perdida en la guerra o en el exilio. Ahora es tuyo: un tesoro lo suficientemente grande como para remodelar planes y saldar deudas por igual." #NT!
 lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_high: "Se pensaba que los niveles inferiores de las ruinas se habían derrumbado y ocultaban algo más que polvo. Cámaras ocultas detrás de paredes falsas revelaban una fortuna: monedas marcadas por casas desaparecidas hace mucho tiempo, copas de plata y reliquias familiares que no habían sido tocadas por la luz durante décadas. La bóveda probablemente fue sellada apresuradamente, abandonada en la guerra o en el exilio. Su redescubrimiento ahora es una recompensa no sólo por la perseverancia, sino también por la supervivencia." #NT!
 lv_blocker_clearance.0001.desc.large_ruined_holding.gold_high: "Debajo de la plaza central, sellada con una piedra demasiado gruesa para romperla sin meses de trabajo, se reveló un antiguo tesoro. Monedas más antiguas que la Fe, coronas de imperios extinguidos hace mucho tiempo y estatuas doradas talladas en estilos no vistos durante generaciones. Es una fortuna no sólo por su peso, sino también por su asombro: un vestigio tangible del mundo que fue. Un tesoro que rivaliza con los tesoros más grandes del [dragonlords|El], ahora tuyo para reclamarlo." #NT!
  
 lv_blocker_clearance.0001.desc.unexplored_caves.gold_low: "Las cavernas contenían algo más que sombras. Entre los sinuosos pasajes, se descubrió un pequeño tesoro: monedas desgastadas por el tiempo y un montón de gemas enclavadas en piedras antiguas. No lo suficiente como para despertar la envidia de un rey, pero sí lo suficiente como para brillar con promesas. Un premio digno para aquellos lo suficientemente valientes como para desafiar las profundidades." #NT!
 lv_blocker_clearance.0001.desc.swamp.gold_low: "En el claro de lodo y lodo, algo brillaba bajo las raíces. Un tesoro modesto: no es un rescate real, pero sí suficiente para recuperar el aliento. Monedas esparcidas, una copa deslustrada, restos de riqueza escondidos u olvidados hace mucho tiempo. Quizás el botín de un señor que huye o el tributo final de una caravana condenada al fracaso. Cualquiera que sea su historia, el oro es real y ahora llena sus arcas: una silenciosa recompensa por el trabajo duro y sucio." #NT!
 lv_blocker_clearance.0001.desc.floods.gold_low: "No era gran cosa, al menos no a primera vista: una bolsa de monedas viejas atrapada entre las vigas de un almacén derrumbado, unos cuantos lingotes esparcidos escondidos bajo piedras caídas. Aún así, es un hallazgo bienvenido. Por modesto que sea, es suficiente para calmar las manos inseguras y financiar los primeros pasos de la recuperación." #NT!
 lv_blocker_clearance.0001.desc.noxious_gases.gold_low: "No todas las riquezas son grandiosas. Escondido bajo rocas derrumbadas y escombros chamuscados, salió a la luz un modesto tesoro: algunas monedas fusionadas, un cofre chamuscado medio consumido por el fuego. Sin embargo, quedaba suficiente para importar. Una bendición silenciosa, extraída de las cenizas de lo que casi se perdió." #NT!
 lv_blocker_clearance.0001.desc.stonemen.gold_low: "Entre las ruinas del campamento de los canteros se encontró un pequeño alijo: monedas, deslustradas pero intactas, y algunas baratijas que sobrevivieron a la decadencia. No es una fortuna, pero es suficiente para recordar a quienes quedan que incluso en los lugares más oscuros se puede encontrar esperanza. Una pequeña recompensa por una tarea sombría." #NT!
 lv_blocker_clearance.0001.desc.bandit_camps.gold_low: "Escondidos bajo una tabla del suelo podrida, tus hombres descubrieron un pequeño alijo de botín: monedas esparcidas, un anillo de plata y una copa abollada por el viaje. Lo suficiente como para importar, pero no lo suficiente como para alardear. Cuando empezaron a recoger el botín, se produjo un movimiento en la maleza. El último de los bandidos, harapiento y aullando, avanza en un último y salvaje intento de reclamar lo que es suyo. Se avecina un choque más." #NT!
 lv_blocker_clearance.0001.desc.small_ruined_holding.gold_low: "Entre los restos destrozados de la cámara de un mayordomo, tus hombres descubrieron un modesto alijo: bolsas de monedas, algunos anillos y herramientas de antigua artesanía escondidas debajo de las tablas del suelo. Lo suficiente como para considerarlo una recompensa, si no una ganancia inesperada. Parece que incluso las ruinas más humildes aún pueden aferrarse a su pasado." #NT!
 lv_blocker_clearance.0001.desc.medium_ruined_holding.gold_low: "Entre los restos de un viejo solar, tus hombres descubrieron un pequeño cofre sellado: sus bisagras de hierro estaban oxidadas, pero su contenido intacto. Modesto, pero significativo: monedas, algunas joyas y un libro de contabilidad estrecho, demasiado descolorido para leerlo. Quizás las últimas pertenencias de un castellano que nunca regresó. Cualquiera que sea la historia, su valor perdura." #NT!
 lv_blocker_clearance.0001.desc.large_ruined_holding.gold_low: "Escondido detrás de un muro derrumbado en lo que alguna vez pudo haber sido la propiedad de un noble, tus hombres descubrieron un escondite sellado hace mucho tiempo: una modesta colección de joyas, monedas antiguas y artículos ceremoniales probablemente escondidos en el caos de la caída. Aunque humilde en comparación con la grandeza de las ruinas mismas, es un valioso fragmento del pasado y una prueba de que incluso las grandes ciudades fueron construidas por manos humanas." #NT!
  
   #Options 
 lv_blocker_clearance.0001.a: "¡Excelente!" #NT!
  
   ## Swamp: Challenge Event 
 lv_blocker_clearance.0011.t: "Domando el pantano" #NT!
 lv_blocker_clearance.0011.desc: "El pantano ha sido drenado y su terreno salvaje parcialmente sometido, pero queda un último esfuerzo para recuperar completamente la tierra. Es necesario reforzar los terraplenes, redirigir los canales y colocar con cuidado los nuevos cimientos. Un solo paso en falso podría hacer que el fango regresara, tragándose meses de esfuerzo.\n\nLa gente busca dirección en usted, o en su mayordomo. Si se gestiona bien esta última fase, se conquistará el pantano. De lo contrario, las aguas pueden volver a subir." #NT!
 lv_blocker_clearance.0011.a: "Yo mismo supervisaré la fase final." #NT!
 lv_blocker_clearance.0011.b: "Deja que mi mayordomo se encargue de los detalles." #NT!
  
   # Swamp: Failure 
 lv_blocker_clearance.0012.t: "Esfuerzos hundidos" #NT!
 lv_blocker_clearance.0012.desc: "A pesar de los mejores esfuerzos de tu equipo, el pantano resiste todos los intentos de domesticarlo. Los cimientos se resbalan, los trabajadores desaparecen en el lodo y las plataformas construidas apresuradamente se pudren en días. La tierra reclama lo poco ganado y el progreso vuelve a hundirse en el fango. No es una pérdida total, pero se siente cercana." #NT!
 lv_blocker_clearance.0012.a: "El pantano es más testarudo de lo que pensábamos. Lo intentaremos de nuevo." #NT!
  
   # Swamp: Critical Failure 
 lv_blocker_clearance.0013.t: "Tragado por el fango" #NT!
 lv_blocker_clearance.0013.desc: "Todo se derrumbó. Estructuras enteras desaparecieron bajo el pantano y un canal de drenaje mal calculado inundó un terreno vital. Los equipos se dispersaron, se perdieron herramientas y el pantano se hizo más espeso con cada paso en falso. Todo lo que se había logrado ahora está deshecho: la tierra es una vez más un pantano traicionero que se hunde. Tendrás que empezar desde el principio." #NT!
 lv_blocker_clearance.0013.a: "Todo se acabó. El pantano ha devorado nuestro trabajo." #NT!
  
   # Swamp: Success 
 lv_blocker_clearance.0014.t: "Tierra firme al fin" #NT!
 lv_blocker_clearance.0014.desc: "Con manos firmes y una planificación cuidadosa, el pantano ha sido dominado. Se han cavado canales, se han reforzado los soportes y comienza a formarse tierra seca donde antes sólo había barro y descomposición. Se necesitará tiempo para aprovecharlo, pero por ahora el peligro ha desaparecido. El fango se ha hecho manejable." #NT!
 lv_blocker_clearance.0014.a: "Fue algo que costó ganar, pero el terreno ahora es nuestro." #NT!
  
   # Swamp: Critical Success 
 lv_blocker_clearance.0015.t: "El pantano transformado" #NT!
 lv_blocker_clearance.0015.desc: "Un golpe maestro. La fase final del esfuerzo se desarrolló perfectamente: sin errores ni contratiempos. La tierra se secó más rápido de lo esperado, revelando terreno estable e incluso restos de estructuras perdidas hace mucho tiempo debajo del barro. Entre los postes podridos y las piedras hundidas, algo brillaba: un cofre sellado, intacto por el tiempo, ahora libre de las garras del pantano." #NT!
 lv_blocker_clearance.0015.a: "Se limpia el pantano y el cieno nos da algo a cambio." #NT!
  
   ## Floods: Challenge Event 
 lv_blocker_clearance.0021.t: "El fango cede" #NT!
 lv_blocker_clearance.0021.desc: "Las aguas de las inundaciones en su mayor parte han retrocedido, dejando atrás el suelo empapado y los frágiles comienzos de la recuperación. Sin embargo, a menos que se dominen los ríos y se drene adecuadamente la tierra, todo progreso puede perderse. Hay que cavar zanjas, reforzar los diques y guiar a la gente con un propósito, antes de que la próxima lluvia lo destruya todo.\n\nEl trabajo exige mano firme y mente clara. Ya sea por tu orden o por la de tu mayordomo, este esfuerzo final decidirá si la tierra es recuperada o si se ahoga una vez más." #NT!
 lv_blocker_clearance.0021.a: "Haré retroceder las inundaciones." #NT!
 lv_blocker_clearance.0021.b: "Mi mayordomo terminará lo que se empezó." #NT!
  
   # Floods: Failure 
 lv_blocker_clearance.0022.t: "Las aguas suben de nuevo" #NT!
 lv_blocker_clearance.0022.desc: "Los esfuerzos para redirigir las aguas de las inundaciones han fracasado. Los diques improvisados ​​se rompieron bajo la presión y los planes de drenaje resultaron insuficientes. Si bien se han logrado algunos avances, ahora está claro que las inundaciones han reanudado su lento avance, deshaciendo los avances recientes. Los campos se ahogan de nuevo y los espíritus se hunden junto a ellos." #NT!
 lv_blocker_clearance.0022.a: "Subestimamos las aguas. Lo intentaremos de nuevo, mejor preparados." #NT!
  
   # Floods: Critical Failure 
 lv_blocker_clearance.0023.t: "barrido" #NT!
 lv_blocker_clearance.0023.desc: "Un colapso total. Las lluvias regresaron con fuerza y ​​las defensas contra inundaciones se derrumbaron en desorden. Los canales se desbordaron, los puentes colapsaron y se perdieron secciones enteras de tierra ganada al mar. El terreno está nuevamente asfixiado por el cieno y el agua, y todos los avances logrados han sido arrasados. La tierra ha reclamado lo que le fue quitado; ahora hay que hacerlo todo de nuevo." #NT!
 lv_blocker_clearance.0023.a: "Esto fue un desastre... Tendremos que empezar desde el principio." #NT!
  
   # Floods: Success 
 lv_blocker_clearance.0024.t: "Las aguas retroceden" #NT!
 lv_blocker_clearance.0024.desc: "Después de un trabajo incansable, las últimas inundaciones han sido rechazadas. Los diques se mantienen firmes, los arroyos desviados encuentran su curso y el suelo empapado comienza a secarse bajo el sol que regresa. Todavía queda mucho por reconstruir, pero el peligro ha pasado y la tierra vuelve a ser tuya." #NT!
 lv_blocker_clearance.0024.a: "Por fin, las inundaciones han quedado atrás." #NT!
  
   # Floods: Critical Success 
 lv_blocker_clearance.0025.t: "Domar las aguas" #NT!
 lv_blocker_clearance.0025.desc: "No sólo se mantuvo a raya la inundación, sino que se dominó. La brillante redirección del agua, el trabajo rápido y la planificación astuta no sólo han secado la tierra sino que la han remodelado. Las antiguas marismas son ahora tierras bajas fértiles. Y en el lecho expuesto del río, se descubrió algo antiguo: un tesoro enterrado y olvidado, ahora sacado a la luz por las aguas que se alejan." #NT!
 lv_blocker_clearance.0025.a: "Las aguas retroceden y dejan un regalo." #NT!
  
   ## Noxious Gases: Challenge Event 
 lv_blocker_clearance.0031.t: "Sellando los vapores" #NT!
 lv_blocker_clearance.0031.desc: "Los peores humos se han disipado, pero la tierra aún no es segura. Los gases venenosos todavía surgen de respiraderos profundos o se aferran a terrenos bajos, invisibles y mortales. La contención final debe manejarse con precisión: desviar el flujo, sellar fisuras y tal vez construir canales para dispersar lo que queda.\n\nUn solo error de cálculo podría liberarlo todo nuevamente. Puede supervisar este esfuerzo usted mismo o confiar la tarea a su mayordomo. De cualquier manera, ésta es la barrera final entre la ruina y la renovación." #NT!
 lv_blocker_clearance.0031.a: "Me encargaré de esto personalmente. Hay que hacerlo bien." #NT!
 lv_blocker_clearance.0031.b: "Confiaré la contención a mi mayordomo." #NT!
  
   # Noxious Gases: Failure 
 lv_blocker_clearance.0032.t: "Los vapores vuelven a subir" #NT!
 lv_blocker_clearance.0032.desc: "El trabajo para sellar el último de los respiraderos nocivos ha fracasado. Ya sea por falta de criterio, barreras desalineadas o simplemente por la naturaleza volátil de la tierra misma, los gases han comenzado a elevarse una vez más. Los trabajadores enfermos tropiezan entre la niebla y el hedor se pega al aire como una maldición.\n\nEl progreso se ha deshecho y la zona se vuelve peligrosa una vez más. Si bien no se trata de un colapso total, el revés es claro y costoso.\n\n" #NT!
 lv_blocker_clearance.0032.desc.illness.self: "Cuando los vapores se espesaron una vez más, usted quedó atrapado en lo peor. El sabor del metal se pega a tu boca y tus pulmones se sienten chamuscados. Han pasado los días, pero la enfermedad persiste: un cruel recordatorio de lo cerca que estuvo del peligro." #NT!
 lv_blocker_clearance.0032.desc.illness.councillor: "En el caos del esfuerzo fallido, su delegado se llevó la peor parte de la exposición. Ahora yacen en cama, con la piel húmeda y la respiración entrecortada, y su recuperación es incierta. El peligro persiste y ahora uno de los suyos paga el precio." #NT!
 lv_blocker_clearance.0032.a: "Calculamos mal. Lo intentaremos de nuevo, esta vez con más cuidado." #NT!
  
   # Noxious Gases: Critical Failure 
 lv_blocker_clearance.0033.t: "Ahogándonos en nuestras aspiraciones" #NT!
 lv_blocker_clearance.0033.desc: "Desastre. Lo que debía ser el esfuerzo final de contención ha salido catastróficamente mal. Una fisura sellada se abrió con un rugido, inundando el área con vapores asfixiantes. Los trabajadores se desplomaron donde estaban. El ganado pereció. Incluso el propio viento pareció volverse traidor, llevando el veneno más lejos que antes.\n\nTodo lo que se había logrado ya no existe. La tierra se encuentra nuevamente asfixiada por un gas espeso y asfixiante. Limpiarlo nuevamente requerirá tiempo, precaución y no poca suerte." #NT!
 lv_blocker_clearance.0033.a: "Hemos fracasado rotundamente..." #NT!
  
   # Noxious Gases: Success 
 lv_blocker_clearance.0034.t: "El aire se aclara" #NT!
 lv_blocker_clearance.0034.desc: "Los esfuerzos finales han tenido éxito. Se han sellado las fisuras, se han desviado los respiraderos y los últimos rastros de los vapores asfixiantes se han desvanecido. El aire, que alguna vez estuvo cargado de veneno, ahora lleva el limpio aroma del viento abierto y la lluvia lejana. Las cosechas pueden crecer, el ganado puede regresar y la gente se atreve a respirar profundamente una vez más.\n\nA través de diligencia, planificación y un esfuerzo no pequeño, la tierra ha sido recuperada del asesino invisible. El peligro ha pasado. Al menos por ahora.\n\n" #NT!
 lv_blocker_clearance.0034.desc.illness.self: "Sin embargo, no todas las victorias son gratuitas. Saliste de la operación con éxito, pero el tiempo pasado cerca de los vapores fétidos ha dejado su huella. Una tos que no desaparece del todo. Mareos que duran más de lo debido. La tierra es segura... pero tú no estás intacto." #NT!
 lv_blocker_clearance.0034.desc.illness.councillor: "Aunque la operación terminó con éxito, su mayordomo no salió ileso. La exposición a los vapores los ha dejado pálidos e inestables, y su voz es más débil que antes. Insisten en que se recuperarán con el tiempo, pero su sacrificio no será olvidado." #NT!
 lv_blocker_clearance.0034.a: "El aire por fin está claro." #NT!
  
   # Noxious Gases: Critical Success 
 lv_blocker_clearance.0035.t: "Una ganancia inesperada en la niebla" #NT!
 lv_blocker_clearance.0035.desc: "La fase final fue más tranquila de lo que incluso los más audaces se atrevieron a esperar. Los respiraderos se sellaron sin incidentes, el aire se aclaró en un tiempo récord y la tierra pareció exhalar aliviada. Sin embargo, la fortuna tenía reservada algo más que aire limpio. Mientras inspeccionaban la zona por última vez, tus trabajadores desenterraron algo escondido durante mucho tiempo bajo la tierra envenenada: una antigua bóveda, sellada y olvidada, preservada por los mismos vapores que una vez hicieron que este lugar fuera mortal.\n\nEl peligro ha desaparecido, y en su lugar... aguarda una ganancia inesperada." #NT!
 lv_blocker_clearance.0035.a: "El aire se aclara y revela riquezas enterradas en la niebla." #NT!
  
   ## Stonemen: Challenge Event 
 lv_blocker_clearance.0041.t: "El último de los hombres de piedra" #NT!
 lv_blocker_clearance.0041.desc: "Los hombres de piedra han sido rechazados, pero su presencia aún persiste en los márgenes: cuevas, ruinas y refugios destruidos donde los enfermos y desesperados se acurrucan en silencio. Para despejar completamente el campamento, el área debe ser barrida, puesta en cuarentena y sellada. No es sólo una cuestión de espada y fuego, sino de estructura y orden.\n\nSi el trabajo se maneja mal, los afligidos pueden regresar... y la maldición se extenderá de nuevo. ¿Te harás cargo de la purga o confiarás en la precisión de tu mariscal?" #NT!
 lv_blocker_clearance.0041.a: "Yo mismo me encargaré de que esta plaga acabe." #NT!
 lv_blocker_clearance.0041.b: "Mi mariscal coordinará el barrido final." #NT!
  
   # Stonemen: Failure 
 lv_blocker_clearance.0042.t: "La maldición persiste" #NT!
 lv_blocker_clearance.0042.desc: "La operación fracasó. Las rutas estaban bloqueadas, los suministros escaseaban y, cuando llegó el último empujón, los canteros se dispersaron entre el fango y las ruinas. Demasiados escaparon del cordón y el campamento aún está inaccesible. Su presencia sigue siendo un peligro, y lo que es peor: aquellos que se aventuraron demasiado cerca ahora ven manchas extrañas en su piel." #NT!
 lv_blocker_clearance.0042.a: "Se nos escaparon de los dedos. Debemos prepararnos de nuevo." #NT!
  
   # Stonemen: Critical Failure 
 lv_blocker_clearance.0043.t: "Tocado por la piedra" #NT!
 lv_blocker_clearance.0043.desc: "Sobrevino el desastre. El grupo de avanzada fue invadido y varios hombres fueron arrastrados al campo infectado y nunca más se los volvió a ver. Otros huyeron aterrorizados, y los hombres de piedra supervivientes, envalentonados, ahora se extienden más lejos que antes. La enfermedad se propaga. Las patrullas informan de avistamientos más cerca de los asentamientos. Todo el esfuerzo ha fracasado, y lo que es peor: sus consecuencias ahora se extienden hacia afuera." #NT!
 lv_blocker_clearance.0043.a: "Lo hemos empeorado. La piedra se extiende sin control." #NT!
  
   # Stonemen: Success 
 lv_blocker_clearance.0044.t: "La maldición contenida" #NT!
 lv_blocker_clearance.0044.desc: "Gracias a la disciplina, una planificación cuidadosa y una resolución sombría, el campamento ha sido despejado. Los incendios purgaron lo que no se pudo salvar y ningún infectado quedó vagando. La zona todavía muestra cicatrices de enfermedad y dolor, pero la amenaza ha desaparecido. La tierra puede sanar ahora, lenta y cautelosamente." #NT!
 lv_blocker_clearance.0044.a: "Está hecho. Que ninguna piedra quede en pie." #NT!
  
   # Stonemen: Critical Success 
 lv_blocker_clearance.0045.t: "Un final rápido y limpio" #NT!
 lv_blocker_clearance.0045.desc: "La operación fue rápida, decisiva y milagrosamente limpia. Los afectados fueron expulsados ​​o destruidos con una resistencia mínima, e incluso el terreno jugó a tu favor: los canales naturales los rodearon y nadie que se aventuró a entrar cayó enfermo. Cuando las últimas cenizas se enfriaron, tus exploradores descubrieron una cripta sellada debajo de las ruinas, que permaneció intacta durante mucho tiempo. Una reliquia de antes de la caída, salvada del aislamiento... y ahora en tus manos." #NT!
 lv_blocker_clearance.0045.a: "Una victoria limpia y un premio inesperado debajo de las cenizas." #NT!
  
   ## Bandit Camps: Challenge Event 
 lv_blocker_clearance.0051.t: "Rompiendo la última espada" #NT!
 lv_blocker_clearance.0051.desc: "El campamento está en ruinas, pero el bandidaje es una mala hierba que vuelve a crecer rápidamente. Los supervivientes dispersos pueden reagruparse, contraatacar o desaparecer en las colinas para regresar otro día. Para poner fin de verdad a su dominio, hay que someter la tierra: recuperar las carreteras, levantar las defensas y restaurar el orden.\n\nEsto ya no es una batalla, sino una prueba de control. Ya sea que lo vea usted mismo o lo delega en su administrador, este esfuerzo final determinará si la región vuelve a caer en el caos o si finalmente conoce la paz." #NT!
 lv_blocker_clearance.0051.a: "Yo mismo aplastaré al último de los bandidos." #NT!
 lv_blocker_clearance.0051.b: "Mi mariscal los expulsará con acero y fuego." #NT!
 lv_blocker_clearance.0051.c: "Permítanme hablar con ellos: es posible que todavía haya un final pacífico." #NT!
 lv_blocker_clearance.0051.d: "Envía a mi canciller. Quizás escuchen razones." #NT!
  
   # Bandit Camps: Failure 
 lv_blocker_clearance.0052.t.martial: "La huelga se estanca" #NT!
 lv_blocker_clearance.0052.t.diplomacy: "Las conversaciones colapsan" #NT!
 lv_blocker_clearance.0052.desc.martial: "El ataque encontró una dura resistencia. El terreno favoreció a los bandidos: la maleza espesa y los senderos ocultos les dieron ventaja. Vuestras fuerzas fueron rechazadas, ensangrentadas y frustradas. Aunque se ganó algo de terreno, el campamento sigue activo y sus pancartas siguen ondeando desafiantes." #NT!
 lv_blocker_clearance.0052.desc.diplomacy: "Su enviado se puso en contacto, pero los bandidos estaban divididos, sospechaban y no estaban dispuestos a parlamentar de buena fe. Las negociaciones se prolongaron, luego se agriaron y terminaron con amenazas y espadas desenvainadas. Los forajidos siguen atrincherados y pueden desconfiar aún más de tu próximo movimiento." #NT!
 lv_blocker_clearance.0052.a.martial: "Nos reagruparemos. La próxima vez los aplastamos." #NT!
 lv_blocker_clearance.0052.a.diplomacy: "Probamos la razón. Encontraremos otra manera." #NT!
  
   # Bandit Camps: Critical Failure 
 lv_blocker_clearance.0053.t.martial: "Una emboscada en la espesura" #NT!
 lv_blocker_clearance.0053.t.diplomacy: "Un cuchillo detrás de la sonrisa" #NT!
 lv_blocker_clearance.0053.desc.martial: "Fue una trampa. Los bandidos anticiparon cada uno de tus movimientos. Los arqueros lanzaron una lluvia de muerte desde crestas ocultas y se prendió fuego a tus líneas de suministro. El ataque fracasó y sus fuerzas huyeron en el caos. Peor aún: se difunden rumores sobre tu debilidad y más forajidos se reúnen en las colinas. No sólo has fracasado, sino que los has envalentonado." #NT!
 lv_blocker_clearance.0053.desc.diplomacy: "Todo fue una artimaña. Mientras su enviado hablaba, otros rodearon el campamento y fueron atacados sin previo aviso. Uno de sus agentes fue asesinado, otro desapareció. Los bandidos se rieron mientras tus hombres se alejaban cojeando. Toda buena voluntad ha desaparecido y los forajidos ahora tratan la diplomacia como una debilidad. Todo el esfuerzo se deshace." #NT!
 lv_blocker_clearance.0053.a.martial: "Nos estaban esperando. Tendremos que empezar de nuevo, y con más fuerza que antes." #NT!
 lv_blocker_clearance.0053.a.diplomacy: "Fuimos unos tontos al confiar en ellos. De vuelta al punto de partida." #NT!
  
   # Bandit Camps: Success 
 lv_blocker_clearance.0054.t.martial: "El campamento está roto" #NT!
 lv_blocker_clearance.0054.t.diplomacy: "El campamento se disuelve" #NT!
 lv_blocker_clearance.0054.desc.martial: "El acero y la disciplina ganaron el día. Tus soldados irrumpieron en el campamento, derrotaron a los bandidos y redujeron sus chozas a cenizas. La amenaza ha sido sofocada. Aunque algunos rezagados pueden escapar a la selva, la región finalmente está en paz... por ahora." #NT!
 lv_blocker_clearance.0054.desc.diplomacy: "Después de tensos días de negociación, se llegó a un acuerdo. Algunos de los bandidos aceptaron ofertas de perdón, otros tomaron dinero para irse. Algunos desaparecieron en el bosque, pero el campamento se quedó vacío. Puede que aún haya más por ahí, pero esta amenaza, al menos, ha pasado pacíficamente." #NT!
 lv_blocker_clearance.0054.a.martial: "Que ese sea el final." #NT!
 lv_blocker_clearance.0054.a.diplomacy: "Un final tranquilo, sin sangre. Esperemos que dure." #NT!
  
   # Bandit Camps: Critical Success 
 lv_blocker_clearance.0055.t.martial: "Una victoria despiadada" #NT!
 lv_blocker_clearance.0055.t.diplomacy: "Forajidos convertidos en aliados" #NT!
 lv_blocker_clearance.0055.desc.martial: "Una campaña impecable. El ataque fue rápido, abrumador y no dejó a ningún bandido vivo para advertir a otro. Entre el botín saqueado, tus hombres descubrieron un cofre enterrado: el botín de una noble caravana perdida hace meses, ahora tuyo por derecho de conquista. El campamento ha desaparecido y la avaricia de los bandidos ha dado dividendos inesperados." #NT!
 lv_blocker_clearance.0055.desc.diplomacy: "Las negociaciones superaron todas las expectativas. No sólo los bandidos se disolvieron, sino que varios de sus líderes juraron servicio a cambio de clemencia. En agradecimiento (o ambición), revelaron un escondite escondido, robado a un recaudador de impuestos corrupto y enterrado en lo profundo de las afueras del campo. La amenaza de los bandidos ha desaparecido y tus arcas están más pesadas por ello." #NT!
 lv_blocker_clearance.0055.a.martial: "La tierra es segura y más rica que antes." #NT!
 lv_blocker_clearance.0055.a.diplomacy: "Paz y beneficio ambos. Algo realmente raro." #NT!
  

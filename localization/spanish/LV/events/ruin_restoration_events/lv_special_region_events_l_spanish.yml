l_spanish:
   ## Special Locations 
   # Valyria 
 lv_special_region_event.0001.t.valyria: "Valyria" #NT!
 lv_special_region_event.0001.desc.valyria: "Estás al borde de la leyenda. Valyria, que alguna vez fue el corazón del imperio, cuna de dragones y sede del poder arcano, ahora se encuentra ante ti. La tierra respira extraña y lentamente, sus cielos teñidos por cenizas y calor ancestrales. Ningún mapa puede guiarte hasta aquí, sólo el peso de la historia y la cautela de quienes saben hasta dónde se elevó la grandeza... y hasta dónde cayó.\n\n" #NT!
 lv_special_region_event.0001.desc.valyria.ruined: "Éste no es un lugar, es una herida. Torres de piedra retorcida arañan el cielo, medio derretidas por las llamas que ninguna forja podría crear. Los ríos hierven bajo la tierra y los susurros resuenan donde no quedan bocas. El Destino no fue una tormenta ni una guerra: fue la aniquilación manifestada. Y, sin embargo, incluso ahora, fragmentos del poder de Valyria pulsan débilmente bajo las cenizas." #NT!
 lv_special_region_event.0001.desc.valyria.restored: "Algunos se atrevieron a regresar. Entre los escombros de obsidiana y los caminos de los dragones destrozados, se levantan nuevos cimientos. Almas valientes (o locas) vuelven a recorrer los viejos caminos, domesticando zonas de terreno estable y reconstruyendo sobre suelo maldito. Los fantasmas de Freehold persisten, pero también lo prometen. Esta no es la Valyria de antaño... pero aún puede convertirse en algo nuevo." #NT!
 lv_special_region_event.0001.a.valyria: "Este lugar no debería serlo, y sin embargo... aquí está." #NT!
  
   # Lands of the Long Summer 
 lv_special_region_event.0001.t.lands_of_the_long_summer: "Tierras del largo verano" #NT!
 lv_special_region_event.0001.desc.lands_of_the_long_summer: "El horizonte cambia. Acantilados de color gris ceniza se elevan sobre costas blanqueadas por el sol, y el viento lleva el lejano aroma de sal, azufre y poder antiguo. Has cruzado a las Tierras del Largo Verano, donde una vez la sombra de Valyria se extendió por todo el mundo conocido. El cielo parece más pesado aquí, el aire más denso con historias no contadas y legados deshechos. Poner un pie en estas tierras es caminar entre la grandeza y la tumba.\n\n" #NT!
 lv_special_region_event.0001.desc.lands_of_the_long_summer.ruined: "Lo que queda no es más que el fantasma de la gloria. Carreteras obstruidas por enredaderas ennegrecidas, salas de mármol destrozadas y medio hundidas, y estatuas desgastadas por siglos de tormentas de ceniza. Nada se mueve excepto el viento a través de columnatas rotas. El Destino no se limitó a matar a un pueblo: deshizo su propia memoria. Sin embargo, incluso en la ruina, los huesos del poder permanecen." #NT!
 lv_special_region_event.0001.desc.lands_of_the_long_summer.restored: "Aunque las cicatrices de Doom persisten, la vida ha regresado. Nuevas pancartas ondean sobre torres antiguas y lenguas extranjeras resuenan en las calles reconstruidas. Los comerciantes regatean en mercados construidos sobre palacios en ruinas, y el humo no surge de los volcanes, sino de los hogares. La tierra ha cambiado, pero no muerta. Vive de nuevo, remodelado por manos audaces que no temen reclamar una herencia maldita." #NT!
 lv_special_region_event.0001.a.lands_of_the_long_summer: "Quizás la tierra recuerde más que los vivos." #NT!
  
   # Smoking Sea 
 lv_special_region_event.0001.t.smoking_sea: "El mar humeante" #NT!
 lv_special_region_event.0001.desc.smoking_sea: "Navegas hacia un silencio roto sólo por el silbido de mareas invisibles. El Mar Humeante se extiende sin fin, un espejo de sombras y humo donde las estrellas se desvanecen y las brújulas se vuelven traidoras. Alguna vez fue la cuna del poder de Valyria, ahora es un lugar rechazado tanto por marineros como por eruditos. Los gráficos lo marcan sólo con advertencias. Nadie está de acuerdo en dónde termina, sólo que cambia a quienes lo cruzan. \n\n" #NT!
 lv_special_region_event.0001.desc.smoking_sea.ruined: "Su barco se desliza hacia las aguas del Mar Humeante, aunque “agua” parece una palabra demasiado generosa. Las olas silban como si estuvieran heridas, el vapor se arremolina como espíritus que se elevan desde un campo de batalla y el aire mismo sabe a ceniza y piedra quemada. Los marineros susurran sobre sombras fantasmales que se mueven bajo la superficie: formas demasiado grandes, demasiado silenciosas, demasiado conocedoras. Cada tabla cruje de inquietud. Algunos dicen que la Perdición nunca terminó realmente aquí: sólo se hundió y aguardó." #NT!
 lv_special_region_event.0001.desc.smoking_sea.restored: "Cruzas las fronteras del Mar Humeante y no te encuentras con nieblas hirvientes o vapores asfixiantes, sino con un silencio extraño y reverente. El agua permanece quieta, ya no hierve, ya no susurra. El cielo sigue siendo de un gris sombrío, pero ya no llora hollín ni grita truenos. Ninguna forma se mueve debajo de la superficie y, sin embargo, la inquietud persiste, como un silencio prolongado durante demasiado tiempo. Eres el primero en generaciones en navegar estas aguas sin oposición. ¿Pero a qué precio se calló el mar?" #NT!
 lv_special_region_event.0001.a.smoking_sea: "Humo o quietud, este lugar recuerda lo que hemos olvidado." #NT!

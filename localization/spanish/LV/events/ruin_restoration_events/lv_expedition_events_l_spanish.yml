l_spanish:
   ## Expedition Events 
 lv_expedition_event.0010.a.tt: "Acampas y comienzas los preparativos para la expedición que te espera." #NT!
  
   # Valyria 
 lv_expedition_event.0010.t.valyria: "Al borde de la perdición" #NT!
 lv_expedition_event.0010.desc.valyria: "Tu barco navega hacia una costa quebrada, donde piedras dentadas y agujas de obsidiana arañan el horizonte como los restos de algún dios antiguo. El aire está pesado, cargado, como si recordara el fuego. Valyria asoma, fracturada y respirando. Lo que alguna vez fue el corazón de un imperio de dragones, ahora es un lugar del que se habla con miedo, mito y anhelo. Lo que sea que os espera aquí, lleva mucho tiempo esperando." #NT!
 lv_expedition_event.0010.a.valyria: "La perdición ha pasado. ¿Pero ha terminado?" #NT!
  
   # Lands of the Long Summer 
 lv_expedition_event.0010.t.lands_of_the_long_summer: "Debajo del cielo ceniciento" #NT!
 lv_expedition_event.0010.desc.lands_of_the_long_summer: "El mar retrocede detrás de ti y la tierra se eleva delante: azotada por el sol, chamuscada y quieta. Las Tierras del Largo Verano se extienden hacia afuera como las costillas de una bestia enterrada. Los caminos de los dragones atraviesan colinas ennegrecidas y los huesos del antiguo dominio yacen agrietados bajo la maleza salvaje y las cenizas móviles. Aquí es donde la sombra de Valyria cayó por primera vez sobre el mundo. Ahora, sigues sus pasos, sin saber qué puede responder." #NT!
 lv_expedition_event.0010.a.lands_of_the_long_summer: "Aquí hasta la ruina tiene memoria." #NT!
  
   ## Expedition Progress Events 
 lv_expedition_progress_event.0001.t: "Un túnel demasiado profundo" #NT!
 lv_expedition_progress_event.0001.desc: "Como parte de los esfuerzos de la expedición para cartografiar los vastos y retorcidos sistemas de cuevas debajo de la región, se envió un pequeño equipo fragmentado para explorar pasajes más profundos más allá de la ruta principal de reconocimiento. Cuando no regresaron al caer la noche, la inquietud se apoderó del campamento.\n\nDurante todo un día, no hubo señales de ellos, hasta que retrocedieron tambaleándose, cubiertos de polvo y visiblemente sacudidos.\n\nHablan de un descenso a través de escaleras rotas y estatuas gastadas, de aire que se volvió quieto y frío, y de extrañas tallas grabadas con patrones que nadie reconoció. Al borde de la luz de las antorchas, encontraron un vasto abismo: sin fondo, silencioso y antiguo.\n\nSe negaron a ir más lejos. Algo, afirman, estaba mirando." #NT!
 lv_expedition_progress_event.0001.a: "Marca el camino. Podemos regresar cuando estemos listos." #NT!
  
 lv_expedition_progress_event.0002.t: "La llamada del vacío" #NT!
 lv_expedition_progress_event.0002.desc: "Aunque está oculto a la vista, el abismo más allá del camino marcado permanece en la mente de tu expedición. Aquellos que lo vislumbraron se sienten inquietos, sus pensamientos regresan al pozo negro y las tallas que lo rodean. Otros hablan de oír cosas por la noche: suaves murmullos bajo la tierra o el sonido distante de piedras que caen donde ninguna ha caído.\n\nEs como si el abismo estuviera esperando. Mirando. Llamando.\n\nAlgunos instan a tener precaución, temiendo lo que pueda habitar en las profundidades. Otros sugieren que tales misterios no deberían dejarse enterrados. La decisión recae en usted." #NT!
 lv_expedition_progress_event.0002.a: "Déjalo intacto. Es mejor dejar algunas puertas sin abrir." #NT!
 lv_expedition_progress_event.0002.b: "Colapsar la entrada. No estábamos destinados a encontrar esto." #NT!
 lv_expedition_progress_event.0002.c: "Prepara las cuerdas y las linternas. Profundizamos más." #NT!
 lv_expedition_progress_event.0002.d: "Hay algo detrás de esas tallas. Debemos saber qué es." #NT!
  
 lv_expedition_progress_event.0003.t: "Las tallas se agitan" #NT!
 lv_expedition_progress_event.0003.desc: "El abismo permanece intacto, su camino abierto pero evitado. Sin embargo, en los días siguientes, la inquietud se apodera del campamento como la niebla de la mañana.\n\nEl equipo disidente que vislumbró por primera vez el abismo comienza a quejarse de sueños extraños: visiones de caer interminablemente a través de piedra negra o de ser observado por ojos invisibles. Algunos hablan de símbolos que brillan detrás de sus párpados cuando los cierran, pulsando con un ritmo que no les es propio.\n\nLos susurros llenan el silencio entre las tiendas por la noche. Un viento que no mueve los árboles suspira a través de las cuevas.\n\nY aunque nadie se atreve a regresar al borde, algo detrás de la roca lo recuerda." #NT!
 lv_expedition_progress_event.0003.a: "Que nadie se acerque más a él." #NT!
 lv_expedition_progress_event.0003.a.tt: "Alejas a tu equipo del camino tallado. La tensión persiste." #NT!
  
 lv_expedition_progress_event.0004.t: "Sellar el paso" #NT!
 lv_expedition_progress_event.0004.desc: "Das la orden y, al cabo del día, tu equipo se pone a trabajar. La piedra y el suelo se desprenden con cuidado, luego con urgencia, mientras el abismo queda enterrado bajo toneladas de rocas y escombros. El polvo ahoga el aire mientras se colocan las últimas piedras y, por un momento, sientes como si la oscuridad bajo tus pies hubiera sido silenciada.\n\nPero la tranquilidad no dura.\n\nLas noches se calman de una manera desconocida: demasiado tranquilas. Tu gente duerme intranquila. Las herramientas desaparecen y luego se encuentran colocadas en patrones que nadie recuerda haber ordenado. Y cuando el viento sopla a través de la caverna sellada, suena como aliento atrapado entre los dientes apretados.\n\nEl vacío ha sido enterrado... no olvidado." #NT!
 lv_expedition_progress_event.0004.a: "Que quede enterrado. Sea lo que sea, ya está hecho." #NT!
 lv_expedition_progress_event.0004.a.tt: "El pasaje está sellado, pero algo todavía se mueve debajo." #NT!
  
 lv_expedition_progress_event.0005.t: "Ecos en lo profundo" #NT!
 lv_expedition_progress_event.0005.desc: "Con cuerdas aseguradas y linternas encendidas, tu equipo desciende a la oscuridad. El aire se espesa a medida que profundizas, viciado e impasible por el tiempo. Las paredes, que antes eran lisas, se vuelven irregulares y las tallas (formas extrañas y retorcidas) se vuelven más frecuentes e intrincadas.\n\nEntonces comienza el sonido.\n\nAl principio, es solo el eco de tus propios pasos, pero cambia. Deformaciones. Las pisadas retroceden como si las imitaran. Las voces rebotan de pared en pared: suaves, distantes, casi familiares. Un portador de linterna deja caer su luz, afirmando que alguien susurró su nombre desde la oscuridad.\n\nFinalmente, llegas a una plataforma de piedra sobre un vacío enorme. El abismo es más profundo de lo que pueden alcanzar tus antorchas. Y desde dentro... algo llama. No en palabras, sino en sensaciones: un tirón en tus huesos, una presión detrás de tus ojos.\n\nAlgo antiguo hay aquí abajo. Mirando." #NT!
 lv_expedition_progress_event.0005.a: "Manténgase firme. Tome lecturas, registre todo." #NT!
 lv_expedition_progress_event.0005.a.tt: "Continúas con cuidado, documentando lo que hay debajo." #NT!
  
 lv_expedition_progress_event.0006.t: "Lo que se esconde debajo" #NT!
 lv_expedition_progress_event.0006.desc: "A pesar de la creciente inquietud, su expedición continúa. Las tallas comienzan a cambiar de tono: menos como arte, más como advertencias. Círculos de símbolos irregulares se alinean en la roca alrededor de lo que parece ser un antiguo pozo o altar, con los bordes chamuscados como por el fuego... o algo más antiguo.\n\nEntonces, sin previo aviso, un temblor sacude la piedra. Las sombras más profundas se ondulan. Uno de tus eruditos se desploma, agarrándose la cabeza y murmurando un lenguaje que nadie reconoce.\n\nEstás al borde de algo vasto, ya sea conocimiento, ruina o despertar." #NT!
 lv_expedition_progress_event.0006.a: "Ningún artefacto vale lo que hay aquí. Nos vamos." #NT!
 lv_expedition_progress_event.0006.b: "Hemos llegado hasta aquí. Lo logramos." #NT!
  
 lv_expedition_progress_event.0007.t: "Alejar el abismo" #NT!
 lv_expedition_progress_event.0007.desc: "Con la inquietud volviéndose insoportable y el aire mismo cargado de temor, usted anuncia la retirada. El equipo se mueve rápidamente, dejando atrás la extraña plataforma y la reliquia que llevaba. La oscuridad parece casi reacia a liberarte.\n\nDe vuelta en el campamento, reina el silencio. El equipo está sacudido, pero intacto. La expedición regresa con bocetos, inscripciones y cuentos que nadie creerá. No has tocado el vacío, pero él te tocó a ti.\n\nY recuerda." #NT!
 lv_expedition_progress_event.0007.a: "Es mejor dejar algunas puertas sin abrir." #NT!
 lv_expedition_progress_event.0007.a.tt: "Regresas sano y salvo... con conocimiento e inquietud." #NT!
  
 lv_expedition_progress_event.0008.t: "La cámara más profunda" #NT!
 lv_expedition_progress_event.0008.desc: "Tu descenso continúa más allá de los muros grabados y hacia un espacio intacto durante milenios. En el corazón del vacío se encuentra un estrado de piedra, tallado con espirales que parecen moverse cuando no se miran directamente. Sobre él descansa un objeto: suave, oscuro y zumbando con energía fría. ¿Una reliquia? ¿Una prisión?\n\nA medida que te acercas, la presión en tus oídos se vuelve insoportable. Varios miembros del equipo colapsan. La luz parpadea y se apaga, pero no antes de ver por última vez algo enorme que se mueve más allá del velo: serpentino, alado o tal vez completamente informe.\n\nAgarras el objeto y te retiras, las paredes tiemblan cuando la cámara reacciona. La salida se derrumba detrás de ti, sellando el vacío una vez más." #NT!
 lv_expedition_progress_event.0008.a: "Nosotros lo llevamos a cabo, sin importar el costo." #NT!
 lv_expedition_progress_event.0008.a.tt: "Recuperas un artefacto poderoso y peligroso... pero es posible que algo haya sucedido." #NT!

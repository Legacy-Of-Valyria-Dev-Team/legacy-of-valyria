l_spanish:
 trait_firewyrm: "vermis de fuego" #NT!
 trait_firewyrm_desc: "Pariente retorcido de los dragones, el vermis de fuego no es una criatura de gracia o del cielo. Se arrastra desde las profundidades de la tierra, nacido de piedra fundida y locura, moldeado por el calor y el tiempo hasta convertirse en una abominación que escupe fuego. Donde los dragones inspiran temor, los vermis de fuego sólo dejan ruinas abrasadas y muerte asqueada por el humo." #NT!
  
   # GUI 
 HOLDING_VIEW_FIREWYRM: "vermis de fuego" #NT!
  
   # Firewyrm Events 
 lv_firewyrm_event.0001.t: "Lo que arde" #NT!
 lv_firewyrm_event.0001.desc: "Las ruinas gimen bajo el peso de los siglos, pero no es el tiempo ni el temblor lo que sacude el suelo bajo tus pies. Un chillido (no, un aullido) corta el aire ahogado por las cenizas como una espada. Y luego viene. Arrastrándose desde un abismo de piedra agrietada y aliento fundido, el vermis de fuego desciende sobre las ruinas como un demonio de los viejos pergaminos valyrios.\n\nNo es ningún dragón. Sus escamas son dentadas, ampolladas y medio derretidas. El humo silba desde los respiraderos a lo largo de su columna serpentina, su aliento es una llamarada cáustica que ennegrece las mismas piedras que pisa. Sus ojos (dioses, sus ojos) están fundidos, como heridas abiertas, y se mueve con un hambre que no tiene nada de instinto y sí todo de malicia.\n\nIncluso los dragones temían a los vermis de fuego, dicen. Y lo que enfrentas ahora no es una reliquia mansa. Es un remanente retorcido de la locura de Valyria, una criatura nacida no solo del fuego, sino de la locura.\n\nSolo tienes unos momentos para elegir: luchar contra la bestia y tal vez convertirte en leyenda... o correr y esperar que las ruinas sean amables." #NT!
 lv_firewyrm_event.0001.duel.dragon: "[dragon.GetName]! ¡Aderī!" #NT!
 lv_firewyrm_event.0001.duel.dragon.tt: "Llamas rápidamente a tu dragón y te preparas para enfrentarte a la bestia." #NT!
 lv_firewyrm_event.0001.duel: "Entonces acero y fuego. Que los dioses den testimonio." #NT!
 lv_firewyrm_event.0001.duel.tt: "Te mantienes firme e intentas matar al vermis de fuego." #NT!
 lv_firewyrm_event.0001.flee: "Este no es un enemigo destinado a los vivos. Huimos." #NT!
 lv_firewyrm_event.0001.flee.tt: "Decides huir, dejando al dragón de fuego en su guarida." #NT!
  
 lv_firewyrm_spawned_tooltip: "Un vermis de fuego ha hecho su guarida en la zona." #NT!
 lv_firewyrm_cleared_tooltip: "La guarida en [lair_location.GetName] ahora está despejada." #NT!
  
 lv_firewyrm_event.0100.t: "Una sombra levantada [former_lair.GetNameNoTooltip]" #NT!
 lv_firewyrm_event.0100.desc: "La sombra que una vez se cernía sobre este lugar ha desaparecido. El vermis de fuego que mantenía esclavizadas estas tierras (bestia, terror y llama viviente) ya no está aquí para reinar con un terror ardiente. El aire mismo se siente más ligero sin el calor y el odio presionando. Ya sea que mueras en batalla, quebrantes a tu voluntad o que sean arrastrados a otra parte por cualquier hambre que impulse a esos monstruos, el resultado es el mismo: el camino a seguir está abierto, libre de su dominio." #NT!
 lv_firewyrm_event.0100.a: "[former_lair.GetNameNoTooltip] descansa tranquilo una vez más." #NT!
  
   ## Firewyrm Duel Events 
 lv_firewyrm_duel.0001.t.firewyrm_vs_firewyrm: "Brasas contra brasas" #NT!
 lv_firewyrm_duel.0001.t: "La ceniza se encuentra con la llama" #NT!
 lv_firewyrm_duel.0001.desc.firewyrm_vs_firewyrm: "#medium La tierra tiembla bajo las garras de tu montura, cada paso rompe la piedra y envía polvo en espirales hacia el cielo. Al otro lado del terreno accidentado, el otro vermis de fuego se eleva hacia ti; su mirada fundida se fija en la de tu propia bestia. Aquí no hay parentesco, solo hambre, solo rabia, mientras el aire se vuelve pesado con la promesa de fuego y ruina.\n\nSe arrastra desde la ruina como un fragmento de tierra arrancado, la piel fundida gotea calor con cada movimiento. Sin alas. Sin majestad. Sólo un horno de ira envuelto en escamas agrietadas y humo. Donde tu wyrm es carne ligada a las llamas, éste es llama libre, un infierno rival luchando contra la correa de su propio cuerpo.\n\nTu wyrm de fuego retumba profundamente, el sonido rueda como una piedra que se derrumba en la oscuridad de una caverna. El otro responde de la misma manera: no con un rugido, sino con un grito como de hierro desgarrado, loco e intacto."#!" #NT!
 lv_firewyrm_duel.0001.desc.firewyrm_duel: "#medium Tu bestia se enrosca y golpea el paisaje, su cuerpo fundido silba con salidas de humo y cenizas. No hay alas para dominar el aire, sólo garras para dominar el suelo, sólo fuego para deshacer lo que se encuentra ante él. Donde el dragón de arriba es fuego al que se le ha dado forma y vuelo, tu wyrm es fuego encadenado a la tierra, una bestia de ruina cruda que no se doblega. Tu dragón de fuego brama, un trueno que sacude la piedra agrietada. Arriba, el dragón responde, su rugido vasto como el cielo, un desafío lanzado desde el cielo mismo.#!" #NT!
 lv_firewyrm_duel.0001.desc: "#medium El suelo cruje bajo las garras de tu montura cuando tu dragón aterriza, con las alas plegadas como nubes de tormenta en el cielo destrozado. Ante ti yace el vermis de fuego, ni intimidado ni curioso, sino hambriento.\n\nSe retuerce desde el eje en ruinas como una cosa nacida del humo y el tormento, y su piel fundida humea con cada movimiento. Sin alas. Sin gracia. Sólo furia irregular y escamas ampolladas, que filtraban humo por los respiraderos y fisuras a lo largo de su columna vertebral. Donde un dragón es fuego hecho carne, esta criatura es fuego hecho mal.\n\nTu dragón gruñe bajo, un sonido que hace temblar la piedra ennegrecida. El wyrm responde, no con un rugido, sino con un chillido que hiela la sangre, desafiante y loco.#!" #NT!
 lv_firewyrm_duel.0001.desc.valyria: "#medium Aquí, en el corazón humeante de Valyria, dos monstruos se encuentran.#!\n\n" #NT!
 lv_firewyrm_duel.0001.desc.lyria: "#medium Aquí, en los desmoronados acantilados de Epaekros, donde la tierra se desliza y el cielo arde, dos monstruos bailarán.#!\n\n" #NT!
 lv_firewyrm_duel.0001.desc.lokiria: "#medium Aquí, bajo la sombra asfixiante de Gaelithox, dos monstruos se encuentran en una neblina de llamas y furia.#!\n\n" #NT!
 lv_firewyrm_duel.0001.desc.lands_of_the_long_summer: "#medium Aquí, donde el calor del verano nunca se desvanece y el aliento de la vieja Valyria aún persiste, dos monstruos se cruzan en un desafío abrasador.#!\n\n" #NT!
 lv_firewyrm_duel.0001.desc.elsewhere: "#medium Aquí, lejos de los huesos de Valyria, dos terrores antiguos se encuentran como atraídos únicamente por el destino.#!\n\n" #NT!
 lv_firewyrm_duel.0001.desc.final: "#medium Tus manos aprietan las riendas. Un respiro, una palabra y el cielo arde.#!" #NT!
 lv_firewyrm_duel.0001.a: "[dragon.GetName], dracaris!" #NT!
 lv_firewyrm_duel.0001.b: "Sōvēs, [dragon.GetName]!" #NT!
  
   # Defeat 
 lv_firewyrm_duel.0003.t: "Quemado desde los cielos" #NT!
 lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_firewyrm: "#medium Diste la orden un instante demasiado tarde.\n\nEl wyrm frente a ti se había quedado quieto: sus ojos fundidos se entrecerraron y su pecho se contrajo. La tuya se movió debajo de ti, inquieta, insegura. Y entonces el enemigo atacó.\n\nNo atacó con advertencia ni con sonido, sino con fuego hecho carne. Un chorro de aliento abrasador rasgó el aire entre ustedes, más rápido de lo que pensaba. Tu montura rugió desafiante, pero las llamas alcanzaron su cabeza y sus hombros, haciendo estallar escamas y carne por igual.\n\nSentiste el calor antes de sentir el dolor: el cuero se convirtió en líquido, la piel en cenizas. El vermis de fuego debajo de ti colapsó en su propia ruina, y tú con él, desapareciste en el instante en que las llamas tocaron el hueso.#!" #NT!
 lv_firewyrm_duel.0003.desc.sudden_strike.firewyrm_vs_dragon: "#medium Diste la orden un instante demasiado tarde.\n\nEl dragón giró en lo alto, en silencio salvo por el batir de alas. Tu vermis de fuego se alzó y abrió las mandíbulas, pero la sombra sobre tu cabeza ya estaba cayendo.\n\nEl cielo se abrió con su golpe: garras como guadañas, dientes como lanzas. El impacto hizo que tu montura cayera al suelo, un golpe demasiado repentino, demasiado preciso para resistirlo. Las escamas se hicieron añicos. Hueso arrugado. El suelo se partió bajo el peso del dragón y del wyrm por igual.\n\nIntentaste elevarte, pero no lo lograste. La furia del dragón te inmovilizó donde estabas sentado, tu vermis de fuego se rompió debajo de ti. Lo último que viste fueron sus alas bloqueando la luz del fuego, antes de que la oscuridad te reclamara por completo.#!" #NT!
 lv_firewyrm_duel.0003.desc.sudden_strike: "#medium No hubo ninguna advertencia, solo movimiento.\n\nUn momento, tu dragón dio vueltas en el aire espeso de ceniza, leyendo los extraños y hirvientes movimientos de la criatura. Al siguiente, el vermis de fuego se elevó a una velocidad imposible, una mancha de escamas carmesí y humo carbonizado. Un rugido partió el cielo (no, no un rugido, sino un aullido, un chillido, algo sin origen) y luego el mundo se inclinó.\n\nEl golpe golpeó bajo el ala de tu dragón, un golpe salvaje que destrozó el ritmo y el equilibrio. El cielo se alzó de lado. Recuerdas el repentino silencio de la caída, la ardiente ráfaga de aire, el destello de dolor candente.\n\nTú y tu dragón ni siquiera tocaron el suelo.#!" #NT!
  
 lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_firewyrm: "#medium Diste la orden un instante demasiado tarde.\n\nEl vermis de fuego frente a ti se lanzó, el pecho se hinchó como un horno en el punto de ruptura. Por un instante, el aire se espesó: el calor se elevaba y las cenizas flotaban quietas. Luego se soltó.\n\nEl aliento que soltó no fue un incendio común, sino una catarata de ruinas candentes, lo suficientemente fundidas como para quemar el aire. Tu vermis de fuego rugió con las mandíbulas abiertas, pero la explosión aplastó su desafío, devorando el sonido antes de que naciera.\n\nTú y tu montura erais uno en ese momento, atrapados en una sola oleada de fuego que destruyó todo lo que tocaba. No hubo caídas ni lucha. Sólo la llama se cierra sobre ti, absoluta y definitiva.#!" #NT!
 lv_firewyrm_duel.0003.desc.dragonfire.firewyrm_vs_dragon: "#medium Diste la orden un instante demasiado tarde.\n\nEl dragón de arriba no rugió, no giró. Sólo abrió sus fauces y el mundo se convirtió en luz.\n\nSu primer aliento te cegó: un brillo abrasador que se tragó la tierra y el cielo por igual. Tu vermis de fuego se alzó desafiante, con escamas fundidas ardiendo con más intensidad, pero nada resiste el fuego del dragón. El torrente se derramó como un juicio, quemando piedra y carne, acero y hueso.\n\nTu montura se agitó una vez debajo de ti antes de colapsar en brasas. Las riendas se quemaron en tus manos. El grito en tu garganta nunca salió de tus labios. No había escapatoria ni piedad. Sólo fuego, y el silencio después.#!" #NT!
 lv_firewyrm_duel.0003.desc.dragonfire: "#medium Diste la orden un instante demasiado tarde.\n\nEl vermis de fuego había estado quieto, demasiado quieto. Sus ojos fundidos te seguían como esperando, calculando. Y entonces abrió sus fauces, anchas y dentadas como una caverna rota, y el mundo se convirtió en llamas.\n\nUn torrente de fuego surgió hacia arriba en un géiser de ira candente. Tu dragón intentó ladearse, intentó elevarse, pero el infierno la atrapó en pleno vuelo, tragándose el ala, las escamas y el jinete en una llama chirriante. El cielo hervía a tu alrededor. Las correas de la silla se redujeron a cenizas. El mismo aire se volvió contra ti, un viento de brasas y cenizas.\n\nNo caíste. Desapareciste, consumido antes de que pudieras gritar. #!" #NT!
  
 lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_firewyrm: "#medium Viste el momento en que se abalanzó.\n\nEl wyrm rival no ardió ni rugió: se lanzó hacia adelante, una montaña de músculos y piel fundida. Tu propia montura bramó, preparándose, pero el impacto los lanzó a ambos contra la piedra.\n\nEl suelo se rompió bajo el peso. La roca irregular se desgarró contra las escamas. Tu vermis de fuego se agitó, con la armadura fundida ardiendo, pero el otro presionó con más fuerza, con más peso, una avalancha de carne y furia. Sus mandíbulas se cerraron alrededor del cuello de tu bestia, obligándola a bajar, rechinando hasta que el aire abandonó su pecho.\n\nGritaste órdenes, pero tu wyrm no pudo levantarse. Los latidos de su corazón tartamudeaban debajo de ti, más lentos, más débiles, hasta que se detuvieron. La presión también aplastó el aliento de tus pulmones. La oscuridad llegó cuando la tierra se cerró.#!" #NT!
 lv_firewyrm_duel.0003.desc.driven_to_ground.firewyrm_vs_dragon: "#medium Viste la sombra que cubría el cielo.\n\nEl dragón cayó en picado como una lanza de llamas vivas, con las alas plegadas y los ojos fijos. Tu vermis de fuego se alzó para enfrentarlo, pero el ataque fue más rápido, más pesado e imparable. Los dos chocaron con un trueno y perdiste el equilibrio cuando tu montura fue arrojada al suelo.\n\nLa tierra se partió bajo el impacto del dragón. Las garras clavaron la carne fundida, las garras se hundieron a través de la armadura hasta el hueso. Tu wyrm se retorció, las escamas fundidas brillaron cada vez más, pero cada oleada solo encontró mayor peso, mayor poder.\n\nEl rugido del dragón ahogó el mundo mientras presionaba, los huesos crujían bajo su agarre. Los esfuerzos de tu montura flaquearon... y terminaron. Sentiste el último temblor debajo de ti antes de que la luz abandonara sus ojos. Entonces la mirada del dragón se volvió hacia ti y no había ningún lugar adonde ir.#!" #NT!
 lv_firewyrm_duel.0003.desc.driven_to_ground: "#medium Viste el momento en que giró.\n\nEl vermis de fuego se enroscó, no para retroceder, sino para elevarse, increíblemente rápido para algo de su tamaño. Luego vino el salto, todo furia y masa, y antes de que tu dragón pudiera despejar el aire, ya estaba sobre ti.\n\nEl mundo se estrelló hacia un lado. Garras, cenizas y dolor. Todo el peso de la bestia se derrumbó como una montaña que cae, y tu dragón gritó: un grito terrible y gorgoteante que sacudió tus huesos incluso cuando se rompieron con [fd_loser_dragon.Custom('GetDragonHerHim')]. Alas torcidas. Se rompieron las costillas. El suelo se abrió en cráteres.\n\nAtrapado bajo la masa del vermis de fuego, tu dragón se retorció una vez... y no más. Lo sentiste todo: el último latido del corazón, el último movimiento de resistencia, antes de que la piedra llegara a tu cráneo.#!" #NT!
  
 lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_firewyrm: "#medium Tú diste la orden. Tu wyrm se abalanzó, con la armadura fundida ardiendo, cada músculo esforzándose por matar.\n\nPero el otro fue más rápido.\n\nSe retorció bajo el peso de tu bestia, se enroscó con una precisión antinatural, y sus garras golpearon hacia arriba: largas, ennegrecidas y abrasadoras. Uno atravesó el pecho de tu wyrm. El segundo desgarró más profundamente, cortando la carne y los tendones rojos como el horno.\n\nEl sonido fue húmedo, desgarrador, insoportable. Tu dragón de fuego aulló, la sangre fundida se derramó en un torrente que humeó contra la piedra. El brillo de su cuerpo chisporroteaba como una fragua agonizante.\n\nTe aferraste durante un latido del corazón, negándote a creerlo, pero tu montura se hundió debajo de ti, las entrañas se derramaron por la tierra en hebras brillantes. Su último rugido sacudió tus huesos antes de colapsar, dejándote destrozado encima de un cadáver que una vez fue el fuego encarnado.#!" #NT!
 lv_firewyrm_duel.0003.desc.disemboweled.firewyrm_vs_dragon: "#medium Tú diste la orden. Tu wyrm obedeció, alzándose con furia fundida, pero el dragón lo enfrentó de frente.\n\nEl cielo se partió con la colisión, y entonces aparecieron las garras: garras afiladas, impulsadas con precisión infalible. Cortaron la piel fundida, separando escamas y cicatrices como si no fueran nada.\n\nUn solo grito salió de tu montura cuando el dragón se desplomó. La carne cedió. Las entrañas estallaron en una inundación humeante y humeante que se derramó por el campo de batalla. El hedor a hierro y fuego invadió el aire.\n\nTu wyrm se tambaleó, con el pecho hundido, su gran cuerpo se agitó una vez ante la luz de sus ojos fundidos reducidos a cenizas. Fuiste arrojado hacia sus ruinas, hacia los humeantes restos de lo que había sido tu único escudo.#!" #NT!
 lv_firewyrm_duel.0003.desc.disemboweled: "#medium Tú diste la orden. Te inclinaste hacia adelante en la silla y tu dragón obedeció: valiente, veloz y leal.\n\nPero no fue suficiente.\n\nEl vermis de fuego surgió con una velocidad antinatural, agachándose bajo tu ataque y enfrentándote no con llamas sino con garras: largas, ennegrecidas y abrasadoras. Uno atravesó las escamas de tu dragón como si fueran pergamino. El segundo encontró apoyo aún más profundo.\n\nSiguió un sonido horrible: un chillido húmedo y desgarrador que no era ni el grito de tu dragón ni el tuyo propio. Las entrañas se derramaron hacia el cielo cubierto de cenizas como el vapor de una fragua rota. El aroma de la sangre, fundida y espesa, superó incluso el azufre y el humo.\n\nTe aferraste durante un segundo más, observando cómo los ojos de tu dragón se apagaban mientras se doblaba en el aire: una criatura majestuosa, deshecha no por el fuego, sino por el salvaje salvajismo de una bestia que no debería existir.#!" #NT!
  
 lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_firewyrm: "#medium El cielo ardía con luz fundida.\n\nTu orden fue aguda, tu wyrm se abalanzó hacia adelante con furia de horno, pero el otro se movió como un depredador nacido solo para matar. Sus garras golpearon de forma borrosa, acero ennegrecido contra magma vivo.\n\nUna vez. Dos veces. De nuevo. Un frenesí de golpes que destrozaron la carne y los tendones brillantes por igual. Tu vermis de fuego se convulsionó, la sangre fundida roció el suelo en ríos que silbaban y humeaban.\n\nGritaste la orden, le suplicaste que luchara, pero el corte mortal ya había llegado: las tripas abiertas, las entrañas brillantes derramándose como escoria de un crisol roto. El grito de la bestia vaciló y se atenuó hasta convertirse en un estruendo hueco mientras colapsaba debajo de ti.\n\nEl wyrm rival no se detuvo. Se desgarró y desgarró con implacable malicia, hasta que todo lo que sentiste fue la ruina temblorosa de tu montura desmoronándose bajo tu silla. El último sonido fue su grito triunfante, que resonó en un campo de batalla lleno de cenizas y sangre.#!" #NT!
 lv_firewyrm_duel.0003.desc.eviscerated.firewyrm_vs_dragon: "#medium El cielo estaba rojo por el fuego y la ruina.\n\nTu orden sonó, tu wyrm avanzó hacia adelante (escamas fundidas ardiendo), pero el dragón atacó con furia quirúrgica. Sus garras atravesaron el pecho blindado de tu bestia, desgarrando carne y escamas con horrible precisión.\n\nUna garra. Dos. Un rastrillo salvaje en el vientre. El rugido de tu wyrm se convirtió en un gorgoteo ahogado, sangre fundida y entrañas estallando en un torrente que iluminó el suelo con un fuego humeante.\n\nGritaste, tiraste, luchaste por sujetar la silla, pero tu montura ya estaba rota. Las alas se rompieron, las costillas se hicieron añicos y su cuerpo se convulsionó en espasmos de agonía fundida.\n\nEl dragón no cedió. Destrozó lo que quedó (desgarrando el pecho de la garganta, los tendones del hueso) hasta que tu vermis de fuego quedó en ruinas, con órganos brillantes esparcidos por el campo de batalla. No tuviste tiempo para caer. Simplemente fuiste enterrado en sus ruinas.#!" #NT!
 lv_firewyrm_duel.0003.desc.eviscerated: "#medium El cielo está rojo con fuego y sangre.\n\nTu orden fue audaz, pero la bestia fue más audaz. El vermis de fuego se abalanzó con un chillido como acero desgarrado, atacando no con furia sino con propósito. Sus garras se hundieron profundamente, una, dos veces, una ráfaga de golpes salvajes que partieron escamas, piel y carne por igual.\n\nTu dragón se agitó en agonía, con las alas vacilantes y sin aliento en medio del rugido. Aguantaste, gritaste, instaste, pero ya era demasiado tarde. Un último y brutal corte le abrió el vientre y su grito fue interrumpido cuando la sangre y el fuego brotaron en el aire.\n\nEl wyrm no se detuvo.\n\nArañó, desgarró y desgarró de nuevo, un frenesí de odio hecho carne. Solo viste destellos: el chasquido de un ala, el desgarro de una garganta, tu silla doblándose debajo de ti mientras el cuerpo roto de tu dragón caía en espiral hacia la ruina.\n\nLo último que ves es el vermis de fuego, resbaladizo con sangre, gritando triunfalmente a un cielo que nunca olvidará esta carnicería.#!" #NT!
  
 lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_firewyrm: "#medium Algunos monstruos nunca deberían nacer.\n\nEl wyrm que tienes ante ti eclipsa incluso a tu propia montura: un horno colosal de carne y furia, escamas agrietadas como piedra volcánica y ojos ardiendo con una luz impía. Tu dragón de fuego, orgulloso y fundido, tiembla en su presencia. El instinto habla más que la orden: no se trata de una presa, ni de un rival, sino de la extinción dada forma.\n\nLuego se mueve.\n\nEl mundo se estremece cuando el wyrm gigante golpea, con sus garras sujetando a tu bestia como si no fuera más que carroña. Gritas, tu montura se agita, pero la lucha dura sólo unos latidos del corazón.\n\nLas mandíbulas descienden: vastas, humeantes, terribles. Con un solo crujido, la mitad de tu vermis de fuego desaparece, cortada en ruinas que hacen astillas de huesos. Su grito es silenciado por un chorro de sangre fundida y, antes de que puedas respirar, el resto de tu montura es arrastrado gritando hacia el abismo de su garganta.\n\nAún estás atado.\n\nEl calor te traga por completo. Oscuridad, fuego, sangre... y luego el olvido.#!" #NT!
 lv_firewyrm_duel.0003.desc.chomp.firewyrm_vs_dragon: "#medium Algunas batallas nunca están destinadas a ganarse.\n\nEl dragón se alza arriba, de tamaño titánico: una leyenda de colmillos y alas, con una sombra que borra el cielo. Comparado con él, tu vermis de fuego es una antorcha parpadeante ante un sol furioso. Incluso tu bestia lo sabe, temblando bajo tu agarre mientras el aire mismo tiembla con el aliento del leviatán.\n\nEntonces ataca.\n\nEl dragón desciende como una montaña cayendo, sus garras desgarran la carne de tu wyrm con cruel facilidad. Gritas la orden, pero no es nada: tu montura está inmovilizada, aplastada, indefensa bajo un depredador más viejo y mayor que cualquier pesadilla.\n\nLas fauces se abren, anchas como una caverna, bordeadas de dientes destinados a dioses, no a bestias. Y con un solo mordisco, tu vermis de fuego queda entera, arrancada debajo de ti en una lluvia de sangre fundida.\n\nAún estás atado.\n\nLas mandíbulas se cierran. Oscuridad. Sangre. Calor. Lo último que sientes es el crujido: tu fin y el fin de tu wyrm, consumidos en silencio.#!" #NT!
 lv_firewyrm_duel.0003.desc.chomp: "#medium Algunos monstruos no están hechos para enfrentarse.\n\nEl vermis de fuego se eleva: una cosa montañosa de piel quemada y aliento fundido, mucho más grande que cualquier bestia con la que hayas luchado o soñado. Tu dragón gira con cautela, las llamas lamen [fd_loser_dragon.Custom('GetDragonHerHis')] mandíbulas, pero ahora hay dudas. Una pausa. Un temor instintivo que habla de una verdad más profunda: esta cosa no es pariente. Es una ruina hecha carne.\n\nLuego se lanza.\n\nNo hay ningún chirrido ni rugido, sólo impacto. En un instante, tu dragón es arrancado del cielo, inmovilizado y aplastado bajo el peso del wyrm. Gritas y sacas tu espada, pero es inútil. Eres un inútil.\n\nLas fauces se abren, enormes y humeantes, y con un repugnante crujido de hueso y escamas, tu dragón desaparece en su garganta.\n\nAún estás atado.\n\nEl calor es insoportable. Todo es sangre, fuego, oscuridad.\n\nY luego nada.#!" #NT!
  
 lv_firewyrm_duel.0003.a.sudden_strike: "Nosotros... nunca tuvimos una oportunidad." #NT!
 lv_firewyrm_duel.0003.a.tt.sudden_strike: "Tu bestia es derribada de un solo golpe inesperado." #NT!
  
 lv_firewyrm_duel.0003.a.dragonfire: "La luz llegó demasiado rápido... demasiado brillante." #NT!
 lv_firewyrm_duel.0003.a.tt.dragonfire: "Tú y tu bestia estáis envueltos en las llamas y no podéis escapar del infierno." #NT!
  
 lv_firewyrm_duel.0003.a.driven_to_ground: "Volar-! No... no, no, no—" #NT!
 lv_firewyrm_duel.0003.a.tt.driven_to_ground: "Tú y tu bestia caéis al suelo, aplastados por el brutal impacto." #NT!
  
 lv_firewyrm_duel.0003.a.disemboweled: "¡No, [fd_loser_dragon.GetName]! Espera—¡ESPERA! Por favor-!" #NT!
 lv_firewyrm_duel.0003.a.tt.disemboweled: "Tu bestia es destripada por las garras del enemigo y observas impotente cómo ambos caen." #NT!
  
 lv_firewyrm_duel.0003.a.eviscerated: "Entonces, destrozadnos, si es necesario." #NT!
 lv_firewyrm_duel.0003.a.tt.eviscerated: "Tu bestia está destripada y pronto tú la sigues." #NT!
  
 lv_firewyrm_duel.0003.a.chomp: "¡Argh! No, no—" #NT!
 lv_firewyrm_duel.0003.a.tt.chomp: "Tú y tu bestia sois devorados de un solo y brutal mordisco." #NT!
  
   # Victory 
 lv_firewyrm_duel.0004.t: "Tras el infierno" #NT!
  
 lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_firewyrm: "#medium El aire está lleno de ceniza, pero solo durante un latido del corazón.\n\nTu dragón de fuego se enrosca y luego se lanza a una velocidad imposible. El wyrm rival no tiene tiempo de retroceder o escupir su aliento de horno antes de que tu bestia esté sobre él.\n\nEl ataque es despiadado. Las garras se hunden en el cráneo y la columna, y las mandíbulas se cierran con fuerza volcánica. El rival se desploma en medio de un rugido y el fuego se apaga en su garganta.\n\nCae en silencio, una montaña de carne rota en un instante.\n\nLa victoria no vino de la resistencia, sino de la precisión.#!" #NT!
 lv_firewyrm_duel.0004.desc.sudden_strike.firewyrm_vs_dragon: "#medium La tormenta de alas del dragón se detiene, pero solo por un latido del corazón.\n\nTu vermis de fuego se dispara, más rápido de lo que el ojo de cualquier dragón puede seguir, y salta lo suficientemente alto en el aire para interceptar a la criatura en el aire. En un instante, la bestia se alza, con las mandíbulas brillando con llamas; al siguiente, es derribado.\n\nLas garras le atraviesan la garganta y los dientes aplastan el hueso antes de que un solo aliento pueda salir de su pecho. El dragón convulsiona una, dos veces y luego colapsa; su fuego se apaga antes de que pueda arder.\n\nMuere en silencio, despojado de su gloria, su majestuosidad terminó en un único y perfecto golpe.\n\nLa victoria fue más rápida de lo que se pensaba, más aguda que las llamas.#!" #NT!
 lv_firewyrm_duel.0004.desc.sudden_strike: "#medium El viento se calma, pero solo por un latido.\n\nTu dragón se mueve primero. Un giro brusco de las alas, una espiral descendente y luego un estallido de velocidad imposible. Antes de que el dragón de fuego pueda chillar, enrollarse o eructar su fuego infernal, tu dragón ya está sobre él.\n\nLas garras golpean con fuerza (un golpe salvaje en el cráneo, la garganta o la base de la columna) y el dragón se desmorona como escoria vertida sobre piedra fría.\n\nMuere sin gloria, sin rugido, sin llamarada de furia. Sólo un colapso. Un suspiro robado. Y luego la quietud.\n\nLa victoria no llegó con lucha, sino con precisión.#!" #NT!
  
 lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_firewyrm: "#medium El cielo tiembla mientras tu dragón de fuego exhala ruina.\n\nUn torrente de aliento fundido estalla, candente y abrasador, inundando el aire con un brillo cegador. Se estrella contra el wyrm rival con el peso de una estrella fugaz, ahogando escamas y carne por igual en un infierno que se adhiere como alquitrán.\n\nLa bestia chilla (un sonido irregular, mitad furia, mitad terror) mientras su cuerpo se ennegrece y se parte, con grietas brillantes recorriendo su estructura. Aún así se agita, lanzándose hacia adelante, pero el fuego consume más rápido de lo que puede moverse.\n\nEl suelo arde bajo su caída, la piedra corre como cera.\n\nCuando las llamas se apagan, no queda nada más que una cáscara carbonizada, humeando en el aire ceniciento. El fuego de un monstruo ha acabado con otro.#!" #NT!
 lv_firewyrm_duel.0004.desc.dragonfire.firewyrm_vs_dragon: "#medium Los cielos se encienden cuando tu dragón de fuego respira profundamente y desata el infierno.\n\nLa explosión ruge en un torrente de llamas fundidas, de color rojo dorado y cegadora, que envuelve al dragón antes de que pueda alejarse. Sus orgullosas alas flamean, pero el fuego se adhiere a cada vena de las plumas, a cada escama, a cada aliento.\n\nGrita, un grito terrible y atronador, pero el fuego no cede. El fuego devora la piel, los músculos y los huesos, dejando nada más que una silueta contra un cielo abrasador.\n\nPor fin, el grito se rompe, las alas se doblan cuando el dragón se estrella contra la tierra, dejando un rastro de fuego como un sol poniente.\n\nLo que se eleva después es solo humo y silencio. El dragón yace quieto, ceniza y brasa donde una vez se elevó la majestad.#!" #NT!
 lv_firewyrm_duel.0004.desc.dragonfire: "#medium El aire arde mientras [fd_attacker_dragon.GetName] exhala furia.\n\nEl fuego brota de sus mandíbulas en un torrente de calor y luz, de color rojo dorado y cegador contra el cielo ceniciento. Choca contra el vermis de fuego como una marea de juicio, tragándose su retorcida estructura en un infierno más antiguo que los reyes. La criatura aúlla (un chillido que suena menos a dolor y más a rabia negada) mientras su piel comienza a ampollarse, ennegrecerse y pelarse.\n\nLa bestia se agita salvajemente, las llamas se aferran a su forma como una maldición. Durante un latido, se lanza hacia adelante, ardiente, medio ciego, desafiante hasta el final, pero la llama no flaquea. El calor derrite la piedra que hay debajo.\n\nY luego, el silencio.\n\nSolo quedan el humo y el hedor de la carne quemada. El vermis de fuego se queda quieto: una cáscara humeante entre los huesos del antiguo imperio.#!" #NT!
  
 lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_firewyrm: "#medium El mundo se inclina cuando tu wyrm de fuego salta con una fuerza aterradora.\n\nCon un rugido que divide el aire, se estrella contra el wyrm rival, todo músculo y furia fundida cayendo como un martillo. La tierra se agita bajo el impacto, cenizas y rocas estallan en una tormenta asfixiante.\n\nEl enemigo grita (no de triunfo, sino de shock) mientras es aplastado contra el suelo, sus extremidades se rompen y sus espirales se agitan inútilmente contra el peso. La tierra misma se parte bajo sus convulsiones, cortada y marcada por su agonía.\n\nNo hay nada elegante aquí. Sólo salvajismo. Tu wyrm de fuego presiona con más fuerza, el humo sale de sus mandíbulas, luego golpea, con los dientes desgarrados profundamente, hasta que los gritos del wyrm rival se convierten en silencio y polvo.#!" #NT!
 lv_firewyrm_duel.0004.desc.driven_to_ground.firewyrm_vs_dragon: "#medium Tu bestia devuelve la lucha al suelo.\n\nTu vermis de fuego se lanza hacia adelante en una tormenta de furia, agarrando la cola del dragón a medio giro y arrastrándolo fuera del aire como una presa arrancada del vuelo. El suelo se eleva rápidamente y luego el mundo explota en polvo y fuego cuando ambas bestias chocan contra la tierra.\n\nEl dragón grita y sus alas se rompen bajo el peso que lo inmoviliza. Sus garras raspan y arañan, tallando surcos en la piedra, pero nada encuentra asidero. El vermis de fuego se enrosca con más fuerza, presionando con fuerza cruda y brutal, hasta que el hueso se rompe y la tierra se pone roja.\n\nNo hay ninguna ceremonia en la matanza. Sin gloria. Sólo dominio. Una última zambullida de colmillos silencia al dragón para siempre, dejando solo su forma rota en las cenizas.#!" #NT!
 lv_firewyrm_duel.0004.desc.driven_to_ground: "#medium El cielo se encoge a medida que descendemos.\n\nCon un rugido que hace temblar los huesos del mundo, [fd_attacker_dragon.GetName] se estrella contra el vermis de fuego desde arriba: una fuerza de alas, garras y furia que se encuentran con carne ardiente y odio. El suelo tiembla cuando chocamos contra la tierra quemada, y la ceniza volcánica estalla como una ola negra.\n\nEl vermis de fuego grita, no de dolor, sino de incredulidad, mientras es impulsado bajo nuestro peso, inmovilizado contra la piedra agrietada como una bestia perseguida. Una de sus patas se retuerce con un ruido repugnante y su cuerpo serpentino se agita, abriendo profundos surcos en el suelo manchado de líquido fundido.\n\nNo hay elegancia en matar. Sólo dominio bruto. [fd_attacker_dragon.GetName] gruñe, el humo sale de sus fosas nasales y se inclina. Los dientes se topan con el hueso. El último grito del vermis de fuego se desvanece en el viento ahogado por las cenizas.#!" #NT!
  
 lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_firewyrm: "#medium Dos titanes se retuercen y chocan, sus espirales chocan como torres que caen. Con un rugido que hace temblar los huesos, tu vermis de fuego azota hacia los lados y hunde sus garras en el vientre de su rival. Una, dos veces... y luego más profundamente, desgarrando escamas y piel.\n\nLa sangre brota, fundida y de color negro rojizo, salpicando la piedra destrozada. El wyrm herido convulsiona, su cuerpo serpentino se retuerce violentamente, abriendo trincheras en la ceniza. Pero no puede liberarse.\n\nTu sierpe de fuego empuja con más fuerza, con sus garras enganchadas, y desgarra a la bestia. Del torrente de entrañas que se derraman en la tierra surge vapor. El rival emite un silbido ahogado y luego se queda quieto: su ruina queda al descubierto en el suelo chamuscado.#!" #NT!
 lv_firewyrm_duel.0004.desc.disemboweled.firewyrm_vs_dragon: "#medium El acero se encuentra con la carne de fuego cuando el dragón se lanza, batiendo furiosamente las alas para elevarse. Pero el vermis de fuego es más rápido en el suelo: se enrosca de repente, golpea y sus garras se clavan en su vientre.\n\nLa sangre brota en gotas de calor fundido y las alas del dragón vacilan mientras se tambalea bajo el golpe. Chilla y corta salvajemente, pero el wyrm no cede. Otro rastrillo de garras, salvaje y preciso, y su vientre se abre en dos.\n\nLas entrañas caen en cascada sobre la piedra, humeantes y repugnantes. El dragón se desploma en un montón roto, su fuego se apaga con un último rugido sibilante. El vermis de fuego se enrolla sobre él, victorioso, mientras el campo de batalla se tiñe de rojo.#!" #NT!
 lv_firewyrm_duel.0004.desc.disemboweled: "#medium El acero, las escamas y la furia chocan. Con un grito furioso, tu dragón rasga con sus garras el costado del vermis de fuego (una, dos veces) y luego se dirige hacia él para matarlo. Sangre como metal fundido brota de las heridas de la bestia, silbando al golpear la piedra chamuscada.\n\nEl vermis de fuego se agita, su estructura tendinosa se retuerce como una serpiente en llamas. Pero tu dragón no cede. Un golpe final y brutal desgarra el vientre del wyrm. Sus entrañas se derraman sobre la tierra rota: el vapor se eleva de las ruinas de lo que una vez fue un depredador de pesadillas.\n\nEl vermis de fuego no emite ningún sonido mientras muere, solo una gran exhalación estremecedora que huele a azufre y podredumbre vieja.#!" #NT!
  
 lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_firewyrm: "#medium Sus cuerpos chocan con un sonido como de piedra al romperse. Las garras brillan, los dientes chasquean... y entonces tu vermis de fuego encuentra su objetivo. Desciende, partiéndose entre escamas fundidas, desgarrando músculos y tendones hasta que el vientre del rival se abre de par en par.\n\nLa bestia herida convulsiona, escupiendo fuego y bilis de las ruinas de sus entrañas. Se retuerce, sisea de furia y dolor, pero no puede liberarse. Tu vermis de fuego excava más profundamente y arrastra sus garras a través del horno de su enemigo.\n\nUn último desgarro: la carne y los órganos se derraman humeantes por el suelo. El rival se estremece una vez, luego colapsa en el silencio, su sangre quema la tierra donde cae.#!" #NT!
 lv_firewyrm_duel.0004.desc.eviscerated.firewyrm_vs_dragon: "#medium El dragón se zambulle, sus alas golpean el cielo cubierto de cenizas, pero el vermis de fuego se retuerce debajo de él, una mancha de músculo escamoso. Con un golpe repentino, se engancha y las garras se hunden profundamente en el suave vientre.\n\nUn tirón salvaje y la piel del dragón se parte como una tela. Un rugido de agonía brota de su garganta mientras fuego y sangre brotan, lloviendo en arcos fundidos. Se agita, tratando de girar hacia el cielo, pero el wyrm se mantiene firme y desgarra más profundamente.\n\nCon un desgarro brutal, las entrañas del dragón se liberan, humeando en las cenizas. Sus alas fallan y su cuerpo se estrella contra la tierra quemada. El vermis de fuego se cierne sobre las ruinas temblorosas, victorioso, mientras el silencio ahoga el campo de batalla.#!" #NT!
 lv_firewyrm_duel.0004.desc.eviscerated: "#medium Escamas de color rojo acero se rasgan como tela de vela podrida.\n\nLas garras de tu dragón rasgan profundamente, pasando por la piel fundida y el músculo humeante, hasta que el vientre del vermis de fuego queda abierto. La bestia grita, no en desafío, sino en agonía, mientras llamas y bilis se derraman del corte, y su corazón de horno queda expuesto al aire frío y cargado de cenizas.\n\nSe retuerce, agitándose contra la muerte, pero tu dragón se mantiene firme. Otro desgarro salvaje, otra columna de sangre, hasta que los esfuerzos de la criatura se convierten en temblores... y luego, nada en absoluto.\n\nSus entrañas humean sobre la tierra rota. Un terror de las profundidades, deshecho por los colmillos y la furia.#!" #NT!
  
 lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_firewyrm: "#medium No hay duelo, no hay competencia. Sólo hambre.\n\nEl wyrm rival se enrolla para atacar, demasiado lento. Tu vermis de fuego se lanza, abre las mandíbulas y las cierra de golpe alrededor de la sección media de su enemigo. Crujidos de huesos. Las escamas se agrietan. El chillido de la serpiente se interrumpe, amortiguado por la prisión de los dientes.\n\nSe agita, medio tragada, con la cola agitándose con furia. Pero tu vermis de fuego sólo muerde más profundamente y sus fauces funcionan con obscena finalidad. En unos momentos, el rival desaparece, arrastrado hacia abajo en tragos húmedos, y sus luchas se desvanecen en el silencio.\n\nLo que queda es la quietud y el fuerte hedor a sangre en el aire. Un terror ha consumido a otro.#!" #NT!
 lv_firewyrm_duel.0004.desc.chomp.firewyrm_vs_dragon: "#medium El dragón gira sobre sus cabezas, sus alas cortan el cielo espeso de cenizas, pero desciende demasiado bajo. El vermis de fuego surge hacia arriba, con las fauces abiertas, y lo agarra con un estruendoso chasquido. Las garras golpean salvajemente, las escamas rechinan contra los dientes, pero la mordida del dragón se mantiene firme.\n\nLos huesos gimen. Las alas se rompen. Un rugido estrangulado resuena cuando el dragón es sacudido como si fuera una presa, estrellado contra la tierra y luego levantado nuevamente en medio de una lluvia de cenizas y sangre. Las mandíbulas del dragón de fuego trabajan hambrientamente, aplastando y tragando, sin prestar atención a los gritos que se desvanecen de la bestia.\n\nPor fin el dragón se rompe: una ruina arrastrada hacia la garganta del dragón. Sigue el silencio, roto sólo por el silbido de las escamas contra la piedra. El cielo está vacío. El dragón de fuego perdura.#!" #NT!
 lv_firewyrm_duel.0004.desc.chomp: "#medium No hay elegancia en esto, solo dominio hecho carne.\n\nEl vermis de fuego retrocede para atacar, pero tu dragón se lanza con una finalidad aterradora. Mandíbulas como puertas de castillo se cierran alrededor de la bestia, aplastando escamas volcánicas y tendones con un crujido húmedo y chirriante. Un grito ahogado se pierde en la garganta de tu dragón mientras arroja el vermis de fuego como si fuera carroña, con las fauces trabajando hambrientas y la garganta hinchada.\n\nEn segundos, el horror de las ruinas se reduce a una forma tragada, que se contrae una vez mientras se desliza hacia la nada.\n\nEl aire se detiene. La tierra, una vez aterrorizada, se queda en silencio bajo la sombra de un verdadero depredador.#!" #NT!
  
 lv_firewyrm_duel.0004.a.sudden_strike: "Rápido. Limpio. Hecho." #NT!
 lv_firewyrm_duel.0004.a.tt.sudden_strike: "Tu montura ataca con una fuerza repentina y brutal, acabando con la vida de la bestia de un solo golpe." #NT!
  
 lv_firewyrm_duel.0004.a.dragonfire: "¡Arde, desgraciado!" #NT!
 lv_firewyrm_duel.0004.a.tt.dragonfire: "Tu montura desata un torrente de fuego que envuelve a la bestia en llamas." #NT!
  
 lv_firewyrm_duel.0004.a.driven_to_ground: "¡Eso es todo, [fd_victor_dragon.GetName]! ¡Termínalo!" #NT!
 lv_firewyrm_duel.0004.a.tt.driven_to_ground: "La bestia es devorada entre las mordeduras desenfrenadas de [fd_victor_dragon.GetNameNoTooltip]" #NT!
  
 lv_firewyrm_duel.0004.a.disemboweled: "¡Rotura! ¡Lágrima! ¡Déjalo sangrar!" #NT!
 lv_firewyrm_duel.0004.a.tt.disemboweled: "La bestia es destrozada por [fd_victor_dragon.GetNameNoTooltip] y sus entrañas se derraman por el suelo." #NT!
  
 lv_firewyrm_duel.0004.a.eviscerated: "¡Déjalo arder desde adentro hacia afuera!" #NT!
 lv_firewyrm_duel.0004.a.tt.eviscerated: "Tu montura desgarra el vientre de la bestia, exponiendo sus entrañas al aire." #NT!
  
 lv_firewyrm_duel.0004.a.chomp: "Y eso... es todo." #NT!
 lv_firewyrm_duel.0004.a.tt.chomp: "Tu montura devora a la bestia de un solo y brutal mordisco." #NT!
 lv_firewyrm_duel.0004.chomp.t: "[fd_victor_dragon.GetNameNoTooltip] Le gusta el sabor" #NT!
  
   # Post-Round 1 Text 
 lv_firewyrm_duel.0001.desc.succeeding: "#medium El cielo se agita con calor y cenizas mientras la batalla no muestra signos de disminuir. El humo se riza como dedos agarrando y las llamas surcan las nubes en ráfagas de furia. Cada aleteo de las alas de tu dragón levanta cenizas de la tierra ennegrecida que hay debajo. El dragón de fuego, enloquecido e implacable, gira en círculos a su propio ritmo brutal. Esto no es un simple choque: es una guerra de voluntades escrita en los cielos.#!" #NT!
 lv_firewyrm_duel.0001.desc.succeeding.final: "#medium \n\nEl ritmo de la batalla continúa, el fuego y la furia laten como un segundo corazón en tu pecho. Se debe hacer otro movimiento.#!" #NT!
  
   # Post-Special States 
 lv_firewyrm_duel.0001.stunned: "Mantente firme... sólo respira..." #NT!
 lv_firewyrm_duel.0001.tt.stunned.firewyrm: "Tu vermis de fuego se tambalea por el último ataque de la bestia y no puede actuar en esta ronda." #NT!
 lv_firewyrm_duel.0001.tt.stunned: "Tu dragón se tambalea por el último ataque de la bestia, incapaz de actuar en esta ronda." #NT!
 lv_firewyrm_duel.0001.desc.stunned.firewyrm_vs_firewyrm: "\n\n#medium La neblina se disipa. Tu wyrm golpea su cabeza, saliva fundida silba donde cae, mientras el aturdimiento sale de su cuerpo. La debilidad pasa, pero no sin costo. La piedra carbonizada y la silueta descomunal del otro wyrm se alzan delante, con sus respiraderos aún humeando por el chirrido. Tu bestia brama, un rugido gutural más ardiente que voz. Lo que sea que tuviera ese grito... ahora está roto.#!" #NT!
 lv_firewyrm_duel.0001.desc.stunned.firewyrm_duel: "\n\n#medium La neblina se disipa. Tu wyrm se levanta, la piel fundida se ondula mientras recupera el control. El momento de quietud ha desaparecido, pero su ardor permanece. Arriba, el dragón gira en el cielo, con las alas cortando el humo como espadas y su jinete ya presionando el ataque. Tu bestia deja escapar un chillido que hace vibrar el aire y las rejillas de ventilación arden de calor. Cualquiera que sea la fuerza que lo basó... no durará.#!" #NT!
 lv_firewyrm_duel.0001.desc.stunned: "\n\n#medium La neblina se disipa. Tu dragón parpadea, los músculos se tensan cuando la claridad regresa a sus ojos. El momento de debilidad ha pasado, pero no sin un costo. La tierra quemada y la forma amenazante del vermis de fuego te saludan mientras se reanuda la batalla. Sientes que tu montura respira profundamente y un gruñido bajo se forma en su pecho. Lo que sea que tuviera ese grito... ahora está roto.#!" #NT!
  
 lv_firewyrm_duel.0001.takeoff: "¡Necesitamos altitud! ¡Sácanos de aquí!" #NT!
 lv_firewyrm_duel.0001.tt.takeoff: "Tu dragón intenta ganar altitud, intentando escapar del alcance del vermis de fuego." #NT!
 lv_firewyrm_duel.0001.desc.takeoff: "\n\n#medium Impulsas a tu dragón hacia arriba, con las alas tensas contra el peso de la ceniza y el humo. Los ojos fundidos del vermis de fuego te siguen, pero no pueden igualar tu ascenso. Por un momento eres libre: el suelo cae, el cielo se abre y puedes respirar de nuevo. Pero la bestia es implacable. No te dejará escapar tan fácilmente.#!" #NT!
  
 lv_firewyrm_duel.0001.land: "¡Necesitamos aterrizar! ¡Ahora!" #NT!
 lv_firewyrm_duel.0001.tt.land: "Tu dragón intenta aterrizar, intentando recuperar el control de la situación." #NT!
 lv_firewyrm_duel.0001.desc.land: "\n\n#medium Con un fuerte tirón de las riendas y una orden gritada, guías a tu dragón hacia abajo a través del cielo cubierto de cenizas. El viento abrasador azota tu cara mientras las garras chocan contra la tierra rota. El suelo gime bajo el peso de tu montura mientras las alas se pliegan y el humo se curva entre la piedra agrietada y las rejillas de ventilación fundidas. Entrecierras los ojos a través de la neblina: el vermis de fuego merodea delante, con los ojos quemando brasas en la oscuridad. Los cielos están detrás de ti ahora. El resto de esta batalla se librará donde caen las leyendas: en el suelo, entre ruinas y llamas.#!" #NT!
  
 lv_firewyrm_duel.0001.warning.force_land: "@warning_icon! #X ¡Tu dragón se verá obligado a aterrizar al realizar este movimiento! #!" #NT!
 lv_firewyrm_duel.0001.warning.burn_contact: "@warning_icon! #X ¡Cualquier movimiento que implique contacto con el vermis de fuego mientras está en su estado fundido quemará o dañará aún más a tu dragón! #!" #NT!
 lv_firewyrm_duel.0001.warning.burn_incoming: "@warning_icon! #X ¡La llama del vermis de fuego se está acercando! ¡Tu dragón se quemará o sufrirá más heridas si no reaccionas a tiempo! #!" #NT!
 lv_firewyrm_duel.0001.warning.nullified: "@warning_icon! #X ¡Este movimiento no causará daño en el estado actual del firewyrm!#!" #NT!
  
   # Dragon Moves 
 lv_firewyrm_duel.0001.circle_beast: "Sigue moviéndote. Deja que adivine dónde caerá el próximo golpe." #NT!
 lv_firewyrm_duel.0001.tt.circle_beast: "Tu dragón mantiene la distancia y rodea al vermis de fuego para provocar confusión o abrir una brecha." #NT!
 lv_firewyrm_duel.0001.desc.circle_beast: "\n\n#medium Tu dragón traza un amplio arco a través del cielo cubierto de humo, manteniéndose justo fuera del alcance del wyrm. La bestia gruñe y se retuerce, siguiéndote con ojos brillantes. No ofreces ninguna oportunidad, pero aprendes cómo se mueve, cómo se enrolla antes de un golpe.#!" #NT!
  
 lv_firewyrm_duel.0001.flame_test: "Veamos cuánto fuego puede soportar." #NT!
 lv_firewyrm_duel.0001.tt.flame_test: "Tu dragón exhala un chorro de llamas medido, no para hacer daño, sino para probar la propia resistencia del vermis de fuego." #NT!
 lv_firewyrm_duel.0001.desc.flame_test: "\n\n#medium Señalas un estallido controlado de llama de dragón, no destinado a matar, sino a provocar. El vermis de fuego surge a través de él con inquietante facilidad... o se estremece, retrocediendo mientras las llamas se curvan a lo largo de sus escamas. Ahora, al menos, entiendes lo que puede soportar.#!" #NT!
  
 lv_firewyrm_duel.0001.claws_out: "¡Ve por las extremidades! ¡Enrédalo antes de que vuelva a atacar!" #NT!
 lv_firewyrm_duel.0001.tt.claws_out: "Una estocada básica pero directa destinada a arañar las piernas o los flancos del vermis de fuego." #NT!
 lv_firewyrm_duel.0001.desc.claws_out: "\n\n#medium Sin delicadeza, sin estrategia: solo dientes y garras. Tu dragón se estrella contra el wyrm en una competencia primordial de fuerza. El aire canta con violencia mientras ambos monstruos se rastrillan y azotan entre sí, escamas y tendones desgarrados al pasar.#!" #NT!
  
 lv_firewyrm_duel.0001.reckless_dive: "Malditos sean los riesgos: ¡nos vamos ahora!" #NT!
 lv_firewyrm_duel.0001.tt.reckless_dive: "Una caída en picado a alta velocidad al alcance cuerpo a cuerpo. Peligroso tanto para el jinete como para la bestia, pero podría acabar rápidamente con las cosas." #NT!
 lv_firewyrm_duel.0001.desc.reckless_dive: "\n\n#medium Te inclinas hacia el viento y empujas a tu dragón a una zambullida brutal. Atraviesas el fuego y las cenizas como una lanza viviente, pero la velocidad imprudente es una apuesta. Acierte o falle, se paga con sangre o aliento.#!" #NT!
  
 lv_firewyrm_duel.0001.guard_skies: "Mantenga la formación. Alas protectoras y garganta." #NT!
 lv_firewyrm_duel.0001.tt.guard_skies: "Tu dragón protege sus partes vulnerables y circula en altitud, minimizando las aberturas para los ataques del vermis de fuego." #NT!
 lv_firewyrm_duel.0001.desc.guard_skies: "\n\n#medium Llamas a tu dragón más alto, sus alas barren un halo protector a través del aire lleno de ruinas. Sin huecos, sin embestidas salvajes. Cabalgas el viento como una espada en el filo, listo para parar cualquier cosa que la bestia lance en tu dirección.#!" #NT!
  
 lv_firewyrm_duel.0001.rip_joints: "Sus rodillas se doblan como cualquier bestia. ¡Golpea cierto!" #NT!
 lv_firewyrm_duel.0001.tt.rip_joints: "Un golpe preciso dirigido a las articulaciones del wyrm o a las placas inferiores expuestas. Arriesgado, pero potencialmente finalizador de la pelea." #NT!
 lv_firewyrm_duel.0001.desc.rip_joints: "\n\n#medium No la cabeza. No el vientre. Le haces una señal hacia las costuras de su cuerpo, donde las escamas se unen con los músculos, donde debe moverse para atacar. Tus garras de dragón son verdaderas y el vermis de fuego aúlla mientras una pierna sufre espasmos bajo su peso.#!" #NT!
  
 lv_firewyrm_duel.0001.roar_challenge: "Hazle saber que no somos presas." #NT!
 lv_firewyrm_duel.0001.tt.roar_challenge: "Tu dragón lanza un rugido ensordecedor, tratando de poner nervioso o provocar al vermis de fuego en una agresión precipitada." #NT!
 lv_firewyrm_duel.0001.desc.roar_challenge: "\n\n#medium Instas a tu dragón a bramar, un sonido profundo y conmovedor que responde a la propia locura del dragón con furia dracónica. La respuesta es inmediata: la bestia carga, enfurecida e irreflexiva. Has provocado su ira. Ahora sobrevive. #!" #NT!
  
 lv_firewyrm_duel.0001.dive_strike: "Dentro y fuera, lo suficientemente rápido como para sangrar sin quemarse." #NT!
 lv_firewyrm_duel.0001.tt.dive_strike: "Un paso rápido a través del alcance del wyrm, con el objetivo de dejar una herida y desaparecer antes de que pueda tomar represalias." #NT!
 lv_firewyrm_duel.0001.desc.dive_strike: "\n\n#medium Ves una apertura (breve, incierta) y te lanzas a través de ella como un rayo. Tu dragón rastrilla su flanco al pasar, sin detenerse para chocar, sino moviéndose directamente a través del espacio de la bestia, convirtiendo el cielo mismo en un arma.#!" #NT!
  
 lv_firewyrm_duel.0001.tailspin_slam: "¡Gira y rompe sus costillas!" #NT!
 lv_firewyrm_duel.0001.tt.tailspin_slam: "Tu dragón se azota con un golpe giratorio, intentando romper huesos con pura fuerza." #NT!
 lv_firewyrm_duel.0001.desc.tailspin_slam: "\n\n#medium Tú ordenas un giro y un giro, tu dragón gira con violencia y gracia. El wyrm tarda en reaccionar (aturdido o lento) y la cola de tu dragón cae como un martillo de costado. Grietas de huesos. El aire mismo se estremece.#!" #NT!
  
 lv_firewyrm_duel.0001.wound_exploit: "Esa herida no ha sanado. Nos aseguraremos de que nunca lo haga." #NT!
 lv_firewyrm_duel.0001.tt.wound_exploit: "Explotas una herida anterior, con la esperanza de ampliarla y drenar lo último de la fuerza del vermis de fuego." #NT!
 lv_firewyrm_duel.0001.desc.wound_exploit: "\n\n#medium Lo ves: una mancha quemada sin escamas, brillando con sangre y calor. Una orden precisa y tu dragón se lanzará hacia ella. Las garras encuentran carne. El wyrm grita de agonía mientras la herida se abre más y su fuerza se escapa con cada latido.#!" #NT!
  
 lv_firewyrm_duel.0001.vipers_feint: "Deslízate hacia la izquierda. Golpea a la derecha." #NT!
 lv_firewyrm_duel.0001.tt.vipers_feint: "Un movimiento en falso deslumbrante: sólo un jinete astuto puede realizarlo limpiamente." #NT!
 lv_firewyrm_duel.0001.desc.vipers_feint: "\n\n#medium Como una serpiente en vuelo, cambias de ángulo en el aire: una finta y luego un golpe desde un camino imposible. Tu dragón se retuerce a través de un soplo de llamas y lanza un rastrillo de castigo antes de que el wyrm se dé cuenta de dónde has ido.#!" #NT!
  
 lv_firewyrm_duel.0001.dragonflame_barrage: "¡Quémalo, una y otra vez!" #NT!
 lv_firewyrm_duel.0001.tt.dragonflame_barrage: "Tu dragón suelta una andanada de llamas, con el objetivo de abrumar al wyrm con potencia de fuego bruta." #NT!
 lv_firewyrm_duel.0001.desc.dragonflame_barrage: "\n\n#medium No te reprimes. Con un rugido, tu dragón libera un torrente de fuego en amplias olas. El wyrm gruñe y se retira bajo el calor, con la piel encendida. No es una muerte, pero es un mensaje grabado en llamas.#!" #NT!
  
 lv_firewyrm_duel.0001.chomp: "#bold CHOMP#!" #NT!
 lv_firewyrm_duel.0001.tt.chomp: "Tú #bold CHOMP#!" #NT!
  
 lv_firewyrm_duel.0001.commanding_cry: "¡Concéntrate, amigo mío! ¡Respiramos juntos!" #NT!
 lv_firewyrm_duel.0001.tt.commanding_cry: "Un grito de guerra para tu dragón, instándolo a concentrarse y sincronizar sus ataques con los tuyos." #NT!
 lv_firewyrm_duel.0001.desc.commanding_cry: "\n\n#medium Con una palabra (antigua, poderosa) calmas el aliento de tu dragón. Le susurras fuerza al oído. El aleteo se estabiliza, la sangre se ralentiza. Las heridas se tejen lo suficiente para volar. Compras otra ronda... tal vez más.#!" #NT!
  
 lv_firewyrm_duel.0001.hidden_knowledge: "Recuerdo los textos antiguos. [dragon.GetName], ¡haz exactamente lo que te ordene!" #NT!
 lv_firewyrm_duel.0001.tt.hidden_knowledge: "Recuerdas una táctica específica de los antiguos textos valyrios, con la esperanza de que cambie el rumbo de la batalla." #NT!
 lv_firewyrm_duel.0001.desc.hidden_knowledge: "\n\n#medium Recuerdas los cuentos. Las tácticas que alguna vez usaron los valyrios cuando los dragones no eran bestias sino armas de guerra. Tu dragón se mueve ahora con el mismo ritmo, convirtiendo la sabiduría antigua en muerte en el cielo. El wyrm no se lo espera.#!" #NT!
  
 lv_firewyrm_duel.0001.risk_it_all: "Esto termina de una manera: sangre y cenizas." #NT!
 lv_firewyrm_duel.0001.tt.risk_it_all: "Te lo juegas todo por una carga desesperada. Si funciona, el duelo termina. Si no... tú también." #NT!
 lv_firewyrm_duel.0001.desc.risk_it_all: "\n\n#medium Das la orden impensable. Tu dragón cae del cielo como una piedra, con las garras al descubierto y una llama elevándose. El wyrm se levanta para encontrarte. Dos monstruos, un choque final. No habrá un segundo strike.#!" #NT!
  
 lv_firewyrm_duel.0001.collapse_ground: "¡Que caiga el suelo sobre él! ¡Que la tierra se trague a este monstruo!" #NT!
 lv_firewyrm_duel.0001.tt.collapse_ground: "Le ordenas a tu dragón que desate un torrente de fuego contra el suelo, desestabilizándolo y con la esperanza de enterrar al dragón de fuego en la tierra que se derrumba." #NT!
 lv_firewyrm_duel.0001.desc.collapse_ground: "\n\n#medium Haces retroceder al vermis de fuego, más y más abajo, y luego señalas el ataque. La piedra cruje bajo sus extremidades. La tierra gime. Un colapso repentino, una columna de polvo... y la bestia desaparece con un aullido bajo el suelo roto en ruinas.#!" #NT!
  
   # Firewyrm Moves 
 lv_firewyrm_duel.0001.fume_burst: "¡Quema el aire, [fd_round_me_dragon.GetName]! ¡Llena sus pulmones de fuego!" #NT!
 lv_firewyrm_duel.0001.tt.fume_burst: "[fd_round_me_dragon.GetName] libera una nube de gas sobrecalentado, con el objetivo de quemar y desorientar a [fd_round_opponent_dragon.GetName]." #NT!
 lv_firewyrm_duel.0001.desc.fume_burst.firewyrm_vs_firewyrm: "\n\n#medium A tus órdenes, tu wyrm brama y jadea, dividiendo el aire con un rugido nacido del horno. Expulsa una nube de vapores abrasadores, vapor fundido que silba por las rejillas de ventilación a lo largo de su columna. El wyrm enemigo se agita contra la neblina hirviente y su piel se ampolla donde se adhiere la neblina ardiente. Dos hornos vivientes chocan, pero en este momento, el tuyo arde más fuerte.#!" #NT!
 lv_firewyrm_duel.0001.desc.fume_burst: "\n\n#medium Tu wyrm arquea su cuerpo fundido, las fisuras a lo largo de su piel brillan más mientras libera un torrente de vapores hirvientes. La niebla asfixiante envuelve al dragón, las alas vacilan mientras la bestia retrocede ante el calor sofocante. La carne hecha fuego lucha contra el fuego hecho mal, el aire mismo se convierte en tu arma mientras el dragón grita de rabia y dolor.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.fume_burst.firewyrm_vs_firewyrm: "\n\n#medium El vermis de fuego inhala profundamente y luego desata una nube de vapores hirvientes. Tu dragón retrocede y bate las alas mientras intenta escapar de la niebla ardiente. Sientes el calor incluso desde aquí, un recordatorio de que esta bestia no es solo una llama, sino un horno viviente.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.fume_burst: "\n\n#medium El vermis de fuego inhala profundamente y luego desata una nube de vapores hirvientes. Tu dragón retrocede y bate las alas mientras intenta escapar de la niebla ardiente. Sientes el calor incluso desde aquí, un recordatorio de que esta bestia no es solo una llama, sino un horno viviente.#!" #NT!
  
 lv_firewyrm_duel.0001.boneshattering_screech: "¡Grita hasta que la piedra misma se rompa!" #NT!
 lv_firewyrm_duel.0001.tt.boneshattering_screech: "[fd_round_me_dragon.GetName] emite un chillido ensordecedor, con el objetivo de desorientar y desequilibrar a [fd_round_opponent_dragon.GetName]." #NT!
 lv_firewyrm_duel.0001.tt.boneshattering_screech.effect: "[fd_round_opponent_dragon.GetName] está aturdido por este chillido desgarrador." #NT!
 lv_firewyrm_duel.0001.desc.boneshattering_screech.firewyrm_vs_firewyrm: "\n\n#medium Tu wyrm se arquea, las fisuras se abren, antes de desatar un grito extraído del corazón fundido de la tierra. El sonido es un crudo tormento que parte la piedra y el cielo. Al otro lado del campo de batalla, el otro wyrm colapsa en un espasmo de furia y dolor, sus extremidades se traban al tropezar. Dos hornos vivientes chocan, pero el tuyo ha robado la voz del pozo y deja al rival destrozado, aturdido en el polvo.#!" #NT!
 lv_firewyrm_duel.0001.desc.boneshattering_screech: "\n\n#medium Tu wyrm se alza, respira llamas y suelta un chillido que destroza el aire. El dragón se pone rígido en medio del rugido, con los ojos muy abiertos cuando el sonido lo golpea con la fuerza de un martillo. Las alas flaquean, las llamas se apagan y la criatura se tambalea, aturdida y tambaleándose. Fuego hecho carne, deshecho no por garras o llamas, sino por un sonido lo suficientemente agudo como para partir su espíritu.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.boneshattering_screech.firewyrm_vs_firewyrm: "\n\n#medium El mundo se abre en sonido. Tu wyrm convulsiona, la piel fundida se estremece mientras el chillido desgarra escamas y tendones por igual. Se agita, golpea la tierra con garras que cortan la piedra, y sus respiraderos escupen humo en agonía. Sientes la fuerza resonar a través de su cuerpo hasta tus propios huesos, dejándolos a ambos tambaleados, tambaleándose, indefensos durante un latido de demasiado tiempo.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.boneshattering_screech: "\n\n#medium El aire se divide con un chillido tan penetrante que sientes como si tu cráneo fuera a romperse. Tu dragón se tambalea en el aire, con las alas vacilantes y los ojos muy abiertos por el dolor y la desorientación. El chillido del dragón de fuego resuena en las piedras rotas y los acantilados fundidos, un arma de sonido más salvaje que el acero. Intentas estabilizar a la bestia debajo de ti, pero por ahora, todo lo que puedes hacer es aguantar. Esta vez no habrá ninguna maniobra, solo supervivencia.#!" #NT!
  
 lv_firewyrm_duel.0001.cone_of_flame: "¡Quémalo hasta convertirlo en cenizas! ¡Deja que el fuego sea tu respuesta!" #NT!
 lv_firewyrm_duel.0001.tt.cone_of_flame: "[fd_round_me_dragon.GetName] desata un amplio cono de llamas, intentando envolver a tu dragón en una ola de calor." #NT!
 lv_firewyrm_duel.0001.tt.cone_of_flame.effect: "El fuego del vermis de fuego se acerca al enemigo, amenazando con incinerarlo en un infierno furioso." #NT!
 lv_firewyrm_duel.0001.desc.cone_of_flame.firewyrm_vs_firewyrm: "\n\n#medium Tu wyrm ruge, no con sonido, sino con fuego. Eructa un cono de llamas abrasadoras, un horno desatado de un solo aliento. El otro wyrm grita, la piel fundida se ampolla bajo el torrente y sus movimientos se reducen a un desafío tambaleante y retorcido. El humo sale de sus rejillas de ventilación, pero el fuego persiste, devorando más profundamente, alimentándose de cada aliento que se atreve a tomar.#!" #NT!
 lv_firewyrm_duel.0001.desc.cone_of_flame: "\n\n#medium La garganta de tu wyrm se hincha, las fisuras arden, antes de vomitar una tormenta de fuego que devora el aire. El dragón grita cuando el cono lo envuelve, sus alas se curvan hacia adentro y sus escamas se ennegrecen bajo el implacable fuego. Incluso cuando se aleja, el fuego no se libera: persiste como una maldición, royendo la piel y los tendones, convirtiendo la gracia en agonía.#!" #NT!
 lv_firewyrm_duel.0001.desc.cone_of_flame.miss.firewyrm_vs_firewyrm: "\n\n#medium Tu wyrm brama, liberando fuego hasta que el campo de batalla se ahoga en una ola de llamas abrasadoras. Por un momento, parece que nada podría sobrevivir al infierno, hasta que las llamas se separan contra el otro dragón de fuego. Su piel brilla como mineral vivo, canales fundidos bebiendo el fuego como si fuera aliento, no una pesadilla. Las llamas se rompen inútilmente y se convierten en humo alrededor de una bestia que se ha vuelto inmune a su propio elemento.#!" #NT!
 lv_firewyrm_duel.0001.desc.cone_of_flame.miss: "\n\n#medium Tu wyrm se levanta, los respiraderos fundidos brillan mientras brama una tormenta de fuego que arrasa el campo de batalla. Pero el dragón ya está en el aire, batiendo sus alas en un furioso vendaval mientras trepa por encima del torrente. El cono de llamas quema la piedra y el cielo por igual, pero no encuentra ninguna marca, solo un rastro de humo que se desvanece debajo de la forma que huye.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.cone_of_flame.firewyrm_vs_firewyrm: "\n\n#medium El wyrm rival se levanta, las fisuras brillan con un brillo blanco fundido, antes de arrojar un torrente de llamas que recorre el campo de batalla como una marea viviente. Tu propia bestia se agita mientras el fuego quema su piel, expulsa humo aullando mientras ampollas se encuentran con ampollas. El calor persiste, aferrándose a sus escamas, ardiendo incluso después de que el fuego ha pasado. Cada respiración es dolorosa y aún así el fuego los devora a ambos.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.cone_of_flame: "\n\n#medium Con un aullido que surge de algún pozo fundido, el vermis de fuego retrocede, con la garganta llena de fuego, y desata un cono abrasador de llamas por todo el campo de batalla. El aire se convierte en humo y furia a medida que las llamas se expanden, tragando piedra destrozada y cielo por igual. Sientes el calor antes de golpear, como un martillo hecho de luz. Tu dragón grita, sus alas brillan contra el infierno, mientras el mundo se vuelve borroso en un rojo abrasador.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss.firewyrm_vs_firewyrm: "\n\n#medium El vermis de fuego enemigo convulsiona y su garganta se hincha de calor, antes de arrojar un torrente nacido del horno por el campo. Golpea con la fuerza de una tormenta de soles, pero tu wyrm permanece intacto. Su piel arde con más intensidad y sus respiraderos arden como grietas en el corazón de la tierra. Las llamas lo inundan, lo reclaman y lo consumen, dejando solo humo a su paso. Por ahora, el fuego no puede dañar al fuego.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.cone_of_flame.miss: "\n\n#medium El vermis de fuego suelta un rugido gutural, su pecho palpita con una luz de ascuas antes de arrojar un cono de fuego turbulento. El infierno lame hacia arriba, persiguiendo sombras y convirtiendo la tierra rota de abajo en un mar de llamas en movimiento. Pero tu dragón ya está en el aire, batiendo con fuerza sus alas contra el calor creciente. Subes más alto hacia el cielo cargado de cenizas, sintiendo el chamuscado de la corriente ascendente pero no el mordisco del incendio. Abajo, el fuego barre inofensivamente la piedra ennegrecida y el vermis de fuego gruñe, con las mandíbulas humeantes de frustración.#!" #NT!
  
 lv_firewyrm_duel.0001.frenzied_lunge: "Ataca ahora: ¡locura y furia ambas!" #NT!
 lv_firewyrm_duel.0001.tt.frenzied_lunge: "[fd_round_me_dragon.GetName] carga hacia adelante en una estocada salvaje e incontrolada, tratando de acortar la distancia y asestar un golpe." #NT!
 lv_firewyrm_duel.0001.desc.frenzied_lunge.firewyrm_vs_firewyrm: "\n\n#medium Con un bramido que hace sonar las cenizas de los acantilados, tu wyrm avanza en un frenesí de músculos y humo. Las garras atraviesan la piel chamuscada mientras las dos bestias chocan, furia contra furia. El suelo tiembla bajo la violencia y por un instante se siente menos como un golpe que como un terremoto dado forma.#!" #NT!
 lv_firewyrm_duel.0001.desc.frenzied_lunge: "\n\n#medium Tu wyrm se lanza con una velocidad imprudente, un borrón de garras y colmillos dentados. Se estrella contra el flanco del dragón, desgarrando escamas y tendones con fuerza salvaje. El dragón se agita y bate las alas contra la oleada de dolor, pero tu bestia no cede; su frenesí solo deja ruina a su paso.#!" #NT!
 lv_firewyrm_duel.0001.desc.frenzied_lunge.miss.firewyrm_vs_firewyrm: "\n\n#medium Tu wyrm se lanza hacia adelante, golpeando a la bestia resplandeciente en una tormenta de garras y mandíbulas chasqueantes. Pero en lugar de carne, se encuentra con fuego descarnado: la piel fundida quema sus garras. El impacto desgarra a ambas criaturas, tu montura retrocede con un grito de dolor mientras su propio ataque fracasa. La furia se convierte en agonía en un abrir y cerrar de ojos, humo y chispas salen del choque.#!" #NT!
 lv_firewyrm_duel.0001.desc.frenzied_lunge.miss: "\n\n#medium Con un chirrido que parte la piedra, tu wyrm se lanza, rastrillando con sus garras hacia arriba a través del humo y las cenizas. Pero el dragón ya está hacia el cielo, sus alas rasgan el aire sobre el campo de batalla. El golpe aterriza sólo en la ruina y el polvo, y el impulso lanza a tu montura por el suelo agrietado. Golpea con fuerza y ​​se gira hacia atrás con los ojos fundidos fijos en su presa, con una furia insaciable.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.firewyrm_vs_firewyrm: "\n\n#medium El wyrm enemigo explota de las cenizas, su cuerpo es una tormenta de escamas y rabia. Choca con tu montura en un choque que hace temblar los huesos, los colmillos se hunden profundamente mientras las garras rasgan la carne con fuego. El suelo se estremece con el impacto, tu wyrm aúlla bajo la fuerza aplastante del frenesí desenfrenado de sus parientes.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.frenzied_lunge: "\n\n#medium Sin previo aviso, el wyrm se lanza hacia adelante en un frenesí, arrastrando garras y colmillos a través del aire ahogado por cenizas. Se estrella contra tu dragón con furia imprudente, arrancando escamas del hueso. Sientes el impacto atravesar la silla, los tendones y llegar hasta tus propios huesos. No queda ninguna mente en él, sólo odio.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss.firewyrm_vs_firewyrm: "\n\n#medium La bestia se lanza hacia adelante, chillando, golpeando con garras y colmillos como una avalancha. Pero cuando choca contra la piel fundida de tu wyrm, el ataque se convierte en su propia perdición. El fuego estalla contra el fuego, quemando al atacante mientras rastrilla inútilmente la armadura brillante. Tu wyrm gruñe a través de la tormenta, intacto, mientras su enemigo retrocede ampollado y gritando.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.frenzied_lunge.miss: "\n\n#medium Con un chillido sin sentido, el vermis de fuego se lanza, con las fauces abiertas y las garras rasgando el aire. Avanza a través del humo y las ruinas, pero tu dragón ya está hacia el cielo, con las alas batiendo contra el calor y las cenizas crecientes. La estocada no alcanza más que polvo y piedras destrozadas, y el impulso del wyrm lo hace patinar sobre la tierra agrietada. Abajo, se gira hacia atrás con un silbido, ojos fundidos siguiéndote por encima de tu cabeza, la rabia hierve a fuego lento con cada respiración.#!" #NT!
  
 lv_firewyrm_duel.0001.rockfall_roar: "¡Rugido, [fd_round_me_dragon.GetName]! ¡Arranca el cielo de sus pilares!" #NT!
 lv_firewyrm_duel.0001.tt.rockfall_roar: "[fd_round_me_dragon.GetName] deja escapar un rugido que hace temblar el suelo, desalojando rocas y escombros." #NT!
 lv_firewyrm_duel.0001.desc.rockfall_roar.firewyrm_vs_firewyrm: "\n\n#medium Tu wyrm se levanta hacia atrás, con el pecho agitado y desata un rugido que hace vibrar la piedra misma. La caverna tiembla cuando las paredes se parten y las rocas caen. Una lluvia de rocas cae sobre el wyrm enemigo, y su piel fundida centellea mientras se agita bajo el peso que colapsa. Nubes de polvo florecen a la luz del fuego, asfixiando el aire hasta que todo lo que escuchas es el gemido de la piedra y la furia ahogada del enemigo debajo.#!" #NT!
 lv_firewyrm_duel.0001.desc.rockfall_roar: "\n\n#medium El rugido que emite tu wyrm es menos un sonido que una convulsión del mundo mismo. La caverna se estremece, las estalactitas se desprenden como dientes del techo, las paredes se parten con estruendosos crujidos. El dragón gira hacia arriba presa del pánico, con las alas buscando aire mientras las rocas pasan formando láminas letales. La luz del fuego pinta el caos en rojo y dorado: tu enemigo atrapado entre la piedra y las llamas, luchando por sobrevivir en una tumba que se derrumba.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.rockfall_roar.firewyrm_vs_firewyrm: "\n\n#medium El wyrm enemigo brama y el mundo se derrumba. La piedra se desprende del techo en grandes losas, y el suelo se convulsiona bajo las garras de tu bestia. Te aferras a la silla mientras llueven escombros a tu alrededor, ensordecido por el rugido tanto de la tierra como del monstruo. Tu wyrm se tambalea, atrapado en la claustrofóbica aglomeración, con sus ojos fundidos muy abiertos mientras lucha no contra un rival, sino contra la montaña misma que cae sobre ti.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.rockfall_roar: "\n\n#medium El wyrm suelta un rugido gutural que resuena a través de las paredes de la caverna, o las ruinas, o cualquier cementerio en el que estés luchando. Con él viene un temblor. Las piedras se agrietan y los techos crujen. Una sección de la tierra cede y se derrumba en polvo y escombros. Te ves obligado a huir hacia arriba o ser enterrado.#!" #NT!
  
 lv_firewyrm_duel.0001.molten_slough: "¡Muda tu piel, quema más brillante! ¡Que nada te traspase!" #NT!
 lv_firewyrm_duel.0001.tt.molten_slough: "[fd_round_me_dragon.GetName] arroja escamas fundidas, cubriéndose con una nueva capa de armadura ardiente y cauterizando cualquier herida que haya tenido en el proceso." #NT!
 lv_firewyrm_duel.0001.tt.molten_slough.effect: "Una armadura fundida envuelve al vermis de fuego, anulando todos los ataques de fuego e infligiendo un daño significativo por quemaduras en todo contacto realizado." #NT!
 lv_firewyrm_duel.0001.desc.molten_slough: "\n\n#medium Tu wyrm se convulsiona debajo de ti con un sonido como el de montañas rompiéndose. Su espalda se arquea, sus escamas se agrietan y se desprenden en láminas de carne ardiente. Trozos de piel humeante se desprenden y caen al suelo en montones brillantes. De las ruinas emerge una bestia renacida, brillando con una luz fundida, con las heridas cerradas y cada respiración como una explosión de horno. El calor que surge de su cuerpo quema tu piel incluso a través de la silla, como si ahora no cabalgases sobre una criatura, sino sobre el núcleo vivo de la tierra misma.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.molten_slough: "\n\n#medium Con un impulso gutural, el vermis de fuego arquea su espalda y se parte. La carne con costras y las escamas chamuscadas se desprenden y caen al suelo como una armadura fundida. Ruge, reluciente, medio quemado y más temible que antes. Sus heridas se cierran con vapor y el fuego en su garganta arde aún más. #!" #NT!
  
 lv_firewyrm_duel.0001.berserk_charge: "¡Toda tu fuerza, [fd_round_me_dragon.GetName]! ¡Rómpelo o rómpete tú mismo!" #NT!
 lv_firewyrm_duel.0001.tt.berserk_charge: "[fd_round_me_dragon.GetName] carga hacia adelante en un ataque ciego y furioso, tratando de pisotear a [fd_round_opponent_dragon.GetName]." #NT!
 lv_firewyrm_duel.0001.desc.berserk_charge.firewyrm_vs_firewyrm: "\n\n#medium Tu wyrm estalla hacia adelante con un aullido que sacude las piedras de los acantilados, su cuerpo es un monstruo de músculos y rabia fundida. Choca contra el otro wyrm con tal fuerza que la tierra misma se agrieta, sus garras y dientes se desgarran sin pensar en su propia piel. Las dos bestias se retuercen en una tormenta de violencia, el aire se llena de humo, sangre y furia desenfrenada.#!" #NT!
 lv_firewyrm_duel.0001.desc.berserk_charge: "\n\n#medium Tu montura explota y se pone en movimiento, y ya no es una bestia sino una avalancha viviente de furia. Se estrella contra el flanco del dragón con una fuerza que rompe huesos, escamas y tendones se hacen añicos bajo la carga. El dragón grita, tambaleándose bajo el ataque, mientras tu wyrm araña y desgarra como si quisiera arrastrar el cielo con él.#!" #NT!
 lv_firewyrm_duel.0001.desc.berserk_charge.miss.firewyrm_vs_firewyrm: "\n\n#medium Tu wyrm se lanza de cabeza contra la resplandeciente bestia, golpeando con todo el peso imprudente de su furia. Pero la carne fundida no es carne en absoluto. El momento del impacto se convierte en un cataclismo: las garras de tu wyrm chamuscan y su piel se ampolla contra el horno que pensaba aplastar. Ambas bestias se tambalean, chillan, el campo de batalla se ilumina en una tormenta de llamas y agonía nacida de la ira que choca con el fuego encarnado.#!" #NT!
 lv_firewyrm_duel.0001.desc.berserk_charge.miss: "\n\n#medium Con un rugido que podría derribar montañas, tu wyrm carga, con los ojos fundidos fijos en el dragón de arriba. Se estrella contra el humo y la piedra destrozada, con las garras apuntando hacia el cielo, pero el dragón ya está en el aire y sus alas lo llevan fuera de su alcance. La carga termina en ruina: tu bestia se hunde en la tierra, provocando una tormenta de polvo y cenizas, su furia desenfrenada y su presa intacta.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.berserk_charge.firewyrm_vs_firewyrm: "\n\n#medium Un rugido atraviesa la neblina y, antes de que puedas prepararte, el otro wyrm está sobre ti: una fuerza imparable de sangre y odio. Se estrella contra tu montura con un impacto devastador, con garras desgarradas y mandíbulas desgarradas con abandono suicida. El impacto casi te arranca de la silla mientras ambas bestias se agitan en una vorágine de rabia y ruina.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.berserk_charge: "\n\n#medium Ensangrentado, medio loco y aullando, el wyrm carga, nada calculado, nada cuerdo. Sus ojos brillan como brasas abiertas. Lanza todo su monstruoso cuerpo a la lucha, haciendo caso omiso de las llamas y las garras. Ves venir un golpe que no puedes evitar. El único consuelo es este: puede destruirse a sí mismo tratando de destruirte.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss.firewyrm_vs_firewyrm: "\n\n#medium La bestia que carga se estrella de cabeza contra la forma fundida de tu wyrm y su furia choca con el fuego vivo. El impacto contraataca instantáneamente, atravesando su propia carne mientras las garras y los colmillos no encuentran más apoyo que las llamas. Tu wyrm se mantiene firme, brillando como un horno, mientras su atacante grita de agonía, ampollado, quemado, deshecho por su propia ira enloquecida.#!" #NT!
 lv_firewyrm_duel.0001.desc.counter.berserk_charge.miss: "\n\n#medium Con un bramido que hendió el aire espeso como ceniza, el vermis de fuego carga, ciego de furia, sin prestar atención al dolor. Atraviesa piedras rotas y ruinas humeantes, con los ojos fundidos fijos en el lugar donde estabas hace unos momentos. Pero ya estás en lo alto, tu dragón dando vueltas en lo alto. La bestia se estrella debajo de ti, sus garras abren trincheras en la tierra mientras se enfurece hacia el cielo. Ahora no hay ningún pensamiento en ello, solo la ruina dejada por un ataque que nunca aterriza.#!" #NT!
  

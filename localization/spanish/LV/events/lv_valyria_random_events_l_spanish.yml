l_spanish:
 lv_valyria_random_event.0009.t: "Acechado por las sombras" #NT!
 lv_valyria_random_event.0009.desc: "La geografía de [haunted_location.GetName] es bastante traicionera, con su tierra agrietada, las chimeneas de azufre, el calor. Aún así, el verdadero peaje ha comenzado a arraigarse en su mente. Desde que pusiste un pie aquí hace días, el sueño se ha convertido en un campo de batalla. Cada noche te despiertas sudando, con el sabor del cobre en la boca y el eco cada vez más apagado de mil voces gritando al unísono.\n\nEs peor cuando estás despierto. El silencio aquí parece pesado, vigilante. Por el rabillo del ojo, vislumbras repentinos movimientos: destellos de tela carmesí, el brillo del cabello plateado contra la roca gris. Sin embargo, cada vez que giras la cabeza para mirar, no hay nada más que cenizas y ruinas a la deriva.\n\nTus compañeros se están poniendo cada vez más asustadizos, murmurando sobre "terreno inquieto" y el juicio de los antepasados. Sientes una profunda sensación de que estás invadiendo un lugar que recuerda su poder... y su ira." #NT!
 lv_valyria_random_event.0009.a: "Simplemente trucos de la luz y la fatiga. Seguimos adelante." #NT!
 lv_valyria_random_event.0009.b: "No, este lugar está maldito. Deberíamos encontrar otra manera." #NT!
  
 lv_valyria_random_event.0010.t: "Las figuras vestidas de rojo" #NT!
 lv_valyria_random_event.0010.desc: "A través de la bruma, los ves: pálidos, con el pelo largo y blanco. Sus rostros se recortan contra la ceniza. De sus hombros cuelgan túnicas de color rojo oscuro. No se mueven. Sólo miran fijamente. Cuando parpadeas, ya no están." #NT!
 lv_valyria_random_event.0010.a: "Me estaban mirando." #NT!
 lv_valyria_random_event.0010.b: "Soy su sucesor... ¿o lo soy?" #NT!
 lv_valyria_random_event.0010.c: "Son reales, más reales que los vivos." #NT!
  
 lv_valyria_random_event.0020.t: "Están aquí otra vez" #NT!
 lv_valyria_random_event.0020.desc: "Una vez más los ves, entre las ruinas. Más cerca ahora, su cabello blanco brillando a la luz del fuego. Sus ojos se encuentran con los tuyos, sin pestañear. Cuando te acercas, desaparecen, dejando solo huellas en la ceniza que se desvanecen ante tus ojos." #NT!
 lv_valyria_random_event.0020.a: "No puedo soportar su mirada." #NT!
 lv_valyria_random_event.0020.b: "Me ponen a prueba; les mostraré que soy digno." #NT!
 lv_valyria_random_event.0020.c: "Sí... sí, camino junto a ellos..." #NT!
  
 lv_valyria_random_event.0030.t: "Los muertos entre vosotros" #NT!
 lv_valyria_random_event.0030.desc: "Esta vez no desaparecen. Las pálidas figuras se encuentran entre tus compañeros, en silencio, sus túnicas rojas rozando la ceniza. Nadie más reacciona. Sus rostros están vueltos sólo hacia ti. Parpadeas y el mundo se inclina. Se han ido... pero no estás seguro de seguir siendo tú mismo." #NT!
 lv_valyria_random_event.0030.a: "¿Qué significa todo esto?" #NT!
  
 lv_valyria_random_event.0031.t: "Reclamado" #NT!
 lv_valyria_random_event.0031.desc: "Las cifras se acercan. Sus pálidas manos te alcanzan y, en un instante, el mundo se vuelve negro. Cuando tus compañeros te miran, simplemente te has ido." #NT!
 lv_valyria_random_event.0031.a: "Me llevan a las cenizas." #NT!
  
 lv_valyria_random_event.0032.t: "Ellos viven en mí ahora..." #NT!
 lv_valyria_random_event.0032.desc: "Las figuras se disuelven en cenizas, pero las sientes dentro de ti, sus voces susurrando en una lengua más antigua que la de los hombres. Sus ojos miran a través de los tuyos." #NT!
 lv_valyria_random_event.0032.a: "No estoy solo en mi propia opinión." #NT!
  
 lv_valyria_random_event.0033.t: "Un regalo maldito" #NT!
 lv_valyria_random_event.0033.desc: "Cuando las figuras desaparecen, algo queda en las cenizas: un fragmento de Valyria, que brilla débilmente con una luz interior. Lo tomas con manos temblorosas, aunque el recuerdo de sus ojos aún arde." #NT!
 lv_valyria_random_event.0033.a: "Es mío ahora... cueste lo que cueste." #NT!
  
  
 lv_valyria_random_event.0040.t: "El dragón de arriba" #NT!
 lv_valyria_random_event.0040.desc: "A través de la bruma de cenizas y humo, una enorme sombra cruza el cielo. Por un momento, las nubes se abren y contemplas alas extendidas, escamas brillando como acero fundido, un dragón volando sobre la ciudad destrozada. Sin embargo, cuando parpadeas, desaparece, dejando sólo el silencio y la penumbra cambiante. ¿Realmente lo viste... o sólo lo soñaste?" #NT!
 lv_valyria_random_event.0040.a: "Real o no, recordaré esta visión hasta el día de mi muerte." #NT!
  
  
 lv_valyria_random_event.0050.t: "La ciudad desaparecida" #NT!
 lv_valyria_random_event.0050.desc: "Las ruinas cambian ante tus ojos. Una aguja negra que guiaba tus pasos desaparece cuando giras la cabeza y es reemplazada por un terreno vacío. Las calles por las que caminaste sólo unas horas antes no llevan a ninguna parte, o te llevan al punto de partida. Tus compañeros susurran sobre brujería en el aire." #NT!
 lv_valyria_random_event.0050.a: "Nos observa. Se mueve cuando lo hacemos." #NT!
 lv_valyria_random_event.0050.b: "La Perdición deformó incluso las piedras." #NT!
 lv_valyria_random_event.0050.c: "Sí... vive. La ciudad respira a nuestro alrededor." #NT!
  
 lv_valyria_random_event.0060.t: "Perdido en la ciudad desaparecida" #NT!
 lv_valyria_random_event.0060.desc: "Deambulas entre torres que cambian cuando no te observan, calles que se mueven bajo tus pies. Los rostros familiares desaparecen, las voces resuenan en lugares equivocados y cada camino parece conducir más profundamente a las cenizas. La ciudad no quiere que te vayas." #NT!
 lv_valyria_random_event.0060.a: "Este lugar rompe el espíritu." #NT!
 lv_valyria_random_event.0060.b: "La ciudad susurra... y debo obedecer." #NT!
 lv_valyria_random_event.0060.c: "A través de la confusión viene el descubrimiento." #NT!
  
 lv_valyria_random_event.0070.t: "Tesoro en las cenizas" #NT!
 lv_valyria_random_event.0070.desc: "Un corredor sinuoso se derrumba, revelando una bóveda oculta. En las cenizas brillan monedas esparcidas y adornos medio derretidos: restos del esplendor valyrio." #NT!
 lv_valyria_random_event.0070.a: "La fortuna favorece a los audaces." #NT!
  
 lv_valyria_random_event.0080.t: "La ciudad reclama lo suyo" #NT!
 lv_valyria_random_event.0080.desc: "Las voces de tus compañeros se debilitan. Los muros se pliegan a tu alrededor, las calles se desdibujan, las torres se alzan increíblemente altas. Gritas, pero nadie te escucha. Valyria te traga entero y desaparece en su cambiante laberinto." #NT!
 lv_valyria_random_event.0080.a: "None" #NT!
  
 lv_valyria_random_event.0090.t: "Temblor en las cenizas" #NT!
 lv_valyria_random_event.0090.desc: "El suelo se tambalea bajo tus pies y el aire lleno de cenizas se divide con un rugido. Los muros se derrumban, las torres se inclinan y las grietas se abren para revelar ríos de fuego fundido. Tus compañeros se dispersan presas del pánico cuando las ruinas amenazan con tragarte." #NT!
 lv_valyria_random_event.0090.a: "¡Huid antes que la tierra nos devore!" #NT!
 lv_valyria_random_event.0090.b: "Puede que haya tesoros escondidos en el fuego..." #NT!
 lv_valyria_random_event.0090.c: "¡Manténganse firmes! ¡No dejes que el miedo nos doblegue!" #NT!
  
 lv_valyria_random_event.0100.t: "Enjambre Asombroso" #NT!
 lv_valyria_random_event.0100.desc: "Una nube de diminutas criaturas dracónicas desciende sobre ti, cada una de las cuales no es más grande que un puño pero son innumerables. Silban y chillan, muerden y arañan, devorando todo lo vivo que encuentran a su paso. Las cenizas y el fuego los siguen mientras se mueven como una tormenta viviente, implacable y aterradora." #NT!
 lv_valyria_random_event.0100.a: "¡Lucha contra ellos... o muere!" #NT!
 lv_valyria_random_event.0100.b: "Intenta capturar algunos... si sobrevives." #NT!
 lv_valyria_random_event.0100.c: "Manténganse unidos y sobrevivan al enjambre." #NT!
  
 lv_valyria_random_event.0110.t: "Emboscada de la serpiente de ceniza" #NT!
 lv_valyria_random_event.0110.desc: "Enormes serpientes pálidas se deslizan por las llanuras de ceniza y atacan repentinamente a tu grupo. Sus mandíbulas se rompen con una velocidad aterradora y sus escamas irradian calor. Debes actuar rápidamente si esperas sobrevivir." #NT!
 lv_valyria_random_event.0110.a: "¡Levántate y lucha!" #NT!
 lv_valyria_random_event.0110.b: "¡Huye y sobrevive!" #NT!
  
 lv_valyria_random_event.0120.t: "Humos tóxicos" #NT!
 lv_valyria_random_event.0120.desc: "Un vapor espeso y acre se filtra por las fisuras del suelo ennegrecido y quema los ojos y la garganta. El aire está cargado de azufre: cada respiración amenaza con asfixiarte. Seguir adelante podría resultar fatal, pero retroceder costaría un tiempo precioso." #NT!
 lv_valyria_random_event.0120.a: "Cúbrete la boca y empuja." #NT!
 lv_valyria_random_event.0120.b: "Retírese por caminos más seguros." #NT!
 lv_valyria_random_event.0120.c: "Queme suministros para enmascarar el aire." #NT!
  
 lv_valyria_random_event.0130.t: "Secuelas: enfermedad" #NT!
 lv_valyria_random_event.0130.desc: "La tos destroza tu cuerpo a medida que la enfermedad se instala en tus pulmones, debilitando tu fuerza." #NT!
 lv_valyria_random_event.0130.a: "Manifestación contra la fiebre." #NT!
 lv_valyria_random_event.0130.b: "Me siento más débil cada hora." #NT!
  
 lv_valyria_random_event.0140.t: "Secuelas: Quemado" #NT!
 lv_valyria_random_event.0140.desc: "El dolor ardiente causado por las cenizas y el azufre quema tu piel. Las cicatrices arden y te recuerdan lo cerca que estuvo la muerte." #NT!
 lv_valyria_random_event.0140.a: "Vivo, por fin." #NT!
  
 lv_valyria_random_event.0150.t: "Secuelas: retirada" #NT!
 lv_valyria_random_event.0150.desc: "Logras alejarte del aire tóxico, pero el recuerdo de la proximidad a la muerte persiste, haciendo que cada paso se sienta incierto." #NT!
 lv_valyria_random_event.0150.a: "Seguimos adelante, destrozados pero vivos." #NT!
  
 lv_valyria_random_event.0160.t: "Consecuencias: suministros sacrificados" #NT!
 lv_valyria_random_event.0160.desc: "Quemaste lo poco que tenías para enmascarar los vapores. El aire se aclaró, pero la pérdida de recursos ahora acecha cada paso del viaje." #NT!
 lv_valyria_random_event.0160.a: "El sacrificio valió la pena." #NT!
 lv_valyria_random_event.0160.b: "Temo por lo que renunciamos." #NT!

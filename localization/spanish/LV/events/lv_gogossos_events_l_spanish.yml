 gogossos_expedition.0003: "No puedo creer lo que ven mis ojos" #NT!
 gogossos_expedition.0003_t: "Tumba del Señor Dragón" #NT!
 gogossos_expedition.0003_desc: "Al entrar a la tumba, noto que es una gran sala cuadrada con estatuas de caballeros valyrios y hermosos murales que representan a [old_valyria|E] en su cenit.\n\nVeo grandes pilas de oro cuidadosamente apiladas junto al gran sarcófago en el centro de la sala, con gemas preciosas y adornos de oro.\n\nAl quitar la tapa del sarcófago, encuentro un esqueleto dentro y..." #NT!
 gogossos_expedition.0003.a: "¿Qué tenemos aquí?" #NT!
 gogossos_expedition.0003.outcome: "Recuperas el tesoro que contiene y concluyes tu expedición en Gogossos." #NT!
  
 gogossos_expedition.0003.a.outcome.egg: "Encuentras un huevo de dragón." #NT!
 gogossos_expedition.0003.a.outcome.blood: "Encuentras un pergamino mágico de sangre." #NT!
 gogossos_expedition.0003.a.outcome.water: "Encuentras un pergamino mágico de agua." #NT!
 gogossos_expedition.0003.a.outcome.shadow: "Encuentras un pergamino mágico de sombras." #NT!
  
 gogossos_expedition.0004: "¡No puedo creer lo que ven mis ojos!" #NT!
 gogossos_expedition.0004_t: "¡No puedo creer lo que ven mis ojos!" #NT!
 gogossos_expedition.0004_desc: "Al entrar en la tumba y con la esperanza de saquear sus tesoros, me detengo inmediatamente en seco. Paralizada por el miedo, miré hacia arriba y vi..." #NT!
 gogossos_expedition.0004.a: "¡UN DRAGÓN!" #NT!
  
 gogossos_expedition.00041: "¿No es lo que parece?" #NT!
 gogossos_expedition.00041_t: "¿No es lo que parece?" #NT!
 gogossos_expedition.00041_desc: "Afortunadamente, parece que el dragón estuvo muerto hace mucho tiempo y no es más que un cadáver en descomposición, pero sobre lo que se asienta su inquietante cadáver es bastante real... ¡oro! El dragón muerto anidaba sobre un enorme tesoro de oro, aunque el resto de la tumba parece estar profanado. Todas las obras de arte y estatuas desfiguradas y dañadas hasta quedar irreconocibles." #NT!
 gogossos_expedition.00041.a: "Esperemos que esto no esté maldito como el oro de Thorin." #NT!
 gogossos_expedition.00041.outcome: "Concluye su expedición en Gogossos." #NT!
  
 gogossos_expedition.00042: "El cazador de dragones" #NT!
 gogossos_expedition.00042_t: "El cazador de dragones" #NT!
 gogossos_expedition.00042_desc: "La adrenalina todavía corre con fuerza por todo mi cuerpo. Por un minuto, nada pareció real. No estás seguro de lo que pasó, pero de una cosa sí estás seguro es de que ese dragón ya no te molestará más. Has matado a un dragón y has vivido para contarlo." #NT!
 gogossos_expedition.00042.a: "¡Al menos obtuve algo de oro por mis problemas!" #NT!
 gogossos_expedition.00042.outcome: "Concluye su expedición en Gogossos." #NT!
  
 gogossos_expedition.0050: "¿Qué está pasando en el mundo?" #NT!
 gogossos_expedition.0050_t: "¿Qué está pasando en el mundo?" #NT!
 gogossos_expedition.0050_desc: "Después de viajar por la Selva durante unas horas, me encontré con un campamento donde me encontré con un pequeño enano avivando el fuego. Levantó la vista y nuestras miradas se encontraron, y habló suavemente con un fuerte acento\n\n"¿Y qué crees que estás haciendo aquí, [Select_CString( ROOT.Char.IsFemale, 'girl', 'boy' )]?" preguntó el enano, a lo que respondí que deseaba explorar las ruinas de Gogossos en busca de tesoros. El enano se acarició la barba mientras pensaba.\n\nDe repente, dejó escapar una risa siniestra y habló en perfecto alto valyrio. La magia llenó los ojos del enano." #NT!
 gogossos_expedition.0050.a: "No me siento tan bien..." #NT!
 gogossos_expedition.0050.a.bear: "Tu expedición en Gogossos termina y regresas a casa, porque te has convertido en un oso tonto.\n#weak ¡No puedes soportarlo!#!" #NT!
  
 gogossos_expedition.0060: "La biblioteca" #NT!
 gogossos_expedition.0060_t: "La biblioteca" #NT!
 gogossos_expedition.0060_desc: "Parece que me he topado con una biblioteca antigua.\n\nPuedo ver filas y filas de estantes, algunos con libros y otros decrépitos y desmoronados. Puedo distinguir una mesa en la parte de atrás con un esqueleto con túnicas andrajosas, sentado con varios libros dispuestos. Puedo distinguir los títulos de cada uno." #NT!
 gogossos_expedition.0060.outcome: "Concluye su expedición en Gogossos." #NT!
 gogossos_expedition.0060.a: "Un libro sobre técnicas marciales." #NT!
 gogossos_expedition.0060.b: "un libro sobre filosofia" #NT!
 gogossos_expedition.0060.c: "Un libro llamado #emphasis El arte de la diplomacia#!" #NT!
 gogossos_expedition.0060.d: "Un libro que explora la administración y la gobernanza" #NT!
 gogossos_expedition.0060.e: "Un libro llamado #emphasis El Príncipe#!" #NT!
  
 gogossos_expedition.0119: "Piratas en el horizonte" #NT!
 gogossos_expedition.0119_t: "Piratas en el horizonte" #NT!
 gogossos_expedition.0119_desc: "Después de zarpar hace muchos días hacia nuestra aventura en Gogossos, vimos un barco en el horizonte con una bandera negra, típica de los piratas que navegan por estas aguas.\n\nEsperemos que no nos vean..." #NT!
 gogossos_expedition.0119.z: "Odio a los piratas..." #NT!
  
 gogossos_expedition.0110: "¡Nos han abordado!" #NT!
 gogossos_expedition.0110_t: "¡Nos han abordado!" #NT!
 gogossos_expedition.0110_desc: "¡Los piratas pronto capturaron nuestro barco y nos abordaron! Su capitán y sus hombres saltan a cubierta con las espadas levantadas más rápido de lo que esperaba. Esto no tiene buena pinta..." #NT!
 gogossos_expedition.0110.a: "Esto no pinta nada bien..." #NT!
 gogossos_expedition.0110.a.outcome: "Te entregas a los piratas." #NT!
 gogossos_expedition.0110.b: "¡Preparad las yardas, monos de cubierta torpes! ¡Un día para morir es un día por el que vale la pena vivir!" #NT!
 gogossos_expedition.0110.b.outcome: "Comienzas un duelo con el capitán pirata." #NT!
  
 gogossos_expedition.0120: "Piratas evadidos" #NT!
 gogossos_expedition.0120_t: "Piratas evadidos" #NT!
 gogossos_expedition.0120_desc: "Parecería que los piratas no nos vieron, o si lo hicieron, seguramente no estaban interesados ​​en nuestro barco.\n\nHemos llegado a tierra sanos y salvos. A partir de aquí, el verdadero peligro comienza cuando la jungla de Gogosita nos llama." #NT!
 gogossos_expedition.120.a: "Adelante vamos y vemos qué hay por descubrir." #NT!
  
 gogossos_expedition.0111: "No hay rival para mi acero" #NT!
 gogossos_expedition.0111_t: "No hay rival para mi acero" #NT!
 gogossos_expedition.0111_desc: "El pirata no fue rival para mi acero y [pirate_lord.GetSheHe|l] fue asesinado. Los hombres restantes del señor pirata huyeron rápidamente, permitiéndonos continuar nuestro viaje. Esperemos que todo vaya viento en popa desde aquí." #NT!
 gogossos_expedition.0111.a: "Esperemos que hayan sido el último estorbo." #NT!
 gogossos_expedition.0111.a.outcome: "Tu expedición continúa." #NT!
  
 gogossos_expedition.0112: "Mi orgullo está empañado" #NT!
 gogossos_expedition.0112_t: "Mi orgullo está empañado" #NT!
 gogossos_expedition.0112_desc: "El señor pirata era demasiado fuerte y hábil para que yo pudiera vencerlo, y fui golpeado y asesinado. Aunque vivo, mi orgullo está herido y ahora estoy a merced de los piratas." #NT!
 gogossos_expedition.0112.a: "¡Maldiciones!" #NT!
  
 gogossos_expedition.1001: "El ascenso" #NT!
 gogossos_expedition.1001_t: "El ascenso" #NT!
 gogossos_expedition.1001_desc: "Después de estrellarnos en la playa, nos tomamos un momento para recuperarnos y contemplar el paisaje que nos rodeaba. Los imponentes acantilados nos encerraron en una prisión natural, dejándonos solo un camino hacia adelante: hacia arriba. Sin otra forma de explorar la isla, debemos comenzar nuestro ascenso, escalando las paredes rocosas que se alzan sobre nosotros, con la esperanza de encontrar respuestas, o tal vez incluso tesoros, más allá de sus alturas." #NT!
 gogossos_expedition.1001.a: "¡Adelante y hacia arriba!" #NT!
 gogossos_expedition.1001.b: "¡A volar, [my_dragon.GetNameNoTooltip]!" #NT!
  
   gogossos_expedition.1006:0 "The Final Descent 
   gogossos_expedition.1006_t:0 "The Final Descent 
 gogossos_expedition.1006_desc: "Mis dedos arañaron la roca que se desmoronaba, el corazón latía con fuerza mientras me elevaba más. El viento aullaba, mordiendo mi piel, pero me obligué a seguir subiendo. Sólo un poco más, luego el saliente bajo mi pie cedió. Por un momento único y desgarrador, me sentí ingrávido, mis brazos agarraban el aire vacío. El mundo giró mientras caía en picado, la playa de abajo se precipitaba hacia mí. Un grito ahogado salió de mis labios, no de miedo, sino de comprensión: esto era todo. Luego, silencio." #NT!
 gogossos_expedition.1006.a: "None" #NT!
  
 gogossos_expedition.1002: "El Palacio de Mármol" #NT!
 gogossos_expedition.1002_t: "El Palacio de Mármol" #NT!
 gogossos_expedition.1002_desc: "Mientras subo la escarpada ladera del acantilado, me sacudo el polvo y los escombros que se adhieren a mí y exhalo mientras el mundo se desarrolla bajo mi mirada. La tierra se extiende a lo largo y ancho, un impresionante tapiz de rocas irregulares, densa jungla y colinas bañadas por el brillo dorado del sol moribundo. La niebla se eleva desde el dosel de abajo, arremolinándose como zarcillos fantasmales entre los árboles centenarios, sus hojas esmeralda brillando con los restos del calor del día. Pero más allá de la jungla, más allá de la belleza salvaje e indómita, mis ojos se fijan en algo verdaderamente magnífico: un palacio de piedra blanca pura, majestuoso y desafiante en lo alto de una colina distante. Sus imponentes agujas perforan el cielo, reflejando la última luz del día, brillando como la ciudadela de dioses olvidados.\n Un escalofrío me recorre, una atracción innegable, como si el destino mismo me estuviera llamando. Allí debe ser donde se encuentra el tesoro, sellado tras paredes de mármol, velado por los ecos de los imperios perdidos. Pero el tiempo está en mi contra. La jungla de abajo será traicionera por la noche, sus sombras esconderán criaturas desconocidas, sus profundidades estarán llenas de susurros de peligro." #NT!
  
 gogossos_expedition.1007: "¡Vaya al palacio!" #NT!
  
 gogossos_expedition.1003: "El palacio silencioso" #NT!
 gogossos_expedition.1003_t: "El palacio silencioso" #NT!
 gogossos_expedition.1003_desc: "Al cruzar la gran entrada del palacio, se desarrolla ante mí un extraño contraste. Desde el exterior, sus relucientes paredes blancas y sus imponentes agujas permanecen intactas por el tiempo, majestuosas e inquebrantables. Pero en el interior, la decadencia se ha apoderado de él. Los alguna vez majestuosos salones se están desmoronando, sus arcos dorados están agrietados y desgastados. El polvo ahoga el aire y el olor a podredumbre persiste en el silencio estancado. Muebles rotos, hace mucho tiempo reducidos a ruinas, yacen esparcidos sobre los pisos de piedra, sus telas que alguna vez fueron ricas se redujeron a nada más que restos andrajosos del pasado.\n\nBusco, adentrándome más profundamente en los pasillos abandonados, pero no encuentro nada: ni tesoro, ni señal de vida, solo ecos de una época olvidada. Se siente como si el palacio en sí fuera una cáscara, una cáscara vacía de grandeza que el tiempo ha abandonado hace mucho tiempo. Sin embargo, justo cuando la duda comienza a invadirme, llego a una escalera que desciende hacia las sombras.\n\nAvanzando, desciendo al sótano, donde los últimos rayos de sol se filtran a través de intrincados espejos de cristal, proyectando brillantes rayos de oro y violeta a través de la cámara. La luz capta algo impresionante: antiguas obras de arte valyrias, grabadas en la piedra sobre la gran puerta que tengo delante. Las imágenes cuentan una historia de poder y fuego, de poderosos Señores Dragón reinando sobre los cielos, con sus grandes bestias enroscándose entre nubes de llamas. Sus ojos, tallados en piedras preciosas preciosas, brillan en la luz fracturada, como si me miraran, me juzgaran.\n Permanezco, cautivado por el arte, por el puro peso de la historia que presiona este lugar. Pero entonces me doy cuenta de algo escalofriante: en todo este palacio no he visto señales de muertos. Sin esqueletos. No hay restos de aquellos que una vez llamaron hogar a este lugar.\n Un lugar abandonado por el tiempo... pero aparentemente intacto por la muerte.\nUn escalofrío recorre mi columna mientras me acerco a la gran puerta, mi mano se cierne sobre su fría superficie. Algo está mal aquí. Y estoy a punto de descubrir qué." #NT!
 gogossos_expedition.1003.a: "Supongo que vamos al sótano." #NT!
 #palace.1: "El único camino a seguir es hacia abajo...." #NT!
  
 gogossos_expedition.1004: "El mural" #NT!
 gogossos_expedition.1004_t: "El mural" #NT!
 gogossos_expedition.1004_desc: "A medida que desciendo más profundamente en las entrañas del palacio, la escalera de caracol parece interminable y el aire se vuelve más frío con cada paso. Las sombras se retuercen y se retuercen a lo largo de los antiguos muros de piedra, pero sigo adelante, impulsada por curiosidad e inquietud a partes iguales. Finalmente, llego al fondo: una enorme cámara, imposiblemente iluminada a pesar de las profundidades. La luz, suave y dorada, se derrama desde fuentes invisibles, proyectando un brillo de otro mundo sobre las paredes.\n\nMe quedo sin aliento cuando observo ante mí otro magnífico mural, su arte incomparable, que irradia una sensación de asombro y reverencia. Éste representa dragones en toda su gloria majestuosa, cada uno único, cada uno impresionante en su esplendor.\n\nEl Poderoso Dragón Púrpura, con sus escamas brillando como amatista, desata un torrente de fuego, su poder incomparable.\n\nEl Dragón Blanco, veloz y feroz, parece casi desdibujarse en movimiento, su esbelta estructura corta las nubes como una espada.\n El Dragón Rojo, con sus ojos ardiendo con malicia, se alza como un tirano, su presencia que impone miedo y pavor.\n\nY finalmente, el Dragón Negro: misterioso, mítico, su forma envuelta en un aura de oscura majestad, como si existiera entre este mundo y el siguiente.\n\nSolo tengo un momento para maravillarme ante la belleza del mural, mientras mis dedos trazan el borde de las intrincadas tallas. Entonces llega el sonido. Un gemido bajo y familiar de una antigua piedra moviéndose. Mi corazón se detiene en mi pecho y un escalofrío recorre mi columna mientras el ruido se vuelve más fuerte, más violento. Me doy vuelta, con los ojos muy abiertos por la alarma, justo cuando el suelo debajo de mí cede.\n El mundo se inclina y yo quedo ingrávido, mi grito se atasca en mi garganta mientras la piedra se desmorona en la oscuridad. Mi mente apenas tiene tiempo de registrar el terror antes de sumergirme en lo desconocido que hay debajo, y el tenue brillo del mural se desvanece mientras caigo." #NT!
 gogossos_expedition.1004.a: "Oh, no..." #NT!
  
 # evil_death_events.1: "No puedo soportarlo..." #NT!
 # evil_death_events.1_t: "No puedo soportarlo..." #NT!
 # evil_death_events.1_desc: "No puedo soportarlo más. Estas cuatro puertas están frente a mí, cada una pulsando con una energía invisible, pero ninguna ofrece una salida. Púrpura, Blanco, Rojo, Negro: no importa cuánto tiempo los mire, no importa cuánto busque respuestas en sus intrincados diseños, siguen siendo un enigma. No hay escapatoria, no hay salida de este miserable lugar. Sólo la piedra fría e inquebrantable, el brillo espeluznante de los cristales y el silencio opresivo que parece extenderse hasta la eternidad.\n\nEstoy condenado a consumirme aquí, atrapado en esta pesadilla sin fin, sin nada más que estas puertas malditas y mi propia desesperación creciente por tener compañía. Ya me están fallando las fuerzas, mi cuerpo se debilita a cada momento que pasa. Puedo sentir el vacío arrastrándose, mi mente arañando los límites de la cordura.\n\nPero no dejaré que termine así. Me niego a convertirme en una cáscara, a convertirme en una sombra de mí mismo, olvidado y consumido por este lugar. Si este va a ser mi fin, será en mis términos, por mi propia mano. No dejaré que me lleve la deshonra, ni las lentas y crueles garras del hambre.\n\nMiro las puertas por última vez, su presencia silenciosa se burla de mí, y me armo de valor para lo que debo hacer. Es mejor enfrentar lo desconocido que dejar que este palacio maldito me despoje de todo lo que soy. Es mejor ir con desafío en mi corazón que dejar que la oscuridad me reclame pieza por pieza." #NT!
 # sewingside.1: "Saco mi espada por última vez..." #NT!
  
 gogossos_expedition.1005: "Emporio de la puerta del oso" #NT!
 gogossos_expedition.1005_t: "Emporio de la puerta del oso" #NT!
 gogossos_expedition.1005_desc: "Mientras me encuentro bajo el espeluznante brillo de los cristales, la cámara se extiende ante mí, vasta y vacía, salvo por cuatro puertas que dominan la pared del fondo. Cada puerta es enorme y está tallada con diseños intrincados, sus detalles iluminados por la luz brillante de los cristales de arriba. Mi corazón late con fuerza mientras doy un paso más cerca, atraído por su siniestra presencia.\n\nLas puertas no se parecen a nada que haya visto antes, cada una irradia su propia aura distintiva, como si estuvieran imbuidas de poder.\n\nLa Puerta Púrpura brilla como amatista pulida, su superficie está llena de tallas de llamas y dragones serpentinos retorcidos. El fuego que respiran parece casi moverse cuando la luz lo golpea justo y el aire a su alrededor zumba con una energía sobrenatural.\n\nLa Puerta Blanca, en marcado contraste, es elegante y suave, como marfil pulido. Sus tallas representan un dragón en vuelo, su forma esbelta y elegante, con las alas extendidas como si estuvieran atrapados en un movimiento eterno. La luz fría de los cristales le da un brillo casi espectral, como si no hubiera sido tocada por el tiempo.\n\nLa Puerta Roja es audaz y aterradora. Su superficie está grabada con patrones irregulares y caóticos, las líneas profundas y ásperas, como si el fuego mismo hubiera quemado la madera. Un dragón monstruoso con ojos crueles y penetrantes está tallado en su marco, y su presencia irradia amenaza. Incluso estar cerca de ella hace que el aire se sienta pesado y opresivo.\n\nLa Puerta Negra es la más enigmática. Parece absorber la luz, su superficie es lisa y oscura como la obsidiana. Las sombras parecen bailar a través de él, moviéndose y retorciéndose como si tuvieran vida propia. Las tallas aquí son sutiles y difíciles de distinguir, pero el dragón representado parece de otro mundo, casi incomprensible: más espíritu que bestia.\n\nCada puerta pulsa débilmente con una fuerza invisible, como si me hiciera señas para avanzar. Sin embargo, no hay indicios de lo que hay detrás de ellos. Mis ojos parpadean entre ellos, mi mente corre. ¿Es este el fin del palacio? ¿O es el comienzo de algo mucho peor?\n\nMis instintos me gritan que elija con cuidado, pero pase lo que pase, sé que ya no hay vuelta atrás. Una de estas puertas abre mi camino hacia adelante... o mi perdición." #NT!
 gogossos_expedition.1005.a: "Puerta morada" #NT!
 gogossos_expedition.1005.b: "Puerta Blanca" #NT!
 gogossos_expedition.1005.c: "puerta roja" #NT!
 gogossos_expedition.1005.d: "Puerta Negra" #NT!
 gogossos_expedition.1005.z: "Ya no quiero hacer esto...." #NT!
  
 gogossos_expedition.1008: "¡Los pasillos oscuros siguen adelante!" #NT!
 gogossos_expedition.1008_t: "¡Los pasillos oscuros siguen adelante!" #NT!
 gogossos_expedition.1008_desc: "Lo he logrado. De alguna manera, he superado la enloquecedora trampa de la puerta de la habitación y ahora me encuentro más profundamente en las retorcidas profundidades del palacio. Mi respiración es entrecortada, mi corazón late con fuerza en mi pecho mientras me tomo un momento para estabilizarme. El aire aquí se siente más pesado, más frío, como si me estuviera presionando, y el tenue resplandor de las luces de cristal aún persiste, guiándome hacia adelante.\n\nAnte mí se extiende un largo corredor, increíblemente largo, cuyo final se traga las sombras. Las paredes están talladas en la misma piedra antigua que el resto del palacio, pero aquí están revestidas con runas que brillan débilmente: patrones de lenguaje olvidado que pulsan suavemente como si estuvieran vivos. El corredor parece estar vivo con una energía espeluznante, una extraña vibración que puedo sentir en mis huesos.\n\nEl suelo debajo de mí está húmedo, resbaladizo por la condensación, y cada paso que doy envía un eco por el corredor que rebota hacia mí como un susurro. Se siente como si el lugar estuviera observando, escuchando, esperando.\n\nHay algo inquietante en este pasillo, algo que me pone los pelos de punta. El aire se vuelve más frío con cada paso y un extraño y grave zumbido comienza a llenar el silencio. Es distante al principio, pero cuanto más camino, más fuerte se vuelve, como el sonido de un latido distante, profundo y resonante.\n\nEl corredor parece interminable, las sombras delante se niegan a ceder ante la luz. Cada instinto me dice que regrese, que encuentre otro camino, pero sé que ya no hay vuelta atrás. Sea lo que sea que haya al final de este corredor, debo afrontarlo. Mis dedos se aprietan alrededor de la empuñadura de mi arma mientras sigo adelante, cada paso me lleva más hacia lo desconocido." #NT!
 gogossos_expedition.1008.a: "Al menos no son las trastiendas...." #NT!
  
 gogossos_expedition.1009: "¡El mago!" #NT!
 gogossos_expedition.1009_t: "¡El mago!" #NT!
 gogossos_expedition.1009_desc: "Por fin, el pasillo termina. Ante mí, una vieja puerta de madera yace destrozada en el suelo, con sus restos astillados esparcidos como los restos de una barrera olvidada hace mucho tiempo. Más allá del marco roto se encuentra una habitación diferente a todo lo que he encontrado en este palacio: las habitaciones de un mago, intactas por el tiempo pero pesadas por el peso del abandono.\n\nLa habitación es una obra maestra caótica, sus paredes revestidas con altísimas estanterías repletas de tomos antiguos, pergaminos y fragmentos de pergamino. El aire está cargado con el leve aroma del papel envejecido y el sabor acre de los experimentos alquímicos latentes durante mucho tiempo. Frascos de vidrio, algunos rotos y otros aún intactos, abarrotan las mesas, llenos de líquidos que brillan débilmente bajo la pálida luz de los cristales de arriba. Extraños dispositivos, con un propósito insondable, se encuentran junto a ellos, con sus marcos de latón y plata empañados pero extrañamente intrincados.\n\nPero es la mesa al fondo de la habitación la que llama mi atención. Allí, desplomado sobre su superficie, hay un esqueleto envuelto en una andrajosa túnica con capucha. Los huesos están amarillentos con la edad, pero hay algo extrañamente deliberado en su posición. Es como si el mago (si eso es lo que era) supiera que se acercaba el fin y eligiera este lugar como su lugar de descanso final.\n\nFrente al esqueleto, esparcidos por la mesa, se encuentra una colección de objetos. En el centro hay un diario polvoriento encuadernado en cuero, con la cubierta rota pero intacta. El aire a su alrededor se siente pesado, como si contuviera secretos destinados a permanecer enterrados. Al lado del diario, brillando incluso en la tenue luz, hay varios lingotes de oro, con los bordes gastados pero su valor inconfundible.\n\nMe acerco, respirando entrecortadamente mientras lo asimilo todo. El diario parece casi llamarme, su presencia llama mi atención mucho más de lo que el oro jamás podría hacerlo. Mis dedos se ciernen sobre su cubierta, vacilantes. Parece que esta sala contiene respuestas, o quizás más preguntas.\n\n¿Quién era este mago? ¿Qué le pasó? ¿Y por qué siento como si me hubiera topado con algo que nunca debió ser encontrado?" #NT!
  
 gogossos_expedition.1009.b: "¿Qué dice el diario?" #NT!
  
 gogossos_expedition.1210: "El sueño de toda una vida..." #NT!
 gogossos_expedition.1210_t: "El sueño de toda una vida....." #NT!
 gogossos_expedition.1210_desc: "Cojo el diario con manos temblorosas y le limpio la fina capa de polvo que se ha depositado sobre él. Mis dedos trazan la cubierta de cuero agrietada mientras hojeo sus frágiles páginas, la tinta se ha desvanecido pero aún es legible. Examino rápidamente la última entrada, atraído por los pensamientos finales del mago muerto hace mucho tiempo.\n\nLas palabras me hielan hasta la médula. Escribió sobre sus últimas horas, sobre cómo la plaga de sangre gogosita se había apoderado de su cuerpo, asolándolo desde dentro. Sus descripciones son vívidas e inquietantes: la fiebre, el sangrado y la debilidad que lo consumieron, robándole la fuerza para continuar su trabajo. Lamentó sus experimentos inacabados, su potencial desperdiciado y el legado que nunca dejaría atrás. Su desesperación se filtra desde la página, cada palabra es un doloroso recordatorio de cuán cruel y definitivo debe haber sido su final.\n\nPero antes de que pudiera profundizar más, la habitación comenzó a temblar. Un ruido sordo, como el gruñido de una bestia que despierta, vibra a través de las paredes de piedra. El polvo cae desde arriba en espesas nubes y la tenue luz de los cristales comienza a parpadear salvajemente. Miro hacia arriba cuando pequeñas rocas comienzan a caer, seguidas por los crujidos del techo que se mueven bajo una presión invisible. La habitación se está derrumbando.\n\nEl pánico inunda mis venas. Empujo el diario de nuevo sobre la mesa (es demasiado pesado, demasiado frágil para transportarlo) y en su lugar agarro las relucientes barras de oro. Mis instintos me gritan que corra, que escape antes de ser enterrado vivo junto a los restos del mago.\n\nCorro hacia la puerta (o lo que queda de ella), pero justo cuando llego al umbral, la escritura rúnica tallada en el suelo cobra vida. Los símbolos brillantes pulsan con una intensidad cegadora, llenando la habitación con un resplandor de otro mundo. El sonido de la habitación al derrumbarse es ahogado por un zumbido agudo, casi ensordecedor, y antes de que pueda procesar lo que está sucediendo, mi visión es consumida por una luz blanca.\n\nCuando la luz se desvanece, ya no estoy en el palacio.\n\nEstoy parado en una playa. La cálida arena se mueve bajo mis pies y el sonido de las olas rompiendo contra la orilla llena mis oídos. El sabor salado del aire del mar contrasta imposiblemente con la atmósfera fría y decadente que acababa de abandonar. Mi corazón se acelera mientras doy vueltas, tratando de entender lo que acaba de pasar. El palacio, la habitación que se derrumba, el mago... todo desapareció, reemplazado por el horizonte infinito del océano y el cielo.\n\nAgarro las barras de oro con fuerza, mi aliento aún está entrecortado por el caos, mi mente se acelera con preguntas. ¿Cómo estoy aquí? ¿Por qué las runas me teletransportaron a este lugar? ¿Fue un dispositivo de seguridad dejado por el mago o alguna fuerza invisible que intervino?\n\nLa única certeza es que he escapado... por ahora. Pero esta playa... se siente demasiado tranquila, demasiado perfecta. Y en el fondo sabía que todo era real." #NT!
 gogossos_expedition.1210.b: "Vamos... sólo vámonos a casa..." #NT!
 gogossos_expedition.1210.b.outcome: "Concluye su expedición en Gogossos." #NT!
 ambush.1: "AAAAAAAGHH!!!!" #NT!
  
 gogossos_expedition.1100: "La cámara del dragón" #NT!
 gogossos_expedition.1100_t: "La cámara del dragón" #NT!
 gogossos_expedition.1100_desc: "Mientras bajo al sótano, un escalofrío recorre mi espalda. El aire está lleno de polvo y el olor de algo antiguo, algo olvidado hace mucho tiempo. Mis pasos resuenan en la tenue luz, pero luego me detengo abruptamente, congelada en el lugar.\n\nAnte mí, asomando en las sombras, hay un dragón. Un dragón vivo y real. Su enorme forma está enroscada en la oscuridad, y sus escamas brillan débilmente incluso en la penumbra. Mi aliento se queda atrapado en mi garganta. Esto no debería ser posible. Los Señores Dragón de antaño hace tiempo que se han convertido en leyenda. ¿Cómo podría una de sus bestias seguir existiendo aquí, escondida bajo este lugar?\n\nUna mezcla de asombro y terror se apodera de mí, pero en medio del miedo, otro pensamiento se apodera de mí. Hay más en este lugar de lo que jamás imaginé. Secretos enterrados bajo siglos, misterios esperando ser desentrañados.\n\nPero no vine hasta aquí sólo para regresar con las manos vacías. Si este dragón se ha conservado aquí durante tanto tiempo, debe haber algo de gran valor escondido dentro de estos muros. Y tengo la intención de reclamar mi recompensa" #NT!
  
 gogossos_expedition.1100.a: "¡Mataré a esta bestia y reclamaré mi premio!" #NT!
 gogossos_expedition.1100.b: "¡Soy de la sangre del dragón! ¡Te inclinarás ante mí!" #NT!
 gogossos_expedition.1100.b.outcome: "Intentas domesticar al dragón. Independientemente del resultado, tu expedición a Gogossos termina aquí." #NT!
  
 gogossos_expedition.1101: "El Campeón" #NT!
 gogossos_expedition.1101_t: "El Campeón" #NT!
 gogossos_expedition.1101_desc: "La batalla fue feroz, cada momento una prueba de voluntad y resistencia. El dragón rugió y su aliento de fuego quemó el aire, pero yo ya había aprendido a leer sus movimientos. Con cada atronador golpe de sus garras, bailaba entre la muerte y la supervivencia, y mi espada encontraba aberturas donde las escamas se separaban lo suficiente. Se abalanzó y rodé debajo de él, hundiendo mi arma profundamente en su parte más expuesta. Un chillido ensordecedor recorrió la cámara mientras la bestia se agitaba, su enorme cola rompía piedras en su lucha final y desesperada.\n\nCon una última oleada de fuerza, me subí a su espalda, agarrando las crestas de su columna mientras clavaba mi espada a través de la base de su cráneo. El dragón dejó escapar un último y tembloroso suspiro antes de colapsar, su enorme cuerpo sacudió el suelo mientras caía. Me quedé de pie junto a él, con el pecho agitado, la sangre y el hollín adheridos a mi piel. La otrora poderosa criatura yacía quieta; su reinado largamente olvidado finalmente había llegado a su fin.\n\nEl silencio que siguió fue pesado, pero no sentí arrepentimiento. Había matado a una leyenda y ahora, el botín de su antigua guarida era mío y podía tomarlo." #NT!
  
 gogossos_expedition.1101.a: "¿Qué es esto?" #NT!
  
 gogossos_expedition.1102: "La prueba de sangre" #NT!
 gogossos_expedition.1102_t: "La prueba de sangre" #NT!
 gogossos_expedition.1102_desc: "Después de matar al dragón y reclamar su tesoro, volví mi mirada hacia el otro extremo de la cámara, donde algo mucho más siniestro me esperaba. Una enorme puerta, forjada en acero ennegrecido, se alzó ante mí. Retorcida y dentada, su superficie mostraba la imagen de un rostro gruñón, congelado en una mueca eterna, con sus fauces abiertas lo suficientemente anchas como para tragarse a un hombre entero.\n\nFrente a la puerta había un pilar de piedra, antiguo y desgastado, sobre el cual descansaba un sencillo cuenco. A primera vista no tenía nada de especial, salvo por las extrañas runas grabadas a lo largo de su borde, símbolos que parecían moverse y retorcerse bajo mi mirada. Dentro del cuenco, una daga oxidada yacía inmóvil, su borde alguna vez afilado desgastado por el tiempo y la descomposición.\n\nCuando me acerqué, un escalofrío recorrió mi espalda. Susurros, suaves, insidiosos, rozaron mi mente como dedos fríos. Me hicieron señas, murmurando palabras que no podía entender pero que de alguna manera sentía dentro de mis huesos. Tiraron de mí, instándome a avanzar, obligándome a tomar la daga.\n\nLa ofrenda que exigía era clara. Sangre. El mío. Las runas palpitaron débilmente como si sintieran mi vacilación, los susurros se volvieron impacientes. Lo que hubiera más allá de esa puerta no se revelaría sin sacrificio." #NT!
  
 gogossos_expedition.1102.a: "Lo mejor es una pequeña ofrenda." #NT!
 gogossos_expedition.1102.b: "Sólo una gran oferta será suficiente" #NT!
 gogossos_expedition.1102.c: "No creo que esto sea prudente. lo dejaré en paz" #NT!
 gogossos_expedition.1102.c.outcome: "Concluye su expedición en Gogossos." #NT!
  
 gogossos_expedition.2001: "¡Eres un idiota!" #NT!
 gogossos_expedition.2001_t: "Eres un tonto" #NT!
 gogossos_expedition.2001_desc: "El cuchillo, aunque parecía desgastado y sin filo, partió mi piel como si fuera mantequilla. No hubo resistencia ni dolor, sólo la inquietante facilidad con la que atravesó la carne. La sangre brotó instantáneamente, fluyendo en espesos riachuelos carmesí hacia el cuenco que esperaba. Las runas que recubrían su borde brillaron con un brillo enfermizo, como si bebieran profundamente de mi ofrenda.\n\nEntonces, la puerta gimió. Un sonido lento y chirriante, de metal chirriando contra piedra. El rostro retorcido tallado en él pareció cambiar, su expresión que antes era gruñona se transformó en algo mucho peor: una sonrisa. Una sonrisa profunda y cómplice. Una oleada de mareos me invadió. Mi visión se volvió borrosa y se oscureció en los bordes. Me balanceé sobre mis pies, luchando por mantenerme erguido, pero mis extremidades se sentían increíblemente pesadas. Aun así, lo vi: la puerta se estaba abriendo. Todo lo que estuviera más allá de eso estaba a mi alcance. Me obligué a avanzar, deseando que mi cuerpo se moviera. Pero luego me caí. Un colapso brusco e implacable sobre el frío suelo de piedra. El pánico se apoderó de mí mientras intentaba levantarme, pero ya no tenía fuerzas. La daga se me escapó de los dedos y resonó inútilmente a mi lado. Y entonces, llegó el verdadero horror.\n\nEl dolor. Comenzó como una sensación lenta y escalofriante debajo de mi piel, luego se convirtió en agonía. Mi carne hormigueó, luego ardió y luego se marchitó. Jadeé, pero no pude respirar. Mis venas se ennegrecieron, mi piel se agrietó y se peló, desprendiéndose en sábanas repugnantes. La sangre ya no fluía sólo de mi mano, sino de todas partes. Mi cuerpo se estaba desmoronando, pudriéndose ante mis propios ojos. Intenté gritar, pero mi garganta se derrumbó y mi voz fue robada por la misma fuerza que había tratado de despertar. Lo último que vi antes de que me atrapara la oscuridad fue la puerta, abierta de par en par. Y más allá... sombras, moviéndose y observando.\n\nLuego, nada." #NT!
 gogossos_expedition.2001.dumbass: "None" #NT!
  
 gogossos_expedition.2002: "La bóveda de los deseos" #NT!
 gogossos_expedition.2002_t: "La bóveda de los deseos" #NT!
 gogossos_expedition.2002_desc: "El cuchillo, aunque parecía desgastado y sin filo, partió mi piel como si fuera mantequilla. No hubo resistencia ni dolor, sólo la inquietante facilidad con la que atravesó la carne. La sangre brotó instantáneamente, fluyendo en espesos riachuelos carmesí hacia el cuenco que esperaba. Las runas que recubrían su borde brillaron con un brillo enfermizo, como si bebieran profundamente de mi ofrenda.\n\nEntonces, la puerta gimió. Un sonido lento y chirriante, de metal chirriando contra piedra. El rostro retorcido tallado en él pareció cambiar, su expresión que antes era gruñona se transformó en algo mucho peor: una sonrisa. Una sonrisa profunda y cómplice.\n\nPero entonces, sucedió algo inesperado. Una sensación de hormigueo agudo recorrió mi palma y cuando miré hacia abajo, la herida había desaparecido. Mi piel se había vuelto a unir, la ofrenda de sangre había sido tomada, pero no dejaba rastro de daño. Mi respiración era inestable cuando avancé, más allá del umbral de la puerta ahora abierta, hacia la cámara más allá.\n\nLa Bóveda de los Deseos.\n\nMis ojos se abrieron cuando observé la vista ante mí: artefactos dorados apilados en lo alto, copas con joyas brillando a la tenue luz de las antorchas, piedras preciosas esparcidas como simples guijarros en el suelo. Riqueza más allá de lo imaginable, intacta durante siglos. Éste era el verdadero tesoro, el tesoro que el dragón había estado guardando, el premio escondido más allá de su forma monstruosa.\n\nPero entre las riquezas relucientes, un objeto atrajo mi atención por encima de todos los demás. Sentado sobre un pedestal, bañado en un brillo etéreo, estaba el artefacto que había estado buscando. La razón por la que había llegado tan lejos. Mi corazón latía con fuerza mientras me acercaba, el peso de mi viaje culminó en este único y tan esperado momento." #NT!
 gogossos_expedition.2002.a: "Es hermoso..." #NT!
 gogossos_expedition.2002.a.outcome: "Concluye su expedición en Gogossos." #NT!
  
 evil_death_events.1: "No puedo soportarlo más..." #NT!
 evil_death_events.1_t: "No puedo soportarlo más..." #NT!
 evil_death_events.1_desc: "Las cuatro puertas están frente a mí: violeta, roja, blanca y negra. Los he probado todos, pasando por cada uno de ellos, sólo para ser arrastrado de regreso a esta misma habitación maldita. No importa el camino que tome, no importa cuántas veces elija, siempre termino aquí. Un bucle retorcido, una prisión sin paredes.\n\nAprieto los puños, mi respiración se entrecorta mientras la frustración me araña. No puedo seguir haciendo esto. El ciclo interminable, la repetición asfixiante... me está rompiendo. Pero me niego a dejar que la locura se apodere de mí. Me niego a morir de hambre, a morirme en este lugar, esperando un escape que no existe.\n\nSi esto es todo lo que hay, entonces lo terminaré en mis propios términos." #NT!
  
 sewingside.1: "Saco mi espada, una última vez..." #NT!

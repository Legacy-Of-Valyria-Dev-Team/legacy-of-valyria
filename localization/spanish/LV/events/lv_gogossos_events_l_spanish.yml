l_spanish:
 funding_expedition.0001: "Financiar una expedición" #NT!
 fund_expedition_0001_t: "Financiar una expedición" #NT!
 fund_expedition_0001_desc: "He decidido emprender una expedición, obtener los mapas necesarios de las regiones autorizadas alrededor de las Islas Basilisco y planificar cuántas provisiones necesitaré. Ahora debo decidir un destino. Entre Gogossos y Sothoryos, el primero es la opción más segura, aunque es mucho menos probable que proporcione objetos de valor. Podría tomar el camino más traicionero y dirigirme a Sothoryos, cuyas tierras, en su mayoría vírgenes, seguramente estarán llenas de tesoros, pero repletas de peligros aún mayores en sus profundidades." #NT!
 funding_expedition.0001.a: "Debería dirigirme a Gogossos" #NT!
 funding_expedition.0001.b: "Debería dirigirme a Sothoryos (Aún no funciona WIP)" #NT!
 funding_expedition.0001.z: "No importa" #NT!
  
 gogossos_expedition.0001: "¿Qué he encontrado?" #NT!
 gogossos_expedition_0001_t: "¿Qué he encontrado?" #NT!
 gogossos_expedition_0001_desc: "Después de marchar durante días a través de una espesa jungla y barro, finalmente hemos encontrado nuestros primeros restos de civilización. Parece ser un gran edificio de piedra cubierto de vegetación, aunque puedo distinguir la forma de una puerta a través de toda la maleza." #NT!
 gogossos_expedition.0001.a: "¿Qué tenemos aquí?" #NT!
 gogossos_expedition.0001.a.outcome: "Comienzas un duelo con esto... #emphasis cosa#!" #NT!
 gogossos_expedition.0001.b: "Creo que es hora de irse..." #NT!
 gogossos_expedition.0001.b.outcome: "Sales de la jungla y regresas a casa." #NT!
  
 gogossos_expedition.0002: "No estos malditos rompecabezas de pilares" #NT!
 gogossos_expedition_0002_t: "No estos malditos rompecabezas de pilares" #NT!
 gogossos_expedition_0002_desc: "Después de atravesar la entrada, me aventuré más en las ruinas y las encontré en una forma bastante exquisita. La ruina conduce a una cámara con una gran puerta de acero con 3 pilares alrededor de la habitación, con diferentes pilares giratorios con formas a cada lado que representan un perro, un águila, un lobo huargo y un cuervo respectivamente. En el centro de la habitación hay una palanca solitaria.\n\nSe puede encontrar un mural en la pared sobre la puerta. En él están grabadas estas palabras:\n\n#emphasis Cerca de un árbol junto a un río hay un agujero en el suelo\nCinco lobos huargos luchan contra siete perros, mientras dos cuervos vuelan alrededor y alrededor\nSeis perros murieron mientras mataban a los cinco lobos huargos en el velo de la noche\nMientras un cuervo fue asesinado por un águila en una pelea terrible#!\n\nBelow en cada sección del mural aparece el siguiente texto:\n\n#emphasis Tengo Es hora de matar, miradas astutas en los pasillos\nSin un plan tuyo\nUn mirlo canta en la colina del pájaro azul\nGracias a la llamada del Niño del Sabio Salvaje#!" #NT!
  
 gogossos_expedition.0002.a: "Aquí va nada..." #NT!
 gogossos_expedition.0002.a.outcome: "Tiras la palanca" #NT!
  
 pillar_mural_turn: "Giras el pilar" #NT!

l_spanish:
  
 lv_colonisation_events.0001.t: "Ladrones en la espesura" #NT!
 lv_colonisation_events.0001.desc: "A medida que tu grupo se adentra más en la naturaleza, de repente te detienes. Un hombre rudo sale de entre los árboles, con el arco preparado y una sonrisa pícara en el rostro. "Mi nombre es Robin", dice, "y esta tierra me debe un peaje". A su lado se encuentra un bruto silencioso: su compañero, John. La tensión crepita como una fogata en una noche de tormenta." #NT!
  
 lv_colonisation_events.0001.a: "Supera a Robin con un razonamiento inteligente." #NT!
 lv_colonisation_events.0001.b: "Negociar un paso seguro utilizando logística y suministros." #NT!
 lv_colonisation_events.0001.c: "Persuade a John para que se una a ti y deje atrás a Robin." #NT!
 lv_colonisation_events.0001.d: "Enfréntate a Robin y ahuyentalo con la fuerza." #NT!
 lv_colonisation_events.0001.e: "Intimidarlos para que retrocedan por miedo." #NT!
 lv_colonisation_events.0001.f: "Desafía a Robin a un duelo por el dominio." #NT!
 lv_colonisation_events.0001.z: "Ofrece un soborno y espera que lo acepten..." #NT!
  
 lv_colonisation_events.0001.a.success: "Burlas a Robin y lo dejas sin palabras." #NT!
 lv_colonisation_events.0001.a.failure: "Tu lógica no logra convencer al pícaro." #NT!
 lv_colonisation_events.0001.b.success: "Su oferta de suministro les hace retroceder." #NT!
 lv_colonisation_events.0001.b.failure: "Robin se ríe de tu oferta y se acerca." #NT!
 lv_colonisation_events.0001.c.success: "John asiente lentamente y se acerca a tu lado." #NT!
 lv_colonisation_events.0001.c.failure: "John duda y luego baja la mirada. 'Lo siento.'" #NT!
 lv_colonisation_events.0001.d.success: "Tu imponente presencia hace que Robin corra." #NT!
 lv_colonisation_events.0001.d.failure: "No retroceden. Una pelea parece inevitable." #NT!
 lv_colonisation_events.0001.e.success: "Tus amenazas socavan su confianza." #NT!
 lv_colonisation_events.0001.e.failure: "Te dicen que eres un farol. Esto podría ponerse feo." #NT!
 lv_colonisation_events.0001.f.success: "Venciste a Robin en combate singular y su orgullo quedó destrozado." #NT!
 lv_colonisation_events.0001.f.failure: "Robin te domina. Quedas magullado y amargado." #NT!
 lv_colonisation_events.0001.z.result: "Se acepta el soborno, pero ¿a qué precio?" #NT!
 lv_colonisation_events.0001.a.tip: "Intenta ser más astuto que Robin. El éxito otorga [gold|E] y [prestige|E], el fracaso te cuesta estrés y dinero." #NT!
 lv_colonisation_events.0001.b.tip: "Ofrecer ayuda logística. El éxito trae suministros, el fracaso vacía tu bolsa." #NT!
 lv_colonisation_events.0001.c.tip: "Intenta reclutar a John. Si tiene éxito, se unirá a su corte. Si fallas, te devora la mente." #NT!
 lv_colonisation_events.0001.d.tip: "Obliga a Robin a retroceder. Una victoria gana botín, una derrota deja moretones." #NT!
 lv_colonisation_events.0001.e.tip: "Infundirles miedo. ¿Obras? Obtendrás un botín. ¿Falla? Sientes la tensión." #NT!
 lv_colonisation_events.0001.f.tip: "Duelo con Robin como un verdadero chad. Gana, gana gloria. Pierde, prueba el arrepentimiento." #NT!
 lv_colonisation_events.0001.z.tip: "Sobornar y orar. ¿El resultado? Podría ser una bendición... o una maldición." #NT!

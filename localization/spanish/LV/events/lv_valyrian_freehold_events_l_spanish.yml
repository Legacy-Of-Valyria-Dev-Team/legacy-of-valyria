l_spanish:
 lv_valyrian_freehold.0001.t: "El dragón despierta: el dominio absoluto renace" #NT!
 lv_valyrian_freehold.0001.desc: "La pesadilla de Doom se hace añicos. Valyria, la cuna de la magia, la sede de los dragones, el corazón del mundo, está completa nuevamente.\n\nHoy, la tierra destrozada de Valyria se alza como una sola, y las grandes ciudades, violentamente silenciadas por las Catorce Llamas, resuenan una vez más con el rugido de la vida. Los incendios que destruyeron este imperio han sido sofocados, y la verdadera y brillante luz del Feudo Valyrio brilla una vez más a través del Mar Humeante.\n\nEstás en el nexo de la historia. La gente te considera no como su gobernante, sino como el arquitecto de lo imposible: el que desafió la Maldición y venció. Cada rincón del renacido Freehold palpita con un vigor renovado que ningún otro reino puede aspirar a rivalizar.\n\nQue tiemblen las otras potencias del mundo. La sombra de la Perdición se disipa y, en su lugar, el fuego de Valyria arde con más fuerza que nunca. El poder de la antigua Valyria está bajo tus órdenes. La era del dominio absoluto comienza ahora." #NT!
 lv_valyrian_freehold.0001.a: "[Glossary( 'Valar dohaeris!', 'VALAR_DOHAERIS_GLOSS' )]" #NT!
  
 lv_valyrian_freehold.0001.tooltip.styling: "Tendrás el estilo #high [SelectLocalization( restorer.IsFemale, 'hegemon_valyria_female_imperial', 'hegemon_valyria_male_imperial' )]#!" #NT!
  
 lv_valyrian_freehold.0002.t: "El dragón despierta: el dominio absoluto renace" #NT!
 lv_valyrian_freehold.0002.desc: "Una proclamación ha surgido del alguna vez ceniciento asiento de [restorer.GetCapitalLocation.GetBaronyNameExplicitly], firmada a fuego y sangre por [restorer.GetName]. Lo imposible ha sucedido: la Perdición ha sido desafiada y el Feudo Valyrio ha sido declarado restaurado.\n\nEl silencio que mantuvo la península desde la Perdición se ha roto. Donde antes solo había muerte y ruina, ahora existe un poder unificado, unido no sólo por la ley, sino también por la ardiente voluntad del [restorer.GetTitleTierName]. Las Catorce Llamas arden una vez más por un maestro viviente.\n\nUna sombra colosal ahora cae sobre el mundo conocido. Desde los Reinos del Atardecer hasta el Imperio Dorado de Yi Ti, reyes y emperadores miran al cielo con un miedo recién descubierto. El mundo de los hombres está a punto de ser puesto a prueba como nunca antes, porque la Era del Feudo ha llegado de nuevo."" #NT!
 lv_valyrian_freehold.0002.a: "Por [ROOT.Char.GetFaith.HighGodName]..." #NT!
  
 lv_valyrian_freehold.0002.tooltip: "[GetTitleByKey('h_valyrian_freehold').GetName] ha sido restaurado" #NT!
  
 lv_valyrian_freehold.0100.t: "[county.GetNameNoTierNoTooltip] Reconquistado" #NT!
 lv_valyrian_freehold.0100.t.newly_conquered: "[county.GetNameNoTierNoTooltip] Conquistado" #NT!
 lv_valyrian_freehold.0100.desc.intro: "Los estandartes de Freehold ondean una vez más sobre tierras que se creían libres. Donde nuestros antepasados ​​alguna vez gobernaron por derecho de sangre y fuego, ahora regresamos para reclamar nuestra herencia. El largo silencio ha terminado y la gloria de esta recuperación me pertenece únicamente a mí.\n\n" #NT!
 lv_valyrian_freehold.0100.desc.elyria: "[county.GetNameNoTier] se sentó al borde del apocalipsis y sobrevivió, solo para olvidar a sus amos en la confusión que siguió.\n\nUna vez, esta rica isla no conoció el autogobierno, gobernada únicamente por hombres y mujeres enviados desde el corazón del país para hacer cumplir nuestra voluntad. En nuestra ausencia, volvieron sus rostros hacia el este, hacia la Arpía y los Ghiscari, buscando dinero más que lealtad. Esa era de independencia ha terminado. Los vínculos con Slaver's Bay se cortan, y [county.GetNameNoTier] volverá a servir como puerta de entrada a las Tierras del Largo Verano, gobernadas como siempre debió ser: por Valyria." #NT!
 lv_valyrian_freehold.0100.desc.mantarys: "[county.GetNameNoTier], la llamada ciudad de los monstruos, ahora se encoge de miedo ante los verdaderos maestros del Camino del Demonio.\n\nMientras el Destino se tragó la península, sus consecuencias simplemente retorcieron esta ciudad, dejando a sus habitantes deformes y malformados: una burla viviente de la belleza valyria. Durante siglos, han asustado a los viajeros y han protegido el acceso norte con una reputación siniestra.\n\nPero el miedo no domina a aquellos que han conquistado la Maldición misma. Los retorcidos señores de [county.GetNameNoTier] se han rendido. Su monstruosa fuerza ya no les servirá sólo a ellos mismos; será aprovechado, como lo fue en los días de antaño, para servir la voluntad del Feudo." #NT!
 lv_valyrian_freehold.0100.desc.tolos: "Los Acantilados Negros de [county.GetNameNoTier] han mirado durante mucho tiempo la Bahía de los Esclavos, haciendo la vista gorda hacia el oeste. Al igual que sus vecinos, [county.GetNameNoTier] olvidó sus orígenes después de la Perdición, buscando el favor de los Ghiscari y la Arpía.\n\nPero el Dragón no olvida lo que le pertenece. No hemos venido por su oficio, sino por su objetivo. Los famosos honderos de [county.GetNameNoTier], cuyas blandas bolas de plomo pueden romper huesos a través de la malla, son un arma forjada bajo nuestra sombra hace mucho tiempo. Ya no servirán como mercenarios para el mejor postor de la Bahía; Son devueltos al arsenal imperial, listos para hacer llover la muerte sobre los enemigos de Freehold." #NT!
 lv_valyrian_freehold.0100.desc.volantis: "[county.GetNameNoTier], la Primera Hija, finalmente ha sido sometida.\n\nDurante siglos, la Sangre Vieja que habitaba detrás de los Muros Negros engordó con arrogancia, autodenominándose los sucesores de nuestra gloria. Contribuyeron mucho al caos del Siglo de Sangre, intentando reclamar un manto que era demasiado pesado para ellos, antes de retirarse al estancamiento de sus Elefantes.\n\nOlvidaron que no fueron fundados como un imperio, sino como una guarnición. Los Muros Negros se levantaron para proteger las fronteras del Feudo Libre, no para ocultar a los pretendientes. Hoy se restablece el orden natural. Los Tigres no tienen dientes, los Elefantes han cedido y el Dragón ha regresado para recordarle a la Primera Hija que su único deber verdadero es obedecer." #NT!
 lv_valyrian_freehold.0100.desc.tyrosh: "[county.GetNameNoTier] es una ciudad de colores llamativos, pero debajo del tinte se esconde una historia de la más negra traición.\n\nComenzó como un sombrío puesto de avanzada para defender los Peldaños de Piedra, y alcanzó riqueza solo porque nuestros antepasados ​​favorecían sus pigmentos únicos. Sin embargo, cuando cayó el Destino, los Tyroshi devolvieron nuestro patrocinio con el asesinato. Mataron a los señores dragón supervivientes y a sus monturas en un ataque de pánico y codicia, con la esperanza de borrar su servidumbre.\n\nNo lo hemos olvidado. Se recupera la ciudad y se cobra la deuda. Los Peldaños de Piedra están una vez más bajo nuestra vigilancia, y los tinteros de [county.GetNameNoTier] han aprendido que, si bien la pintura puede cubrir una pared, no puede ocultarla de la justicia del Dragón." #NT!
 lv_valyrian_freehold.0100.desc.lys: "[county.GetNameNoTier] es conocida como Lovely, y por una buena razón. Aquí, más que en cualquier otro lugar del mundo, la sangre de Freehold corre fuerte. Incluso los mendigos de las calles llevan el cabello plateado y los ojos violetas de los señores dragón, fantasmas vivientes de la gloria que perdimos.\n\nPero un rostro valyrio no oculta el corazón de un traidor. Cuando cayó la Perdición, los Lyseni se volvieron contra los dragones y los jinetes que buscaban refugio en sus jardines a la sombra de las palmeras, matándolos presa del pánico para asegurar su propia supervivencia.\n\nHemos regresado para corregir ese error. Los jardines de placer del imperio son nuestros una vez más, y a los Lyseni (hermosos, traicioneros y orgullosos) se les ha recordado que, si bien pueden compartir nuestra sangre, no comparten nuestro poder." #NT!
 lv_valyrian_freehold.0100.desc.myr: "Walled [county.GetNameNoTier] se encuentra donde los antiguos Dragonroads se encuentran con el mar, una ciudad construida por aventureros valyrios sobre las piedras rotas de los ándalos.\n\nDurante años, esta ciudad se ha definido por las monedas y el arte, desangrándose en las interminables y pequeñas guerras por las Tierras en Disputa. Creían que sus muros, su riqueza y su Dios Rojo podrían protegerlos del giro de la rueda. Se equivocaron.\n\nLa disputa ha finalizado. Los artesanos de [county.GetNameNoTier] (maestros del vidrio transparente, los encajes intrincados y los mecanismos complejos) son los mejores del mundo. Sus talentos son demasiado valiosos para desperdiciarlos en disputas mercantiles. Los talleres de [county.GetNameNoTier] ahora pertenecen a Freehold y sus fuegos arden por nosotros." #NT!
 lv_valyrian_freehold.0100.desc.pentos: "[county.GetNameNoTier] siempre ha sido una ciudad de compromiso, donde se permitió que la sangre del Dragón se diluyera y se mezclara con la de los Ándalos. Durante demasiado tiempo, los Magister han gobernado desde las sombras, escondiéndose detrás de la jaula dorada de su Príncipe ceremonial.\n\nSegún sus propias leyes, se debe degollar al Príncipe cuando se pierde una guerra para apaciguar a los dioses. Pero los dioses de [county.GetNameNoTier] guardan silencio ante nosotros. No necesitamos la sangre de un títere. Son los Magister (los queseros y comerciantes de especias que pensaban que podían comprar el mundo) quienes ahora aprenderán el verdadero coste del poder. La farsa del Príncipe ha terminado y la realidad del Dragón ha comenzado." #NT!
 lv_valyrian_freehold.0100.desc.chroyane: "[county.GetNameNoTier] yace envuelto en las nieblas de los Dolores, un monumento a la última vez que un poder se atrevió a desafiar verdaderamente el Feudo Libre.\n\nFue aquí donde el Príncipe Garin fue colgado en una jaula dorada para ver arder su Ciudad Festiva, y aquí donde invocó a la Madre del Río para ahogar a nuestros antepasados ​​en una maldición de niebla y escala de grises. Durante mil años, los Hombres de Piedra y su Señor Envuelto han gobernado estas ruinas, protegidos por el aliento de los muertos.\n\nPero el Dragón no teme a la humedad. Hemos vuelto para terminar la guerra. La escala de grises será purgada con llamas de dragón y las nieblas quemadas por el calor de nuestro regreso. El Rhoyne ahora nos pertenece y [county.GetNameNoTier] sirve como un sombrío recordatorio: el agua puede ahogar a un hombre, pero el fuego consume una civilización." #NT!
 lv_valyrian_freehold.0100.desc.ny_sar: "[county.GetNameNoTier] fue una vez una ciudad de fuentes y canciones, la sede de la princesa guerrera Nymeria. Pero las canciones mueren rápidamente cuando el cielo se llena de ceniza.\n\nA diferencia del tonto Garin, Nymeria sabía que no debía enfrentarse a los Señores Dragón al aire libre. Ella desnudó esta ciudad y huyó con sus Diez Mil Barcos, negando a nuestros antepasados ​​los esclavos que les correspondían. Dejó atrás solo un cascarón: un colosal palacio de mármol rosa y verde, ahora destrozado y en silencio.\n\nHemos regresado para reclamar las ruinas que abandonó. Las fuentes están secas, los cantantes se han ido y el Rhoyne fluye silenciosamente entre los escombros. Deja que esta ciudad destruida sirva de prueba: puedes correr hasta los confines de la tierra, pero nunca podrás dejar atrás al Dragón." #NT!
 lv_valyrian_freehold.0100.desc.meereen: "[county.GetNameNoTier], la más grande de las Ciudades Esclavistas, ha engordado durante mucho tiempo con la presunción de que el Antiguo Imperio de Ghis podría resurgir. Los Grandes Maestros se sientan en lo alto de sus pirámides, hablan un dialecto mestizo de nuestra propia lengua y se creen los señores del mundo.\n\nOlvidan su historia. Cinco veces la Arpía voló contra el Dragón, y cinco veces fue derribada. Aprendimos el arte de la cadena de sus antepasados, sólo para atarlos con ella.\n\nHoy, la Gran Pirámide está limpia. La Arpía está derribada, sus alas bronceadas destrozadas contra las piedras. Los Maestros han aprendido la última lección de su oficio: hay quienes empuñan el látigo y quienes lo sienten. [county.GetNameNoTier] es una colonia una vez más." #NT!
 lv_valyrian_freehold.0100.desc.yunkai: "[county.GetNameNoTier], la Ciudad Amarilla, apesta a perfume y decadencia. Los llamados "Maestros Sabios" se han enriquecido durante mucho tiempo entrenando esclavos para el dormitorio, escondiéndose detrás de altos muros y diseñando su hogar como la "Reina de las Ciudades".\n\nPero una reina se inclina ante un Dragón. A la Arpía Ghiscari de [county.GetNameNoTier], con su cola de escorpión y su collar de hierro, le han quitado las garras.\n\nLos Maestros Sabios finalmente han aprendido los límites de su sabiduría. Sus campos de entrenamiento, sus casas de placer y su gente ya no son suyos. Aprendimos el oficio de la esclavitud humana de sus antepasados, y ahora volvemos para recordarles que, si bien ellos pueden comerciar con carne, nosotros comerciamos con fuego." #NT!
 lv_valyrian_freehold.0100.desc.astapor: "[county.GetNameNoTier], la Ciudad Roja, está construida sobre una vieja y sombría verdad: ladrillos y sangre. Durante muchos años, los Buenos Amos se han enriquecido convirtiendo a los hombres en el arma perfecta: los Inmaculados.\n\nSe jactan de la disciplina absoluta de sus Inmaculados y se autodenominan los mayores esclavistas del mundo. Pero no son más que los restos del Viejo Ghis, una civilización que aplastamos cinco veces.\n\nLas plazas de entrenamiento están ahora en silencio, esperando nuevas órdenes. Le han quitado la cadena a la Arpía. Los Inmaculados ya no serán vendidos como mercenarios al mejor postor; La mayor infantería del mundo ha sido reclamada para el ejército imperial. Se ha recordado a los Buenos Maestros que, si bien ellos pueden derrotar a los hombres, sólo el Dragón destruye los imperios." #NT!
 lv_valyrian_freehold.0100.desc.new_ghis: "[county.GetNameNoTier] surge del Golfo de la Pena, un descarado intento de resucitar un cadáver que enterramos hace cinco mil años.\n\nMientras las otras Ciudades Esclavistas se pudrieron en el estancamiento, [county.GetNameNoTier] buscó recrear el poder militar del Antiguo Imperio. Instruyeron a sus Legiones de Hierro en la misma línea del pasado: hombres libres, no esclavos, que luchaban con la disciplina de los antiguos.\n\nPero si el verdadero Antiguo Imperio no pudo enfrentarse al Dragón en el apogeo de su poder, ¿qué esperanza tenía esta pálida imitación? Sus legiones se han hecho añicos contra nuestras líneas. Hemos extinguido esta chispa del resurgimiento de Ghiscari antes de que pudiera convertirse en llama. No habrá una Sexta Guerra Ghiscari; [county.GetNameNoTier] es nuestro." #NT!
 lv_valyrian_freehold.0100.desc.old_ghis: "El viento sobre [county.GetNameNoTier] sabe a sal, a azufre y a polvo antiguo. Aquí yace el cadáver del Antiguo Imperio, el único poder que realmente desafió al Dragón en ascenso.\n\nCinco veces la Arpía voló contra nosotros y cinco veces cayó. Hace cinco mil años, nuestros antepasados ​​destrozaron sus legiones unidas, derribaron sus muros de ladrillo y sembraron sus campos con cráneos para que nada volviera a crecer aquí.\n\nLo lograron. A diferencia de Valyria, que ha resurgido de las cenizas de Doom, [county.GetNameNoTier] permanece en su tumba. Alzamos nuestros estandartes sobre estas ruinas no para honrar su legado, sino para pararnos sobre la tumba del Antiguo Imperio de Ghis y recordarle al mundo: El Dragón vence a la muerte; la Arpía simplemente se alimenta de él." #NT!
 lv_valyrian_freehold.0100.desc.gogossos: "[county.GetNameNoTier] se encuentra en la Isla de las Lágrimas como un monumento a los impulsos más oscuros de nuestros antepasados. Una vez que fue un puesto avanzado de Ghiscari, lo transformamos en la mazmorra de Freehold, un pozo donde los peores criminales y los hechiceros más oscuros fueron enviados para ser olvidados.\n\nEn el silencio que siguió a la Perdición, los reclusos se apoderaron del asilo. Practicaban magia de sangre y creación de carne que desafiaban a la naturaleza, criaban bestias con hombres y se atrevían a llamar a su abominación la "Décima Ciudad Libre".\n\nEse engaño ha terminado. Una prisión no es una ciudad. Hemos vuelto para recuperar las llaves. Los pozos de carne y las bóvedas mágicas ahora nos responden, y los horrores retorcidos de [county.GetNameNoTier] ya no se volverán locos; son un recurso oscuro, devuelto a la llave del Dragón." #NT!
 lv_valyrian_freehold.0100.desc.braavos: "[county.GetNameNoTier], la Hija Bastarda, la Ciudad Secreta. Durante siglos, se refugiaron en esta laguna, una civilización construida con propiedad robada sobre una base de niebla y miedo.\n\nLos Moonsingers les prometieron un santuario donde el Dragón no podría encontrarlos. Mintieron. El Titán de Braavos podrá mantenerse erguido, pero está hecho de piedra y bronce; no puede resistir contra la carne y el fuego.\n\nHoy, la Primera Ley está derogada. Se ha confiscado el Banco de Hierro y se han abierto sus bóvedas para pagar la deuda de los barcos robados a nuestros antepasados ​​hace mil años. Se ha encontrado a los fugitivos, la mascarada ha terminado y la Hija Bastarda ha sido arrastrada fuera de las sombras para arrodillarse ante sus legítimos amos." #NT!
  
 lv_valyrian_freehold.0100.a: "¡Por la gloria de Valyria!" #NT!

 agot_EE_form_new_valyria_volantis_decision: "Establecer el Imperio de lo Nuevo [valyria|E]" #NT!
 agot_EE_form_new_valyria_volantis_decision_desc: "Restaura un nuevo [valyria|E] de las antiguas tierras de [valyrian_freehold_short|E]." #NT!
 agot_EE_form_new_valyria_volantis_decision_confirm: "Reúne el reino" #NT!

 agot_EE_valyrian_restoration.1.t: "El nacimiento de lo nuevo [valyria|E]" #NT!
 agot_EE_valyrian_restoration.1.desc: "¡Como un fénix renace de las cenizas, así también se levanta Nueva Valyria! Nuestro estandarte ondea en cada rincón de nuestro nuevo imperio, llevado por vientos tan feroces como nuestro propio pueblo.\n\nEl antiguo [valyrian_freehold_short|E] fue una vez el faro de la civilización, un fuego ardiente contra la más negra de las noches, extinguido en un instante. Aunque es posible que nunca volvamos a alcanzar las alturas de su grandeza, le debemos a nuestros antepasados ​​esforzarnos por alcanzar tal grandeza.\n\n¡Adelante, con el fuego de un nuevo amanecer! Esta vez, [valyria|E] perdurará." #NT!
 agot_EE_valyrian_restoration.1.a: "¡Adelante!" #NT!

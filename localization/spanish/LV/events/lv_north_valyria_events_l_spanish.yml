l_spanish:
 agot_EE_establish_north_valyria_decision: "Establecer Valyria del Norte" #NT!
 agot_EE_establish_north_valyria_decision_desc: "Establece el reino de Valyria del Norte a partir de los diversos principados en disputa que existen al norte de la otrora gran península y conviértelo en un reino poderoso con el que no se puede jugar." #NT!
 agot_EE_establish_north_valyria_decision_tooltip: "Establecer el Reino de Valyria del Norte" #NT!
 agot_EE_establish_north_valyria_decision_confirm: "Reúne el reino" #NT!
 agot_EE_establish_north_valyria_tooltip_dejure: "Todos los territorios bajo [GetTitleByKey('k_mantarys').GetName], [GetTitleByKey('k_tolos').GetName], [GetTitleByKey('k_elyria_and_velos').GetName] y [GetTitleByKey('k_draconys').GetName] se convierten en [de_jure|E] señores de [GetTitleByKey('e_north_valyria').GetName]" #NT!
  
 agot_EE_north_valyria.1.t: "Valyria del Norte se levanta" #NT!
 agot_EE_north_valyria.1.desc: "Desde la época del [valyrian_freehold|E], sus ciudades del norte a lo largo de las Montañas Pintadas prosperaron. Aunque no tenían el privilegio de autogobernarse, eran ricos. Después de la Perdición hemos caído de esa antigua gloria, abandonados en las cenizas para que nos las arreglemos solos. El mundo verá que este ya no es el caso, ya que he unido a estos pequeños señores en disputa bajo mi estandarte, ya sea por la diplomacia o por la fuerza.\n\nHoy un fénix se levanta de las cenizas del [valyrian_freehold_short|E]." #NT!
 agot_EE_north_valyria.1.a: "Un rey murmura y un dragón inclina la cabeza." #NT!
  
 agot_EE_reestablish_old_valyria_decision: "Restaurar el Antiguo Imperio" #NT!
 agot_EE_reestablish_old_valyria_decision_desc: "Desde la sede de mi floreciente reino, estoy preparado para revivir el antiguo imperio, devolviendo vida a lo que una vez se pensó perdido. Las ruinas de mis antepasados ​​susurran de poder olvidado, de tierras unidas bajo una fuerza indomable, y estoy listo para restaurar ese legado." #NT!
 agot_EE_reestablish_old_valyria_decision_tooltip: "Restablecer el Imperio de [old_valyria|E]" #NT!
 agot_EE_reestablish_old_valyria_decision_confirm: "Restablecer el Antiguo Imperio" #NT!
  
 agot_EE_old_valyria.1.t: "El viejo imperio surge" #NT!
 agot_EE_old_valyria.1.desc: "Cuando un dragón despierta de su antiguo letargo, [old_valyria|E] asciende una vez más. Nuestro estandarte ondea alto sobre cada rincón de nuestro otrora gran imperio, llevado por vientos tan indómitos como el espíritu de nuestro pueblo. El antiguo [valyrian_freehold_short|E], que alguna vez fue una luz imponente contra la oscuridad, cayó en ruinas. Si bien es posible que nunca recuperemos su incomparable grandeza, honramos a nuestros antepasados ​​llegando cada vez más alto. Juntos, avanzamos con el viejo fuego parpadeando una vez más. Esta vez, [valyria|E] resistirá la prueba de los siglos." #NT!
 agot_EE_old_valyria.1.a: "¡Restaurado por fin!" #NT!

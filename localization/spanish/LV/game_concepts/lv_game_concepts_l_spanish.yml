l_spanish:
 #Doom 
 game_concept_doom_of_valyria: "La perdición de Valyria" #NT!
 game_concept_doom_of_valyria_desc: "El #bold Doom of Valyria#!, o simplemente el #bold Doom#!, fue un cataclismo de naturaleza no especificada que provocó el colapso del [valyrian_freehold|E], que había prosperado durante cinco mil años. Ocurrió aproximadamente un siglo antes de la conquista de [westeros|E] por parte de Aegon, en el año 102 a.C. Los hechizos, el conocimiento y la historia registrada se perdieron en el #bold Doom#!, y el Siglo de Sangre siguió al desastre." #NT!
 game_concept_doom: "Condenar" #NT!
  
 #[valyrian_freehold|E] 
 game_concept_valyrian_freehold_short: "Propiedad vitalicia" #NT!
 game_concept_valyrian_freehold: "dominio valyrio" #NT!
 game_concept_valyrian_freehold_desc: "El #bold Valyrian Freehold#! era un gran territorio que abarcaba gran parte del continente de [essos|E], pero desde entonces ha caído en ruinas. Fue destruido aproximadamente cien años antes de la conquista de Aegon, cuando fue derribado por un evento cataclísmico conocido como [doom_of_valyria|E].\n\nEn su apogeo, el #bold Valyrian Freehold#! abarcaba la mayor parte del continente oriental y llegaba hasta el actual [free_cities|E] y la isla de Dragonstone frente a la costa de [westeros|E]. #bold El Freehold#! técnicamente nunca fue un imperio, sin embargo, para facilitar la referencia, tiende a denominarse como tal.\n\n#bold El Freehold#! era una civilización avanzada y la potencia militar y cultural dominante del mundo conocido. Su capital era la ciudad Valyria. #bold The Freehold#! estaba gobernado por los señores propietarios, poderosas familias nobles. Los más poderosos de ellos fueron los #!4." #NT!
 game_concept_the_freehold: "El dominio absoluto" #NT!
  
 #Dragonlords 
 game_concept_dragonlord: "señor dragón" #NT!
 game_concept_dragonlords: "Señores Dragón" #NT!
 game_concept_dragonlord_desc: "#bold Dragonlords#! eran los [dragon_riding|El] nobles más poderosos del [valyrian_freehold|E]. Algunos miembros de la Casa Targaryen, como Aegon el Conquistador, han sido denominados "Señores de los Dragones" después del [doom_of_valyria|E] y la destrucción de la civilización." #NT!
  
 #Dragonrider 
 game_concept_dragonrider: "Jinete de dragón" #NT!
 game_concept_dragonriders: "Jinetes de dragones" #NT!
 game_concept_dragon_riding: "montar dragón" #NT!
 game_concept_dragonrider_desc: "Un [GetTrait('dragonrider').GetName(GetNullCharacter)] es una persona cuya montura es un [dragon|E].\n\n[GetTrait('dragonrider').GetName(GetNullCharacter)]s se podía encontrar entre las familias [dragonlord|El] en [valyrian_freehold|E], cuando [the_freehold|E] todavía era fuerte.\n\nLos Targaryen eran una de estas familias de señores dragón, aunque lejos de ser las más poderosas, y fueron los últimos [GetTrait('dragonrider').GetName(GetNullCharacter)]s conocidos que sobrevivieron a [doom_of_valyria|E] y sus secuelas." #NT!
  
 #Continents 
 game_concept_known_world: "mundo conocido" #NT!
 game_concept_three_known_continents: "Tres continentes conocidos" #NT!
 game_concept_known_world_desc: "El #bold mundo conocido#! está compuesto por al menos tres continentes ([westeros|E], [essos|E] y [sothoryos|E]), una gran masa de tierra ([ulthos|E]) y muchas islas más pequeñas.\n\nNinguna de las cuatro masas de tierra principales ha sido cartografiada por completo y gran parte del mundo permanece inexplorado.\n\nMientras que el [maesters|El] de [westeros|E] Aunque saben mucho sobre las tierras del lejano oriente, la distancia sigue siendo un problema y, pasado cierto punto, los mitos y leyendas se convierten en un factor en sus registros." #NT!
   #Westeros 
 game_concept_westeros: "Poniente" #NT!
 game_concept_westerosi: "Poniente" #NT!
 game_concept_westeros_desc: "#bold Westeros#! es uno de los [three_known_continents|E] en [known_world|E], los otros son [essos|E] y [sothoryos|E]. La mayor parte del área de #bold Westeros#! está cubierta por una entidad política conocida como [seven_kingdoms|E], mientras que el extremo norte más allá del Muro incluye gente libre.\n\nLas naciones extranjeras más cercanas a #bold Westeros#! son las #!1. Al sur de #bold Westeros#! se encuentran las Islas de Verano." #NT!
 game_concept_seven_kingdoms: "Siete Reinos" #NT!
 game_concept_seven_kingdoms_desc: "Los #bold Siete Reinos#! son un reino ubicado en el continente de [westeros|E], gobernado por un monarca llamado Rey de los [andals|E], [rhoynar|E] y [first_men|E] y Señor de los #bold Siete Reinos#!, el rey que se sienta en el Trono de Hierro en la ciudad capital, Desembarco del Rey. Su nombre deriva de la situación de hace tres siglos cuando Aegon el Conquistador se propuso unir las tierras de [westeros|E], que estaba gobernada por siete reinos independientes, además de las tierras [beyond_the_wall|E]. El nuevo reino creado a partir de la conquista de Aegon está dividido en nueve regiones o provincias distintas." #NT!
 game_concept_narrow_sea: "Mar angosto" #NT!
 game_concept_narrow_sea_desc: "El #bold mar Angosto#! es el mar entre los continentes de [westeros|E] al oeste y [essos|E] al este. El mar es relativamente estrecho y fácil de cruzar, pero lo suficientemente grande como para dificultar las invasiones e incursiones militares a gran escala entre el [seven_kingdoms|E] y el [free_cities|E].\n\nHay comercio regular a través del mar estrecho entre los dos continentes y el puerto de Ibben. [westerosi|E] nobles a veces son acogidos o buscan refugio en las ciudades al otro lado del agua." #NT!
 game_concept_others: "Otros" #NT!
 game_concept_white_walkers: "caminantes blancos" #NT!
 game_concept_cold_gods: "Dioses frios" #NT!
 game_concept_white_shadows: "Sombras blancas" #NT!
 game_concept_cold_shadows: "Sombras frías" #NT!
 game_concept_others_desc: "Los #bold Otros#!, también conocidos como #bold caminantes blancos#!, #bold dioses fríos#!, #bold sombras blancas#!, y #bold sombras frías#!, son una especie de seres humanoides que existen en el norte más allá del #!,0. Como no se les ha visto desde hace entre seis y ocho mil años, se les considera extintos." #NT!
 game_concept_watch_wall: "Muro" #NT!
 game_concept_watch_wall_desc: "El #bold Wall#! es una enorme barrera compuesta principalmente de hielo que se extiende a lo largo del borde norte del [seven_kingdoms|E], separándolo del [wild_lands_beyond|E]. El #bold Wall#! tiene cien leguas de largo (trescientas millas) y alcanza más de setecientos pies en su punto más alto, aunque algunos bloques de cimientos en regiones montañosas, como cerca de Greyguard, lo elevan a novecientos pies en el aire.\n\n Una de las nueve maravillas hechas por el hombre de Lomas Longstrider, el #bold Wall#! está defendido y sostenido por los hermanos jurados del [nw_govt|E], que patrullan y vigilan. diecinueve castillos desde la cordillera Frostfangs en el oeste hasta la Bahía de las Focas en el este. Solo la Torre de las Sombras, el Castillo Negro y Guardiaoriente del Mar están guarnecidos al comienzo de #bold Canción de hielo y fuego#!. Aquellos que se unen a la Guardia para evitar otro castigo pueden ser denominados #bold enviados al Muro#!." #NT!
 game_concept_beyond_the_wall: "Más allá del muro" #NT!
 game_concept_wild_lands_beyond: "Tierras salvajes más allá" #NT!
 game_concept_beyond_the_wall_desc: "#bold Más allá del Muro#! es un término general para el área más al norte de [westeros|E], las tierras al norte de [watch_wall|E] y [seven_kingdoms|E]." #NT!
 game_concept_age_of_heroes: "Era de los héroes" #NT!
 game_concept_age_of_heroes_desc: "La #bold Age of Heroes#! fue una era de la historia de [westerosi|E] anterior a la [coming_of_the_andals|E]. Toma su nombre de los grandes hombres y mujeres que vivieron en los años de paz que siguieron a la forja del [pact|E] entre el [first_men|E] y el [children_of_the_forest|E]. Muchas casas nobles remontan sus historias familiares a la #bold Age of Heroes#!, aunque a los historiadores les resulta difícil diferenciar entre verdad y leyenda." #NT!
 game_concept_dawn_age: "Edad del amanecer" #NT!
 game_concept_dawn_age_desc: "La #bold Era del Amanecer#!, también llamada el #bold Amanecer de los Días#! o los #bold siglos del amanecer#!, fue una época de duración indeterminada cuando los [first_men|E] llegaron de [essos|E] y comenzaron a colonizar [westeros|E]. Antes de ellos, [children_of_the_forest|E], seres diminutos y misteriosos con dones sobrenaturales habitaban la tierra, adorando al #!,0 de la naturaleza y viviendo en armonía con ella, posiblemente junto a gigantes." #NT!
 game_concept_long_night: "larga noche" #NT!
 game_concept_long_night_desc: "La #bold Larga Noche#! es como los [westerosi|E] se refieren a un período en el que una terrible oscuridad cayó sobre el [known_world|E]. Ocurrió durante el [age_of_heroes|E], aproximadamente ocho mil años antes de la Conquista de Aegon, en medio de un gran invierno que duró años. La #bold Larga Noche#! duró una generación y arrasó mediante el hambre y el terror." #NT!
 game_concept_first_men: "Primeros hombres" #NT!
 game_concept_first_men_desc: "Los #bold Primeros Hombres#! son uno de los tres grupos étnicos principales de los que descienden los humanos de [westeros|E], siendo los otros los [andals|E] y los [rhoynar|E]. Los #bold Primeros Hombres#! fueron la cultura de los humanos que pisaron por primera vez el continente. La influencia de los #bold Primeros Hombres#! todavía se siente en [westeros|E], con mayor fuerza en el norte. El Señor de los #!0, el rey en el Trono de Hierro, afirma ser el Rey de los [andals|E], los [rhoynar|E] y los #bold Primeros Hombres#!." #NT!
 game_concept_andal: "ándalo" #NT!
 game_concept_andals: "ándalos" #NT!
 game_concept_andal_desc: "Los #bold Ándalos#! son uno de los tres grupos étnicos principales de los que descienden los humanos de [westeros|E], siendo los otros los [first_men|E] y los [rhoynar|E]. Los [coming_of_the_andals|E] a [westeros|E] causaron la caída de muchos reinos de los [first_men|E] que se habían desarrollado a raíz de su [pact|E] con los [children_of_the_forest|E].\n\nLos #bold Ándalos#! también trajeron la Fe de los Siete al continente. El Señor de los #!2, el rey en el Trono de Hierro, afirma ser el Rey de los #bold Ándalos#!, los [rhoynar|E] y los [first_men|E].\n\nLos #!7 se refieren a [westeros|E] como Rhaesh Andahli, la tierra de los #bold Ándalos#!." #NT!
 game_concept_rhoynar: "rhoynar" #NT!
 game_concept_rhoynar_desc: "Los #bold Rhoynar#! son uno de los tres grupos étnicos principales de los que descienden los humanos de [westeros|E], siendo los otros los [andals|E] y los [first_men|E]. Eran una cultura de gente ribereña que habitaba en las orillas del inmenso río #bold Rhoyne#! en [essos|E]. Después de verse obligados a huir en diez mil barcos durante las Guerras Rhoynish con Valyria, los #bold Rhoynar#! supervivientes finalmente se establecieron en Dorne, en el sur de [westeros|E].\n\n\nAunque la mayoría de los #bold Rhoynar#! se integraron en la sociedad dorniense, especialmente en los llamados "dornienses salados", los huérfanos de Sangre Verde han conservado su herencia y lengua rhoynienses. El Señor de los #!3, que se sienta en el Trono de Hierro, reclama el título de Rey de los [andals|E], los Rhoynar y los [first_men|E]." #NT!
 game_concept_coming_of_the_andals: "La llegada de los ándalos" #NT!
 game_concept_coming_of_the_andals_desc: "La #bold llegada de los Ándalos#!, #boldcruce de los Ándalos#!, o #bold llegada de los Ándalos#! se refiere a la migración de [andals|E] de [essos|E] a [westeros|E]. Se discute el momento en que esto ocurrió; algunas fuentes indican que fue hace seis mil años, la Historia Verdadera afirma que fue hace cuatro mil años, y algunos [maesters|E] como Denestan afirman que fue hace dos mil años.\n\nMuchos de los pequeños reinos de los #!,0 fueron destruidos por los invasores #!,1 y los #!,2 fueron empujados hacia el norte. Sin embargo, la toma de posesión fue a veces pacífica, con matrimonios mixtos entre [andals|E] y #!,0." #NT!
 game_concept_children_of_the_forest: "niños del bosque" #NT!
 game_concept_children_of_the_forest_desc: "Los #bold niños del bosque#!, a veces denominados simplemente los #bold niños#!, son una misteriosa raza no humana que originalmente habitó el continente de [westeros|E] durante el [dawn_age|E] mucho antes de la llegada de los [first_men|E] hace miles de años. Los gigantes los llaman woh dak nag gram (pequeñas ardillas). Se llaman a sí mismos #bold los que cantan el canto de la tierra#! en la Lengua Verdadera. Los #bold niños#! no han sido vistos por los hombres desde hace cientos de años." #NT!
 game_concept_pact: "Pacto" #NT!
 game_concept_pact_desc: "El #bold Pacto de la Isla de las Caras#! puso fin a la antigua guerra entre los [first_men|E] y los [children_of_the_forest|E] hace más de 10.000 años. Se firmó en una isla en #bold Gods Eye#!, donde se tallaron caras en arcianos para que los dioses pudieran presenciar el tratado. Los hombres verdes tenían la tarea de proteger la isla.\n\nEl Pacto #bold#! duró durante el [age_of_heroes|E], el [long_night|E] y el surgimiento del #!0, hasta que, muchos siglos después, el #!1 cruzó el #!2, lo que trajo grandes cambios a #!3." #NT!
 game_concept_old_gods: "Dioses antiguos" #NT!
 game_concept_nameless_gods: "Dioses sin nombre" #NT!
 game_concept_old_gods_desc: "Los #bold dioses antiguos#! son deidades sin nombre del bosque, arroyo y piedra, todavía adorados en [seven_kingdoms|E] principalmente en el norte de [westeros|E] y más allá de [watch_wall|E]. Aunque la Fe de los Siete los reemplazó en la mayoría de las regiones, la creencia en los #bold dioses antiguos#! persiste entre los hombres del norte, los crannogmen y la gente libre. Muchos [westerosi|E] todavía confían tanto en lo antiguo como en lo nuevo." #NT!
  
    #Sothoryos 
 game_concept_sothoryos: "sothoryos" #NT!
 game_concept_sothoros: "Sothoros" #NT!
 game_concept_sothoryos_desc: "#bold Sothoryos#! o #bold Sothoros#! es uno de los [three_known_continents|E] del mundo. Se encuentra al sureste de [westeros|E] y al sur de [essos|E] a través de [summer_sea|E]. Al este de #bold Sothoryos#! se encuentra el sur del Mar de Jade." #NT!
   #Essos 
 game_concept_essos: "Essos" #NT!
 game_concept_essosi: "Essosi" #NT!
 game_concept_the_east: "Este" #NT!
 game_concept_essos_desc: "#bold Essos#!, a menudo llamado simplemente el este, es el más grande de los [three_known_continents|El] en el mundo.\n\nSe encuentra al este de [westeros|E] y al norte de [sothoryos|E] y [ulthos|E], extendiéndose desde el Mar de los Temblores en el norte hasta el Mar de Verano en el sur, y desde el Mar Angosto en el oeste hasta las tierras que rodean el Mar de Jade en el este, si no más lejos.\n\n#bold Essos#! está poblado por muchos pueblos diferentes y tiene una geografía vasta y variada." #NT!
 game_concept_summer_sea: "mar de verano" #NT!
 game_concept_summer_sea_desc: "El #bold Summer Sea#! es uno de los principales océanos del [known_world]. Está ubicado al sur de [westeros|E] y [essos|E], separando esos continentes de la masa continental del sur de [sothoryos|E]. Está separado del [narrow_sea|E] por las islas conocidas como Peldaños de Piedra, y del Mar de Jade por el Estrecho de Qarth. La Bahía de los Esclavos y el Golfo de Grief son grandes ensenadas del #bold Summer Sea#!, y el [valyrian_peninsula|E] se extiende hacia él." #NT!
    #Free cities 
 game_concept_free_cities: "Ciudades Libres" #NT!
 game_concept_free_city: "Ciudad Libre" #NT!
 game_concept_free_cities_desc: "Las #bold Ciudades Libres#!,, también llamadas #bold Nueve Ciudades Libres#!,, son un grupo de nueve ciudades-estado independientes en el oeste de [essos|E], ubicadas al oeste de [dothraki_sea|E] y las Montañas Pintadas y al noroeste de la península Valyria.\n\nLas #bold Las Ciudades Libres#! comercian e interactúan frecuentemente con las [seven_kingdoms|E] de [westeros|E].Muchos en #bold Las Ciudades Libres#! se consideran más sofisticados que Westerosi, y algunos consideran que la gente de [seven_kingdoms|E] es salvaje." #NT!
    #Dothraki 
 game_concept_dothraki_sea: "Mar Dothraki" #NT!
 game_concept_dothraki_sea_desc: "El #bold mar Dothraki#!,, también conocido como #bold Gran Mar de Hierba#!,, las #bold Tierras Encantadas#!, y la #bold Gran Desolación#!, es una vasta región interior del continente de [essos|E], ubicada al este de [free_cities|E], al norte de Slaver's Bay y al oeste de las Montañas de Hueso.\n\nEs El paisaje de estepas y llanuras es el hogar de los nómadas #!,0 pueblos ecuestres, que constantemente luchan entre sí y atacan las tierras circundantes." #NT!
 game_concept_dothraki: "Dothraki" #NT!
 game_concept_dothraki_desc: "El pueblo #bold Dothrak#!i es una cultura de guerreros nómadas en [essos|E] que se extienden por las vastas praderas de [dothraki_sea|E] en hordas conocidas como khalasars. La gente de [seven_kingdoms|E] y [free_cities|E] también se refiere a los #bold Dothrak#!i como señores de los caballos." #NT!
   #Ulthos 
 game_concept_ulthos: "Ulthos" #NT!
 game_concept_ulthos_desc: "#bold Ulthos#! es una masa de tierra en el lejano oriente, que puede ser o no otro continente. Se encuentra al sur de Asshai y Shadow Lands en [essos|E] y al este de [sothoryos|E]. Está separada de las Tierras Sombrías por el Estrecho de Azafrán. La isla de Ulos está ubicada en el estrecho entre #bold Ulthos#! y [essos|E].\n\nPoco se sabe sobre #bold Ulthos#! aparte de su ubicación y que está cubierta por una densa jungla." #NT!
   #Valyria 
 game_concept_valyria: "Valyria" #NT!
 game_concept_old_valyria: "vieja valyria" #NT!
 game_concept_valyria_desc: "#bold Antigua Valyria#!, originalmente conocida simplemente como #bold Valyria#!, fue la ciudad capital de la otrora gran civilización conocida como [valyrian_freehold|E]. La ciudad de Valyria está ubicada en el continente oriental de [essos|E], al sureste de [free_cities|E], en [valyrian_peninsula|E], una gran península que se extiende hacia el sur hasta [summer_sea|E]." #NT!
 game_concept_valyrian_peninsula: "península valyria" #NT!
 game_concept_valyrian_peninsula_desc: "La #bold península valyria#! es un promontorio grande y ancho que se extiende hacia el sur desde [essos|E] hasta [summer_sea|E], el corazón de la ahora extinta [valyrian_freehold|E] y la ubicación de su ciudad capital, [valyria|E]. Parcialmente destruido en el [doom|E], con muchas islas formadas y zonas bajas inundadas, convirtiéndose en el [smoking_sea|E]." #NT!
 game_concept_smoking_sea: "mar humeante" #NT!
 game_concept_smoking_sea_desc: "El #bold Mar Humeante#! es un cuerpo de agua ubicado inmediatamente al sur del [valyrian_peninsula|E], en la costa sur de [essos|E]. Es parte del océano conocido como [summer_sea|E]. Formado por el [doom_of_valyria|E], el #bold Mar Humeante#! separa las numerosas islas que antes formaban parte de [valyria|E] entre sí y del continente hacia el norte." #NT!
  
 #Crafting 
 game_concept_resources: "Recursos" #NT!
 game_concept_resources_desc: "Los recursos incluyen [zz_iron|E], [zz_steel|E], [zz_obsidian|E] y [zz_valyrian_steel|E], que son una reserva de materiales para la elaboración de un reino. Los edificios generadores de recursos se pueden construir en cualquier provincia que tenga una propiedad." #NT!
 game_concept_crafting_resources_tooltip: "@lov_icon_resources!" #NT!
  
 zz_iron: "Hierro" #NT!
 game_concept_zz_iron: "$zz_iron$" #NT!
 game_concept_zz_iron_desc: "El hierro es un metal fuerte que se utiliza a menudo en herramientas y armamento, y puede extraerse en provincias que tengan una mina de hierro construida. Es el metal base de [zz_steel|E]." #NT!
 game_concept_iron_tooltip: "@lov_icon_iron!" #NT!
  
 zz_steel: "Acero" #NT!
 game_concept_zz_steel: "$zz_steel$" #NT!
 game_concept_zz_steel_desc: "El acero es una aleación dura de [zz_iron|E] y carbono que se utiliza a menudo para fabricar armas y armaduras. Las forjas de acero producen acero y requieren minas de hierro para su construcción." #NT!
 game_concept_steel_tooltip: "@lov_icon_steel!" #NT!
  
 zz_obsidian: "Obsidiana" #NT!
 game_concept_zz_obsidian: "$zz_obsidian$" #NT!
 game_concept_zz_obsidian_desc: "La obsidiana, comúnmente conocida como dragonglass por la gente común, es un vidrio volcánico formado por el inmenso calor y presión de la tierra. Las provincias con depósitos de obsidiana (normalmente provincias con volcanes) pueden producir obsidiana a partir de minas dedicadas a la obsidiana." #NT!
 game_concept_obsidian_tooltip: "@lov_icon_obsidian!" #NT!
  
 zz_valyrian_steel: "Acero Valyrio" #NT!
 game_concept_zz_valyrian_steel: "$zz_valyrian_steel$" #NT!
 game_concept_zz_valyrian_steel_desc: "Valyrian Steel es un tipo de [zz_steel|E] de Valyria, utilizado para fabricar armas y otros elementos de calidad incomparable. La magia juega un papel en su forjado, lo que hace que el acero sea especial y le confiere características mágicas. [dragonlords|E] puede producir acero valyrio en forjas especiales de acero valyrio que se pueden construir en provincias con minas de hierro." #NT!
 game_concept_zz_v_steel: "V. Acero" #NT!
 game_concept_v_steel_tooltip: "@lov_icon_valyrian_steel!" #NT!

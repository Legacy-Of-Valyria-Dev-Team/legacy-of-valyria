   # Participant Groups 
 valyria_situation_participant_group_blood_of_valyria: "La sangre de Valyria" #NT!
 valyria_situation_participant_group_blood_of_valyria_desc: "Todos aquellos que dicen ser de ascendencia valyria, sean o no verdaderos descendientes. Esto incluye a todos, desde los Targaryen y Velaryon, hasta la Vieja Sangre de Volantis y otras casas nobles que remontan su linaje a Valyria." #NT!
 valyria_situation_participant_group_restorationists: "Restauracionistas valyrios" #NT!
 valyria_situation_participant_group_restorationists_desc: "Todos aquellos que buscan restaurar Valyria a su antigua gloria recuperando las tierras perdidas por Doom y reconstruyendo sus grandes ciudades a pesar de no ser descendientes directos de Valyria." #NT!
 valyria_situation_participant_group_remnants: "Restos del dominio absoluto" #NT!
 valyria_situation_participant_group_remnants_desc: "Todos aquellos que de alguna manera sobrevivieron al Doom y son todo lo que queda del antiguo Freehold." #NT!
 valyria_situation_participant_group_opportunists: "Carroñeros de la perdición" #NT!
 valyria_situation_participant_group_opportunists_desc: "Todos aquellos que buscan sacar provecho de las ruinas de Valyria, ya sea mediante el comercio, el saqueo u otros medios. Esto incluye comerciantes, aventureros y cazadores de tesoros que ven el potencial de riqueza en las ruinas antiguas." #NT!
  
  

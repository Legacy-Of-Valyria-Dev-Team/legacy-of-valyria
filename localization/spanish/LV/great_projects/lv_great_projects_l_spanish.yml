l_spanish:
 great_project_type_lv_rehabilitate_valyria: "Rehabilitar a Valyria" #NT!
 great_project_type_lv_rehabilitate_valyria_desc: "Valyria, que alguna vez fue el corazón ardiente del mundo, ahora no es más que una tierra maldita y envenenada. Las Catorce Llamas todavía arden y el aire está lleno de cenizas y vapores tóxicos. Sin embargo, los cimientos de la grandeza de Valyria permanecen, enterrados bajo la ruina y la desolación dejadas tras la Perdición. Restaurar la tierra puede ser casi imposible, pero con un esfuerzo y una dedicación monumentales, tal vez Valyria algún día pueda resurgir de las cenizas." #NT!
  
 great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_fallback: "El terreno del seleccionado [region|E] en [valyria|E] será rehabilitado" #NT!
 great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated: "Se rehabilitará el terreno del [region|E] de [sub_region.GetName]" #NT!
 great_project_type_lv_rehabilitate_valyria_region_is_rehabilitated_stop_danger: "Atravesar este [region|E] ya no supondrá peligros significativos por los efectos persistentes de Doom o por bestias como los vermis de fuego." #NT!
  
 LV_REHABILITATE_VALYRIA_MUST_BE_COUNTY_CAPITAL: "Los esfuerzos de rehabilitación deben basarse en la capital del condado de este ducado." #NT!
 LV_REHABILITATE_VALYRIA_CAN_PLAN_IN_LOCATION: "No debe haber otros grandes proyectos en marcha para rehabilitar Valyria dentro de este ducado." #NT!
 LV_REHABILITATE_VALYRIA_MUST_OWN_SUBREGION: "Usted o su [liege|E] deben controlar completamente al menos un [region|E] de [valyria|E] del tamaño de un ducado restaurable para planificar un esfuerzo de rehabilitación." #NT!
 LV_REHABILITATE_VALYRIA_CAN_START_PLANNING: "Hay regiones elegibles en [valyria|E] para rehabilitar que no tienen esfuerzos de rehabilitación en curso." #NT!
  
 great_project_type_lv_rehabilitate_valyria_contribution_discount_tooltip: "Debido a sus esfuerzos de rehabilitación anteriores y a sus éxitos pasados ​​en Valyria, los costos de contribución para este proyecto se reducen." #NT!
  

l_spanish:
  
 building_type_tower_of_lyria_01: "La Torre de Lyria" #NT!
 building_type_tower_of_lyria_01_desc: "La torre de un antiguo mago de los perdidos [valyrian_freehold_short|E]. Nadie entiende muy bien cómo logró permanecer, pero hay magias muy arcanas que se doblan y fluyen en esta torre." #NT!
 building_tower_of_lyria_01: "La Torre de Lyria" #NT!
 building_tower_of_lyria_01_desc: "Un alto punto focal de poder místico. No se sabe por qué, pero las energías de la magia se vuelven considerablemente más disponibles para aquel que conceptualmente puede considerar suya esta torre." #NT!
  
 building_type_tower_of_lyria_02: "La Torre de Lyria" #NT!
 building_type_tower_of_lyria_02_desc: "La torre de un antiguo mago de los perdidos [valyrian_freehold_short|E]. Nadie entiende muy bien cómo logró permanecer, pero hay magias muy arcanas que se doblan y fluyen en esta torre." #NT!

 building_type_zz_valyria_iron_mine_02: "mina de hierro" #NT!
 building_type_zz_valyria_iron_mine_02_desc: "Una importante operación minera de hierro, que comprende varios pozos reforzados con madera de medio bosque. Los trabajadores de los pueblos cercanos trabajan día y noche en los numerosos túneles de la mina." #NT!
 building_zz_valyria_iron_mine_02: "mina de hierro" #NT!
 building_zz_valyria_iron_mine_02_desc: "Una importante operación minera de hierro, que comprende varios pozos reforzados con madera de medio bosque. Los trabajadores de los pueblos cercanos trabajan día y noche en los numerosos túneles de la mina." #NT!

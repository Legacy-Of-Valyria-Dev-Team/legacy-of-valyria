 building_type_valyria_mines_01: "Mina de las Catorce Llamas" #NT!
 building_type_valyria_mines_01_desc: "Estas minas se extienden hasta las profundidades de las Catorce Llamas, abismos interminables que se tragan a miles de mineros bañados por el calor de la tierra. Los minerales preciosos abundan en cantidades iguales a los peligros letales, lo que hace que la vida de quienes los habitan sea rentable y corta." #NT!
 building_valyria_mines_01: "Mina volcánica infestada de Wyrm" #NT!
 building_valyria_mines_01_desc: "Las minas que anteriormente sondeaban las profundidades de este volcán yacían vacías, y los restos de sus entramados fueron destruidos por gusanos de fuego y otras bestias. No obstante, aún es posible obtener su recompensa." #NT!
 building_valyria_mines_02: "Venas chamuscadas" #NT!
 building_valyria_mines_02_desc: "Los túneles más profundos siguen siendo traicioneros, pero los mineros decididos han comenzado a extraer mineral de las secciones menos volátiles. Los pozos reforzados ahora producen rastros de oro y hierro, aunque la presencia de gusanos de fuego persistentes hace que las operaciones sean cautelosas y costosas." #NT!
 building_valyria_mines_03: "Mina volcánica" #NT!
 #building_valyria_mines_03_desc: "Esta peligrosa mina es famosa por sus ricas vetas de oro y plata, intercaladas con depósitos de hierro. La intensa actividad geotérmica también ha creado bolsas de valiosas piedras preciosas, incluidos rubíes y zafiros, forjadas en el crisol fundido de la tierra." #NT!
 building_valyria_mines_03_desc: "Esta mina se sumerge profundamente en los abismos del volcán, donde miles de personas trabajan en un calor sofocante, pasando la vida extrayendo la riqueza de la tierra. Ricas vetas de oro y plata serpentean a través de la piedra volcánica, intercaladas con depósitos de hierro. La intensa actividad geotérmica también ha forjado bolsas de rubíes y zafiros, cuya belleza contrasta cruelmente con los peligros letales que acechan a los mineros en igual medida." #NT!
  
 building_type_valyria_mines_dormant_01: "Mina de las Catorce Llamas" #NT!
 building_type_valyria_mines_dormant_01_desc: "Estos túneles, que alguna vez fueron una fuente activa de metales preciosos, quedaron sellados por capas de roca endurecida cuando el volcán quedó en silencio. Los movimientos de la tierra han dejado algunos pasajes inestables, algunos dicen que los sonidos de los Firewyrms todavía se pueden escuchar resonando en los pasajes." #NT!
 building_valyria_mines_dormant_01: "Mina sellada" #NT!
 building_valyria_mines_dormant_01_desc: "Estos túneles, que alguna vez fueron una fuente activa de metales preciosos, quedaron sellados por capas de roca endurecida cuando el volcán quedó en silencio. Los movimientos de la tierra han dejado algunos pasajes inestables, algunos dicen que los sonidos de los Firewyrms todavía se pueden escuchar resonando en los pasajes." #NT!
 building_valyria_mines_dormant_02: "Mina desenterrada" #NT!
 building_valyria_mines_dormant_02_desc: "Los esfuerzos de recuperación han comenzado, a medida que los buscadores regresan a túneles olvidados en busca de riquezas. Se han erigido refuerzos contra la piedra debilitada por el tiempo, y los primeros carros de hierro y oro han comenzado a emerger una vez más de las profundidades." #NT!
 building_valyria_mines_dormant_03: "Mina volcánica inactiva" #NT!
 building_valyria_mines_dormant_03_desc: "Aunque el fuego del volcán hace tiempo que se apagó, su recompensa sigue siendo enorme, esperando sólo a aquellos que estén dispuestos a reclamarla. Los peligros aún persisten en los túneles más profundos donde se extraen ricas vetas de plata, hierro y oro." #NT!
 building_type_zz_valyria_iron_mine_01: "Pozo de hierro abierto" #NT!
 building_type_zz_valyria_iron_mine_01_desc: "Poco más que un agujero en la tierra, poblado por un pequeño número de mineros que excavan las vetas de hierro que contiene." #NT!
 building_zz_valyria_iron_mine_01: "Pozo de hierro abierto" #NT!
 building_zz_valyria_iron_mine_01_desc: "Poco más que un agujero en la tierra, poblado por un pequeño número de mineros que excavan las vetas de hierro que contiene." #NT!

 building_type_zz_valyria_iron_mine_03: "Complejo Minero de Hierro" #NT!
 building_type_zz_valyria_iron_mine_03_desc: "Un extenso complejo de pozos, montones de escombros y hornos, rodeado por las aldeas de los indigentes que vivirán y morirán en sus abismos y sus alrededores." #NT!

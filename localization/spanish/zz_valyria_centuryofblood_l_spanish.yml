 zz_valyria_centuryofblood: "El siglo de la sangre" #NT!
 zz_valyria_centuryofblood_group: "Después de la perdición" #NT!
 zz_valyria_centuryofblood_desc: "El Feudo Valyrio ha caído, colapsando cuando la península fue destruida en Doom. En cuestión de pocas horas, Valyria desapareció y Freehold fue destruido. La Casa Targaryen se había trasladado a Rocadragón, el puesto avanzado más occidental de Valyria situado en el Mar Angosto, asegurando así su supervivencia.\n\nAlgunos otros señores dragón, aquellos que no habían estado en Valyria cuando ocurrió la Perdición, también sobrevivieron. En Tyrosh, Lys y Qohor, se dice que los señores dragón se salvaron de la destrucción y ahora no estaban seguros de lo que les deparaba el futuro. #bold \n\nAurion Varezys, un señor dragón que había estado visitando Qohor, se proclamó el primer emperador de Valyria y reunió fuerzas de Qohorik. Con su dragón y un ejército de treinta mil hombres marcha para reclamar los restos de Valyria...#!" #NT!
  
 bookmark_99_arrec_durrandon: "rey arrec" #NT!
 bookmark_99_arrec_durrandon_desc: "Arrec Durrandon, rey de las Tierras de las Tormentas y de las ricas Tierras de los Ríos que fueron conquistadas por su antepasado Arlan III Durrandon trescientos años antes, se sienta en el Trono del Rey de las Tormentas. Sin embargo, su gobierno no es seguro, ya que muchos de los otros reyes de [westeros|E] continúan envidiando la riqueza potencial que proviene de Riverlands. Desde el Oeste, los Hijos del Hierro comienzan a moverse, potencialmente con la ambición de recuperar las Tierras de los Ríos de los Reyes Tormenta." #NT!
 bookmark_99_arrec_durrandon_subheading: "El rey tormenta" #NT!
 bookmark_99_erich_durrandon: "Erich Durrandón" #NT!
 bookmark_99_monfryd_durrandon: "Monfryd Durrandon" #NT!
  
 bookmark_99_aenar_targaryen: "Rey Enar" #NT!
 bookmark_99_aenar_targaryen_desc: "Doce años antes del [doom_of_valyria|E], la hija de Aenar, Daenys la Soñadora, predijo la destrucción de [valyria|E]. En respuesta a esto, Aenar vendió sus propiedades en [valyrian_freehold|E] y las Tierras del Largo Verano, y se mudó con su familia y [dragons_plural|E] a Rocadragón, el puesto avanzado más occidental de [valyrian_freehold|E]. Los Targaryen estaban lejos de ser los más poderosos de los [dragonlords|E], y sus rivales en [valyria|E] vieron su huida como un acto de cobardía. Sin embargo, debido a que Aenar había alejado a su familia de [valyria|E], los Targaryen fueron los más fuertes de los [dragonlords|E] en sobrevivir al [doom|E]." #NT!
 bookmark_99_aenar_targaryen_subheading: "Señor de Rocadragón" #NT!
 bookmark_99_gaemon_targaryen: "Gaemon Targaryen" #NT!
 bookmark_99_daenys_targaryen: "Daenys 'La Soñadora' Targaryen" #NT!
  
 # bookmark_99_garland_gardener: "Jardinero Garland VI" #NT!
 # bookmark_99_garland_gardener_desc: "El rey Garland VI llegó a Oakenseat cuando aún era minoría. El Gran Mayordomo del Dominio, un Tyrell, gobernó como regente hasta que Garland alcanzó la mayoría de edad. Garland VI ahora gobierna uno de los reinos más fuertes de [westeros|E]. Un rey inteligente, aunque cínico, las ambiciones de Garland sólo las conoce él mismo y sólo el tiempo dirá hasta dónde llegará House Gardener." #NT!
 # bookmark_99_elissa_florent: "Elisa Florent" #NT!
 # bookmark_99_mern_gardener: "Mern jardinero" #NT!
  
 bookmark_99_qhorwyn_hoare: "Rey Qhorwyn" #NT!
 bookmark_99_qhorwyn_hoare_desc: "Qhorwyn ha sido un rey astuto de las Islas del Hierro que ha evitado la guerra y, en cambio, ha acumulado riquezas durante su reinado. Triplicó el tamaño de las flotas de la Casa Hoare y ordenó la creación de armamento adicional para disuadir a los enemigos de atacar.\n\nEl tercer hijo de Qhorwyn, Harwyn, ha regresado a las Islas del Hierro después de aventurarse durante los dos años anteriores para encontrar a su padre enfermo y enfermo con su hermano Harlan preparándose para asumir el manto de Rey de las Islas del Hierro. Ambos hermanos tienen la ambición de tomar el poder militar de su padre y reclamar el Reino del Tridente de manos de los Durrandon, con la única pregunta de si pueden trabajar juntos para este objetivo, o si uno intentará reclamar poder sobre el otro." #NT!
 bookmark_99_qhorwyn_hoare_subheading: "Rey de las Islas del Hierro" #NT!
 bookmark_99_harlan_hoare: "Harlan Hoare" #NT!
 bookmark_99_harwyn_hoare: "Harwyn Hoare" #NT!
  
 bookmark_99_tommen_lannister: "Rey Tommen II" #NT!
 bookmark_99_tommen_lannister_desc: "Tommen II Lannister, conocido como el Rey León, es el Rey de la Roca de la Casa Lannister. Habiendo oído hablar del posible colapso del Feudo Valyrio en un [doom|E] de fuego, se prepara para lanzar una expedición al antiguo [valyrian_freehold_short|E] para saquear las riquezas y la hechicería que seguramente quedaron. La expedición seguramente será peligrosa y por eso la pregunta es: ¿Tommen II debería arriesgarlo todo para regresar a [valyria|E] o aprovechar el enorme vacío de poder tras la desaparición de [valyrian_freehold_short|E] y apoderarse de [essos|E] para expandir la riqueza y el nombre de los Lannister en todo [known_world|E]?" #NT!
 bookmark_99_tommen_lannister_subheading: "rey de la roca" #NT!
 bookmark_99_ellyn_tarbeck: "Ellyn Tarbeck" #NT!
 bookmark_99_tyrion_lannister: "Tyrion Lannister" #NT!
  
 bookmark_99_aurion_varezys: "Emperador Aurión" #NT!
 bookmark_99_aurion_varezys_desc: "[Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_copy|q$' )|E]\nAurion Varezys, uno de los pocos Señores Dragón supervivientes varados en Qohor, reunió fuerzas entre los colonos de Qohorik y se declaró primer emperador de [valyria|E]. En lo alto de su [dragon|E], él y sus treinta mil hombres marchan para reclamar lo que queda de [valyria|E], o tal vez para crear un Nuevo [valyria|E] por derecho de conquista del [free_cities|E] de [essos|E].\n\n#bold ¿Aurion arriesgará todo para reclamar su antiguo hogar, o forjará un nuevo camino con los Señores Dragón restantes para que el sueño de [valyria|E] se cumpla? ¿Permanecer a la vanguardia de la mente del mundo? [Concept( 'story_content_aurion_varezys_99', '$bm_story_content_available_copy|q$' )|E]0" #NT!
 bookmark_99_aurion_varezys_subheading: "El emperador de Valyria" #NT!
 bookmark_99_maelys_varezys:0 "Maelys Varezys" #NT!
  
 bookmark_99_lucifer_justman: "Rey del río Lucifer" #NT!
 bookmark_99_lucifer_justman_desc: "Tres siglos después de que un Lucifer Justman anterior se declarara Rey del Río por derecho de sangre, un nuevo aspirante a la corona del Tridente ha desembarcado en Blackwater Bay. Parado en las orillas del pequeño pueblo de pescadores en la desembocadura del Tridente, Lucifer debe tomar su pequeño séquito y decidir un camino para reclamar las tierras de sus antepasados. ¿Qué reino sería el más beneficioso para expulsar a los Durrandon de las tierras de su familia? ¿Los Jardineros de Alto Jardín, los Lannister de Roca Casterly o los Arryn del Valle?" #NT!
 bookmark_99_lucifer_justman_subheading: "El rey del río" #NT!
  

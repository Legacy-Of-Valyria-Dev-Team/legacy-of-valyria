 cob_7899_scenerio.0525.t: "Encuentro con un centurión valyrio" #NT!
 cob_7899_scenerio.0525.desc: "Viajamos a través de las tierras en ruinas de [location.GetName], el aire espeso con humo volcánico y cenizas que oscurecieron la vista y al mismo tiempo dejaron sin aliento a todos en mi anfitrión. Decido que deberíamos tomarnos un momento para orientarnos y pedir que me traigan a [vassarion.GetName] para que pueda volar por encima de las nubes. Mientras espero, uno de mis exploradores llama y me giro para ver un grupo de figuras que parecen ser soldados valyrios emergiendo de la niebla armados con ballestas y espadas. Uno del grupo vestido con las vestimentas andrajosas de un general valyrio sale de la niebla para pararse frente a mí.\n\n"Soy [freeholder_survivor.GetName] y tengo a tu anfitrión rodeado. [location.GetName] ha sido reclamado por nosotros y te rendirás ante mí".\n\nAhora debo decidir qué debo hacer. ¿Intento enfrentarme a [freeholder_survivor.GetName] en combate singular? ¿Enviar a [vassarion.GetName] a pelear? ¿O deberíamos retirarnos?" #NT!
 cob_7899_scenerio.0525.a: "Me enfrentaré a [freeholder_survivor.GetName] yo mismo" #NT!
 cob_7899_scenerio.0525.a_tt: "Un duelo comienza con [freeholder_survivor.GetName]" #NT!
 cob_7899_scenerio.0525.b: "¡Te enfrentarás a [vassarion.GetName]!" #NT!
 cob_7899_scenerio.0525.b_1_tt: "[freeholder_survivor.GetName] muere!" #NT!
 cob_7899_scenerio.0525.b_2_tt: "[vassarion.GetName] muere!" #NT!
 cob_7899_scenerio.0525.b.win: "[vassarion.GetName] muertes [freeholder_survivor.GetName]" #NT!
 cob_7899_scenerio.0525.b.dead: "[freeholder_survivor.GetName] logra sobrevivir contra [vassarion.GetName]" #NT!
 cob_7899_scenerio.0525.c: "¡Debo retirarme!" #NT!
 cob_7899_scenerio.0525.c_tt: "tu escapas" #NT!
  
 cob_7899_scenerio.0527.t: "Emboscado por un Señor Dragón" #NT!
 cob_7899_scenerio.0527.desc: "Mientras vuelo sobre [vassarion.GetName] a la vanguardia de mi anfitrión sobre las ruinas de [location.GetName], un grito penetrante corta el aire seguido de una enorme bola de llamas de dragón que casi incinera todo a mi alrededor.\n\nMe reoriento para escanear las nubes de arriba en busca de lo salvaje que [dragon|E] logró sobrevivir al cataclismo para atacarme. Poco antes de que el agresor se diera a conocer, para mi sorpresa, el [dragon|E] tenía un jinete que comenzó a hacer flotar su igualmente enorme bestia ante mí. Decido hablar con [freeholder_dragonlord.GetHerHim] antes de otro ataque.\n\n"Soy [aurion.GetName] y he regresado a estas tierras para reclamarlas para [valyria|E]." Grito hacia el [dragonlord|E]\n\n"No me importa [aurion.GetName], soy [freeholder_dragonlord.GetName], jinete de [location.GetName]0 y reclamo todas estas tierras a las que estás invadiendo"." #NT!
 cob_7899_scenerio.0527.a: "Me enfrentaré a [freeholder_dragonlord.GetName] y [freeholder_dragonlord.GetHerHis] [dragon|E]" #NT!
 cob_7899_scenerio.0527.a_tt: "Un duelo de [dragon|E] comienza con [freeholder_dragonlord.GetName]" #NT!
 cob_7899_scenerio.0527.b: "¡Debo retirarme!" #NT!
 cob_7899_scenerio.0527.b_tt: "tu escapas" #NT!
  
 cob_7899_scenerio.0529.t: "Un regreso a casa agridulce" #NT!
 cob_7899_scenerio.0529.desc: "Bajo del barco hacia los muelles de piedra en ruinas de [location.GetName], con los ojos fijos en las puertas carbonizadas y en ruinas de la capital valyria.\n\n'Estoy en casa', pienso para mis adentros. 'Finalmente estoy en casa... pero todavía hay mucho trabajo por hacer antes de que el [valyrian_freehold_short|E] se levante nuevamente.'\n\nMe arrodillo y coloco mi mano sobre la cálida piedra del muelle por un breve momento, levanto la cabeza una vez más y me dispongo a restaurar las ruinas de esta poderosa ciudad una vez más..." #NT!
 cob_7899_scenerio.0529.a: "Regresé a casa en [valyria|E] y encontré un Freehold Circlet..." #NT!
 cob_7899_scenerio.0529.b: "Regresé a casa en [valyria|E] y encontré una corona de dominio absoluto..." #NT!
 cob_7899_scenerio.0529.tt: "Tus tropas Qohorik serán disueltas para servir como guardianes de la ciudad." #NT!
  
 # Updated Firewyrm Attack 
 cob_7899_scenerio.0541.t: "¡Ataque de vermis de fuego!" #NT!
 cob_7899_scenerio.0541.desc: "Cuando el campamento llega a las ruinas de [location.GetName], sentimos que el suelo tiembla bajo nuestros pies, mientras el pánico comenzó a extenderse por el grupo, el suelo ante nosotros se abrió cuando un enorme Firewyrm emerge para desafiarnos a atravesar.\n\n "¡Mi [ROOT.Char.GetLadyLord]! ¿Qué hacemos?" Grita uno de los cortesanos caminando lentamente hacia atrás como si quisiera retirarse. Miro a mi alrededor al ejército que ha elegido seguirme en esta búsqueda y ahora debe decidir exactamente cómo manejaremos esta situación..." #NT!
 cob_7899_scenerio.0541.duel.dragon: "[vassarion.GetName]! ¡Aderī!" #NT!
 cob_7899_scenerio.0541.duel.dragon.tt: "Llamas rápidamente a tu dragón y te preparas para enfrentarte a la bestia." #NT!
 cob_7899_scenerio.0541.duel: "Entonces acero y fuego. Que los dioses den testimonio." #NT!
 cob_7899_scenerio.0541.duel.tt: "Te mantienes firme e intentas matar al vermis de fuego." #NT!
 cob_7899_scenerio.0541.b: "¡Debemos retirarnos!" #NT!
  
 cob_7899_scenerio.9998.t: "La expedición perdida de Aurion" #NT!
 cob_7899_scenerio.9998.desc: "Viajando a través de las tierras de Valyria, tu grupo se topa con lo que parece ser un enorme cementerio de esqueletos congelados en varias poses de terror...\n\nDespués de un poco de exploración, determinas que este debe ser el lugar de descanso final de la expedición de Aurion Varezy a Valyria; en el centro de la carnicería encuentras el esqueleto de un gran dragón que rodea el esqueleto blindado de su jinete, que crees que es Aurion. A primera vista parece como si el dragón estuviera tratando de proteger a Aurion de... algo. Una sensación de pavor te recorre al pensar en algo tan horrible que un dragón de ese tamaño sabía que el fin estaba cerca.\n\nDebes decidir ahora si perturbarás esta tumba y recuperarás la espada y la armadura de la Casa Varezys, sabiendo que, según la antigua tradición, tal acción resultará en un castigo..." #NT!
 cob_7899_scenerio.9998.a: "Toma los artefactos y acepta el castigo." #NT!
 cob_7899_scenerio.9998.b: "Reclamaré mi legado familiar" #NT!
 cob_7899_scenerio.9998.c: "Estos artefactos deberían permanecer en este cementerio." #NT!
  
  
 cob_7899_scenerio.9999.t: "Intento de desafío a los dioses" #NT!
 cob_7899_scenerio.9999.desc: "Te encuentras en medio de un sueño, un miedo profundamente arraigado fluye a través de ti mientras una voz brama desde la oscuridad\n\n"Has intentado desafiar la voluntad de los dioses, el artefacto que intentaste convocar se ha perdido en la magia profunda y no se puede recuperar hasta el momento en que los dioses así lo consideren".\n\nSólo unos momentos después logras despertarte, confundido por lo que acaba de ocurrir...\n\nNOTA DEL DEV: este artefacto actualmente no puede generarse a través de depurar ya que hay una cadena de eventos oculta en el mundo para recuperarla" #NT!
 cob_7899_scenerio.9999.a: "Realmente necesito dejar de beber..." #NT!
 cob_7899_scenerio.9999.b: "HAGO LO QUE QUIERO (no presiones esto, pero lo harás de todos modos)" #NT!
  
 cob_decisions.0001.t: "¿Un mensaje de Valyria?" #NT!
 cob_decisions.0001.desc: "Miro la carta que tengo en la mano con simple incredulidad. Alguien llamado [dragonlord_of_valyria.GetName] ha afirmado haber repoblado Valyria y está pidiendo que todos los jinetes de dragones regresen para reclamar su derecho de nacimiento. He disfrutado mi vida como jinete de dragón en este mundo y no sé si deseo vivir bajo el gobierno de otra persona..." #NT!
 cob_decisions.0001.a: "Aceptaré [dragonlord_of_valyria.GetNamePossessive] propuesta" #NT!
 cob_decisions.0001.b: "Debo rechazar y encontrar mi propio camino." #NT!
  
 cob_decisions.0002.t: "Una propuesta aceptada" #NT!
 cob_decisions.0002.desc: "Miro el pergamino que tengo en las manos y celebro en silencio mi buena suerte. [dragonlord.GetName] ha aceptado mi propuesta y desea acudir a mi tribunal de inmediato. Hoy es verdaderamente un día glorioso para Valyria." #NT!
 cob_decisions.0002.a: "Haré los preparativos para recibirlos." #NT!
  
 cob_decisions.0003.t: "Una propuesta rechazada" #NT!
 cob_decisions.0003.desc: "No puedo creer las palabras que estoy leyendo... [dragonlord.GetName] ha rechazado mi propuesta de venir a Valyria y reclamar su derecho de nacimiento. Esto es realmente un revés, pero, tal vez una vez que junte más poder y títulos pueda intentar atraerlos una vez más con más éxito..." #NT!
 cob_decisions.0003.a: "seguiremos adelante" #NT!
  
  

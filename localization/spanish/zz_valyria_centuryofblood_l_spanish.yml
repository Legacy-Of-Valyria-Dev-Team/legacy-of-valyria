  #Aurion Events 
 cob_7899_scenerio.0500.t: "Llegada al Palacio de Nymeria" #NT!
 cob_7899_scenerio.0500.desc: "Camino por los pasillos del palacio en ruinas de [location.GetName] que alguna vez fue el hogar de [Nymeria.GetName] de los Rhoynar y me siento devuelto a las historias que mi madre me contaba cuando era niña. Historias sobre los [dragonlords|E] de antaño y sus conquistas en [essos|E], tomando lo que era suyo por derecho divino y la llama del dragón. Los que se inclinaron se salvaron y los que resistieron fueron expulsados ​​del mundo o conducidos al exilio y sus antiguos reinos se pudrieron igual que este.\n\nMientras dejo que esas historias fluyan en mi mente, no puedo evitar preguntarme si el [valyrian_freehold_short|E] se debilitó con el paso del tiempo, me pregunto si esos conquistadores, esos héroes de las historias mirarían a mis hermanos y sentirían vergüenza por lo que nos convertimos. [valyria|E] alguna vez fue el pináculo del mundo, pero al final parecía como si no fuéramos más que niños peleando por el poder y la riqueza... tal vez es por eso que [ROOT.Char.GetFaith.HighGodName] eligió [doom|E] nuestra gente... quizás yo he sido elegido para mantener vivo el sueño de [valyria|E]." #NT!
 cob_7899_scenerio.0500.a: "Avanzamos hacia Gloomy Gate" #NT!
 cob_7899_scenerio.0500.a_tt: "Viaja a la puerta sombría" #NT!
  
 cob_7899_scenerio.0501.t: "La decisión en la puerta sombría" #NT!
 cob_7899_scenerio.0501.desc: "Mientras estoy contemplando las aguas del Rhoyne, las ruinas de [location.GetName], otra de las conquistas de [valyrian_freehold_short|E], detrás de mí, me doy cuenta de que en este momento tengo una opción. Puedo continuar con la búsqueda que imaginé al comienzo de este viaje y hacer marchar a mi anfitrión sobre los restos posiblemente carbonizados y llenos de magma de [valyria|E] y restaurar el poder de [valyrian_freehold_short|E] a mi propia imagen... o... puedo encarnar el espíritu del primer [dragonlords|E] de [valyria|E], reunir a los Señores Dragón supervivientes en [essos|E] y reclamar las colonias de [valyrian_freehold_short|E] mediante el derecho de conquista dragonfire\n\nMientras estoy en la frontera de [GetTitleByKey('k_volantis').GetName] debo decidir: ¿hago el viaje a las tierras quemadas de [GetTitleByKey('e_valyria').GetName], o sigo adelante y creo un nuevo [valyria|E] de la misma manera que mis antepasados?\n\n[valyrian_freehold_short|E]1 ADVERTENCIA: cualquiera de los dos caminos debería resultar difícil, se recomienda que guardes con frecuencia para evitar que se acabe el juego[valyrian_freehold_short|E]2" #NT!
 cob_7899_scenerio.0501.b: "Conquistaré el [free_cities|E] para formar un Nuevo [valyria|E]" #NT!
 cob_7899_scenerio.0501.a: "Debemos reabastecernos en Volantis." #NT!
 cob_7899_scenerio.0501.a_tt: "Viajar a Volantis" #NT!
  
  ##Aurion Valyria Expedition 
  
 cob_7899_scenerio.0502.t: "Reabastecimiento en El Puente Largo" #NT!
 cob_7899_scenerio.0502.desc: "Lo primero que noté de [location.GetName] fue el ruido incesante e interminable que parecía abarcar cada rincón de la ciudad. No podía decirlo con certeza, pero casi parecía como si la ciudad tuviera de alguna manera diez veces el volumen de la capital valyria y fuera menos de la mitad de su tamaño. Lo único que era peor que el ruido era el olor, la gente sucia, las letrinas usadas en exceso y con mal mantenimiento, el pescado y una gran cantidad de otras cosas mezcladas para formar el más impío de los olores a lo largo del largo puente donde mi campamento estaba obteniendo suministros.\n\nAfortunadamente, no pasaría mucho tiempo antes de que volviéramos a la marcha hacia [valyria|E] para reclamar nuestro hogar. Mientras pasaba por las calles, noté un grupo cada vez mayor de personas que celebraban la desaparición de mi patria, declarando que el mundo finalmente estaba libre de las garras asfixiantes del [valyrian_freehold_short|E]. No interactué con ellos, agradecido de haber mantenido a [vassarion.GetName] fuera de la ciudad para evitar confrontaciones innecesarias en mi viaje.\n\nNinguno de sus pensamientos realmente importó, ya que verían la verdad de que yo, [aurion.GetName], regresaría a [valyria|E] y lo traería de regreso a la altura que alguna vez tuvo. Por ahora, podría tomarme un momento para relajarme antes de continuar hacia lo que queda de mi casa..." #NT!
 cob_7899_scenerio.0502.a: "Es hora de seguir adelante con Little [valyria|E]" #NT!
 cob_7899_scenerio.0502.a_tt: "Viaja a Little [valyria|E]" #NT!
  
 cob_7899_scenerio.0503.t: "Llegada al borde del [valyrian_freehold_short|E]" #NT!
 cob_7899_scenerio.0503.desc: "Estoy aquí, en el borde de Volantis, en las afueras de [location.GetName], y realmente no puedo creer lo que veo mientras contemplo las tierras que se encuentran a sólo unas leguas más adelante. Una nube tan negra como la noche rompió el cielo azul, creando una lluvia que provocaba que la piel ardiese al tocarla. Las tierras que había delante parecían tener una neblina que hacía que mi visión se nublara y no pudiera ver lo que podría haber delante de mí y de mi caravana, creando una sensación de temor que podía sentir extendiéndose entre las filas. Me volví hacia Vassarion y volví a subir a la silla antes de devolver a la bestia hacia mi anfitrión.\n\n"Ha sido un largo viaje y el camino por delante parece sombrío, amigos míos. Sin embargo, todos hemos sido elegidos con un propósito divino de recuperar lo que parece perdido para ahuyentar la oscuridad y traer la luz de nuevo a este mundo. [valyria|E] ¡para todos los que están en este mundo!"\n\nLa alegría que surgió de las tropas fue toda la confirmación que necesitaba para decir que estaban listos para enfrentar lo que pudiera venir..." #NT!
 cob_7899_scenerio.0503.a: "Es hora de recuperar nuestro hogar." #NT!
 cob_7899_scenerio.0503.a_tt: "Viaja a [valyria|E]" #NT!
  
  ##Aurion New Valyria Conquest 
  
 cob_7899_scenerio.0510.t: "Emperador Aurion I de Nuevo [valyria|E]" #NT!
 cob_7899_scenerio.0510.desc: "Cuando entro en los pasillos dorados del Viejo Volantis, me siento lleno de justa determinación. Estos eran los salones en los que [ROOT.Char.GetFaith.HighGodName] de [valyria|E] me destinaba a estar, los fundadores de la colonia de Old Volantis nunca podrían haberse dado cuenta de que la ciudad que construirían estaba destinada por derecho divino a sentar al primer Emperador de un Nuevo [valyria|E].\n\nSin embargo, no puedo estar tranquilo hasta que todas las hijas del primero [the_freehold|E] estén bajo mi estandarte, debo reunir a los [dragonlords|E] supervivientes en [essos|E] y citarlos a juicio. Desde aquí partiremos y recuperaremos lo que es legítimamente nuestro por derecho y poder divinos." #NT!
 cob_7899_scenerio.0510.a: "Saldré a unir a las hijas de [valyria|E]" #NT!
 cob_7899_scenerio.0510.tt: "Tus tropas Qohorik serán disueltas para defender la ciudad." #NT!
  
 cob_7899_scenerio.0511.t: "Todo lo que una vez fue... será una vez más" #NT!
 cob_7899_scenerio.0511.desc: "De cada rincón de [essos|E], los otros [dragonlords|E] que fueron elegidos por [ROOT.Char.GetFaith.HighGodName] para sobrevivir al [doom|E] se encuentran en mi sala de audiencias. Ante mí estaban [belaerys_house.GetFirstNameRegnal], [urnebar_house.GetFirstNameRegnal], [sonaryen_house.GetFirstNameRegnal] y [mataeryon_house.GetFirstNameRegnal] llenos del justo deseo de unirse a mí para restaurar el orden en este mundo de la misma manera que lo hicieron nuestros antepasados.\n\nTodo lo que queda ahora es lanzar una campaña de conquista a través de las antiguas colonias de [valyrian_freehold_short|E] para que podamos unirlas bajo el poder de [dragon|E] una vez más a través de la furia indómita de fuego de dragón... llegaremos a salir de Volantis pero ahora debo decidir cuál de los [dragonlords|E]0 será conquistado primero en nombre del [dragonlords|E] de Nuevo [dragonlords|E]2... ¿ataco a Myr para dar paso al avance hacia Pentos? ¿O ataque a Lys y luego a Tyrosh y obtenga el control de las regiones del sur?" #NT!
 cob_7899_scenerio.0511.a: "La Casa Urnebar gobernará Tyrosh" #NT!
 cob_7899_scenerio.0511.b: "La Casa Sonaryen gobernará Lys" #NT!
 cob_7899_scenerio.0511.c: "La Casa Mataeryon gobernará Myr" #NT!
 cob_7899_scenerio.0511.d: "La Casa Belaerys gobernará Pentos" #NT!
  
 cob_7899_scenerio.0512.t: "La Conquista del [free_cities|E]" #NT!
 cob_7899_scenerio.0512.desc: "Camino entre el campo de batalla en llamas y sangriento, los gritos de los heridos se mezclan con los vítores de celebración de mis soldados formando una especie de sinfonía impía en mis oídos. Mis soldados salen victoriosos detrás de mí mientras acepto la capitulación del Arconte, sus vítores ensordecerán al resto del mundo mientras decreto que este [free_city|E] ahora está bajo la jurisdicción directa del Nuevo [valyrian_freehold|E] y un nuevo [dragonlord|E] gobernará por derecho divino\n\nAhora debo elegir la próxima ciudad que se someterá al poder del Nuevo [valyria|E]..." #NT!
  
 cob_7899_scenerio.0516.t: "Una rama de olivo para un antiguo puesto de avanzada" #NT!
 cob_7899_scenerio.0516.desc: "Mi conquista del [free_cities|E] continúa, con el [dragonlords|E] superviviente de [valyria|E] gobernando debajo de mí. Sin embargo, mientras contemplo el mapa de mi imperio en expansión, una pequeña cadena de islas a lo largo del [narrow_sea|El] en la desembocadura de la Bahía Blackwater continúa acaparando mi atención. Coloco mi dedo sobre el mapa cerca de la mayor de estas islas... Rocadragón, un antiguo puesto de avanzada en el extremo más alejado de [valyrian_freehold|E] que ahora se mantiene independiente del Nuevo Imperio Valyrio.\n\nMientras consideraba una declaración absoluta de conquista para reclamar lo que una vez fue de [valyria|E] de la misma manera que tuve el [free_cities|E], tuve una epifanía. Los Targaryen sobrevivieron al [doom|E] de la misma manera que lo hizo el [dragonlords|E] que gobernaba mi nuevo imperio: por intervención divina. Por lo tanto, es lógico que deba enviar un mensaje a quienquiera que gobierne esa roca desolada con una oferta para ser bienvenido de nuevo al redil una vez más..." #NT!
 cob_7899_scenerio.0516.a: "Envía un cuervo con una oferta para jurar lealtad a Nuevo [valyria|E]" #NT!
  
 cob_7899_scenerio.0517.t: "¿Un cuervo del [valyrian_freehold_short|E]?" #NT!
 cob_7899_scenerio.0517.desc: "Me despiertan en mitad de la noche unos fuertes golpes en la puerta de mi dormitorio. Me las arreglo para salir de la cálida comodidad de mi cama y me pongo una bata para descubrir quién se atrevería a molestarme a esta hora tan tardía. Al abrir la puerta, encuentro al maestre de pie en el pasillo, con un mensaje de cuervo en su mano temblorosa. Tomo la carta en silencio, desenrollando el pergamino para leer el contenido dentro...\n\nVarias horas más tarde, el Señor de MarcaDeriva estaba de pie conmigo en la sala del trono de Rocadragón, con la misma expresión de sorpresa en su rostro que yo tenía sólo unas horas antes. [aurion.GetName] había tomado Dragonback y conquistado las antiguas colonias de [valyrian_freehold_short|E] para declararse Emperador de Nuevo [valyria|E] y estaba solicitando que Dragonstone declarara lealtad a este nuevo orden... ahora depende de mí decidir el destino de mi reino..." #NT!
 cob_7899_scenerio.0517.a: "Dragonstone no se inclinará ante un nuevo Dragonlord" #NT!
 cob_7899_scenerio.0517.b: "Aceptaremos esta oferta para unirnos a un Nuevo [valyria|E]" #NT!
  
 cob_7899_scenerio.0518.t: "Una rama de olivo despreciada y rota" #NT!
 cob_7899_scenerio.0518.desc: "¡Malditos cobardes!\n\nArrugué la respuesta que recibí de Rocadragón y la arrojé al hogar en llamas con rabia. ¿Cómo se atreven a creerse tan superiores que pueden negarse a formar parte de mi nuevo imperio? ¿Realmente creen que pueden estar solos en este mundo y resistir el poder del Nuevo [valyria|E]? Ese puesto de avanzada pertenecía al antiguo [the_freehold|E] y por derecho debería regresar al Imperio del Nuevo [valyria|E] independientemente de si los cobardes Targaryens lo habitan o no.\n\nAhora debo decidir qué curso de acción tomaré..." #NT!
 cob_7899_scenerio.0518.a: "¡Traeremos a Dragonstone de vuelta a [valyria|E] por la fuerza!" #NT!
 cob_7899_scenerio.0518.b: "Que se queden en su roca y se encojan" #NT!
  
 # cob_7899_scenerio.0519.t: "Una derrota vergonzosa..." #NT!
 # cob_7899_scenerio.0519.desc: "None" #NT!
 # cob_7899_scenerio.0519.a: "Hemos sido derrotados" #NT!
  
 cob_7899_scenerio.0520.t: "Rocadragón regresa a [valyria|E]" #NT!
 cob_7899_scenerio.0520.desc: "Es un día glorioso para mi nuevo Imperio: ha llegado a mi corte la noticia de que Dragonstone ha declarado su intención de jurar lealtad al Imperio de Nuevo [valyria|E]. Con esta noticia las últimas de las antiguas colonias de [valyrian_freehold_short|E] se han unido como nunca antes con un único propósito: mantener vivo el poder de [valyrian_freehold|E] en las mentes de aquellos que se deleitarían al ver nuestra desaparición. De ahora en adelante debemos permanecer unidos contra aquellos que se oponen a nosotros hasta que llegue el día en que [valyria|E] no tenga más enemigos a quienes temer." #NT!
 cob_7899_scenerio.0520.a: "Dragonstone será bienvenido en Nuevo [valyria|E]" #NT!
  
  ##Aurion Valyria Events 
  
 cob_7899_scenerio.0521.t: "¡Ataque de vermis de fuego!" #NT!
 cob_7899_scenerio.0521.desc: "Cuando el campamento llega a las ruinas de [location.GetName], sentimos que el suelo tiembla bajo nuestros pies, mientras el pánico comenzó a extenderse por el grupo, el suelo ante nosotros se abrió cuando una enorme serpiente de fuego emerge para desafiarnos a atravesar.\n\n "¡Mi [ROOT.Char.GetLadyLord]! ¿Qué hacemos?" Grita uno de los cortesanos caminando lentamente hacia atrás como si quisiera retirarse. Miro a mi alrededor al ejército que ha elegido seguirme en esta búsqueda y ahora debe decidir exactamente cómo manejaremos esta situación..." #NT!
 cob_7899_scenerio.0521.a: "Yo mismo me enfrentaré a la bestia." #NT!
 cob_7899_scenerio.0521.b: "¡Debemos retirarnos!" #NT!
 cob_7899_scenerio.0521.c: "¡Uno de mis caballeros puede encargarse de esto!" #NT!
  
 cob_7899_scenerio.0522.t: "$travel_danger_prefix$ A [valyrian_freehold_short|E] ¡Emboscada de superviviente!" #NT!
 cob_7899_scenerio.0522.desc: "Cuando nuestro anfitrión pasa por [location.GetName], un grito de batalla atraviesa el aire enrarecido de la mañana y nos provoca escalofríos. Incluso entre los viajeros más valientes, este sonido habría hecho que los hombres audaces corrieran hacia las faldas de sus madres.\n\n"Jinetes, mi [ROOT.Char.GetLadyLord]!" La voz de un explorador resuena a través de la tensión, llamando mi atención mientras desenvaina su espada y apunta hacia adelante. No hay nada que ver todavía, pero el sonido de muchos cascos, de una docena de caballos o más, se hace más fuerte y se acerca. El pánico se extiende entre nosotros como la pólvora, y otra voz se une al coro de miedo cuando aparecen. "Hay #bold tantos#!!"\n\nAlthough, su número no es enorme, los enemigos son grandes, intrépidos y aparentemente están preparados para perder la vida por nuestros bienes. A la cabeza cabalga un enorme [freeholder_looter.GetWomanMan] con los restos andrajosos de lo que alguna vez fueron finas vestimentas valyrias, armado con una gran espada de dos manos. El líder de esta banda grita su nombre para que todos lo escuchen, [freeholder_looter.GetFirstNameNicknamed]. El aspirante a asaltante declara con confianza: voz poderosa de [freeholder_looter.GetHerHis] crueldad, incursiones audaces como esta y un temperamento feroz.\n\nA medida que los asaltantes se acercan, mi caballo se sacude y resopla, amenazando con derribarme, pero sostengo las riendas con fuerza, sentándome derecho. Levantando mi [ROOT.Char.Custom('signature_weapon')] en el aire, grito..." #NT!
 cob_7899_scenerio.0522.a: "¡Hacer retroceder! ¡Vuelve de inmediato!" #NT!
 cob_7899_scenerio.0522.a.tt: "Tú y tu séquito intentan huir de los asaltantes [valyrian_freehold_short|E]." #NT!
 cob_7899_scenerio.0522.a.toast: "¡Huir!" #NT!
 cob_7899_scenerio.0522.a.fleeing: "Escapaste sin problemas. ¡Toma eso, [freeholder_looter.GetFirstName]!" #NT!
 cob_7899_scenerio.0522.a.minordelay: "Escapaste, pero eso provocó un pequeño retraso en tu viaje." #NT!
 cob_7899_scenerio.0522.a.majordelay: "Escapaste, pero eso provocó un gran retraso en tu viaje." #NT!
 cob_7899_scenerio.0522.a.minortheft: "Se las arreglaron con sus vidas, pero no con todas sus pertenencias." #NT!
 cob_7899_scenerio.0522.a.majortheft: "Consiguieron salvar sus vidas, pero su monedero se cayó de la silla mientras escapaban." #NT!
 cob_7899_scenerio.0522.a.minorcombo: "A pesar de la maniobra, [freeholder_looter.GetFirstNameNoTooltip] logró robar algunas de tus cosas." #NT!
 cob_7899_scenerio.0522.a.majorcombo: "A pesar de la complicada maniobra, [freeholder_looter.GetFirstNameNoTooltip] logró robar la mayoría de tus cosas." #NT!
 cob_7899_scenerio.0522.a.scattered: "Su séquito estaba disperso: ¡cada uno por su cuenta!" #NT!
 cob_7899_scenerio.0522.b: "¡Supérense muchachos y detrás de mí! ¡Cargar!" #NT!
 cob_7899_scenerio.0522.b.tt: "Tú y tus guardias atacan a los [valyrian_freehold_short|E] asaltantes." #NT!
 cob_7899_scenerio.0522.b.winning: "Ganas la batalla." #NT!
 cob_7899_scenerio.0522.b.win: "ganaste" #NT!
 cob_7899_scenerio.0522.b.killed: "Has matado a todos los asaltantes del grupo." #NT!
 cob_7899_scenerio.0522.b.imprisoned: "¡Has capturado al líder del grupo de asalto [valyrian_freehold_short|E], [freeholder_looter.GetFirstName]!" #NT!
 cob_7899_scenerio.0522.b.fleeing: "¡El grupo de asalto [valyrian_freehold_short|E] y su líder [freeholder_looter.GetFirstName] escaparon después de una pelea de una hora!" #NT!
 cob_7899_scenerio.0522.b.losing: "Pierdes la batalla." #NT!
 cob_7899_scenerio.0522.b.loss: "perdiste" #NT!
 cob_7899_scenerio.0522.b.robbed: "Fuiste derrotado, acorralado y robado; te quitaron todo lo que tenías." #NT!
 cob_7899_scenerio.0522.b.kidnapping: "Fuiste derrotado y los asaltantes tomaron [kidnapped_entourage.GetName]..." #NT!
 cob_7899_scenerio.0522.c: "¿Qué tal un soborno...?" #NT!
 cob_7899_scenerio.0522.c.tt: "Intentas reclutar a [freeholder_looter.GetFirstNameNoTooltip]." #NT!
 cob_7899_scenerio.0522.c.joined: "[freeholder_looter.GetFirstNameNoTooltip] se une a tu corte" #NT!
 cob_7899_scenerio.0522.c.else: "¿Pero deberías confiar en un Freeholder deshonrado?" #NT!
 cob_7899_scenerio.0522.c.ranwithmoney: "[freeholder_looter.GetFirstNameNoTooltip] Se escapó con el dinero" #NT!
 cob_7899_scenerio.0522.d: "Si dejamos [sacrificed_entourage.GetFirstNameNoTooltip], puede que nos gane tiempo." #NT!
 cob_7899_scenerio.0522.d.tt: "Sacrificarás [sacrificed_entourage.GetName] en un intento de distraer a los asaltantes." #NT!
 cob_7899_scenerio.0522.d.sacrifice: "MARCADOR DE LUGAR" #NT!
  
 cob_7899_scenerio.0523.t: "Encuentro con un soldado valyrio" #NT!
 cob_7899_scenerio.0523.desc: "Viajamos a través de las tierras en ruinas de [location.GetName], el aire espeso con humo volcánico y cenizas que oscurecieron la vista y al mismo tiempo dejaron sin aliento a todos en mi anfitrión. Decido que deberíamos tomarnos un momento para orientarnos y pedir que me traigan a [vassarion.GetName] para que pueda volar por encima de las nubes. Mientras espero, uno de mis exploradores llama y me giro para ver un grupo de figuras que parecen ser soldados valyrios emergiendo de la niebla armados con ballestas y espadas. Uno del grupo vestido con las vestimentas de un oficial de bajo rango sale de la niebla para pararse frente a mí.\n\n"Soy [freeholder_survivor.GetName] y tengo a tu anfitrión rodeado. [location.GetName] ha sido reclamado por nosotros y te rendirás ante mí".\n\nAhora debo decidir qué debo hacer. ¿Intento enfrentarme a [freeholder_survivor.GetName] en combate singular? ¿Debería intentar convencerlos de que se unan a mi anfitrión o deberíamos retirarnos?" #NT!
 cob_7899_scenerio.0523.a: "Me enfrentaré a [freeholder_survivor.GetName] yo mismo" #NT!
 cob_7899_scenerio.0523.a_tt: "Un duelo comienza con [freeholder_survivor.GetName]" #NT!
 cob_7899_scenerio.0523.b: "¡Deberías unirte a nosotros!" #NT!
 cob_7899_scenerio.0523.b_tt: "Un duelo comienza con [freeholder_survivor.GetName]" #NT!
 cob_7899_scenerio.0523.b.joined: "[freeholder_survivor.GetName] se une a nuestro anfitrión" #NT!
 cob_7899_scenerio.0523.c: "¡Debo retirarme!" #NT!
 cob_7899_scenerio.0523.c_tt: "tu escapas" #NT!
  
 cob_7899_scenerio.0524.t: "Encuentro con un centurión valyrio" #NT!
 cob_7899_scenerio.0524.desc: "Viajamos a través de las tierras en ruinas de [location.GetName], el aire espeso con humo volcánico y cenizas que oscurecieron la vista y al mismo tiempo dejaron sin aliento a todos en mi anfitrión. Decido que deberíamos tomarnos un momento para orientarnos y pedir que me traigan a [vassarion.GetName] para que pueda volar por encima de las nubes. Mientras espero, uno de mis exploradores llama y me giro para ver un grupo de figuras que parecen ser soldados valyrios emergiendo de la niebla armados con ballestas y espadas. Uno del grupo vestido con las vestimentas de un oficial de bajo rango sale de la niebla para pararse frente a mí.\n\n"Soy [freeholder_survivor.GetName] y tengo a tu anfitrión rodeado. [location.GetName] ha sido reclamado por nosotros y te rendirás ante mí".\n\nAhora debo decidir qué debo hacer. ¿Intento enfrentarme a [freeholder_survivor.GetName] en combate singular? ¿Debería intentar convencerlos de que se unan a mi anfitrión o deberíamos retirarnos?" #NT!

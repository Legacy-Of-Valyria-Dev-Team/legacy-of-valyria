 #  cob_7899_scenerio.0400.desc: "Cuando llego a [GetTitleByKey('c_lannisport').GetName], [lannisport.GetName] me saluda inmediatamente y rápidamente me informa que mi barco ha sido preparado y está listo para zarpar. Siento una gran ola de energía fluir a través de mí al pensar en comenzar mi viaje, estaba inquieto en el palacio esperando este momento sabiendo que cada hora que pasaba era otra hora en la que alguien más podía llegar y reclamar los restos del [valyrian_freehold_short|E] antes que yo.\n\nAhora era el momento de adentrarnos en el mar y comenzar el largo viaje a [essos|E] para que podamos descubrir lo que queda de [valyria|E] después del [doom|E]. La flota partiría hacia [valyria|E] tan pronto como estuviera a bordo de su buque insignia, haciendo su primera parada en [GetTitleByKey('c_oldtown').GetName] para comprar suministros para continuar el viaje, esta misión resultaría costosa, pero, al final, las riquezas del [valyrian_freehold_short|E] compensarían con creces el costo." #NT!

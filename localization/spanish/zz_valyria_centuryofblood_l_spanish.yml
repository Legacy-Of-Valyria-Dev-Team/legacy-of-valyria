 game_concept_story_content_aurion_varezys_99: "$game_concept_story_generic_prefix$ $bookmark_99_aurion_varezys$" #NT!
 game_concept_story_content_aurion_varezys_99_desc: "#tooltip_heading Estilo de historia: Extenso#!\n\nAs Aurion Varezys tendrás la opción de recolonizar [valyria|E] y restaurar el antiguo orden, o reclamar Volantis y los otros estados satilitas de [old_valyria|E] para formar un nuevo [the_freehold|E]." #NT!
  

 # lv_scenerio_cob: "El siglo de la sangre" #NT!
 cob_7899_scenerio.0001.t: "El rey de las tormentas y los ríos" #NT!
 cob_7899_scenerio.0001.desc: "Es una época de riqueza y prosperidad para el Reino de las Tormentas y los Ríos. Desde que mi antepasado [arlan.GetName] unió los dos imperios como uno solo y destruyó al rey pretendiente [lucifer.GetFirstName], la línea de [benedict.GetName] se ha extinguido. La Casa Durrandon sigue siendo los únicos reyes del Tridente y Stormlands.\n\nNo todo es lo que parece. La contención dentro del reino crece... Desde Occidente hay rumores de que los Hijos del Hierro bajo [qhorwyn.GetName] están agitando con posibles ambiciones de conquistar las riquezas del Tridente. También hay rumores de que un miembro superviviente de la Casa Justman está difundiendo la voz de que es el gobernante legítimo del Tridente... Otro Justman que desea ser liberado de esta espiral mortal para garantizar que el ciervo continúe gobernando los Ríos y las Tormentas." #NT!
 cob_7899_scenerio.0001.a: "La nuestra es la furia" #NT!
  
 cob_7899_scenerio.0002.t: "El exiliado y el soñador" #NT!
 cob_7899_scenerio.0002.desc: "[doom|E] ha caído sobre [valyria|E] exactamente como [dreamer.GetFirstName] previó. Si no hubiera actuado cuando lo hice, vendiendo toda la riqueza de nuestra familia y mudándome a este lúgubre puesto volcánico, nuestra familia seguramente habría sido destruida. El [valyrian_freehold_short|E] pasó de ser la fuerza más poderosa del mundo a una sombra de la nada en cuestión de horas. La Casa Targaryen bien podría ser la familia más poderosa que queda.\n\nDebo reflexionar sobre lo que nos depara el futuro a mí y a mi familia. ¿Construimos nuestras tierras y mantenemos la voluntad de [valyrian_freehold_short|E] en este singular puesto de avanzada, o ampliamos la influencia de [valyrian_freehold_short|E] una vez más sobre [free_cities|E] y, tal vez, sobre el propio [westeros|E]?" #NT!
 cob_7899_scenerio.0002.a: "Fuego y sangre" #NT!
  
 cob_7899_scenerio.0003.t: "El Rey de la Sal y el Mar" #NT!
 cob_7899_scenerio.0003.desc: "Mi hora se acerca... Puedo sentir a [ROOT.Char.GetFaith.HighGodName] llamándome desde sus pasillos acuosos mientras esta enfermedad incesante se apodera de mi viejo y frágil cuerpo. Desde el fallecimiento de mi primer hijo, [harmund.GetName], mi segundo hijo [harlan.GetName] se ha recuperado, manejando el funcionamiento del reino mientras yo fui superado lentamente por la enfermedad.\n\n[harwyn.GetName], mi tercer hijo, que partió para encontrar la gloria en [free_cities|E], ha regresado con intenciones desconocidas. Solo puedo suponer que escuchó que he estado enfermo y a las puertas de la muerte durante lo que ahora parecen siglos y quiere reclamar cualquier herencia que crea que le corresponde.\n\nSolo el tiempo dirá ahora cuándo [ROOT.Char.GetFaith.HighGodName] me llama a sus salones acuáticos, por ahora solo puedo imaginar lo que le sucederá al reino por el que he trabajado tan diligentemente para construir." #NT!
 cob_7899_scenerio.0003.a: "Lo que está muerto puede que nunca muera" #NT!
  
 cob_7899_scenerio.0004.t: "El rey de la roca" #NT!
 cob_7899_scenerio.0004.desc: "Ha llegado a Roca Casterly la noticia de que [valyria|E] ha sido destruido en un cataclismo de destrucción incalculable. Casi la totalidad del Imperio [dragonlord|E] ha perecido con su [dragons_plural|E], dejando las antiguas tierras listas para el saqueo en caso de que un aspirante a gobernante decidiera aprovechar la situación. Quizás no toda la riqueza y la magia hayan sido destruidas... La Casa Lannister podría consolidar permanentemente su lugar como la casa más rica y poderosa a la que honrar [westeros|E] para siempre..." #NT!
 cob_7899_scenerio.0004.a: "No es más que un sueño tonto, debería centrar mi atención aquí." #NT!
 cob_7899_scenerio.0004.a_tt: "Eliges no arriesgarte a morir y permanecer en Casterly Rock." #NT!
 cob_7899_scenerio.0004.b: "Hay una oportunidad esperándome en [valyria|E] que no puedo ignorar" #NT!
 cob_7899_scenerio.0004.b_tt: "Eliges arriesgarlo todo para viajar a los restos de [valyria|E]" #NT!
  
 cob_7899_scenerio.0005.t: "El Heredero del [valyrian_freehold_short|E]" #NT!
 cob_7899_scenerio.0005.desc: "El [valyrian_freehold_short|E] ha caído... No he recibido ninguna respuesta a mi correspondencia en años... Sólo puedo asumir que los rumores de lo que la gente llama un '[doom|E]' son ciertos.\n\nHe reunido una fuerza de soldados de los Qohorik con el propósito de volar con [vassarion.GetName] hasta lo que queda de [valyria|E]... Espero restaurar el orden en este mundo una vez más... Sin embargo, si los rumores son precisos y el [valyrian_freehold_short|E] no es nada más que ceniza, tal vez sería mejor para este ejército subyugar a los [free_cities|E] bajo mi gobierno... todo lo que sé es que debo hacer que este ejército se mueva hacia el sur desde [location.GetName] para descubrir por mí mismo qué ha sido de mi tierra natal..." #NT!
 cob_7899_scenerio.0005.a: "Regresaré al [valyrian_freehold_short|E] y reclamaré lo que queda." #NT!
 cob_7899_scenerio.0005.a_tt: "Viajar a Ny Sar" #NT!
 cob_7899_scenerio.0005.b: "Pensándolo bien, no vayamos a Valyria, es un lugar tonto..." #NT!
 cob_7899_scenerio.0005.b_tt: "Emprende tu propio camino" #NT!
  
 cob_7899_scenerio.0006.t: "El heredero del rey del río" #NT!
 cob_7899_scenerio.0006.desc: "Mi gran antepasado [lucifer.GetFirstName], el legítimo Rey del Río del Tridente, se declaró el último descendiente vivo de [benedict.GetName]. Fue asesinado por [arlan.GetName], para que los Reyes Tormenta pudieran mantener su dominio ilegítimo sobre el Reino del Tridente.\n\nDurante siglos, el linaje de la Casa Justman ha permanecido en las sombras, evitando la furia de los Reyes Tormenta, que podrían conducir a nuestra extinción. Ya no puedo continuar con esta tradición... Debo partir y reunir aliados para poder reclamar las tierras de mis antepasados\n\nAhora debo decidir adónde viajaré... ¿Las tierras fértiles de The Reach? ¿La riqueza de las Tierras del Oeste? ¿O las montañas del Valle?" #NT!
 cob_7899_scenerio.0006.a: "Busque ayuda de The Reach" #NT!
 cob_7899_scenerio.0006.a_tt: "Viajar a Altojardín" #NT!
 cob_7899_scenerio.0006.b: "Busca ayuda de The Rock" #NT!
 cob_7899_scenerio.0006.b_tt: "Viajar a Roca Casterly" #NT!
 cob_7899_scenerio.0006.c: "Busque ayuda de The Vale" #NT!
 cob_7899_scenerio.0006.c_tt: "Viajar al Nido de Águilas" #NT!
 cob_7899_scenerio.0006.d: "Partir por mi cuenta" #NT!
  

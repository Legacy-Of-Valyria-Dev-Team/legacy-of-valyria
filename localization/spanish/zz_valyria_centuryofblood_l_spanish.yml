  #Swords/armor 
  
 vs_stormbringer_name: "vaedroma" #NT!
 vs_stormbringer_description: "La espada de acero valyrio de la Casa Varezys, es una reliquia de fuego y sombra, una espada forjada en los crisoles de las Catorce Llamas. La espada ha visto las extensiones más lejanas del Imperio Valyrio." #NT!
 vs_skullbasher_name: "Rīnakharys" #NT!
 vs_skullbasher_description: "La maza de acero valyrio de la casa Belaerys" #NT!
 vs_inferno_name: "vaedarion" #NT!
 vs_inferno_description: "El martillo de acero valyrio de la casa Urnebar" #NT!
 vs_eclipse_name: "embaeli" #NT!
 vs_eclipse_description: "La espada de acero valyrio de la casa Mataeryon, forjada en los siglos del crepúsculo del Feudo Valyrio, pero con partes mucho más antiguas aún, la espada conocida en común como Eclipse es a la vez un artefacto y un enigma: una unión del poder valyrio y el misterio prevalyrio. Está tallada en una única piedra oscura, veteada de motas de color púrpura que parpadean débilmente bajo la luz de la luna y es tan fría como una tumba. Según Mataeryons, no fue moldeado por el hombre, sino descubierto (desenterrado) de las ruinas ennegrecidas de N'ghai. Supuestamente, al agarrar la empuñadura, el portador puede escuchar los oscuros susurros de lo desconocido." #NT!
 vs_ashbringer_name: "Vūjōsān" #NT!
 vs_ashbringer_description: "La espada de acero valyrio de la casa Sonaryen" #NT!
  
 aurion_valyrian_steel_armor_name: "Hromagon" #NT!
 aurion_valyrian_steel_armor_description: "Una armadura de acero valyrio decorada, reclamada por Aurion Varezys en su legendario regreso a los huesos humeantes de [valyria|E]. Ningún artesano vivo puede nombrar a su creador, ni los eruditos pueden ponerse de acuerdo sobre si fue forjado en los últimos días de Freehold o por alguna mano más antigua, perdida hace mucho tiempo en las cenizas y los mitos. Su valor no se puede medir en monedas ni en coronas. Los reinos no pudieron igualar su valor. Seguramente es la mejor armadura del [known_world|E]" #NT!
  

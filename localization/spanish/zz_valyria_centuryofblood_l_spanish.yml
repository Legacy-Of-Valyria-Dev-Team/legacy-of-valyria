  #COB Decisions 
 cob_send_for_the_dragonlords_decision: "Enviar por los Señores Dragón" #NT!
 cob_send_for_the_dragonlords_decision_desc: "Ha llegado el momento de llamar al mundo y de que los Señores Dragón sin tierra regresen a casa para reclamar su derecho de nacimiento.\n\nDurante demasiado tiempo estas tierras han permanecido desocupadas, una vez más deseo ver los cielos llenos de las alas batientes de los Dragones llevando a sus amos Señores Dragón por el aire." #NT!
 cob_send_for_the_dragonlords_decision_tooltip: "Envía cuervos por todo el mundo y pide a los Señores Dragón que regresen." #NT!
 cob_send_for_the_dragonlords_decision_confirm: "enviar los cuervos" #NT!

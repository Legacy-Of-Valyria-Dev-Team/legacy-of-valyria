 agot_EE_valyrian_restoration.1.t:0 "La Naissance de la Nouvelle Valyria"
 agot_EE_valyrian_restoration.1.desc:0 "Comme un phénix renaissant de ses cendres, la Nouvelle Valyria s’élève ! Notre bannière flotte dans chaque recoin de notre nouvel empire, portée par des vents aussi féroces que notre propre peuple.\n\nLes anciennes Possessions furent jadis le phare de la civilisation, un feu ardent contre les nuits les plus noires — éteint en un instant. Bien que nous ne puissions jamais retrouver la grandeur d’antan, nous devons à nos ancêtres de nous efforcer d’atteindre une telle magnificence.\n\nEn avant, avec le feu d’une nouvelle aube ! Cette fois, Valyria subsistera."
 agot_EE_valyrian_restoration.1.a:0 "En avant !"
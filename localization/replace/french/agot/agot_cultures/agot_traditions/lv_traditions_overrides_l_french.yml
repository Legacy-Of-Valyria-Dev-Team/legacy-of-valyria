l_french:
  # Remarque : Garder ceci dans le dossier replace/(language)/agot pour s'assurer que nous remplaçons les localisations déjà présentes dans AGOT
  agot_tradition_volantene_name:0 "Première Fille du Détroit"
  agot_tradition_volantene_desc:0 "Établis en tant que première colonie du Fléau Valyrien, les habitants de Volantis chérissent plus que tout leur ascendance valyrienne. Bien qu’ils ne descendent pas directement des seigneurs-dragons d’autrefois, l’aristocratie Volantine se proclame fièrement comme leur héritière légitime, incarnant le raffinement, l’orgueil et l’arrogance de leurs glorieux ancêtres. Les dirigeants de Volantis se présentent comme des figures nobles et cultivées, mais sous ce vernis se cache un système d’esclavage profondément enraciné. Un ordre impitoyable où les vies sont gérées avec une efficacité cruelle, alimentant la richesse et le prestige de la cité. Pour l’élite Volantine, la gloire et l’ordre priment — même au prix de la souffrance humaine"

  agot_tradition_braavosi_name:0 "Nul Homme Esclave"
  agot_tradition_braavosi_desc:0 "Fondés par des esclaves échappés au joug du Fléau Valyrien, les Braavosi se dressent comme un bastion de liberté et de diversité culturelle. Depuis ses origines, Braavos accueille toutes les croyances, toutes les races et toutes les origines. Cette ouverture d’esprit s’exprime notamment par leur opposition farouche à l’esclavage, en contraste marqué avec les autres cités libres. Leur style de combat, fluide et gracieux, alliant précision et agilité, incarne l’adaptabilité et la résilience de leur culture. Être Braavosi, c’est être libre et se battre pour le rester"

  agot_tradition_meereenese_name:0 "Les Maîtres d’Antan"
  agot_tradition_meereenese_desc:0 "La culture meereenaise est empreinte de traditions, d’une hiérarchie rigide et d’une fierté inébranlable pour l’héritage ancestral. Les Grands Maîtres, aristocrates de Meereen, affirment leur pouvoir à travers des cérémonies fastueuses et des pyramides opulentes. Au cœur de cette société règne l’esclavage, perçu non seulement comme une nécessité économique mais aussi comme un symbole d’ordre et de privilège, profondément intégré dans les fêtes publiques, les coutumes et la vie quotidienne"

  agot_tradition_yunkish_name:0 "Les Maîtres Sages"
  agot_tradition_yunkish_desc:0 "Les Yunkai’i vénèrent la richesse et l’indulgence, voyant dans le luxe l’ultime accomplissement. Leur classe dirigeante, rusée et habile dans les jeux de pouvoir, évolue dans un monde fait de démesure et d’opulence. Mais une culture bâtie sur la vente d’êtres humains ne peut qu’engendrer corruption et décadence"

  agot_tradition_astapori_name:0 "Discipline et Déshumanisation"
  agot_tradition_astapori_desc:0 "Les Astapori sont intrinsèquement liés aux Immaculés, ces eunuques guerriers d’élite formés dans la douleur pour obéir sans faille. Les Bons Maîtres, qui dirigent Astapor, s’enorgueillissent de produire les soldats les plus redoutables, considérant leurs méthodes d’entraînement brutales comme un honneur et un symbole de prestige"

  agot_tradition_ghiscari_name:0 "Le Mépris de Valyria"
  agot_tradition_ghiscari_desc:0 "Le peuple Ghiscari est ancré dans d’antiques traditions et un héritage glorieux qui remonte à l’apogée de l’Empire Ghiscari. Célèbres pour leur architecture majestueuse et leur sens artistique raffiné, les Ghiscari affichent leur grandeur dans des structures monumentales et des sculptures éclatantes. Mais les plaies de la Conquête Valyrienne n’ont jamais cicatrisé, alimentant une haine tenace envers les coutumes valyriennes et l’ombre persistante de leurs anciens ennemis"
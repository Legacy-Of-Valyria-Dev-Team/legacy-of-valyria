l_french:
  # Night's Watch
  game_concept_nw_govt:0 "Garde de Nuit"
  game_concept_nw_govt_desc:0 "La #bold Garde de Nuit#! est un ordre militaire ancestral voué à la protection du [watch_wall|E], cette muraille colossale qui se dresse aux confins septentrionaux des [seven_kingdoms|E], dernière barrière entre les royaumes des hommes et les horreurs tapies [beyond_the_wall|E]. Les origines de cet ordre se perdent dans les brumes de l'[age_of_heroes|E], à l'époque où les [others|E] furent repoussés dans les ténèbres glacées du Grand Nord. Les hommes de la #bold Garde de Nuit#! ne portent que du noir, d'où leur surnom de #bold frères noirs#!. Les recrues qui rallient les rangs de la #bold Garde#! sont dites #bold prendre le noir#!, abandonnant à jamais leur ancienne vie.\n\nSous le système de gouvernement $game_concept_nw_govt$, le [liege|E] suprême distribue les [land|E] à ses [vassals|E] pour qu'ils les gouvernent et les protègent. Seuls les frères jurés de la Garde de Nuit peuvent détenir des titres sous ce régime, et à leur mort, leurs terres retournent automatiquement à leur suzerain."
  game_concept_nw_govt_i:0 "@nights_watch_government!"

  # Dragons
  DRAGON_RELATION_IS_WANDERING:0 "[Character.Custom('LV_FirewyrmLocation')]"

  # Note: Keep this in the replace/(language)/agot folder to ensure we override the locs AGOT already has
  # Ruin Overrides
  e_ruins:0 "Ruines"
  k_ruins:0 "Ruines"
  d_ruins:0 "Ruines"

  ruin_history_generic:0 "Le monde est parsemé de ruines, de Westeros à Essos, de Sothoryos à Ulthos ; elles s'étendent sur chaque terre et sous chaque climat sans distinction. Certaines furent jadis de grandes forteresses et châteaux, résistant aux ennemis durant des milliers d'années, pour finalement succomber à un adversaire invincible, d'autres étaient des tours de guet et petits fortins brisés par des raids mineurs perdus dans les limbes du temps. Certaines sont anciennes au-delà de toute mesure, réduites à l'état de ruines avant les plus anciens documents de la Citadelle ou de Yi Ti, comme Yeen à Sothoryos, ou Stygaï dans l'Ombre. D'autres chutes sont plus récentes et documentées par les érudits des terres du Couchant comme du Levant. Nombre d'entre elles ont inspiré légendes, récits ou chansons évoquant leur existence ou leur dernier bastion, tandis que davantage gisent oubliées et délaissées par tous les bardes.\n\nPour revendiquer un comté détruit et entamer sa reconstruction, accédez à la vue du domaine et choisissez « Restaurer les Ruines ». Lorsque vous possédez une baronnie en ruines, vous pouvez améliorer le bâtiment principal des ruines pour lancer la restauration.\n\nSeuls des hommes rendus fous par l'ambition, la soif d'aventure ou leur héritage perdu oseraient revendiquer les ruines les plus périlleuses, comme celles nées du Fléau de Valyria. Les voyageurs expérimentés ou rejetons des anciens seigneurs dragons suffisamment égarés pour tenter l'aventure peuvent lancer une activité pour se lancer dans une expédition vers Valyria"


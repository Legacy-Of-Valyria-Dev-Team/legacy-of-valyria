l_spanish:
   # Night's Watch 
 game_concept_nw_govt: "Guardia de la noche" #NT!
 game_concept_nw_govt_desc: "La #bold Night's Watch#! es una orden militar dedicada a defender la [watch_wall|E], la inmensa fortificación en la frontera norte de la [seven_kingdoms|E], defendiendo los reinos de los hombres de lo que yace [beyond_the_wall|E]. La fundación de la orden se remonta al [age_of_heroes|E], en el momento en que los [others|E] fueron rechazados. Los hombres de #bold Night's Watch#! visten solo de negro y son conocidos como #bold hermanos negros#!. Se dice que los reclutas que se unen a la #bold Watch#! #bold toman el negro#!.\n\nBajo el #!5 #!6, el #!7 superior distribuye #!8 a #!9 para gobernar y proteger. Sólo los hermanos jurados de la Guardia de la Noche pueden ostentar títulos bajo este gobierno, y cuando mueren, sus títulos vuelven a su señor." #NT!
 game_concept_nw_govt_i: "@nights_watch_government!" #NT!
  
   # Dragons 
 DRAGON_RELATION_IS_WANDERING: "[Character.Custom('LV_FirewyrmLocation')]" #NT!
 DRAGON_RELATION_IS_WANDERING.FIREWYRM: "Merodeando [Character.GetCurrentLocation.GetName|V]" #NT!
 DRAGON_RELATION_IS_WANDERING.VANILLA: "Volando por ahí [Character.GetCurrentLocation.GetName|V]" #NT!

 fp2_yearly.4008.desc.first_men.a: ""... Los otros son los antiguos enemigos de las tierras del invierno. Fueron los que casi trajeron el final a todos los reinos de los hombres, y a quienes se construyó el muro para mantenerse fuera"." #NT!
 fp2_yearly.4008.desc.first_men.b: ""... El Snark es un monstruo de más allá de la pared. Se presenta en niños que quedan solos y se dice que los consumen vivos en el transcurso de diez años. Se siente atraído por los gritos de los niños que deambulan solo por el bosque"." #NT!
 fp2_yearly.4008.desc.first_men.c: ""... El Grumkin es un monstruo de más allá del muro, que se dice que otorga tres deseos, pero si el tercero no se usa cuidadosamente y cuidadosamente robará a los niños de los deseos en el futuro para ser reemplazados por murmullos malvados"." #NT!
 fp2_yearly.4008.desc.first_men.d: ""... lo que llegó en la noche es el monstruo que visita la Nightfort una vez un siglo que conduce a quienes lo ven enloquecido y hasta la muerte, y luego sus almas están condenadas a ser sus aprendices encadenados"." #NT!
 fp2_yearly.4008.desc.andal.a: ""... Las doncellas de cisne eran mujeres hermosas que atraían a sus víctimas a las colinas de terciopelo y las cosecharían para procreación y sustento"." #NT!
 fp2_yearly.4008.desc.andal.b: ""... los sabuesos cuando la gente hace fogatas para purificar a los muertos. Con pelaje tan negro como la noche y las bocas de espuma, aparecen de las cenizas con una explosión. Cada uno es el alma de un pecador con su propio cuento que contar"." #NT!
 fp2_yearly.4008.desc.ironborn.a: ""... Los dragones del mar son los más grandes terrores de las profundidades, y el más grande de su especie fue Nagga, quien fue asesinado por el rey gris sobre Orkmont, donde sus huesos se encuentran hasta el día de hoy"." #NT!
 fp2_yearly.4008.desc.ironborn.b: ""... Los selkies son criaturas marinas que a veces ayudan a los marineros, o se ahogan. Tis dijo que habitan en las profundidades y pueden o no ser gobernadas por el rey y su reina. Se dice que las de las hermanas son descendidas de ellas"." #NT!
 fp2_yearly.4008.desc.hyrkoon.a: ""... Los shrykes son medio humanos con piel a escala verde y la mordida de una serpiente, se dice que deambulan por los desechos más allá de los cinco fuertes y consumen todo lo que ven"." #NT!
 fp2_yearly.4008.desc.valyrian.a: ""... Los duendes de rock eran pueblos de las colinas que una vez guerra con los gigantes en Essos, a quienes derrotaron, aunque pronto cayeron a las misteriosas artimañas de las doncellas"." #NT!
 fp2_yearly.4008.desc.rhoynish.a: ""... La Esfinge es una criatura astuta, un hombre en parte, parte león y en parte halcón o dragón, es una criatura que se dice que se encuentra en una ciudad o carretera y matará a todos los que no respondan a su acertijo, aunque incluso aquellos que sí están condenados a un destino de Valyrian"." #NT!
 fp2_yearly.4008.desc.crackclaw.a: ""... Los Squishers son las criaturas marítimas que en el pasado amenazaron a la gente de Crackclaw Point, con los primeros hombres conduciendo de la tierra, y Ser Clarence Crabb derrotando a su rey"." #NT!
 fp2_yearly.4008.desc.westeros_generic: ""... Los profundos son los escamosos pueblos del mar con cabeza de pez que pueden haber sido los progenitores de los ironmen, y son adorados en los derechos de Fel en las mil islas"." #NT!
